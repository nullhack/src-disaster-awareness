title: Lightning-sparked wildfire near Malad quickly contained as extreme fire danger persists - East Idaho News
body: MALAD – A lightning-caused fire in Caribou-Targhee National Forest is fully contained. The 2-Mile Fire started Sunday around noon about one mile east of Malad near 2-Mile Canyon, according to a news release from Caribou-Targhee National Forest. A lightning strike to a juniper tree spread to other trees, as well as grass and bush. The […]
