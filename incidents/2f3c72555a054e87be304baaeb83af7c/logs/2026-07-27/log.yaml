log_date: '2026-07-27'
summary: Massive wildfires in southwest France and Spain have forced hundreds of thousands of evacuations, with the blaze near Bordeaux growing so intense it generated lightning that ignited new fires. French President Macron pledged support on a visit to the fire zone, while officials reported that the fire has stabilized but is not yet contained. Two firefighters died battling the flames in a Bordeaux suburb.
