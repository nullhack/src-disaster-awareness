log_date: '2026-07-31'
summary: |-
  France has made significant progress taming its massive wildfire, allowing around 84,000 evacuees to return home. A new analysis attributes the extreme intensity of the blazes in Spain and France to record‑breaking fire weather conditions driven by climate change. Wildfire emissions from the region have also exposed millions of people to health‑damaging air pollution.
  Ukraine dispatched 70 rescuers and 15 vehicles to assist France, while volunteers joined firefighters battling remaining hot spots. A new study attributed the extreme fire weather to climate change, making such conditions 20 times more likely, and discussions emerged about revising France's forest management in the Les Landes region.
