title: As heat and dry conditions fan wildfires in France, volunteers fan out to help
body: Jean-François Pauner is among many volunteers helping firefighters battle wildfires in southwestern France. The fires have devastated 42,000 hectares west of Bordeaux, forcing nearly a quarter-million people from their homes. This summer, Europe faces extreme heat, fueling wildfires from the Atlantic to the Mediterranean. By Friday, French authorities allowed many evacuees to return home, but hot spots remain. Police are investigating the fires' origins, with some suspects arrested. Meanwhile, fires continue across Europe, including near a nuclear power station in England and on the Greek mainland, where evacuations are underway.
