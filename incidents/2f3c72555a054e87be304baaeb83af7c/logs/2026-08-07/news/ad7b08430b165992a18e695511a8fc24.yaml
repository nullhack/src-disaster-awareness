title: Flathead Forest and Great Basin Team 7 to Host Skillet Fire Community Meeting - Flathead Beacon
body: As northwest Montana’s Skillet Fire continues to burn, the national Great Basin Team 7 and local agency representatives are hosting an informational meeting Tuesday. The firefighters and agency staff will provide community members, including those under evacuation order, with an overview of the fire along with the most up-to-date information. Without another infrared mapping flight […]
