title: Southern Europe burns as 3 firefighters die and France battles blaze 4 times the size of Paris
body: Fire crews in southwest France are battling a massive blaze four times the size of Paris, while two firefighters were killed fighting a wind-driven blaze on the Greek island of Crete.
