title: 2 Killed When Firefighting Helicopters Collide Near Athens as Europe's Wildfire Emergency Rages
body: LACANAU, France (AP) — France's vast wildfire near Bordeaux, which scorched an area four times the size of Paris and forced 224,000 people to evacuate, remained contained Sunday but was still burning. Hundreds of kilometers (miles) away, a newer blaze in Provence had stopped advancing overnight but was not yet contained.
