title: Mt. Hood Meadows under Level 3 'Go Now' evacuation due to nearby Grasshopper Fire
body: Mt. Hood Meadows issued a Level 3 "Go Now" evacuation order early Tuesday morning due to the Grasshopper Fire, which has burned 31,500 acres in Wasco and Hood River counties.
