title: Gov. Bob Ferguson declares statewide state of emergency due to elevated fire conditions in Washington
body: Gov. Bob Ferguson declared a statewide state of emergency Saturday due to drought conditions, high temperatures and winds fueling record-setting wildfires around the state.
