title: New evacuations ordered for Big Rock Fire - East Idaho News
body: LATEST UPDATE At approximately 4:30 p.m. Saturday, all homes and campgrounds north of Heise, extending north to Lyons Creek Road/10000 South and east to 7000 East, just west of Luthy Meadows, are now under an evacuation order. Residents north of the Snake River between Heise Hot Springs and east to the Y at Kelly Canyon […]
