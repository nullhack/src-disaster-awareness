title: Indonesian villagers on Borneo struggle for water as El Niño intensifies peatland fires
body: After three months with no rain, Sriwati, a shopkeeper and mother of three children living in Penyeladi village on the tropical island of Borneo, can no longer depend on the river for her needs.
