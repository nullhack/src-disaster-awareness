title: Crews battle Brunswick County forest fire; evacuations lifted
body: Fire crews are battling a forest fire in the Shallotte area of Brunswick County. While the fire initially prompted evacuation of nearby homes, residents had been allowed to return as of 9 p.m. Oct. 1.
