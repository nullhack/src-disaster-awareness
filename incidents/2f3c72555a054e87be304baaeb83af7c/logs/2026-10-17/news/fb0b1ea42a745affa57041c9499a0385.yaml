title: As fires spread, Indonesia’s rubber growers draw on traditional ways to fight back
body: PENUKAL ABAB LEMATANG ILIR, Indonesia — Sumanti raced her motorcycle past the rubber trees as flames spread through the dry brush. No one had picked up the phone as the wildfire continued to grow out of control on Sept. 5. “The fire is already approaching our land,” Sumanti, 30, cried out as she drove past […]
