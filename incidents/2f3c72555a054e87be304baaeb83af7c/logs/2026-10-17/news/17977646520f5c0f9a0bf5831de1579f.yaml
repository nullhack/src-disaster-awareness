title: Mount Rinjani Senaru Trail Reopens After Forest Fire Closure - RRI.co.id
body: The Mount Rinjani National Park (TNGR) Center in West Nusa Tenggara has announced the reopening of the Senaru hiking trail following a temporary closure due to a forest fire in the area.
