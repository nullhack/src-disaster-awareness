title: Firefighters Continue Battling Santa Clarita Fire - MyNewsLA.com
body: Firefighters will continue efforts Monday in hot, dry conditions to contain a 1,048- acre brush fire in the Angeles National Forest northeast of Santa Clarita that was already 48% surrounded by lines of cleared vegetation. The Bouquet Fire prompted evacuation orders and road closures by midday Sunday, according to the U.S. Forest Service. “Firefighters are […]
