title: Regional haze persists as Japan ends fire aid - Asia & Pacific - The Jakarta Post
body: Indonesia’s forest and peatland fires, which have caused air quality to deteriorate in neighboring Malaysia and Singapore, continue to intensify despite stepped-up firefighting efforts, including recent aerial assistance from Japan.
