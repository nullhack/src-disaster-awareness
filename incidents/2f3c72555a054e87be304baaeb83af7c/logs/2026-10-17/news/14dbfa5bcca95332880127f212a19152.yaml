title: Smoke from Kalimantan fires detected above Jakarta as Indonesia battles blazes
body: 'JAKARTA: Smoke from forest and land fires in Kalimantan has been detected in the atmosphere above Jakarta, though it has not yet reached ground level, the Meteorology, Climatology and Geophysics Agency (BMKG) said on Friday, as firefighting efforts struggle to contain blazes across the country.'
