title: Firefighters Continue Battle Against Bouquet Fire - MyNewsLA.com
body: Firefighters dealing with hot, dry conditions Monday continued to battle a 1,048-acre brush fire in the Angeles National Forest northeast of Santa Clarita that is almost 50% contained. The Bouquet Fire was reported at 2:16 p.m. Saturday in the 34800 block of Bouquet Canyon Road and prompted evacuation orders and road closures, according to the […]
