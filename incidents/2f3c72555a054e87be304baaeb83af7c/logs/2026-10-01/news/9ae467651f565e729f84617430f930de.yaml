title: NPR's wildfire correspondent on one of the Western U.S.'s worst wildfire seasons
body: The Western U.S.'s wildfire season has been one of the worst in years. More than 8 million acres have burned, at least seven wildland firefighters have died, and hundreds of homes have been destroyed.
