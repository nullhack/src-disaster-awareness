title: Firefighters scramble to defend infrastructure and contain expanding wildfire near Mendocino National Forest
body: Worried about the impending Saturday heat, overnight fire crews reached 15% containment on the Lucas Fire which tripled in size Friday and at one point forced firefighters to retreat.
