title: Haze besieges Southeast Asia as Indonesia’s wildfires rage on - Asia & Pacific - The Jakarta Post
body: On Wednesday morning, seven air monitoring stations across the metropolitan area of Philippine capital Manila recorded “unhealthy levels” of PM2.5 pollutant particulate, according to the country’s Environment and Natural Resources Department (DENR).
