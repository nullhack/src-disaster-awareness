title: Indonesia haze sends Metro air to danger - BusinessWorld Online
body: SMOKE AND HAZE from forest fires in Kalimantan, Indonesia pushed air quality in parts of Metro Manila to very unhealthy and acutely unhealthy levels on Tuesday, prompting government agencies to advise residents to limit outdoor activities and wear masks. The Department of Environment and Natural Resources-Environmental Management Bureau said transboundary haze was affecting the National […]
