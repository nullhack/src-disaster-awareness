title: Plaskett Fire Now at 15,500 Acres; Evacuation Zone Hits County Border
body: The five-day-old Plaskett Fire near Big Sur is now the third-largest active wildfire in California, having grown five-fold since Friday, and it continues burning steep, remote, barely accessible terrain filled with thick vegetation.
