title: Five states deploy wildfire task force teams to Arkansas to support ongoing suppression efforts | Arkansas Democrat Gazette
body: Wildfire task force teams from Georgia, Kentucky, Mississippi, North Carolina and South Carolina are being deployed to Arkansas to support ongoing suppression efforts as prolonged drought and weather conditions elevate wildfire activity statewide.
