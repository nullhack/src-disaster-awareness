title: Wildfires spread near new capital Nusantara - Archipelago - The Jakarta Post
body: Indonesia has intensified efforts to contain haze in six provinces hit the hardest by forest and land fires in Kalimantan and Sumatra islands, which so far have reached 73,311 hectares.
