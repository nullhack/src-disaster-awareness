title: Bonner, Boundary counties placed on stage 2 fire restrictions
body: Bonner and Boundary counties have been placed on Stage 2 fire restrictions following a recent wildfire spread and dry conditions that have been sweeping the two northern counties, Idaho Department of Land officials said in a Friday morning announcement.
