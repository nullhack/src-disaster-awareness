title: '‘Worried’ and ‘confused’: Sarawakians grapple with worst haze since 2019'
body: Among Malaysian states, Sarawak has been the worst hit by transboundary haze linked to forest fires in neighbouring Indonesia. CNA speaks to locals and businesses in the Borneo state to find out how they are coping.
