title: Urgent Action Needed to Address Southeast Asia Fires and Transboundary Haze
body: The Roundtable on Sustainable Palm Oil (RSPO) Secretariat is deeply concerned and saddened by the severe fires affecting parts of Indonesia and the devastating impact they are having on local communities, public health, wildlife, and livelihoods. We share the deep concern and urgency felt across the region.
