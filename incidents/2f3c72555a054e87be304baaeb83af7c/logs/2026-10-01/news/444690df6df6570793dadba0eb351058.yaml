title: Ituna/Itatá invasion escalates as Indigenous Land faces fires and illegal clearing
body: More than 500 people have invaded Brazil’s Ituna/Itatá Indigenous Land in recent weeks, opening illegal roads, setting deliberate fires and threatening federal agents. The area is home to the Igarapé Ipiaçava Indigenous people who live in voluntary isolation with no contact with outsiders. On Aug. 26, a federal court ordered the government to deploy the […]
