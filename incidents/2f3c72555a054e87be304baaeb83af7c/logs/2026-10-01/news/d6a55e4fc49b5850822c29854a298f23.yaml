title: Wildfires ravage 60% of Bornean orangutan habitat in Kalimantan, warns conservation group
body: Wildfires in Kalimantan have scorched about 60% of Bornean orangutan habitat, with 17,865 hotspots detected inside key forest areas between June and August 2026. Conservationists warn the critically endangered species, already down nearly 80% in 50 years, now faces heightened extinction risk.
