title: Northern Minnesota wildfires now fully contained; BWCAW forests already sprouting new growth
body: The wildfires burning for more than two months in northern Minnesota are finally fully contained, according to officials with the Superior National Forest. Even in some of the most intensely fire damaged forestland, regrowth and forest regeneration is already underway.
