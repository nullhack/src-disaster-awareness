title: Timber Fire becomes California's 3rd largest fire of 2026; evacuations expanded, Highway 1 closed again
body: The Timber Fire in Big Sur has grown to the state's third largest wildfire this year, as officials closed a stretch of Highway 1 as part of firefighting efforts.
