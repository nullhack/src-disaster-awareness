title: Despite rain, Austin Fire jumps to 10,700 acres, 0% contained
body: The Austin Fire in the Mt. Hood National Forest has expanded to more than 10,700 acres, triggering level 3 evacuations in Clackamas County as nearly 600 personnel work to contain the blaze.
