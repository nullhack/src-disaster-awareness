title: Concerns over wildlife, water supply, as wildfire rages across Mount Kenya | Africanews
body: A wildfire has burned about 8,700 hectares of vegetation on Mount Kenya since the fire was first reported on Sept 1, Mount Kenya Trust, an environmental conservation group, said.
