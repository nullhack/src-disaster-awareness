title: A wildfire caused millions in damages in Napa County. A winery worker is accused of causing it
body: A man who worked as a gardener at a prestigious California winery is accused of igniting a wildfire that caused millions of dollars' worth of damage and tens of millions' worth of agricultural losses in Napa County last year.
