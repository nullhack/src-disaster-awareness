title: South Bay family donates $6 million to help restore Big Basin Redwoods State Park in Santa Cruz
body: The donation, announced Monday, was given to the Friends of Santa Cruz State Parks by the Reyneri family of Los Altos and advances years-long efforts to rebuild California’s oldest state park.
