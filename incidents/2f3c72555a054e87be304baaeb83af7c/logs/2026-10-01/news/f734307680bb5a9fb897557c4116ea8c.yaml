title: Haze drives surge in respiratory illnesses in Indonesia - Society - The Jakarta Post
body: Children accounted for around 20 percent of all wildfire-related respiratory illnesses as 12.5 million people in seven provinces were affected by the widespread forest and land fire, according to the Health Ministry.
