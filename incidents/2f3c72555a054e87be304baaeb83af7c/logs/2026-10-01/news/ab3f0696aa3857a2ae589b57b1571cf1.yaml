title: Japan defence force to end first overseas firefighting mission in Indonesia
body: 'TOKYO: Japanese Defence Minister Shinjiro Koizumi said Tuesday (Sept 29) he has ordered the country''s troops to conclude their firefighting operations in Indonesia, their first such mission overseas, Kyodo News reported.'
