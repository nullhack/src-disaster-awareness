title: 'Indonesia fires: Prabowo orders stronger response as 72,000ha burned across six provinces'
body: Indonesian President Prabowo Subianto has ordered authorities to step up firefighting efforts as they continue to battle forest and land fires across six priority provinces in Sumatra and Kalimantan.
