log_date: '2026-07-30'
summary: |-
  Firefighters in southwest France and Spain made headway against massive wildfires, with some areas contained, as thousands of Spanish evacuees began returning home. However, a new heatwave and strong winds are threatening to reignite blazes, prompting a new alert in France and continued efforts to stabilize the mega-fire near Bordeaux. Two more arrests were reported in connection with the fires, while three firefighters died in separate blazes in Greece.
  Spain has lifted its national emergency after making progress containing the wildfires near Madrid, though three new blazes have broken out in the province of León. These updates indicate continued wildfire activity in Spain even as the situation improves in some areas.
