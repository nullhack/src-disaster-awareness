title: Greece raises alert level amid fears of renewed Paros fires due to strong winds Greek City Times
body: Greek authorities have raised the alert level on Paros as strong winds threaten to reignite forest fire hotspots, with firefighting teams continuing cooling operations and residents urged to take extreme caution.
