title: Silvertip Fire in Bob Marshall Wilderness Grows to 4,136 Acres - Flathead Beacon
body: The Silvertip Fire located 15 miles southeast of Spotted Bear Ranger Station in the Bob Marshall Wilderness is actively burning 4,136 acres after lightning ignited the blaze on Friday, prompting Flathead National Forest officials work to implement multiple trail closures. Fuels are burning on both sides of Silvertip Creek, with most growth occurring to the […]
