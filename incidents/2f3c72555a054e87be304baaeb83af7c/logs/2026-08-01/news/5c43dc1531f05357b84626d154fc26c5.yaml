title: Skillet Fire Prompts Evacuation Warning in Areas Near Olney - Flathead Beacon
body: This story was updated Friday afternoon with the latest information. Officials have issued evacuation warnings for several roads in the Olney area as the Skillet Fire straddling the Kootenai and Flathead national forests grows to 945 acres, according to the Flathead County Office of Emergency Services (OES). Evacuation warnings have been issued for Good Creek […]
