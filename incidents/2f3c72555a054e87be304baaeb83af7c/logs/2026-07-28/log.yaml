log_date: '2026-07-28'
summary: France ordered nearly 4,000 more evacuations from the Atlantic coast as a fresh heatwave threatens firefighters' progress on the massive blaze near Bordeaux, which has burned an area four times the size of Paris and displaced roughly 330,000 people across France and Spain. President Macron warned the country faces its "most difficult situation since WW2" and urged fire crews to stay strong, while officials noted that fire clouds (pyrocumulonimbus) were observed in France for the first time and warned the fires may burn for months.
