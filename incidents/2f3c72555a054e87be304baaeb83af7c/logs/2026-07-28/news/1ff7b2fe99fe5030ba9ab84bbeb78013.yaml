title: ‘We’re losing our ability to manage forest fires’ as West becomes hotter and drier, researcher says
body: Today's fast-moving megafires can jump highways and race past fire breaks hundreds of yards wide, a researcher points out, warning that calls to thin America's forests and other prevention tactics may not work as well in the future.
