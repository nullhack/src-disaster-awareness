title: Kalimantan fires rage as response lags
body: 'JAKARTA: Motorists drive with headlights ong Aug. 20 along a haze-shrouded road in Palangkaraya, Central Kalimantan, as smoke originating from widespread forest and land fires has significantly reduced visibility and degraded air quality across the province. Indonesia''s government says over 100,000 hectares burned in the first half of the year. (AFP/Reina)'
