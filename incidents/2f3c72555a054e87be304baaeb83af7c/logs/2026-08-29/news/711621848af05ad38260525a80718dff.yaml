title: 'FRI: Eight fires sparked by lightning in SF National Forest in four days, +More'
body: Eight fires sparked by lightning over the last four days are burning in the Sntna Fe national Forest, where federal and state fire officials are fighting the blazes, the largest of which, the Frijoles Fire, grew to 200 acres from just 10 in a single day.
