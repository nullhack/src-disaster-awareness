title: Indonesia's forest, land fires easing, could end within two weeks, says Prabowo
body: 'JAKARTA: President Prabowo Subianto said Indonesia''s forest and land fires had begun to be brought under control in several areas, expressing hope that the situation could be fully resolved within the next one or two weeks.'
