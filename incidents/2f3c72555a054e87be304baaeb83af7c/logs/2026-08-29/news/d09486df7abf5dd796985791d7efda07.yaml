title: New moisture sensors could help make wildfire danger ratings better in Arizona
body: A pilot project in the Tonto National Forest is studying a potential new way to gauge wildfire risk. It involves monitoring moisture levels in both soil and plants — both living and dead. If it goes well, the sensors could be used across different ecosystems around Arizona and beyond.
