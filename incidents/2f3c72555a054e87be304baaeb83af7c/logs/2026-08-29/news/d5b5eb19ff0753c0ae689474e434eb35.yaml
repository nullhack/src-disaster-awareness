title: On a weekend when southern BC burned, violators of fire bans were caught in the act
body: On a weekend when thousands of people were forced to flee a ferocious wildfire that destroyed hundreds of homes along Okanagan Lake, others were lighting illegal fires nearby, and in other parts of British Columbia's Interior ravaged by blazes.
