title: Firefighters battle wildfires in Belgium and Greece as 2 die on an island near Athens
body: BAELEN, Belgium (AP) — Firefighters battled a massive wildfire that scorched a nature reserve in eastern Belgium and another on a Greek island near Athens where two people were killed
