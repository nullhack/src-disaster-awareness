title: Menoyia car fire brought under control
body: A small forest fire in Menoyia was brought under control within 20 minutes on Sunday after starting when a vehicle caught fire, the forestry department said. The fire broke out at around 2.50pm, spreading to around two acres of carob fields before firefighters extinguished the blaze at 3.10pm. Eight forestry…
