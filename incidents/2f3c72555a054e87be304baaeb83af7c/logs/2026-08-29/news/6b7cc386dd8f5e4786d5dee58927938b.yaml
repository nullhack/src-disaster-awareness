title: Wildfires Battled in Peloponnese, Karditsa and Serres as High Risk Covers Half of Greece Greek City Times
body: Aircraft and firefighters are battling three wildfires in mainland Greece on Thursday as half the country faces category-3 fire risk. Authorities warn of elevated danger continuing into Friday across the Peloponnese, Athens region, Crete and Aegean islands.
