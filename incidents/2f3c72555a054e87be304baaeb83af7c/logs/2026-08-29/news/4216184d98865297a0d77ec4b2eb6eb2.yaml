title: In record US wildfire season, firefighter entrapments hit 20-year high
body: U.S. firefighting personnel are being overrun by wildfires at the highest rate in two decades, leading to six deaths and dozens of injuries this year, federal data showed, a grim count during a record-setting fire season in the United States.
