title: Singapore loses $1.8B to haze crisis, exceeding 2015 record
body: This year’s severe haze episode has cost the Singaporean economy an estimated S$2.32 billion (US$1.81 billion) as of Oct. 31, around 4% more than the previous record set in 2015.
