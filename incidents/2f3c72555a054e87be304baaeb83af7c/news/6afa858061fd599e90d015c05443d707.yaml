title: Little Giant Fire in Okanogan-Wenatchee National Forest burns over 30,000 acres
body: According to the Little Giant Fire Information Center, on Sunday, the Little Giant Fire has burned 38,500 acres in the Okanogan-Wenatchee National Forest and is 0% contained.
