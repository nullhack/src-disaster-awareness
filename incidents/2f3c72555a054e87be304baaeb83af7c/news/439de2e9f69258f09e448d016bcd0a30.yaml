title: Fast-moving wildfire amid shifting winds threatens Reno, Nevada, forcing thousands to evacuate
body: Officials say a fast-growing wildfire in Reno, Nevada, was human-caused. The Hawk Fire grew to 13,000 acres Sunday and is uncontained.
