title: Flathead National Forest Proposes Salvage Logging on 1,537 Acres Burned in Skillet Fire - Flathead Beacon
body: The Flathead National Forest is proposing a timber salvage project on 1,537 acres burned in this year’s Skillet Fire, and it is accepting public comment on the plan through Nov. 25. The project was analyzed under the Post Fire Recovery Environmental Assessment, a nationwide U.S. Forest Service initiative that guides proposed actions after wildfires. First […]
