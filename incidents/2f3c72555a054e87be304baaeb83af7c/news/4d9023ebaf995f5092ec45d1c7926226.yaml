title: Wildfire in southwest Palm Beach County burns 4,000 acres, 50% contained
body: A wildfire is burning near the Holey Land Wildlife Management Area in far southwestern Palm Beach County with 50% containment as of Monday evening, according to the Florida Forest Service.
