title: Wild River fire appears increasingly under control - Concord Monitor
body: The Wild River fire, the biggest wildfire in modern New Hampshire history, appears increasingly under control following recent rains and continued efforts by federal, state and local fire crews. As of Wednesday, it was about 53% contained, with fire crews — 87 people with two helicopters and a heat-spotting drone — doing mop-up and containment […]
