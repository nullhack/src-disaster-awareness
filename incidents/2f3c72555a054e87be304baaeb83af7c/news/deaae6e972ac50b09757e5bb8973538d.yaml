title: France orders 4,000 more evacuated as fires displace a third of a million across southwest Europe
body: French authorities have ordered nearly 4,000 more people to evacuate from tourist sites on the Atlantic coast. The returning heat threatens firefighters' fragile hold on a vast wildfire west of Bordeaux. The blaze in the Gironde region has burned an area four times the size of Paris. It has forced 220,000 people to evacuate. Across France and Spain, roughly 330,000 people have been driven from homes and vacation sites by fires of exceptional scale. Spain is bracing for its fourth heat wave of the summer, with several blazes still out of control, including the largest in its recorded history.
