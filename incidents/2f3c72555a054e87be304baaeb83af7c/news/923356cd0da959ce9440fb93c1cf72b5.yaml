title: 'Scientists test prediction model during High Fens forest fire | VRT NWS: news'
body: Scientists are testing a model in the wake of the fire in the High Fens that is designed to improve the prediction of future wildfires. They are simulating how the blaze will spread – where it will go, how fast and how intensely.
