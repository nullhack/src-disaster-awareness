title: 'Haze: Malaysia offers bombardier aircraft, assets to Indonesia to tackle forest fires'
body: 'JAKARTA: Malaysia has officially offered assistance to Indonesia in tackling forest fires, including a Bombardier CL-415MP aircraft previously deployed to help its neighbour combat similar fires.'
