title: Singapore issues more haze notices | Arkansas Democrat Gazette
body: KUALA LUMPUR, Malaysia -- Singapore will issue preventive notices to three more Indonesian companies to tackle and prevent forest fires in Kalimantan province that may have sent smoke across the border, the National Environment Agency said Monday.
