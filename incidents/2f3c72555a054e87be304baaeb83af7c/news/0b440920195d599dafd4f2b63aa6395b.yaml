title: Indonesian, Singapore foreign ministers meet amid spat over haze, gas
body: 'JAKARTA: Jakarta and Singapore plan to set up a task force to hold businesses to account for involvement in Indonesian wildfires that have caused a regional haze crisis, the countries'' foreign ministers said after meeting on Tuesday (Oct 27).'
