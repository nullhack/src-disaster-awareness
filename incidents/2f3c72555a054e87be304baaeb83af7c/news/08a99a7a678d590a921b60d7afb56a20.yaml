title: Forestry reform critical as Indonesia's wildfires threaten health, ecosystems
body: The plan to revise Indonesia's 1999 Forestry Law may fail to address decades-long poor governance in the sector that has resulted in wildfires in large parts of Sumatra, Kalimantan and Papua throughout this year's dry season, civil groups say.
