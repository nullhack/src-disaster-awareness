title: Crash of Indonesian water-bombing helicopter kills crew member
body: 'JAKARTA: A crew member of a helicopter battling Indonesian wildfires was killed on Sunday (Nov 8) when the aircraft crashed into a river as it scooped up water for an airborne drop, a local disaster agency said.'
