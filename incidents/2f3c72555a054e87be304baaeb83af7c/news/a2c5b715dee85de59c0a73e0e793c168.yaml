title: 'Haze: All flights cancelled at Singkawang Airport'
body: 'JAKARTA: (Bernama) All flights at Singkawang Airport in Indonesia''s West Kalimantan province were cancelled on Saturday due to haze, as authorities continued efforts to tackle forest and land fires across Kalimantan.'
