title: 'Expert: Indonesia needs fire risk maps, food project reevaluation amidst Merauke wildfires - Environment - The Jakarta Post'
body: Data from MapBiomas showed that areas with the most extensive fire damage are distributed across various food production hubs and agricultural regions, with Merauke in South Papua topping the list at the regency level.
