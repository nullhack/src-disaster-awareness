title: Historic Pfeiffer Homestead Cabin wrapped as fires advance
body: Fire crews battling the Timber and Plaskett fires have wrapped the 1884 Pfeiffer Homestead Cabin in protective foil to shield the historic structure as the Big Sur wildfires grow.
