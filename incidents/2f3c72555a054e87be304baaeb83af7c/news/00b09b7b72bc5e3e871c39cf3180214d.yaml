title: Indonesia wildfires fuel surge in respiratory illnesses as haze spreads
body: 'JAKARTA: Spreading forest and peatland fires in Indonesia have made people sick, as haze from hundreds of thousands of burned areas across the country worsens air quality in many regions and triggers respiratory infections.'
