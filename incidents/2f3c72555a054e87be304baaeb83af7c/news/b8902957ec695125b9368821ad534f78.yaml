title: 'The Latest: Fire Crews in Southwest France Battle Massive Blaze as They Face Extreme Temperatures'
body: Météo-France said Wednesday would be the hottest and driest day of the week, with elevated wildfire danger across every region of France. Drought now covers mainland France and Corsica, with soils nearing the record dryness reached in August 2022.
