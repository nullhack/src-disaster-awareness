title: Crews continuing to work on stamping out Broad Fire, cause remains under investigation
body: WEBER CANYON — Fire crews are getting closer to eliminating the threat of the Broad Fire — located in Weber Canyon just to the east of Uintah and South Weber — entirely thanks to more ideal conditions Monday evening into Tuesday, but don’t count the terrain as among those “ideal conditions.” U.S. Forest Service Public […]
