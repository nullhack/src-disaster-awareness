title: Third UP wildfire is now fully contained
body: The Ridge Fire near Marquette — one of three fires in the so-called Rugged Terrain Complex — is now fully contained, thanks in part to snowy weather, according to the Michigan Department of Natural Resources. It is the last of the fires to reach 100% containment. Danger still remains, though. The DNR is asking people […]
