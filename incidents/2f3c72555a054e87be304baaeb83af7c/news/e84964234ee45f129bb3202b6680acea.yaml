title: Indonesia-Singapore Establish Task Force for Forest Fire Accountability, Will Bring Responsible Parties to Court
body: Indonesia and Singapore have agreed to form a joint task force to take strict action against companies responsible for forest fires. Cross-border law enforcement and tracing financial flows are ready to be implemented!
