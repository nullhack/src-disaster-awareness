title: Greek firefighting team joins first real operation in Cyprus
body: A Greek firefighting team undergoing training on the island joined efforts to tackle a blaze in Arsos, marking its first real mission in Cyprus, the fire service said on Tuesday. The Greeks arrived under the EU Civil Protection Mechanism’s Prepositioning 2026 programme. The 21-member Greek team is based at the…
