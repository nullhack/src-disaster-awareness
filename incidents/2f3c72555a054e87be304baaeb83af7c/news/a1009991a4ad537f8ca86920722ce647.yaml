title: Franciscans call for solidarity as haze from Indonesian fires blankets Southeast Asia
body: Ongoing air pollution and its effects were discussed at the assembly of the Franciscan Network for Peace and Integral Ecology in Asia, held in Kota Kinabalu, Malaysia, earlier this month.
