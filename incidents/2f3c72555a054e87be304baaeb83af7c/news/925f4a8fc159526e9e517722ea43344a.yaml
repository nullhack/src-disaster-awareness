title: Hagen Fire burning nearly 30,000 acres; Level 3 evacuation orders expand to Union County
body: Urgent evacuation orders have been issued for a large wildland fire that is burning in hilly terrain near the community of Tollgate, according to the Umatilla County Sheriff’s Office.
