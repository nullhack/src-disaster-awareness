title: Multiple fire departments working to contain Anderson County wildfire - AOL
body: ANDERSON COUNTY, Texas (KETK)– Several East Texas fire departments are currently on the scene working to contain an ongoing wildfire in Anderson County. According to the Texas A&M Forest Service, the fire is off Highway 294 and County Road 1990 and is estimated to have begun around 5 p.m. The fire is currently 40% contained […]
