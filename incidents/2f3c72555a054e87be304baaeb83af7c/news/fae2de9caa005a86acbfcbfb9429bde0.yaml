title: State parks around Big Sur closed as Timber fire grows to 2,000 acres
body: A wildfire in Big Sur has burned 2,000 acres and spurred evacuations that encompass iconic destinations such as the Nepenthe restaurant and the Alila Ventana resort and closed parks in the area.
