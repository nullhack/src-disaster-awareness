title: Belgian wildfire approaches Germany as Greece probes deadly blaze
body: Belgium is battling one of its largest wildfires, despite cooler weather and rain. The blaze in the High Fens is moving near Germany and has burned around 30 square kilometers, or about 12 square miles.
