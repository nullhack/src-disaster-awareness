title: 'Flemish company Radiant Color supplies pigment for pink fire-fighting water used in forest fires | VRT NWS: news'
body: Radiant Color, based in Houthalen-Helchteren (Limburg), is helping in the fight against forest fires in southern Europe. The company manufactures fluorescent pigment for fire retardants, and this pigment is being used by fire services throughout Southern Europe.
