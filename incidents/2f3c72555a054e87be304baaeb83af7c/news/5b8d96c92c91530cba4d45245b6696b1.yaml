title: Firefighters contain 75% of Horse Island fire - AOL
body: BERKELEY COUNTY, S.C. (WCBD) – The Horse Island Fire on the Francis Marion National Forest near Shulerville is now 75% contained, according to the U.S. Forest Service. Authorities say there is the potential for fire to reignite where burned leaves and branches fall to the ground as hot, dry weather returns. As of July 28, […]
