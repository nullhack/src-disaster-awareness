title: Gov. Sanders activates interstate fire protection compact in response to wildfires
body: Arkansas has activated the South Central Interstate Forest Fire Protection Compact to support ongoing suppression efforts as prolonged drought and worsening weather conditions continue to elevate wildfire activity statewide.
