title: Second helicopter crash during Kalimantan firefighting operation kills one
body: 'KALIMANTAN: A civilian helicopter crashed into the Barito River in Barito Kuala regency, South Kalimantan, on Sunday during a water-bombing operation to fight forest fires, killing one person and injuring two others.'
