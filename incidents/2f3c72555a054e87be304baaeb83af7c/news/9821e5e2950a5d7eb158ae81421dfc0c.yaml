title: Indigenous Kalimantan people sue Indonesian govt over wildfire negligence
body: 'JAKARTA: Indigenous and civil society groups in West Kalimantan have sued the central government and local administrations, accusing them of deliberate negligence for failing to prevent and properly handle the widespread wildfires paralywing the province.'
