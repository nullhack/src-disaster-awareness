title: Brush Fire Scorches 50 Acres Close to San Bernardino National Forest - MyNewsLA.com
body: A brush fire that erupted Friday in Sage scorched roughly 50 acres at the edge of the San Bernardino National Forest before it was partially contained. The non-injury blaze was reported at 12:40 p.m. Friday in the area of Taffle Ranch and Red Mountain roads, about six miles southeast of Hemet, according to the Riverside […]
