title: Rains bring relief to Indonesian city weary of fire haze
body: 'PALANGKARAYA, (Indonesia): Residents and firefighters in an Indonesian city long shrouded in a toxic haze brought on by months of wildfires rushed outside dancing and chanting as rain this week brought a welcome respite.'
