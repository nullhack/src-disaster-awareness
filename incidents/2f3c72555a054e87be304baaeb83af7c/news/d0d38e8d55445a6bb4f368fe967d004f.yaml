title: '''Keeping them alive'': Three more orangutans rescued after wildfires in Indonesia force them out of their habitat'
body: Three more orangutans were rescued after forest and land fires forced them from their habitat in Indonesia's West Kalimantan province, bringing the total number rescued due to the fires to 18.
