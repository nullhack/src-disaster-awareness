title: Argaka forest fire brought under control in 20 minutes
body: A forest fire in Argaka in Paphos was brought under control within 20 minutes on Monday after burning a small area of dry grass. The fire broke out at around 9.30am in the Mandra area of the Paphos state forest, the forestry department said. Eight forestry department personnel took part…
