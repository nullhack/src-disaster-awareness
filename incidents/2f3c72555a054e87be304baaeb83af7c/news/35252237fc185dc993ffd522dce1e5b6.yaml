title: One dead as a second helicopter crashes during water bombing in Kalimantan - Archipelago - The Jakarta Post
body: The civilian Eurocopter EC225LP Super Puma helicopter lost altitude while scooping water, in a similar manner as the Indonesian Army Aviation Center's (Puspenerbad) Mi-17V5 which crashed on Wednesday, killing three.
