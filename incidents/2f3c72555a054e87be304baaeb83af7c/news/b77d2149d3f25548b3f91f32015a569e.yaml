title: Evacuation levels lowered for Three Queens, Goat fires in Kittitas County
body: 'According to the Kittitas County Sheriff''s Office, evacuation levels for the Three Queens and Goat fires have been reduced: • The cabins along Baker Lane, just south of Kachess Campground, are reduced from Level 2 to LEVEL 1 - GET READY.'
