title: '‘Turning a corner’: Cal Fire shares optimistic update on 4,100-acre Lucas Fire at packed Lake County town hall'
body: A packed house of Lake County residents crowded a meeting room of the Running Creek Casino to listen to Cal Fire officials provide an update on the progress of combatting the Lucas Fire Sunday.
