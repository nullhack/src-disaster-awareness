title: Wildfires in France drive 250,000 people from their homes and creep toward wine city of Bordeaux
body: A raging wildfire in southwest France has forced the evacuation of 55,000 more people overnight. This brings the total to 220,000 in one region alone, as flames have crept closer to the wine region city of Bordeaux.
