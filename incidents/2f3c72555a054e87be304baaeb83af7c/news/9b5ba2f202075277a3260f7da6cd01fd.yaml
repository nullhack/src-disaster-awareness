title: Europe's hot, dry summer takes its toll with fires in France and Greece, and drought in the UK
body: Europe is grappling with a record-breaking hot and dry summer. Water-dropping planes on Monday tackled a major wildfire in Greece while firefighters in France worked to stabilize a blaze in Provence.
