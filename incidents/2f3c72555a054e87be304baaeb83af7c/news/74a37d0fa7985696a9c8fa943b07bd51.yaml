title: 'More than 80 wildfires extinguished in Ontario in past two weeks: minister'
body: The wildfire situation in northern Ontario is moving in a reassuring direction as more than 80 fires have been extinguished in the past two weeks, Natural Resources Minister Mike Harris said Thursday.
