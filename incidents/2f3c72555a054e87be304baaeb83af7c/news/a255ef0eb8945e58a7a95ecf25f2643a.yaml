title: Europe's hot and dry summer takes its toll with fires in France and Greece, and drought in the U.K.
body: ATHENS, Greece (AP) — A record-breaking hot and dry summer tightened its grip on Europe Monday, as water-dropping planes swooped over a major wildfire in Greece, firefighters in France sought to stabilize a blaze in Provence, and much of the U.K. recorded its driest July in nearly two centuries.
