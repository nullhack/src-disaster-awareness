title: No new major fires in Sierra Front during Saturday's red flag warning
body: The Sierra Front Interagency Dispatch’s Wild Web shows the region survived Saturday’s red flag warning relatively unscathed as tropical storm Rachel prompted flood watches from Clark County north into central Nevada.
