title: Texas' Ross fire, burning 100 miles west of Dallas, grows to 85,000 acres | Texarkana Gazette
body: PALO PINTO, Texas -- The Ross fire grew to an estimated 85,000 acres Thursday as firefighters continued working to keep the blaze from pushing toward communities around Possum Kingdom Lake and State Highway 16, according to the Texas A&M Forest Service.
