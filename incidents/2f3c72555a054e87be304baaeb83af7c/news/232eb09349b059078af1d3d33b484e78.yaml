title: Belgian wildfire approaches Germany as Greece probes deadly blaze
body: SOURBRODT, Belgium (AP) — One of Belgium's biggest ever wildfires blazed out of control Monday even as cooler weather and rain in the morning eased conditions for hundreds of firefighters in remote and hilly countryside. In Greece, a fire briefly flared up near the main airport on the outskirts of Athens.
