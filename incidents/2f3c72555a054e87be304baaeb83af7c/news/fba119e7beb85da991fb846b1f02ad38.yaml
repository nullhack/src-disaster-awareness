title: Minnesota man charged with shooting firefighting aircraft during wildfire mission - BNO News
body: A man has been charged with shooting and disabling an aircraft while its pilot was fighting a forest fire in northern Minnesota, according to federal prosecutors. Authorities said he admitted firing guns as the aircraft flew nearby but claimed he was hunting crows. Daniel Christian Pettit, 48, of Portage Township, Minnesota, appeared at court on […]
