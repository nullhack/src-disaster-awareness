title: DENR Puts Wildfire Prevention on Maximum Alert as Very Strong El Niño Looms | PhilNews
body: The DENR has placed forest protection on maximum alert, with patrols, firelines and a Mt. Apo trekking closure, as a very strong El Niño nears.
