title: 'Making progress: Broad Fire sees greater containment after favorable conditions set in'
body: WEBER CANYON — A dramatic Labor Day weekend played out at the mouth of the Weber Canyon near Uintah and South Weber as a wildfire ravaged 134 acres and led to one indirect fatality. U.S. Forest Service Public Information Officer Sierra Hellstrom told the Standard-Examiner Monday morning that the Broad Fire was holding at 134 […]
