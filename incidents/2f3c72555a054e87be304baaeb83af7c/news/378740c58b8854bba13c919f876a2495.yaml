title: West Kalimantan ISPU surges above 1,000 as pollutants spread regionally - National Disaster Mitigation Agency
body: 'JAKARTA: (Bernama) The Air Pollutant Standard Index (ISPU) in Indonesia''s West Kalimantan surged back above 1,000 on Wednesday (Sept 2), reaching 1,016 in Southeast Pontianak, as pollutants from forest and land fires were forecast to continue spreading towards Malaysia, Singapore and Brunei'
