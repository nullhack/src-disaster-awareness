title: Gracemont Fire Exceeds 4,000 Acres in Caddo County; Okeene Fire Confirmed Out - Oklahoma Farm Report
body: Fire crews across western and central Oklahoma continue to battle the Gracemont Fire, which has burned an estimated 4,000-plus acres across northern Caddo County near the Canadian County line. Meanwhile, emergency officials have confirmed that a separate blaze in Blaine County near Okeene is fully extinguished. Gracemont Fire Conditions and Response The fire remains active
