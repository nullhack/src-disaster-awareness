title: Indonesia keeps 53 aircraft on standby as fire risks persist
body: 'JAKARTA: Indonesia is keeping 53 aircraft on standby to combat forest and land fires despite recording a significant decline in hotspots in Central and West Kalimantan, with nearly 600 hotspots still detected nationwide as fire risks persist.'
