title: Northern Minnesota July lightning fires nearly 60 percent contained, crews watch for new starts
body: Fire crews have reached about 60 percent containment on the wildfires burning in northeastern Minnesota and in Canada, though firefighters remain on alert for new lightning-caused ignitions.
