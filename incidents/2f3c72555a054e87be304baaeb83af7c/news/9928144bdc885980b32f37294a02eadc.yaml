title: Hikers safely evacuated amid Indonesia's Mount Semeru forest fire
body: 'JAKARTA: (Bernama) About 170 hikers who had been camping on Mount Semeru in Indonesia''s East Java province have been safely evacuated as firefighters continue battling a forest fire along the mountain''s hiking route.'
