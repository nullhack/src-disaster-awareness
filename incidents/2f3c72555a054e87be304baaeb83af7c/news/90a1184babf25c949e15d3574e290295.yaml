title: Indonesia’s forestry ministry processes 42 forest fire cases, sanctions six companies
body: The country’s meteorology agency detected 4,508 hotspots on Wednesday morning (Aug 26), with nearly eight in 10 in Kalimantan. President Prabowo Subianto has instructed officials to do more in preventing forest and land fires.
