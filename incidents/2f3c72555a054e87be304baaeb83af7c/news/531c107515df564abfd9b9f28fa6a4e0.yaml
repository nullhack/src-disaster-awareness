title: Investigation says understaffing and unexpected fire behavior led to firefighter deaths
body: Unexpected fire behavior, chronic understaffing, a lack of trained employees and a new policy to quash fires quickly were among the factors that contributed to the deaths of four helitack firefighters as they battled a blaze in western Colorado in June.
