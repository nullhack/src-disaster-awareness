title: 'Palisades arson case: Second trial begins against man accused of sparking wildfire'
body: The first trial of Jonathan Rinderknecht — the man accused of intentionally starting a blaze that grew into the deadly Palisades fire — ended with a jury deadlocked 10 to 2 in favor of acquittal. Now, federal prosecutors are trying once again to convict him with revised charges.
