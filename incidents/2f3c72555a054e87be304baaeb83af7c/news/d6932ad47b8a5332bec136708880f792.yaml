title: Lake Channel Fire in Power County grows to 1,500 acres; BLM takes command - East Idaho News
body: AMERICAN FALLS — Multiple aircraft were dispatched Thursday morning to battle the Lake Channel Fire near Massacre Rocks as the Bureau of Land Management assumed command of the wildfire according to American Falls Fire Chief C.J. Sweeney, who was assessing the scene. Sweeney told EastIdahoNews.com he will provide an update as more information becomes available. […]
