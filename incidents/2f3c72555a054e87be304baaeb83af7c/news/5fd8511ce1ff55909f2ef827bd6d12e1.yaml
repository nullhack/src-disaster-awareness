title: Eaton Wildfire Exposed Millions to a “Cocktail of Chemicals” - Eos
body: Compared to a nearby wildfire that primarily burned vegetation, the smoke plume from the urban Eaton Fire contained 3 times as much arsenic and 50 times as much lead.
