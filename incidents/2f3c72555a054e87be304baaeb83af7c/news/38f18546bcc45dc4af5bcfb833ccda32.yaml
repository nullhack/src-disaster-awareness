title: Pekanbaru, Pelalawan upgrade to 'emergency response' as Riau haze worsens
body: 'JAKARTA: Pekanbaru and Pelalawan in Indonesia''s Riau province on Sumatra island have upgraded their emergency status for forest and land fires from "emergency alert" to "emergency response" as worsening haze pushes air quality to very unhealthy levels.'
