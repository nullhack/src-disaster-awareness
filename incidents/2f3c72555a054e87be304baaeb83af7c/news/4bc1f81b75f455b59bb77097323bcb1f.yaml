title: Firefighters make progress against a Nevada wildfire that's destroyed more than 30 homes | Texarkana Gazette
body: RENO, Nevada -- Crews have started to contain a wildfire in the Sierra Nevada foothills near Reno, Nevada, that destroyed more than 30 homes as it spread perilously close to dense neighborhoods, officials said Monday.
