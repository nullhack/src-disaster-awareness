title: Oregon nears all-time wildfire acreage record as 2026 fires top 2 million acres
body: 'Oregon’s 2026 wildfire season is nearing the state record: 60 large fires have burned 2,014,481 acres, close to 2024’s 2,081,661. Officials track only large fires; final totals come after season’s end.'
