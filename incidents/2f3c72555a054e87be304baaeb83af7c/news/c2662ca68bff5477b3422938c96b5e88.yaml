title: Singapore, Indonesia to set up joint task force to hold firms accountable for forest fires
body: 'JAKARTA: Singapore and Indonesia will establish a joint task force to hold companies accountable for forest fires, as both countries seek to strengthen cooperation against transboundary haze and tackle deliberate burning blamed for the blazes.'
