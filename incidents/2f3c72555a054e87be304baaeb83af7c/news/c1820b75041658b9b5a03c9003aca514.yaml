title: Brush fire scorches 55 acres near San Bernardino National Forest
body: SAGE, CA — A brush fire that erupted Friday in Sage has scorched roughly 55 acres at the edge of the San Bernardino National Forest and is now 5% contained, according to the Riverside County Fire Department The non-injury blaze was reported at 12:40 p.m. in the area of Taffle Ranch and Red Mountain roads,
