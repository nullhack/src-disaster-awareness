title: U.S. Forest Service officials investigate cause of Summit Fire
body: U.S. Forest Service law enforcement are seeking information from the public as they investigate the cause of the fires that started on Friday, Oct. 16 on the slopes of Three Fingered Jack near Santiam Pass.
