title: '''Safety of tourists is priority '': Indonesia''s Mount Bromo closed to visitors as wildfire continues to spread'
body: Indonesia has closed all entrances to Mount Bromo to visitors and suspended all tourism activities until further notice, as a forest fire continues to spread across the Bromo Caldera in East Java.
