title: Burning Kalimantan forests put orangutans at risk
body: 'JAKARTA: The burning forests and peatlands in Kalimantan are threatening the region''s endemic orangutans, prompting conservation groups and authorities to step up rescue efforts from the blaze spreading through their natural habitats.'
