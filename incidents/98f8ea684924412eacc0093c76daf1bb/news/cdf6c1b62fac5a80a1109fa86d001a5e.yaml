title: Heavy rain and flooding in north-central Japan strands people and vehicles
body: Torrential rain has struck Japan’s north-central prefectures of Ishikawa and Toyama. The severe weather on Thursday triggered flooding and landslides, caused road closures and stranded people in flooded homes and vehicles.
