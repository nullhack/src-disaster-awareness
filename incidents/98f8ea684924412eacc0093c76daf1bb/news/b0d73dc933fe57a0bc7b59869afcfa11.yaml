title: 4 dead as ‘unprecedented’ rain floods Eastern Japan, strands thousands at Narita Airport
body: At least four people have died in eastern Japan after what authorities described as “unprecedented” heavy rain triggered widespread disruption, leaving thousands stranded overnight at Narita airport and snarling road and rail services, officials said Friday.
