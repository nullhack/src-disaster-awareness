title: Unpredictable Amount of Rainfall Causes Inland Flooding in Recent Heavy Rain That Hit Japan's Chiba Pref.
body: In urban areas covered in concrete, rainwater cannot seep into the soil. Usually, it is treated and discharged into rivers via the sewer system, but the system was unable to handle the volume of rainwater in the recent heavy rain that hit Chiba Prefecture,
