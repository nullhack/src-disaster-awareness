log_date: '2026-08-20'
summary: Torrential rain starting late on August 13, 2023, caused record-breaking flooding in eastern Japan, particularly in Chiba Prefecture. The flooding resulted in at least eight to nine deaths, widespread power outages affecting over 22,000 households, and stranded thousands of travelers at Tokyo's Narita Airport. Authorities issued the highest-level rain warnings as the region experienced unprecedented rainfall, equivalent to three months' worth in 12 hours.
