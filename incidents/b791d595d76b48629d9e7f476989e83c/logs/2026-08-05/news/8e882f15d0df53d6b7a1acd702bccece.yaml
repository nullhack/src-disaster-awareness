title: 'Wildfires in Greece: Blaze out of control near Rethymno in Crete'
body: Over 220 firefighters are battling a wildfire in southern Crete, whilst strong winds are hampering aerial water drops. The funerals of the two firefighters who lost their lives Wednesday are taking place on Thursday.
