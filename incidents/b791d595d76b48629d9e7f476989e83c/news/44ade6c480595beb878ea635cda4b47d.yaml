title: Three firefighters die battling blazes in Greece
body: ATHENS, Greece — Three firefighters died battling forest blazes in Greece on Wednesday as several other fires broke out around the country, fed by gale-force winds. The fire department said two firefighters had died on the island of Crete "during an operation to contain a rural forest fire.
