log_date: '2026-10-20'
summary: Cyclone Wati, a category 2 storm, is tracking over the Cook Islands, bringing damaging winds, power cuts, and coastal surges; Aitutaki is reported relatively unscathed despite heavy lagoon surges. Meanwhile, a tropical depression (TD01F) near the Cook Islands is forecast to intensify to cyclone strength, prompting official alerts and preparedness warnings.
