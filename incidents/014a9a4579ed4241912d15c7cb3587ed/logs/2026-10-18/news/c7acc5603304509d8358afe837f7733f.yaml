title: कञ्चनपुरमा दुई मोटरसाइकल ठोक्किँदा तीन जना घाइते
body: <p>महेन्द्रनगर । कञ्चनपुरको भीमदत्त नगरपालिका–४ गोबरियामा दुई मोटरसाइकल आपसमा ठोक्किँदा तीन जना घाइते भएका छन्। शनिबार साँझ बागमती प्रदेश ०२०१५ क ४७८५ नम्बरको मोटरसाइकल र लु ९६ प ७०८५ नम्बरको मोटरसाइकल आपसमा ठोक्किँदा दुर्घटना भएको हो। दुर्घटनामा भीमदत्त नगरपालिका–१६ का रोहित भट्ट, वडा नम्बर ६ का ललित कुँवर र दोधाराचाँदनी नगरपालिका–२ का हर्श शाही घाइते […]</p>
