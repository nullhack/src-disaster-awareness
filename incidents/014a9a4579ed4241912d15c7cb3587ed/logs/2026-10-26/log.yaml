log_date: '2026-10-26'
summary: |-
  Nepal has resumed electricity exports to Bangladesh after flood disruption and reported increased power export earnings to India despite damage to hydropower projects. The government has unveiled new flood warning systems and glacial lake risk cuts to strengthen disaster readiness, while calls for clearer aid numbers and a reconstruction plan emerge.
  Mountain Energy Nepal has resumed electricity transmission from its 42 MW Mistri Khola Hydroelectric Project after a 20-day disruption due to flood damage. Additionally, Nepal exported over USD 39 million worth of electricity to India between mid-September and mid-October, indicating continued recovery in the power sector.
