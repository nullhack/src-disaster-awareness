title: Mustang sees post-Dashain upsurge in tourists
body: Tourist arrivals in Mustang, which had been deserted following floods and landslides, have begun to pick up immediately after the Dashain festival. The number of domestic tourists visiting the district started increasing from the day after Dashami (the day of Tika).
