title: CJP’s Abhijeet Dipke Rejects Nepal, Bangladesh ‘Regime Change’ Comparisons, Invokes Gandhian Satyagrahaa
body: CJP activist Abhijeet Dipke on Tuesday rejected comparisons with unrest in Nepal and Bangladesh, saying jailed leaders Saurav Das and Ashutosh Ranka followed Gandhi's path of Satyagraha. He said they entered jail smiling despite alleged unlawful imprisonment. Their custody was extended until October 21 over alleged breaches of peace bonds and calls for protests in restricted areas.
