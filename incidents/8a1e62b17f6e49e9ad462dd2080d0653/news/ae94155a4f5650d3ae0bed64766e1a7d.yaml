title: Severe storms sweep Front Range, creating some flooding
body: Gusty thunderstorms dumped rain and hail on parts of the Front Range and through the eastern plains on Wednesday, causing flash flood conditions in some areas. The National Weather Service offices in Boulder and Pueblo were kept busy Wednesday, issuing a combined 29 severe thunderstorm and three flash flood warnings by 8 p.m. Hours earlier, […]
