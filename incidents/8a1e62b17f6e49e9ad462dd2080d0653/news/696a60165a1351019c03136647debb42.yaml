title: Severe Storms Possible for Some
body: A Severe Thunderstorm Watch in effect for Castro, Swisher, Briscoe, and Hall counties until 11 PM CDT Tuesday. This WATCH includes the communities of Dimmitt, Tulia, Silverton, Memphis, and Turkey in the northern KCBD/FOX34 viewing area.
