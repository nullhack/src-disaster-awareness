title: 'UCF road woes continue: Knights’ losing streak hits 10 with 12-7 loss at Pitt'
body: After putting up record offensive numbers in their opener, the Knights couldn’t get much going, finishing with just 7 points and 20 yards rushing in a 12-7 loss to the Pitt Panthers.
