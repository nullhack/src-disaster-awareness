title: Signal No. 1 up in 7 areas as Super Typhoon Rosal intensifies
body: 'Tropical Cyclone Wind Signal No. 1 remains in effect over several parts of Luzon as Super Typhoon Rosal (international name: Champi) further intensified while moving over the sea east of Northern Luzon, the state weather bureau PAGASA said Wednesday.'
