title: Windshear forced Alaska Airlines Boeing 737 MAX 9 to abort two landings before diverting to LAX
body: LOS ANGELES — Severe nighttime weather conditions over the Inland Empire forced an Alaska Airlines flight to abort multiple landing attempts early Friday morning before executing a late-night diversion to Los Angeles International Airport (LAX). Alaska Airlines Flight AS489, operated by a Boeing 737 MAX 9 (registration N931AK), departed Seattle-Tacoma International Airport (SEA) at 11:20 […]
