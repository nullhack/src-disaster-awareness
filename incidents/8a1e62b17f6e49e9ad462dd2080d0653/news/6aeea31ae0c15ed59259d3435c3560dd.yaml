title: Pritzker issues State Disaster Proclamation after recent severe weather - AOL
body: ILLINOIS (WCIA) — After severe weather across the state led to damage from torrential downpours, flash flooding, straight-line winds and several tornadoes, Governor JB Pritzker issued a state disaster proclamation on Tuesday for more than a dozen counties, including several in Central Illinois. The proclamation, which includes Champaign, Ford and Vermilion counties, will make additional […]
