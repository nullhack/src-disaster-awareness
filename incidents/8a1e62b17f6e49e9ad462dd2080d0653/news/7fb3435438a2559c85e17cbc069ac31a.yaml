title: Alice Springs storm hits as IAG flags home resilience gap
body: Hotels, cafés and cattle stations in the Red Centre are tallying losses after Monday’s storm, which struck on the same day a McKell Institute study blamed a "delivery gap" for the state of Australia’s housing.
