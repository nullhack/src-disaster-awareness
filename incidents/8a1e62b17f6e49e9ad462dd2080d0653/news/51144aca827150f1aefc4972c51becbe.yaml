title: Heat and severe storms on the menu
body: Warm and muggy start to Sunday in the middle 70s. First half of the day will be sunny and hot with temperatures in the low to mid 90s. Feels-like temperatures can reach up to 105+. Scattered storms will pop in afternoon while another line of storms is anticipated to arrive late Sunday night into early Monday morning. Some of these storms can be strong to severe.
