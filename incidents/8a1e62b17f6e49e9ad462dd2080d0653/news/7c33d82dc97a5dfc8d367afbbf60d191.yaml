title: Weather Cancels Darlington Qualifying Tyler Reddick Lands Pole
body: The NASCAR Cup Series playoff opener at Darlington Raceway got an unexpected twist Saturday afternoon. Practice and qualifying for the Cook Out Southern 500 were canceled because of lightning and severe weather in the area , meaning drivers never got the opportunity to put down a qualifying lap. NASCAR ultimately used its established metric to…
