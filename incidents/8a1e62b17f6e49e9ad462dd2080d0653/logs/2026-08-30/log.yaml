log_date: '2026-08-30'
summary: 'New tornadoes confirmed in New York: an EF-1 and EF-0 near Wilton, and two tornadoes (EF-0 and EF-1) touched down in the state on Thursday, with damage surveys ongoing. Severe thunderstorms caused widespread power outages in San Antonio, Texas, leaving up to 100,000 customers without power and thousands potentially facing days without electricity amid heat index values above 100. Additional severe weather warnings and storm threats affected regions from the Plains to the Northeast, including Duke Energy outages in Charlotte, North Carolina.'
