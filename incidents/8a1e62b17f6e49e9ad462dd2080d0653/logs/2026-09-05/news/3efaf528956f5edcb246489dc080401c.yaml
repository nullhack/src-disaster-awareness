title: Severe thunderstorm watch issued for west-central Saskatchewan
body: 'Environment Canada has issued a severe thunderstorm watch for west-central Saskatchewan as conditions become favourable for storms capable of producing strong wind gusts, large hail and heavy rain. The watch was issued at 3:03 p.m. Friday and carries a moderate impact level with high forecast confidence. Environment Canada says a trough of low pressure moving across southwestern Saskatchewan is expected to trigger thunderstorms late Friday afternoon and into the evening. Some of those storms could become severe. Related Stories: Hail threat builds across west-central Saskatchewan as severe storms possible Friday Weather Warnings - Environment Canada Watch could expand eastward As thunderstorms develop and move east, Environment Canada says the watch area could be expanded Friday evening. googletag.cmd.push(function() { if($(document).width()<900) { s = googletag.defineSlot(''/50748803/wco-all-bigbox'', [300, 250], ''div-gpt-1632277500385-bbm1''); s.setConfig({targeting: {URL: [window.location.pathname]}})
  s.setConfig({targeting: {position: [1632277500385]}}) s.setConfig({targeting: {story_id: ''severe-thunderstorm-watch-issued-for-west-central-saskatchewan-2''}}) s.addService(googletag.pubads()); googletag.pubads().refresh([s], {changeCorrelator: false}); } }); Residents are being reminded to head indoors when thunder is heard, as lightning can cause serious injury or death. A severe thunderstorm watch means conditions are favourable for storms capable of producing damaging hail, strong winds or heavy rainfall, but does not mean severe weather is occurring everywhere in the watch area. Environment Canada is asking residents to continue monitoring forecasts and alerts as conditions develop. Severe weather reports can be submitted to Environment Canada through #SKStorm on social media, by email at SKstorm@ec.gc.ca or by calling 1-800-239-0484.'
