title: Austin, moves Homecoming game to Thursday, along with other schools as weather has big projected impact on area football
body: Sep. 16— Projected weather is having an impact on Friday night football. Due to forecasted heavy rains and thunderstorms, some area teams are shuffling their schedules. Austin has moved it's Homecoming game against Worthington to 7 p.m. Thursday, with the previously scheduled girls soccer game being moved to 4:30 p.m. and the Thursday night bonfire has been cancelled. Austin's Thursday night ...
