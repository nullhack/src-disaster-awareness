title: Thunderstorms with damaging winds and quarter-sized hail in San Bernardino and Mohave counties Wednesday
body: San Bernardino and Mohave counties are the focus of an updated severe thunderstorm warning issued at 6:01 p.m. on Wednesday by the National Weather Service. The warning is in effect until 6:30 p.m.
