log_date: '2026-08-26'
summary: |-
  Federal disaster aid was approved for 21 counties in Indiana following the August 11 derecho, and residents in Gary, Indiana, continue to face prolonged power outages two weeks after the storm, with a nonprofit providing hot meals to affected residents.
  New developments include power being fully restored in Gary, Indiana, after two weeks without electricity from the August 11 derecho; the National Weather Service confirmed an EF-1 tornado in Clearfield County, Pennsylvania, marking the 44th tornado in the state for the severe season; and York County, Pennsylvania, issued a Disaster Emergency Declaration following a tornado from the severe storms. Additionally, a severe weather event sparked a fire at a landfill in Evans County, Georgia.
