title: Cool and rainy days ahead, along with a severe storm chance Monday
body: Showers continue through the area this morning along with cool temperatures. Temperatures are not expected to warm up much today as we are likely only climbing into the 60s as rain is expected to fall throughout the day. Severe storms are possible Monday afternoon and into the evening.
