title: Warm, Breezy Monday with Evening Severe Storm Threat
body: Not only will it be much warmer at the start of the work week, but chances of severe weather will return to the forecast for Monday evening. A Slight Risk (Level 2 out of 5) of severe weather is in place, meaning scattered severe storms are possible. However, evening severe weather potential could be impacted by ongoing showers and storms expected to move through Monday morning.
