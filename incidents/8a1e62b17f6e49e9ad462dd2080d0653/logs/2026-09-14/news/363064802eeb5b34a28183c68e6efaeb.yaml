title: Gusty Friday with severe storm potential by evening
body: Friday is a First Alert Weather Day. Warm daytime temperatures with gusty conditions are likely today. A cold front is on the way providing for the possibility of severe storm development this evening into the night. These storms could have damaging gusty winds and large hail associated with them.
