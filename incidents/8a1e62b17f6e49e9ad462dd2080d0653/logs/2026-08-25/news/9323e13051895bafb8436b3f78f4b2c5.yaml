title: HIEMA to request federal disaster declaration following severe weather impacts from Lala | Maui Now
body: The Hawaiʻi Emergency Management Agency (HIEMA) is preparing to request a federal disaster declaration following damage assessments related to Tropical Cyclone Lala. To ensure thorough evaluations, HIEMA will deploy damage-assessment teams next week. In partnership with the Hawaiʻi National Guard, HIEMA will also conduct aerial assessments to gauge the storm’s impact across affected areas.
