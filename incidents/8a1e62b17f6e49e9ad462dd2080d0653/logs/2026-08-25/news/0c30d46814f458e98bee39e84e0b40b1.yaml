title: Storms damage power lines and homes, say officials
body: Severe weather toppled trees and damaged homes in Ocala on Saturday, say fire safety crews. Officials say multiple fire engines were called to Southeast Eighth Street after a tree cracked and fell onto a home, taking down power lines.
