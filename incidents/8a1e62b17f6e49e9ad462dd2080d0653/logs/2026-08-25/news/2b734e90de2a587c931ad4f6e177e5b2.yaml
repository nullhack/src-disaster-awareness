title: Tropical Storm Moke advances toward Hawaii as winds strengthen
body: The National Hurricane Center says Tropical Storm Moke has formed in the Pacific Ocean. It is on track to bring another round of heavy rain and wind to Hawaii as residents are still recovering from Hurricane Lala.
