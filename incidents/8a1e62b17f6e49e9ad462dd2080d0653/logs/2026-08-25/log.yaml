log_date: '2026-08-25'
summary: Severe thunderstorms, tornadoes, and flash flooding impacted multiple regions across the United States from August 20–24, 2026. Confirmed tornadoes struck in Atlantic Beach (Long Island), Dover (Delaware), and York/Lancaster counties (Pennsylvania), while prolonged power outages from earlier storms left thousands without electricity in Gary, Indiana, for over a week. Widespread damage from downed trees, damaged homes, and flooding was reported in the Northeast, Mid-Atlantic, Southeast, and Midwest.
