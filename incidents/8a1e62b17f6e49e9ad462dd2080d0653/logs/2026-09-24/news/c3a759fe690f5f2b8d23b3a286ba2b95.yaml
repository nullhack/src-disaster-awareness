title: California declares state of emergency ahead of potentially record El Niño - BNO News
body: California has declared a statewide emergency as a strengthening El Niño threatens severe winter storms, flooding and landslides, according to Governor Gavin Newsom’s office. Newsom signed the proclamation on Monday ahead of the 2026–2027 wet season, ordering agencies to prepare flood supplies, identify vulnerable roads and infrastructure, and accelerate work to protect communities before storms […]
