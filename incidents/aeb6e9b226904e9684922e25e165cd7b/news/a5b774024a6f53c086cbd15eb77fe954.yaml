title: Powerful 7.7 magnitude earthquake strikes Indonesia triggering tsunami warnings
body: New Delhi, Aug. 15 -- A strong, shallow magnitude 7.7 earthquake hit near Ende off Flores Island in eastern Indonesia at 5:58 a.m. local time on August 15, 2026. Indonesia's BMKG issued tsunami warnings and ordered coastal residents to move away from beaches and riverbanks and seek higher ground while authorities closely monitored sea levels.
