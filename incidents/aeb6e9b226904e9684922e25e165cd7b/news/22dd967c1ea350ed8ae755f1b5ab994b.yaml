title: Magnitude 7.7 earthquake strikes off Indonesia's coast, killing at least 47 and toppling buildings
body: A powerful magnitude 7.7 earthquake has struck off Indonesia's coast, killing at least 47 people and causing widespread panic. The quake early Saturday caused buildings to collapse and injured dozens of people. Authorities issued a tsunami warning, later lifted, as no significant sea-level changes were detected. The earthquake also hit the Flores region, triggering landslides and generating small tsunamis. The meteorological agency has recorded at least 235 aftershocks. The quake has caused severe damage and power outages, complicating rescue efforts. Authorities have deployed helicopters and a rescue vessel to support emergency operations.
