title: 7.7 Magnitude earthquake hits off Indonesia's Flores Coast, Tsunami warning issued
body: Indonesia’s meteorological agency, BMKG, continued its tsunami warning for East Nusa Tenggara after the earthquake. The agency said the earthquake’s epicentre was around 38 kilometres northeast of Mbay.
