title: Telkom Indonesia restores all services in East Nusa Tenggara after deadly quake
body: Telkom Indonesia announced on Wednesday that its operating companies have restored all telecoms and digital services in the East Nusa Tenggara (NTT) region following a deadly 7.7 earthquake on the island of Flores on Saturday.
