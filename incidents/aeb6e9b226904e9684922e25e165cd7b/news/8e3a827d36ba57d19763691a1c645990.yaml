title: Thousands await aid after deadly Indonesian quake - Archipelago - The Jakarta Post
body: Thousands of evacuees waited for help Sunday on Flores island in East Nusa Tenggara (NTT) after a powerful earthquake killed 48 people, injured dozens and damaged hundreds of houses and buildings.
