title: Death toll from Indonesia earthquake rises to 47
body: JAKARTA, 16th August, 2026 (WAM) -- The death toll from a 7.7-magnitude earthquake and several strong aftershocks that struck off the coast of Flores Island in eastern Indonesia has risen to 47, the country's National Disaster Management Agency (BNPB) reported.
