title: 'Earthquake in Indonesia: 38 dead and severe damage on Flores Island'
body: Indonesia has been hit by two powerful earthquakes. In Flores, 38 people died and infrastructure was severely damaged. In Sumatra, a magnitude 6.9 tremor struck. The Farnesina is monitoring the situation of 500 Italians on the island of Flores.
