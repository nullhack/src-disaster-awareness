title: No tsunami threat to Sri Lanka following 6.8-magnitude Indonesia earthquake - Breaking News | Daily Mirror
body: The Department of Meteorology has confirmed that there is currently no tsunami threat to Sri Lanka following a 6.8-magnitude earthquake that struck northern Sumatra in Indonesia on Saturday. ..
