title: Magnitude 6.6 earthquake strikes Indonesia’s Java region
body: A 6.6 magnitude earthquake struck near Teluknaga in Indonesia's Northeastern Java province on Friday, according to the US Geological Survey (USGS). The earthquake occurred at 4.23 a.m. local time (2123GMT Friday) at a depth of approximately 358.
