title: A magnitude 7.7 quake off Indonesia has killed at least 47 people
body: A powerful earthquake struck off the coast of Indonesia's Flores Island before dawn on August 15, 2026, collapsing homes, burying villages under landslides and sending residents racing to higher ground as a tsunami warning went out across the eastern archipelago.
