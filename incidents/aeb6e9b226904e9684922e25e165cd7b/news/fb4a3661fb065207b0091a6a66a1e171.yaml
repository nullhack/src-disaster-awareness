title: Indonesia earthquake hits Doi Island with huge 6.2 tremors sparking panic
body: A huge earthquake has hit off the coast of an Indonesian island loved by tourists as 6.2 tremors are recorded.The powerful earthquake struck near Doi Island in Indonesia's North Maluku province on Monday, September 14.
