title: 188,000 Displaced Victims of the East Nusa Tenggara Earthquake Remain (August 30, 2026) | Pusat Data Ekonomi dan Bisnis Indonesia | Databoks
body: The BNPB reported that, as of 7:00 am on Sunday (August 30, 2026), the number of victims displaced by the earthquake in East Nusa Tenggara, Indonesia, reached 188,161 people.
