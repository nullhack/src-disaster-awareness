title: 'Indonesia''s Flores Quake: Nearly 1,000 aftershocks recorded, thousands remain evacuated'
body: 'JAKARTA: (Bernama) Nearly 1,000 aftershocks have been recorded following the magnitude 7.7 earthquake that struck Indonesia''s Flores Island, as the death toll rose to at least 53 and thousands of residents remained at evacuation sites on Sunday (Aug 16).'
