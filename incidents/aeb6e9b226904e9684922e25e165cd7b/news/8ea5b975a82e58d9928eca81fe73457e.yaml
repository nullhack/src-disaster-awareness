title: A magnitude-7.7 quake off Indonesia's Flores killed dozens and shoved the seafloor
body: On Aug. 15, 2026, a magnitude-7.7 earthquake struck off the northern coast of Flores Island in eastern Indonesia, killing dozens of people, displacing thousands more, and sending small tsunami waves onto several nearby coastlines.
