title: NTT earthquake death toll rises to 83 as aftershocks hamper recovery - Archipelago - The Jakarta Post
body: Wijayanto, director of BMKG’s Earthquake and Tsunami Center, said that the agency had recorded 4,258 aftershocks in the region as of Friday morning, with 31 having a magnitude of 5.0 or higher.
