title: Colombia earthquake damaged 40 protected sites and dozens more cultural assets, report finds
body: The Colombian ministry of culture has compiled a preliminary report of damage to cultural sites in the seven departments closest to the 10 August earthquake’s epicentre, and in the Unesco-designated “Coffee Cultural Region”
