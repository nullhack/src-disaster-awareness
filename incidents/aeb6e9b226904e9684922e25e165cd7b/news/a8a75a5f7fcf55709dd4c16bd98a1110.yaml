title: Thousands in Indonesia await aid after quake kills 68, overshadowing Independence Day
body: Thousands of people on Indonesia’s Flores Island are still waiting for aid after a powerful magnitude 7.7 earthquake killed at least 68 people, injured more than 200 and damaged more than 1,300 homes.
