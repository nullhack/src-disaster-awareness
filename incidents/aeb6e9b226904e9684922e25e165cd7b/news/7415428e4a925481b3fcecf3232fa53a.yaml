title: Palace marks Independence Day amid deadly earthquake in Flores - Politics - The Jakarta Post
body: President Prabowo Subianto led the 81st Independence Day ceremony in Jakarta on Monday, as the country marked the occasion amid the aftermath of a deadly earthquake in East Nusa Tenggara (NTT) and unrest during an Aceh peace anniversary event over the weekend.
