title: Canada-Based Diaspora Channels Relief to West Manggarai Earthquake Survivors - RRI.co.id
body: Stepping up recovery efforts long after initial shocks subside, the Indonesian diaspora in Calgary, Canada, has partnered with Dompet Dhuafa to deliver vital humanitarian aid to earthquake survivors in Gulung Turi Hamlet, Kempo Village, West Manggarai Regency, East Nusa Tenggara (NTT).
