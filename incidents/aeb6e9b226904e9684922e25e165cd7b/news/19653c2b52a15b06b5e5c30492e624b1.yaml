title: Magnitude 7.7 earthquake strikes off coast of Indonesia and tsunami warning issued
body: A powerful magnitude 7.7 earthquake struck off the coast of Indonesia early Saturday, damaging buildings and homes, and triggering a tsunami warning. Authorities urged people on affected coastlines to move to higher ground.
