title: 'Indonesia: 3 quakes leave trail of destruction, 47 dead'
body: Indonesia's East Nusa Tenggara province has been severely impacted by three earthquakes, including a powerful 7.7-magnitude tremor, resulting in at least 47 fatalities and extensive damage to homes and public infrastructure, with significant relief efforts now underway.
