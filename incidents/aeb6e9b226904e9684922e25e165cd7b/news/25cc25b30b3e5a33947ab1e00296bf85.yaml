title: Powerful 7.7 magnitude earthquake hits Indonesia, forcing villagers to flee
body: A powerful magnitude 7.7 earthquake struck off the coast of the Indonesian island of Flores Saturday morning, damaging buildings and shocking residents awake, forcing them to flee their homes.
