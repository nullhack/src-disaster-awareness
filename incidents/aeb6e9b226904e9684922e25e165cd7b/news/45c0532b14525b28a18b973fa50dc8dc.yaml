title: 'Double whammy: Second 6.5 quake hits Indonesia as deaths from Flores tremor reaches 38'
body: The double strike highlights Indonesia's position along the Pacific "Ring of Fire," a 40,000-km arc of active fault lines and volcanoes encircling the Pacific Basin. The region experiences roughly 90% of the world's earthquakes.
