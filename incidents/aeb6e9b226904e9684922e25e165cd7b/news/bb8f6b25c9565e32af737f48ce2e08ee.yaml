title: Two earthquakes felt across parts of Java and East Nusa Tenggara
body: 'JAKARTA: Two earthquakes struck waters off Java and East Nusa Tenggara in eastern Indonesia on Monday (Sept 14) morning, with tremors felt across several areas, according to Indonesia''s Meteorology, Climatology and Geophysics Agency (BMKG).'
