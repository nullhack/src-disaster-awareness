title: 'Indonesia earthquake rescue continues as death toll reaches 53Published on: August 17, 2026 11:47 AM'
body: Pakistan, Aug. 17 -- Rescue teams continued searching collapsed buildings in eastern Indonesia on Monday after a powerful earthquake killed at least 53 people. The 7.7-magnitude quake struck East Nusa Tenggara on Saturday.
