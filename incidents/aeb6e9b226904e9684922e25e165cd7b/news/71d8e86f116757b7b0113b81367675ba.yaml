title: Kemenkes deploys 206 medical reserve volunteers to restore healthcare services in post-quake NTT
body: The Health Ministry (Kemenkes) has deployed 206 Health Reserve Force (TCK) volunteers to East Nusa Tenggara (NTT) on Monday (23/8/2026) to fast-track healthcare recovery following a magnitude 7.7 earthquake that struck the Flores Island region.
