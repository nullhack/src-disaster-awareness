title: Earthquake in Indonesia kills 47 | Arkansas Democrat Gazette
body: MAUMERE, Indonesia -- A powerful magnitude 7.7 earthquake struck off the coast of Indonesia early Saturday, killing at least 47 people, collapsing buildings and causing panic in a region prone to deadly quakes. Authorities said dozens more residents were injured and warned that the death toll would almost certainly rise.
