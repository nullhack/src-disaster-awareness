title: Death toll from earthquake in Indonesia climbs to 111, over 176,000 displaced
body: The death toll from the massive earthquake that struck Indonesia earlier this month has risen to 111, while more than 176,000 people remain displaced in East Nusa Tenggara province, Anadolu Agency reports.
