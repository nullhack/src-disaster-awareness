title: Death toll from E. Indonesia earthquake rises to 68
body: The death toll from a 7.7-magnitude earthquake that struck Indonesia's East Nusa Tenggara (NTT) province has risen to 68, the National Disaster Management Agency (BNPB) said Monday.
