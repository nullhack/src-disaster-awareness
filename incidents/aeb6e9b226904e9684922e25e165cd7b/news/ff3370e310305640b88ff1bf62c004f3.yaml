title: 5.7-magnitude quake hits 194 km southwest of Labuan, Indonesia -- USGS
body: BEIJING, Aug. 22 (Xinhua) -- An earthquake with a magnitude of 5.7 jolted 194 km southwest of Labuan, Indonesia at 1741 GMT on Friday, the U.S. Geological Survey said.
