title: Rescuers in Indonesia recover 6 more bodies in earthquake aftermath, raising death toll to 53
body: Rescue teams in eastern Indonesia have recovered six more bodies after a magnitude-7.7 earthquake struck the day before, bringing the death toll to 53.
