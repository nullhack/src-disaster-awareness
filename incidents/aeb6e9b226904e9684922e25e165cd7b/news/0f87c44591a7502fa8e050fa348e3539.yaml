title: Indonesia Flores earthquake survivors await aid as aftershocks hit 1,576 times
body: Thousands on Indonesia's Flores island are still waiting for aid after a deadly earthquake wrecked homes and cut off communities. Relief efforts are battling relentless aftershocks and landslide-hit routes as fear and frustration grow.
