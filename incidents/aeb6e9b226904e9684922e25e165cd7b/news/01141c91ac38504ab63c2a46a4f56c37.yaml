title: Businesses reopen after eastern Indonesia earthquake displaced thousands
body: Grocery stores, gas stations and other businesses have reopened across Indonesia’s Flores island. The reopenings on Wednesday offer early signs of recovery four days after a powerful earthquake killed at least 70 people and injured nearly 1,200.
