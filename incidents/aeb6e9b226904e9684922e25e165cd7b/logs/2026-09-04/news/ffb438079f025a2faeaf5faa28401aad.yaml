title: 'Update on NTT Earthquake Victims: 127 Dead (September 3, 2026) | Pusat Data Ekonomi dan Bisnis Indonesia | Databoks'
body: The BNPB reported that, as of Thursday (3/9/2026) at 9:00 am, there were 127 fatalities due to the earthquake with a magnitude (M) of 7.7 that struck East Nusa Tenggara (NTT).
