log_date: '2026-09-04'
summary: As of September 3, 2026, the death toll from the M7.7 earthquake in East Nusa Tenggara has risen to 127, according to BNPB. Meanwhile, the Indonesian Church is training volunteers for response efforts in Flores, and fact-checkers debunked a viral video falsely claiming that cash linked to a politician was found in the earthquake rubble.
