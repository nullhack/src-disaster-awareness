title: Indonesia says death toll from August 15 earthquake reaches 100
body: JAKARTA, Aug 24 (Reuters) - The death toll from an earthquake that hit eastern Indonesia reached 100 on Monday, the disaster agency chief said, as relief operations continued for a 10th day.
