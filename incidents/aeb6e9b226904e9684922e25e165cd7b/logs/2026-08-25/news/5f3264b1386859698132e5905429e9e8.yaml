title: Catholic groups offer support to Indonesia quake survivors - CathNews
body: 'Indonesia’s Catholic charities and groups have reached out to communities on Flores Island with food, medicines and medical teams to help them recover following 7.7-magnitude earthquake earlier this month. Source: UCA News.'
