log_date: '2026-09-08'
summary: A shallow M5.1 aftershock struck near Ruteng in the Flores Sea, continuing the seismic sequence following the August M7.7 quake. The Ministry of Health deployed 160 reserve health workers to East Nusa Tenggara to strengthen psychosocial and mental health services for earthquake-affected communities. Separately, the Home Affairs Minister urged regional governments to optimize the use of Rp200 billion in allocated earthquake recovery funds.
