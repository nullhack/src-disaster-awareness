title: Two Days After Major 7.7 Magnitude Quake, Indonesia Hit Again By 5.9 Magnitude Shocker
body: A magnitude 5.9 quake struck Indonesia's Flores region days after a 7.7 tremor killed 53 people, injured over 130 and damaged homes and public facilities.
