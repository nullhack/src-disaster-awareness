title: Death toll from Indonesia earthquake rises to 68
body: Jakarta, Aug 17 (IANS) The death toll from a 7.7-magnitude earthquake that struck Indonesia's East Nusa Tenggara (NTT) province has risen to 68, the National Disaster Management Agency (BNPB) said Monday. "The fatalities include 26 in Manggarai regency, 24 in East Manggarai, eight in Nagekeo, four in Sikka, and two each in Ende, West Manggarai and...
