title: Rescuers in Indonesia recover 6 more bodies in earthquake aftermath, raising death toll to 53
body: Rescue teams in eastern Indonesia recovered six more bodies a day after a magnitude 7.7 earthquake. Authorities said Sunday that those bodies raised the death toll to 53.
