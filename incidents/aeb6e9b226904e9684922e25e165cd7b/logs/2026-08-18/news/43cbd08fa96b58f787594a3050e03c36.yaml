title: Indonesia's Flores quake death toll rises to 47 as relief efforts intensify
body: The death toll from the magnitude 7.7 earthquake that struck Indonesia's Flores Island early Saturday has risen to 47, with hundreds of homes and public facilities damaged as authorities mobilised aid to affected areas.
