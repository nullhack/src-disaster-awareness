title: Fresh 5.9 quake hits Indonesia's Flores region; Death toll from earlier 7.7 tremor rises to 54
body: A magnitude 5.9 earthquake struck Indonesia's Flores region early Monday, as the death toll from a powerful 7.7-magnitude earthquake that hit eastern Indonesia days earlier rose to 54, according to the German Research Centre for Geosciences (GFZ) and Indonesia's National Disaster Management Agency (BNPB). The latest earthquake occurred at a depth of around 10 kilometres, with its epicentre initially located at 8.57 degrees south latitude and 121.55 degrees east longitude, as reported by Anadolu News Agency, citing GFZ. The fresh tremor comes days after the magnitude 7.7 earthquake struck six regencies in eastern Flores Island, leaving a trail of destruction across East Nusa Tenggara (NTT) province. According to Xinhua, BNPB chief Suharyanto on Monday said that the death toll from the 7.7-magnitude earthquake had risen to 54, while authorities continued to assess casualties and damage. Rescue teams were providing medical assistance to hundreds of injured people. More than 12,000 people
  had been left homeless as of Sunday, with homes and public facilities damaged in the quake, Xinhua reported. The Meteorology, Climatology and Geophysics Agency said aftershocks were continuing. Authorities have deployed land, sea and air transportation, including 11 aircraft and helicopters, to deliver relief supplies and support evacuation operations in remote areas, including Palue Island in Sikka regency. A field hospital is also being prepared at Golo Dukal Stadium after the earthquake damaged Manggarai Regional Hospital and disrupted local health services, Xinhua reported. Preliminary BNPB data indicated that 157 homes were severely damaged, while 41 suffered moderate damage and 148 sustained light damage. Critical public infrastructure was also impacted, including 87 educational facilities, 18 healthcare centres, six administrative offices and five places of worship. To support relief operations, BNPB has dispatched extensive emergency supplies to the affected region. In Jakarta,
  a major airlift operation was launched from Halim Perdanakusuma Air Force Base to transport 50,000 aid packages weighing 275 tonnes. President Prabowo Subianto oversaw the initial dispatch of 10,500 packages that arrived at the airbase for immediate deployment. Following the initial tremor, the Meteorology, Climatology and Geophysics Agency issued a tsunami early warning, which was lifted at 7
