title: 'Indonesia: Over 8,000 Children Face Disruptions To Education Following Deadly Earthquake - Save The Children'
body: A second 6.9-magnitude earthquake struck off the country’s western island of Sumatra, underscoring Indonesia's vulnerability to seismic activity, being located on the Pacific 'Ring of Fire'.
