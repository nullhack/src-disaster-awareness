title: Search for Indonesia Earthquake Victims Underway on Independence Day
body: Residents of villages in eastern Indonesia hit by a deadly earthquake that killed at least 68 people were awaiting aid on Monday as rescuers combed through collapsed buildings in search of people trapped beneath the rubble.
