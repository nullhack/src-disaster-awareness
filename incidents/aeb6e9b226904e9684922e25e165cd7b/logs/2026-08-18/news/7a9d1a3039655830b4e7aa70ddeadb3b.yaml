title: Emergency crews work to reach Indonesian communities cut off by deadly earthquake
body: Recovery is underway on Indonesia's Flores island after a 7.7 quake killed dozens. Damaged roads and 1,600 aftershocks complicate aid deliveries to residents sleeping outside.
