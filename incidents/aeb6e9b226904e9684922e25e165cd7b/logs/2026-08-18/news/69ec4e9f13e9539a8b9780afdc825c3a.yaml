title: Singapore's PM Wong expresses condolences to Indonesia earthquake victims
body: 'SINGAPORE: Prime Minister Lawrence Wong has written to Indonesia''s President Prabowo Subianto to express his condolences after an earthquake struck off the coast of Flores in eastern Indonesia on Saturday (Aug 15), killing dozens and damaging hundreds of buildings'
