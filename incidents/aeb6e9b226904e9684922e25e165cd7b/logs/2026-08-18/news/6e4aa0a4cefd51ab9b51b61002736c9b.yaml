title: Powerful aftershocks rattle NTT as earthquake death toll climbs to 68 - Archipelago - The Jakarta Post
body: The Meteorology, Climatology and Geophysics Agency (BMKG) data showed that 1,624 aftershocks had struck NTT as of Monday, including 23 with magnitudes above 5.0. The strongest aftershock recorded so far measured magnitude 6.2.
