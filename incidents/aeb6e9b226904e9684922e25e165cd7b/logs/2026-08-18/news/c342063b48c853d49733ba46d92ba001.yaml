title: Earthquake in Indonesia kills 68, overshadowing Independence Day
body: Thousands are still waiting for aid on the Indonesian island of Flores days after a powerful earthquake killed at least 68 people, injured more than 200 others and damaged hundreds of homes and other buildings.
