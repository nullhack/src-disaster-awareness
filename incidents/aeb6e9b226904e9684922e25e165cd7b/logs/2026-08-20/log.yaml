log_date: '2026-08-20'
summary: The death toll from the August 14 earthquake has risen to at least 71, with nearly 60,000 people now taking shelter, and over 12,000 homes reported damaged. A new magnitude 5.7 aftershock struck the Ruteng area, while emergency response and aid distribution continue. Human-interest stories emerged, including the rescue of an 84-year-old woman and a baby born during the quake.
