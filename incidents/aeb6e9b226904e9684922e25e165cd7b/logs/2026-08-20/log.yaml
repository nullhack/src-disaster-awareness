log_date: '2026-08-20'
summary: |-
  The death toll from the August 14 earthquake has risen to at least 71, with nearly 60,000 people now taking shelter, and over 12,000 homes reported damaged. A new magnitude 5.7 aftershock struck the Ruteng area, while emergency response and aid distribution continue. Human-interest stories emerged, including the rescue of an 84-year-old woman and a baby born during the quake.
  As of August 20, the death toll from the M7.7 earthquake has risen to 71, with nearly 60,000 displaced and over 3,000 aftershocks recorded, including a magnitude 5.6 shock that killed one person from severe shock. Relief efforts continue with a Navy hospital ship carrying 70 tons of aid deployed, but aid gaps persist, leading to protests from residents blocking a highway in NTT. Human-interest stories include the rescue of an 84-year-old woman from rubble and a hospital in Ruteng forced to treat patients in tents due to earthquake damage.
