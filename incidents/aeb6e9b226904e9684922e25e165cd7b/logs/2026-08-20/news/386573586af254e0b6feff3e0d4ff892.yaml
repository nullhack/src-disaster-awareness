title: Earthquake in Colombia endangers evidence linked to the armed conflict
body: Two skeletons and nine bags containing military clothing have been discovered in the town of Roldanillo, raising questions about possible links to the ‘false positives’ scandal. At least five other cemeteries have been affected by the August 10 quake
