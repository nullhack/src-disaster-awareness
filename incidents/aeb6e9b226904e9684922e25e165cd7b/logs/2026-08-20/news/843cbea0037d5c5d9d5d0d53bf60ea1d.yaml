title: Govt urged to expedite NTT earthquake recovery - Society - The Jakarta Post
body: Nearly 60,000 people are still taking shelter across the quake-hit regions, with the province facing potential threats from aftershocks that can crumble buildings and other structures already damaged in the initial earthquake on Aug. 15, according to seismologists.
