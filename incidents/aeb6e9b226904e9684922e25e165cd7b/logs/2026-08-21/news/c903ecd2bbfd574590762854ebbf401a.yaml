title: Flores tourism moves toward recovery despite ongoing overland disruptions | TTG Asia
body: Tourism in Flores is gradually recovering following the August 15 earthquake, with Labuan Bajo and the main Komodo National Park circuit back in operation, although several inland destinations and transport links remain disrupted.
