title: Colombia declares emergency in earthquake-hit regions
body: 'Bogota, Aug 20: Colombian President Abelardo de la Espriella has signed a decree declaring a 30-day state of economic, social and ecological emergency in parts of the country hit by the August 10 earthquake. The decree, signed after a cabinet meeting in Bogota on Wednesday (local time), covers 15 affected departments, including Valle del Cauca,…'
