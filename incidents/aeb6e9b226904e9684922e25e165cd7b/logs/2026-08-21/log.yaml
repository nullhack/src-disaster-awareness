log_date: '2026-08-21'
summary: As of August 21-22, a magnitude 5.0 aftershock struck 63 km northwest of Ende, while tourism in Flores begins to recover with Labuan Bajo and Komodo National Park back in operation, though inland overland disruptions persist. The Indonesian Navy has deployed five warships to support relief efforts, and the government has yet to open the door to foreign aid, appreciating condolences but not accepting international assistance at this time.
