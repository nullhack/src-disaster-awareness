log_date: '2026-08-28'
summary: The death toll from the August 14 M7.7 earthquake remains at 111 with over 176,000 displaced. New developments include the Transmigration Ministry allocating Rp200 million to repair a damaged madrasah in West Manggarai, the Palestinian Embassy distributing humanitarian aid to East Nusa Tenggara, and the Health Ministry establishing inflatable field hospitals to ensure safe surgical operations. Additionally, a viral video of giant waves was confirmed to be from Portugal, not Indonesia's tsunami.
