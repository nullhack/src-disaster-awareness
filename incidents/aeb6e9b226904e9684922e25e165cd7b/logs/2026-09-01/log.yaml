log_date: '2026-09-01'
summary: Two weeks after the M7.7 earthquake, East Nusa Tenggara faces worsening hunger and drought conditions exacerbated by Super El Niño, according to a Nikkei Asia report. A magnitude 5.5 aftershock on August 31 extended the sequence to 9,765 events, with engineering analysis warning that damaged homes now face a disproportionate collapse risk. Meanwhile, the Primary and Secondary Education Ministry reports that multi-stakeholder support is accelerating post-quake education recovery in the affected region.
