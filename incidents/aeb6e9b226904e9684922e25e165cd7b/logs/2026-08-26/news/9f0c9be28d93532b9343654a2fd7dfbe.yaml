title: Kemenkes Establishes Field Hospitals in Ruteng, Aeramo to Support Post-Earthquake Services in NTT
body: The Health Ministry (Kemenkes) established two field hospitals at Ruteng General Hospital (RSUD) in Manggarai regency and RSUD Aeramo in Nagekeo regency. The setup of these emergency facilities aims to ensure readiness for medical services while supporting the recovery of healthcare facilities following the 7.7-magnitude earthquake that struck East Nusa Tenggara (NTT) last Saturday.
