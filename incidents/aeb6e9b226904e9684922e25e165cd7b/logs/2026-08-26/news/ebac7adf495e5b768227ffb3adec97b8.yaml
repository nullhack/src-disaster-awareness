title: Number of Displaced Persons Following NTT Earthquake Reaches 179,000 (August 26, 2026) | Pusat Data Ekonomi dan Bisnis Indonesia | Databoks
body: The number of refugees from the 7.7 magnitude earthquake in East Nusa Tenggara (NTT), Indonesia, reached 179,037 as of Wednesday (26/8/2026) at 9:00 am local time.
