title: 'Three earthquakes in a day: Indonesia suffers a magnitude 6.2 quake that strikes North Maluku, tremors felt as far as Manado; earlier, two in Java'
body: A magnitude 6.2 earthquake struck waters off North Maluku in eastern Indonesia on Monday evening, sending tremors across parts of the province and as far as Manado in neighbouring North Sulawesi.
