title: Magnitude 7.7 earthquake strikes off Indonesia's coast, toppling buildings and killing at least two
body: 'MAUMERE, Indonesia: (AP) A powerful magnitude 7.7 earthquake struck off the coast of Indonesia early Saturday (Aug 15), collapsing buildings and homes, killing at least two people and causing panic in a region prone to deadly quakes.'
