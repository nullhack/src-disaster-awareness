title: At least 38 dead after Indonesia's magnitude-7.7 earthquake, officials say
body: JAKARTA, Aug 15 (Reuters) - At least 38 people died after an earthquake of magnitude 7.7 and dozens of aftershocks struck off eastern Indonesia on Saturday, officials said, as rescue workers rushed to reach areas closest to the epicentre.
