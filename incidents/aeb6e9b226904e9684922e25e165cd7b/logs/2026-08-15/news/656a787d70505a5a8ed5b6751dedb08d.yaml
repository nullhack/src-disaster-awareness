title: Magnitude 7.7 earthquake strikes off Indonesia's coast, killing at least 38
body: A powerful magnitude 7.7 earthquake struck off the coast of Indonesia early Saturday, killing at least 38 people, collapsing buildings as well as causing panic in a region prone to deadly quakes.
