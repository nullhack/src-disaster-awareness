title: 'Indonesia Earthquake: Powerful 7.7 Magnitude Quake Strikes Flores, Kills At Least 38; Tsunami Warning Later Lifted | VIDEO'
body: A magnitude 7.7 earthquake struck Indonesia’s Flores region early Saturday, killing at least 38 people and injuring more than a dozen. Landslides, building collapses and power outages disrupted rescue operations. Authorities briefly issued a tsunami warning for several provinces before lifting it after detecting no significant sea-level changes.
