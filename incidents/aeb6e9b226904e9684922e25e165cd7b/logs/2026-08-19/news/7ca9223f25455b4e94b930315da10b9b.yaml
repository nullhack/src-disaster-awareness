title: At least 5 dead after powerful 7.7 earthquake hits Indonesia's Flores island
body: At least five people were killed after a powerful magnitude 7.7 earthquake hit off the coast of Indonesia's Flores Island on Saturday morning. CNN reported the confirmed death toll, citing updates from Provincial Police Chief Rudi Darmoko to regional media. The main tremor struck around 6 AM local time roughly 68 kilometres northwest of Ende in East Nusa Tenggara province and was followed by a series of aftershocks, CNN reported, citing data from the US Geological Survey (USGS). The USGS estimated that about 500,000 people were exposed to very strong or severe shaking, which damaged buildings and shocked residents awake, forcing them to flee their homes. Indonesia's national disaster mitigation agency, BNPB, noted that an initial tsunami warning was triggered following the quake but was later lifted. The agency added that about 2,000 residents in the Nagekeo regency evacuated as a precautionary measure. Early damage assessments from BNPB indicate that around 15 buildings, including
  personal homes and government offices, sustained damage, CNN reported. The developments follow a massive earthquake of magnitude 7.4 that jolted Indonesia early on Saturday, according to the National Centre for Seismology (NCS). The earthquake occurred at a depth of 49 km, the NCS said in a post on X."EQ of M
