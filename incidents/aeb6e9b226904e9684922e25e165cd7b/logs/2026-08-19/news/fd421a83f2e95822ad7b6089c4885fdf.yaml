title: Videos from Philippines, Taiwan tremors falsely linked to Indonesian earthquake
body: Indonesia's eastern Flores island was rocked by a powerful 7.7-magnitude earthquake that struck on August 15, 2026, but videos circulating on social media purportedly showing the impact of the deadly tremor in fact predate the quake.
