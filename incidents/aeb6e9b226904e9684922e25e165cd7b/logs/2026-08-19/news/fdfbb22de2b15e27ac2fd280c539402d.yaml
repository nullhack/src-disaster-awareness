title: Twin quakes hit Indonesia
body: 'JAKARTA, Aug 18: Indonesia was shaken by two powerful earthquakes within hours of each other on Saturday, leaving communities across the archipelago frightened and struggling to cope with the destruction. A 6.1-magnitude tremor struck off Nias Island in North Sumatra, while thousands of people on Flores continued to struggle with the devastation and trauma caused…'
