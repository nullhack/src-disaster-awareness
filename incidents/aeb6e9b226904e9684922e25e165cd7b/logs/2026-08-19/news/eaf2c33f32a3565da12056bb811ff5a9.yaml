title: NTT quake survivors await aid as tremors continue - Archipelago - The Jakarta Post
body: Four days after a powerful earthquake struck East Nusa Tenggara (NTT), residents in remote parts of East Manggarai were still waiting for assistance on Tuesday, with many sleeping in makeshift tents as continuing aftershocks kept them away from their damaged homes.
