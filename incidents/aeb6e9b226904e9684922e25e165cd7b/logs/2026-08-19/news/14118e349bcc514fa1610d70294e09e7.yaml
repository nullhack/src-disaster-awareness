title: Fear grips children after deadly earthquake in eastern Indonesia leaves thousands displaced
body: Thousands of people are still displaced on Indonesia’s Flores island, three days after a magnitude 7.7 earthquake killed at least 70 people, injured nearly 1,200 and damaged about 12,000 homes
