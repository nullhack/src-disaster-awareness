log_date: '2026-09-10'
summary: A 5.2 magnitude earthquake struck Flores on September 8, continuing the aftershock sequence after the August 14 M7.7 quake. The Indonesian government is guaranteeing the continuation of higher education for university students affected by the disaster. Meanwhile, the East Nusa Tenggara administration plans to tighten security at evacuation shelters following an alleged sexual assault of an earthquake survivor.
