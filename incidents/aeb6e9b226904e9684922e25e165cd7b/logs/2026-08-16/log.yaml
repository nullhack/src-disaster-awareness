log_date: '2026-08-16'
summary: The death toll from the August 14 M7.7 earthquake off Flores, Indonesia, has risen to at least 47, with rescue teams struggling to reach remote communities due to landslides and damaged infrastructure. Hundreds of personnel have been deployed for search and recovery, while aftershocks and a separate 6.4 quake elsewhere in Indonesia caused additional panic. Authorities warn the toll may increase as communications are restored in cut-off areas.
