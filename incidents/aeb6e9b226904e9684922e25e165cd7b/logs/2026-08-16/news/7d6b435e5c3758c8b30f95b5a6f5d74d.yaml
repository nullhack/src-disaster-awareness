title: Dozens dead and hundreds flee after powerful earthquake hits Indonesia
body: A powerful magnitude 7.7 earthquake struck off the coast of the Indonesian island of Flores Saturday morning, killing at least 38 people, damaging buildings and forcing residents to flee their homes.
