title: Search for Indonesia earthquake victims underway on Independence Day
body: By Ananda Teresia and Stanley Widianto ENDE, Indonesia, Aug 17 (Reuters) - Residents of villages in eastern Indonesia hit by a deadly earthquake that killed at least 68 people were awaiting aid on Monday as rescuers combed through collapsed buildings in search of people trapped beneath the rubble.
