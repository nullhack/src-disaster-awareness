log_date: '2026-10-24'
summary: Subsequent reports indicate the earthquake swarm included up to 36 tremors, with some sources citing at least 60 seismic events over the past week. The first quake, magnitude 3.3, struck at 11:40 a.m., and evacuations extended to Messina in addition to Palermo. Some reports listed the strongest tremor as magnitude 5.5 or 5.0, differing from earlier estimates.
