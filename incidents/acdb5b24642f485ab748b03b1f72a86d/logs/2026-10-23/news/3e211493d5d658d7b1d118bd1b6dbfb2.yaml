title: 'Ιταλία: Σεισμικός συναγερμός στη Σικελία – Δονήσεις έως 5,7 Ρίχτερ, προειδοποίηση για τσουνάμι και εκκενώσεις σχολείων'
body: Σεισμικός συναγερμός σήμανε στη νότια Ιταλία έπειτα από αλλεπάλληλες ισχυρές δονήσεις στο Τυρρηνικό Πέλαγος ανοιχτά της Σικελίας, με την ισχυρότερη να φτάνει τα 5,7 Ρίχτερ κοντά στις Αιολίδες Νήσους. Οι τοπικές Αρχές προχώρησαν σε προληπτικές εκκενώσεις σχολείων και δημόσιων κτιρίων στο Παλέρμο και την Μπαγκερία, ενώ παράλληλα εκδόθηκε πορτοκαλί προειδοποίηση για πιθανό τσουνάμι στις παράκτιες περιοχές. Μέχρι τις πρώτες απογευματινές ώρες δεν είχαν καταγραφεί τραυματισμοί ή σοβαρές υλικές ζημιές, με τις υπηρεσίες Πολιτικής Προστασίας να παραμένουν σε ετοιμότητα.
