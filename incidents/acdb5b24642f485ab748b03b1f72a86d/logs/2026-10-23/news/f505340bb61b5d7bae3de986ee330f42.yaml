title: Σειρά σεισμών έως 5,7R ταρακούνησαν τη Σικελία - Στους δρόμους οι κάτοικοι του Παλέρμο, εκκενώθηκαν σχολεία | in.gr
body: Οι σεισμικές δονήσεις στη Σικελία σημειώθηκαν από τις 12:51 μέχρι τις 13:17 ώρα Ελλάδας στη θαλάσσια περιοχή βόρεια του νησιού, με τις ισχυρότερες να γίνονται ιδιαίτερα αισθητές στο Παλέρμο
