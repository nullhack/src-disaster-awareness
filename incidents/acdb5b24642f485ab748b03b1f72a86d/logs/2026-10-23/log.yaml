log_date: '2026-10-23'
summary: A sequence of at least 12 earthquakes, ranging from 4.3 to 5.7 in magnitude, struck the Tyrrhenian Sea off the coast of Sicily, Italy, on 23 October 2026. The strongest tremor, measuring 5.7, occurred near the Aeolian Islands, prompting authorities to issue an orange tsunami alert and evacuate schools and public buildings in Palermo and Bagheria. No injuries or major structural damage were reported.
