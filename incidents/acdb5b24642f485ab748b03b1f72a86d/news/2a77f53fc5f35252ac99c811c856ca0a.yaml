title: Tsunami alert issued after swarm of nearly 3 dozen earthquakes rattle the Tyrrhenian Sea off the Italian coast
body: Palermo, the capital of Sicily, and other cities in southern Italy were rocked by a series of earthquakes in the Tyrrhenian Sea Friday, including a magnitude 5.7 quake, according to USGS.
