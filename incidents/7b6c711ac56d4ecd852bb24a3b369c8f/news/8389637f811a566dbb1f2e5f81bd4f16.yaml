title: Iran Targets US Forces Three Times In Five Days. US Naval Presence Surpasses War's Peak, Report Says.
body: Iran has targeted US military facilities in Bahrain three times in five days, ending a roughly two-month lull in attacks. An Israeli security institute says America's naval presence in the Middle East now exceeds levels seen during the war's opening phase.
