title: Crude Oil Prices Edge Higher on Fears of Escalation in US-Iran Conflict
body: December WTI crude oil (CLZ26 ) is up +1.23 (+1.48%) today, and December RBOB gasoline (RBZ26 ) is up +0.0331 (+1.33%). Crude oil and gasoline prices are moving higher amid fears of escalation in the US-Iran conflict, which could further disrupt energy supplies from the Middle East. Crude prices fell...
