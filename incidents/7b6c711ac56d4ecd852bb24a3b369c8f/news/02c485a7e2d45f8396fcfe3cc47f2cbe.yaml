title: Trump condemns CBS News' '60 Minutes' following investigative report broadcast examining military preparedness and casualties during Iran conflict
body: President Donald Trump criticized CBS News and its flagship program "60 Minutes" on Monday, following the broadcast of an investigative report examining U.S. military preparedness and casualties during the conflict with Iran.
