log_date: '2026-11-18'
summary: |-
  Ukrainian forces struck the Crimean Bridge ahead of a planned Trump-Putin meeting, while Ukrainian paratroopers reportedly converted a Land Rover into a remote-controlled vehicle for missions near Sloviansk. US political figures clashed over the Iran war, with VP Vance vowing no long-term commitment and Rep. Khanna proposing $1,700 refund checks for families, and an ADNOC L&S vessel was attacked near Hormuz, leaving one crew member missing and 11 injured. Saudi-backed forces in Yemen bolstered defenses near Aden as Houthis claimed an airstrike on a sponge factory killed at least seven, and DR Congo peace efforts failed to halt violence in the east.
  Iran widened its attacks on Gulf neighbors by targeting a U.S. air base in Kuwait and sites in Bahrain following American strikes on Qeshm Island. Saudi Arabia also intercepted a cruise missile fired by Iran-backed Houthi rebels after Saudi-led airstrikes that the Houthis say killed at least 17 people. Separately, El Salvador’s president confirmed and celebrated an attack on the home of a key Haitian gang leader.
