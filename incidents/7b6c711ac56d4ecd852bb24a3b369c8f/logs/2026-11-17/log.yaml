log_date: '2026-11-17'
summary: 'Reports dated November 17, 2026 described escalating Iran-US tensions: Iran allegedly targeted US military facilities in Bahrain three times in five days, US naval presence reportedly surpassed the war’s peak, and US officials said they were taking an alleged Iranian dirty/chemical bomb threat against Trump officials seriously. Separately, Sudan and Ethiopia accused each other of backing armed groups, Ukraine reported an attack on the Kerch Bridge, Saudi-backed forces reinforced Aden against Houthis, and Lebanon saw calls for a consolidated Israel-Hezbollah ceasefire.'
