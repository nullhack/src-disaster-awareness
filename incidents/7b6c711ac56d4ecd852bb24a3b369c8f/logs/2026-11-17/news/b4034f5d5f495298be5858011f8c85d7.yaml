title: Conflict and disease outbreaks deepen DR Congo’s hunger crisis as record numbers are projected to face acute food insecurity
body: FAO, WFP, UNICEF and WHO call for urgent action as acute hunger is projected to hit more than 30 million, including 4.2 million people facing Emergency levels of hunger in early 2027.
