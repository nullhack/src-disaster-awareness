title: Iranian leaders fret over public mood as gas shortages add to war ills
body: Iran shows no sign of making concessions in the war with the US, but its warnings to citizens of gas shortages this winter are the latest sign of its own vulnerabilities in the conflict, with its ports blockaded and infrastructure hammered by US strikes.
