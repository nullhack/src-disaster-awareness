log_date: '2026-11-19'
summary: |-
  The International Energy Agency, in its most comprehensive analysis of the war's fallout, said the Middle East conflict has caused the biggest disruption ever to global oil and gas trade and could cut world oil demand by more than 4% by 2035 if governments accelerate electrification. GlobalData reported that the Iran conflict is reshaping global LNG trade, with the United States positioned to benefit the most. Commercial shipping through the Strait of Hormuz faces Iranian restrictions, tanker attacks and a US naval blockade, with a $64 million insurance claim underscoring the war's impact on maritime security and oil shipments.
  Senate Republicans again blocked a Democratic-backed Iran war powers resolution directing President Trump to withdraw U.S. troops from the conflict. An AP analysis found that Iran’s attacks on bases caused billions of dollars in damage, with war costs surpassing $48B, while APEC coverage reported that Trump, Xi and Putin issued a peace declaration with the Iran and Ukraine wars on the agenda.
