log_date: '2026-11-13'
summary: Heavy rain and flooding in Corsica on November 6 caused two deaths when a vehicle was swept away. On November 12, France issued yellow weather warnings across 22 departments for heavy rain, thunderstorms, and strong winds. Separately, Storm Charles brought flooding to Madeira and Portugal, resulting in over 300 incidents, 8,000 school closures, and hundreds of flight cancellations.
