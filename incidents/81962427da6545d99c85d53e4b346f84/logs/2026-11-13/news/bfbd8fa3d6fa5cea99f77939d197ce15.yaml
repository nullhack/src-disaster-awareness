title: Two die in Corsica floods amid heavy rain
body: PARIS, Nov 6 (Reuters) - Two people died when their vehicle was swept away in flooding caused by heavy rain on the French island of Corsica, the interior minister said on Friday. • Interior Minister Laurent Nunez said a 40-year-old woman was rescued • One of the firefighters who had responded to the incident was taken to the hospital and was being treated for hypothermia,
