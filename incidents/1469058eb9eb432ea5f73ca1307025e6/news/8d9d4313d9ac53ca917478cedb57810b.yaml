title: Georgia extends flood emergency as McCaysville lifts curfew and reopens road to Tennessee
body: McCaysville has lifted its overnight curfew and reopened the road to Copperhill, Tennessee, as North Georgia continues to recover from severe flooding. Gov. Brian Kemp extended the flood emergency for four counties by another week.
