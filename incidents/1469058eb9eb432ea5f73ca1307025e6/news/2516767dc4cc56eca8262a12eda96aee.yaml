title: Tropical Storm Rachel is behaving in unusual ways. What that means for SoCal this weekend
body: Tropical Storm Rachel is expected to make landfall either in northern Baja California or San Diego County as early as Saturday night, bringing with it a slew of potential hazards, including damaging coastal flooding.
