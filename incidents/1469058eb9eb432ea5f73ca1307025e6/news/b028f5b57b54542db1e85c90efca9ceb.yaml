title: Gov. Kemp declares emergency after record flooding devastates Georgia towns
body: Catastrophic flooding swept through McCaysville, Georgia, and neighboring Copperhill, Tennessee, early Thursday, Nov. 5, prompting dozens of rescues and leaving homes, businesses and roads submerged.
