title: 'BREAKING: Franklin County orders mandatory evacuation ahead of Isaias, bringing storm surge and flooding'
body: Franklin County residents in barrier islands, mobile homes, and low-lying areas must evacuate by noon today as Isaias threatens 5-10 inches of rain and up to 6 feet of storm surge.
