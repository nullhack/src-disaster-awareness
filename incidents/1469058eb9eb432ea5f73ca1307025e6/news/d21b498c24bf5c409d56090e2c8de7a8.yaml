title: Residents queue overnight for Bangkok flood relief payments
body: BANGKOK — Residents queued outside district offices from late at night and before dawn to register for flood relief payments, with one Bangkok district reportedly reaching its daily limit by 06:30. At Lat Krabang District Office, a post in the “Lat Krabang Incidents” Facebook group said all 600 registration slots had been filled by 06:30.
