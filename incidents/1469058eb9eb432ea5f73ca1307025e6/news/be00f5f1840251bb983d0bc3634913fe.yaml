title: Four Corners braces for more flooding
body: The National Weather Service issued a flood watch Sunday for much of the Four Corners region. The meeting point of Arizona, Colorado, New Mexico and Utah has seen unusually heavy rain since last Wednesday, with surging rivers, flooded homes and forced water rescues.
