title: 4 dead from storm as Isaias brings threat of floods across the Southeast – WTOP News
body: Isaias roared onto the Florida Panhandle, ripping roofs off homes and condominiums, before it moved north Saturday, bringing torrential rain and the threat of flash floods and tornadoes across the Southeast.
