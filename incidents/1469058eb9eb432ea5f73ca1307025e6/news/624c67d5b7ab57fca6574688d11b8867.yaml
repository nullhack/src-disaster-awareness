title: Flood warning lingers in Four Corners as soaked towns face sewage-tainted waters. 1 death reported
body: Parts of the Southwest's Four Corners region remained under a flood warning Monday as some saturated neighborhoods began cleaning up, assessing damage and watching out for water that could be contaminated with chemicals and raw sewage.
