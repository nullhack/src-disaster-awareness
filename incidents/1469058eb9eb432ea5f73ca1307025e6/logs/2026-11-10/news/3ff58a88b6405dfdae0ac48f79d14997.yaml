title: Edgewater neighbors who lost homes to flooding back proposed 27th Street drainage project
body: Two Edgewater neighbors who lost nearly everything to flooding say their homes escaped the latest heavy rains this week. But the experience remains fresh—and they support a proposed drainage project they hope could help protect the area.
