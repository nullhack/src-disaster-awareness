log_date: '2026-11-10'
summary: Flood recovery continues in Florida as the St. Johns River rises and Lake Monroe threatens Sanford, while Edgewater neighbors back a drainage project. In Arizona, horses are rescued from Camp Verde flooding, and an uninsured Colorado man struggles after the floods. New flash flood warnings are issued in South Texas, and high surf raises flood risk in Southern California, while separate flood events hit Pakistan (protective bund breach) and Gaza (tent shelters inundated). Malaysia also reports 422 evacuees remaining from recent floods.
