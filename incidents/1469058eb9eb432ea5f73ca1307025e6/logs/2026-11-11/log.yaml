log_date: '2026-11-11'
summary: |-
  In Pagosa Springs, Colorado, floodwaters tore a nearly new home from its foundation during the recent flooding. NASA reported that heavy rain in the Southwest rapidly raised water levels in New Mexico’s Navajo Reservoir. Additionally, flood warnings remain in Valley areas, prompting homeowners to check their property’s flood risk.
  Flood risk persists in San Antonio with 1–3 more inches of rain possible. Rescue teams in Nepal continue searching for survivors in mud-filled tunnels. In Florida, an estimated 20,000 buildings were impacted by recent floodwaters. Gaza is assessing damage as floods subside, with charities warning over 940,000 displaced people in flood-prone areas, while Malaysia still hosts 1,325 evacuees in relief centres. Additionally, a lawsuit has been filed over a girl’s death in last year’s Hill Country flood in Texas.
