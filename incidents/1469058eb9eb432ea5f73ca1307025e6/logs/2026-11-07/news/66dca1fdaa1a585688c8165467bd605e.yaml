title: Nearly 25 inches of rain reported in Brevard County as historic rainfall floods Central Florida
body: A slow-moving weather system dumped more than two feet of rain in parts of Brevard County over several days, triggering widespread flooding and flash flood emergencies across Central Florida and the Treasure Coast, according to preliminary National Weather Service reports.
