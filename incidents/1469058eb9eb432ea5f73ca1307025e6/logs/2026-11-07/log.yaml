log_date: '2026-11-07'
summary: 'Flood recovery continues across multiple regions: southwestern Colorado faces ongoing major highway closures and detours, while Georgia and Tennessee deal with depleted water supplies and a state of emergency. New impacts include nearly 25 inches of rain in Brevard County, Florida, and flooded roads in Norfolk and Portsmouth, Virginia from the same storm system. Additionally, Natural Grocers launched a fundraising campaign for Red Cross flood relief in Four Corners states, and an Arizona horse owner was charged after flood-related animal deaths.'
