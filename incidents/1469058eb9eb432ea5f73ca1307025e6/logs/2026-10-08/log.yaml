log_date: '2026-10-08'
summary: Hurricane Isaias approaches the Gulf Coast, prompting mandatory evacuations in Florida and Alabama, with flood watches and warnings issued across the region. Demolitions begin for homes damaged by the Rock Valley flood, while coastal flood advisories are active in Northern California and Hampton Roads prepares for king tide flooding. Other flood-related news includes a legal case over a Boulder mitigation project and a dispute in Nepal over electricity billing for destroyed homes.
