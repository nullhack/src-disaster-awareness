log_date: '2026-10-18'
summary: A nor'easter brought powerful winds and flooding to Sea Bright, New Jersey, and Freeport, Long Island, while also intensifying along the North Carolina coast, prompting evacuation warnings for the Outer Banks. Super Typhoon Champi passed near Guam with extremely dangerous winds, leading to a local emergency declaration. New flood events include evacuations in Malaysia, flood risk in California from Hurricane Trudy's moisture, and residents queueing for flood relief in Bangkok as Thailand braces for heavy rain.
