title: Super Typhoon Champi passes near Guam with ‘extremely dangerous’ winds | Honolulu Star-Advertiser
body: A powerful storm named Super Typhoon Champi passed near Guam early Saturday, bringing powerful winds that the National Weather Service called “extremely dangerous” and “life-threatening.”
