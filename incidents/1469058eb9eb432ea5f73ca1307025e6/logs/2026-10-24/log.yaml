log_date: '2026-10-24'
summary: |-
  Flash flood warnings were issued for Washington County, Utah, with evacuations ordered in the town of Hurricane. Storm Austen prompted travel warnings across Scotland as heavy rain and wind disrupted roads, rail, and ferries. Former Josephine brought heavy rain and coastal flooding threats to Florida’s east coast.
  The San Juan River rose to 15 feet, causing flooding in Pagosa Springs and parts of Southwest Colorado, where roads and sewer infrastructure were damaged. An emergency disaster declaration was issued for Archuleta and La Plata counties. On the Navajo Nation, the floodwaters stranded families and forced rescues as the river approached major flood stage near Shiprock.
