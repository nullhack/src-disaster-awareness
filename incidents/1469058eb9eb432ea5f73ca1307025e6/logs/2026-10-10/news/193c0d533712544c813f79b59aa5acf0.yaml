title: First Alert Weather Days, stormy weekend ahead; flood watch - Local News 8
body: Breezy conditions for Friday evening, ahead of low pressure from the northwest and moisture from the south. The National Weather Service has issued a Flood Watch for eastern Idaho, with expected rainfall amounts reaching over an inch. For Saturday, there is a chance of rain and thunderstorms. Partly to mostly cloudy skies, with high temperatures
