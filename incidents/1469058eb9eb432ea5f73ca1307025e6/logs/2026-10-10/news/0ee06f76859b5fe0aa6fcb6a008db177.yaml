title: 'Tough to stay here’: Nepal flood survivors wait for homes - Taipei Times'
body: Every day, Shanti Dangol stares down at Nepal’s Trishuli River from her makeshift shelter, searching for traces of the home she lost and wondering when she will have a roof over her head again.Dangol is among hundreds of people living in tent shelters following a catastrophic Himalayan flood trigger
