log_date: '2026-10-10'
summary: Hurricane Isaias made landfall near Destin, Florida as a Category 2 storm, weakening to Category 1 as it pushed inland, causing widespread power outages in Alabama and triggering flood watches for Georgia and Jacksonville. Remnants of Tropical Storm Rachel spread across the West, bringing flash flood risks to Las Vegas and rain to Arizona, while a flood watch was issued for eastern Idaho. Separately, months after a Himalayan flood, survivors in Nepal remain in tent shelters awaiting reconstruction.
