log_date: '2026-10-21'
summary: A Pacific storm is approaching Southern California, prompting flood watches for the region. Flash flood warnings have been issued for Zion National Park in Utah, while a strengthening nor'easter threatens the East Coast with damaging winds and coastal flooding, leading to a coastal flood advisory for Long Island. Additionally, flooding in Nasarawa State, Nigeria, has submerged 18 communities and killed two people.
