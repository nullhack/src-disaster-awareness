title: Flood submerges 18 Nasarawa communities, kills two
body: By Edwin Philip, Lafia The Nasarawa State Government has urged residents of flood-prone communities to heed warnings to relocate from low-lying areas to higher ground to avoid being swept away by recurring floods. The Commissioner for Information, Culture and Tourism, Dr Nawani Aboki, made the appeal on Monday while briefing journalists on the recent flooding […]
