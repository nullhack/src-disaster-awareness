title: Coastal flood advisory in place for Southern Monterey Bay and Big Sur Coast until Monday afternoon
body: On Wednesday at 10:05 a.m. an updated coastal flood advisory was issued by the National Weather Service in effect until Monday Nov. 9, at 1 p.m. for Southern Monterey Bay and Big Sur Coast.
