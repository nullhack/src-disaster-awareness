log_date: '2026-11-04'
summary: The southwest Colorado flooding is described as a 1-in-1,000-year extreme rainstorm, with Gov. Jared Polis providing updates on road damage and voting access while seeking a major disaster declaration. The San Juan River is expected to rise again in Utah, and flood warnings linger in Arizona due to upstream water releases. A coastal flood advisory remains in effect for Southern Monterey Bay and Big Sur Coast through early November.
