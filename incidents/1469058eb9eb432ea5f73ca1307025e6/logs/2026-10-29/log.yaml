log_date: '2026-10-29'
summary: 'The San Juan River flood aftermath continues, with families in Bluff, Utah, cleaning up damage and a search-and-rescue leader advocating for better coordination in the Navajo Nation response. New flood events are also hitting multiple regions: king tides inundate streets and homes in Florida, the Carolinas, and California, prompting coastal flood advisories in Orange and Marin Counties; a storm drenches Central California, flooding neighborhoods; and flood watches are extended across Hawaii. The IRS has extended tax deadlines for Texas counties affected by prior flooding.'
