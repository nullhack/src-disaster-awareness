title: Search-and-rescue leader calls for better coordination in Navajo Nation flood response - Navajo Times
body: Bernadine Beyale, the founder and executive director of 4 Corners K9 Search and Rescue, said the Navajo Nation needs regular public updates and a central shelter list to help families displaced by San Juan River flooding locate relatives and find assistance.
