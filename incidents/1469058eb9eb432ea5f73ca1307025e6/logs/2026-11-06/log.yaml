log_date: '2026-11-06'
summary: Flooding in Florida continues with a fatal drowning in Palm Bay, where victims are seeking insurance and cleanup help, while St. Lucie County surveys damage and U‑Haul offers free storage. A state of emergency was declared for Georgia‑Tennessee flooding, and flash‑flood warnings were issued in New Jersey and Virginia. Coastal flood advisories affect San Francisco, and flood victims in Malaysia’s Selangor region have risen to 1,253.
