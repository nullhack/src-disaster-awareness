title: Gov. Polis requests major presidential disaster declaration for southwestern Colorado flood recovery
body: Gov. Jared Polis on Saturday announced he has formally requested an expedited major disaster declaration from President Donald Trump through FEMA to support recovery from devastating flooding and debris flows in southwestern Colorado.
