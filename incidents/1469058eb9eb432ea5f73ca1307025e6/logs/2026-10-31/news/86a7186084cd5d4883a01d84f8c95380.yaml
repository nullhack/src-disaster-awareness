title: Coastal flood advisory issued for North Bay and San Francisco Peninsula Coast until Saturday evening
body: Coastal North Bay including Point Reyes National Seashore and San Francisco Peninsula Coast were placed under an updated coastal flood advisory by the National Weather Service on Saturday at 4:45 a.m. The advisory is in effect until 6 p.m.
