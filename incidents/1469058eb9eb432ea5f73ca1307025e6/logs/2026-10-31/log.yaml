log_date: '2026-10-31'
summary: Coastal flooding from record-breaking high tides inundated parts of Southern California, while flash floods killed one person in Las Vegas and prompted water rescues in both the Las Vegas valley and the Phoenix area. In the Four Corners region, Archuleta County residents were asked to report flood damage and Governor Polis requested a major disaster declaration for southwestern Colorado flood recovery. Additional flood-related developments include Odisha proceeding with exams amid Cyclone Arnab floods, Bhutan managing a glacial lake outburst, and Texas flood survivors becoming eligible for FEMA assistance.
