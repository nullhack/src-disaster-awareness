log_date: '2026-10-14'
summary: A Women's Institute contributed to Nepal flood relief, while a separate flood in Gorkha cut off a vital road and disrupted trekking. The death toll from Hurricane Simon and Tropical Storm Rachel's remnants rose to six after heavy rains triggered flooding and landslides along Mexico's Pacific coast. In the Philippines, flood mitigation efforts were inspected and a related corruption case continued, while new flood events caused impacts in South Africa, Wichita, Oklahoma City, Greece, and other regions.
