title: Death toll rises to 6 as Hurricane Simon and Rachel remnants unleash floods in Mexico | Texarkana Gazette
body: ENSENADA, Mexico -- The death toll from Hurricane Simon and the remnants of Tropical Storm Rachel rose to six Tuesday after heavy rains triggered flooding and landslides along Mexico's Pacific coast, authorities said.
