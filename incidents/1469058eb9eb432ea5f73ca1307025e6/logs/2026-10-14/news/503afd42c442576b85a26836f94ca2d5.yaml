title: Calls for maintenance of road gullies to prevent flooding - Highland Radio - Latest Donegal News and Sport
body: Letterkenny-Milford MD councillors are calling for road gullies to be properly maintained to help prevent flooding as wet weather sets in. Cllr Donal ‘Mandy’ Kelly has requested a full inspection of gullies throughout the municipal district to ensure they are working correctly and are free of debris. Cathaoirleach Cllr Pauric McGarvey also raised concerns about […]
