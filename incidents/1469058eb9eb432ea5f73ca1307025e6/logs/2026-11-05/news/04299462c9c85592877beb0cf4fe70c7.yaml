title: Flooded parking lots, playgrounds prompt alert for mosquito-borne illnesses
body: Florida has been the epicenter of localized U.S. dengue cases, and health officials fear the recent deluge that has flooded roads, playgrounds and parking lots will worsen the outbreak.
