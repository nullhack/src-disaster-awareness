title: Flood rescues continue in Brevard County as rising waters force evacuations, change polling locations
body: Emergency crews and volunteers continued rescuing residents from flooded homes across Brevard County on Monday as heavy rainfall left roads impassable, damaged properties and forced some families to seek shelter.
