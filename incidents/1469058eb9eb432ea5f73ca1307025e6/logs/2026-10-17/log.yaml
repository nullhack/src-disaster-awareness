log_date: '2026-10-17'
summary: Hurricane Trudy is approaching Mexico and is forecast to strengthen to Category 4, increasing flood and mudslide risks. Catastrophic flooding in Istanbul has left at least 4 dead in the worst floods in 80 years. In Nepal, the government declared flood- and landslide-hit areas in three districts as disaster zones, and concerns about the risks of resettling disaster survivors have been highlighted.
