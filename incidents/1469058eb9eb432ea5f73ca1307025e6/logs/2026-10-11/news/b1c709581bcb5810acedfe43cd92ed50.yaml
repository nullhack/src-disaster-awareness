title: Coastal flood advisory for North Bay Interior Valleys until early Wednesday evening
body: An updated coastal flood advisory was issued by the National Weather Service on Sunday at 7:19 a.m. in effect until Wednesday Oct. 14, at 4 p.m. for North Bay Interior Valleys.
