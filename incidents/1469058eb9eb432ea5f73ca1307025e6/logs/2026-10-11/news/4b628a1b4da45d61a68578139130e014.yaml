title: 'Coastal Flood Warning issued as Tropical Storm Rachel nears: See expected landfall'
body: Tropical Storm Rachel is expected to make landfall along the coast of Northern Baja California on Saturday night, bringing heavy rain and potential coastal flooding to San Diego County through Sunday.
