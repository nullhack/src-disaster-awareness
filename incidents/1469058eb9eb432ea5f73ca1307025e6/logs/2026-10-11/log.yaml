log_date: '2026-10-11'
summary: Hurricane Isaias has weakened to a post-tropical cyclone after leaving at least four dead and causing flooded neighborhoods in Fort Walton Beach, with flood watches still active across the Southeast. Tropical Storm Rachel has arrived in Southern California, bringing coastal flooding that forced the closure of all beaches and piers in Newport Beach and prompted a tropical storm watch for San Diego. Additional flood advisories have been issued for areas including McDowell County, and the remnants of Isaias continue to bring heavy rain and wind threats to parts of Tennessee and Virginia.
