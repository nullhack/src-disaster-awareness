log_date: '2026-11-15'
summary: 'Flood impacts persist across several regions: in Malaysia, Selangor’s evacuation centres are emptying while Perak sees a rise in victims; the Bay Area was hit by massive waves flooding streets and homes; and Southern Colorado faces a daunting recovery. New developments include Santa Rosa declaring a local emergency for El Niño, a flood watch in New Hampshire, Utah residents raising $200,000 for flood relief, and Brevard County food pantries bracing for ongoing needs.'
