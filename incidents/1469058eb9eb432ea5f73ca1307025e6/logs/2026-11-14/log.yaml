log_date: '2026-11-14'
summary: A canal breach in Shropshire, UK, flooded homes, while a flooded street stranded cars in Wilmington, California. In Colorado, Wolf Creek Pass reopened after flood damage, and in Georgia, the flood emergency was extended as McCaysville lifted curfew and reopened a road to Tennessee. Elsewhere, Kenyans brace for heavy El Niño rains as flood survivors recall losses, Gaza’s humanitarian crisis worsens with heavy rain flooding tents, and Florida communities continue to struggle with flood recovery.
