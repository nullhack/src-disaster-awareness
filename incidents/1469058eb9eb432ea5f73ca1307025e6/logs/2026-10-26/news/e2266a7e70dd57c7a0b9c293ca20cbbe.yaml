title: More flooding possible in Four Corners region after days of heavy rain
body: A rain-soaked swath of the Southwest U.S. braced for the possibility of additional flooding as crews in New Mexico scoured evacuated neighborhoods Sunday for dead animals, downed power lines and other hazards left behind by receding floodwaters.
