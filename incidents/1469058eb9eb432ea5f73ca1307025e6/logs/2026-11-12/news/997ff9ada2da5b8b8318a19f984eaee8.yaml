title: '‘You’re Not Alone’: Two flood-impacted women deliver supplies door-to-door in Palm Bay'
body: Mariah Colon, owner of The Aesthetic Xperience, and Winnye Vicente, owner of Winnye’s Bakery, packed two cars with pet food, baby supplies, hygiene products, water and other essentials to deliver directly to flood victims in Palm Bay.
