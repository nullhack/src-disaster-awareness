log_date: '2026-11-12'
summary: |-
  Highway 160 over Wolf Creek Pass could partially reopen this weekend as southwest Colorado digs out from devastating floods. Record rainfall from the same system has provided rare relief to Southwest reservoirs, raising Lake Powell by 20 feet. In Palm Bay, Florida, flood-impacted women are delivering supplies door-to-door to other victims.
  Flash flooding and flood warnings affected areas of Texas, Delaware, Portugal, and British Columbia, where a shelter-in-place advisory was issued. In Malaysia, flash floods killed two people while evacuee numbers dropped slightly, and recovery continued in Brevard County, Florida, with cleanup kits and debris collection. NASA imagery showed Navajo Lake surging from recent historic floods in the Southwest, and Nepal urged for improved early warning systems after its own devastating flood.
