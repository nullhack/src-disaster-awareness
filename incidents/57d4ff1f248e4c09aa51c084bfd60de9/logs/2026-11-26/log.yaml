log_date: '2026-11-26'
summary: A magnitude 5.9 earthquake struck Qinghai province on 21 November at 10:45 UTC, about 56 kilometers from the small airport serving Delingha, and triggered a USGS yellow alert. A later report said earthquake-hit communities in Qinghai, Gansu and Xizang were returning to normal life as reconstruction efforts provided warm homes and essential services.
