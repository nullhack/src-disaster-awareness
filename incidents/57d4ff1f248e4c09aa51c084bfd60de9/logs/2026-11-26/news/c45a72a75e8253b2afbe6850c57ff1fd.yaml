title: 'Warm homes, renewed hopes: Recovery in earthquake-hit regions of western China'
body: As winter sets in, earthquake-hit communities in China’s Qinghai, Gansu and Xizang Autonomous Region are gradually returning to normal life, with reconstruction efforts ensuring warm homes, stable livelihoods and essential public services, Xinhua News Agency reported Tuesday.
