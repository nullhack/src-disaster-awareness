log_date: '2026-11-22'
summary: Reports on 21 November describe an earthquake in Qinghai, China, with magnitudes given variously as 5.6, 5.7, and 5.9. One report places strong shaking in Delingha, while another cites the Haixi region, and depth estimates range from about 10 km to 80 km. One source reported no casualties so far.
