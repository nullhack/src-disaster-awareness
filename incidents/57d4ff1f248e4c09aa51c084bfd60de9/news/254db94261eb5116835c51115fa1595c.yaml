title: 'Earthquake: चीन में 5.7 तीव्रता का भूकंप, अफगानिस्तान में भी 4.6 का झटका, एक ही दिन दो देशों में कांपी धरती | Zee Business'
body: चीन में 5.7 और अफगानिस्तान में 4.6 तीव्रता का भूकंप आया. राष्ट्रीय भूकंप विज्ञान केंद्र के मुताबिक, दोनों भूकंप 70 किलोमीटर से ज्यादा गहराई में आए. जानिए इनकी गहराई और भूकंप के अलग-अलग प्रकार के बारे में.
