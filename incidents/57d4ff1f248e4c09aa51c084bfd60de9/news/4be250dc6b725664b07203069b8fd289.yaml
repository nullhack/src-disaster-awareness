title: 5.7-magnitude earthquake strikes China
body: 'Beijing [China], November 21 (ANI): An earthquake of magnitude 5.7 struck China at a depth of 80 kilometres on Saturday, the National Center for Seismology (NCS) said, reporting another seismic event in the country earlier this month.'
