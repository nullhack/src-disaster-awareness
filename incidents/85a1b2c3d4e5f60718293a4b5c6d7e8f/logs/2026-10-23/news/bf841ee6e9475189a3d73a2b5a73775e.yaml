title: Start of Northeast Monsoon expected on Oct 27, MetMalaysia says
body: 'PETALING JAYA: The 2026/2027 Northeast Monsoon season is expected to start
  next Tuesday (Oct 27), says the Malaysian Meteorological Department (MetMalaysia).'
