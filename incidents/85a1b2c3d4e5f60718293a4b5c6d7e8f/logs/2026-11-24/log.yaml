log_date: '2026-11-24'
summary: |-
  In Negeri Sembilan, 274 SPM 2026 candidates have been identified as at risk of disaster amid the Northeast Monsoon. Separately, JAKOA has advised NGOs against visiting Orang Asli villages during the monsoon, citing hazards including landslides and water surges.
  The Kelantan Fire and Rescue Department has stepped up monitoring at Pengkalan Chepa, Kota Bharu, Tumpat and Pasir Puteh ahead of a high tide phenomenon forecast for 26–27 November. Meanwhile, Universiti Sultan Zainal Abidin activated its Flood Operations Room to coordinate flood monitoring and welfare assistance for students and staff affected by heavy rain.
