title: 572 flood hotspots under close watch in Pahang, says MB
body: 'KUANTAN: A total of 572 flood-prone areas, or hotspots, across Pahang are being monitored as part of preparations for the monsoon season, says Datuk Seri Wan Rosdy Wan Ismail.'
