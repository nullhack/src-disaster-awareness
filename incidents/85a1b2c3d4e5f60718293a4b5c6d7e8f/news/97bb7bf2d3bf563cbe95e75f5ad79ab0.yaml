title: PBT diminta bersihkan longkang kerap sepanjang monsun, 1,445 lokasi panas banjir dikenal pasti
body: Fadillah Yusof minta semua PBT bersihkan longkang, perangkap sampah dan kolam takungan sepanjang monsun. Garis panduan kenderaan terbiar mula Februari. Ada senarai semak.
