log_date: '2026-09-15'
summary: The Ebola outbreak in DR Congo has now surpassed 7,000 confirmed cases and nearly 3,400 deaths, with a case detected in a seventh province, South-Ubangi, bordering the Central African Republic and Congo-Brazzaville. Despite the U.S. allocating hundreds of millions of dollars and vaccine trials underway, deaths continue to climb, though government officials suggest transmission may have peaked. The outbreak remains the second largest in history and the second deadliest, with the updated case count reaching 7,200.
