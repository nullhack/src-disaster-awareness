log_date: '2026-11-24'
summary: Heavy fighting near a hospital in Ituri province disrupted Ebola response efforts and forced medical workers to shelter inside a maternity ward for more than 24 hours, according to the WHO chief. DRC figures were raised to about 11,800 cases and around 5,800 deaths, while the WHO warned that global spread of the virus remains possible and called for safe passage for health workers and patients. Qatar also lifted Ebola-related entry restrictions on Ugandan travelers.
