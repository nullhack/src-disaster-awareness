log_date: '2026-11-24'
summary: |-
  Heavy fighting near a hospital in Ituri province disrupted Ebola response efforts and forced medical workers to shelter inside a maternity ward for more than 24 hours, according to the WHO chief. DRC figures were raised to about 11,800 cases and around 5,800 deaths, while the WHO warned that global spread of the virus remains possible and called for safe passage for health workers and patients. Qatar also lifted Ebola-related entry restrictions on Ugandan travelers.
  The WHO chief warned that global spread of the Ebola virus remains possible and Africa's top health official urged the UK and allies to do more, as escalating fighting in Ituri province continued to endanger Ebola patients and health workers. Ugandan districts bordering DR Congo, including Kanungu and Kisoro, tightened border controls and vigilance at porous crossing points to keep the virus out, while Qatar lifted its Ebola-related travel restrictions on Uganda. No new case or death figures were reported in this batch.
  Gavi announced it plans to buy up to 1.5 million doses of an experimental Oxford–Serum Institute vaccine targeting the Bundibugyo Ebola virus for use in DR Congo, contingent on trial results and regulatory approval. A UNICEF-led survey found that violence against women and adolescent girls is rising in Ebola-hit Ituri, with nearly 6 in 10 women and girls aged 15 and older reporting an increase in abuse. A separate analysis cited 11,712 cases and 5,720 deaths as of November 18 and examined the ethical question of what health workers owe patients during the crisis.
