log_date: '2026-09-05'
summary: As of early September 2026, the Ebola outbreak in DR Congo has surpassed 6,000 confirmed cases and 3,000 deaths, with the most recent data showing 6,342 cases and 3,072 deaths as of September 2. The UK announced it will nearly triple its funding to £78.7 million, while the WHO rejected wide rollout of the Ervebo vaccine against the Bundibugyo strain and stated that trials of three potential vaccines are imminent. The DRC also launched an updated 180-day response plan seeking Sh173 billion in funding, even as the UN warns that ongoing violence and mass displacement in eastern DRC continue to undermine containment efforts.
