title: 'Ebola “must not have the final say”: DR Congo Catholic Bishops Call for Action Against Deadly Outbreak'
body: Members of the National Episcopal Conference of Congo (CENCO) have urged citizens in the Democratic Republic of Congo (DRC) to intensify efforts to contain the country’s 17th outbreak of Ebola virus disease, cautioning that the epidemic “must not have the final say” over the lives of the Congolese people.
