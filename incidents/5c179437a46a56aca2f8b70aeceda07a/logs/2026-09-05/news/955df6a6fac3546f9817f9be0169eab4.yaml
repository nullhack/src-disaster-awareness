title: 'Ebola: US donates death-preventing treatment to Uganda - The Observer Media Ltd'
body: The United States government has donated vials of an experimental Ebola antibody treatment, MBP134, to Uganda’s ministry of Health, with the treatment showing potential to prevent deaths among Ebola patients. Dr Charles Ayume, state minister for Health in charge of primary health care, received the vials on behalf of the government and described the donation […]
