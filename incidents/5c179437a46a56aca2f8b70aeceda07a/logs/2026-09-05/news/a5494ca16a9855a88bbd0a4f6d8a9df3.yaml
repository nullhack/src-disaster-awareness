title: WHO rejects wide rollout of Ervebo Vaccine in deadly DR Congo Ebola outbreak
body: The World Health Organization (WHO) has rejected the programmatic rollout of the Ervebo Ebola vaccine against the Bundibugyo strain currently driving the Democratic Republic of Congo’s deadliest Ebola outbreak, saying available evidence remains insufficient to establish whether the vaccine provides meaningful protection against the virus.
