title: DR Congo records over 6,000 confirmed Ebola cases
body: KINSHASA, Aug. 31 (Xinhua) -- Confirmed Ebola cases in the Democratic Republic of the Congo (DRC) have surpassed 6,000, with nearly 3,000 deaths, according to the latest figures released Monday.
