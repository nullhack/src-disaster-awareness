title: Ebola cases cross 6,000, death toll nears 3,000 in Congo; mortality rate remains close to 50%
body: According to latest government data, Ebola cases in DR Congo has crossed 6000 with almost 3,000 deaths. The outbreak's case-fatality ratio at approximately 48.2%.
