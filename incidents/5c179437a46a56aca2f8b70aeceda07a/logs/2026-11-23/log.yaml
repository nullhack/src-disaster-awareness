log_date: '2026-11-23'
summary: The Bundibugyo Ebola outbreak in DR Congo rose to 11,645 confirmed cases with deaths nearing 5,700, after 500 cases and 246 deaths were added in a week, according to CDC figures reported by Contagion Live. In Ituri, intense fighting trapped WHO staff and aid partners in a hospital maternity ward for more than 24 hours, prompting the WHO chief to call for peace and for their safe evacuation. Separately, Kenya and DR Congo pledged to expand cooperation on Ebola prevention during diplomatic talks, and Malawi issued a travel advisory with enhanced border screening.
