title: Ebola deaths hit 4,242, cases rise to 8,787 in DR Congo — WHO
body: THE World Health Organisation (WHO) says the Ebola outbreak in the Democratic Republic of the Congo has recorded 8,787 cases and 4,242 confirmed deaths.
