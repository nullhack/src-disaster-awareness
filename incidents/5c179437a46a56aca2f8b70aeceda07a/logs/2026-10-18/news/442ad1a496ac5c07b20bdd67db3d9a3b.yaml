title: Ebola Outbreak In DR Congo Surpasses Over 9,000 Cases
body: The latest figures from the Democratic Republic of Congo (DRC) show that the Ebola outbreak has reached 9,066 cases and 4,381 deaths. The West African outbreak was caused by the Zaire strain of the virus, the most common type of Ebola.
