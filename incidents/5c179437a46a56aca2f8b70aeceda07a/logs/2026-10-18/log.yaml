log_date: '2026-10-18'
summary: The DRC Ebola outbreak has surpassed 9,000 confirmed cases and 4,300 deaths, with the virus spreading to an eighth province, Nord-Ubangi, where two infections including one death were confirmed. Kenya's case count has risen to seven, including three health workers who treated the first patient, prompting Africa CDC support and expanded regional surveillance. UNICEF is running child-care centres to support children affected by the outbreak across seven provinces.
