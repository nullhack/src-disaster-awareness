log_date: '2026-07-29'
summary: Uganda declared itself Ebola-free on July 28, ending its 74-day Bundibugyo outbreak with just a few cases. In DR Congo, the outbreak has topped 3,200 cases, nearing the record of the country's worst outbreak, as UNICEF psychosocial workers provide comfort to patients and surveillance teams face overstretched conditions in Bunia.
