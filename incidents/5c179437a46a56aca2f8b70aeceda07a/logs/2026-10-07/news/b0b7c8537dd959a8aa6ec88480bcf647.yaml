title: Kenya confirms its first Ebola case and death in a man who traveled from Congo
body: A Kenyan citizen who had been living in Congo before returning to Nairobi over the weekend has become Kenya's first confirmed case of Ebola and the country's first death from the disease in the fast-moving outbreak.
