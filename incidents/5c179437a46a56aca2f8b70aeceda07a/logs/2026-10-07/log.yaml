log_date: '2026-10-07'
summary: A New York Times investigation details how international aid arrived too late for a Congolese town, contributing to the outbreak's severity. UNICEF warns that Ebola is robbing children of the people they depend on, underscoring the humanitarian toll. Kenya confirmed its first imported Ebola case from the DRC, with a Kenyan citizen dying in Nairobi shortly after traveling from the affected region.
