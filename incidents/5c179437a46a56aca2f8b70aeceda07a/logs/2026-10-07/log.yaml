log_date: '2026-10-07'
summary: |-
  A New York Times investigation details how international aid arrived too late for a Congolese town, contributing to the outbreak's severity. UNICEF warns that Ebola is robbing children of the people they depend on, underscoring the humanitarian toll. Kenya confirmed its first imported Ebola case from the DRC, with a Kenyan citizen dying in Nairobi shortly after traveling from the affected region.
  Kenya confirmed its first Ebola case and death linked to the DR Congo outbreak, with health authorities quarantining ten contacts. A separate suspected case of viral hemorrhagic fever was reported in Wajir. In Congo, the outbreak is spreading to new hot spots, and contact tracing has only reached 23 % of expected contacts.
