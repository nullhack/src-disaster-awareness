log_date: '2026-08-25'
summary: Pope Leo called the DRC Ebola crisis a "global" concern as Ervebo vaccine doses arrived, though their efficacy against the Bundibugyo strain remains unproven. The Red Cross reported six workers were injured in attacks in Ituri and Haut-Uele provinces last week, and Al Jazeera highlighted that nearly half of those infected are dying, consistent with the high case fatality rate.
