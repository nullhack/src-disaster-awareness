log_date: '2026-10-06'
summary: |-
  As of early October 2026, the DR Congo Ebola outbreak has reached about 8,500 confirmed cases and 4,100 deaths, based on updated figures from health authorities. Médecins Sans Frontières (MSF) has warned of an alarming surge in cases in North Kivu province, highlighting ongoing challenges. Additionally, Roche Diagnostics has delivered molecular testing instruments to strengthen laboratory capacity in the response.
  Kenya confirmed its first imported Ebola case linked to the DR Congo outbreak after a Kenyan citizen who had been living in Congo died in Nairobi, with health authorities tracing 28 contacts and 23 flight passengers. In response to the escalating crisis, France announced an additional €7 million in aid to support containment efforts. Meanwhile, the outbreak continues to spread rapidly, with health workers in DR Congo increasingly exhausted and struggling to keep pace.
