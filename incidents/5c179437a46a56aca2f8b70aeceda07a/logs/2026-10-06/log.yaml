log_date: '2026-10-06'
summary: As of early October 2026, the DR Congo Ebola outbreak has reached about 8,500 confirmed cases and 4,100 deaths, based on updated figures from health authorities. Médecins Sans Frontières (MSF) has warned of an alarming surge in cases in North Kivu province, highlighting ongoing challenges. Additionally, Roche Diagnostics has delivered molecular testing instruments to strengthen laboratory capacity in the response.
