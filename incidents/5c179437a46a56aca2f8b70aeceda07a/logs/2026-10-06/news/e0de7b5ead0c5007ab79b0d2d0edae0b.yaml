title: Kenya Confirms First Ebola Case After Patient Dies In Nairobi
body: Kenya has confirmed its first imported Ebola case after a traveler from Congo via Uganda died in Nairobi. Authorities are tracing 28 contacts and 23 passengers from the same flight.
