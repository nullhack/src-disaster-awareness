log_date: '2026-11-18'
summary: WHO raised alarm over the Bundibugyo Ebola outbreak’s impact on young children, reporting that about 70% of infected under-five children die. The batch also reports that two Bundibugyo vaccine candidates, ChAdOx1 and mRNA-1469, will join the WHO-led Tumaini trial as DR Congo’s confirmed cases pass 11,000.
