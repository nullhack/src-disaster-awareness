title: Congo’s fast-moving Ebola outbreak becomes the country's worst with over 2,300 dead
body: That toll released overnight makes it the deadliest outbreak of the disease ever recorded in the Central African nation. The outbreak has recorded 4,945 cases including 2,325 deaths.
