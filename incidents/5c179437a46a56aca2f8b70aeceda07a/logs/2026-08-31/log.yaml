log_date: '2026-08-31'
summary: As of late August 2026, confirmed Ebola cases in the Democratic Republic of Congo have surpassed 6,000, with the death toll nearing 3,000 (2,911 deaths reported). The outbreak, described as the fastest-spreading in history, continues to escalate despite the start of vaccination efforts with Ervebo doses. Additionally, a patient in another country has been hospitalized for possible Ebola after a recent trip to the DRC, raising concerns about cross-border spread.
