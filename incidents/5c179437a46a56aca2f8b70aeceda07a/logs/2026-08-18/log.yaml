log_date: '2026-08-18'
summary: As of August 16-17, 2026, the Ebola outbreak in DR Congo has killed 2,325 people, surpassing the 2018-2020 outbreak to become the deadliest in the country's history and the second-most lethal globally, behind only the 2014-2016 West Africa epidemic. The WHO warns the outbreak is on track to potentially become the deadliest on record worldwide if the current pace continues. The crisis remains the fastest-growing ever, with the UN reporting it is killing one person every 30 minutes, and early cases were misattributed to malaria and typhoid.
