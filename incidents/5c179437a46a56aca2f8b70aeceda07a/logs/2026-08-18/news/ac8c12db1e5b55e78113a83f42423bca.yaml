title: WHO aims to reverse DR Congo Ebola outbreak in 3 months
body: GENEVA, 13th August, 2026 (WAM) -- The World Health Organisation (WHO) said Wednesday it hopes to reverse the spread of Ebola in the DR Congo within three months, but warned the deadly outbreak would not be over by then.
