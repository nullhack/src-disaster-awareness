title: Congo's fast-moving Ebola outbreak becomes the country's worst with over 2,300 dead
body: BUNIA, Congo — Congo's fast-moving Ebola outbreak has now killed over 2,300 people and become the deadliest outbreak of the disease on record in the Central African nation.
