title: Ebola outbreak in Democratic Republic of Congo becomes deadliest in country's history
body: Aug 16 (Reuters) - The Ebola outbreak in Democratic Republic of Congo has killed 2,325 people, government data showed on Sunday, surpassing the toll from the 2018-2020 outbreak to become the deadliest in the country's history.
