log_date: '2026-11-04'
summary: St. Lucia issued a travel advisory urging its nationals to avoid non-essential travel to the Democratic Republic of the Congo, Kenya, and Nigeria due to the Bundibugyo Ebola outbreak. Kenya discharged five Ebola patients and released 46 contacts from quarantine, marking progress in its containment efforts. In eastern Congo, Ebola survivors are comforting sick children in isolation wards, supporting ongoing care and awareness.
