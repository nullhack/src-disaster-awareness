title: Ministry of Health Urges Nationals to Avoid Non-Essential Travel to DRC, Kenya and Nigeria - The Voice St. Lucia News
body: The Ministry of Health is urging nationals to avoid non-essential travel to the Democratic Republic of the Congo (DRC), Kenya, and Nigeria, where public health and security risks regarding the Bundibugyo Ebola Virus are of greatest concern.
