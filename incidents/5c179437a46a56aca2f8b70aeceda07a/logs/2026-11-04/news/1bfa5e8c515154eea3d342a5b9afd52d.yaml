title: Kenya Discharges Five Ebola Patients as Response Continues - Voice of Nigeria
body: Kenya has discharged five Ebola patients after they tested negative for the virus and showed no symptoms, while two others remain under supportive care. The Country’s Ministry of Health also announced the release of 46 people who had been identified as contacts of Kenya’s first confirmed Ebola patient and placed under a 21-day quarantine. Another […]
