title: Médico britânico que testou positivo na RDCongo internado em hospital de Londres
body: Um médico britânico que trabalhava no combate à epidemia de ébola na República Democrática do Congo (RDCongo) foi transportado na quinta-feira para um hospital em Londres para receber tratamento contra o vírus, adiantou o governo do Reino Unido.
