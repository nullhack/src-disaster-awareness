log_date: '2026-11-07'
summary: An attack by Islamist-linked ADF militants in eastern DR Congo killed at least 33 civilians and forced Ebola patients to flee. The outbreak case count rose to 10,668 with deaths approaching 5,200, and the WHO cleared Moderna and Oxford vaccine candidates for the first efficacy trial in the region. A British doctor who contracted Ebola while aiding the response was evacuated to London for treatment.
