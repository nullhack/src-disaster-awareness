log_date: '2026-10-23'
summary: New reports reveal that Nigeria’s first Ebola case went undiagnosed for nine days while being treated for malaria. The Nigerian Senate declared a national emergency and ordered mandatory health screening for all international travelers, while Kenyan authorities are searching for a missing Ugandan contact as the number of linked cases rises. The US CDC now requires foreign travelers to certify they have not been to the Democratic Republic of Congo in the previous three weeks, and the World Health Organization has described the outbreak as “complex” after its spread to West Africa.
