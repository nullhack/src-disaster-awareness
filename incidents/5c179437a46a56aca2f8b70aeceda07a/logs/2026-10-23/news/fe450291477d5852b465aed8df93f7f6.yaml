title: First Ebola Case Confirmed In Nigeria
body: The World Health Organization said it is assisting Nigeria following confirmation of the first case of Ebola Bundibugyo virus disease in the country. The patient is a woman who recently traveled from Uganda and began showing symptoms on October 7, four days after her arrival.
