title: Ebola Patient In Nigeria Is Swiss, Had Not Visited DRC, Says Swiss Foreign Ministry
body: The Ebola patient in Nigeria is a Swiss woman and the wife of a staff member at Switzerland's embassy in Abuja, Bern said Friday.
