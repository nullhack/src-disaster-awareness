title: 'Ebola response: Strengthening treatment and preserving essential care'
body: Isiro, the Democratic Republic of the Congo – “We were separated only by ropes.” When Dr Prince Afandia Alafu, 33, returns to the place where he was treated for Ebola, memories of his hospitalization resurface. In Isiro, in Haut Uélé province in northeastern of the Democratic Republic of the Congo, this general practitioner discovers, just weeks after his recovery, an expanded and better equipped treatment centre. Progress has been made to improve care for Ebola patients while allowing the hospital to gradually resume its usual activities.
