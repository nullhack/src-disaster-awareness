log_date: '2026-09-26'
summary: The Ebola outbreak in DR Congo has expanded to two new health zones (Bulu and Dungu), bringing the total affected zones to 63, with 7,900 cases and 3,800 deaths. The Africa CDC reports contact tracing is falling short, while the East African Community seeks $45 million to boost regional response and the UK has sent a team to South Sudan in anticipation of imported cases.
