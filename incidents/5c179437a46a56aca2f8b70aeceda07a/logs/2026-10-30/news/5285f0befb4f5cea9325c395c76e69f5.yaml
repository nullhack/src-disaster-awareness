title: 'Video. DR Congo: MSF celebrates Ebola patient discharges in Ituri province'
body: Video. Dancing and singing erupted at an Ebola treatment centre in DR Congo as the last patients were discharged. For the first time since May, the MSF-run facility has no confirmed cases under treatment, although the wider outbreak continues.
