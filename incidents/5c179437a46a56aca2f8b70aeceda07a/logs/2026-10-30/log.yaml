log_date: '2026-10-30'
summary: |-
  Russia has sent Ebola testing systems to all countries neighboring the Democratic Republic of Congo. African health ministers have agreed to keep borders open, focusing on enhanced surveillance. Experts warn that the outbreak has plateaued but could still become the worst in history, with nearly half of infected people dying.
  Genetic analysis has linked Ebola cases in Kenya and Nigeria to the DRC outbreak, while an MSF treatment centre in Ituri discharged its last patients for the first time since May. Additionally, the International Council of Nurses condemned misinformation following the killing of a nurse in the DRC.
