log_date: '2026-10-04'
summary: The Ebola outbreak in DR Congo now exceeds 8,000 confirmed cases and 4,000 deaths, with one source reporting 8,116 cases and 3,924 deaths. A treatment center was burned down in Ituri province, while clinical trials for an oral Ebola treatment (NV-387) have started enrollment, and over 250 participants have been enrolled in a separate prevention trial.
