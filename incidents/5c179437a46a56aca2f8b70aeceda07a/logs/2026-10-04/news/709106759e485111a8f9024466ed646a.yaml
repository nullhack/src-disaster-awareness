title: Trial begins for new anti-Ebola treatment | Arkansas Democrat Gazette
body: RWAMPARA, Congo -- More than 250 participants have been enrolled in a trial for a drug that could stop them from contracting Ebola in Congo, in what experts have described as a critical step to try to fight the deadliest outbreak of the disease in the Central African country.
