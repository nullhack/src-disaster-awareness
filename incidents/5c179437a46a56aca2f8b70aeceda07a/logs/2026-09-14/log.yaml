log_date: '2026-09-14'
summary: New reports indicate that the Ebola outbreak in the Democratic Republic of Congo has surpassed 7,000 confirmed cases, with nearly 3,400 deaths, marking the country's worst-ever epidemic. The virus has spread to a seventh province, and while the government claims the outbreak is under control, the WHO warns transmission remains uncontrolled. Additionally, a man who recently visited DRC has tested negative for Ebola, providing reassurance against one potential cross-border case.
