log_date: '2026-10-21'
summary: As of late October 2026, the DR Congo Ebola outbreak has reached 9,455 confirmed cases and 4,561 deaths, with North Kivu authorities limiting burials to 20 relatives. Nigeria confirmed its first imported Ebola case in a woman arriving from Uganda, with 44 contacts traced, and Kenya's case count rose to eight, all linked to the initial patient. The US raised its travel advisory for Kenya, Africa CDC flagged $700 million in unaccounted aid, and the WHO granted emergency listing for a new diagnostic panel.
