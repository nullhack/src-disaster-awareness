title: Nigeria Confirms First Ebola Case as Outbreak Spreads
body: Nigeria has confirmed one case of Ebola in the Federal Capital Territory (FCT) after a woman who recently travelled from Uganda tested positive. The patient is in isolation and receiving treatment at a private hospital. The authorities have begun tracing 44 people identified as contacts of the patient. The government has called on health facilities to step up surveillance, isolate suspected cases and implement infection prevention measures. It also advised the public to maintain good hand hygiene and avoid contact with bodily fluids from suspected cases. Nigeria has become the latest country to report an Ebola case as the virus spreads across the region. Kenya has recorded nine infections. Uganda had previously reported Ebola cases, but it later declared itself free of the virus.
