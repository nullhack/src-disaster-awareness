title: 'Ebola: Ogun Steps Up Surveillance, Says No Case Recorded In State'
body: The Ogun State Government has intensified surveillance and preparedness measures following the Federal Government’s announcement of an Ebola outbreak in the Federal Capital Territory (FCT), assuring residents that no case had been recorded in the state as of October 21, 2026.
