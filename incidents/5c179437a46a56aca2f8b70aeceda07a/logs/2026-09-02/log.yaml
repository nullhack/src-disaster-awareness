log_date: '2026-09-02'
summary: As of early September 2026, the Ebola outbreak in DR Congo has surpassed 3,000 deaths and exceeded 6,100 confirmed cases, becoming the second deadliest Ebola outbreak in history after the 2014-2016 West Africa epidemic. The United Nations warns the outbreak is accelerating and calls for a larger international response, while MSF reports that children face a disproportionately high risk of dying from the Bundibugyo virus, urging faster research and treatment access. Amid the ongoing crisis, the new school year has begun in DRC with the outbreak affecting six provinces.
