title: Ebola spreads to eighth DRC province as WFP delivers food, builds treatment centres and keeps supplies moving | World Food Programme
body: KINSHASA, Democratic Republic of the Congo – As Ebola spreads to an eighth province in the Democratic Republic of the Congo (DRC), affected families face growing difficulty accessing food while following treatment and isolation guidance. In a response already challenged by conflict, hunger and access constraints, the United Nations World Food Programme (WFP) is delivering food assistance, building Ebola Treatment Centres and providing the logistics, telecommunications and air services that enable health partners to reach affected communities.
