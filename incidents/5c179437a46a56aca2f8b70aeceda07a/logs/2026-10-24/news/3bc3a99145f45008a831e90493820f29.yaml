title: Kenya reports second Ebola death - Jamaica Observer
body: NAIROBI, Kenya (AFP)—Kenya on Friday reported its second Ebola death following an outbreak in the Democratic Republic of Congo that has now seen cases also spread to Uganda and Nigeria. Kenya had not reported a single case of the contagious virus until October 6, after a Kenyan man who had been living in the DR Congo died after returning home. The DRC declared its 17th Ebola outbreak in May and...
