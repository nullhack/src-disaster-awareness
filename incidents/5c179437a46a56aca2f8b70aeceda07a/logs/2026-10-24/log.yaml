log_date: '2026-10-24'
summary: |-
  Kenya reported its second Ebola death, a 65‑year‑old woman who was a close relative of the first victim. The World Food Programme is building treatment centres and delivering food to affected areas, while polio‑eradication infrastructure is being repurposed to aid Ebola containment. Grieving families in DR Congo continue to face fear and stigma as the outbreak spreads.
  India donated 11 tonnes of medical supplies, including masks, gowns, and gloves, to Kenya to support its Ebola response. Separately, a new report details how Christian leaders in the Democratic Republic of Congo are mobilizing communities to combat fear and misinformation surrounding the virus.
