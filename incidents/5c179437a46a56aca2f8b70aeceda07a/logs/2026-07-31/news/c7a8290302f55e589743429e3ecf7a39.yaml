title: Congo says the death toll in fastest-growing Ebola outbreak has passed 1,500
body: Ebola has killed over 1,500 people in eastern Congo, marking a 50% increase in about a week. The outbreak, linked to the Bundibugyo virus, has seen 3,442 cases as of Tuesday.
