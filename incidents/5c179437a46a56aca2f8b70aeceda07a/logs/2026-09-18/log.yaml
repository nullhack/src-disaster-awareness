log_date: '2026-09-18'
summary: The DR Congo government has declared that the Ebola outbreak has passed its peak, contradicting Africa CDC's warning that the outbreak remains far from under control. Confirmed cases have topped 7,400, with transmission shifting from Ituri to North Kivu where treatment capacity is nearing saturation. CEPI has committed $3.9 million to bolster clinical trials against the Bundibugyo ebolavirus.
