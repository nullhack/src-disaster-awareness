title: Congo's Ebola outbreak reaches 5,000 cases as it outpaces response efforts at unprecedented speed
body: The Ebola outbreak in Congo has reached 5,000 cases, government data showed Wednesday, as responders warn it is spreading at an unprecedented speed outpacing efforts to slow it in one of the country's remotest regions.
