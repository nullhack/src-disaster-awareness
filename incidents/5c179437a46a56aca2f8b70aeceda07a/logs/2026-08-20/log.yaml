log_date: '2026-08-20'
summary: As of late August 2026, the Ebola outbreak in DR Congo has surpassed 5,000 confirmed cases and remains a global health emergency, with the WHO emphasizing that it can still be controlled within three months but warning that the window is narrowing due to limited funding and rapid spread. The country is set to receive 70,000 doses of the Ervebo vaccine, a major boost to containment efforts against what officials describe as the fastest Ebola outbreak in history.
