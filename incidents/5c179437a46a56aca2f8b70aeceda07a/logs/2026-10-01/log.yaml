log_date: '2026-10-01'
summary: Canada extended its travel ban on travelers from the Democratic Republic of Congo, Uganda, and South Sudan amid the ongoing Ebola outbreak. Save the Children warned that seven children die each day from Ebola in DR Congo, with children under five facing a 61% case-fatality rate. The World Health Organization highlighted that early access to care and oxygen is decisive for patient survival, as the outbreak continues across seven provinces.
