log_date: '2026-11-11'
summary: |-
  The Ebola outbreak in the Democratic Republic of Congo has surpassed 11,000 confirmed cases and over 5,300 deaths, according to government data reported by Reuters and AP. Images from a treatment center in Beni, North Kivu Province, continue to show the human toll, including infected infants.
  Kenya has discharged its last Ebola patient, starting a 42‑day countdown to being declared Ebola‑free, with Africa CDC hailing its containment efforts. The IOM warned that Ebola is spreading along informal routes in DR Congo, with 71 cases detected, and noted funding shortages. Kenya also announced it will not serve as a quarantine centre for other countries or issue Ebola‑free certificates.
