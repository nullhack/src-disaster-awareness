log_date: '2026-10-22'
summary: |-
  New reports confirm Nigeria’s first imported Ebola case, a diplomat’s wife who traveled from DR Congo via Uganda and is now in isolation in Abuja; the Bundibugyo strain has reached West Africa for the first time. Kenya has reported nine cases, while WHO data show DRC cases surpassing 9,600 with 4,646 deaths, and transmission remains active across most affected health zones. Africa CDC warns the outbreak has become the most geographically widespread Ebola outbreak in history, with spread to four other countries.
  The Africa CDC has called an emergency virtual summit for October 28 as the outbreak spreads across five countries, while Nigeria confirmed its first Ebola case—a diplomat's wife who tested positive after visiting Uganda, with 44 contacts placed in quarantine. DRC and South Sudan are reinforcing border surveillance, and the Africa CDC noted that the Bundibugyo strain has no approved vaccine, citing a lack of international interest due to the perception that the disease is an "African issue."
