log_date: '2026-10-22'
summary: New reports confirm Nigeria’s first imported Ebola case, a diplomat’s wife who traveled from DR Congo via Uganda and is now in isolation in Abuja; the Bundibugyo strain has reached West Africa for the first time. Kenya has reported nine cases, while WHO data show DRC cases surpassing 9,600 with 4,646 deaths, and transmission remains active across most affected health zones. Africa CDC warns the outbreak has become the most geographically widespread Ebola outbreak in history, with spread to four other countries.
