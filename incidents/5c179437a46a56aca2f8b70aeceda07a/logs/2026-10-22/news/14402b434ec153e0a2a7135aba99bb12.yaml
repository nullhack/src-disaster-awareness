title: Ebola transmission remains active across most affected zones in DR Congo, WHO says
body: More than three-quarters of health zones affected since the outbreak began in May reported a new confirmed case in the latest 21-day period. Confirmed cases in the Democratic Republic of Congo have surpassed 9,600, with 4,646 deaths, according to WHO data.
