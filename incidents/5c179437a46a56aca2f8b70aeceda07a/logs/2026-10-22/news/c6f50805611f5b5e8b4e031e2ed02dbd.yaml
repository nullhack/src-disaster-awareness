title: Ebola spreads to Nigeria and Kenya as epidemic expands beyond Congo (DRC)
body: Nigeria has confirmed an imported case of Bundibugyo Ebola and Kenya has nine, while the Congolese epidemic has reached 9,552 cases and 4,602 deaths in eight provinces, with children dying at the highest rates.
