title: More than 6,000 people infected with Ebola in Congo, government figures show
body: DAKAR, Aug 31 (Reuters) - The number of confirmed Ebola cases in the Democratic Republic of Congo has passed the 6,000 mark, government data showed on Monday. The epidemic has become the largest in the central African country's history,
