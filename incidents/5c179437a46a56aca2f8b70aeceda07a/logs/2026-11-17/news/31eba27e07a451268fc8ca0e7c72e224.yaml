title: Gilead grants voluntary licenses of experimental Ebola drug to Dr Reddy’s, two others
body: The agreements cover 127 primarily low- and lower-middle-income countries and includes all African countries that have reported cases during the ongoing Ebola outbreak. Obeldesivir is currently being evaluated in a Phase 3 trial, to treat individuals at high risk of developing Ebola Bundibugyo virus disease.
