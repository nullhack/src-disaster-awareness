log_date: '2026-11-17'
summary: Gilead Sciences signed royalty-free licensing deals with three generic drugmakers to make its experimental Ebola drug obeldesivir available in 127 mainly low- and lower-middle-income countries, including African countries with reported cases. Obeldesivir is being evaluated in a Phase 3 trial for people at high risk of Bundibugyo Ebola virus disease. A separate report states that six months after the WHO emergency declaration, the outbreak has reached 11,254 confirmed cases and more than 5,000 deaths.
