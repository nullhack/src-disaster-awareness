log_date: '2026-11-17'
summary: |-
  Gilead Sciences signed royalty-free licensing deals with three generic drugmakers to make its experimental Ebola drug obeldesivir available in 127 mainly low- and lower-middle-income countries, including African countries with reported cases. Obeldesivir is being evaluated in a Phase 3 trial for people at high risk of Bundibugyo Ebola virus disease. A separate report states that six months after the WHO emergency declaration, the outbreak has reached 11,254 confirmed cases and more than 5,000 deaths.
  The WHO approved two Ebola vaccine candidates — from Oxford University–Serum Institute of India and Moderna — to advance to Phase 2 trials in the DR Congo next week, with more than 140 participants enrolled in a broader trial. Africa CDC warned that six months after the outbreak was declared it remains out of control, having spread to eight provinces, citing deadly attacks on health workers and unpaid staff. Kenya imposed a 21-day quarantine for all citizens returning from the DR Congo, while an NYT report described a family's hospital ordeal and the fatal delays in seeking medical care amid community transmission.
