title: Canada commits C$80m to Ebola response
body: CANADA has committed 80 million Canadian dollars to support the Ebola response in the Democratic Republic of the Congo (DRC), strengthening efforts to contain the outbreak and prevent further international spread. The Africa CDC Director-General, Dr Jean Kaseya, made this known on Friday via his official X handle. Kaseya said that the commitment was highlighted […]
