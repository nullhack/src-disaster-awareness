log_date: '2026-10-10'
summary: |-
  Ebola survivors in DR Congo are walking to villages to conduct awareness campaigns aimed at countering misinformation. Africa CDC reported that Kenya's first confirmed Ebola case traveled through DRC and Uganda before death, and East African governments are enhancing health surveillance while truckers warn that uncoordinated controls could disrupt trade.
  Canada has committed 80 million Canadian dollars to support the Ebola response in the Democratic Republic of Congo, a move acknowledged by Africa CDC. The outbreak is also reported to be slowing in some provinces of DR Congo, although concerns remain about cross-border spread to neighboring countries.
