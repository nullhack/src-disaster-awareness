log_date: '2026-11-22'
summary: Reports in this batch say the Ebola death toll in the Democratic Republic of Congo has surpassed 5,700, with the virus spreading faster than health workers can respond and calls for stronger frontline clinics, community trust, and vaccines. Bundibugyo-specific vaccine candidates are set to enter Tumaini trials in the outbreak epicenter next week, and Malawi has introduced a 21-day isolation requirement for travelers from the DRC as part of tightened surveillance.
