title: 'Ebola watch: Almost $3 billion mobilised so far, leaders want every dollar tracked'
body: Nearly $3 billion has been pledged for the Ebola response in Central Africa, with Africa CDC urging transparent tracking to ensure the funds reach frontline health workers and affected communities.
