title: DR Congo Ebola Outbreak Outpaces Response As WHO Warns Of Health Worker Shortage | Outlook India
body: The DRC’s Ebola outbreak has spread to seven provinces, with 7,773 confirmed cases. North Kivu cases have surged 73% in three weeks, while treatment centres face staff shortages. WHO says transmission remains uncontrolled.
