log_date: '2026-09-25'
summary: The Ebola outbreak in the Democratic Republic of Congo has spread to seven provinces, with 7,773 confirmed cases and a 73% surge in North Kivu, while the WHO warns of health worker shortages. A young doctor died of Ebola in Kisangani, Tshopo province, as cases rise beyond the epicenter. Nearly $3 billion has been pledged for the response, with leaders calling for transparent tracking of funds to ensure they reach frontline workers.
