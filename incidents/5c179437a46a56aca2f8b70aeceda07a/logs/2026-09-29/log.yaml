log_date: '2026-09-29'
summary: This batch reports updated Ebola figures for the DRC outbreak, with 8,067 confirmed cases and 3,901 deaths as of Sept. 26, and confirms cases surpassing 8,000. The outbreak is now described as the deadliest ever recorded in the DRC and the second deadliest globally, with one report citing a vaccine-resistant strain and continued transmission driven by insufficient contact tracing and community deaths.
