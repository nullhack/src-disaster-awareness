title: A Tampa-based doctor returning from Congo on challenges of treating the Ebola outbreak
body: Dr. Adi Nadimpalli, with Doctors Without Borders, spent weeks in the Central African nation, which is facing the second largest Ebola outbreak in recorded history, with more than 8,000 cases and 3,900 deaths.
