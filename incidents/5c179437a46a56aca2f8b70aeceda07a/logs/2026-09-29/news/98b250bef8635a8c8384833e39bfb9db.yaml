title: DR Congo Ebola outbreak exceeds 8,000 cases
body: The Democratic Republic of Congo has logged more than 8,000 cases of Ebola, including almost 4,000 deaths, amid the worst outbreak in the country's history, according to data from the Congolese authorities seen by AFP on Monday.
