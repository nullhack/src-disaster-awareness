title: 'Ébola/RDC: balanço confirma 8.067 casos e 3.901 mortes até 26 de Setembro'
body: O Ministério da Saúde da República do Congo (RDC) divulgou no último domingo, 27, que o surto de Ébola, provocado pelo vírus Bundibugyo, sem tratamento ou vacina conhecidos, atingiu os 8.067 casos e as 3.901 mortes.
