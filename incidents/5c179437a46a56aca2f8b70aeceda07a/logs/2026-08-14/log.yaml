log_date: '2026-08-14'
summary: |-
  The Ebola outbreak in the Democratic Republic of Congo has spread to a sixth province, Bas-Uele, after an infected person traveled from Isiro, resulting in a confirmed death there. Health officials warn the outbreak, already the fastest-spreading on record, continues to surge and risks becoming the deadliest Ebola outbreak in history.
  The Ebola outbreak in DR Congo has spread to a sixth province, Bas-Uele, after a death was recorded there, as confirmed by Africa CDC. Oxfam warns of a lack of resources for response teams. The WHO chief continues to warn that the outbreak could become the deadliest ever, as it already ranks as the fastest-spreading in history.
