title: Ebola outbreak has spread to new province in Congo, the head of Africa CDC says
body: Congo’s Ebola outbreak has spread to a sixth province, after a death was recorded in the previously unaffected Bas-Uele province, Africa CDC Director-General Jean Kaseya said Thursday.
