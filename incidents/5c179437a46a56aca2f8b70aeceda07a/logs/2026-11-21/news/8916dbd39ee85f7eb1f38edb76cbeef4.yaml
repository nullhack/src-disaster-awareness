title: 'Healthcare workers on the front line of Ebola: ‘One day patients may seem fine and the next they are dead’'
body: It has been six months since the outbreak of the deadliest disease in the history of the Democratic Republic of the Congo. There, health workers operate in very difficult conditions. Some have lost loved ones, family members or colleagues
