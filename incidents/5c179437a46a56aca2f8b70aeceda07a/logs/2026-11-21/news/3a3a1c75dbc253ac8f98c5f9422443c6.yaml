title: 'EBOLA: Government suspends concerts in high-risk border districts'
body: Kampala, Uganda | URN | The government has suspended concerts, festivals, rallies and other mass gatherings in high-risk border districts as Uganda intensifies measures to prevent the importation and spread of Ebola Virus Disease. The affected districts span the West Nile, Bunyoro, Rwenzori, and Kigezi sub-regions. According to a public health statement signed by Dr …
