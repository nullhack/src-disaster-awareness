log_date: '2026-11-21'
summary: Uganda has suspended concerts, festivals, rallies and other mass gatherings in high-risk border districts across the West Nile, Bunyoro, Rwenzori and Kigezi sub-regions, and now requires travelers to complete a locator form before boarding, as it escalates measures to keep Ebola out. A Guardian commentary argued the DR Congo outbreak is shaping up to be the worst ever and that local faith leaders, along with adequate funding, will be essential to controlling it, while an El País feature described frontline health workers in DR Congo operating under extremely difficult conditions and mourning lost relatives and colleagues.
