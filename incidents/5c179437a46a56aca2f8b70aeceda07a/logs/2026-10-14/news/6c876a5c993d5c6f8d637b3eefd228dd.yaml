title: Congo's Confirmed Ebola Cases Surpass 9,000 as Bundibugyo Strain Spreads Across Seven Provinces
body: The Democratic Republic of Congo's largest recorded Ebola outbreak has exceeded 9,000 confirmed cases and 4,381 deaths, with transmission continuing across seven provinces despite ongoing response efforts.
