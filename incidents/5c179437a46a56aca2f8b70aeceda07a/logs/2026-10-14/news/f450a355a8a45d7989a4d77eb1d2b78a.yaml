title: DR Congos Ebola cases surpass 9,000
body: The Ebola outbreak in the Democratic Republic of Congo has escalated to 9,066 cases and 4,381 deaths, becoming the countrys deadliest and the worlds second-largest outbreak after the 2014-2016 West Africa epidemic.
