log_date: '2026-10-14'
summary: As of mid-October 2026, the Ebola outbreak in the Democratic Republic of Congo has surpassed 9,000 confirmed cases and over 4,300 deaths, with the Bundibugyo strain spreading across seven provinces. The World Bank committed an additional $93 million to the response, and the WHO announced that the first Ebola vaccine trial for this strain is expected to begin within weeks. Kenya confirmed a second imported case linked to the outbreak, while fears of the virus are causing mothers and children to avoid healthcare, contributing to a surge in maternal deaths.
