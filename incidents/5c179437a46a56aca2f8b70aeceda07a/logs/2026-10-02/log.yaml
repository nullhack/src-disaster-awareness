log_date: '2026-10-02'
summary: DR Congo's Ebola outbreak has surpassed 8,000 confirmed cases amid a shortage of health workers, while the Africa CDC chief says contact tracing is falling far short, with only about 30,000 exposed people identified. Save the Children reports 961 children have died—about seven per day on average—with under-fives at greatest risk. Separately, NanoViricides has begun enrollment and dosing in a Phase II clinical trial of the oral drug NV-387 to treat Ebola.
