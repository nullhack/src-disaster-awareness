title: 'DRC: Seven children a day on average have died of Ebola, with under-fives at greatest risk'
body: About seven children on average have died every day of the Ebola virus since the outbreak was declared in the Democratic Republic of Congo (DRC) on 15 May, with 961 children now confirmed to have died from the disease, said Save the Children.
