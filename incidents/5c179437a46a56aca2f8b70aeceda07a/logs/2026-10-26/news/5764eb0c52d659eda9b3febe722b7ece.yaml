title: Nurse killed during Ebola response in DR Congo — BBC News World
body: A nurse was killed and another health worker seriously injured in an attack during an Ebola response in northeastern DR Congo, according to Radio Okapi. Uganda has imposed travel restrictions amid the risk of the virus spreading.
