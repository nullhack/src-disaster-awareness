title: 'Ebola: Uganda Announces 21-Day Quarantine For Returnees From DR Congo'
body: Ugandans returning home from DR Congo — which has been hit by its worst-ever Ebola outbreak — will be required to spend 21 days in quarantine, the health ministry said on Sunday.
