title: 'RDC : des combats près d’un hôpital de l’Ituri perturbent la riposte contre Ebola'
body: 'D’intenses combats près d’un hôpital de la province de l’Ituri, en République démocratique du Congo, ont perturbé les opérations de lutte contre Ebola et contraint des équipes de riposte et les partenaires humanitaires à se réfugier dans un service de maternité depuis plus de 24 heures, a alerté l''Organisation mondiale de la Santé (OMS). L''agence onusienne a lancé dimanche un appel à la paix en Ituri où ces violences menacent les soignants. « De violents combats se poursuivent depuis hier (samedi) dans les environs d’un hôpital en Ituri - dans une zone proche de l’endroit où la flambée d’Ebola est apparue pour la première fois », a déclaré sur le réseau social X le Directeur général de l’OMS, Tedros Adhanom Ghebreyesus. Il a indiqué que cette situation a perturbé le fonctionnement de l’hôpital ainsi que l’ensemble de la riposte à Ebola, « exposant gravement les patients, les familles et les agents de santé ». L’OMS travaille avec des partenaires humanitaires afin d’assurer une sortie
  en toute sécurité au personnel piégé dans l’établissement médical et a appelé à la protection des personnels hospitaliers, des patients et des établissements de santé, a souligné le Dr Tedros, rappelant que « le meilleur des remèdes, c’est la paix». L’Ituri demeure l’épicentre de l’épidémie L’épidémie d’Ebola dans l’est de la République démocratique du Congo reste hors de contrôle plus de six mois après sa déclaration initiale, le nombre de cas et de décès augmentant à un rythme record. Le dernier décompte du 20 novembre fait état 11 762 cas confirmés, dont 5 775 décès dans 68 zones sanitaires réparties dans huit provinces, dans ce qui est devenu la pire épidémie d’Ebola jamais enregistrée dans le vaste pays d’Afrique centrale, selon l’OMS. La province de l’Ituri demeure l’épicentre de l’épidémie, avec un total cumulé de 8028 cas confirmés et 3 791 décès, soit un taux de létalité de 47 %. La province concentre plus des deux tiers des cas confirmés cumulés et près de 60 % des nouveaux cas
  notifiés. Sur les 39 nouveaux cas confirmés notifiés lors du dernier rapport épidémiologique, l’Ituri recense plus de la moitié avec 23 nouveaux cas. « L’insécurité reste l’un des principaux obstacles » Les attaques se multiplient dans l’est de la RDC depuis la fin octobre, « ce qui affecte gravement la lutte contre Ebola », a déploré le Dr Tedros. Lors de son point de presse hebdomadaire, la semaine dernière, il a souligné que « l’insécurité reste l’un des principaux obstacles » à la riposte contre le virus Bundibugyo. L’attaque brutale menée début novembre contre la ville de Cantine-Aloya en illustre les conséquences. Elle a non seulement coûté la vie à 66 civils, dont trois professionnels de santé, mais aussi gravement compromis le suivi des contacts : les équipes de riposte ont perdu de vue plus de 1 000 personnes contacts de cas d’Ebola. Dans la province de Tshopo, une autre attaque survenue en novembre a tué une infirmière et grièvement blessé un autre professionnel de santé alors
  qu’ils répondaient à une alerte Ebola. Selon l’OMS, cette attaque a empêché l’ouverture d’un centre de traitement et favorisé la propagation du virus. « De telles attaques dissuadent également les personnes de se faire soigner dans un centre de traitement d’Ebola », a averti le Dr Tedros.'
