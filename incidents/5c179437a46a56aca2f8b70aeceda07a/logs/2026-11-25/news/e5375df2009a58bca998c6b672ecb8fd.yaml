title: WHO evacuates staff from hospital in DR Congo
body: The World Health Organization (WHO) has temporarily relocated its Ebola response team from a hospital in Akwe, Ituri Province, in the Democratic Republic of Congo (DR Congo), following intensified fighting that forced health workers to take shelter for more than three days.
