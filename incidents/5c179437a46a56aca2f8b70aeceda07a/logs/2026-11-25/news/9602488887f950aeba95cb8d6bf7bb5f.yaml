title: Nearly 6 in 10 Women and Girls Surveyed in Ituri Report New or Worsening Violence | Health
body: At eight safe spaces that SOFEPADI kept open in Ituri, visits rose from 1,183 between January and March to 3,548 between July and September, an increase of about 200%.
