log_date: '2026-11-25'
summary: A UNICEF survey in Ebola-hit Ituri found that visits to safe spaces for women and girls rose by about 200% between January–March and July–September, with nearly 6 in 10 reporting new or worsening violence. Separately, the WHO chief said an Ebola team was evacuated from a DR Congo hospital and temporarily relocated until the situation calms after fierce fighting.
