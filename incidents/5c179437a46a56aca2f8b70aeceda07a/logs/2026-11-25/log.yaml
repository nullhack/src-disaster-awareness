log_date: '2026-11-25'
summary: |-
  A UNICEF survey in Ebola-hit Ituri found that visits to safe spaces for women and girls rose by about 200% between January–March and July–September, with nearly 6 in 10 reporting new or worsening violence. Separately, the WHO chief said an Ebola team was evacuated from a DR Congo hospital and temporarily relocated until the situation calms after fierce fighting.
  Intensified fighting in Ituri Province forced the WHO to temporarily relocate its Ebola response team from a hospital in Akwe, after health workers were forced to shelter for more than three days. Reports link the paralysis of the Ebola response in the area to the offensive by Thomas Lubanga's rebellion, with clashes blocking roads needed to reach patients. Coverage also highlights that local customs, rites, and community suspicion remain major obstacles for health workers in eastern DR Congo.
