log_date: '2026-11-12'
summary: Six months into the outbreak, MSF reported that the DRC Ebola epidemic remains out of control, with many cases likely missed and transmission in hospitals still rampant. An expert warned the virus could continue spreading for another year given the conflict and community mistrust. Kenya announced plans to impose a 21-day quarantine on its citizens returning from the DRC, and a spike in attacks on journalists was partly attributed to their Ebola reporting.
