log_date: '2026-11-12'
summary: |-
  Six months into the outbreak, MSF reported that the DRC Ebola epidemic remains out of control, with many cases likely missed and transmission in hospitals still rampant. An expert warned the virus could continue spreading for another year given the conflict and community mistrust. Kenya announced plans to impose a 21-day quarantine on its citizens returning from the DRC, and a spike in attacks on journalists was partly attributed to their Ebola reporting.
  As of November 12, 2026, the DR Congo Ebola outbreak has surpassed 11,000 confirmed cases and 5,387 deaths, with MSF warning it remains out of control due to funding gaps, unpaid staff, and supply shortages. Kenya discharged its last Ebola patient and began the 42-day countdown to being declared Ebola-free, while attacks on health workers and journalists continue to hamper containment efforts. New research also indicates the virus circulated undetected for weeks before the outbreak was officially recognized.
