title: 'Before the first case: WHO helps South Sudan prepare for Ebola Bundibugyo virus Disease'
body: Juba - In Nabanga, a South Sudanese town bordering the Democratic Republic of Congo (DRC), fear of the ongoing Bundibugyo Virus disease (BVD) outbreak is already shaping daily life. In September a joint assessment by health authorities and partners identified 3 450 people who had crossed into South Sudan from the DRC amid rumors and growing community concern. Although South Sudan has not reported any confirmed cases of BVD, the continued movement of people has increase anxiety about the possible spread of the disease.
