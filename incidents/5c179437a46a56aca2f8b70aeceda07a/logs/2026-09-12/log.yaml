log_date: '2026-09-12'
summary: The Ebola outbreak in DR Congo has spread to a seventh province, South-Ubangi, and confirmed cases have now surpassed 7,000, with over 3,300 deaths reported as of early September. Africa's top health body warns the virus is rapidly spreading beyond its epicenter in eastern Congo, threatening neighboring nations. Meanwhile, one report indicates a slight downward trend in cases, though the peak has not yet been confirmed.
