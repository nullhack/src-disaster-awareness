title: United States Pledges Additional Life-Saving Health Assistance in Response to Ebola Outbreak - United States Department of State
body: Today, on the margins of the High-Level Week of the 81st United Nations General Assembly in New York, the U.S. Department of State announced an additional $267 million in direct life-saving health and humanitarian assistance for the response to the Ebola outbreak in the Democratic Republic of the Congo (DRC). With this new life-saving global […]
