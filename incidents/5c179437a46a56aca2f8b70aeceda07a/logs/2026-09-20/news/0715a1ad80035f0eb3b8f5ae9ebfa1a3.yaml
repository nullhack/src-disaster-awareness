title: DR Congo launches Ebola vaccination drive in Bunia for health workers, death toll nears 3,700
body: Major-General Gaby Kasongo Mulumba, acting as the provincial governor, said the health workers there are particularly exposed and deeply involved in the response. It is estimated that around 50,000 health and other frontline workers will be vaccinated with the Ervebo vaccine.
