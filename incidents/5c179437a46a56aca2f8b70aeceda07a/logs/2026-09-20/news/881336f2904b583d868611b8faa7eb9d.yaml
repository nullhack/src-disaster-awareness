title: Congo begins Ebola vaccinations for health workers in the epicentre of the outbreak
body: BUNIA, Congo - Congo on Saturday (Sept 19) began vaccinating healthcare staff against Ebola in Bunia, the epicentre of the fastest-growing outbreak of the disease in history as they are "particularly exposed and deeply involved in the response," the provincial governor said.Health workers and other front-line workers in the Ebola response are being prioritised to receive the Ervebo vaccine that...
