log_date: '2026-09-20'
summary: As of mid-September 2026, the DRC began vaccinating healthcare workers in Bunia against Ebola, with 50,000 frontline staff enrolled in a clinical trial to test the Ervebo vaccine against the Bundibugyo strain. New data indicates that over 54% of confirmed patients are women, while girls account for 51% of cases among those aged 10-17. Meanwhile, Africa CDC cautioned against declaring the outbreak has peaked, underscoring ongoing concerns about its trajectory.
