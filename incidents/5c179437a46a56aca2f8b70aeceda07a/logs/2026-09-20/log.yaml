log_date: '2026-09-20'
summary: |-
  As of mid-September 2026, the DRC began vaccinating healthcare workers in Bunia against Ebola, with 50,000 frontline staff enrolled in a clinical trial to test the Ervebo vaccine against the Bundibugyo strain. New data indicates that over 54% of confirmed patients are women, while girls account for 51% of cases among those aged 10-17. Meanwhile, Africa CDC cautioned against declaring the outbreak has peaked, underscoring ongoing concerns about its trajectory.
  As of late September 2026, the Ebola outbreak in DR Congo has surpassed 7,500 confirmed cases and 3,639 deaths, making it one of the deadliest on record. The DRC has begun vaccinating frontline health workers in Bunia, the epicenter, with an estimated 20,000 to 50,000 workers targeted in a trial to test the Ervebo vaccine against the Bundibugyo strain. Additionally, Africa CDC welcomed a U.S.-convened G20+ meeting to coordinate international response efforts.
