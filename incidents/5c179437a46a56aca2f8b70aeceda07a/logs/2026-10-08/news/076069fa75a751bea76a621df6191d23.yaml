title: Ebola Deaths Top 4,100 as Kenya Confirms First Imported Bundibugyo Case | Contagion Live
body: Kenya reported its first imported Bundibugyo Ebola death as the Democratic Republic of Congo (DRC) outbreak surpassed 8,600 confirmed cases and 4,148 deaths, with 896 patients hospitalized in isolation. Here is a report on the latest numbers as well as vaccine and therapeutic study updates.
