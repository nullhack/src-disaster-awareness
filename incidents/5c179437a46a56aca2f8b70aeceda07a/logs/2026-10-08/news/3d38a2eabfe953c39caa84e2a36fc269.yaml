title: Safe and dignified burials help prevent the spread of Ebola
body: Bunia, Democratic Republic of the Congo—In Ituri Province, in eastern Democratic Republic of the Congo, safe and dignified burials play a critical role in the fight against Ebola. The disease spreads through direct contact with the bodily fluids of an infected person, and after death, certain burial practices can expose family members to the virus if appropriate protective measures are not in place. In a region where funeral rites are central to community life, protecting families while respecting traditions remains essential.
