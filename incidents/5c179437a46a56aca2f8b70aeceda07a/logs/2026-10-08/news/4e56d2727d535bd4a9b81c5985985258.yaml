title: Somalia screens travelers after Kenya confirms imported Ebola case - Hiiraan Online
body: Mogadishu (HOL) — Somalia has begun screening travelers arriving from African countries after Kenya confirmed an imported case of Bundibugyo Ebola virus disease, Health Minister Dr. Ali Haji Adan said on Thursday.
