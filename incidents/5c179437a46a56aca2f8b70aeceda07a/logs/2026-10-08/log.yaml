log_date: '2026-10-08'
summary: 'The DR Congo Ebola outbreak has surpassed 8,600 confirmed cases and 4,148 deaths, with the Africa CDC chief warning that over 70% of new cases are unidentified contacts, leaving the outbreak out of control. Following Kenya''s confirmation of its first imported Ebola death, regional measures have intensified: the EAC health ministers agreed on a new cross-border strategy, Somalia began screening travelers, the UK retained travel warnings for parts of Kenya, and Kenyan health workers have demanded better protection. WHO praised Kenya''s prompt response, while safe burial practices continue to be emphasized in affected areas of DR Congo.'
