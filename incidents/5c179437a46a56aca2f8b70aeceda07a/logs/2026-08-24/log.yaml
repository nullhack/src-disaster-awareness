log_date: '2026-08-24'
summary: |-
  As of August 24, confirmed Ebola cases in the DRC have reached 5,515 with a case fatality rate approaching 48%, and the death toll has surpassed 2,600. Pope Leo has urged the international community to intensify efforts to contain the outbreak, while miners in affected areas continue to risk exposure to the virus to sustain their livelihoods.
  New reports indicate that the Ebola outbreak in the Democratic Republic of Congo recorded one of its highest weekly death tolls yet, with over 300 deaths in the past week. Additionally, Ebola responders were chased with machetes while attempting to bury a victim, highlighting the ongoing violence hampering the response.
