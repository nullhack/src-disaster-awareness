title: Fighting in eastern Congo forces Ebola workers to evacuate, threatening outbreak response - Inside Politics
body: Escalating fighting in eastern Congo has forced Ebola response workers to leave affected areas and disrupted efforts to contain the deadliest outbreak in the country, health officials and humanitarian workers said Wednesday.
