title: Ebola outbreak in Congo reaches 12,000 cases as violence forces some responders to evacuate
body: The fast-moving Ebola outbreak in eastern Congo has topped 12,000 confirmed cases, government data showed Thursday, as fighting between rebels and the army disrupts efforts to contain the spread of the disease.
