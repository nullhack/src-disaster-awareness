log_date: '2026-11-26'
summary: |-
  Government data reported on Nov. 26 showed confirmed Ebola cases in the Democratic Republic of Congo have surpassed 12,000 as responders continue to struggle to contain the outbreak. A Reuters investigation described hidden deaths and the broader scale of the disaster through accounts from graveyards, while Gavi signed an advance purchase agreement with the Serum Institute of India for up to 1.5 million doses of the ChAdOx1 BDBV candidate vaccine. Reports also said fighting in eastern Congo disrupted monitoring and forced Ebola workers to evacuate, leaving some treatment centers understaffed.
  Ebola cases in the Democratic Republic of the Congo have surpassed 12,000, with deaths rising to 5,900, while fighting in eastern Congo forced Ebola responders to evacuate and disrupted containment efforts. The batch also reports that a Kenyan court found the government breached the constitution in building a U.S.-backed Ebola quarantine site, that the CDC extended Ebola-related entry suspensions affecting green-card holders, and that the outbreak is increasing vulnerability to gender-based violence.
