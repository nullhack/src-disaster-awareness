log_date: '2026-11-26'
summary: Government data reported on Nov. 26 showed confirmed Ebola cases in the Democratic Republic of Congo have surpassed 12,000 as responders continue to struggle to contain the outbreak. A Reuters investigation described hidden deaths and the broader scale of the disaster through accounts from graveyards, while Gavi signed an advance purchase agreement with the Serum Institute of India for up to 1.5 million doses of the ChAdOx1 BDBV candidate vaccine. Reports also said fighting in eastern Congo disrupted monitoring and forced Ebola workers to evacuate, leaving some treatment centers understaffed.
