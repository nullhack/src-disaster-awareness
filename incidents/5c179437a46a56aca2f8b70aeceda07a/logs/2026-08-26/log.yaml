log_date: '2026-08-26'
summary: As of late August 2026, confirmed Ebola cases in the Democratic Republic of Congo have surpassed 5,500 with over 2,600 deaths, marking one of the highest weekly death tolls yet with more than 300 deaths in the past week. The outbreak remains the fastest-spreading on record, and health workers continue to struggle to contain the virus amid persistent challenges.
