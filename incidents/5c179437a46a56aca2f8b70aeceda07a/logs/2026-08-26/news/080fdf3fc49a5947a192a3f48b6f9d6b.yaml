title: DR Congo Ebola cases top 5,500 as WHO warns of crisis
body: CONFIRMED Ebola cases in the Democratic Republic of the Congo (DRC) have surpassed 5,500, with more than 2,600 deaths, government figures showed Monday. The World Health Organisation (WHO) said the outbreak reached a “defining moment” more than 100 days after it was declared. The latest official tally, with data through Saturday, recorded 5,514 confirmed cases […]
