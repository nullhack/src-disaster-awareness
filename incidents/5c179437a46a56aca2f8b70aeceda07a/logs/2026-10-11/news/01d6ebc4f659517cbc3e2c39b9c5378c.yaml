title: Weekly Health Update | Ebola Slows in Parts of DR Congo, but Cross-Border Spread Raises Concern
body: The Bundibugyo Ebola outbreak was reported in another African country this week. Kenya confirmed its first imported case. Meanwhile, Côte d’Ivoire is tackling a yellow fever outbreak. In Nigeria, Borno state has recorded more than 68,000 suspected cholera cases, while rabies is spreading across 16 states. Five African countries are...
