title: This village chief lost four family members to Ebola. Now he’s fighting to save others
body: The biggest enemy he is facing, Alphonse bin Kitobi Achou Taibo says, is mistrust in this part of the country, where many compare Ebola to poison and some local pastors associate it with evil spirits.
