log_date: '2026-11-01'
summary: |-
  As of October 29, 2026, the Democratic Republic of Congo's Ebola outbreak has reached 10,351 confirmed cases and 5,340 deaths, according to the health ministry. Africa's top doctor warned Canada that "no one is safe" as the outbreak surges, citing risks of massive cross-border spread. Separately, a village chief continues to combat mistrust and misinformation in affected communities.
  Multiple reports confirm the DR Congo Ebola outbreak has surpassed 5,000 deaths with over 10,000 cases, as the virus continues to spread across borders. New measures include Avianca requiring an Ebola form for US‑bound passengers from November 3, while an Ebola scare in Adamawa, Nigeria was resolved with two negative tests on October 31.
