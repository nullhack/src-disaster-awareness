log_date: '2026-11-01'
summary: As of October 29, 2026, the Democratic Republic of Congo's Ebola outbreak has reached 10,351 confirmed cases and 5,340 deaths, according to the health ministry. Africa's top doctor warned Canada that "no one is safe" as the outbreak surges, citing risks of massive cross-border spread. Separately, a village chief continues to combat mistrust and misinformation in affected communities.
