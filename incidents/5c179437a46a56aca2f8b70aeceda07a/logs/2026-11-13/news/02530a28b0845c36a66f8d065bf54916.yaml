title: Kenya Discharges Last Ebola Patient, Begins 42-Day Countdown - Somali News today Live
body: NAIROBI, Kenya discharged its last Ebola patient on Wednesday, starting a 42-day countdown that would allow the country to be declared free of the disease on December 23 if no new cases are recorded, Health Cabinet Secretary Aden Duale announced at a press conference in Nairobi. “For the first time since this outbreak began, Kenya has no patient under treatment and no contact in quarantine,” Duale said, adding that the final 11 contacts had completed their 21-day monitoring period and returned home in good health. The milestone comes 37 days after Kenya confirmed its first imported case of the Bundibugyo strain on October 6, in a Kenyan citizen who had travelled from the Democratic Republic of Congo through Uganda. Nine people tested positive in Kenya. Seven recovered, including five who were discharged on November 3, a sixth on November 6, and the final patient on Wednesday. Two people died, the index case and his mother. All nine cases remained within a single transmission cluster,
  with no evidence of community transmission, according to the health ministry. How the Outbreak Was Contained The first patient, a 40-year-old man who had lived in Congo for seven years, travelled by road to Uganda and then flew to Nairobi on October 3, arriving on a commercial flight without being flagged at the airport. He died on October 5. Kenyan authorities traced 135 contacts, including family members, health workers, and passengers and crew on the same flight. The secondary cases included four family members and four health workers who had cared for him before Ebola was suspected. Every secondary case was already in quarantine when they developed symptoms, a detail that health officials credit with preventing wider transmission. “Every one of them was already in quarantine when they fell ill,” Duale said. “Because of this, the […]
