log_date: '2026-11-13'
summary: |-
  Updated figures indicate the Ebola outbreak in DR Congo has killed more than 5,500 people and surpassed 11,000 cases. Médecins Sans Frontières has called on the government and UN to ensure rigorous use of resources, and Africa CDC warns that attacks on health workers are impeding containment. Kenya is also in talks with Saudi Arabia to lift Ebola travel restrictions on its citizens.
  UN officials hailed progress in the Ebola response but cited insecurity as the biggest remaining challenge. Attacks on health workers and facilities continue to hamper containment, and Médecins Sans Frontières warned that funds meant for the response are not reaching frontline workers. Uganda kept its border with DRC closed, while the WHO reported rising infections and violence, noting that in some areas more people are being killed by Allied Democratic Forces fighters than by Ebola.
