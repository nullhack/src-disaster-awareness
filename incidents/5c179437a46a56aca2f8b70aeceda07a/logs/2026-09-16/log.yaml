log_date: '2026-09-16'
summary: As of mid-September 2026, the DRC Ebola outbreak has reached at least 7,258 confirmed cases and 3,510 deaths, according to new reports. While the WHO reports "encouraging signs" of improvement and notes slowing transmission in parts of Ituri province, officials caution the epidemic is "far from over," with cases climbing fast in North Kivu and continuing to spread in other affected areas.
