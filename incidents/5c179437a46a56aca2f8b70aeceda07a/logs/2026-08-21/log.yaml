log_date: '2026-08-21'
summary: As of August 21, 2026, the Ebola outbreak in DR Congo has killed over 2,500 people, with the UN warning it is spreading exponentially and covering an area larger than France. The outbreak continues to grow faster and wider amid conflict, funding shortages, and attacks on health workers, though the WHO has allocated 70,000 doses of the Ervebo vaccine in an effort to boost containment.
