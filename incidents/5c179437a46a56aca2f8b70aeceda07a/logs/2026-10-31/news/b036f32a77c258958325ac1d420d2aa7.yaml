title: Congo's Ebola deaths top 5,000 as fear of continent-wide spread mounts
body: BUNIA, Congo (AP) — Deaths in Congo’s Ebola outbreak have topped 5,000 as the country grapples with the relentless spread of the disease and cases are recorded in other African countries, the latest government data on Saturday shows.
