log_date: '2026-10-31'
summary: |-
  The Ebola death toll in DR Congo has surpassed 5,000, with over 10,000 confirmed cases. Vaccine trials targeting the Bundibugyo strain have begun in the country.
  The DR Congo health ministry reported a case‑fatality rate of 48.6% in the Ebola outbreak, as the death toll has exceeded 5,000. Authorities continue to face the relentless spread with no approved treatments or vaccines available, and the outbreak remains the second deadliest in history, raising fears of a wider African epidemic.
