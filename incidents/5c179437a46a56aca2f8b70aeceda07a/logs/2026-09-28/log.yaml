log_date: '2026-09-28'
summary: 'The Ebola outbreak in DR Congo has now surpassed 8,000 confirmed cases, with nearly 4,000 deaths. Violence continued to hinder the response: a politician was beaten to death after urging Ebola prevention on a radio program, and the UN reported worsening clashes hampering emergency efforts. The East African Community also announced a $45 million funding appeal to strengthen the regional response.'
