log_date: '2026-08-29'
summary: Congo began vaccinating people against Ebola on August 28, 2026, deploying 16,250 Ervebo doses in an effort to slow the fastest-growing outbreak in history, which has now spread to 60 health zones with 5,794 confirmed cases and 2,786 deaths. The United States donated experimental antibody treatments to Uganda to bolster preparedness, while Canada extended Ebola travel restrictions for another 30 days. Ongoing attacks on health workers and the unproven efficacy of Ervebo against the Bundibugyo strain continue to complicate response efforts.
