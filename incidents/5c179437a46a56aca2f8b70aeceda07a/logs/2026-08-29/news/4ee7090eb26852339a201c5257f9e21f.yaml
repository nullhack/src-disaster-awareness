title: DR Congo launches Ebola vaccination campaign
body: KINSHASA, 28th August, 2026 (WAM) -- The Democratic Republic of the Congo began vaccinating people against Ebola on Thursday as health authorities work to slow the deadliest outbreak of the disease recorded in the country.
