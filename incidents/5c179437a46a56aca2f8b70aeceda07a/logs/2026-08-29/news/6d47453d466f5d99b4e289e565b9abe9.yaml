title: US Gives Uganda Experimental Ebola Treatment As DRC Outbreak Continues to Spread
body: The United States has given Uganda doses of an experimental Ebola treatment as the country strengthens preparations against possible new infections from the Democratic Republic of Congo (DRC), where a major Bundibugyo virus outbreak continues to spread.
