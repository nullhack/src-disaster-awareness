log_date: '2026-08-07'
summary: The World Health Organization's director-general stated that the Ebola outbreak in the Democratic Republic of Congo is spreading faster than response efforts can contain, as aid workers continue to strike over unpaid wages. A Reuters explainer highlighted factors driving the rapid spread, including conflict, community mistrust, and a lack of approved treatments or vaccines for the Bundibugyo strain. These developments underscore the ongoing challenges in containing the fastest-growing Ebola outbreak on record.
