log_date: '2026-10-29'
summary: |-
  New reports provide updated details on the outbreak's scope: it has expanded to 66 health zones across eight provinces, and 80% of cases are now outside known transmission networks. These figures highlight the ongoing difficulties in containing the virus, which continues to outpace response efforts.
  The Ebola outbreak in the Democratic Republic of Congo has surpassed 10,000 cases and reached a death toll of 4,960. In response, the Central African Republic has tightened its border controls, and airlines have asked the CDC to review travel declarations for US‑bound passengers. Meanwhile, a village chief’s efforts to combat misinformation highlight ongoing community‑level challenges.
