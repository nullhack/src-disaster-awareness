log_date: '2026-07-30'
summary: As of late July 2026, the DRC's Ebola outbreak has topped 3,200 cases and 1,405 deaths, nearing the record of the country's worst 2018-2020 outbreak. The first person has been vaccinated against the Bundibugyo variant in an Oxford vaccine trial, while healthcare workers continue strikes over unpaid wages, and the UN warns the outbreak is worsening hunger in eastern Congo. Meanwhile, Uganda has officially declared itself Ebola-free after its last patient was discharged in June.
