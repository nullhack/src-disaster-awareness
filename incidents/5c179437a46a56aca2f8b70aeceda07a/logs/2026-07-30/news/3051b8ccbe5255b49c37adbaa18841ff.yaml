title: 'Bundibugyo Ebola Hits 3,200 Cases: Unpaid Doctors Strike as Oxford''s Vaccine Trial Begins'
body: Bundibugyo Ebola outbreak in the DRC has surged to 3,200 confirmed cases and 1,405 deaths — the fastest case growth ever recorded in any Ebola outbreak — as healthcare workers walk off the job over unpaid wages and Oxford's ChAdOx1 viral vector vaccine becomes the first Bundibugyo-specific shot tested in humans.
