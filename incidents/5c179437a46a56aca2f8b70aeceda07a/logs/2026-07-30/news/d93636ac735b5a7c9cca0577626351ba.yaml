title: Uganda declares itself Ebola-free as Congo continues to struggle with the outbreak
body: Authorities in Uganda declared the East Africa nation free of Ebola on Tuesday following the discharge of the country's last patient in mid-June, a delicate milestone as the virus continues to plague neighboring Congo.
