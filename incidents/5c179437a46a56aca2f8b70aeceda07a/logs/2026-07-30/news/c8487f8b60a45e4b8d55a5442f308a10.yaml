title: DR Congo's Ebola outbreak tops 3,000 cases
body: Medics have recorded more than 3,000 Ebola cases, including 1,354 deaths, in the Democratic Republic of Congo's 17th outbreak, officials said Sunday, after infections surged by around 1,000 in just 10 days.
