title: EBOLA BUNDIBUGYO VIRUS DISEASE OUTBREAK Democratic Republic of the Congo | Uganda Weekly External Situation Report 21, Data as of 04 October 2026
body: Event descriptionThe ongoing Bundibugyo virus disease (BVD) outbreak in the Democratic Republic of the Congo has now extended to Kenya, the fourth country affected during the current outbreak, following earlier detections in Uganda and France, where the events have since been controlled. Kenya has reported its first confirmed case and associated death in a traveller arriving from the Democratic Republic of the Congo. This latest development further underscores the regional and international dimensions of the outbreak and the continuing risk of cross-border spread.
