log_date: '2026-11-02'
summary: The United States imposed a requirement that from November 3 all passengers traveling to the US from any country must sign an Ebola form certifying they have not been in the DR Congo in the past 21 days. Former Irish President Mary Robinson urged G20 countries to disburse the full €3 billion pledged for the Ebola response, saying Europe does not “care enough” about the outbreak. A report also indicates that mortality in the DR Congo Ebola outbreak has now exceeded 50 %.
