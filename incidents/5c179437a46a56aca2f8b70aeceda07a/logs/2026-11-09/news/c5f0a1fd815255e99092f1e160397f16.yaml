title: Ebola posters for Kenya in English and Kiswahili
body: The Ministry of Health with support from WHO and partners have produced a set of 20 posters to help people in Kenya understand Ebola and protect themselves, their families and their communities.The posters explain how Ebola spreads and its early symptoms, correct common myths, and cover contact tracing, safe and dignified burials, and the role of health workers, community health promoters and faith and community leaders. They also encourage people to stop stigma and to check facts before sharing information.The posters are available in English and Kiswahili.
