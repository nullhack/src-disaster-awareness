log_date: '2026-08-12'
summary: As of August 11, 2026, confirmed Ebola deaths in the Democratic Republic of Congo have surpassed 2,000, with 2,011 deaths reported, making the outbreak the fastest-spreading on record and the second deadliest in history. New reports indicate the outbreak began in February, months before it was declared, and continued challenges include rebel conflict, bad roads, and health worker protests over unpaid wages.
