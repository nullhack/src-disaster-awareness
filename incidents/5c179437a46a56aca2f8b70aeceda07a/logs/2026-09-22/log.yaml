log_date: '2026-09-22'
summary: As of September 21, 2026, the Ebola outbreak in DR Congo continues to spread, with transmission shifting from the original epicenter to new regions with limited healthcare infrastructure, according to a report from The World. Africa CDC has welcomed the U.S.-led G20+ foreign ministers' meeting on Ebola scheduled for September 23, calling for united action and transparency. Additionally, a vaccine trial for the Bundibugyo strain has begun in DR Congo, involving frontline health workers, as reported by multiple outlets.
