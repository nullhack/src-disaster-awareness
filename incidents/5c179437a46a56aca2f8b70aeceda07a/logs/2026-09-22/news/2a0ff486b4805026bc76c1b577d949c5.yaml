title: Africa CDC salue le leadership des États-Unis dans la tenue de la réunion G20+ sur Ebola et appelle à une action unie, à une mise en œuvre accélérée et à une transparence totale – Africa CDC
body: Addis-Abeba, le 20 septembre 2026 – Le Centre africain de contrôle et de prévention des maladies (Africa CDC) salue le leadership des États-Unis dans la convocation de la Réunion des ministres des Affaires étrangères du G20 sur l’accélération de l’action collective pour vaincre Ebola, qui se tiendra le 23 septembre 2026 à New York, en […]
