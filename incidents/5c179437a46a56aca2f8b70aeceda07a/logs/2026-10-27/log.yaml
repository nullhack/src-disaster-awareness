log_date: '2026-10-27'
summary: |-
  Kenya released 20 Ebola contacts from quarantine and now has 98 still under monitoring, with officials eyeing an end to the outbreak after 42 days. The UN and WHO condemned the killing of a nurse in DR Congo, while Nigeria’s Ebola patient—a Swiss diplomat’s wife—was evacuated to Switzerland for treatment. A new report also highlights the growing mental health toll on families in eastern Congo.
  The Ebola outbreak in DR Congo has surpassed 10,000 confirmed cases with the death toll approaching 4,900, marking a significant escalation. Violence against health workers persists: a nurse treating Ebola patients was killed by a machete-wielding mob and another responder was injured. A new vaccine trial, the TUMAini trial, has begun in Ituri province to test a candidate against the Bundibugyo strain.
