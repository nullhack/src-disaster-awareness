log_date: '2026-08-22'
summary: Data from authorities and Africa CDC suggests the Congo Ebola outbreak has not peaked and could be three times the current known size, on track to potentially surpass history's largest outbreak. The first 16,000 doses of the Ervebo vaccine have arrived in the country as part of a larger 70,000-dose allocation, with the health minister confirming the shipment amid the fastest Ebola outbreak in history.
