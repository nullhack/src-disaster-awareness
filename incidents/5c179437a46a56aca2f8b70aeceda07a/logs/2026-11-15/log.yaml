log_date: '2026-11-15'
summary: Six months after its declaration, the Ebola outbreak in DR Congo remains uncontrolled, with over 11,000 cases and a near-50% fatality rate. Clinical trials for vaccines and treatments have begun in the hard-hit Bunia area, offering cautious hope. An ADF attack sent about 180 patients fleeing from a health center, underscoring persistent security threats to containment efforts.
