title: France to step up Ebola funding in Congo amid resurgence fears, minister says - MyJoyOnline
body: France will step up its support for efforts to eradicate Ebola in eastern Democratic Republic of Congo, Foreign Minister Jean-Noel Barrot said on Saturday during a visit to a region hit by the virus, warning that it could quickly resurge if vigilance waned.
