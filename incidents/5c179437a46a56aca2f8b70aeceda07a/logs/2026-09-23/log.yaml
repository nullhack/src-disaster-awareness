log_date: '2026-09-23'
summary: As of late September 2026, the WHO reports the DR Congo Ebola outbreak has reached 7,700 confirmed cases and 3,700 deaths. The WHO warns of a critical shortage of health workers as cases in North Kivu rose 73% over three weeks, and a vaccine trial using 20,000 Ervebo doses has begun in Ituri province. In response, Nigeria has heightened alert and announced screening for travelers from affected countries.
