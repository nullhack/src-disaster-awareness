title: Congo's Ebola outbreak is second-largest on record, latest data shows
body: By Clement Bonnerot and AyenDeng Bior July 31 (Reuters) - Democratic Republic of Congo's fast-spreading Ebola outbreak is now the world's second-largest on record, government data showed on Friday, as transmission continues to outpace efforts to contain the epidemic.
