log_date: '2026-08-03'
summary: The Ebola outbreak in the Democratic Republic of Congo has become the largest ever recorded in the country, according to the WHO. Pregnant women in eastern Congo are increasingly avoiding hospitals due to Ebola fears, leading to a rise in maternal deaths. Meanwhile, health officials report that aid cuts associated with Trump and Elon Musk's policies are hampering the response by reducing supplies and operational support.
