log_date: '2026-07-26'
summary: More health workers have gone on strike over payment issues, disrupting care, as confirmed cases approach 3,000 with over 1,300 deaths after a provincial data review. The virus is spreading in cramped displacement camps in Ituri province, and researchers have begun the first trials of an Ebola vaccine. Experts warn that the chaos in DR Congo poses risks beyond the country's borders.
