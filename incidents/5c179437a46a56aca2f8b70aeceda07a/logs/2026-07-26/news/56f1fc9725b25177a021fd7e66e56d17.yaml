title: Weekly Health Update | Africa Pushes Health Sovereignty; Ebola Vaccine Trial Begins
body: This week in Africa, an extraordinary African Union health summit in Accra made health sovereignty, ending AIDS and reducing maternal mortality top continental priorities. As the Ebola outbreak continues to worsen in the Democratic Republic of Congo, researchers have begun the first trials of a vaccine and a post-exposure preventive...
