title: '‘We will all die from Ebola here’: Virus stalks crowded camps in Congo - The Boston Globe'
body: Here in the camps that dot Ituri province, the epicenter of the Ebola outbreak in Congo, the virus appears to be spreading among the cramped tents that house more than 1 million displaced Congolese.
