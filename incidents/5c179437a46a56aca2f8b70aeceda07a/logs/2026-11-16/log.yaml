log_date: '2026-11-16'
summary: |-
  The Bundibugyo Ebola outbreak in the Democratic Republic of Congo has reached 11,145 confirmed cases and 5,437 deaths, making it the second-largest Ebola outbreak on record. On November 15, Africa's top public health agency said the outbreak remained out of control six months in, with conflict continuing to hamper the response.
  New reports put the DR Congo Ebola death toll above 5,500, with Ituri Province accounting for 69.1% of confirmed cases. Africa CDC’s director-general said the six-month outbreak remains out of control and warned it could engulf the continent, while Bloomberg reported that containment increasingly depends on addressing hunger and armed conflict alongside the virus.
