title: 'Ebola in the DRC: 9,600 Cases Recorded in the 42nd Epidemiological Week - ACP'
body: Kinshasa, October 27th, 2026 (CPA).- A total of 9,600 Ebola cases were recorded during the 42nd epidemiological week, according to a statement received by CPA on Tuesday following the multisectoral strategic coordination meeting for the 42nd week, held on Monday in Kinshasa by the Directorate General of the National Institute…
