title: Outbreak of Ebola taking mental toll | Arkansas Democrat Gazette
body: BUNIA, Congo -- An Ebola outbreak that's already killed thousands is leaving another kind of scar as relatives cope with loss, fear and rejection in communities already scarred by years of rebel violence.
