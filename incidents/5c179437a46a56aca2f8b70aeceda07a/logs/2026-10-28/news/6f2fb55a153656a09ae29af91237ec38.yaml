title: Ebola survivor clinics strengthen the Ebola response in the Democratic Republic of the Congo
body: Bunia, the Democratic Republic of the Congo— Leaving an Ebola treatment centre (ETC) does not mark the end of a patient’s care journey. In Bunia, the capital of Ituri Province, the survivor clinic takes over from treatment centres to support survivors through to the completion of their physical and psychological recovery. Beyond medical care, these clinics provide spaces for listening, support and assistance with social reintegration.
