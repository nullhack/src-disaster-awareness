log_date: '2026-10-28'
summary: |-
  The Ebola outbreak in the Democratic Republic of Congo has surpassed 10,000 confirmed cases, continuing its rapid spread as a fast-moving epidemic. A Swiss national infected with Ebola has been evacuated from Nigeria to Switzerland for treatment.
  The DRC Ebola outbreak reached 10,060 confirmed cases and 4,887 deaths as of October 25, with the WHO reporting 50–80 new cases daily. IAVI received $36 million from BARDA to develop a Bundibugyo virus vaccine, and the UN provided KSh259 million to Kenya for response efforts. A top health expert warned the outbreak could reach the UK, while 20 Ebola contacts were released from quarantine in Kenya.
