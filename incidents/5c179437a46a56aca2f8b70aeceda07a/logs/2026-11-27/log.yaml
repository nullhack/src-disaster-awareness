log_date: '2026-11-27'
summary: The WHO called for urgent acceleration of Ebola vaccine trials as the Bundibugyo outbreak in the Democratic Republic of Congo passed 12,000 confirmed cases and about 5,900 deaths, with insecurity continuing to hamper the response. Escalating fighting between rebels and the army in eastern Congo forced Ebola responders to evacuate and blocked roads needed to reach patients. Separately, Uganda launched a Phase I mRNA vaccine trial targeting the Bundibugyo virus, aiming to recruit roughly 224 volunteers aged 1 to 65, including children.
