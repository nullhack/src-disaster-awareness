log_date: '2026-11-19'
summary: The WHO announced that two vaccines developed specifically against the Bundibugyo strain will begin trials in the outbreak's epicentre as early as next week, while ECDC figures cited in new reporting put the DRC at 11,376 confirmed cases as of November 15 and confirmed no Ebola case in Guinea-Bissau. UNICEF and MSF reported that more than 1,700 children have died in the epidemic, with eight in ten of those child deaths occurring outside medical centres and 2,959 children infected since May. Coverage also described Ebola burial teams in Bunia working amid health risks and prejudice, and NanoViricides confirmed its oral antiviral NV-387 has entered two Phase II trials, one of them for Bundibugyo virus disease.
