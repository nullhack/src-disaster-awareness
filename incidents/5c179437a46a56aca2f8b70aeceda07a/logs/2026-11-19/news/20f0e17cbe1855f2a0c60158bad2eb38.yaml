title: Más de 1.700 niños perdieron la vida por ébola en República Democrática del Congo - teleSUR
body: UNICEF y Médicos Sin Fronteras alertan que 8 de cada 10 decesos de menores ocurre fuera de los centros médicos, en una epidemia que ya contagió a 2.959 niños desde mayo.
