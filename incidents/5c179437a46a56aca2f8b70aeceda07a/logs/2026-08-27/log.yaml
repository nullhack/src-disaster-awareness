log_date: '2026-08-27'
summary: As of August 26, 2026, WHO reports the Ebola outbreak in DR Congo has not yet turned a corner despite a slowdown in acceleration, with over 5,600 confirmed cases and deaths surpassing 2,700. The first 16,000+ doses of the Ervebo vaccine have arrived as part of a 70,000-dose allocation, though health workers continue to face attacks—Red Cross workers were injured in Ituri and Haut-Uele—and remain unpaid, leading to ongoing strikes and exhaustion.
