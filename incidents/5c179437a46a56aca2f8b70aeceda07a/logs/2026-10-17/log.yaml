log_date: '2026-10-17'
summary: |-
  Africa CDC reported that over $700 million in Ebola response funds in the DRC are unaccounted for, calling for greater financial transparency. Kenya confirmed its third Ebola case, a 65‑year‑old woman related to the first two patients and detected while in quarantine. The Confederation of African Football ordered a CAF Confederation Cup match involving a DRC club to be played behind closed doors because of the outbreak.
  The DRC has banned 72 Ebola response partners from operating without accreditation in a bid to improve transparency, while Tanzania tightened border health rules for international travelers. Kenya reported that its third Ebola case was found during quarantine but three contacts remain untraced, and nearly 690,000 people have been screened. The outbreak also disrupted international sports, with Zambian players missing NWSL games because of US travel restrictions tied to the epidemic.
