log_date: '2026-10-17'
summary: Africa CDC reported that over $700 million in Ebola response funds in the DRC are unaccounted for, calling for greater financial transparency. Kenya confirmed its third Ebola case, a 65‑year‑old woman related to the first two patients and detected while in quarantine. The Confederation of African Football ordered a CAF Confederation Cup match involving a DRC club to be played behind closed doors because of the outbreak.
