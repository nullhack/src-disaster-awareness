title: Africa CDC raises alarm over $700 million in unaccounted Ebola funds
body: The Africa Centres for Disease Control and Prevention (Africa CDC) has raised concerns over more than $700 million in Ebola response funding that remains unaccounted for in the Democratic Republic of Congo (DRC), citing inadequate financial disclosures by international aid organisations.
