log_date: '2026-11-20'
summary: Six months into the DR Congo Ebola outbreak, reporting cited 11,376 cases and 5,568 deaths, with Africa CDC saying 80% of new cases are missed and the Norwegian Refugee Council warning that clinical interventions alone are insufficient. Uganda announced tough measures including threats to sanction airlines carrying improperly documented travelers and a ban on movement of learners from the DRC. Faith leaders are described as helping reach communities that health workers struggle to access amid conflict.
