log_date: '2026-11-20'
summary: |-
  Six months into the DR Congo Ebola outbreak, reporting cited 11,376 cases and 5,568 deaths, with Africa CDC saying 80% of new cases are missed and the Norwegian Refugee Council warning that clinical interventions alone are insufficient. Uganda announced tough measures including threats to sanction airlines carrying improperly documented travelers and a ban on movement of learners from the DRC. Faith leaders are described as helping reach communities that health workers struggle to access amid conflict.
  Several reports describe the DR Congo Ebola outbreak as still far from controlled, with the WHO maintaining it as a public-health emergency of international concern and violence and mistrust continuing to hamper the response. Regional preparedness is intensifying—Uganda banned mass gatherings in 34 high-risk border districts and South Sudan strengthened its readiness—while vaccine trials for Bundibugyo Ebola are launching amid security concerns and scientists say they are learning more about the rare virus that is spreading at double the pace.
