log_date: '2026-07-27'
summary: As of late July 2026, the Ebola outbreak in the Democratic Republic of the Congo has intensified, with confirmed cases surging to 3,075 and deaths exceeding 1,354, marking a 27% increase in just five days. Subsequent reports indicate that infections have reached 3,200 and the death toll has climbed to 1,405, as the outbreak continues to spread across five provinces.
