title: Uganda imposes mandatory 21-day DRC quarantine as regional Ebola threat expands
body: Ugandans returning home with a recent history of travel to the Democratic Republic of Congo (DRC) will now face a mandatory 21-day quarantine, Health Minister Dr Chris Baryomunsi announced on Sunday.
