title: UN warns ebola fight in DR Congo is being undermined by violence, mass displacement and lack of access
body: Fighting across eastern DR Congo is making it harder for health teams to reach vulnerable communities. The UN says stronger access, resources and public trust are urgently needed to contain the outbreak.
