title: As Ebola Spreads in DR Congo, Families Battle to Feed Themselves
body: Families facing Ebola in the DR Congo, which has a population of more than 105 million, can find that protecting themselves from the virus can also mean losing the means to feed their children, according to the UN's World Food Programme, writes Peter Kenny for allAfrica.
