title: 'Feature: Ebola casts shadow over school reopening in eastern DR Congo'
body: That challenge is particularly acute in eastern DRC, where the Ebola outbreak has crossed the threshold of 3,000 deaths. According to the latest situation report issued Wednesday by the country's health authorities, 6,186 confirmed cases and 3,007 deaths had been recorded as of Aug. 31, while 1,409 patients had recovered.
