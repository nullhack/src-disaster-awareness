title: Kenyan Health Workers Demand Protection After Ebola Death - Voice of Nigeria
body: The Kenya Medical Practitioners, Pharmacists and Dentists Union (KMPDU) has called on the government to protect health workers after the country reported its first Ebola death. In a statement, the union’s Secretary-General, Dr. Davji Atellah, said, “Health workers must not be left vulnerable in the response effort. “Our health workers must not be the weakest […]
