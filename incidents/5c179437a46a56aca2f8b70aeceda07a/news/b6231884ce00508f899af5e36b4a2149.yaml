title: Uganda discharges 60 contacts of Kenyan Ebola patient after 21-day quarantine
body: Uganda discharges 60 contacts of a Kenyan Ebola patient after a 21-day quarantine with zero positive tests. Health Minister Dr. Baryomunsi confirms Uganda remains Ebola-free.
