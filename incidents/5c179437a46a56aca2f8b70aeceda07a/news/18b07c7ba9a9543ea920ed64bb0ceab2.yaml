title: Schools open in DR Congo amid Ebola scare and bankrupt parents
body: As the 2026-2027 school year begins in the Democratic Republic of Congo (DRC), authorities in Ituri Province are enforcing heightened surveillance amid the ongoing Ebola outbreak.
