title: Ebola cases in Congo top 3,200, nearing record of the country's worst outbreak
body: The Ebola outbreak in eastern Congo has surpassed 3,200 cases. Aid organizations warn that in just 10 weeks, the outbreak has nearly matched the cases of the 2018-2020 outbreak considered the largest ever in Congo.
