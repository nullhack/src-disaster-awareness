title: DR Congo’s Ebola reaches milestone as second largest Ebola outbreak on record
body: More than 3,530 people have been infected with Ebola virus in the Democratic Republic of Congo since the outbreak was declared in mid-May, authorities said Friday, making it the world's second-largest Ebola outbreak by recorded infections, as health officials struggle to contain the epidemic.
