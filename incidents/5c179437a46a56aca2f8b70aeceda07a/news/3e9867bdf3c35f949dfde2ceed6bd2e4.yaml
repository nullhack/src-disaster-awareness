title: UN warns Ebola outbreak in DR Congo is accelerating as international response expands
body: The United Nations has warned that the Ebola outbreak in the Democratic Republic of Congo is rapidly worsening, calling for a large-scale international response as violence in the east of the country continues to complicate efforts to contain the virus.
