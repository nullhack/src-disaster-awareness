title: Congo says the death toll in fastest-growing Ebola outbreak has passed 1,500
body: As of Tuesday, 3,442 cases had been recorded, with 1,521 deaths, according to the latest government update. The sharp rise since last week partly reflects a backlog of cases and deaths that had not yet been confirmed or recorded,
