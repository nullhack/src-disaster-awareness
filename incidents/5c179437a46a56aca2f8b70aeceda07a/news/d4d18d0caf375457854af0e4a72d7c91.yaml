title: 'The DRC''s Ebola crisis revives an old ethical question: What do health workers owe patients?'
body: The World Health Organization declared the Bundibugyo Ebola outbreak on May 15, 2026. As of Nov. 18, there have been 11,712 cases and 5,720 deaths, nearly all in the Democratic Republic of Congo, or DRC.
