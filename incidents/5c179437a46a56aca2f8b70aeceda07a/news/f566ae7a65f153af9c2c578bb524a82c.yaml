title: 'Roundup: WHO says DR Congo Ebola outbreak yet to turn corner despite slowdown'
body: KINSHASA, Aug. 26 (Xinhua) -- The Ebola outbreak in the Democratic Republic of the Congo (DRC) has yet to see its epidemic curve bend despite a slowdown in its rapid acceleration, a World Health Organization (WHO) expert said Wednesday, as over 5,600 confirmed cases have been reported.
