title: Ebola - Uganda orders 21-day quarantine for citizens returning from DR Congo
body: The Ministry of Health said returning Ugandans with a history of travel to the DRC would bear the cost of their quarantine.Uganda has ordered citizens returning from the Democratic Republic of the Congo (DRC) to undergo a 21-day quarantine as authorities intensify measures to prevent further transmission of Ebola amid infections reported in Nigeria and Kenya.
