title: Uganda Tackles Nigeria Over Ebola Case, Says Abuja Patient Visited DR Congo Before Nigeria
body: Uganda has open a health 'war' with Nigeria, denying having any confirmed active case of Ebola. It's health ministry said the Nigerian woman diagnosed with the deadly virus in Abuja had travelled to eastern Democratic Republic of the Congo (DRC) before transiting through Uganda on her way to Nigeria....
