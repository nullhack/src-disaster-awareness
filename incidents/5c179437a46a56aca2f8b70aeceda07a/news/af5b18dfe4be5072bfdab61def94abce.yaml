title: DR Congo Launches New Ebola Vaccine Trial
body: Kinshasa, October 26 (QNA) — Health authorities in the Democratic Republic of the Congo have announced the launch of an Ebola vaccine trial, a move aimed at supporting health efforts to curb the spread of the disease.
