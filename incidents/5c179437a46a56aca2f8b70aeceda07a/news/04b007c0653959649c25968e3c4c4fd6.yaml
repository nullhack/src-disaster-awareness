title: 'Ebola: 197 New Cases, 94 Deaths Trigger Fresh Nigeria Alert'
body: Fresh concerns over the spread of Ebola Virus Disease (EVD) in the Democratic Republic of Congo (DRC), which has recorded 197 additional confirmed cases and 94 deaths since the last European Centre for Disease Prevention and Control (ECDC) update, have triggered renewed surveillance measures in Nigeria.
