title: Kenya confirms third Ebola case as health officials race to contain outbreak | Africanews
body: Kenya has confirmed its third Ebola case, raising concerns over the spread of the deadly virus across East Africa. The Health Ministry says the latest patient is a 65-year-old woman and a close relative of the country’s first two cases. She had been in quarantine since October 6.
