title: Congo says 2,000 people have died in history’s fastest-growing Ebola outbreak | CNN
body: At least 2,000 people have died in Congo’s Ebola outbreak, the fastest-growing on record, according to the latest data, as rebel conflict, bad roads and work stoppages over payment issues challenge the urgent response in a remote region.
