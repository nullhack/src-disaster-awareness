title: DR Congo Ebola cases top 10,000 as outbreak tests Africa's defenses
body: Ebola cases in the Democratic Republic of the Congo (DRC) have surpassed 10,000, marking a grim milestone in what has become the world's second-largest recorded Ebola outbreak. The latest figures released Tuesday by the country's health authorities showed that the country had recorded a total of 10,060 confirmed cases, including 4,887 deaths, as of Oct. 25, with the fatality rate at 48.6 percent.
