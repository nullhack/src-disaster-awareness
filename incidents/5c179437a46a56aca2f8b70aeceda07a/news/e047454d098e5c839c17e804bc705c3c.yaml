title: Ebola Vaccine Trial Begins In DR Congo
body: An Ebola vaccine trial is underway in the Democratic Republic of the Congo, involving frontline health workers and others involved in the response. The UN World Health Organization announced on Monday that 20,000 doses of the Ervebo vaccine have been allocated for the research vaccination program in Ituri province, the worst-hit region.
