title: At the border, the Democratic Republic of the Congo and South Sudan strengthen Ebola surveillance
body: Aba, the Democratic Republic of the Congo – “Information is important. Being informed is part of prevention,” says Cosmas Sandani Lasuba, a South Sudanese refugee living in the Méri camp in the Aba health zone, about 18 kilometers from the border between the Democratic Republic of the Congo (DRC) and South Sudan. As President of the South Sudanese refugees settled at this site, Cosmas closely follows an awareness session on Bundibugyo virus disease. He is tasked with raising awareness among his peers about preventive measures.
