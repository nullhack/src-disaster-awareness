title: जागरूकता फैलाते खुद इबोला से उबरे लोग
body: डीआर कॉन्गो में इबोला लगातार फैलता जा रहा है. देश में इस बीमारी को लेकर अब भी अफवाहें फैलती रहती हैं. ऐसे में कुछ इबोला सर्वाइवर पैदल गांवों का दौरा करते हैं और वहां जागरूकता अभियान चलाते हैं. जानकारी, जान बचा सकती है.
