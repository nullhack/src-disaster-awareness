title: DRC Ebola outbreak still growing despite signs of progress
body: Geneva, Switzerland | URN | The World Health Organisation says the Ebola outbreak in the Democratic Republic of Congo is showing encouraging signs of slowing in some areas, but continues to grow and kill, with cases rising sharply in North Kivu. WHO Director-General Dr Tedros Adhanom Ghebreyesus says transmission is declining in the worst-affected parts …
