title: 'DR Congo Ebola outbreak ''far from being under control'': WHO chief'
body: The Ebola outbreak in the Democratic Republic of Congo is moving faster than any previous epidemic of the disease and risks spreading to more countries, the head of the World Health Organization warned Tuesday.
