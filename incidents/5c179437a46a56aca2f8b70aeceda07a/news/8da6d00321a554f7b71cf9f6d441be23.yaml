title: Cuba Reaffirms Support for DR Congo Amid Severe Ebola Epidemic - teleSUR English
body: Cuba's Minister of Public Health offered medical assistance to the Democratic Republic of Congo to combat the Ebola outbreak, which has already claimed more than 3,000 lives and faces serious operational and geopolitical obstacles.
