title: Abuakwa South MP raises concerns over Ghana’s Ebola preparedness after Nigeria case - MyJoyOnline
body: A Member of Parliament (MP) for Abuakwa South Constituency, Dr Kingsley Agyemang, has called on the government to strengthen the country’s public health emergency preparedness following the confirmation of an Ebola virus disease case in Nigeria.
