title: Congo to receive 70,000 doses of Ervebo Ebola vaccine which has been effective in past outbreaks
body: The World Health Organization says Congo will receive 70,000 doses of the Ervebo vaccine. This move is seen as a major boost to efforts to contain what officials describe as the fastest Ebola outbreak in history.
