title: Congo Ebola epidemic passes 8,000 cases and nears 4,000 deaths as attacks on health workers mount
body: The Congolese Ebola epidemic has reached 8,116 confirmed cases and 3,924 deaths, amid attacks that have killed a local politician who urged prevention on the radio and a health worker at a screening post, while world leaders quibble over equity and royalties.
