title: DRC Ebola epidemic records over 6,000 cases and nearly 3,000 deaths
body: The current outbreak, which was officially declared in May, is the worst in the country's history. It is caused by the Bundibugyo strain of the Ebola virus, for which no approved vaccine nor specific treatment currently exists.
