title: Ebola or Politics?
body: The science and suspicion behind Uganda’s travel restrictions SPECIAL REPORT | Uganda’s Bundibugyo Ebola outbreak was officially declared over in August. Yet the United States and Canada continue to enforce restrictions affecting travellers linked to Uganda. The measures raise questions about public-health risk, economic costs and the evidence governments use to decide …
