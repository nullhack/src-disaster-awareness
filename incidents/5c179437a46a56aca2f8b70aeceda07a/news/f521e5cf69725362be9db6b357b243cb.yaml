title: DR Congo Ebola Cases Surpass 10,000 As Death Toll Nears 4,900
body: The number of confirmed Ebola cases in the Democratic Republic of Congo (DR Congo) has surpassed 10,000, with deaths reaching 4,887, as concerns grow over the spread of the outbreak to other African countries.
