title: Ebola cases in DR Congo exceed 8,000 as outbreak continues to expand - Peoples Gazette Nigeria
body: The outbreak, declared in May, has become the largest and deadliest Ebola outbreak recorded in the DRC and the second largest globally, after the 2014–2016 West Africa epidemics.
