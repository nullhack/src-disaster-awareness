title: Malawi steps up Ebola screening at border points
body: The Malawian government, through the Ministry of Health and Sanitation, has issued a travel advisory alongside enhanced surveillance and public health measures to prevent the importation of Ebola virus disease from the Democratic Republic of the Congo (DRC).
