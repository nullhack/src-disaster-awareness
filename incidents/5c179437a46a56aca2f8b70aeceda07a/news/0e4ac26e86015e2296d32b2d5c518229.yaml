title: Strain-specific Ebola vaccines to be trialled in DRC, WHO announces
body: We expect two candidate vaccines developed specifically for Bundibugyo virus to begin testing as early as next week, World Health Organization (WHO) chief Tedros Adhanom Ghebreyesus told a press conference at the United Nations health agency's headquarters in Geneva on Tuesday .
