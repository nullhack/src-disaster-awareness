title: 'Ebola in the DRC: Follow-up Clinics Strengthen Care for Survivors - ACP'
body: Kinshasa, October 27th, 2026 (CPA).- Follow-up clinics for Ebola survivors are strengthening the response to the disease in Bunia, Ituri Province, in the northeastern Democratic Republic of the Congo, by ensuring continuity of medical and psychosocial care after recovery, according to a World Health Organization (WHO) report consulted by CPA…
