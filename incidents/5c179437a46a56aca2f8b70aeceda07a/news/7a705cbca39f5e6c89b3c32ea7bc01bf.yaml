title: DR Congo Ebola outbreak surpasses 8,000 cases, nearly 4,000 deaths
body: The Democratic Republic of Congo (DRC) has recorded more than 8,000 confirmed Ebola cases and nearly 4,000 deaths in the country’s largest-ever Ebola outbreak, according to the latest data from Congolese health authorities.
