title: 'Ebola: DR Congo receives Roche lab equipment'
body: Roche Diagnostics has provided two molecular testing instruments to the Institut National de Santé Publique (INSP), which is supporting the DRC’s Ministry of Health-led Ebola response. The delivery follows Roche’s announcement in June that it had developed a Research Use Only molecular PCR test targeting Bundibugyo virus. With the instruments now in the DRC, this […]
