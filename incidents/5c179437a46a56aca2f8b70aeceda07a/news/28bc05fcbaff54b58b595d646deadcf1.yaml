title: Fast-growing Ebola outbreak in DRC surges to second-largest on record
body: The ongoing Ebola outbreak in the Democratic Republic of Congo has quickly grown into the second-largest on record, with cases taking just weeks to reach levels that had taken years in previous outbreaks.
