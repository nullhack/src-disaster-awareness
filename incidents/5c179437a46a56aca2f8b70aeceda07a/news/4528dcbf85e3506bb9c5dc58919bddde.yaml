title: First Ebola Patients in Nigeria and Kenya Might Have Crossed Paths at Uganda Airport
body: The first Ebola patients confirmed in Kenya and Nigeria might have crossed paths at an airport in Uganda earlier this month, African health officials said Thursday as they race to trace and slow an outbreak that has spread to several African countries. Both patients are known to have traveled through Uganda's Entebbe International Airport on Oct. 3, said Dr. Wessam Mankoula, head of emergency preparedness and response at the Africa Centers for Disease Control and Prevention.
