title: DRC Ebola outbreak passes 9,000 cases, including more than 4,000 deaths | Africanews
body: The worst Ebola outbreak ever in the Democratic Republic of Congo has passed the 9,000-case mark, with the number of deaths exceeding 4,000 since early October, health authorities said Tuesday.
