title: Congo's Ebola outbreak shows no signs of slowing as deaths top 3,000
body: Data from Congo's Ministry of Health showed the outbreak has recorded 6,186 confirmed cases, including 3,007 deaths since it was declared a global health emergency in mid-May. It remains the fastest-growing outbreak of Ebola ever.
