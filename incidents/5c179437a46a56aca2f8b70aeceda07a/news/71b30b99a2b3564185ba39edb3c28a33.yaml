title: DR Congo Ebola Outbreak Surpasses 10,000 Cases
body: Ebola cases in the Democratic Republic of Congo have reportedly risen to 10,060, with 4,887 deaths since the outbreak was identified in mid-May. The outbreak involves the Bundibugyo virus, which has no approved vaccine or specific treatment, complicating efforts to contain its spread. The Africa Centres for Disease Control and Prevention has described it as the fastest-growing Ebola outbreak in history. Kenya has reported nine infections, including two deaths. Nigeria also confirmed an infection in a Swiss woman who had visited Uganda. Clinical trials are underway to assess potential antiviral treatments and whether existing Ebola vaccines can protect against the strain. Ebola spreads through direct contact with the blood or other bodily fluids of an infected person. It can cause fever, diarrhea, and, in some cases, bleeding.
