title: Community surveys contribute to behaviour change in response to Bundibugyo virus disease
body: Nizi, the Democratic Republic of the Congo—“We recorded the first case in May, a few days before the official declaration of the outbreak. By the end of May, there was an increase in suspected cases,” recalls Dr Jean Claude Lonzama, Chief Medical Officer of the Nizi health zone. “We launched the first response actions against this virus in our health zone, but the outbreak reached its most critical level in July.”
