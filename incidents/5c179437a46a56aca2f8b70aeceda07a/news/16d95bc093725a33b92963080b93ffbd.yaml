title: OCHA Supports Ebola Response in DR Congo - Voice of Nigeria
body: The United Nations Office for the Coordination of Humanitarian Affairs (OCHA) is supporting Ebola response efforts in the Democratic Republic of the Congo (DRC) through rapid and flexible funding. At a treatment centre known as the CUBE, health workers provide critical care to Ebola patients while reducing their exposure to the virus. The facility, managed […]
