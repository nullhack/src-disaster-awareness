title: DR Congo Ebola cases hit 8,067 as violence disrupts humanitarian response
body: DR Congo has confirmed 8,067 Ebola cases and 3,901 deaths as violence and insecurity in the Ituri Province disrupt humanitarian efforts, displacing thousands of individuals.
