title: World Bank Adds $93 Million to Fight Ebola in DR Congo and Region
body: The World Bank Group has announced $93 million in new financing, including $80 million for DR Congo and $13 million for regional preparedness. The new funding brings the group's total commitments to the Ebola response to $426.6 million. A UN assessment published in June estimated that the outbreak could cost...
