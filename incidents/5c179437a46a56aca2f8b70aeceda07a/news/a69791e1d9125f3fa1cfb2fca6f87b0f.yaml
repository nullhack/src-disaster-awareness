title: Weekly Health Update | Ebola Tops 5,000 Cases; Polio Outbreaks Recede
body: Health developments across Africa this week were led by the worsening Bundibugyo Ebola outbreak in the Democratic Republic of Congo, which surpassed 5,000 confirmed cases and 2,300 deaths, exceeding the toll from the country's 2018-2020 Ebola outbreak. The World Health Organization kept the outbreak classified as a public health emergency...
