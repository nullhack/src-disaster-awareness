title: Congo Authorities Report More Than 6,000 Confirmed Ebola Cases and Nearly 3,000 Deaths
body: BUNIA, Congo (AP) — Congo's authorities have reported that the outbreak of the Ebola virus has now topped 6,000 cases. Authorities gave the new figure on Monday.
