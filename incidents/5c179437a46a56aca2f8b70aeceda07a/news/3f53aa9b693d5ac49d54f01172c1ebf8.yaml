title: 'DR Congo: Doctor Dies As Ebola Cases Rise - Voice of Nigeria'
body: A young doctor has died of Ebola in Kisangani, as cases surge beyond the epicentre of the outbreak in the Democratic Republic of Congo. Dr. Victor Kingombe, an internal medicine doctor, succumbed to the virus at the Ebola treatment centre in Kisangani, capital of Tshopo province. Colleagues and family gathered for his funeral, watching from […]
