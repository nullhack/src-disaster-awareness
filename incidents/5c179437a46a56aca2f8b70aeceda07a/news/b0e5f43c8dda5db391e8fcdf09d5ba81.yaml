title: Ebola outbreak kills more than 5,000 in DR Congo
body: The death toll from the Ebola outbreak in the Democratic Republic of Congo has surpassed 5,000, government data showed on Friday, as authorities had yet to find a way to control the country's deadliest Ebola epidemic on record.The outbreak has infected more than 10,000 people since it was declared ...
