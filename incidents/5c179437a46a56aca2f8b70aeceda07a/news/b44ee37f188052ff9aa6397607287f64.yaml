title: The first Ebola case has been confirmed in Nigeria! The patient turned out to be the wife of a diplomat vacationing in Uganda.
body: It was announced that the first Ebola case confirmed in Nigeria since the outbreak in East Africa began in May is a 42-year-old diplomat's wife who vacationed for two and a half weeks in Uganda's capital, Kampala. The diagnosis of the woman, who went to two private hospitals after being suspected of having malaria, was confirmed on October 20; the 44 people she had contact with were placed in quarantine.
