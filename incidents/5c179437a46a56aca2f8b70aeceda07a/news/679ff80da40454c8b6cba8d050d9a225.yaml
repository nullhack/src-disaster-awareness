title: U.S. Donates Experimental Antibody Treatment to Bolster Uganda's Fight Against Ebola
body: The United States government has delivered an experimental antibody treatment for Ebola to Uganda's Ministry of Health, strengthening the country's preparedness amid an ongoing outbreak of Bundibugyo virus disease in neighbouring Democratic Republic of the Congo (DRC).
