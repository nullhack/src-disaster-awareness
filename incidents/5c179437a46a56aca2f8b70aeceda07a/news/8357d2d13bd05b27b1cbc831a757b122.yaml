title: 'Ebola outbreak outpaces Congo’s response: No vaccine, 10,000+ cases—80% outside known networks'
body: Infections have spread to 66 health zones across eight provinces—from just three when the outbreak was first declared—and reached five countries, including Kenya and Nigeria.
