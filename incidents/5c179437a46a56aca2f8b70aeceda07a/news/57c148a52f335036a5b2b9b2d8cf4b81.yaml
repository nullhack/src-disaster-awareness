title: Weekly Health Update | Ebola Worsens Hunger in DRC; Cholera Spreads in Sudan
body: Africa’s health news this week was dominated by the rapid spread of the Bundibugyo Ebola outbreak in the Democratic Republic of Congo and Uganda’s declaration that its Ebola outbreak was over. In Sudan, cholera has spread to four states as the health system comes under mounting strain. Beyond these immediate...
