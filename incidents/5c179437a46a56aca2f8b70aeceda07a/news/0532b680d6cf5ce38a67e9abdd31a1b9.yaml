title: DR Congo Ebola death toll tops 3,100 as WHO cites staffing and funding shortages
body: The World Health Organisation (WHO) has warned that efforts to contain the Ebola outbreak in the Democratic Republic of Congo (DRC) are facing growing pressure as the virus spreads to new areas faster than treatment capacity can be expanded.
