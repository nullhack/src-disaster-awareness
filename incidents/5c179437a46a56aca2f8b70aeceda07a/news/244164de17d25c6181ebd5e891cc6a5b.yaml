title: Ebola vaccine trial begins in DR Congo
body: <p>Kinshasa, October 26 Health authorities in the Democratic Republic of the Congo (DR Congo) have announced the start of a trial of a new vaccine in an effort to contain the spread of Ebola. The trial will assess the vaccine’s safety and efficacy and identify the groups for whom it may be suitable for use. […]</p>
