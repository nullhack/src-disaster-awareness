title: Kenya confirms first Ebola case, death | Arkansas Democrat Gazette
body: NAIROBI, Kenya -- A Kenyan citizen who had been living in Congo before returning to Nairobi over the weekend became Kenya's first confirmed case of Ebola and the country's first death from the disease in the fast-moving outbreak, authorities said Tuesday, sparking urgent contact-tracing efforts to try to contain the spread of the virus.
