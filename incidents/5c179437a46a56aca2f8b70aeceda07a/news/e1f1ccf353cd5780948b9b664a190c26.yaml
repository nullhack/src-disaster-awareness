title: Uganda Starts First mRNA Ebola Vaccine Trial — CASRAI
body: Uganda's UVRI began Africa's first mRNA Bundibugyo Ebola vaccine trial with Moderna on 27 November 2026, enrolling about 224 people aged 1 to 65.
