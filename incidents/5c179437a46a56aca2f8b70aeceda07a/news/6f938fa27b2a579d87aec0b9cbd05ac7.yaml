title: G20+ Mobilises US$2.9 Billion for Ebola Response as Africa CDC Calls for Full Transparency and Traceability of Every Dollar – Africa CDC
body: New York/Addis Ababa, 24 September 2026 Africa CDC welcomes the historic mobilisation achieved at the G20+ Foreign Ministers Meeting on Accelerating Collective Action to Defeat Ebola, convened by the United States on 23 September 2026 in New York on the margins of the United Nations General Assembly. The meeting demonstrated what can be achieved when […]
