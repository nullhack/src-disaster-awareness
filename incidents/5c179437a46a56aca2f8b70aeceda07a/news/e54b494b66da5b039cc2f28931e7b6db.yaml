title: DR Congo Ebola cases top 7,400 as transmission shifts
body: Kinshasa, Sep 17 (IANS) The Ebola outbreak in the Democratic Republic of the Congo (DRC) is showing a shifting pattern, with transmission easing in the long-time epicentre of Ituri but rising rapidly in North Kivu, where treatment capacity is nearing saturation, according to the latest government situation report released on Thursday. As of Tuesday, the country...
