title: 'DR Congo: Hunger deepens for millions amid conflict, Ebola and climate shocks'
body: More than 28 million people in the Democratic Republic of the Congo (DRC) are not getting enough to eat and the number is expected to tick up in the coming months, according to the latest alert from the IPC global food security monitor.
