title: കോംഗോയിൽ എബോള ബാധിതർ 11,000 കടന്നു; മരണം 5,387 ആയി | DR Congo Ebola outbreak | Times Kerala
body: ഡെമോക്രാറ്റിക് റിപ്പബ്ലിക് ഓഫ് കോംഗോയിൽ (ഡിആർ കോംഗോ) എബോള ബാധിതരുടെ എണ്ണം 11,000 കടന്നു. ഏറ്റവും പുതിയ ഔദ്യോഗിക കണക്കുകൾ പ്രകാരം 11,042 പേർക്കാണ് രോഗം
