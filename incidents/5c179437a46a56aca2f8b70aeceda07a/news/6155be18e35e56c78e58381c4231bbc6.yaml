title: '‘Ebola is winning’: Epidemic now killing one person every 30 minutes'
body: The Ebola outbreak in the eastern Democratic Republic of the Congo (DRC) – the fastest-growing on record and on track to become the deadliest – is killing one person every 30 minutes.
