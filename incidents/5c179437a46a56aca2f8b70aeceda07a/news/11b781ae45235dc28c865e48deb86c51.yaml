title: DR Congo confirms 9,066 Ebola cases, 4,381 deaths
body: The Democratic Republic of the Congo (DRC) has recorded more than 9,000 confirmed Ebola cases since May, as preparations for a vaccine trial near completion, Xinhua reported.
