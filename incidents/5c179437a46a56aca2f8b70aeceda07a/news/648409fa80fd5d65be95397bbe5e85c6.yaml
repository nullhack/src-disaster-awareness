title: 'Ebola: Uganda introduces 21-day quarantine for people entering from DRC | Africanews'
body: Travellers entering Uganda after visiting DR Congo will face a 21-day quarantine, the country's health minister announced on Sunday. The new screening measures come after Nigeria reported its first case of the virus in a woman returning from Uganda. Kampala insists the country remains Ebola-free.
