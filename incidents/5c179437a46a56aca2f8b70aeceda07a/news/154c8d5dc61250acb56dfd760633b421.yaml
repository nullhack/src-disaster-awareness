title: Congo's confirmed Ebola cases exceed 9,000 as containment efforts falter
body: Confirmed cases in Congo's Ebola outbreak have surpassed 9,000, with more than 4,300 deaths, as health authorities struggle to contain an outbreak spreading across seven provinces, according to government figures released Tuesday.
