title: WHO Eyes ‘Encouraging’ Signs in DR Congo Fight Against Ebola
body: The Ebola epidemic in the Democratic Republic of Congo is still spreading but appears to be showing "encouraging" signs of improvement, the head of the World Health Organization said on Wednesday. "We are starting to see encouraging signs that we're gaining ground," Tedros Adhanom Ghebreyesus told a news conference in Geneva. Since the DRC declared its 17th Ebola outbreak in mid-May, more than 3,500 deaths have been recorded from over 7,200 cases to date across seven northern and eastern provinces plagued by widespread insecurity and a litany of armed groups.
