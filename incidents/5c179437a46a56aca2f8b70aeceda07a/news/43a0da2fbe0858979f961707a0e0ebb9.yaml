title: Nigeria's sole Ebola patient confirmed as authorities trace contacts
body: Nigeria is now tracking 53 people who came into contact with the country's sole confirmed Ebola patient, the head of the Nigeria Center for Disease Control and Prevention said on Sunday, October 25.
