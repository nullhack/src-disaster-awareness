title: Ebola casts shadow over school reopening in eastern DR Congo
body: As schools reopened across the Democratic Republic of the Congo (DRC) for the new academic year, pupils returning to classrooms in the Ebola-hit east found themselves facing a school routine shaped as much by the epidemic as by lessons and textbooks, with handwashing stations, temperature checks and restrictions on close physical contact becoming part of the first days back.
