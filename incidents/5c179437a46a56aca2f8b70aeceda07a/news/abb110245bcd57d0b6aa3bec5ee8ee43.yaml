title: Congo Ebola outbreak becomes second largest ever recorded
body: Last week, the Ebola outbreak in the DRC became the second largest, surpassing the 2018-2020 outbreak that occurred in eastern DRC as well. Health authorities have noted the current outbreak is the fastest, outpacing all other previous outbreaks. There remain no treatment or vaccine against the Bundibugyo strain to date.
