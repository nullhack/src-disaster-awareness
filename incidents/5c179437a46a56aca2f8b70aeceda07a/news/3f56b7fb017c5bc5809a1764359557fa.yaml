title: Surveillance strengthens the Ebola response in the Democratic Republic of the Congo
body: Bunia, the Democratic Republic of the Congo—Since the start of the Ebola outbreak caused by Bundibugyo virus disease in the Democratic Republic of the Congo, surveillance has been one of the main lines of defence against the disease. By enabling the rapid detection of alerts, investigation of suspected cases and monitoring of contacts of confirmed cases, it helps interrupt chains of transmission and protect communities.
