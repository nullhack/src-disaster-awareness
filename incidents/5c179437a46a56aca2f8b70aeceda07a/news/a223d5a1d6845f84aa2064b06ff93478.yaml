title: 'DR Congo Ebola outbreak slows as hotspots shift: Africa CDC'
body: KINSHASA, Oct. 14 (Xinhua) -- Ebola outbreak in the Democratic Republic of the Congo (DRC) shows early signs of slowing, but new hotspots are complicating response efforts, authorities said Wednesday.
