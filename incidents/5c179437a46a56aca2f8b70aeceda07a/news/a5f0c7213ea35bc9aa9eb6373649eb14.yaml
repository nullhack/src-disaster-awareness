title: DR Congo Ebola epidemic passes 6,000 cases
body: The Democratic Republic of Congo has recorded more than 6,000 confirmed cases and nearly 3,000 deaths from the country's worst Ebola epidemic ever, according to the Congolese authorities' latest toll on Monday.
