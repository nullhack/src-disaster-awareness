title: Congo's Ebola outbreak tops 10,000 cases as authorities race to slow the spread in African countries | Texarkana Gazette
body: BUNIA, Congo -- The fast-moving Ebola outbreak in Congo has reached 10,000 confirmed cases, government data showed Tuesday, as health authorities race to slow the spread of the disease in multiple African countries.
