title: Kenya confirms 4 new Ebola cases, including 3 health workers, raising total to 7
body: Kenya confirmed four new Ebola cases Saturday, including three health workers who treated the country's first patient, bringing the total number of infections to seven, according to the Health Ministry, Anadolu Agency reports.
