title: Explainer-How Congo's Ebola outbreak became the second-most lethal on record
body: By Clement Bonnerot and Jessica Donati DAKAR, Aug 17 (Reuters) - The ongoing Ebola outbreak is now the second-most lethal on record and the deadliest in the history of Democratic Republic of Congo. Only the epidemic in West Africa in 2014-16 killed more people.
