title: Caritas Congo Urges Governments and Aid Agencies to Sustain Relief as Ebola Outbreak Continues
body: Officials at Caritas Congo Asbl, the Catholic Church's official humanitarian and development organization in the Democratic Republic of the Congo (DRC), have urged governments and aid agencies to sustain assistance for communities facing displacement, insecurity, and cholera in the Central African nation as efforts to contain Ebola continue.
