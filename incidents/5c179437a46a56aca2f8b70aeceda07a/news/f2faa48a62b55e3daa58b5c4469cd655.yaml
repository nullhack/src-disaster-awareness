title: Congo’s Ebola outbreak records one of its highest weekly death tolls yet
body: BUNIA, Congo (AP) — More than 300 people died of Ebola in eastern Congo in the past week, one of the highest weekly tolls yet, government data showed Monday, as health workers struggle to catch up with an outbreak that is spreading at unprecedented speed. Ministry of Health data showed that as of Saturday, the outbreak had recorded […]
