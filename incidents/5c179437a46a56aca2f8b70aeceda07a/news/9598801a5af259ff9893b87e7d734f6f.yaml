title: DR Congo - Ebola Is Killing People Before They Ever Reach a Doctor
body: More than 1,900 people have died in the Democratic Republic of the Congo's Ebola outbreak - and most of them never made it to a treatment centre. Between 60 and 70 per cent of deaths are happening in communities far from care,
