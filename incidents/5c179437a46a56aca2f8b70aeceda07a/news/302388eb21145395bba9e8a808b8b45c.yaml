title: Ebola Cases Surpass 9,000 in the Democratic Republic of the Congo
body: In the Democratic Republic of the Congo, the number of confirmed Ebola cases has surpassed 9,000 with over 4,300 deaths. The outbreak caused by the latest strain of the virus has become the largest and deadliest in Congo’s history. There are currently no treatments or vaccines for the latest strain of the Ebola virus. Click here to see our coverage.
