title: Kenya Discharges Last Ebola Patient, Begins 42-Day Countdown
body: Kenya has discharged its last Ebola patient, bringing the total number of recoveries to seven and marking a major step towards containing the outbreak. The country has now begun a 42-day countdown before it can officially be declared Ebola-free. No new confirmed cases have been reported since 20 October. Health authorities said that all 135 identified contacts have completed their 21-day monitoring period, with no evidence of wider community transmission. However, surveillance will continue at border crossings, airports and health facilities throughout the countdown. The Africa Centres for Disease Control and Prevention (Africa CDC) described it as an important achievement in the regional response to the outbreak. Kenya has also urged countries that introduced travel and visa restrictions over the outbreak to reconsider them.
