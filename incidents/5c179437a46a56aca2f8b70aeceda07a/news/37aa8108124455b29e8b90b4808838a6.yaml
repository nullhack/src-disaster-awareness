title: WHO Says Congo Ebola Outbreak Can Still Be Controlled, But the Window Is Narrowing – Natasha Eusebia Switch News
body: The Democratic Republic of Congo’s worsening Ebola outbreak can still be brought under control within three months, a World Health Organisation official said on Tuesday. But he warned that success will depend on whether enough resources reach the response. The outbreak has become the deadliest in Congo’s history and the second-deadliest Ebola outbreak ever recorded. WHO says Congo’s Ebola outbreak could be brought under control within three months, but limited funding and rapid spread threaten the response.
