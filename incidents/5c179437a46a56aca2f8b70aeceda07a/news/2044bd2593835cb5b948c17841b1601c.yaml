title: 'Some 1,800 dead from cholera in Ebola-hit DR Congo: WHO'
body: Cholera has killed around 1,800 people so far this year in the Democratic Republic of Congo, which is also battling its deadliest Ebola outbreak, the World Health Organization said Wednesday.
