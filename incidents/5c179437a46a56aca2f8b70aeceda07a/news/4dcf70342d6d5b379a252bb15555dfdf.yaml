title: Siberian authorities seize livestock after lumpy skin disease outbreaks detected in two villages — Meduza
body: Authorities in Russia’s Irkutsk region have begun seizing livestock from residents after detecting cases of contagious lumpy skin disease, and the infected animals will be killed. The Irkutsk municipal district has been under a state of emergency since September 4, the Russian business daily Kommersant reported.
