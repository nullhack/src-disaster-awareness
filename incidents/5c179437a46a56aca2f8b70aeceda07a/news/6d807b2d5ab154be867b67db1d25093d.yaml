title: Ebola vaccine being tested in DR Congo - World News
body: Health workers in parts of the Democratic Republic of Congo badly hit by a deadly Ebola outbreak launched a test vaccination program on Sept. 19 to see if jabs designed for a different strain of the virus could prove effective in this case.
