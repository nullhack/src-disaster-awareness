title: Congo to receive 70,000 doses of Ervebo Ebola vaccine which has been effective in past outbreaks
body: Congo will receive 70,000 doses of the Ervebo vaccine, which has been effective in past Ebola outbreaks, the World Health Organization and partners said Thursday, announcing a step seen as a major boost to efforts to contain what officials have described as the fastest Ebola outbreak in history.
