title: Emergency nurseries rescue DR Congo’s Ebola orphans - Jamaica Observer
body: Mongbwalu, DR Congo (AFP) — A caregiver wore a protective gown and gloves as she bottle-fed a baby -- one of hundreds of children orphaned by the Democratic Republic of Congo&#039;s Ebola outbreak. With the disease still spreading five months into the epidemic, the nursery in the remote east is one of 12 receiving the children of those killed by the highly contagious haemorrhagic fever. &quot;Many children have lost both...
