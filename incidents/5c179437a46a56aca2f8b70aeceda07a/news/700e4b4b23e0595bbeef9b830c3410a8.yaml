title: Ebola cases in DR Congo cross 6,000, death toll hits 2,911
body: The number of confirmed Ebola cases in the Democratic Republic of Congo (DRC) has crossed 6,000, with the death toll rising to 2,911 as the country continues to battle its worst outbreak of the disease in history.
