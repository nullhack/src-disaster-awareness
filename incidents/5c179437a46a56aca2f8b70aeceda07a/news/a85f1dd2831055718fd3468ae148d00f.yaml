title: 'DRC: Ebola Jeopardising Education For 100,000s Of Children'
body: Hundreds of thousands of children in eastern Democratic Republic of Congo (DRC) are having their education disrupted by the largest and deadliest Ebola outbreak in the country’s history, warns the Norwegian Refugee Council (NRC).By Norwegian Refugee CouncilPublished 06. Oct 2026Press releaseDR CongoSchool operations and pupil attendance are being affected by fear of the disease, major gaps in infection prevention and control, and a lack of hygiene facilities and psychosocial support in schools.
