title: DR Congo Ebola cases surpass 8,000
body: The Ebola outbreak in the Democratic Republic of the Congo (DRC) has exceeded 8,000 confirmed cases, as health authorities warn that declining contact tracing and continued community deaths are fueling transmission, Qazinform News Agency cites Anadolu Agency.
