title: Ebola spreads across 3 African regions… 4,602 dead in DR Congo
body: The Bundibugyo Ebola virus, which originated in the Democratic Republic of the Congo, has spread to Kenya and Nigeria, marking the largest epidemic to date across three African regions. In the Democratic Republic of the Congo, the epicenter, 4,602 people have died out of 9,552 cumulative confirmed cases. In response, the Africa Centres for Disease Control and Prevention has called for urgent funding, medical support, and cooperation from the international community to curb the spread.
