  Summary: "Since the publication of the previous Disease Outbreak News on 6 November 2026, additional confirmed cases and deaths have been reported in the Democratic Republic of the Congo. \r\nWhile some areas have seen a slight decline in cases, sustained, high-level transmission continues overall in the country. As of 17 November 2026, a total of 11 613 confirmed cases, including 5678 deaths (crude case fatality ratio: 48.9%), have been reported across 68 health zones in eight provinces, with active transmission ongoing in 48 health zones. Ituri and Nord Kivu remain the most affected provinces, while Sud-Kivu and Sud Ubangi have not reported cases for more than 42 days. The high proportion of deaths occurring in communities, meaning outside of dedicated treatment centres, especially among young children, continues to highlight challenges in early case detection and timely access to appropriate care. Of the 720 deaths reported since 28 October (last three weeks), 452 occurred in communities\
    \ and 268 in treatment centres.\r\nSince the last Disease Outbreak News, no new cases have been reported from Kenya or Nigeria; and no new country has reported confirmed cases. Both countries have started a 42-day countdown to declare the end of their outbreaks. However, the high-level transmission in the Democratic Republic of the Congo calls for continued need for readiness in the region, including cross-border surveillance, points of entry monitoring, timely case detection and coordinated preparedness and response measures. \r\nSix months into the outbreak of Bundibugyo virus disease (BVD) in the Democratic Republic of the Congo, the response has expanded significantly, but further scale up is needed, with rising insecurity remaining the greatest obstacle to the expansion of operations. The next phase must prioritize quality, reach and community trust, alongside sustained funding, coordination and security to save lives and end the outbreak.\r\nOn 18 November 2026, the Director-General\
    \ of WHO, concurring with the advice of the IHR Emergency Committee formulated at its third meeting, on 17 November 2026, determined that the event continues to constitute a public health emergency of international concern (PHEIC). Updated recommendations to the government of the Democratic Republic of the Congo and all other States Parties will be issued in the coming days. "
