  Title: Ebola disease caused by Bundibugyo virus- Democratic Republic of the Congo, Kenya and Nigeria
  Epidemiology: <p>Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the <em>Orthoebolavirus </em>species. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.</p><p>Human infection is thought to initially occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when infection prevention and control (IPC) measures are inadequate, and during unsafe burial practices involving direct contact with deceased individuals.</p><p>The incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and
    sore throat are non-specific, which complicates clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.</p><p>The CFR from the previous two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.</p><p>Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation. Outbreak control relies on rapid case identification and investigation, isolation and care, contact tracing, safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.</p><p>Since first detected in May 2026, this BVD outbreak has rapidly evolved into a large and geographically expanding epidemic in the Democratic Republic of the Congo, with sustained transmission, high mortality and an increasing risk of further international
    spread. The current outbreak is the second documented Bundibugyo virus disease outbreak in the country, after the 2012 outbreak, and the largest Ebola disease outbreak ever recorded in the Democratic Republic of the Congo irrespective of virus species. The population at greatest risk of exposure is concentrated in communities living in and moving through the health areas with active transmission.&nbsp;</p>
  Advice: <p>Based on the currently available information, WHO advises against any restriction of travel to, or trade with, States Parties experiencing and/or responding to the public health event. The <a href="https://www.who.int/news/item/24-08-2026-second-meeting-of-the-ihr-emergency-committee-on-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-temporary-recommendations">Temporary Recommendations</a> issued to States Parties on 24 August 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further regional spread and ensure an effective public health response. Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response. </p><p>Following the advice formulated by the IHR Emergency Committee regarding the epidemic of BVD in the Democratic
    Republic of the Congo, the Director-General of WHO determined that the event continues to constitute a PHEIC. An updated set of Temporary Recommendations will be issued to States Parties, and this will be reported in the next Disease Outbreak News publication.&nbsp;</p>
  Assessment: <p>On 17 November 2026, WHO reassessed the risk of the BVD outbreak. The risk assessment categorizes States Parties into five groups based on population mobility from areas with community BVD transmission and response capacity. </p><p>The risk in the Democratic Republic of the Congo, the only State Party with currently documented community transmission, remains <strong>very high</strong>, reflecting the intensity and geographic expansion of the outbreak, ongoing undetected transmission, community deaths, health-care transmission, insecurity, laboratory constraints, gaps in community engagement and funding, and the continued potential for national spread.</p><p>The risk for States Parties with confirmed cases but without community transmission, including Kenya and Nigeria, is assessed as <strong>high</strong>, given the potential for onward and secondary transmission following importation, challenges in early detection, uncertainty around transmission chains, and the continued
    possibility of additional introductions.</p><p>The risk is also assessed as <strong>high</strong> for States Parties with substantial population connectivity to areas with community transmission, or with moderate connectivity but low response capacity. High population mobility, formal and informal cross-border movement, the possibility of undetected importation, variable surveillance and response capacities, and humanitarian and access constraints increase the likelihood of delayed detection and onward transmission.</p><p>The risk for States Parties with substantial connectivity but high response capacity is assessed as <strong>low</strong>. Although importation remains possible because of travel and other connections with affected areas, strong health systems and demonstrated outbreak-response capacities reduce the likelihood of sustained community transmission.</p><p>Finally, the risk for all other States Parties remains <strong>low</strong>. Transmission remains concentrated in the
    Democratic Republic of the Congo, with no evidence of sustained transmission beyond the country. However, further international exportation remains possible, requiring continued surveillance, preparedness, rapid detection and containment of any imported cases.</p>
  Overview: '<p><p>Cases have been reported in five countries since the declaration of the outbreak on 15 May 2026: the Democratic Republic of the Congo, France, Kenya, Nigeria, and Uganda. The outbreaks in France and Uganda have been controlled since August, while Kenya and Nigeria continue with heightened surveillance as they count down to 42 days, completing two maximum incubation periods since the last confirmed cases were either discharged or medically evacuated from the country. </p><p>On 26 October 2026, Switzerland reported the medical evacuation of the case, who received medical care in Geneva, Switzerland. The patient recovered and was discharged on 11 November testing PCR-negative for Bundibugyo virus for a second time. </p><p>On 18 November 2026, the United Kingdom of Great Britain and Northern Ireland reported that a medically evacuated health and care worker from the Democratic Republic of the Congo had recovered and been discharged from hospital.</p><p><strong>Democratic Republic
    of the Congo</strong></p><p>An additional 945 confirmed cases, including 480 confirmed deaths, have been reported in the Democratic Republic of the Congo since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON625">Disease Outbreak News</a> was published. </p><p>In the last 21-day period, as of 17 November, 1417 new confirmed cases were reported, with Ituri accounting for 668 (13% decrease) cases, Nord Kivu for 635 (8% increase) cases, Haut-U&eacute;l&eacute; for 90 (13% increase) cases, Tshopo for 20 (47% decrease) cases and Nord-Ubangi for four cases. No new cases were reported in Bas-U&eacute;l&eacute;, Sud Kivu or Sud-Ubangi during that period. </p><p>As of 17 November, cumulative confirmed cases have reached 11 613, including 5678 deaths and 3148 recoveries. The overall crude CFR is 48.9%. </p><p>Confirmed cases have now been identified in 68 health zones across eight provinces. Forty-eight of the 68 affected health zones reported at least
    one new case during the preceding 21 days, while 20 reported no recent cases. Beni, Bunia, and Mandima have reported the highest number of cases and deaths in the preceding 21 days. Ituri remains the most extensively affected province, with 28 of 36 health zones reporting cases during this outbreak, followed by Nord Kivu (17/34), Haut-U&eacute;l&eacute; (8/13), Tshopo (7/23), Bas-U&eacute;l&eacute; (4/11), Nord-Ubangi (2/11), Sud Kivu (1/34) and Sud-Ubangi (1/16). Watsa in Haut-U&eacute;l&eacute; province is the most recently affected health zone, reporting 11 confirmed cases.</p><p>Six months into the BVD outbreak, the response has expanded significantly, but transmission remains persistent and geographically widespread. WHO, the national Government and partners have strengthened surveillance, treatment, laboratory capacity and community engagement, yet high community mortality, insecurity, displacement and a fragile health system continue to undermine progress.</p><p>The next phase
    will need to focus on scaling up, but also on improving the reach, quality and impact of the response. Early detection, quality care, contact tracing, infection prevention and community trust remain critical. Sustained funding, strong coordination and safe access to communities will be essential.</p><p>The third International Health Regulations (IHR) Emergency Committee meeting regarding the epidemic of BVD in the Democratic Republic of the Congo took place on 17 November. Following the advice of the Committee, the Director-General agreed that the ongoing outbreak remains a PHEIC. Updated recommendations to the government of the DRC and all other States Parties will be issued in the coming days and reported in the next Disease Outbreak News publication. &nbsp;</p><p><strong>Figure 1. Classification of health zones reporting confirmed cases of Bundibugyo virus disease in the Democratic Republic of the Congo, as of 17 November 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/bvd-drc-map.png?sfvrsn=737a002a_4"
    height="652" style="max-width:100%;height:auto;" title="BVD DRC map" width="935" alt="BVD DRC map" sf-size="251973" /></p><p>While Nord Kivu reported the highest number of cases in the last seven days (235 cases (40% increase compared to the previous seven days) as of 17 November), Ituri remains the most affected province since the outbreak was declared, with 7946 cumulative confirmed cases and 3751 deaths, with CFR of 47%. Nord Kivu follows with 2996 confirmed cases and 1654 deaths, and continues to record the highest provincial CFR, at 55%. Haut-U&eacute;l&eacute; has reported 534 cases and 231 deaths, while Tshopo has recorded 109 cases and 35 deaths. The less-affected provinces continue to report substantially fewer cases, but transmission persists in several of them. The continued occurrence of cases across multiple provinces shows that the outbreak remains geographically active even as intensity varies between health zones. Sud-Kivu and Sud Ubangi have not reported cases for more
    than 42 days. </p><p>As of 17 November 2026, the average proportion of contacts seen daily over the previous 14-day period is 81%, remaining below the required threshold of 95% for a daily average of the proportion of contacts seen over the previous 14-day period. Two provinces were at or above the 95% threshold: Bas-Uele (100%, 56/56) and Nord-Ubangi (99%, 140/138) Five provinces were below the threshold: Haut-U&eacute;l&eacute; (86%; 1741/1495), Ituri (86% (9564/11 104), Nord-Kivu (77%; 16 015/12 313), Tshopo (68%; 720/526), and Sud-Ubangi (63%; 127/80). Strengthened contact follow-up is required, particularly in provinces below the target, to achieve the minimum threshold of 95%.</p><p><strong>Figure 2: Number of confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo, by date of notification, as of 17 November 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/bvd-epi-curve.png?sfvrsn=b0199f2c_4"
    height="593" style="max-width:100%;height:auto;" title="BVD Epi curve" width="918" alt="BVD Epi curve" sf-size="69445" /></p><p><strong>Figure 3: Number of deaths among confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo by date of notification, as of 17 November 2026&nbsp;</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/bvd_epi-curve-2.png?sfvrsn=ceb8104c_4" height="629" style="max-width:100%;height:auto;" title="BVD_Epi curve 2" width="926" alt="BVD Epi curve 2" sf-size="59524" /></p><p><strong>Kenya </strong></p><p>As of 17 November 2026, the cumulative confirmed cases reported in Kenya are nine, including two deaths, with a crude CFR of 22.2%. All eight secondary cases were epidemiologically linked to the imported index case and associated with one cluster (four family members of the index case and four health and care workers). &nbsp;All seven hospitalized cases have recovered
    and been discharged (the last case was discharged on 11 November). A 42-day countdown is underway and includes heightened surveillance. </p><p>There is currently no evidence of transmission outside this cluster, and there have been no new confirmed cases since 19 October 2026.&nbsp; Additionally, all eight secondary cases were already under quarantine as known contacts when they developed symptoms. &nbsp;</p><p>As of 17 November, of the 135 cumulative contacts identified since the first confirmed case, eight subsequently became confirmed cases and nine contacts left Kenya (relevant National IHR Focal Points were notified). All have completed the 21-day follow-up on 11 November 2026.</p><p><strong>Figure 4: Number of confirmed Bundibugyo virus disease cases in Kenya, by date of notification, as of &nbsp;17 November 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/bvd-kenya-epi-curve.png?sfvrsn=a22a077b_6"
    height="376" style="max-width:100%;height:auto;" title="BVD Kenya Epi curve" width="582" alt="BVD epi curve Kenya" sf-size="221559" /></p><p><strong>Nigeria</strong></p><p>On 20 October 2026, Nigeria reported one laboratory-confirmed imported case of BVD in the Federal Capital Territory Abuja. On 26 October 2026, <a href="https://www.admin.ch/en/newnsb/hKpTLMT8HgXi">Switzerland reported the medical evacuation of the case</a>, who received medical care in Geneva, Switzerland. The patient recovered and was discharged on 11 November, following two PCR-negative test results for Bundibugyo virus. </p><p>As of 13 November, a cumulative of 62 contacts had been identified in Nigeria for follow-up and all the contacts have completed the 21-day follow-up period. National authorities, with support from WHO and partners, have intensified contact tracing, case investigation and infection prevention and control measures, including the provision of essential supplies and personal protective equipment
    for health workers. Investigations are ongoing to establish the likely source of infection and reconstruct the travel and exposure history of the imported case. WHO has urged countries across the region to strengthen surveillance, laboratory diagnostic capacity, rapid response readiness and cross-border preparedness to mitigate the risk of further transmission.</p></p>'
