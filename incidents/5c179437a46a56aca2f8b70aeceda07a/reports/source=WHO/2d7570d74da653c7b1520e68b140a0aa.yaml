  Response: '<div><p paraid="1092540550" paraeid="{2ad982de-3652-4314-b57b-f177366e4548}{148}">For detailed information about the ongoing public health response actions by the respective Ministry of Health, WHO and partners please refer to the latest situation reports published by the WHO Regional Office for Africa: <a href="https://www.afro.who.int/health-topics/ebola-disease/outbreak-drc-26" target="_blank" rel="noreferrer noopener">Ongoing outbreak in the Democratic Republic of the Congo | WHO | Regional Office for Africa</a> | WHO| Regional Office for Africa&nbsp;&nbsp;</p></div><div><p paraid="2108908504" paraeid="{2ad982de-3652-4314-b57b-f177366e4548}{178}">Health authorities in the Democratic Republic of the Congo, in collaboration with WHO and partners, are continuing to implementing extensive public health measures, including the continental preparedness and response plan, a strategic six-month framework plan designed to guide coordinated efforts to strengthen outbreak response
    measures, including emergency coordination, disease surveillance, laboratory testing, infection prevention and control, clinical care, community engagement, research, logistics and support for essential health services, engaging donors and mobilizing additional resources to address critical funding gaps and sustain response operations across affected and at-risk areas. A substantial scale-up is ongoing across all response pillars to get ahead of the outbreak.</p></div>'
