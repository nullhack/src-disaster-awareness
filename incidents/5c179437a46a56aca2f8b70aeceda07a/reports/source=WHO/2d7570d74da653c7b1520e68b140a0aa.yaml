  Title: Ebola disease caused by Bundibugyo virus - Democratic Republic of the Congo
  Epidemiology: <div><p paraid="710405995" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{211}">Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the Orthoebolavirus species. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.&nbsp;</p></div><div><p paraid="677574308" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{225}">Human infection is thought to occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when IPC measures are inadequate and during unsafe burial practices involving direct contact with deceased individuals.&nbsp;</p></div><div><p paraid="1295580800" paraeid="{2ad982de-3652-4314-b57b-f177366e4548}{22}">The
    incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and sore throat are non-specific, which complicates clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.&nbsp;</p></div><div><p paraid="2006760097" paraeid="{2ad982de-3652-4314-b57b-f177366e4548}{80}">CFRs in the past two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.&nbsp;</p></div><div><p paraid="935143066" paraeid="{2ad982de-3652-4314-b57b-f177366e4548}{124}">Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation using PCR or antigen- or antibody-based assays. Outbreak control relies on rapid case identification, isolation and care, contact tracing,
    safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.&nbsp;</p></div>
  Advice: <div><p paraid="1270548175" paraeid="{2b500c00-0d7b-4b25-81fa-fc8a6ea98695}{22}">Based on the currently available information, WHO advises against any restriction of travel to, or trade with, affected countries. WHO continues to closely monitor and, where necessary, verify travel and trade measures in relation to this event.&nbsp;</p></div><div><p paraid="1493428972" paraeid="{2b500c00-0d7b-4b25-81fa-fc8a6ea98695}{40}">For further information on the considerations for implementing border health and international travel-related temporary recommendations, please see the relevant  <a href="https://iris.who.int/items/b07def43-df30-41b8-83e0-deb33bcfd697" target="_blank" rel="noreferrer noopener">technical note issued on 26 May 2026</a>.&nbsp;</p></div><div><p paraid="710210868" paraeid="{2b500c00-0d7b-4b25-81fa-fc8a6ea98695}{54}">The <a href="https://www.who.int/news/item/22-05-2026-first-meeting-of-the-ihr-emergency-committee-regarding-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-and-uganda-2026-temporary-recommendations"
    target="_blank" rel="noreferrer noopener">Temporary Recommendations</a> issued to States Parties on 22 May 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further regional spread and ensure an effective public health response.&nbsp;&nbsp;</p></div><div><p paraid="2144045326" paraeid="{2b500c00-0d7b-4b25-81fa-fc8a6ea98695}{80}">Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.&nbsp;</p></div><div><p paraid="235577367" paraeid="{2b500c00-0d7b-4b25-81fa-fc8a6ea98695}{94}">WHO has convened several technical advisory groups, including the Strategic Advisory Group of Experts on Immunization (SAGE) to assess candidate vaccines and therapeutics for BVD.&nbsp;&nbsp;</p></div><div><p paraid="1507058828" paraeid="{2b500c00-0d7b-4b25-81fa-fc8a6ea98695}{104}">On 7 August,
    the WHO Technical Advisory Group released a report regarding possible candidate vaccines for Bundibugyo virus disease.&nbsp;&nbsp;The members recommended that Ervebo, the only licensed Ebola vaccine (previously known as ebolavirus Zaire), be prioritized for inclusion in a randomized clinical trial in the context of the ongoing outbreak in the Democratic Republic of the Congo WHO is working with partners to start this trial as soon as possible.&nbsp;</p></div><div><p paraid="2077841576" paraeid="{2b500c00-0d7b-4b25-81fa-fc8a6ea98695}{124}">In addition, WHO is sponsoring a clinical trial to find effective treatments against BVD. The trial began enrollment on 2 July. The trial, known as the PARTNERS trial, is now open in three different clinical management facilities in Ituri province and has enrolled over 100 confirmed cases.&nbsp;&nbsp;</p></div>
  Assessment: <div><p paraid="2105732305" paraeid="{817a6cbe-5e04-45df-99f8-d12583a819dc}{25}">On 6 June 2026, WHO reassessed the risk of the outbreak of BVD to incorporate newly available information and align with the WHO <a href="https://www.who.int/news/item/22-05-2026-first-meeting-of-the-ihr-emergency-committee-regarding-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-and-uganda-2026-temporary-recommendations" target="_blank" rel="noreferrer noopener">Temporary Recommendations</a>. The risk for countries sharing land borders with countries with documented Bundibugyo virus detection, the Democratic Republic of the Congo and Uganda at the time of assessment, was separated from the risk for other countries in the African Region.&nbsp;</p></div><div><p paraid="1504517252" paraeid="{817a6cbe-5e04-45df-99f8-d12583a819dc}{85}">The risk in the Democratic Republic of the Congo was assessed as very high due to ongoing transmission and the continued expansion
    of the outbreak into new health zones, increasing the potential for further national and regional spread.&nbsp;</p></div><div><p paraid="82059134" paraeid="{817a6cbe-5e04-45df-99f8-d12583a819dc}{95}">The risk in Uganda was assessed as high due to confirmed cross-border spread through imported cases and ongoing epidemiological links along the eastern Democratic Republic of the Congo&ndash;western Uganda corridor, which has historically been affected by Ebola outbreaks, including Bundibugyo virus and Sudan virus disease.&nbsp;&nbsp;</p></div><div><p paraid="329074013" paraeid="{817a6cbe-5e04-45df-99f8-d12583a819dc}{139}">The risk for countries sharing land borders with countries reporting BDBV detection was assessed as high due to sustained population mobility linked to cross-border trade and mining activities, variation in capacities and experience of BVD response, and variable levels of readiness.&nbsp;&nbsp;</p></div><div><p paraid="1383071648" paraeid="{817a6cbe-5e04-45df-99f8-d12583a819dc}{183}">The
    risk for the rest of the African region and at the global level was assessed as low.&nbsp;</p></div><div><p paraid="788217968" paraeid="{817a6cbe-5e04-45df-99f8-d12583a819dc}{203}">For further information, please see the <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo--uganda-and-countries-with-land-borders-adjoining-countries-with-documented-bdbv-detection-v3" target="_blank" rel="noreferrer noopener">WHO Rapid Risk Assessment &ndash; Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo, Uganda and countries with land borders adjoining countries with documented BDBV detection v3</a>.&nbsp;</p></div><div><p paraid="1507058341" paraeid="{817a6cbe-5e04-45df-99f8-d12583a819dc}{225}">An updated Rapid Risk Assessment is being developed in advance of the upcoming IHR Emergency Committee meeting regarding the epidemic of Ebola Bundibugyo virus disease in the Democratic
    Republic of the Congo scheduled for 18 August. This is the second meeting of the committee, following their initial meeting after the Director-General characterized the situation as a Public Health Emergency of International Concern on 17 May 2026.&nbsp;&nbsp;</p></div>
  Overview: '<div><p paraid="324436430" paraeid="{4c6cc40d-e453-4be8-8c5e-8856285c5cad}{244}">Since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON614" target="_blank" rel="noreferrer noopener">Disease Outbreak News</a> was published on 1 August 2026, additional confirmed cases and deaths of BVD have been only reported in the Democratic Republic of the Congo.&nbsp;&nbsp;</p></div><div><p paraid="2027654824" paraeid="{bfa28cb7-5b63-41b8-ac18-cd04ec244bdf}{41}">Cumulatively as of 12 August 2026, 4686 confirmed cases have been reported: 4665 in the Democratic Republic of the Congo (including two cases diagnosed in the Democratic Republic of the Congo and subsequently treated in Germany), 20 in Uganda and one in France. A total of 2186 deaths have been reported, including two in Uganda. As of 12 August, at least 986 patients have recovered including 965 in the Democratic Republic of the Congo, 18 from Uganda have recovered, two in Germany and one from
    France.&nbsp;&nbsp;</p></div><div><p paraid="1459063622" paraeid="{bfa28cb7-5b63-41b8-ac18-cd04ec244bdf}{181}">As reported in the <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON614" target="_blank" rel="noreferrer noopener">Disease Outbreak News</a> published on 1 August 2026, with more confirmed cases than the 2018-2020 outbreak, which reported 3,317 cases, this outbreak now represents the largest Ebola disease outbreak ever documented in the country.&nbsp;</p></div><p paraid="1274016221" paraeid="{bfa28cb7-5b63-41b8-ac18-cd04ec244bdf}{195}"><strong>Figure 1. Distribution of cumulative confirmed cases of Bundibugyo virus disease in the Democratic Republic of the Congo as of 12 August  </strong>&nbsp;</p><p paraid="1274016221" paraeid="{bfa28cb7-5b63-41b8-ac18-cd04ec244bdf}{195}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/don_evd_drc_map_20260814.png?sfvrsn=60dfd869_1" height="521" style="max-width:100%;height:auto;"
    title="DON_EVD_DRC_map_20260814" width="748" alt="" sf-size="230852" /></p><div><p paraid="1899123609" paraeid="{bfa28cb7-5b63-41b8-ac18-cd04ec244bdf}{238}"><strong>Democratic Republic of the Congo&nbsp;</strong>&nbsp;</p></div><div><p paraid="1395301755" paraeid="{bfa28cb7-5b63-41b8-ac18-cd04ec244bdf}{244}">Since 1 August 2026 when the last Disease Outbreak News was published, an additional 1060 confirmed cases, including 597 confirmed deaths, have been reported in the Democratic Republic of the Congo. The increase is in part due to strengthened surveillance activities, enhanced laboratory testing, and diagnostic capacity. However, most of the increase reflects the expansion of the outbreak.&nbsp;&nbsp;</p></div><div><p paraid="705776601" paraeid="{8210823e-e001-48cb-91dd-fb4eca777408}{99}">As of 12 August 2026, a total of 4665 confirmed cases, including 2184 deaths (CFR 46.8%), have been reported in the Democratic Republic of the Congo. To date, 965 patients have recovered.&nbsp;</p></div><div><p
    paraid="49912174" paraeid="{8210823e-e001-48cb-91dd-fb4eca777408}{185}">Cases have been reported from 54 health zones (HZ) across six provinces: Ituri (28/36 HZ), North Kivu (12/34 HZ), South Kivu (1/34 HZ), Haut-U&eacute;l&eacute; (6/13 HZ), Tshopo (6/23 HZ), and Bas- U&eacute;l&eacute; (1/11 HZ). The most recently affected province, Bas-U&eacute;l&eacute;, reported one confirmed case in Buta Health Zone. The case had a travel history to Haut-U&eacute;l&eacute;, with symptom onset on 4 August.&nbsp;</p></div><div><p paraid="1367069423" paraeid="{75f44c99-f3a5-4f55-8163-b62b593508f3}{40}">As of 12 August, of the 54 affected health zones, 100 new confirmed cases were reported in the last 24 hours from 22 health zones in all affected provinces except for Sud-Kivu. The highest number of new cases in the last 24 hours (67) was reported from Ituri province followed by Nord-Kivu (25). Ituri remains the most affected province, accounting for 85% (3979/4665) of all confirmed cases and 79% (1726/2184)
    of reported deaths nationwide.&nbsp;&nbsp;</p></div><div><p paraid="486817034" paraeid="{75f44c99-f3a5-4f55-8163-b62b593508f3}{148}">As of 12 August, the proportion of contacts followed up in the last 24 hours is at 84.2% (17 460 seen out of 20 740 to follow up).&nbsp;</p></div><div><p paraid="1584842443" paraeid="{75f44c99-f3a5-4f55-8163-b62b593508f3}{182}">As of 9 August, infections among health workers continue, with at least 155 confirmed cases, including 45 deaths (CFR: 29%) and 68 recoveries since beginning of the outbreak. These infections highlight ongoing occupational exposure risks, persistent challenges in implementing infection prevention and control (IPC) in health-care facilities&mdash;especially outside of the designated Ebola treatment centres which have more established protocols and access to supplies--and continued exposure risk in the community.&nbsp;</p></div><div><p paraid="473527570" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{31}">The outbreak is taking place
    amid a severe humanitarian crisis and ongoing insecurity, characterized by large-scale population displacement, significant population mobility, and constrained access to critical services, including health care, safe water, food, shelter, and protection. Response efforts in the affected provinces have been hindered by insecurity and attacks on health facilities, which have curtailed access for response teams, discouraging potential patients from seeking care, disrupting surveillance and response activities and increasing the risk of undetected transmission. Since the declaration of the Ebola public health emergency of international concern (PHEIC) <a href="https://www.who.int/news/item/22-05-2026-first-meeting-of-the-ihr-emergency-committee-regarding-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-and-uganda-2026-temporary-recommendations" target="_blank" rel="noreferrer noopener">on 17 May 2026</a>, 12 attacks on health care have been recorded,
    with additional reports under verification. These challenges underscore the importance of community-centred response efforts led by local authorities and trusted community leaders.&nbsp;&nbsp;</p></div><div><p paraid="855615797" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{103}"><strong>Figure 2: Number of confirmed cases (n = 4665), in the Democratic Republic of the Congo, by date of reporting and as of 12 August 2026&nbsp;</strong></p><p paraid="855615797" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{103}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/don_evd_drc_cases_20260814.png?sfvrsn=67c2e4fa_1" height="551" style="max-width:100%;height:auto;" title="DON_EVD_DRC_cases_20260814" width="960" alt="" sf-size="83687" /></p></div><div><p paraid="1618097151" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{142}">* Note that the large number of reported cases on 22 July represents the completion of a data reconciliation
    exercise, including cases that occurred earlier in the outbreak, rather than newly recorded cases.&nbsp;</p></div><div><p paraid="1268974260" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{148}"><strong>Figure 3: Number of deaths among confirmed cases (n = 2184), in the Democratic Republic of the Congo, by date of reporting, as of 12 August 2026</strong></p><p paraid="1268974260" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{148}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/don_evd_drc_deaths_20260814.png?sfvrsn=4be2acf2_1" height="549" style="max-width:100%;height:auto;" title="DON_EVD_DRC_deaths_20260814" width="958" alt="" sf-size="83570" /></p></div><div><p paraid="847988959" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{185}">* Note that the large number of reported deaths on 22 July represents the completion of a data reconciliation exercise, including deaths that occurred earlier in the outbreak, rather
    than newly recorded deaths.&nbsp;</p></div><div><p paraid="539080407" paraeid="{ad538d91-5878-48d2-823e-b0723cd676f7}{205}"><strong>&nbsp;</strong></p></div>'
