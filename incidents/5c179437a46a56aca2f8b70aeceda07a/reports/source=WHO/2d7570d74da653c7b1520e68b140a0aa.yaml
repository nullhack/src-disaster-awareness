  Summary: "The Bundibugyo virus disease (BVD) outbreak in the Democratic Republic of the Congo is in a phase of intense transmission. It is the largest Ebola outbreak ever reported in the country and expanding faster than any previous Ebola outbreak. The epidemic is increasingly characterized by sustained transmission within interconnected geographic clusters. Initially confined to the Mongbwalu health zone in Ituri Province, the outbreak has now expanded to 54 health zones across six provinces (Ituri, North Kivu, South Kivu, Haut-Uélé, Tshopo, and Bas-Uélé). The most recently affected Bas-Uélé province recorded one confirmed case in Buta health zone with travel history to Haut-Uélé and onset of symptoms on 4 August. \r\n\r\nAs of 12 August 2026, a total of 4665 confirmed cases, including 2184 deaths, have been reported, corresponding to a crude case fatality ratio (CFR) of 46.8%. The ongoing rise in cases, broader geographic spread, and continued high mortality demonstrate the rapidly\
    \ changing scope of this public health emergency of international concern. During the most recent reporting week (epidemiological week 32, 3 to 9 August 2026), the highest weekly number of reported cases (579) and deaths (304) were recorded, highlighting the exceptional pace of transmission. \r\n\r\nThe ongoing humanitarian crisis, compounded by insecurity, population displacement and mobility, and cross-border movements, continues to pose significant challenges to response efforts and increase the risk of further geographical spread. National authorities in the Democratic Republic of the Congo, continue to implement extensive response measures in collaboration with WHO and partners. However, a substantial scaling up of response activities is underway to get ahead of the outbreak. Following their missions to the Democratic Republic of the Congo, WHO’s Director-General and Regional Director for Africa, and the Director General of Africa CDC, highlighted surveillance activities and closer\
    \ work with communities as priority areas. Expanding the number of treatment centers, across more areas, is underway, along with training for the health and care workers to staff them.  \r\n\r\nFrance has reported no secondary transmission following an imported case detected on 24 June 2026. As of 14 August, 41 days had passed since the patient’s discharge on 4 July, with no additional confirmed cases reported.  \r\n\r\nIn Uganda the most recent imported case was discharged from a treatment centre on 16 July, and the 42-day enhanced monitoring period will cease on 27 August. \r\n\r\nUganda remains at risk of BVD re-introduction due to ongoing transmission in neighbouring Democratic Republic of the Congo and is undertaking heightened surveillance activities given continued population movement and the risk of cross-border transmission. A regional preparedness and prioritization framework continues to guide readiness and response activities across the African Region. "
