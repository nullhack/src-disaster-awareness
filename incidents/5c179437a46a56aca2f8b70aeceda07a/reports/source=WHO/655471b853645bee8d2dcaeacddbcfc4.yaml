  Epidemiology: <div><p paraid="710405995" paraeid="{3d7d4911-5037-4b57-bf25-d27f8480f4ed}{12}">Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the <em>Orthoebolavirus </em>species. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.&nbsp;</p></div><div><p paraid="677574308" paraeid="{3d7d4911-5037-4b57-bf25-d27f8480f4ed}{26}">Human infection is thought to occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when IPC measures are inadequate and during unsafe burial practices involving direct contact with deceased individuals.&nbsp;</p></div><div><p paraid="1295580800" paraeid="{3d7d4911-5037-4b57-bf25-d27f8480f4ed}{78}">The
    incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and sore throat are non-specific, which complicates clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.&nbsp;</p></div><div><p paraid="2006760097" paraeid="{3d7d4911-5037-4b57-bf25-d27f8480f4ed}{136}">The historical CFR from the past two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.&nbsp;</p></div><div><p paraid="935143066" paraeid="{3d7d4911-5037-4b57-bf25-d27f8480f4ed}{186}">Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation using polymerase chain reaction (PCR) or antigen- or antibody-based assays. Outbreak control relies on rapid case identification,
    isolation and care, contact tracing, safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.&nbsp;</p></div><div><p paraid="344893295" paraeid="{3d7d4911-5037-4b57-bf25-d27f8480f4ed}{214}">Since first detected in May 2026, this BVD outbreak has rapidly evolved into a large and geographically expanding epidemic in the Democratic Republic of the Congo, with sustained transmission, high mortality and an increasing risk of further international spread. The current outbreak is the second documented Bundibugyo virus disease outbreak in the country, after the 2012 outbreak, and the largest Ebola disease outbreak ever recorded in the Democratic Republic of the Congo irrespective of Ebola virus species. The population at greatest risk of exposure is concentrated in communities living in and moving through the health areas with active transmission.&nbsp;</p></div>
  OverrideTitle: ''
  Advice: <div><p paraid="1270548175" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{217}">Based on the currently available information, WHO advises against any restriction of travel to, or trade with, affected countries. WHO continues to closely monitor and, where necessary, verify travel and trade measures in relation to this event.&nbsp;</p></div><div><p paraid="1471374517" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{235}">The updated <a href="https://www.who.int/news/item/24-08-2026-second-meeting-of-the-ihr-emergency-committee-on-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-temporary-recommendations" target="_blank" rel="noreferrer noopener">Temporary Recommendations</a> issued to States Parties on 24 August 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further regional spread and ensure an effective public health response.
    Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.&nbsp;</p></div>
  Assessment: <div><p paraid="2105732305" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{91}">On 14 August 2026, WHO reassessed the risk of the outbreak of BVD, incorporating newly available information on the evolving situation. The risk for countries sharing land borders with the Democratic Republic of the Congo was separated from the risk for other countries in the African Region.&nbsp;</p></div><div><p paraid="1383071648" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{137}">The risk in the Democratic Republic of the Congo was assessed as very high, the risk for countries sharing land borders with the Democratic Republic of the Congo was assessed as high, and the risks for the rest of the African region and at the global level was again assessed as low.&nbsp;</p></div><div><p paraid="788217968" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{193}">For further information, please see <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo-v4"
    target="_blank" rel="noreferrer noopener">WHO Rapid Risk Assessment-Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo v4</a>&nbsp;</p><strong></strong></div>
  Overview: '<p><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">Since the previous </span><a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON617" target="_blank" rel="noreferrer noopener" style="text-align:inherit;text-transform:inherit;word-spacing:normal;white-space:inherit;">Disease Outbreak News</a><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;"> was published on 11 September 2026, an additional 1133 confirmed cases, including 532 confirmed deaths, have been reported in the Democratic Republic of the Congo. The seven-day moving average shows a resurgence in early September followed by a decline over the most recent reporting days. However, the aggregate national trend conceals substantial variation in transmission intensity across affected provinces and health zones.&nbsp;</span></p><div><p
    paraid="1173713190" paraeid="{c42fc159-e721-47a9-8cf9-623c6bdc72cd}{162}">As of 23 September, the Democratic Republic of the Congo has reported a total of 7890 confirmed cases, including 3799 deaths (CFR 48.1%). A total of 1966 patients have recovered to date.&nbsp;</p></div><div><p paraid="1555743484" paraeid="{c42fc159-e721-47a9-8cf9-623c6bdc72cd}{244}">Confirmed cases have been reported from 63 health zones across seven provinces, with 48 health zones from six provinces reporting at least one case in the last 21 days. Ituri remains the most affected province, with 28 of its 36 health zones reporting cases, followed by North Kivu (16/34), Tshopo (7/23), Haut-U&eacute;l&eacute; (7/13), Bas-U&eacute;l&eacute; (3/11), South Kivu (1/34), and Sud Ubangi (1/16). No new cases have been reported from South Kivu province since 29 May 2026.&nbsp;&nbsp;Dungu Health Zone in Haut-U&eacute;l&eacute; province and Bulu in Sud Ubangi are the most recently affected areas. As of 23 September, 70 new
    confirmed cases had been reported in the preceding 24 hours from 26 health zones located in Ituri, North Kivu, Haut-U&eacute;l&eacute;, Bas U&eacute;l&eacute; and Tshopo provinces.&nbsp;&nbsp;</p></div><div><p paraid="746795431" paraeid="{5dc43249-f5f0-4cd9-b438-8381718e268b}{165}"><strong>Figure 1. Distribution of cumulative confirmed cases of Bundibugyo virus disease in the Democratic Republic of the Congo, as of 23 September</strong></p><p paraid="746795431" paraeid="{5dc43249-f5f0-4cd9-b438-8381718e268b}{165}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/emergencies/disease-outbreak-news/20260925_don_evd_drc_mapd51d9a14-4ce8-482d-8159-3c261f8f7607.png?sfvrsn=53eac9ca_2" height="530" style="max-width:100%;height:auto;" title="20260925_DON_EVD_DRC_map" width="759" alt="DRC map" sf-size="251272" /></p></div><p><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">Ituri
    continues to be the epicentre of the outbreak, accounting for 6032 confirmed cases since the start of the outbreak, including 868 new confirmed cases reported in the previous 21 days, as of 23 September. North Kivu is the second most affected province, with a cumulative number of 1480 confirmed cases, including 567 reported in the last 21 days, as of 23 September. North Kivu province continues to report the highest CFR (59.7%) observed in this outbreak; and investigations are ongoing to better understand the factors contributing to this elevated mortality rate.&nbsp;</span></p><div><p paraid="1831920683" paraeid="{4350f06f-00bd-4012-afc0-2ae31451c1bd}{63}">In Ituri, case incidence continues to decline gradually from the peak observed in mid-August, although transmission remains at elevated levels. North Kivu, in contrast, has experienced a substantial increase in incidence, reaching its highest reported level in mid-September, followed by a decline in recent reporting days. Haut-U&eacute;l&eacute;
    continues to demonstrate sustained transmission, albeit at levels below the peak recorded in late August, while Tshopo is showing renewed transmission activity following a period of low incidence. In Bas-U&eacute;l&eacute;, transmission remains sporadic, whereas no recent evidence of transmission has been reported in Sud-Kivu. Sud Ubangi is the seventh province to report a confirmed case of BVD, with one case that was reported on 10 September (Figure 2).&nbsp;</p></div><div><p paraid="486817034" paraeid="{4350f06f-00bd-4012-afc0-2ae31451c1bd}{69}">The number of individuals requiring follow-up as contact has also risen considerably with the expansion of the outbreak. As of 23 September, 83.4% of identified contacts were successfully monitored during the previous 24 hours with 26 980 contacts seen out of 32 342 requiring follow up. The large volume of contacts under surveillance highlights the extent of potential exposure within affected communities and the substantial demands placed on
    response operations.&nbsp;</p><div><p paraid="1647073309" paraeid="{4350f06f-00bd-4012-afc0-2ae31451c1bd}{161}">The response is being implemented in a challenging humanitarian environment, where conflict, insecurity, displacement, and limited access to basic services continue to affect outbreak control.&nbsp;&nbsp;These constraints continue to hamper surveillance, case finding, contact tracing, infection prevention and control, and timely access to appropriate care, thereby limiting the overall effectiveness of response activities.&nbsp;</p></div><div><p paraid="855615797" paraeid="{4350f06f-00bd-4012-afc0-2ae31451c1bd}{167}"><strong>Figure 2: Number of confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo, by date of notification, as of 23 September 2026</strong></p><p paraid="855615797" paraeid="{4350f06f-00bd-4012-afc0-2ae31451c1bd}{167}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/emergencies/disease-outbreak-news/don_evd_drc_cases_202609258efbc07a-a8da-404c-988d-66220ce15270.png?sfvrsn=20b289fa_2"
    height="561" style="max-width:100%;height:auto;" title="DON_EVD_DRC_cases_20260925" width="816" alt="DRC map" sf-size="50289" /></p></div><div><p paraid="1268974260" paraeid="{4350f06f-00bd-4012-afc0-2ae31451c1bd}{212}"><strong>Figure 3: Number of deaths among confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo by date of notification, as of 23 September 2026.&nbsp;</strong></p></div></div><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/emergencies/disease-outbreak-news/don_evd_drc_deaths_202609256fa0eafb-28aa-4034-9fe0-805f476d9985.png?sfvrsn=2239f0ee_2" height="562" style="max-width:100%;height:auto;" title="DON_EVD_DRC_deaths_20260925" width="818" alt="EVD deaths" sf-size="44707" /><br /></p>'
