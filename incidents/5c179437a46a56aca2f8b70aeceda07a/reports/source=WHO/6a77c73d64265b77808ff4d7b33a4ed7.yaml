  Title: Ebola disease caused by Bundibugyo virus - Democratic Republic of the Congo
  Epidemiology: <div><p paraid="710405995" paraeid="{3c5875cc-b3c0-4ae9-8dbc-ae1c4f8ad88c}{53}">Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the <em>Orthoebolavirus</em> species. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.&nbsp;</p></div><div><p paraid="677574308" paraeid="{3c5875cc-b3c0-4ae9-8dbc-ae1c4f8ad88c}{67}">Human infection is thought to occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when IPC measures are inadequate and during unsafe burial practices involving direct contact with deceased individuals.&nbsp;</p></div><div><p paraid="1295580800" paraeid="{3c5875cc-b3c0-4ae9-8dbc-ae1c4f8ad88c}{119}">The
    incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and sore throat are non-specific, which complicates clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.&nbsp;</p></div><div><p paraid="2006760097" paraeid="{3c5875cc-b3c0-4ae9-8dbc-ae1c4f8ad88c}{177}">CFRs in the past two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.&nbsp;</p></div><div><p paraid="935143066" paraeid="{3c5875cc-b3c0-4ae9-8dbc-ae1c4f8ad88c}{221}">Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation using PCR or antigen- or antibody-based assays. Outbreak control relies on rapid case identification, isolation and care, contact tracing,
    safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.&nbsp;</p></div><div><p paraid="344893295" paraeid="{3c5875cc-b3c0-4ae9-8dbc-ae1c4f8ad88c}{239}">Since first detected in May 2026, this BVD outbreak has rapidly evolved into a large and geographically expanding epidemic in the Democratic Republic of the Congo, with sustained transmission, high mortality and an increasing risk of further international spread. The current outbreak is the second documented Bundibugyo virus disease outbreak in the country, after the 2012 outbreak, and the largest Ebola disease outbreak ever recorded in the Democratic Republic of the Congo irrespective of Ebola virus species. The population at greatest risk of exposure is concentrated in communities living in and moving through areas with active transmission.&nbsp;&nbsp;</p></div>
  Advice: <p><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">Based on the currently available information, WHO advises against any restriction of travel to, or trade with, affected countries. WHO continues to closely monitor and, where necessary, verify travel and trade measures in relation to this event.&nbsp;</span></p><div><p paraid="1471374517" paraeid="{f950c7ae-31d3-4244-98fb-3595d3f21400}{138}">The updated <a href="https://www.who.int/news/item/24-08-2026-second-meeting-of-the-ihr-emergency-committee-on-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-temporary-recommendations" target="_blank" rel="noreferrer noopener">Temporary Recommendations</a> issued to States Parties on 24 August 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further
    regional spread and ensure an effective public health response. Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.&nbsp;</p></div><div><p paraid="1286501918" paraeid="{f950c7ae-31d3-4244-98fb-3595d3f21400}{180}">On 7 August, the WHO Technical Advisory Group on candidate vaccine prioritization released a report regarding possible candidate vaccines for Bundibugyo virus disease.&nbsp;&nbsp;The members recommended that Ervebo, the only licensed Ebola vaccine (previously known as ebolavirus Zaire), be prioritized for inclusion in a randomized clinical trial in the context of the ongoing outbreak in the Democratic Republic of the Congo.&nbsp;&nbsp;</p></div><div><p paraid="2077841576" paraeid="{f950c7ae-31d3-4244-98fb-3595d3f21400}{212}">In addition, WHO is sponsoring a clinical trial to find effective treatments against BVD. The trial began enrollment on 2 July. The trial,
    known as the PARTNERS trial, is now open in three different clinical management facilities in Ituri province and has enrolled over 250 people who are confirmed cases.&nbsp;&nbsp;</p></div>
  Assessment: <p><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">On 14 August 2026, WHO reassessed the risk of the outbreak of BVD to incorporate newly available information. The risk for countries sharing land borders with the Democratic Republic of the Congo was separated from the risk for other countries in the African Region.&nbsp;</span></p><div><p paraid="1504517252" paraeid="{8b6d521b-ad2e-4ce4-a063-fe43d1a8742c}{164}">The risk in the Democratic Republic of the Congo was assessed as very high due to ongoing transmission and the continued expansion of the outbreak into new health zones, increasing the potential for further national and regional spread. The main considerations supporting this assessment include the substantial increase in the number of cases and considerable geographic extension of the outbreak since the previous risk assessment, and potential further increase in CFR as additional
    deaths are investigated and outcomes are established. In addition, reported transmission among healthcare workers, ongoing conflict and insecurity, laboratory capacity constraints, and absence of licensed vaccine or specific antiviral treatment were also considered as factors maintaining the very high risk.&nbsp;</p></div><div><p paraid="764071078" paraeid="{8b6d521b-ad2e-4ce4-a063-fe43d1a8742c}{234}">The risk for countries sharing land borders with the Democratic Republic of the Congo was again assessed as high due to sustained population mobility linked to cross-border trade and mining activities, variation in capacities and experience of BVD response, and variable levels of readiness. Uganda, the Central African Republic and South Sudan are of particular concern for importation given their proximity, high population mobility and connectivity with areas of the Democratic Republic of the Congo currently experiencing intense transmission. For the Central African Republic and South Sudan,
    these risks are further compounded by high humanitarian needs, population displacement, insecurity and underlying limitations in health-system capacity.&nbsp;</p></div><div><p paraid="1383071648" paraeid="{f950c7ae-31d3-4244-98fb-3595d3f21400}{23}">The risk for the rest of the African region and at the global level was again assessed as low.&nbsp;</p></div><div><p paraid="788217968" paraeid="{f950c7ae-31d3-4244-98fb-3595d3f21400}{43}">For further information, please see <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo-v4" target="_blank" rel="noreferrer noopener">WHO Rapid Risk Assessment-Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo v4</a>&nbsp;</p></div>
  Overview: '<div><p paraid="324436430" paraeid="{d2c2389c-050a-496e-bdec-a1f77f7cf944}{79}">Since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON615" target="_blank" rel="noreferrer noopener">Disease Outbreak News</a> was published on 14 August 2026, additional confirmed cases and deaths of BVD have been reported only in the Democratic Republic of the Congo.&nbsp;&nbsp;</p></div><div><p paraid="2027654824" paraeid="{d2c2389c-050a-496e-bdec-a1f77f7cf944}{133}">Cumulatively as of 26 August 2026, 5815 confirmed cases have been reported: 5794 in the Democratic Republic of the Congo (including two cases diagnosed in the Democratic Republic of the Congo and subsequently treated in Germany), 20 in Uganda and one in France. A total of 2788 deaths have been reported, including two in Uganda. As of 26 August, at least 1314 patients have recovered, including 1293 in the Democratic Republic of the Congo, 18 in Uganda, two in Germany and one in France.&nbsp;&nbsp;</p></div><div><p
    paraid="1510549767" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{46}">As of 27 August, the 42-day enhanced monitoring period, as per international guidance, has been completed in both France and <a href="https://www.afro.who.int/countries/uganda/news/uganda-ends-ebola-outbreak-following-completion-42-day-countdown" target="_blank" rel="noreferrer noopener">Uganda</a>.&nbsp;&nbsp;</p></div><div><p paraid="296893348" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{68}">The continuing intensity of transmission in the Democratic Republic of the Congo means that the risk of further exportation across international borders remains. Entry and exit health screening and surveillance measures are in place at airports, ports and official land border crossings; however, movement through informal border crossing routes may occur, presenting an ongoing risk of virus exportation, importation and onward transmission. Therefore, cross‑border collaboration, and sustained surveillance and preparedness
    are essential to prevent further regional spread and ensure an effective public health response.&nbsp;</p></div><div><p paraid="265019400" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{98}">On 27 August, vaccination of health care workers using the Ervebo vaccine was initiated in the Democratic Republic of the Congo in some areas, including in Kisangani, Tshopo province. Although Ervebo is a safe vaccine, and effective against Ebola virus disease, it is not known whether it provides protection against the Bundibugyo virus in humans. Thus, starting a clinical trial of the vaccine, alongside this wider use, is key to provide important new evidence and inform future use of the vaccine.&nbsp;</p></div><div><p paraid="753057402" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{134}">The second IHR Emergency Committee meeting regarding the epidemic of Ebola Bundibugyo virus disease in the Democratic Republic of the Congo took place on 18 August. Following the advice of the Committee, the
    Director-General agreed that the ongoing outbreak remains a Public Health Emergency of International Concern, and issued updated temporary recommendations to countries.&nbsp;</p></div><div><p paraid="1143703013" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{148}"><strong>Figure 1. Distribution of cumulative confirmed cases of Bundibugyo virus disease in the Democratic Republic of the Congo, as of 26 August</strong>&nbsp;</p><p paraid="1143703013" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{148}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/don_evd_drc_map_20260828.png?sfvrsn=a38efede_1" height="428" style="max-width:100%;height:auto;" title="DON_EVD_DRC_map_20260828" width="611" alt="" sf-size="170984" /></p><div><p paraid="1899123609" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{193}"><strong>Democratic Republic of the Congo&nbsp;&nbsp;</strong></p></div><div><p paraid="705776601" paraeid="{7909ab86-ea5f-498d-aaa9-b7eeb52e8d1c}{199}">Since
    14 August 2026 when the last <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON615" target="_blank" rel="noreferrer noopener">Disease Outbreak News</a> was published, an additional 1129 confirmed cases, including 602 confirmed deaths, have been reported in the Democratic Republic of the Congo. Although part of this increase likely reflects expanded surveillance, enhanced laboratory testing, improved diagnostic capacity, and periodic data backlog reconciliation, the sustained rise in number of cases and deaths are the result of continued transmission and substantial outbreak expansion. As of 26 August 2026, a total of 5794 confirmed cases, including 2786 deaths (CFR 48.1%), have been reported in the Democratic Republic of the Congo. To date, 1293 patients have recovered.&nbsp;</p></div><div><p paraid="1367069423" paraeid="{a5b229e0-fed4-4a18-9d60-cf3346ebd287}{119}">Cases have been reported from 60 health zones (HZ) across six provinces. Ituri has 28 health zones
    affected out of 36, followed by North Kivu (15/34), Haut-U&eacute;l&eacute; (6/13), Tshopo (7/23), South Kivu (1/34) and Bas U&eacute;l&eacute; (3/11). The most recently affected province, Bas-U&eacute;l&eacute;, started reporting cases since 12 August. The most recently affected health zones are Biena and Manguredjipa in North Kivu province. As of 26 August, of the 60 affected health zones, 81 new confirmed cases were reported in the last 24 hours from 19 health zones in Ituri, North Kivu, Haut-U&eacute;l&eacute;, and Tshopo provinces. Ituri remains the epicentre of the outbreak, with 4802 confirmed cases reported since the start of the outbreak, including 52 new confirmed cases reported in the last 24 hours, as of 26 August. Nord-Kivu is the second most affected province, with a cumulative number of 775 confirmed cases, including 22 reported in the last 24 hours, as of 26 August. The highest CFR (68%) in this outbreak has been reported from North Kivu province; the reasons for this
    high CFR are under investigation.&nbsp;</p></div><div><p paraid="486817034" paraeid="{becf0032-92eb-445c-931b-d614cd728a42}{58}">The number of individuals requiring contact monitoring has also increased substantially as the outbreak has expanded. As of 26 August, the proportion of contacts followed up in the last 24 hours is at 82.3% (22 091 seen out of 26 850 to follow up). The large number of contacts reflects the scale of potential exposure within affected communities.&nbsp;</p></div><div><p paraid="1834006226" paraeid="{becf0032-92eb-445c-931b-d614cd728a42}{116}">The outbreak is unfolding in a conflict-affected humanitarian context marked by insecurity, armed violence, and large-scale displacement. More than 26 million people face acute food insecurity, and an estimated one million internally displaced people live in Ituri Province alone. Insecurity and displacement disrupt access to health care and essential services, restrict access for response teams, and impede surveillance,
    case investigation and contact follow-up. Overcrowding, limited water, sanitation and hygiene services, and restricted access to healthcare in mining communities, informal settlements and sites for internally displaced people further hinder early detection, infection prevention, and appropriate care. These conditions also make it harder to implement response measures consistently and to reach affected populations.&nbsp;&nbsp;</p></div><div><p paraid="855615797" paraeid="{becf0032-92eb-445c-931b-d614cd728a42}{134}"><strong>Figure 2: Number of confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo, by date of notification, as of 26 August 2026</strong></p><p paraid="855615797" paraeid="{becf0032-92eb-445c-931b-d614cd728a42}{134}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/don_evd_drc_cases_20260828.png?sfvrsn=42aa3102_1" height="527" style="max-width:100%;height:auto;" title="DON_EVD_DRC_cases_20260828"
    width="790" alt="" sf-size="46139" /></p><p paraid="855615797" paraeid="{becf0032-92eb-445c-931b-d614cd728a42}{134}"><strong>Figure 3: Number of deaths among confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo by date of notification, as of 26 August 2026</strong></p><p paraid="855615797" paraeid="{becf0032-92eb-445c-931b-d614cd728a42}{134}"><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/don_evd_drc_deaths_20260828.png?sfvrsn=cd62ec85_1" height="550" style="max-width:100%;height:auto;" title="DON_EVD_DRC_deaths_20260828" width="788" alt="" sf-size="38607" /><strong>&nbsp;</strong>&nbsp;</p><p paraid="855615797" paraeid="{becf0032-92eb-445c-931b-d614cd728a42}{134}">Between 18 May and 28 August 2026, enhanced public health intelligence conducted by WHO identified 76 Ebola-related signals across 23 countries and territories, supporting rapid verification, risk assessment and information sharing
    with national authorities through IHR National Focal Points. Most signals, 92% (70/76), including suspected cases among travellers and health-care workers and reports circulating in public sources, were subsequently ruled out through investigation and laboratory testing. The remaining six were confirmed as Ebola events.&nbsp;</p></div></div>'
