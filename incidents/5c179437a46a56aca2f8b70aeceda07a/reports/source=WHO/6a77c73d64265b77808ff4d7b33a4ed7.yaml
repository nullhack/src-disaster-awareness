  Summary: "Since the last Disease Outbreak News was published on 14 August 2026, the outbreak has spread from 54 to 60 health zones. The number of affected provinces stands at six out of 26 provinces of the country: Bas-Uélé, Haut-Uélé, Ituri, North Kivu, South Kivu, and Tshopo. Six additional health zones reported cases since the last update - Ganga and Viadana health zones in Bas-Uélé province, Biena, Manguredjipa, and Mutwanga in North Kivu, and Tshopo health zone in Tshopo province.  \r\n\r\nAs of 26 August 2026, a total of 5794 confirmed cases, including 2786 deaths, have been reported, corresponding to a crude case fatality ratio (CFR) of 48.1%. These figures demonstrate a substantial increase in the scale and geographic extent of the outbreak over the past three months. The crude case fatality ratio of 48% underscores the severity of the disease and ongoing challenges related to timely case detection, access to and quality of clinical care, and effective interruption of viral transmission.\
    \ Delays in recognizing cases increase the likelihood of onward transmission within households, communities and healthcare facilities.   \r\n\r\nThe outbreak remains a public health emergency of international concern, following the advice of Emergency Committee meeting convened on 18 August. "
