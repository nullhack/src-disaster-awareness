  Epidemiology: <p><div><p paraid="710405995" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{176}">Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the <em>Orthoebolavirus species</em>. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.&nbsp;</p></div><div><p paraid="677574308" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{190}">Human infection is thought to initially occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when infection prevention and control (IPC) measures are inadequate, and during unsafe burial practices involving direct contact with deceased individuals.&nbsp;</p></div><div><p
    paraid="1295580800" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{252}">The incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and sore throat are non-specific, which complicates clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.&nbsp;</p></div><div><p paraid="2006760097" paraeid="{bbfa34a9-75ed-45a4-974c-afadb44908e9}{55}">The CFR from the previous two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.&nbsp;</p></div><div><p paraid="935143066" paraeid="{bbfa34a9-75ed-45a4-974c-afadb44908e9}{103}">Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation. Outbreak control relies on rapid case identification
    and investigation, isolation and care, contact tracing, safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.&nbsp;</p></div><div><p paraid="1482957527" paraeid="{bbfa34a9-75ed-45a4-974c-afadb44908e9}{121}">Since first detected in May 2026, this BVD outbreak has rapidly evolved into a large and geographically expanding epidemic in the Democratic Republic of the Congo, with sustained transmission, high mortality and an increasing risk of further international spread. The current outbreak is the second documented Bundibugyo virus disease outbreak in the country, after the 2012 outbreak, and the largest Ebola disease outbreak ever recorded in the Democratic Republic of the Congo irrespective of virus species. The population at greatest risk of exposure is concentrated in communities living in and moving through the health areas with active transmission.&nbsp;&nbsp;</p></div></p>
  OverrideTitle: ''
  Advice: <div><p paraid="1270548175" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{217}">Based on the currently available information, WHO advises against any restriction of travel to, or trade with, affected countries. WHO continues to closely monitor and, where necessary, verify travel and trade measures in relation to this event.&nbsp;</p></div><div><p paraid="1471374517" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{235}">The updated <a href="https://www.who.int/news/item/24-08-2026-second-meeting-of-the-ihr-emergency-committee-on-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-temporary-recommendations" target="_blank" rel="noreferrer noopener">Temporary Recommendations</a> issued to States Parties on 24 August 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further regional spread and ensure an effective public health response.
    Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.&nbsp;</p></div>
  Assessment: <div><div><p paraid="2105732305" paraeid="{5637edb1-0f70-4e72-9deb-7a0d9cced83e}{80}">On 14 August 2026, WHO reassessed the risk of the outbreak of BVD, incorporating newly available information on the evolving situation. The risk for countries sharing land borders with the Democratic Republic of the Congo was separated from the risk for other countries in the African Region.&nbsp;</p></div><div><p paraid="1383071648" paraeid="{5637edb1-0f70-4e72-9deb-7a0d9cced83e}{126}">The risk in the Democratic Republic of the Congo was assessed as very high, the risk for countries sharing land borders with the Democratic Republic of the Congo was assessed as high, and the risks for the rest of the African region and at the global level was again assessed as low.&nbsp;</p></div><div><p paraid="1761089879" paraeid="{5637edb1-0f70-4e72-9deb-7a0d9cced83e}{180}">A detailed rapid risk assessment is currently ongoing to assess the risk in Kenya and will be reported once available.&nbsp;&nbsp;</p></div><div><p
    paraid="788217968" paraeid="{5637edb1-0f70-4e72-9deb-7a0d9cced83e}{188}">For further information, please see <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo-v4" target="_blank" rel="noreferrer noopener">WHO Rapid Risk Assessment-Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo v4</a>.</p></div><strong></strong></div>
  Overview: '<div><p paraid="1555743484" paraeid="{daed1eef-c9a0-4e82-8a92-d151522b4909}{143}">Since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON618" target="_blank" rel="noreferrer noopener">Disease Outbreak News</a> was published on 25 September 2026, an additional 775 confirmed cases, including 379 confirmed deaths, have been reported in the Democratic Republic of the Congo.&nbsp;&nbsp;</p></div><div><p paraid="974233148" paraeid="{daed1eef-c9a0-4e82-8a92-d151522b4909}{223}">In the most recent 24-hour period, as of 6 October, 62 new confirmed cases were reported, with Ituri accounting for 33 cases and North Kivu for 30. No new cases were reported in Bas-U&eacute;l&eacute;, South Kivu or Sud-Ubangi during that period. Across the preceding seven days, the average number of new cases rose to 72 per day.&nbsp;</p></div><div><p paraid="1357919205" paraeid="{8686e834-c6e6-4be7-9ad7-766357d4700a}{4}">As of 6 October, cumulative confirmed cases have
    reached 8728, including 4205 deaths and 2269 recoveries. The overall crude CFR is 48.2%.&nbsp;&nbsp;</p></div><div><p paraid="1158755919" paraeid="{8686e834-c6e6-4be7-9ad7-766357d4700a}{44}">Confirmed cases have now been identified in 64 health zones across seven provinces. Forty-eight of the 64 affected zones reported at least one new case during the preceding 21 days, while 16 reported no recent cases. Ituri remains the most extensively affected province, with 28 of 36 health zones reporting cases during this outbreak, followed by North Kivu (17/34), Haut-U&eacute;l&eacute; (7/13), Tshopo (7/23), Bas-U&eacute;l&eacute; (3/11), South Kivu (1/34) and Sud-Ubangi (1/16). Alimbongo in North Kivu is the most recently affected health zone and reported four confirmed cases, including two deaths.&nbsp;</p></div><div><p paraid="746795431" paraeid="{8686e834-c6e6-4be7-9ad7-766357d4700a}{64}"><strong>Figure 1. Distribution of cumulative confirmed cases of Bundibugyo virus disease in the Democratic
    Republic of the Congo, as of 6 October 2026</strong></p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/emergencies/disease-outbreak-news/don_evd_drc_map_20261008b7527085-ad42-4993-a689-3e367b6d341f.png?sfvrsn=d0ebda9f_2" height="527" style="max-width:100%;height:auto;" title="DON_EVD_DRC_map_20261008" width="759" alt="EVD DRC map" sf-size="253151" /><p paraid="746795431" paraeid="{8686e834-c6e6-4be7-9ad7-766357d4700a}{64}"><strong></strong><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">Ituri remains the epicentre, with 6480 cumulative confirmed cases and 2989 deaths. North Kivu follows with 1755 confirmed cases and 1013 deaths, and continues to record the highest provincial CFR, at 57.7%. Haut-U&eacute;l&eacute; has reported 364 cases and 153 deaths, while Tshopo has recorded 51 cases and 17 deaths. The less-affected provinces continue to report substantially
    fewer cases, but transmission persists in several of them. The most affected health zones were Beni and Katwa in North Kivu, and Rwampara, Bunia and Mandima in Ituri. The continued occurrence of cases across multiple provinces shows that the outbreak remains geographically active even as intensity varies between health zones.&nbsp;</span></p></div><p><div><p paraid="1231484003" paraeid="{8686e834-c6e6-4be7-9ad7-766357d4700a}{185}">Contact follow-up remains a major operational pressure and has fluctuated below the response target in recent weeks. Coverage was 87.6% on 16 September, briefly above the target of 85%, but fell to 74.7% by 25 September. Although coverage subsequently improved to 82.0% on 27 September, it remained below target and stood at 80.4% in the latest reporting period, with 23 741 of 29 535 contacts reached as of 4 October. The current level therefore reflects a persistent gap in the ability to monitor exposed people consistently throughout the 21-day follow-up period.&nbsp;&nbsp;</p></div><div><p
    paraid="855615797" paraeid="{8686e834-c6e6-4be7-9ad7-766357d4700a}{203}"><strong>Figure 2: Number of confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo, by date of notification, as of 6 October 2026&nbsp;</strong></p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/emergencies/disease-outbreak-news/don_evd_drc_cases_20261008a8cf73c1-2c8f-400d-aca1-afd38b2092d5.png?sfvrsn=caf15ec0_2" height="555" style="max-width:100%;height:auto;" title="DON_EVD_DRC_cases_20261008" width="823" alt="EVD DRC" sf-size="48683" /></div><p><strong>Figure 3: Number of deaths among confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo by date of notification, as of 6 October 2026.&nbsp;</strong></p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/emergencies/disease-outbreak-news/don_evd_drc_deaths_2026100882e14d21-90ae-4bca-b0fd-d8a4aaa024dc.png?sfvrsn=1ee51d56_2" height="567" style="max-width:100%;height:auto;"
    title="DON_EVD_DRC_deaths_20261008" width="815" alt="EVD DRC" sf-size="41871" /><strong style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">Kenya&nbsp;&nbsp;</strong><br /><div><p paraid="1405241295" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{24}">On 6 October 2026, the Ministry of Health of Kenya reported the first laboratory-confirmed imported case of BVD in Kenya.&nbsp;&nbsp;</p></div><div><p paraid="1352828716" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{30}">According to an official statement from the Ministry of Health, the individual is an adult who lived in the Democratic Republic of the Congo. The patient became ill approximately one month ago and was treated in several hospitals while in the Democratic Republic of the Congo. The patient travelled from the Democratic Republic of the Congo to Kampala, Uganda, by road before arriving in Nairobi, Kenya by air on 3 October. It is currently
    unclear if and when he was symptomatic during these travels, but upon arriving ill in Kenya, the patient was transported by a relative directly to Nairobi Hospital and isolated in the facility. A sample collected from the patient on 5 October was positive for BDBV at both the National Virology Reference Laboratory and the Kenya Medical Research Institute Laboratory on the same day. The patient was given supportive treatment but subsequently died.&nbsp;&nbsp;</p></div><div><p paraid="2115137207" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{76}">A safe and dignified burial has been conducted. Public health response actions were immediately initiated. Contact tracing is ongoing, including for the international flight.&nbsp;&nbsp;</p></div><div><p paraid="56691084" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{90}">Given the timelines of the illness, and the one month time from initial symptoms to death, it is presumed he was not initially sick with BVD, which does not usually have
    such a long progression from infection to symptoms and death, but became infected with BVD in a health facility or community while seeking care for another ailment.&nbsp;&nbsp;</p></div><div><p paraid="379448494" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{138}"><strong>The Netherlands&nbsp;&nbsp;</strong></p></div><div><p paraid="35021750" paraeid="{318e963b-1f55-4cb5-ae85-786c893acf77}{144}">On 1 October 2026, the Netherlands reported the medical evacuation of a healthcare worker who tested positive by PCR for BDBV in the Democratic Republic of the Congo where the patient was working on the Ebola disease outbreak response. Following confirmation of the diagnosis, the patient was safely repatriated to the Netherlands under strict medical and infection-prevention procedures, in close coordination with the relevant health authorities in the Democratic Republic of the Congo and the Netherlands. As with previous medically evacuated cases, this case will not be reported as a local case
    of BVD in the Netherlands.&nbsp;</p></div></p>'
