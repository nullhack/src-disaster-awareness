  Response: '<p><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">For detailed information about the ongoing public health response actions by the Ministry of Health, WHO and partners please refer to the latest situation reports published by the WHO Regional Office for Africa: </span><a href="https://www.afro.who.int/health-topics/ebola-disease/outbreak-drc-26" target="_blank" rel="noreferrer noopener" style="text-align:inherit;text-transform:inherit;word-spacing:normal;white-space:inherit;">Ongoing outbreak in the Democratic Republic of the Congo | WHO | Regional Office for Africa</a><span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">&nbsp;&nbsp;</span></p><div><p paraid="2108908504" paraeid="{1b66a25d-dc73-4b2c-a10e-a39ed8cbee4c}{7}">Health authorities in the Democratic Republic of the Congo, in collaboration
    with WHO and partners, are continuing to implement and coordinate extensive public health measures, including disease surveillance, laboratory testing, infection prevention and control, clinical care, community engagement, research, logistics and support for response interventions and essential health services, engaging donors and mobilizing additional resources to address critical funding gaps and sustain response operations across affected and at-risk areas. A substantial scale-up is ongoing across all response pillars to get ahead of the outbreak.&nbsp;</p></div>'
