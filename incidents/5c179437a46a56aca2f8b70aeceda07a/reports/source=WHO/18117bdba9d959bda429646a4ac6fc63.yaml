  Advice: '<p>Based on the currently available information, WHO advises against any restriction of travel to, or trade with, affected countries. WHO continues to closely monitor and, where necessary, verify travel and trade measures in relation to this event.</p><p>The updated <a href="https://www.who.int/news/item/24-08-2026-second-meeting-of-the-ihr-emergency-committee-on-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-temporary-recommendations">Temporary Recommendations</a> issued to States Parties on 24 August 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further regional spread and ensure an effective public health response. Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.</p><p>On 7 August, the WHO Technical Advisory
    Group on candidate vaccine prioritization released a report regarding possible candidate vaccines for Bundibugyo virus disease. The members recommended that Ervebo, the only licensed Ebola vaccine (previously known as ebolavirus Zaire), be prioritized for inclusion in a randomized clinical trial in the context of the ongoing outbreak in the Democratic Republic of the Congo. Following a review of additional evidence on 19 August 2026, the WHO Strategic Advisory Group of Experts on Immunization (SAGE) concluded that available evidence remains insufficient to support the programmatic use of Ervebo for the prevention of BVD, and that its efficacy against BVD in humans remains unknown. WHO therefore recommends that Ervebo be used for BVD only within the context of a research protocol. &nbsp;Ervebo vaccination of healthcare and frontline workers is now underway. As of 6 September 2026, a total of 2007 people had been vaccinated across six health zones in three provinces: Tshopo, Bas-U&eacute;l&eacute;
    and Ituri. </p><p>On 2 July, a clinical trial to find effective treatments against BVD began patient enrollment on 2 July. The trial, known as the PARTNERS trial, is now open in five different clinical management facilities in Ituri province, and has enrolled over 300 people who are confirmed cases. &nbsp;<br /></p>'
  Assessment: <p>On 14 August 2026, WHO reassessed the risk of the outbreak of BVD, incorporating newly available information on the evolving situation. The risk for countries sharing land borders with the Democratic Republic of the Congo was separated from the risk for other countries in the African Region.</p><p>The risk in the Democratic Republic of the Congo was assessed as very high, the risk for countries sharing land borders with the Democratic Republic of the Congo was again assessed as high, and the risks for the rest of the African region and at the global level was again assessed as low.</p><p>For further information, please see <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo-v4">WHO Rapid Risk Assessment-Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo v4</a><strong></strong></p>
  Overview: '<p>Since the publication of the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON616">Disease Outbreak News</a> on 28 August 2026, additional confirmed cases and deaths of Bundibugyo virus disease (BVD) have been reported only in the Democratic Republic of the Congo. </p><p>As of 7 September 2026, a cumulative total of 6778 confirmed cases has been reported: 6757 in the Democratic Republic of the Congo (including two cases diagnosed in the Democratic Republic of the Congo and subsequently treated in Germany), 20 cases in Uganda and one case in France. Overall, 3269 deaths have been reported, including two in Uganda. As of 7 September, at least 1611 patients have recovered, including 1590 in the Democratic Republic of the Congo, 18 in Uganda, two in Germany and one in France. </p><p>The sustained level of transmission in the Democratic Republic of the Congo continues to pose a risk of cross-border spread. Health screening and surveillance activities
    remain operational at airports, ports, and official land border crossings; however, travel through informal crossing routes persists and may facilitate virus exportation, importation, and subsequent transmission. In this context, strengthened cross-border coordination, together with ongoing surveillance and preparedness efforts, remains critical to limiting further regional spread and supporting an effective public health response.</p><p><strong>Figure 1. Distribution of cumulative confirmed cases of Bundibugyo virus disease in the Democratic Republic of the Congo, as of 7 September&nbsp;</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/geographic-distribution-of-confirmed-cases037d941f-5da1-4704-8c1e-1ead73425f9f.jpg?sfvrsn=be8c79f9_4" height="637" style="max-width:100%;height:auto;" title="Geographic distribution of confirmed cases" width="1004" alt="Geographic distribution of confirmed cases" sf-size="129991"
    /></p><p><strong>Democratic Republic of the Congo </strong></p><p>Since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON616">Disease Outbreak News</a> was published on 28 August 2026, an additional 963 confirmed cases, including 481 confirmed deaths, have been reported in the Democratic Republic of the Congo. While part of this increase may be attributable to strengthened surveillance activities, enhanced laboratory testing, improved diagnostic capacity, and reconciliation of previously unreported data, the continued growth in both cases and deaths also reflects sustained community transmission and significant geographic expansion of the outbreak. As of 7 September, the Democratic Republic of the Congo has reported a total of 6757 confirmed cases, including 3267 deaths (CFR 48.3%). A total of 1590 patients have recovered to date.</p><p>Confirmed cases have been reported from 61 health zones (HZ) across six provinces, with 51 HZ from five provinces
    reporting at least one case in the last 21 days. Ituri remains the most affected province, with 28 of its 36 health zones reporting cases, followed by North Kivu (16/34), Tshopo (7/23), Haut-U&eacute;l&eacute; (6/13), Bas-U&eacute;l&eacute; (3/11), and South Kivu (1/34). No new cases have been reported from South Kivu province since 29 May 2026. Kayna HZ in North Kivu province is the most recently affected area. As of 7 September, 71 new confirmed cases had been reported in the preceding 24 hours from 17 health zones located in Ituri, North Kivu, and Haut-U&eacute;l&eacute; provinces. </p><p>Ituri continues to be the epicentre of the outbreak, accounting for 5406 confirmed cases since the start of the outbreak, including 1114 new confirmed cases reported in the previous 21 days, as of 7 September. North Kivu is the second most affected province, with a cumulative number of 1066 confirmed cases, including 453 reported in the last 21 days, as of 7 September. One of the highest CFR (65.4%)
    observed in this outbreak has been reported from North Kivu province; and investigations are ongoing to better understand the factors contributing to this elevated mortality rate.</p><p>The number of individuals requiring follow-up as contact has also risen considerably with the expansion of the outbreak. As of 7 September, 85.3% of identified contacts were successfully monitored during the previous 24 hours with 21 359 contacts seen out of 24 719 requiring follow up. The large volume of contacts under surveillance highlights the extent of potential exposure within affected communities and the substantial demands placed on response operations.</p><p>The outbreak continues to unfold within a complex humanitarian setting characterized by insecurity, armed conflict, and widespread population displacement. More than 26 million people are experiencing acute food insecurity, while approximately one million internally displaced persons reside in Ituri Province alone. Ongoing insecurity and
    displacement limit access to healthcare and essential services, constrain the ability of response teams to reach affected areas, and impede surveillance, case investigation and contact tracing activities. Overcrowding, limited water, sanitation and hygiene services, and restricted access to healthcare in mining communities, informal settlements and sites for internally displaced persons further undermine early case detection, infection prevention and control measures, and the provision of timely care. These conditions also reduce the effectiveness of response interventions and outreach efforts. </p><p><strong>Figure 2: Number of confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo, by date of notification, as of 7 September 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/number-of-confirmed-cases.jpg?sfvrsn=f68b6ab5_4" height="617" style="max-width:100%;height:auto;" title="Number
    of confirmed cases" width="906" alt="Number of confirmed cases" sf-size="94940" /></p><p><strong>Figure 3: Number of deaths among confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo by date of notification, as of 7 September 2026.&nbsp;</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/number-of-deaths.jpg?sfvrsn=c705223c_5" height="636" style="max-width:100%;height:auto;" title="Number of deaths" width="934" alt="Number of deaths" sf-size="93163" /></p>'
