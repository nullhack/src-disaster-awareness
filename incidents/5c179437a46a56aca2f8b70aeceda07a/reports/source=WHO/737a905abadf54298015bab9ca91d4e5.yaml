  Title: Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo, Kenya and Nigeria
  Epidemiology: <p>Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the <em>Orthoebolavirus </em>species. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.</p><p>Human infection is thought to initially occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when infection prevention and control (IPC) measures are inadequate, and during unsafe burial practices involving direct contact with deceased individuals.</p><p>The incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and
    sore throat are non-specific, which complicates clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.</p><p>The CFR from the previous two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.</p><p>Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation. Outbreak control relies on rapid case identification and investigation, isolation and care, contact tracing, safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.</p><p>Since first detected in May 2026, this BVD outbreak has rapidly evolved into a large and geographically expanding epidemic in the Democratic Republic of the Congo, with sustained transmission, high mortality and an increasing risk of further international
    spread. The current outbreak is the second documented Bundibugyo virus disease outbreak in the country, after the 2012 outbreak, and the largest Ebola disease outbreak ever recorded in the Democratic Republic of the Congo irrespective of virus species. The population at greatest risk of exposure is concentrated in communities living in and moving through the health areas with active transmission.&nbsp;</p>
  Advice: <p></p><p>Based on the currently available information, WHO advises against any restriction of travel to, or trade with, affected countries. </p><p>The updated <a href="https://www.who.int/news/item/24-08-2026-second-meeting-of-the-ihr-emergency-committee-on-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-temporary-recommendations">Temporary Recommendations</a> issued to States Parties on 24 August 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further regional spread and ensure an effective public health response. Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.<br /></p> <p></p>
  Assessment: <p>On 14 August 2026, WHO reassessed the risk of the outbreak of BVD. The risk for countries sharing land borders with the Democratic Republic of the Congo was separated from the risk for other countries in the African Region. </p><p>The risk in the Democratic Republic of the Congo was assessed as very high, the risk for countries sharing land borders with the Democratic Republic of the Congo was assessed as high, and the risks for the rest of the African region and at the global level was again assessed as low. For further information, please see <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo-v4">WHO Rapid Risk Assessment-Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo v4</a>.</p><p>In light of the evolving situation and newly available information, the rapid risk assessment is currently being revised to reassess the risk in affected countries,
    the African region and globally. &nbsp;</p>
  Overview: '<p>Since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON619">Disease Outbreak News</a> was published on 8 October 2026, additional confirmed cases and deaths have been reported in the Democratic Republic of the Congo. </p><p>Cases have been reported in five countries since the declaration of the outbreak on 15 May 2026: the Democratic Republic of the Congo, Uganda, France, and more recently, Kenya and Nigeria. Nigeria is the fifth country affected by the ongoing outbreak, highlighting the continued risk of cross-border transmission. &nbsp;</p><p><strong>Democratic Republic of the Congo</strong></p><p>An additional 976 confirmed cases, including 482 confirmed deaths, have been reported in the Democratic Republic of the Congo since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON619">Disease Outbreak News</a> was published. </p><p>In the most recent 24-hour period, as of 20 October, 67 new confirmed
    cases were reported, with Ituri accounting for 37 cases, Nord Kivu for 29, and Tshopo for one case. No new cases were reported in Bas-U&eacute;l&eacute;, Haut-U&eacute;l&eacute;, Nord Ubangi, Sud Kivu or Sud-Ubangi during that period. </p><p>As of 20 October, cumulative confirmed cases have reached 9704, including 4687 deaths and 2595 recoveries. The overall crude CFR is 48.3%. </p><p>Confirmed cases have now been identified in 66 health zones across eight provinces. Fifty of the 66 affected zones reported at least one new case during the preceding 21 days, while 16 reported no recent cases. Mandima, Beni and Bunia have reported the highest number of cases and deaths in the preceding 21 days. Ituri remains the most extensively affected province, with 28 of 36 health zones reporting cases during this outbreak, followed by Nord Kivu (17/34), Haut-U&eacute;l&eacute; (7/13), Tshopo (7/23), Bas-U&eacute;l&eacute; (4/11), Sud Kivu (1/34), Sud-Ubangi (1/16) and Nord-Ubangi (1/11). Nord-Ubangi
    is the most recently affected province reporting three confirmed cases including one death and Dakwa in Haut-U&eacute;l&eacute; is the most recently affected health zone.</p><p><strong>Figure 1. Distribution of cumulative confirmed cases of Bundibugyo virus disease in the Democratic Republic of the Congo, as of 20 October 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/geographic-distribution-of-cases.jpg?sfvrsn=a690e1b8_4" height="607" style="max-width:100%;height:auto;" title="Geographic distribution of cases" width="846" alt="Geographical distribution of confirmed BVD cases in DRC" sf-size="123155" /></p><p>Ituri remains the epicentre, with 7040 cumulative confirmed cases and 3271 deaths. Nord Kivu follows with 2146 confirmed cases and 1199 deaths, and continues to record the highest provincial CFR, at 55.9%. Haut-U&eacute;l&eacute; has reported 421 cases and 183 deaths, while Tshopo has recorded
    76 cases and 27 deaths. The less-affected provinces continue to report substantially fewer cases, but transmission persists in several of them. The continued occurrence of cases across multiple provinces shows that the outbreak remains geographically active even as intensity varies between health zones.</p><p>Out of 30 130 contacts under follow-up across six provinces, 24 017 were seen in the last 24 hours corresponding to a follow-up rate of 79.7%, up from 77.8% the previous day, but remaining below the required threshold of 95.0%. Two provinces were at or above the 95.0% threshold: Bas-U&eacute;l&eacute; (98.9%; 740/748) and Sud-Ubangi (97.3%; 109/112). Four provinces were below the threshold: Haut-U&eacute;l&eacute; (89.9%; 1286/1430), Ituri (92.8% (6382/6879), with 7 contacts becoming suspected cases, Tshopo (83.7%; 1077/12 086) and Nord-Kivu (73.3%; 14 423/19 675), with performance in Nord-Kivu remaining insufficient. Strengthened contact follow-up is required, particularly in provinces
    below the target, to achieve the minimum threshold of 95%.</p><p><strong>Figure 2: Number of confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo, by date of notification, as of 20 October 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/number-of-confirmed-cases3b8ed6e2-f478-49c5-910a-b1f33d743192.jpg?sfvrsn=4a4d748e_3" height="617" style="max-width:100%;height:auto;" title="Number of confirmed cases" width="942" alt="Confirmed cases in DRC" sf-size="101756" /></p><p><strong>Figure 3: Number of deaths among confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo by date of notification, as of 20 October 2026.&nbsp;</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/number-of-deaths-in-drc14d7fc8d-a2ea-46c8-8acc-054e1d80b971.jpg?sfvrsn=1d891eff_3" height="561" style="max-width:100%;height:auto;"
    title="Number of deaths in DRC" width="827" alt="Confirmed deaths in DRC" sf-size="77454" /></p><p><strong>Kenya </strong></p><p>On 6 October 2026, the Ministry of Health of Kenya reported its first laboratory-confirmed imported case of BVD in an adult male who had travelled from the Democratic Republic of the Congo via Uganda by road and arrived in Nairobi on 3 October by air. The case had been ill with other comorbidities for approximately one month and received care at several hospitals in the Democratic Republic of the Congo. He was isolated upon arrival at a hospital in Nairobi. Samples collected on 5 October tested positive for Bundibugyo virus at two national laboratories. Despite supportive care, the patient died on 5 October and was given a safe and dignified burial on 6 October. </p><p>As of 20 October 2026, a total of nine cases, including one death, has been reported in Kenya. &nbsp;All eight secondary cases are epidemiologically linked to the imported index case and associated
    with one cluster. They include four family members and four health and care workers. All new cases were under quarantine at the time of symptom onset and are currently in isolation and receiving appropriate supportive care and treatment at two designated facilities.</p><p>There is currently no evidence of transmission outside this cluster. </p><p>As of 20 October, all of the 135 contacts have been traced and quarantined. </p><p><strong>Figure 4: Number of confirmed Bundibugyo virus disease cases in Kenya, by date of notification, as of 21 October 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/number-of-cases-in-kenya.jpg?sfvrsn=375c4518_4" height="356" style="max-width:100%;height:auto;" title="Number of cases in Kenya" width="685" alt="Number of confirmed cases in Kenya" sf-size="27947" /></p><p><strong>Nigeria</strong></p><p>On 20 October 2026, Nigeria reported one laboratory-confirmed imported
    case of BVD in the Federal Capital Territory Abuja, becoming the fifth country to detect the virus since the outbreak was declared in the Democratic Republic of the Congo on 15 May 2026. The case developed symptoms on 7 October, four days after arriving in Nigeria, sought care in Abuja on 11 October and tested positive for Bundibugyo virus on 20 October 2026. The case is currently in isolation and receiving medical care. </p><p>As of 20 October, 44 contacts had been identified and are being monitored. National authorities, with support from WHO and partners, have intensified contact tracing, case investigation and infection prevention and control measures, including the provision of essential supplies and personal protective equipment for health workers. Investigations are ongoing to establish the likely source of infection and reconstruct the travel and exposure history. WHO has urged countries across the region to strengthen surveillance, laboratory diagnostic capacity, rapid response
    readiness and cross-border preparedness to mitigate the risk of further transmission.</p>'
