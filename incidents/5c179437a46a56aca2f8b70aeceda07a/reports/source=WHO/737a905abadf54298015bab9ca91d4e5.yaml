  Response: '<p>For detailed information about the ongoing public health response actions by the Ministry of Health, WHO and partners please refer to the latest situation reports published by the WHO Regional Office for Africa: <a href="https://www.afro.who.int/health-topics/ebola-disease/outbreak-drc-26">Ongoing outbreak in the Democratic Republic of the Congo | WHO | Regional Office for Africa</a>. </p><p><strong>Democratic Republic of the Congo</strong></p><p>Health authorities in the Democratic Republic of the Congo, in collaboration with WHO and partners, are continuing to implement and coordinate extensive public health measures. These include disease surveillance; laboratory testing; IPC; clinical care; community engagement; research; logistics; and support for response interventions and essential health services, including for the ongoing concurrent humanitarian crisis; engaging donors and mobilizing additional resources to address critical funding gaps and sustain response operations
    across affected and at-risk areas. A substantial scale-up is ongoing across all response pillars to get ahead of the outbreak. </p><p>On 23 October, the&nbsp;<a href="https://cepi.net/first-participant-vaccinated-pivotal-phase-23-bundibugyo-vaccine-trial-drc">TUMAINI</a> vaccine trial was launched, with first participants enrolled in Bunia. TUMAINI is a pivotal Phase 2/3 clinical trial of vaccine candidates against Bundibugyo virus (BDBV). The trial is an important step towards generating the evidence needed to better protect people against BVD and prevent future outbreaks. WHO is actively supporting the trial, along with partners, with technical, scientific and operational expertise.</p><p><strong>Kenya</strong></p><p>Health authorities in Kenya have implemented safe and dignified burial measures following the BVD-related death in Nairobi, while 135 contacts are currently under quarantine. Kenya has maintained a high level of Ebola preparedness since the outbreak began in the Democratic
    Republic of the Congo in May 2026; as of 22 October, 709 093 travellers have been screened, 461 samples tested across five laboratories. Kenyan authorities are also coordinating with counterparts in Uganda and the Democratic Republic of the Congo to establish the individual&rsquo;s movements in Uganda and implement any necessary public health measures.</p><p><strong>Nigeria</strong></p><p>The National and State incident management system has been activated by the Nigeria Centre for Disease Control and Prevention to coordinate response.&nbsp; WHO and partners are working closely with health authorities to strengthen control measures, including case investigation, contact tracing, infection prevention and control, and provision of essential supplies including personal protective equipment for health workers. Nigeria has maintained a high level of alert for BVD since the outbreak began in the Democratic Republic of the Congo in May 2026.&nbsp;</p>'
