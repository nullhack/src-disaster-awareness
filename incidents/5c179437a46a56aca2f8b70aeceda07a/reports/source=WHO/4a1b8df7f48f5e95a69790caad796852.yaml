  Response: '<p>For detailed information about the ongoing public health response actions by the Ministry of Health, WHO and partners please refer to the latest situation reports published by the WHO Regional Office for Africa: <a href="https://www.afro.who.int/health-topics/ebola-disease/outbreak-drc-26">Ongoing outbreak in the Democratic Republic of the Congo | WHO | Regional Office for Africa</a>.. </p><p><strong>Democratic Republic of the Congo</strong></p><p>Health authorities in the Democratic Republic of the Congo, in collaboration with WHO and partners, are continuing to implement and coordinate extensive public health measures. These include disease surveillance; laboratory testing; IPC; clinical care; community engagement; research; logistics; and support for response interventions and essential health services, including for the ongoing concurrent humanitarian crisis; engaging donors and mobilizing additional resources to address critical funding gaps and sustain response operations
    across affected and at-risk areas. A substantial scale-up is ongoing across all response pillars to get ahead of the outbreak. </p><p>On 23 October, the Tumaini platform vaccine trial was launched, with first participants enrolled in Bunia. Tumaini is a pivotal Phase 2/3 clinical trial of vaccine candidates against Bundibugyo virus (BDBV). The trial is an important step towards generating the evidence needed to better protect people against BVD and prevent future outbreaks. Based on available preclinical and early clinical evidence, <a href="https://www.who.int/news/item/04-11-2026-two-new-candidate-vaccines-to-join-ebola-trial-as-treatment-research-advances">expert groups convened by WHO have recommended adding two new BDBV vaccine candidates</a> to the ongoing Tumaini clinical trial in the Democratic Republic of the Congo for further clinical evaluation: ChAdOx1, developed by the University of Oxford with the Serum Institute of India, and Moderna&rsquo;s mRNA-1469. The vaccine candidates
    will enter the trial following national approvals. WHO and partners are actively supporting the trial with technical, scientific and operational expertise.</p><p><strong>Kenya</strong></p><p>Kenya has maintained a high level of Ebola preparedness since the outbreak began in the Democratic Republic of the Congo in May 2026; Screening continues at all designated points of entry and as of 5 November, a cumulative of 760 415 travellers have been screened. Health authorities in Kenya continue to implement public health measures including clinical care for the two remaining patients, including investigational therapeutics under approved protocols, testing at five designated laboratories including two mobile labs at the Ugandan border, and strengthening IPC measures. Psychosocial support is being provided to cases, contacts and health workers. Kenyan authorities continue to coordinate with counterparts in Uganda and the Democratic Republic of the Congo on cross-border surveillance. The 42-day
    countdown to the end of the outbreak will begin once the last patient is discharged. </p><p><strong>Nigeria</strong></p><p>The National and State incident management system has been activated by the Nigeria Centre for Disease Control and Prevention to coordinate response.&nbsp; WHO and partners are working closely with health authorities to strengthen control measures, including case investigation, contact tracing, infection prevention and control, and provision of essential supplies including personal protective equipment for health workers. Nigeria has maintained a high level of alert for BVD since the outbreak began in the Democratic Republic of the Congo in May 2026.&nbsp;</p>'
