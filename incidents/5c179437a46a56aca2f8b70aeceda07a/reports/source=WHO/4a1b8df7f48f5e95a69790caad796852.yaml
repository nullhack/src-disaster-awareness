  Title: Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo, Kenya and Nigeria
  Epidemiology: <p>Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the <em>Orthoebolavirus </em>species. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.</p><p>Human infection is thought to initially occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when infection prevention and control (IPC) measures are inadequate, and during unsafe burial practices involving direct contact with deceased individuals.</p><p>The incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and
    sore throat are non-specific, which complicates clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.</p><p>The CFR from the previous two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.</p><p>Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation. Outbreak control relies on rapid case identification and investigation, isolation and care, contact tracing, safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.</p><p>Since first detected in May 2026, this BVD outbreak has rapidly evolved into a large and geographically expanding epidemic in the Democratic Republic of the Congo, with sustained transmission, high mortality and an increasing risk of further international
    spread. The current outbreak is the second documented Bundibugyo virus disease outbreak in the country, after the 2012 outbreak, and the largest Ebola disease outbreak ever recorded in the Democratic Republic of the Congo irrespective of virus species. The population at greatest risk of exposure is concentrated in communities living in and moving through the health areas with active transmission.&nbsp;</p>
  Advice: <p>Based on the currently available information, WHO advises against any restriction of travel to, or trade with, States Parties experiencing and/or responding to the public health event. The updated <a href="https://www.who.int/news/item/24-08-2026-second-meeting-of-the-ihr-emergency-committee-on-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-temporary-recommendations">Temporary Recommendations</a> issued to States Parties on 24 August 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness to prevent further regional spread and ensure an effective public health response. Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.</p>
  Assessment: <p>On 14 August 2026, WHO reassessed the risk of the outbreak of BVD. The risk for countries sharing land borders with the Democratic Republic of the Congo was separated from the risk for other countries in the African Region. </p><p>The risk in the Democratic Republic of the Congo was assessed as very high, the risk for countries sharing land borders with the Democratic Republic of the Congo was assessed as high, and the risks for the rest of the African region and at the global level was again assessed as low. For further information, please see <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo-v4">WHO Rapid Risk Assessment-Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo v4</a>.</p><p>In light of the evolving situation and newly available information, the rapid risk assessment is currently being revised to reassess the risk in affected countries,
    the African region and globally. &nbsp;</p>
  Overview: '<p><p>Cases have been reported in five countries since the declaration of the outbreak on 15 May 2026: the Democratic Republic of the Congo, France, Kenya, Nigeria, and Uganda. The outbreaks in France and Uganda have been controlled since August while Kenya and Nigeria continue with ongoing response. &nbsp;</p><p><strong>Democratic Republic of the Congo</strong></p><p>An additional 964 confirmed cases, including 511 confirmed deaths, have been reported in the Democratic Republic of the Congo since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON622">Disease Outbreak News</a> was published. </p><p>On 5 November 2026, <a href="https://www.gov.uk/government/news/uk-citizen-returned-from-drc-for-specialist-ebola-care">the United Kingdom of Great Britain and Northern Ireland reported the medical evacuation of one confirmed case</a> (a health and care worker) from the Democratic Republic of the Congo; the case is now receiving medical care
    in London.</p><p>In the last 21-day period, as of 3 November, 1463 new confirmed cases were reported, with Ituri accounting for 710 cases, Nord Kivu for 640 cases, Haut-U&eacute;l&eacute; for 77 cases, Tshopo for 31 cases and Nord-Ubangi for 5 cases. No new cases were reported in Bas-U&eacute;l&eacute;, Sud Kivu or Sud-Ubangi during that period. </p><p>As of 3 November, cumulative confirmed cases have reached 10 668, including 5198 deaths and 2881 recoveries. The overall crude CFR is 48.7%. </p><p>Confirmed cases have now been identified in 67 health zones across eight provinces. Fifty-one of the 67 affected health zones reported at least one new case during the preceding 21 days, while 16 reported no recent cases. Beni, Bunia, and Mandima have reported the highest number of cases and deaths in the preceding 21 days. Ituri remains the most extensively affected province, with 28 of 36 health zones reporting cases during this outbreak, followed by Nord Kivu (17/34), Haut-U&eacute;l&eacute;
    (7/13), Tshopo (7/23), Bas-U&eacute;l&eacute; (4/11), Nord-Ubangi (2/11), Sud Kivu (1/34) and Sud-Ubangi (1/16). Yakoma in Nord-Ubangi province is the most recently affected health zone, reporting three confirmed cases.<br /></p><p><strong>Figure 1. Classification of health zones reporting confirmed cases of Bundibugyo virus disease in the Democratic Republic of the Congo, as of 3 November 2026</strong></p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/figure_1_bvd_health_zone_classification_map.png?sfvrsn=c31e1fa_2" height="1190" style="max-width:100%;height:auto;" title="Figure_1_BVD_health_zone_classification_map" width="1540" alt="Figure 1 6.11.2026" sf-size="267083" /><br /></p><p>While Nord Kivu reported the highest number of cases in the last seven days (232 cases as of 3 November), Ituri remains the most affected province, with 7485 cumulative confirmed cases and 3532 deaths. Nord Kivu follows with 2593 confirmed
    cases and 1422 deaths, and continues to record the highest provincial CFR, at 54.8%. Haut-U&eacute;l&eacute; has reported 470 cases and 208 deaths, while Tshopo has recorded 94 cases and 29 deaths. The less-affected provinces continue to report substantially fewer cases, but transmission persists in several of them. The continued occurrence of cases across multiple provinces shows that the outbreak remains geographically active even as intensity varies between health zones.</p><p>As of 3 November 2026, the average proportion of contacts seen daily over the previous 14-day period is 86%, remaining below the required threshold of 95.0%. Three provinces were at or above the 95.0% threshold for a daily average of the proportion of contacts seen over the previous 14-day period: Bas-Uele (99%, 435/440), Nord-Ubangi (95%, 28/29) and Sud-Ubangi (95%; 62/65). Four provinces were below the threshold: Haut-U&eacute;l&eacute; (85%; 1207/1420), Ituri (91% (9589/10 491), Tshopo (71%; 489/685) and
    Nord-Kivu (82%; 11 190/13 716). Strengthened contact follow-up is required, particularly in provinces below the target, to achieve the minimum threshold of 95.0%.</p><p>&nbsp;</p><p><strong>Figure 2: Number of confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo, by date of notification, as of 3 November 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/figure_2_bvd_confirmed_cases_epidemic_curve.png?sfvrsn=3239f036_2" height="998" style="max-width:100%;height:auto;" title="Figure_2_BVD_confirmed_cases_epidemic_curve" width="1300" alt="Figure 2 6 November 2026" sf-size="69814" /></p><p><strong>Figure 3: Number of deaths among confirmed Bundibugyo virus disease cases in the Democratic Republic of the Congo by date of notification, as of 3 November 2026&nbsp;</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/figure_3_bvd_confirmed_deaths_epidemic_curve.png?sfvrsn=bbea1523_2"
    height="998" style="max-width:100%;height:auto;" title="Figure_3_BVD_confirmed_deaths_epidemic_curve" width="1300" alt="Figure 3. 6 November 2026" sf-size="64043" /></p><p><strong>Kenya </strong></p><p>As of 3 November 2026, the cumulative confirmed cases reported in Kenya remains at nine. Since the last Disease Outbreak News, there has been one additional death, resulting in a total of two deaths reported in Kenya and a crude CFR of 22.2%. &nbsp;All eight secondary cases are epidemiologically linked to the imported index case and associated with one cluster (four family members of the index case and four health and care workers). &nbsp;As of 3 November, of the nine cases reported. five have recovered (all five were discharged on 3 November after meeting discharge criteria) while two cases are still receiving treatment.&nbsp; </p><p>There is currently no evidence of transmission outside this cluster and there have been no new confirmed cases since 19 October 2026.&nbsp; Additionally,
    all eight secondary cases were already under quarantine as known contacts when they developed symptoms. &nbsp;</p><p>As of 3 November, of the 135 cumulative contacts identified since the first confirmed case, eight subsequently became confirmed cases and nine contacts left Kenya (relevant National IHR Focal Points were notified). Of the remaining 118 contacts, 66 have completed the 21-day follow-up and 52 remain under monitoring, with follow-up expected to end on 11 November 2026. </p><p><strong>Figure 4: Number of confirmed Bundibugyo virus disease cases in Kenya, by date of notification, as of 3 November 2026</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/figure-4.png?sfvrsn=7c5d0826_2" height="1265" style="max-width:100%;height:auto;" title="Figure 4" width="2317" alt="Figure 4 6 November 2026" sf-size="62728" /></p><p><strong>Nigeria</strong></p><p>On 20 October 2026, Nigeria reported one laboratory-confirmed
    imported case of BVD in the Federal Capital Territory Abuja. On 26 October 2026, <a href="https://www.admin.ch/en/newnsb/hKpTLMT8HgXi">Switzerland reported the medical evacuation of the case</a>, who remains in isolation and receiving medical care in Geneva, Switzerland. </p><p>As of 3 November, a cumulative of 62 contacts had been identified in Nigeria for follow up. Six contacts have successfully completed the 21-day follow-up period. National authorities, with support from WHO and partners, have intensified contact tracing, case investigation and infection prevention and control measures, including the provision of essential supplies and personal protective equipment for health workers. Investigations are ongoing to establish the likely source of infection and reconstruct the travel and exposure history. WHO has urged countries across the region to strengthen surveillance, laboratory diagnostic capacity, rapid response readiness and cross-border preparedness to mitigate the risk of
    further transmission.</p>'
