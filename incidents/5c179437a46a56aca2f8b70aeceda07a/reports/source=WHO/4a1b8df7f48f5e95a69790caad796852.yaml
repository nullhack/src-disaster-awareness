  Summary: "Since the publication of the previous Disease Outbreak News on 23 October 2026, the Bundibugyo virus disease (BVD) outbreak has expanded geographically in the Democratic Republic of the Congo. \r\n\r\nWhile some areas have seen a slight decline in cases, sustained, high-level transmission continues overall in the Democratic Republic of the Congo. As of 3 November 2026, a total of 10 668 confirmed cases, including 5198 deaths (crude case fatality ratio: 48.7%), have been reported across 67 health zones in eight provinces, with active transmission ongoing in 51 health zones.  The high proportion of deaths occurring in communities, especially among young children, continues to highlight challenges in early case detection and timely access to appropriate care. Of the 512 deaths reported since 21 October, 335 occurred in communities and 177 in treatment centres.\r\n\r\nSince the last Disease Outbreak News, no new cases have been reported from Kenya or Nigeria. However, the high-level\
    \ transmission in the Democratic Republic of the Congo indicates a continued need for readiness in the region, including cross-border surveillance, points of entry monitoring, timely case detection and coordinated preparedness and response measures. No new country has reported cases since the last Disease Outbreak News was published, however, two countries have medically evacuated confirmed cases among citizens: Switzerland and the United Kingdom of Great Britain and Northern Ireland.\r\n\r\nBased on the currently available information, WHO advises against any restriction of travel to, or trade with, States Parties experiencing and/or responding to the public health event. \r\n"
