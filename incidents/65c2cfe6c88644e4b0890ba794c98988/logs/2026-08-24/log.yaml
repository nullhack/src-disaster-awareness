log_date: '2026-08-24'
summary: International firefighting efforts continue, with a Russian Ilyushin Il-76 aircraft performing 19 flights and dropping 798 tons of water over four days to extinguish major hotspots. The European Union has also sent helicopters and firefighters under its Civil Protection Mechanism to help battle the wildfire in the Deliblato Sands nature reserve. Local fire crews remain engaged in fighting the blaze, which has prompted evacuations in other parts of Europe.
