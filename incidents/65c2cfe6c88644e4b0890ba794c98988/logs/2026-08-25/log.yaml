log_date: '2026-08-25'
summary: 'New international firefighting support has been deployed: 69 Romanian firefighters with 15 technical vehicles and a Black Hawk helicopter arrived over the weekend of August 22-23. The European Union continues to send urgent support via its civil protection mechanism to fight fires devastating the Deliblato Sands Special Nature Reserve. EU and Russian aircraft remain active in assisting Serbian firefighting efforts.'
