log_date: '2026-08-23'
summary: International assistance has been mobilized to combat wildfires in Serbia, with the European Union sending four helicopters and two firefighting teams under its Civil Protection Mechanism. Reports also indicate that a Russian Ilyushin Il-76 aircraft was deployed, and that EU aid arrived only after Russia's offer. These efforts are focused on the most affected areas, including the sandbar region likely linked to this incident.
