title: 'Europe Battles Extreme Weather: France, Spain, Serbia & Bosnia Hit By Wildfires, Floods And Storms'
body: Extreme weather is gripping multiple European nations as severe wildfires, flash floods and powerful storms force thousands of people to evacuate. France is battling a major wildfire across the Cap Ferret Peninsula in the southwest, where extreme summer heat and months of drought have created dangerous fire conditions. Authorities ordered the evacuation of the popular tourism hotspot as flames threatened homes and the peninsula’s main escape route. More than 10,000 hectares of forest have reportedly been affected, while around 63,000 people, including large numbers of tourists, were forced to leave the area. Boats and emergency teams were deployed as authorities worked to protect residents and visitors. Spain is also facing a contrasting weather crisis, with intense wildfires occurring alongside torrential rainfall and flash flooding. Heavy rains disrupted road and rail transport and injured more than 11 people.
