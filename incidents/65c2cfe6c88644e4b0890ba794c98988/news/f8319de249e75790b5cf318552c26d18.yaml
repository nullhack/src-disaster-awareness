title: In Serbia's Scorched Dunes, Foresters Plan for an Even Hotter Future
body: BELGRADE, Sept 1 (Reuters) - More than a month after flames tore through Serbia's Deliblatska Pescara reserve, foresters are facing tough choices as they work on plans to restore its unique dunes and woodlands and give them a better chance against future wildfires.
