title: EU sends urgent support to Serbia as wildfires intensify
body: The European Union has sent urgent support to Serbia through its civil protection mechanism to help the Balkan state fight severe wildfires that have been devastating the Deliblato Sands Special Nature Reserve in the northern province of Vojvodina, the Directorate-General for European Civil Protection and Humanitarian Aid Operations (ECHO) said on Monday.
