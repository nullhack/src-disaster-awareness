title: 'Fire spreading toward Trebinje: One front moving toward urban areas; Homes threatened again'
body: Fight against wildfires in the areas of Trebinje and Nevesinje is still ongoing, with fires threatening homes in some locations approaching urban areas. Firefighters battling the blaze in inaccessible terrain will be assisted by a helicopter from Bosnian Army.
