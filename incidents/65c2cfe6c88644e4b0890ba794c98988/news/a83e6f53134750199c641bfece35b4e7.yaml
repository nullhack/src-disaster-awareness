title: In Serbia's scorched dunes, foresters plan for an even hotter future
body: By Aleksandar Vasovic BELGRADE, Sept 1 (Reuters) - More than a month after flames tore through Serbia's Deliblatska Pescara reserve, foresters are facing tough choices as they work on plans to restore its unique dunes and woodlands and give them a better chance against future wildfires.
