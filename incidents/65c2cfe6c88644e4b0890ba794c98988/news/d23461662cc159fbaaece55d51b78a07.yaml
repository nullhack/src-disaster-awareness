title: 'Planes, helicopters, crews: How Europe is scrambling to contain a record wildfire season'
body: Wildfires are stretching firefighting capacity across Europe, forcing countries to move aircraft, helicopters and crews across borders as several blazes burn at the same time. Serbia is using both Russian and EU assistance, while crews in Ankara brought a large wooded-area fire under control early Monday after an eight-hour operation.
