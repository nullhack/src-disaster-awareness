title: 快訊／萬那杜規模6.6地震 深度10公里
body: ▲萬那杜發生規模6.6地震。（圖／翻攝自USGS） 記者詹雅婷／綜合報導 太平洋島國萬那杜8日發生規模6.6地震，根據美國地質調查局（USGS）測得數據，此次地震震源深度僅10公里。 數據顯示，這起地震發生在萬那杜諾索普（Norsup）東北方約105公里處。
