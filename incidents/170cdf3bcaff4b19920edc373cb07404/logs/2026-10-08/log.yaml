log_date: '2026-10-08'
summary: A strong earthquake struck Vanuatu on October 8, 2026, with the U.S. Geological Survey reporting a magnitude of 6.6 (later also cited as 6.3 by other sources) and a shallow depth of 10 km. The epicenter was located about 105–110 km northeast of Norsup (or east of Luganville) in the Penama region. Several news outlets confirmed the event, though slight variations in reported magnitude appeared.
