title: Trump says Ukraine should get a new president as he blames Zelenskyy for US diesel prices
body: Russian strikes killed at least 15 people in Ukraine, a day after President Trump announced a deal to buy Russian diesel that Kyiv warned would help bankroll Moscow’s war in Ukraine.
