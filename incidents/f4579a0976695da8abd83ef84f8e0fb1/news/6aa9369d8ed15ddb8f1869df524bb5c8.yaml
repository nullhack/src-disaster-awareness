title: Three more die of dengue, 580 hospitalised in 24hrs
body: Three more deaths were reported from dengue in the past 24 hours till Monday morning, raising the number of fatalities from the Aedes mosquito-borne disease in Bangladesh to 59 this year. In the 24-hour span, 580 more patients were hospitalised with viral fever, raising the total caseload to 16,684 in 2026.
