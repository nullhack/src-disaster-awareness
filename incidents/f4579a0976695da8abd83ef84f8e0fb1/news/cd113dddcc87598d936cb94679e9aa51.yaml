title: 'एटा में संचारी रोग नियंत्रण के लिए निकली जागरूकता रैली: डॉक्टरों ने डेंगू, मलेरिया से बचाव के तरीके बताए, 31 अक्टूबर तक चलेगा अभियान - Sakit(Etah) News'
body: Etah health department launches awareness rally for dengue malaria prevention. Latest Updates. एटा के सामुदायिक स्वास्थ्य केंद्र सकीट पर संचारी रोग नियंत्रण अभियान के तहत जागरूकता रैली निकाली गई। डॉ. शिव कुमार राजपूत ने बताया कि बरसात के बाद डेंगू, मलेरिया और चिकनगुनिया जैसी मच्छरजनित बीमारियों का खतरा बढ़ जाता है।
