title: 'विशिष्ट कुंड डूडा कॉलोनी में सड़क पर जमा गंदा पानी: स्थानीय लोगों को आवागमन में परेशानी, डेंगू-मलेरिया का खतरा बढ़ा - Duda Colony News'
body: Ayodhya Duda Colony water logging, drainage issues, dengue, malaria risk. Follow Dainik Bhaskar Latest Updates. अयोध्या की विशिष्ट कुंड स्थित डूडा कॉलोनी में सड़क पर गंदा पानी और कीचड़ जमा है। इससे लोगों को काफी परेशानी हो रही है। लंबे समय से पानी जमा होने से मच्छरों का प्रकोप बढ़ गया है।
