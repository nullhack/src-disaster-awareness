title: 'भाईपुर-बहादुरपुर चौराहे पर जमा गंदा पानी: राहगीरों को परेशानी, डेंगू-मलेरिया जैसी बीमारियों का खतरा बढ़ा, लोगों ने की सफाई की मांग - Lathiya SAHIJANI(Chunar) News'
body: Bhaipur Bahadurpur crossing water logging dengue malaria health risk, follow Dainik Bhaskar latest updates. भाईपुर-बहादुरपुर चौराहे पर सड़क किनारे गंदगी और सीवर का गंदा पानी बहने से राहगीरों और स्थानीय लोगों को परेशानी हो रही है। लंबे समय से जमा इस गंदे पानी के कारण आसपास बदबू आ रही है और मच्छरों की संख्या बढ़ गई है।
