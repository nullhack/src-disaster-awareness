title: Perubahan Cuaca Ekstrem Picu Peningkatan Risiko Dengue
body: Perubahan iklim bukan hanya berdampak pada suhu bumi dan lingkungan, tetapi juga berpengaruh terhadap kesehatan manusia. Salah satu ancaman kesehatan yang perlu diwaspadai adalah penyakit dengue atau demam berdarah dengue (DBD).
