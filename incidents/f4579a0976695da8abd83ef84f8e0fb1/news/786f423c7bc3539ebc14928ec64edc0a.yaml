title: 'अयोध्या में गिरिजा कुंड मार्ग पर नाले से गंदगी: डेंगू-मलेरिया का खतरा, घरों में घुस रहा पानी, पंप भी बेअसर - Janaura News'
body: Ayodhya Janoura Ward water logging drainage issue health risk Follow Dainik Bhaskar Latest Updates. अयोध्या के जनौरा वार्ड में गिरिजा कुंड से एचसीजे विद्यालय को जोड़ने वाले रास्ते पर बना नाला गंदगी और जलभराव से लोगों को परेशान कर रहा है। स्थानीय लोगों का कहना है कि नाले में पानी जमा रहने से डेंगू-मलेरिया जैसी बीमारियों का खतरा है।
