title: 'कयासपुर गांव में कूड़े के ढेर, बीमारी फैलने का खतरा: ग्रामीणों ने शिकायत की, नालियों में पानी भरने से मच्छर बढ़े; डेंगू का खतरा - Baira Gadhiwa(Fatehpur Sadar) News'
body: Fatehpur Kayaspur village hygiene crisis drainage water logging mosquito breeding health alert Latest Updates. फतेहपुर के बेरागड़ीवा न्याय पंचायत के कयासपुर गांव में सफाई व्यवस्था बहुत खराब हो गई है। गांव में जगह-जगह कूड़े के ढेर लगे हैं, जिससे पूरे इलाके में बदबू फैल रही है।
