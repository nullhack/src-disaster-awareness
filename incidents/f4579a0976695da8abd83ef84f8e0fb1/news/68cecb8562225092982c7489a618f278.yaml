title: 'मैगलगंज के हरनहा गांव में दूषित पानी भरा: मच्छरों का प्रकोप बढ़ा, डेंगू-मलेरिया का खतरा; प्रधान ने जल्द सफाई का दिया आश्वासन - Maigal Ganj(MOHAMMDI) News'
body: Haranaha village Magalganj water logging crisis leads to dengue malaria outbreak risk. Latest Updates. मैगलगंज के हरनहा गांव में लंबे समय से दूषित पानी भरा हुआ है। इससे ग्रामीणों को काफी परेशानी हो रही है। जलभराव और गंदगी के कारण मच्छरों का प्रकोप बढ़ गया है, जिससे डेंगू और मलेरिया जैसी बीमारियों का खतरा बना हुआ है।
