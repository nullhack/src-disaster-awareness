title: 'गढ़ीवा में बच्चों को डेंगू से बचाव की होम्योपैथिक दवा: फतेहपुर में स्वास्थ्य जागरूकता अभियान चलाकर बच्चों को साफ-सफाई और संक्रामक बीमारियों से बचाव के तरीके बताए गए - Sangaon(Fatehpur Sadar) News'
body: Fatehpur Gadhiwa village dengue prevention awareness campaign homeopathy medicine distribution health camp updates. Follow Dainik Bhaskar Latest Updates. फतेहपुर के गढ़ीवा गांव में डेंगू से बचाव और जागरूकता के लिए एक अभियान चलाया गया। इस दौरान इंडियन रेडक्रॉस सोसाइटी उत्तर प्रदेश के चेयरमैन डॉ. अनुराग श्रीवास्तव ने 53 बच्चों को मुफ्त होम्योपैथिक दवा बांटी।
