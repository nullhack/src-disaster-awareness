title: 'कटरा नील में चोक नालियां बनीं मुसीबत: सड़क पर जमा गंदा पानी, कूड़ा और गंदगी से जलनिकासी प्रभावित - Katra Neel News'
body: Agra Katra Neel waterlogging causes dengue malaria health risks. Follow Dainik Bhaskar Latest Updates. आगरा के नाई की मंडी क्षेत्र स्थित कटरा नील में चोक नालियों के कारण स्थानीय लोग परेशान हैं। नालियों में कूड़ा और गंदगी जमा होने से पानी की निकासी प्रभावित हो रही है।
