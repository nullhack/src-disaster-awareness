title: Dengue death toll rises to 50 this year
body: The death count from dengue has reached 50 in 2026, with three more fatalities reported in the past 24 hours till Wednesday morning. In the 24-hour span, 534 more patients were hospitalised with viral fever, raising the total caseload to 14,690 this year.
