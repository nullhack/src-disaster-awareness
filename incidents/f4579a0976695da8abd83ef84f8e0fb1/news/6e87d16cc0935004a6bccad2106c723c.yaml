title: Dengue cases have fallen by about 70 percent in the parts of Singapore where the government releases mosquitoes on purpose. It breeds 5 million males a week, none of which bite, and the females they mate with lay eggs that never hatch.
body: A radical gamble to fight dengue—releasing millions of sterile male mosquitoes—has upended everything scientists thought they knew about disease control.
