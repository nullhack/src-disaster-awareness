title: 'वजीरगंज के सोहन नगर में जगह-जगह गंदगी का अंबार: कई दिनों से नहीं हुई सफाई, डेंगू के खतरे के बीच लोगों ने की जल्द एक्शन की मांग - Wazirganj(Bisauli) News'
body: Wazirganj Sohan Nagar dengue risk cleanliness protest updates. Follow Dainik Bhaskar Latest Updates. बदायूं के वजीरगंज नगर पंचायत के वार्ड नंबर 13 सोहन नगर में हर तरफ गंदगी फैली हुई है। स्थानीय लोगों का कहना है कि लंबे समय से यहां सफाई अभियान नहीं चला है, जिससे मोहल्ले में कूड़े का ढेर लगा है।
