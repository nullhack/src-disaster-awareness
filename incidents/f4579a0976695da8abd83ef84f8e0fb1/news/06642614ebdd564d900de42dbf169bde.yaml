title: Three more die of dengue, 458 hospitalised in 24hrs
body: Three more deaths were reported from dengue in the past 24 hours till Sunday morning, raising the number of fatalities from the Aedes mosquito-borne disease in Bangladesh to 43 this year. In the 24-hour span, 458 more patients were hospitalised with viral fever, raising the total caseload to 13,098 in 2026.
