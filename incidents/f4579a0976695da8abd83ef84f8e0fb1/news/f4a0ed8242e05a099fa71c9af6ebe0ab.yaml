title: 'कुशीनगर के मठसुरजगीर में गंदगी से मच्छरों का प्रकोप बढ़ा: ग्रामीणों ने फॉगिंग और दवा छिड़काव की मांग की, बीमारियों का खतरा - Rampur(Hata) News'
body: Kushinagar Mathsurjagir mosquito infestation health risk, local residents demand immediate municipal fogging and pest control. Follow Dainik Bhaskar for latest updates. कुशीनगर जिले के सुकरौली विकास खंड की ग्राम पंचायत मठसुरजगीर के करजहाँ घाट पर मच्छरों का प्रकोप बढ़ गया है। गांव में चारों तरफ मच्छर पनप रहे हैं, जिससे ग्रामीणों का रहना मुश्किल हो गया है।
