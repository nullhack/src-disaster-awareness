body: Kanpur Kazikheda garbage piles health risk dengue outbreak concerns Latest Updates. Follow Dainik Bhaskar. कानपुर के हरजिंदर नगर वार्ड के काजीखेड़ा इलाके में गंदगी का अंबार लगा हुआ है। यहां सफाई व्यवस्था पूरी तरह से ठप पड़ी है, जिससे स्थानीय लोग काफी परेशान हैं।
