title: 'Dengue Fever: தமிழகத்தில் டெங்கு பாதிப்பு குறைகிறது.. அமைச்சர் அருண்ராஜ் சொன்ன முக்கிய தகவல்!'
body: 'Dengue Fever: தமிழகத்தில் டெங்கு பாதிப்பு கடந்த ஆண்டுகளை ஒப்பிடும்போது குறைந்து வருவதாக அமைச்சர் அருண்ராஜ் தெரிவித்துள்ளார். இதுகுறித்து அவர் சொன்ன தகவல்களை பார்க்கலாம்., செய்தி News, Times Now Tamil'
