body: Dengue fever outbreak Mahewa Ludhiyani village health crisis medical negligence reports. Follow Dainik Bhaskar Latest Updates. महेवा विकासखंड की ग्राम पंचायत लुधियानी में डेंगू और बुखार का प्रकोप है। कई घरों में लोग बीमार हैं, जिससे चारपाइयां बिछी हैं।
