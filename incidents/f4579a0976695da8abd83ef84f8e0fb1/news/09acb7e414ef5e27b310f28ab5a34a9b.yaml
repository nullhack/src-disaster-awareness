title: 'हरियाणा में महीने में दोगुने से ज्यादा हुए डेंगू केस: आंकडा पहुंचा 774, लापरवाही पर 53 हजार से ज्यादा को नोटिस हरियाणा में - Haryana News'
body: Rising dengue and malaria cases in Haryana, strict health guidelines and notices issued. Follow Dainik Bhaskar Latest Updates. राज्य में नगरपालिका उप-नियम (वीबीडी पर नियंत्रण)-2010 लागू हैं, जिसके तहत मच्छर पाए जाने पर 53051 लोगों को नोटिस जारी किए हैं। स्वास्थ्य विभाग द्वारा प्राप्त आधाकारिक जानकारी अनुसार 1 लाख 12 हजार घरों में मच्छर का लारवा भी मिला है जो स्पष्ट तौर पर लोगों की लापरवाही को दर्शाता है।
