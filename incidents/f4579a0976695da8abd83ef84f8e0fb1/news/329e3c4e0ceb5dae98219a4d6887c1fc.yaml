title: 'प्रयागराज के होलागढ़ में ग्राम प्रधान ने कराया दवा छिड़काव: डेंगू व संक्रामक बीमारियों से बचाव के लिए की गई पहल - Barai Harakh(Soraon) News'
body: Prayagraj Holagarh Sarai Madansingh village dengue malaria prevention anti-larva spray drive. Follow Dainik Bhaskar Latest Updates. यह पहल बरसात के मौसम में डेंगू और अन्य संक्रामक बीमारियों के खतरे को देखते हुए की गई है। गांव के हर मोहल्ले, नालों, जलभराव वाले स्थानों, घरों के आसपास और सामुदायिक क्षेत्रों को कवर किया गया।
