title: Dengue‑carrying mosquitoes expand their reach into new territories—including Florida
body: The Tampa Bay Times reported the death of an older woman on Sept. 8, 2026. Her family says local doctors attributed her death to dengue fever, although the Florida Department of Health has not yet confirmed it.
