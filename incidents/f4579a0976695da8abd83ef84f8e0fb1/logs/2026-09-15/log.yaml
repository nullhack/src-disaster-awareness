log_date: '2026-09-15'
summary: |-
  In Bangladesh, eight additional dengue-related deaths were reported in the past 24 hours, continuing the country's severe outbreak. Separately, Sri Lanka launched a special dengue eradication week across 62 Medical Officer of Health divisions to combat the disease.
  In Bangladesh, dengue claimed seven more lives and 1,593 new hospitalizations in the past 24 hours, raising the total caseload to 55,163 for 2026. Sri Lankan health officials warned that dengue could resurge in coming months due to expected rainfall, urging vigilance. In Florida, a suspected dengue-related death of an elderly woman was reported (unconfirmed by health authorities), while dengue-carrying mosquitoes continue expanding into new territories.
