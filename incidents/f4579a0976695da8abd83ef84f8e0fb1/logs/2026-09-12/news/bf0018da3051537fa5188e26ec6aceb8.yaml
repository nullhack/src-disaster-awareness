body: Pasaipur Keshampur Bhagyangar village road water logging health risk dengue malaria latest updates. Follow Dainik Bhaskar. भाग्यनगर ब्लॉक की ग्राम पंचायत पसईपुर केशमपुर में सड़क पर गंदा पानी जमा होने से ग्रामीणों को काफी परेशानी हो रही है। ग्रामीणों ने बताया कि लंबे समय से पानी जमा होने के कारण मच्छर और मक्खियां बढ़ रहे हैं।
