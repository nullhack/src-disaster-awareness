log_date: '2026-09-12'
summary: In Tampa, Florida, an 80-year-old woman died from dengue fever, as confirmed by her family. In Uttar Pradesh, India, waterlogged roads in Pasaipur Keshampur village are raising concerns about dengue and malaria risks. In Haryana, India, another dengue patient was found in Mahendragarh-Narnaul district, increasing the year's total to 11 cases.
