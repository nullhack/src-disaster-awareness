title: Hillsborough, Pasco and Pinellas counties declare states of emergency to battle dengue fever
body: Hillsborough added 36 cases, per the latest state report on mosquito-borne illnesses, while Pasco and Pinellas officials went into a proactive mode while their counts remain low.
