title: 'रायबरेली के मझिलहा स्कूल में बच्चों को किया जागरूक: बच्चों को बताए डेंगू-मलेरिया से बचाव के तरीके - Dih (Raebareli) News'
body: Raebareli Majilha school students learn dengue malaria prevention tips. Follow Dainik Bhaskar Latest Updates. रायबरेली जिले के डीह ब्लॉक के प्राथमिक विद्यालय मझिलहा में शुक्रवार को संचारी रोग नियंत्रण अभियान के तहत एक जागरूकता कार्यक्रम और बाल मेले का आयोजन किया गया। विद्यालय के शिक्षकों विजय मिश्र, ज्योति सिंह, राजकुमारी यादव और अंजना कुमारी ने बच्चों को डेंगू, मलेरिया और दिमागी बुखार जैसे संचारी रोगों से बचाव के तरीके बताए।
