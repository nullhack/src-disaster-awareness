log_date: '2026-10-07'
summary: Hillsborough County, Florida, is preparing for a commissioner update on its dengue response, which has cost about $850,000 in emergency purchases. In India, waterlogging in Ayodhya’s Duda Colony is raising concerns about increased dengue and malaria risk, while a health department campaign in Mirzapur is conducting door-to-door awareness on dengue and other communicable diseases.
