title: 'मीरजापुर में संचारी रोग से बचाव को घर-घर अभियान चला: चील्ह के डिंगूरपट्टी में स्वास्थ्य टीम ने दी डेंगू-मलेरिया से बचने की जानकारी - Balliparwa(Mirzapur) News'
body: Health department awareness campaign against communicable diseases in Mirzapur villages. Follow Dainik Bhaskar Latest Updates. चील्ह, मीरजापुर के डिंगूरपट्टी गांव में आज बुद्धवार को संचारी रोग नियंत्रण अभियान चलाया गया। स्वास्थ्य विभाग की टीम ने आंगनवाड़ी और आशा कार्यकर्ताओं के साथ मिलकर घर-घर जाकर लोगों से संपर्क किया।
