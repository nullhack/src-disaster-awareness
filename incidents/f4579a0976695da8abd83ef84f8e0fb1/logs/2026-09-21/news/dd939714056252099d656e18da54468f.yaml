title: தமிழகத்தில் டெங்கு காய்ச்சல் நிலவரம் என்ன? சுகாதாரத் துறை அமைச்சர் அளித்த அப்டேட்
body: நிலவேம்பு கசாயம், பப்பாளி இலைச்சாறு பிளேட்லேட் அதிகமாக்கும் என்ற கருத்து உள்ளது. அதுகுறித்து அறிவியல் ஆதாரம் கேட்டுள்ளோம் என்று அமைச்சர் அருண்ராஜ் தெரிவித்தார்.
