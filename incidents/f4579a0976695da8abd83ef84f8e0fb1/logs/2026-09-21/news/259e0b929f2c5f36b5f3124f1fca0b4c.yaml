body: Kushinagar Medical College hospital dengue ward infrastructure issues, lack of mosquito nets, hygiene concerns. Follow Dainik Bhaskar Latest Updates. कुशीनगर मेडिकल कॉलेज हॉस्पिटल के डेंगू वार्ड में मूलभूत सुविधाओं की कमी का मामला सामने आया है। यहां भर्ती दो मरीजों के तीमारदारों ने वार्ड की व्यवस्थाओं को लेकर नाराजगी जताई है।
