summary: Bangladesh reported 7 new dengue deaths and 1,373 hospitalizations in a 24-hour period, raising the total caseload to 116,990. Another report detailed 7 deaths and 1,872 hospitalizations for the 24 hours ending October 17, and a subsequent report noted 4 additional deaths and 1,512 hospitalizations for the 24 hours ending October 22.
