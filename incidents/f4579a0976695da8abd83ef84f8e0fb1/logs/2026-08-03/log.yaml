log_date: '2026-08-03'
summary: In Bangladesh, DENV-3 has become the dominant serotype this year, with doctors reporting an increase in expanded dengue syndrome, dengue shock syndrome, and prolonged fever, emphasizing the need for early diagnosis and stronger mosquito control. The country reported one death and 153 new hospitalizations, followed by two additional deaths and 423 hospitalizations in recent 24-hour periods.
