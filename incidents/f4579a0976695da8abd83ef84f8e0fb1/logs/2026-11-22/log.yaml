log_date: '2026-11-22'
summary: Bangladesh reported additional dengue deaths and hospitalizations, with one report citing three deaths and 1,674 new hospitalizations and another citing two deaths and 1,615 new hospitalizations, with toll figures of 516 and 510 respectively. A Dhaka Tribune report said Bangladesh has a national dengue plan but implementation is lagging in almost every area. Separately, scientists reported strong new evidence that specially bred mosquitoes can help fend off dengue in Brazil, and an Indonesian report warned that extreme weather is increasing dengue risk.
