title: Dengue Vaccine in India, First Shot Expected in 2027 - Times Bull
body: Infection with one serotype does not confer immunity against the others, meaning individuals can be infected multiple times. An initial infection may be mild or unnoticed, but subsequent infection with a different serotype increases the risk of severe illness in some cases.
