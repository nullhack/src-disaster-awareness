log_date: '2026-08-27'
summary: Bangladesh reported three additional dengue deaths and 907 new cases in a 24-hour period, followed by another 550 cases, raising the 2026 death toll to 88. In India, Haryana recorded 147 dengue cases with Gurgaon and Jhajjar most affected, while Delhi faces a data discrepancy between health minister and MCD figures. Nepal's floods are heightening the risk of mosquito-borne diseases, including dengue.
