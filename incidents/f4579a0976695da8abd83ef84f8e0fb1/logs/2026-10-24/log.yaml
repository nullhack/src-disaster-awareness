log_date: '2026-10-24'
summary: Bangladesh reported three new dengue deaths and 1,299 hospitalizations in 24 hours, while another report detailed six additional deaths and 1,898 hospitalizations, bringing the country's total caseload to 121,699. In Ghaziabad, India, private pathology laboratories have capped the price of dengue ELISA tests at 600 rupees following central government directives.
