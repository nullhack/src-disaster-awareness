title: 'मदरसे के पास कूड़ा डालने से लोग परेशान: नपा कर्मचारियों पर कूड़ा फेंकने का आरोप, बदबू और बीमारी का खतरा बढ़ा - Gulami Ka Pura News'
body: Gulami Ka Pura garbage dumping controversy health risk dengue malaria danger update. Follow Dainik Bhaskar Latest Updates. गुलामी का पूरा इलाके में नगर पालिका के कर्मचारी मदरसा के पास कूड़ा फेंक रहे हैं। इससे इलाके में गंदगी फैल रही है और लोगों को डेंगू-मलेरिया जैसी बीमारियों का खतरा बढ़ गया है।
