summary: In Bangladesh, the dengue outbreak continues to escalate, with four additional deaths and 1,163 new hospitalizations reported in the latest 24-hour period, bringing the 2026 death toll close to 100 and the total caseload to 35,846. Prior to that, three more deaths and 1,097 hospitalizations were recorded in the preceding 24 hours, reflecting a sustained increase in transmission.
