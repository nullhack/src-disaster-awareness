log_date: '2026-10-17'
summary: Hong Kong's Centre for Health Protection warned of rising dengue and chikungunya cases due to mosquito breeding conditions. In Uttar Pradesh, India, reports highlighted dengue risks from waterlogging and poor sanitation in Kanpur, Magalganj, and an outbreak in Ludhiyani village, along with a health awareness campaign distributing homeopathic dengue prevention medicine. Additionally, a general article noted that a dengue vaccine is now available for travelers.
