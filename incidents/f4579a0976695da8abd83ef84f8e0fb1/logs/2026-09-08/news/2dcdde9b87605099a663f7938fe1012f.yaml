title: 'खानपुर में नालियों-गलियों में गंदगी, ग्रामीण परेशान: मच्छर-मक्खियां पनप रहे, डेंगू-हैजा जैसी बीमारियों का डर; प्रधान ने दिया आश्वासन - Khanpur Phaphund(Auraiya) News'
body: Khanpur village sanitation issues, drainage blockages, and health risks like dengue, cholera. Follow Dainik Bhaskar. फफूंद थाना क्षेत्र के भाग्यनगर ब्लॉक की ग्राम पंचायत खानपुर में ग्रामीण गंदगी से परेशान हैं। गांव की गलियों और नालियों में भारी गंदगी जमा हो गई है।
