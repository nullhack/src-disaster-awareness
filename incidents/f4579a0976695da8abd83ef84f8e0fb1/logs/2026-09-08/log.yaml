log_date: '2026-09-08'
summary: In Nepal’s Palpa district, 231 dengue infections were confirmed within less than two months of the current fiscal year, according to the district health office. In the United States, Florida reported 41 dengue cases statewide, prompting aerial spraying and inspections in Tampa Bay-area counties. Additional reports highlighted persistent dengue risk in Indonesia and sanitation-related dengue concerns in Uttar Pradesh, India, along with a surge in demand for papaya leaves in Ahmedabad as a home remedy.
