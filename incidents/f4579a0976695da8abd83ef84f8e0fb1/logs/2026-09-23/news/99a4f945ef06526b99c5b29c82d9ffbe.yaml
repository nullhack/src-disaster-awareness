title: Five more die of dengue, 1,872 hospitalised in 24 hours
body: In 2024, the country reported 101,214 dengue infections and 575 deaths. The previous year (2023) saw the country’s worst outbreak on record, with 1,705 deaths and 321,179 hospitalisations.
