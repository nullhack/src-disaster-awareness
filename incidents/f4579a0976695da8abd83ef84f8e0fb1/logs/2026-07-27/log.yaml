log_date: '2026-07-27'
summary: In Bangladesh, three more dengue-related deaths were reported in the past 24 hours, raising the year's death toll to 43, with 458 new hospitalizations bringing the total caseload to 13,098 in 2026. The US Embassy in Sri Lanka launched a Public Health Pest Control and Vector-Borne Disease Response program to support dengue control efforts.
