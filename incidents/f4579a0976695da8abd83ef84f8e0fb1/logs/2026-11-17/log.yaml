log_date: '2026-11-17'
summary: Bangladesh's 2026 dengue death toll has crossed 500, with reports citing 502 fatalities after three more deaths in a 24-hour period, while another outlet recorded eight deaths in a single day. New hospitalizations remain high, at 1,598 in one 24-hour span and 1,952 in another, bringing the cumulative caseload for the year to 164,107. A newly published epidemiological study separately documented 13,371 dengue cases and 21 deaths across ten states in Sudan between August 2024 and July 2025.
