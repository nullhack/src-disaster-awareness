summary: A suspected dengue-related death of an elderly woman in Florida was reported by her family and local media, though the Florida Department of Health has not yet confirmed it. This follows earlier reports of Florida's local outbreak, including an 80-year-old woman's death in Tampa. Other news items in this batch (mosquito repellent usage survey, WHO drug review, and a local Indian sanitation complaint) do not provide new information about the global incident's status, aside from reiterating ongoing risk factors.
