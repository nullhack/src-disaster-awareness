log_date: '2026-09-24'
summary: Hurricane Polo rapidly intensified into a Category 5 storm off Mexico's Pacific coast, becoming one of the strongest hurricanes ever recorded in the Eastern Pacific. It weakened slightly to a Category 4 but continues to bring heavy rain and life-threatening flooding and landslides to southwestern Mexico, particularly Guerrero state. The storm is expected to remain offshore, but officials warn of significant hazards from rainfall and mudslides.
