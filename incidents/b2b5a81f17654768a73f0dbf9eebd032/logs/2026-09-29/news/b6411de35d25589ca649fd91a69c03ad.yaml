title: Mexico, Hawaii fortify as storms churn in Pacific | Arkansas Democrat Gazette
body: MEXICO CITY -- Residents along Mexico's west coast stacked sandbags to fortify beachfront shops and evacuated their homes while Hawaii's Big Island and Maui braced for potentially catastrophic flooding, as two separate storms swirled in the Pacific on Thursday.
