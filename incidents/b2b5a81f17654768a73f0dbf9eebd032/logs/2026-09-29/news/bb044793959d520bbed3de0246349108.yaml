title: Hurricane Polo approaches Mexico, threatens 'severe' damage
body: Strong winds battered Mexico's Baja California peninsula on Monday ahead of the arrival of Hurricane Polo, a major El Niño-charged storm expected to cause severe damage along the Pacific coast.
