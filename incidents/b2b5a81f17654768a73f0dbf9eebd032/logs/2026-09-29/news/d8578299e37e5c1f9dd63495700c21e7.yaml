title: Mexico's Baja California braces for Hurricane Polo as Hurricane Nolo threatens Hawaii
body: Hurricane Nolo edged further away from the Hawaiian Islands on Sunday as major Hurricane Polo bore down on Mexico's Baja California peninsula with a threat of storm surge, high winds and heavy rains.
