title: Powerful Hurricane Polo threatens Mexico with torrential rain as Pacific tropics erupt » Yale Climate Connections
body: Polo churns off Mexico with up to eight inches of rain and 46-foot seas, while another strengthening tropical system threatens eastern Hawaii with dangerous surf and rainfall of 10 to 30-plus inches.
