title: Category 5 Hurricane Polo is an 'extremely dangerous' storm off the coast of Mexico
body: MIAMI (AP) — Hurricane Polo grew increasingly strong Tuesday and was forecast to gain more intensity as it skirted Mexico's southwestern coast as a Category 5 cyclone, weather experts said. Polo was an "extremely dangerous" storm with maximum sustained winds of 165 mph (266 kph), the Miami-based National Hurricane Center said in an advisory.
