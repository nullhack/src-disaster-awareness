title: Hurricane Polo Nears Mexico's Baja California Sur, Landfall Due Monday
body: Hurricane Polo, a Category 3, is due to hit Mexico's Baja California Sur on Monday. Alerts now reach Sonora; Los Cabos and La Paz sit just outside them.
