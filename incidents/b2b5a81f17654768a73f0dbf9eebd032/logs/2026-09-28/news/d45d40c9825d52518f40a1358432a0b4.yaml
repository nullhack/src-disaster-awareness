title: National Weather Service Issues Flood, High Surf Advisories in SoCal - MyNewsLA.com
body: The National Weather Service Monday issued coastal flood advisory and high surf advisory until 5 p.m. Tuesday for Southern California as Hurricane Polo begins to create elevated tides at beaches Monday. Forecasters warned of coastal flooding, significant beach erosion and dangerous rip currents over the next few days. Hurricane Odalys is also churning off central […]
