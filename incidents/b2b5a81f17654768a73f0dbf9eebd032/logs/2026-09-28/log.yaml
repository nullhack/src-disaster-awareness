log_date: '2026-09-28'
summary: |-
  Hurricane Polo, currently a Category 3 storm, is expected to make landfall in Baja California Sur on Monday, with Mexico raising emergency readiness. Recent NOAA satellite footage captured the storm's intense eyewall lightning during its earlier Category 5 phase, and the storm's moisture is forecast to bring both beneficial rains and dangerous flash flooding to the region.
  Hurricane Polo's rains killed two children in Jalisco, Mexico, as the storm nears Baja California Sur. The National Weather Service issued coastal flood and high surf advisories for Southern California due to Polo's swells.
