log_date: '2026-09-25'
summary: |-
  Hurricane Polo has regained strength and is now expected to make landfall on Sunday night along Mexico’s Baja California coast, rather than remaining offshore. The storm continues to drench the Pacific coast with heavy rain, high winds, and surf, and is forecast to bring indirect impacts to Southern California this weekend.
  Hurricane Polo has re-intensified to Category 5 strength as it approaches Baja California, unleashing heavy rain, powerful winds, and dangerous surf along Mexico's Pacific coast. Residents are evacuating and fortifying properties in anticipation of landfall, with officials targeting the Baja Peninsula and Sonora as areas in the storm's path. The storm continues to threaten life-threatening flooding and landslides.
