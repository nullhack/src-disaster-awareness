title: Hurricane Nolo threatens Hawaii with heavy rain as Polo churns near Mexico
body: Residents on Hawaii’s Big Island are bracing for potentially life-threatening and catastrophic flooding from Hurricane Nolo. The U.S. National Weather Service said Nolo was about 185 miles south of the Big Island on Friday morning and headed to the northeast. Tropical storm conditions are expected to begin on land Friday evening. Forecasters are warning the island could see 10 to 15 inches of rain and 50-mph wind gusts. Meanwhile, Hurricane Polo is churning off Mexico's western coast as a Category 5 hurricane. It is expected to turn toward the Baja California peninsula. Storm conditions there are expected to begin late Sunday into Monday.
