title: Powerful Hurricane Polo drenches Mexico's coast from offshore as Nolo nears Hawaii
body: Powerful Hurricane Polo sent bands of heavy rain across Mexico's Pacific coast Thursday as a growing Tropical Storm Nolo approached Hawaii with the potential for catastrophic flooding.
