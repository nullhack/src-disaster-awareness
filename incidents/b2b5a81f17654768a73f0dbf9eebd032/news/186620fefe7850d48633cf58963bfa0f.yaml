title: Hurricane Polo a very powerful Category 4 storm off Mexico. See its path.
body: Hurricane Polo intensified rapidly in the Pacific off the southwestern Mexican coast, growing into a Category 5 storm before weakening slightly to a Category 4. Here's the latest on its path.
