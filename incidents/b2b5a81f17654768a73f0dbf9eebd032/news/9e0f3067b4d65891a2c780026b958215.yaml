title: Tropical Storm Isaias forms in Gulf, could reach U.S. as hurricane this weekend - AOL
body: Tropical Storm Isaias has formed in the Gulf and is expected to become a hurricane by Thursday before approaching the U.S. northern Gulf Coast on Friday, according to forecasters.
