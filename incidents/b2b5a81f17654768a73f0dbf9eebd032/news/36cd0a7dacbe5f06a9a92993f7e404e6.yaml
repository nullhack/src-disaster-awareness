title: Mexico braces for Hurricane Polo’s effects | Arkansas Democrat Gazette
body: MEXICO CITY -- Southwestern Mexico braced for heavy rain and mudslides Wednesday after Polo, a powerful Pacific cyclone, became a major hurricane. Forecasters also warned another system headed for Hawaii could cause catastrophic flooding later in the week.
