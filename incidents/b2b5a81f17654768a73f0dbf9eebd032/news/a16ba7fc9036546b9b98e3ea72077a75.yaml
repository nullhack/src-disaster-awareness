title: Hurricane Polo hits Mexico hard; its northern neighbor braces for rain and flooding
body: The cyclone made landfall in Baja California Sur with strong winds and a risk of flooding. In the United States, the National Weather Service is warning of a potentially dangerous episode of torrential rain stretching from the Southwest to Texas and the Great Plains.
