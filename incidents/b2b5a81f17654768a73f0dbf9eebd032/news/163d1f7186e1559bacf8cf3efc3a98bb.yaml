title: Hurricane Polo regains Category 5 strength off Mexico as new cyclone threat brews behind
body: By Dante Alfaro EL PARAISO, Mexico, Sept 25 (Reuters) - Hurricane Polo regained Category 5 strength on Friday as it moved away from Mexico's Pacific coast and into open waters, while forecasters tracked a separate disturbance to the south that could develop into another tropical cyclone in the coming days.
