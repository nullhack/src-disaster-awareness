title: Hurricane Polo is a strong Category 3 storm off Mexico. See its path.
body: Hurricane Polo was downgraded to Category 3 status Saturday as its intensity fluctuated off Mexico's southwestern coast, but it was forecast to make landfall in Baja California on Monday.
