log_date: '2026-09-23'
summary: On September 23, 2026, heavy rain persisted across central and southern Vietnam, with forecasts of over 250 mm in parts of central Vietnam and high tides elevating flood risks in Ho Chi Minh City through September 25. Flooding disrupted traffic in Phu Quoc, and authorities in Khánh Hòa warned residents not to be complacent amid ongoing flood threats.
