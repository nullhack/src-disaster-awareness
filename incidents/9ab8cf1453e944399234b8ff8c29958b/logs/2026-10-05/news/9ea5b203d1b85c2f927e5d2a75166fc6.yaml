title: Floodwaters force 40 households to evacuate in Lam Dong | DTiNews
body: Prolonged heavy rain sent water levels in streams in Lam Dong Province's Bao Lam 2 Commune sharply higher, flooding homes and forcing 40 households to evacuate.
