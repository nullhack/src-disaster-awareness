log_date: '2026-09-29'
summary: Ho Chi Minh City and the Mekong Delta are bracing for the highest tides of 2026, forecast at 1.6–1.85 meters from September 28–30, exceeding alert level 3 and threatening deep flooding in low-lying and riverside areas. Authorities warn the peak tides could coincide with rainfall and upstream water flows. Meanwhile, two strong storms are active simultaneously, raising concerns of additional heavy rain, flooding, and strong winds.
