title: Heavy rain, hill cracks prompt evacuation of 40 households in Da Nang
body: Heavy rain has lashed several areas of Da Nang City in central Vietnam, with rainfall forecast to continue and totals expected to exceed 250mm in some places, raising the risk of landslides, flash floods, thunderstorms, and strong winds.
