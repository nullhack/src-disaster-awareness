title: Tropical convergence zone, low-pressure area bring heavy rain to central, southern Vietnam
body: A tropical convergence zone and a low-pressure area have caused moderate to heavy rain to central and southern Vietnam, according to the National Center for Hydro-Meteorological Forecasting.
