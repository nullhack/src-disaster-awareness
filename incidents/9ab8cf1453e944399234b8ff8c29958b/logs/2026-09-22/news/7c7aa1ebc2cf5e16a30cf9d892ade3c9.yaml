title: Rush-hour downpour paralyzes Ho Chi Minh City, stranding commuters in deep floods
body: Several streets in Ho Chi Minh City were submerged after heavy rain on Tuesday afternoon, with floodwater rising above motorcycle wheels in some areas and disrupting rush-hour travel.
