log_date: '2026-09-22'
summary: Heavy rain from a tropical convergence zone and low-pressure area triggered floods and landslides across central and southern Vietnam on September 22, 2026. In Da Nang, 40 households were evacuated due to hill cracks and rising water, while Ho Chi Minh City saw streets submerged during rush hour, stranding commuters. Authorities in Khánh Hòa and other provinces issued flood warnings as river levels rose in the Dong Nai River and elsewhere.
