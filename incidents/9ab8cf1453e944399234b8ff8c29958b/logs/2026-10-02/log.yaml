log_date: '2026-10-02'
summary: On October 1, heavy thunderstorms over Ho Chi Minh City forced numerous arriving flights at Tan Son Nhat International Airport to circle and some to divert to other airports. Forecasts also call for heavier rain across northern and central Vietnam in coming days, with temperatures expected to drop. Related coverage highlights Ho Chi Minh City’s chronic flooding issues from high tides and climate change.
