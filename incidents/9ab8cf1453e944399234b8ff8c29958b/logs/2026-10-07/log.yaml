log_date: '2026-10-07'
summary: |-
  Heavy rain is forecast to persist in central Vietnam through around October 10–11, with risks of urban flooding, flash floods, and landslides. In Ho Chi Minh City, a midday downpour on Tuesday flooded downtown streets including Bui Vien Street, and a 30-minute downpour on Monday submerged Ma Lo Street knee-deep into the night, causing traffic congestion and leaving residents wading home.
  Ho Chi Minh City is deploying mobile pumps at severely flooded areas and stepping up traffic control to prepare for continued heavy rain and high tides. In Da Nang, local authorities have been empowered to decide on school closures based on conditions amid increased risks of flooding, flash floods, and landslides. Additionally, a heavy rainstorm hit central Ho Chi Minh City on Wednesday evening, causing localized flooding and traffic congestion during rush hour.
