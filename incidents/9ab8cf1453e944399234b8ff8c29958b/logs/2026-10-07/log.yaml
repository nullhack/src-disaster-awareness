log_date: '2026-10-07'
summary: Heavy rain is forecast to persist in central Vietnam through around October 10–11, with risks of urban flooding, flash floods, and landslides. In Ho Chi Minh City, a midday downpour on Tuesday flooded downtown streets including Bui Vien Street, and a 30-minute downpour on Monday submerged Ma Lo Street knee-deep into the night, causing traffic congestion and leaving residents wading home.
