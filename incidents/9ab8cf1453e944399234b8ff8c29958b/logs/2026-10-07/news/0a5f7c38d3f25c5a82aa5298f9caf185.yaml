title: 30-minute downpour inundates flood-prone Ho Chi Minh City road, leaves residents wading home at night
body: A 30-minute downpour on Monday left Ma Lo Street in Binh Tri Dong Ward, Ho Chi Minh City, submerged late into the night, forcing residents to wade home through knee-deep water.
