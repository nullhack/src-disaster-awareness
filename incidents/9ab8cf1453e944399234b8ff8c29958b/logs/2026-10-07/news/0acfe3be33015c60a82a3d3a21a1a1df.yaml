title: Ho Chi Minh City’s ‘backpacker street’, other downtown streets flooded after heavy midday downpour
body: Several streets in central Ho Chi Minh City, including Bui Vien Street, were flooded following a heavy downpour at midday on Tuesday, causing minor traffic congestion and forcing some international tourists to wade through floodwater.
