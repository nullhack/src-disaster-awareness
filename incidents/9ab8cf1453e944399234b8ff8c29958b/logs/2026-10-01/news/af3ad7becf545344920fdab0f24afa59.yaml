title: Chaos in Ho Chi Minh City as sudden deluge and rising tides leave commuters stranded
body: Raging floodwaters and severe gridlock brought key corridors across Ho Chi Minh City to a standstill late Thursday, with water levels mysteriously rising long after torrential rains had stopped.
