log_date: '2026-09-26'
summary: In Gia Lai Province, heavy rain has triggered fresh signs of slope instability, prompting landslide fears for dozens of homes. Tourist activities at Nui Chua and Phuoc Binh National Parks in Khanh Hoa were suspended due to increased risks of landslides and flash floods. Emergency calls in Ho Chi Minh City surged to a record 15,600 over nine days, while tides in Can Tho reached the highest warning level and are forecast to rise further, elevating flood risks in low-lying areas.
