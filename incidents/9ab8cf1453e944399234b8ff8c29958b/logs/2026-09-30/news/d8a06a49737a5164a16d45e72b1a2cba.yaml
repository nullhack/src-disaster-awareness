title: Why is it raining so much this year? - Considering the flood control capabilities of Japan, Vietnam, and Thailand based on the flooding in Ho Chi Minh City, Hanoi, Bangkok, and Nagoya｜こんぺい@ホーチミン HARO VN（ハロ ベトナム）
body: This September, every time evening came in Ho Chi Minh City, I saw squalls and witnessed the sight of roads turning into rivers many times. Since I haven't been here long, I asked if this was normal, and I often heard people say, "There's a lot of rain this year," from both Japanese acquaintance
