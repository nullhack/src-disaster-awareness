title: 180 evacuated after kilometre-long hill crack in Thanh Hoa | DTiNews
body: Authorities in Thanh Hoa Province have evacuated 180 people after heavy rain triggered a kilometre-long crack on Na Lo Hill and landslides that damaged or destroyed nine homes.
