log_date: '2026-09-30'
summary: In Thanh Hoa Province, 180 people were evacuated after heavy rain triggered a kilometre-long crack on Na Lo Hill and landslides that damaged homes. Heavy rain also damaged Bao Loc Pass in Lam Dong Province, causing potholes that pose risks to motorists. Additionally, high tides in Ho Chi Minh City and southern Vietnam are forecast to continue rising, with water levels at some monitoring stations expected to exceed the highest warning level.
