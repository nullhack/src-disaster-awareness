title: Central, southern Vietnam brace for heavy rain, localized flooding
body: Central and southern Vietnam are forecast to see heavy to very heavy rain from Wednesday evening through Saturday, with urban and low-lying areas in Hue, Da Nang, and Ho Chi Minh City at risk of flooding.
