title: Sand floods repeatedly wash onto road to Vietnam’s Mui Ne resort area
body: Red sand carried by run-off has repeatedly flooded a major road leading into Mui Ne, a resort area in Phu Thuy Ward, Lam Dong Province, Vietnam, disrupting traffic and posing risks to residents and visitors after heavy rain.
