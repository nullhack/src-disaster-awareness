title: Heavy rain triggers landslides, sand spills on roads to Mui Ne | DTiNews
body: Torrential rain has triggered landslides and washed red sand onto roads leading to Mui Ne tourist destinations in Lam Dong Province, disrupting traffic and damaging sections of roadway.
