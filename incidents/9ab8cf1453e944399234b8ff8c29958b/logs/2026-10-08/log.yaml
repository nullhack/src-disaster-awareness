log_date: '2026-10-08'
summary: Red sand floods and landslides triggered by heavy rain have repeatedly washed onto roads leading to the Mui Ne resort area in Lam Dong Province, disrupting traffic and damaging road sections. Central and southern Vietnam are also forecast to experience heavy to very heavy rain through Saturday, with urban and low-lying areas in Hue, Da Nang, and Ho Chi Minh City at risk of flooding.
