title: Southern Vietnam braces for more downpours as high tides threaten flooding
body: Thunderstorms are expected across southern Vietnam in the coming days, mainly in the late afternoon and at night. High tides from October 11 to 13 could exceed Level 3 warnings, raising flood risks in Ho Chi Minh City and other urban areas.
