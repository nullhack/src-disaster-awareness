title: Red sand floods road linking Phan Thiet and Mui Ne | DTiNews
body: Prolonged heavy rain sent torrents of red sand and mud from nearby hills onto Nguyen Thong Road in Lam Dong Province on September 23, causing several motorcyclists to fall on the slippery surface.
