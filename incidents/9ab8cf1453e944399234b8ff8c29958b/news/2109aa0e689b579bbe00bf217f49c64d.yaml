title: Agencies explain increasingly frequent heavy rain in Ho Chi Minh City
body: Heavy rain has become more frequent and intense in Ho Chi Minh City, while high tides exacerbate flooding, as low-lying terrain, climate change, rising sea levels, rapid urbanization and limited drainage capacity contribute to the problem, according to relevant agencies.
