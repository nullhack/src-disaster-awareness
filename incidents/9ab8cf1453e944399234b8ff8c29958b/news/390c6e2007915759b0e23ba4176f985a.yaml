title: Rains, floods disrupt reptile habitats, raise snakebite risk in Vietnam
body: Heavy rain and rising floodwaters in southern Vietnam are disrupting snakes’ natural shelters, driving them into gardens and residential areas and contributing to a rise in snakebite cases.
