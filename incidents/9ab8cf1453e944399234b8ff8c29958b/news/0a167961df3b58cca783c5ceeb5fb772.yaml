title: HCM City, Mekong Delta face highest tides of 2026
body: HCM City and the Cửu Long (Mekong) Delta are facing their highest tidal levels of the year, with flooding expected in low-lying and riverside areas through Wednesday, as authorities warn that high tides could coincide with rainfall and upstream water flows.
