title: Khanh Hoa suspends visits to Khanh Hoa national parks | DTiNews
body: Tourist activities at Nui Chua and Phuoc Binh National Parks in Khanh Hoa Province have been suspended after heavy rain raised the risk of landslides, flash floods and other hazards.
