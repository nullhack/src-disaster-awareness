title: Flood risk rises as heavy rain persists across central, southern Vietnam
body: Floodwaters in the Dong Nai River and several rivers in central Vietnam are rising as widespread heavy rain, particularly in upstream areas, continues to affect the region, according to Vietnam's meteorological agency.
