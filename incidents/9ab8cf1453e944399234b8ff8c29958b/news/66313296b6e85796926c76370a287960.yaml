title: Can Tho tides hit highest warning level, set to rise further | DTiNews
body: Tidal levels in Can Tho reached the highest warning level on September 26 and are forecast to rise further, peaking at 2.28 metres on September 29 and raising the risk of flooding in low-lying areas.
