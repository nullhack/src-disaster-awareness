title: Heavy rain, high tides raise flood risk across Ho Chi Minh City, southern Vietnam
body: Ho Chi Minh City and much of southern Vietnam are forecast to see several more days of rain, with heavier downpours from the afternoon into the night and rising tides expected to worsen flooding in low-lying areas.
