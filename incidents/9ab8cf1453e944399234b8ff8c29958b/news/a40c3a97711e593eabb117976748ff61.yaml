title: High tides, afternoon rain threaten flooding in Ho Chi Minh City
body: Ho Chi Minh City is bracing for potential flooding as high tides coincide with afternoon and evening rain on Saturday, October 10, according to the National Center for Hydro-Meteorological Forecasting.
