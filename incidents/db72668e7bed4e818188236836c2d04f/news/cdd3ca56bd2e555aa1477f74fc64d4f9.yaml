title: M5.9 Earthquake Strikes Indonesia | SEE News
body: A magnitude 5.9 earthquake struck Indonesia’s Sumbawa region on Sunday, with the German Research Center for Geosciences (GFZ) reporting that the quake occurred at a depth of 10 kilometers.
