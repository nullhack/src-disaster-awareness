title: อินโดนีเซียแผ่นดินไหว 5.6 สะเทือนนอกชายฝั่งจังหวัดอาเจะห์ | เดลินิวส์
body: เกิดแผ่นดินไหว 5.6 นอกชายฝั่งจังหวัดอาเจะห์ ทางตะวันตกเฉียงเหนือของเกาะสุมาตราในอินโดนีเซีย เบื้องต้นยังไม่มีรายงานความเสียหายหรือผู้ได้รับบาดเจ็บ
