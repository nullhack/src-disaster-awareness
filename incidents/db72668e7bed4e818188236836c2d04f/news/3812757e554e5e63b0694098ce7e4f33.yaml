title: 5.9-magnitude quake hits Sumbawa Region, Indonesia -- GFZ
body: BEIJING, Oct. 4 (Xinhua) -- An earthquake with a magnitude of 5.9 jolted Sumbawa Region, Indonesia at 2255 GMT on Saturday, the GFZ German Research Centre for Geosciences said. The epicenter, with a depth of 10 km, was initially determined to be at 9.69 degrees south latitude and 118.93 degrees east longitude. ■
