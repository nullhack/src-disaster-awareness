title: Severe weather is affecting some voters across the country.
body: In Florida, more than 20 polling sites are being moved due to intense flooding. Storms in the Southwest have also impacted some polling locations in Colorado, Newsweek reports, while Utah will let some voters impacted by flooding return ballots electronically, and Arizona officials are warning voters to check travel updates.
