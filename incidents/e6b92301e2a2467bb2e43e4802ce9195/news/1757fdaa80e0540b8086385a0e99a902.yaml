title: Fans receive emergency warning as extreme weather strikes at Interlagos
body: Fans and members of the Formula 1 paddock at Interlagos received a severe weather warning on their mobile phones as torrential rain disrupted qualifying for the São Paulo Grand Prix, forcing race control to suspend the session. The alert, issued in Portuguese by Brazil's Civil Defence authorities, warned of heavy rainfall affecting the southern and western areas of São Paulo, accompanied by lightning and strong winds.
