title: Glenties councillor raises alarm after storm leaves rural homes cut off - Highland Radio - Latest Donegal News and Sport
body: Cllr Brian Carr says the last storm has highlighted how vulnerable some rural communities in Donegal are to severe weather. He says around ten homes in The Lab of the Glen area were cut off, raising concerns that emergency services would be unable to reach residents and that farm animals were also at risk. Two […]
