title: MotoGP bids farewell to Phillip Island with safety-car lap after Australian GP cancellation | GRANDE PRÊMIO
body: Instead of a final race at Phillip Island, MotoGP riders took to the rain-soaked circuit behind the safety car to say goodbye to the Australian venue, which leaves the calendar after 2026.
