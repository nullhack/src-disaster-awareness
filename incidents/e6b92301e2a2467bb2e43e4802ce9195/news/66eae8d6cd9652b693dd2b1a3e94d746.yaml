title: 'Boca Raton Severe Weather Alert: Tornado Warning Continues For Southeastern Palm Beach County Until 6:30 P.m.'
body: The National Weather Service says a radar-indicated rotating thunderstorm capable of producing a tornado was near Boca Raton around 6:06 p.m., moving northeast at about 25 mph. The Tornado Warning for southeastern Palm Beach County remains in effect until 6:30 p.m.
