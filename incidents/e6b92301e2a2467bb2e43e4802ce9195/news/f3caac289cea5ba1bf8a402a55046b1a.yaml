title: 'Arizona is drying out after severe storms: Here’s what to know'
body: Drier air is moving into Arizona, bringing a sunny and calmer finish to a chaotic weather week. The storm system that sparked 15 tornado warnings in the High Country — the state’s most since 2010 — has shifted east into New Mexico. Phoenix will stay dry and sunny through the weekend, with highs in the upper 70s to low 80s and clear, cooler nights. A slight shower chance remains in parts of the High Country, but severe weather is not expected.
