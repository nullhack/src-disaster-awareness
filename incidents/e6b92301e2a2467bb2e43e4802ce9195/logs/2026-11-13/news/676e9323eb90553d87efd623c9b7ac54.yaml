title: Rio Grande Valley school districts announce cancellations due to inclement weather
body: Multiple Rio Grande Valley school districts, including Edinburg, McAllen, Mission, PSJA, and Weslaco, have canceled summer classes and activities for Tuesday, June 16, 2026, due to an ongoing severe weather and flood watch.
