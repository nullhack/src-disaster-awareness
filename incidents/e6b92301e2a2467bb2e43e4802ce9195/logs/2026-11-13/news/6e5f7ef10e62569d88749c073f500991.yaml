title: Dry this afternoon, then storm chances ramp up for Halloween weekend and next week
body: Southeast Louisiana stays dry this afternoon, but hit and miss storms arrive Saturday and Sunday, and a stronger system with a possible severe weather threat is on the way early Wednesday.
