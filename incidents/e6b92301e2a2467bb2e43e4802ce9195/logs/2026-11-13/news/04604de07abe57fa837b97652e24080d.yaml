title: 'UPDATE: McCaysville water back on, but not safe to drink; Copperhill joins neighbor in seeking federal aid'
body: Copperhill, Tennessee, and McCaysville, Georgia, faced severe flooding after receiving up to 11 inches of rain, resulting in significant damage to homes, businesses, and roads in the area. Emergency services rescued over 80 people amid the crisis.
