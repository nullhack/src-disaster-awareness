title: 'Bessent: Dropping oil prices before 2026 ends ''will depend'' on Iran conflict'
body: Treasury Secretary Scott Bessent said Sunday that oil prices could go down before the end of the year, but it will depend on the Iran war. NBC News's "Meet the Press" host Kristen Welker asked Bessent about the chances of lower prices by the start of 2027,
