title: Solvay cuts 2026 forecast after Middle East conflict hits Q3
body: Oct 19 (Reuters) - Solvay cut its 2026 forecast after the Middle East conflict and a peroxide plant shutdown at Sadara in Saudi Arabia hit third-quarter earnings. The chemicals group now sees full-year EBITDA of 720 million to 740 million euros and free cash flow of between 120 million and 150 million euros.
