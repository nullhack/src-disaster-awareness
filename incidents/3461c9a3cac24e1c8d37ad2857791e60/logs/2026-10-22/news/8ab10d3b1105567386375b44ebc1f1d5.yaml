title: IMF Forecasts 1.3% Contraction for Middle East Economies in 2026
body: The IMF expects Middle East, North Africa and Pakistan economies to contract 1.3% in 2026 amid the Iran conflict, then grow 6.6% in 2027 if fighting eases and trade normalizes; further disruption could worsen the outlook.
