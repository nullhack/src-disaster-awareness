title: IMF sees 1.3% contraction in Middle East, North Africa and Pakistan in 2026
body: The IMF on Thursday forecast a sharp drop in economic output in the Middle East, North Africa and Pakistan this year due to the US-Israeli-led war against Iran, followed by a rebound to 6.6% growth in 2027,
