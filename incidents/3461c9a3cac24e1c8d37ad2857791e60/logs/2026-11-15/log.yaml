log_date: '2026-11-15'
summary: Iran hit back at President Trump's assertion that Tehran has been waging war since 1979, insisting the US cannot evade responsibility for aggression. Fresh missile threats against Saudi Arabia led major airlines to extend flight cancellations through 2027, worsening travel disruptions. Concurrently, Southeast Asian leaders opened their annual summit in Manila, prioritizing the ongoing conflicts' toll on energy costs and regional security.
