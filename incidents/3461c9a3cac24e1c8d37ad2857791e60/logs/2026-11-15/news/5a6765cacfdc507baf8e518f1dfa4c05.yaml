title: Eyeing peace in the face of crises
body: South-East Asian foreign ministers begin meetings in Manila as the regional bloc seeks a coordinated response to surging energy costs, security tensions, and an approaching El Nino, challenges Philippine President Ferdinand Marcos Jr has said demand collective action.
