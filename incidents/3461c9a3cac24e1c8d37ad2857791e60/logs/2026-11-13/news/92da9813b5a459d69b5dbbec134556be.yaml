title: The Treasury Secretary Is Now Living on a Military Base After Iranian Threats
body: Markets barely flinched when news broke that a cabinet secretary had moved onto a military base. Yet the quiet in oil and long bonds may hide a bigger risk for anyone holding USO or TLT, and a few scheduled events could expose it.
