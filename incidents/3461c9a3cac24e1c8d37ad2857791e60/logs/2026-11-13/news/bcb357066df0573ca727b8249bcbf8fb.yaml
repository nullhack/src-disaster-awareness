title: Assessing Nigeria's Efforts to protect Christians and Secure the Middle Belt
body: Counterterrorism successes do not, by themselves, establish that vulnerable communities are consistently safer. There is not yet sufficient evidence that the underlying problems of prevention, state capacity, accountability, and impunity have been adequately addressed.
