title: Crude oil at $70 a barrel in 2027? SBI sees relief as US-Iran peace prospects improve- Moneycontrol.com
body: SBI expects Brent crude to average around $87 over the next 10 days and potentially touch $70 in 2027. It also sees a 25-bps RBI rate hike in December despite inflation at 6.09%.
