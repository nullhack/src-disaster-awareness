title: Crude Prices Supported by Concerns US-Iran War Will Linger
body: December WTI crude oil (CLZ26 ) is up +0.35 (+0.39%) today, and December RBOB gasoline (RBZ26 ) is down -0.0279 (-1.04%). Crude oil and gasoline prices are mixed today. Crude has support after President Trump said the US doesn’t need a deal with Iran, dimming prospects for a quick breakthrough...
