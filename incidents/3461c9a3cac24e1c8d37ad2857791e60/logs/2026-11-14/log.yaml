log_date: '2026-11-14'
summary: |-
  Crude oil prices saw mixed movement, with December WTI rising 0.39% after President Trump's comment that the U.S. does not need a deal with Iran dimmed prospects for a quick breakthrough, while gasoline fell. An Iranian expert warned that Europe may face consequences for supporting the U.S. and Israel against Iran.
  Indian External Affairs Minister S. Jaishankar addressed the West Asia conflict at the HTLS 2026 summit. An Israeli drone strike killed two Palestinians in northern Gaza. Southeast Asian leaders called for peaceful conflict resolutions at the ASEAN summit, which President Trump is set to join, while Trump and Putin pushed for a meeting to discuss global flashpoints including the Middle East. A report also found that gold smuggled from war zones continues to enter the UAE despite new regulations.
