log_date: '2026-11-21'
summary: Democrats in Congress are aiming to block Iran war funding while using an upcoming funding measure as leverage to avoid a shutdown. The Middle East conflict has caused the largest disruption ever to global oil and gas trade and could cut global oil demand by 4%, according to one report. Brent crude fell 5% to $91 as recovering Gulf oil flows outweighed tanker attacks, Houthi threats, and escalation concerns.
