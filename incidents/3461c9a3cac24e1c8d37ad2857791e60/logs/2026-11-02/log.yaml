log_date: '2026-11-02'
summary: Iranian negotiators have left Doha talks, with a draft proposal for a US deal being circulated, but Tehran says it sees only unacceptable ideas in the latest mediation. The U.S. Navy is expanding unmanned mine‑hunting capabilities in response to new mine threats in the Strait of Hormuz. New reports show the conflict’s economic toll, with Arab airlines’ seat occupancy falling to 77% and a structural diesel supply crunch emerging.
