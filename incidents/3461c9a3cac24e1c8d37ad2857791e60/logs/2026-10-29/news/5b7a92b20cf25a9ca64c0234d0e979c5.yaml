title: 'Russia-Ukraine war: Drone strikes crowded Dnipro train station, 13 dead, 10 injured'
body: A reported Russian jet-powered drone strike hit Dnipro railway station in Ukraine on October 29, 2026, killing at least 13 people and injuring 10 others. The attack struck a platform occupied by passengers, raising fresh concerns about civilian safety and attacks on railway infrastructure.
