log_date: '2026-10-29'
summary: |-
  The Pentagon has provided a new estimate putting the cost of the Iran war to American taxpayers at $47.1 billion. Iran-backed Houthis claimed a strike on Saudi Arabia's Ras Tanura oil refinery on October 27, exacerbating supply worries.
  Qatari mediators presented a new draft peace proposal to Iran, while oil prices fell as hopes for a resolution grew. The Pentagon fired a general for leaking war information, and Iran reported that four tankers were hit by mines in the Strait of Hormuz. Cruise operators and Gulf investors are adapting to the economic impacts of the ongoing conflict.
