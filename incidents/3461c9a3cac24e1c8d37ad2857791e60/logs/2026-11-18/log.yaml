log_date: '2026-11-18'
summary: Iran has escalated with new drone attacks, while Gulf states worry they may become targets and President Trump signals a waiting-game approach rather than immediate strikes. US intelligence assessments cited in reporting suggest Tehran still holds between 1,500 and 2,500 missiles capable of causing major damage, which helps explain the hesitation to attack. Meanwhile, Iran-backed Houthi forces have expanded control of the Bab al-Mandeb Strait, making the crossing more dangerous and jeopardizing aid and refuge for millions.
