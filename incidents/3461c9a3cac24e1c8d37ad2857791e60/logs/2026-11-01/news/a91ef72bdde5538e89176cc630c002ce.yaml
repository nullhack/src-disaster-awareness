title: Yamaha confirms it will miss next weekend's Qatar MotoGP, citing company-wide travel restrictions amid the Middle East conflict. A major escalation of the rider safety dispute. Yamaha plans to return in Portugal. Full story
body: 'YAMAHA OUT OF QATAR MotoGP 🏁 Yamaha has confirmed it will not participate in next weekend''s Qatar Grand Prix. The Japanese manufacturer says the continuing conflict in the Middle East means its company-wide travel restrictions remain in place. The decision comes after days of increasingly difficult discussions between MotoGP organisers, teams and riders over safety assurances and the requirement to attend. Full story 👇️ #MotoGP #YamahaMotoGP #QatarGP'
