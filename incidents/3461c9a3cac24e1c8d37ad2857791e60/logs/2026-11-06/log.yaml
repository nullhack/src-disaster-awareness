log_date: '2026-11-06'
summary: Defense Secretary Pete Hegseth fired back at an impeachment threat, praising the Iran war as a courageous and historic effort with backing from President Trump. Iranian Parliament Speaker Mohammad Bagher Ghalibaf accused American leadership of preparing for an escalated conflict following the midterm elections. The Middle East conflict is lifting costs and reshaping the outlook for companies like Tronox, as noted in its Q3 2026 earnings call.
