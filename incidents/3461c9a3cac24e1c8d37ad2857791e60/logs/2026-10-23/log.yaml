log_date: '2026-10-23'
summary: |-
  China urged restraint to prevent the Middle East conflict from spreading to the Horn of Africa. The Pakistan Stock Exchange lost over 2,000 points amid the escalation, and analysts indicate that all indicators point to continued conflict in the coming weeks. The conflict also put Formula 1’s season finale in Qatar and Abu Dhabi at risk, with contingency plans activated.
  Oil prices surged past $116 as the US prepares for a prolonged conflict with Iran, with Brent crude nearing $120 amid escalating Saudi-Houthi tensions. Ship attacks in the Strait of Hormuz hit a record high in October, and Iran launched a new wave of attacks on oil tankers. Türkiye warned that renewed military strikes on Iran would fuel a wider regional conflict, while the US embassy in Saudi Arabia issued a security alert about airport threats.
