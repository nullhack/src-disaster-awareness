title: US-Iran war - 'This is not neutrality' – Baghaei says 'Iran conflict' label erases aggressors from frame | Dunya News
body: US, Israel launched strikes on Iran on Feb 28, with Trump declaring “major combat operations”,Supreme Leader Ayatollah Ali Khamenei martyred in the strikes, and his son Mojtaba succeeded him in March,A 2-week ceasefire agreed on April 8, followed by US-Iran face-to-face talks in Pakistan,A preliminary agreement reached in June, but renewed fighting and disputes over Strait of Hormuz continued through July,A preliminary agreement reached in June, but renewed fighting and disputes over Strait of Hormuz continued through July
