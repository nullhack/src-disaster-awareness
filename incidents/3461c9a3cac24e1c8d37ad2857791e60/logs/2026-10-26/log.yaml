log_date: '2026-10-26'
summary: |-
  Houthi attacks on Riyadh airport and the East-West pipeline continued, with the Saudi-led coalition retaliating by striking Houthi strongholds in Sanaa. A deadly explosion aboard an oil tanker in the Strait of Hormuz heightened concerns over regional shipping and energy security, while businessmen in Pakistan warned that a prolonged Middle East crisis could deepen economic risks. Meanwhile, Israeli political figures debated the choice between permanent war and diplomacy in the conflict.
  Global LNG importers are facing an additional $39 billion in costs due to the ongoing Iran war, while the 2027 Dakar Rally has been moved out of Saudi Arabia because of the conflict. Additionally, the Iran War is shaping up as a key issue in the upcoming US midterm elections.
