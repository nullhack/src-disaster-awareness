log_date: '2026-11-19'
summary: |-
  Reports indicate Tehran widened attacks on Gulf nations hosting U.S. forces after the latest U.S. strike on an Iranian island, with Washington carrying out reactive strikes. The escalation is occurring while peace talks remain stalled.
  Senate Republicans blocked the latest Democratic effort to end the war in Iran, according to a report noting more than a dozen prior votes. The IEA said the Iran war’s energy shock means there is no going back to the pre-war normal, with energy-hungry nations expected to prioritize electricity security and affordability. A separate report raised conflict-of-interest questions about Jared Kushner’s peace diplomacy, saying his firm amended an SEC filing to disclose a previously omitted $32 million defense investment.
