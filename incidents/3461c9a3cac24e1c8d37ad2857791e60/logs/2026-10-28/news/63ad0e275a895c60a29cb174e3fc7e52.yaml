title: 'Global commodity prices to rise 23% in 2026 amid Middle East conflict: World Bank - The Tribune'
body: Global commodity prices are projected to rise 23 per cent in 2026, with energy prices expected to surge 32 per cent, as the conflict in the Middle East disrupts oil supplies and grain shipments, while weather risks threaten agricultural production, the World Bank Group said on Wednesday.
