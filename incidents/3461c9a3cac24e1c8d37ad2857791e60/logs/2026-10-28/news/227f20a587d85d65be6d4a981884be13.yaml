title: China to send envoy to Middle East in near future amid conflict spillover
body: BEIJING, Oct 27 (Reuters) - China is highly concerned about conflicts in the Middle East and surrounding regions and Beijing will send an envoy to the relevant countries in the near future,foreign ministry spokesperson Guo Jiakunsaid at a daily press conference on Tuesday.Guo called on related parties to resolve differences through dialogue and negotiation and also expressed concerns about the spillover and transmitting of the Middle East conflict to the Horn of Africa and the Red Sea region.
