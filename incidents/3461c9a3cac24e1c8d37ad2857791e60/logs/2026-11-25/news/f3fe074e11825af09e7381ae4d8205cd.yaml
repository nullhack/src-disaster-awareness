title: Over 700,000 Russian troops believed killed in Ukraine since invasion, leaked data suggest
body: Hacked records from Russia's statistics agency document nearly 500,000 military deaths, but researchers say missing soldiers and registration delays obscure the true toll; combined military casualties on both sides are estimated to exceed 2 million
