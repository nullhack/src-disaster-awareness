log_date: '2026-11-12'
summary: |-
  The House rejected an impeachment resolution against Defense Secretary Pete Hegseth over his handling of the Iran war. In a Veterans Day address, President Donald Trump defended the conflict and stated the war will be over "when we want to end it."
  President Trump directed Vice President Vance away from Iran negotiations, stating the U.S. does not need a deal with Iran, while the conflict is expected to increase costs for Americans. Iran demanded compensation for environmental damage amid reports of a heated exchange between Trump and Netanyahu. Separately, Israel bombed a Gaza hospital for the first time since the ceasefire, killing six people.
