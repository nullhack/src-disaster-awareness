title: Tehran refuses to budge as diplomacy races against war
body: Qatari mediators returned to Tehran on Friday, barely a day after leaving the Iranian capital following the reported rejection of their latest peace proposal, as Washington and Tehran remained divided over which side should make the first concessions.
