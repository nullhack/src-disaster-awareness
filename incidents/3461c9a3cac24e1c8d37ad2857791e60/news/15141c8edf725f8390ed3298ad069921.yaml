title: Iran, Qatari mediators hold third day of talks to end US-Iran war
body: Nov 1 (Reuters) - Iranian negotiators were in Doha on Sunday for a third consecutive day of talks with Qatari mediators aimed at pushing for a deal to end the US-Israeli war on Iran, an official briefed on the discussions told Reuters.The talks come amid concerns that the conflict could escalate again after the November 3 US midterm elections. President Donald Trump has said the United States will not launch new attacks on Iran before the vote and that talks with Tehran have been productive, though he has not ruled out further military action afterwards.
