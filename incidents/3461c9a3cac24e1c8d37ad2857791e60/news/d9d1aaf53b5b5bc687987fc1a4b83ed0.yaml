title: Bombings in Russia kill a military officer and injure an adviser to Ukraine's former prime minister - Newsday
body: Officials say car bombs in Moscow and St. Petersburg killed a senior military officer and critically injured an adviser to a former Ukrainian prime minister, in the latest in a series of attacks linked to the conflict in Ukraine.
