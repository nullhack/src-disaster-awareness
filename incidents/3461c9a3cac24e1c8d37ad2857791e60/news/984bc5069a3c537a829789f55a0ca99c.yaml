title: 'IN NUMBERS: Inflation rising as Middle East conflict fuels costs - Bailiwick Express News Jersey'
body: Higher fuel costs stemming from the conflict in the Middle East were among the biggest factors influencing a continued rise in Jersey’s inflation rate, according to the latest report from Statistics Jersey. Published today, the Retail Prices Index for September 2026 contains analysis of the speed at which goods and services in the island are […]
