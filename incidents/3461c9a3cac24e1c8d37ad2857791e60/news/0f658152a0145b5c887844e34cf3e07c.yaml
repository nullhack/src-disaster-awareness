title: 'Gaza, Three Years On: Preserving the Evidence, Breaking the Cycle of Impunity'
body: On 13 October 2023, Al-Haq was among the first to warn states to intervene to stop Israel’s genocide against Palestinians in Gaza. The continuum of decades of dehumanisation of Palestinians, a population subjected to refugeehood, denial of return, killings, torture, property appropriations, and pillage – fragmented and subjugated by Israel’s violent settler-colonial apartheid regime – has resulted in an ongoing Nakba, an ongoing colonial erasure, and escalating destruction of the Palestinian people.
