title: McFarland Speaker Series kicks off with talk on Irish conflict
body: 'WARREN – Near the end of his presentation, Rev. Harold Good said, “I’m just a storyteller.” Much more than that, the retired Methodist minister spoke to a rapt audience on “From Conflict to Connection: Insights from the Lifetime of Advancing Peace and Reconciliation” Thursday evening at the Warren-Trumbull County Public Library’s Harding Room. His appearance […]'
