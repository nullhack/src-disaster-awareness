title: Iran sees only unacceptable ideas in latest mediation to end war, official says
body: Qatari mediators have presented Iran with a new draft deal to end the war with the US and Israel, an official briefed on the negotiations said, but a senior Iranian official said Doha had only put forward unacceptable ideas that did not amount to an offer.
