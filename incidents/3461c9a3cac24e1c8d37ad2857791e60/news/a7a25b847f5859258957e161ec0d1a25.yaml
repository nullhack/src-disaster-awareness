title: Trump hails Iran strikes as UN watchdog raises alarm over Tehran's unverified uranium stockpile
body: President Donald Trump defended the U.S. war with Iran, calling the decision to strike the “lunatic nation” one of the greatest things he has ever done. His remarks came as IAEA Director General Rafael Mariano Grossi warned the U.N. Security Council that the agency cannot verify whether Tehran has diverted nuclear material, including highly enriched uranium.
