title: World Bank sees commodity prices up 23% in 2026 due to Middle East war, other shocks
body: Global commodity prices are set to surge 23% in 2026, the World Bank said on Wednesday, citing rising energy prices and disruptions to cargo shipping during the Middle East war, grain shipment problems in the Black Sea and high demand for safe-haven assets such as gold.
