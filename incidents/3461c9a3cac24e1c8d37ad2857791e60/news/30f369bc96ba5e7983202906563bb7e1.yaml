title: As fresh peace talks loom, Putin is escalating efforts to shatter Ukraine’s economy | CNN
body: As Russia struggles to advance on the battlefield in eastern Ukraine, it continues to pour more resources into the war in the skies. Russian missiles and drones are hitting Ukraine’s energy infrastructure harder and earlier in the year than in previous years, analysts say, and the Kremlin has broadened its targets to further damage the Ukrainian economy.
