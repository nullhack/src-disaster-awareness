title: Former Russian General Who Called for Putin's Resignation Tells Him 'You Lost' in Ukraine War
body: Retired Colonel General Leonid Ivashov told Vladimir Putin live on air that he had 'lost' Ukraine and demanded an immediate ceasefire, a rare revolt from inside Russia's military.
