title: Dems aim to block Iran war funding. And, Army delays lead azide detonation in Iowa
body: Congress needs to pass a funding measure to avoid a shutdown next month, providing Dems an opportunity to leverage power. And, the Army says waiting to detonate lead azide could become dangerous.
