title: Drinking water supplies dwindle in Yemeni city besieged by Houthi rebels
body: Taiz, a city in southwestern Yemen, faces a severe water crisis as Houthi rebels backed by Iran tighten their encirclement. The city has struggled with water issues for over a decade, but the situation has worsened in recent weeks.
