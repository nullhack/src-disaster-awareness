title: 'DRC: Over 30 million people projected to face hunger as conflict and Ebola compound crisis for children'
body: The data from the IPC, the world's leading authority on hunger monitoring, reveals that 28.8 million people are experiencing acute food insecurity between September and December 2026, up from 26.5 million people recorded for January to June 2026.
