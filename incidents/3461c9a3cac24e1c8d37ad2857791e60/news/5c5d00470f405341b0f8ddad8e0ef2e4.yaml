title: The Hormuz Crisis Causing Second-Order Impacts Globally - Energy News Beat
body: Eight months into the U.S.-Iran conflict that began in late February 2026, the Strait of Hormuz remains a restricted and dangerous chokepoint. Iranian attacks on commercial shipping have reached their highest levels of the war in October, with dozens of incidents reported and tankers still moving under U.S. naval coordination—often with AIS transponders off. While crude flows have partially recovered in some tracking estimates (roughly 70-80% of pre-war levels in certain weeks when including Gulf of Oman transfers and bypass loadings),
