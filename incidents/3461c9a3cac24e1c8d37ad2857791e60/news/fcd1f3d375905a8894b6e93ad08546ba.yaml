title: Yemen's Houthis claim attack on Riyadh financial district, Aramco skyscraper damaged
body: Yemen's Houthis on Sunday claimed an attack on the financial district of the Saudi capital Riyadh, with eyewitnesses saying they saw damage to a skyscraper belonging to oil giant Aramco. Aramco facilities and infrastructure have been repeatedly struck by the Houthis in recent months, with tankers, refineries, storage areas and the company headquarters all targeted by the group.
