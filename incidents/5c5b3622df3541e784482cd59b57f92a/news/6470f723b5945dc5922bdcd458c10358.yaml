title: वानुआतु में भूकंप के झटके, घरों से बाहर निकले लोग - vanuatu earthquake magnitude more than 6 jolts at pacific island
body: वानुआतु में 6.5 तीव्रता का शक्तिशाली भूकंप आया, जिससे लोग अपने घरों से बाहर निकल आए। यूएसजीएस की रिपोर्ट के अनुसार, पोर्ट विला में भूकंप के जोरदार झटके महसूस किए गए।
