title: Jakarta international airport extends closure after Anak Krakatau eruption - Jakarta - The Jakarta Post
body: Eight airports halted operations over the weekend after ash was detected in their airspace, disrupting hundreds of flights and leaving more than 170,000 passengers stranded, according to the transport ministry.
