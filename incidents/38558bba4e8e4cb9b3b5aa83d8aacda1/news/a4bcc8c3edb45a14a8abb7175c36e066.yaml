title: New land formations linked to Anak Krakatau eruptions
body: JAKARTA - Anak Krakatau volcano in Indonesia expanded by 81 acres (33 hectares) after recent eruptions produced lava flows, while satellite imagery detected two new land formations nearby, the country’s Geology Agency said.
