title: Eight airports remain shut on Monday due to volcanic ash from Anak Krakatau - Archipelago - The Jakarta Post
body: Ash from Anak Krakatau, which sits halfway between Java and Sumatra islands, has blanketed Jakarta and several surrounding areas since it erupted late on Friday, leading to the closure of the airports for safety reasons.
