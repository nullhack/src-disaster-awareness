title: '''No signs of life'' Indonesia calls off search for eight missing, including five journalists, near Anak Krakatau volcano'
body: Indonesian authorities have ended the search for eight people, including five journalists, who went missing near the Anak Krakatau volcano after rescuers found no trace of their boat or passengers.
