title: Indonesia reopens Jakarta airports after Anak Krakatau ash disrupts 2,961 flights
body: Indonesia has reopened Jakarta’s main airport and four others after volcanic ash from Anak Krakatau disrupted nearly 3,000 flights and affected about 341,000 travellers. The airports had been closed after eruptions from the volcano, in the Sunda Strait between Java and Sumatra, sent ash over Jakarta and nearby areas from Friday. Soekarno-Hatta International Airport, Indonesia’s
