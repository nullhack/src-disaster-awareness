title: Dozens of Dutch travellers stranded in Indonesia following volcanic eruption
body: Dozens of Dutch travellers are stranded in Indonesia after Jakarta’s international airport closed Sunday morning because of a volcanic eruption. This was confirmed by a spokeswoman for the travel industry association ANVR following initial reporting by De Telegraaf."Passengers from the canceled flights are being rebooked on the first available flight,” a KLM spokesperson said.
