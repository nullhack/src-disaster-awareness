title: 'Natural Disaster Alert: Mt. Anak Krakatau Eruption September 6, 2026'
body: 'Location: Mt. Anak Krakatau Event: Volcanic eruption causing temporary airport closures On the evening of September 5, 2026, Mt. Anak Krakatau erupted causing ash clouds. Soekarno Hatta Airport and Halim Airports are temporarily closed until 9:30 am, and Lampung Airport until 10:00 am, September 6. Passengers are advised to regularly check their flight status and contact their respective airlines directly to obtain the latest information.Mt. Anak Krakatau is located in the Sunda Strait between the islands of Java and Sumatra.'
