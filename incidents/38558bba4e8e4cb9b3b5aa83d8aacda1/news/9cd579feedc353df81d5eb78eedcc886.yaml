title: Indonesia’s Anak Krakatau eruption halts flights, schools, fishing
body: Volcanic ash from Mount Anak Krakatau disrupts hundreds of flights around Jakarta, while schools suspend activities and fishermen stay ashore as authorities warn of continued hazards.
