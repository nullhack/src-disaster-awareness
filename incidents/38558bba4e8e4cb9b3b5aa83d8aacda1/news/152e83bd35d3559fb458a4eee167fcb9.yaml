title: Seven Indonesian airports remain shut due to volcanic ash from Anak Krakatau - BusinessWorld Online
body: TANGERANG, Indonesia — Seven Indonesian airports, including two serving Jakarta, remained closed on Monday because of volcanic ash from eruptions at Mount Anak Krakatau as more than 270,000 travelers were affected by flight cancellations and delays, the transport minister said. Ash from Anak Krakatau, which sits halfway between Java and Sumatra islands, has blanketed Jakarta […]
