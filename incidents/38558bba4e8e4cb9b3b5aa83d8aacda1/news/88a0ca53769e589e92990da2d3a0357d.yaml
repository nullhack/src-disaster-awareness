title: Two new island-like landforms detected near Indonesia's Anak Krakatau
body: 'JAKARTA: Two small island-like landforms have appeared near Anak Krakatau in the Sunda Strait after about 25 hours of continuous eruptions earlier this month, with satellite imagery also showing the volcano itself has grown by nearly 33 hectares.'
