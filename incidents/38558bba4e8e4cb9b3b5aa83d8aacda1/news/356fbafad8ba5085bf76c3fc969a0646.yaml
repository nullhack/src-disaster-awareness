title: Indonesia Cancels Flights at Jakarta Airport, Others as Anak Krakatau Volcano Erupts
body: Indonesia’s Anak Krakatau volcano erupted early Sunday, prompting the cancellation of all flights at Jakarta’s Soekarno-Hatta International Airport and disrupting other domestic airports as volcanic ash drifted across parts of western Indonesia. Indonesia’s Geological Agency said the volcanic island located in Indonesia’s Sunda Strait between the main Java and Sumatra islands had showed signs of activity since Friday before erupting for 30 seconds at 3:53 a.m. Sunday. Closed-circuit camera footage showed lava flares from the volcano.
