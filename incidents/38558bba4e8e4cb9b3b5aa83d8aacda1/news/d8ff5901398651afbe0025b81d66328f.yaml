title: Javan rhinos survive eruption in Indonesia, but single habitat leaves species vulnerable
body: Indonesia’s critically endangered Javan rhinos appear to be safe despite an ongoing eruption of Mount Anak Krakatau near their last remaining habitat, conservation authorities said. Ardi Andono, head of Ujung Kulon National Park, home to the world’s only wild population of Javan rhinos (Rhinoceros sondaicus), said on Sept. 7 that the rhinos’ habitat had been […]
