title: AirAsia resumes flights impacted by the Mount Anak Krakatau volcanic eruption — AirAsia Newsroom
body: AirAsia has resumed operations to and from the affected destinations following the eruption of Mount Anak Krakatau in Indonesia's Sunda Strait, which had caused volcanic ash clouds and posed a significant threat to safe aircraft operations in the vicinity of volcanic clouds.
