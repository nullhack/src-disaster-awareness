title: Indonesia's Anak Krakatau eruption halts flights, schools, fishing
body: An eruption of Indonesia's Mount Anak Krakatau caused eight airports to suspend flight operations on Sunday, affecting hundreds of flights at Jakarta's main airport, after some school activities and fishing were halted.
