title: Jakarta airport and others reopen after volcanic ash crisis
body: 'JAKARTA: Indonesia''s main airport and several other air travel hubs reopened early Tuesday (Sept 8) after days of closure due to ash from a volcanic eruption, the Transport Ministry said.'
