title: Four Indonesian volcanoes record 13 eruptions as activity continues
body: 'JAKARTA: Four Indonesian volcanoes, including Anak Krakatau, recorded at least 13 eruptions on Thursday (Sept 10) as volcanic activity continued across the archipelago, with ash from one volcano keeping an airport in East Nusa Tenggara closed.'
