title: Flights to and from Indonesia’s capital resume after volcanic eruption forced a 2-day closure
body: Flights to and from Indonesia’s capital of Jakarta have resumed after ash from a volcanic eruption forced a two-day closure that halted nearly 3,000 flights. The transportation minister said Soekarno-Hatta International Airport and Halim Perdanakusuma Airport serving Jakarta reopened early Tuesday. Six others that closed during the eruption of Anak Krakatau have also resumed operations. The continuous eruption with lava fountains and loud booms ended Sunday but the volcanic island remained active Tuesday morning. The airport closures Sunday and Monday affected about 341,000 passengers.
