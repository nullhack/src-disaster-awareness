title: Seven Indonesian airports remain shut due to volcanic ash from Anak Krakatau
body: TANGERANG, Indonesia, Sept 7 (Reuters) - Seven Indonesian airports, including two serving Jakarta, remained closed on Monday morning because of volcanic ash from eruptions at Mount Anak Krakatau, the transport minister said.
