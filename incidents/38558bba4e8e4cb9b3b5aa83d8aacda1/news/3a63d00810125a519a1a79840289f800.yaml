title: 'VIDEO: Lava fountains, booming sounds heard after Indonesia''s Anak Krakatoa volcano erupts; over 200 flights grounded'
body: After ash from the volcano was detected in the airspace surrounding Soekarno-Hatta International Airport, officials announced a suspension of operations from 01:30 am Sunday (Saturday 1830 GMT).
