title: Anak Krakatau eruption shuts Jakarta airspace, hits 467 flights
body: Anak Krakatau erupted on Sunday, spreading ash over western Indonesia and disrupting flights. Authorities kept airports and airlines on alert as the active volcano showed signs of sustained unrest.
