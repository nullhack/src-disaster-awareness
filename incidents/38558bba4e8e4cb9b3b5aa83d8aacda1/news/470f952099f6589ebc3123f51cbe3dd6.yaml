title: AI-generated video falsely linked to Indonesia volcano eruption in September 2026
body: Indonesia's Mount Anak Krakatau erupted multiple times in September 2026, spewing fountains of lava and plumes of volcanic ash, but a video circulating on social media purportedly showing the recent eruption is AI-generated.
