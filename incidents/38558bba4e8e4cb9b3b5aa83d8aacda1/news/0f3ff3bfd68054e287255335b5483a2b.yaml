title: Indonesia's Anak Krakatau volcano erupts violently, sends ash 15 kms high and shuts down three airports
body: The blast forced the closure of three major airports and triggered aviation warnings across two flight regions. Officials confirmed the volcano poses no tsunami risk despite its history of deadly collapses.
