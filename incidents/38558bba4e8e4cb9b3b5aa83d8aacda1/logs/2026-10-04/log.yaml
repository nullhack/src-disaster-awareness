summary: Indonesia’s Geology Agency confirmed that Mount Anak Krakatau expanded by 33 hectares due to recent eruptions and that satellite imagery detected two new land formations nearby. A fact‑check article clarified that stranded fish on a beach are unrelated to the volcanic activity, while a separate report highlighted that the Javan rhino population, which lives in a single coastal park, remains vulnerable after the eruption.
