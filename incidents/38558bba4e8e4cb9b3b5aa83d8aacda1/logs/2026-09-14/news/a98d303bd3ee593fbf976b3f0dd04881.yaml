title: Volcanic island in Indonesia erupts, canceling hundreds of flights and stranding thousands
body: Indonesia’s Anak Krakatau volcano has erupted, causing flight cancellations at Jakarta's Soekarno-Hatta International Airport and stranding about 170,000 passengers in the region
