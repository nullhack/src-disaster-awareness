title: Volcanic island in Indonesia erupts, canceling hundreds of flights and stranding thousands
body: Indonesia’s Anak Krakatau volcano has erupted, causing flight cancellations at Jakarta's Soekarno-Hatta International Airport and stranding about 170,000 passengers in the region. The eruption happened early Sunday with volcanic ash affecting parts of western Indonesia. Indonesia’s Geological Agency reported that the volcano showed signs of activity since Friday, before the eruption. No casualties were reported, but authorities warned residents to stay at least 3 kilometers, or 2 miles, from the crater. Thousands of passengers were affected as airspace around several airports was closed. Indonesia’s Directorate General of Civil Aviation is closely monitoring the situation. The volcano remains active with officials evaluating the situation.
