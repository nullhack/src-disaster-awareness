log_date: '2026-10-10'
summary: Mount Anak Krakatau erupted on Friday afternoon, emitting an ash column 250 meters high and producing lava fountains and booming sounds. Ash detected near Jakarta's Soekarno-Hatta Airport forced a suspension of operations from early Sunday, grounding over 200 flights, and authorities warned the public to keep a 2 km distance from the volcano.
