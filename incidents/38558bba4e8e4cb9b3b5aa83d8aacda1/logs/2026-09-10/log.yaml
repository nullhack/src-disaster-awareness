log_date: '2026-09-10'
summary: As of September 10, rescuers continued searching for a speedboat carrying eight people—five journalists, two crew, and a guide—who went missing on September 9 while heading to Anak Krakatau to report on the eruption, after the search was previously paused due to high waves and poor visibility. Meanwhile, Anak Krakatau's intermittent eruption persisted, with officials noting it remained ongoing days after the initial activity.
