title: Volcanic eruptions take toll on economy - Economy - The Jakarta Post
body: Indonesian authorities currently categorize six volcanoes as alert level 3, which signifies an increase in volcanic activity whereby eruptions may occur, just one step shy of the final level that describes a high likelihood of an imminent, substantially more dangerous eruption.
