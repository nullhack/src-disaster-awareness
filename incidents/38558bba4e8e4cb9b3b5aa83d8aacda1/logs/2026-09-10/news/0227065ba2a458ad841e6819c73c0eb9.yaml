title: Search resumes for missing Indonesian journalists on volcano mission
body: 'JAKARTA: Indonesian rescuers resumed on Wednesday (Sept 9) their search for a missing speedboat carrying eight people, including five journalists sent to cover a volcanic eruption, the Basarnas rescue agency said.'
