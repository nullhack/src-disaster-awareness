log_date: '2026-09-09'
summary: |-
  Mount Anak Krakatau erupted again early Wednesday (Sept 9), with ash spreading over parts of Lampung Bay, as volcanic activity continued in the Sunda Strait. A search operation was launched after a speedboat carrying five journalists reporting on the volcano lost contact near the eruption site. The ash from the ongoing eruptions was reported by MetMalaysia to potentially reach Malaysia, though the risk remained low, while NASA Earth Observatory published satellite imagery documenting the powerful eruption that lofted ash into the atmosphere.
  On September 9, the search for eight missing people—five journalists, two boat crew, and a guide—continued after their speedboat lost contact near Anak Krakatau. The search had been paused due to high waves and poor visibility. Meanwhile, volcanic ash from Anak Krakatau and other volcanoes affected parts of Indonesia, with authorities monitoring the ongoing eruption and ash dispersal.
