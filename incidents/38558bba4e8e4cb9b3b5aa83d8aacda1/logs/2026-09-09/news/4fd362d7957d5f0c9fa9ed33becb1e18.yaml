title: Years-old footage falsely shared as Indonesia volcano eruption in September 2026
body: Mount Anak Krakatoa in Indonesia erupted in September 2026, spreading volcanic ash more than 150 kilometres away, but a video circulating online showing a volcano is not linked to the eruption. The clip was originally uploaded to YouTube by a volcano photographer and shows the same volcano erupting in October 2018.
