title: Eight missing after speedboat carrying journalists heads to erupting Anak Krakatau
body: PANDEGLANG, Indonesia — 9 September 2026, A search is underway Wednesday for eight people, including five journalists, who went missing after a speedboat travelled towards Indonesia’s erupting Mount Anak Krakatau to cover the volcanic activity. The missing group comprises five journalists, two boat crew members and a guide, according to Indonesian authorities and international media
