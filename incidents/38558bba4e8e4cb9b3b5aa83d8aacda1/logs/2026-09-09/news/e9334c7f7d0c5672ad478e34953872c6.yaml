title: Indonesia's Anak Krakatau erupts again, ash spreads over part of Lampung Bay
body: 'JAKARTA: Mount Anak Krakatau erupted again early Wednesday (Sept 9) as volcanic activity continued in Indonesia''s Sunda Strait following recent eruptions that disrupted air travel across parts of western Indonesia.'
