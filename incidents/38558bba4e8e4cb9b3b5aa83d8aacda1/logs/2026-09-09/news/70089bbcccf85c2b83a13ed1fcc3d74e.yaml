title: Indonesia's Anak Krakatau Eruption Halts Flights, Schools, Fishing
body: JAKARTA, Sept 6 (Reuters) - Indonesia's Soekarno-Hatta international airport suspended flight operations until 9:30 a.m. (0230 GMT) on Sunday due to volcanic ash from the ongoing eruption of Mount Anak Krakatau, Jakarta's main airport posted on Instagram.
