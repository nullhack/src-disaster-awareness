title: Anglers capture dramatic footage of Anak Krakatau volcano eruption in Indonesia
body: Indonesia’s Anak Krakatau volcano erupted early Sunday, forcing the cancellation of flights at Jakarta’s Soekarno-Hatta International Airport and disrupting services at other airports as volcanic ash spread across western Indonesia.
