title: AirAsia flights impacted by the Mount Anak Krakatau volcanic eruption — AirAsia Newsroom
body: The continuous eruption of Mount Anak Krakatau in the Sunda Strait, Indonesia has resulted in extensive volcanic ash clouds expected to affect airspace within the region. Volcanic ash poses a significant threat to safe operations of the aircraft in the vicinity of volcanic clouds.
