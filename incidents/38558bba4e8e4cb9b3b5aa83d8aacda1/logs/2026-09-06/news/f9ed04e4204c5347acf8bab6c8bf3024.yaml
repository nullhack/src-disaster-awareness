title: Soekarno-Hatta airport suspends operations after volcanic eruption - Society - The Jakarta Post
body: Mount Anak Krakatau erupted on Saturday, producing a fountain of lava and booming sounds that could be heard up to 700 kilometres (435 miles) away, the geology agency said in a statement.
