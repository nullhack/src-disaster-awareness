title: Mount Anak Krakatau Volcanic Ash Forces Temporary Closure of Soekarno-Hatta Airport
body: Volcanic ash from Mount Anak Krakatau forced Soekarno-Hatta Airport to close temporarily, disrupting 33 flights on domestic and international routes.
