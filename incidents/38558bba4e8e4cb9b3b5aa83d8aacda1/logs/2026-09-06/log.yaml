log_date: '2026-09-06'
summary: Mount Anak Krakatau erupted starting around September 5-6, 2026, sending volcanic ash up to 15 kilometers high and forcing the temporary closure of multiple airports, including Jakarta's Soekarno-Hatta International Airport. The eruption disrupted hundreds of flights, with major airlines like Singapore Airlines and Emirates canceling or delaying services, while authorities confirmed no tsunami risk.
