log_date: '2026-09-15'
summary: Indonesian rescuers extended the search for eight people—including five journalists—who went missing a week ago near Mount Anak Krakatau while covering the eruption, with operations continuing in the waters between Java and Sumatra. Separately, social media posts resurfaced old footage of a Guatemala volcanic eruption, falsely presenting it as footage of the Anak Krakatau eruption, though this is not new information about the volcanic activity itself.
