title: 'Mount Anak Krakatau: What to know about the volcano disrupting Indonesia flights'
body: 'SINGAPORE: A series of eruptions at Indonesia''s Mount Anak Krakatau since Friday (Sept 4) have disrupted flights and daily life as volcanic ash spread more than 150km away, blanketing Jakarta and nearby areas.'
