title: Indonesia’s volcanic eruption halts flights, schools, fishing | CNN
body: An eruption of Indonesia’s Mount Anak Krakatau caused the suspension of hundreds of flights at Jakarta’s main airport on Sunday after some school activities and fishing were halted.
