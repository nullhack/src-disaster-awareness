title: 'Indonesia eruption disrupts 300 flights: Strange Tonga signal that could change tsunami warnings'
body: Indonesia’s volcanic ash disrupted hundreds of flights while research into the 2022 Tonga eruption offers fresh clues about tsunami warnings. Scientists say underwater acoustic signals could eventually help detect dangerous volcanic collapses before waves reach vulnerable coastlines.
