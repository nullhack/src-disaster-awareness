title: Mount Anak Krakatau’s latest eruption disrupts flight | TTG Asia
body: Indonesia temporarily shut eight airports on Sunday as volcanic ash from Mount Anak Krakatau spread across parts of Java and Sumatra, disrupting flights at Soekarno-Hatta International Airport and several other gateways.
