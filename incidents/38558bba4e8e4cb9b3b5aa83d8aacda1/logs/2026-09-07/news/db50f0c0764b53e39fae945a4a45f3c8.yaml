title: Four more Indonesian airports closed as volcanic ash disrupts flight operations
body: 'JAKARTA: Four more airports in Indonesia were temporarily closed on Sunday (Sept 6) as volcanic ash from Anak Krakatau continued to spread, further disrupting flight operations and bringing the total number of affected airports to five.'
