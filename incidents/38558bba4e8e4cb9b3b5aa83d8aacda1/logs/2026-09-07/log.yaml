log_date: '2026-09-07'
summary: The Anak Krakatau eruption continued, with eight Indonesian airports—including two serving Jakarta—remaining closed as of Monday, stranding approximately 170,000 passengers and disrupting hundreds of flights. Authorities reported the 25-hour continuous eruption had ended, but the volcano remained on alert, while schools in Jakarta shifted to online learning and fishing activities were suspended due to ash hazards.
