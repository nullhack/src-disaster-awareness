log_date: '2026-10-09'
summary: Mount Anak Krakatau's alert status was elevated to 'Watch' (Level III) after having been lowered to 'Caution' three weeks earlier, signaling intensified eruptions. Reports also continue to note the appearance of two new island-like landmasses near the volcano in the Sunda Strait. The Indonesian President praised the military's disaster response, and the tourism minister expressed confidence in sector growth despite volcanic disruptions.
