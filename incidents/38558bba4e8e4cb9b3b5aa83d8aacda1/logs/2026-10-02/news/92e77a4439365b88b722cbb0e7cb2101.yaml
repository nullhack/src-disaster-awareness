title: Indonesia’s Anak Krakatau volcano spawns two new islands after eruption, first since 1930
body: Two new islands have emerged off Anak Krakatau volcano in Indonesia after a 25-hour eruption, marking the first such event in nearly a century. Read more at straitstimes.com.
