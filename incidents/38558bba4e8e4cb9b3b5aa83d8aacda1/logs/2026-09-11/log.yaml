log_date: '2026-09-11'
summary: Indonesia has stepped up tsunami preparedness as Anak Krakatau remains on the second-highest alert level, including a tsunami contingency plan for South Lampung. Across the archipelago, four volcanoes including Anak Krakatau recorded at least 13 eruptions on Sept 10, while conservation authorities said Javan rhinos in Ujung Kulon National Park appear safe. The ongoing eruptions are also raising concerns about possible impacts on the upcoming FIFA ASEAN Cup.
