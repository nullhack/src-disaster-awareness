log_date: '2026-09-08'
summary: By Tuesday, September 8, Jakarta’s Soekarno-Hatta and Halim Perdanakusuma airports had reopened after a two-day closure, along with four to six other airports, allowing flights to resume gradually, though some international carriers like Emirates, Etihad, and flights from the UAE/GCC remained disrupted. The eruption’s impact grew to roughly 2,961 flights grounded and up to 341,000 passengers stranded across eight airports, while Indonesian authorities ordered airlines to offer refunds/rescheduling and conducted volcanic ash tests every 30 minutes, with weather modification operations planned to clear ash.
