title: Volcano erupts in Indonesia | Arkansas Democrat Gazette
body: JAKARTA, Indonesia -- A volcano erupted in Indonesia early Sunday, prompting the cancellation of all flights at Jakarta's Soekarno-Hatta International Airport and disrupting other domestic airports as ash drifted across western parts of the country.
