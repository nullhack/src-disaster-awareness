title: Five media personnel lose contact while covering Mount Anak Krakatau eruption in Indonesia
body: 'JAKARTA: (Bernama) Five Indonesian media personnel reportedly lost contact while covering the eruption of Mount Anak Krakatau near Sebesi Island, Lampung, southern Sumatra, not far from the volcano, today.'
