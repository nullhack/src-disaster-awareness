title: Volcanic ash leaves 170,000 travelers stranded at eight Indonesian airports | CNN
body: Eight Indonesian airports, including two serving Jakarta, remained closed early on Monday morning because of volcanic ash from eruptions at Mount Anak Krakatau, the transport minister said.
