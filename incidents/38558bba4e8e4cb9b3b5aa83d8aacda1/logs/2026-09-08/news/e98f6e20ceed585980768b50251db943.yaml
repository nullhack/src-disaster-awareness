title: 'Indonesia''s ''Ring of Fire'': Key facts about the world''s most volcanic nation'
body: The latest eruptions of Indonesia's Mount Anak Krakatau disrupted air travel, affecting more than 270,000 people, and underscored the threat posed by the Southeast Asian country's more than 100 active volcanoes - the highest number of any country in the world.
