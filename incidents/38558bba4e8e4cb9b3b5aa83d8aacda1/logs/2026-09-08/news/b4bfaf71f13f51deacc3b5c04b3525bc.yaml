title: Big Indonesian volcano eruption triggers flight cancellations, including Qantas services
body: The eruption of Mount Anak Krakatau, an active volcano in Indonesia's Lampung province, has led to flight cancellations across the country, especially at the nation's main gateway, Jakarta’s Soekarno-Hatta International Airport.
