log_date: '2026-09-23'
summary: A body of a missing speedboat crew member was found 345 km away as the search for the five journalists and two other crew members missing near Mount Anak Krakatau continues. Separately, new land has emerged between Anak Krakatau Island and Sertung Island, believed to have formed from accumulated volcanic material, sparking speculation of a "grandchild" of Krakatau. Additionally, an AI-generated clip falsely depicting the eruption has been circulating online, prompting fact-checking by AFP.
