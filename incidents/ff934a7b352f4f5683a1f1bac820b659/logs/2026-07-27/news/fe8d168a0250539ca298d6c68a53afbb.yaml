title: Southern China faces torrential rain, floods after Typhoon Noul makes landfall
body: Flash floods are expected in parts of Jiangxi, Hunan, Guangdong, Sichuan, Shaanxi, Gansu and southeastern Xinjiang from Sunday evening through Monday evening.
