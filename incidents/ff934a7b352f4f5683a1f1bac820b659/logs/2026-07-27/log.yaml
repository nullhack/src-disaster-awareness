log_date: '2026-07-27'
summary: Typhoon Noul, the strongest storm to hit China this year, made landfall in southern China on July 26, 2026, bringing strong winds and heavy rain. The storm triggered the relocation of over 700,000 people in Guangdong and prompted emergency relief efforts. Authorities warned of flash floods across several provinces including Jiangxi, Hunan, and Sichuan.
