log_date: '2026-08-18'
summary: A large wildfire ignited in the High Fens nature reserve in eastern Belgium (Liège province) around August 14, 2026, destroying approximately 3,000 hectares (12 square miles) of land. Firefighters from Belgium, Germany, Luxembourg, and the Netherlands battled the blaze, which threatened to spread into Germany and prompted partial evacuations in the border town of Monschau. Rain on August 17 brought some relief, slowing the fire's advance towards the German border.
