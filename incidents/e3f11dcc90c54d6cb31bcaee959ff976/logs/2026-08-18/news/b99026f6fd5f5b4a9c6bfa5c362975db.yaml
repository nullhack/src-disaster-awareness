title: Wildfires battled in Belgium, Greece | Arkansas Democrat Gazette
body: BAELEN, Belgium -- Firefighters battled a sweeping wildfire that scorched a nature reserve in eastern Belgium and another on a Greek island near Athens where two people were killed on Sunday as hot and dry conditions fueled fires across parts of Europe.
