log_date: '2026-08-20'
summary: The European Union deployed three helicopters and two water bombers to assist Belgian firefighters battling the record wildfire, as the blaze forced partial evacuations in the German border town of Monschau. Despite rain on August 17 providing some relief, the fire continued to threaten the German border. By August 18, firefighters reported they had "encircled" the wildfire, though the situation remained complicated.
