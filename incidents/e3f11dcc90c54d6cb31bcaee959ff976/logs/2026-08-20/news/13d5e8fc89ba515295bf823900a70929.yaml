title: Rainfall offers new hope in fight against Belgium's biggest wildfire
body: HIGH FENS NATIONAL PARK, Belgium, Aug 17 (Reuters) - Rain started falling on Monday morning over eastern Belgium, bringing crucial help to firefighters who have been battling to contain Belgium's biggest ever wildfire which has threatened to reach the German border.
