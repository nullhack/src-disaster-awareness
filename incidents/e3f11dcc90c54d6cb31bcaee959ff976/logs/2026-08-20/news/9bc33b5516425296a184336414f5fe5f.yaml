title: German authorities order partial evacuation of border town due to fire
body: DUSSELDORF, 17th August, 2026 (WAM) -- Due to the massive forest fire in eastern Belgium, German authorities have ordered a precautionary evacuation in parts of the border town of Monschau in North Rhine-Westphalia state in western Germany.
