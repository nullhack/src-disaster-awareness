title: Wildfires expose — and detonate — buried bombs and mines from WWI and WWII
body: Some of the weapons have exploded in the intense heat. Blasts have been reported in France, Belgium, Germany and the Netherlands, where a bomb-disposal team was dispatched to check a forest threatened by flames near a site of fierce fighting in the Limburg province in 1944.
