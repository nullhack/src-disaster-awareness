title: Wildfires expose bombs left over from world wars | Arkansas Democrat Gazette
body: 'ELSENBORN, Belgium -- The wildfires burning across Europe this summer have exposed a potentially deadly threat lurking beneath the blackened landscape: rusty bombs and mines from World War I and II that threaten crews responding to the flames.'
