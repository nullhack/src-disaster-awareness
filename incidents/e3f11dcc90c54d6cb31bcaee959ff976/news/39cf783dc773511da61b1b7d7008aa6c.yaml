title: Wildfires expose — and detonate — buried bombs and mines from WWI and WWII
body: 'ELSENBORN, Belgium (AP) — The wildfires burning across Europe this summer have exposed a potentially deadly threat lurking beneath the blackened landscape: rusty bombs and mines from World War I and II that threaten crews responding to the flames. Some of the weapons have exploded in the intense heat. Blasts have been reported in France, […]'
