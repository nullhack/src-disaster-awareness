title: Belgium wildfire rages on despite rain as Greece swiftly contains airport blaze
body: Belgium's High Fens wildfire kept burning despite rain as Greece swiftly contained a new blaze near Athens airport. The fires underline Europe's heat-driven summer strain even as cooler weather brings partial relief.
