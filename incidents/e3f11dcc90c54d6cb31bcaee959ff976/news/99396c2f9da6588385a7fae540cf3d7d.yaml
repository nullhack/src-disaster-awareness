title: Record European fires burn over 500,000 hectares during summer
body: A record-breaking summer that saw more than 1,000 wildfires has torched some 540,000 hectares (1.3 million acres) of land across the European Union since mid-June, according to official data—an area more than twice the size of Luxembourg.
