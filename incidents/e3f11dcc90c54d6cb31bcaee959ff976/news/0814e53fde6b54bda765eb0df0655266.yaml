title: 'High Fens fire: drone footage shows damage to popular hiking area | VRT NWS: news'
body: Drone images show the extent of the damage to the countryside around the Signal de Botrange, Belgium’s highest point, caused by the wildfire in the High Fens nature reserve in Liège province.
