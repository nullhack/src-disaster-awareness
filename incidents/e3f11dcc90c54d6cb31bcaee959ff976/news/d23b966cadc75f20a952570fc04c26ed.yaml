title: EU Sends Aircraft, Villages Evacuated as Belgium Fights Record Wildfire
body: The European Union deployed three helicopters and two water bomber aircraft to tackle Belgium's biggest wildfire on record on Saturday, as local authorities told residents in some villages to leave their homes.
