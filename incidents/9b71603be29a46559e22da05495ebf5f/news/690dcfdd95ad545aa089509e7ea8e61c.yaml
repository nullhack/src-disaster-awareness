title: पापुआ न्यू गिनी में भूकंप के तेज झटके, जमीन से 114 किलोमीटर नीचे रहा केंद्र - strong earthquake tremors in papua new guinea
body: पापुआ न्यू गिनी में 6.1 तीव्रता का भूकंप आया, जिसका केंद्र जमीन से 114 किलोमीटर नीचे था। जर्मन रिसर्च सेंटर फॉर जियोसाइंसेज के अनुसार, अभी तक किसी जान-माल के नुकसान की खबर नहीं है।
