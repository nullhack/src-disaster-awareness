title: പാപ്പുവ ന്യൂഗിനിയയിൽ ഭൂചലനം; 6.12 തീവ്രത രേഖപ്പെടുത്തി
body: ഭൂനിരപ്പിൽ നിന്ന് 114 കിലോമീറ്റർ (70.84 മൈൽ) ആഴത്തിലാണ് പ്രകമ്പനമുണ്ടായത്. ശക്തമായ ഭൂചലനമാണ് അനുഭവപ്പെട്ടതെന്ന് ജർമ്മൻ റിസർച്ച് സെന്റർ ഫോർ ജിയോസയൻസസ് (GFZ) അറിയിച്ചു.
