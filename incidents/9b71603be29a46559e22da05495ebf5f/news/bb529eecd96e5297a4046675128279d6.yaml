title: Magnitude 6.4 earthquake rattles Papua New Guinea in latest Pacific Ring of Fire activity
body: A magnitude 6.4 earthquake has once again rattled the Pacific Ring of Fire — this time in Papua New Guinea. The earthquake struck at 9:17 a.m. UTC, and was felt across the island country.
