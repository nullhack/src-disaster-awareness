title: പാപ്പുവ ന്യൂഗിനിയിൽ ഭൂചലനം; റിക്ടർ സ്കെയിലിൽ 6.12 തീവ്രത രേഖപ്പെടുത്തി! | Express Kerala
body: പാപ്പുവ ന്യൂഗിനിയ മേഖലയിൽ ശക്തമായ ഭൂചലനം അനുഭവപ്പെട്ടു. റിക്ടർ സ്കെയിലിൽ 6.12 തീവ്രത രേഖപ്പെടുത്തിയ ഭൂചലനമാണ് ഉണ്ടായതെന്ന് ജർമ്മൻ റിസർച്ച് സെന്റർ ഫോർ ജിയോസയൻസസ് വ്യക്തമാക്കി. ഭൂമിക്കടിയിൽ 114 കിലോമീറ്റർ (70.84 മൈൽ) ആഴത്തിലാണ് പ്രകമ്പനം ഉണ്ടായത്. നിലവിൽ ആളപായമോ മറ്റ് വലിയ നാശനഷ്ടങ്ങളോ റിപ്പോർട്ട് ചെയ്യപ്പെട്ടിട്ടില്ല.
