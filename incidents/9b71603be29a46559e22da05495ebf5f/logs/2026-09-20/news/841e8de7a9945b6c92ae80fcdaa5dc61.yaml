title: 'പാപ്പുവ ന്യൂഗിനിയയിൽ ശക്തമായ ഭൂചലനം: 6.12 തീവ്രത രേഖപ്പെടുത്തി'
body: 'പോർട്ട് മോർസ്ബേ: പാപ്പുവ ന്യൂഗിനിയ മേഖലയിൽ ശക്തമായ ഭൂചലനം. റിക്ടർ സ്കെയിലിൽ 6.12 തീവ്രത രേഖപ്പെടുത്തിയ ശക്തമായ ഭൂചലനമാണ് അനുഭവപ്പെട്ടതെന്ന് ജർമ്മൻ റിസർച്ച് സെന്റർ ഫോർ ജിയോസയൻസസ് (GFZ) അറിയിച്ചു. 114 കിലോമീറ്റർ (70.84 മൈൽ) ആഴത്തിലാണ് ഭൂചലനം അനുഭവപ്പെട്ടത്. ആളപ...'
