log_date: '2026-09-20'
summary: A magnitude 6.4 earthquake struck 49 km NNE of Kainantu, Papua New Guinea on September 20, 2026, at a depth of 114 km. Initially reported as magnitude 6.1-6.12, it was later upgraded to 6.4, and was felt across the island country. No immediate casualties or damages have been reported.
