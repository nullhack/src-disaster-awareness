log_date: '2026-09-22'
summary: New reports confirm the M6.4 earthquake struck at 9:17 UTC on September 20, about 50-64 km northeast of Kainantu at a depth of ~104-114 km. The quake was felt by an estimated 386,000 people with moderate shaking, and no tsunami threat was issued. Authorities have not reported any casualties or damage as of yet.
