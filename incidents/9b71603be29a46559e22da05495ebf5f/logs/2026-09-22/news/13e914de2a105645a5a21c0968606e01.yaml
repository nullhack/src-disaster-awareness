title: Papua New Guinea Hit by Powerful 6.4 Magnitude Earthquake, 104km Deep Near Morobe Lae
body: A powerful 6.4 magnitude earthquake struck today (the 20th) at 6:17 PM KST, 136km northwest of Morobe Lae in Papua New Guinea. The quake's epicenter was located at a depth of 104km. South Korea's Meteorological Administration, citing international observation agencies, reported no immediate information regarding additional damage caused by the earthquake.
