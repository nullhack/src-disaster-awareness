title: Wild River Fire in New Hampshire spreads to 1,000 acres
body: A wildfire in steep terrain in the White Mountains approximately seven miles southeast of Gorham has expanded to 1,000 acres, according to the White Mountain National Forest. There are no known residential properties in the area.
