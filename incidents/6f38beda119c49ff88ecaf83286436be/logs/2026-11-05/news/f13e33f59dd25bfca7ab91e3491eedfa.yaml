title: Rangers fight seven New York wildfires as dry conditions raise concern | Fingerlakes1.com
body: Forest Rangers responded to seven wildfires that burned 11.5 acres across New York from Oct. 29 through Nov. 1, including a fire in Allegany County. The state Department of Environmental Conservation reported the fires in its Nov. 4 ranger roundup, which also detailed an emergency evacuation and an overnight search for a missing hunter in Fulton County.
