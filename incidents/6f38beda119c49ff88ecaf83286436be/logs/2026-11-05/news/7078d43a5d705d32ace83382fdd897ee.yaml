title: Wildfire rages in North Country, covering 370 acres - Concord Monitor
body: A wildfire that has covered more than 370 acres is burning in steep, remote terrain near the Maine border in Coos County. As of Tuesday there were no significant threats to life or property. The fire is approximately seven miles southeast of Gorham in the Wild River drainage area. On Tuesday afternoon it was reported […]
