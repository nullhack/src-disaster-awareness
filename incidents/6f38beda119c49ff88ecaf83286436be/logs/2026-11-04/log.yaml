log_date: '2026-11-04'
summary: Multiple wildfires were reported across the United States on November 4, 2026. A new fire called the Soda Fire ignited in Madera County, California, while the Wild River Fire in New Hampshire's White Mountain National Forest expanded to about 1,000 acres with only 11% containment. Smaller brush fires also burned in Girard Township, Pennsylvania, and Hanson, Massachusetts.
