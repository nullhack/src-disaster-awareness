title: Strong and shallow M6.4 earthquake hits southeast of Easter Island
body: A strong and shallow earthquake registered by the USGS as M6.4 hit southeast of Easter Island, Chile at 07:49 UTC on October 29, 2026. The agency is reporting a depth of 10 km (6.2 miles).
