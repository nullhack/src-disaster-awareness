  Advice: <p>WHO encourages all States Parties to the IHR to actively engage with the WHO IHR Contact Points in their respective WHO Regional Office for timely event-related communications, including by applying, to that effect, the decision instrument contained in Annex 2 of the IHR, intended to inform the decision by national authorities to notify WHO (Article 6) or to consult with WHO (Article 8).</p><p>As the etiology of the fatal illness remains undetermined, further investigation of available clinical specimens and epidemiological information should continue, as appropriate. Additional laboratory testing, including confirmatory testing by reference laboratories where needed, may assist in establishing the causative agent and refining the public health risk assessment.</p><p>Depending on seasonality and local epidemiology, States Parties may consider enhancing or strengthening community-based, event-based or sentinel surveillance for respiratory infections and strengthening testing
    capacities for respiratory pathogens. Public health authorities may also encourage uptake of recommended vaccinations against seasonal influenza, COVID-19, pneumococcal diseases and other vaccine-preventable respiratory infections as appropriate.</p><p>Given that the reported event involved a laboratory worker and that initial media reports suggested a possible occupational exposure or laboratory-related incident, WHO recalls the importance of maintaining robust biosafety, biosecurity, and infection prevention and control practices in laboratories handling potentially hazardous biological agents. This recommendation is precautionary in nature and does not imply that a laboratory-associated infection or incident has been confirmed in this event.</p><p>Should an occupational exposure to biological hazards occur among personnel working in laboratory settings, regardless of the specific role or the nature of the clinical outcome, WHO recommends strict adherence to appropriate biosafety,
    biosecurity and infection prevention and control measures in accordance with established protocols. These measures are intended to minimize the risk of occupational exposure to and unintended release of infectious agents and should be applied consistently as part of routine laboratory practice, without implying that a particular infection or clinical condition was necessarily acquired as a result of occupational exposure in the laboratory setting.</p><p>Based on the information currently available, WHO does not advise any restrictions on travel or trade related to this event. WHO will continue monitoring the situation and updating its recommendations as additional information becomes available.</p><p>&nbsp;</p>
  Assessment: <p>WHO&rsquo;s rapid risk assessment is a systematic and continuous process that characterizes the risk posed by a public health event and informs measures to reduce its impact and prevent international spread.</p><p>A key uncertainty for this event is the absence of a confirmed diagnosis in the deceased laboratory worker. According to information provided by the national authorities, testing did not identify plague or other tested high-threat pathogens, and the death has been classified as pneumonia of undetermined etiology. However, WHO has not received information identifying the causative agent responsible for the fatal illness. Given the absence of a confirmed diagnosis, WHO is not in a position to independently assess whether the duration of the reported monitoring period for contacts was sufficient to exclude all plausible causes of the fatal illness.</p><p>The occupational setting of the case remains an important consideration. The deceased individual worked at an institution
    that handles high-consequence pathogens, and precautionary public health measures were reportedly implemented because of the individual's professional activities. While the information provided by the authorities does not indicate infection with tested high-threat pathogens or identify additional linked cases, the source of the fatal illness remains undetermined. A laboratory-associated exposure therefore cannot be fully excluded at this stage.</p><p>Based on the information provided by NFP, WHO has not identified evidence of ongoing transmission associated with this event. However, confidence in the assessment remains limited by the absence of a confirmed etiological diagnosis, and the remaining uncertainty regarding the source and mode of exposure. Additional clinical, epidemiological and laboratory information, including confirmation of the diagnosis in the deceased laboratory worker, is required to improve confidence in the assessment. WHO will continue monitoring the situation and
    assess any potential public health implications as further information becomes available.&nbsp;</p><p>&nbsp;</p>
  Overview: '<p>On 2 October 2026, WHO became aware through media reports of the death of an employee of the Irkutsk APRI of Siberia and the Far East, Russian Federation. The individual died on 2 October following hospitalization for severe pneumonia on 29 September. </p><p>On 3 October, 5 October, 6 October and 7 October, WHO contacted the Russian Federation health authorities to verify the information reported by media including a purported second case&nbsp;and in accordance with Articles 9 and 10 of the International Health Regulations (2005) (IHR), WHO also asked for further information to assess the potential international public health implications in accordance with Article 6 of the IHR.&nbsp;</p><p>On 2 October, a public statement issued by the Irkutsk branch of Rospotrebnadzor (RPN), a federal agency that works to provide oversight and control of wellbeing and consumer rights and protection in the Russian Federation, indicated that a &ldquo;special sanitary-epidemiological expert
    commission&rdquo; had been convened for the suspected case of high-threat pathogen. Sanitary and epidemic control measures were put in place, including identifying contacts who were placed under medical observation. Russian Federation authorities stated at the time that all contacts were without symptoms and with negative laboratory results for high-threat pathogens. </p><p>On 6 October, WHO received a response to its verification request from the NFP of the Russian Federation, stating that no case of plague has been registered recently in Irkutsk Oblast, and confirming that an epidemiological investigation had been conducted following the identification of a case of severe pneumonia in an employee of the Irkutsk APRI. According to authorities, the individual initially presented with symptoms compatible with an acute respiratory viral infection. After testing negative for a number of high-threat pathogens, the patient was determined to have died from pneumonia of undetermined etiology.</p><p>Russian
    authorities informed WHO of the following: that preventive and control measures had been implemented in accordance with national sanitary legislation; that the widest possible range of contacts were identified, placed under medical observation and tested for high-threat pathogens, and that as of 9 October, no high-threat pathogens within the laboratory&rsquo;s research portfolio had been detected in any of the contacts, and their medical observation has been discontinued. The authorities further reported that no laboratory biosafety or biosecurity incidents had occurred at the institute, as determined by two independent investigations and stated that media reports suggesting otherwise were inaccurate.</p><p>According to the Russian Federation authorities, the situation continues to be monitored.</p><p>Following subsequent requests for information from WHO on 7 and 8 October, the NFP of the Russian Federation provided further information. According to their official report, the patient
    and all identified contacts were tested for a broad range of pathogens, including influenza, SARS-CoV-2, other respiratory infections, and bacterial infections (including plague and streptococcus). All results were reportedly negative for high-threat pathogens, and only two cases of COVID-19, three cases of rhinovirus, one case of <em>Haemophilus</em> spp., and other opportunistic infections were identified among contacts. The authorities further reported that the fatality was not due to plague infection, had been vaccinated against the high-threat pathogens with which the employee had worked occupationally. The report also stated that the individual had not travelled outside of Irkutsk Oblast during the two weeks prior to symptom onset. &nbsp;</p><p>WHO has offered support in the areas of high-threat pathogens and laboratory biosafety and biosecurity to the public health authorities in the Russian Federation.</p><p>In response to further information about the public health measures
    put in place, Russian Federation authorities reported that given the patient&rsquo;s occupation, precautionary public health measures were implemented, and a broad range of contacts were identified and placed under medical observation either in healthcare facilities or at home. Medical observation, including daily laboratory testing, was conducted for seven days and has been completed for all identified contacts. All contacts remained asymptomatic and tested negative for the pathogens under investigation.</p><p>The Russian Federation authorities informed WHO that, apart from the hospital where the case was admitted, no other healthcare facility was placed under quarantine or subjected to additional public health measures, contrary to media reports.</p>'
