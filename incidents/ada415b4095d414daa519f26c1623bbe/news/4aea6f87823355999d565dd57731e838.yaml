title: Russia plays down plague fears and denies lab accident, says scientist died of "pneumonia of unknown origin"
body: A Russian plague lab worker died of "pneumonia of unknown origin," officials say, in response to initial reports that she was exposed to the deadly bacteria during a lab accident.
