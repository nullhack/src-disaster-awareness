title: 'Q&A: Expert discusses Russian plague scare'
body: The reported death of 28-year-old laboratory technician Darya Shipilova at the Irkutsk Research Anti-Plague Institute in Shelekhov, Siberia, Russia, has raised questions about a possible exposure to pneumonic plague and prompted calls for greater transparency. Yersinia pestis is a gram-negative, rod-shaped bacterium that causes plague.
