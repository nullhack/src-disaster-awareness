title: Russia lifts Irkutsk quarantine after lab worker's death; cause still unnamed
body: As of October 8–9, 2026, Russian authorities say the quarantine and medical observation linked to the death of laboratory technician Darya Shipilova have ended, with no secondary cases and no dangerous pathogens found in nearly 5,000 samples. They still have not published a definitive cause of death. The World Health Organization continues to ask...
