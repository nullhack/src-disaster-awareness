log_date: '2026-10-11'
summary: |-
  New reports emerged of a second pneumonia illness linked to the Irkutsk lab worker's death, prompting the US and WHO to press Russia for more details and Russia to deny a second plague case. President Trump announced a scheduled call with President Putin to discuss the situation. Officials reported that no dangerous pathogens were found in nearly 5,000 samples related to the initial case.
  India alerted its national diagnostic laboratory network and state-level reference laboratories as a precaution after the lab worker's death in Russia. The WHO continues to stress laboratory safety and transparency, though no evidence of ongoing transmission has been reported.
