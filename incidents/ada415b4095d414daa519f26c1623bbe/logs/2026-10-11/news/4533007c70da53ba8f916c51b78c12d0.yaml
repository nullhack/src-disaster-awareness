title: OMS diz que causa da morte de funcionária de laboratório que estuda peste na Rússia segue desconhecida | G1
body: Funcionária morreu em 2 de outubro após desenvolver pneumonia grave. Autoridades russas fizeram mais de 5,5 mil testes e afirmam não ter encontrado agentes infecciosos de alto risco.
