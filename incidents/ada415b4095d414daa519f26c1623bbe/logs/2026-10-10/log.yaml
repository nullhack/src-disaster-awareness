log_date: '2026-10-10'
summary: A laboratory worker at the Irkutsk Research Anti-Plague Institute in Siberia died of pneumonia of unknown origin, leading authorities to quarantine a hospital and place nearly 200 contacts under medical observation. The World Health Organization confirmed no plague case was registered, and Russia ended the quarantine on October 8-9 after no secondary cases emerged, though the definitive cause of death remains undisclosed.
