title: Russia reports a worker at a Siberian plague institute got pneumonia from an unknown cause and died
body: Russian authorities have quarantined a hospital and are monitoring contacts of an employee at a plague research institute in Siberia who contracted pneumonia of an “unknown” cause. Local state TV said the woman died last week.
