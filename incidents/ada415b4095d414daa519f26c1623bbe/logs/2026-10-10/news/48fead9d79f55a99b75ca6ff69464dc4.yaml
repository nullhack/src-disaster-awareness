title: Dozens quarantined after researcher at Russian plague laboratory dies of ‘unknown’ infection | CNN
body: Dozens of people were reported to be in isolation after a Russian laboratory worker at an institute dedicated to studying the plague and other infectious diseases died of an undisclosed illness.
