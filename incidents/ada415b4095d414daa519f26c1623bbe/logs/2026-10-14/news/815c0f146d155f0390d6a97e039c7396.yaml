title: Does a Russian lab worker’s death carry pandemic risk? Experts say it's unlikely, with one caveat
body: Some details surrounding a Russian lab worker’s death of an unknown pneumonia parallel COVID-19 news that unfolded seven years ago, but health security experts say they don’t see signs this is a precursor to another pandemic.
