title: Russia says no epidemic risk as WHO pushes for transparency on plague lab death
body: Russia’s health watchdog said Wednesday there is no risk of an epidemic following the death of a laboratory worker at an anti-plague research institute in Siberia, even as the World Health Organization (WHO) made a plea for more information about the concerning episode.
