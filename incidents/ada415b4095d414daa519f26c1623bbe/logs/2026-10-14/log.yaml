summary: China's Hulunbuir city issued a plague risk alert after the Russian researcher's death, while Taiwan and Macau announced enhanced surveillance and border screening. New reports also linked RFK Jr. to funding a U.S. research project connected to the Russian plague lab, and a former CDC director suggested the secrecy may involve bioweapons. Locals expressed distrust of officials amid ongoing international pressure for transparency.
