title: 黑死病還存在！俄羅斯傳鼠疫引關注 專家揭「3 大發病型態」與關鍵防護｜元氣網
body: 俄羅斯傳出疑似鼠疫消息，官方稱未通報病例，接觸者檢驗未見高威脅病原體；病因待確認，臺灣自1948年未再有病例。
