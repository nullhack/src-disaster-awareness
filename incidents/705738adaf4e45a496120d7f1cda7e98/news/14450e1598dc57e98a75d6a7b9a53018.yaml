title: 5.7 magnitude earthquake shakes Japan, injuring at least 22
body: A strong magnitude earthquake shook central Japan early Sunday, leaving at least 22 people injured, according to local media. Japan's Meteorological Agency put the quake's magnitude at 5.7, while the U.S. Geological Survey reported it at magnitude 5.5. Smaller aftershocks were reported.
