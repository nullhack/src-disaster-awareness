title: 'Japan Earthquake: 6.1 Magnitude Quake Off Tokyo, No Tsunami'
body: A 6.1 magnitude earthquake struck off the coast of Tokyo on Friday evening, but Japanese authorities confirmed no tsunami alert was issued. The shallow quake occurred near Hasaki in the eastern Kanto region, a frequent seismic zone.
