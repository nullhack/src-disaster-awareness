title: 'Japan Earthquake 2026: 5.7 magnitude quake hits near mount Fuji, JMA warns of more tremors- Moneycontrol.com'
body: A 5.7 magnitude earthquake struck central Japan near Mount Fuji early on November 8, leaving at least 22 people injured. The JMA has warned residents about the possibility of further strong tremors.
