title: USGS logged a magnitude 6.1 earthquake 144 km southeast of Hasaki, Japan
body: A magnitude 6.1 earthquake struck at 10:39 UTC on Nov. 6, centered 144 km southeast of Hasaki, Japan, based on the U.S. Geological Survey's reviewed solution. The rupture began 29 km below the seafloor off the Pacific side of the Kanto region.
