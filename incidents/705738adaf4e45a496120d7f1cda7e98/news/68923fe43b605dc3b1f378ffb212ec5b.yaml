title: A 7.0-magnitude earthquake jolts Japan's Ogasawara Islands
body: 'TOKYO: An earthquake with a preliminary magnitude of 7.0 on Sunday (Oct 25) struck waters near the Ogasawara Islands in the Pacific Ocean, south of Tokyo, with no tsunami warnings issued, the Japan Meteorological Agency (JMA) said.'
