title: 'Japan earthquake: 6.0 magnitude tremors strikes Shima region'
body: A magnitude 6.0 earthquake occurred near Shima, Japan, on Sunday at around 3:45 AM local time. The earthquake's tremors were felt in parts of Fukushima Prefecture, reaching a level of 3 on the seismic-intensity scale. Meanwhile, the Japan Meteorological Agency confirmed the tremors but did not issue a tsunami warning. Authorities are currently assessing the situation for any potential damage or casualties.
