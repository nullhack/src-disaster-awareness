title: Japan मधील हासाकी येथे रिश्टर स्केलवर ६.१ तीव्रतेचा झाला शक्तिशाली भूकंप - www.marathi.hindusthanpost.com
body: जपानमधील (Japan) हासाकीच्या आग्नेयेला १५६ किमी अंतरावर ६.१ तीव्रतेचा भूकंप झाला. भूकंपाचा केंद्रबिंदू १० किमी खोल होता. त्सुनामीचा इशारा देण्यात आलेला नाही.
