title: 7.0 magnitude earthquake in Japan! Felt from exactly 1000 kilometers away
body: An earthquake of magnitude 7 occurred at a depth of 470 kilometers off the west of the Ogasawara Islands in Japan. The Japan Meteorological Agency (JMA) announced that there was no tsunami risk after the earthquake. According to the country's Japanese seismic intensity scale, the highest intensity was measured as 3 on the islands of Chichijima and Hahajima. The tremor was felt over a wide area from the Kanto region to the Tohoku region, including the capital Tokyo.
