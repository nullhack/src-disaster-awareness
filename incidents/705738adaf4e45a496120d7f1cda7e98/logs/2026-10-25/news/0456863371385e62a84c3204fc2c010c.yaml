title: జపాన్లో మరో భారీ భూకంపం.. 6.3 తీవ్రతతో ప్రకంపనలు.. భయాందోళనలో స్థానిక ప్రజలు!
body: జపాన్(Japan Earthquake)లోని బోనిన్ దీవుల సమీపంలో 6.3 తీవ్రతతో భారీ భూకంపం సంభవించగా, పసిఫిక్ 'రింగ్ ఆఫ్ ఫైర్' ప్రాంతంలో టెక్టానిక్ ప్లేట్ల కదలికలే ఈ ప్రకంపనలకు కారణమని అధికారులు తెలిపారు.
