title: Strong and deep M6.5 earthquake hits Bonin Islands, Japan region
body: A strong and deep earthquake registered by the USGS as M6.5 hit the Bonin Islands, Japan region at 02:09 UTC (11:09 LT) on October 25, 2026. The agency is reporting a depth of 492.4 km (306 miles).
