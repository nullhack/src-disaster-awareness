title: जापान के बोनिन द्वीप समूह में 6.5 तीव्रता का भूकंप, लोगों में दहशत
body: 'Japan Earthquake: जापान के बोनिन (ओगासावारा) द्वीप समूह में 6.5 तीव्रता का भूकंप दर्ज किया गया. भूकंप के बाद लोगों में दहशत फैल गई.'
