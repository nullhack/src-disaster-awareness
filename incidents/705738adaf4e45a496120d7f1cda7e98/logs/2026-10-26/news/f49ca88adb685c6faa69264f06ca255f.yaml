title: थरथराकर डोल गई धरती, समंदर से उठा 6.5 तीव्रता का भूकंप, घर छोड़कर सड़कों पर उतरे लोग
body: 'Japan Earthquake News: सुबह-सुबह एशियाई देश जापान की धरती कांप गई. अमेरिकी भूवैज्ञानिक सर्वेक्षण (USGS) के मुताबिक जापान की राजधानी टोक्यो से लगभग 1000 किलोमीटर दक्षिण-दक्षिणपूर्व में स्थित बोनिन द्वीप समूह में करीब 7 मैग्नीट्यूड का भूकंप आया है.'
