title: 'Japan: 6.5 magnitude earthquake hits Bonin Islands region'
body: According to some news reports, the epicenter of the earthquake was located somewhere in the ocean at a depth of 494 kilometres. So far no tsunami warning has been issued and there are no reports of any damage in the region.
