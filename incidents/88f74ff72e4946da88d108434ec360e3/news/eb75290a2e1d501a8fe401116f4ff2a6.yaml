title: दिवाली के दिन तीन जगह कांपी धरती, यवतमाल, तिब्बत और सोलोमन द्वीप में महसूस हुए भूकंप के झटके
body: सोलोमन द्वीप में आए इस भूकंप की तीव्रता तीनों में सबसे अधिक थी। 6.3 तीव्रता का भूकंप आमतौर पर तेज माना जाता है और इससे इमारतों को नुकसान पहुंचने की आशंका रहती है। हालांकि, वहां से भी जानमाल के नुकसान की कोई खबर सामने नहीं आई है।
