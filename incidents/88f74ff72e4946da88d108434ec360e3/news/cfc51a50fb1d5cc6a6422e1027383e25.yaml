title: 'Yavatmal Earthquake News: पृथ्वीच्या पोटात नेमकं चाललंय काय? यवतमाळसह जगातील तीन भागांत भूकंप'
body: देशासह जगातील तीन वेगवेगळ्या भागांमध्ये एकाच दिवशी भूकंपाचे धक्के जाणवले आहेत. महाराष्ट्रातील यवतमाळ, तिबेट आणि सोलोमन द्वीप येथे भूकंपाची नोंद करण्यात आली. विशेष म्हणजे, या तिन्ही ठिकाणांपैकी सोलोमन द्वीप येथे सर्वाधिक तीव्रतेचा भूकंप झाला.
