log_date: '2026-11-19'
summary: GeoNet recorded three magnitude 5-plus earthquakes in separate parts of New Zealand over a single weekend, according to NewstalkZB, framing the Hicks Bay-area quake as part of that sequence. Other items in the batch covered unrelated events, including a deep magnitude 6.2 earthquake beneath the Kermadec region and a magnitude 6.3 offshore quake on Wednesday. No casualty, damage or tsunami information specific to the Hicks Bay earthquake was reported.
