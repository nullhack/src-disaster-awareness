title: Magnitude 5.9 earthquake hits east coast of North Island in New Zealand, GFZ says
body: An earthquake measuring magnitude 5.9 struck off the east coast of New Zealand's North Island on Sunday, the German Research Centre for Geosciences (GFZ) said.
