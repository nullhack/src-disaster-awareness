summary: 'New reports detail ongoing recovery: the Barbados Defence Force deployed its third medical rotation to assist survivors, and All Hands & Hearts provides a three-month update on continued relief and long-term recovery work. A Venezuelan restaurant owner in the U.S. reflects on losing his parents in the earthquake, while an analysis examines how the disaster has deepened Venezuela''s loss of skilled professionals.'
