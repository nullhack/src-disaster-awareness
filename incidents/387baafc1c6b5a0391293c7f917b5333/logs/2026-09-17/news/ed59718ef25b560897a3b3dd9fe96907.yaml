title: Empty seats as schools reopen in Venezuela's quake-hit Guaira
body: Schools in Venezuela's quake-scarred coastal state of La Guaira were deserted on Tuesday, a day after the start of the new school year, with many parents opting to keep children home for fear of further deadly tremors.
