title: Teachers comfort pupils as school year starts in quake-hit Venezuela
body: A new school year has begun for students and teachers at a Catholic school in Caraballeda, a neighborhood severely impacted by the devastating June earthquakes in Venezuela that killed at least 6,500 people.
