log_date: '2026-07-31'
summary: |-
  A new report highlights a family displaced by the earthquakes seeking a fresh start in Maracaibo, far from the devastated coastal areas. An islander from Jersey has raised thousands for Venezuelan earthquake recovery, motivated by losing family members in the disaster. Meanwhile, Episcopal Relief & Development continues its support for humanitarian efforts through church partners.
  Venezuelan authorities have begun controlled demolitions of damaged buildings in the worst-hit state of La Guaira, as part of post-earthquake recovery. A turtle was rescued alive from the rubble more than a month after the disaster, and the United Nations, alongside the World Bank and other institutions, is preparing a reconstruction plan for the affected region. Experts continue to warn of mounting environmental and health risks for survivors and aid workers.
