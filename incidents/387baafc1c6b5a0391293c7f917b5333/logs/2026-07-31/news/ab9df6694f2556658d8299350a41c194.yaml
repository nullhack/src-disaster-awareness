title: Episcopal Relief & Development Supports Partners Responding to Humanitarian Needs After Earthquakes in Venezuela
body: Episcopal Relief & Development continues to work closely with the Episcopal Diocese of Venezuela, the Anglican Alliance and the ACT Alliance in response to the devastating twin earthquakes that struck the northwestern and central parts of the country on June 24.
