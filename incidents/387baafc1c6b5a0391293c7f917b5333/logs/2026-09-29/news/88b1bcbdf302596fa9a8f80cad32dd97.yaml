title: Kiwi engineers learn from Venezuela's devastating earthquakes
body: Last month, four New Zealand engineers flew to Venezuela to help in the aftermath of the devastating double quakes, which hit the western and central parts of the country in June, leaving more than 6000 people dead. Nearly 200 buildings collapsed in the quakes while more than 16-thousand structures were deemed unsafe. For the Kiwi engineers, it was a chance to learn about what New Zealand could do better, when it comes to earthquake resilience. University of Canterbury civil and environmental engineering Professor Santiago Pujol, director of the earthquake research centre, QuakeCore spoke to Ingrid Hipkiss.
