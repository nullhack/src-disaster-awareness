title: 5.5-magnitude earthquake strikes Chile after deadly twin quakes in Venezuela
body: A 5.5-magnitude earthquake struck Chile on Wednesday, the same day after two powerful quakes measuring 7.2 and 7.5 hit central Venezuela, killing at least 32 people and leaving hundreds injured.
