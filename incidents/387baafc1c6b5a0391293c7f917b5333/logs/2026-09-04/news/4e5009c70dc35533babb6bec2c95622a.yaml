title: Venezuela's main airport resumes operations at temporary terminals
body: Maiquetia International Airport, Venezuela's main airport serving Caracas, formally resumed commercial operations Tuesday at temporary terminals built after its original infrastructure was damaged by the June 24 earthquakes. Located about 20 km from the Venezuelan capital, the airport is in La Guaira state, the area hardest hit by the twin earthquakes that killed more than 6,000 people.
