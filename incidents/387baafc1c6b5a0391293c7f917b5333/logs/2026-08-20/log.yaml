log_date: '2026-08-20'
summary: |-
  United Airlines has delayed restarting its Houston-Venezuela direct flights because of the earthquakes. The U.S. Embassy is delivering equipment to help clear rubble and support the struggling local economy. The UNHCR provides an inside look at the ongoing humanitarian response on the ground.
  The Venezuelan government announced a new construction training program and began delivering houses to earthquake victims as part of long-term recovery efforts. Authorities also conducted a readiness drill at Maiquetía Airport, testing provisional terminals to reopen the main international hub damaged in the twin earthquakes. An Associated Press photographer reflected on documenting the devastation in both Venezuela and Colombia following the recent earthquakes.
