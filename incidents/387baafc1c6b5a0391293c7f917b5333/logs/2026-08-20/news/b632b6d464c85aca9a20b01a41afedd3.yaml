title: US providing equipment to Venezuela in effort to clean rubble, boost struggling economy
body: The U.S. Embassy in Venezuela is delivering much-needed equipment and supplies to a community still trying to recover from the deadly earthquakes in June as a shutdown airport continues to affect the local economy.
