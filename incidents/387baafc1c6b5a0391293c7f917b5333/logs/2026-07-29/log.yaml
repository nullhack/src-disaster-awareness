log_date: '2026-07-29'
summary: |-
  An 11-year-old miniature poodle named Beyli was rescued alive from earthquake rubble 29 days after the disaster, surviving against the odds. Researchers from a Pennsylvania university deployed snake-like robots to assist international search teams. Meanwhile, collection centers in Texas are overwhelmed with donations, and reports continue to highlight the staggering costs of rebuilding as the focus shifts from rescue to recovery.
  Public health experts warn that more than a month after the twin earthquakes, Venezuela faces a critical period to prevent secondary crises from contaminants, as survivors and aid workers battle dust, debris, and unsafe water. The country's weak health services and hazardous waste could trigger fresh health emergencies, with the coming weeks seen as pivotal.
  Public health experts warn that the coming weeks are critical to prevent secondary crises from contaminants, as survivors and aid workers battle dust, debris, and unsafe water in earthquake-affected areas. Search dogs from the Santa Paula National Disaster Search Dog Foundation, which trains year-round for such emergencies, were deployed to assist in Venezuela. Episcopal Relief & Development continues supporting partners responding to ongoing humanitarian needs.
