log_date: '2026-07-29'
summary: An 11-year-old miniature poodle named Beyli was rescued alive from earthquake rubble 29 days after the disaster, surviving against the odds. Researchers from a Pennsylvania university deployed snake-like robots to assist international search teams. Meanwhile, collection centers in Texas are overwhelmed with donations, and reports continue to highlight the staggering costs of rebuilding as the focus shifts from rescue to recovery.
