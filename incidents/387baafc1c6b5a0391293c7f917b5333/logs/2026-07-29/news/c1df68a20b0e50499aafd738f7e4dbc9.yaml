title: Waco woman struggles to send Venezuela earthquake donations as Texas collection centers overflow
body: Katherine Ocanto has been collecting donations for Venezuela earthquake victims said Texas collection centers are overwhelmed, preventing her from shipping the supplies she has gathered over the past month.
