title: Venezuela’s main airport resumes operations months after quakes - Jamaica Observer
body: CARACAS, Venezuela (AFP)—Venezuela&#039;s main airport near Caracas on Tuesday said it was resuming operations after sustaining damage in the powerful earthquakes that struck over two months ago. A flight operated by Venezuelan airline Conviasa to Mexico took off at 10 am (1400 GMT), read a statement from Simon Bolivar International Airport. Another flight operated by Global Crossing arrived at around 10:30 am, an airport official told AFP. The airport is...
