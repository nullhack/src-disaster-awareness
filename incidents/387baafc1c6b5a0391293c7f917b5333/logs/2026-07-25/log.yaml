log_date: '2026-07-25'
summary: |-
  New reports detail the use of snake robots from Carnegie Mellon to navigate earthquake rubble and aid rescue efforts in Venezuela. AP photos show families in La Guaira still searching for loved ones a month after the twin earthquakes, as crews continue rubble removal and search for bodies. An insurer's loss estimate of €25 million and an opinion piece on rebuilding capacity are also noted.
  One month after the twin earthquakes, more than 21,000 people remain displaced and living as refugees, while families continue holding vigils and searching collapsed buildings for missing loved ones. Coverage highlights the ongoing humanitarian crisis and Venezuela's inability to access $4 billion in gold reserves to aid recovery efforts.
