title: Venezuelans in the US still navigate the aftermath of deadly earthquakes, grieving and helping
body: Venezuelans in the U.S. are grappling with the aftermath of the devastating back-to-back earthquakes that struck north-central Venezuela on June 24, killing at least 6,500 people, with thousands more still missing.
