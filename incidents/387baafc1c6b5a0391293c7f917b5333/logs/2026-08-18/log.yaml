log_date: '2026-08-18'
summary: New reporting as of August 16-17 confirms the death toll from the June 24 twin earthquakes has risen to 6,438, with relatives and rescuers continuing to search for missing people nearly two months after the disaster. A benefit concert featuring Marc Anthony, Chayanne, and Luis Fonsi was held at Miami's Kaseya Center to raise funds for earthquake relief in both Venezuela and Colombia, while Pollo Campero announced a national fundraising day for August 25 to support victims. AP photos captured funerals for the Medina Alvarez family and other victims in La Guaira.
