title: Earthquake predictor who warned of deadly Colombia tremor issues dire California forecast
body: A geophysicist who predicted the Colombia earthquake has warned California is "in the crosshairs" of a huge tremor. Stefan Burns warned the Golden State could be next after a 7.4 magnitude hit El Cairo Monday and two struck Venezuela on June 24.
