title: 'A tale of two buildings: How quake rescue efforts differed in Colombia and Venezuela'
body: CALI, Colombia – At a flattened apartment block known as Los Cocos in northern Venezuela, civilians toiled with little support to pull the living and the dead from the rubble. In neighboring Colombia, when residential towers in Cali collapsed, officials poured in to help.
