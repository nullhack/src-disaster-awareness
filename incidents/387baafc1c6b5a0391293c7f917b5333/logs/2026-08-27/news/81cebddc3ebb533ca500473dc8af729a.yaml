title: Amid earthquake disaster in Venezuela, US stages talks between puppet government and right-wing opposition
body: The abject subservience of both sides of the table was summed up by the <em>Financial Times</em>, which reported that the government made no mention whatsoever of freeing former president Nicolás Maduro and his wife Cilia Flores from their US prison cells.
