title: Chris Martin to Perform with LA Phil at Venezuela Benefit at Hollywood Bowl - MyNewsLA.com
body: Coldplay singer Chris Martin will join Gustavo Dudamel and the LA Philharmonic at Sunday evening’s benefit concert at the Hollywood Bowl to raise funds for those affected by the recent earthquakes in Venezuela, officials announced Sunday. Martin joins a previously announced lineup of Beck, Eduardo Betancourt, Meme del Real of Cafe Tacvba, Adria Duque, GIVEON, […]
