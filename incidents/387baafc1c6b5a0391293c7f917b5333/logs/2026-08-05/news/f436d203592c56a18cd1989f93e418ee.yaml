title: Death toll from Venezuela’s twin earthquakes rises to 6,125 | Jefferson City News-Tribune
body: Venezuela's official death toll from the devastating twin earthquakes that struck the country's north-central region on June 24 has climbed to 6,125, according to a reconstruction bulletin released late Monday, as authorities reported continued progress in evaluating damaged homes while warning that thousands of residences remain unsafe more than five weeks after the disaster.
