title: 'Dog pulled alive from rubble of Venezuela earthquakes after being trapped for 29 days: ‘A miracle’'
body: A poodle trapped for 29 days in rubble after two earthquakes with a magnitude of more than 7.0 hit Venezuela just 39 seconds apart has remarkably been rescued.
