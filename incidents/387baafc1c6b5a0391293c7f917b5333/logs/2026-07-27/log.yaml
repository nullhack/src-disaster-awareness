log_date: '2026-07-27'
summary: |-
  As of July 26-27, new reporting highlights a deepening crisis of confidence in Venezuela's Misión Vivienda housing program, which collapsed in the quakes despite promises of safe homes for the poor. Relief efforts continue across South Florida and locally in La Guaira, where search and debris removal operations persist one month after the disaster. NASA-ISRO satellite data reaffirms that the ground shifted up to 60 cm in affected areas.
  A poodle was pulled alive from the rubble 29 days after the twin earthquakes, heralded as a miracle. In other developments, opinion pieces highlight Israel's humanitarian response, and a Venezuelan expatriate traveled from Maine to Caracas to assist with earthquake relief.
