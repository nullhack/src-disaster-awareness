title: Venezuela earthquake death toll rises to 6,438
body: CARACAS, Venezuela — Twin earthquakes that struck Venezuela in June killed 6,438 people, according to the latest official death toll released Monday. Nearly two months since the disaster, relatives and rescuers continue searching for the missing amid the rubble.
