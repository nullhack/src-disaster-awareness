title: Video of Venezuela earthquake aftermath falsely linked to August 2026 Colombia jolt
body: After a 7.4-magnitude earthquake killed nearly 300 people and destroyed thousands of buildings in Colombia in August 2026, a video showing collapsed structures and mountains of rubble was falsely linked to the disaster.
