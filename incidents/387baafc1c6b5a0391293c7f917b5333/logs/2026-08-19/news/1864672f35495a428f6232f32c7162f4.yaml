title: OFAC Reaffirms Recent Licenses Along With New License in Response to Venezuela Earthquakes
body: In June, the U.S. Department of the Treasury’s Office of Foreign Assets Control (OFAC) issued a fresh round of new and amended Venezuela-related general licenses (GLs) targeting sectors such as energy, financial services, and aviation. Taken together, these actions signal OFAC’s continued recalibration of the Venezuela sanctions program — tightening restrictions in some areas while carving out narrow pathways for certain commercial and humanitarian activities.
