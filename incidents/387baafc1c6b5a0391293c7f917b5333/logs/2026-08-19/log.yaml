log_date: '2026-08-19'
summary: The official death toll from the June 24 twin earthquakes remains at 6,438, with relatives and rescuers continuing to search for missing people nearly two months on. Latin music stars Marc Anthony, Feid, Chayanne, and others are set to perform a benefit concert in Miami for earthquake relief. A new analysis explains how tectonic positioning, loose earth, and shoddy construction turbocharged the quakes' damage, while OFAC reaffirmed licenses to facilitate humanitarian aid.
