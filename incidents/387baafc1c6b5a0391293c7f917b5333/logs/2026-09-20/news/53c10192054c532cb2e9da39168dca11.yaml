title: Venezuela unveils statue honoring rescue dog Tsunami
body: Authorities in Maracaibo, Venezuela, unveiled a statue honoring Tsunami, a rescue dog credited with helping save dozens of lives following the devastating earthquakes that struck the country on June 24. The sculpture was unveiled at La Vereda del Lago park in a ceremony attended by Tsunami’s owner,
