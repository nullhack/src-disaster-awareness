log_date: '2026-09-20'
summary: 'New updates highlight ongoing recovery and recognition efforts: a statue was unveiled in Maracaibo honoring Tsunami, a rescue dog credited with saving dozens of lives after the June 24 earthquakes. A PTSD retreat has been organized for recovery workers as the focus shifts to long-term rebuilding and health restoration. Additionally, a "Jam for Venezuela and Colombia" concert in Miami''s Brickell area is set to raise support for communities affected by the earthquakes.'
