log_date: '2026-09-22'
summary: |-
  Central Florida Toyota donated $26,750 to the American Red Cross to support Venezuela earthquake relief, and a hero dog named Tsunami, credited with rescuing 26 people during the June 24 earthquakes, was celebrated with a statue and retired.
  Lanzarote has sent nearly 30 tonnes of humanitarian aid, including food, medical supplies, and clothing, to communities affected by the June 24 twin earthquakes in Venezuela. The shipment is being transported to support ongoing relief and recovery efforts.
