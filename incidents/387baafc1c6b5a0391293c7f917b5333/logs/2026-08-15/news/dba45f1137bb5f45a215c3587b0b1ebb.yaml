title: Teens flee Venezuela's deadly quakes, only to face another disaster in Colombia
body: Two Venezuelan brothers who lost their mother, grandmother and younger brother in the June earthquakes fled another tremor days after reaching Colombia. The fresh shock revived the trauma they carried from weeks spent searching their collapsed home for their family.
