log_date: '2026-08-15'
summary: Less than two months after the twin earthquakes, Venezuelans face the prospect of more severe power and water cuts as El Niño approaches, compounding the disaster's impact. Mental health experts highlight the trauma afflicting survivors, while a benefit concert featuring Marc Anthony, Chayanne, and other Latin artists is scheduled to raise funds for both Venezuela and Colombia earthquake relief. Comparative analyses show stark differences between the response in Venezuela and that in Colombia, where a similar earthquake struck just weeks later.
