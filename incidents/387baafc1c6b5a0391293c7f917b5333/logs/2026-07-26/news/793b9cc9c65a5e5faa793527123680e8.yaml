title: 'Venezuela’s twin earthquakes: the toll one month later'
body: One month after twin earthquakes struck Venezuela, the official death toll has surpassed 5,500, with 16,700 injured. Damage is estimated at $19.6 billion, while thousands remain homeless and the number of missing people has not been updated since late June.
