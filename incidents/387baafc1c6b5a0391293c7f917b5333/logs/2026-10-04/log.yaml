summary: An AP investigation details that the collapse of housing towers in La Guaira was caused by rushed construction on unstable soil after 2010 mudslides, with scientists recording among the largest ground motions ever documented. The UN High Commissioner for Refugees visited quake-affected areas on October 3. Miami-Dade’s Hispanic Heritage Month kickoff featured a painting fundraiser for earthquake relief.
