title: Takeaways from AP investigation into collapse of housing towers during Venezuela's earthquakes
body: The collapse of public housing in Venezuela's La Guaira state after two June earthquakes is linked to decisions made in 2010. Experts say the government rushed to build apartments on unstable soil after mudslides displaced over 100,000 people. The buildings couldn't withstand the earthquakes, which scientists have now determined led to one of the largest ground motions ever documented in the world. The area’s proximity to a fault line and the height of the buildings increased risks. The government hasn't provided crucial data or blueprints and experts urge a careful rebuilding approach. They warn the cost of earthquake-resistant construction may deter future development. Over 6,500 people died in the June event.
