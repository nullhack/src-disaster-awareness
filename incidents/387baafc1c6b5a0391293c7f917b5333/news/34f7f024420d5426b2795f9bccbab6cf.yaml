title: 'A tale of two buildings: how quake rescue efforts differed in Colombia and Venezuela'
body: By Julia Symmes Cobb and Sarah Morland CALI, Colombia, Aug 15 (Reuters) - At a flattened apartment block known as Los Cocos in northern Venezuela, civilians toiled with little support to pull the living and the dead from the rubble.
