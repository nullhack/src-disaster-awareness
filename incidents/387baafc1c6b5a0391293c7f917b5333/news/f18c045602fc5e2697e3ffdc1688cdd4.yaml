title: Venezuela's main airport partially resumes commercial flights after deadly earthquakes
body: Venezuela's main airport has partially resumed operations nearly 10 weeks after two devastating earthquakes. A temporary area with metal structures has been set up at Simón Bolívar International Airport to serve passengers while repairs continue. The airport near Caracas was closed after severe damage from the June 24 earthquakes, which left over 6,500 people dead and thousands homeless.
