title: '‘Miracle’ in Venezuela: Dog reunited with girl after surviving 29 days trapped beneath rubble after quakes'
body: A search-and-rescue team was using a tractor to move heavy rubble in northern Venezuela’s coastal city of Catia La Mar when they saw movement, stopped to dig with their hands, and found a small dog alive in the arms of a dead woman.
