title: Curaçao, Aruba eyed as reconstruction hubs after deadly quakes in Colombia, Venezuela
body: Curaçao and Aruba could become logistical and commercial hubs for the massive reconstruction effort now facing Venezuela and Colombia after two major earthquakes. State Secretary Eric van der Burg, who handles Kingdom Relations, said that to Caribbean journalists on Friday. Venezuela was struck by powerful earthquakes in late June, while Colombia was hit in early August. The number of fatalities is reportedly at least 330 in Colombia and over 6500 in Venezuela.
