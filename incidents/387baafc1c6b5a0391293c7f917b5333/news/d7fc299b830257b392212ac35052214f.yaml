title: First deportation flight reaches Venezuela after deadly earthquakes as activists criticize move | Jefferson City News-Tribune
body: A flight carrying 147 Venezuelan migrants deported from the United States landed in Venezuela on Monday, the first such repatriation flight since earthquakes devastated the country's central and northern regions in June.
