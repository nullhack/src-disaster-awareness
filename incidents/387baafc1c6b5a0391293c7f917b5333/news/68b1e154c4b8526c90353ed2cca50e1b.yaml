title: For these Venezuelans living in the US, June’s earthquakes still reverberate across daily life | Texarkana Gazette
body: LOS ANGELES -- After her parents went missing under the rubble of their Venezuela apartment building, Kelly Granado Montano spent her days here "lost, worried, on the phone," her body in one country, her mind in another.
