title: Special Collection Will Aid Earthquake Victims in Venezuela
body: Archbishop Nelson J. Pérez is asking parishes throughout the Archdiocese of Philadelphia to take up a special second collection Aug. 15-16 to support Catholic Relief Services' humanitarian response to last month's devastating earthquakes in Venezuela.
