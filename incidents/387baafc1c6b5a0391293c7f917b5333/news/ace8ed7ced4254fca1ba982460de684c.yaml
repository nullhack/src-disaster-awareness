title: Lanzarote sends nearly 30 tonnes of humanitarian aid to earthquake victims in Venezuela - Gazette Life
body: Almost 30 metric tonnes of food, medical supplies, clothing and other essential items collected in Lanzarote will be transported to communities affected by the earthquakes in Venezuela.
