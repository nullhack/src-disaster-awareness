title: Search for missing in two quakes continues | Northwest Arkansas Democrat-Gazette
body: CARACAS, Venezuela -- Almost three months after dual earthquakes rocked Venezuela, residents skeptical of the death toll from a government they say has never supported them continue to search for missing loved ones.
