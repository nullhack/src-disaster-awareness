title: Olympic weightlifter hoists debris for Venezuela earthquake recovery
body: Venezuelan Olympic weightlifting silver medalist Julio Mayora hoisted 151 kilograms (330 pounds) to win two gold medals this weekend at the 2026 Central American and Caribbean Games in Santo Domingo.- 'Lost everything' - Like his compatriot, Vallenilla also claimed a gold medal in the Central American and Caribbean Games, motivated by a goal of "setting an example" for thousands of Venezuelans to keep moving forward despite the tragedy.
