title: Marc Anthony, Chayanne and more to play benefit concert for Venezuela and Colombia earthquake relief
body: Latin music stars Marc Anthony, Feid, and others are set to perform at a benefit concert in Miami on Sunday to raise money for those affected by recent earthquakes in Venezuela and Colombia.
