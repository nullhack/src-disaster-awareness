title: 'Venezuela Earthquake : ६,५०० मृत्यूनंतरही आशेचा किरण; २६ जणांचे प्राण वाचवणाऱ्या ‘Tsunami’ श्वानाचा पुतळा | Navarashtra'
body: 'Venezuela Earthquake : व्हेनेझुएलातील जून महिन्याच्या विनाशकारी भूकंपानंतर बचावकार्यात महत्त्वाची भूमिका बजावणाऱ्या ‘Tsunami’ या Border Collie श्वानाचा मराकायबो येथे कांस्य पुतळा उभारून सन्मान करण्यात आला. Tsunami ने विविध बचाव मोहिमांमध्ये किमान २६ जणांना जिवंत शोधण्यात मदत केली आहे.'
