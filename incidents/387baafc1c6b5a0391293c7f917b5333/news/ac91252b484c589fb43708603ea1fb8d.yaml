title: Tiny dog miraculously found alive in Venezuela earthquake rubble after 29 days - Pet Rescue Report
body: Spread the loveAn 11-year-old miniature poodle named Beyli was found alive under the rubble from the Venezuela earthquakes 29 days later. He has since been reunited with 11-year-old Victoria Rengel and her father. Tragically, the double earthquakes have claimed the lives of more than 5,500 people. Somehow Beyli defied the odds. He was found by […]
