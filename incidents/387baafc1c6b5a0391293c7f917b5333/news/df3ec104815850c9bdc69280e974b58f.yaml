title: 'Venezuela quake recovery to take years: Red Cross'
body: CARACAS, 25th July, 2026 (WAM) -- Recovering from the earthquakes in Venezuela will take years, the Red Cross said yesterday, one month on from the June 24 disaster that killed more than 5,000 people.
