title: Venezuela continues difficult recovery from twin earthquakes as oil sales surge
body: Venezuela’s recovery from massive earthquakes on June 24 has become increasingly costly as the death toll has climbed, the extent of infrastructure damage has come into sharper focus, and reconstruction has placed additional strain on an already fragile economy. However, Caracas’ oil sector has also continued to expand.
