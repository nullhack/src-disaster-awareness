title: Islander raises thousands for Venezuelan earthquake recovery - Jersey Evening Post
body: AN Islander’s fundraising drive continues to support Venezuela in the wake of the earthquake that devastated his home country over a month ago now. Mariano Antonio Ferreira Correia’s 36-year-old brother Javier, a former Jersey café worker, was among those killed on Wednesday 24 June, while members of his family lost their homes. Since then, Mr […]
