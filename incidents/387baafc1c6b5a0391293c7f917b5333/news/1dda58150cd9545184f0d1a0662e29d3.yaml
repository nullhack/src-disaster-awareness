title: Satellite shows 60 cm ground shift in Venezuela earthquake
body: 'Washington, July 26: The twin earthquakes that struck Venezuela last month caused massive devastation in Caracas and La Guaira as the earth shifted as much as 60 centimetres (two feet), data from the NASA-ISRO satellite NISAR has revealed. Researchers studied the images of the Earth taken by the NASA-ISRO Synthetic Aperture Radar (NISAR) satellite on…'
