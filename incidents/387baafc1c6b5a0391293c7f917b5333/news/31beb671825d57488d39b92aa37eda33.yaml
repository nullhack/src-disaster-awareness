title: Families still searching for loved ones a month after Venezuela earthquakes, in photos
body: LA GUAIRA, Venezuela (AP) — A month after twin earthquakes struck Venezuela, families are still seeking closure as crews remove rubble from collapsed buildings in La Guaira and the search continues for the bodies of loved ones.
