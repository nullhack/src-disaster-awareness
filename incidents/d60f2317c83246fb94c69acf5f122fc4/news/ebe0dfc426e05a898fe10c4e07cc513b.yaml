title: Strong M6.3 earthquake hits off Vanuatu, no tsunami threat
body: A strong, shallow magnitude 6.3 earthquake struck about 200 km northwest of Port-Olry, Vanuatu, at 04:20 UTC on October 20, according to the USGS and EMSC. The USGS put the depth at 16 km, while EMSC reported 5 km.
