title: Serie de cutremure în Vanuatu, SUA, dintre care unul cu magnitudinea 6 - Economica.net
body: Un seism cu magnitudinea 6 a zguduit regiunea situată la 214 km nord-vest de localitatea Port-Olry din Vanuatu, miercuri, la ora 02:21 GMT, a anunţat Serviciul Geologic al Statelor Unite (USGS), informează agenţia de presă Xinhua, scrie Agerpres.
