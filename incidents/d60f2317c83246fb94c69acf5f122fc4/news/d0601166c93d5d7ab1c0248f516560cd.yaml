title: 'Vanuatu Earthquake: Two Strong Quakes Of Magnitude 7.2 And 6.9 Hit Island Nation Within 25 Seconds'
body: Two powerful earthquakes, measuring 7.2 and 6.9 magnitude, recently struck near the Vanuatu Islands in the South Pacific. The tremors occurred at a shallow depth of 10 km, with epicenters west of Sola and Port-Olry.
