title: A magnitude 6.0 quake led a swarm of shocks northwest of Port-Olry, Vanuatu
body: A magnitude 6.0 earthquake struck 165 kilometers northwest of Port-Olry, Vanuatu, at 11:47 UTC on November 1. It came after a week of repeated shocks in the same patch of ocean, and it was followed within about 20 minutes by two more of magnitude 4.
