title: 5.5-magnitude quake hits Vanuatu Islands -- GFZ
body: An earthquake with a magnitude of 5.5 jolted Vanuatu Islands at 1852 GMT on Monday, the GFZ German Research Centre for Geosciences said. The epicenter, with a depth of 10 km, was initially determined to be at 13.
