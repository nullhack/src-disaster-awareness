title: జపాన్ తీరంలో భారీ భూకంపం
body: 'Earthquake today: Magnitude 6.5 hit Bonin Islands of Japan and Port-Olry in Vanuatu epicenter in the ocean. No tsunami warning was issued for the affected areas, and no material damage or casualties had been reported. The earthquake occurred in a seismically active. జపాన్ను భూకంపం సంభవించింది. బోనిన్ ఐలాండ్స్ ను వణికించింది. రిక్టర్ స్కేలుపై దీని తీవ్రత 6.5గా రికార్డయింది.'
