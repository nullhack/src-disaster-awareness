log_date: '2026-11-24'
summary: Selected reports describe a two-week swarm of strong earthquakes off Vanuatu, including seven magnitude 5.5 or stronger events within about six and a half hours on October 24 northwest of Espiritu Santo. The batch also notes a magnitude 7.2 offshore earthquake that triggered a tsunami alert for coastlines within 300 km, and another report cites a magnitude 6.5 quake off Vanuatu.
