title: 7.2-Magnitude Earthquake Strikes Off Vanuatu, Triggers Tsunami Warning
body: Sydney, October 24, 2026, SPA -- A 7.2-magnitude earthquake struck off the coast of Vanuatu today, triggering a tsunami alert, according to the Pacific Tsunami Warning Center. The Hawaii-based monitoring center warned that, based on preliminary parameters from the shallow undersea tremor, hazardous tsunami waves could impact coastlines within a 300-kilometer radius of the epicenter. -- SPA 08:31 Local Time 05:31 GMT 0019
