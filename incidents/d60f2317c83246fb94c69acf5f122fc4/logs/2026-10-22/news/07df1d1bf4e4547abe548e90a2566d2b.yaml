title: Magnitude 6.3 earthquake strikes off Vanuatu
body: Sydney, Australia—A magnitude 6.3 earthquake struck off the coast of South Pacific nation Vanuatu on Tuesday, October 20, the US Geological Survey said. The tremor's epicentre was about 200 kilometres (120 miles) northwest of the village of Port Olry.
