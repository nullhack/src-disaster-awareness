title: 'Russia To Japan And Australia: Geological Forces Behind Back-To-Back Earthquakes In The Pacific Ring Of Fire'
body: Japan and Vanuatu experienced strong earthquakes, highlighting increased seismic activity along the Pacific Ring of Fire.Over 120 quakes of magnitude 4.5 occurred globally in the past week, mostly in this active region, prompting renewed focus on disaster preparedness.
