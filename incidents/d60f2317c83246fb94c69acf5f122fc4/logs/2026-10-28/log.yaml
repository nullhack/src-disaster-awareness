log_date: '2026-10-28'
summary: A magnitude 6.1 earthquake struck near Port-Olry, Vanuatu, at 02:24 UTC on October 25, 2026. A magnitude 6.0 earthquake then struck off the coast of Vanuatu on October 28, 2026, as reported by USGS and QNA. These latest tremors add to the sequence of significant quakes affecting the island nation.
