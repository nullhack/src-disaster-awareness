log_date: '2026-10-24'
summary: On October 24, 2026, multiple strong earthquakes struck near Vanuatu, with the largest measuring magnitude 7.2 (USGS) at a shallow depth of 10 km. A magnitude 6.9 quake followed within seconds, and a magnitude 6.3 aftershock was also recorded. Tsunami warnings were issued for a 300 km radius but were lifted within an hour, and no immediate reports of damage or casualties have been made.
