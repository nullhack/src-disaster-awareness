title: 'Cyclonic storm Arnab live: Landfall to occur earlier than expected, between 2 am and 4 am on October 28, says IMD'
body: 'Cyclonic storm Arnab LIVE: Cyclonic storm Arnab is likely to make landfall earlier than expected, between 2 am and 4 am on October 28, the India Meteorological Department (IMD) said on Tuesday.'
