title: Tropical Storm Vance heads toward Sinaloa, bringing more heavy rainfall to northwest Mexico
body: On Wednesday, rainfall totals of 75 to 150 millimeters are expected in central and southern Sinaloa, Nayarit, Durango, the southern tip of Baja California Sur and the coast of Jalisco.
