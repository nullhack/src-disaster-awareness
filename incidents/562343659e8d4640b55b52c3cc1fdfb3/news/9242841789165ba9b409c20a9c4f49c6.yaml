title: Batanes placed under Signal No. 2 due to ‘Rosal’
body: 'Batanes has been placed under Tropical Cyclone Wind Signal No. 2 as Super Typhoon Rosal (international name: Champi) maintained its strength while moving west-northwestward over the sea east of Northern Luzon.'
