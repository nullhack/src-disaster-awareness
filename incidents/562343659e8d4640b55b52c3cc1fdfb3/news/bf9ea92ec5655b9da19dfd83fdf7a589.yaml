title: Super Typhoon Rosal prompts wind warning in Batanes as it tracks towards northern Philippines
body: 'MANILA: The state weather bureau raised Tropical Cyclone Wind Signal (TCWS) No. 2 over Batanes as Super Typhoon Rosal (international name: Champi) moved east of northern Luzon on Wednesday morning.'
