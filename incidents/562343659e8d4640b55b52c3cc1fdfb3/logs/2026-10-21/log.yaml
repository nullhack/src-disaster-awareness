log_date: '2026-10-21'
summary: Super Typhoon Champi has intensified into a Category 5 super typhoon, with winds reaching 296 km/h (185 mph), making it the strongest storm on Earth in 2026. The storm is tracking toward Taiwan and eastern China, prompting evacuation preparations, and has entered the Philippine Area of Responsibility, with Signal No. 2 raised in Batanes. Airlines have begun canceling flights in the region, and the storm continues to pose a severe threat.
