title: 'Cyclone Arnab Update: IMD Says Storm Likely To Hit Andhra Coast Between Bapatla And Visakhapatnam | Outlook India'
body: Cyclone Arnab has intensified over the Bay of Bengal and is likely to hit the Andhra Pradesh and Yanam coasts between Bapatla and Visakhapatnam on Wednesday, 28 October 2026, with evacuations, NDRF and SDRF deployments, and fishing bans in force.
