title: Canada puts the military on standby as British Columbia wildfires kill 1 and displace thousands - WTOP News
body: TORONTO (AP) — Canada put its military on standby Monday to help battle deadly wildfires in British Columbia as a local mayor warned that one of the blazes had wreaked destruction on his community.
