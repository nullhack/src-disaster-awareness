title: Canadian wildfire that forced 20,000 to flee may signal ‘new normal’
body: British Columbia Premier David Eby says a fast-moving wildfire in western Canada that forced more than 20,000 people from their homes may signal a “new normal” after outpacing official models and giving some residents little time to evacuate.
