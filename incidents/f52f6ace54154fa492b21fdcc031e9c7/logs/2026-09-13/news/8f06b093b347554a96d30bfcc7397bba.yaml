title: 'Opinion: 3 ways to improve Canada’s wildfire advisory capacity'
body: In mid-July, parts of Ontario woke up under a yellow sky. Nearly 200 forest fires were burning, most of them in the northwest, and Toronto briefly had the worst air quality of any major city in the world. Within days, the smoke had become a cross-border political issue, prompting criticism from lawmakers in the United States and a sharp response from Ontario Premier Doug Ford.
