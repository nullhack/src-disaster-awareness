log_date: '2026-09-13'
summary: Canada's 2026 wildfire burn area exceeded the 10-year average, reaching 4.48 million hectares. New fires emerged in northwestern Ontario, with the Rinker Complex remaining uncontained, and a new forest fire in Port Hope Simpson, Newfoundland, prompted evacuation preparations. Fire activity picked up on the Ainslie Creek blaze near Merritt, British Columbia, while Ontario wildfire smoke drove Michigan's AQI to 616, and Prime Minister Carney acknowledged the need for stronger responses to severe wildfire seasons.
