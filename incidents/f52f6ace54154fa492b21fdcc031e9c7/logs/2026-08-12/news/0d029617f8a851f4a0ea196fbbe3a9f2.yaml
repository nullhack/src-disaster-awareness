title: Wildfire destroys about 230 homes in western Canadian Indigenous community, officials say
body: A fast-moving wildfire has destroyed about 230 homes in an Indigenous community in western Canada. The chief of the Okanagan Indian Band says the Bradley Creek wildfire devastated much of the reserve near Vernon, about 440 kilometers northeast of Vancouver. The destruction ranks among Canada’s worst recent wildfires. A 2024 blaze in Jasper, Alberta, destroyed about 350 homes, while the 2023 McDougall Creek wildfire, also in British Columbia’s Okanagan region, destroyed about 200 homes. Canada has endured increasingly destructive wildfire seasons in recent years, with smoke from the blazes repeatedly spreading across North America and triggering widespread air-quality alerts.
