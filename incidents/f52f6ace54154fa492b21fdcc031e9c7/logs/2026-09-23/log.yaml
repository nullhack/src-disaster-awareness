log_date: '2026-09-23'
summary: A new wildfire near Sooke on Vancouver Island grew to 35 hectares, one of five out-of-control fires on the island. Meanwhile, Kamloops MP Frank Caputo urged Prime Minister Carney to improve wildfire response in rural B.C. Separately, the summer's fires severely impacted B.C. wineries, reducing grape yields and revenue.
