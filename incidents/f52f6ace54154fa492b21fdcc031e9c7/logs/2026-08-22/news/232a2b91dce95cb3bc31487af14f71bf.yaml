title: Yukon First Nations firefighters wonder why they haven't been called to help in B.C. - Medicine Hat News
body: Fire crews with Yukon First Nations Wildfire say they are ready, willing and able to help with out-of-control fires burning in British Columbia and are wondering why they haven’t received the call. The organization’s CEO Nick Mauro said he had 40 or so firefighters with the skills and training ready to go and despite having
