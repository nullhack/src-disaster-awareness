title: Wildland firefighting bill gains steam as smoke reaches Congress
body: Wildfire smoke drifting into Washington, D.C., from the Western U.S. and Canada this summer made it hard to ignore the national threat stronger wildfires pose to lawmakers’ constituents across the country. As a result, a bipartisan coalition led by Western lawmakers has a better shot this year at enacting legislation targeting wildfires at their source […]
