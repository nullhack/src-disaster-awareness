log_date: '2026-08-10'
summary: In early August 2026, wildfires in western Canada, particularly the Bald Range fire near Summerland, British Columbia, escalated dramatically. The fire burned over 33,000 acres, destroyed approximately 230 homes, and resulted in the death of one woman, prompting evacuation orders for around 20,000 people. In response, British Columbia declared a state of emergency as crews faced challenging conditions from severe drought and windy weather.
