title: Thousands evacuated from their homes as wildfires rage across Canada
body: More than 900 fires are currently burning across Canada, with dozens of them out of control. Over 120 of these are raging in British Columbia, where residents of well over 2,000 properties had been evacuated under 32 orders as of Friday.
