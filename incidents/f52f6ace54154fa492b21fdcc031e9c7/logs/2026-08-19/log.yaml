log_date: '2026-08-19'
summary: As of August 18, thousands of Summerland residents were permitted to return home after the Bald Range wildfire evacuation orders were mostly lifted. New research indicates fast-moving wildfires like the Bald Range blaze are burning larger and harming forests' regrowth capacity. Canada's wildfire season is on track to be the fourth worst on record, with elevated fire risk persisting across many regions.
