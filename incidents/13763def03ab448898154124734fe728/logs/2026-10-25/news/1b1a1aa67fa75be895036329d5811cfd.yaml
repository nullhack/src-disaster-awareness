title: Trump says he could strike Iran tomorrow, doesn't rule out 'beautiful deal'
body: Donald Trump said the United States could strike Iran on Sunday while pursuing an agreement. His remarks underscored Washington's twin focus on military action and preventing a nuclear weapon.
