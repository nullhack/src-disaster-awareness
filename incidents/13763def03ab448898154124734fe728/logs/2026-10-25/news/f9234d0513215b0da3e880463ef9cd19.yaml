title: 'Trump Says Decision Time Nears on Iran: Deal or ‘Finish It Off’'
body: President Donald Trump said it’s “getting to be decision time” on whether he will make a deal with Tehran or resume attacks as Iranian and Houthi threats against Americans in the Middle East continue to grow.
