log_date: '2026-11-25'
summary: In this batch, Iran accused the U.S. of using AI to select targets in the war and urged UN regulation, while a Saudi-led coalition struck Yemen’s Hodeidah port after an evacuation warning. President Trump said the Iran war is “funded” through January and addressed Israel’s goal of regime change in Tehran, as an ex-Mossad chief argued diplomacy will never work and a third war is inevitable. Houthi rebels also advanced closer to Aden, and oil-market coverage noted Brent near $90 and record Russian crude imports by India and China amid the war’s disruption of Middle Eastern supply.
