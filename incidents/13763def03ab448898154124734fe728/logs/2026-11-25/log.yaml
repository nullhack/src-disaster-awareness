log_date: '2026-11-25'
summary: |-
  In this batch, Iran accused the U.S. of using AI to select targets in the war and urged UN regulation, while a Saudi-led coalition struck Yemen’s Hodeidah port after an evacuation warning. President Trump said the Iran war is “funded” through January and addressed Israel’s goal of regime change in Tehran, as an ex-Mossad chief argued diplomacy will never work and a third war is inevitable. Houthi rebels also advanced closer to Aden, and oil-market coverage noted Brent near $90 and record Russian crude imports by India and China amid the war’s disruption of Middle Eastern supply.
  The Trump administration is reportedly weighing strikes on Iran’s senior leaders, including Mojtaba Khamenei, as the war approaches its ninth month. Iran’s first vice president said Tehran is not concerned about the U.S. naval blockade, citing a significant increase in cargo through other borders, while Gulf Cooperation Council members agreed on the need to prevent renewed U.S. strikes but differed over how Washington should approach Tehran. Economic reporting highlighted Qatar’s busiest LNG export month since the war began, a $3.1 billion addition to Thanksgiving fuel costs, and an RBI study finding a 64% crude oil price surge tied to the West Asia conflict.
