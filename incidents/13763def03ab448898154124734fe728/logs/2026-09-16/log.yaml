log_date: '2026-09-16'
summary: New developments in the Iran war include a House vote to halt the conflict, with seven Republicans joining Democrats in a symbolic measure, and Rep. Thomas Massie forcing a vote to impeach Defense Secretary Pete Hegseth over alleged War Powers Resolution violations. The Congressional Budget Office reported the war has cost the U.S. over $38 billion through August, with monthly costs reaching $2–3 billion, while the IEA slashed oil demand forecasts, citing the conflict's historic impact—the second-worst wipeout in 60 years—if Strait of Hormuz traffic does not resume. Separately, the war has reportedly reopened shipping routes for Somali pirates, and analysts warn of an oil shock before the midterms due to elevated gas prices.
