log_date: '2026-09-16'
summary: |-
  New developments in the Iran war include a House vote to halt the conflict, with seven Republicans joining Democrats in a symbolic measure, and Rep. Thomas Massie forcing a vote to impeach Defense Secretary Pete Hegseth over alleged War Powers Resolution violations. The Congressional Budget Office reported the war has cost the U.S. over $38 billion through August, with monthly costs reaching $2–3 billion, while the IEA slashed oil demand forecasts, citing the conflict's historic impact—the second-worst wipeout in 60 years—if Strait of Hormuz traffic does not resume. Separately, the war has reportedly reopened shipping routes for Somali pirates, and analysts warn of an oil shock before the midterms due to elevated gas prices.
  The Iran war has cost U.S. taxpayers $38 billion through August, with the CBO projecting an additional $3 billion per month, including over $21 billion on munitions; a new CBO report also warns the conflict will spike inflation in early 2027. In Congress, the House passed a third war powers resolution to curb Trump's Iran war powers, with seven Republicans joining Democrats, while new polling shows nearly six in ten Americans oppose the war as it hits the six-month mark. Separately, Iran strikes on Amazon data centers caused permanent loss of customer data, and Saudi Arabia issued a travel advisory amid Houthi attacks, with the AP reporting Houthi gains in Yemen.
