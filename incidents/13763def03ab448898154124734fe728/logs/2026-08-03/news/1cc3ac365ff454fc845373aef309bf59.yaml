title: Brent crude slides $16 in eight trading days as Trump revives Iran peace talks
body: Brent crude has fallen by more than $16 per barrel in eight trading sessions, retreating sharply from the $100 level reached during the height of the latest Middle East conflict as signs of renewed peace talks between the United States and Iran eased fears of a prolonged disruption to global oil supplies through the Strait of Hormuz.
