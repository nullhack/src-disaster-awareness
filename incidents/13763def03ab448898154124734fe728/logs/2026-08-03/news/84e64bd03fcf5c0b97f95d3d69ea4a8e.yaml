title: US and Iran trade missile barrages as hopes dim for a quick resolution to the five-month conflict
body: The United States and Iran have each fired barrages of missiles as the pattern of back-and-forth strikes takes hold again and hope dims for a quick end to the five-month conflict. Following a few days of respite, fears of a wider war have grown, with renewed fighting threatening to engulf even more countries. Jordan said Thursday it intercepted Iranian missiles for the second consecutive day, while Kuwait said a strike in the northern part of the country killed one person. Also this week, drones caused fires on ships at an Egyptian port, and Saudi Arabia said it came under fire from Iran-backed militias in Iraq.
