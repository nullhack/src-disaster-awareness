title: 'Iran déjà vu: Trump once again threatens massive escalation against Tehran only to walk back'
body: President Donald Trump has repeatedly threatened military action against Iran, only to pull back at the last minute. This pattern continued over the weekend. On Friday, Trump warned of a strong military response, but by Saturday night he announced progress in negotiations. The Republican president credited Gulf allies, including Saudi Arabia, for persuading him to give diplomacy more time. Critics say Trump's approach seems erratic. Some argue that military force alone may not compel Iran to back down. Polls show many Americans feel the 5-month-old conflict has not been worthwhile.
