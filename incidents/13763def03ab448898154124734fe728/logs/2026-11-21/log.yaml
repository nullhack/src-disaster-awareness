log_date: '2026-11-21'
summary: Democrats in Congress are closing in on a proposal to cut off funding for the Iran war as part of a spending deal intended to avert a shutdown, while Vice President JD Vance declined to endorse Trump's Iran strikes even as Trump called Vance's assessment blaming the war for the GOP's midterm losses "very accurate" and said he would launch the conflict again. Separately, a tanker caught fire after being struck by an unknown projectile while sailing outbound through the Strait of Hormuz, according to UKMTO, and British endurance swimmer Lewis Pugh swam the Strait to highlight the war's environmental impact on wildlife. Trump continued to insist Tehran wants a "fake deal" rather than one acceptable to him.
