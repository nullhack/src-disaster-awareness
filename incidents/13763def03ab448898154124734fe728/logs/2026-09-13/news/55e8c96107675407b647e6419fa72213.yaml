title: 'PM Modi’s diplomatic balancing act at BRICS: How India used its ties with Iran and UAE to bridge war-time divide- Moneycontrol.com'
body: Iran and the UAE, divided by the escalating West Asia conflict, backed the same BRICS statement calling for restraint. The development came after India's diplomatic push for dialogue and consensus at the New Delhi summit.
