title: 'BRICS Summit 2026 Live Updates: UAE Crown Prince meets Iran President as Hormuz stays in focus'
body: BRICS Summit 2026 in New Delhi brings together leaders of major emerging economies as India pushes the Global South agenda, focusing on food security, energy security, supply-chain resilience and inclusive global growth. The two-day summit is also closely watched for a possible joint declaration amid divisions over the West Asia conflict, while discussions are expected to cover trade, investment, technology and cooperation among developing nations
