log_date: '2026-09-13'
summary: At the BRICS summit, India secured unanimous adoption of the New Delhi Declaration after bridging Iran-UAE differences, and facilitated a sideline meeting between Iran's president and the UAE crown prince. Houthi fighters advanced south along Yemen's coast, sparking a panic and threatening the Bab el-Mandeb Strait, while Saudi Arabia shut its East-West pipeline after a drone attack from Iraq. Separately, an Iranian MP declared Iran no longer bound by the nuclear treaty, and Iran mocked the U.S. over capturing an underwater drone, claiming it could reverse-engineer it.
