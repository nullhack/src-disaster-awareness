log_date: '2026-08-19'
summary: The 60-day ceasefire framework expired with no peace deal, as President Trump threatened to "bomb the s*** out of" Oman over its Iran Strait of Hormuz deal and declared no talks are planned with Tehran. The UAE imposed an indefinite trade embargo on Iran after fresh missile attacks, while reports indicate Iran has lost significant control of the waterway as ships increasingly use a UN-authorized Oman route. Republicans are growing worried about midterm fallout, Iran's hardliners signal they are "just getting started," and the war continues to drive UK inflation and global energy market disruptions.
