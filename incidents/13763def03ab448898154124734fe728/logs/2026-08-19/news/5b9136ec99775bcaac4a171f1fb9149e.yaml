title: President Trump blasts allies as Iran war deadline passes with no deal
body: The 60-day deadline to end the war expired Monday, with President Trump saying Iran is not ready to make the deal he feels is “necessary,” while also lashing out at key U.S. allies over the conflict. NBC News’ Garrett Haake reports.
