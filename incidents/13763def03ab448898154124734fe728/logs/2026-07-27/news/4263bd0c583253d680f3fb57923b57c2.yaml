title: Strait of Hormuz ambiguity triggered collapse of US-Iran truce - Analysts
body: Uncertainty over control of the Strait of Hormuz was a major factor behind the breakdown of the fragile truce between the United States and Iran, a development that contributed to a sharp rise in global oil prices, according to analysts.
