title: Iran Protects Capacity to Build Missiles as Trump Pauses Strikes
body: Iran has managed to preserve its missile and drone factories despite months of US and Israeli bombing, officials familiar with the matter said, allowing it to replenish its arsenals while President Donald Trump holds off on strikes ahead of the midterm elections.
