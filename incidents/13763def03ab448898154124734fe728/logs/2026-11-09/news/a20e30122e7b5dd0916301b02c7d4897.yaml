title: Global air cargo tonnages up 6% in Oct despite drop in China-Europe volumes
body: The growth from MESA origins, despite ongoing challenges to Arabian Gulf capacity and volumes due to the US-Iran conflict, mainly reflects continuing strong demand for air exports from India.
