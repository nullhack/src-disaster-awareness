title: 4 tankers said to hit mines in strait | Arkansas Democrat Gazette
body: Iran's Revolutionary Guard said Friday that a supertanker carrying more than 2 million barrels of oil struck a naval mine, exploded and caught fire while using an unauthorized route in the Strait of Hormuz, Iranian state media reported.
