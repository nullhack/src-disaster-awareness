title: US hiding actual count of troop deaths in Iran war? Pete Hegseth denies
body: The Washington Post reported that 22 US service members have died since the Iran war began, but Defence Secretary Pete Hegseth called the claim "fake". The gap with the Pentagon's public tally has intensified questions over casualty reporting and transparency.
