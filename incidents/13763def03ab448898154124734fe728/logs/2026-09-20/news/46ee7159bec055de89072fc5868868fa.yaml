title: Saudi Arabia issues Riyadh alert as Iran sends war terms via Qatar
body: Saudi Arabia issued emergency alerts in Riyadh as Iran sent Washington terms to end the war via Qatar. The overnight developments underlined widening regional strain even as civilians in Gaza try to restore daily life.
