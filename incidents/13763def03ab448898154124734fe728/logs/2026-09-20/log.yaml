log_date: '2026-09-20'
summary: |-
  Iran and Oman agreed to create a safe shipping lane through the Strait of Hormuz, while China cut its oil imports by 32% during the conflict, helping contain global price shocks. The war's cost reached $43.6 billion, and Republicans in key midterm races increasingly broke with President Trump over the war and related issues.
  The Pentagon reported that the war's cost has surged to $45.1 billion. Iran laid out conditions for ending the conflict, including unfreezing its funds and ending the naval blockade, while Cairo and Washington discussed freedom of navigation in the Strait of Hormuz. Separately, Houthi rebels attempted a ballistic missile attack on Riyadh, President Trump questioned whether to "blow the entire nation up," and Defense Secretary Hegseth denied reports of higher U.S. troop deaths.
