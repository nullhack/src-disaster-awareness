summary: |-
  The U.S. is planning fresh strikes on Iran as soon as this weekend, according to officials, while Iran announced it stopped two vessels attempting to leave the Strait of Hormuz and claimed four tankers turned back. India condemned attacks on commercial shipping as oil companies more than doubled their quarterly profits, and a new poll found 69% of Americans believe President Trump has not clearly explained the war's goals.
  The U.S. is preparing new strikes on Iran, possibly as soon as this weekend, while tankers near Oman have come under fire, exacerbating Strait of Hormuz tensions. Oil prices have risen, and major oil companies are reporting massive profits from the conflict. Politically, three Republican senators broke ranks in an attempt to limit Trump's war powers, and analysts highlight the potential midterm fallout for the GOP.
