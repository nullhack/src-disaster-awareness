title: Oil rises as Iran says ships stopped in Strait of Hormuz
body: Key takeawaysOil prices gained more than 1 per cent after Iran said its forces stopped two vessels attempting to leave the Strait of Hormuz. Iran also claimed four tankers turned back, although the reports have not been independently confirmed.
