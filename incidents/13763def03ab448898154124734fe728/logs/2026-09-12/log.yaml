log_date: '2026-09-12'
summary: |-
  Houthi rebels seized Yemen's Perim Island near the Bab el-Mandeb Strait, opening a new front and prompting Saudi Arabia to urge US military intervention and shut down its East-West pipeline. The Acting Navy Secretary confirmed Iran "blew the hell out of" a US base in Bahrain, while Trump and Hegseth linked the war to 9/11 in Pentagon speeches. The IEA slashed oil supply forecasts and warned the global refining system is stretched to its limit as the White House considers using the Defense Production Act to expand US refining capacity.
  Houthi rebels have seized Yemen's entire Red Sea coast and three strategic islands, tightening their grip on the Bab el-Mandeb Strait and opening a new front. Meanwhile, Iraq raced to contain fallout after local Iran-backed militias were accused of attacking and shutting down Saudi Arabia's East-West pipeline. Iran also claimed to have captured a U.S. Navy underwater drone, potentially reverse-engineering it.
