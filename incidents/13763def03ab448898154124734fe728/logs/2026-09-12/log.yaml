log_date: '2026-09-12'
summary: Houthi rebels seized Yemen's Perim Island near the Bab el-Mandeb Strait, opening a new front and prompting Saudi Arabia to urge US military intervention and shut down its East-West pipeline. The Acting Navy Secretary confirmed Iran "blew the hell out of" a US base in Bahrain, while Trump and Hegseth linked the war to 9/11 in Pentagon speeches. The IEA slashed oil supply forecasts and warned the global refining system is stretched to its limit as the White House considers using the Defense Production Act to expand US refining capacity.
