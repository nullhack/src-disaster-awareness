log_date: '2026-08-22'
summary: |-
  President Trump announced an "economic D-Day" campaign of unprecedented sanctions against Iran, which Tehran dismissed and threatened a "devastating" military response to. The Pentagon disclosed that over 750 US service members have been wounded since the conflict began, while Iranian President Pezeshkian called for an end to the war from a position of strength. Economic fallout deepened as Iranian families struggle with soaring prices, Walmart cited the war for slow sales, and Iran passed a law penalizing speaking to foreign press, as the US pivots to economic pressure and Iran threatens to target US bases in Europe.
  Iran permitted several Iraqi oil tankers to transit the Strait of Hormuz, signaling a possible selective easing of restrictions. President Trump referred to the conflict as a "little detour" at a South Carolina rally and reiterated that Iran is not ready to accept the right deal, while both sides exchanged hostile rhetoric ahead of new U.S. economic sanctions expected Monday. Iranian President Pezeshkian more explicitly claimed victory, stating the world has accepted Iran won the war.
