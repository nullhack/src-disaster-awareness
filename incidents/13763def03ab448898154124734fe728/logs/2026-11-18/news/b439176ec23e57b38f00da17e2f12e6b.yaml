title: 'US Navy admits using expired Tomahawk missiles in Iran war: Can they still hit their targets?- Moneycontrol.com'
body: Ageing missiles can suffer deterioration in propellants, explosives, electronic components and navigation systems, potentially affecting their reliability. The US Navy has procedures to test and recertify older Tomahawks before returning them to service.
