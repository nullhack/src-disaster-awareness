title: Iran widens Gulf attacks by targeting US air base in Kuwait and sites in Bahrain
body: With its economy suffering under a U.S. naval blockade and American military escorts helping open the Strait of Hormuz, experts say recent attacks suggest Tehran may be growing weary of the status quo.
