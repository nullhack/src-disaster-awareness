log_date: '2026-09-21'
summary: |-
  The Pentagon reported the war's cost has reached $45.1 billion, while the Federal Reserve hiked interest rates for the first time in three years citing inflation pressures. President Trump threatened to "blow up" all of Iran if no deal is reached, and Iran vowed "painful" retaliation, with analysts warning Tehran could test a nuclear weapon as an "October Surprise." Additionally, Qatar's PM urged a Gulf security framework with Iran, and a UK minister said the war is straining the British budget.
  On September 20-21, Houthi rebels struck Riyadh with missiles and drones, escalating regional tensions and pushing oil prices higher. Iran's Revolutionary Guard warned it would shift tactics and targets if the US escalates, while a tanker was hit near the Strait of Hormuz as both sides traded threats. Diplomatic efforts continued, with the UAE anticipating a prolonged conflict and calling for Iran-Gulf security talks, and Turkey and Pakistan pledging support to Saudi Arabia.
