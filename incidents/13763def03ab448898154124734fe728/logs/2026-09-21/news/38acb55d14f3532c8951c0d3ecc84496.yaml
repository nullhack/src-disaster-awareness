title: Iran war’s cost grows to $43.6 billion in new US military estimate | Texarkana Gazette
body: WASHINGTON -- The U.S. military's price tag for the Iran war has grown to $43.6 billion as of Sept. 3, according to a new estimate provided this week to lawmakers.
