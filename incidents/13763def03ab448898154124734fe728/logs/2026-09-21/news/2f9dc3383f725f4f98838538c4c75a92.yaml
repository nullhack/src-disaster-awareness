title: Small country gets big windfall from Iran war
body: The South American nation has become the world’s fastest-growing economy, with its GDP expanding by 33% in the first half of 2026 – largely due to skyrocketing demand for its oil driven by the war in Iran. The tiny nation, with a population of around one million, began producing oil only a few years ago and now has the highest per capita income in Latin America. However, many ordinary people in Guyana aren’t reaping the benefits, faced with rising inflation, poor public services, and housing sho
