log_date: '2026-07-31'
summary: Iran claimed to have targeted US military bases in Kuwait and Bahrain with drones, expanding the conflict's geography, though the US did not immediately confirm damage. The Senate narrowly blocked a war powers resolution to end US involvement, while Saudi Arabia proposed a 14-nation maritime defense alliance to protect shipping routes. New polls showed the war deepening US public opposition, and traditional US allies remained hesitant to intervene directly.
