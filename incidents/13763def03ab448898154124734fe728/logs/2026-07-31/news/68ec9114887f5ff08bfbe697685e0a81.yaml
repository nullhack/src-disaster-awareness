title: US, Iran trade missile strikes as respite ends | Arkansas Democrat Gazette
body: CAIRO -- The United States and Iran each fired barrages of missiles Thursday, as the pattern of back-and-forth strikes took hold again and hope dimmed for a quick end to the five-month conflict.
