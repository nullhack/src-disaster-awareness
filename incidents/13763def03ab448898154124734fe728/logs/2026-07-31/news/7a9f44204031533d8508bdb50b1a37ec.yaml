title: Major oil companies reap massive profits as US and Iran fighting drives energy prices higher
body: Major oil companies including Exxon Mobil and Chevron more than doubled their profits in the second quarter as Iran-U.S. tensions pushed Brent crude above $100 a barrel, squeezing consumers at the pump while fueling record windfalls for Big Oil.
