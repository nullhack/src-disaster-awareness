log_date: '2026-11-14'
summary: On November 13, Iran told the UN nuclear agency that monitoring cannot proceed while it is under threat, as the US military intercepted two Iranian attack drones near Bahrain. Secretary of State Rubio stated further military action is not needed against an economically weakened Iran, while President Trump directed Vice President Vance to shift focus from the war to domestic corruption and crime and declared that the US does not need a deal with Iran. Fresh attacks on Riyadh and continued airline suspensions prolonged regional disruptions.
