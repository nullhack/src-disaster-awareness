log_date: '2026-08-10'
summary: Iran toughened its demands for reopening the Strait of Hormuz, with the Revolutionary Guards insisting the U.S. must meet conditions including compensation for war damages, even as a deal with Oman is said to be in final stages. Iran-backed Houthis attacked an Aramco refinery in Saudi Arabia and a Red Sea port, while reports indicated President Trump may prioritize reopening the Strait over securing a nuclear deal with Tehran.
