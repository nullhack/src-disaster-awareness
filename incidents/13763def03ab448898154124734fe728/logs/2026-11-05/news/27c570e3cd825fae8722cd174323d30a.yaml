title: After midterm loss, Trump is left to weigh his next move in Iran war that contributed to GOP debacle - Sentinel Colorado
body: Following the Republican Party's significant losses in the midterms, President Donald Trump faces increasing pressure regarding his ongoing eight-month conflict with Iran, which voters linked to rising fuel costs.
