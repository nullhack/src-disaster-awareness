log_date: '2026-11-23'
summary: Houthi forces claimed an attack on Saudi Arabia’s Rabigh oil refinery while President Trump warned of possible new strikes next year, and Iran massed more than 14 tankers at a key export terminal as it weighed challenging the U.S. blockade. Congressional Democrats debated using an upcoming December 11 government funding deadline to restrict money for the war, with some wary of risking a shutdown. Oil prices fell amid a broader equity selloff, though attacks tied to the Iran war limited the losses.
