title: Trump calls Iran conflict ‘small potatoes’ and says he agrees with Vance that it’s not a ‘war’
body: President Donald Trump on Friday said the conflict in Iran is “small potatoes” as he defended Vice President JD Vance for asserting that months of on-and-off attacks in the Middle East are not a “war."
