log_date: '2026-09-06'
summary: On September 5-6, Iran fired ballistic missiles at two U.S. Navy warships, which evaded attack, prompting U.S. forces to strike and destroy three Iranian crude oil tankers near Kharg Island. President Trump dismissed the conflict as "small potatoes," while domestic critics like Senator Bernie Sanders called for an end to the war amid rising gas prices; Iran's rial hit an all-time low as the U.S. economic pressure campaign intensified.
