title: 'Israel Election: Iran Conflict, West Bank Annexation, US Ties And Oct 7 Security Failures In Focus'
body: The upcoming elections in Israel will determine the nation's political leadership and the future course of the conflict with Iran. Key issues on the ballot include potential moves towards full annexation of the West Bank and the trajectory of diplomatic ties with the United States. As the first polls since the October 7 attacks in 2023, the handling of national security and demands for an official inquiry into intelligence lapses remain central debate points. Furthermore, the response to a recent hijack attempt has emerged as a key campaign issue between the ruling leadership and the opposition ahead of voting.
