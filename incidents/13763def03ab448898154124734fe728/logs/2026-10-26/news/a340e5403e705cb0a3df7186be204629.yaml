title: Turkey joins Saudi Arabia, Pakistan in Iran war talks - Turkish Minute
body: Turkey joined Saudi Arabia and Pakistan in Tehran on Monday for talks with Iran aimed at easing tensions in the Middle East war. The delegation representing the three countries, members of the Mecca security pact, also met with Iranian President Masoud Pezeshkian, according to photographs published by his office. Turkey was represented by İbrahim Kalın, […]
