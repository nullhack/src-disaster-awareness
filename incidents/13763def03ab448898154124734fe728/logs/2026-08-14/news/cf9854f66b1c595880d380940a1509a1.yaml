title: Vance says low oil prices are top US goal in Iran conflict
body: 'Vice President JD Vance said Thursday that the top US priority in the Iran war was keeping oil and gasoline prices low for Americans, with preventing Tehran from acquiring a nuclear weapon ranking second. The remarks constrasted with President Donald Trump''s repeated framing of the fight: that entering the war had the sole objective of preventing Iran from acquiring a nuclear weapon, even if that meant short-term economic sacrifices for Americans.'
