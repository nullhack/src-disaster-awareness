title: Retired general predicts Iran will get more aggressive ‘as we get closer to the midterms’ - AOL
body: Retired Gen. Jack Keane forecasted Thursday that Iran’s military would ramp up its campaign against the U.S. approaching the November elections — a move he said would be a miscalculation. “I think as we get closer to the midterms, it’s likely they will,” he told Fox Business Network’s Stuart Varney. “And the reason for that…
