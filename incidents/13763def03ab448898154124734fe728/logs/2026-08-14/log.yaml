log_date: '2026-08-14'
summary: The US threatened an 'indefinite' naval blockade against Iran and plans to roll out an 'economic isolation' plan, while Iran continues to assert full control over the Strait of Hormuz and reject President Trump's claims. Reports indicate the US has lost 45 MQ-9 Reaper drones during the conflict, Israel is shocked by Iran's rapid military recovery, and poor conditions on the USS Abraham Lincoln carrier have drawn Senate concerns. Additional developments include Houthi clashes with Yemeni government forces, the UK economy slowing due to the war, and Canada's CAE losing millions while reducing its global footprint.
