log_date: '2026-08-06'
summary: |-
  Iran and Oman are reportedly nearing a deal that would give Tehran control over inbound traffic through the Strait of Hormuz, with oil prices slipping on renewed hopes for a peace deal. The conflict expanded dramatically as seven explosions rocked Dubai's Jebel Ali area within 20 minutes, marking the first major incident in the UAE. Meanwhile, US Republicans are losing faith in Defense Secretary Pete Hegseth amid reports that President Trump confronted him over dwindling munitions, and the US crude oil emergency buffer has fallen to a 45-year low of just 43 days.
  Iran confirmed it is in the "final stage" of drafting an agreement with Oman over the Strait of Hormuz, having already agreed on a safe shipping route, though Tehran continues to deny direct talks with Washington. Meanwhile, Iran warned Gulf states that any new U.S. attack on its territory would trigger retaliation, as new polls show a majority of Americans expect the Middle East to slide toward chaos and the war is increasingly weighing on President Trump's presidency.
