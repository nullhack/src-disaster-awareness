log_date: '2026-08-06'
summary: Iran and Oman are reportedly nearing a deal that would give Tehran control over inbound traffic through the Strait of Hormuz, with oil prices slipping on renewed hopes for a peace deal. The conflict expanded dramatically as seven explosions rocked Dubai's Jebel Ali area within 20 minutes, marking the first major incident in the UAE. Meanwhile, US Republicans are losing faith in Defense Secretary Pete Hegseth amid reports that President Trump confronted him over dwindling munitions, and the US crude oil emergency buffer has fallen to a 45-year low of just 43 days.
