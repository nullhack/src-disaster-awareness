log_date: '2026-08-18'
summary: The 60-day ceasefire framework between the U.S. and Iran expired on August 17 with no peace deal, as President Trump threatened to "bomb the s*** out of" Oman if it interferes with Strait of Hormuz negotiations. Iran shifted to a "fully offensive" posture, offered bounties of up to $60,000 for killing or capturing U.S. troops, and reportedly has a secret plan to escalate the war, while oil prices rose above $91/barrel and Middle Eastern airlines projected $4.3 billion in losses for 2026.
