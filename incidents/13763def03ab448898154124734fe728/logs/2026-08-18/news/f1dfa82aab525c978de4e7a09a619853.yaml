title: Trump's approval plunges to 33%, hits lowest of his presidency amid Iran war
body: A Reuters/Ipsos poll shows Donald Trump's approval rating has fallen to a presidency low as the US war with Iran drags on. The findings underline deep voter anxiety over rising petrol prices, the economy and the electoral fallout for Republicans.
