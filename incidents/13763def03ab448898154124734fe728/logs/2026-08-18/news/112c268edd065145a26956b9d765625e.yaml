title: Trump threatens Oman as it works with Iran on a Strait of Hormuz deal, and other Middle East news
body: Iran said it has reached an agreement with Oman over a plan for ships to transit the Strait of Hormuz, which runs between the countries, and the sides are now working to finalize details for a joint statement.
