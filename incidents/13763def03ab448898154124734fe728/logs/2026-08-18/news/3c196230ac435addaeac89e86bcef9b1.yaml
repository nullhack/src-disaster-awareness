title: Oil Profits Have More Than Doubled. Here’s What Trump Escalating the Iran War Could Mean for XOM and CVX
body: With the Strait of Hormuz still choked off and Trump now threatening to bomb a U.S. ally mediating the peace talks, the Iran war is about to test exactly how much further Big Oil's windfall can stretch before the whole situation unravels.
