title: Trump rejects Iran’s proposal to reopen the Strait of Hormuz and other Mideast news | Hot Springs Sentinel Record
body: Iran offered this week to reopen the strait and resume talks on its nuclear program in seven days if the U.S. lifts its naval blockade of Iranian ports, waives sanctions on Iranian oil sales and observes a ceasefire that would include Lebanon.
