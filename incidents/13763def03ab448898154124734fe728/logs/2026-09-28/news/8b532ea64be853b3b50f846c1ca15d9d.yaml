title: Iran-linked diesel price spike makes electric trucks cheaper than diesel in key EU markets, environmental group says
body: STOCKHOLM, Sept 28 (Reuters) - A surge in diesel prices linked to this year's Iran conflict has helped make electric trucks cheaper to own and operate than diesel models in six major European Union markets, which account for almost half of the bloc's...
