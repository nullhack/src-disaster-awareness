log_date: '2026-11-26'
summary: |-
  Iranian state media reported that two oil tankers and a third vessel hit naval mines in the Strait of Hormuz on Wednesday, with attacks on shipping described as reaching an all-time high. Iran’s deputy parliament speaker said breaking the U.S. blockade would require preventing other regional oil exports, while Houthi forces advanced near Aden and Iran said it would not hold talks unless its conditions are met.
  Iran denied responsibility for a drone attack in Kuwait that killed two Italian technicians and wounded others, after Kuwait blamed Tehran for the strike. A U.S.-based institute reported that Iran is rapidly constructing an underground facility between key nuclear sites as Gulf tensions rise. Oil prices rose in early Asian trading as Iran claimed mine strikes on ships, and a Newsweek analysis examined AI’s role in the war.
