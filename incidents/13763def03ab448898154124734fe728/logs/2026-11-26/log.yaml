log_date: '2026-11-26'
summary: Iranian state media reported that two oil tankers and a third vessel hit naval mines in the Strait of Hormuz on Wednesday, with attacks on shipping described as reaching an all-time high. Iran’s deputy parliament speaker said breaking the U.S. blockade would require preventing other regional oil exports, while Houthi forces advanced near Aden and Iran said it would not hold talks unless its conditions are met.
