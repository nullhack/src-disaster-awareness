title: Houthi rebels close in on the city of Aden as Yemeni forces dig in behind a fortified line
body: Iran-backed Houthi rebels have advanced close to Yemen's government seat in the port city of Aden. A military official said on Tuesday that forces fighting them have set up defenses around the city. Iran reiterated that it won't hold talks with the U.S. to end the conflict unless certain conditions are met. Meanwhile, at least nine Palestinians were killed in Israeli strikes in Gaza. That's according to local officials. The Saudi-led coalition reported a "terrorist attack" on a tower in Riyadh's financial district, injuring 11 people. Iran's Revolutionary Guard said three oil tankers caught fire after hitting mines in the Strait of Hormuz.
