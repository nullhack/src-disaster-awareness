title: Houthis hit Aramco and Mocha as Iran links Hormuz reopening to US terms
body: The Houthis said they struck an Aramco facility in Jazan and Yemen's Mocha port. The attacks coincided with Iran tying any Hormuz reopening and US talks to strict conditions.
