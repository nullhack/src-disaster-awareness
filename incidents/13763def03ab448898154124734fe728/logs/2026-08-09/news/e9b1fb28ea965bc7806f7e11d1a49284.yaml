title: Iran Guards say won't reopen Hormuz without US meeting all Tehran's conditions
body: Iran's Revolutionary Guards said on Sunday they would not reopen the Strait of Hormuz, vital to the world economy, until the United States met Tehran's conditions set out the day before, including compensation for war damages. Iran has imposed an effective blockade of the strait since the United States and Israel attacked in late February, and wants to charge tolls for passage, striking ships it accuses of attempting to circumvent its preferred route.
