title: Iran makes new strait demands, the UAE says a ship was targeted and other Middle East news
body: Iran has issued dramatic new demands around the reopening of the Strait of Hormuz. Oman says talks to manage the strait between it and Iran are continuing. Meanwhile, the United Arab Emirates said on Saturday that an Iranian missile targeted one of its ships that's owned by Abu Dhabi’s state-run ADNOC oil company. No casualties were reported. Elsewhere in the region, Yemen’s military attacked the country's Iranian-backed Houthi rebels in response to the strikes, escalating tensions and threatening to reignite the civil war. And Turkey's foreign minister gave new details on a defense agreement with Saudi Arabia and Pakistan.
