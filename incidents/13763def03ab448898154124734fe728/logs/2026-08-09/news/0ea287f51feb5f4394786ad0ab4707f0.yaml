title: Houthis hit Saudi oil site as Iran hardens Strait of Hormuz conditions
body: Yemen's Houthis claimed a drone strike on a Saudi Aramco facility in Jazan. The attack came as Iran hardened conditions on US talks and any reopening of the Strait of Hormuz.
