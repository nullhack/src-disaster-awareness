title: Lufthansa latest airline to flag ticket price hikes amid Iran war energy shock
body: Lufthansa on Tuesday became the latest airline to warn that ticket prices will rise further, as it forecast a two-billion-euro ($2.2 billion) jump in annual fuel costs due to the Middle East conflict."With rising revenues amid consistently high demand and strict cost discipline, we were able to more than offset the increase in fuel costs of approximately half a billion euros," he said.
