title: Iran warns of military ship ban in Hormuz under potential deal with Oman, and other Middle East news
body: Iran won't allow military vessels to transit through the Strait of Hormuz under an agreement that the Islamic Republic is negotiating with Oman, Iran's deputy foreign minister said.
