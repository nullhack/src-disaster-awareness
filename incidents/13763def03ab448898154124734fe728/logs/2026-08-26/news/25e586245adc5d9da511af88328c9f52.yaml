title: Iran and Oman discuss temporary Hormuz corridor as impasse with US drags on - BusinessWorld Online
body: CAIRO — Iran said it had restarted talks with neighbor Oman to manage the Strait of Hormuz as it faces heightened economic pressure from US President Donald Trump in the wider conflict. Iran and Oman have been in on-and-off talks for weeks about controlling traffic through the strategic waterway, which handled one-fifth of global oil […]
