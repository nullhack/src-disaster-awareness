title: Latest News – Iran’s War With Israel and the United States | Global Conflict Tracker
body: In February 2026, the United States and Israel attacked Iran, killing Supreme Leader Ali Khamenei and targeting nuclear and military infrastructure. A Pakistan-mediated ceasefire and June MOU halted large-scale fighting, but both sides have since traded strikes over alleged violations. A durable settlement remains elusive, with core disputes over Iran’s nuclear program, the Strait of Hormuz, and sanctions relief unresolved.
