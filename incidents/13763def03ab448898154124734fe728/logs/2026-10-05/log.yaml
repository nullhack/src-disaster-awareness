log_date: '2026-10-05'
summary: |-
  Two oil tankers were struck near Oman and Iran over the weekend as Tehran restated its conditions for fully reopening the Strait of Hormuz. Crude exports from Gulf countries via the waterway have rebounded to 80% of pre-war levels, with more producers resuming transit despite ongoing threats.
  Iran's oil minister resigned amid the ongoing US blockade, and Tehran reiterated that the Strait of Hormuz will remain closed until its seven conditions are fulfilled. Middle East oil exports have surpassed pre-war levels despite the conflict, while the US repositioned forces by withdrawing bombers from the UK. The war continues to shape domestic politics and economic debates, with Saudi Arabia emerging as a major beneficiary of higher oil revenues.
