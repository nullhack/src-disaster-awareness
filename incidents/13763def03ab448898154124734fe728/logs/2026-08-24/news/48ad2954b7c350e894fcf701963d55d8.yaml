title: US cancels joint marine drills with South Korea over Iran war-related force constraints
body: SEOUL, Aug 24 (Reuters) - The United States cancelled a joint amphibious landing drill scheduled for next month with South Korea, Seoul's Marine Corps said on Monday, after Washington cited constraints on the availability of U.S. forces due to the war in Iran. The U.S. Marine Corps formally notified its South Korean counterpart in June that force availability would be constrained for the division-level exercise, known as Ssangyong, a South Korean Marine Corps spokesperson told a press briefing.
