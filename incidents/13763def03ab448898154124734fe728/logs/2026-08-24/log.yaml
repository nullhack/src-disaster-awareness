log_date: '2026-08-24'
summary: |-
  Iran's top civilian leaders publicly pushed for a deal to end the war, with the parliament speaker declaring "we are hungry, we cannot survive" and the president acknowledging mounting economic difficulties as new U.S. sanctions loom. Iran threatened to halt all oil exports from the Gulf if the U.S. proceeds with its "economic D-Day" campaign, while signaling a fuel price hike that risks internal unrest. A major natural gas discovery was announced, though its development is impeded by the ongoing conflict and blockade.
  On August 24, as the U.S. prepared to unveil "toughest ever" economic sanctions under Trump's "economic D-Day" campaign, Iran's rial hit a record low of 2 million to the dollar and Tehran warned 45 tankers of fines or confiscation for violating its Strait of Hormuz transit rules. The U.S. also cancelled joint marine drills with South Korea due to force constraints from the Iran war, while Omani Foreign Minister planned a visit to Tehran for talks on the waterway. Iran dismissed the sanctions threat as desperation and warned countries that supporting the measures would be considered an "act of war."
