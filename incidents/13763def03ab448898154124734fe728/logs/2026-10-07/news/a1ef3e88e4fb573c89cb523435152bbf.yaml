title: DIY fertilizer is a blessing as farmers face steep prices due to the Iran war
body: It's hard enough being a small-scale farmer. Then the Iran war drove up fertilizer prices. So farmers are using a traditional Asian recipe to make their own. They call it a "labor of love."
