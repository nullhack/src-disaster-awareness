log_date: '2026-11-17'
summary: New U.S. intelligence reporting indicates Iran is developing plans to target senior Trump administration officials by detonating a so-called dirty bomb or carrying out a chemical attack in Washington, according to CNN. An Army whistleblower alleged that military leaders dismissed warnings before an Iranian drone attack killed six U.S. service members at Kuwait's Port Shuaiba, prompting Democratic calls for a probe and President Trump blasting CBS's "60 Minutes" over its reporting. Reporting also described a sudden rise in Iranian attacks on ships in the Strait of Hormuz alongside intensified exchanges of fire, and warned that Iran's gas shortages are expected to worsen this winter, fueling fears of public unrest.
