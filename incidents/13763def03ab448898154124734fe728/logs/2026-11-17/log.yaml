log_date: '2026-11-17'
summary: |-
  New U.S. intelligence reporting indicates Iran is developing plans to target senior Trump administration officials by detonating a so-called dirty bomb or carrying out a chemical attack in Washington, according to CNN. An Army whistleblower alleged that military leaders dismissed warnings before an Iranian drone attack killed six U.S. service members at Kuwait's Port Shuaiba, prompting Democratic calls for a probe and President Trump blasting CBS's "60 Minutes" over its reporting. Reporting also described a sudden rise in Iranian attacks on ships in the Strait of Hormuz alongside intensified exchanges of fire, and warned that Iran's gas shortages are expected to worsen this winter, fueling fears of public unrest.
  Iran fired multiple one-way attack drones at a US radar facility at Bahrain's Sheikh Isa air base, ending a roughly two-month lull and marking its third round of strikes on Bahrain, and US forces retaliated against Iranian targets along a key shipping route. US intelligence reported that Iran is developing plans to attack senior Trump administration officials in Washington, possibly with a dirty bomb or chemical weapon, prompting President Trump to say the threat is being taken "seriously" and that Iran would pay a "major price" if carried out. Separate reporting pointed to possible US use of graphite "blackout bombs" against Iranian infrastructure, while VP Vance vowed the US would not make a long-term commitment to the war and the Navy's top officer acknowledged the conflict has strained maritime forces.
