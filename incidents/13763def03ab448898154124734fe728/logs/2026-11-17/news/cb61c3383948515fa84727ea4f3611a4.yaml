title: Iran launches a third round of strikes on Bahrain, host of U.S. Navy's 5th Fleet
body: Iran fired drones on Tuesday at a U.S. radar facility in Bahrain, and the U.S. retaliated by firing at Iranian targets along an important shipping route.
