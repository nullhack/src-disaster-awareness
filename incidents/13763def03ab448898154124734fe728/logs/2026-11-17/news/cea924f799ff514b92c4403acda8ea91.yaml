title: US intel indicates Iran developing plans to potentially detonate a dirty bomb in Washington, sources say
body: US intelligence now suggests Iran is plotting potential attacks on Trump-era officials in DC, possibly using a dirty bomb or chemical weapon, raising concerns though no immediate threat is confirmed. Officials are actively planning responses amid ongoing geopolitical tensions and unsettled diplomatic efforts.
