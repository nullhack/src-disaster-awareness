title: 'Report: Iran’s strikes on US bases hit warning systems first | Arkansas Democrat Gazette'
body: WASHINGTON -- Iran's strikes on more than two dozen U.S. bases in the Middle East focused on early-warning systems before hitting aircraft and buildings, causing billions of dollars in equipment damage, according to an Associated Press analysis.
