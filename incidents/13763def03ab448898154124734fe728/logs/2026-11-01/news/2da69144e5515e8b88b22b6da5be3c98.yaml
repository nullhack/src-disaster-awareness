title: Big Oil’s Iran War Windfall Is Nearly 3 Times Last Year’s Profits
body: A war thousands of miles away quietly transformed six months of oil company earnings in ways that have left American families absorbing costs they may not fully see yet, and the next big shift could come the moment polls close on November 3.
