title: Yamaha pulls out of Qatar MotoGP over 'Middle East situation'
body: Yamaha said on Sunday it will not participate in next weekend's Qatar MotoGP, citing "the situation in the Middle East". Diplomatic efforts to end the Middle East war have been punctuated by repeated threats from the United States and Israel to resume bombardments of Iran. The war began on February 28 with joint US-Israeli strikes on Iran, which retaliated by targeting, among others, Gulf countries allied with Washington.
