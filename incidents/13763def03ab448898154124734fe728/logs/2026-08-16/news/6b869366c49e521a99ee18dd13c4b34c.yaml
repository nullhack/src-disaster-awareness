title: Iran defiant on strait as Trump tells Americans to accept high gas prices - Markets - The Jakarta Post
body: Iran called on the United States to accept defeat while President Donald Trump blasted Tehran as "very evil" and told Americans to brace for continued high fuel prices as a result of the war.
