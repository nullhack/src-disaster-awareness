title: 'WATCH: Trump addresses 2026 United Nations General Assembly'
body: President Donald Trump returned to the U.N. General Assembly on Tuesday at a tumultuous moment for the world — and for his presidency — and made the case that he's shown fortitude while other leaders have equivocated.
