title: Oil rises amid worries of growing Iran-U.S. tensions after Bessent issues Iranian airline shutdown warning
body: Oil rose Tuesday, amid concerns of growing Iran-U.S. tensions. after U.S. Treasury Secretary Scott Bessent told CNBC that all Iranian airlines will be shut down from Wednesday.
