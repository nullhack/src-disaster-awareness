title: Iowa GOP Senate candidate Ashley Hinson calls for Iran war to end despite voting to let Trump continue it
body: Rep. Ashley Hinson, R-Iowa, has voted against House resolutions directing President Donald Trump to halt the war with Iran six times, including as recently as last week.
