log_date: '2026-09-22'
summary: |-
  Iran and the U.S. exchanged new threats, with Iran warning of a wider war and President Trump questioning whether to "blow the entire nation up" while also weighing diplomatic steps. Oil prices fell below $100 a barrel on hopes of diplomacy, but Iran's Revolutionary Guard warned of retaliation, and Houthi attacks on Saudi Arabia escalated. Separately, the Trump administration proposed a $5 billion Middle East reconstruction fund for the war-torn region, and a report detailed how the conflict has driven up inflation and oil prices.
  On September 22, President Trump used his UN General Assembly speech to threaten "annihilating" Iran unless a deal is reached, while Gulf leaders urged him to avoid further escalation during sideline meetings. A new poll shows nearly two-thirds of Americans say the US is not winning the war, and Republican support for Trump's handling is showing cracks. Separately, analysts warn that Iran-backed Houthis are poised to threaten the Bab el-Mandeb Strait, adding to the global economic strain from sustained high fuel prices.
