log_date: '2026-08-05'
summary: Qatar said mediators were making progress toward ending the US-Iran war, while Iran and Oman moved closer to a deal to reopen the Strait of Hormuz, though Tehran continued to deny direct talks with Washington. The US military reportedly used "virtually all" of its long-range precision missiles during the conflict, drawing a sharp denial from Defense Secretary Hegseth, while CSIS warned depleted stockpiles could embolden China. BP posted a 143% profit hike to $5.7 billion amid high oil prices, and a new poll showed a growing majority of Americans want the war ended immediately.
