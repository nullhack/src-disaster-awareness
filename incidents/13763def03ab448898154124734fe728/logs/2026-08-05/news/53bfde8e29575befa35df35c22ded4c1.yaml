title: Trump says Strait of Hormuz deal could come Wednesday as gas prices stay high
body: President Donald Trump said he held productive "all-day" negotiations with Iran on Tuesday, adding that the country should make a deal to reopen the Strait of Hormuz in a bid to ease oil prices.
