title: Rep. Moran backs end to Iran War, continued conflict if necessary - AOL
body: TYLER, Texas (KETK) – Tyler’s United States Congressman Nathaniel Moran voiced his support for bringing an end to the war with Iran on Tuesday, but he noted that the conflict could continue for some time. On Tuesday, KETK News anchor Nolan Hoffman sat down with Moran to discuss the Iran War and several other issues […]
