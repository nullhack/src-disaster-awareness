title: US stocks hit records as profits keep piling up for Palantir and others, while oil prices ease
body: The U.S. stock market rallied to records as companies kept piling up profits and oil prices eased. The S&P 500 shot up 1.8% Tuesday, and the main measure of Wall Street’s health topped its prior all-time high set in June.
