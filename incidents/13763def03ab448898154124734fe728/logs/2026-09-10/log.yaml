log_date: '2026-09-10'
summary: President Trump predicted the Iran war will end "immediately after" the November midterm elections, stating oil prices will not fall until then, as Brent crude surged back above $100 a barrel following renewed US-Iran clashes. Separately, Perim Island in Yemen's Bab al-Mandab Strait has become a strategic prize as the conflict expands beyond the Strait of Hormuz. Iran signaled readiness for a more intense war, and Houthi attacks on Saudi oil facilities injured over 70 people.
