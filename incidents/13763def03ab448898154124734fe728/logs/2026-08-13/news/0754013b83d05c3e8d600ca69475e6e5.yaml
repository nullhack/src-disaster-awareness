title: Inflation slows but prices remain elevated as Iran war and spending on AI push up prices
body: U.S. inflation slowed last month and a measure of underlying price pressures also cooled, suggesting higher oil and gas prices from the Iran war are only having a limited impact on broader costs in the economy.
