title: Oil prices edge up amid US-Iran deadlock
body: Oil prices rose slightly on Wednesday as attacks on ships in the Middle East continued and talks to end the Iran war hit an impasse. However, the gains were limited after forecasters cut global oil demand projections for 2026.
