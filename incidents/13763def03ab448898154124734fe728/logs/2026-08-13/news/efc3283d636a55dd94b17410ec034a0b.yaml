title: New attacks on shipping as Iran war talks hit fresh impasse
body: By Elwely Elwelly and Parisa HafeziDUBAI, Aug 12 (Reuters) - The U.S. and Yemen's Iran-aligned Houthis reported separate attacks on shipping on Tuesday as prospects for ending the Iran war appeared to dim, with Tehran saying the Strait of Hormuz would remain closed unless Washington accepts its conditions.The attacks, in the Gulf of Oman leading to the strait and at the entrance to the Red Sea — both vital chokepoints for global oil supplies — come as the war shows no signs of ending despite repeated assertions from U.S. President Donald Trump of a deal being imminent.
