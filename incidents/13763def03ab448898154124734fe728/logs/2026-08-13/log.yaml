log_date: '2026-08-13'
summary: 'On August 12, U.S.-Iran talks remained at an impasse, with Iran insisting the Strait of Hormuz will not reopen until its conditions are met, while President Trump claimed “total control” of the waterway. New attacks on shipping escalated: Iran-aligned Houthis killed six mariners in a ballistic missile strike on a cargo vessel in the Red Sea, and other vessels came under fire in the Gulf of Oman. The economic fallout deepened, with TUI reporting profit drops from stranded cruise ships and higher fuel costs, the U.S. inflation report showing elevated energy prices, and Britain warned of potential recession.'
