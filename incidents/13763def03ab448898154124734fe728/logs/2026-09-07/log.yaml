log_date: '2026-09-07'
summary: The U.S. military destroyed three Iranian oil tankers after Iran targeted U.S. warships, while Iran claimed to have struck an unmanned U.S. vessel in the Strait of Hormuz—a claim the U.S. denied—and Tehran announced plans to create an "exclusion zone" outside the waterway. President Trump downplayed the conflict as "small potatoes" and backed VP Vance's claim it is not a war, drawing bipartisan criticism, as Energy Secretary Wright signaled a limited chance of reaching a nuclear agreement with Iran. Oil prices rose above $96 per barrel, a new poll showed declining Republican intensity of support for Trump's war handling, and the Pentagon faced backlash for refusing death benefits to soldiers' families on the grounds that the conflict is not officially a war.
