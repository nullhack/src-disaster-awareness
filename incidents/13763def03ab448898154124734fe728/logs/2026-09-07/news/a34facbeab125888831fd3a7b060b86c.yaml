title: Iran says it hit US unmanned vessel in Hormuz, US calls claim a lie
body: Iran said it struck an unmanned US vessel entering the Strait of Hormuz, a claim Washington denied. The exchange highlights renewed fighting around oil routes even after June's fragile ceasefire.
