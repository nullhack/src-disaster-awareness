title: Citi and ANZ raise Brent crude forecasts amid Middle East supply disruptions
body: Citi and ANZ have raised their Brent crude oil price forecasts as disruptions to Middle East supplies continue to affect the global oil market. Citi increased its third-quarter 2026 Brent forecast to $86 per barrel.
