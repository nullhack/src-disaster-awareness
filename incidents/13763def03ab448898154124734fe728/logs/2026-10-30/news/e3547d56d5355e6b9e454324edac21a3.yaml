title: 22 Indians killed during ongoing Middle East conflict, says Ministry of External Affairs - Connected to India News I Singapore l UAE l UK l USA l NRI
body: Twenty-two Indians, including 14 seafarers, have been killed in the ongoing Middle East (aka West Asia) conflict and India is “deeply concerned” over the overall situation in the region, the Ministry of External Affairs (MEA) said.
