log_date: '2026-10-30'
summary: |-
  Oil prices surged towards $120 a barrel as President Trump signaled it is "decision time" on whether to seek a deal with Iran or resume military strikes. Japan is scaling back fuel subsidies due to the war's economic strain, and the UK issued travel disruption warnings for 16 countries amid ongoing Middle East tensions. Iran claimed to have destroyed 68 US drones since the conflict began, a new report revealed a secret Iranian network of 5,000 military agencies importing hardware despite the US blockade, and 22 Indians have been killed in the fighting.
  President Trump said the war with Iran would be “wrapped up soon” and insisted Tehran must never obtain nuclear weapons. Iran’s Revolutionary Guard reported that oil tankers caught fire in the Strait of Hormuz, while an analysis revealed that more than 50 U.S. oil and gas companies have raked in over $130 billion in profits during the conflict. Separately, a U.S. senator warned that Trump’s Iran war plan would cause “devastating escalation.”
