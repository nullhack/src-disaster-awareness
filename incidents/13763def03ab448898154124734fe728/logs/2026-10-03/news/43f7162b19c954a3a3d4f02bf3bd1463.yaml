title: 'US-Iran war LIVE: Fire, smoke seen near Aramco facility in Riyadh amid Saudi-Houthi escalation | Today News'
body: 'US-Iran war news LIVE: A large plume of smoke and fire was seen rising near an Aramco facility in Riyadh on Saturday, Reuters reported citing a witness. The incident comes amid escalating hostilities between Saudi Arabia and Yemen’s Iran-aligned Houthis.'
