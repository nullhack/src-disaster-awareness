log_date: '2026-08-17'
summary: On August 16-17, President Trump ordered the Pentagon to reduce military exercises with South Korea, citing insufficient help in the Iran war, while the US moved its last aircraft carrier out of the Pacific to replace the USS Abraham Lincoln in Middle East operations. Iran announced a $30,000 bounty program for killing or capturing US soldiers and rejected Trump's claim of the Strait of Hormuz as US territory, as Israel struck Lebanon amid stalled peace negotiations. The economic toll deepened for both sides, with Iranians facing soaring prices and Trump telling Americans to brace for continued high fuel prices.
