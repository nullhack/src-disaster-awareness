log_date: '2026-11-11'
summary: Oil prices fell below $90 after Trump signaled restraint, though shipping attacks in the Strait of Hormuz continued, offsetting some optimism. Rubio said there is no need for new US strikes, but Iran accused Washington of faking negotiations, and the US moved military aircraft from a second UK base following an Iranian threat. Domestically, a majority of Americans and Republicans now want Congress to end the war, and House Republicans blocked an impeachment vote against Defense Secretary Hegseth.
