title: OPEC+ oil output in October nears pre-Iran war rate, led by Saudi Arabia
body: OPEC+ crude oil production jumped in October, led by a sharp increase in output from Saudi Arabia despite continued disruption to shipments through the Strait of Hormuz caused by the Iran war.
