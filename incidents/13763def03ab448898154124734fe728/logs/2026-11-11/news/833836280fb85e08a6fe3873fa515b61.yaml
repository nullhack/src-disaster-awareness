title: Trump shares update on Iran war that could be very welcome for Formula 1
body: After reports of an American attack on Qeshm Island in Iran last Friday, United States President Donald Trump said he would hold off on further attacks for the time being. Later this month, Formula 1 is scheduled to travel to the region for the Qatar Grand Prix.
