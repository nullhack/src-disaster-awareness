title: Oil rises from two-month low as Hormuz shipping attacks offset Iran truce hopes
body: Oil rose on Wednesday after falling to two-month lows in the previous session, as the market swung between hopes for a de-escalation in the Iran war and concerns about ongoing attacks on shipping in the Strait of Hormuz.
