log_date: '2026-11-22'
summary: Iran’s foreign minister said Tehran wants guaranteed diplomacy and a fair, verifiable deal while insisting on keeping enriched uranium, but Washington rejected its terms, and the IRGC claimed to have downed a U.S. drone over the Strait of Hormuz. Iran’s Revolutionary Guard said it targeted U.S. radar positions at two Bahrain bases, damaging a civilian industrial facility, while two tanker incidents near Oman’s Khasab and a naval-mine strike kept Hormuz shipping under threat. Iran also unveiled an underground missile launcher and said 428 children were killed in two wars, prompting a Red Crescent call for an independent probe into the Minab school attack, while reporting said Trump was favoring tightening the economic blockade and VP Vance declined to endorse the decision to attack Iran.
