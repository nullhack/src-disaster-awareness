title: Iran’s IRGC says targeted US positions at two bases in Bahrain with missiles, drones
body: Iran's Revolutionary Guard claimed missile and drone strikes targeted US military radars at two air bases in Bahrain, escalating regional tensions. Bahrain reported damage to a civilian industrial facility, while Tehran warned Washington against airspace violations and called its economic blockade an act of war
