log_date: '2026-09-02'
summary: |-
  The U.S. launched large-scale airstrikes on Iranian military targets on September 1-2, marking the most serious escalation in weeks, and Iran retaliated by striking U.S. bases in Bahrain, Kuwait, and Jordan. Two additional oil tankers were attacked in the Strait of Hormuz, and oil prices surged over 2% amid the renewed hostilities. Iran's president signaled readiness to return to a June ceasefire if the U.S. does, while Qatar continued mediation efforts to end the war and reopen the Strait of Hormuz.
  The U.S. launched large-scale airstrikes on Iranian military targets, prompting Iran to retaliate with drone and missile attacks on U.S. allies in the Gulf, including Kuwait, Bahrain, and Jordan. Iran claimed two tankers struck naval mines in the Strait of Hormuz—a claim disputed by the U.S.—while reports emerged that Russia is secretly supplying Iran with supersonic cruise missiles. The renewed hostilities ended a monthlong lull, sent oil prices surging, and drew international calls for de-escalation.
