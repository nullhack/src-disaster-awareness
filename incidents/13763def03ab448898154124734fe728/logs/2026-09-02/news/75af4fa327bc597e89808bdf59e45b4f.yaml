title: US launches new strikes on Iran and Tehran hits back in widening conflict - BusinessWorld Online
body: WASHINGTON/DUBAI — The US launched a barrage of airstrikes against Iran on Tuesday, prompting Iranian retaliation, in the most serious escalation in weeks in a conflict that has driven up global energy prices and weighed on President Donald Trump’s popularity at home. The strikes followed a weekend exchange of fire — the first since July […]
