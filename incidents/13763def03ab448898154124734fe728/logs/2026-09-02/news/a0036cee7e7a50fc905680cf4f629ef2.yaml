title: US military completes latest strikes against Iran, while Trump vows more for Tehran's retaliation
body: The U.S. military has hit targets in Iran, and Tehran has fired missiles and drones in response. Iranian officials say the latest U.S. attacks hit a house hosting a wedding, killing five people. Central Command said late Tuesday that the new barrage was complete after the U.S. hit Iranian military targets. Explosions have been seen over the southern Jordanian city of Aqaba as Iran says it is retaliating for U.S. strikes. U.S. President Donald Trump says the strikes targeted Iranian radar systems. Hostilities are flaring once again in an intermittent war that has lasted more than six months.
