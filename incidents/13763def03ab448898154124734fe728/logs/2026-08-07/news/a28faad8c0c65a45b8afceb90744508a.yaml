title: Iran seeks to bar US ships in Hormuz as deal with Oman advances
body: Both U.S. and Iranian officials have been signaling in recent days that some kind of accord on Hormuz is close. President Donald Trump, who stepped back from his most recent threats to resume military attacks on Iran, said so again late Wednesday.
