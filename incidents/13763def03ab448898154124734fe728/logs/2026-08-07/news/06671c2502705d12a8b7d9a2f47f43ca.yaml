title: Iran war weighs heavily on global growth, German industry group warns
body: The war in Iran is significantly weighing on global economic growth and has dashed hopes of a stronger recovery this year, Germany's leading industry association said on Friday. The Federation of German Industries (BDI) expects global economic growth to slow by almost half a percentage point to 3% in 2026, according to its latest global growth outlook.
