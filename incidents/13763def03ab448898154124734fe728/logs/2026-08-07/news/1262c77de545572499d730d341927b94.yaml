title: Trump says agreement with Iran to reopen Strait of Hormuz ‘could be soon’
body: President Donald Trump said a deal with Iran to reopen the Strait of Hormuz could happen soon as the U.S. military continues enforcing a blockade on Iranian ports and tensions remain high throughout the Middle East.
