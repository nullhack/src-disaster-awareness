title: Iran claims it struck an oil tanker in the Strait of Hormuz, and other Mideast developments
body: Iran says it has struck an oil tanker trying to transit the Strait of Hormuz. Tehran has asserted control over the waterway since the U.S. and Israel launched the war on Feb. 28. Meanwhile, hundreds of thousands of Iranians rallied in Tehran in support of the government. South Korea says it is considering expanding the operations of a naval operation in the Gulf of Aden off the Arabian Peninsula to protect its ships and oil routes. South Korea's president stressed that his country would not send troops to intervene in the Iran war.
