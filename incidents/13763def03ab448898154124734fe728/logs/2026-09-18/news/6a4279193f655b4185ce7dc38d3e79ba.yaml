title: Trump claims he has spoken to Iran 'directly,' says war is 'hopefully' near an end
body: President Donald Trump on Wednesday said he has spoken to Tehran "directly," adding that the Iranians "want to make a deal" with the United States. He also said the war, which began on Feb. 28, is "hopefully" coming to an end in the near term.
