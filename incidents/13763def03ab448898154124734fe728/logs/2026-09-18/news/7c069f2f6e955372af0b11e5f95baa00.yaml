title: 'UN investigators say US likely committed war crimes in Iran : Here & Now Anytime'
body: Experts commissioned by the UN report that they have "reasonable grounds" to believe the U.S. committed war crimes during two airstrikes in Iran, including one that hit a school in February. We speak with Negar Mortazavi, senior fellow at the Center for International Policy and host of "The Iran Podcast." Then, the House of Representatives is heading home and won't be back in session until the midterms. NPR's Sam Gringlas shares the latest. And, someday soon, your doctor may prescribe the psychedelic drug LSD to treat anxiety. STAT's Elaine Chen talks about the latest developments in LSD therapy for anxiety.
