title: Trump calls plunder of Venezuelan oil a ‘gift’ as Washington tries to refill war-drained reserves
body: US President Donald Trump has announced that Washington will pour Venezuelan crude into America’s emptied Strategic Petroleum Reserve, dressing up the seizure of a sovereign nation’s wealth as a “gift” to the American people.
