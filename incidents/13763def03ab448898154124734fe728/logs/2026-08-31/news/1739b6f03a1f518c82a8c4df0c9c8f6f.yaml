title: Oil Prices Jump Above $90 As U.S. and Iran Trade Strikes. Is $100 Next?
body: Fresh strikes between U.S. and Iranian forces have crude surging past $90, but the real question for oil investors is not what happened this morning. It is what happens to the narrow strait that controls one-fifth of the world's oil supply if the next exchange goes further.
