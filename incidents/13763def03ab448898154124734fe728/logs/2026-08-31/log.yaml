log_date: '2026-08-31'
summary: US forces struck Iranian rocket launchers on Larak Island on August 30, the first direct military action in weeks, prompting Iran to retaliate with ballistic missile attacks on US bases in Jordan. President Trump claimed that Iran's Kharg Island was "blown to smithereens," though no confirmation was provided. The exchange marks a significant escalation after a period of diplomatic and economic pressure.
