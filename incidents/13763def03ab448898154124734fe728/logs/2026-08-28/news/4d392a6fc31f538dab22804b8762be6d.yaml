title: 'The Latest: Trump signs order to rename Lake Ontario to ‘Lake America’'
body: President Donald Trump said Thursday he is renaming Lake Ontario to be known as “Lake America” in the U.S. as he exacerbates his trade war with Canada. The Republican president signed an executive order updating the lake’s name for the U.S. geographic naming service. Trump cannot, however, force Canada to follow his preferred naming convention.
