title: Iran launches renewed missile attacks as US and Saudis strike Tehran-backed militias in Iraq
body: Iran has launched a barrage of missiles at American forces in the Middle East. The U.S., meanwhile, partnered with Saudi Arabia on Wednesday to strike Iran-backed militias in neighboring Iraq, killing at least 20 fighters. Iraqi militia officials said six Iranian advisers were also killed in the U.S.-Saudi strikes. The flare-up after several days of relative calm raised the risk of a return to all-out war. It also underscored the difficulty of winding down a five-month conflict that has jolted the world economy and is deeply unpopular among Americans. Elsewhere, drone strikes ignited fires on two natural gas vessels at an Egyptian port. It was not immediately clear who was responsible.
