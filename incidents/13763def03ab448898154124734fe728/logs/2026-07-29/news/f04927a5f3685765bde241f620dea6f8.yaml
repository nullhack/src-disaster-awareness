title: Oman presents Iran with plan to manage strait | Arkansas Democrat Gazette
body: DUBAI -- Oman has presented Iran with a plan backed by Gulf states to manage the Strait of Hormuz, including collecting voluntary fees for using it, a Gulf source and a Western diplomat told Reuters on Tuesday.
