title: Pentagon shifts Iran conflict casualties into new Overseas Operations category
body: The Pentagon has moved recent US deaths and injuries from the Iran war tally into a new Overseas Operations category. The shift has intensified scrutiny over how casualties from renewed fighting are being officially counted.
