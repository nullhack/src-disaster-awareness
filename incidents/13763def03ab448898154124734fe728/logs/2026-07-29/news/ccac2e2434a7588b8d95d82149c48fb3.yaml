title: House again passes a resolution seeking to halt military action in Iran as the conflict escalates
body: The House has narrowly passed a resolution to halt U.S. military action in Iran, sending a warning to President Donald Trump for the second time as the war has escalated and the future of the conflict is increasingly uncertain
