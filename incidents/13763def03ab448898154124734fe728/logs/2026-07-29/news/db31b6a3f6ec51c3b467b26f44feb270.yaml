title: Jordan intercepts Iranian missiles as U.S. and Saudi Arabia strike militias in Iraq
body: Jordan intercepted five missiles launched from Iran, the country's military said, hours after the U.S. military said it had knocked down an Iranian missile barrage launched against American forces.
