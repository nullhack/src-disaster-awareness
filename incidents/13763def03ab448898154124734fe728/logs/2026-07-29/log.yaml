log_date: '2026-07-29'
summary: Iran launched a surprise missile attack on US forces in Jordan on July 28, which the US says it successfully intercepted, ending a five-day pause in the conflict. Diplomatic efforts continued with Oman presenting a Gulf-backed plan for voluntary fees to reopen the Strait of Hormuz, while Iran reportedly received Chinese shoulder-launched missile systems. The Pentagon faced renewed scrutiny over its reclassification of troop deaths, and public support for the war dropped to a new low of one in three Americans.
