title: US-Iran strikes raise fears of renewed war across the Middle East
body: By Parisa Hafezi and Bo EricksonDUBAI/WASHINGTON, Sept 2 (Reuters) - Fears of renewed escalation gripped the Middle East on Wednesday after the United States and Iran exchanged their biggest barrage since July, with Washington striking Iran's southern coast and Tehran firing atU.S. bases across the region.With the U.S. threatening further strikes,Iran accused Washington of hitting a wedding party, killing four people and wounding dozens. Its health minister later said 18 people in total had been killed and 108 injured in the latest wave ofU.S. strikes.
