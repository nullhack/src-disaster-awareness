log_date: '2026-09-03'
summary: The US and Iran exchanged their heaviest strikes in over a month on September 1-2, with the US launching large-scale airstrikes on Iranian military targets and Iran retaliating with drone and missile attacks on US bases in Jordan, Kuwait, and Bahrain. The strikes included a controversial US missile that reportedly hit a wedding party in southern Iran, killing four civilians and wounding dozens, prompting Iran to accuse the US of war crimes. Trump aides are reportedly seeking to keep the conflict contained ahead of the November midterm elections, while oil prices rose and fell on the uncertainty.
