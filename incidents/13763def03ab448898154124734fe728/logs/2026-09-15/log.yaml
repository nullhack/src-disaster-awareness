log_date: '2026-09-15'
summary: |-
  Houthi rebels seized two strategic Red Sea islands, strengthening their control over key shipping routes, while Saudi Arabia warned it would respond "firmly" to Houthi attacks that wounded 13 civilians. Talks between Iran and Gulf states on the Strait of Hormuz were postponed, dealing a blow to reopening efforts. A U.S. watchdog's first report tallied the war's costs at $33.4 billion and highlighted weapons shortfalls, while the U.S. imposed fresh sanctions on Russia's VTB Bank over alleged Iran ties.
  The U.S. military destroyed two small Iranian boats attempting to steal a drone, while a Pentagon inspector general report revealed that "hundreds" of buildings and "dozens" of aircraft were destroyed or damaged during Iran operations, contradicting official denials of stockpile concerns. The war's cost has climbed to at least $42 billion, and the IEA slashed oil demand forecasts, with gas prices rising more than $1 a gallon amid the conflict. Separately, Senate Democratic Leader Chuck Schumer blamed the war for higher U.S. fuel prices, and Australia faces diesel price threats due to the conflict's impact on mining.
