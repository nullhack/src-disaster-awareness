log_date: '2026-09-15'
summary: Houthi rebels seized two strategic Red Sea islands, strengthening their control over key shipping routes, while Saudi Arabia warned it would respond "firmly" to Houthi attacks that wounded 13 civilians. Talks between Iran and Gulf states on the Strait of Hormuz were postponed, dealing a blow to reopening efforts. A U.S. watchdog's first report tallied the war's costs at $33.4 billion and highlighted weapons shortfalls, while the U.S. imposed fresh sanctions on Russia's VTB Bank over alleged Iran ties.
