title: Schumer blames Iran war for higher U.S. gas and diesel prices | Fingerlakes1.com
body: Senate Democratic Leader Chuck Schumer blamed President Donald Trump's war with Iran for higher gasoline and diesel prices and urged the president to end the conflict. His Senate floor remarks accused Trump of wrongly assigning responsibility for the price increases to Ukraine.
