title: New attacks on shipping as Iran war talks hit fresh impasse - BusinessWorld Online
body: DUBAI — The US and Yemen’s Iran-aligned Houthis reported separate attacks on shipping on Tuesday as prospects for ending the Iran war appeared to dim, with Tehran saying the Strait of Hormuz would remain closed unless Washington accepts its conditions. The attacks, in the Gulf of Oman leading to the strait and at the entrance […]
