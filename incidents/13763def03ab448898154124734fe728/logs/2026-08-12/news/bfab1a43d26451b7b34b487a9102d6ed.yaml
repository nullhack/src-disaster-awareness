title: 'US-Iran war Highlights: Iran threatens to keep Strait of Hormuz closed until US ends war, unfreezes funds | Today News'
body: 'US-Iran war Highlights: Iran''s Supreme National Security Council Secretary Mohsen Rezaei said the strait will remain closed as long as the US does not change its behaviour. Tehran wants the US to end the war before the Strait of Hormuz can reopen.'
