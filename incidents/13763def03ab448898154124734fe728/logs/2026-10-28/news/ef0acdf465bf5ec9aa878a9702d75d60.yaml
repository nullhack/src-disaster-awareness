title: Continuous round-the-world cruise comes to an end as Iran war spikes fuel costs
body: By Lex Harvey, CNN (CNN) — A residential cruise ship that has been sailing around the world continuously for more than two years has evicted passengers in Cambodia after the fallout from the Iran war made fuel prices too expensive to continue its voyage. The Florida-based operator of the luxury Villa Vie Odyssey announced Tuesday
