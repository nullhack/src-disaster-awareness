log_date: '2026-11-19'
summary: |-
  Selected news reports that the U.S. military is back to two aircraft carriers supporting Iran war operations. It also adds that BOE Governor Bailey sees the war’s duration and the period of high energy costs as central to the rate path, while Trump said Tehran is “looking at gases” and “biological weapons.” Other excerpts say Iran’s leadership has not moderated, undercutting Vance’s hopes for a diplomatic reset, and that acting Navy Secretary Hung Cao faced Senate questioning over sailor suicide attempts and the war.
  The Iran war’s estimated cost rose to $48.3 billion as of Nov. 13, with lawmakers demanding unreleased estimates of damage to U.S. bases. Senate Republicans blocked a Democratic war powers resolution 48-51, while reports said Iran repeatedly struck U.S. facilities in Bahrain and Kuwait and the U.S. struck an Iranian island. The IEA warned the Strait of Hormuz crisis could leave lasting scars on energy markets, and Trump downplayed a reported Iranian dirty-bomb plot while saying the U.S. will “see what happens” after Jan. 1.
