title: '“Mortgage Rates at a Three-Year High, Treasury Yields at a 24-Year Peak”: Iran War Sends U.S. Borrowing Costs Soaring, With an End to Hostilities and Restored Energy Supplies Key to Stabilizing Rates'
body: U.S. mortgage rates have climbed to their highest level in three years, while the 10-year Treasury yield has reached a new high not seen since 2002. Continued Treasury issuance to finance substantial fiscal deficits, compounded by mounting military costs and persistently high oil prices as the Iran war drags on, is intensifying upward pressure on rates. Higher rates, in turn, are increasing government interest expenses, amplifying the need for additional borrowing to finance the deficit. Although President Donald Trump is pressing for rate cuts, the Federal Reserve (Fed) appears inclined toward another increase before year-end as it guards against the risk of an energy-driven inflation shock spreading more broadly.
