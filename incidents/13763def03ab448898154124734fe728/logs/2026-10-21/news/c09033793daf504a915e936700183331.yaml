title: Ghalibaf allies seek an end to war without giving up leverage over US
body: A current within Iran’s conservative establishment associated with Parliament Speaker Mohammad Bagher Ghalibaf favors maintaining military and economic leverage while keeping open the possibility of a negotiated end to the war with the United States.
