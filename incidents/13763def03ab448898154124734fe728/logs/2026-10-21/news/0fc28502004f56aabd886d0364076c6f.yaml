title: Houthi attacks undermine Saudi Arabia's economic ambitions
body: With airports closed and the capital brought to an effective standstill, attacks by Yemen's Houthis on Saudi Arabia have thrown a wrench in the kingdom's ambitious plans to overhaul the economy and draw foreign investment. A decade ago, de facto ruler Crown Prince Mohammed bin Salman launched his bold Vision 2030, aiming to diversify the economy away from oil and turn the powerful monarchy into a hub for tourism, international events and multinational enterprises.
