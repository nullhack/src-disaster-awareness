title: Solid GM results overshadowed by latest jump in commodity costs
body: Higher commodity costs due to the US-Iran war overshadowed General Motors' solid earnings and a new share buyback announcement Tuesday, sending shares lower.General Motors shares slumped 8.1 percent in afternoon trading.
