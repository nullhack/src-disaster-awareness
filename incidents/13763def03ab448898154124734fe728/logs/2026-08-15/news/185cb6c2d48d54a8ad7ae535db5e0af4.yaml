title: With US-Iran talks stalled, diplomatic efforts expand to unlikely European players
body: While talks to end the Iran war have stalled, the Trump administration appears to be reaching out to a broader swath of countries that might be able to help pressure Tehran or ease its hardline position where traditional mediators haven't succeeded so far.
