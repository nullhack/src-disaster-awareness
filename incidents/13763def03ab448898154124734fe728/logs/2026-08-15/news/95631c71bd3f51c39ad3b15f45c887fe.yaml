title: Iran’s top commander boasts that war efforts prove Islam can ‘rule the world’
body: Lobbing missiles at US bases and allied infrastructure in the Gulf region showed that “Islam can be made to rule the world,” the head of the powerful Islamic Revolutionary Guard Corps, said.
