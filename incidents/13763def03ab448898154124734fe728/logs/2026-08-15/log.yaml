log_date: '2026-08-15'
summary: The U.S. announced plans for unprecedented economic sanctions and a continued naval blockade against Iran, with Treasury Secretary Bessent warning of a "one-two punch." Two UAE-operated ADNOC oil tankers were struck by Iranian drones in the Strait of Hormuz, prompting fresh accusations from the UAE. President Trump defended the USS Lincoln's record-length deployment as "not nearly long enough," while Israel expressed shock at the pace of Iran's military recovery and an oil spill from a struck vessel reached Iran's Qeshm Island, causing environmental damage.
