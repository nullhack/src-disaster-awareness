log_date: '2026-07-30'
summary: Iran launched a missile and drone attack on a U.S. base in Jordan on July 28, ending a brief pause, and also struck targets in Kuwait and shipping in the Strait of Hormuz. In response, the U.S. military conducted heavy waves of airstrikes directly against Iranian targets, with Saudi Arabia joining strikes on Iran-aligned militias in Iraq, marking a significant escalation and expansion of the war into new theaters.
