log_date: '2026-07-30'
summary: |-
  Iran launched a missile and drone attack on a U.S. base in Jordan on July 28, ending a brief pause, and also struck targets in Kuwait and shipping in the Strait of Hormuz. In response, the U.S. military conducted heavy waves of airstrikes directly against Iranian targets, with Saudi Arabia joining strikes on Iran-aligned militias in Iraq, marking a significant escalation and expansion of the war into new theaters.
  The conflict widened to Egypt's coast as drone strikes hit gas vessels at a Mediterranean port, while Iran threatened retaliation for the latest U.S. strikes. New polls found two-thirds of Americans believe the war has not been worth fighting, and the Bank of England held interest rates amid inflation fears from the conflict. Diplomatic efforts stalled as Iran rejected an Omani proposal for joint oversight of the Strait of Hormuz, while Pakistan offered to mediate.
