title: US strikes Iran as widening war engulfs more countries - BusinessWorld Online
body: LONDON/CAIRO/WASHINGTON — The US carried out fresh strikes in Iran on Wednesday, the US military said, further intensifying a five-month-old war that was already expanding beyond its main fronts to embroil additional countries in the region. “US forces began launching strikes against Iran at 8:00 p.m. ET today (0000 GMT),” US Central Command said in […]
