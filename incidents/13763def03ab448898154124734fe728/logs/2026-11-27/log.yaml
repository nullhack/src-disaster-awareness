log_date: '2026-11-27'
summary: Two Italian nationals were killed in a drone strike in Kuwait, which officials blamed on Iran; Tehran denied responsibility and Foreign Minister Abbas Araghchi called the incident “suspicious” and a possible “precooked recipe for war.” President Trump said the Iran war would end “sort of whenever I want it to be,” while Democrats in Congress pushed a plan to cut off funding for the conflict. Oil traded near a one-month high amid tanker attacks in the Strait of Hormuz and a Houthi-claimed strike on Saudi Arabia’s Ras Tanura refinery, as Iranian officials warned of heightened combat readiness and new air defenses if U.S. attacks resume.
