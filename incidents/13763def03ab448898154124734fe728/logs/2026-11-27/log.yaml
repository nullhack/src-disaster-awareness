log_date: '2026-11-27'
summary: |-
  Two Italian nationals were killed in a drone strike in Kuwait, which officials blamed on Iran; Tehran denied responsibility and Foreign Minister Abbas Araghchi called the incident “suspicious” and a possible “precooked recipe for war.” President Trump said the Iran war would end “sort of whenever I want it to be,” while Democrats in Congress pushed a plan to cut off funding for the conflict. Oil traded near a one-month high amid tanker attacks in the Strait of Hormuz and a Houthi-claimed strike on Saudi Arabia’s Ras Tanura refinery, as Iranian officials warned of heightened combat readiness and new air defenses if U.S. attacks resume.
  President Trump said the U.S. is reinforcing its military presence in the Middle East with an additional aircraft carrier and warned that an Iranian nuclear facility would be targeted if strikes resume, while voicing doubt Tehran would agree to a deal. U.S. Central Command said forces disabled another commercial vessel attempting to run the naval blockade of Iranian ports, and Iran's IRGC claimed a tanker was hit in the Strait of Hormuz and a hostile drone was brought down in the southeast. Separate reports described imagery of a new underground complex near Iran's nuclear sites, Tehran's claim that the deadly Kuwait drone strike was a Ukrainian "false flag," and backlash over Trump's remark to a service member about when the war would end.
