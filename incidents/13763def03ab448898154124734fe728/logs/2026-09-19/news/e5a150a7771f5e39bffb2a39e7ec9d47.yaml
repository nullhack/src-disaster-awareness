title: Iran war likely to drive up inflation next year, CBO says
body: The U.S. war against Iran is likely to drive up inflation early next year and could cost at least $2 billion a month as long as it continues, according to a new report from the nonpartisan Congressional Budget Office (CBO). The CBO estimated in its Tuesday report that the main economic impact of the conflict…
