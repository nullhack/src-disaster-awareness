title: China's oil stockpile helped blunt Iran war price shock ahead of Trump-Xi talks
body: As Xi Jinping heads to Washington, analysts say China's oil reserves and lower imports have softened the Iran war's impact on crude prices. The buffer has eased pressure on global markets, but fresh Middle East disruptions keep the outlook fragile.
