title: Gillibrand, senators demand full accounting of Iran war costs | Fingerlakes1.com
body: U.S. Sen. Kirsten Gillibrand and 45 Senate colleagues are demanding that Defense Secretary Pete Hegseth provide Congress with a detailed accounting of spending on the war with Iran, including a proposed $67 billion supplemental request. The New York Democrat said the Pentagon has not provided enough information about direct and indirect military costs, equipment losses or how it intends to use money already approved by Congress.
