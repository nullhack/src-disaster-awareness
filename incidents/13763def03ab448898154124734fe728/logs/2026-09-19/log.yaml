log_date: '2026-09-19'
summary: |-
  New reports show the Iran war has cost $43.6 billion as of Sept 3, and the Pentagon has not disclosed the full extent of troop deaths. Turkey revoked the license of Iran's Mellat Bank, and China's oil reserves helped stabilize crude markets ahead of Trump-Xi talks, while South Korea considers expanding naval operations in the region.
  Iran sent war-end terms to President Trump, while 45 U.S. senators demanded a detailed accounting of war costs and a $67 billion supplemental. Defense Secretary Pete Hegseth denied a Washington Post report that more U.S. troops have died than officially disclosed. Separately, Iran held a “Sacrifice for Iran” parade and the U.S. claimed to have escorted 1 billion barrels of oil from the Strait of Hormuz.
