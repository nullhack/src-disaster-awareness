title: Unilever hiking prices as commodity costs soar amid Iran conflict
body: Unilever has become the latest firm to reveal price hikes to offset soaring costs amid the Iran war. The British multinational consumer goods company behind well known brands including Dove soap and Lynx deodorant said prices had “stepped up” in the third quarter in response to soaring commodity costs, with home and personal care products seeing increases in particular.
