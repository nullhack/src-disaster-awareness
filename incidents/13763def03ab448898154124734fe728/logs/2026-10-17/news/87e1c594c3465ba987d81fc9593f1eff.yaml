title: Oil hits $110 per barrel for first time since May
body: An international oil benchmark hit $110 per barrel on Friday, as the industry faces persistent shocks from the U.S.-Iran and Russia-Ukraine wars. The price of Brent crude oil, the international standard, hit $110 during Friday trading. That marked the first time it has reached that high since May 20, less than three months after the…
