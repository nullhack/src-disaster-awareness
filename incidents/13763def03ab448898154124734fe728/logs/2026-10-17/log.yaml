log_date: '2026-10-17'
summary: |-
  Iran's attacks on shipping escalated as a cargo ship sank in the Strait of Hormuz, while Tehran boosted its air defenses and a cleric urged the war continue until security is assured. President Trump threatened to target Iran's nuclear site on Pickaxe Mountain, and oil prices surged to $110 per barrel for the first time since May. The CENTCOM chief maintained the Strait remains open for business, even as the war's economic toll deepened, with businesses cutting costs and consumers facing higher prices.
  President Trump waived Russia sanctions previously signed into law under the Lindsey O Graham Act, drawing bipartisan backlash. In the Strait of Hormuz, Iran said two oil tankers struck naval mines, and data showed a record high in attacks on ships. Trump ruled out nuclear weapons but indicated possible MOAB strikes, while an Iranian lawmaker threatened to retaliate if the U.S. uses unconventional arms.
