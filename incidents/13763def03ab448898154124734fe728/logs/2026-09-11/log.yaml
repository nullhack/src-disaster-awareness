log_date: '2026-09-11'
summary: Iran-backed Houthi rebels seized Yemen's strategic port of Mokha near the Bab el-Mandeb Strait, threatening a second major global shipping chokepoint, while oil prices surged past $106/barrel amid renewed US-Iran clashes including damage to A-10 and F-15 jets. The U.S. Treasury imposed sweeping aviation sanctions on Iran as part of "Operation Economic Outcast," the IAEA observed construction at Iran's suspected "Pickaxe Mountain" nuclear site, and Iran reportedly resumed ballistic missile production. The European Central Bank raised rates to 2.50% due to war-driven inflation, while President Trump predicted the conflict would end "immediately after" the November midterm elections.
