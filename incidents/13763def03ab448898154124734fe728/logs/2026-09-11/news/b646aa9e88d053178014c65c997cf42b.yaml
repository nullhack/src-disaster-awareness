title: How the U.S. Treasury's New Aviation Sanctions on Iran Extend Beyond Tehran
body: The U.S. Treasury issued sweeping new sanctions against Iran this week, targeting the country’s airlines and their international service providers as it ramps up its effort to isolate Tehran from the global economy.
