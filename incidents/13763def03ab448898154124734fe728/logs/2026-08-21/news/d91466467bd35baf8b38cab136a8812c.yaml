title: Iranian oil offers to Chinese buyers fall as US blockade bites, sources say - BusinessWorld Online
body: SINGAPORE — Offers of Iranian crude to Chinese buyers have declined and prices have jumped this week as the US blockade has cut Tehran’s shipments, according to trade sources, with the threat of more sanctions from Washington looming. The US re-imposed its blockade of Iran’s shipping and ports on July 13 as a deal to […]
