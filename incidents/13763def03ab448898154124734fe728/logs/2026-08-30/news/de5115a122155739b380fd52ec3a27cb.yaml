title: Iran admits economic toll of conflict with US | Arkansas Democrat Gazette
body: DUBAI, United Arab Emirates -- Iranian leaders are acknowledging the economic toll of war with the U.S., with the supreme leader urging the government to address the hardship and the president saying foreign trade has shrunk by one-third due to the American sanctions and blockade.
