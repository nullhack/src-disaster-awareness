title: Iran war drives US transport fuel surcharges, but also industry profits
body: U.S. retailers, manufacturers and small businesses are paying hefty fuel surcharges to ship their goods, not only as the U.S.-Israeli war on Iran boosts fuel costs but also as some shippers profit from the fees.
