title: US military families ride 'roller coaster of emotions' over six months of Iran war
body: By Julia HarteAug 29 (Reuters) - Since the United States went to war with Iran six months ago, Courtney Sanders has been helping soldiers’ families fill the gaps left by their loved ones.There are school pickups to coordinate, lost incomes to supplement — and the ever-present separation anxiety.“It's like being on pins and needles all of the time,” Sanders said.
