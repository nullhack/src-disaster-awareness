title: A more confident Iran emerges after 6 months of war with U.S. | Honolulu Star-Advertiser
body: WASHINGTON >> Iran has grown more confident in its ability to attack targets in the Middle East and appears determined to continue the conflict for months to frustrate the United States, according to U.S. intelligence reports in recent weeks.
