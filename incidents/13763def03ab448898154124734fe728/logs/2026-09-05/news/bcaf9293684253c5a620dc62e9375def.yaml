title: Vance Plays Down Iran Conflict, Says ‘Wouldn’t Call It a War’
body: Vice President JD Vance downplayed the scope of the conflict in Iran, which is now in its seventh month, saying he would not describe it as “a war” just days after military strikes intensified in the region.
