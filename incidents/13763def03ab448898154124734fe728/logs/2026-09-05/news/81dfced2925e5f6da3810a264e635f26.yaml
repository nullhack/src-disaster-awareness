title: Widow of airman killed in Mideast is upset she was told Iran wasn't a war while sorting out benefits
body: The widow of an airman killed on a combat mission in the Middle East says it took a viral social media post to get clarity from the Pentagon on issues related to her husband’s benefits and basic pay months after his death.
