log_date: '2026-09-05'
summary: President Trump dismissed the Iran conflict as "small potatoes" and backed Vice President Vance's claim it is not a "war," triggering bipartisan backlash and criticism from Gold Star families. A new Reuters/Ipsos poll found only 25% of Americans view the war as worthwhile, while diesel prices hit a record high and the U.S. issued new sanctions on a Turkish bank for serving as Iran's "critical financial lifeline." The U.S. also joined Britain, France, and Germany in drafting an IAEA resolution to refer Iran to the UN Security Council, and Trump threatened to strike Iran's "Pickaxe Mountain" as intelligence reports indicated Iran has grown more confident after six months of war.
