log_date: '2026-11-12'
summary: |-
  President Trump claimed the US has won the Iran war but said the naval blockade would continue, while Iranian officials responded on the sidelines of an international climate summit. Trump and Netanyahu reportedly clashed over whether to renew military action, with the US president favoring diplomacy and economic pressure. Republicans are debating new war funding, and the House blocked an impeachment attempt against Defense Secretary Hegseth.
  President Trump redirected Vice President Vance from Iran negotiations to investigate domestic corruption, while House Democratic leader Jeffries signaled willingness to use a government shutdown to end the conflict. Iran’s parliament speaker reiterated that the Strait of Hormuz will never return to its pre-war status, even as oil production neared pre-war levels and prices fell on peace talk hopes.
