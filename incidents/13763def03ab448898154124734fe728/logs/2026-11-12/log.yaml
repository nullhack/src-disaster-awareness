summary: President Trump claimed the US has won the Iran war but said the naval blockade would continue, while Iranian officials responded on the sidelines of an international climate summit. Trump and Netanyahu reportedly clashed over whether to renew military action, with the US president favoring diplomacy and economic pressure. Republicans are debating new war funding, and the House blocked an impeachment attempt against Defense Secretary Hegseth.
