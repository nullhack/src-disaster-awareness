title: The Iran war is driving clean energy development. It's not enough to help the planet, yet
body: Countries are embracing clean power and taking steps to use less energy because of the war against Iran. But it is not yet enough to help address climate change. Some backers of renewables opined at the start of the war that it could drive a green transition as oil and gas prices spiked. So far, more than 30 governments have enacted policies to move away from fossil fuels or improve energy efficiency. Yet at the same time, climate pollution increased marginally and clean energy investments fell. A dozen experts told The Associated Press that while the Iran war appears to be helping clean energy adoption, the world is still heavily dependent on fossil fuels. And it'll take more time for the new policies to show results.
