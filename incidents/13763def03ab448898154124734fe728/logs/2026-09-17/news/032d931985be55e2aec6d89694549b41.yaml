title: UN mission finds grounds to believe US committed war crimes in Iran, and Tehran crimes against humanity - BusinessWorld Online
body: GENEVA — A UN fact-finding mission on Iran said on Thursday it had reasonable grounds to believe the United States was behind two military strikes on a school and sports facility in Iran in February, and that these constituted war crimes. It also found that Iranian authorities committed crimes against humanity during their deadly crackdown […]
