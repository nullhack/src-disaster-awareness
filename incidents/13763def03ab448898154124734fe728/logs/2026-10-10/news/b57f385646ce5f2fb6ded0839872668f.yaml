title: President-Iran conflict ‘small potatoes’
body: WASHINGTON (AP) — President Donald Trump on Friday said the conflict in Iran is “small potatoes” as he defended Vice President JD Vance for asserting that months of on-and-off attacks in the Middle East are not a “war.” Asked during an Oval Office exchange about Vance’s comments made a day earlier, Trump said U.S. strikes […]
