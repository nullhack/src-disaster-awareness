title: 'Bracing For Hurricane Isaias, Ukraine Pushes Russia Back, Iran War Impact On Midterms : Up First from NPR'
body: Hurricane Isaias is expected to strike near the Alabama-Florida state line as communities prepare for dangerous winds, flooding and a life-threatening storm surge.Ukraine is reclaiming territory in the east with a counteroffensive that uses drones and unmanned ground vehicles to push back Russian forces.President Trump says the U.S. will not launch new strikes on Iran before the midterm elections as the unpopular war weighs on Republicans heading into Election Day.Want more analysis of the most important news of the day, plus a little fun? Subscribe to the Up First newsletter.Support public media with NPR+ and enjoy perks for over 25 podcasts like this one. This show’s perks include sponsor-free listening. Learn more at plus.npr.org.Today’s episode of Up First was edited by Susanna Capelouto, Tina Kraja, Megan Pratz, Mohamad ElBardicy and Alice Woelfle.It was produced by Ziad Buchh and Nia Dumas.Our director is Christopher Thomas.We get engineering support from Stacey AbbottOur technical
  director is Carleigh Strange.And our Executive Producer is Jay Shaylor.(0:00) Introduction(01:56) Bracing For Hurricane Isaias(05:40) Ukraine Pushes Russia Back(08:59) Iran War Impact On Midterms
