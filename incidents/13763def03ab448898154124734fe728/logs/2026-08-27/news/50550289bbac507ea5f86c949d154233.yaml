title: OPEC+ influence fades during Iran war as China emerges as key oil market force
body: Six months into the Iran war, OPEC+ is facing a markedly different oil market, with its traditional ability to influence supply and prices weakened by widespread disruption across the Middle East. The conflict has restricted one of the region’s most important oil export routes and damaged energy infrastructure in several OPEC countries, reducing the alliance’s market share and limiting the impact of its policy announcements.
