title: Strait of Hormuz tanker attack sharpens push to de-escalate Iran war
body: Regional powers pushed fresh diplomacy after a tanker was struck in the Strait of Hormuz. The flare-up underscored the war's spillover risk from Iran to Gaza and Jerusalem.
