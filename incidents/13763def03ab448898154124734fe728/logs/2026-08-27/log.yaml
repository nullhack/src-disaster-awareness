log_date: '2026-08-27'
summary: Iran and Oman announced plans for a temporary shipping corridor through the Strait of Hormuz, with Tehran warning it will bar military vessels under any deal, while Qatar’s prime minister prepared to visit Tehran to revive stalled talks. The USS Theodore Roosevelt was ordered to the Middle East, and a tanker was struck in the strait, testing President Trump’s assertion that the waterway is functioning. Trump declared “Mission Accomplished” in Iran and claimed Supreme Leader Khamenei is “seriously wounded,” even as the U.S. pivoted to economic pressure and Iran placed Europe on notice with new threats.
