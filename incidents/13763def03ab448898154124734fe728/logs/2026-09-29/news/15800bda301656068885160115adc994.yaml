title: Iranians stagger under soaring cost of living after seven months of war with the US
body: How far economic strain may push Iran towards diplomatic compromise is unclear, as it tightens its own stranglehold on Gulf energy exports through the Strait of Hormuz, driving up oil and gas prices.
