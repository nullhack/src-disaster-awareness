log_date: '2026-11-20'
summary: |-
  Israeli Prime Minister Netanyahu is reportedly urging President Trump to "finish the job" against Iran with a joint air campaign, while Trump signaled he is in no rush to decide on further military action and pointed to January 1 as the relevant horizon. An IRGC aerospace adviser claimed Iran faces no limits on its missile numbers, deployments, or capabilities. A readout of the Trump-Xi-Putin meeting noted that neither Iran nor Ukraine featured in the leaders' "peace declaration."
  In this batch, President Trump said Iran wants a “fake deal” unacceptable to him and suggested he may not make major decisions on renewed fighting until 2027, while Vice President Vance blamed Republican midterm losses on voter anger over the war and said his job is to support the president. Iran widened attacks by targeting a U.S. air base in Kuwait, a Houthi missile damaged Riyadh’s PIF Tower, Senate Republicans blocked a Democratic resolution to end U.S. involvement, and a government watchdog found the war has worsened U.S. munitions shortages.
