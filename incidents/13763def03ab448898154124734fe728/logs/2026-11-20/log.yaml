log_date: '2026-11-20'
summary: Israeli Prime Minister Netanyahu is reportedly urging President Trump to "finish the job" against Iran with a joint air campaign, while Trump signaled he is in no rush to decide on further military action and pointed to January 1 as the relevant horizon. An IRGC aerospace adviser claimed Iran faces no limits on its missile numbers, deployments, or capabilities. A readout of the Trump-Xi-Putin meeting noted that neither Iran nor Ukraine featured in the leaders' "peace declaration."
