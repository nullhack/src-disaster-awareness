log_date: '2026-10-14'
summary: Iran escalated attacks on Strait of Hormuz shipping and shifted tactics to keep oil prices elevated ahead of the U.S. midterm elections, while Houthi rebels struck Saudi Aramco's headquarters, damaging executive offices and fueling fears of a broader regional war. The conflict’s economic toll deepened as U.S. inflation rose to 3.7% in September, Moody’s estimated average household costs of $2,000, and the Pentagon quietly acknowledged higher troop deaths, even as domestic opposition to the war intensified across the political spectrum.
