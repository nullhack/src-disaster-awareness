title: FM Araghchi meets Field Marshal Munir as Pakistan presses di - Pakistan Today
body: Iranian FM Abbas Araghchi met Chief of Defence Forces Field Marshal Asim Munir in Rawalpindi to discuss bilateral ties and regional developments. The meeting comes as Pakistan continues diplomatic efforts to end the US-Iran war, with Tehran seeking support for reopening the Strait of Hormuz
