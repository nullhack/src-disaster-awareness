title: Third US carrier joins Iran blockade, Bessent warns of economic collapse
body: A third US aircraft carrier arrived in the Middle East Sunday, joining forces enforcing a blockade of Iranian ports, while Treasury Secretary Scott Bessent warned of a historic economic collapse in Iran, predicting a 25 percent contraction over the coming year.
