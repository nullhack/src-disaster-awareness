title: Donald Trump's 'praying soldiers' video raises eyebrows over AI and Iran War timing - AOL
body: On November 16, President Donald Trump shared a video on Truth Social showing "praying soldiers" gathered on an airfield. In the video, their bags are seen kept beside them while large military planes can be seen in the background.
