title: 7 tankers in strait said damaged by Iran | Arkansas Democrat Gazette
body: TEL AVIV, Israel -- Seven oil tankers caught fire or were damaged in the Strait of Hormuz overnight after being hit by Iran or striking naval mines, Tehran said Thursday, a markedly high number as tensions rise over concerns about a return to all-out war.
