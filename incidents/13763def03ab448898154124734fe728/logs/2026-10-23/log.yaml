log_date: '2026-10-23'
summary: New polling shows voters across parties prioritize ending the Iran war and lowering costs. The Senate rejected a war powers resolution 49-50, with three Republicans breaking ranks, while Iran struck seven oil tankers in the Strait of Hormuz, marking the highest level of attacks on shipping since March. Additional developments include Iran's shadow tanker fleet being depleted, the US proposing new investment restrictions on Iranian technology, and growing GOP internal divisions over the conflict.
