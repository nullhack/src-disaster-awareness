log_date: '2026-10-23'
summary: |-
  New polling shows voters across parties prioritize ending the Iran war and lowering costs. The Senate rejected a war powers resolution 49-50, with three Republicans breaking ranks, while Iran struck seven oil tankers in the Strait of Hormuz, marking the highest level of attacks on shipping since March. Additional developments include Iran's shadow tanker fleet being depleted, the US proposing new investment restrictions on Iranian technology, and growing GOP internal divisions over the conflict.
  President Trump weighed options to quickly end the Iran war or let it 'wither,' while Iran threatened to target undersea cables in the Gulf if hostilities resume. The Treasury declared its economic campaign had decimated Iran, and analysts reported that Iran's secret oil supply bound for China has dried up due to the naval blockade. Turkey warned against renewed strikes, and an Iranian lawmaker acknowledged growing political divisions threatening national unity.
