title: Tehran’s diplomatic paralysis leaves Iran caught between deal and escalation
body: A growing number of former Iranian officials and political figures are calling for an agreement with the United States, while hardliners and military commanders continue to push for confrontation, exposing a deeper struggle over the direction of Tehran’s foreign policy.
