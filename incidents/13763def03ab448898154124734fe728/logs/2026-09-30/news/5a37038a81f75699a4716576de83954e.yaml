title: U.S. forces exit Iraq amid Iran war. And, SCOTUS revives Trump deportation policy
body: The U.S. has withdrawn its final troops from Iraq, leaving its defense future uncertain. And, the Supreme Court has sided for now with the Trump administration on third-country deportations.
