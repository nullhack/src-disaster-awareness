title: Iran envoy says strait is sole focus of discussions | Arkansas Democrat Gazette
body: Iran's top diplomat said indirect negotiations with the United States aimed at reopening the critical Strait of Hormuz have become "more serious," while the Iranian Revolutionary Guard Corps' chief spokesman Gen. Hossein Mohebbi on Tuesday called on Americans to take to the streets and protest the conflict.
