log_date: '2026-09-30'
summary: Mediators are still working with Washington and Tehran on a deal to end the fighting and reopen the Strait of Hormuz, though major hurdles remain. The US sanctioned 10 entities in five countries for allegedly supporting Iran's military, while Iran's currency fell to a new record low and Iranian officials warned that no regional oil is safe if Iran cannot sell its own. Separately, the IRGC urged Americans to "take back control" from Trump, and Iran is reportedly recruiting child soldiers as young as 12.
