log_date: '2026-09-30'
summary: |-
  Mediators are still working with Washington and Tehran on a deal to end the fighting and reopen the Strait of Hormuz, though major hurdles remain. The US sanctioned 10 entities in five countries for allegedly supporting Iran's military, while Iran's currency fell to a new record low and Iranian officials warned that no regional oil is safe if Iran cannot sell its own. Separately, the IRGC urged Americans to "take back control" from Trump, and Iran is reportedly recruiting child soldiers as young as 12.
  Iran confirmed it received the latest U.S. counterproposal on a ceasefire and Strait of Hormuz terms, while mediators continued working toward a deal despite Trump rejecting an earlier Tehran proposal. Iran's top diplomat said indirect talks have become "more serious" and that the strait is the sole focus of discussions, as oil flows through Hormuz recovered toward pre-war levels. Separately, the U.S. completed its withdrawal from Iraq, and Iranian officials urged Americans to vote against Trump in the midterms, claiming the war has failed.
