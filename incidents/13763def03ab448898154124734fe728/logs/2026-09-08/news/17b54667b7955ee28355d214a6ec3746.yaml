title: 'Labour Day 2026 Gas Prices: Average Regular Fuel Hits Record High of $4.15 Amid Iran War Disruption'
body: US gasoline prices reached a record Labour Day average of $4.15 (£3.07) as the Iran conflict, Strait of Hormuz disruption and refinery pressures kept fuel costs high for holiday motorists.
