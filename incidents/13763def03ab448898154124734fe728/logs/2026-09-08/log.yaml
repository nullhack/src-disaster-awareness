log_date: '2026-09-08'
summary: |-
  Fresh US-Iran clashes continued around the Strait of Hormuz, with the US Navy sinking one Iranian vessel and disabling two after attacks on American warships, while Iran announced plans for a new “exclusion zone” in the Gulf and threatened “economic warfare” and new missile strikes. Oil prices climbed toward $100 per barrel on supply fears, US gasoline hit a record Labor Day average of roughly $4.14–$4.15 per gallon, and Iran raised gasoline prices for its heaviest consumers. The UAE said it is building alternative energy export routes to avoid being held hostage by the war, and Houthi attacks reportedly struck Saudi Aramco facilities.
  The U.S. expanded its economic pressure campaign by sanctioning all Iranian airlines, while Iran claimed it struck a U.S. vessel in the Strait of Hormuz—a claim Washington denied. Iran announced a new "prohibited zone" near the strait and doubled gasoline prices for heavy users amid deepening wartime economic strain, as oil prices climbed toward $100 per barrel and Houthi attacks threatened Saudi oil infrastructure.
