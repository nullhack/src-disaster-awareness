title: Lutnick apologizes for asserting that there ‘haven’t been American deaths’ from the Iran war | CNN Politics
body: US Commerce Secretary Howard Lutnick publicly apologized on Thursday after falsely asserting that no Americans had died during the Trump administration’s war with Iran.
