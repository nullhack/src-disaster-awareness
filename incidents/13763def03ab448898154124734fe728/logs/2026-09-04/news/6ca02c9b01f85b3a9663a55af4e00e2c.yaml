title: US diesel prices hit a record high, pushing up transportation costs for a long list of goods
body: Diesel has hit a new record price in the U.S., soaring to an average of $5.85 a gallon for the first time ever. The record comes as the six-month war with Iran disrupts the world's flow of fuel.
