title: 'The Latest: Former labor secretary oversaw hostile work environment, misused funds, report finds'
body: According to a new report from the department’s Office of Inspector General, former Labor Secretary Lori Chavez-DeRemer oversaw a “toxic, intimidating and humiliating” work environment and engaged in numerous violations of department policy.
