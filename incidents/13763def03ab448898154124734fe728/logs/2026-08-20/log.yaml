log_date: '2026-08-20'
summary: |-
  President Trump vowed 'tremendous' economic costs on Iran's partners, while former counterterrorism chief Joe Kent advocated for withdrawing US troops from the Middle East. Reports emerged that Iran is considering strikes on US targets in Europe, prompting NATO to state it is prepared to address any threat. Meanwhile, Saudi Arabia called for the reopening of the Strait of Hormuz and Bab al-Mandeb shipping routes amid rising maritime tensions.
  On August 20, President Trump announced a new campaign to economically isolate Iran and punish its trading partners, promising "Economic Warfare and Isolation on an unprecedented scale," though details remain scant. Iran dismissed the threat as "doubling down on failed policies" that will bring further defeat to the US, while new analyses revealed that a military junta has consolidated power in Iran following the death of former Supreme Leader Khamenei. The war has now resulted in over 770 US service members killed or injured, the UAE has cut Iran's economic lifeline after ballistic missile strikes, and Somali piracy has resurged as the conflict saps regional enforcement resources.
