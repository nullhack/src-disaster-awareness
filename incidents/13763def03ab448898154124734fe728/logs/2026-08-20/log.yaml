log_date: '2026-08-20'
summary: President Trump vowed 'tremendous' economic costs on Iran's partners, while former counterterrorism chief Joe Kent advocated for withdrawing US troops from the Middle East. Reports emerged that Iran is considering strikes on US targets in Europe, prompting NATO to state it is prepared to address any threat. Meanwhile, Saudi Arabia called for the reopening of the Strait of Hormuz and Bab al-Mandeb shipping routes amid rising maritime tensions.
