title: 'The Latest: Trump seeks an exit from his Iran war as Mideast violence spreads'
body: Iran is rejecting comments by President Donald Trump on Monday, that since Iran is seeking compensation as part of any peace talks, he’ll demand the same. It was part of a larger pivot by Trump, who’s arguing that Iran is on the cusp of financially collapsing, even though the decades of financial sanctions it faces aren’t an immediate conflict-ending tool.
