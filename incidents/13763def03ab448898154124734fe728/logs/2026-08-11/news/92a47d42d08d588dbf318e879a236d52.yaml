title: 'US-Iran War Live: Hormuz traffic plunges to 6 ships a day as hopes of US-Iran peace deal fade'
body: 'US-Iran War Live Updates: US President Donald Trump has demanded compensation from Iran for deaths and injuries linked to conflict, adding a new hurdle to efforts to reopen the Strait of Hormuz. Trump''s demand followed Iran''s call for compensation, an end to US sanctions and a halt to military threats as conditions for reopening the key waterway. Tehran has said it is nearing a pact with Oman to establish new shipping lanes through the strait, but Iranian Foreign Ministry spokesperson Esmaeil Baghaei said some technical issues remain. He said talks with Oman were progressing smoothly and included discussions on safe navigation, environmental protection, maritime services and efforts to combat crime. The US has opposed any arrangement that would allow Iran to charge fees for access to the strait. About a fifth of global oil and liquefied natural gas shipments passed through the waterway before the conflict began in February. The standoff pushed oil prices higher on Monday, with Brent
  crude settling 4.99% higher at $87.72 a barrel and US West Texas Intermediate rising 5.05% to $82.13. Hopes for an agreement had driven both benchmarks down more than 7% last week. His latest demand has now clouded those hopes, with Tehran and Washington also at odds over sanctions and military action. Iran and the US are not currently holding direct talks. Iranian Foreign Minister Abbas Araqchi said Tehran would not resume negotiations while Washington remains in breach of the June interim agreement. Meanwhile, Iran-aligned Houthis have attacked Saudi energy infrastructure. Follow IndiaToday.in for live updates.'
