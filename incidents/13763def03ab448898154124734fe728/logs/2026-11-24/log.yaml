log_date: '2026-11-24'
summary: Washington imposed new sanctions on 22 entities and eight people tied to Iran’s shadow banking networks and cited $14.7 billion in potentially linked transactions, while Secretary of State Rubio was set to meet Qatar’s prime minister amid continued tensions. President Trump is reportedly weighing delaying renewed strikes despite Israeli pressure, but threatened to resume attacks after the New Year if talks fail; Iran said it would use “all available means” to counter the U.S. blockade and tied safe Hormuz passage to a fast fix, as Strait of Hormuz shipping attacks reached their highest level since the war began. Senate Republicans also blocked the latest Democratic effort to end the war.
