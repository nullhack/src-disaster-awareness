log_date: '2026-11-24'
summary: |-
  Washington imposed new sanctions on 22 entities and eight people tied to Iran’s shadow banking networks and cited $14.7 billion in potentially linked transactions, while Secretary of State Rubio was set to meet Qatar’s prime minister amid continued tensions. President Trump is reportedly weighing delaying renewed strikes despite Israeli pressure, but threatened to resume attacks after the New Year if talks fail; Iran said it would use “all available means” to counter the U.S. blockade and tied safe Hormuz passage to a fast fix, as Strait of Hormuz shipping attacks reached their highest level since the war began. Senate Republicans also blocked the latest Democratic effort to end the war.
  Iran's Foreign Ministry acknowledged the country has been "wounded" in the war while accusing Washington of military aggression and vowing to break the U.S. naval blockade by "all available means," and Tehran blamed Israel for reports of a dirty-bomb threat against Washington. The U.S. suspects Iran in dozens of cyberattacks on tankers, Iran claimed three oil tankers caught fire after hitting mines in the Strait of Hormuz despite a U.S. escort, and an Iranian lawmaker warned the world could lose access to oil if fighting resumes. In Washington, Senate Republican leaders signaled openness to a deal with Democrats that would cut off funding for the war as a government shutdown deadline approaches, while Vice President Vance and Secretary of State Rubio separately met Qatar's prime minister.
