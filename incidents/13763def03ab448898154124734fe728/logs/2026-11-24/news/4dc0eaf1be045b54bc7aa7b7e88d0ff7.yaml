title: US targets Iran’s shadow banking ‘lifeline’ with new sanctions
body: The United States imposed sanctions on 22 entities and eight people on Monday to disrupt the shadow banking networks Iran uses to move money abroad. A separate US Treasury report identified $14.7 billion in transactions potentially linked to those networks.
