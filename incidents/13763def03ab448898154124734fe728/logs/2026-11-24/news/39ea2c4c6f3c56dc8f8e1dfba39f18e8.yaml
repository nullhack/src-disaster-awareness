title: US weighs delaying Iran strikes despite Israeli pressure for military action
body: US President Donald Trump is considering postponing renewed strikes on Iran despite Israeli pressure for a joint military campaign, as disagreements over military action persist in Washington and regional mediators seek to revive negotiations.
