log_date: '2026-08-25'
summary: As the U.S. prepares to unveil expanded secondary sanctions under Trump's "economic D-Day" campaign, Iran warned that supporting the measures would be considered an "act of war" and vowed harsh retaliation, while its top security chief threatened neighboring states against joining the economic pressure. A new poll found approval for the war dropped to just 31%, the lowest yet, as diplomatic efforts continued with Omani Foreign Minister planning a visit to Tehran for Strait of Hormuz talks and Pakistan's army chief also returning to Iran. Iran also escalated economic pressure by blacklisting 45 tankers in the Strait of Hormuz, threatening fines and cargo confiscation for violating its transit rules.
