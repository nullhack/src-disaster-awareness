title: US prepares to send diplomats back to Middle East embassies after Iran war evacuations, NYT reports
body: Aug 25 (Reuters) - The U.S. State Department is preparing to return diplomats to embassies in the Middle East that were evacuated before and during the war with Iran, the New York Times reported on Tuesday, citing an internal State Department document.The return of foreign service officers and the scaling back of emergency measures at U.S. missions in the region could begin as early as this week, the report said.Embassies slated to restore higher staffing levels include those in Israel, Lebanon, Saudi Arabia, Qatar, Jordan, Oman, Iraq and Kuwait, according to the report.
