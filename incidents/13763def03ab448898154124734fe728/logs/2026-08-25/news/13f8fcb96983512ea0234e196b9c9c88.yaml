title: 'The Latest: Trump warns of ‘economic D-Day’ against Iran days before 6-month mark of war'
body: Nearing the six-month mark of the Iran war and facing diminishing stockpiles of key weapons, the Trump administration is touting a crushing financial campaign against Tehran, promising an “economic D-Day” against a country that has so far withstood nearly five decades of punishing American sanctions.
