title: Oil prices steady as investors weigh impact of expanded US sanctions against Iran
body: By Ishaan Arora Aug 25 (Reuters) - Oil prices steadied on Tuesday, after falling more than 2% in the previous session, as investors assessed the impact of harsher U.S. secondary sanctions against Iran.
