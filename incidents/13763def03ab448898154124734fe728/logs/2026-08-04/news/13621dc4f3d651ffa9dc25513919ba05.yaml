title: Trump Blasts Oil Companies For Making "Too Much Money" During Iran Conflict As Chevron and Exxon Profits Skyrocket
body: Trump is furious at the oil companies profiting from a war his own administration is fighting, and now a DOJ probe and a possible export ban are putting billions in quarterly earnings directly in the crosshairs.
