title: Trump optimistic Iran talks will reopen strait, and other developments in the Middle East
body: After calling off a fresh round of strikes against Iran, U.S. President Donald Trump says the two sides are resuming talks to wind down the war. But Iranian officials claimed Monday that their diplomatic efforts were focused on neighboring nations. Talks between the U.S. and Iran are critical to ending the monthslong conflict and reviving stalled cargo traffic through the Strait of Hormuz. Iran’s foreign ministry said it’s focused on negotiations with Oman, not the U.S. That prompted Trump to criticize the country’s leadership, which has grown increasingly divided over the war’s endgame.
