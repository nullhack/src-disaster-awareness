title: Trump rejects Iran proposal for deal to reopen Hormuz - Middle East and Africa - The Jakarta Post
body: US President Donald Trump on Saturday rejected a truce deal proposed by Iran that Tehran said could have reopened the Strait of Hormuz to shipping within a week.
