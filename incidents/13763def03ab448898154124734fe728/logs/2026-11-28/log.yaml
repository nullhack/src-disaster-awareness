log_date: '2026-11-28'
summary: Iranian state media circulated an AI-generated video depicting simulated drone attacks on Amazon, Microsoft and SpaceX, while U.S. Central Command said its aircraft disabled a Palau-flagged ship that tried to breach the blockade of Iranian ports. Iran’s IRGC chief said Tehran is more prepared than ever and its navy chief warned of coming operations, claiming the U.S. Fifth Fleet is crippled, as President Trump warned of possible large-scale military action after 2027. Reporting also showed imagery of a mystery site near Pickaxe Mountain and estimated over $400 million in damage to the U.S. naval base in Bahrain.
