title: Iran is increasing its missile range as conflict with US, Israel drags on
body: Iran said it is extending its missile range while keeping the Strait of Hormuz closed until the US meets seven conditions. The moves, alongside its rejection of a fresh nuclear offer, leave Qatar-led diplomacy under strain.
