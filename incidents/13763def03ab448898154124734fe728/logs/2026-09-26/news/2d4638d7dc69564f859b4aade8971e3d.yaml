title: Iran proposes a deal to reopen the Strait of Hormuz
body: UNITED NATIONS (AP) — Iran has offered to reopen the Strait of Hormuz and resume talks on its nuclear program in seven days if the United States lifts its naval blockade of Iranian ports, waives sanctions on Iranian oil sales and observes a ceasefire that would include Lebanon. Iranian Foreign Minister Abbas Araghchi detailed the […]
