log_date: '2026-09-26'
summary: Iran formally proposed a seven-day plan to reopen the Strait of Hormuz in exchange for sanctions relief and a ceasefire, but President Trump rejected the ceasefire and stated he expects bombing to resume after the midterm elections, insisting Iran will make no nuclear concessions. The Senate fell one vote short of passing a war powers resolution to end U.S. involvement, with Senator Fetterman casting the deciding vote, as GOP candidates in key races like Michigan and Iowa broke with Trump over the war's costs. Oil prices dipped on cautious truce hopes, while the conflict's economic toll continued with Qatar Airways retiring idle aircraft.
