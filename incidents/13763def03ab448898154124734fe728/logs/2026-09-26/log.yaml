log_date: '2026-09-26'
summary: |-
  Iran formally proposed a seven-day plan to reopen the Strait of Hormuz in exchange for sanctions relief and a ceasefire, but President Trump rejected the ceasefire and stated he expects bombing to resume after the midterm elections, insisting Iran will make no nuclear concessions. The Senate fell one vote short of passing a war powers resolution to end U.S. involvement, with Senator Fetterman casting the deciding vote, as GOP candidates in key races like Michigan and Iowa broke with Trump over the war's costs. Oil prices dipped on cautious truce hopes, while the conflict's economic toll continued with Qatar Airways retiring idle aircraft.
  The Pentagon quietly added 29 sailors and eight Marines to the count of troops wounded in the Iran war, and an Ohio National Guard company of about 50 soldiers deployed to the Middle East. Michigan veterans led a protest at a Lansing gas station, citing soaring fuel prices and criticizing GOP leadership over the conflict. Separately, President Trump posted a "Trump Strait" map after Iran’s latest deal proposal.
