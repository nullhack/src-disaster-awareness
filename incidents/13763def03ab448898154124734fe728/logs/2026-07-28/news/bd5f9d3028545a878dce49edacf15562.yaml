title: Pentagon reclassifies casualties in Iran conflict | Arkansas Democrat Gazette
body: WASHINGTON -- The four American troops killed during renewed fighting between the U.S. and Iran in recent weeks are no longer listed as part of the Iran war death toll in the Pentagon's official casualty count but have been placed in a new, separate category.
