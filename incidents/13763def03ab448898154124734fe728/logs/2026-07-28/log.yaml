log_date: '2026-07-28'
summary: Diplomatic talks between the U.S. and Iran have progressed, with Trump claiming "friendly" negotiations and Iran stating it controls the Strait of Hormuz. The House voted to restrict Trump's war powers amid growing opposition, and oil prices dropped over 2% on de-escalation hopes, while concerns persist over U.S. weapons stockpiles and the Pentagon's reclassification of casualty data.
