log_date: '2026-09-25'
summary: The Senate voted down a war powers resolution seeking to end U.S. involvement in the Iran war, despite gaining more Republican support than in previous attempts. Oil prices fell on optimism over a potential phased diplomatic deal to end the standoff, while Iran warned neighboring states that their airports could be targeted if they enforce U.S. flight restrictions. Hundreds of trucks jammed the Turkey-Iran border as the naval blockade pushes trade overland, and mortgage rates surged to 7% as the conflict's economic fallout deepens.
