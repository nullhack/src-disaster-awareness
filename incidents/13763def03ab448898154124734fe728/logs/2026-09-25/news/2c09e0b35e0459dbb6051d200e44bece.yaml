title: Senate rejects Iran war powers measure 50-49; Schumer, Gillibrand vote yes | Fingerlakes1.com
body: The U.S. Senate rejected a measure Thursday that would direct the president to remove U.S. forces from hostilities with Iran, falling one vote short in a 49-50 tally. The official Senate roll call shows both of New York's senators, Chuck Schumer and Kirsten Gillibrand, voted for the resolution.
