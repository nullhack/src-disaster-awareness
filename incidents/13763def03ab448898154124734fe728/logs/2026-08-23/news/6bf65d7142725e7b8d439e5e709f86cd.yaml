title: Trump says Iran could be bombed ‘a little bit more’ as US shifts to economic crackdown
body: During a Friday rally for Sen. Darline Graham, President Donald Trump hinted at possibly restarting a bombing campaign in Iran, even as the US is publicly moving toward a new strategy of economic punishment and sanctions.
