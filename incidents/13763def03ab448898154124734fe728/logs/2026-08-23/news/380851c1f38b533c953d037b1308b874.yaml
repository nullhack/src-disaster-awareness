title: Trump’s economic isolation plan risks Iran strikes across the gulf
body: President Trump is betting ramped-up economic pressure against Iran’s trading partners can finally force Tehran to accept a peace deal on U.S. terms. But, as with similar efforts before, Iran may be impervious to such pressure.
