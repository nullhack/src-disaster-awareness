log_date: '2026-09-23'
summary: At the UN General Assembly on September 22, President Trump threatened to "annihilate" Iran unless a deal is reached, while also calling for "complete economic isolation" of Tehran. On the sidelines, US and Iranian delegations held a three-hour mediated meeting—the first direct contact in weeks—where Iran submitted conditions for reopening the Strait of Hormuz, including lifting the naval blockade and unfreezing assets; Special Envoy Steve Witkoff described the talks as "constructive and promising." Growing domestic political pressure intensified as Republicans in tight Senate races publicly broke with Trump over the war, and a new oil spill threat emerged from damaged vessels, while the Senate readied another war powers resolution vote.
