log_date: '2026-09-09'
summary: On September 8-9, the U.S. destroyed five Iranian oil tankers after attacks on a Navy warship, leading Iran to retaliate by firing ballistic missiles at a U.S. base in Jordan and attacking vessels near the Strait of Hormuz. Oil prices surged toward $100 per barrel as the conflict intensified, while the Treasury imposed sweeping sanctions on 27 Iranian airlines. Simultaneously, Iran-backed Houthis struck Saudi energy infrastructure, threatening a second major oil chokepoint and adding to the war's economic toll.
