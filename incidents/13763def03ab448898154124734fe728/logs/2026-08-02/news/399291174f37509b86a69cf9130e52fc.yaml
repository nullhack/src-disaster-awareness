title: 'US-Iran War Live: Trump cancels planned strikes on Iran, says parameters of deal reached'
body: 'US-Iran War News Live Updates: US President Donald Trump threatened further strikes on Iran as Washington stepped up pressure to reopen the Strait of Hormuz, with tensions across the Middle East continuing to escalate. Within hours, Kuwait said it was responding to a fresh wave of Iranian drone attacks, while British officials reported that a tanker had been struck in the strategic waterway. Meanwhile, Israel launched heavy strikes across the Gaza Strip after Hamas said it would disarm, a move that could mark a significant step towards ending the war. Elsewhere, the Houthis forced Saudi vessels to alter their course, while fresh developments also emerged from southern Lebanon. Follow IndiaToday.in for live updates.'
