title: Rubio says Iran is confronting a different kind of president with Trump
body: Secretary of State Marco Rubio told Fox News that with President Trump, the regime in Tehran is facing “someone that actually takes action.” Tensions remain high in the Strait of Hormuz and across the region as Iran has been targeting Gulf countries.
