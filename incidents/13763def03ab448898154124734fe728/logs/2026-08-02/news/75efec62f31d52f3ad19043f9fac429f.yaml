title: US launches strikes on Iranian targets a day after it foiled missile attack on American forces
body: The U.S. military says it has completed what it describes as “a heavy wave of strikes against Iran” conducted in response to an earlier Iranian missile attack on a U.S. base in Jordan. U.S. Central Command said in a social media post early Thursday that over the span of two hours they struck “dozens” of targets belonging to Iran’s Revolutionary Guard Corps, including military command centers as well as missile and drone facilities, and coastal surveillance and defense sites. The latest barrage came after the U.S. partnered with Saudi Arabia to strike Iran-backed militias in neighboring Iraq, killing at least 20 fighters and six Iranian advisers.
