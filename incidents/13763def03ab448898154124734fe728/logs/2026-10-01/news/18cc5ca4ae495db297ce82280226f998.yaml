title: Iran indicates it's received an official U.S. response to its latest offer on ending the war | Texarkana Gazette
body: Iranian officials indicated Wednesday they have received an official U.S. response to Tehran's latest proposal to end the seven-month war, which U.S. President Donald Trump had publicly rejected just days earlier.
