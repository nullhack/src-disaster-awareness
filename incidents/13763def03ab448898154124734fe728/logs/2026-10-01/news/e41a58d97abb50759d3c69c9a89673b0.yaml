title: Tehran says US response to peace proposal in hand | Arkansas Democrat Gazette
body: Iranian officials indicated Wednesday that they have received an official U.S. response to Tehran's latest proposal to end the seven-month war, which U.S. President Donald Trump had publicly rejected just days earlier.
