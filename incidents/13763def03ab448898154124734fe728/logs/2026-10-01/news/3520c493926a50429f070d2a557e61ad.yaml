title: Negotiator of 2015 Iran nuclear deal discusses Trump rejecting Iran's latest proposal
body: NPR's Michel Martin speaks with Robert Malley, a negotiator of the 2015 Iran nuclear deal, about where talks stand after President Trump rejected Iran's offer to reopen the Strait of Hormuz.
