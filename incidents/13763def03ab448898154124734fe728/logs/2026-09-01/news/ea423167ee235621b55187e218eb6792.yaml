title: Containment of the Iranian regime may be the best option right now, says Meghan O'Sullivan
body: Meghan O’Sullivan, Harvard University’s Belfer Center for Science and International Affairs director and former Deputy National Security Advisor, joins 'Squawk Box' to discuss the latest developments in the Iran war, whether an endgame is near, impact of U.S. sanctions, and more.
