title: U.N.-backed experts cite possible U.S. war crimes in Iran, including a school attack
body: Human rights experts commissioned by the U.N. say they have found "reasonable grounds" to believe the U.S. committed war crimes in Iran, including a strike on a school in the southern city of Minab.
