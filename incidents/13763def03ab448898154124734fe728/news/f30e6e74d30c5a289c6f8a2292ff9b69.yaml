title: Iran says it is awaiting ‘definitive’ US response despite Trump rejecting latest proposal
body: Iran says it is waiting on the “definitive” response to its latest proposal on reopening the Strait of Hormuz, despite US President Donald Trump publicly rejecting the offer.
