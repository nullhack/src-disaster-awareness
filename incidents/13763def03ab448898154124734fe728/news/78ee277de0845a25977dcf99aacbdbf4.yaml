title: Iran's currency hits a new record low as war erodes the country's economic stability
body: Iran’s currency fell to a new record low on Tuesday, with traders in Tehran exchanging more than 2.5 million rials to the U.S. dollar in a stark reflection of how the war in the Middle East has steadily eroded the Iranian economy.
