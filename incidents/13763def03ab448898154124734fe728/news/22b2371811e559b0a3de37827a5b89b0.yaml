title: Trump reiterates he would launch Iran war again despite political consequences
body: President Donald Trump said Friday that he was not unhappy with Vice President JD Vance’s assessment blaming the war with Iran for Republicans’ sweeping midterm losses, calling the vice president’s remarks “very accurate” while insisting he would launch the conflict again to prevent Tehran from obtaining nuclear weapons. Speaking at a White House press conference,... Read More
