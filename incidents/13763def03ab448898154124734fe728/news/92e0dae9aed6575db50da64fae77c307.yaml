title: 'Trump: Talks are ‘last chance’ for US, Iran deal'
body: WASHINGTON (AP) — President Donald Trump has played this hand before during the 5-month-old Iran war — but this time, he insists it’s different. The president on Monday said that new talks between Washington and Tehran are the “last chance” for Iran to forge a deal and avoid an escalation of U.S. strikes on the […]
