title: 'US-Iran War LIVE Updates: Iran wants to make agreement, just not the right one, says Trump'
body: 'US-Iran War LIVE Updates: US President Donald Trump said Iran wants to make an agreement but is not prepared yet to accept the terms he has set that he considers necessary. He said they would love to make a deal but they are still not ready to make the "right deal", he said. US Vice-President JD Vance said the Iran war has entered the phase where economic pressure is the US capital''s most effective tool while US Treasury Secretary Scott Bessent said the country would impose the toughest sanctions ever on Iran. Meanwhile, Iran''s foreign minister Abbas Raghchi said Trump''s campaign would fail like the US'' previous rounds of pressure.'
