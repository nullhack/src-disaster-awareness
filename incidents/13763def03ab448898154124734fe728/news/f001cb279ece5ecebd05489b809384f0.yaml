title: Italy says EU naval mission in Red Sea still insufficient
body: ROME, Oct 2 (Reuters) - Italian Defence Minister Guido Crosetto said on Friday that contributions to an EU naval mission protecting Red Sea shipping remain insufficient, as Rome presses allies to do more to safeguard traffic through the Bab el-Mandeb Strait.• In a statement issued after meeting in Rome with EU foreign policy chief Kaja Kallas, Crosetto welcomed a decision by some member states to contribute additional assets to Aspides, without identifying the countries involved
