title: Trump posts Trump Strait map as Iran offers Hormuz reopening deal
body: Trump posted a "Trump Strait" image after Iran offered to reopen the Strait of Hormuz under conditions. The exchange underscored fresh diplomacy around Iran even as regional tensions sharpened.
