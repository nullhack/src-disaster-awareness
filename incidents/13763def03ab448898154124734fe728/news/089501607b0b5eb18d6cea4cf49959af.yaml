title: US, Iran hold 3-hour meeting at UN; Tehran submits conditions to reopen Hormuz
body: Donald Trump said US officials held a three-hour meeting with Iran's UN delegation in New York, during which Tehran conveyed its conditions for reopening the strategic Strait of Hormuz, Iranian state media reported.
