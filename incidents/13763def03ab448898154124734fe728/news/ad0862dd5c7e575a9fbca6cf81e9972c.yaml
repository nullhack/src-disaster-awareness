title: U.S. is moving thousands of troops aboard ships to the Mideast as Trump weighs new strikes on Iran
body: Three U.S. carriers could reach the Middle East by the end of October, an official says. President Trump meanwhile warned of retaliation if Tehran were linked to a recent attack.
