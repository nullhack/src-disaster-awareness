title: Iran-backed Houthis clash with Yemeni forces and other Mideast developments
body: Clashes between Iran-backed Houthi rebels and government forces in Yemen raged overnight. The fighting into Thursday raised fears the civil war could reignite and open another front in the Middle East. The Houthis have repeatedly attacked government-held areas across the country in recent days. The Yemeni military says dozens of government troops have been killed. Elsewhere, there have been growing concerns of environmental damage from the Iran war as Iran and Oman battle oil slicks from damaged tankers.
