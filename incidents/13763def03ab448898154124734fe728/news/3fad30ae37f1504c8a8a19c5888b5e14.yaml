title: US and Iran are quietly negotiating as Middle East remains on edge. Here’s what to know | CNN
body: President Donald Trump said Sunday that renewed US military attacks on Iran are “highly unlikely” if Tehran makes progress toward an agreement on its nuclear program and the Strait of Hormuz, offering his clearest indication yet that intensified diplomacy could avert another major round of fighting.
