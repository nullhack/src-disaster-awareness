title: 'Iran War Oil Crisis Explained: India, China Record Russian Oil Imports In 2026 Amid Strait Of Hormuz Tensions, US Sanctions And Global Crude Oil Price Surge | Outlook India'
body: Why are India and China buying record Russian oil in 2026? The Iran war, Strait of Hormuz crisis, Middle East oil supply disruptions, US sanctions waiver on Russia, Ukraine drone strikes on Russian oil refineries and rising Brent crude prices have reshaped global oil trade. Will Russian crude exports and India-China oil imports decline in 2027?
