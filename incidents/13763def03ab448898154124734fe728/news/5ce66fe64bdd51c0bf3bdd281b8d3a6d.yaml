title: Iran says 4 tankers hit mines, catch fire in Hormuz Strait
body: IRAN’S Revolutionary Guard said Friday that four oil tankers, including one carrying more than 2 million barrels of oil, hit mines and caught fire while traveling through the Strait of Hormuz.
