title: Trump is trying to tighten the screws on an Iran numb to economic pain | CNN
body: Iran, already drained by years of sanctions and a brutal military onslaught from the United States and Israel, now faces another test as President Donald Trump moves to further tighten the economic screws on the Islamic Republic.
