title: Yamaha refuses to race in Qatar MotoGP over security fears
body: Yamaha will not allow its riders to compete in the Qatar MotoGP next weekend given conflict in the Middle East. "Following its latest assessment of the situation in the Middle East, Yamaha has not identified sufficient grounds to change its existing company-wide travel restrictions," a statement from the Japanese motorbike manufacturer said on Sunday.
