title: Israel rejects Trump's Gaza plan, more details emerge on the Strait of Hormuz and other Mideast news
body: Israel on Sunday rejected a deal announced by U.S. President Donald Trump for Gaza. Details emerged on the potential deal between Iran and Oman on managing the Strait of Hormuz as Tehran suggested that vessels linked to “hostile countries” would be barred. Iran also shuffled its top security post.
