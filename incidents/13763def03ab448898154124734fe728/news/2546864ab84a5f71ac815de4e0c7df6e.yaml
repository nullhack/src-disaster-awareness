title: US, Iran exchange fire near Strait of Hormuz
body: US and Iranian forces exchanged fire with vessels in waters around Iran on Saturday, with the United States striking three Iranian oil tankers and Iran targeting three tankers it said were using unauthorized routes in the Strait of Hormuz.
