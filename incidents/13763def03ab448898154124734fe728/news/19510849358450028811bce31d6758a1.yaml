title: Asian Cup soccer tournament in Saudi Arabia postponed because of conflict in the Middle East
body: The Asian Football Confederation has postponed the 2027 Asian Cup by almost a year because of the conflict in the Middle East and recent deadly attacks on Saudi Arabia by Iran-backed Houthi rebels in Yemen.
