title: Iran’s northern routes test the limits of US bid to extend blockade overland
body: Task Force Iron Gate, a new US team targeting weapons shipments and other illicit flows across Iran’s land borders and the Caspian Sea, may not fully close Iran’s northern supply routes but could make the arms and equipment Tehran needs harder to obtain.
