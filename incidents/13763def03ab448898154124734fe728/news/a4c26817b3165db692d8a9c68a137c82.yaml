title: 'Andreas Kluth: The US-Iran war is making world hunger much worse'
body: '<p>Step away from the minute-by-minute news cycle for a moment and consider what two of the five permanent members of the United Nations Security Council have wreaked: Russia and the United States, with their illegal wars against Ukraine and Iran, share much of the blame for reversing a whole generation’s progress in the fight against hunger.</p>'
