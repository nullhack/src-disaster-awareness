title: 'BRICS Summit 2026 LIVE Updates: BRICS Leaders Express Concern About ''Growing Risks'' of Nuclear Danger and Conflict'
body: <b>BRICS Summit 2026 LIVE Updates:</b> Prime Minister Modi has kicked off the BRICS Summit after welcoming global leaders including China President Xi Jinping and Russian President Vladimir Putin. In his address, the PM said, "we aren’t against anyone but we will take everyone along. It is time to show our consensus and unity translated into real results."<br>, India News News, Times Now
