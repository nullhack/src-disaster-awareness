title: Pezeshkian claims Iran victory as Trump escalates economic war
body: Masoud Pezeshkian said the war with the United States should end after claiming Iran had won. His remarks came as Donald Trump intensified economic pressure on Tehran and Tom Barrack's Golan comments stirred a policy row.
