title: US widens Iran war diplomacy with Austria and Greece amid Hormuz tensions
body: Washington has enlisted Austria and Greece in its widening contact with Iran as fighting drags on. The outreach underlines mounting concern over the Strait of Hormuz and the absence of a clear diplomatic breakthrough.
