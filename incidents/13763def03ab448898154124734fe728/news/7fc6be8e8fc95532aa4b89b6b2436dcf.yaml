title: I’ve been talking to MAGA supporters for years, and here’s why some are sticking with Trump — and others are not
body: Despite the headwinds that have cratered support for Donald Trump – high prices, the Iran war, corruption – many of Trump’s MAGA loyalists still back him. A scholar who studies MAGA looks at why.
