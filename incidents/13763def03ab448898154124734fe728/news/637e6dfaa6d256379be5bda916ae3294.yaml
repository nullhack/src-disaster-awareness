title: 'The Latest: Trump says he may pull Todd Blanche’s attorney general nomination for now'
body: President Donald Trump says he may pull Todd Blanche’s nomination for attorney general until Sens. John Cornyn and Thom Tillis leave office. The Republicans have demanded written assurances about the settlement of the president’s lawsuit against the Internal Revenue Service. Back-and-forth missile strikes between the U.S. and Iran Thursday are dimming hopes for a deal to end the war as more countries are drawn in. Jordan, Kuwait, Egypt, Saudi Arabia and Iraq have reported strikes. And a new AP-NORC poll shows Trump's approval rating has dropped, with most Americans saying the Iran war isn't worth fighting.
