title: Trump used to say he saw a quick end to his Iran war, but 6 months later he claims he's in no hurry
body: President Donald Trump marks an awkward moment in his second White House term as the U.S.-Israel conflict with Iran reaches the six-month mark. Trump initially told Americans it would last only a matter of weeks. Trump claims the war has devastated Iran's leadership, military and economy. This week, his administration has shifted its focus to increasing economic pressure rather than military action. Trump says he's not in a hurry to bring Iran back to negotiations. Mediators like Qatar and Pakistan continue to seek diplomatic solutions. Analysts warn that Iran has shown resilience to international pressure, and it remains to be seen how far the U.S. will go with its new strategy.
