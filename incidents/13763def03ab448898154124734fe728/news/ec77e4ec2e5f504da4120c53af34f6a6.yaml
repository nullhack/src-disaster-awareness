title: Mediators work to broker a deal between US, Iran | Arkansas Democrat Gazette
body: CAIRO -- Mediators are working with Iran and the United States on trying to broker a deal to end the fighting and open the Strait of Hormuz, three regional officials and two U.S. officials told The Associated Press, but major hurdles remain between the sides.
