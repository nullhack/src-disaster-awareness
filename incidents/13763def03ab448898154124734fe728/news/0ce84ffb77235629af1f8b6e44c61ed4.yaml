title: Iran-US War To End? Trump To Meet Qatar PM In Doha As He Pushes For Peace Deal
body: Donald Trump is expected to meet Qatar's prime minister Sheikh Mohammed bin Abdulrahman bin Jassim Al Thani on Monday in an effort to prevent further military escalation and restoring security along key maritime routes, particularly the Strait of Hormuz, which is crucial for global oil and energy supplies.
