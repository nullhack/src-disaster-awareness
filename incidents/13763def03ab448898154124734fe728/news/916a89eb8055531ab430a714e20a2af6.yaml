title: Houthi missile strike damages Riyadh's PIF Tower as attacks target Saudi financial district
body: A Houthi missile damaged Riyadh's PIF Tower, Saudi Arabia's sovereign wealth fund headquarters, shattering windows and warping its facade. No casualties were reported, while competing accounts disputed how the damage occurred.
