title: How Much Did the US-Iran War Cost? Pentagon Puts Total at $45.1 Billion | Outlook India
body: The US war with Iran has cost $45.1 billion, the Pentagon told Congress, surpassing its July estimate and the CBO’s projection, while warnings grow over inflation, energy prices and Treasury yields.
