title: Fuel prices at record Labor Day high in US thanks to Iran war and refinery issues
body: Gas prices in the U.S. have hit a record high for Labor Day weekend, averaging $4.14 per gallon. This is nearly a dollar more than last year and surpasses the previous record of $3.82 from 2012.
