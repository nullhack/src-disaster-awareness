title: 'US-Israel-Iran war latest news: UAE condemns latest attack on commercial vessel ADNOC in Strait of Hormuz'
body: 'India, Aug. 15 -- US-Israel-Iran War Latest News: The United Arab Emirates (UAE) has strongly condemned a hostile Iranian missile attack targeting a commercial vessel affiliated with the state-owned Abu Dhabi National Oil Company (ADNOC) while transiting the Strait of Hormuz.'
