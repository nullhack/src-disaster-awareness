title: Crude Prices Surge on Dimming US-Iran Peace Prospects
body: December WTI crude oil (CLZ26 ) closed up +2.21 (+2.55%) on Thursday, and December RBOB gasoline (RBZ26 ) closed up +0.0633 (+2.43%). Crude oil and gasoline prices erased overnight losses and moved sharply higher Thursday on comments from President Trump, who said the US doesn’t need a deal with Iran,...
