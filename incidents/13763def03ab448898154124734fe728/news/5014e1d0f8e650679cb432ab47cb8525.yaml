title: Battered by war, Iran's rulers wary of more economic pain and unrest if US tightens pressure
body: Even as Iran projects resilience in the war with the United States, its leaders are worried that a threat of more economic punishment by Donald Trump could increase hardships, reignite unrest and further erode the Islamic Republic's legitimacy.
