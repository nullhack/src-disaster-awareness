title: Iran launches new Bahrain attacks just days after F1 commits to Qatar and Abu Dhabi finales | GRANDE PRÊMIO
body: Bahrain intercepted Iranian aerial attacks on Sunday as Tehran claimed to have targeted a US military radar site roughly 110 km from Qatar's Lusail circuit. The escalation comes five days after Formula 1 abandoned its Imola contingency plan.
