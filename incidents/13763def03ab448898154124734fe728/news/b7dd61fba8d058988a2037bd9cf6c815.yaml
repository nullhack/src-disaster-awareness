title: Iran war’s expense to US taxpayers grows to $47.1B | Arkansas Democrat Gazette
body: WASHINGTON -- The cost of the Iran war to American taxpayers has grown to $47.1 billion, according to a new estimate the Pentagon has provided to Congress. The fallout from the conflict has become a key issue in the midterm elections and could increase as President Donald Trump leaves open the possibility of renewed hostilities.
