title: Cairo, Washington discuss Iran crisis, stress freedom of navigation in Hormuz - Dailynewsegypt
body: Egyptian Foreign Minister Badr Abdelatty and US presidential senior adviser for Arab and African affairs Massad Boulos discussed the crisis involving Iran and stressed the need to safeguard freedom of navigation through the Strait of Hormuz in accordance with international law. The two officials spoke by phone on Friday, as Cairo and Washington continued consultations
