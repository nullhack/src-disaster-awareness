title: Trump says new talks are ‘last chance’ for Iran to forge deal and avoid escalation of US strikes
body: President Trump warned of military strikes against Iran, then reversed course after Gulf allies urged diplomacy — but Monday brought fresh doubts as Iran denied holding any negotiations with the U.S.
