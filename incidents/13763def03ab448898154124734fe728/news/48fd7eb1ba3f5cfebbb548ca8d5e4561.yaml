title: The U.S. and Iran are at war. But ICE is still working with Tehran on deportations
body: Historically, the U.S. has rarely deported people to Iran, and has often welcomed Iranian dissidents, exiles and others who fled the country after the 1979 Islamic Revolution. But the Trump administration has reversed decades of that approach.
