title: Iran Says Russian Su-35 Fighters Will Arrive After War, Leaving Airpower Gap - Defence Security Asia
body: Iran says its Russian Su-35 fighters will arrive after the war, exposing the gap between a declared purchase and deployable airpower as delivery dates, fleet size, and support arrangements remain unresolved. Iran says Russian Su-35 fighters will arrive after the war, leaving an airpower gap as delivery dates, basing and logistics remain unresolved.
