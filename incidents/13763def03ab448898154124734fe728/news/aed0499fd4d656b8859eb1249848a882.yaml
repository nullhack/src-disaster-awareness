title: Lufthansa warns 2026 profit may fall after Iran war hits Q2
body: Lufthansa said the fallout from the Iran war and employee strikes weighed heavily on its second-quarter results and warned that full-year profit could decline in 2026. Chief Executive Carsten Spohr now expects the airline group's adjusted earnings before interest and taxes (EBIT) to come in at between €1.
