title: Trump calls Iran conflict ‘small potatoes’ and defends Vance’s position that it’s not a ‘war’ | Texarkana Gazette
body: WASHINGTON -- President Donald Trump on Friday said the conflict in Iran is "small potatoes" as he defended Vice President JD Vance for asserting that months of on-and-off attacks in the Middle East are not a "war."
