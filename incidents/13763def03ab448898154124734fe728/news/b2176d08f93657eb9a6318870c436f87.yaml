title: Trump bluntly tells JD Vance to shift focus from Iran to targeting ‘corruption and crime’ at home
body: President Donald Trump directed Vice President JD Vance to shift his focus away from the Iran war and instead devote himself to fighting what the president says is corruption and crime in Democratic-controlled cities and states.
