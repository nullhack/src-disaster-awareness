title: The Iran war is testing a depleted Treasury
body: The departures come as Treasury has been at the center of a vast set of policies, from implementing last year's new tax law, managing the government's debt, overseeing financial regulators, conducting economic diplomacy, weighing in on artificial intelligence policy and imposing sanctions — a grueling agenda.
