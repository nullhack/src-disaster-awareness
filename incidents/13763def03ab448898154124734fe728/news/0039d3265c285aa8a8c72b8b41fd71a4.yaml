title: Iran's rial currency hits new record low as US prepares to announce more sanctions
body: Iran’s currency has hit a record low as Washington prepares to announce new sanctions. The U.S. has said the sanctions would add further pressure on an economy already battered by previous ones and an American naval blockade.
