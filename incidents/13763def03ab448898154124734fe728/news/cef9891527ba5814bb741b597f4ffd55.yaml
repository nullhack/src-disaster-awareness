title: JP Morgan says it has no clear oil market endgame as Iran conflict drags on
body: Sept 17 () - JP Morgan said on Thursday that it does not have a clear baseline view for oil markets for the first time since the start of the US-Israeli war on Iran. "We simply don't know how to model the endgame," analysts at the bank noted.
