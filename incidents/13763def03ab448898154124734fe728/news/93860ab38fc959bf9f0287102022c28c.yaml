title: 'Iran War Triggers Historic Oil Demand Wipeout: Plunge Ranks as Second-Worst in 60 Years'
body: The IEA has revised its 2026 oil demand outlook by more than 3 million barrels per day in just eight months, and the agency now warns the worst may still be ahead if Strait of Hormuz traffic fails to resume before winter.
