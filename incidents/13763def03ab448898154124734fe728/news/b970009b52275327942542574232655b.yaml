title: ELECTION 2026 | Iran’s leaders say midterm results show U.S. voters have rejected Trump’s war | Texarkana Gazette
body: Iranians on Wednesday struck a defiant tone, celebrating U.S. voters' rebuke of President Donald Trump in the midterm elections while many in the Middle East waited to see how the results could affect the Iran war.
