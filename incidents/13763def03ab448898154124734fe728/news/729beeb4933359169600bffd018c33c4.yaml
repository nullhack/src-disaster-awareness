title: Crude Oil Prices Dip 1% To $114 As US-Iran Diplomacy Raises Hopes Of De-Escalation
body: Crude oil prices declined on Thursday amid renewed diplomatic efforts to ease Middle East tensions. US crude fell 1.28%, while Brent slipped 1.02%. However, supply disruption risks persisted. The World Bank forecast Brent averaging $91 per barrel in 2026, warning that falling inventories could increase global market vulnerability
