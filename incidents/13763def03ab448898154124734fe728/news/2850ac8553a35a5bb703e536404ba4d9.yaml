title: Saudi Arabia's Oil Lifeline Just Went Down. The World May Be Running Out Of Time - AOL
body: Saudi Arabia could run out of oil available for export within days after an attack shut down a critical pipeline used to bypass the Strait of Hormuz. The kingdom has enough crude stored at the Red Sea port of Yanbu to maintain current export levels for roughly five to seven days without new supplies flowing through its East-West Pipeline, Reuters reported Sunday citing Saudi oil buyers and traders.
