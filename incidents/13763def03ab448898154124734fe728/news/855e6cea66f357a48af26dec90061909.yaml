title: What to Know About the Iranian Bank Singled Out in U.S. Economic War
body: Bank Melli, Iran’s largest lender, already faces waves of sanctions that severely limit its ability to operate abroad. Every foreign branch must be shut down, Treasury Secretary Scott Bessent said.
