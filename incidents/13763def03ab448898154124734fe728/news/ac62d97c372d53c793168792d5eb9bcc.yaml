title: U.S. plans $5 billion Middle East reconstruction fund for Iran war
body: The Trump administration has proposed a $5 billion fund to help rebuild critical infrastructure across the Middle East damaged in the war with Iran even though the seven-month conflict continues. The so-called Partnership for Allied Construction & Trust would be led by the U.S. Development Finance Corporation with the goal of encouraging investment, reconstruction and economic expansion, ...
