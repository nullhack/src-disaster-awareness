title: Iran condemns US plans to announce new sanctions
body: By Menna Alaa El-Din and Kanishka SinghCAIRO/WASHINGTON, Aug 22 (Reuters) - Iran on Saturday denounced U.S. plans to announce new sanctions that could put further strain on the Islamic Republic's economy and have an impact on its most important trading partners including China.After nearly six months of war since the U.S. and Israel launched airstrikes against Iran on February 28, the sides are not firing at each other but also showing no sign of pursuing peace talks.
