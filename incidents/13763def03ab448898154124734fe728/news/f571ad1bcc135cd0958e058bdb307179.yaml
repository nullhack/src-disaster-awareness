title: US Treasury's Bessent faces G20 diplomacy test amid tariffs, Iran war, bond turmoil
body: By David LawderASHEVILLE, North Carolina, Aug 30 (Reuters) - U.S. Treasury Secretary Scott Bessent faces a major test of his economic diplomacy skills this week as he presses finance leaders from the G20 major economies to shrink global trade imbalances, boost growth and sever business ties to Iran, while trying to calm worries about rising U.S. debt and bond yields.
