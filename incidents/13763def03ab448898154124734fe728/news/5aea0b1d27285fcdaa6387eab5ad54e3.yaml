title: Iran War Wipes Out 2.8 Billion Barrels Of Oil Supply. Why Are Crude Prices Falling?
body: The Iran war has disrupted 2.8 billion barrels of oil supply, yet crude prices are falling as global production recovers. The IEA warns that the crisis could permanently reshape energy markets.
