title: Vance says Iran conflict isn’t a ‘war,’ even as he refuses to say when it will end | CNN Politics
body: Vice President JD Vance could provide neither a timeline for the Iran war to end nor a date when gas prices might sink below pre-war levels during a White House appearance Thursday, suggesting instead it was up to Iran to conclude the conflict that began with joint US-Israeli airstrikes six months ago.
