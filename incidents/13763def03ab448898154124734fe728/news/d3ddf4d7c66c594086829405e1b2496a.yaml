title: Trump pivots back to sanctions for Iran as other strategies to end his war fizzle
body: President Donald Trump likes to say he started his war with Iran after 50 years of economic pressure failed to stop its nuclear weapons ambitions. But now the Republican president is betting another financial squeeze can end the war.
