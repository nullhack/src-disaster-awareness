title: 'Live updates: US-Iran war; Iran claims attack on Kuwait air base but US reports no fresh strikes | CNN'
body: Iranian forces targeted military infrastructure at an air base in Kuwait, according to state media on Friday. The US military did not announce strikes against Iran overnight. Follow for live updates.
