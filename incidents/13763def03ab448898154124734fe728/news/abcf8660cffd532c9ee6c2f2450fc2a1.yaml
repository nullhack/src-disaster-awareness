title: US Sen. John Kennedy, in Iowa, predicts end of Iran war in 6 months
body: U.S. Sen. John Kennedy of Louisiana told a crowd of Iowa conservatives Saturday he believes current high inflation is being caused by the U.S.-Iran war — but said he sees an end to the conflict within six months. Kennedy was the keynote speaker for the Iowa Faith and Freedom Coalition’s annual fall fundraiser in Des […]
