title: 'The Latest: Trump signs order to rename Lake Ontario to ‘Lake America’'
body: President Donald Trump says he is renaming Lake Ontario as "Lake America" in the U.S. This move comes as he intensifies a trade war with Canada. Trump signed an executive order for the name change but cannot force Canada to adopt it. The announcement follows the U.S. imposing 50% tariffs on $20 billion worth of Canadian goods. Canada retaliated with similar tariffs on American goods. Trump’s decision highlights tensions between the two countries. The lake’s original name, from the Huron Indigenous people, predates European settlement. The International Hydrographic Organization does not have authority over naming international bodies of water.
