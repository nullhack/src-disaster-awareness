title: 'No One Saw This Coming: The Iran War Is Slowly Becoming An Environmental Disaster of Historic Proportions'
body: Eight months into the war with Iran, oil spills are spreading across the Persian Gulf, and one analyst warns the bigger danger is to the desalination plants most residents rely on for drinking water. Bahrain says it has only about four days of water in reserve if its plants go down.
