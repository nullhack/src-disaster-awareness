title: Iran war powers resolution blocked in Senate as conflict heats up
body: The Senate again rejected advancing a measure to direct President Donald Trump to end the war in Iran, a vote that comes as a brief respite in fighting appears to be over. The Senate voted 49-50 on Thursday against discharging from the Senate Foreign Relations Committee a war powers resolution offered by Sen. Kirsten Gillibrand, […]
