title: 'India paid 29% more for cooking gas after Hormuz strikes: Report - BusinessToday'
body: India paid 29% more per tonne for imported LPG than pre-war market expectations after the Hormuz strikes, as the energy crisis pushed up cooking-gas costs. The price shock added an estimated $1.1 billion to India’s LPG import bill, while imports fell sharply during the six-month period.
