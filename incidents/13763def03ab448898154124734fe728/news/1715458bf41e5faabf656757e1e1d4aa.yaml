title: Three ways the Iran war changed the global economy | CNN Business
body: 'The effects of the Iran war are obvious to most Americans: Gas prices have been hovering above $4 for weeks, mortgage rates are rising toward 7% and companies are adding shipping surcharges to make up for record diesel costs.'
