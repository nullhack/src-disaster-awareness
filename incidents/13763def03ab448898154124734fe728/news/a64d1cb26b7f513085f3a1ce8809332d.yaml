title: Iran’s Oil Exports Collapse as Hormuz Standoff Drags On | OilPrice.com
body: Iran’s oil exports have effectively collapsed under the renewed U.S. blockade, with August loadings down roughly 80% year-on-year and some trackers estimating zero exports escaped the Persian Gulf.
