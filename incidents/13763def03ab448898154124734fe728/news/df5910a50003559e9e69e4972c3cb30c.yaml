title: UK and Norway Commit Over £100M for Two New Fast Attack Craft for Ukraine - Naval News
body: Built in the UK, the two 30-meter Fast Attack Craft will carry advanced air defense and missile systems to help the Ukrainian Navy protect the Black Sea Grain Corridor.
