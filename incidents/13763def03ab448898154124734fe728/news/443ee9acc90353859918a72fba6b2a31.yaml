title: Trump calls for leaders of ‘failed nation’ Iran to be tried for ‘war crimes against humanity’ after latest US strikes
body: President Trump publicly called Monday for Iran’s leaders to be prosecuted for “war crimes against humanity” after trashing the Islamic Republic as a “failed nation.”
