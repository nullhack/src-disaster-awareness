title: 'O’Reilly: Trump can’t let Iranians ‘make him look like a loser’ - AOL'
body: Political commentator Bill O’Reilly said Tuesday that President Trump cannot allow the Iranian regime to “make him look like a loser,” as conflict in the Middle East nears the six-month mark. “From what I understand, there is some kind of strategy that will involve a tougher approach on Iran. I don’t know what it is.…
