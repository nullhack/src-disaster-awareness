title: China on sanctions, Iran threatens Barron Trump & more | Experts on Iran | CNN
body: 'The Trump administration appears to have landed on a fallback strategy in the Iran war after military strikes and negotiations failed to deliver victory: threats of harsh economic sanctions. There’s just one problem: Making good on those tough words requires not just getting tough on Iran, but also getting tough on China, which is Tehran’s No. 1 trading partner.And, the US Secret Service says it’s aware of a video aired by Iran’s state broadcaster appearing to threaten the life of Barron Trump, the youngest son of President Donald Trump. The nearly three-minute video begins with an English language graphic reading: “Where to kill Barron Trump?!” and features stylized graphics showing locations where the younger Trump is publicly known to spend time.Experts talk to CNN on these and other developments from the war in Iran.'
