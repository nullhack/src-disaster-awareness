title: 'Live Updates: U.S. reducing troop footprint in Middle East, sources say, as indirect talks on ceasefire proposal with Iran continue'
body: The U.S. military has been quietly reducing its footprint at posts in the Middle East due to ongoing regional threats from the Iran-backed Houthis and direct threats from Iran, sources tell CBS News.
