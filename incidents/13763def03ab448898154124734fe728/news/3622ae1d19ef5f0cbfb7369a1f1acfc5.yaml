title: F1 Is Going Ahead With Qatar and Abu Dhabi Despite the Iran Conflict
body: F1 has told Imola it won’t be needed as a backup, so the 2026 season will end as planned with the Qatar GP on Nov. 29 and the Abu Dhabi GP on Dec. 6. After months of keeping Imola ready…
