title: 'US-Iran War Live: US, allies draft resolution to refer Iran to UN Security Council'
body: 'US-Iran War Live: President Donald Trump told reporters on Friday that the United States may hit Iran''s Pickaxe Mountain very soon. He also accused Democrats of preferring a US defeat in the Iran conflict over a White House victory as Republicans face November midterm elections amid rising food and fuel prices. Meanwhile, the US, Britain, France and Germany are pushing an IAEA resolution to refer Iran to the UN Security Council over alleged nuclear violations. The development comes as US Vice President JD Vance said Washington was investigating reports that a US airstrike in southern Iran hit a wedding party, reportedly killing five people and wounding nearly 70. Vance said the US cared about the reports and wanted to establish the facts. He declined to set a timeline for ending the conflict and ruled out talks while Iran targeted commercial shipping. Follow indiatoday.in for the latest updates on the US-Iran war.'
