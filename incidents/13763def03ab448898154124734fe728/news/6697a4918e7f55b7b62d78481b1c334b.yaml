title: Iran ties Hormuz reopening to US concessions on several demands - BusinessWorld Online
body: DUBAI/WASHINGTON/CAIRO — Iran said it was nearing a final pact with Oman defining new shipping lanes between them through the Strait of Hormuz but repeated that the US must meet other conditions, including compensation and an end to sanctions and military threats, before the strategic waterway is reopened. A US official told Reuters on Friday […]
