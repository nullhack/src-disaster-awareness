title: Iran claims strike on US early-warning radar in Bahrain, first such attack since September- Moneycontrol.com
body: Iran's Revolutionary Guards said they targeted a US radar installation in Bahrain after an alleged attack on telecommunications infrastructure in Sirik. Neither Washington nor Bahrain immediately commented.
