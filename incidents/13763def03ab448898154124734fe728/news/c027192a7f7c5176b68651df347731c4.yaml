title: UAE blames Iran for drone strikes on ADNOC tankers in Strait of Hormuz
body: The UAE has accused Iran of using drones to strike two ADNOC-operated tankers in the Strait of Hormuz. The incident sharpens fears over shipping security as wider unrest and diplomacy roil the Middle East.
