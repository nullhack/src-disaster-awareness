title: 'US-Iran War Live highlights: US lost 45 MQ-9 Reaper drones in Iran war, fleet hit may exceed $1.3 billion: Report'
body: 'US-Iran War Live highlights: The US lost at least 45 MQ9 Reaper surveillance and strike drones during the war with Iran, The Washington Post reported on Thursday quoting unnamed officials. According to the reports, the number of drones lost constitutes roughly 25 per cent of the US military fleet, potentially costing the taxpayer more than $1.3 billion.'
