title: US offers millions for information on Iran’s nuclear program despite Trump’s claims of obliteration | CNN
body: The United States is offering a reward of up to $20 million for information about Iran’s nuclear program, despite US President Donald Trump’s repeated claims to have obliterated Tehran’s capabilities.
