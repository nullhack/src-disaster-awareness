title: Iran rejects US ‘Economic D-Day’ pressure, warns countries of ‘consequences’ for joining campaign- Moneycontrol.com
body: Iran says Washington’s new economic offensive contradicts its claims that Tehran’s military and nuclear capabilities were already destroyed. The latest escalation comes as the US seeks wider international support for isolating Iran’s economy.
