title: Trump Takes Hard Line on Iran as Hormuz Standoff Drags On
body: US President Donald Trump said he won’t try to revive a stalled truce with Iran, leaving the simmering conflict in the Middle East and a tussle for control of the Strait of Hormuz stuck in limbo.
