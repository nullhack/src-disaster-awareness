title: Trump claims U.S. has 'total control' over Strait of Hormuz - TT
body: The escalating rhetoric raises further doubt that any immediate deal can be reached over the strait, through which a fifth of the world’s oil flowed before the U.S. and Israel started attacking Iran on Feb. 28.
