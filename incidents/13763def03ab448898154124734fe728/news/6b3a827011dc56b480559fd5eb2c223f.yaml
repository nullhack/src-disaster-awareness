title: Iran and Oman hold talks on managing the Strait of Hormuz and other news from around the Middle East
body: Iran and Oman say their top diplomats have met to discuss a phased approach to managing ship traffic through the Strait of Hormuz. A joint statement released by the countries says their foreign ministers met in Tehran on Tuesday. The critical waterway for oil shipments remains largely shut down nearly six months after the U.S. and Israel went to war with Iran. An oil tanker was disabled late on Monday after being struck by an unknown projectile off Oman, underscoring risks to shipping in the strait. The United Kingdom Maritime Trade Organization on Tuesday said the crew is safe and no environmental damage was immediately reported.
