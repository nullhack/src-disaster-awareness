title: 5 men arrested near a US-run air base are bailed as UK police probe whether there's a link to Iran
body: British police say that five men arrested under counterterrorism laws near a U.S.-run air base in England will be released on bail but are still under investigation. The head of U.K. Counter Terrorism Policing said Monday that the men face stringent conditions and “absolutely remain under investigation as we explore multiple lines of inquiry.” Investigators haven’t concluded whether the incident was state-backed. They are investigating a possible link to Iran, Russia or non-state-backed militant groups. RAF Fairford is home to long-range U.S. bombers that have been used in the Iran conflict and has also been the focus of protests by anti-war campaigners.
