title: Trump rejects Iran's proposal to reopen the Strait of Hormuz and other Mideast news
body: U.S. President Donald Trump has rejected Iran’s proposal to reopen the Strait of Hormuz. Trump spoke to reporters Saturday outside the White House before leaving for a college football game. This week, Iran offered to reopen the strait and resume talks on its nuclear program in seven days if the U.S. lifts its blockade of Iranian ports, waives sanctions on Iranian oil sales and observes a ceasefire that would include Lebanon. Iranian media says the country’s president has left New York after a U.N. gathering. During that event, Iran held hours of indirect talks with the U.S.
