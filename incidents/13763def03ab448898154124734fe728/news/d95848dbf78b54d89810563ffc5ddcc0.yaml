title: U.S. strikes Iran oil tankers after Iran fires at Naval ships
body: The U.S. military destroyed several Iranian oil tankers on Saturday, in retaliation for Iran firing ballistic missiles at U.S. Navy ships. The latest back-and-forth adding to economic issues here at home, as gas prices continue to rise. NBC News’ Yamiche Alcindor reports.
