title: Analyst Warns “US Basically Has No Strategic Petroleum Reserve Anymore,” As Reserves Just Fell Below 300 Million Barrels for the First Time Since 1983
body: For the first time since Ronald Reagan was in his first term, the U.S. Strategic Petroleum Reserve has collapsed below a threshold that one analyst says renders it effectively gone, and the infrastructure meant to refill it may be too broken to matter.
