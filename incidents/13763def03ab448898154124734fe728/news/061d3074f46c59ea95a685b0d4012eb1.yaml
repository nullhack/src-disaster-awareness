title: Exclusive-OPEC+ delays oil capacity review after Iran war disrupts expansion plans, sources say
body: LONDON/MOSCOW, Oct 2 - An OPEC+ review to help to determine members’ 2027 oil output quotas has been delayed after the US-Israeli war on Iran disrupted projects to expand capacity across the Middle East, throwing estimates of future production potential into uncertainty, said two sources close to the matter. OPEC+, which comprises the Organization of the Petroleum Exporting Countries plus Russia and other allies, had ordered its production capacity review for all members in late 2025 before
