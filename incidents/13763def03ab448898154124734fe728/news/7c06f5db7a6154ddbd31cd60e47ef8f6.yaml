title: Iran still awaits ‘official’ U.S. response despite Trump’s rebuff of ceasefire offer | Honolulu Star-Advertiser
body: Iran’s foreign minister said today that his country was waiting for mediators to communicate an official U.S. response to its latest ceasefire proposal before abandoning efforts to restart talks about the plan, despite President Donald Trump’s public rejection of it.
