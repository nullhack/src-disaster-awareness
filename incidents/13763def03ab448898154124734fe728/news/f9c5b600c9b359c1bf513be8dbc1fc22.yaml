title: US military hits 3 Iranian oil tankers after saying Navy warships were targeted with missiles
body: The U.S. military said it struck three Iranian oil tankers after Navy warships were targeted with missiles, warning that it would "if necessary, destroy Iran's limited and exposed oil fleet."
