title: Iran war renews concerns about the lasting toll of traumatic brain injuries to US troops
body: Military officials say the majority of American troops wounded in the Iran war have suffered traumatic brain injuries. That's raising fresh concerns about the lasting effects of such injuries, which were also a signature wound during the wars in Iraq and Afghanistan. Many people recover within weeks, but problems like memory loss and brain fog can persist for years. Colorado resident Joe Shearer says he's still plagued with dizziness, migraines and forgetfulness after experiencing two blasts in Iraq in 2005. Democratic lawmakers are calling for an investigation into the care wounded troops received following an Iranian drone strike in Kuwait that killed six soldiers early in the Iran war.
