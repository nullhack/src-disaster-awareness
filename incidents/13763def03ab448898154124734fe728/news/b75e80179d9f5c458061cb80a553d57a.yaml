title: War puts Iran’s nuclear ambiguity under scrutiny
body: 'A revisionist argument is emerging in Tehran over Iran’s nuclear strategy: that its longstanding policy of nuclear ambiguity failed its most important test when it did not deter the United States and Israel from attacking, and should now be reconsidered.'
