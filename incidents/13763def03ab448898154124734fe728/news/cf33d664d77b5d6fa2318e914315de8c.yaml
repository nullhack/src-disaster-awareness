title: US denies that Iran struck an uncrewed US military ship in the Strait of Hormuz
body: The U.S. military has denied that Iran struck an uncrewed American military vessel in the Strait of Hormuz, calling the claim a “total lie.” Iranian state media claim the U.S. vessel entered a restricted area. A top Iranian official said Tehran plans to announce an “exclusion zone” outside the Strait of Hormuz aimed at vessels it believes are attempting to transit the waterway. Meanwhile, Israeli strikes in southern Lebanon have killed seven people and leveled a hospital, according to Lebanese authorities. The strikes took place near an area of conflict between Israel and Hezbollah.
