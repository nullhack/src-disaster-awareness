title: Trump grows angry over reports on depleted munitions — believing it weakens him in Iran negotiations | CNN Politics
body: President Donald Trump has privately complained in recent days that disclosures on the dwindling US munitions stockpile make the United States look weak at a critical juncture, senior US officials said.
