title: Iran proposes a deal to reopen the Strait of Hormuz in 7 days if the US meets its conditions - ABC Columbia
body: Iran has offered to reopen the Strait of Hormuz and resume talks on its nuclear program in seven days if the United States lifts its naval blockade of Iranian ports.
