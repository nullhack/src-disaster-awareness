title: Iran says to announce new restricted zone in the Gulf in the coming days - BusinessWorld Online
body: DUBAI — Iran said it will announce a new restricted zone in the Gulf in the coming days, along with maps of a new shipping corridor through the Strait of Hormuz, as a weekend exchange of strikes on shipping sent oil prices higher on Monday. The new restricted zone will begin from where the US […]
