title: '''We won.'' ''Winding down.'' ''Close to over.'' Six months of Trump on the Iran war'
body: Over the six months of war with Iran, President Trump consistently attempted to shape the conflict's narrative through shifting and often contradictory statements. His comments have swung wildly from predicting imminent peace to threatening total obliteration of the Islamic Republic.
