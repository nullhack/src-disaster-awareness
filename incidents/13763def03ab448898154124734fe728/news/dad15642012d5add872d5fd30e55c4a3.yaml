title: 'Crude Calculations: Why the Iran War Hasn’t Yet Caused an Oil Shock | Council on Foreign Relations'
body: The Iran war has triggered the largest oil supply disruption in market history yet barely dented global growth after six months of conflict. Strategic reserves and shale get the credit, but the unexpected cushion is the fuel everyone forgets—demand itself.
