title: Trump deploys extra aircraft carrier, says Iran is making ‘big mistakes’
body: US President Donald Trump said on Thursday that Washington was strengthening its military presence in the Middle East and warned that an Iranian nuclear facility would be targeted if strikes resumed, expressing doubt that Tehran would agree to a deal.
