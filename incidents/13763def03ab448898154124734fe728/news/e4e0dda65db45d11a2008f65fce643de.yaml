title: Trump says talks with Iran under way but Tehran denies any planned - BusinessWorld Online
body: WASHINGTON/DUBAI — US President Donald Trump said on Monday that talks with Iran were under way, warning that it was a “last chance” for Tehran to sign a good deal to end the five-month-old war, but Iran denied that any negotiations were being held or planned. The contradictory statements suggest there is little prospect for […]
