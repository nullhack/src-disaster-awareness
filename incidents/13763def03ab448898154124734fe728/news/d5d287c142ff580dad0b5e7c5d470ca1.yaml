title: 'We fight hard, we fight to win: Trump defends Iran war on 9/11 anniversary'
body: Donald Trump and Pete Hegseth used Pentagon 9/11 anniversary remarks to defend the US-Israel war on Iran. The move drew criticism and coincided with renewed calls in New York for action over Saudi Arabia allegations.
