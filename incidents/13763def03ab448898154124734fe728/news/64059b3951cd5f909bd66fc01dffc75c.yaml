title: Michigan vets outline everyday impacts of Iran War, airing frustrations with GOP leadership • Michigan Advance
body: As gas prices surge to record levels amidst the ongoing war in Iran, military veterans led protestors outside a Lansing gas station Friday in opposition to the war alongside the rollout of an electronic records system they say is harming veteran healthcare.
