title: Track told to halt F1 preparations as Gulf double-header edges closer
body: Formula 1 is moving to stand down Imola as a replacement venue for the season finale, underlining its intention to race in Qatar and Abu Dhabi despite the ongoing conflict in the Middle East. GPblog understands that Formula One Management has decided in principle to halt preparations at the Italian circuit, with organisers expected to receive confirmation this week, potentially as early as today.
