title: Iran, Oman Hone in on Hormuz Strait Deal as Ship Attacks Mount
body: Iran and Oman appear to be edging closer to a deal on how the Strait of Hormuz should be managed, agreeing on routes through the key waterway that’s proved a major stumbling block in efforts to end almost six months of war between the Islamic Republic and the US.
