title: Oil rises as US-Iran peace talks stall, Hormuz shipping slows
body: By Sethuraman N R and Florence Tan NEW DELHI/SINGAPORE, Aug 17 (Reuters) - Oil prices rose on Monday as fading expectations of a U.S.-Iran peace breakthrough and slower tanker traffic through the Strait of Hormuz reinforced geopolitical risk concerns in the market.
