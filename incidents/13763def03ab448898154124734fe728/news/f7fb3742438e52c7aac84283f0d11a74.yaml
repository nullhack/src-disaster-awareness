title: Iran dismisses US economic threats, and other developments in the Middle East
body: Iran has dismissed U.S. President Donald Trump’s threats of economic pain and isolation. Iranian Foreign Minister Abbas Araghchi said Thursday that it will only increase hostility after Trump threatened “crushing economic measures” against Iran.
