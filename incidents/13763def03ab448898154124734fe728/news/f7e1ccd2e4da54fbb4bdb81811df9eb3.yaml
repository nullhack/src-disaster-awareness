title: Trucks jam Türkiye-Iran border crossing as US blockade pushes trade overland
body: Hundreds of trucks idle along the road into Iran from Türkiye’s mountainous eastern border. Bustling even in normal times, the countries’ largest crossing is now a make-or-break economic lifeline for Tehran as the US navy blockades its ports
