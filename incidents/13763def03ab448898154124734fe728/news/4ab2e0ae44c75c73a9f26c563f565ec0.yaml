title: U.S. and Iran Exchange Strikes Overnight After Monthlong Calm
body: Iran has fired on ships passing through the waterway, severely curbing the ability of U.S. allies to export oil and gas. Iranian leaders have demanded steep and immediate concessions in exchange for reopening the strait, which U.S. officials have rejected as a nonstarter.
