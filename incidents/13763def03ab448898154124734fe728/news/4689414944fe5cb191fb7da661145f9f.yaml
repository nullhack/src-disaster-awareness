title: UN report says conflict, aid cuts put 16 countries at risk of worsening hunger
body: CAIRO (AP) — Hunger is expected to worsen in 16 countries over the next six months, with war-torn Sudan and Yemen among five nations facing the gravest risk, the United Nations’ food agencies warned Friday. The agencies pointed to conflict, soaring fuel costs linked to war in the Middle East and steep cuts in aid. […]
