title: US bombs a wedding in Iran, killing four, amid escalating crisis in the US military
body: The US military attacked a house hosting a wedding in Kuhestak, in Sirik County on Iran’s southern coast, with a missile on Tuesday, killing at least four people, including a 4-year-old child, and wounding dozens, Iranian officials said Wednesday.
