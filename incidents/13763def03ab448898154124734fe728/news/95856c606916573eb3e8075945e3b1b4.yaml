title: Iran Says Strait of Hormuz Will Remain Closed
body: 'Iran says the Strait of Hormuz will remain closed until the U.S. meets conditions from the interim agreement the two countries reached in Islamabad back in June. During the U.N. General Assembly, Tehran offered to restore normal shipping through the strait within seven days if its demands are met. Iran says it will reopen the Strait of Hormuz only if the U.S. ends the war on all fronts, including Lebanon, lifts its naval blockade and sanctions, releases frozen Iranian assets, pays war compensation, recognizes Iran’s right to enrich uranium and accepts Iran’s role in governing the strait. Iran’s Foreign Ministry denied reports that Iran had offered U.N. nuclear inspections in exchange for sanctions relief, saying Tehran’s focus right now is the strait, not nuclear talks. This is Iran’s Foreign Minister Abbas Araghchi. Abbas Araghchi: “We hope the United States chooses the path of wisdom and reason. But if it once again turns to military options, we are better prepared than before,
  and we will take whatever measures are necessary to defend ourselves. If it chooses the path of diplomacy, we remain ready. The United States has lost in both war and diplomacy in the past.”'
