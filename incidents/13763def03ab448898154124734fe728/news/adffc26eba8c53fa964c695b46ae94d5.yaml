title: Trump Shares When He Expects Iran War To Finally End, And When Gas Will Drop Below $2 a Gallon - AOL
body: President Trump just put a specific end date on the Iran war and a specific price on gasoline, but analysts are already pushing back, and his past predictions on gas prices carry a complicated track record worth examining before taking this one at face value.
