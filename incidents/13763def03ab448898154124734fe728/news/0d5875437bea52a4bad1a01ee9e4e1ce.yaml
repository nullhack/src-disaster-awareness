title: 'Protecting the wounded, sick and dead: why the rules of war must translate into action'
body: Legal experts, military practitioners, policymakers and humanitarian professionals gathered in Belgium for the 26th Bruges Colloquium on international humanitarian law (IHL), held on 19 and 20 November. Discussions focused on upholding IHL to better protect the wounded, sick and dead in armed conflict.
