title: Iran in ‘advanced stages’ of planning attacks against Americans, officials say | Honolulu Star-Advertiser
body: WASHINGTON >> The U.S. government has put employees on heightened alert across the Middle East and moved to reduce personnel levels at embassies and consulates because of intelligence showing Iran is in the advanced stages of planning attacks against Americans, U.S. officials said on Friday.
