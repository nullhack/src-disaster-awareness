title: 'Families in danger, camps disrupted: How war-torn Iran won Kabaddi silver at Asian Games'
body: Iran's women pushed India to a 37-34 defeat in the Asian Games kabaddi final after a war-hit build-up. The silver medal underscored how a young squad coped with disrupted camps, family worries and no friendlies.
