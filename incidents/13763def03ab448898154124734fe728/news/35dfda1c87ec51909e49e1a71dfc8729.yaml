title: US Strike on Iran School May Be War Crime, UN Panel Says
body: A group of United Nations-backed experts found “reasonable grounds” to believe that US forces committed war crimes during the conflict against Iran, pointing to two airstrikes including one that hit a primary school in Minab, killing around 150 civilians.
