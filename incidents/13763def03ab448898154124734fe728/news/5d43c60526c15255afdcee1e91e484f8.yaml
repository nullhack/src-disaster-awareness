title: Iran’s Janfada campaign gives Basij recruitment a patriotic banner
body: Iran’s Revolutionary Guards are expanding a campaign built around sacrifice for the homeland into a route for military training and Basij paramilitary recruitment, giving a force associated with decades of domestic repression a broader patriotic appeal.
