title: Iran, Oman home in on Hormuz Strait deal as ship attacks mount
body: Iran and Oman appear to be edging closer to a deal on how the Strait of Hormuz should be managed, agreeing on routes through the key waterway that’s proved a major stumbling block in efforts to end almost six months of war between the Islamic Republic and the U.S. The finalization of a “shipping map” forms part of a broader accord to govern traffic through the strait and constitutes an ...
