title: President Trump says Iran can ‘take out’ Los Angeles and San Diego as he defends war
body: The president’s remarks come as San Diego is in the spotlight just days before the expected return Thursday of the USS Abraham Lincoln after one of the longest and most grueling deployments since World War II.
