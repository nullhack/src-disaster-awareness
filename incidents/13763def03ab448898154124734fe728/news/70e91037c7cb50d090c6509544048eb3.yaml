title: Trump tells Americans to accept high gas prices
body: DUBAI/CAIRO/GARDEN CITY, N.Y. • Iran called on the U.S. to accept defeat on Saturday, while President Donald Trump blasted Tehran as “very evil” and told Americans to prepare for continued high fuel prices as a result of the war. Progress toward peace talks and oil tanker traffic through the strategic Strait of Hormuz remained halted, […]
