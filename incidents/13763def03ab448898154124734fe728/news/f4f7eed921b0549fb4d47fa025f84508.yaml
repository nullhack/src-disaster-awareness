title: Kayhan opens fire on diplomacy, warns Iran risks losing leverage
body: As Iran hosted senior Saudi, Turkish and Pakistani officials for security talks on Monday, an influential hardline newspaper editor warned that the diplomatic initiative could undermine Tehran's position and relieve pressure on the United States.
