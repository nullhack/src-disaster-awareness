title: Trump claims Iran owes US compensation | Arkansas Democrat Gazette
body: President Donald Trump on Monday scoffed at Iran's demand for reparations for devastation caused to the country by the U.S. and Israeli bombardment over the past five months -- a demand he said Tehran's negotiators hadn't raised until now.
