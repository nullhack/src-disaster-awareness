title: Iran President Speaks On West Asia Conflict, Strait Of Hormuz And Ties With India
body: In an exclusive interaction on the sidelines of the BRICS summit in New Delhi, Iranian President Masoud Pezeshkian addressed key global and regional issues, including the ongoing West Asia conflict, Iran's position on nuclear enrichment, and relations with the United States and Israel. The discussion highlighted the status of the Strait of Hormuz blockade, maritime security, the safety of Indian seafarers, and assurances extended to India following a bilateral meeting with Prime Minister Narendra Modi. President Pezeshkian also addressed internal economic, strategic, and military conditions in Iran, along with questions surrounding the status and role of the supreme leader. The interaction elaborated on the wider geopolitical fallout affecting the Gulf region, sanctions, and international maritime corridors including Bab-el-Mandeb.
