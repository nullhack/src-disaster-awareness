title: Iran-backed Houthi rebels seize strategic Red Sea port in Yemen
body: The rebel group took over Yemen's port of Mokha, an area vital to controlling shipping through the Red Sea, Houthi and Yemeni officials said. Mokha is about 50 miles from the Bab el-Mandeb Strait.
