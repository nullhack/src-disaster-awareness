title: Iran-Pakistan border trade halt leaves trucks and cargo stranded
body: Trade between Iran and Pakistan remained suspended at two major border crossings on Tuesday, leaving trucks and cargo stranded, with Pakistani authorities citing security and anti-smuggling measures and Iran pointing to technical difficulties.
