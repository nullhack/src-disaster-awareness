title: Iran proposes a deal to reopen the Strait of Hormuz in 7 days if the US meets its conditions
body: The White House said Friday that U.S. officials are having positive and constructive conversations with mediators on the Iran war. In response to questions from The Associated Press, it said the U.S. is facilitating significant oil exports through the Strait of Hormuz.
