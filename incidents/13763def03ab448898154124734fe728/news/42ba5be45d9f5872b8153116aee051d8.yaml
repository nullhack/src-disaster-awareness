title: US, Iranian forces fire at vessels in waters near Iran - Middle East and Africa - The Jakarta Post
body: US and Iranian forces fired at vessels in waters around Iran on Saturday, including three Iranian oil carriers struck by the Americans and three tankers that Iran said it targeted while on unauthorized routes in the Strait of Hormuz.
