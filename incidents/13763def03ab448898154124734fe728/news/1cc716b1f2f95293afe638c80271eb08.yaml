title: India Achieves BRICS Consensus, New Delhi Declaration Adopted Amid Iran-UAE Thaw
body: At the 2026 BRICS summit in New Delhi, India secured the unanimous adoption of the New Delhi Declaration following overnight negotiations to resolve geopolitical gridlock between Iran and the United Arab Emirates. The final declaration voiced serious concern over tensions in West Asia and urged restraint without naming specific nations. India also facilitated a sideline meeting between Iranian President Masoud Pezeshkian and Crown Prince of Abu Dhabi Sheikh Khaled bin Mohammed bin Zayed Al Nahyan. The declaration prioritised conflict prevention, peaceful dispute resolution, multilateralism, and adherence to international law. It raised concerns regarding unilateral tariff barriers violating World Trade Organization regulations, the risk of nuclear confrontation, and advocated for cross-border trade settlements in local BRICS currencies. The BRICS chair underscored the necessity of institutional reform in representation, responsiveness, and rule-making, calling for equal Global South
  participation in future technology regulation. Former diplomat Anil Trigunayat highlighted India's established capacity as a diplomatic bridge builder.
