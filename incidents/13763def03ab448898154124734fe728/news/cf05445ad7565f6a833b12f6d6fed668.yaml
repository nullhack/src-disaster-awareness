title: 'Exclusive: ''6 महीने की जंग के बाद भी अमेरिका के आगे नहीं झुका ईरान'', बोले राष्ट्रपति पेजेश्कियान'
body: ईरान के राष्ट्रपति मसूद पेजेशकियान ने आजतक से खास बातचीत में अमेरिका के साथ संघर्ष और युद्ध के छह महीने बाद ईरान की स्थिति पर खुलकर बात की. उन्होंने कहा कि अमेरिका को उम्मीद थी कि हमले और शीर्ष नेताओं की हत्या के बाद ईरान कमजोर पड़ जाएगा, लेकिन हुआ इसका उलटा.
