title: Reports confirm Trump’s plans to resume Iran war including strikes on civilian infrastructure
body: News reports have confirmed that the Trump administration is in the advanced stages of preparation for a new military onslaught against Iran following the midterm elections that will include prolonged and escalating warfare.
