title: 'US-Iran War Live: Iran is pleading US to stop its naval blockade, Trump says'
body: 'US-Iran War News Live Updates: US President Donald Trump on Monday said the United States was holding "good talks" with Iran and expressed hope that diplomacy could end the conflict, while warning that military strikes would resume if negotiations collapsed. Speaking aboard Air Force One, Trump said Tehran wanted talks because "we''ve been hitting them very hard" and added, "I think there''s a good chance that something could happen... if it doesn''t, we go back to doing what we were doing two days ago." His remarks came two days after Washington abruptly paused its two-week bombing campaign. However, the fragile calm was tested as Saudi Arabia, Jordan and Iraq reported drone attacks, while Yemen''s Iran-backed Houthis claimed strikes on Saudi oil infrastructure. Iran denied seeking negotiations, with Foreign Ministry spokesman Esmail Baghaei calling such reports "fabricated" and insisting, "This is not in our DNA," though he confirmed indirect messages were still being exchanged
  through mediators. Tehran also maintained that it remained in control of the Strait of Hormuz, the crucial global oil shipping route at the centre of the crisis. Hopes that the pause could pave the way for diplomacy sent oil prices tumbling, with Brent crude plunging nearly 9% to around $88 a barrel after briefly crossing $100 last week. Reports suggested Trump halted the bombing campaign after military commanders warned of dwindling targets and concerns over ammunition supplies, claims the US president dismissed by insisting America had "a lot of ammunition" and was rapidly rebuilding its stockpiles. Despite the pause, uncertainty remains high as shipping through the Strait of Hormuz stays severely disrupted and both Washington and Tehran continue to disagree over future access to the strategic waterway. Follow IndiaToday.in for the latest updates.'
