title: BRICS nations call for 'maximum restraint' in Middle East war - Asia & Pacific - The Jakarta Post
body: Chinese President Xi Jinping, who joined Russian, Iranian, Indian and other leaders in India's capital, told the summit that the Middle East war "does not serve the common interests of the international community".
