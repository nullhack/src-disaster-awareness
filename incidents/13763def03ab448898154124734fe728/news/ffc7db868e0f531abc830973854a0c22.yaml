title: Iran oil minister Mohsen Paknejad resigns amid US blockade, replaced by top executive
body: Iranian President Masoud Pezeshkian accepted the resignation and appointed NIOC head Hamid Bovard as acting oil minister, according to a statement broadcast by state media outlet IRIB.
