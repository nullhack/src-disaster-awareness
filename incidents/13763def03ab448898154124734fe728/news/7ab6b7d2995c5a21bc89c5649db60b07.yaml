title: Investors prosper and consumers pay as the Iran war exacts an uneven economic toll 6 months in
body: 'As the U.S. and Israel relentlessly bombed Iran in the opening days of war, the most dramatic predictions of the conflict’s toll were unsparing: surging oil prices, worldwide recession and economic catastrophe. “So far, the global economy has pulled off the financial equivalent of a ‘Mission Impossible’ scene,” said Michael Ashley Schulman, an investment strategist with Cerity Partners. Stock markets hate uncertainty, and the decision by the U.S. and Israel to attack Iran on Feb. 28 delivered heaps of it.'
