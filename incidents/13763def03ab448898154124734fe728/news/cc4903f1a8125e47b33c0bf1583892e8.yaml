title: Republican resistance to Iran war grows in the Senate as Murkowski flips
body: WASHINGTON (AP) — Senate Republicans on Wednesday again blocked Democratic legislation that would halt President Donald Trump’s war with Iran, but the number of GOP senators voting against the war grew. Republican Sen. Lisa Murkowski of Alaska voted against the war for the first time since it began at the end of February. Two other […]
