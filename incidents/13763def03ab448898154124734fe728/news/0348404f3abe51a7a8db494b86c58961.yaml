title: Latest developments in US-Iran war
body: 'US President Donald Trump threatened on Monday to bomb Oman, as a 60-day deadline to end the war with Iran expired. Here are the latest developments in the Middle East conflict: - ''Positive'' US-Iran talks - Trump''s envoy and son-in-law Jared Kushner said that the United States and Iran were having "very positive and active conversations," while noting that "there''s really not a lot of trust between America and Iran after all these years".'
