title: Oil prices tumble after Trump calls for easing Iran attacks - TT
body: Brent crude, the international standard, fell 4.9% to $83.65 per barrel. The retreat in oil prices was just the latest of many big swings since the U.S. and Israel attacked Iran in late February.
