body: U.S. Rep. Glenn ‘GT’ Thompson, R-Centre, believes the Iranian regime is at fault for the ongoing war with the United States, although he supports an end of the conflict. “We didn’t choose this war,” Thompson said on Wednesday. “The number of American soldiers that have been killed at different bases in the Middle East, around […]
