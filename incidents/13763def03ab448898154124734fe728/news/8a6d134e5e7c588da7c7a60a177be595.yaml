title: Iran ‘weighs Cyprus’ as potential target if US escalates war
body: Iran has considered targeting US and British military assets in Europe, including Cyprus, if Washington escalates its conflict with Tehran, the Financial Times reported on Wednesday, citing people close to the Iranian regime. According to the FT, Iranian forces have assessed options for striking US military targets in south-eastern Europe…
