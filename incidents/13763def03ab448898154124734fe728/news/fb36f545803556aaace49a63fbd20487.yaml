title: Counterterrorism chief says Iran's leadership hasn't moderated, undercutting Vance's hopes
body: The acting director of the National Counterterrorism Center said Wednesday that Iran’s leadership has not moderated its behavior, casting doubt on Vice President JD Vance’s earlier hopes that negotiations could fundamentally transform relations between Washington and Tehran. Joseph Weirsky, President Donald Trump’s nominee to permanently lead the counterterrorism agency, made the assessment during a Senate... Read More
