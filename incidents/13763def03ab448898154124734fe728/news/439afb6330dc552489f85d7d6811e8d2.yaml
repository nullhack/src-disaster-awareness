title: Latest developments in the US-Iran war
body: 'The Middle East war has flared again for the first time in a month, with American strikes on Iran prompting retaliation from Tehran on Monday. Here are the latest developments: - Iran attacks Jordan, UAE - Iran''s Revolutionary Guards said Monday they attacked two US military air bases with ballistic missiles in Washington-allied Jordan, causing "heavy damage", state media reported.'
