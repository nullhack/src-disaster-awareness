title: US moves to choke Iran's aviation lifelines with new sanctions on 27 airlines
body: The United States has imposed sweeping sanctions on 27 Iranian airlines and the foreign networks supporting them. As part of Donald Trump's 'Economic D-Day' campaign against Tehran, the US is widening its assault beyond Iran's airlines to target the overseas networks that help keep the country's aviation sector functioning.
