title: Talks or resistance? Iran's factions differ over path out of crisis
body: Divisions within Iran's political establishment over how to end the country's prolonged state of neither war nor peace are coming into sharper focus as mediators race to secure an agreement with Washington amid preparations for possible renewed US-Israeli strikes.
