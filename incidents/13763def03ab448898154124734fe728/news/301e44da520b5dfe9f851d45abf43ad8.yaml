title: 'US announces fresh Iran sanctions as war reaches six monthsPublished on: August 29, 2026 12:18 AM'
body: Pakistan, Aug. 29 -- The United States has announced new Iran-related sanctions as the conflict between Washington and Tehran reaches six months. The latest measures target individuals and entities linked to Iran's financial activities.
