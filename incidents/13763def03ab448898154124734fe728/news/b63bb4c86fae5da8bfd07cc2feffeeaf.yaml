title: Trump calls Iran conflict 'small potatoes' and defends Vance's position that it's not a 'war'
body: President Donald Trump describes the conflict in Iran as "small potatoes" and says he agrees with Vice President JD Vance's assertion that months of on-and-off attacks in the Middle East are no longer a "war."
