title: 'From Sanctions To Standoff: How Iran''s Airport Threat Could Rattle Gulf Aviation | Outlook India'
body: Iran has warned neighbouring countries over restrictions on its airlines. Tehran says airports could be affected if countries help enforce US flight curbs. The threat comes as US sanctions disrupt Iranian international air travel.
