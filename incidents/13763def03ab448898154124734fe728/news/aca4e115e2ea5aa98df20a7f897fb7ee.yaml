title: 'Trump threatens Oman: latest developments in US-Iran war'
body: 'US President Donald Trump threatened on Monday to bomb Oman, 60 days after the signing of a memorandum of understanding towards a peace deal to end the war between the United States and Iran. Here are the latest developments in the Middle East conflict: - Trump threatens Oman - Trump threatened to bomb Oman if it "gets in the way" of a US deal with Tehran on the Strait of Hormuz and called for Iran to surrender.'
