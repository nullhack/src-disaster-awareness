title: 'US-Iran War Live: Discontent with Trump growing among US allies in Middle East, report says'
body: 'US-Iran War Live Updates: Iran called on the United States to accept defeat as the conflict showed no signs of easing, while US President Donald Trump called Tehran “very evil” and warned Americans to prepare for persistently high fuel prices. Progress towards peace talks remained stalled, with oil tanker traffic through the strategic Strait of Hormuz also halted. Iran’s Deputy Foreign Minister Kazem Gharibabadi said the waterway would remain under Tehran’s control until Washington accepted what he described as the reality of defeat. Foreign Minister Abbas Araqchi said Iran had not decided to resume talks with the US, adding that messages exchanged through Qatar and Pakistan did not constitute negotiations. Separate discussions with Oman were focused on establishing a sea route through the Strait, he said. Meanwhile, Qatar on Saturday denied claims that it was holding Iranian pilots, saying they had violated Qatari airspace in March and failed to respond to repeated attempts to contact
  them.'
