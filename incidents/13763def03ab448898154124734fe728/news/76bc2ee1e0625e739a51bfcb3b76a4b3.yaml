title: Iran war renews concerns about lasting toll of traumatic brain injuries
body: WASHINGTON — When Joe Shearer was a Marine fighting in Iraq, a blast from an enemy mortar round knocked him down and made him vomit. He got up and kept going despite a searing headache. When a roadside bomb struck his Humvee convoy months later, the explosion’s shock wave swept through his body before headaches […]
