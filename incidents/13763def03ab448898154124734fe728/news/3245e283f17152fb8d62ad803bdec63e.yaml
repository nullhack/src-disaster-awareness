title: 'The Latest: Trump is in South Carolina to stump for Sen. Darline Graham ahead of GOP Senate runoff'
body: President Donald Trump is in South Carolina on Friday making a last-minute appeal for Sen. Darline Graham, his chosen candidate to replace her brother, the late Sen. Lindsey Graham. Voters will decide Tuesday whether Graham or Rep. Ralph Norman will be Republicans’ nominee on the November ballot.
