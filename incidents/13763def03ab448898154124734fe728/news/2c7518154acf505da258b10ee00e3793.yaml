title: Qatar says mediators make progress in efforts to end US-Iran war - BusinessWorld Online
body: DUBAI/WASHINGTON — Qatar said on Tuesday mediators were making progress in efforts to end the US-Iran war, driving oil prices lower, although Tehran has denied President Donald Trump’s assertion that talks are already under way. Benchmark Brent crude fell more than 5% after the comments from Qatar, extending Monday’s steep losses on hopes that an […]
