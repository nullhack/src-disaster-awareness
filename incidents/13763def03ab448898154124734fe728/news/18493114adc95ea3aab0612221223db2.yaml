title: Saudi Arabia says debris from an intercepted Houthi drone killed 1, and other Mideast developments
body: Saudi Arabia said debris from an intercepted Houthi drone killed one person, while the leader of the Iran-backed Houthis called for protests and said the kingdom committed a “monstrous fabrication” when it accused the rebels of trying to attack Islam
