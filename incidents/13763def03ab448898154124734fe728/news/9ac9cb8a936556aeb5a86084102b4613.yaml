title: Passenger terminal at Riyadh airport is struck again, a day after 12 were killed
body: A projectile has struck a passenger terminal at the international airport in Riyadh, a day after a missile hit the same complex and killed 12 people. Sunday’s strike occurred as King Khalid International Airport remained closed. The Iran-backed Houthi rebels in neighboring Yemen claimed responsibility. The escalation in fighting threatens to draw in greater U.S. military involvement. President Donald Trump has said he is considering joining the fight against the rebels. The Houthis have threatened more strikes across Saudi Arabia and warned airlines about using Saudi airspace.
