title: 'Iran war costing US households average of $2K each: Moody’s'
body: The war in Iran has cost the average American household $2,000 so far, according to estimates shared Monday by Mark Zandi, chief economist at Moody’s Analytics. “Consider that the war’s costs taken together have absorbed about half the average American household’s income gain over the past eight months,” Zandi wrote on social platform X. “No…
