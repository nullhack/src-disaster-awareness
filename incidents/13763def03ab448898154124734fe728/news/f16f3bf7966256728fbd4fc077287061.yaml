title: 'US-Iran War Live: US will keep pressure on Iran if Iran rejects long-term changes, says JD Vance'
body: 'US-Iran War Live Updates: Egypt could join a proposed defence pact between Turkey, Pakistan and Saudi Arabia once certain technical issues are resolved, Turkish Foreign Minister Hakan Fidan said. He said the pact would be technically similar to NATO’s Article 5, under which an attack on one member is treated as an attack on all. Fidan added that the agreement would include a committee of ministers and a general secretariat, similar to NATO’s structure. He also said Turkey must be involved in an international coalition to address security concerns surrounding Red Sea shipping, describing the issue as directly linked to Turkish interests.Follow indiatoday.in for all the latest updates.'
