title: US military says it has fired on a ship in Gulf of Oman to enforce its blockade of Iranian ports
body: The U.S. military said Tuesday that its forces fired on a Panamanian-flagged ship in the Gulf of Oman that tried to evade the American blockade on Iranian ports.
