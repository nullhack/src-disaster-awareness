title: 'West Asia war LIVE: Saudi Arabia warns it will react ''firmly'' to Houthi attacks'
body: Saudi Arabia warned on September 15, 2026, it will react “firmly” to Yemen’s Houthis, after a series of attacks carried out by the pro-Iranian rebels using ballistic missiles and drones wounded 13 civilians in the country’s south.
