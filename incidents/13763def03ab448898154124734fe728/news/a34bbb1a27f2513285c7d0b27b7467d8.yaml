title: Iran Guards say won't reopen Hormuz without US meeting Tehran's demands
body: Iran's Revolutionary Guards insisted Sunday that they would not reopen the Strait of Hormuz until the United States complied with a list of demands, including paying compensation for war damage. Iran's effective blockade of the crucial energy conduit has rattled allies, roiled markets and driven up prices, but US President Donald Trump said Sunday that he was "low-keying it" in his approach to Tehran, suggesting he believed he could wait them out economically.
