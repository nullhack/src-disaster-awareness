title: US to Roll Out ‘Economic Isolation’ Plan for Iran Next Week
body: The US will soon announce what it bills as unprecedented economic measures against Iran, Treasury Secretary Scott Bessent said, intensifying the Trump administration’s effort to force Tehran’s capitulation through financial pressure.
