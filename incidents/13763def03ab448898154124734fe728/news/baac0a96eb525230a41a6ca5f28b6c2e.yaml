title: San Diego mayor demands apology after Trump says Iran could ‘take out’ the city
body: San Diego Mayor Todd Gloria criticized President Donald Trump on Tuesday following remarks made during a Nebraska rally suggesting the city could be lost in the Iran conflict as a small price to pay.
