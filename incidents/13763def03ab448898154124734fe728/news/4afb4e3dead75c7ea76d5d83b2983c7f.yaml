title: Iran appoints hard-line leaders | Arkansas Democrat Gazette
body: DUBAI, United Arab Emirates -- After six months of war, Iran's leadership has coalesced around a hard core of military generals and clerics long entrenched in the ruling theocracy. They are ready for a potentially long confrontation with the U.S. and determined to prevent any unrest at home.
