title: Saudi Arabia shuts down a pipeline as Houthis seize an island, opening a new front in the Iran war - WCCB Charlotte
body: Saudi Arabia says it shut down a major pipeline a day after it was attacked by drones, and Yemen’s Iranian-backed Houthi rebels captured a strategic island at the southern entrance to the Red Sea, two officials said, opening a new front in the Iran war.
