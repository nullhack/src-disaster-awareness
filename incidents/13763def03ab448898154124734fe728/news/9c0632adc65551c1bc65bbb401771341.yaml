title: US denies Iran's claim to have struck an unmanned ship, and other Mideast news
body: The U.S. military has denied Iran’s claim to have struck an unmanned American military vessel in the Strait of Hormuz, calling it a “total lie.” Iranian state media claim the U.S. vessel entered a restricted area. Meanwhile, Israeli strikes in southern Lebanon have killed seven people and leveled a hospital, according to Lebanese authorities. The strikes took place near an area of conflict between Israel and Hezbollah. In Yemen, government forces have recaptured key districts from Houthi rebels. In Gaza, a mass funeral was held for over 110 Palestinians recovered from rubble. Muslim nations have condemned an Israeli proposal to remove Palestinians from Gaza.
