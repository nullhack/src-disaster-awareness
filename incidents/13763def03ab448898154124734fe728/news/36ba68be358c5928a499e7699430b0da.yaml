title: Hinson calls for 'immediate' end to Iran war as U.S. Senate race intensifies
body: U.S. Senate candidates Republican Ashley Hinson and Democrat Josh Turek held events in Des Moines to address rising concerns over affordability and increasing gas prices. Hinson called for an "immediate" end to the conflict in Iran.
