title: 'US-Israel-Iran war latest news: Iran secures $7.5bn in oil revenues over first four months of 2026, which was made available to central bank'
body: 'India, Aug. 19 -- US-Israel-Iran War Latest News: Iran secured $7.5bn in foreign currency oil revenues during the first four months of 2026, which were delivered to the Central Bank. This total marks a 50 percent increase compared to the same timeframe in 2025.'
