title: Trump may insist war in Iran is ‘small potatoes’—but it’s costing $3 billion a month, with $38 billion already spent, reports budget watchdog
body: These funds reflect the cost of replacing expended munitions and equipment lost in battle, the CBO wrote, as well as increased flying hours, increased fuel costs, and "other operations."
