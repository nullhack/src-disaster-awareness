title: 'West Asia conflict: Yemen''s Houthis carry out drone attacks on Saudi airport, Aramco facility - BusinessToday'
body: Yemen, which has been embroiled in more than a decade of civil conflict, in July became the latest country to be dragged into the Middle East war after the Houthis upended a 2022 truce with the country’s Saudi-backed government.
