title: The Iran War is eating Trump’s presidency
body: An Iran war that was supposed to be brief, and then was supposed to be over, is imposing an increasing price on Donald Trump’s presidency. We’ve seen a second term of a Republican administration go this way before. There are distinct echoes of George W. Bush’s Iraq War — the conflict that Trump has long […]
