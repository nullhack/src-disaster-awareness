title: 6.4-magnitude quake jolts Davao Occidental, aftershock of destructive June tremor — PHIVOLCS - BusinessWorld Online
body: A magnitude 6.4 earthquake jolted offshore of Sarangani, Davao Occidental on Wednesday with varying intensities felt in several areas, according to the Philippine Institute of Volcanology and Seismology (PHIVOLCS) which said the tremor was an aftershock of the destructive magnitude 7.8 earthquake that struck in June. The earthquake’s epicenter was located about 37 kilometers south-southwest […]
