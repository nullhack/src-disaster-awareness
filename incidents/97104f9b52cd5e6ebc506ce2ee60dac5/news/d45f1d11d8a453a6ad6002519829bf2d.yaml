title: Magnitude 5.2 quake jolts Sarangani
body: MANILA, Philippines — A magnitude 5.2 earthquake, which was an aftershock of a powerful temblor that jolted Sarangani two months ago, rocked the province and nearby areas on Wednesday morning, according to the Philippine Institute of Volcanology and Seismology.
