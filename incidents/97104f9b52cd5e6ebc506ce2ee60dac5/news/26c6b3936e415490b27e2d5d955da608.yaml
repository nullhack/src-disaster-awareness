body: 'Philippines earthquake 2026: A magnitude 6.3 aftershock struck Mindanao on August 5 while displaced survivors gathered for cash subsidies, two months after June''s M7.8 catastrophe. No casualties; depth of 62 km explains why no tsunami warning was issued.'
