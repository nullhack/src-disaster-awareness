title: Magnitude 6.4 earthquake jolts Davao Occidental
body: A magnitude 6.4 earthquake jolted Davao Occidental on Wednesday, the Philippine Institute of Volcanology and Seismology (Phivolcs) said. The tectonic quake struck 37 km. southwest of Balut Island at around 12:14 p.
