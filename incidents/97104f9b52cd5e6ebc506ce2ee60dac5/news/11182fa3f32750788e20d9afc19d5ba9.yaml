title: World Bank says it disbursed $200 million to Colombia for quake response
body: WASHINGTON, Aug 14 (Reuters) - The World Bank on Friday said it had disbursed $200 million to Colombia for its emergency response to a deadly August 10 earthquake that left hundreds dead. The multilateral development bank said it was working with the Colombian government and development partners,
