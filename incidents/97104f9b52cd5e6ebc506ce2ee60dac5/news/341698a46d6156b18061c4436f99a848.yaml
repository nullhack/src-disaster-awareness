title: Magnitude 6.4 earthquake strikes off southern Philippines; no tsunami warning
body: A 6.4-magnitude earthquake struck off southern Philippines' Sarangani on Wednesday (Aug 5) afternoon. According to the Philippine Institute of Volcanology and Seismology (PHIVOLCS), the earthquake happened at 12.14pm at a depth of 13km.No tsunami warning was triggered. The agency, which has a 10-point earthquake intensity scale, rated the quake at 5, which is considered strong.Under this intensity, those who are...
