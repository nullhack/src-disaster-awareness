title: Magnitude 6.4 quake hits Sarangani; aftershocks expected
body: A magnitude 6.4 earthquake jolted Sarangani shortly past noon yesterday, and was expected to generate aftershocks, according to the Philippine Institute of Volcanology and Seismology.
