title: 6.3-Magnitude Earthquake Jolts Southern Philippines, Residents Flee Buildings In Panic
body: A 6.3-magnitude earthquake struck off Philippines near Sarangani Island, triggering panic among residents. No tsunami warning, casualties or major damage were immediately reported.
