title: A magnitude 7.4 earthquake killed more than 300 people across Colombia's Chocó region
body: A powerful earthquake that struck western Colombia on August 10, 2026 has become the deadliest seismic disaster the country has recorded in more than two decades, with the confirmed death toll climbing past 300 in the days that followed.
