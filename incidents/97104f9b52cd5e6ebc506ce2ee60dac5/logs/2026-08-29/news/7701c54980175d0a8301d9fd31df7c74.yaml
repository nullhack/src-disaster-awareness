title: 'When Connectivity Matters Most: PLDT Enterprise Brings Starlink Support to Mindanao Recovery Efforts'
body: MANILA, Philippines – In the aftermath of the powerful earthquake that struck parts of Mindanao, PLDT Enterprise, together with PLDT and Smart, deployed Starlink satellite connectivity solutions and mobilized emergency communications support to assist communities, responders, and local government units in maintaining critical links during a time of urgent need. PLDT and Smart immediately dispatched...
