log_date: '2026-09-03'
summary: On August 30, a magnitude 4.2 earthquake struck waters off Balut Island, Sarangani, Davao Occidental, at a depth of 10 km, according to PHIVOLCS. Additionally, a magnitude 6.0 tectonic earthquake hit 115 km south of Balut Island on a recent Tuesday evening, continuing the aftershock sequence following the major June 26 quake.
