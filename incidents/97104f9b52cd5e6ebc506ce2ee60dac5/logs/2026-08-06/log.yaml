log_date: '2026-08-06'
summary: On August 5, 2026, a magnitude 6.4–7.0 earthquake struck off the coast of Sarangani, Davao Occidental, at 12:13 PM local time, jolting parts of Mindanao. PHIVOLCS confirmed the tremor was an aftershock of the destructive June 26 magnitude 7.8 earthquake and reported no tsunami threat. While no damage or casualties were immediately reported, several provinces suspended classes and work as a precaution, and the quake caused panic among residents.
