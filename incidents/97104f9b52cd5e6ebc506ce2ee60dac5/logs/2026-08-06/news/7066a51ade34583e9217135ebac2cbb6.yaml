title: 6.3-magnitude offshore earthquake strikes Southern Philippines
body: A 6.3-magnitude offshore earthquake struck Davao Occidental in the southern Philippines on Thursday, the second major quake in two days. Authorities reported no tsunami threat. The Philippines remains vulnerable to seismic activity due to its location along the Pacific Ring of Fire
