title: M7.0 earthquake jolts waters off Davao Occidental; no tsunami threat
body: A magnitude 7.0 earthquake struck waters south of Sarangani, Davao Occidental at 12:13 p.m. on Wednesday, August 5, prompting residents in parts of Mindanao to evacuate buildings, although authorities said there was no tsunami threat to the Philippines.
