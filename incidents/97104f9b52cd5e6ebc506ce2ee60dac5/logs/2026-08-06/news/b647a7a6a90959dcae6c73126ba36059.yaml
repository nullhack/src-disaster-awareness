title: 'Breaking: Magnitude 7.0 earthquake rocks Sarangani, Davao Occidental'
body: Cebu City, Philippines — A magnitude 7.0 earthquake struck off the coast of Sarangani, Davao Occidental, 12:13 p.m. today, August 5, 2026, according to the Philippine Institute of Volcanology and Seismology (Philvolcs).
