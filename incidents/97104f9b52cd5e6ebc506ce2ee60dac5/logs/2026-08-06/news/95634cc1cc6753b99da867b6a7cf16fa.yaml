title: 6.4 magnitude earthquake strikes off coast of southern Philippines
body: A 6.4 magnitude earthquake struck off the coast of the southern Philippines in the Mindanao region on Wednesday, according to the German Research Center for Geosciences. The earthquake struck at a depth of 10 kilometers (6.2 miles).
