title: Kidapawan suspends classes following magnitude 6.4 earthquake
body: KIDAPAWAN CITY, Cotabato — Afternoon classes in all levels in both public and private schools here were cancelled following the earthquake that jolted this city shortly past Wednesday noon. Mayor Jose Paolo Evangelista issued the directive to ensure the safety of all learners from possible aftershocks.
