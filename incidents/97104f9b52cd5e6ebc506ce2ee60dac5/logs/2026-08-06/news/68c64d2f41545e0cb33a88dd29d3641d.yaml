title: Magnitude 7.0 quake strikes off Davao Occidental
body: MANILA, Philippines (Updated 1:13 p.m.) — A relatively shallow but powerful magnitude 7.0 earthquake struck off Davao Occidental on Wednesday afternoon, but state seismologists said it posed no tsunami threat to the Philippines and was not expected to cause damage.
