title: Sultan Kudarat, Sarangani cut classes after earthquake
body: KORONADAL CITY, South Cotabato — Authorities in Sultan Kudarat and Sarangani provinces suspended classes on Wednesday after a magnitude 6.4 earthquake struck off the coast of Sarangani, Davao Occidental shortly past noon for the safety of students and school personnel.
