log_date: '2026-08-19'
summary: A magnitude 5.2 earthquake struck off the coast of Sarangani, Davao Occidental on Friday, adding to the ongoing aftershock sequence. Meanwhile, Filipino-American groups in Texas formed a coalition to aid Mindanao's earthquake recovery, and a DepEd official in Sarangani expressed concern over classroom shortages exacerbated by quake devastation.
