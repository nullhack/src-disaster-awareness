title: Two strong aftershocks jolt Sarangani in Davao Occidental
body: Two strong aftershocks hit off the coast of Sarangani in Davao Occidental on Wednesday evening, the Philippine Institute of Volcanology and Seismology (PHIVOLCS) reported.
