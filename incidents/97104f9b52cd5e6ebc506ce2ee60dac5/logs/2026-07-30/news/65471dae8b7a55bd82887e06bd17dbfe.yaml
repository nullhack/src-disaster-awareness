title: Nissan extends support to Mindanao earthquake-affected communities - BusinessWorld Online
body: Nissan Philippines, Inc. expresses its solidarity with the Filipino people by extending its support to the Philippine Red Cross and the Angat Buhay Foundation, aiding families as they recover from the disaster.
