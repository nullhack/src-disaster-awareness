log_date: '2026-08-14'
summary: The Socio-Civic Projects Fund provided educational assistance to five students in Barangay Tuyan, Malapatan, Sarangani Province, supporting the community's recovery from the earthquake. A viral video of a schoolyard shaking during a quake was confirmed to be from the Philippines, not Colombia, though it likely depicts an earlier event. A world earthquake roundup also mentioned the Philippines' 2026 quakes in a broader context.
