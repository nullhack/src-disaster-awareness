title: Early wildfire surge raises alarm in Indonesia
body: According to the Forestry Ministry's Sipongi wildfire monitoring platform, around 107,000 hectares of land and forest, an area nearly twice the size of Jakarta, burned nationwide in the first half of the year. The figure is 120 percent higher than during the same period in 2019.
