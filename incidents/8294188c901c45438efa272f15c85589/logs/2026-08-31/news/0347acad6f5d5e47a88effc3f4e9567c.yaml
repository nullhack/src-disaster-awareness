title: 5.9-magnitude quake hits Kermadec Islands, New Zealand -- GFZ
body: HONG KONG, Aug. 30 (Xinhua) -- An earthquake with a magnitude of 5.9 jolted Kermadec Islands, New Zealand, at 0902 GMT on Sunday, the GFZ German Research Centre for Geosciences said.
