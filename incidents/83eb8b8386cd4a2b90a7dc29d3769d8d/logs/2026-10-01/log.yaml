log_date: '2026-10-01'
summary: A magnitude 5.6-5.7 earthquake struck off the coast of Costa Rica on September 30, 2026, with its epicenter located approximately 106 kilometers southwest of Santa Cruz. The earthquake had a depth of 10 km, as reported by the European-Mediterranean Seismological Centre and the GFZ German Research Centre for Geosciences. No immediate reports of significant damage or casualties were noted in the selected news.
