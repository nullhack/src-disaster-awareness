title: 'Urgent: 5.6-magnitude quake hits off coast of Costa Rica -- GFZ'
body: An earthquake with a magnitude of 5.6 jolted off coast of Costa Rica at 2155 GMT on Wednesday, the GFZ German Research Centre for Geosciences said. The epicenter, with a depth of 10 km, was initially determined to be at 9.
