log_date: '2026-11-20'
summary: Officials warned that a Greek holiday island popular with British tourists should be "prepared" for a tsunami based on what was described as a scientifically calculated assessment. UNESCO separately cautioned that the Mediterranean faces close to a 100% chance of a destructive tsunami, with some waves potentially reaching shore in under 10 minutes and past events producing roughly two-meter waves, strong currents, damage and deaths. Scientists also reported renewed stress on the undersea fault responsible for Japan's 2011 earthquake, raising concerns about future seismic activity across the Pacific.
