log_date: '2026-08-04'
summary: The cumulative death toll from the earthquake has risen to at least 38, with Prime Minister Sanae Takaichi visiting the affected region and meeting with victims and local leaders. Over 9,200 people remain in evacuation shelters. A company has formally apologized after confirming two employees died in the gas explosion at the collapsed Aeon Mall, providing additional details about those deaths. The earthquake has also raised concerns about potential delays to TSMC's planned 3nm expansion at its Kumamoto fab.
