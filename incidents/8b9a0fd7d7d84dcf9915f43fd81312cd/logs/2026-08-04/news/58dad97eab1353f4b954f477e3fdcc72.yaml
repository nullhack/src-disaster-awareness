title: Prime minister visits quake-hit southern Japan as cleanup begins in intense heat
body: TOKYO (AP) — Residents in Japan’s quake-hit southwestern prefecture of Kumamoto put out heaps of debris for collection as the region baked under intense heat. The heat and a lack of water supplies have added to the challenges in the severely damaged areas where Prime Minister Sanae Takaichi briefly visited for the first time since […]
