title: Japan Mall Worker, 22, Dies in Gas Explosion After Earthquake as Bosses 'Instructed' Her Back Inside for Shop's Cash
body: A 22-year-old mall worker died in a suspected gas explosion after being ordered to re-enter a compromised building post-earthquake. Her family demands accountability from the employer for her preventable death.
