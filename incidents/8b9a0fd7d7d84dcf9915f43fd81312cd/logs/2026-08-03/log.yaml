log_date: '2026-08-03'
summary: New developments include Verisk estimating insured losses from the Kumamoto earthquake between JPY 220 billion and JPY 340 billion, and reports that the quake may disrupt TSMC's planned 3nm expansion at its Kumamoto fab. Over 9,000 evacuees continue to face severe heat and water outages, and a 22-year-old mall worker died in a gas explosion after being instructed to re-enter the collapsed Aeon Mall to retrieve cash.
