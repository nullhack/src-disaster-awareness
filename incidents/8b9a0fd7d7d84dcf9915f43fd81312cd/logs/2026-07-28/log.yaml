log_date: '2026-07-28'
summary: A powerful earthquake, initially measured at magnitude 7.1 (later revised to 6.8), struck Kumamoto Prefecture in southern Japan on July 28, 2026, at 4:27 p.m. local time. The quake caused the partial collapse of the Aeon Mall in Kashima, trapping many people and leaving an unknown number dead, while injuring at least 50 others and causing widespread damage including fires, power outages, and damage to historic Kumamoto Castle.
