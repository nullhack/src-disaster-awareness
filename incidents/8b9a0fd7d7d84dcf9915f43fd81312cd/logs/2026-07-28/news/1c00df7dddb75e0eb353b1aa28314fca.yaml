title: 7.1 magnitude quake shakes Japan's Kyushu and people are missing after a shopping center collapses
body: An earthquake with a magnitude of 7.1 has shaken Japan’s southern main island of Kyushu. It caused part of a shopping center in Kashima Town to collapse on Tuesday, leaving dozens of people missing or injured.
