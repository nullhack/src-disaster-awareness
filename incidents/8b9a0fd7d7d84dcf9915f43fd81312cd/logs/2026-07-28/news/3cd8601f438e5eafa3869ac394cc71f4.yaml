title: Deaths feared in Japan shopping mall blast after 7.1-magnitude earthquake hits Kyushu, tsunami warning lifted
body: A 7.1-magnitude earthquake hit southern Japan's Kumamoto prefecture on July 28, knocking out power to thousands of homes, rupturing roads and leaving some trapped and others presumed dead inside a partially collapsed shopping mall.
