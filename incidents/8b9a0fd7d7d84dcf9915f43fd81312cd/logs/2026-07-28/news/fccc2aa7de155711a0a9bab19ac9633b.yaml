title: Magnitude 7.1 earthquake damages Japanese shopping center, trapping unknown number of people
body: An earthquake registering a magnitude of 7.1 shook Kumamoto on Japan’s southern main island of Kyushu late Tuesday afternoon and a tsunami advisory was temporarily issued.
