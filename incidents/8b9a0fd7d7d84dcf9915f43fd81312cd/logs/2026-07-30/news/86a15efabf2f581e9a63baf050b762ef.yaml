title: 'After the quake came the blast: Inside Japan’s shopping mall disaster | Jefferson City News-Tribune'
body: KUMAMOTO, Japan -- Workers in a mall in southern Japan described being thrown to the floor or enveloped in a cloud of dust by a massive 7.1-magnitude quake that rattled the building on Tuesday. They were the lucky ones. An hour later, the real disaster struck.
