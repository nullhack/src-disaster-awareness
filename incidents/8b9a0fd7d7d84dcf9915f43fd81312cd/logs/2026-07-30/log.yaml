log_date: '2026-07-30'
summary: |-
  By July 30, the death toll from the July 28 Kumamoto earthquake has risen to at least 34 as rescuers race against time to find survivors in the collapsed Aeon Mall, where an explosion occurred an hour after the initial quake. Over 100 aftershocks have been detected, including a 5.8-magnitude quake, and devastated communities are facing water shortages and extreme heat, with long lines for fuel and food supplies.
  As of July 30, the death toll from the Kumamoto earthquake has reached 34, with hundreds of aftershocks including a 5.8-magnitude tremor. Survivors continue to face severe water shortages and extreme heat, with long queues for fuel and supplies. In a small bright spot, 25 cats trapped inside the collapsed Aeon Mall were successfully rescued.
