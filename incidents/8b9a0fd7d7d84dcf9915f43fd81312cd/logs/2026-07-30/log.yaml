log_date: '2026-07-30'
summary: By July 30, the death toll from the July 28 Kumamoto earthquake has risen to at least 34 as rescuers race against time to find survivors in the collapsed Aeon Mall, where an explosion occurred an hour after the initial quake. Over 100 aftershocks have been detected, including a 5.8-magnitude quake, and devastated communities are facing water shortages and extreme heat, with long lines for fuel and food supplies.
