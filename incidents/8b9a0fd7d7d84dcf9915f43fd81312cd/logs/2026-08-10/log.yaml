log_date: '2026-08-10'
summary: Two weeks after the earthquake, over 6,000 evacuees remain in shelters, with preparations underway to move them to hotels. The Japanese government will apply reconstruction aid law to all of Kumamoto Prefecture, offering up to ¥3 million for housing repair, while U.S. Forces airlifted 33,000 bottles of drinking water to the region. Additional aftermath reports include a fireworks display honoring victims, a survivor urging youth to pursue peace, and warnings about post-quake scams and crimes targeting damaged homes and shelters.
