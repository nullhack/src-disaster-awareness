title: Prime minister visits quake-hit southern Japan as cleanup begins in intense heat
body: Residents of Japan’s quake-hit southwestern prefecture of Kumamoto are working to clear their homes in intense heat, as Prime Minister Sanae Takaichi briefly visited Kumamoto Prefecture on Monday for the first time since a magnitude 7.1 quake last Tuesday. The heat and a lack of water have added to the challenges in the severely damaged areas. The quake killed 38 people, including one who died of apparent heat stroke while taking shelter in a car in hot weather. Residents put out heaps of debris, broken furniture and damaged appliances for collection, while in the towns of Uki and Hikawa, construction of temporary housing began.
