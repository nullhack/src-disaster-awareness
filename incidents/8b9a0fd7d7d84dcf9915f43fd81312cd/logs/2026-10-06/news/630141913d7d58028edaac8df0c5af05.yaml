title: Standing Together for Kumamoto - Rafu Shimpo
body: A charity concert with “Stand Together for Kumamoto” as the theme was presented by Nanka Kumamoto Kenjinkai in cooperation with L.A. Kansai Club on Aug. 9 at the Moose Lodge in Torrance. A magnitude 7.1 earthquake struck Kumamoto Prefecture on July 28, killing at least 38 people, injuring more than 368, and displacing around 10,000 […]
