log_date: '2026-08-18'
summary: New developments three weeks after the Kumamoto earthquake include a ferry anchored at Yatsushiro port offering free meals, bathing, medical services, and a children's play area to evacuees. Security footage emerged showing a massive crack appearing in a rice paddy in Yatsushiro at the moment the quake struck, while the disaster also severely impacted Kumamoto's traditional tatami industry. Authorities shifted focus to preventing deaths from prolonged displacement, and Kumamoto's mascot Kumamon visited a school sheltering both students and evacuees to spread cheer.
