log_date: '2026-09-20'
summary: Fukuoka Prefecture announced a 'Kyushu Recovery Support Fukuoka Campaign' offering 50% discounts on accommodation starting September 24 to boost tourism after the earthquake. Meanwhile, athletes from Kumamoto are competing in the Asian Games Aichi-Nagoya 2026 with the goal of giving hope to their quake-hit hometown, and Kumamoto Castle has extended its illumination to all night to support those affected by the July earthquake.
