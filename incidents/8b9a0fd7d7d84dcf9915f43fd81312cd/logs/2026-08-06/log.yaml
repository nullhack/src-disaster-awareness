log_date: '2026-08-06'
summary: Nintendo has donated 50 million yen (over $340,000) to support Kumamoto earthquake relief efforts and is offering free repair services for damaged devices. Additionally, Nippon Paper's president held a news conference to express condolences over deaths at the company's quake-hit plant in Yatsushiro, where the earthquake registered a seismic intensity of up to upper 6 on the Japanese scale.
