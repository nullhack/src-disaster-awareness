title: '1 Month after Kumamoto Earthquake: Steadily Rebuild the Lives of Those Affected'
body: It has been one month since the latest Kumamoto Earthquake, which registered the maximum 7 on the Japanese seismic intensity scale. Amid sweltering heat, those affected are busy dealing with such matters as cleaning up their homes.
