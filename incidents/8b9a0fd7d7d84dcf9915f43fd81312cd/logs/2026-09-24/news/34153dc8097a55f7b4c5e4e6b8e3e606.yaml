title: 【🌷 Blooming Concert 2026 ～ Support Kumamoto! ～ @ Norris Theatre 10/25/2026 🌷】｜堀井紀子
body: 今年で20回目を迎えるチャリティーコンサート「Blooming Concert」が10月25日（日）、Norris Theatreで開催されます。 The 20th annual charity concert “Blooming Concert” will be held on Sunday, October 25 at Norris Theatre. 今年は熊本地震の復興支援を目的に開催。クラシック、フラメンコ、日本の伝統的な民謡と舞踊、ロックまで、LAで活躍する多彩な出演者が一つのステージに集まります！ This year’s concert supports Kuma
