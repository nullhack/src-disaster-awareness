title: Kumamoto quake search continues as 72-hour window passes in Japan; Shinkansen service between Hakata, Kumamoto resumes
body: 'KUMAMOTO: The Kumamoto prefectural disaster response headquarters said Friday one more death had been confirmed following Tuesday''s powerful earthquake, bringing the death toll to 35, including one whose connection to the disaster is under investigation.'
