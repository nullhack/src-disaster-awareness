title: Japan's Sony sees profit grow on demand for games, but quake damage still unclear
body: Sony reported a 32% profit growth in the fiscal first quarter, even as the Japanese entertainment company warned of a negative impact from the earthquake that hit southwestern Kumamoto earlier this week.
