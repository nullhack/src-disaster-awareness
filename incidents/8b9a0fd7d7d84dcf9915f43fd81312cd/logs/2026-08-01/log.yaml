log_date: '2026-08-01'
summary: |-
  As of July 31, the death toll from the Kumamoto earthquake has risen to 35, with one additional fatality confirmed. Shinkansen bullet train service between Hakata and Kumamoto has resumed, offering some relief for transportation. Survivors continue to endure heat and shortages, while auto and chip factories remain suspended.
  The death toll from the Kumamoto earthquake has risen to 36 as survivors endure scorching heat and thousands remain in shelters. An animal hospital in the region has opened its doors to evacuees, allowing them to stay with their pets. Meanwhile, a 10-kilometer trail of ground cracks has been confirmed along the Hinagu fault zone, the earthquake's epicenter.
