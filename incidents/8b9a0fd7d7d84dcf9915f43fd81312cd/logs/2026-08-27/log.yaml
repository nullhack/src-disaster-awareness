log_date: '2026-08-27'
summary: The Japanese government announced plans to subsidize trips to the quake-hit Kyushu region to revive tourism, as local visitor numbers remain down by 62% a month after the disaster. The Emperor and Empress are scheduled to visit Kumamoto in late September, while a drone maker that assisted in the response has seen its profile rise. Additionally, a government economic report cited the Kumamoto earthquake as a key reason for closely monitoring the impact of natural disasters.
