title: Japan to launch Kyushu travel campaign following Kumamoto earthquake losses | TTG Asia
body: The Japanese government has pledged to promote travel to Kyushu in response to the devastating losses incurred by its tourism industry following a magnitude-7.1 earthquake that struck Kumamoto Prefecture on July 28.
