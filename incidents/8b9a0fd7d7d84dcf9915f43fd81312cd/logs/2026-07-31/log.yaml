log_date: '2026-07-31'
summary: The death toll from the Kumamoto earthquake has been confirmed at 34, with rescue operations at the collapsed Aeon Mall reportedly wrapping up. Thousands of survivors are enduring sweltering heat, water and fuel shortages, and many are sleeping in cars. The quake has also disrupted auto and chip supply chains, while Taiwan has pledged NT$5 million for relief efforts.
