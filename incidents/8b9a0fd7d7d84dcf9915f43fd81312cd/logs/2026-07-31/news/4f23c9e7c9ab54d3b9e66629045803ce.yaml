title: Rescue wrapping up in southwestern Japan as quake death toll climbs to 34
body: The death toll climbed to 34 from a powerful magnitude 7.1 earthquake that hit Japan’s southern main island of Kyushu on Tuesday, setting off an explosion at a mall, toppling a factory chimney and flattening homes, the Kumamoto prefectural government said Friday.
