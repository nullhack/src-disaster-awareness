title: Hope for rescue in southwestern Japan quake dwindles as death toll climbs to 25
body: Time was running out to find survivors as rescuers continued to work in the Kumamoto area on Japan’s southern main island of Kyushu, where the magnitude-7.1 earthquake hit Tuesday.
