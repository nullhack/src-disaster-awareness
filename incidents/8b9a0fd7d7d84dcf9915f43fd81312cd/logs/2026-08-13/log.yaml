log_date: '2026-08-13'
summary: 'New details emerged two weeks after the quake: Kumamoto Castle reopened after safety checks, and Aeon is considering compensation after confirming seven employees died in the mall gas explosion—two of whom were directed by their company to re-enter the building to retrieve cash. Agricultural damage in Kumamoto Prefecture has been estimated at $119 million, and foreign nationals in the region have faced language barriers and struggled to access relief information.'
