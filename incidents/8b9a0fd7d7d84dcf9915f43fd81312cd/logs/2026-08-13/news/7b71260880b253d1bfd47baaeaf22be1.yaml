title: 2 killed in blast were told to return to mall | Honolulu Star-Advertiser
body: TOKYO >> Two store employees who died in the explosion July 28 at the Aeon Mall Kumamoto shopping complex were directed by the store’s company to go back inside the mall after the earthquake to move its cash into a safe.
