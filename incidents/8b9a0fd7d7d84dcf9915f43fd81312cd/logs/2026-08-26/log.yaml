log_date: '2026-08-26'
summary: The Japanese Red Cross has expressed concern that evacuees' health may deteriorate due to prolonged stays in shelters or vehicles. Additionally, a volunteer network launched after the 2024 Noto earthquake is providing free laundry services to Kumamoto evacuees through local businesses. In other recovery news, fans of the Touken Ranbu game rushed to buy sake from a quake-hit brewery after the owner's lament about unsold stock went viral.
