title: A woman with apparent heat stroke found dead while taking shelter in a car in quake-hit Japan
body: Officials say the latest victim from a powerful earthquake that struck Japan’s southwestern prefecture of Kumamoto last week is an elderly woman who apparently developed heat stroke while taking shelter in a car. The fatality came as concerns of heat-related illness grow in the area that is also suffering extreme temperatures. The magnitude 7.1 quake hit Kumamoto on Japan’s southern main island of Kyushu on Tuesday. The death toll is now 36. Authorities have ended a massive search-and-rescue operation at a collapsed shopping mall in southwest Japan after retrieving five people and the bodies of seven others over the past five days.
