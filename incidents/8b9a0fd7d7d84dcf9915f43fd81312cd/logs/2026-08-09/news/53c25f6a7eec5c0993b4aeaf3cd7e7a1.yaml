title: Prime minister visits quake-hit southern Japan as cleanup begins in intense heat
body: Residents of Japan’s quake-hit southwestern prefecture of Kumamoto are working to clear their homes in intense heat, as Prime Minister Sanae Takaichi briefly visited Kumamoto Prefecture on Monday for the first time since a magnitude 7.1 quake hit Japan’s southern main island of Kyushu last Tuesday
