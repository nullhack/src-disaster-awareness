title: A moderate earthquake shakes Japan, injuring more than 30 people in the Tokyo region
body: TOKYO (AP) — A moderate earthquake rattled eastern Japan, including the Tokyo area, early Sunday, injuring more than 30 people, most of them lightly, officials said. There was no danger of a tsunami. According to the Japan Meteorological Agency, the quake had a preliminary magnitude of 5.9 and its epicenter was in the southern Ibaraki […]
