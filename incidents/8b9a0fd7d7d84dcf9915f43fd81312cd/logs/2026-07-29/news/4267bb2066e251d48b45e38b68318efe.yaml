title: Japan earthquake rocks auto and chip manufacturing supply chain in Kyushu
body: Japan's auto and chip manufacturers halted production on Wednesday at plants on the island of Kyushu struck by a deadly earthquake that disrupted operations in a region key to the supply chains of both industries.
