title: Rescuers search for the missing after Japan earthquake as death toll rises to 13
body: Japanese Prime Minister Sanae Takaichi said 13 people have been found dead after a powerful quake shook part of southwestern Japan. The magnitude 7.1 earthquake struck the Kumamoto area on the southern main island of Kyushu late Tuesday afternoon. Takaichi said Wednesday morning that many other people were injured or still missing as rescue work continued. Japan’s Self Defense Forces joined rescue workers in the search and rescue operations at a badly damaged shopping mall and were delivering water, food and other necessities to the hard-hit areas.
