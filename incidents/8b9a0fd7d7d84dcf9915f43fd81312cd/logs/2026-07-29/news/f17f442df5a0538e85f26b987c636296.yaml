title: 'World in brief: July 29, 2026'
body: 'JAPAN: Soldiers and emergency workers combed through a badly damaged shopping mall and collapsed houses looking for trapped survivors today after a powerful earthquake that killed at least 18 people in south-west Japan.The magnitude 7.1 earthquake that hit a day earlier in the Kumamoto area on the southern main island of Kyushu, also left at least 62 people injured, six of them seriously, the prefectural government said.The tally has been steadily growing, fanning fears it may continue to rise.'
