title: Magnitude 7.1 earthquake strikes southwestern Japan, killing at least 13
body: Video filmed on July 28, 2026 shows damage after a magnitude 7.1 earthquake struck Kumamoto Prefecture, Japan. At least 13 people have been killed, dozens more were injured, and rescue crews continue searching for people trapped following building collapses and an explosion at a shopping mall in Kashima.
