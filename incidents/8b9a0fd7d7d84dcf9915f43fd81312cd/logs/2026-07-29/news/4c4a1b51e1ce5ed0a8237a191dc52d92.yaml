title: Southern Japan rocked by major earthquake, people trapped in mall - BusinessWorld Online
body: TOKYO — A 7.1-magnitude earthquake hit Japan’s southern Kumamoto prefecture on Tuesday, knocking out power to thousands of homes, rupturing roads and injuring at least 50 people, including some trapped inside a partially collapsed shopping mall. Speaking to reporters at her office in Tokyo, Japanese Prime Minister Sanae Takaichi said the number of casualties and […]
