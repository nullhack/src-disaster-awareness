title: Security footage in Japan captures moment rice paddy cracks during Kumamoto earthquake
body: 'KUMAMOTO: A security camera captured the moment a huge crack appeared in a rice paddy in Yatsushiro, Kumamoto prefecture, when the massive Kumamoto earthquake struck on July 28.'
