title: Magnitude 6.8 earthquake traps shoppers as mall collapses in Japan — here's why the seismic event was unusual
body: A strong inland earthquake in southwestern Japan trapped people inside a shopping center and damaged infrastructure. Here's what made this quake unusual and why aftershocks remain a concern.
