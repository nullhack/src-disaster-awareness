title: Earthquake leaves 10km trail of ground cracks along Kumamoto's Hinagu fault zone
body: 'KUMAMOTO: Numerous cracks stretching more than 10km along the Hinagu fault zone, the epicentre of Tuesday''s massive earthquake that struck Kumamoto Prefecture, have been confirmed by The Yomiuri Shimbun.'
