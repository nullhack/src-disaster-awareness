title: Japan’s Kumamoto Castle Extends Illumination Times to All Night to Bring Hope to Those Affected by 2026 Earthquake
body: KUMAMOTO — Kumamoto Castle is being illuminated overnight to give hope to those affected by a massive earthquake that struck Kumamoto Prefecture in July.
