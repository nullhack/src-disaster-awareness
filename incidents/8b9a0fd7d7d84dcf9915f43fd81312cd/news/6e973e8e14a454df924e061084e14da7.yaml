title: Death toll rises to 18 as rescuers comb through quake rubble in southwestern Japan
body: Soldiers and emergency workers combed through a badly damaged shopping mall and collapsed houses looking for trapped survivors Wednesday after a powerful earthquake that killed at least 18 people, including a foreigner, in southwestern Japan.
