title: Fault zone in Kumamoto responsible for a 2016 quake likely triggered latest temblor
body: The Hinagu and Futagawa fault zones caused the two major earthquakes 10 years ago, with the former likely to have caused Tuesday’s 7.1 magnitude temblor.
