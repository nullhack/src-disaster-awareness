title: All Kyushu Shinkansen sections reopened after July Kumamoto quake
body: YATSUSHIRO, KUMAMOTO PREF. -- A section on the Kyushu Shinkansen bullet train line that had been halted due to the impact of a major earthquake in Kumamoto Prefecture in late July returned to service on Friday.
