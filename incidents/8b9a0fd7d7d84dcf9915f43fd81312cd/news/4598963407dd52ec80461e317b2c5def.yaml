title: Destroyed Aeon mall had just reopened for 'fresh start' a decade on from deadly quake
body: By Satoshi Sugiyama, Chang-Ran Kim and Kentaro Okasaka TOKYO, July 28 (Reuters) - The Aeon mall destroyed in a post-quake explosion in southern Japan on Tuesday had just reopened last month as a new and improved shopping and entertainment complex to commemorate its recovery from a deadly tremor a decade ago.
