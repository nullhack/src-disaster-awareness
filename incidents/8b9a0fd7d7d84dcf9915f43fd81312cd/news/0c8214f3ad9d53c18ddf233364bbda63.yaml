title: Magnitude 7.1 earthquake shakes part of southern Japan but no tsunami detected
body: An earthquake registering a magnitude of 7.1 shook Kumamoto on Japan's southern main island of Kyushu late Tuesday afternoon and a tsunami advisory was temporarily issued, the Japan Meteorological Agency said.
