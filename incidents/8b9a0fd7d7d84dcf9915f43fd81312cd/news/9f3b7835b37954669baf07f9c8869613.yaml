title: 'An earthquake of maximum strength occurred in Japan — many dead, dozens injured: EADaily'
body: EADaily, July 28th, 2026. Powerful tremors were recorded on Kyushu Island in southwestern Japan today, July 28, at 16.27 (10.27 Moscow time). Their strength reached the maximum seventh level on the Japanese seismic intensity scale.
