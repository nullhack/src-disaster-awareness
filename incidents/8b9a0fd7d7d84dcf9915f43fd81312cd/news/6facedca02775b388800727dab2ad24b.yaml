title: Man arrested for allegedly assaulting insurance firm employee after Kumamoto quake damage claim dispute
body: Police in Yatsushiro, Kumamoto Prefecture, have arrested a 34-year-old man on suspicion of assaulting a 50-year-old insurance company employee who had visited his home — damaged in the July earthquake — to conduct an insurance assessment. According to police, the incident occurred at around 10:40 a.m. on Wednesday, Sankei Shimbun…
