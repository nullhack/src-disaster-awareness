title: '''I Was Deeply Moved'': Surgeons Shield Patient As Powerful Quake Shakes Operating Room In Japan''s Kumamoto Hospital - WATCH'
body: Security footage from Kumamoto Comprehensive Hospital captured surgeons and nurses calmly continuing four operations during the powerful July 28, 2026, earthquake in Japan. Despite violent shaking, all surgeries were completed successfully without injuries. The viral video has drawn global praise, with many calling it a remarkable display of unwavering commitment to patient care
