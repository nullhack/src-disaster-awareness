title: Quake survivors in southwestern Japan sleep in cars in sweltering heat as death toll rises to 34
body: YATSUSHIRO, Japan - Thousands of survivors of a powerful earthquake in southwestern Japan spent Friday (July 31) in crowded shelters or sleeping in cars as they faced shortages of water and fuel and punishing summer temperatures that stoked fears of heat-related illness.The death toll rose to 34, the Kumamoto prefectural government said, as rescuers raced to find those still missing...
