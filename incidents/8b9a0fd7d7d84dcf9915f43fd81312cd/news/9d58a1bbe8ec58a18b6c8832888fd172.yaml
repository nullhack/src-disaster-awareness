title: Woman dies while sheltered in car | Arkansas Democrat Gazette
body: TOKYO -- An elderly woman who developed heat stroke while taking shelter in a car is the latest fatality from a powerful earthquake that struck Japan's southwestern prefecture of Kumamoto last week, officials said Sunday as concerns over heat-related illnesses grow in an area that is also suffering extreme temperatures.
