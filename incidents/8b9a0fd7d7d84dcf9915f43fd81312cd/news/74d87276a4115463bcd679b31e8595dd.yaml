title: Quake survivors in southwestern Japan sleep in cars in sweltering heat as death toll rises to 34
body: Thousands of survivors of a powerful earthquake in southwestern Japan have spent Friday in crowded shelters or sleeping in cars as they face shortages of water and fuel and punishing summer temperatures that have stoked fears of heat-related illness
