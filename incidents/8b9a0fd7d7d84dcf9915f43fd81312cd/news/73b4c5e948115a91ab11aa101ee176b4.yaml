title: A moderate earthquake shakes Japan, injuring more than 30 people in the Tokyo region - WTOP News
body: TOKYO (AP) — A moderate earthquake rattled eastern Japan, including the Tokyo area, early Sunday, injuring more than 30 people, most of them lightly, officials said. There was no danger of a tsunami.
