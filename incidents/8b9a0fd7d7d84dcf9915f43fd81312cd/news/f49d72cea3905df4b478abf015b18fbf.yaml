title: Quake-hit Kumamoto to offer travel discounts
body: Kumamoto Prefecture will launch a travel discount campaign on Tuesday to stimulate tourism demand following a powerful earthquake that struck the southwestern Japan prefecture in July, Governor Takashi Kimura said Friday.
