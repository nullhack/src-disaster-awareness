title: Aerial video shows extensive damage two days after earthquake hit southern Japan
body: Rural communities in southwestern Japan were struggling to get their lives back to normal Thursday, two days after a powerful earthquake set off an explosion at a mall, toppled a factory chimney and flattened homes, killing at least 23 people.
