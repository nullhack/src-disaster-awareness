title: जापानको कुमामोतोमा भूकम्पपछि ७१ हजारभन्दा बढी घरमा क्षति
body: दक्षिणपश्चिमी जापानको कुमामोतो प्रिफेक्चरमा जुलाई २८ मा गएको शक्तिशाली भूकम्पको दुई महिनापछि पनि एक हजार ५०० भन्दा बढी मानिस आश्रयस्थलमा बसिरहेका स्थानीय सञ्चारमाध्यमले सोमबार जनाएका छन् ।
