title: Mitsubishi Electric to Aid Victims of Earthquake in Kumamoto Through In-house Donation Program
body: 'TOKYO, September 08, 2026--Mitsubishi Electric Corporation (TOKYO: 6503) announced today that the Mitsubishi Electric Group will donate a cumulative 44.16 million yen through an in-house matching-gift program — the Mitsubishi Electric SOCIO-ROOTS Fund — to aid people affected by the earthquake that struck Kumamoto, Japan recently.'
