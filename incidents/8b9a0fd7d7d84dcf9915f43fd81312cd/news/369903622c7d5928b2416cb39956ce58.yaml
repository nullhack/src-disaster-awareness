title: Japan ends rescue operation at a mall that collapsed after strong quake
body: TOKYO - Authorities ended a massive days long search-and-rescue operation Saturday (Aug 1) at a collapsed shopping mall in southwest Japan following a powerful earthquake that killed 34 people earlier this week.The magnitude 7.1 earthquake hit Kumamoto Prefecture on Japan's southern main island of Kyushu on Tuesday. The Aeon Mall, in the town of Kashima, was one of the hardest-hit...
