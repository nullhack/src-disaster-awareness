title: Over 1,500 still in shelters 2 months after Kumamoto quake
body: KUMAMOTO -- More than 1,500 people are still staying in evacuation centers two months after the July 28 earthquake in Kumamoto Prefecture, southwestern Japan, that killed 38 people including those who died from suspected indirect causes.
