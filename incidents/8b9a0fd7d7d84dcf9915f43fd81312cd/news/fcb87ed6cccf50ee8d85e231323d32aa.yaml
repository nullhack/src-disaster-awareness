title: Heat stroke claims quake survivor
body: An elderly woman who developed heat stroke while taking shelter in a car is the latest fatality from a powerful earthquake that struck the southwestern prefecture of Kumamoto last week, officials said as concerns over heat-related illnesses grow in an area that is also suffering extreme temperatures.
