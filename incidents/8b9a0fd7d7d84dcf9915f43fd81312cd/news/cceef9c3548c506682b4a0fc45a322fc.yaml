title: A woman with apparent heat stroke found dead while taking shelter in a car in quake-hit Japan
body: Officials say the latest victim from a powerful earthquake that struck Japan’s southwestern prefecture of Kumamoto last week is an elderly woman who apparently developed heat stroke while taking shelter in a car.
