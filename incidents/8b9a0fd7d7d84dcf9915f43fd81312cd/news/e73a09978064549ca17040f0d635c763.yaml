title: Σεισμός 5,9 Ρίχτερ στην Ιαπωνία – Αισθητός στο Τόκιο και την ευρύτερη περιοχή Κάντο (vids) | Liberal.gr
body: Σεισμός μεγέθους 5,9 βαθμών σημειώθηκε τα ξημερώματα της Κυριακής (τοπική ώρα) στην ανατολική Ιαπωνία, προκαλώντας ισχυρή δόνηση στο Τόκιο και στην ευρύτερη περιοχή Κάντο, χωρίς να εκδοθεί προειδοποίηση για τσουνάμι.
