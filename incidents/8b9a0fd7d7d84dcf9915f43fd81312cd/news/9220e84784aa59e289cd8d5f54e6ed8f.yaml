title: '7.1 magnitude quake leads to casualties, fires in Kumamoto | The Asahi Shimbun: Breaking News, Japan News and Analysis'
body: A major earthquake that registered a maximum seismic intensity of 7 rocked Kumamoto Prefecture at 4:27 p.m. on July 28, causing casualties, damaging or destroying infrastructure and disrupting transportation.
