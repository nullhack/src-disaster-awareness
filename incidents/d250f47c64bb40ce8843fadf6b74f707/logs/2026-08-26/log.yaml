log_date: '2026-08-26'
summary: Six million people in Somalia are now facing acute hunger, with nearly two million children at emergency levels, as severe drought and conflict worsen amidst falling humanitarian funding. In Kenya, drought has pushed food prices up, with maize rising 3.3% and beans 2.4-2.9% in July, while UNICEF reports a 32% jump in children treated for severe malnutrition in Somalia following aid cuts.
