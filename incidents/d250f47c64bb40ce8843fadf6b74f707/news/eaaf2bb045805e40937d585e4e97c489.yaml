title: Drought bites farmers, pushes food prices up
body: According to the Alliance for Green Revolution in Africa (AGRA) July Food Security Monitor, maize prices in Kenya rose by 3.3 per cent in July, while bean prices increased by between 2.4 and 2.9 per cent as domestic supplies tightened. Rice prices also edged up by 0.3 per cent.
