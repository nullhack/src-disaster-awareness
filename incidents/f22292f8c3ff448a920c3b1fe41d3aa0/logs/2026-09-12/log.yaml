log_date: '2026-09-12'
summary: |-
  Russia killed two people in Kyiv using jet-powered drones, prompting President Zelensky to urge the US to impose sanctions immediately. The US Senate passed its Russia sanctions bill, which now heads to the House for a vote, while the International Energy Agency further cut its Russian oil output forecasts due to Ukraine's ongoing attacks on refineries. Additionally, Russian forces advanced on Izium, raising fears of large-scale destruction, and Europe struggles to counter hybrid Russian attacks falling short of full war.
  Russian strikes on Ukrainian ports and across multiple regions killed at least 11 civilians, with Putin warning Europe against sending troops to Ukraine. Ukrainian drone operators embedded with US forces in Germany to teach advanced drone warfare tactics, and Anthropic reported that Russian developers used AI to create autonomous kamikaze drone software. Ukraine is also expanding its conflict with Russia into Africa, deploying drone teams to operate in desert conditions.
