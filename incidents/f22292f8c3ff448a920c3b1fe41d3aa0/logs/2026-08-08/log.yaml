log_date: '2026-08-08'
summary: Russia launched a major strike on Naftogaz production assets, knocking out seven Ukrnafta facilities, and dropped a record number of glide bombs on Ukraine. A Russian strike hit a football stadium hours before a major match, while US intelligence assesses Putin could launch an attack aimed at testing NATO unity. Ukraine's July 2026 air defense statistics showed it stopped 87% of drones but only 15% of ballistic missiles as Patriot interceptor supplies ran out, and continued attacks on Russia's Wildberries online marketplace are deeply affecting small businesses like Vasily Klimov's Moscow pickup point.
