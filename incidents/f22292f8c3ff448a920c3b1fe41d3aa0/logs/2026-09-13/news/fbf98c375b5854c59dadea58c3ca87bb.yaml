title: Ukraine's army is turning Humvees into remote-controlled vehicles connected by Starlink
body: Ukraine is bolting on a kit called 'Kaban' onto its US-supplied Humvees, turning them into Starlink-controlled ground robots, with three already being deployed with frontline units.
