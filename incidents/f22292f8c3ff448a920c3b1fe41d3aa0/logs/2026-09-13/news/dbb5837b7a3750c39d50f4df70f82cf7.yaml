title: 'Ushakov called the issue, the solution of which will simplify the settlement of the conflict on Ukraine: EADaily'
body: EADaily, September 13th, 2026. Progress in resolving the territorial issue will simplify the coordination of other points in reaching agreements within the framework of the settlement of the conflict on Ukraine. This was stated by Presidential aide Yuri Ushakov.
