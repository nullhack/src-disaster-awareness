log_date: '2026-09-13'
summary: Ukraine is converting US-supplied Humvees into remote-controlled ground vehicles using Starlink, with three already deployed. Kyiv is preparing for peace talks to resume in October, while a budget crisis threatens to halt soldiers' salaries and social payments by that month. The Bishop of Kharkiv met the Pope to discuss ending the war, and Ukrainian drone operators embedded with US forces in Germany to share advanced drone tactics.
