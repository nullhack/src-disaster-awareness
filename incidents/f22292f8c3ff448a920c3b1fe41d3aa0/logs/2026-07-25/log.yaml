log_date: '2026-07-25'
summary: |-
  Ukraine's large drones are now dropping mine-carrying ground robots behind Russian lines, marking a new battlefield experiment. Russia, stretched by Ukrainian drone strikes on its Black Sea Fleet, has withdrawn all warships from the Mediterranean Sea. Ukrainian strikes continued hitting Wildberries warehouses, while a Trump aide stated Putin is losing 5,000 troops per week.
  On July 24, 2026, Russia launched a ballistic missile strike on Kyiv that killed at least 10 people, targeting a drone exhibition. Meanwhile, Ukraine has secured a billion-dollar European deal to massively increase drone production, aiming to dominate modern drone warfare after battlefield successes. China formally protested the European Union's latest sanctions on 14 Chinese companies for their alleged links to Russia.
  At least 11 people were killed in Ukraine as Russia launched its largest aerial attack of the war with 948 drones, while Ukrainian strikes hit Russian Wildberries warehouses again. President Trump and President Zelenskyy are reportedly set to meet in Washington next week to discuss the conflict.
  Ukrainian strikes continued targeting Russia's Wildberries online marketplace, while fresh Russian and Ukrainian attacks killed at least 14 civilians in Zaporizhzhia and Sumy, with Romania downing a drone near its border. Kazakhstan's president called alongside Putin for a freeze of the war, and President Zelenskiy reported that Russia is planning to bring in 30,000 North Korean troops.
