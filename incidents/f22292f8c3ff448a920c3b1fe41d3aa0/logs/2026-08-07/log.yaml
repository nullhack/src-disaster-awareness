log_date: '2026-08-07'
summary: Ukraine struck another Wildberries warehouse, with satellite imagery confirming at least 1.18 million square metres of storage space destroyed in cumulative attacks. Kyiv also hit the Slavneft-Yanos oil refinery in Yaroslavl, one of Russia’s largest refineries, in a long-range drone strike. Meanwhile, intensifying attacks on Black Sea ports and shipping are raising fears of renewed global food shortages, with CBOT wheat prices rising.
