log_date: '2026-09-21'
summary: On September 20-21, 2026, Ukraine launched its largest-ever drone attack on Moscow, striking the Kapotnya oil refinery and Sofyino logistics complex, killing at least four people and causing fires. President Zelensky confirmed the strikes, while President Trump reportedly urged him to stop hitting Russian refineries, and Russia's ruling party appeared set to win parliamentary elections held under the attack. Additionally, a report warned Ukraine could lose up to 6.8% of GDP in 2027 if the war continues.
