title: 'Hunger in Oleshky: About 2,000 people cut off from supplies since may in Russian-occupied city'
body: Hunger is spreading in Russian-occupied Oleshky in Kherson Oblast, where food deliveries have been blocked since May 26, roads are mined and evacuation is nearly impossible, Polish-Ukrainian outlet Sestry reported on Sept. 21.
