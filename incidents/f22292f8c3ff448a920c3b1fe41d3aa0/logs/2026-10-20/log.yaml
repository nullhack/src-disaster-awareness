log_date: '2026-10-20'
summary: Ukraine launched a massive drone attack involving over 1,000 drones, setting an oil export terminal ablaze in St. Petersburg, as both countries exchanged strikes. President Trump implemented a 60-day pause to assess a negotiated settlement strategy, while the U.S. also granted temporary deportation reprieve to more than 100,000 Ukrainians. Separately, Ukrainian intelligence reportedly killed a suspect in the 2017 assassination of a spy general.
