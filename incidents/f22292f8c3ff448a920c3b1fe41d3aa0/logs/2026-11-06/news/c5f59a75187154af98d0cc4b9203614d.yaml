title: Jerusalem Patriarch Theophilos Offers to Mediate Russia-Ukraine War Greek City Times
body: Patriarch Theophilos III of Jerusalem has reiterated his willingness to help mediate an end to the Russia-Ukraine war following a Kremlin meeting with Russian President Vladimir Putin, who awarded him the Order of Friendship.
