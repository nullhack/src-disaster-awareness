title: Crude Oil Prices Rebound as Ukraine Attacks Russian Refineries
body: December WTI crude oil (CLZ26 ) is up +1.98 (+2.25%) today, and December RBOB gasoline (RBZ26 ) is up +0.0181 (+0.66%). Crude oil and gasoline prices recovered from overnight losses and are moving higher today as short covering emerged after fresh attacks by Ukraine on Russian oil refiners, which could...
