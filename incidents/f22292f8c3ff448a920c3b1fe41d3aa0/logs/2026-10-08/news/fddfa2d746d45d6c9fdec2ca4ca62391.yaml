title: Strike on Ukrainian public buses leaves 30 dead as blackouts worsen in Kyiv
body: A powerful Russian guided bomb explosion has killed 30 people and wounded at least 18 in eastern Ukraine, according to authorities. The attack happened near public buses in Kramatorsk, Donetsk region, on Thursday. Public transport was suspended in the area. Oleksandr Honcharenko, head of the city's military administration, accused Russia of targeting civilians. The attack follows deadly missile strikes in Pryluky, where 22 people died the previous day. Ukrainian President Volodymyr Zelenskyy has appealed for more defense support from NATO countries. Kyiv faces worsening power outages, and officials are urging families to prepare for expected winter blackouts.
