title: What happened on the day of October 8th. The main thing
body: In the morning, a Ukrainian drone attacked the Yandex data center in Sasovo, Ryazan region. As a result of the impact, a fire broke out at the facility, and the work of the center was completely stopped. Later, the company reported that they could not yet confirm the possibility of repairing the damaged equipment.
