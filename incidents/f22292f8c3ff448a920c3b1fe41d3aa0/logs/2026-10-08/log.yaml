log_date: '2026-10-08'
summary: |-
  A Russian missile struck a residential building in Pryluky, northern Ukraine, killing at least 28 people. Ukraine's food exports fell 22.5% in August compared to the previous year, reflecting deepening economic strain from the war.
  On October 8, a Russian guided bomb strike on public buses in Kramatorsk killed at least 30 civilians, one of the deadliest attacks in weeks. Ukraine struck a Yandex data center in Russia's Ryazan region with a drone, igniting a fire and halting operations. Meanwhile, US Secretary of State Marco Rubio described the war as a dangerous stalemate with no negotiated solution, as Turkey warned against the Black Sea becoming a new front.
