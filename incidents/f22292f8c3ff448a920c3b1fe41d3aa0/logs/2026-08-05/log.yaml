log_date: '2026-08-05'
summary: |-
  On August 4, 2026, a Ukrainian drone strike on warehouses in the Moscow region killed five people, continuing intensified attacks on Russian commercial infrastructure. Russia signaled openness to negotiations if the West adopts a constructive approach, while Turkiye warned that recent drone strikes on two civilian ships in the Black Sea endanger navigation and food supplies.
  Russian missile and drone strikes on Kyiv and its region killed 17 people and wounded 44, with Ukraine stating it failed to intercept any of the incoming missiles due to a threefold drop in Western interceptor supplies. Meanwhile, a Ukrainian drone strike on an industrial area outside Moscow killed five people, and President Putin named Denis Lyamin to head Russia's newly formed Unmanned Systems Forces.
