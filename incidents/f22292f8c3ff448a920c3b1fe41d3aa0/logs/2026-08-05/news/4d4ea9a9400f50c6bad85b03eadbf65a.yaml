title: Russian barrage in Ukraine's capital region kills 17 as air defenses fall short
body: Ukraine’s President Volodymyr Zelenskyy says Russian missile and drone strikes on Kyiv and its region have killed 17 people and wounded 44 others. The attacks are part of a series of large-scale strikes exploiting Ukraine's shortage of interceptor missiles. Zelenskyy has urged other countries to send more ammunition to bolster its depleted air defenses. Meanwhile, Ukraine has increased its drone attacks on key Russian targets to pressure President Vladimir Putin into negotiations. The Russian Defense Ministry claims its strikes targeted war-related sites, while Ukraine says civilian areas were hit. The ongoing conflict has intensified, affecting both military and civilian infrastructure.
