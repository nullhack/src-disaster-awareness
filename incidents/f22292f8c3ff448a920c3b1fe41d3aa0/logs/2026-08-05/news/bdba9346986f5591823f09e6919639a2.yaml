title: Turkiye warns over Black Sea ship attacks - Pakistan Today
body: Turkiye says two civilian ships were struck by drones in the Black Sea after leaving Novorossiysk, wounding several crew members. Ankara warned the rising conflict is endangering navigation and could disrupt food supplies.
