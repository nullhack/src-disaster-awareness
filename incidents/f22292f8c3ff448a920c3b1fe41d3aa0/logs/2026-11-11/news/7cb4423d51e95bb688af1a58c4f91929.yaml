title: Russia and Ukraine agree to a prisoner exchange as talks end with no big breakthrough
body: Russia and Ukraine have agreed to a large exchange of prisoners of war. U.S.-mediated talks in Abu Dhabi led to this decision, marking the biggest humanitarian release since the war began in 2022.
