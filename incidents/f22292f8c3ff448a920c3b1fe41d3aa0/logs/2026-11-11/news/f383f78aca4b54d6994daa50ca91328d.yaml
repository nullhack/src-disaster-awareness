title: 'The cost of conflict: Food supply chains under pressure'
body: Wars around the world, including those in Ukraine, Sudan and Iran, have had a significant impact on food production. Imports and exports of key agricultural products like fertiliser are being restricted, and regionally concentrated ingredients like saffron and acacia gum are coming under fire. How can the food industry protect itself?
