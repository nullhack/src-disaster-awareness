title: Trump envoys to meet Putin in Moscow after latest Ukraine talks end with no breakthrough | CNN Politics
body: President Donald Trump’s son-in-law Jared Kushner said Wednesday he and Middle East envoy Steve Witkoff would travel to Moscow after talks in Abu Dhabi to end the Ukraine war concluded with no clear breakthrough.
