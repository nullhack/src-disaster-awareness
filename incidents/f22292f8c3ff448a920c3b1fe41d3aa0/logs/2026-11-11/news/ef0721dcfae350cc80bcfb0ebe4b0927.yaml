title: Europe ready to discuss conflict-prevention mechanisms with Russia, including limits on missile deployments, FT reports — Meduza
body: European countries are ready to talk with Russia about reviving mechanisms for preventing military conflict that were frozen during the Cold War, European diplomats told the Financial Times.
