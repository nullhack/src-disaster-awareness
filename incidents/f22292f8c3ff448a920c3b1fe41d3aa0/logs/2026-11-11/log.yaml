log_date: '2026-11-11'
summary: |-
  Russia, Ukraine, and the United States held their first peace talks in nine months in Abu Dhabi on November 10, with U.S. Secretary of State Marco Rubio calling the four-hour session 'very productive' and indicating it will resume the following day. A leaked Russian statistics agency report revealed 392,700 Russian military personnel have died in the war. Meanwhile, Europe expressed readiness to discuss conflict-prevention mechanisms including missile deployment limits, and India engaged with both sides on Black Sea shipping safety and grain exports.
  The Abu Dhabi peace talks ended with Russia and Ukraine agreeing to a large prisoner exchange but no major breakthrough. Ukrainian officials said the initial sessions were constructive, with some suggesting a deal could be reached by year-end. Trump envoys plan to meet Putin in Moscow, and India has put forward a three-point de‑escalation plan.
