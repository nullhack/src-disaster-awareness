title: Russia suffers over 300,000 military losses in Ukraine since start of 2026, General Staff says
body: The General Staff said nearly 300,000 losses were roughly equivalent to the personnel strength of 150 motorized rifle regiments, based on an estimated 2,000 troops per regiment.
