log_date: '2026-09-14'
summary: Putin, speaking at the BRICS summit, warned Europe against deeper involvement in Ukraine and urged member states to challenge the US dollar’s dominance. Meanwhile, President Trump publicly urged Ukraine to halt strikes on Russian refineries, a request that could undercut Kyiv’s strategy to pressure Moscow’s economy. Separately, Russia accused Ukraine of attacking fuel trucks near the Zaporizhzhia nuclear plant, endangering the facility, while Polish PM Tusk cautioned about the risk of the conflict spreading to Poland.
