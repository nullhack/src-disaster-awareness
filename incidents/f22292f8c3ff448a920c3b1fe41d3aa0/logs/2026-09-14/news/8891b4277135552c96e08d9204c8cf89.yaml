title: Ukraine asked to stop attacks | Arkansas Democrat Gazette
body: KYIV, Ukraine -- U.S. President Donald Trump on Sunday called on Ukrainian President Volodymyr Zelenskyy to halt strikes on Russian oil refineries and other infrastructure used to produce and distribute diesel, saying the attacks are causing a global shortage. He spoke after diesel prices in the U.S. hit a record on Friday, soaring past $6 a gallon on average.
