title: The United States can help with the reconstruction of Ukraine after the settlement of the conflict
body: In the event of a successful settlement of the Ukrainian conflict, the United States can help rebuild the country. This was announced by a TASS source on September 14."Such an option seems logical in the current situation," the source said.
