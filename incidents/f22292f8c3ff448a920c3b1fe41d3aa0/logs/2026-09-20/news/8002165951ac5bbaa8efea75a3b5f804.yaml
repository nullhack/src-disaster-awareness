title: Russian airstrikes kill 8 civilians | Arkansas Democrat Gazette
body: KYIV, Ukraine -- Russian strikes killed eight civilians and wounded dozens of other people in Ukraine, local officials said Saturday, after Russian President Vladimir Putin warned that sending European troops into Ukraine would amount to direct conflict with Russia.
