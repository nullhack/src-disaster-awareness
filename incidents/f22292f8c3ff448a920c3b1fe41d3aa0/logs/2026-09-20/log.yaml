log_date: '2026-09-20'
summary: President Trump signed the Lindsey O. Graham Sanctioning Russia and Iran Act into law, imposing new sanctions on Russia. Turkey sent a draft memorandum to Ukraine and Russia proposing a ceasefire to protect civilian shipping in the Black Sea. Ukraine received a €3.3 billion EU tranche for missiles and drones, and the US State Department approved a potential $2.6 billion air defense equipment sale, while Russia's parliamentary elections continued amid cyber attack claims and Russian airstrikes killed eight civilians in Ukraine.
