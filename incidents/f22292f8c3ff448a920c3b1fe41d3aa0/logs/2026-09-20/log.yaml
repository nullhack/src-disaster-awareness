log_date: '2026-09-20'
summary: |-
  President Trump signed the Lindsey O. Graham Sanctioning Russia and Iran Act into law, imposing new sanctions on Russia. Turkey sent a draft memorandum to Ukraine and Russia proposing a ceasefire to protect civilian shipping in the Black Sea. Ukraine received a €3.3 billion EU tranche for missiles and drones, and the US State Department approved a potential $2.6 billion air defense equipment sale, while Russia's parliamentary elections continued amid cyber attack claims and Russian airstrikes killed eight civilians in Ukraine.
  On September 20, Ukraine launched its largest-ever drone attack on Moscow, striking the capital's biggest oil refinery and killing at least three people, as Russia held the final day of its wartime parliamentary elections. President Trump separately blamed Ukraine for high oil prices and urged Kyiv to stop bombing Russian oil refineries.
