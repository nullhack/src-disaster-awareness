log_date: '2026-09-05'
summary: |-
  Trump envoys Steve Witkoff and Jared Kushner are set to visit Moscow and Kyiv with a proposal to end the war, as diplomatic efforts intensify. A Russian drone struck Ukraine's Security Service (SBU) headquarters in Kyiv, while a WHO warehouse storing medical supplies was damaged in an overnight airstrike. Putin's approval rating slipped amid growing war fatigue in Russia, and India is in touch with both sides seeking ideas to help end the conflict.
  U.S. envoys Steve Witkoff and Jared Kushner arrived in Moscow on September 5 for peace talks, with reports that Putin ordered a three-day halt to strikes on Kyiv during their visit. Meanwhile, Russia launched a missile strike on Kamianske that killed 5 and injured 5, and a drone hit a high-rise in Boryspil causing damage but no casualties.
