log_date: '2026-09-05'
summary: Trump envoys Steve Witkoff and Jared Kushner are set to visit Moscow and Kyiv with a proposal to end the war, as diplomatic efforts intensify. A Russian drone struck Ukraine's Security Service (SBU) headquarters in Kyiv, while a WHO warehouse storing medical supplies was damaged in an overnight airstrike. Putin's approval rating slipped amid growing war fatigue in Russia, and India is in touch with both sides seeking ideas to help end the conflict.
