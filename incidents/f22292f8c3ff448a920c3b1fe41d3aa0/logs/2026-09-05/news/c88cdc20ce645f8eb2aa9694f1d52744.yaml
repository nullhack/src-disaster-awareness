title: 'Repeated attacks on humanitarian warehouses put vital medical aid at risk in Ukraine: WHO'
body: A new airstrike overnight damaged one of the main warehouses used by the World Health Organization (WHO) in Ukraine to store humanitarian medical supplies in the Kyiv region, the UN agency said on Friday.
