title: 'Explainer: What''s behind the standoff between Ukraine''s two intelligence agencies?'
body: 'The violent standoff between Ukraine''s Security Service (SBU) and the military intelligence agency (HUR) on Sept. 2 exposed two dysfunctions of Ukraine''s law enforcement and security system. One is the long-running conflict between the two intelligence agencies: although competition among secret services is common worldwide, shootouts that result in injuries are far more troubling than a routine institutional rivalry. The conflicts between Ukraine''s two security agencies "have gotten out of co'
