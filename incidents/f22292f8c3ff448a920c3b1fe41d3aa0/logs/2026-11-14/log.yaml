log_date: '2026-11-14'
summary: |-
  Ukraine launched a massive drone attack of nearly 1,200 drones at Russia, while Russia revived demands for NATO retrenchment in peace talks. President Zelensky admitted that authorities had hidden the true extent of power outages from him, and the International Ice Hockey Federation launched an investigation into Russia's inclusion of teams from occupied Ukrainian territories in its tournaments.
  The European Union secured a formal seat in future Ukraine-Russia peace talks after leaders agreed on representation, with President Zelensky confirming the EU will participate directly. Meanwhile, the White House confirmed a trilateral summit between Trump, Xi, and Putin in China to discuss the conflict and nuclear arms control. Ukraine's continued drone strikes on Russian refineries are deepening Moscow's fuel crisis, which could become its worst yet.
