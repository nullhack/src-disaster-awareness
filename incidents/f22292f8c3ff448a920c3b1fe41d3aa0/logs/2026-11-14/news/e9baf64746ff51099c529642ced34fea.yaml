title: International Ice Hockey Federation investigates Russia’s incorporation of teams from occupied Ukrainian territories into its tournament system
body: The International Ice Hockey Federation (IIHF) has launched an investigation into evidence that teams from Ukraine's temporarily occupied territories are competing in tournaments held under the auspices of the Russian Ice Hockey Federation.
