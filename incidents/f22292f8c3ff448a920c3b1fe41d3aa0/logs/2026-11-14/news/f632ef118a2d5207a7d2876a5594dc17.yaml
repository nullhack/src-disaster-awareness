title: Zelensky says the EU will finally have a seat at the table in the next Ukraine-Russia peace talks
body: Volodymyr Zelensky says the European Union will directly participate in the next Ukraine-Russia peace negotiations, following U.S.-backed diplomatic contacts and a major prisoner exchange agreement.
