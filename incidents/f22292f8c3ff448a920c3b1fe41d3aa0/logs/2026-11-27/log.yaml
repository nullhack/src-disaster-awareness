log_date: '2026-11-27'
summary: The IAEA is seeking a ninth local ceasefire around the Zaporizhzhia nuclear plant in order to restore external power to the facility. President Zelenskyy warned that Russia is preparing a major attack on Ukraine's energy infrastructure while repair crews race to fix damage from earlier strikes, as electricity and water shortages become routine in Kyiv. Leaked Russian civil registration records also revealed the deaths of 23 Zimbabwean men who fought in Russian ranks, most of them in eastern Ukraine, while analysis described how surging Black Sea incidents are edging NATO and the U.S. closer to the conflict.
