log_date: '2026-09-30'
summary: Putin’s envoy held constructive talks with US officials on the Ukraine war and energy initiatives, while reports say Putin plans to inject £150bn into the war effort and raise military spending by 27% in 2027. Russian and Ukrainian strikes continued, leaving at least 10 dead, and the Pentagon announced a record $20.7 billion AMRAAM/NASAMS deal. Other items include Germany’s top diplomat warning against questioning the Russian threat to Europe, South Korea demanding an apology from Zelenskyy over comments on North Korean soldiers, and a report on a Ukrainian military unit training fighters from China.
