title: Russian troops confiscate Ukrainian drone-delivered food in occupied Oleshky as civilians injured by mines while fleeing, officials say
body: Four people were attempting to leave the town when they stepped on a mine and were injured, while a man collecting nuts was killed by another mine, the local military administration said.
