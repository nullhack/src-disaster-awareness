log_date: '2026-08-17'
summary: Ukraine launched its biggest drone attack of 2026 with over 1,500 drones, according to Russia, while also striking a missile fuel production facility in Russia's Rostov region and a Wildberries warehouse near Moscow. In retaliation, Russia launched strikes on Ukraine that killed at least 16 people across both countries. Separately, a NATO jet shot down a drone that entered Romanian airspace, and reports emerged of Russia using disabled soldiers in frontline assaults.
