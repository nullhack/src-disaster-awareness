log_date: '2026-08-06'
summary: Russia is reportedly preparing a new mobilization campaign as volunteer numbers slide, while Putin reshuffled Russia's military leadership. Ukraine's drone strike on Moscow region warehouses killed 5, and an explosive device destroyed the car of a Russian drone factory head, wounding him and killing his driver. North Korea has begun deploying a missile unit to western Russia with 120 ballistic missiles, according to Ukrainian intelligence, as both sides continue to innovate aerial weapons in an intensifying air war.
