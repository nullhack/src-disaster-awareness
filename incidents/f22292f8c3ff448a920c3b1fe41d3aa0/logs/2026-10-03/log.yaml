summary: Ukraine's drone chief warned that humanity is losing control of AI weapons and disclosed a $20 million Russian bounty on him, while The New York Times obtained a purported Russian plan to cut electricity and heat to three major Ukrainian cities by 90% as part of a winter campaign. Reuters reported that Ukraine faces a critical funding gap of $27 billion, with total war costs hitting $155 billion this year.
