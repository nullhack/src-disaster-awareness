log_date: '2026-10-03'
summary: |-
  Ukraine's drone chief warned that humanity is losing control of AI weapons and disclosed a $20 million Russian bounty on him, while The New York Times obtained a purported Russian plan to cut electricity and heat to three major Ukrainian cities by 90% as part of a winter campaign. Reuters reported that Ukraine faces a critical funding gap of $27 billion, with total war costs hitting $155 billion this year.
  On October 3, 2026, Ukraine announced a daring operation that used robotic systems and Trojan APCs to force 250 Russian soldiers to surrender. In response, Russia warned diplomats and foreigners to leave Kyiv, signaling an imminent threat of new strikes. Diplomatic efforts continued as Putin backed peace talks linked to an oil deal, while Ukraine described India's ceasefire plan as the broadest proposal received and open to truces on energy and Black Sea shipping.
