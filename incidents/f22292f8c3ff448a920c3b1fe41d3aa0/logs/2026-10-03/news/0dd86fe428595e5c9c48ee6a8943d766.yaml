title: The New York Times obtains a purported Russian plan to cripple Ukraine’s power grid, including by cutting electricity and heat supplies to three major cities by 90% — Meduza
body: Russia plans to disable Ukraine’s entire energy system. Ukrainian authorities have obtained a Russian Defense Ministry document outlining the plan, The New York Times reported. Ukrainian Energy Minister Denys Shmyhal showed it to two European politicians in late September, sources told the newspaper. The Times also obtained a copy of the Russian-language document but said its authenticity could not be verified.
