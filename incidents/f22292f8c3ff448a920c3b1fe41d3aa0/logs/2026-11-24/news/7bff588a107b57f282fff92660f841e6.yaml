title: UK's Prince Harry sees 'big separation' between US administration, public on support for Ukraine
body: Britain’s Prince Harry offered a veiled criticism of the U.S. government’s policy toward Ukraine, saying in an interview released late Wednesday that he believes there is a “big separation” between the U.S. administration’s stance and that of the American people.
