title: Zelenskyy says intelligence shows Russia planning new strikes on Ukraine | Jefferson City News-Tribune
body: Ukraine's President Volodymyr Zelenskyy said on Monday that intelligence showed Russia planned new strikes on Ukraine, and he urged the United States and other countries to take note as supplies of air defense systems depended on their decisions.
