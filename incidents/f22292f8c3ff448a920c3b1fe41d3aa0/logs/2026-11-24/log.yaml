log_date: '2026-11-24'
summary: New analyses released on November 23 estimated more than 700,000 Russian soldiers have been killed since 2022, while leaked death-certificate data showed over 1,000 Russian military suicides during the war. President Zelensky said intelligence indicates Russia is planning new strikes on Ukraine, and more than 350,000 homes in Dnipropetrovsk Oblast remained without power after attacks on DTEK facilities on November 21-22. Ukrainian officials also disclosed that Neptune missile production will stay below 1,000 this year as Russia produced 87 Kh-101 missiles in July, and Dmitry Medvedev claimed NATO has crossed Russia's nuclear-strike red line.
