log_date: '2026-11-24'
summary: |-
  New analyses released on November 23 estimated more than 700,000 Russian soldiers have been killed since 2022, while leaked death-certificate data showed over 1,000 Russian military suicides during the war. President Zelensky said intelligence indicates Russia is planning new strikes on Ukraine, and more than 350,000 homes in Dnipropetrovsk Oblast remained without power after attacks on DTEK facilities on November 21-22. Ukrainian officials also disclosed that Neptune missile production will stay below 1,000 this year as Russia produced 87 Kh-101 missiles in July, and Dmitry Medvedev claimed NATO has crossed Russia's nuclear-strike red line.
  Ukrainian sea drones sank the Russian corvette Merkury in Libya, with reporting identifying it as a Steregushchiy-class vessel handed to the Russian Navy in 2023 and struck from roughly 1,000 miles away; a former U.S. national security adviser warned the operation risks a "serious escalation." Director of National Intelligence Jay Clayton said it was "entirely appropriate" for Trump to call Putin a friend in conversation, while stressing Putin is "not America's friend in Ukraine." German Chancellor Friedrich Merz and NATO Secretary General Mark Rutte used a Berlin meeting to announce a further intensification of the military confrontation with Russia as attacks on Russian ships spread beyond the Black Sea.
