log_date: '2026-07-28'
summary: |-
  President Zelenskyy met with Britain's new Prime Minister Andy Burnham, discussing drone projects and missile defense for Kyiv, marking the first foreign leader visit since Burnham took office. Ukraine dismissed Iranian threats after a strike in the Caspian Sea, as the Pentagon indicated it will not finish spending Ukraine funds until the year Trump leaves office.
  Zelensky arrived in Washington for a meeting with Trump, as the Ukraine and Iran wars threaten to overlap. Ukraine rejected Iran's threats and leveled its own accusations, while reporting strikes on 14 energy facilities in occupied Crimea. New reports emerged that Russia ran a North Korean ballistic missile lab in Ukraine and may be preparing to mobilize 500,000 additional troops.
