title: Putin warns West that Russia is prepared to use ‘all weapons’ to protect Kaliningrad
body: By Zahra Ullah, CNN Moscow (CNN) — Russian President Vladimir Putin has warned the West against escalating the war in Ukraine, saying Moscow is prepared to use “all weapons” in its arsenal — including nuclear — if its Baltic exclave of Kaliningrad comes under attack. Speaking at the Valdai Discussion Club in Moscow on Thursday,
