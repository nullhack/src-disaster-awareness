log_date: '2026-10-02'
summary: Russian President Vladimir Putin warned the West against escalation, saying Moscow is prepared to use "all weapons"—including nuclear—to protect Kaliningrad. India issued a fresh advisory against its citizens joining the Russian armed forces, while Putin praised PM Modi's "good ideas" for settling the Ukraine conflict. South Korea demanded an apology from Ukraine over a prisoner row, and reports emerged of Russia planning a major winter campaign to cut off Ukrainian cities from power and heat.
