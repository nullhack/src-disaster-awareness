log_date: '2026-10-02'
summary: |-
  Russian President Vladimir Putin warned the West against escalation, saying Moscow is prepared to use "all weapons"—including nuclear—to protect Kaliningrad. India issued a fresh advisory against its citizens joining the Russian armed forces, while Putin praised PM Modi's "good ideas" for settling the Ukraine conflict. South Korea demanded an apology from Ukraine over a prisoner row, and reports emerged of Russia planning a major winter campaign to cut off Ukrainian cities from power and heat.
  Reports indicate Russia is preparing for years of war by boosting military spending, even as it suffers record casualties and loses territory. Ukraine carried out a daring operation that forced 250 Russian soldiers to surrender, while South Korea threatened punitive steps against Kyiv over POW-related tensions. Another report described Russia using migrants as a weapon against Europe as part of its broader strategy.
