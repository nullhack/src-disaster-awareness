log_date: '2026-11-07'
summary: Police searches at Kyiv's city-run heating company have escalated political tensions between President Zelensky and Mayor Vitali Klitschko as winter preparations intensify. Ukraine requested Norway's support for a $3–4 billion war risk insurance fund to address a €70 billion funding gap, while Russia unveiled Mi-28 attack helicopters capable of firing cruise missiles. The ongoing Black Sea blockade has led to rotting grain stocks, heightening food security fears in the Middle East, and a Russian satellite maneuvered near a US-owned spacecraft, raising new concerns about space security.
