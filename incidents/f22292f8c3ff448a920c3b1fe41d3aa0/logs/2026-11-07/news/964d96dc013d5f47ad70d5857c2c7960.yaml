title: Trump teases ‘big, beautiful’ European security deal after meeting Putin envoy | CNN Politics
body: US President Donald Trump has promised a new security deal for Ukraine that “might involve all of Europe” after meeting a top Russian envoy on Thursday, but the proposal offers few details and has left European capitals puzzled.
