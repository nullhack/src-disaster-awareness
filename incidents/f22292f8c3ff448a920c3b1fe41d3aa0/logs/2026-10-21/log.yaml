log_date: '2026-10-21'
summary: The US has resumed intelligence sharing with Ukraine about Russian strikes after a suspension, President Zelenskyy confirmed. European leaders are preparing direct talks with Putin, reportedly exploring a proposal that would give Russia control of Donbas in exchange for Ukraine's NATO membership. Meanwhile, Trump suggested Zelenskyy should step aside, expressed openness to a trilateral meeting with Putin and Xi Jinping, and Ukraine raised new concerns at the UN over Russia recruiting Cuban citizens for its military.
