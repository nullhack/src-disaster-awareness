log_date: '2026-10-21'
summary: |-
  The US has resumed intelligence sharing with Ukraine about Russian strikes after a suspension, President Zelenskyy confirmed. European leaders are preparing direct talks with Putin, reportedly exploring a proposal that would give Russia control of Donbas in exchange for Ukraine's NATO membership. Meanwhile, Trump suggested Zelenskyy should step aside, expressed openness to a trilateral meeting with Putin and Xi Jinping, and Ukraine raised new concerns at the UN over Russia recruiting Cuban citizens for its military.
  On October 21, Putin told U.S. envoy Witkoff that Moscow is willing to resume three-way negotiations with Kyiv and Washington, with talks possibly starting in November. Meanwhile, Zelensky stated he would be open to freezing the front line to end the war, and reports claimed Musk personally ordered speed restrictions on Starlink in Ukraine, prompting calls for a Senate probe.
