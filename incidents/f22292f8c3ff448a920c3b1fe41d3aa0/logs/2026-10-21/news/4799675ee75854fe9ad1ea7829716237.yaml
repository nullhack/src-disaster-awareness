title: 'Europe is preparing for direct talks with Putin, FT reports. One possible proposal: Russia gets Donbas, Ukraine gets NATO membership. — Meduza'
body: European leaders are rethinking their approach to the Kremlin, Financial Times foreign affairs columnist Gideon Rachman writes. More politicians in the European Union now agree that negotiations with Vladimir Putin should not remain the exclusive prerogative of the United States. European countries could soon open their own talks with the Kremlin. Channels of communication are already in place, he says.
