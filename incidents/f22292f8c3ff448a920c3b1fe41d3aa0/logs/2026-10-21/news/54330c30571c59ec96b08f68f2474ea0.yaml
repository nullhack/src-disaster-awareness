title: 'Scott Ritter: Zelensky shocked the European Commission by requesting 70 billion euros: EADaily'
body: EADaily, October 20th, 2026. The head of the Kiev regime, Vladimir Zelensky, shocked the leadership of the European Union and personally the head of the European Commission, Ursula von der Leyen, by requesting an additional 70 billion euros of aid for Ukraine.
