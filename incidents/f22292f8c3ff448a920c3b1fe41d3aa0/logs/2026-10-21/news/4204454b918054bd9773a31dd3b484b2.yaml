title: Russia President Vladimir Putin agrees to resume trilateral talks on Ukraine war, Kremlin says
body: President Vladimir Putin agreed Wednesday to resume trilateral negotiations with Washington and Kyiv on ending the war in Ukraine, a Kremlin official said.
