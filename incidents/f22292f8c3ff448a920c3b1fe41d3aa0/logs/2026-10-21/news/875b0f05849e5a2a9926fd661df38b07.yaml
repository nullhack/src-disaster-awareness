title: '''We will fight'' — We asked Ukrainian soldiers about Trump''s latest outburst'
body: U.S. President Donald Trump on Oct. 18 claimed his approach to ending the war in Ukraine is "very simple." In a post on Truth Social, Trump explained that his decision to ease sanctions on Russia while simultaneously piling pressure on Ukraine was to avoid "foolishly (driving) Russia away from the bargaining table." For many of Trump’s critics in Ukraine, his recent decisions are viewed in similarly simple terms — Trump is helping Russia win the war. Trump also doubled down on his criticism o
