title: Was Russia-Ukraine war a reason for fewer medals for Indian shooters at Asian Games?
body: 'Indian Shooting Team for Asian Games 2026: For a shooter, the bullet is as much a part of the equation as the gun. But Indian shooters have been dealing with a shortage of match-grade .22 ammunition, with imports taking months longer than before. Did the shortage have any impact at the Asian Games?'
