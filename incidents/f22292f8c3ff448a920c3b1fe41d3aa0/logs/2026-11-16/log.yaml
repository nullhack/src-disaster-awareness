log_date: '2026-11-16'
summary: President Zelensky said U.S. negotiators floated the idea of Ukraine giving up territory in exchange for NATO membership. Moscow warned the EU that "if there is no agreement, we will have to use force," as Estonia announced it would close its border with Russia in December and reports cited continued Starshield restrictions. Separately, reporting tied Russia's Alabuga drone facility zone to new deals signed by two African governments amid a Ukrainian probe alleging deceptive recruitment, including of young women.
