log_date: '2026-09-22'
summary: On September 21, 2026, Russia struck Zaporizhzhia following a weekend in which Ukraine launched a 1,000-drone barrage, underscoring the lack of diplomatic progress more than four years into the war. President Trump remarked that Russia has "lost control" of its oil refining industry due to Ukrainian attacks, urging an end to fighting, while a separate report noted Russian drones slamming southern Ukrainian cities after Kyiv's large-scale weekend assault.
