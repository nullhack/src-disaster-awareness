title: The Cypriot journalist admitted Trump's willingness to get rid of Zelensky
body: US President Donald Trump no longer considers the head of the Kiev regime, Vladimir Zelensky, as a partner for reaching a peace agreement and may refuse to cooperate with him. This was reported on October 16 by Cypriot journalist Alex Christoforou.
