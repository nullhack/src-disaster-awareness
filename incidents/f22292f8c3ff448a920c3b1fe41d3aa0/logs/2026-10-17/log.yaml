log_date: '2026-10-17'
summary: After Moscow broke Trump’s energy ceasefire, Ukraine struck a Russian refinery, prompting new clashes. Ukraine’s access to Starlink was temporarily restricted, leading to political disputes over responsibility, while Putin declared a “security zone” in Ukraine and refused to cede territory. Zelensky warned that a Russian victory could trigger a 20‑million refugee exodus and alleged China is providing Moscow with a Starlink alternative.
