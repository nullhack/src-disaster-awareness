log_date: '2026-10-17'
summary: |-
  After Moscow broke Trump’s energy ceasefire, Ukraine struck a Russian refinery, prompting new clashes. Ukraine’s access to Starlink was temporarily restricted, leading to political disputes over responsibility, while Putin declared a “security zone” in Ukraine and refused to cede territory. Zelensky warned that a Russian victory could trigger a 20‑million refugee exodus and alleged China is providing Moscow with a Starlink alternative.
  Pope Leo XIV spoke by telephone with President Putin from his hospital room on October 16, pleading for a ceasefire in the besieged town of Oleshky and aid for starving civilians; Putin agreed to cooperate. Meanwhile, British troops joined a NATO drill rehearsing a potential deployment to Ukraine to provide security guarantees after a ceasefire. A fresh wave of Russian strikes across Ukraine killed at least eight people and wounded nearly 60, continuing the daily toll of violence.
