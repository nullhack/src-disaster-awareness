title: Ukraine Targets Ozon in Widening Attacks on Russian Online Retailers
body: Aug 24 (Reuters) - Four logistics hubs owned by Russia's second-largest online retailer Ozon in southern Russia were targeted in Ukrainian drone attacks, the company said on Monday, bringing the number of targeted facilities to six since August 22.
