log_date: '2026-08-30'
summary: |-
  Ukrainian drones struck Ozon and DNS logistics facilities in Russia's Rostov region amid a state of emergency, as Russia imposed new gasoline sales restrictions with lines of 30-50 cars at stations due to refinery damage from Ukrainian strikes, forcing Moscow to import petrol from India. CIA Director Ratcliffe's secret Moscow visit reportedly included a proposal for a trilateral Trump-Putin-Zelensky meeting, while Russia resumed strikes on Kyiv following a deadly attack on a care home that killed 34. Turkey summoned Ukraine's ambassador over Black Sea vessel attacks, and Russia warned of a military response to NATO nuclear expansion in Europe, as Putin test-fired a nuclear-capable missile that could reach the US.
  UK Prime Minister Andy Burnham visited Kyiv and provided Ukraine with blueprints to build its own long-range cruise missiles, defying Russian threats of consequences. Ukraine expanded its drone campaign to target Ozon logistics hubs in southern Russia, hitting six facilities since August 22, as Russia continues to suffer domestic fuel shortages forcing it to import petrol from India due to refinery damage. Russia test-fired a nuclear-capable intercontinental ballistic missile days after CIA Director Ratcliffe's secret Moscow visit, while a Vatican envoy visited Moscow calling for an urgent end to the war.
