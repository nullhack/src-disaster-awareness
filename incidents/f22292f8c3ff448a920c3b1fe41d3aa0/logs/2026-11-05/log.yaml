log_date: '2026-11-05'
summary: Reconstruction and security talks between Russia and Ukraine resumed in Brussels as both sides continued to exchange airstrikes. Ukraine faces uncertainty over satellite access as its Starshield contract with the US expires next year, while Indonesia warned Russia against military recruitment of its citizens and Russia agreed to supply Iran with 90 advanced missile launchers. Zelensky accused Musk of not acting alone in restricting Starlink and expressed hope that the Democratic Congress will bring more US aid, as UK Prime Minister Burnham stated Putin will not be invited to the next G20.
