log_date: '2026-07-30'
summary: |-
  Ukraine struck two major Russian oil refineries in its latest long-range strikes, deepening economic pressure on Moscow. The US Army awarded Lockheed Martin a $58.6 billion Patriot missile contract as stockpiles strain from conflicts, while Ukraine's port crisis worsened with farmers warning of bankruptcies and wheat futures climbing due to faltering Black Sea exports. An F-16 crashed while pursuing Russian air targets (pilot rescued), and former Defense Minister Fedorov cited changes to military procurement behind his dismissal.
  Russian strikes across Ukraine killed at least 8 civilians and wounded dozens on July 29, with Poland scrambling jets in response to the escalation. Russia's Lavrov rejected Kazakhstan President Tokayev's call to freeze the fighting along the current front line. Ukraine's strikes on two major Russian oil refineries—previously reported in prior summaries—continued to squeeze Moscow's fuel supplies, while a Russian senator alleged Ukraine's Caspian Sea attack on an Iranian vessel was an attempt to draw Iran into the conflict.
