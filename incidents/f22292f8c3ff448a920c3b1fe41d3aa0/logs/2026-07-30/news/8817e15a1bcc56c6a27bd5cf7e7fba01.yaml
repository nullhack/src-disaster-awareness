title: Ukraine says it hit 2 major Russian oil refineries hours after Zelensky's meeting with Trump
body: Ukrainian drones and missiles ignited fires at two major Russian oil refineries, far beyond the front lines, intensifying a months-long campaign that has squeezed Moscow’s fuel supplies.
