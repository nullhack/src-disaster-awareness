title: Russian strikes across Ukraine kill at least 8 civilians and wound dozens
body: The blitz expanded Russia's almost daily bombardment of Ukrainian cities as Moscow apparently looked to exploit Kyiv's critical shortage of Western-supplied anti-ballistic missile defenses.
