title: Ukraine hits 2 major Russian refineries
body: 'Kyiv, July 29: Ukrainian forces hit two of Russia’s biggest oil refineries overnight in its latest long-range strikes, officials said, as Kyiv deepened its economic, military and diplomatic pressure on Moscow. Ukraine’s almost daily long-range drone and missile strikes using domestically developed weapons have battered Russian oil facilities for months. The operation has brought a…'
