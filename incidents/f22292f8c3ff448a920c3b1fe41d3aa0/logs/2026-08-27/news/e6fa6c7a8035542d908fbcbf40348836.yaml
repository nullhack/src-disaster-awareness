title: Trump was asked about CIA director's secretive visit to Russia. His response
body: CIA Director John Ratcliffe made a brief surprise visit to Moscow for talks with Russian intelligence officials. Trump called the trip semi-routine, but its timing has raised questions over Ukraine and wider US-Russia tensions.
