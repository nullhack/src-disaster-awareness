summary: CIA Director John Ratcliffe made a secret visit to Moscow to warn Russian officials against attacking NATO allies and helping Iran, a move Trump characterized as semi-routine. Meanwhile, ousted Defense Minister Mykhailo Fedorov reiterated that Ukraine is slowly losing the war and needs fundamental changes. Diesel prices continue to climb amid the Ukraine war and other global conflicts, and President Zelensky awarded Elon Musk an award, drawing criticism.
