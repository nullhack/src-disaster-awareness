title: The Welt correspondent pointed to Ukraine's dependence on Western aid
body: Welt correspondent Christoph Wanner, who is in Kiev, said that without Western support, Ukraine is no longer able to continue the conflict with Russia. The journalist told about it on September 30 in the broadcast of the TV channel published on the YouTube channel.
