log_date: '2026-09-29'
summary: |-
  Russia has hammered Kyiv for a seventh consecutive day, with the National Academy of Sciences set ablaze and at least four people killed in the latest strikes. Russia's Defence Ministry said it struck fuel and telecommunications infrastructure in Kyiv as well as cargo vessels bound for Ukraine, while the aerial war showed no sign of easing. Separately, EU officials discussed Ukraine's funding gap in Brussels, and Pope Leo XIV urged negotiators to accept concessions for peace.
  Estonia accused Russian security services of orchestrating an arson attack on a Ukrainian robotics supplier in Tallinn, deepening concerns over a sabotage campaign. Putin is allocating a record £154 billion to the war effort, with Russia planning a 27% surge in defense spending next year, while the Kremlin’s envoy held constructive talks with US officials on Ukraine and energy. Additionally, Russia expanded its army by 15,000 soldiers in its fourth military expansion this year as the war stalls.
