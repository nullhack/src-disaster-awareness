log_date: '2026-09-29'
summary: Russia has hammered Kyiv for a seventh consecutive day, with the National Academy of Sciences set ablaze and at least four people killed in the latest strikes. Russia's Defence Ministry said it struck fuel and telecommunications infrastructure in Kyiv as well as cargo vessels bound for Ukraine, while the aerial war showed no sign of easing. Separately, EU officials discussed Ukraine's funding gap in Brussels, and Pope Leo XIV urged negotiators to accept concessions for peace.
