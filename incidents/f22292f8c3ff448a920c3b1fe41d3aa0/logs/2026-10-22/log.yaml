log_date: '2026-10-22'
summary: Russian President Vladimir Putin told US envoy Steve Witkoff that Moscow is willing to resume trilateral peace talks with Ukraine and the US in November, a significant diplomatic development. Concurrently, Russia and Ukraine continue to exchange heavy strikes, with missiles hitting Kyiv and hundreds of drones targeting Moscow overnight. Meanwhile, President Trump accused Zelenskyy of not wanting to end the war, and the DHS extended temporary protected status for Ukrainian immigrants in the US.
