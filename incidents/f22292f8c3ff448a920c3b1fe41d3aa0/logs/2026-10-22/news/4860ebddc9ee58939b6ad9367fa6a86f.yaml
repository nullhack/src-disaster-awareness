title: 'Marco Rubio on Starlink''s Limitation in Ukraine: "We cannot direct a private company"'
body: United States Secretary of State, Marco Rubio, stated during his official visit to Mumbai on Wednesday that the U.S. Government and President Donald Trump "have nothing to do" with the operational decisions and speed restrictions imposed by the satellite network Starlink in Ukraine.
