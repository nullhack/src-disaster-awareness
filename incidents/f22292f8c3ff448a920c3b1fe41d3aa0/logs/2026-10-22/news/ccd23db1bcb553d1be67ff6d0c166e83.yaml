title: 'Analysis: Trump says he didn’t meddle with Elon Musk’s Starshield in Ukraine as ties with Zelensky fracture | CNN Politics'
body: The worst crisis in US-Ukraine relations since last year’s Oval Office meltdown is deteriorating further over a dispute about who ordered a disruption to a critical Ukrainian military system running on Elon Musk’s Starlink internet service.
