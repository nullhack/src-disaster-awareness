title: 'Araqchi: Open your eyes — the crisis is on Ukraine is being delayed by European countries and the United States: EADaily'
body: EADaily, October 19th, 2026. The main factor in prolonging the crisis on Ukraine and the emergence of other military conflicts in the world is the policy of the EU and the United States. This was stated by Iranian Foreign Minister Abbas Araqchi during a press conference following talks with Russian Foreign Minister Sergei Lavrov…
