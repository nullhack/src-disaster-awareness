title: India Reiterates Call for Peace in Ukraine Conflict at SCO Summit
body: A newsroom analysis highlights India's official stance on the Russia-Ukraine conflict, emphasizing Prime Minister Narendra Modi's assertion that diplomacy and peace must prevail over war. The discussion outlines the significance of bilateral ties between India and Russia on the sidelines of international forums like the Shanghai Cooperation Organisation and BRICS. It underscores New Delhi's strategy of prioritizing national interest and energy security while maintaining crucial diplomatic balancing acts across global power blocs.
