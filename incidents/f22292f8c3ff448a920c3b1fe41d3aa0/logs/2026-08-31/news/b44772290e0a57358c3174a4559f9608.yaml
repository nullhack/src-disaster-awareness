title: Death toll rises to 38 from Russia's deadliest attack on Ukraine this year
body: KYIV, Ukraine (AP) — The death toll from a Russian strike on a warehouse west of Kyiv, the war's deadliest attack this year, rose to 38 with four people still missing, Ukrainian President Volodymyr Zelenskyy said Sunday.
