title: PM meets Vladimir Putin at SCO sidelines in Bishkek, calls for end to Ukraine war
body: This news report covers key geopolitical, economic, and strategic developments involving India, Russia, West Asia, and North America. During a bilateral meeting at the Shanghai Cooperation Organisation summit in Bishkek, Prime Minister Narendra Modi told Russian President Vladimir Putin that the world must transition from endless wars to an end of war regarding the Russia-Ukraine conflict, emphasizing peace and dialogue. Both leaders discussed bilateral ties, trade, and defence cooperation while travelling together to the Nomad Games opening ceremony. Additionally, the broadcast analyzes India's strategic partnership with Russia ahead of the SCO and BRICS summits, focusing on Arctic shipping routes, trade imbalances, and currency mechanisms. The report also highlights India's first-quarter GDP growth of 7.8 percent, driven by domestic consumption and exports. Further coverage includes escalating West Asia tensions following United States military airstrikes on Iranian installations
  on Larak Island near the Strait of Hormuz, alongside PM Modi's diplomatic engagement with Iranian President Masoud Pezeshkian. Finally, it details Rashtriya Swayamsevak Sangh Sarsanghchalak Mohan Bhagwat's global outreach tour across the United States and Canada.
