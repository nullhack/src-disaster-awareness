title: PM Modi Meets Putin At SCO Summit, Calls For End To Russia-Ukraine War
body: Prime Minister Narendra Modi met Russian President Vladimir Putin on the sidelines of the Shanghai Cooperation Organisation summit in Bishkek. During the meeting, Prime Minister Modi emphasised that both India and Russia have consistently functioned on the principle of national interest first. Addressing the ongoing Russia-Ukraine conflict, he advocated for a peaceful resolution, stating that India is the land of Mahatma Gandhi and Gautam Buddha and stands firmly for peace while supporting efforts to end the war. He noted that every step taken towards ending the war energises peace, whereas actions prolonging it act against humanity. In addition to his bilateral talks with the Russian President, Prime Minister Modi also engaged in key bilateral meetings in Bishkek, including discussions with Iranian President Masoud Pezeshkian amid escalating regional strikes in West Asia.
