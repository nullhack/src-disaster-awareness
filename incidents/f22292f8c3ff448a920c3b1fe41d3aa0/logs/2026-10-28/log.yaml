log_date: '2026-10-28'
summary: Melania Trump's brokered ceasefire in Oleshky took effect on October 27, with humanitarian aid deliveries planned. Nordic leaders held a tense call with Putin urging an end to the war, a move that has divided European allies. Zelensky stated that Ukraine is retaking territory and its battlefield position is the strongest in some time, while the US considers dropping sanctions on a Russian slush fund and the EU lobbies G7 nations for increased Ukraine funding.
