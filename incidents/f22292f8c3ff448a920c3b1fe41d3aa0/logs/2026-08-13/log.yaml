log_date: '2026-08-13'
summary: Ukraine launched a massive overnight drone attack on Russia’s Black Sea port of Novorossiysk, damaging two major grain terminals and targeting a naval base. Meanwhile, the protest movement over the dismissal of former Defense Minister Mykhailo Fedorov is losing momentum as organizers struggle to decide next steps. Ukraine continues to seek Patriot interceptors from the US but has not yet obtained them.
