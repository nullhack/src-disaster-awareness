log_date: '2026-08-13'
summary: |-
  Ukraine launched a massive overnight drone attack on Russia’s Black Sea port of Novorossiysk, damaging two major grain terminals and targeting a naval base. Meanwhile, the protest movement over the dismissal of former Defense Minister Mykhailo Fedorov is losing momentum as organizers struggle to decide next steps. Ukraine continues to seek Patriot interceptors from the US but has not yet obtained them.
  Ukraine struck Russia's Novorossiysk naval base in a fresh long-range drone attack, as President Zelensky claimed Kyiv made significant battlefield gains "exactly as planned." Russia's highest court barred the only anti-war party from the parliamentary ballot, while Moldova offered a rail lifeline for Ukrainian food exports as Russia continues choking Black Sea trade. A U.S.-Ukrainian military exercise revealed that Ukraine's drone warfare capabilities outperformed American forces, underscoring Kyiv's growing technological edge in the conflict.
