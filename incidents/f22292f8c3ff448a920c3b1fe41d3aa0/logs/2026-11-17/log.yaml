log_date: '2026-11-17'
summary: Russia struck two major bridges in Kyiv while Ukraine hit Moscow's link to annexed Crimea for a second consecutive night, with the exchanges occurring ahead of Xi-Trump-Putin talks. Jared Kushner described a U.S. plan for postwar Ukraine centered on security guarantees, the prospect of EU accession, and a comprehensive economic recovery program. Meanwhile, Russia pressed a bombing campaign intended to deprive Kyiv and other cities of heat, running water, and sanitation this winter even as peace talks continue.
