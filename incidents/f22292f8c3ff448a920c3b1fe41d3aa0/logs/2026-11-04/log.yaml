log_date: '2026-11-04'
summary: Russia has introduced new jet-powered Geran-5 and Geran-4 Seeker drones to bolster its strikes on Ukraine, as Ukrainian air defenses face shortages. Meanwhile, a riot broke out in a Kyiv suburb on November 2 when an enraged crowd attempted to free mobilized men from a bus, with Russia using the incident to score propaganda points over Ukraine’s mobilization crisis.
