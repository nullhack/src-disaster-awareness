title: Putin cites chance of peace deal, Ukraine sees 'new dynamic'
body: By Vladimir Soldatkin VLADIVOSTOK, Russia, Sept 3 (Reuters) - Russian President Vladimir Putin said on Thursday there was a chance of reaching an agreement to end the war in Ukraine, while Kyiv said it expected a "new dynamic" in peace efforts.
