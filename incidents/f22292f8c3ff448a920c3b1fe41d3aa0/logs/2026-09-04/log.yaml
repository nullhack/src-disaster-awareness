log_date: '2026-09-04'
summary: Russia struck two Ukrainian cargo vessels in the Black Sea, escalating maritime attacks, while Putin cited a chance for a peace deal and Ukraine noted a "new dynamic" in peace efforts. India's foreign minister visited Kyiv offering diplomatic help, and Ukraine formally warned international aviation that Russian airspace is unsafe, broadening the air war. Russia's oil revenue hit a six-month low as Ukrainian drone strikes continue to pressure the economy, and strikes near Moldova raised fears of escalation beyond Ukraine.
