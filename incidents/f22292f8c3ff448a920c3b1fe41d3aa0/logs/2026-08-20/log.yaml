log_date: '2026-08-20'
summary: |-
  President Putin admitted that Ukraine's strikes are causing economic harm to Russia, acknowledging the impact of the ongoing drone campaign. The United Nations humanitarian chief warned that Russian drones are increasingly endangering civilians and aid workers in Ukraine. Additionally, reports emerged that Russia is preparing a significant missile attack on Ukraine, signaling a potential escalation.
  Russia launched a massive overnight hypersonic missile and drone attack on Kyiv, killing at least 12 people. In response, Ukraine deployed one of its largest drone swarms of the war, striking warehouses near Moscow as part of its strategy to hit deep inside Russian territory. Poland scrambled jets amid the escalation, and Russia warned the UK of "consequences" over reports of British-made drones used in Ukrainian strikes.
