log_date: '2026-08-04'
summary: |-
  Zelenskyy requested Trump's help to secure Elon Musk's approval for using Starlink to target ballistic missile launchers inside Russia. A Russian strike on Dnipropetrovsk killed 4 and wounded 15, while a former Ukrainian official described "scandalous situations" in bomb shelters as Zelenskyy continued pushing partners for 300 Patriot interceptors.
  Ukrainian drone strikes hit the Moscow region, killing five, and struck a crowded holiday beach resort near Gelendzhik, killing seven. Turkiye condemned drone attacks on two civilian cargo ships in the Black Sea after they departed Russia. President Zelenskiy dismissed Ukraine's ambassador to the United States, Olga Stefanishyna.
