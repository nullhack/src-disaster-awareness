title: Zelenskyy asks Trump to help him get Elon Musk’s OK to use Starlink to help with strikes on Russia
body: Musk has allowed the Ukrainians to use Starlink inside their own territory, including in Ukrainian regions occupied by the Russians, but has restricted use of the satellite system inside Russia.
