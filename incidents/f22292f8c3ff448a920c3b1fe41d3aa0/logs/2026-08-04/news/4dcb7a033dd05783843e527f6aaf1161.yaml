title: Big Oil reaps half a billion dollars a day as ‘scandalous’ war windfall continues
body: 'World’s 5 leading oil ‘supermajor’ companies rake in $48 billion in Q2 2026 – the most since height of Ukraine crisis. Global Witness senior campaigner Flossie Boyd said: "As wildfires ravage Europe, drought bites and the Iran war hikes up fuel prices once again, it’s scandalous that the oil giants turbo-charging climate breakdown are cashing in on our misery. This summer should be a wake-up call to governments everywhere – it’s time to pivot away from planet-heating fossil fuels and start fairly taxing Big Oil to fund the protections we need – more fire and flood defences, wind and solar roll-outs and climate-resilient infrastructure.”'
