title: Russian drone attacks turn the Black Sea into the world’s deadliest waterway
body: By Tim Lister (CNN) — Russian drones have struck at least a dozen merchant ships in the Black Sea in recent weeks – killing more mariners than have died during the Iran war. Russia’s goal is to throttle trade through Ukrainian ports, which export almost all the country’s grain. But some attacks have occurred close
