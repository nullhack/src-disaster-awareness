title: Russia confirms new Ukraine peace talks as Melania Trump prepares to host ceasefire meeting
body: Russia confirmed Ukraine peace talks in Abu Dhabi next week and signaled a possible Trump-Putin-Xi summit, raising questions over Kyiv's role in negotiations.
