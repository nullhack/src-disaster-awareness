title: Trump Envoy Witkoff Sets Russia-Ukraine Peace Talks in Abu Dhabi as US Aid to Kyiv Drops 99%
body: The peace talks mediated by the U.S. will be held Nov. 10-11 in Abu Dhabi, with input from NATO and other traditional allies.
