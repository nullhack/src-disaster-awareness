title: 'Asymmetry: U.S. And Ukraine Face The Same Ballistic Missile Challenge'
body: The U.S. and Ukraine both face the same challenge of a shortage of Patriot missiles to intercept ballistic missiles. But for Ukraine, the threat is existential.
