log_date: '2026-08-10'
summary: On August 9-10, Russia launched massive overnight strikes on Odesa with over 200 missiles and drones, killing eight, while a separate Russian strike destroyed a WHO warehouse in Ukraine. Overnight exchanges between Russia and Ukraine killed seven civilians and injured many, including a Ukrainian drone strike 600 miles inside Russia in Tatarstan that killed 13, and a drone attack in Belgorod killing five. Pope Leo renewed calls for peace, a KIIS poll found 61% of Ukrainians willing to endure the war as long as it takes, and President Zelensky warned North Korea could send up to 50,000 troops to Russia.
