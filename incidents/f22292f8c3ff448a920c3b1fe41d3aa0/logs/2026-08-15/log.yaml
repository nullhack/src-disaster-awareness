log_date: '2026-08-15'
summary: Ukraine struck a Russian train carrying North Korean KN-23 and KN-24 ballistic missiles on the Trans-Siberian Railway. Separately, Kyiv used a Flamingo missile to bomb a space centre, while Russia conducted a deadly air raid on Kramatorsk that killed one and wounded 17. Russia is increasingly deploying jet-powered Shahed drones that are more challenging to intercept.
