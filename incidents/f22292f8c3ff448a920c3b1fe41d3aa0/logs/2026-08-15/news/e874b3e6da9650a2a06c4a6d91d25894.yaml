title: Lavrov explained why it is impossible to stop the conflict with Ukraine on the front line
body: On August 14, Russian Foreign Minister Sergei Lavrov gave a lengthy interview in which he stated that it was impossible to stop the conflict with Ukraine on the line of contact, and also announced tough actions by Moscow to eliminate Kiev's military machine. For more information, see the Izvestia article.
