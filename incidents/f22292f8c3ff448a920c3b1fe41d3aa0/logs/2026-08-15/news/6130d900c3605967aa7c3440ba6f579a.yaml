title: Ukraine HITS Russian Train carrying North Korean KN-23 and KN-24 Ballistic Missiles in Shock Attack - Oneindia
body: A massive blast has reportedly struck a strategic railway deep inside Russia, with Ukraine claiming the target was a train allegedly carrying North Korean KN-23 and KN-24 ballistic missiles and ammunition. The reported operation took place along the Trans-Siberian Railway, thousands of kilometres from the Ukrainian front. Ukrainian military expert Kyrylo Sazonov, citing sources linked to Ukraine’s HUR intelligence agency, said operatives had tracked the strategic cargo from the North Korean border. The alleged sabotage reportedly involved remotely controlled explosives placed beneath the tracks. When the train passed over the suspected blast site, the explosives were allegedly detonated, disrupting a crucial weapons supply route.- Watch Video on English Oneindia
