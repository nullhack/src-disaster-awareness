log_date: '2026-11-22'
summary: A Russian cargo vessel was struck by a drone in the Gulf of Finland and caught fire, prompting Finland’s prime minister to say the conflict is spilling over and NATO to reaffirm it will defend every inch of Polish territory. At an unprecedented Shenzhen summit, Trump, Xi and Putin issued a symbolic “peace declaration” saying nuclear war should never be fought but announced no arms-control talks; Russia meanwhile revived prewar demands in response to a U.S. offer to discuss postwar European security. Ukraine criticized an IAEA plan to appoint a sanctioned Russian official to a senior post, and Zelensky spoke with CNN in his first interview after the Trump-Putin-Xi meeting.
