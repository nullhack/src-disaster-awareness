title: Trump, Xi, Putin release ‘peace declaration’ from unprecedented summit | Fulton Sun
body: SHENZHEN, China/WASHINGTON -- China, the United States and Russia agreed on a symbolic "peace declaration" at an unprecedented three-way summit on Thursday and reaffirmed that nuclear war should never be fought, but announced no plans for arms control talks long sought by Trump.
