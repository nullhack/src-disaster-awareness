title: How Warren Buffett’s Son Howard Buffett Became Ukraine’s Largest Private Donor
body: The farmer and chairman of Berkshire Hathaway has made 28 visits to war-torn Ukraine, formed great friendships and donated more than $1.5 billion to help the country’s people.
