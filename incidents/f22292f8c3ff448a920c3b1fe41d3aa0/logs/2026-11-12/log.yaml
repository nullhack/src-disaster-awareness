log_date: '2026-11-12'
summary: |-
  A summit between President Xi Jinping, President Donald Trump, and President Vladimir Putin took place, drawing comparisons to the 1945 Yalta conference. Separately, South Korea urged Ukraine to honor agreements amid a diplomatic rift, while President Zelenskyy warned that the conflict with Iran is draining Patriot missile supplies needed for Ukraine's defense.
  US envoys Kushner and Witkoff arrived in Moscow for talks with Putin after two days of Abu Dhabi negotiations produced a large prisoner exchange but no ceasefire. European leaders met in Dublin to discuss Ukraine's security, while Ukraine reported new Starlink disruptions along the front line. The Black Sea has seen over 300 attacks on vessels this year, and Ireland faced pressure over alumina shipments to Russia.
