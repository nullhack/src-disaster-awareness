title: Why U.S.-Led Talks With Russia And Ukraine Had No Major Breakthrough
body: U.S.-led talks in Abu Dhabi brought no major breakthroughs in ending the Russia-Ukraine War. Russia still demands Ukrainian land and rejects an immediate ceasefire.
