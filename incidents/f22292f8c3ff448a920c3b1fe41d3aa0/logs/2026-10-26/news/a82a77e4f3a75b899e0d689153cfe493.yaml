title: The number of priests killed in Russia's war against Ukraine is rising - ZENIT - English
body: 'The human cost of the conflict was also at the center of a meeting at the Vatican on October 23, when Pope Leo XIV received Major Archbishop Sviatoslav Shevchuk, head of the Ukrainian Greek Catholic Church. The encounter brought together two urgent concerns: the fate of Ukrainians held captive by Russia and the worsening humanitarian pressures facing a country preparing for another harsh winter'
