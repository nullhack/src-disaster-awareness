log_date: '2026-08-01'
summary: |-
  Thousands of Ukrainians rallied in Kyiv on July 31, demanding the reinstatement of ousted Defence Minister Mykhailo Fedorov, signaling ongoing political tension. Separately, wheat futures fell 3.8% to $6.38 per bushel as traders locked in profits amid the conflict, reflecting continued economic volatility.
  Russia's main grain lobby group warned that Ukrainian drone attacks on Black Sea infrastructure threaten exports and global food security. Ukraine continued its aerial campaign against Russia's commercial sector, striking more outlets of the Wildberries online marketplace and a logistics hub belonging to Ozon.
