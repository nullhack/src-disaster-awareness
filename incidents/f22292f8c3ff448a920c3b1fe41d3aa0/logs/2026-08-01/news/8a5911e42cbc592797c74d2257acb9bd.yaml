title: Ukraine hits more outlets of Russia's largest online marketplace to bring the war home
body: In under two weeks, Ukraine has struck more than a dozen Russian retailer’s depots, part of Kyiv’s aerial campaign aimed at undermining Russia’s war effort, hurting its economy and making people feel the consequences of the Kremlin’s all-out invasion of Ukraine.
