title: 'Russia’s Cap on Partner Aid: Institutional Rigidity and the Limits of External Support'
body: China, Iran, and North Korea keep Russia’s war machine supplied, but Moscow’s institutional rigidity leaves much of that aid unused. New CSIS analysis shows why Russia—unlike Ukraine—cannot convert partner support into battlefield power without reforms it refuses to make.
