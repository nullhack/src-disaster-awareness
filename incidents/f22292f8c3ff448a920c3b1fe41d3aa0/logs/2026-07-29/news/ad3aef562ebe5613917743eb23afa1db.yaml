title: As imperialist wars converge, Ukraine strikes Iranian cargo ship in the Caspian Sea
body: Ukraine struck an Iranian cargo ship in the Caspian Sea on Saturday claiming it was carrying drone and missile cargo destined for Russia. Iran threatened retaliation, and Russia said it was a commercial vessel carrying civilian cargo.
