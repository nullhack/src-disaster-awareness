title: How deadlock in the Ukraine war is crippling global food prices - AOL
body: 'IN FOCUS: Two of the world’s largest exporters of grain, locked in war for more than four years, have seen exports plunge even further over the last year. Prolonged conflict around the Black Sea threatens both economies - and those most in need, writes James C. Reynolds'
