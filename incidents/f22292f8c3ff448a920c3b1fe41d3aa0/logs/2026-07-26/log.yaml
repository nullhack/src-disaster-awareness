log_date: '2026-07-26'
summary: |-
  President Zelenskiy stated Russia aims to bring 30,000 North Korean troops into the conflict, as Kazakhstan's president called for a freeze of the war alongside Putin. Airstrikes continue, with a baby killed by a drone in the Moscow region and a Russian satellite site reportedly hit, while Ukraine's strikes on Wildberries warehouses persist. Separately, Zelensky and Netanyahu are set for back-to-back Trump meetings in Washington following a funeral, signaling potential diplomatic moves.
  Ukrainian attacks continued to target Wildberries warehouses, causing further disruptions to Russia's largest online retailer. Russia launched a major attack on Kyiv, sparking fires in multiple districts, while Iran blamed Ukraine for an attack on a vessel. Additionally, President Zelenskyy reiterated that Russia plans to bring 30,000 more North Korean troops into the conflict, and Kazakhstan's president urged Putin to freeze the war.
  Ukraine faces a political crisis as a tech-savvy defense minister without military experience is under scrutiny, highlighting internal tensions. Russia launched kamikaze drone strikes on Ukrainian ships in the Black Sea, while a search continues for two missing Indian nationals after a vessel was struck at Odesa port.
  Ukraine continued striking Russia's Wildberries warehouses, exacerbating economic disruption for small businesses. A Russian drone was shot down over Romania for the third time in days, and Iran formally warned Ukraine after an attack on an Iranian commercial vessel in the Caspian Sea. Meanwhile, two Indian nationals remain untraced following a port strike on the MV AGN Ragnar at Odesa, as Black Sea shipping risks escalate.
