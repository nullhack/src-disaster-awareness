log_date: '2026-08-29'
summary: On August 27, Ukrainian presidential chief of staff Kyrylo Budanov stated that talks between Ukrainian and Russian teams could be held in September, potentially including U.S. representatives. Meanwhile, Russian drones continued battering Ukraine's Kyiv region for a second day, hitting residential apartments and warehouses, amid escalating attacks on the power grid. Updated independent counts show 242,750 Russian military deaths confirmed by August 28.
