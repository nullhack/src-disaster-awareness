title: 'Ukraine Violated Terms, Used Starlink For Drone Strikes To Kill: Elon Musk Says Loophole Closed'
body: Elon Musk claimed Ukraine violated Starlink terms by using civilian service for offensive drone strikes to kill people and the loophole was closed last week, but Starlink remains critical to defence and front line would collapse immediately if turned off.
