log_date: '2026-10-25'
summary: |-
  US-Ukraine ties worsened as Trump publicly slighted Zelenskyy, while Melania Trump's ceasefire role sparked controversy after her aide insisted she single-handedly brokered the deal. Elon Musk accused Kyiv of violating Starlink rules, and the DHS extended work permits for Ukrainian TPS holders.
  Elon Musk admitted SpaceX restricted Ukraine's Starlink access, accusing Kyiv of violating terms by using the service for drone strikes, and stated the front line would collapse without Starlink; Ukraine reported that normal operating speeds have been restored. Bulgaria held a presidential election dominated by the economic fallout and drone attacks on Black Sea shipping linked to the war. The Kremlin reiterated the need for dialogue with the European Union on a settlement and criticized Brussels for failing to appoint a negotiator.
