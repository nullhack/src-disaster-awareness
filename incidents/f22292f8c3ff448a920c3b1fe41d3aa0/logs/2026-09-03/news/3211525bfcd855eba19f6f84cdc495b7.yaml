title: Bessent partly blames Ukraine for ‘energy shock’ pushing up prices
body: Treasury Secretary Scott Bessent on Wednesday partially blamed Ukraine for the “energy shock” caused by the Iran war and Russia’s 4 1/2-year war with the Eastern European country. Bessent appeared on “Fox & Friends” with co-host Brian Kilmeade and said the Trump administration’s trade war with Canada will have “virtually no impact on American prices.”…
