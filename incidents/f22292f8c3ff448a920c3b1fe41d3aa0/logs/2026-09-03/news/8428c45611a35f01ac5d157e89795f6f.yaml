title: Bessent Blames High Energy Prices on Ukraine’s Russia Strikes
body: Treasury Secretary Scott Bessent said Ukrainian drone strikes on Russian energy facilities were one reason for rising global energy prices, citing those attacks before mentioning the war against Iran when asked about the elevated cost of living in the US.
