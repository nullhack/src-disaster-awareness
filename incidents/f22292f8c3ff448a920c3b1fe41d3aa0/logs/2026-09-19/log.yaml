log_date: '2026-09-19'
summary: President Trump signed the Lindsey O. Graham Sanctioning Russia and Iran Act, imposing stricter sanctions and tariffs on Russian oil purchasers. As Russia opened three-day parliamentary elections, Ukraine launched over 350 drones at Moscow, and Putin accused Kyiv of election interference. A UN report documented 1,004 sexual violence cases since 2022, with 89% linked to Russia, while a Russian double-tap drone strike on Odesa injured 10, including rescuers.
