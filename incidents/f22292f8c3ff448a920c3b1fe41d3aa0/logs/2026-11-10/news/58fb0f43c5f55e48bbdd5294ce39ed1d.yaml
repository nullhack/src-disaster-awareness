body: ന്യൂഡൽഹി ∙ റഷ്യ–യുക്രെയ്ൻ യുദ്ധത്തിനു സമാധാനപരമായ പരിഹാരം കാണാനുള്ള എല്ലാ ശ്രമങ്ങളിലും പങ്കാളിയാകാൻ ഇന്ത്യ സന്നദ്ധമാണെന്നു പ്രധാനമന്ത്രി നരേന്ദ്ര
