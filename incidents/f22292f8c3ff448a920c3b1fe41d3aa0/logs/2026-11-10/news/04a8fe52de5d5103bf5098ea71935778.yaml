title: 9 Zimbabweans Arrested In South Africa Over Alleged Russia-Ukraine War Recruitment
body: South Africa has arrested nine Zimbabweans accused of planning to join the Russia-Ukraine war. The suspects appeared in two Gauteng courts as Zimbabwe's government warns about recruitment agents.
