log_date: '2026-11-10'
summary: US-brokered peace talks between Russia and Ukraine are set to begin in Abu Dhabi on November 10, the first such negotiations since February, with President Trump expressing optimism about a possible broad deal. Leaked Russian mortality data suggests nearly 393,000 war-related deaths since 2022, while Russia continues to develop advanced drones and antipersonnel mines. Meanwhile, India offered to mediate, China called for de-escalation, and European allies pressed for inclusion in the negotiations.
