log_date: '2026-09-25'
summary: Russian drone strikes destroyed Kyiv data centers, silencing air raid alerts for 100,000 homes. ArcelorMittal halted operations at its Kryvyi Rih plant due to missile strikes, expecting a $1 billion impairment charge, while Ferrexpo reported a steep revenue drop from the war. Finland and Sweden scrambled jets to intercept Russian military aircraft in their first joint operation.
