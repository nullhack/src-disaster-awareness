title: Why Zelensky is Not Thrilled as U.S. Approves $2.1B Sale of 500 Patriot PAC-3 MSE Missiles to Ukraine?
body: The U.S. has approved the sale of 500 Patriot interceptor missiles to Ukraine, the State Department said, but Ukrainian President Volodymyr Zelensky doesn’t appear to be too thrilled. “The U.S. Department of State has made a determination approving a possible Foreign Military Sale to the Government of Ukraine for the purchase of PATRIOT Advanced Capability-3 […]
