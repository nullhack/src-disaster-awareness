title: G20 photo scrapped amid tensions over Russian foreign minister’s presence | CNN Politics
body: The G20 foreign ministers meeting kicked off in Atlanta on Friday without a “family photo” after numerous representatives were expected to walk out rather than be pictured alongside Russian Foreign Minister Sergey Lavrov.
