title: US scraps G20 photo after European diplomats object to being pictured with Russia's Lavrov - WCCB Charlotte
body: Top diplomats from the Group of 20 largest world economies have opened two days of meetings in Atlanta after European objections to Russia’s participation forced the U.S. to cancel a photo of the foreign ministers. That underscored deep rifts among the group over global crises that threaten international security and trade, such as Russia' war in Ukraine.
