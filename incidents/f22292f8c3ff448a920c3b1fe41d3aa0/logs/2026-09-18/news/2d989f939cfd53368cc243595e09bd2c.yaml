title: 'Ukraine has frozen funding for "resilience plans": EADaily'
body: EADaily, September 17th, 2026. The Ministry of Finance of Ukraine postponed to December 2026 UAH 39 billion of capital expenditures, which were planned to be allocated in September — November. This was stated by the head of the Verkhovna Rada Budget Committee Roksolana Pidlas.
