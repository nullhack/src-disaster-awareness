log_date: '2026-09-18'
summary: |-
  Russia damaged a bridge in Odesa region crucial for grain exports, significantly limiting Ukraine's grain shipping capacity. Explosions near the Polish border forced two airports to shut during daytime attacks. Meanwhile, Ukraine froze 39 billion hryvnia in capital expenditures as a budget crisis looms.
  Russian parliamentary elections began on September 18, with Putin presenting them as a measure of support for the war, and voting extended to occupied Ukrainian territories. The IAEA confirmed a drone strike damaged a cooling tower at Russia's under-construction Kursk-II nuclear plant, while the EU announced €3.3 billion in aid to Ukraine and Canada joined a €90 billion support loan. Additionally, Russia seized Nestlé's assets, Poland warned of Russian hybrid attacks on NATO allies, and both sides escalated the energy war.
