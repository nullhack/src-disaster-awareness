title: NATO Confronts Growing Black Sea Threat as Drone Attacks Target Commercial Shipping - https://eutoday.net
body: France has deployed a maritime patrol aircraft to Romania following a series of attacks on civilian vessels near NATO territory. The escalating threat has prompted closer cooperation between Romania, Bulgaria and Turkey, raising questions about maritime security and the protection of Europe's eastern flank.
