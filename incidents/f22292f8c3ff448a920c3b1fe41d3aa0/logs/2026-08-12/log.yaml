log_date: '2026-08-12'
summary: The United Nations estimates over 16,000 Ukrainian civilians remain detained by Russia amid torture claims, as Ukraine faces a grain storage crisis with ports blocked by Russian attacks and Danube export routes failing, threatening a November storage crunch. Separately, Russia is reportedly preparing a "final push" for the fall, while President Zelenskyy confirmed Ukraine has handed proposals to US negotiators for ending the war.
