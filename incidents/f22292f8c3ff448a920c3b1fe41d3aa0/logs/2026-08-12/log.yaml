log_date: '2026-08-12'
summary: |-
  The United Nations estimates over 16,000 Ukrainian civilians remain detained by Russia amid torture claims, as Ukraine faces a grain storage crisis with ports blocked by Russian attacks and Danube export routes failing, threatening a November storage crunch. Separately, Russia is reportedly preparing a "final push" for the fall, while President Zelenskyy confirmed Ukraine has handed proposals to US negotiators for ending the war.
  President Zelenskyy confirmed that Ukraine has handed proposals to U.S. negotiators for ending the war with Russia. The UN estimated over 16,000 Ukrainian civilians remain detained by Russia amid torture claims, while Ukraine's grain storage faces a November crisis as Russian attacks block Black Sea ports and Danube export routes fail. Meanwhile, Ukraine continued its campaign of long-range strikes, bombing a Russian naval base and targeting Wildberries, while Kyiv stopped reporting Russian missile data as air defenses struggle.
