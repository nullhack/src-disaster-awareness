log_date: '2026-11-28'
summary: President Trump said he asked Vladimir Putin to “pull back” military aggression throughout Europe and claimed Putin wants a peace agreement, while Ukrainian President Volodymyr Zelenskyy called Trump’s reference to Putin as a “friend” strange and urged Washington to pressure Moscow. The White House said Melania Trump helped reunite nine Ukrainian children with relatives on Thanksgiving. Reports also said damage to the Crimean Bridge has forced Russian tourists to take a 390-mile route through occupied southern Ukraine.
