title: Donald Trump says Putin wants peace deal to end war in Ukraine
body: Donald Trump stated that Vladimir Putin wants a peace agreement to end the Ukraine war, highlighting mutual hatred with Zelenskyy as the main obstacle. He defended his diplomacy and discussed talks with China's Xi Jinping on trade and security issues.
