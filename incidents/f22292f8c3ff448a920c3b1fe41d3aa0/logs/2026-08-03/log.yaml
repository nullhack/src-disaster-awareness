log_date: '2026-08-03'
summary: |-
  On August 1, Ukrainian drones struck all three Bashneft oil refineries in Ufa simultaneously, marking a new deep-strike achievement. Russia retaliated with a strike on a Kharkiv postal terminal, killing one person. Meanwhile, Ukraine continued its drone campaign against Moscow and Wildberries warehouses.
  Ukraine hit Wildberries again and launched a first-of-its-kind sea drone attack on Russian radar systems. President Zelenskyy requested 300 Patriot interceptors from the US, while Rustem Umerov was appointed spy chief with a drone coalition mandate. A Russian attack in Dnipropetrovsk killed three, and a man opened fire on draft officers in Odesa.
