title: 'Almost no locomotives left: How Russia''s strikes are choking Ukraine''s lifeline'
body: Ukraine is seeking locomotives and funds as Russian strikes hammer its railways, ports and industry. The damage is choking exports, shrinking tax revenue and raising the cost of sustaining the war.
