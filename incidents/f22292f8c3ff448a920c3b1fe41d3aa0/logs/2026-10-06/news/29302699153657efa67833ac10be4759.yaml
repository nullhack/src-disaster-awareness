title: 'After Moscow’s nuclear warnings: Merz intensifies Germany’s war offensive in Kiev'
body: Only days after Russia again threatened NATO with the use of nuclear weapons and President Vladimir Putin warned of a “fatal point of no return,” German Chancellor Friedrich Merz traveled to Kiev on Sunday to further expand Germany’s involvement in the Ukraine war.
