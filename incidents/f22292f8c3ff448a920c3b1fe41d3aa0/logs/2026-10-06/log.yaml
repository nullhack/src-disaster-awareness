log_date: '2026-10-06'
summary: Ukraine claimed its long‑range drone strikes have destroyed more than half of Russia’s oil refining capacity, with Putin admitting the attacks cost Russia about 1% of GDP. A Russian drone strike on an Indian‑owned pharmaceutical plant in Ukraine killed one person, while repeated strikes on railways left Ukraine “almost no locomotives” and worsened the economic crisis. Diplomatically, India sought a larger role in peace efforts as Zelensky hailed its ceasefire plan, and Germany’s intelligence chief warned of a growing risk of violent conflict with Russia.
