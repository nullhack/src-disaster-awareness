title: Romania’s new government takes office amid war escalation, austerity and political crisis
body: The nomination will do nothing to solve the political and institutional crisis that has gripped the Eastern European country in recent years. Fundamentally, the country’s ruling elite is committed to NATO’s war against Russia and a massive rearmament campaign, while imposing sweeping austerity measures on the working class amid a deepening fiscal and economic crisis.
