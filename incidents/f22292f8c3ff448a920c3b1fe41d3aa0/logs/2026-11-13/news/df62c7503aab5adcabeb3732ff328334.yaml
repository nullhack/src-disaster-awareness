title: 'Europe Continues to Fund Both Sides of the War: EU’s Russian LNG Bill Already Tops 2025 Total Ahead of January 2027 Ban - Energy News Beat'
body: 'With roughly 50 days remaining until the European Union’s full ban on Russian LNG imports takes effect on January 1, 2027, the bloc has already spent more on Russian liquefied natural gas this year than it did in all of 2025. German campaign group Urgewald, analyzing Kpler vessel-tracking data, estimates that EU ports received 12.89 million tonnes of LNG from Russia’s Yamal project between January and October 2026 across 177 cargoes. The estimated bill: €8.7 billion ($9.6 billion)—about 21% higher than the €7.2 billion estimated for the full year of 2025'
