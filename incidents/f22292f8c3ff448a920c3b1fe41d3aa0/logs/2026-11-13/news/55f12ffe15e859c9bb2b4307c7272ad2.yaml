title: Europe to send a diplomat team to Ukraine talks as leaders push for a voice
body: DUBLIN (AP) — Europe will send a team of diplomats from the European Union and five individual countries to the next round of Ukraine talks, a top EU official said Friday after a summit focused on how to avoid being shut out of U.S.-led negotiations on ending the nearly five-year war.
