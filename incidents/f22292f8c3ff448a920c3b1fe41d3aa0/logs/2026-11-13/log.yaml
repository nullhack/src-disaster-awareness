log_date: '2026-11-13'
summary: |-
  US envoys Witkoff and Kushner met Putin in Moscow and then briefed Zelensky in Ireland, with Kushner stating the US is working toward the largest prisoner exchange of the war. Europe pushes for a seat at negotiations but lacks a unified voice, Macron says there is "no more US support" for Ukraine, and Russia proposes bilateral non‑aggression pacts with individual NATO states. Ukraine reports new Starshield curbs which Musk denies, while the EU's 2026 spending on Russian LNG has already topped the 2025 total.
  U.S.-mediated talks in Abu Dhabi produced no breakthrough but a large prisoner swap was agreed, with Kushner saying Russia and Ukraine are working toward the largest exchange of the war. Bombings in Moscow and St. Petersburg killed a Russian military officer and injured a Ukrainian adviser, while Russia agreed to include Europe in future peace talks. Separately, Ukraine faces renewed Starlink disruptions and is racing to repair power plants damaged by Russian strikes ahead of winter.
