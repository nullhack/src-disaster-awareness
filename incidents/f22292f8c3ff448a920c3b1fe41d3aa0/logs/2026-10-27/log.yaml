log_date: '2026-10-27'
summary: |-
  A local ceasefire brokered by Melania Trump began in Oleshky, but Russia struck Kyiv with ballistic missiles hours before the truce. Trilateral talks between Russia, the US, and Ukraine are planned for November in Abu Dhabi, though Moscow stated the talks will not restrict its military offensive. Meanwhile, Zelenskyy urged unblocking Patriot missile deliveries after strikes killed at least four, and Ukraine is teaching NATO forces about modern warfare.
  The localized ceasefire in Oleshky took effect amid a dispute over whether First Lady Melania Trump or the Pope brokered the deal. Separately, Russia freed a U.S. citizen during peace talks with Trump envoy Steve Witkoff, and the leaders of Finland and Norway made a rare direct call to Putin urging an end to the war.
