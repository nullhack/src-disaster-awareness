log_date: '2026-10-27'
summary: A local ceasefire brokered by Melania Trump began in Oleshky, but Russia struck Kyiv with ballistic missiles hours before the truce. Trilateral talks between Russia, the US, and Ukraine are planned for November in Abu Dhabi, though Moscow stated the talks will not restrict its military offensive. Meanwhile, Zelenskyy urged unblocking Patriot missile deliveries after strikes killed at least four, and Ukraine is teaching NATO forces about modern warfare.
