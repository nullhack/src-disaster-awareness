title: 'Explainer: Will new Russia-Ukraine talks deliver peace?'
body: MOSCOW, Oct. 23 (Xinhua) -- Trilateral talks between Russia, the United States and Ukraine are planned to be held in Abu Dhabi, the capital of the United Arab Emirates, in the first half of November, with a focus on security issues after a peace settlement, Kremlin Spokesman Dmitry Peskov said Friday.
