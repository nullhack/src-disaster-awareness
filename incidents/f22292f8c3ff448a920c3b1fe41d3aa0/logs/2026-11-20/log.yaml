log_date: '2026-11-20'
summary: The APEC summit in Shenzhen between Trump, Putin and Xi concluded without moving the sides' core positions on the war, while U.S. envoy Jared Kushner said in Berlin that Russia is "comfortable" with NATO-like security guarantees for postwar Ukraine. After Putin met Trump, Moscow fired more than 110 missiles, including 27 ballistic ones, and over 400 drones at Ukraine, and two Russian Kh-101 missiles plus a drone came down in Poland, which called it an intentional provocation and said it would request NATO support. UNICEF also reported that child deaths and injuries in Ukraine this year have climbed to near-2022 levels.
