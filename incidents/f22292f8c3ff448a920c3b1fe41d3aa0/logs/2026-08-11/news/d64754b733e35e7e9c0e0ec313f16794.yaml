title: ‘Ukraine and Iran wars call for a new military training and operational module’-Australian Expert - Opinion | Daily Mirror
body: The ongoing Russia-Ukraine and US-Iran wars have exposed weaknesses in Western militaries relative to those of Ukraine, Russia and Iran. They have failed to think innovatively, creatively and quickly enough to meet evolving battlefield challenges, according to Maj. Gen. Mick Ryan of the Australian think tank the Lowy Institute. ..
