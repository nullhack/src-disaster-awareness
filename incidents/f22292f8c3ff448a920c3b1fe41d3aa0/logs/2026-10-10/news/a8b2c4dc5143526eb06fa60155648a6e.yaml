title: US Report Alleges Kenyan Officials Worked With Russia to Recruit Over 1,000 Citizens
body: A US government report alleges that some Kenyan officials worked with recruitment agencies and Russian authorities in a scheme that sent more than 1,000 Kenyans to serve in Russia’s military during the war in Ukraine. The US Department of State’s latest Trafficking in Persons report states that some Kenyans were recruited through promises of well-paid jobs in construction and private security. However, some reportedly ended up under pressure to sign contracts linked to Russia’s Ministry of Defence.
