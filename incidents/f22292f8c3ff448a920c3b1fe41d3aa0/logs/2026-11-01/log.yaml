log_date: '2026-11-01'
summary: US Secretary of State Rubio stated there is growing international interest in a limited Black Sea ceasefire and that Washington is reviewing proposals from Turkey and India to resume grain shipments. At the G20 in Atlanta, the group photo was canceled due to European objections to Russia, and Russia's Lavrov said Zelenskyy's comments are hindering peace talks. Meanwhile, evacuees from the Oleshky humanitarian ceasefire reached Belarus, and Indian Foreign Minister Jaishankar discussed the Ukraine conflict with his Russian, Polish, and South Korean counterparts.
