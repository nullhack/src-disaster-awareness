title: 'Russian missile attack kills five in UkrainePublished on: September 5, 2026 6:12 PM'
body: Pakistan, Sept. 5 -- A Russian ballistic missile strike killed five people at a steel plant in Ukraine's Dnipro region. Ukrainian officials said the attack targeted the industrial facility. The strike also forced the plant to halt its operations.
