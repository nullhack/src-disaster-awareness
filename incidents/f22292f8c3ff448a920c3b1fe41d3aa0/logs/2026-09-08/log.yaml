log_date: '2026-09-08'
summary: U.S. envoys Steve Witkoff and Jared Kushner held talks with Putin in Moscow and then with Zelenskyy in Kyiv, with advisers from Germany, France, and Britain joining the final hour of the Kyiv meeting. While Russia left the door open to further peace talks, Putin ordered a brief pause in strikes on Kyiv during the visit, but Russia resumed ballistic missile attacks on the capital shortly after the envoys departed, killing two people. Additionally, reports emerged that the United States demanded Ukraine end the war by winter, cornering Zelenskyy.
