log_date: '2026-09-08'
summary: |-
  U.S. envoys Steve Witkoff and Jared Kushner held talks with Putin in Moscow and then with Zelenskyy in Kyiv, with advisers from Germany, France, and Britain joining the final hour of the Kyiv meeting. While Russia left the door open to further peace talks, Putin ordered a brief pause in strikes on Kyiv during the visit, but Russia resumed ballistic missile attacks on the capital shortly after the envoys departed, killing two people. Additionally, reports emerged that the United States demanded Ukraine end the war by winter, cornering Zelenskyy.
  U.S. special envoy Steve Witkoff touted "substantive progress" after peace talks with Russia and Ukraine, and President Trump held a phone call with Putin pushing for a swift end to the war. Ukrainian President Zelensky stated that negotiators could meet again as early as September for talks. Despite diplomatic efforts, Russian attacks killed at least three in Ukraine, and Ukraine struck a sanctioned Russian weapons ship near Crete, while the UK announced a £100 million investment for Ukraine's winter defenses.
