title: Putin assures Trump that Moscow doesn’t have aggressive plans toward Europe, Kremlin says
body: Russian President Vladimir Putin assured U.S. President Donald Trump in a phone call Tuesday that Moscow doesn't harbor aggressive intentions toward Europe, a senior Kremlin official said, after European officials blamed Moscow for sabotage campaigns on their soil. ...
