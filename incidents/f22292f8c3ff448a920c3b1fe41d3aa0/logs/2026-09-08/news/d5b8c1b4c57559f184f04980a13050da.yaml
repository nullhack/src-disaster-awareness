title: Trump pushes Putin for swift end to Ukraine war in 1-hour call after envoys' visit
body: Kremlin foreign affairs adviser Yuri Ushakov described the Trump-Putin conversation as "constructive and frank". He said Trump made clear that he wanted the war to end as quickly as possible and that Putin briefed the US president on developments on the battlefield.
