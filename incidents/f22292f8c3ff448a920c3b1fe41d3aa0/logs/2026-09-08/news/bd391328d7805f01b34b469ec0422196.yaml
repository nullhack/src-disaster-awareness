title: Negotiators may meet again soon for talks - Zelensky
body: Russian, Ukrainian and US negotiators could meet as early as this month for talks on finding an end to the war, Ukrainian President Volodymyr Zelensky said, hours after Moscow pounded Kyiv with missiles and drones.
