log_date: '2026-08-02'
summary: On August 1, 2026, Russian ballistic missiles and drones struck Kyiv, killing at least nine civilians and wounding 33, hours after Ukrainian drones sank a large Russian container ship in the Black Sea. The attack came as reports highlighted a "mega-war" merging the Ukraine and Iran conflicts, with Ukraine having struck Iranian ships in the Caspian Sea in prior days. Meanwhile, Ukrainian President Zelenskyy discussed bilateral cooperation with UAE President Sheikh Mohamed bin Zayed Al Nahyan.
