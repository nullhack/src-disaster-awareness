title: Russia hits Ukrainian capital with ballistic missiles and drones, killing at least 9
body: KYIV, Ukraine (AP) — Russia launched an intense barrage of ballistic missiles and drones overnight into Saturday, killing at least nine people and wounding 33 civilians in the Ukrainian capital, Kyiv, authorities said.
