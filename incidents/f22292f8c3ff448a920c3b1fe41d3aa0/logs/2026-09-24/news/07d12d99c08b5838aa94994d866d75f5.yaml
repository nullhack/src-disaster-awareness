title: Russian strikes kill 8 in Ukraine as the UN debates how to end the war
body: Officials say that Russian drone and missile attacks on Ukraine have killed at least eight civilians. The strikes hit the Kharkiv and Odesa regions and the capital Kyiv. Ukrainian President Volodymyr Zelenskyy has urged countries to impose sanctions and trade bans on Russia to cut off its revenue. Despite ongoing diplomatic efforts, there is no sign of an end to the conflict. Russian strikes continue to target civilian areas, keeping residents on edge. Meanwhile, Ukrainian drones have struck targets in western Russia. The conflict has severely impacted global food and energy supplies and strained Russia's relations with Western countries.
