title: Zelenskyy urges stronger pressure on Russia, warns war’s impact is spreading beyond Ukraine
body: Ukrainian President Volodymyr Zelenskyy on Wednesday called for intensified pressure on Russia to end its war against Ukraine, arguing that Moscow continues to incur massive losses while prolonging a conflict whose consequences are increasingly being felt far beyond the battlefield.
