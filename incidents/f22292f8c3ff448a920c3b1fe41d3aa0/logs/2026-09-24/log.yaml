log_date: '2026-09-24'
summary: Russian drone attacks on Kyiv killed 2 and wounded 41, with separate strikes across Ukraine killing at least 7. At the UN General Assembly, President Zelenskyy warned that Russia is recruiting citizens from 47 countries, including India, and called for intensified pressure on Moscow. Diplomatic developments included Ukraine signaling readiness for a Black Sea truce, U.S. Secretary of State Rubio discussing a limited ceasefire and new tariff powers on Russian oil buyers, and Ukraine's foreign minister meeting with his Iranian counterpart to keep tensions low.
