log_date: '2026-08-18'
summary: On August 15-16, Ukraine launched a record 822-drone attack on Russia, striking Moscow's largest Wildberries warehouse and other targets, killing at least six people across Russia. Escalating strikes killed 19 people across both countries, including six in Belgorod from a Ukrainian missile attack. Meanwhile, Russian state development bank VEB fired chief economist Andrei Klepach after he warned Russia is losing the war of attrition, and Poland's defense minister stated the country is preparing for war with Russia.
