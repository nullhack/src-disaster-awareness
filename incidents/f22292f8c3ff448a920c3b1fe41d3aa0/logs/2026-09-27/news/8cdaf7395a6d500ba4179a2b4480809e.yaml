title: West Asia War, Two-State Solution Call, Ukraine Conflict at UN General Assembly
body: A news bulletin reports on statements delivered at the United Nations General Assembly regarding conflicts in West Asia and Ukraine. The address emphasised that lasting peace in West Asia requires a two-state solution, while highlighting India's ongoing humanitarian relief assistance for the Palestinian people. The statement condemned attacks on commercial shipping and seafarers in international waterways, urging restraint, de-escalation, civilian protection, and the uninterrupted movement of commerce and energy. Highlighting the Ukraine conflict, the statement reiterated that endless war must give way to an end to war, with calls to address food and energy security. Network correspondent Pranay Upadhyay observed India's diplomatic efforts at the United Nations to counter supply disruptions impacting the Global South.
