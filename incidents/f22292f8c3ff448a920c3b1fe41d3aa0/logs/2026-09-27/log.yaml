log_date: '2026-09-27'
summary: Overnight strikes between Russia and Ukraine left at least 16 people dead across both countries over the past 24 hours. U.S. President Donald Trump urged Ukrainian President Volodymyr Zelensky to settle the conflict with Russia, while Russian Foreign Minister Sergei Lavrov accused Europe of obstructing peace negotiations. At the United Nations General Assembly, India’s External Affairs Minister S. Jaishankar warned that conflicts such as the war in Ukraine are penalizing distant nations and called for safe shipping and secure energy supplies.
