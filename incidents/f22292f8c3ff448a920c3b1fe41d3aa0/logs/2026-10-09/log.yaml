log_date: '2026-10-09'
summary: Russian strikes on Kramatorsk killed at least 33 people – the deadliest single attack this year – while Ukraine struck the Omsk oil refinery deep inside Russia. Reports detail a humanitarian catastrophe in Russian-occupied Oleshky, where residents are trapped without food, electricity, or medicine. Separately, at least 84 Kenyans have been killed or remain missing in the conflict, and Trump envoys plan to pitch fresh ideas for peace ahead of U.S. midterms.
