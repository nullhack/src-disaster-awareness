log_date: '2026-07-27'
summary: |-
  Iran formally warned Ukraine of retaliation after a deadly Ukrainian strike on an Iranian commercial vessel in the Caspian Sea. India issued a travel advisory following a vessel strike at Odesa port that affected Indian nationals. In Russia, reports indicate Putin may be preparing to mobilize up to 500,000 additional troops amid falling public opinion, while Ukraine's drone strikes continued targeting Russia's Wildberries online marketplace to disrupt the economy. President Zelenskyy is scheduled to visit Britain for talks with Prime Minister Andy Burnham.
  A missile strike in Kharkiv killed 1 and injured 16. President Zelenskyy visited Britain to meet with new Prime Minister Andy Burnham, who signaled continued support for Ukraine.
  Ukraine achieved its first confirmed air-to-air kill with an F-16, destroying a Russian aircraft. Meanwhile, the Pentagon acknowledged that US industry is years behind matching Ukraine's wartime drone production output. Ukraine's Foreign Minister also extended condolences to India over the loss of seafarers in a Black Sea vessel strike.
