log_date: '2026-08-21'
summary: Russia launched a massive hypersonic missile and drone attack on Kyiv, killing at least 12 people, while NATO scrambled jets amid the escalation. Belarusian President Lukashenko announced he would send 500 troops to the border with Ukraine for military training. Meanwhile, the protests in Ukraine over ousted Defense Minister Fedorov have ended as his political gamble against Zelensky backfired, and Black Sea disruption continues to support global grain prices.
