log_date: '2026-11-21'
summary: Direct Relief reported sending critical medications to Ukraine as part of 802 medical aid shipments, while Russia demanded an explanation from the Netherlands over Destinus’s activities in Ukraine tied to its Ruta missiles and Da Vinci drones. A new Pew Research poll found two-thirds of Americans disapprove of President Trump’s handling of the Russia-Ukraine war. In Berlin, European allies backed President Zelenskyy’s refusal to cede land, and the Kremlin revived prewar demands while embracing a U.S. offer to discuss postwar European security.
