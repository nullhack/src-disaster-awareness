title: 'Politico: The European Union is developing a plan to accept Ukraine into its membership: EADaily'
body: EADaily, September 28th, 2026. The European Union is developing proposals according to which Ukraine, Moldova, Montenegro and Albania will be presented with a clear step-by-step action plan on the way to EU membership, Politico reports citing two high-ranking officials of the European Commission.
