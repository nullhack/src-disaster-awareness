log_date: '2026-09-28'
summary: |-
  Russian strikes continue to kill civilians across Ukraine, with reports of 5 to 8 dead in separate attacks, while President Zelenskyy accuses Moscow of terrorizing the population. Diplomatic developments include President Trump declining to confirm whether Ukraine can manufacture Patriot missiles and urging Zelenskyy to settle, and the European Union developing a step-by-step plan for Ukraine’s EU membership. Additionally, a Russian drone damaged the Saudi ambassador’s residence in Ukraine, and NATO states Lithuania and Poland are preparing evacuation plans for a potential Russian attack.
  A Russian drone strike on Kyiv's science academy killed five and also damaged Kyivstar's telecom network. President Putin demanded the Russian army grow to 2.5 million troops, while Ukraine deployed drones to deliver humanitarian aid to Russian-occupied Oleshky. Separately, Seoul demanded an apology after Zelenskyy revealed North Korean prisoners of war were sent to South Korea, and Milrem confirmed it will deliver over 150 unmanned ground vehicles to Ukraine.
