summary: Russian strikes continue to kill civilians across Ukraine, with reports of 5 to 8 dead in separate attacks, while President Zelenskyy accuses Moscow of terrorizing the population. Diplomatic developments include President Trump declining to confirm whether Ukraine can manufacture Patriot missiles and urging Zelenskyy to settle, and the European Union developing a step-by-step plan for Ukraine’s EU membership. Additionally, a Russian drone damaged the Saudi ambassador’s residence in Ukraine, and NATO states Lithuania and Poland are preparing evacuation plans for a potential Russian attack.
