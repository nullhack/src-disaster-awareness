log_date: '2026-10-30'
summary: |-
  The UN warned of a winter emergency in Ukraine, with temperatures potentially dropping to -20°C, and is seeking $50 million to help vulnerable families as Russian attacks target energy infrastructure. Separately, NATO allies fear that President Trump may delay Patriot missile deliveries to Ukraine until after the US midterm elections, raising concerns about Kyiv's air defense capabilities.
  Ukraine has temporarily paused strikes on Russian oil refineries following pressure from President Trump, marking a major shift in its long-range campaign. Russia continues escalating attacks, ramping up daytime strikes on civilian infrastructure and killing 14 in Dnipro, while the IAEA reported a strike on the Slavutych substation. Diplomatic tensions also flared as the US scrapped the G20 photo over objections to posing with Russia’s Lavrov.
