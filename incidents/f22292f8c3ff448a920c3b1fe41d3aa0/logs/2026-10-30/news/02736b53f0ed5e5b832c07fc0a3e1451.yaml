title: Over 250 Colombians killed in Russia-Ukraine war, govt says - Jamaica Observer
body: BOGOTA, Columbia (AFP) — Over 250 Colombians have died and almost 1,000 have disappeared while fighting in the Russia-Ukraine war, the South American country&#039;s foreign ministry reported Thursday. Colombian nationals are sought in fighting around the world due to their extensive experience of armed combat, and thousands have been pulled into this conflict. In Ukraine, 162 Colombians had died and 666 had disappeared, while on the Russian side, 94 had...
