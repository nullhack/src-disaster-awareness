title: 'The European Commission: Nord Stream will never resume its work: EADaily'
body: EADaily, October 29th, 2026. The Nord Stream gas pipeline will not resume Russian gas supplies to Europe even after the conflict on the Ukraine. This was stated by the representative of the European Commission Paula Pinho.
