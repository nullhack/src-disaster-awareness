log_date: '2026-08-24'
summary: Ukraine announced a new operation to counter Russian strikes and a plan to deploy up to 1,000 AI drones per day to attack Moscow airports. President Zelensky claimed Russia is drafting 300,000 additional troops, while Russia withdrew its ambassador from Britain. Black Sea attacks continue to disrupt grain exports, driving up prices, and Norway pledged $9.2 billion in additional aid for 2027.
