title: Ukraine's Drone War Exposes An Uncomfortable Reliance On China
body: Ukraine's drone industry has boomed since Russia's invasion, but it still relies on critical Chinese components. A waiver of EU procurement rules underscores Kyiv's uncomfortable wartime dependence on Beijing.
