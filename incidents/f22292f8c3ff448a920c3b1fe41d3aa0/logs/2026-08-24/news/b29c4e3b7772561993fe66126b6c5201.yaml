title: A line has been crossed in AI warfare.
body: 'A Russian drone fitted with an Nvidia chip and guided entirely by AI killed three Ukrainian civilians in July, according to the New York Times. Though AI is already a standard feature of modern warfare, with both sides of this conflict having experimented with battlefield automation, it could mark the first time AI both guided a drone and selected a target. [Link: A Drone Killed Three Ukrainians. It Was Guided Entirely by A.I. | https://www.nytimes.com/2026/08/24/world/europe/russia-drones-autonomous-ai-kill-ukraine-war.html?partner=slack&smid=sl-share | nytimes.com]'
