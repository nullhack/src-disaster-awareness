title: Pakistan Urges UN to End Sudan Fighting, Back Ceasefire - Pakistan Today
body: At the UN Security Council, Pakistan called for an immediate and complete ceasefire in Sudan, condemned RSF aggression, urged safe humanitarian access, and stressed diplomacy over military solutions.
