log_date: '2026-08-25'
summary: UK Prime Minister Andy Burnham arrived in Kyiv on August 24, hand-carrying blueprints for Ukraine to build long-range cruise missiles, defying Russian threats. President Zelensky claimed Putin is drafting 300,000 additional troops, while a Ukrainian drone debris incident killed two children in Russia. Norway pledged over $9 billion in aid for 2027, and fuel shortages from Ukrainian strikes on Russian refineries spread to Central Asia.
