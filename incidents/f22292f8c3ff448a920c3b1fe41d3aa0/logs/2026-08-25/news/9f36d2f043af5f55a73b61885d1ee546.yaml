title: Krishnamoorthi wants U.S. to adopt wartime lessons from Ukraine, including drone usage
body: In Kyiv, the congressman visited a Ukrainian drone-defense production site — a stop that inspired him to introduce a bill that would require the Pentagon to study how Ukraine has adapted to the use of drones, including the use of unmanned systems for combat, intelligence and logistics.
