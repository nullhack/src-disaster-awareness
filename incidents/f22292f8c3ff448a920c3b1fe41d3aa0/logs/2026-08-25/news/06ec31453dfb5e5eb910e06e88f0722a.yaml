title: Exclusive-Ukraine needs changes to avoid losing war, ousted defence minister says
body: By Max Hunder KYIV, Aug 25 (Reuters) - Ukraine appears to be slowly losing the war against Russia, ousted Defence Minister Mykhailo Fedorov told Reuters, warning that Kyiv has a window of several months to make key decisions needed to turn the tide in its favour.
