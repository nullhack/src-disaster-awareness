title: Gas prices hit record highs for August as Ukraine, Iran conflicts drive costs up
body: The national average price of gasoline stood at $4.05 a gallon Monday, the highest ever recorded this late in the calendar year, as escalating geopolitical conflicts on two fronts threaten to push prices even higher heading into the Labor Day weekend.
