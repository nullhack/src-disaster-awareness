title: Putin says Ukraine opened 'Pandora's box' with strikes on economic targets
body: Aug 22 (Reuters) - Russian President Vladimir Putin said in comments published on Saturday that Kyiv had opened "Pandora's box" with its strikes on Russian economic targets, saying that Russia would hit back at Ukraine's "most sensitive economic sectors".
