title: Trump seeks to meet Xi, Putin at China summit, discuss Iran war, denuclearisation
body: Donald Trump said he expects to meet Xi Jinping and Vladimir Putin at China's APEC summit. The proposed talks would cover the Iran war, denuclearisation and potentially the Ukraine conflict.
