log_date: '2026-11-09'
summary: |-
  A leaked Rosstat data hack suggests Russia has suffered up to 450,000 deaths in the war, making it the deadliest conflict for Russia since WWII. European nations will join US-brokered peace talks in Abu Dhabi—the first trilateral negotiations with Russia and Ukraine since February. Meanwhile, Russia continues attacking Black Sea shipping, and President Trump is seeking separate meetings with Putin and Xi at the APEC summit.
  On November 9, 2026, the U.S. confirmed it will lead three-way peace talks in Abu Dhabi between Russia and Ukraine, with a focus on security guarantees and potential territorial compromises. Ahead of the negotiations, Russia intensified strikes on Ukraine's power grid, while Ukrainian drones hit a major oil refinery; separately, hacked Rosstat data revealed that nearly 400,000–450,000 Russian soldiers have died in the conflict. Diplomatically, PM Modi spoke with President Zelenskyy to discuss India's role in peace efforts, and G7 ministers met in Paris to press for European inclusion in the talks.
