log_date: '2026-11-09'
summary: A leaked Rosstat data hack suggests Russia has suffered up to 450,000 deaths in the war, making it the deadliest conflict for Russia since WWII. European nations will join US-brokered peace talks in Abu Dhabi—the first trilateral negotiations with Russia and Ukraine since February. Meanwhile, Russia continues attacking Black Sea shipping, and President Trump is seeking separate meetings with Putin and Xi at the APEC summit.
