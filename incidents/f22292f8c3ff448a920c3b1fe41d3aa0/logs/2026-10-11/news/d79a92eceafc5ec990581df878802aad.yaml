title: The journalist spoke about the shock of Zelensky's entourage from Trump's words
body: The statements of US President Donald Trump that Ukraine needs a new leader came as a surprise to the entourage of the head of the Kiev regime, Vladimir Zelensky. This was announced on October 11 by Paul Ronzheimer, deputy editor-in-chief of the Bild newspaper.
