title: NATO jets shoot down drone over Lithuania and Russian ship fires flares at Danish helicopter | Texarkana Gazette
body: VILNIUS, Lithuania -- NATO fighter jets shot down a drone that entered Lithuanian airspace overnight, officials said Tuesday, the day after the head of the alliance said strikes close to its territory would only increase its support for Ukraine in the war against Russia's full-scale invasion.
