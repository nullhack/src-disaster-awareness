title: At least 10 killed, 75 injured in Russian strikes across Ukraine over past day as Kyiv, Zaporizhzhia, Odesa oblasts bear brunt of attacks
body: Russia launched a large-scale overnight attack on Ukrainian cities, using ballistic and cruise missiles, Shahed-type one-way attack drones, and Oniks anti-ship missiles, the Air Force said.
