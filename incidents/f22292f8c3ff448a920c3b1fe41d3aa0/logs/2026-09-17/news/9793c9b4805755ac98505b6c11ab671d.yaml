title: Russia Strikes Kyiv Injuring 10 as US House Introduces 100% Tariff Bill Over Russian Trade
body: A Russian airstrike on Ukraine's capital city, Kyiv, has left at least 10 people injured, according to reports from local authorities. The incident marks a fresh escalation in the ongoing conflict, accompanied by reports of multiple explosions across the city. The attack follows legislative moves in the United States, where the House of Representatives introduced a bill proposing 100 per cent tariffs on countries continuing trade with Russia.
