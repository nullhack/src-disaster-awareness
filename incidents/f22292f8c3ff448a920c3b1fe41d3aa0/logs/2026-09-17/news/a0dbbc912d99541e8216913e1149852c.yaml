title: Can Trump impose a 100% tariff on India? What the US Russia sanctions bill says - CNBC TV18
body: A US bill targeting buyers of Russian oil could expose India to additional tariffs if it continues buying Russian crude after the legislation becomes law, though a 100% tariff is not automatic.
