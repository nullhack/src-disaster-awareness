title: House Passes Russia Sanctions Bill | iHeart
body: The House passed the Lindsey O. Graham Sanctioning Russia and Iran Act, targeting Russia's economy amid the Ukraine conflict. The bill, now heading to President Trump's desk, allows for up to 100% tariffs on major Russian oil importers. Critics worry about expanded presidential tariff powers. | iHeart
