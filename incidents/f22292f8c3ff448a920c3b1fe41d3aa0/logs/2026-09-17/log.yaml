log_date: '2026-09-17'
summary: Russian strikes across Ukraine killed at least 10 and injured 75, while Ukrainian drone attacks shut down the Syzran and Saratov oil refineries, removing nearly 290,000 barrels per day of Russian capacity. NATO jets shot down a drone over Lithuania, and both Ukraine and Russia denied President Trump's claim of an energy truce. The U.S. House passed a sweeping sanctions bill targeting Russia and Iran.
