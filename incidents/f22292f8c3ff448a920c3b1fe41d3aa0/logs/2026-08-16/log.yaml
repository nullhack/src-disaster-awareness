log_date: '2026-08-16'
summary: |-
  Ukraine attacked industrial infrastructure in Russia's Samara region and struck a Russian oil facility and military airfield in its latest long-range strikes. Domestically, President Zelensky regained political control after a month-long crisis following the dismissal of Defense Minister Mykhailo Fedorov.
  Ukraine launched one of its largest aerial attacks of the conflict, deploying 600 drones toward Moscow and other targets, killing at least six people across Russia. Ukraine also struck industrial infrastructure in the Samara region. In response, Russia conducted airstrikes on Ukraine, hitting a steel plant and killing three people.
