title: India-Russia Bilateral Talks On SCO Sidelines Focus On Peace In Ukraine And Bilateral Ties
body: A live news broadcast detailed the bilateral meeting between Indian Prime Minister Narendra Modi and Russian President Vladimir Putin on the sidelines of the Shanghai Cooperation Organisation summit. Discussions focused on India's stance in support of peaceful efforts and diplomatic engagement to resolve the Ukrainian conflict. Key takeaways highlighted the strengthening relations between Russia and India, aided by personal engagement between both leaders, alongside a reported sixteen percent increase in tourist exchanges between the two nations in 2025. The broadcast underscored the broader geopolitical context, including the global impact of regional conflicts on wheat and fuel supplies, diplomatic optics, and international scrutiny surrounding multilateral summits.
