title: The war in Ukraine lives on in songs. According to Interpol
body: The band’s new album tells the story of a soldier killed by a drone. Before them came U2, Ed Sheeran, Pink Floyd and the Scorpions. Four years of music set against a conflict that risks becoming nothing more than an image on a screen
