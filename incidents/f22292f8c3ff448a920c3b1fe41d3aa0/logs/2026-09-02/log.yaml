log_date: '2026-09-02'
summary: |-
  President Zelensky declared Russian airspace "completely unsafe," warning airlines and passengers, prompting Putin to call the statement "state terrorism." A massive Russian missile and drone attack on Ukraine's capital region killed at least 12 people, with debris scattered after a strike on a warehouse near Kyiv on August 30.
  Russia launched strikes on Kyiv for the seventh consecutive day, wounding 11 people and damaging residential and university buildings in the capital. Separately, a papal envoy met with a Kremlin adviser to discuss humanitarian issues in Ukraine, while US Treasury Secretary Bessent faced backlash for criticizing Ukraine's strikes on Russian energy infrastructure.
