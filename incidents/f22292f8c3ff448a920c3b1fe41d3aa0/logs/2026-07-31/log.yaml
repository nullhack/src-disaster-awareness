log_date: '2026-07-31'
summary: |-
  President Trump expressed uncertainty about allowing Ukraine to build Patriot missiles, stating he was "not sure" about the idea. The European Union released $4 billion to Ukraine for drones, air defense systems, and Gripen jets, bringing total defense aid to nearly $9.8 billion.
  India's External Affairs Minister Jaishankar told Ukraine that attacks on Indian seafarers in the Black Sea, including the MV Omorfi drone strike, are unacceptable. Poland confirmed a Russian Kh-101 missile crashed on its territory, with an ongoing investigation. Ukraine's President Zelensky asked President Trump for assistance in using Starlink to target ballistic missile launchers inside Russia, while a Ukrainian drone attack set ablaze an energy facility and warehouses in Russia's Volgograd region, injuring five.
