log_date: '2026-09-11'
summary: On September 10, Amnesty International reported that Russia has been tricking vulnerable foreigners into fighting in Ukraine through fake job offers, describing the practice as human trafficking. Putin arrived in India for a three-day BRICS summit expected to include discussions on trade, defence, and Ukraine peace efforts, while Canada pledged air defense support to Ukraine during Zelenskyy’s visit. Additional coverage highlighted Ukraine’s long-range drone campaign hitting Russian industrial targets and deepening public anxiety in Russia ahead of elections.
