log_date: '2026-11-26'
summary: President Trump and NATO Secretary General Mark Rutte met at Mar-a-Lago and urged Russia to avoid any actions that would expand the war in Ukraine, with Trump saying his recent call with Putin covered Russian aggression beyond Ukraine and hoping for a quick peace deal. U.S. envoy Jared Kushner separately warned against further escalation, calling the conflict a proxy war. Ukraine said its forces struck a major Russian military base and destroyed five warplanes, while the White House announced that nine children separated by the war had been reunited with their families in an exchange assisted by Melania Trump.
