title: Trump heads into midterms short on foreign policy wins - Americas - The Jakarta Post
body: With the Iran war now at a costly standoff and crises from Ukraine to Gaza still unresolved, President Donald Trump's ambitious foreign policy agenda appears stuck as he heads into November's midterm elections.
