log_date: '2026-08-23'
summary: |-
  France pledged new interceptor missiles to Ukraine amid intensifying Russian strikes. Putin stated that Ukraine had opened "Pandora's box" with its strikes on economic targets. Russian and Ukrainian attacks killed 10 people, and a Ukrainian drone strike set a large Russian warehouse ablaze.
  A UK mercenary was sentenced in absentia in Moscow to a long prison term for fighting in Ukraine.
