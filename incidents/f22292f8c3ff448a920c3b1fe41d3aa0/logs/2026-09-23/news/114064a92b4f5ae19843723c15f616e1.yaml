title: 'From Tanks to Drones: How the War in Ukraine Has Changed NATO''s Military Priorities'
body: The full-scale war in Ukraine has forced NATO to take a fresh look at what a modern army should be like. The systems in which Western countries have invested billions of dollars over decades have not disappeared and remain important.
