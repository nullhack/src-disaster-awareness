title: Trump LIVE | US Prez addresses UNGA 2026 as Iran war, Russia-Ukraine crisis take escalating turn
body: Watch LIVE as US President Donald Trump addresses the 81st United Nations General Assembly (UNGA) in New York. His speech comes amid escalating global tensions, including the Iran war and the Russia-Ukraine conflict, along with U.S. policy toward Venezuela and tensions involving Greenland and NATO. Follow the latest developments and key moments from Trump’s UNGA 2026 address.
