log_date: '2026-09-23'
summary: At the UN General Assembly, President Zelenskyy urged President Trump to facilitate a trilateral peace meeting with Putin, while Trump invited Putin to the G20 summit in Miami and said he would use new tariff authority to end the war. Secretary of State Rubio met with Russia's Lavrov in New York and stated that Ukraine unintentionally struck American-linked oil infrastructure. Zelenskyy also claimed that Ukraine has recaptured nearly all territory Russia gained in 2026, as a UN report documented widespread sexual violence by Russian forces.
