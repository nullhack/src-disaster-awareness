title: '3 ships attacked in 48 hours: How Indian sailors are getting caught in Black Sea and Strait of Hormuz conflicts- Moneycontrol.com'
body: Three commercial vessels carrying Indian sailors came under attack in the Black Sea and Strait of Hormuz within 48 hours. Eleven Indians were injured, while 23 others were rescued from a burning tanker.
