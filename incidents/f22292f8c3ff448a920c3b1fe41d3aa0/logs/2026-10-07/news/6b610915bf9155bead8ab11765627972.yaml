title: Bulgaria's leader says drone attack hits 2 commercial vessels, and Ukraine's president blames Russia
body: Bulgaria’s prime minister says that two commercial vessels have been struck by drones in the first attack on shipping in the NATO member’s exclusive economic zone in the Black Sea. Bulgarian authorities said Tuesday that the origin of the drones was under investigation. But Ukraine’s president blamed Russia for the drone strikes. Bulgarian Prime Minister Rumen Radev condemned the attack. The Togo-flagged Alfa Watan suffered critical structural damage and sank at the scene. Radev said that there was no immediate word on the crew’s fate. The second vessel was the Palau-flagged Able. It caught fire after the attack. A Bulgarian ferry evacuated all 18 crew members. There was no immediate comment on the accusation from Russian officials.
