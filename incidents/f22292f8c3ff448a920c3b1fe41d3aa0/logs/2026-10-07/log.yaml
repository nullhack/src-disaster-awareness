log_date: '2026-10-07'
summary: Russia launched 70 missiles and 130 drones at Ukraine on October 7, while a Ukrainian strike set a Russian oil facility ablaze in Samara Oblast. For the first time, a drone attack hit two commercial vessels in a NATO member’s exclusive economic zone (Bulgaria), with Ukraine blaming Russia. The EU disbursed $3.2 billion to Kyiv, Japan imposed new sanctions on Russia, and India sought updates on nationals in the Russian army amid ongoing Black Sea shipping disruptions affecting Indian sailors and sunflower oil exports.
