log_date: '2026-10-18'
summary: Ukraine launched one of its largest drone attacks of the year, striking Saint Petersburg's oil refinery and a key oil terminal, causing fires. President Zelenskyy suggested a potential trilateral meeting with Putin at the G20 summit, while Black Sea drone attacks on ships intensified, bringing the war closer to NATO shores. Additionally, Lithuania reported an attempted arson attack on a Starlink base station as Russia-linked sabotage, and Rubio stated Ukraine lacks access to the military Starshield system.
