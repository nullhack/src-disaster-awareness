title: Putin meets with US envoys at the Kremlin for renewed talks on ending the war in Ukraine
body: Russian President Vladimir Putin has met with U.S. envoys Steve Witkoff and Jared Kushner at the Kremlin. The talks on Saturday were aimed at reviving a stalled push to end Russia’s full-scale invasion of Ukraine. The Kremlin has ordered a three-day halt on strikes against Kyiv that starts at midnight Saturday. Ukrainian President Volodymyr Zelenskyy said that Ukraine is prepared to halt strikes on Moscow until Monday. The U.S. envoys' visit came amid escalating aerial attacks. Recent Russian attacks have killed eight people in Ukraine. Ukrainian air defenses have shot down or suppressed 128 drones launched by Russia. The two U.S. envoys will visit Ukrainian capital Kyiv on Sunday.
