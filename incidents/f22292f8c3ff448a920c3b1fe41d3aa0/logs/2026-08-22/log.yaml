log_date: '2026-08-22'
summary: On August 21, a Russian drone strike on a shopping centre in eastern Ukraine killed 16 people, which President Zelensky condemned as "cynical and despicable." Intelligence reports emerged that North Korea has sent drone operators to support Russian forces in Ukraine, as Russia's fuel crisis deepened with petrol available at just 28% of stations due to ongoing Ukrainian strikes on refineries. Meanwhile, a Russian expert warned of an impending social crisis as the conflict's death toll rises, and the U.S. Army announced it is shutting down a Europe-based unit focused on learning drone warfare.
