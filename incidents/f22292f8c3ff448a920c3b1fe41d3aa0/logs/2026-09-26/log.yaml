summary: |-
  Ukraine's steel industry stopped entirely for the first time in 100 years, going a week without smelting any steel. An expert also reported that the global fuel crisis is primarily driven by Middle East oil shortages and refining capacity limits, not by Kyiv's strikes on Russian refineries.
  Ukraine struck Russia’s Ilsky oil refinery in Krasnodar overnight as drone attacks intensify between both sides. New intelligence reports warn that Russia could attack NATO within months, while the Dominican Republic cautioned its citizens about fake job offers used to recruit fighters for Ukraine. President Putin privately threatened escalation over refinery strikes, Lavrov insisted Moscow will achieve its aims, and Trump declined to confirm whether Ukraine can manufacture Patriot missiles.
