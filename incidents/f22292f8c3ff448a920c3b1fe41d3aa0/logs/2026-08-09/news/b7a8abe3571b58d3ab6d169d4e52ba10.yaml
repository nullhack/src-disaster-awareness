title: 'Trump''s emissaries are going to Moscow again — will they believe them again?: EADaily'
body: EADaily, August 8th, 2026. US President Donald Trump's chief negotiators Steven Witkoff and his son-in-law Jared Kushner intend to come to Kiev and Moscow, TASS reports. The meaning of this visit is not entirely clear, political analyst Alexei Pilko comments on the news.
