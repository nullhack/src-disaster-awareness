title: US Senate Passes Russia Sanctions Bill Targeting India Energy Imports | Outlook India
body: The US Senate has approved a bipartisan bill authorising up to 100 per cent tariffs on India and four other nations purchasing Russian energy, impacting ongoing India-US trade talks.
