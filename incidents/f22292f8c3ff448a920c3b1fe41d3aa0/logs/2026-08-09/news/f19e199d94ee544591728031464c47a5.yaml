title: Another overnight Russian attack on Kyiv and Kyiv Oblast kills 4, including 3-year-old child
body: President Volodymyr Zelensky said that the three people killed in Kyiv Oblast's Brovary district on Aug. 8 were a grandmother, grandfather, and their three-year-old grandson.
