title: 'The decisive moment is coming: Russia can achieve a breakdown of the enemy: EADaily'
body: EADaily, August 8th, 2026. In the war on Ukraine is coming to a decisive moment, said political analyst Alexei Pilko, commenting on the news that US President Donald Trump's negotiators Steven Witkoff and Jared Kushner is going to Moscow, and Turkey has offered Moscow and Kiev to declare a moratorium on military operations in the Black Sea.
