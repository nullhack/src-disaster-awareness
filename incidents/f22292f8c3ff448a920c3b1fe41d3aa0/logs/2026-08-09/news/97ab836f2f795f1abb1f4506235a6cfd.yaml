title: Ukraine's War and Economy Aren't Separate Systems, Economist Warns
body: Gaps in Ukraine's air defenses translate directly into worse economic outcomes, analyst Oleksandra Betliy says, as the civilian economy and the war effort move as a single system rather than two separate tracks.
