title: '60% of Ukrainians are against the withdrawal of the Armed Forces of Ukraine from Donbass, 33% are in favor.%: EADaily'
body: EADaily, August 8th, 2026. The withdrawal of the Armed Forces of Ukraine from Donbass in exchange for security guarantees from the United States and Europe is unacceptable for an increasing part of Ukrainians. This follows from a survey conducted by the Kiev International Institute of Sociology (KIIS).
