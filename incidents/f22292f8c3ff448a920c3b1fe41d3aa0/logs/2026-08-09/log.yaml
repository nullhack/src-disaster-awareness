log_date: '2026-08-09'
summary: |-
  The US Senate passed a sweeping sanctions bill targeting Russia's energy revenues, as Trump's emissaries Witkoff and Kushner plan to visit Moscow and Kyiv for talks. President Zelensky visited Serbia and denounced Russian attacks, while Turkey called for a moratorium on Black Sea military operations. Russian strikes on Kyiv region killed 4 including a child, and Ukraine denied targeting Bulgaria after a drone exploded near a pipeline; fresh warnings emerged that North Korea may send 50,000 troops to Russia.
  Overnight strikes between Russia and Ukraine left 7 dead and many injured, while Russia targeted Ukrainian drone depots in the Kharkiv region. Pope Francis appealed for peace amid rising civilian casualties, and a poll showed 60% of Ukrainians oppose withdrawing from Donbas. Separately, Ukraine mourned the death of a soldier who recovered war dead.
