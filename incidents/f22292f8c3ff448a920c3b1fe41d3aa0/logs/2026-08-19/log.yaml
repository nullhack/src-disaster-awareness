log_date: '2026-08-19'
summary: Ukraine launched a major drone attack on Moscow, as Russia warned the UK will "pay a price" for supplying Kyiv with long-range drones; the UK's Prime Minister Burnham responded by vowing to "support Ukraine 100%." In a major internal political development, ousted Defense Minister Mykhailo Fedorov called for wartime presidential elections, marking the biggest challenge to President Zelensky since the invasion began, while Zelensky fired a top aide amid a corruption probe. Separately, UAE mediation facilitated a swap of 206 prisoners of war (103 each) between Russia and Ukraine.
