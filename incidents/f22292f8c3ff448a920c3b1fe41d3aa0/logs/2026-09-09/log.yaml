log_date: '2026-09-09'
summary: |-
  President Trump spoke with Putin in an "extremely frank" phone call, telling him he wants a swift end to the Ukraine war and to restore US-Russia ties, according to the Kremlin. US envoys Witkoff and Kushner have been shuttling between Moscow and Kyiv for peace talks, with Zelenskyy offering his verdict on new US ideas for peace. Meanwhile, Polymarket ceasefire odds have crashed to 13% for December 31, 2026, and US aid to Ukraine continues despite Trump's denials.
  On September 8-9, a Russian aerial attack on Kyiv killed at least five people, as President Zelensky accused Moscow of seeking maximum harm. In parallel diplomatic moves, U.S. President Trump held a nearly hour-long phone call with Putin on ending the war, while U.S. envoy Witkoff expressed confidence in trilateral talks and CIA Director Ratcliffe prepared for a greater role in shuttle diplomacy. Separately, a Russian drone strike on the Ukraine-Moldova border killed two civilians, and the Pentagon's top strategist warned Europe to prepare for years of war.
