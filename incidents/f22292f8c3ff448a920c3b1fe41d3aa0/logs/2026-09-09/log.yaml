log_date: '2026-09-09'
summary: President Trump spoke with Putin in an "extremely frank" phone call, telling him he wants a swift end to the Ukraine war and to restore US-Russia ties, according to the Kremlin. US envoys Witkoff and Kushner have been shuttling between Moscow and Kyiv for peace talks, with Zelenskyy offering his verdict on new US ideas for peace. Meanwhile, Polymarket ceasefire odds have crashed to 13% for December 31, 2026, and US aid to Ukraine continues despite Trump's denials.
