title: 'From more than 50 GW to under 10 GW: Ukraine doesn’t need its old energy system back - pv magazine Global'
body: 'Six air-raid alerts on the first day, backup generators on almost every street corner, and discussions about the rapid reconstruction of severely damaged energy infrastructure: my trip to Kyiv and Lviv showed me why decentralized solar and energy storage are far more than climate technologies for Ukraine. They are part of the country’s security architecture. They also underscore why German solar companies should be engaging with Ukraine today.'
