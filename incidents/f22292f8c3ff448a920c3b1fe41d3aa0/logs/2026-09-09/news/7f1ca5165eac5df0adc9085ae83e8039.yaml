title: Polymarket Ukraine Odds for Russia Ceasefire Slashed to 13%
body: Polymarket Ukraine odds for a Russia ceasefire by December 31, 2026, have crashed to just 13%, down from 40% yesterday. The nearer-dated October 31 contract was priced lower, at a 7% implied probability. Both figures depend on a resolution rule that requires more than a diplomatic announcement.The Polymarket event resolves ...
