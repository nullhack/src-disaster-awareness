title: Hunger Warfare and a Fertilizer Crisis Are Straining Global Food Supplies | Council on Foreign Relations
body: Attacks on Black Sea grain infrastructure and a fertilizer shock from the Iran war are hitting global agriculture at both ends of the production cycle, notes Michael Werz. The pain will really be felt in the 2027 and 2028 growing seasons.
