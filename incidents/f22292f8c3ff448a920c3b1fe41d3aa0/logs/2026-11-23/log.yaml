log_date: '2026-11-23'
summary: A suspected Ukrainian sea-drone strike hit a Russian warship docked at the Benghazi naval base in Libya, with local authorities and satellite imagery indicating the vessel sank in a large explosion — extending Ukraine's attacks on Russian assets well beyond the Black Sea. Libya's government warned its territory must not become "an arena for settling scores," and the UN mission in Libya urged an investigation. Separately, Levada Centre polling reported by The Moscow Times found only 6% of Russians say Russia should answer for Ukraine's destruction, while 65% blame the US and NATO.
