title: Ukraine empties as war reaches a protracted stalemate
body: 'By Theo Kyriacou Wilfred Owen’s despondent poem ‘Anthem for Doomed Youth’ encapsulated the mood of all those who felt they were hoodwinked by the solemn promise: ‘it will all be over by Christmas’. For history buffs it’s a conspicuous reference to World War I, but turn the clock forward 100…'
