title: Putin Says World Is Living Through a Dangerous Moment, Warns West Not to Escalate - The Moscow Times
body: President Vladimir Putin said on Thursday the world was living through a dangerous moment and warned the West not to escalate a standoff over Ukraine by threatening the Russian exclave of Kaliningrad, which Moscow has made clear it would defend with nuclear weapons if necessary.
