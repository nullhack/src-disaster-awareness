title: Pope Leo speaks with Putin by telephone from hospital
body: Pope Leo XIV “spoke by telephone” with Russian President Vladimir Putin, from his hospital room on Oct. 16 and asked him to call for a ceasefire in Oleshky, where the humanitarian situation is dire.
