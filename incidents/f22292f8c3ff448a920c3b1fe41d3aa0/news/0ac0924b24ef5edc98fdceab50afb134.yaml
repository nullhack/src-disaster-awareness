title: Witkoff and Kushner call Kyiv talks 'substantive' after Moscow Putin meeting
body: U.S. envoys Steve Witkoff and Jared Kushner held meetings in Kyiv with Ukraine's President Zelenskyy on Sunday, a day after lengthy conversations with Russian President Putin in Moscow.
