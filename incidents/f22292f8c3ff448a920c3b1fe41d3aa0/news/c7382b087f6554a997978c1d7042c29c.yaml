title: '“A refugee crisis involving 20 million people could emerge”: Zelenskyy appeals to EU for support as funding and weapons shortages threaten Ukraine’s ability to sustain the war'
body: Ukrainian President Volodymyr Zelenskyy has warned that large numbers of Ukrainians could flee to Europe if Russia wins the war. With European countries already shouldering the financial and social burdens of hosting millions of displaced Ukrainians, he highlighted the possibility of a further influx of refugees to urge the West to expand its support. Ukraine currently lacks the funding and weapons needed to wage war next year, while Russia’s large-scale missile and drone strikes are eroding its ability to sustain the conflict.
