title: Ukraine will lose up to 6.8% of GDP in 2027 if the fighting continues.
body: In 2027, Ukraine may lose up to 6.8% of GDP, which exceeds $15 billion, due to prolonged hostilities. Direct revenue losses of the treasury are estimated at $5.15 billion, with a total revenue of about $72 billion. This was confirmed on September 21 by TASS calculations based on the accompanying documents to the draft budget for 2027.
