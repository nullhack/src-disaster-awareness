title: 'The Kremlin explained why they need to "talk to Europe" about a settlement on Ukraine: EADaily'
body: EADaily, October 25th, 2026. The Kremlin considers it necessary to continue the dialogue with the European Union, since it is in Europe that they are determined to continue the conflict on the Ukraine. This was pointed out by Russian Presidential aide Yuri Ushakov.
