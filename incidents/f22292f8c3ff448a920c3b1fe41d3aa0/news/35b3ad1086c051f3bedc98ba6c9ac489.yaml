title: Explainer-Why is the evacuation of Oleshky by Russia and Ukraine happening now?
body: MOSCOW, Oct 30 (Reuters) - Residents of the Russian-held town of Oleshky in southern Ukraine began evacuating on Friday as part of a joint relief operation by the two sides, the first of its kind in four years and eight months of war.
