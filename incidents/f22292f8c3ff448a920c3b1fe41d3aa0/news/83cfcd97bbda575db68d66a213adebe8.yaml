title: Ukraine's top negotiator praises Witkoff, pushes back against Kyiv Independent's reporting
body: U.S. envoy Steve Witkoff "has done a great job" in Washington-led efforts to help end the Russia-Ukraine war, Foreign Intelligence Chief Rustem Umerov told Axios.
