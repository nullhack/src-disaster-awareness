title: Russia's ruling party on track to win wartime election after drones strike Moscow - Europe - The Jakarta Post
body: Russia's ruling United Russia party was on track to easily win a parliamentary election that President Vladimir Putin has cast as a test of support for the war in Ukraine, after Ukraine launched a massive drone attack on the Russian capital.
