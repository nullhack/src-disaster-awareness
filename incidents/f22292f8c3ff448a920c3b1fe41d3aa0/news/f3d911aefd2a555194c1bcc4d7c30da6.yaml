title: 'Zelensky did not even stutter at the negotiations: Russia will not go to the freeze — Kolesnik: EADaily'
body: EADaily, September 13th, 2026. Moscow will not agree to freeze the conflict, since Kiev uses it to restore logistics, which the Russian army has significantly undermined. This was stated by a member of the State Duma Committee on Defense Andrei Kolesnik.
