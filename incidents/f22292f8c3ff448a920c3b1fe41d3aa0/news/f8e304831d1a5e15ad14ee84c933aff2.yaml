title: 'Newsweek: No optimism — Putin is winning, Ukraine is in for a hard winter: EADaily'
body: EADaily, August 18th, 2026. A year ago, Putin's meeting with Trump in Anchorage was the triumph of the Russian president. Many important events have happened over the past year. But Putin's advantage has not gone away — Ukraine is still the loser, and for a number of reasons, Larry O'Connor writes in Newsweek.
