title: 'Axios: The head of the CIA offered to organize a meeting of Trump, Putin and Zelensky in Moscow: EADaily'
body: EADaily, August 30th, 2026. CIA Director John Ratcliffe, during a visit to Moscow, suggested that the Russian side hold a trilateral meeting of the leaders of the United States, Russia and Ukraine Donald Trump, Vladimir Putin and Vladimir Zelensky to resolve the Ukrainian conflict.
