title: Russia bombs Kyiv and Ukraine fires drones towards Moscow, despite talk of renewing negotiations
body: Missiles struck Kyiv in the early hours of Thursday, a Reuters witness said, and Ukraine sent hundreds of drones towards Moscow overnight, as the two sides kept up a barrage of attacks despite the latest US mediation attempts to end the war.
