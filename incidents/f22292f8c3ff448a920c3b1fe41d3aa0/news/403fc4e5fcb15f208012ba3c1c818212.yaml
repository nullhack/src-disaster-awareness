title: Russia agrees to resume talks aimed at ending Ukraine war | Arkansas Democrat Gazette
body: Russia agreed Wednesday to resume three-way negotiations next month with Washington and Kyiv aimed at ending the war in Ukraine, a Kremlin official said, potentially setting up the first such talks since February.
