title: Disputes over land present obstacles to ending conflict | Arkansas Democrat Gazette
body: KYIV, Ukraine — Ukraine and Russia have signaled their willingness to resume U.S.-brokered peace talks and are backing a humanitarian mission led by U.S. first lady Melania Trump. But deep disagreements over territory and security guarantees that reemerged over the past week underscore obstacles to ending the war.
