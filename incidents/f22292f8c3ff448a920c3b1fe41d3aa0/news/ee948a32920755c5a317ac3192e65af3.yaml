title: Ukraine says it struck Russian oil refinery as drone attacks intensify
body: Investing.com -- Ukraine said it struck Russia’s Ilsky oil refinery in the Black Sea region of Krasnodar overnight, setting the facility ablaze as both countries reported large-scale drone attacks, Bloomberg reported.
