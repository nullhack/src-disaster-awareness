title: Putin assures Trump that Moscow doesn’t have aggressive plans toward Europe, Kremlin says
body: A Kremlin official says Russian President Vladimir Putin told U.S. President Donald Trump by phone that Moscow doesn’t harbor aggressive intentions toward Europe. Earlier this month, European officials blamed Moscow for sabotage campaigns on their soil. Kremlin adviser Yuri Ushakov also said Putin told Trump about Russia’s plans to achieve its military goals in Ukraine. He said Moscow has a positive view of the results of the weekend visit to Moscow by U.S. envoys Steve Witkoff and Jared Kushner, who later held talks with Ukrainian President Volodymyr Zelenskyy in Kyiv. Zelenskyy said the envoys presented some “very good, worthwhile ideas” for ending Russia’s 4 1/2-year-old war.
