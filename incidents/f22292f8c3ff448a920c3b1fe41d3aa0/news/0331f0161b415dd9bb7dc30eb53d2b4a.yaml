title: Melania Trump touts her diplomatic role as Russia-Ukraine peace eludes her husband | CNN Politics
body: First lady Melania Trump hosted representatives from the highest levels of Russia’s and Ukraine’s governments at the White House on Thursday to celebrate the conclusion of a localized ceasefire — a humanitarian breakthrough, albeit limited, that came as President Donald Trump’s efforts to end the Russia-Ukraine war have so far failed.
