title: Putin calls Ukraine situation difficult as Trump envoys visit Kremlin
body: Russian President Vladimir Putin met Steve Witkoff and Jared Kushner in Moscow for talks on ending the war in Ukraine. The exchange underscored continuing US-Russia engagement as Washington pushes for a negotiated path forward.
