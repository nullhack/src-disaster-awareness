title: A tech innovator and an old guard general are the focus of Ukraine’s political crisis | Texarkana Gazette
body: KYIV, Ukraine -- One is a tech-savvy drone innovator with no military experience who became Ukraine's youngest defense minister six months ago and was credited with contributing to successes in defending against Russia's 4-year-old invasion.
