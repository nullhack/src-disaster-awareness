title: US Senate Nod For Russia Sanctions. Ukraine Cheers Move, But Will Moscow Blink
body: The backers of the bill and the Trump administration believe that such a step would force Russia to tone down its war rhetoric and drag it to talks to end the conflict, which has raged on since 2022. Russia has not shown any signs of backing down.
