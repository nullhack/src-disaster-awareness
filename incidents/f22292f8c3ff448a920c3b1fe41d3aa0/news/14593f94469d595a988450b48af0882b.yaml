title: 'Russia ready for Ukraine talks if West acts constructively: Deputy FM'
body: Russia is ready for negotiations on Ukraine if Western countries adopt a constructive and mature approach, Russian Deputy Foreign Minister Mikhail Galuzin told TASS.
