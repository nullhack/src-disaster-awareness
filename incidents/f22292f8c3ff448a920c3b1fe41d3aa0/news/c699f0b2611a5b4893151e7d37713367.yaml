title: Putin Agrees to Resume 3-Way Peace Talks With Ukraine and US
body: ST PETERSBURG, Russia, Oct 21 (Reuters) - Russian President Vladimir Putin has agreed to resume US-mediated peace talks with Ukraine as soon as next month, the Kremlin said on Wednesday, after Putin met US envoy Steve Witkoff in Washington's latest push to stop Europe's bloodiest conflict since World War Two.
