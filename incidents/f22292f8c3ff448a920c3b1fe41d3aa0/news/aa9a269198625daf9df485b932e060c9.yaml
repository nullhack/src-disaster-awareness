title: AI-assisted tool helped secure satellite communication system after 2022 Russian hacking - WTOP News
body: WASHINGTON (AP) — On the same day it invaded Ukraine in 2022, Russia disabled thousands of satellite modems across Ukraine and other European countries, aiming to disrupt communications.
