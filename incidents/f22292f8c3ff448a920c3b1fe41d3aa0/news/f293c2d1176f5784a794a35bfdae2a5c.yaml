title: Ukrainians embed with US forces during drills in Germany to teach the latest in drone warfare
body: The U.S. Army is actively incorporating drone tactics learned from Ukrainian troops. Annual Army exercises held in Germany in recent weeks have seen increased collaboration with Ukrainian forces who've been providing insights on electronic warfare and drone tactics. But larger questions of how America's largest military service would adapt its tactics to any drone-focused conflict remain unanswered for now. It comes as the Army has faced a parade of departures of top leaders who have championed drone experiments. And an Army unit experimenting in drone warfare has been ordered to end its efforts and return to being a traditional infantry battalion.
