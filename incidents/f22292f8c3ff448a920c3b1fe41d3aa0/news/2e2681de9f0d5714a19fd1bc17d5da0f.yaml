title: Ukraine denies targeting Bulgaria as drone explodes near pipeline
body: Ukraine on Saturday denied targeting Bulgaria after a drone exploded close to the strategic Trans-Balkan gas pipeline linking Turkey to Ukraine near the Romanian border.
