title: How Ukraine’s long-range drones are changing what’s possible in war with Russia
body: The latest story of the Ukraine war has been the shift – on the battlefield, and in the adversaries’ minds – wrought by Ukraine’s drone strikes deep into Russia. The goal is to pave a path to a diplomatic resolution.
