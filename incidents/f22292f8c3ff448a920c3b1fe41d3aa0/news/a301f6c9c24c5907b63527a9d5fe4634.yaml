title: Ukraine receives 3.3 billion euros EU tranche for missiles and drones
body: Ukraine has received a €3.3-billion tranche from the European Union under its Ukraine Support Loan, with funds earmarked for missiles and drones. Meanwhile, Russia summoned Britain’s charge d’affaires over London’s military support and issued warnings over UK facilities.
