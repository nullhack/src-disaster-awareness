title: Russia to supply diesel to US amid fuel crisis; Zelenskyy says deal will prolong Ukraine war - BusinessToday
body: US President Donald Trump says Russia will supply diesel to help curb soaring fuel prices in the US. Ukrainian President Volodymyr Zelenskyy has criticised the deal, warning it could fund Moscow’s war in Ukraine.
