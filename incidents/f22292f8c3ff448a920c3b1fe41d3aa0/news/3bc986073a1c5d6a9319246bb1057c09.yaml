title: A one-city ceasefire between Russia and Ukraine brokered by First Lady Melania Trump is in effect
body: A localized ceasefire between Ukraine and Russia took effect early Tuesday ahead of a humanitarian mission led by U.S. first lady Melania Trump, as missile attacks resumed in Kyiv.
