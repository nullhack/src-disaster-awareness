title: Ukraine hits more outlets of Russia’s largest online marketplace to bring the war home | Texarkana Gazette
body: Ukraine's attacks on the sprawling Russian warehouses have produced stark images, with massive pillars of smoke rising above fires that raged at facilities of Wildberries, the country's biggest online retailer and its equivalent of Amazon.
