title: 'The Kremlin does not understand the position The EU with the appointment of a negotiator for Ukraine: EADaily'
body: EADaily, October 25th, 2026. The European Union behaves unconstructively, constantly talking about the nomination of negotiators on the Ukrainian conflict, but doing nothing. In Brussels, either they don't want to, or they can't decide on such a step. This was stated by the press secretary of the President of Russia Dmitry Peskov.
