title: US, Canada see growing interest in limited ceasefire in Black Sea
body: By Andrea ShalalATLANTA, Oct 31 (Reuters) - US Secretary of State Marco Rubio on Saturday said there was growing interest by the international community in facilitating a limited ceasefire in the Black Sea to ensure unfettered energy and grain shipments by Russia and Ukraine.Rubio told a news conference that the US is reviewing proposals by Turkey and Indiato get grain shipments moving, even as the US continues to press for a broader, negotiated settlement of the war, which is now in its fifth year.
