title: Trump’s diesel deal with Putin angers Ukraine as experts doubt impact on prices | CNN Politics
body: President Donald Trump said on Friday he secured an agreement from Russian President Vladimir Putin to supply markets with Russian diesel fuel as he works to bring down energy costs ahead of the midterm elections.
