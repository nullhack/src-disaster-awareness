title: 'Forecast: Ukraine''s economic outlook dims as Russian attacks take toll'
body: Ukraine's economic outlook is deteriorating as Russian drone and missile attacks intensify, according to a new forecast published on Wednesday by the Vienna Institute for International Economic Studies. The Ukrainian economy has its "back up to the wall," the institute, which specializes in Central and Eastern Europe, said in its latest analysis.
