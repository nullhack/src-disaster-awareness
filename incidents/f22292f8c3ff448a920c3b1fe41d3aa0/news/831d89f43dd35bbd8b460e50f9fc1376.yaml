title: Mottley proposes UN teams to tackle global conflicts - Barbados Today
body: From Gaza and Ukraine to Sudan and Yemen, escalating conflicts are taking a mounting human and economic toll, prompting Prime Minister Mia Mottley to propose a new United Nations mechanism aimed at intervening earlier in global crises.
