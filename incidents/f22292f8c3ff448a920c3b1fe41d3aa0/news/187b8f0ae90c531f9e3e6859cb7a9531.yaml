title: 'Ukraine’s drone strike on Russian warship risks ‘serious escalation'': official'
body: The Ukrainian sea drone strike that capsized and sank a Russian warship in Libya on Sunday risks a "serious escalation" of the nearly five-year war, a former U.S. national security adviser warned Monday, calling the operation a "giant tantrum" by Ukrainian President Volodymyr Zelenskyy.
