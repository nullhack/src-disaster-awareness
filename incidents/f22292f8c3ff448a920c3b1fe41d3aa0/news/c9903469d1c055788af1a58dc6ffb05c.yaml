title: Police searches at energy company deepen Zelensky-Klitschko tensions over Kyiv's winter preparations
body: Kyiv’s city-run heating company, Kyivteploenergo, accused the police of pressuring the company and seizing important documents pertaining to the capital’s energy resilience plan on Nov. 6.
