title: Aon (AON) Deepens Ukraine War Risk Insurance Support
body: Aon (NYSE:AON) and the European Bank for Reconstruction and Development expanded their Ukraine war risk insurance facility for local businesses. The enlarged Ukraine Recovery and Reconstruction Guarantee Facility is aimed at supporting companies operating under active conflict conditions. The program is designed to help maintain economic activity in Ukraine by sharing war related risks with private insurers. The expanded Ukraine war risk insurance partnership with the EBRD is only one part...
