title: Vladimir Putin agrees to three way peace talks between Russia and Ukraine, the US - BusinessToday
body: The Kremlin stated that the talks would concentrate on ensuring security after the war, while noting that recent discussions between Witkoff, Ukrainian President Volodymyr Zelenskyy, and European and NATO representatives had not fully met Moscow's expectations.
