title: Ukraine’s attack on Iranian ship exposes global character of imperialist war
body: Ukraine’s attack on an Iranian ship in the Caspian Sea demonstrates the fraud that the NATO war against Russia is a “defensive” or “liberating” struggle. Ukraine is becoming an active front in the same global imperialist onslaught that includes the genocide in Gaza and the US-Israeli war against Iran.
