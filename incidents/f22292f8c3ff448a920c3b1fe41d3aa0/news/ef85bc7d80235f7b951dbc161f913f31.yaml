title: Trump to press Zelenskyy for energy truce, says Russia has ‘lost control’ of oil due to Ukraine war
body: U.S. President Donald Trump said Russia has “lost control” of its diesel oil industry due to the Ukraine war, as he presses Kyiv to agree to an energy truce.
