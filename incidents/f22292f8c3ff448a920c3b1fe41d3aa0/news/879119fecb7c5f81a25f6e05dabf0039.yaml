title: 'Rubio: Ukraine does not have access to Starshield: EADaily'
body: EADaily, October 18th, 2026. Ukraine does not have access to Starshield, a military version of Starlink satellite communications, US Secretary of State Marco Rubio said in a conversation with reporters, C-SPAN reports.
