title: US strikes $58.6 billion Patriot missile deal amid rising stockpile concerns - BusinessWorld Online
body: WASHINGTON — The US Army awarded Lockheed Martin a contract worth up to $58.6 billion to produce Patriot interceptor missiles, the Pentagon said on Wednesday, as conflicts in Iran and Ukraine strain US weapons stockpiles. The US has supplied large quantities of weapons to allies while also using munitions in its own military operations in […]
