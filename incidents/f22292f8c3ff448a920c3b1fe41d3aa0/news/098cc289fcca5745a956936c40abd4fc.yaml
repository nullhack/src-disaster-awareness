title: US Senate advances Russia sanctions bill; India could face tariffs of up to 100%- Moneycontrol.com
body: The US Senate has advanced a bipartisan Russia sanctions bill that could allow President Donald Trump to impose tariffs of up to 100% on countries including India over continued purchases of Russian oil and gas.
