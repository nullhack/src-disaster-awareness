title: Local ceasefire brokered by Melania Trump starts in southern Ukraine
body: A localized ceasefire between Ukraine and Russia took effect early Tuesday ahead of a humanitarian mission brokered by U.S. first lady Melania Trump, as missile attacks resumed in Kyiv.
