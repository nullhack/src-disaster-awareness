title: UN says 16,000 Ukrainian civilians remain detained by Russia amid torture claims
body: At the UN Security Council, officials and former detainees described Russia's prison abuses in the war. Their testimony sharpened scrutiny of illegal detentions, torture and stalled prisoner returns.
