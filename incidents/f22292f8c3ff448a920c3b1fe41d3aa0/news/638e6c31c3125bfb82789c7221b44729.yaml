title: Europe pushes for seat at Ukraine peace talks but lacks unified voice | Texarkana Gazette
body: DUBLIN -- European nations are seeking an envoy to represent them in talks on ending the Russia-Ukraine war, concerned that a U.S.-backed process will leave them sidelined and Kyiv vulnerable as Moscow and Washington decide the fate of a conflict that has roiled the continent.
