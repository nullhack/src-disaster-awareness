title: Russia and Ukraine exchange airstrikes as US envoy describes renewed security talks as productive
body: Russia and Ukraine traded airstrikes as talks wrapped up in Brussels on Ukraine’s postwar reconstruction and security guarantees. The Russian barrage overnight underscored the scale of the rebuilding challenge, while Ukraine launched hundreds of drones at Russian targets. Russia’s Defense MiniFstry said its forces shot down nearly 500 drones overnight. Rescue teams continued searching Thursday for more than 30 people trapped in the wreckage of a former school struck by Russian bombs Monday. Officials from the U.S., U.K., France, Germany, the European Union and NATO took part in the Brussels talks ahead of a trilateral summit in the United Arab Emirates next week.
