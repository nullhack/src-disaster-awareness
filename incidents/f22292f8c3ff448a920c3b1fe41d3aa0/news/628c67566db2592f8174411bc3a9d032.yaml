title: Jaishankar meets Rubio at UNGA, raises India’s concerns over Russia sanctions bill- Moneycontrol.com
body: Jaishankar said he reiterated India’s “interests and concerns” regarding the SRIA during his meeting with Rubio. The two leaders also discussed the situation in the Gulf and the Russia-Ukraine conflict.
