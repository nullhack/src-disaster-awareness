title: The timeline of a Russian war against NATO, according to Danish intelligence
body: The DDIS assesses that Moscow will intensify its hybrid warfare, with more frequent attacks against the North Atlantic Treaty Organisation and more serious consequences for the countries affected than in the past. This could include destructive cyber-attacks capable of paralysing essential functions of society, as well as acts of sabotage carrying a high risk of casualties
