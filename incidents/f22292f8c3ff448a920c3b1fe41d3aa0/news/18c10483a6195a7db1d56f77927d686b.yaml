title: '''Abhorrent acts'' — Russian forces committed widespread sexual violence in Ukraine since full-scale invasion, UN reports'
body: Russian forces are responsible for the vast majority of sexual violence in Ukraine since the start of the full-scale war, the UN High Commissioner for Human Rights (OHCHR) announced in a new report.
