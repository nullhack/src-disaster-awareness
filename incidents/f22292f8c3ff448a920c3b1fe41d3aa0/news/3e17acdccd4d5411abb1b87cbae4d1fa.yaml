title: Trump sees 'strong inclination' to end Russia-Ukraine war ahead of U.S.-brokered peace talks
body: President Trump signaled optimism for the end of Russia's war in Ukraine ahead of trilateral negotiation talks set to commence later today in Abu Dhabi.
