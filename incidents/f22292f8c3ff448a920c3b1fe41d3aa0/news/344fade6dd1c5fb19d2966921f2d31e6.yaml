title: Russia hits Ukraine with missiles and drones, killing at least 8 | Honolulu Star-Advertiser
body: KYIV, Ukraine >> Russia pounded Ukrainian cities overnight with a barrage of missiles and drones that killed at least eight people and wounded dozens of others, Ukrainian officials said today.
