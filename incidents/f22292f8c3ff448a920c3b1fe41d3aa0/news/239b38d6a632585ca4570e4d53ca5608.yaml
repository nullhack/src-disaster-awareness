title: Ukraine showcases its defense tech at the AUSA Expo 2026
body: For the first time ever, the Association of the United States Army (AUSA) Annual Meeting and Exposition in Washington hosted the Ukrainian Defense Tech Pavilion. The pavilion brought together 17 Ukrainian companies to showcase their aerial and ground drones, and their communications systems.
