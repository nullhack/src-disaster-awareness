title: Russian drone strikes Ukraine security service headquarters | Arkansas Democrat Gazette
body: KYIV, Ukraine -- A Russian drone struck the headquarters of Ukraine's security service in central Kyiv, President Volodymyr Zelenskyy said Friday, ahead of diplomatic talks with U.S. officials on ending the war.
