title: 'EU summit in Brussels: European powers intensify war drive against Russia'
body: While the Trump administration, amid its conflict with the European powers, is seeking at least for the moment a certain accommodation with Russia, the EU governments, led by Berlin, are pressing for the continuation and expansion of the Ukraine war.
