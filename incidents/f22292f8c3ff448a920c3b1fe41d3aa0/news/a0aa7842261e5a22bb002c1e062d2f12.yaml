title: Russia-Ukraine tensions escalate as German Foreign Minister visits Kyiv
body: MOSCOW-KYIV, 22nd August, 2026 (WAM) -- The situation in Ukraine witnessed a broad escalation on the ground as German Foreign Minister Johann Wadephul made an unannounced solidarity visit to Kyiv ahead of the 35th anniversary of Ukraine's independence.
