title: 'US envoys put forward ''number of ideas'' on Ukraine to Putin: Kremlin'
body: US envoys proposed a "number of ideas" on how to end the Ukraine war in "frank" talks with Russia's Vladimir Putin in the Kremlin late Saturday, Moscow said, ahead of their first trip to Kyiv. Kremlin aide Yuri Ushakov called the talks "extremely frank",
