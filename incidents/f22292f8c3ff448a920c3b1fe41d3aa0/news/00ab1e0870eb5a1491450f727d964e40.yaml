title: Drones buzz overhead, troops hunker underground in Ukraine's hellish kill zone
body: The front line in the Russia-Ukraine war stretches more than 700 miles and has barely moved in four years. Yet straddling this line is the kill zone, dominated by constantly evolving drone technology.
