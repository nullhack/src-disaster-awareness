title: Kushner says he believes Russia is ‘comfortable’ with NATO-like security guarantees for Ukraine
body: U.S. envoy Jared Kushner says he believes Russia is “comfortable” with NATO-like security guarantees for postwar Ukraine. His remarks came Thursday in Berlin as he sought to ease Kyiv’s European allies expressed concerns about President Donald Trump’s meeting in China with Russian President Vladimir Putin. Trump discussed Ukraine during trilateral talks with Putin and Chinese leader Xi Jinping. Kushner and fellow U.S. envoy Steve Witkoff met with European allies in Berlin to discuss support for Ukraine. Putin, meanwhile, vowed to retaliate against Ukraine for the “seriously damage” it caused with three aerial attacks this week on the vital Kerch Bridge, which links occupied Crimea with the Russian mainland.
