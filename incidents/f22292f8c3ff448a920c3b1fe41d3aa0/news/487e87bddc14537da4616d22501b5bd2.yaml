title: 'A fake torture chamber, a real riot: Russia scores points on Ukraine’s mobilization crisis'
body: The riot broke out on 2 November in Petropavlivska Borshchahivka, on the outskirts of Kyiv, and by late evening an enraged crowd was rocking a bus that carried the very mobilized men it had come to “free.”
