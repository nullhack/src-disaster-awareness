title: Russia ramps up daytime strikes on Ukraine - reason revealed
body: Russia is intensifying daytime strikes on Ukrainian civilian infrastructure to make daily life unbearable and pressure Kyiv ahead of the winter of 2026-2027, the Institute for the Study of War says.
