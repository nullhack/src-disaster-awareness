title: Russia launches strikes on 9 Ukraine cities | Arkansas Democrat Gazette
body: KYIV, Ukraine -- Russia bombarded cities across Ukraine with missiles and drones in an overnight onslaught that ran into the daylight hours of Thursday, when explosions echoed around Kyiv through the morning.
