title: Melania Trump Brings Russia and Ukraine Together at the White House Ahead of Abu Dhabi Talks
body: Melania Trump hosted Russian and Ukrainian officials at the White House to mark a six-day Oleshky ceasefire that enabled nearly 800 civilians to evacuate before planned Abu Dhabi peace talks.
