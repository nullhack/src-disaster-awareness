title: Widespread Sexual Violence in Ukraine War, Most Cases Tied to Russia, Says UN Report
body: GENEVA, Sept 18 (Reuters) - Russian forces committed widespread sexual violence against civilians and prisoners of war in Ukraine, including gang rape and electric shocks to the genitals, while Ukrainian authorities were also responsible for a smaller number of violations, the UN human rights office said in a report on Friday.
