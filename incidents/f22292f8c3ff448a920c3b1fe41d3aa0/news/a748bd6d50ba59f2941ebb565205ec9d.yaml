title: Ukraine says Starlink communications disrupted as US envoys meet Putin
body: Ukrainian President Volodymyr Zelenskyy says disruptions to the Starshield satellite communications service - the military version of Elon Musk's SpaceX's Starlink - is affecting the Ukrainian front line.
