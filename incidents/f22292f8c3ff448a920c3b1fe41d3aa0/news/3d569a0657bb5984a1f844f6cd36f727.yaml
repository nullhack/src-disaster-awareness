title: Global fuel crisis driven by Iran conflict and refining limits, not Ukraine strikes — expert
body: The global fuel crisis is primarily driven by reduced oil supplies from the Middle East and a worldwide shortage of refining capacity rather than Ukraine's drone strikes on Russian refineries, Director at A-95 Consulting Group Serhii Kuyun told Radio NV on September 22.
