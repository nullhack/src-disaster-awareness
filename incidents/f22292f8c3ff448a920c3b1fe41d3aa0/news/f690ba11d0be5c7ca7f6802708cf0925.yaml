title: Zelenski announces Ukrainian drone attack on oil and logistics facilities in the Moscow region
body: Ukrainian President Volodymyr Zelensky confirmed a massive drone attack on the Kapotnya refinery and the Sofyino logistics complex in the Moscow region, resulting in two deaths and six injuries.
