title: Kremlin says Ukraine talks with US envoys were 'useful'
body: Russian President Vladimir Putin held more than three hours of "highly useful" talks with two US envoys seeking a deal to end the Ukraine war, a Kremlin aide said, but he gave no indication of any breakthrough.
