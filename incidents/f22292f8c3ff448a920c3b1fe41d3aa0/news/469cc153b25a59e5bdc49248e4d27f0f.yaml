title: Russia’s accusations against Italian media don’t hold up. Here’s why
body: The Russian Embassy in Italy accused Italian media of misrepresenting Moscow’s warnings about Kaliningrad and nuclear weapons as threats. However, the embassy’s claims are misleading, as Russia’s warnings are presented as responses to perceived aggressive European policies, including military exercises and NATO nuclear-sharing arrangements
