title: 'MARITIME CRISIS: Over 300 Attacks and Dozens Killed as Black Sea Becomes World’s Deadliest Shipping Route'
body: The Black Sea has become the world’s deadliest shipping zone, surpassing even the Strait of Hormuz, with more than 300 attacks on vessels and over 30 crew members killed since the beginning of 2026, according to new figures reported by The Wall Street Journal. The sharp escalation in maritime attacks, driven by the ongoing war […]
