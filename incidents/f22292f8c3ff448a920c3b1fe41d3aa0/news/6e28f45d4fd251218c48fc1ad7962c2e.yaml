title: Ukraine to end automatic 100% mobilization exemptions for critical industries, Prime Minister says
body: Companies will still be able to request higher exemption quotas if needed to maintain operations, while the government plans to introduce a new system allowing full exemptions for businesses that help recruit employees for military service.
