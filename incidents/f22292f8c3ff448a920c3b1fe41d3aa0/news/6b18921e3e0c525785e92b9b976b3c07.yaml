title: Ukraine says it forced 250 Russian soldiers to surrender in daring operation
body: By Ivana Kottasová, Svitlana Vlasova, CNN (CNN) — A daredevil Ukrainian operation using robots dropped behind enemy lines and “Trojan” armored personnel carriers laden with explosives has led to the capture of more than 250 Russian troops, Kyiv says. Ukraine’s army has been chipping away at Russian-controlled territories in the eastern Ukrainian region of Donbas
