title: Russia tricks 'vulnerable' foreigners to fight in Ukraine war, Amnesty reports
body: Foreign nationals are being tricked into fighting for the Russian army against Ukraine through fake job offers, an Amnesty International report said Thursday, citing interviews with prisoners of war.…
