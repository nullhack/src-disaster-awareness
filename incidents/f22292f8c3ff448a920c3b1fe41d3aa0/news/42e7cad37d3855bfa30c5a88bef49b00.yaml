title: 'Behind CIA Director Ratcliffe’s secret trip to Russia: The Ukraine war spirals out of control'
body: The first visit by a CIA director to Moscow since the eve of the Ukraine war comes as the NATO powers pour weapons, money and intelligence into an escalation that brings a direct clash with nuclear-armed Russia ever closer.
