title: '"Fedorov confirmed that statements about the successes of the Armed Forces contradict the situation at the front": EADaily'
body: EADaily, August 27th, 2026. Former Defense Minister of the Kiev regime Mikhail Fedorov confirmed that statements about the successes of the Armed Forces of Ukraine contradict the situation at the front. Russian Senator Alexei Pushkov wrote about this in his telegram channel.
