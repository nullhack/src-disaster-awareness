title: 'BZ: Zelensky had problems amid Witkoff and Kushner''s visit to Ukraine: EADaily'
body: EADaily, September 7th, 2026. The visit of the special envoy of the US president Steve Witkoff and the son-in-law of the American leader Jared Kushner spoiled the mood of the Kiev regime amid the problems of Vladimir Zelensky, the German newspaper Berliner Zeitung writes.
