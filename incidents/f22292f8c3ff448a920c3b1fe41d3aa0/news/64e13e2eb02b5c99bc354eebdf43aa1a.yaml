title: A new Ukraine battlefield milestone is raising alarms around the world
body: A Russian drone equipped with an autonomous artificial intelligence targeting system was allegedly responsible for the deaths of three civilians in southeastern Ukraine last month, marking what experts describe as a significant and troubling development in the evolution of modern warfare.
