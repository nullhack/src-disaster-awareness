title: Trump says Ukraine needs new president after Zelenskyy questions US move to buy Russian diesel
body: Hitting back at Volodymyr Zelenskyy after he criticised the US-Russia diesel deal, Donald Trump has said Ukraine needs a new president, escalating the tensions between Washington and Kyiv.
