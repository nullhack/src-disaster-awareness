title: Russia is willing in principle to join new Ukraine peace talks in November, Kremlin says
body: MOSCOW, Oct 21 (Reuters) - Russian President Vladimir Putin told US special envoy Steve Witkoff on Wednesday that Moscow is willing in principle to resume talks next month with Ukraine and the US on ending the conflict in Ukraine,
