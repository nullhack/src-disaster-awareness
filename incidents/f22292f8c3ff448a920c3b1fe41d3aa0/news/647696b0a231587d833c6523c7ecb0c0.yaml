title: External power supply has been restored at the Zaporizhzhia Nuclear Power Plant following yet another blackout
body: External power supply has been restored at the temporarily occupied Zaporizhzhia Nuclear Power Plant, which had been lost on Sunday, November 8, due to a shutdown of the 330-kV transmission line.
