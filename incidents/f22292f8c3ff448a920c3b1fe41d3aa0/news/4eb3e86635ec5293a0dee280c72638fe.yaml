title: The Kremlin says the CIA director held talks in Moscow with his intelligence counterparts
body: Kremlin spokesman Dmitry Peskov says CIA Director John Ratcliffe did not meet with Russian President Vladimir Putin, who was informed of the contacts that were "on the intelligence agencies’ level.”
