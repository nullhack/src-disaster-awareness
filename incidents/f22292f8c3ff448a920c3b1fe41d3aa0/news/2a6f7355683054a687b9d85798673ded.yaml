title: Russia says Ukraine must make "necessary decisions" to end war as Witkoff meets Putin
body: U.S. envoy Steve Witkoff, meeting with Vladimir Putin in Russia, voiced hope for new trilateral talks involving Ukraine, and Moscow indicated the talks could resume in November.
