title: Trump says U.S. won't attack Iran before midterms. And, ICE agent shoots man in NYC
body: Trump announced that the U.S. will not attack Iran ahead of the midterms. And, a 28-year-old man is receiving treatment at the hospital after an ICE agent shot him in the neck.
