title: Melania Trump secures ceasefire in Ukraine's war-hit Oleshky for aid, evacuation
body: Melania Trump worked with Russian and Ukrainian leaders to secure a local ceasefire in Oleshky. The pause is intended to enable humanitarian aid and voluntary civilian evacuations.
