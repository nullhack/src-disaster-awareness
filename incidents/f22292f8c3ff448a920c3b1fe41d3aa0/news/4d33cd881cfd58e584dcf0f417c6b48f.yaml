body: 'Rogers City – On Thursday at 7 p.m., the Rogers City Zonta is sponsoring an important livestream program titled “Boiling Point: How America Brought War to Ukraine.” The speaker is Stephen Kinzner, former New York Times foreign correspondent and currently senior fellow in international and public affairs at Brown University. Kinzer has written about regime […]'
