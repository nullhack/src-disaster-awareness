title: Vatican Foreign Minister, in Moscow, Says Ukraine War Must End
body: MOSCOW, Aug 25 (Reuters) - A senior Vatican official urged an end to the Ukraine war after meeting in Moscow on Tuesday with Russian Foreign Minister Sergey Lavrov in the first in-person talks between Vatican and Russian officials in five years.
