title: Russia says new US-mediated Ukraine peace talks will not place limits on its ongoing military offensive
body: Russia says new US-mediated Ukraine peace talks will not limit its ongoing military offensive, with Kremlin spokesman Dmitry Peskov insisting that renewed diplomacy does not require Moscow to slow its attacks.
