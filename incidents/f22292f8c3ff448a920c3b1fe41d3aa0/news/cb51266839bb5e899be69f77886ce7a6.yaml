title: Ukraine's Starlink crisis exposed how US foreign policy relies on Elon Musk's SpaceX, officials say
body: Ukraine's Starlink crisis has highlighted Washington's reliance on Elon Musk's SpaceX, with six former senior US officials telling Reuters that both the Biden and Trump administrations asked the company to activate or disable its satellite service in different countries.
