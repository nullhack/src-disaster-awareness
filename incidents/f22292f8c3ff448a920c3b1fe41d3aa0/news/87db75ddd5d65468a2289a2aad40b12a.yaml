title: Anthropologist John Comaroff joins protest against 15-year sentence of Ukrainian socialist Bogdan Syrotiuk
body: Anthropologist and retired Harvard professor John Comaroff has submitted a letter of “outraged protest” against the conviction and sentencing of socialist Bogdan Syrotiuk by a Ukrainian court on charges of high treason.
