title: India offers 3 part plan to de escalate Russia Ukraine war; why the resolution matters to New Delhi - BusinessToday
body: On Monday, Ukrainian President Volodymyr Zelenskyy spoke to Prime Minister Narendra Modi about developments in the conflict. Modi conveyed India's readiness to contribute to all efforts aimed at a peaceful resolution.
