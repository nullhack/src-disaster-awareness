title: Dominicans warned against being lured by Russia to fight in Ukraine - Jamaica Observer
body: SANTO DOMINGO, Dominican Republic (AFP) — The Dominican Republic warned its citizens on Friday against fake offers of employment in Russia that are actually used to recruit fighters for the war with Ukraine. The foreign ministry of the Caribbean country told Dominicans to &quot;proceed with caution&quot; if approached about working in Russia, following complaints that some job offers are &quot;linked to the armed conflict between Russia and Ukraine.&quot; It advised...
