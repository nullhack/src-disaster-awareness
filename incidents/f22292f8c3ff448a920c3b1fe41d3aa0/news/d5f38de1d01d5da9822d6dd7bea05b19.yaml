title: Is the world on the brink of nuclear war?
body: Russia's warning that it is ready to use nuclear weapons if NATO blockades Kaliningrad shows that the US-NATO war in Ukraine is escalating into an open confrontation between nuclear-armed powers, a danger being concealed from the population.
