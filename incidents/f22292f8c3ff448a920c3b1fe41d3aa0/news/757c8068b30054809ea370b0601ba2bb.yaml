title: 'Go after the money: How Zelenskyy plans to punish Russia for attacks on civilians'
body: Zelenskyy said Ukraine would intensify strikes on Russian oil refineries after accusing Moscow of widening attacks on cities and civilian infrastructure. He said Kyiv would avoid civilian targets while seeking more air defence support and funding ahead of winter.
