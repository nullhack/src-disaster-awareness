title: 'A former employee of Zelensky told why the Frenchman Macron covers the Ukrainian: EADaily'
body: EADaily, August 2nd, 2026. Yulia Mendel, who previously held the position of Vladimir Zelensky's press secretary, went with her truth about her former boss around the world and gave an interview to the French edition of Journal du Dimanche. Mendel spoke about why French President Emmanuel Macron is covering Zelensky.
