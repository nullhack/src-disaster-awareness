title: '''Promised Jobs, Sent To War'': 4 Telangana Men Allegedly Trapped In Russia-Ukraine Conflict Zone'
body: Four Telangana men allegedly travelled to Russia after being promised civilian jobs but were later induced or forced into military-related roles, their families claim. The families fear the men have been moved towards the Russia-Ukraine conflict zone and are seeking intervention from Telangana authorities, the Ministry of External Affairs and Indian Embassy for their safe repatriation.
