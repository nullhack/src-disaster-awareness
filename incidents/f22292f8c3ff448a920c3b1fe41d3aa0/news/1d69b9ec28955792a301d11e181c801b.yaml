title: 'Ukraine: Russia’s increased attacks on energy and heating infrastructure ‘creating a deadly situation for civilians’'
body: Russia’s increased targeted attacks on energy and heating infrastructure risks creating a new humanitarian catastrophe for civilians ahead of winter, Amnesty International warned today. The civilian death toll during Russia’s full-scale illegal invasion has increased significantly in recent months, with October 2026 expected to be one of the deadliest periods for civilians in years. Based […]
