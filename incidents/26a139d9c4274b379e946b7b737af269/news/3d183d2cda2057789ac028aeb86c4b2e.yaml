title: Nepal secures $20 million loss and damage grant, but spending priorities remain undecided
body: <p>Kathmandu, October 27 Nepal is set to receive a grant of more than Rs 3 billion (US$20 million) from the Fund for Responding to Loss and Damage, becoming the first country to have funding allocated under the United Nations climate change framework. The fund’s board approved the allocation at a special meeting held on October […]</p>
