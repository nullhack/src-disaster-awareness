title: India sends another 11 tonnes of relief supplies to flood-hit Nepal
body: Continuing with its humanitarian assistance to Nepal, India on Saturday sent another 11 tonnes of relief supplies to support the Himalayan nation’s recovery from the devastating flash floods.
