title: 'Nepal SAR: Specialised tech paves way after two offers declined, says SMART commander'
body: 'PUTRAJAYA: Malaysia''s third offer to assist Nepal in its search and rescue (SAR) operations for mud flood victims was accepted after two earlier offers were turned down, paving the way for the deployment of the Special Malaysia Disaster Assistance and Rescue Team (SMART), equipped with technical expertise and advanced detection equipment.'
