title: 'Nepal floods: Good chance that trapped workers are still alive in hydropower plant, official says'
body: 'KATHMANDU: There is a high chance that dozens of workers may be found alive after a week trapped in an underground chamber at Nepal''s Rasuwagadhi hydropower plant following deadly flash floods, a Nepal Electricity Authority official said on Wednesday (Sept 2).'
