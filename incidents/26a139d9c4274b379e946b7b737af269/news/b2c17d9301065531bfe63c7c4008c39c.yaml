title: Thousands still missing in Nepal after devastating floods | Arkansas Democrat Gazette
body: KATHMANDU, Nepal -- A month after devastating floods swept through parts of Nepal, thousands are displaced and rescuers continue searching for thousands still missing, including many believed trapped in six hydropower project tunnels.
