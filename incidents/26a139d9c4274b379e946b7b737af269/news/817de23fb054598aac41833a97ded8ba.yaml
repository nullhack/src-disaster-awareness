title: India announces a $1.6 billion aid package for Nepal’s flood recovery
body: India has announced a $1.62 billion aid package to help Nepal rebuild after devastating floods. The Aug. 26 floods destroyed infrastructure and caused $4.7 billion in losses, according to Nepali authorities.
