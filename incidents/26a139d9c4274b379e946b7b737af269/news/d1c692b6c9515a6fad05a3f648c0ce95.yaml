title: Floods and landslides block major highways
body: 'KATHMANDU: Floods and landslides have disrupted several major highways in Bagmati and Gandaki provinces, causing delays and affecting road connectivity in various areas. According to Nepal Police, all major highways in Rasuwa district have remained completely blocked since the floods on August 26. Authorities said the affected routes will remain closed until further notice. The […]'
