title: भोटेकोशी बाढीः पर्यटन क्षेत्रमा रु ५२ अर्बभन्दा बढीको क्षति
body: काठमाडौं। भोटेकोशी तथा त्रिशूली नदीमा आएको बाढी र त्यसपछिको पहिरोबाट नेपालको पर्यटन क्षेत्रमा रु ५२ अर्ब ६७ करोड ४५ लाख ७६ हजार ५०० बराबरको प्रारम्भिक आर्थिक क्षति भएको प्रतिवेदन पेश गरिएको छ। क्षतिग्रस्त पर्यटन क्षेत्रको पुनरुत्थान तथा भविष्यमा हुने विपद्का लागि पूर्वतयारीलाई व्यवस्थित बनाउन पुनर्रुत्थानको मस्यौदा तयार गर्ने जिम्मेवारीसमेत सम्बन्धित समितिलाई दिइएको छ। संस्कृति, पर्यटन […]
