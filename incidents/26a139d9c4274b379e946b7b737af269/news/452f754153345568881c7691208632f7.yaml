title: China-Nepal friendship holds strong amid mudslide disaster
body: People from both Nepal and China can overcome the mudslide only through solidarity and joint efforts. There is no place for anti-China narratives while people are grieving, and Nepal cannot afford to be anyone’s geopolitical tool.
