title: Nepal urges stronger global climate action
body: Addressing the National Climate Summit 2026 organised ahead of Conference of Parties (COP 31), which is scheduled to take place in Antalya, Turkiye from November 9 to November 20, 2026, Minister Khanal said that the devastating flood of August 26 inflicted immense human suffering and extensive damage upon Nepal's infrastructure, livelihoods, and economy.
