title: Nepal flood death toll at 1,259, missing figure jumps to 5,083 - Jamaica Observer
body: KATHMANDU, Nepal (AFP)—Devastating floods on the China-Nepal border have killed at least 1,259 people in Nepal, the disaster authority said Thursday, reporting a sharp rise in the number of missing, at 5,083. Chinese state media reported 21 people killed in Tibet and 541 missing, taking the total toll from the August 26 disaster to 1,280 dead and 5,624 missing.
