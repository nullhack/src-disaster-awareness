title: പ്രളയത്തിൽ തകർന്ന നേപ്പാളിന് യുഎൻ സഹായം; അനുവദിച്ചത് 21.6 ദശലക്ഷം ഡോളർ
body: പ്രളയത്തിൽ തകർന്ന നേപ്പാളിന് യുഎൻ കാലാവസ്ഥാ ഫണ്ടിൽ നിന്ന് 180 കോടി രൂപയുടെ അടിയന്തര സഹായം. പുനർനിർമാണത്തിന് 40,000 കോടി രൂപ വേണ്ടിവരുമെന്നാണ് കണക്ക് | The UN climate disaster fund has reportedly approved $21.6 million in emergency aid for flood-hit Nepal, as reconstruction costs reach an estimated $4.77 billion
