title: 'Bhote Koshi floods: 677 transport workers unaccounted for'
body: 'KATHMANDU: The Nepal Truck Transport Entrepreneurs Federation has reported that 677 transport workers remain unaccounted for following the Bhote Koshi floods. The Federation disclosed the information during a meeting held on Thursday under the coordination of Rajiv Pokharel, Director General of the Department of Transport Management. It also reported that 515 trucks and containers have […]'
