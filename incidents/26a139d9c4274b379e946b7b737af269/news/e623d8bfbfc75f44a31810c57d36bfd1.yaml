title: बाढी विस्थापितले किन पाएनन् घरभाडाको १५ हजार ?
body: १५ कात्तिक, काठमाडौं । बाढीबाट विस्थापित रसुवा उत्तरगया–४ तल्लो पैरेबेँसीको थापा परिवार भाडाको कोठामा बस्छ । तर सरकारले उपलब्ध गराउने भनेको घर भाडावापतको मासिक १५ हजार रकम पाएको छैन । थापा परिवारमा ५ घरधुरी छ । …
