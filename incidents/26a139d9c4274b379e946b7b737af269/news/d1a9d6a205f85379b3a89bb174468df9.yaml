title: Catastrophic floods kill 362 in Nepal and Tibet, over 1,400 missing (with photos)
body: 'DEVIGHAT, Nepal: (AP) Rescue teams searched on Thursday (Aug 27) for hundreds of missing people along the Nepal-China border, where a catastrophic and deadly torrent of water and mud several stories high swept through communities a day earlier following a glacier collapse.'
