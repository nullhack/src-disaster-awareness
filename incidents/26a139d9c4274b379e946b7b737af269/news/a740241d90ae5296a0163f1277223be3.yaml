title: Balen Shah thanks India, China for flood aid after Nepal minister's ‘climate compensation’ demand from both countries- Moneycontrol.com
body: Nepal PM Balen Shah thanked India and China for swiftly sending aid and rescue teams after the devastating floods. His remarks come after Nepal sought ‘climate compensation’ from India, China and the US.
