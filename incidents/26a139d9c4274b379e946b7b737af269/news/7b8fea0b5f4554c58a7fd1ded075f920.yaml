title: Climate change was key factor in deadly Nepal-China flood, scientists say
body: Researchers said the flood was caused by a "compound crisis" shaped by long-term warming, glacier retreat, permafrost thaw and geological instability. A 2015 earthquake is also thought to have played a role.
