title: आफ्नै स्वामित्वको जग्गामा बस्न चाहन्छन् रसुवा बाढीका आधा प्रभावित
body: ८ कात्तिक, काठमाडौं । रसुवा-भोटेकोशी बाढीबाट थातथलो गुमाएकामध्ये करिब आधाले आफ्नै जग्गामा बस्ने चाहना व्यक्त गरेका छन् । बाढीअघि बसोबास गरिरहेकै स्थान वा आफ्नो स्वामित्वको अन्यत्रको जग्गामा बस्न चाहनेको संख्या ४९.५९ प्रतिशत देखिएको छ । त्यसमध्ये चौथाइभन्दा …
