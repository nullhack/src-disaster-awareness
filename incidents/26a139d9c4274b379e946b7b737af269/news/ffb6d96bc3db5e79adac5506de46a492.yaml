title: 'Fact Check: क्या पानी के तेज बहाव में बहती गाड़ियों का यह वीडियो नेपाल-तिब्बत सीमा का है?'
body: सोशल मीडिया पर नेपाल और थाईलैंड में आई बाढ़ से जोड़कर दो अलग-अलग वीडियो तेजी से वायरल हो रहे हैं. पहले वीडियो में पानी के तेज बहाव में गाड़ियों के बहने का दृश्य दिखाकर दावा किया गया कि यह नेपाल-तिब्बत सीमा पर आई बाढ़ का है. पड़ताल के दौरान वीडियो में गाड़ियों के अप्राकृतिक तरीके से तैरने और धुंधली नंबर प्लेट जैसी खामियां मिलीं. एआई डिटेक्शन टूल्स की जांच में यह वीडियो 80 से 89 प्रतिशत तक एआई जनरेटेड पाया गया. वहीं दूसरे वीडियो में थाईलैंड की राजधानी बैंकॉक में बाढ़ के पानी में सड़कों पर मछलियों के तैरने का दावा किया गया. जांच में सुविधा स्टोर के साइन बोर्ड पर गलत वर्तनी, पानी की कम गहराई और स्थिर गाड़ियां दिखाई दीं. एआई डिटेक्शन टूल ने 97 प्रतिशत संभावना के साथ इसे भी एआई जनरेटेड बताया. इस तरह दोनों वायरल दावे पूरी तरह भ्रामक और फर्जी साबित हुए.
