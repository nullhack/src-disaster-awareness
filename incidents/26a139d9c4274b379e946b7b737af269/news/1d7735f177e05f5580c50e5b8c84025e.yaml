title: Rescuers dig four bodies out of Nepal tunnel as families demand answers
body: Rescuers in Nepal have recovered four bodies from the tunnel of a hydropower plant as search operations continued for those still missing three weeks after the devastating flash flood last month that killed hundreds and left thousands missing.
