title: 'Bhotekoshi flood: Nepal Police steps up efforts amid challenges'
body: 'KATHMANDU: Despite limited resources, Nepal Police has been continuously mobilising all available mechanisms to fulfil its responsibilities and respond to the challenges created by the Bhotekoshi flood. Immediately after the flood entered Nepal from the Nepal-China border in Rasuwa, police personnel have been working round the clock from the affected areas to downstream settlements, prioritising […]'
