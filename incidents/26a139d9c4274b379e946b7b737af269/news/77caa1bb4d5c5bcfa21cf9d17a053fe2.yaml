title: 'Nepal Floods Displace Thousands: Citizens & Influencers Bring Aid to Nuwakot Relief Camps'
body: A ground report from Nuwakot highlights the massive displacement in Nepal caused by severe flooding and destruction, leaving thousands dependent on emergency relief camps. After losing homes and livelihoods within days, affected families and children are facing harsh conditions while waiting for aid. Amid the crisis, the citizens of Nepal, ranging from residents of the Terai to the hilly terrain, are uniting to support those in distress. Social media influencers and local volunteers are actively reaching remote areas to supply essential aid, including food, clothes, and vital supplies to those in need.
