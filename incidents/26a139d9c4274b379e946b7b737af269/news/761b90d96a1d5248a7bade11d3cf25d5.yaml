title: Nepal floods death toll climbs to 1,377; search operations continue for more than 5,000 missing - DD India
body: The death toll from flash floods in Nepal rose to 1,377 on Thursday as more bodies were recovered from the affected districts, while rescue and search operations continued for more than 5,000 missing people, authorities said. At least 364 bodies have been recovered from Chitwan district, 228 from Nawalparasi East, 222 from Nawalparasi West and […]
