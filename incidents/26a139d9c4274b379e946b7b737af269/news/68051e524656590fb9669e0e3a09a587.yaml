title: Retired UC Davis dean and his wife among thousands missing after Nepal-Tibet floods, family says
body: Rao Unnava, who retired in June as dean of the Graduate School of Management, and his wife, Vasundhara, a former business lecturer, were on a retirement trip in Nepal when the flooding hit. Now, they are among the thousands who are still unaccounted for.
