title: 'BNM: Banks extend repayment deferments to Nepal-China flood victims'
body: 'KUALA LUMPUR: Bank Negara Malaysia (BNM) said banks have extended repayment deferments to all victims affected by the Nepal-China floods, while additional financial assistance is being considered for their families.'
