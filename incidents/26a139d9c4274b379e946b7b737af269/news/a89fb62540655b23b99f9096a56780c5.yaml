title: भोटेकोशी बाढीको विपद्, उद्धार र पुनर्निर्माणको कथा ‘द सनसाइन फ्लड’
body: ललितपुर।रसुवा, नुवाकोट, धादिङलगायत भोटेकोशी–त्रिशूली नदी करिडोरमा गत भदौ १० गते आएको बाढी र त्यसबाट भएको मानवीय तथा भौतिक क्षति, उद्धार र खोजीको अनुभव तथा विपद्पछिको राहत र पुनर्निर्माण प्रयासलाई समेटेर ‘द सनसाइन फ्लड’ पुस्तक प्रकाशित भएको छ। तरङ्ग नेपालले शनिबार ललितपुरमा आयोजना गरेको कार्यक्रममा पुस्तकको आवरण सार्वजनिक गरिएको हो। कार्यक्रममा विपद् व्यवस्थापन, इन्जिनियरिङ, अनुसन्धान तथा […]
