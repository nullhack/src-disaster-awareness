title: UN climate fund promises $20 million for Nepal flood recovery, far short of billions needed
body: Disaster-hit Nepal will receive $20 million from the United Nations to help the Himalayan country recover from the devastating floods that killed thousands and destroyed buildings, schools, roads and dams resulting in billions of dollars of damages
