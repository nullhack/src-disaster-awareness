title: Nepal flood losses estimated at $2.56 billion, official says
body: KATHMANDU, Sept 4 - Property, housing and infrastructure worth at least $2.56 billion (387.5 billion Nepalese rupees) was damaged in the Nepal's catastrophic floods last week, the country's disaster authority chief told Reuters on Friday.
