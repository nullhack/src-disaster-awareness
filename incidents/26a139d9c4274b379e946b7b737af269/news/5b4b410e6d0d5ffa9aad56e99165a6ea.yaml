title: Nepal flood toll reaches 1,356 as searches continue for 5,000 missing
body: Nepal is mourning its flood dead as rescuers search for nearly 5,000 missing people. The disaster has deepened calls for climate justice and raised fresh fears for tourism and livelihoods.
