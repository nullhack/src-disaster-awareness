title: PSDN provides emergency health services in flood-hit Nuwakot, Rasuwa
body: Partnership for Sustainable Development Nepal (PSDN), with financial and technical support from Project HOPE, conducted 26 emergency medical and public health service deployments in flood-affected areas of Nuwakot and Rasuwa between September 6 and 30.
