title: Nepal flood rescue dogs help teams locate 26 bodies under debris
body: Police and APF sniffer dogs are helping rescuers trace bodies buried after Nepal's Bhotekoshi floods. Their work has become crucial in unstable debris fields where human teams struggle to reach.
