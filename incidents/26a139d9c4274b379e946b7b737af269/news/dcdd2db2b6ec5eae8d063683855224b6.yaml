title: UN Climate Fund Votes to Help Nepal, a Historic Step Far Short of the Need - Inside Climate News
body: A United Nations fund to help developing nations pay the costs imposed by climate change voted Thursday to allocate money for Nepal as the country recovers from devastating flooding in August. It was a historic step for the fund—the first time it has allocated money to a vulnerable country in an immediate response to climate […]
