title: 'Nepal floods: Survivors return as death toll crosses 750, 2,500 missing'
body: Survivors are returning to flood-ravaged towns in Nepal as rescuers search for the missing. The scale of loss, with hundreds dead and thousands untraced, has turned recovery into a long struggle.
