title: UN urges accurate, ethical reporting on Rasuwa flood disaster
body: The United Nations in Nepal has urged media organisations, authorities and the public to ensure that information related to the recent flash floods in Rasuwa is accurate, verified and shared with due regard for the privacy and dignity of affected people.
