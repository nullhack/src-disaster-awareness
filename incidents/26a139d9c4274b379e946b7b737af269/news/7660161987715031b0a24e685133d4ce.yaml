title: నేపాల్ వరదలు.. 6 వేల మంది గల్లంతు.. ఇప్పటికీ తెలియని ఆచూకీ
body: ఆకస్మిక వరదలు మిగిల్చిన విషాదం నుంచి నేపాల్ కోలుకోలేకపోతోంది. గత నెలలో సంభవించిన వరదల్లో గల్లంతైన 6 వేల మంది ఆచూకీ ఇంకా తెలియరాలేదని నేపాల్ అధికారయంత్రాంగం ఆదివారం పేర్కొంది.
