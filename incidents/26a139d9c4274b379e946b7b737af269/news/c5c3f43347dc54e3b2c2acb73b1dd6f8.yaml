title: 'Nepal floods: Small lab in Kathmandu holds hope of identifying missing victims from 30 nations'
body: 'KATHMANDU: The cold, nondescript laboratory in the Khumaltar neighbourhood in Lalitpur has never been busier. But its softly beeping machines, frayed sofas and hushed hallways betray no sign that it holds the key to one of the world''s largest and most complex disaster victim identification projects.'
