title: Mud and steep cliffs hamper efforts to reopen flood-hit roads
body: Kathmandu, Sept. 19 -- Mud, unstable ground and steep cliffs are hampering efforts to reopen the Dhunge-Betrawati road, a key route linking the flood-hit areas with the rest of the country.
