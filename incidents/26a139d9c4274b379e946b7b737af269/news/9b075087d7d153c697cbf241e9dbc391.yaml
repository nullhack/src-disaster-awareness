title: 'Nepal floods: Over 800 people remain missing from hydropower projects, says energy minister'
body: 'KATHMANDU: More than 800 people working at hydropower projects and related facilities remain unaccounted for nearly a month after the Bhotekoshi floods, Minister for Energy, Water Resources and Irrigation Biraj Bhakta Shrestha told Parliament on Wednesday (Sept 23).'
