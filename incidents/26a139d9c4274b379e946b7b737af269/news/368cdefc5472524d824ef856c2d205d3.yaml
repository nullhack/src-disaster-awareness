title: Say it in Antalya, write it in Kathmandu
body: Within weeks of the rock-wall collapse that cascaded into a debris flood down the Bhotekoshi-Trishuli on 26 August, the Ministry of Agriculture, Forests and Environment did something that deserves notice. It took stock.
