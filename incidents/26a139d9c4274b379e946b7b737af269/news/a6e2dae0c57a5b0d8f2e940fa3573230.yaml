title: Floods disrupt access to healthcare in Nepal
body: 'KATHMANDU: On August 29, three days after the devastating Bhotekoshi floods, Milan Raila, an eight-year-old from Rasuwa, woke up suddenly at 4 in the morning and complained of severe abdominal pain.'
