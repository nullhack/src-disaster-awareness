title: India Sends Another 11 Tonnes of Relief Material to Flood-Hit Nepal - DD India
body: India has dispatched another 11 tonnes of humanitarian relief material to flood-hit Nepal as the neighbouring country continues large-scale search, rescue and relief operations following devastating floods and landslides. The latest consignment includes medicines, forensic supplies, tents, hygiene kits, sleeping bags and other essential items. External Affairs Minister S Jaishankar said India remains committed to […]
