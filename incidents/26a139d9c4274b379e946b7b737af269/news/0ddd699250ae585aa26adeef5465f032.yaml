title: Nepal to declare 213 missing Indians dead after August flash floods, Embassy invites objections from families- Moneycontrol.com
body: Nepal has begun the process of formally declaring 213 Indian nationals dead after they went missing in the August flash floods. Families can submit objections or corrections to the list through the Indian Embassy by December 2.
