title: Nepal bridge wiped out by raging flood waters
body: A torrent of water swept away several bridges, damaged homes and caused widespread flash flooding in Nepal on Oct. 11. Video shows the Soti Khola bridge on the Budhi Gandaki River being swept away by raging waters.
