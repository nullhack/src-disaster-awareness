title: 'Nepal floods: Wisma Putra waiting for word if any M''sians among 31 rescued'
body: 'PETALING JAYA: The Foreign Affairs Ministry (Wisma Putra) is still awaiting confirmation as to whether any Malaysians were among the 31 foreign nationals rescued by Nepalese authorities.'
