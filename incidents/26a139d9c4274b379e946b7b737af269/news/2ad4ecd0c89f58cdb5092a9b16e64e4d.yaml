title: बाढी प्रभावित क्षेत्रमा रोयम नेपालले वितरण गर्यो राहत सामग्री
body: <p>काठमाडौँ । भोटेकोशी–त्रिशूली बाढी प्रभावित रसुवाको उत्तरगया गाउँपालिका-२ डाँडागाउँमा जोखिममा रहेका परिवारलाई राहत सामग्री वितरण गरिएको छ । गैरसरकारी संस्था स्टार्ट फन्ड एन–नेपालको सहयोगमा एकीकृत मानवीय तथा प्रारम्भिक पुनःप्राप्ति कार्यक्रम मार्फत त्यहाँका बाढी प्रभावित ६० घरपरिवारलाई राहत सामग्री वितरण गरिएको ग्रामीणमुखी युवा अभियान (रोयम) नेपालका कार्यकारी निर्देशक लुभराज न्यौपानेले जानकारी दिए । बाढीबाट प्रभावित र […]</p>
