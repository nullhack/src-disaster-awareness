title: 'Nepal floods: PERKESO payments to next of kin expected on Nov 4, says Masfih'
body: 'KUALA LUMPUR: The disbursement of Social Security Organisation (PERKESO) payments to the next of kin of Malaysians who perished in the Nepal-Tibet flood is expected to be expedited, with payments scheduled for Nov 4, says Malaysia Solidarity Families in Hope (Masfih).'
