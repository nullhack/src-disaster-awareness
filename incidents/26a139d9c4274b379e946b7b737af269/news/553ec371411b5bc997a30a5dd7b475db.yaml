title: Mitsubishi Electric to Support Relief Efforts Near Nepal–China Border Following Flooding and Debris Flows
body: 'TOKYO, September 28, 2026--Mitsubishi Electric Corporation (TOKYO: 6503) announced today that the Mitsubishi Electric Group will donate a total of 5 million yen (approximately US$ 32,000) to aid victims of flooding and debris flows that occurred near the Nepal–China border in August.'
