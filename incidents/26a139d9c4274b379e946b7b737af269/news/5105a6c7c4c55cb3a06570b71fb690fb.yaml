title: UN Loss and Damage Fund provisionally approves $21.6 million for flood-hit Nepal
body: Nepal, which suffered a catastrophic debris flow and flash flood on August 26, is slated to receive $21.6 million from the United Nations’ Fund for Responding to Loss and Damage (FRLD). The decision to “provisionally” release the funds was finalised during an “extraordinary meeting” convened by the Fund’s board on October 22. Nepal will still […]
