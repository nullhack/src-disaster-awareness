title: Climate change made flood-ravaged Nepal vulnerable even before current disaster - The World from PRX
body: In a place that’s prone to flooding and landslides, the recent disaster that struck along Nepal’s border with Tibet still came as a shock. As recovery efforts continue, everyone from locals to scientists are trying to find the cause of the massive floods and what can be done to prevent them in the future.
