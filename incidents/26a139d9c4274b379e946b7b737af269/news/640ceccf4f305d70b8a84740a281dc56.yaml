title: 'Aug. 27: Flash Flooding Overwhelms Nepal, and Jury Deliberates in Lindsay Clancy’s Murder Trial'
body: Devastating flash floods and mudslides wreaked havoc along the Nepal-China border this week, leaving hundreds dead and more than 1,000 missing. More than 500 foreigners are among the missing, including, by one estimate, roughly 65 Americans. NBC News correspondent Janis Mackey Frayer explains why the destruction happened without warning and what role climate change may have played. Then, jury deliberations are underway in the murder trial of Lindsay Clancy, who killed her three young children. While Clancy doesn’t dispute the killings, her defense team is arguing that she shouldn’t be held criminally responsible because she was experiencing postpartum psychosis. But the prosecution insists she acted intentionally and deliberately. As the jury weighs a set of complex outcomes, NBC News legal analyst Misty Marris breaks down what evidence and testimony from the five-week trial could be key to reaching a verdict. Finally, 2026 could be the year of the foldable phone. Samsung and Google
  already have models on the market, and Apple is reportedly planning to drop its version in September. But are consumers willing to shell out $2,000 for a little extra screen? NBC News chief tech analyst Joanna Stern explains why the phones have appeal.
