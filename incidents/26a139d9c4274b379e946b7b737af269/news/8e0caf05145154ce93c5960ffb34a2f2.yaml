title: 'Voices from Sole, Nuwakot: Losing my family and village in the 26 August 2026 Nepal floods'
body: On 26 August 2026, devastating flash floods struck Nepal’s Rasuwa, Nuwakot, and Dhading districts along the Nepal–Tibet border, sweeping away homes, roads, and bridges and cutting off entire communities from the rest of the country.
