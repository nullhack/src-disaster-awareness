title: 'Fact Check: Vietnamese & Indian kids falsely shared as Nepal flood victims'
body: Two unrelated videos of children in distress were shared online as footage of Nepal flood victims. The posts falsely linked an Indian borewell clip and a Vietnamese aid video to the disaster.
