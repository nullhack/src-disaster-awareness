title: 'The missing middle of disaster recovery: Rebuilding roads is not enough if businesses cannot restart'
body: 'When we talk about disaster recovery, we usually talk about roads, bridges, houses and public infrastructure. We assess the damage, calculate losses and begin discussing reconstruction. But while moderating a panel at the 5th National Conference on Disaster Risk Reduction (NCDRR) 2026, following the Bhotekoshi–Trishuli floods, one question kept coming back to me: What happens to the business owner the morning after the relief phase ends?'
