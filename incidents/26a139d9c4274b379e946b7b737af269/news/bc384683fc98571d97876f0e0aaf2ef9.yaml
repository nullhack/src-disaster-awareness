title: 'भोटेकोशी बाढी : ४३० मेगावाट विद्युत् अवरुद्ध भएपछि वैकल्पिक व्यवस्थापन गरिँदै'
body: काठमाडौं। रसुवाको भोटेकोशी नदीमा आएको विनासकारी बाढीका कारण विभिन्न जलविद्युत् आयोजनामा क्षति पुगेर ४३० मेगावाट विद्युत् राष्ट्रिय प्रसारण प्रणालीबाट बाहिरिएपछि सरकारले वैकल्पिक विद्युत् व्यवस्थापनको गृहकार्य अघि बढाएको छ। बाढीका कारण त्रिशूली करिडोरबाट काठमाडौँको बालाजु र चपली क्षेत्रमा आउने विद्युत् अवरुद्ध भएपछि ती क्षेत्रमा पर्ने प्रसारण लाइनमा चाप बढेको छ। यही अवस्थालाई ध्यानमा राख्दै ऊर्जा, जलस्रोत […]
