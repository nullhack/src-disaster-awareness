title: भोटेकोशी बाढीबाट सर्वस्व गुमाएकी ६ महिने गर्भवतीलाई कोरियन नागरिकहरूको १५ हजार ६०० सय सहयोग
body: <p>सियोल । नेपाली समाजमा एउटा प्रचलित उखान छ, एक थुकी सुकी, सय थुकी नदी ! अर्थात् थोरै थोरै गरेर धेरै जनाबाट संकलन गरिएको सानो सहयोगले पनि ठूलो समस्या सजिलै टर्न सक्छ । यही उखानले भने झैँ भोटेकोशी बाढीपीडित महिलाको सहयोगार्थ कोरियाको एक सिप बिल्डिङमा काम गर्ने कोरियन नागरिकहरूले सहयोग रकम संकलन गरेर नेपाल पठाएका छन् […]</p>
