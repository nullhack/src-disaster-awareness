title: For wild rivers like the Karnali, Nepal’s disaster is a warning and an answer (commentary)
body: Recently, a glacial collapse on the Tibetan Plateau sent a wall of water and debris roaring across the Nepal-China border. As of this publication, more than 1,000 people are confirmed dead and over 4,000 remain missing in Nepal and China combined. Rescue crews are still digging through mud to find hundreds of workers believed trapped […]
