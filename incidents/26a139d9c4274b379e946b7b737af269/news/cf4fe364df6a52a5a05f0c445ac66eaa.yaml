title: N.C. South Asian communities rally behind those affected by Nepal flood
body: The Nepal Center of North Carolina organized a candlelight vigil to honor the victims of the 2026 Nepal-Tibet floods. Community members shared personal stories and fundraising initiatives for those affected.
