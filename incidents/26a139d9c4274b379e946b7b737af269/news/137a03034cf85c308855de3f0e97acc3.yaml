title: Nepal flood survivor's family in China relieved after days of anxious waiting
body: Lu Haitao’s family can finally breathe a sigh of relief after the Chinese man's rescue from a tunnel that protected him from the Nepal flooding. The devastating floods on Aug. 26 killed more than 1,300 people and nearly 4,900 remain missing in Nepal alone. Rescuers carried out Lu from a 225-meter hydropower tunnel on Saturday, 10 days after the floods, and evacuated him by a helicopter. His sister told Chinese state media that before the rescue, she was unable to eat or sleep well. She said it is a stroke of sheer luck amid the misfortune that her brother was saved.
