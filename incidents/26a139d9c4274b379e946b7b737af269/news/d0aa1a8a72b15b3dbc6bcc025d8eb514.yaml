title: Manang landslide briefly blocks Marsyangdi River amid Nepal monsoon rains
body: A major landslide in Nepal's Manang district sent debris into the Marsyangdi River on Sunday. The brief blockage revived monsoon fears as authorities warned vulnerable communities to stay alert.
