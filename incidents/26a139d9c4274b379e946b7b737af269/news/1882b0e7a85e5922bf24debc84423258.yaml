title: Nepal flood survivors face uncertain future as winter approaches
body: 'KATHMANDU: The children were running towards the road, screaming. At the time, Sabitri Tamang was in her field at Satbise, Nuwakot, gathering fodder for her cattle, when she saw students from the nearby Shree Ramchandra Basic School fleeing. She asked them what had happened.'
