title: India approves electricity exports to flood-hit Nepal
body: 'NEW DELHI: India approved the export of electricity to Nepal on Monday (Sept 14) to help its neighbour overcome shortages caused by extensive damage to its hydropower projects from catastrophic floods last month.'
