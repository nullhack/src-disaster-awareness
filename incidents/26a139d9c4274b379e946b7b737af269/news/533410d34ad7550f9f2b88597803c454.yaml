title: ‘Some claims paid to next of kin’
body: 'KUALA LUMPUR: Insurance claims involving Malaysians missing after flash floods in Nepal are being progressively settled, with at least 12 policies already paid out to their next of kin, says the General Insurance Association of Malaysia (PIAM).'
