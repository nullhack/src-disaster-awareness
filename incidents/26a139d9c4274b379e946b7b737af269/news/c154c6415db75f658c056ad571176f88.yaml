title: 'Photos: The Aftermath of Nepal’s Flash Floods'
body: Images from hard-hit mountain villages where rescue and recovery efforts continue. More than 900 deaths have been confirmed, while nearly 4,000 remain missing, following powerful floods triggered by a glacier collapse on August 26.
