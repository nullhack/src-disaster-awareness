title: Nepal Disaster Has Sounded a Climate Alarm, China Minister Warns | Today News
body: China’s top environment official pointed to August’s deadly glacial collapse and flooding in Nepal as an urgent warning about the accelerating risks of climate change, as world leaders and diplomats prepare for annual global talks.
