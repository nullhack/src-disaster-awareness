title: Nepal floods trigger fish scare in Bihar, why has the government warned people not to eat, buy or sell fish caught in floodwaters?
body: In a stern warning, the Bihar government has cautioned people to avoid consuming “unfamiliar and unusual” fish in floodwaters entering the state's rivers from Nepal.
