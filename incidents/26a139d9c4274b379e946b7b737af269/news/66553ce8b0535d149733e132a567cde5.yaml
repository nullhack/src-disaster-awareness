title: Funerals in Nepal for missing, a week after deadly floods
body: Emergency teams have recovered more than 1,000 bodies, and nearly 4,500 people are missing after the gigantic wave of freezing water, rocks and debris triggered by a high-altitude glacial collapse roared down the China-Nepal border on August 26.
