title: Delayed death verification leaves Bhotekoshi flood-hit families without relief
body: <p>Kathmandu, November 9 Seventy-five days after the devastating floods in Bhotekoshi on August 26, the government is yet to establish the fate of thousands of people reported missing. Families of the missing are still waiting for confirmation, while flood survivors continue to face difficulties accessing relief assistance. According to the latest figures released by the […]</p>
