title: 'Nepal-Tibet disaster: At least 43 dead from flooding, mudslides in Tibet'
body: The death toll from the devastating mudslide in Tibet, near the China-Nepal border, has risen to 43. Chinese officials say 519 people remain missing, while two people have been rescued. CNA has reached the main disaster site at Gyirong Port, where rescue teams were seen reinforcing a repaired stretch of the G216 nation
