title: Video of dam in western India falsely linked to Nepal flash flood
body: Catastrophic floods caused by a glacial collapse in Nepal in late August 2026 swelled the Gandak river system flowing into neighboring India, prompting authorities in eastern Bihar to open all 36 gates of the Gandak Barrage on August 26-27.
