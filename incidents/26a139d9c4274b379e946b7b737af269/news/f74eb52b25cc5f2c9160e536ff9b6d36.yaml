title: 'Nepal Floods: Over 1,200 Dead, Betrawati in Ruins as Trishuli Swells 20 Times'
body: Catastrophic flash floods in Nepal have left more than 1,200 people dead, over 4,200 missing, and nearly 12,000 rescued. Addressing Parliament, the Prime Minister stated that Nepal never refused international assistance and thanked India and China for stepping up with rescue and relief operations. Search teams continue operations inside hydropower tunnels as recovery efforts begin. Ground reports reveal complete devastation in Betrawati, the largest town at the foothills of Rasuwa, which was swept away after a glacial collapse. The Trishuli river expanded from a 30-metre stream to over 600 metres, washing away houses, schools, temples, and bridges. Meanwhile, visuals from Dhunge Bazaar show certain structures surviving despite being submerged in 12 to 15 feet of mud, while surrounding areas were destroyed.
