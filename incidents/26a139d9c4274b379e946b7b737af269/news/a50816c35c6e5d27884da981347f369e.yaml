title: बाढी प्रभावित क्षेत्रमा भएको क्षतिको तथ्याङ्क माग
body: काठमाडौं।राष्ट्रियसभाअन्तर्गतको भोटेकोशी एवं कालीगण्डकी करिडोर विपद्सम्बन्धी अध्ययन तथा अनुगमन संसदीय विशेष समितिले बाढी प्रभावित क्षेत्रमा कृषि, पशुपंक्षी, जलचर, खेतीयोग्य जमिन तथा जैविक विविधतामा भएको क्षतिको विस्तृत तथ्याङ्क उपलब्ध गराउन कृषि, वन तथा वातावरण मन्त्रालयलाई आग्रह गरेको छ। समितिको आजको बैठकमा समितिका सभापति कृष्णप्रसाद पौडेलले मन्त्रालयलाई यथाशीघ्र सूक्ष्मरुपमा प्रत्येक वडाको हानीनोक्सानी र क्षतिको विवरण उपलब्ध गराउन […]
