title: 'Nepal floods: Chinese rescuers search for missing after floods'
body: 'BEIJING: Chinese rescuers with dogs and drones joined the search for hundreds missing after flash floods and landslides struck the Nepal-Tibet border, state media reported Thursday (Aug 27).'
