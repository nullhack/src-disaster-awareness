title: भोटेकोशी बाढीः डीएनए रिपोर्टको प्रतीक्षामै बित्यो दसैँ
body: बाँके। गत भदौ १० गतेको भोटेकोशी बाढीमा बेपत्ता भएकाका परिवारले यस वर्षको दसैँ डीएनए परीक्षणको रिपोर्ट पर्खँदै बिताएका छन्। नेपालगञ्ज उपमहानगरपालिका–२० थपुवा निवासी अनलाल रोकायले बेपत्ता आफन्तको कुनै जानकारी नआएका कारण चाडपर्वका बेलामा पनि डीएनए रिपोर्ट कुरेर बसेको बताए। “बाढीमा हराएका हाम्रा मान्छेको अहिलेसम्म अत्तोपत्तो छैन”, उनले भने, “यो वर्षको दसैँ डीएनए परीक्षण रिपोर्टको पखाइमा […]
