title: Missing tourists in Nepal floods reach authorities | Arkansas Democrat Gazette
body: KATHMANDU, Nepal -- Tourists previously reported missing in Nepal have made contact with authorities, officials said Wednesday, as families of locals still unaccounted for after last week's catastrophic floods held symbolic funerals for their loved ones.
