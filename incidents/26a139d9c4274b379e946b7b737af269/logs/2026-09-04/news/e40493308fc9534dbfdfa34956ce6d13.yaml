title: Nepal flood toll hits 1,259 as families hold rites for missing kin
body: Nepal's flash flood death toll climbed sharply as rescuers pressed on and families began symbolic last rites for the missing. Rising river levels, cross-border relief efforts and glacier worries have deepened the sense of a long national emergency.
