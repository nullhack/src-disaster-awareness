title: Nepal floods could cost insurers over $130 mln even before death, injury claims
body: The devastating flood in Nepal last week could result in commercial insurance losses exceeding 20 billion Nepali rupees ($132.3 million), with hydropower projects accounting for most claims, according to a top official at one of the country's leading insurers.
