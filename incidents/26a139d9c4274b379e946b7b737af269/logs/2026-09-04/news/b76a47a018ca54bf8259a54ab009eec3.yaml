title: Nepal tunnel worker survives nine days chanting Hare Krishna, rescued on Janmashtami
body: A worker trapped for nine days inside Nepal’s Trishuli 3A tunnel was rescued alive on Friday. His survival account offered rare hope amid a wider hydropower disaster with many still missing.
