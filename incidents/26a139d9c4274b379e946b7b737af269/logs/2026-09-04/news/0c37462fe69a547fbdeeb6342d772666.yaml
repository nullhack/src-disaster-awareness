title: 5 days after Nepal-Tibet flood, missing Filipino doctor's family still waits
body: MANILA, Philippines — The family of Filipino doctor Juan Carlos Manalo is appealing for help in finding him after he went missing following the catastrophic flash flood along the Nepal-Tibet border last week.
