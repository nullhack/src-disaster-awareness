title: 'Nepal floods: Nepal PM says nation facing ''unimaginable'' disaster'
body: 'KATHMANDU: Nepal is facing an "unimaginable and heartbreaking" disaster with authorities struggling to assess the full scale of devastating floods that have killed hundreds, Prime Minister Balendra Shah has said.'
