title: Is the 26th really a disaster date? Nepal floods join a list spanning earthquakes, tsunamis and terror attacks- Moneycontrol.com
body: Nepal’s August 26 floods have added another tragedy to a long list of disasters recorded on the 26th. From the Gujarat earthquake to 26/11 and the Indian Ocean tsunami, the date has a grim history, but no scientific link.
