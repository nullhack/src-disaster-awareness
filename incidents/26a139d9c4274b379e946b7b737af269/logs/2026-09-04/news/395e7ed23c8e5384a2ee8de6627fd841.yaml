title: OPINION | Nepal Seeks Compensation From India, China-This Is Time To Talk, Not Squabble
body: Kathmandu's bid to penalise its neighbours India and China over the August 26 floods is misplaced and will only damage relations. Instead of blame-shifting, it must take charge and work with all.
