log_date: '2026-09-04'
summary: As of September 3-4, the death toll has risen to at least 1,259 in Nepal (1,280 including Tibet), with the missing figure jumping to over 5,000. Rescuers are searching an underground room where 46 workers may survive, while Nepal weighs relocating survivors and launches a tourism campaign to counter cancellations. Warnings about glacier instability on the Tibetan Plateau and a magnitude 5.0 earthquake in Tibet add to ongoing concerns, while misinformation including AI-generated images circulates online.
