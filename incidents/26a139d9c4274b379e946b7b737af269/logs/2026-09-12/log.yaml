log_date: '2026-09-12'
summary: As of September 11, the death toll from the Bagmati floods has risen to at least 1,420, with 5,649 still missing. Nepal's foreign ministry estimates reconstruction costs at $4.78 billion, while rebuilding the education sector alone will require Rs2.34 billion. DNA profiles of missing South African nationals have been sent to Nepalese police, and Prime Minister Shah plans to raise climate justice at the UN, as a Malaysian humanitarian mission arrives to assess survivor needs.
