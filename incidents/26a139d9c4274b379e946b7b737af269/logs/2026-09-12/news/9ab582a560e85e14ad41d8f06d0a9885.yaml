title: Nepal estimates US$4.74 billion needed for post-flood reconstruction, recovery
body: 'KATHMANDU: Nepal is estimated to need US$4.74 billion for reconstruction and recovery after a devastating mudslide struck its northern districts on Aug. 26, the Prime Minister''s Secretariat said Thursday.'
