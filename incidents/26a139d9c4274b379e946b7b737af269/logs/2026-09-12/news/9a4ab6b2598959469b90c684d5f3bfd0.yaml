title: DNA profiles of missing South Africans’ relatives sent to Nepal police
body: The department of international relations and co-operation says it has worked with the SAPS to collect DNA profiles from the biological relatives of South Africans missing in Nepal, with the profiles sent to Nepalese police and Interpol in Kathmandu
