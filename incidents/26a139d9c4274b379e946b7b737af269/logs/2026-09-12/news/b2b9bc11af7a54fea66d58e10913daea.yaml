title: Nepal-China flash floods death toll climbs to 1,420, at least 5,649 still missing
body: 'KATHMANDU: (Bernama-Anadolu) The death toll from devastating flash floods and mudslides along the Nepal-China border has climbed to 1,420, while 5,649 people remain missing, according to the latest official figures, Anadolu Ajansi (AA) reported'
