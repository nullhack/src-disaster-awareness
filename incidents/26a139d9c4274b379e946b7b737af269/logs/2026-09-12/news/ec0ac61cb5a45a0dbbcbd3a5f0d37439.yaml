title: Nepal flood reconstruction bill to be US$4.78 billion, says foreign ministry - Jamaica Observer
body: KATHMANDU, Nepal (AFP) -- Nepal estimates the reconstruction bill after deadly floods sparked by a glacial mountain collapse last month will amount to US$4.78 billion, the foreign ministry said on Friday. Prime Minister Balendra Shah has vowed to &quot;strongly raise&quot; with the international community the disasters that Nepal has experienced as a result of climate change. The August 26 catastrophe, a tsunami-like flood that began on the China-Nepal border, killed...
