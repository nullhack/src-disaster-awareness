log_date: '2026-09-13'
summary: |-
  UAE search and rescue teams located 10 more missing individuals in the flood-affected areas, raising the total number rescued by the UAE team to 18. An NPR investigation revealed China’s efforts to control the narrative about the disaster, and a personal essay reflected on the emotional impact of losing the town of Syabru Besi.
  The US approved an additional $1 million in forensic aid to support identification of flood victims, while Indian and Nepali rescue teams advanced in clearing debris inside the Chilime hydropower tunnel to reach six trapped workers. The government intensified efforts to reopen the Galchhi–Rasuwagadhi road, damaged by the floods. A personal story highlighted a tunnel survivor returning to his village after rescue and hospital recovery.
