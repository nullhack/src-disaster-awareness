title: 'Nepal floods: Death toll rises to 903, with 4,247 missing'
body: 'KATHMANDU: Devastating floods near the border with China have killed at least 903 people in Nepal, while the number of missing in the country has soared to 4,247, its disaster authority said Monday (Aug 31), as rescue efforts entered a sixth day'
