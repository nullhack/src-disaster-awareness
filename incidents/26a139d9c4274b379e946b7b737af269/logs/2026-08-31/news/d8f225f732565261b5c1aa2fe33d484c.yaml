title: This principal in Nepal evacuated 900 students before flooding swept away their school
body: But Dawadi is reluctant to accept the role of hero. For him, rescuing his students was his responsibility. Now he says, students will need psychological counseling. Then, lessons must begin again, even if the school must temporarily relocate.
