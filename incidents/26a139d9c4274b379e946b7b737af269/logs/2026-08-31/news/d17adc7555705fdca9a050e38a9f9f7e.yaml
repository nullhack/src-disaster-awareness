title: Nepal authorities issue more flood alerts | Arkansas Democrat Gazette
body: DHADING, Nepal -- Authorities in Nepal warned of possible fresh flooding on Sunday and urged residents in flood-affected districts to remain on high alert after water levels rose in the Bhotekoshi River.
