title: 'When a mountain falls: How ice and rock triggered Nepal''s catastrophic flood'
body: The catastrophic flood that killed hundreds of people in Nepal on Aug. 26, 2026, and left many more missing likely began with falling ice and rock crashing into the river below, but that wasn't the end of the disaster. Days later, a new lake pooled behind the debris and then burst, sending more water streaming through the valley.
