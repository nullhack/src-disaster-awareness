log_date: '2026-08-31'
summary: As of August 31, the death toll from the Bagmati flash floods has risen to at least 903, with over 4,200 people still missing. Rescue teams, aided by Chinese and Indian experts, are working around the clock to reach hundreds trapped in hydropower tunnels, while authorities warn of fresh flooding as water levels rise in the Bhotekoshi River. Mass burials of unidentified victims continue, and families of missing foreign nationals, including dozens of Americans and Australians, await news amidst the devastation.
