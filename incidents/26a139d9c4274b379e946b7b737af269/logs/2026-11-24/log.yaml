log_date: '2026-11-24'
summary: India has pledged a large economic and development package — reported variously as €1.4 billion, $1.6 billion or R28.2 billion — to help Nepal rebuild after the August 26 glacier flood, announced during Prime Minister Balendra Shah's first visit to a neighbouring country, alongside agreements on railway, hydropower and fuel infrastructure. Separate coverage months after the disaster describes survivors in Nuwakot still living with trauma, and a Malaysian relief team finding families and schools still struggling to rebuild as public attention fades.
