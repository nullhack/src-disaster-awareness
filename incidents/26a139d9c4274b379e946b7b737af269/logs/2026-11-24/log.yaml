log_date: '2026-11-24'
summary: |-
  India has pledged a large economic and development package — reported variously as €1.4 billion, $1.6 billion or R28.2 billion — to help Nepal rebuild after the August 26 glacier flood, announced during Prime Minister Balendra Shah's first visit to a neighbouring country, alongside agreements on railway, hydropower and fuel infrastructure. Separate coverage months after the disaster describes survivors in Nuwakot still living with trauma, and a Malaysian relief team finding families and schools still struggling to rebuild as public attention fades.
  During Prime Minister Balendra Shah's visit to India, New Delhi announced a $1.62 billion (240 billion Nepalese rupees, or Rs 15,120 crore) development cooperation package for Nepal's flood recovery — described as India's largest-ever financial package for its neighbour — alongside eight bilateral MoUs and the launch of the Saryu-Kamala Express connecting Ayodhya and Janakpur. Analysis coverage framed the aid as India moving to rebuild influence in Nepal amid competition with China, while placing the package against the roughly $4.7 billion in losses Nepal attributes to the August 26 floods.
