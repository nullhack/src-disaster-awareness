title: 'One month later: Few Nepal flood victims identified despite first large-scale DNA efforts'
body: After devastating floods killed thousands, Nepal launched its first large-scale DNA identification program. Yet, even with this unprecedented effort, the path to closure remains painfully difficult. Reuters examined the complex, fragile recovery process and the barriers families still face.
