title: Nepal flood death toll surges to 1,410; over 6,100 still missing
body: Kathmandu, Sep 17 (PTI) The death toll from the devastating flash floods in Nepal surged to 1,410 on Thursday, with over 6,100 people still missing, according to the country's disaster management authorities.
