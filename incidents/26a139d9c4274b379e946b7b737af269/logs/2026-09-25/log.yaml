log_date: '2026-09-25'
summary: One month after the devastating Bagmati floods, Nepal’s Prime Minister Balendra Shah addressed the UN General Assembly, calling the disaster “a warning to the world” about Himalayan climate risks and appealing for grant-based international support. Authorities announced that approximately 33,000 survivors cannot return home and must resettle, while reports emerged of over 500 orphaned children and new heavy rain triggering travel curbs and school closures. Additional new information includes a scientific analysis of the flood’s causes and ongoing searches for 50 missing Ukrainian nationals.
