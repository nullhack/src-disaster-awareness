title: 'Nepal growth projected to slow to 3.7% after Rasuwa flood: World Bank'
body: Nepal's economic growth is projected to slow to 3.7 percent in fiscal year 2026-27 following the devastating Aug. 26 Rasuwa flood, which damaged critical infrastructure and disrupted economic activity, according to the World Bank's latest Nepal Development Update.
