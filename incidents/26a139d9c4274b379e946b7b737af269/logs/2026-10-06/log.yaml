log_date: '2026-10-06'
summary: |-
  Nepal ended its 40-day search for flood victims on October 5, reporting 5,285 people still missing and at least 1,455 dead. The National Council for Disaster Risk Reduction and Management recommended allocating $3.6 billion for 504 reconstruction and rehabilitation programs, including development of an emergency warning system. Separately, a family in the US began steps to declare a missing relative dead, highlighting ongoing personal tolls.
  The World Bank projects Nepal's economic growth will slow to 3.7% in fiscal year 2026-27 as a result of the damages from the August 26 Bagmati floods.
