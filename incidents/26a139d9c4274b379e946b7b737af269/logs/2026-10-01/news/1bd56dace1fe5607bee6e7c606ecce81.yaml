title: Nepal Monsoon Rains Kill 27, Leave Four Missing As Floods, Landslides Hit Country | Outlook India
body: At least 27 people have died and four remain missing after heavy monsoon rains triggered hundreds of landslides and floods across Nepal between September 24 and 28, damaging homes, bridges and livestock
