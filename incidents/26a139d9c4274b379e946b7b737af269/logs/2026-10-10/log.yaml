log_date: '2026-10-10'
summary: Six weeks after the disaster, UNICEF warned that the affected communities are still struggling to rebuild and that global warming heightens the risk of a similar catastrophe, urging sustained international support. An analysis criticized the cancellation of USAID-funded programs, saying it left Nepal’s children more exposed to the deadly floods. Additionally, the government’s formal end to search and rescue operations for thousands of missing victims has drawn mixed reactions from families, ranging from anger to relief.
