log_date: '2026-10-10'
summary: |-
  Six weeks after the disaster, UNICEF warned that the affected communities are still struggling to rebuild and that global warming heightens the risk of a similar catastrophe, urging sustained international support. An analysis criticized the cancellation of USAID-funded programs, saying it left Nepal’s children more exposed to the deadly floods. Additionally, the government’s formal end to search and rescue operations for thousands of missing victims has drawn mixed reactions from families, ranging from anger to relief.
  Nepal has shortened the waiting period to declare missing flood victims dead to about 1.5 months, and a newly launched AI-assisted website (ReuniteIndia.com) has helped families track over 600 missing persons. The European Union committed €19 million to strengthen disaster preparedness across South Asia, while health officials warn that thousands of children displaced by the floods lack access to measles vaccination.
