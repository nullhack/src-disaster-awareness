title: Nepal cuts 12-year wait period to declare missing flood victims dead
body: 'KATHMANDU: Nepal''s president on Friday (Oct 9) shortened the waiting period to declare missing disaster victims dead from 12 years to about 1.5 months, as thousands remain unaccounted for following the Himalayan country''s devastating flood.'
