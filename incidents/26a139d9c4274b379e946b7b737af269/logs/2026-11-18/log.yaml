log_date: '2026-11-18'
summary: At COP31, Nepal pressed for billions in recovery funding for flood survivors, with only about $20 million promised so far against estimated losses of $2.5 billion. The Prime Minister's relief fund for Bhotekoshi flood victims now holds a balance of roughly Rs 18.5 billion as donations continue. In Rasuwa, 48 of the 68 displaced households from Timure have returned to their original settlement and are sheltering in temporary tents.
