log_date: '2026-09-11'
summary: As of September 11, the death toll from the Bagmati floods has climbed to 1,377, with search operations continuing for over 5,000 missing. Germany announced €8 million in support, Canada sent RCMP disaster victim identification specialists to Kathmandu, and HHRD and Lions Clubs International Foundation launched new relief funding. China-donated drones are delivering aid to cut-off communities, and a newly installed zipline is helping people cross the Trishuli river in Nuwakot district.
