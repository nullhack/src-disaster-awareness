log_date: '2026-09-01'
summary: The death toll from the Bagmati floods has risen above 1,000 across Nepal and China, with rescue teams continuing efforts to reach hundreds feared trapped in hydropower tunnels. A headteacher evacuated 900 students just minutes before floodwaters swept away their school, a widely reported story. Meanwhile, fresh flood alerts have been issued as water levels rise, and the US State Department has warned against travel to affected areas, while survivors express fears of losing their culture and communities.
