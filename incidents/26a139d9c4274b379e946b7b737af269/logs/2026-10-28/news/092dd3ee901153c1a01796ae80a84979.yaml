title: Homes, farms and businesses suffer Rs 79 billion blow from Bhotekoshi-Trishuli disaster
body: The devastating floods that struck the Bhotekoshi-Trishuli river system on August 26 caused an estimated Rs 79.17 billion in losses to households and businesses, exposing the enormous private-sector cost of one of Nepal's most destructive flood disasters in recent years.
