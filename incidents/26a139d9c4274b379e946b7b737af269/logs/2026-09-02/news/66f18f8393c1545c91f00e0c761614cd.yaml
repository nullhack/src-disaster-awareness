title: Intl experts stress risk monitoring against future potential hazards after Nepal mudslide hits Gyirong Port in China’s Xizang
body: Recovery efforts at the mudslide-hit Gyirong Port in Southwest China's Xizang Autonomous Region moved forward Wednesday, with road access to the port basically restored after days of round-the-clock repair work.
