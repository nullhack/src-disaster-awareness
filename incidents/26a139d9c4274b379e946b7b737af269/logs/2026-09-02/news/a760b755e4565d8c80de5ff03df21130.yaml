title: 'Nepal Flood 2026: What did NISAR see before the glacier collapse? The satellite’s radar holds a clue- Moneycontrol.com'
body: NISAR radar data may reveal mountain deformation before Nepal’s deadly 2026 glacier-related flood. Here’s what the NASA-ISRO satellite detected. NISAR use Synthetic Aperture Radar, or SAR, to scan Earth's surface.
