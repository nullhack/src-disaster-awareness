title: 'You’ll soon reunite with family: Nepal soldier feeds khichdi to 5-year-old boy'
body: A Nepal Army soldier fed khichdi to a five-year-old boy rescued alive after being trapped under flood rubble for four days. The exhausted child was unable to speak, as the soldier gently fed him and reassured him that he would soon reunite with his family and return to school.
