title: Nepal’s flood disaster puts its hydropower-first strategy, exports to the test
body: 'KATHMANDU — Nepal’s long-held policy of harnessing hydroelectricity and using it for economic growth has met new challenges: potential catastrophic floods in the snow-fed rivers amid rising global temperatures. The Aug. 26 floods that originated on the Nepal-China border, and which knocked out around 10% of installed power from the national grid, has prompted a […]'
