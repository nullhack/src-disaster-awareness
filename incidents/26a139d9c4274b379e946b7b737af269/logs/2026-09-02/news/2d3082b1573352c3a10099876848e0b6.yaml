title: Deadly Nepal flood and the price of staying standing - BusinessWorld Online
body: 'CLIMATE CHANGE has acquired a problem of persuasion. Those of us who work on natural resources and climate risk are routinely cautioned against sounding apocalyptic. Doom, we are told, is a poor currency for engagement: repeat the word “catastrophe” often enough and urgency curdles into fatalism.'
