title: Mass burials in Nepal as death toll from flash floods exceeds 1,000
body: More than 1,000 people are dead and nearly 4,500 missing across Nepal and China after Himalayan flash floods tore through remote communities, complicating rescue efforts in unstable, debris-choked terrain.
