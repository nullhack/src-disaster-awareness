log_date: '2026-09-02'
summary: |-
  As of September 2, the death toll from the Bagmati floods has risen to 1,127, with nearly 4,858 people still missing across Nepal and China. Rescue operations continue, including Indian teams gaining footholds in hydropower tunnels, while mass burials of unidentified victims proceed and some missing tourists have made contact with authorities. A rapid hazard assessment revealed warning signs were visible days before the glacier collapse, experts warn of further avalanche and debris flow risks, and the disaster has become an ideological battleground, highlighting Nepal's vulnerability to climate change-driven glacial floods.
  The death toll from the Bagmati floods has reached 1,127, with symbolic funerals being held for the missing as some tourists make contact. Nepal has announced plans to rebuild an early-warning system along the China border, while the UN estimates 2.2 million tonnes of debris remain. New human stories emerge, including a father walking days to search for his son and a "miracle house" that survived the devastation, as the government shifts focus toward rehabilitation.
