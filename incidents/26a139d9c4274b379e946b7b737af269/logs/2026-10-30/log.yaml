log_date: '2026-10-30'
summary: |-
  In late October, Nepal exported $39 million worth of electricity to India and announced plans to build temporary bridges to reopen the Rasuwagadhi border crossing. Malaysia’s offer to deploy a specialized SAR team with advanced detection equipment was accepted, and Nepal outlined a $49.9 million project to lower water levels in high-risk glacial lakes to prevent future floods.
  Nepal is set to receive nearly Rs 3 billion in grants for flood relief and rehabilitation. A candlelight vigil was held by the Nepali community in North Carolina to honor victims of the disaster. An article also recaps the causes and impact of the glacier burst that triggered the flood.
