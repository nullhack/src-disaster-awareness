title: One-off aid mulled for families of missing flood victims
body: 'KUALA LUMPUR: A proposal for one-off federal humanitarian assistance for 54 families of Malaysians missing in the Nepal-Tibet flash floods will be brought to the Cabinet for consideration, says Malaysia Solidarity: Families in Hope (Masfih).'
