title: Nepal plans temporary bridges to reopen flood-hit Rasuwagadhi border crossing
body: Kathmandu, Oct. 30 -- The Rasuwagadhi border crossing with China has been cut off since floods on August 26, with no clear timeline for reopening. More than two months on, the road to the crossing remains incomplete,
