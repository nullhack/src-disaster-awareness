log_date: '2026-10-07'
summary: |-
  A government panel is debating the official name for the Bhotekoshi floods, with 'Himalayan tsunami' reportedly not under consideration. Meanwhile, Royam Nepal distributed relief materials to 60 flood-affected households in Dandagaun, Uttargaya-2, Rasuwa.
  Nepal is in talks with China to reopen the Tatopani border crossing, which was disrupted by the August floods. Families of the missing have expressed mixed reactions—anger and relief—after the government ended search efforts. A community fundraiser in Windsor, Ontario, also raised money to support flood relief.
