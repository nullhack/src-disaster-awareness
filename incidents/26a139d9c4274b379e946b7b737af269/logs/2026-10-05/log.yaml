log_date: '2026-10-05'
summary: Nepal has officially ended search and rescue operations for those still missing from the August flood and is now focusing on rehabilitation and recovery efforts. The government is preparing to change road and bridge designs in response to the disaster, while the Nepali Congress political party has raised over 3.5 crore rupees (approximately 3.5 million USD) for affected families. Separately, a policy analysis examines how Nepal’s recovery will test the UN’s Fund for Responding to Loss and Damage.
