title: India approves power export to Nepal amid flood damage to hydropower infrastructure - DD India
body: The Ministry of Power has approved the export of electricity to Nepal for 18 hours a day to help meet the neighbouring country’s additional power requirements following extensive damage to its hydropower infrastructure caused by recent floods. Under the approval, India will export power to the Nepal Electricity Authority from September 13 to December 31, […]
