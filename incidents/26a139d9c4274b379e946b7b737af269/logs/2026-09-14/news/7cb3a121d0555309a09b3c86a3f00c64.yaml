title: How two men survived nine days in a Nepal flood tunnel | Texarkana Gazette
body: A delirious Kabir Maharjan drifted in and out of consciousness in a pool of muddy water in complete darkness, trapped for nine days in a tunnel beneath the wreckage of Nepal's worst flood disaster in decades.
