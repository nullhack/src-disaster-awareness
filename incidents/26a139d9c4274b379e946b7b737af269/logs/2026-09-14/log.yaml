log_date: '2026-09-14'
summary: India approved exporting up to 654 MW of electricity to Nepal for 18 hours daily until December to compensate for flood-damaged hydropower infrastructure. Fifty-five Malaysians remain uncontactable, and Infrastructure Minister Sunil Lamsal outlined plans for rebuilding damaged roads, bridges, and resettlements. The first major cultural celebration since the disaster, the Teej festival, was held at Pashupatinath Temple, while Palm Beach United Way raised $200,000 for recovery.
