title: 'भोटेकोशी बाढी: यकिन बेपत्ता दुई हजार २९४ जनाको सूची सार्वजनिक'
body: काठमाडौँ । राष्ट्रिय विपद् जोखिम न्यूनीकरण तथा व्यवस्थापन प्राधिकरणले भोटेकोशी बाढीमा परी बेपत्ता भएका भएका ३२ जिल्लाका दुई हजार २९४ जनाको यकिन विवरण सार्वजनिक गरेको छ । प्राधिकरणले ३२ जिल्लाको विपद् जोखिम न्यूनीकरण तथा व्यवस्थापन समितिबाट यकिन भई आएका विवरण मात्र सार्वजनिक गरेको हो । प्राधिकरणका अनुसार सबैभन्दा बढी रसुवाका एक हजार ५८३ जना रहेका […]
