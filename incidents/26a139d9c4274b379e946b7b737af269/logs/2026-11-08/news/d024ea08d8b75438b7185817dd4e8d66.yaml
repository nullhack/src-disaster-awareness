title: 'Bhotekoshi flood: Details of 2,294 missing persons made public'
body: 'KATHMANDU: The National Disaster Risk Reduction and Management Authority (NDRRMA) has made public the verified details of 2,294 people reported missing in the Bhotekoshi flood from 32 districts across the country. The authority said the published list includes only those cases verified by the respective District Disaster Risk Reduction and Management Committees. Rasuwa has reported […]'
