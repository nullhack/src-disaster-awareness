log_date: '2026-11-08'
summary: |-
  Nepal’s disaster authority made public the first verified list of 2,294 missing citizens from 32 districts and 171 foreign nationals from seven countries who disappeared in the August 26 Bhotekoshi flood. A police dog named Leo, which located two bodies during a 20-day search, was named the best canine in Nepal for its role in the rescue efforts.
  The Bhotekoshi flood caused Rs 132 billion in damage to Nepal's energy sector, while restoring the affected financial sector will cost Rs 65.21 billion. In Uttargaya, Rasuwa, 11 victims have been identified and 655 more deaths are being registered. A book titled "The Sunshine Flood" chronicling the disaster and reconstruction has been published, and police canine Leo was named best canine for its rescue efforts.
