title: 'COP-31: Nepal takes climate disaster realities to global stage'
body: 'KATHMANDU: From villages swept away by glacial floods to hydropower infrastructure reduced to rubble, Nepal’s mounting climate crisis is set to take centre stage at the 31st Conference of the Parties (COP-31) to the United Nations Framework Convention on Climate Change (UNFCCC), beginning today in Antalya, Türkiye. Carrying accounts of devastating floods, human casualties, destroyed […]'
