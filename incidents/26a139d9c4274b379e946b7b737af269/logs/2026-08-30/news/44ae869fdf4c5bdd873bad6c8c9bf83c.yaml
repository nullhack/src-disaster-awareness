title: ‘Immense’ devastation as Nepal searches for 2,400 missing in floods | Honolulu Star-Advertiser
body: KATHMANDU, Nepal >> Entire towns wiped out. Roads, bridges and communication lines washed away. In just a matter of moments, tens of thousands of people were left devastated and disoriented as catastrophic floodwaters tore through the tranquil Himalayan valley.
