title: Nepal-China flood survivors reach safe areas as families await news of nearly 3,000 missing - East Idaho News
body: NUWAKOT, Nepal (AP) — As rescue efforts in communities buried by catastrophic flash floods along the Nepal – China border entered their fourth day Saturday, authorities were still finding survivors and transporting them to safety. At relief centers, families of missing people waited anxiously for news of their loved ones as the death toll and […]
