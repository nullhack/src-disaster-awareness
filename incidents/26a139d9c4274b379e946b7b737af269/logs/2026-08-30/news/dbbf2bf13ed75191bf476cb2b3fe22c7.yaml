title: Nepal flood horror reaches UP as 10 bodies recovered from Gandak river
body: Bodies and debris from Nepal's floods have been recovered in rivers along Uttar Pradesh's border districts. The finds have prompted cross-border identification efforts and fresh warnings to people living along the banks.
