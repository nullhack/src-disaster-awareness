log_date: '2026-08-30'
summary: As of August 30, the death toll from the Bagmati flash floods has exceeded 700, with at least 734 reported dead and nearly 2,500 still missing. Rescue operations resumed after weather delays, but the Bhotekoshi River has risen again, prompting fresh flood warnings. Nepal has begun burying unidentified bodies while preserving DNA samples for later identification, and international rescue teams from India, China, and South Korea have been deployed to support search efforts, as thousands of displaced survivors face severe shortages of water and medicine in crowded camps.
