title: Flood toll rises in Nepal-Tibet as tunnel rescue, Pakistan ops unfold
body: A day of regional upheaval saw flood deaths climb in Nepal and Tibet, even as two trapped men were rescued from a Nepal tunnel. The developments underscored a stark mix of disaster, conflict and diplomacy stretching from South Asia to Ukraine.
