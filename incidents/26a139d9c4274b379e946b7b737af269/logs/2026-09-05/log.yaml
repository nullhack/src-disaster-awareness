log_date: '2026-09-05'
summary: |-
  The Nepal flood death toll rose to at least 1,287 with 5,083 missing, as detailed stories emerged of two hydropower workers – Sanjay Sah and Kabir Maharjan – rescued alive after nine days trapped in a tunnel. Personal tragedies were highlighted, including a 13-year-old girl who saved her brother and a Woodland couple still missing, while authorities combated AI-generated misinformation (e.g., fake elephant rescue videos) and began collecting DNA samples from relatives in West Bengal for identification. Local fundraising efforts, such as a "Play Soccer for Nepal" event in Oregon, also mobilized support.
  The death toll from the Bagmati flash floods has risen to at least 1,344, with rescuers pulling a Chinese national and a woman alive from the wreckage 10 days after the disaster, bringing the total of recent tunnel rescues to three. The foreman of the Trishuli hydropower project recounted staying behind to help others, while authorities continue DNA testing to identify victims and search for over 4,800 missing. Survivors and rescue teams, inspired by the "miracle" rescues, persist in the grim search.
