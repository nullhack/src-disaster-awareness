log_date: '2026-11-07'
summary: Prime Minister Balendra Shah visited India seeking $2 billion in flood recovery aid. Malaysia announced a one‑off RM10,000 payment to families of all 54 missing citizens and reported that insurance claims are being settled, with at least 12 policies already paid to next of kin. A South Korean church donated ₩10 million to UNICEF for children affected by the floods.
