title: Manassas nonprofit delivers $92,964 for Nepal flood relief
body: America Nepal Helping Society, a Manassas nonprofit founded in 2008, says it raised and delivered $92,964 from 167 donors for flood and landslide relief in Nepal’s Rasuwa–Bhotekoshi region.
