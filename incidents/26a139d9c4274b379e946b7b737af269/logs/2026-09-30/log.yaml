log_date: '2026-09-30'
summary: |-
  Nepal is planning to import up to 1,100 MW of electricity from India after flood damage took hydropower offline, and is pursuing alternative power management after 430 MW from the Bhotekoshi corridor was disrupted. At the UN, Nepal’s prime minister called the recent floods a warning about climate change, while families of the missing continue to seek answers and aid groups, including Iglesia Ni Cristo and a UK charity sending solar equipment, are contributing to relief.
  New reports from around Sept. 29-30 highlight continued recovery and grief one month after the Bagmati floods: a Nepali school is mourning 70 learners and four teachers, and Ukrainian families are still desperate for answers about missing relatives. Relief fundraising continues, with America Nepal Helping Society delivering $92,964, Upper Mustang residents in New York raising about $105,000, and Iglesia Ni Cristo extending humanitarian aid. Commentary and photo coverage also focus on the disaster’s lessons for cross-border preparedness, adaptation accountability, and rebuilding.
