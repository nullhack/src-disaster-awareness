log_date: '2026-10-27'
summary: |-
  Two months after the Bagmati floods, families of missing victims reported spending the Dashain festival without news, still waiting for DNA test results. The Nepal Premier League opened its season as the country continued to mourn the disaster. Meanwhile, Nepal secured a $20 million UN loss‑and‑damage grant, but spending priorities remain undecided and the amount covers less than one per cent of the estimated reconstruction bill.
  Residents of Nuwakot and Rasuwa districts are returning to their flood-damaged homes, saying promised assistance has not arrived and safety inspections remain incomplete. The Pashupati Foundation America has donated Rs 15 million to support Bhotekoshi flood victims. An editorial urges authorities to restore hope and provide answers to those still in uncertainty.
