log_date: '2026-10-27'
summary: Two months after the Bagmati floods, families of missing victims reported spending the Dashain festival without news, still waiting for DNA test results. The Nepal Premier League opened its season as the country continued to mourn the disaster. Meanwhile, Nepal secured a $20 million UN loss‑and‑damage grant, but spending priorities remain undecided and the amount covers less than one per cent of the estimated reconstruction bill.
