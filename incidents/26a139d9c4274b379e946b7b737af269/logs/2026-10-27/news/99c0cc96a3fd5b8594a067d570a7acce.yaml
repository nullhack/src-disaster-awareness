title: भोटेकोशी बाढीबाट घर-व्यवसायमा ७९ अर्बको क्षति
body: काठमाडौं।रसुवाको भोटेकोशी बाढीका कारण घरपरिवार र व्यवसाय र प्रतिष्ठानतर्फ ७९ अर्ब १७ करोड बराबरको क्षति भएको छ। राष्ट्रिय योजना आयोगले सार्वजनिक गरेको घरपरिवार तथा प्रतिष्ठानसँग सम्बन्धित सर्वेक्षणको प्रारम्भिक विवरणमा घरपरिवारतर्फ ६९ अर्ब ५७ करोड र व्यवसाय–प्रतिष्ठानतर्फ नौ अर्ब ६० करोड बराबरको क्षति भएको उल्लेख छ। सर्वेक्षणअनुसार आर्थिक क्षतिसम्बन्धी प्रारम्भिक विवरणमा घर भएको जग्गा (आफ्नै स्वामित्वको) […]
