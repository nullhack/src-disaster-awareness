log_date: '2026-09-15'
summary: New developments reported around September 14-15 include India approving up to 654 MW of power exports to Nepal until December 31 to offset flood-damaged hydropower infrastructure, and India also aiding in clearing the Chilime tunnel where workers may be trapped. Nepal’s government rolled out a 21-point capital market reform plan in response to flood damage to listed hydropower projects, and a government assessment revealed that critical flood-monitoring stations in the Bhote Koshi river were destroyed, hampering real-time monitoring and underscoring the flood’s extreme intensity.
