title: Nepal rescue focused on workers trapped in three tunnels - BusinessWorld Online
body: KATHMANDU — Rescuers in Nepal are focusing on three hydropower project tunnels where they believe dozens of workers could be trapped, authorities said on Tuesday, two weeks after a devastating flood killed hundreds and left thousands missing in the Himalayan country and in neighboring China’s Tibet region. At least 11 hydropower projects were engulfed when […]
