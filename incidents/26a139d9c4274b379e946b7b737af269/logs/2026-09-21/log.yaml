log_date: '2026-09-21'
summary: |-
  Nearly four weeks after the Bagmati floods, search operations continue for around 6,000 people still missing, with many villages remaining buried in mud and thousands of survivors living in temporary camps. The death toll is reported to have exceeded 1,450, and the search efforts are ongoing.
  New reports on September 21 detail tourism sector losses of over Rs 52.6 billion, the recovery of five additional bodies from a hydropower tunnel, and Nepal's decision to pursue bilateral reconstruction funding instead of a donor conference. A forensic lab in Kathmandu is working to identify victims from 30 nations, and a U.S. public health educator was identified among the deceased. The disaster also continues to feature in global climate discussions at the UN.
