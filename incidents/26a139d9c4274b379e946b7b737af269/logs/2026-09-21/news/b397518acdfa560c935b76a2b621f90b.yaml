title: बाढी प्रभावितलाई रोजगार र आयआर्जनसँग जोड्ने प्रदेश सरकारको प्राथमिकता
body: चितवन। बागमती प्रदेश स्वास्थ्य तथा सामाजिक विकासमन्त्री गिरबहादुर तामाङ (ज्ञानुजङ्ग लामा) ले बाढी तथा विपदबाट प्रभावित नागरिकलाई राहतमा मात्र सीमित नराखी रोजगार, शिक्षा, स्वास्थ्य र आयआर्जनसँग जोडेर दीर्घकालीन व्यवस्थापन गरिने बताएका छन्। आज यहाँ सञ्चारकर्मीसँग कुराकानी गर्दै उनले प्रभावित नागरिकको पुनःस्थापना र आत्मनिर्भर बनाउने विषयलाई प्रदेश सरकारले प्राथमिकतामा राखेको बताए। उनले भने, “पालिकाको क्षमताअनुसार कम्तीमा […]
