title: 'भोटेकोशी बाढी : ‘ठूलो बाढी आउँदैछ’ भन्ने सूचना पत्याउन नसक्दा धेरै क्षति'
body: त्रिशूली । बिहानको खाना खाइसकेपछि विदुर नगरपालिका–१ ढुङ्गेका छत्र प्याकुरेल नियमित काममा जाने तयारीमा थिए। त्रिशूली नदी किनारबाट केही दूरीमा घर भएकाले नदीमा ठूलो बाढी आए पनि आफ्नो घरसम्म असर नपुग्नेमा उनी ढुक्क थिए। त्यसैले भदौ १० गते बिहान ‘बाढी आउँदैछ’ भन्ने सूचना पाए पनि त्यसले निम्त्याउन सक्ने विपत्तिको उनले अन्दाजै गर्न सकेनन्। घरबाट निस्कने तयारी […]
