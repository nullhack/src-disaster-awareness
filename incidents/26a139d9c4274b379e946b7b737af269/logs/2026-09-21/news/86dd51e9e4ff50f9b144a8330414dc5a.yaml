title: 'நேபாள பெருவெள்ளம்: 6,000 பேரை தேடும் பணி நீடிப்பு! சாலைகள், பாலங்கள் இன்றி மக்கள் அவதி!!'
body: நேபாளத்தில் பெருவெள்ளம் ஏற்பட்டு கிட்டத்தட்ட 4 வாரங்கள் ஆகிவிட்ட நிலையில், காணாமல்போன 6,000 பேரை தேடும் பணி நீடிக்கிறது.
