title: Quad की बैठक में भारत की जय-जय, नेपाल बाढ़ में मदद के लिए हुई तारीफ, चीन की आलोचना
body: अमेरिका के अटलांटा में क्वाड विदेश मंत्रियों की बैठक में नेपाल में आई विनाशकारी बाढ़ में फर्स्ट रेस्पॉन्डर के रूप में भारत की भूमिका की जमकर सराहना की गई। इस बैठक में भारत का प्रतिनिधित्व विदेश मंत्री एस जयशंकर ने किया। इस बैठक की अध्यक्षता अमेरिकी विदेश मंत्री मार्को रुबियो ने की। बैठक में चीन की जमकर आलोचना की गई है।
