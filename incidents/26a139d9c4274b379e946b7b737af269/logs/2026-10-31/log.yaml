log_date: '2026-10-31'
summary: A five-day fire ritual (Pitri Moksha Yagya) is scheduled for next week at the Betrawati confluence to honor the dead and missing from the August 26 Bhotekoshi flood across multiple districts. At the Quad foreign ministers meeting in Atlanta, India's role as a first responder in the Nepal floods was praised, while China faced criticism. Meanwhile, PERKESO payments to the next of kin of Malaysian victims are expected to be expedited and paid on November 4.
