title: Nepal forms 7-member panel to probe August 26 Bhotekoshi flood from source to downstream
body: Nepal has formed a seven-member expert panel to investigate what really triggered the devastating August 26 Bhotekoshi flash flood, which caused massive loss of life and severely damaged hydropower infrastructure. Led by water policy expert Debesh Belbase, the team includes specialists in hydrology, glaciology, geology, remote sensing and disaster risk reduction. They'll trace the disaster from its source through the Bhotekoshi-Lhende river system, examining whether cascading geological, glacial and hydrological hazards, possibly linked to climate change, were behind the tragedy.
