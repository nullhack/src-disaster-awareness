title: भोटेकोशी बाढीमा बेपत्ता १२ जनाका परिवारलाई नवलपुर वाणिज्य संघको राहत
body: रसुवामा भदौ १० गते आएको बाढीमा परी तेन्जिन शेर्पा हाइड्रोपावरमा कार्यरत मध्यविन्दुका १२ जना बेपत्ता भएका थिए । लामो समयसम्म खोजी गर्दा पनि जीवित वा शव फेला नपरेपछि उनीहरूको नारायणी नदी किनारमा सामूहिक रूपमा अन्त्येष्टि गरिएको थियो ।
