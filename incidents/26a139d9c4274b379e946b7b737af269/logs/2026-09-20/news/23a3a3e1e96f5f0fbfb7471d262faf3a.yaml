title: भोटेकोशी बाढीः एक हजार ४३६ शव भेटिए
body: <p>काठमाडौं । भोटेकोशी बाढीमा परी ज्यान गुमाएकाहरूमध्ये एक हजार ४३६ जनाको शव फेला परेको छ । नेपाल प्रहरीका अनुसार आज बिहान ११ः०० बजेसम्म रसुवामा २२३, नुवाकोटमा २०३, धादिङमा ७२, चितवनमा ३६५, गोरखामा ७९, तनहुँमा ३८, नवलपरासी पूर्वमा २३२ र नवलपरासी पश्चिममा २२२ गरी एक हजार ४३४ शव फेला परेका हुन् । फेला परेका शव पहिचानका […]</p>
