log_date: '2026-09-20'
summary: |-
  New reports detail cultural heritage losses estimated at Rs. 146 million from the August 26 floods, while India sent another 11 tonnes of relief supplies to support Nepal’s recovery. These developments add specific figures to the disaster's cultural impact and continued international aid.
  As of September 20, the confirmed death toll from the Bagmati floods has reached 1,436 recovered bodies, with district-specific counts reported by Nepal Police; of those, 281 bodies have been managed in Gokarneshwor. Relief efforts continue, with Korean citizens donating to a pregnant survivor, the Nepal Chamber of Commerce aiding families of 12 missing hydropower workers, and a Canberra fundraiser collecting approximately 15,000 Australian dollars. Additionally, analysis highlights risks to public investments in six flood-damaged listed hydropower companies.
