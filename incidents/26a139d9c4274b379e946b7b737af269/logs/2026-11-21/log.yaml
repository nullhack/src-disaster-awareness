log_date: '2026-11-21'
summary: Nearly three months after the Bhotekoshi flood, scholarships meant for affected students are being held up by a lack of verified data on the children, according to a Kathmandu report of November 20. The Independent Drivers Association Nepal provided food assistance to the family of Govinda Bik of Gangajamuna-6, who has been missing since the flood. A separate feature reported November 21 examines how resettling survivors requires more than simply providing new homes, opening with Chegu Tamang of Khalte in Rasuwa's Uttargaya Rural Municipality, who lost 14 relatives in the August 26 disaster.
