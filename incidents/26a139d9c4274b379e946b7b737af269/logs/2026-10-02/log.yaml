log_date: '2026-10-02'
summary: New reports from October 2026 detail ongoing diplomatic and relief efforts tied to the Bagmati flood. China proposed upgrading the Korala border point into an international trading hub after the flood destroyed the Kerung-Rasuwagadhi crossing, while Nepal continues to press for Tatopani’s reopening. Separately, the Magar Association of America contributed more than Rs 3 million to support flood victims in Rasuwa.
