title: Heavy rain, floods and landslides kill 68 in northern India - Pakistan Today
body: Heavy rain, floods and landslides kill at least 68 people across northern India and Nepal. Uttar Pradesh reports 56 deaths and over 1,000 damaged houses, while Nepal records 12 deaths and seven missing. More than 70,000 people are evacuated in flood-hit Odisha
