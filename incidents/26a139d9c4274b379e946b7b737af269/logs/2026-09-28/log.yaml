log_date: '2026-09-28'
summary: Fresh heavy rain caused new floods and landslides in Nepal, killing 12 people and leaving seven missing, with over 1,100 evacuated. Search operations continue for thousands still missing from the August Bagmati flood, while Mitsubishi Electric donated $32,000 to relief efforts. Rebuilding of roads and infrastructure is underway, and analysis highlights the flood's lasting impact on Nepal's hydropower sector.
