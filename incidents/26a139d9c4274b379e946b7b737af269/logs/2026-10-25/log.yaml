log_date: '2026-10-25'
summary: A preliminary post-disaster needs assessment estimates that the Rasuwa-Bhotekoshi floods caused Rs 79 billion in damage to private property and businesses, while a survey found that nearly half of displaced victims want to resettle on their own land. The UN climate fund has pledged between $20 and $21.6 million for recovery, far below the estimated $4.77 billion needed for reconstruction.
