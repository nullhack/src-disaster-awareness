title: Nepali community in Eugene comes together following deadly floods
body: Eugene has maintained a sister-city relationship with Kathmandu, Nepal, since 1975. After flooding and landslides recently struck the country, the nonprofit supporting the connection gathered in grief and remembered how somewhere distant can feel close to home.
