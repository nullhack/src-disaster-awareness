title: 'Beyond hydropower: Rethinking Nepal''s energy security after the Bhotekoshi disaster'
body: 'Nepal stands at a critical turning point in its energy development journey. Over the past decade, the country has made significant progress in hydropower development, electricity access and private-sector investment. However, the devastating Bhotekoshi disaster of August 2026 has exposed a fundamental weakness in our energy strategy: increasing generation capacity alone does not guarantee energy security.'
