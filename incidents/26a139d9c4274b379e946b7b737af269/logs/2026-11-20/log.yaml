log_date: '2026-11-20'
summary: Aid workers are moving from emergency response to rebuilding flood-hit communities, with many of those workers having lost everything themselves. Commentary on the Bhotekoshi–Trishuli floods warned that recovery must go beyond roads and infrastructure to help local businesses restart. Nepal’s inflation reached a 36-month high amid supply disruptions after the August 26 disaster, while Nepal pressed at COP31 for billions in recovery aid, with only about $20 million pledged so far.
