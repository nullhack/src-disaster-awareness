log_date: '2026-09-22'
summary: |-
  At the UN General Assembly, Nepal's Prime Minister Balendra Shah drew diplomatic interest by addressing climate justice, the Bhotekoshi floods, and mountain country concerns. Separately, a Forbes analysis highlighted how the flood damaged 13 hydropower projects, revealing growing risks to hydropower from glacial retreat.
  Ex-servicemen donated Rs 2.4 million to Bhotekoshi flood victims. The family of missing South African Terricia Govender returned to South Africa but will continue the search in Tibet, while families of missing Malaysians are set to meet authorities. Nepal's Foreign Minister held bilateral meetings at the UN focusing on climate justice and flood recovery, and a manipulated CCTV clip of the flood is circulating online. An editorial warns that heavy rain is forecast and Nepal must prepare to prevent further disaster.
