title: भोटेकोशी बाढीपीडितका लागि भूतपूर्व सैनिकद्वारा २४ लाख सहयोग
body: कास्की। भारतीय भूतपूर्व सैनिक गोरखा ब्रिगेड नेपाल पोखराले भोटेकोशी बाढी प्रभावितको राहत तथा पुनःस्थापनाका लागि २४ लाख ३३ हजार ९५२ रुपैंयाँ सहयोग गरेको छ। गोरखा ब्रिगेडले उक्त रकम प्रधानमन्त्री दैवी प्रकोप उद्धार कोषमा जम्मा गरेर आज भौचर रकम कास्कीका प्रमुख जिल्ला अधिकारी कुमानसिंह गुरुङलाई हस्तान्तरण गरेको हो। रसुवा–भोटेकोशीमा गएको बाढी तथा विपदबाट प्रभावित नागरिकको राहत […]
