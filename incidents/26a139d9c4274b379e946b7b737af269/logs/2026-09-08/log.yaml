log_date: '2026-09-08'
summary: |-
  As of September 7-8, the death toll rose to 1,355–1,356 with nearly 5,000 missing, and Nepal held a national day of mourning with candlelight vigils and lowered flags. President Ramchandra Paudel appealed for global climate justice, while rescue teams using sniffer dogs located 26 bodies and continued efforts to reach workers trapped in hydropower tunnels. New developments include a tourism campaign, cyber investigations into abusive posts, DNA sampling requests from India, and a new crypto donation route for relief.
  As of September 8, the death toll from the Bagmati floods has risen to 1,357 with 5,326 missing, and families of workers trapped in hydropower tunnels are growing angry at the slow rescue pace. New research indicates exceptional heat preceded the glacier collapse, while China reported no foreign nationals among victims identified in Tibet. Nepal is racing to rebuild 41 destroyed bridges and estimates damage upwards of $5 billion, appealing for international aid.
