log_date: '2026-09-08'
summary: As of September 7-8, the death toll rose to 1,355–1,356 with nearly 5,000 missing, and Nepal held a national day of mourning with candlelight vigils and lowered flags. President Ramchandra Paudel appealed for global climate justice, while rescue teams using sniffer dogs located 26 bodies and continued efforts to reach workers trapped in hydropower tunnels. New developments include a tourism campaign, cyber investigations into abusive posts, DNA sampling requests from India, and a new crypto donation route for relief.
