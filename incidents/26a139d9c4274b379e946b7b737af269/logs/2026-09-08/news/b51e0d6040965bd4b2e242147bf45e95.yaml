title: 'No foreigners among flood victims identified in Tibet: Xinhua'
body: 'BEIJING: None of the bodies retrieved in Tibet after the devastating floods that destroyed the Gyirong border crossing with Nepal were foreign nationals, China''s state news agency Xinhua reported on Tuesday (Sept 8).'
