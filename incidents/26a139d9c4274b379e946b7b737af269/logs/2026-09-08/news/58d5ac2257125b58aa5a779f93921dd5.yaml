title: Nepal Observes National Mourning As Over 1300 Die In Flood Disaster, Thousands Still Missing
body: Nepal has observed a national day of mourning on Monday for victims of catastrophic glacial floods, even as families of hydropower workers believed, trapped in tunnels held on to hope that rescuers might still find survivors. The disaster, triggered by a glacial and mountain collapse along the China-Nepal border on August 26, has claimed at least 1,398 lives, with more than 5,500 people still unaccounted for — among them roughly 800 foreign nationals.
