title: Nepal launches Nepal Calling campaign after floods to save autumn tourism
body: Nepal has launched the Nepal Calling campaign to reassure tourists after the Bhotekoshi flash floods. The push aims to rescue peak-season bookings by stressing that major destinations and trekking routes remain open.
