log_date: '2026-09-06'
summary: As of September 5-6, rescuers pulled a Chinese national and a woman alive from debris in separate operations 10 days after the devastating floods, adding to the "miracle" rescues from the tunnels. The search continues for over 5,000 missing, with DNA matching crucial for identifying victims, while hundreds of orphaned children shelter in relief centers and survivors help rescue teams despite personal losses. Additionally, Kathmandu's supply lines have been rerouted after the main highway was blocked, Nepal and South Korea discussed disaster recovery, and China opened the Tibet flood zone to select journalists for the first time since the disaster.
