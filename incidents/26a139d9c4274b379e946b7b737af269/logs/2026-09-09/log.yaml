log_date: '2026-09-09'
summary: |-
  As of September 8-9, the death toll from the Bagmati floods reached 1,357 with over 5,000 still missing, and the United States appointed Megan Bouldin to lead flood support efforts in Kathmandu. New data revealed exceptional heat preceded the glacier collapse that triggered the disaster, while 70 Americans remain unaccounted for and rescue operations continue to focus on three hydropower tunnels. The floods have also severely disrupted access to healthcare in affected areas, with communities facing shortages of medicine and medical services.
  Two weeks after the Aug 26 flash floods, Nepal’s death toll was reported at more than 1,401 with 5,845 people still missing, as search efforts continued. The government is centering climate justice in its global aid appeal and has formed a parliamentary sub-committee to assess Rasuwa flood losses, while the army has begun using drones to deliver relief to cut-off areas. Healthcare access remains badly disrupted in Rasuwa and Nuwakot, prompting Nepal to waive health insurance fees in those districts, and Chinese goods are being rerouted through Birgunj because northern crossings are still blocked.
