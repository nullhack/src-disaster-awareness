log_date: '2026-09-09'
summary: As of September 8-9, the death toll from the Bagmati floods reached 1,357 with over 5,000 still missing, and the United States appointed Megan Bouldin to lead flood support efforts in Kathmandu. New data revealed exceptional heat preceded the glacier collapse that triggered the disaster, while 70 Americans remain unaccounted for and rescue operations continue to focus on three hydropower tunnels. The floods have also severely disrupted access to healthcare in affected areas, with communities facing shortages of medicine and medical services.
