log_date: '2026-10-04'
summary: |-
  65 ambulance drivers who transported bodies of the Rasuwa flood victims were honored. A symbolic funeral was performed for a missing army soldier believed killed in the disaster.
  PSDN, with financial and technical support from Project HOPE, conducted 26 emergency medical and public health service deployments in flood-hit Nuwakot and Rasuwa between September 6 and 30. Additionally, South Korean volunteer teams are involved in cleaning and recovery efforts in Nuwakot.
