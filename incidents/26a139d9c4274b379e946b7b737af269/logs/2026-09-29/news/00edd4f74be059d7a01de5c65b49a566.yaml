title: 'Mountain collapses within seconds in Nepal: Terrifying video shows people fleeing as debris comes crashing down | WATCH- Moneycontrol.com'
body: A massive landslide has crashed into Nepal’s swollen Kali Gandaki River after days of heavy rain. The latest disaster has killed 24 people, left 14 missing and damaged homes, roads, bridges and hydropower projects.
