title: मात्र 3 सेकेंड में गायब हो गया पूरा घर, नेपाल से सामने आया डरावना वीडियो
body: नेपाल में लगातार बारिश के बीच बाढ़ और लैंडस्लाइड से हालात बिगड़ गए हैं। बाढ़ में अब तक 21 लोगों की मौत हो चुकी है। वहीं बागलुंग जिले में भूस्खलन से एक घर मलबे में दब गया। वहीं, बाढ़ और भूस्खलन से कई घर और पुल बह गए हैं। इससे पहले 26 अगस्त को भोटेकोशी नदी में आई बाढ़ में 1453 लोगों की मौत हो चुकी है।
