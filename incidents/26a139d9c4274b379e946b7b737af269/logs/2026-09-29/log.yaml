log_date: '2026-09-29'
summary: Late-September coverage marks the one-month point after the August Bagmati floods, reporting that thousands are still missing and affected families face a long, difficult recovery. Most other reports describe a separate round of heavy monsoon rain and landslides across Nepal—with tolls reported as 14 to 24 people killed—and an avalanche that left 12 workers missing, but those events are not tied to the Bagmati flood itself.
