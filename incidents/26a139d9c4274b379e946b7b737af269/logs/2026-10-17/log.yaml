log_date: '2026-10-17'
summary: Rasuwagadhi Hydro provided Rs 500,000 per family to employees who went missing or died in the Bhotekoshi flood. The Nepali community in North Alabama donated $50,000 to the Prime Minister's Relief Fund for flood victims, while the New Zealand-Nepal Society contributed Rs 12.6 million for relief and rehabilitation. The government also declared flood-affected local levels in Gorkha, Baglung, and Dhading as disaster crisis areas.
