log_date: '2026-09-03'
summary: The death toll from the Bagmati floods has risen to at least 1,200 (some reports near 1,250), with over 4,000 still missing and rescue teams continuing efforts to reach workers trapped in hydropower tunnels. The floods have halted Nepal's electricity exports to Bangladesh, and authorities are deploying new early warning systems due to ongoing flood risks. Survivors face severe shortages of food, medicine, and space for mourning, while international aid, including from the Catholic Church and a U.S. nonprofit, is being mobilized.
