title: Over 1,200 dead in Nepal floods amid tunnel rescue hunt
body: Rescue teams are racing to reach dozens of workers believed to be trapped inside hydropower tunnels in Nepal's mountains, offering one of the last hopes of finding survivors a week after a Himalayan flood killed more than 1,200 people.
