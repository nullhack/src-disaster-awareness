title: Timure was a bustling border hub. In hours, the floods wiped it off the map
body: Kathmandu, Sept. 16 -- The devastating August 26 floods have all but wiped out Timure, the main settlement in Gosainkunda Rural Municipality-2 in Rasuwa.
