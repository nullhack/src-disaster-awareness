title: Nepal flash floods toll crosses 1,400 as over 6,000 remain missing
body: Rescuers in Nepal are searching flood-hit districts after flash floods killed more than 1,400 people and left over 6,000 missing. DNA testing and tunnel recoveries at hydropower sites underline the scale and difficulty of identification efforts.
