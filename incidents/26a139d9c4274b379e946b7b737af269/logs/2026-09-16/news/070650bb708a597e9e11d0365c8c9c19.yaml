title: PATA Foundation launches Nepal Tourism Recovery Fund to support tourism livelihoods | TTG Asia
body: The PATA Foundation has launched the Nepal Tourism Recovery Fund to support tourism workers and small businesses whose livelihoods have been affected by the devastating floods that struck Nepal on August 26.
