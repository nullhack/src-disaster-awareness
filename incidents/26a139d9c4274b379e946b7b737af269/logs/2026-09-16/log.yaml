log_date: '2026-09-16'
summary: As of mid-September, the Bagmati flood death toll has crossed 1,400 with over 6,000 still missing, and most recovered bodies remain unidentified, complicating identification efforts. New human-interest stories emerged, including a tunnel survivor who endured 10 days trapped and the near-total destruction of the border town Timure, while repeated closures of the Tatopani border crossing deepen trader uncertainty. International support continues to grow, with the US offering disaster recovery assistance and charities like Aquabox and PATA Foundation launching appeals to aid affected communities.
