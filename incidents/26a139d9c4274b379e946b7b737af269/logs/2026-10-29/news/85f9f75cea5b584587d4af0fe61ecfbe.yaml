title: भोटेकोशी बाढीका बेपत्ताको विवरण माग
body: काभ्रेपलाञ्चोक।काभ्रेपलाञ्चोकका स्थानीय तहले रसुवाको भोटेकोशीमा भदौ १० मा आएको बाढीपछि बेपत्ता भएका नागरिकको सम्बन्धित परिवार एवं आफन्तसँग विवरण माग गरेका छन्। जिल्लास्थित १३ स्थानीय तहले ‘रसुवा–भोटेकोशी बाढीमा बेपत्ता भएकाको आधिकारिक विवरण यकिन गर्ने प्रक्रिया, २०८३’ अनुसार वडामार्फत बेपत्ता नागरिकको बिवरण माग गरेका हुन्। यसका लागि जिल्ला प्रशासन कार्यालयले बाढीमा परी बेपत्ता भएका व्यक्तिहरुको आधिकारिक विवरण […]
