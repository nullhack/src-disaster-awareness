log_date: '2026-10-22'
summary: |-
  Malaysia’s foreign minister told Parliament that the last phone pings of 54 missing Malaysians were traced to the Nepal glacial flood site. A new analysis warns of the risks faced by displaced survivors in temporary settlements, while Nepal looks to test whether COP31 can deliver climate justice, underscored by personal stories like that of Urika Tamang, whose husband remains missing.
  Bank Negara Malaysia announced that banks would extend repayment deferments to victims of the Nepal-China floods. The UN climate loss and damage fund moved to provide the $20 million in aid that Nepal had requested. Additionally, Malaysia asked Nepal to shorten the waiting period for issuing missing-person or death certificates for the 54 Malaysians still unaccounted for after the disaster.
