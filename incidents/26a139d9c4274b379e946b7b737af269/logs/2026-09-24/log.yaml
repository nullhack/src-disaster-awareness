summary: Foreign Minister Shisir Khanal has appealed for greater international support for Nepal's recovery and reconstruction. The Asian Development Bank has revised Nepal's growth forecast downward to 4.1% due to the flood's economic impact, while health experts warn of emerging risks as floodwaters recede. Candlelight memorials have been held abroad, and Prime Minister Shah is set to advocate for climate justice at the UN General Assembly.
