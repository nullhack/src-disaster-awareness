title: Bhotekoshi floods prompt ADB to cut Nepal's growth forecast to 4.1 percent
body: Kathmandu, Sept. 23 -- Last month's Bhotekoshi floods have tempered Nepal's growth momentum and may push up inflation in the current fiscal year, which ends in mid-July 2027.
