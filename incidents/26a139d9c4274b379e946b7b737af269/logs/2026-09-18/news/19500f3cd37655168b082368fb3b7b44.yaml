title: Wagle seeks India's support for post-flood reconstruction
body: Kathmandu, Sept. 18 -- Finance Minister Swarnim Wagle has sought Indian support for the reconstruction and rebuilding of properties and infrastructure destroyed by last month's Bhotekoshi floods.
