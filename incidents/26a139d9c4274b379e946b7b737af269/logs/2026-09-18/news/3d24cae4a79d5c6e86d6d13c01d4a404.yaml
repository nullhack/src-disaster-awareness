title: Want to help Nepal recover from its deadly floods? Here's what tourists need to know
body: But ever since the deadly floods, Nepal has been appealing to international tourists not to cancel their travel plans. Much of the country is still open to visitors. Without tourism, what has been a disaster for parts of the country will end up hurting communities across the nation.
