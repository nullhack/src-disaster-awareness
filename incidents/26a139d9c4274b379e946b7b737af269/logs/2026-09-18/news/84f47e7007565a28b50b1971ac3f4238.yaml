title: Death toll climbs to 1,453 from devastating floods, mudslides at Nepal-China border, with 6,664 missing
body: 'KATHMANDU: (Bernama-Anadolu) The death toll from last month''s devastating flash floods and mudslides along the Nepal-China border rose to 1,453 on Thursday (Sept 17), with 6,664 missing on both sides, Anadolu Ajansi reported, citing authorities.'
