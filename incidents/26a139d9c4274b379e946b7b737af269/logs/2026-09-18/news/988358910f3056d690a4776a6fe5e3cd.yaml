title: 'Nepal Floods: India To Supply 18-Hour Daily Power To Kathmandu Amid Severe Power Shortage'
body: India has approved an 18-hour daily electricity export to flood-devastated Nepal until December 2026, following extensive damage to Nepal's hydropower projects and widespread power outages. This move aims to help Nepal meet its energy demands during the crisis and reinforces India's commitment to bilateral energy cooperation and humanitarian assistance.
