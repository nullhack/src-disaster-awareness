summary: The death toll from the Bagmati floods has risen to 1,453 with 6,664 missing, and 677 transport workers are now reported unaccounted for. New scientific analyses emphasize that the disaster was a "compound crisis" driven by climate change and seismic factors, with the New York Times reporting that the catastrophe has set off alarms for glacial flood risks across the Himalayas.
