log_date: '2026-09-18'
summary: |-
  The death toll from the Bagmati floods has risen to 1,453 with 6,664 missing, and 677 transport workers are now reported unaccounted for. New scientific analyses emphasize that the disaster was a "compound crisis" driven by climate change and seismic factors, with the New York Times reporting that the catastrophe has set off alarms for glacial flood risks across the Himalayas.
  As of September 17, Nepal's flood death toll was reported at 1,410 with over 6,100 still missing, while new scientific analyses link the disaster to the 2015 earthquake, glacier retreat, and climate change. Separate reports highlight social media influencers exploiting survivors for content, and Finance Minister Wagle has sought Indian support for post-flood reconstruction. The Guardian editorial calls the catastrophe a spur to action on climate, and photos show villages still buried in mud three weeks later.
