log_date: '2026-11-26'
summary: |-
  Nepal has begun the process to formally declare missing foreign nationals dead after the August floods, with India’s embassy urging families of 213 missing Indians to review the published list and raise objections by December 2. Nepali authorities have verified details of 452 missing foreign nationals from 12 countries, including 85 Chinese and 69 Americans, while Malaysian officials said certificates of presumed death will be issued once documents arrive from Nepal. Separate coverage noted a Sonoma Sherpa community fundraiser raising more than $100,000 for flood relief and commentary urging that Himalayan settlements be kept out of harm’s way.
  Three months after the August 26 floods, survivors returned to a destroyed Hindu temple to honour those killed, as communities continue picking up the pieces. Nepal has meanwhile issued an official list of missing foreign nationals, including 213 Indians whose families were asked to review it, and Malaysia's National Registration Department said death certificates for the 54 missing Malaysians will be issued once Nepali authorities provide official confirmation. Families of the missing, such as an Isipingo mother awaiting news of her daughter, remain in limbo.
