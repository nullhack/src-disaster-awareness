log_date: '2026-11-26'
summary: Nepal has begun the process to formally declare missing foreign nationals dead after the August floods, with India’s embassy urging families of 213 missing Indians to review the published list and raise objections by December 2. Nepali authorities have verified details of 452 missing foreign nationals from 12 countries, including 85 Chinese and 69 Americans, while Malaysian officials said certificates of presumed death will be issued once documents arrive from Nepal. Separate coverage noted a Sonoma Sherpa community fundraiser raising more than $100,000 for flood relief and commentary urging that Himalayan settlements be kept out of harm’s way.
