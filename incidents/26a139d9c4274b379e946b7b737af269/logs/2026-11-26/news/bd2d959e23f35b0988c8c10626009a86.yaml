title: Nepal moves to declare 213 missing Indians dead
body: Kathmandu, Nov.25 (IANS) The Embassy of India in Nepal has urged families of Indian nationals who went missing following the deadly floods in Nepal on August 26 to review the list of missing Indian citizens published by the Nepali authorities and submit any concerns or objections by December 2.
