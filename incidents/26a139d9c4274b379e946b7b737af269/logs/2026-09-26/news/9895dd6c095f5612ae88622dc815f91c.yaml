title: Nepal’s leader, at UN, says recent floods serve as a ‘warning to the world’ about climate change
body: Nepal’s prime minister scolded fellow world leaders Thursday, saying the nation’s recent deadly flood reminds a warming world that climate change keeps hurting people who didn’t cause the crisis but now need help.
