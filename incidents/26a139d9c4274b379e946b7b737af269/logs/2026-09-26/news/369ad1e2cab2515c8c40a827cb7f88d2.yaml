title: One month on, Nepal floods leave 1,453 dead, nearly 5,300 still missing
body: Broken roads, buried remains and isolated villages continue to shape Nepal’s recovery a month after the floods. Authorities are using DNA profiling to identify victims, rebuilding vital bridges and roads and relying on helicopters and temporary crossings to reach stranded communities as death toll reaches 1,453.
