summary: |-
  Prime Minister Balendra Shah proposed a climate alliance with India and China during his UN address. New reports also specify that 85 pilgrims from Tamil Nadu remain missing a month after the disaster. Nepal's foreign minister reiterated that wealthy nations should contribute to climate recovery.
  One month after the disaster, the official death toll stands at 1,453 with nearly 5,300 still missing, including at least 33 British nationals. Singapore sent fingerprint specialists to assist with victim identification, and Prime Minister Shah returned from the UN General Assembly after emphasizing climate justice and seeking international support for reconstruction.
