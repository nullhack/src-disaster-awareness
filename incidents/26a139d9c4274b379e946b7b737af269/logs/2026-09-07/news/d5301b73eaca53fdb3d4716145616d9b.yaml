title: Nepal flood shelters leave mothers, infants and pregnant women without support
body: Women displaced by Nepal’s flash floods say shelters lack baby food, privacy and medical support. The gaps expose how generic relief systems overlook pregnancy, breastfeeding and infant care needs.
