title: 'Video: Receding Nepal floodwater, thick layer of mud reveal scale of destruction'
body: As floodwaters recede from areas devastated by last month's catastrophic flash floods in Nepal, the true extent of the tragedy is gradually surfacing, with a landscape of thick muck, debris, and destruction left behind. On Sunday, the official death toll due to the calamity reached 1,369 in the Himalayan nation, with about 5,000 people still missing. India Today visited Bidur in Nuwakot, one of the districts worst affected by the floods in Nepal. What once was a bustling city now lay washed away, leaving behind an eerie, ghost-town-like landscape. Bidur, however, is now again accessible by foot due to the receding water level in the Trishuli River.
