log_date: '2026-09-07'
summary: Death tolls from the Bagmati floods continued to fluctuate, with reports on September 6-7 citing figures between 1,331 and 1,369 in Nepal and nearly 5,000 still missing. New details emerged about specific missing individuals, including a Woodland, California couple and pilgrims to Mount Kailash, while South Korea formally requested expanded search efforts for its citizens. Relief efforts faced fresh challenges as displaced mothers and infants lacked adequate support, police warned against keeping valuables found in debris, and Nepal launched a QR-based digital donation drive to streamline contributions.
