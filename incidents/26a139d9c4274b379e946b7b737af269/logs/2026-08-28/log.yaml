log_date: '2026-08-28'
summary: A glacier collapse near the Nepal-Tibet border triggered devastating flash floods and mudslides on August 26, 2026, sweeping through several communities in the Bagmati region. The disaster has killed hundreds of people (with death tolls reported between 350 and 500) and left over 1,300 missing, including dozens of foreign nationals. Rescue teams are searching for survivors while authorities warn of additional flood risks from a newly formed lake, and international aid is arriving to support relief efforts.
