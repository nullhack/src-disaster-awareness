title: Nepal Will Need Billions For Flood Recovery, Minister Says
body: Nepal will need at least “a few billion dollars” to recover from the devastation caused by flash floods, prompting the $45 billion economy to seek international funding for a massive reconstruction effort, according to Finance Minister Swarnim Wagle.
