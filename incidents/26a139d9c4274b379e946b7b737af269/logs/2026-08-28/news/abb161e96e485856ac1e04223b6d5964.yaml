title: AI-generated video misleadingly shared as real footage of Nepal-Tibet flood
body: Hours after a deadly flash flood inundated the Nepal-Tibet border, killing hundreds, social media posts circulated a video purporting to show the disaster unfolding. The clip contains visual anomalies...
