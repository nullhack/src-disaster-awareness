title: 'Nepal: Operational update on humanitarian response after devastating floods'
body: Humanitarian needs continue to rise in Nuwakot, Rasuwa, and other districts after flash floods in Nepal on 26 August claimed hundreds of lives. Thousands of people are still missing, leaving families separated and many communities vulnerable, even as the confirmed death toll keeps increasing.
