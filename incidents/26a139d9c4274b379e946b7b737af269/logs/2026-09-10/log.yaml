log_date: '2026-09-10'
summary: As of September 9–10, Nepal's flood death toll reached 1,365, with President Paudel urging accelerated rescue, relief, and reconstruction. UAE search and rescue teams found six missing individuals 15 days after the disaster, and the government announced a scholarship bank to guarantee education for orphaned or displaced children. International support expanded with India sending 130 tonnes of aid and 54 experts, while Nepal formally pitched climate justice to secure $5 billion in rebuilding funds, prompting the climate loss and damage fund to consider urgent assistance.
