title: Families of 55 missing Malaysians in Nepal attend Wisma Putra briefing
body: 'PUTRAJAYA: Family members of the 55 Malaysians who remain missing following the glacial flash flood incident in Nepal arrived at Wisma Putra as early as 9am on Sunday (Sept 27) to meet with government representatives regarding the latest updates on the search efforts for their loved ones.'
