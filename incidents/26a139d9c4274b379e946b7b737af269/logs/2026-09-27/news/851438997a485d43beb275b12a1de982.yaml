title: Climate disasters are growing. So are cuts to programs that prepare for them | Texarkana Gazette
body: KATHMANDU, Nepal -- Sitting on the floor of a makeshift shelter for survivors of Nepal's deadly recent floods, Tenzin Dolma Ghale said she had nothing left but the clothes she was wearing. Her entire village and members of her family were washed away by the surge of water and debris that killed over 1,450 people and left more than 6,000 missing.
