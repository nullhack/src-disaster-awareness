log_date: '2026-09-27'
summary: |-
  The government set up a committee to name the disaster, and the UAE pledged $25 million in flood aid. Singapore’s 35-strong forensic team returned after completing victim identification and aerial surveillance support. Families of 55 missing Malaysians were briefed on search efforts, while one report puts the missing count at over 6,000.
  Nepal has asked the UN loss‑and‑damage fund for $20 million to support recovery, while the search for thousands of missing people may soon be called off and the government is weighing legal measures for those still unaccounted for, including 55 Malaysians. Survivors also face a new struggle with access to safe drinking water, prompting relief groups to step in.
