log_date: '2026-09-19'
summary: |-
  Rescuers recovered six bodies from the Upper Trishuli-1 hydropower tunnel. The UAE dispatched its sixth humanitarian aid plane carrying food and clothing, bringing total assistance to 245 tonnes. Survivors in flood-ravaged towns describe finding little trace of their former lives, while experts and editorials question cross-border warning systems and call for greater cooperation.
  As of late September, rescuers recovered six more bodies from the Upper Trishuli-1 hydropower tunnel, while a Duquesne University professor was identified among the flood victims. Nepal launched a seven-member expert panel to investigate the disaster's causes, announced long-term support for orphaned children, and Finance Minister Wagle began an international tour seeking aid. Meanwhile, a new scientific report detailed the cascade of failures that caused the flood, and road clearance efforts remained hampered by mud and steep terrain.
