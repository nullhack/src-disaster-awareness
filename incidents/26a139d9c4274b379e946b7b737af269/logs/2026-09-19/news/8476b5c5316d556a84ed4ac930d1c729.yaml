title: NCRC, MITGF plan long-term support for children affected by Bhotekoshi flood
body: The National Child Rights Council (NCRC) and MIT Group Foundation (MITGF) Co have agreed to establish a long-term support programme for children who lost one or both parents in the 2026 Bhotekoshi floods.
