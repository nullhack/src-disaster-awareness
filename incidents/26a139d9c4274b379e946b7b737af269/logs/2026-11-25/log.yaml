log_date: '2026-11-25'
summary: |-
  Authorities have begun distributing house-rent cash assistance to flood-affected families, with money for 970 households in Bidur Municipality, Nuwakot, transferred directly into their bank accounts. Separately, the Malaysian government has disbursed RM540,000 in financial assistance to 54 family members of victims of the Nepal floods.
  Malaysia's National Registration Department said certificates of presumed death for the 54 Malaysian victims of the August 26 Nepal flood could be issued as early as December, pending verification documents from the Nepali government. Meanwhile, relatives of the missing Malaysians say they are gradually accepting the reality of the tragedy. Other items in the batch, including India's $1.62 billion aid announcement and a photo gallery of rescue teams, repeat developments already reported.
