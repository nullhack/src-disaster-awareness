title: Govt disburses RM540,000 aid to families of Nepal flood victims
body: 'KUALA LUMPUR: The government has disbursed RM540,000 in financial assistance to 54 family members of victims of the floods and landslides in Nepal, says Datuk Seri R. Ramanan.'
