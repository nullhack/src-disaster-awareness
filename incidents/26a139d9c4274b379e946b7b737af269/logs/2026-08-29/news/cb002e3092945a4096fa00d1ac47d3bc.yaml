title: 'Nepal Flood Crisis: IAF Flies Doctors And Tunnel Experts To Bhotekoshi After 57.5 Tonne Relief'
body: India sent 11-member medical and tunnel rescue team on third IAF flight with 10 tonnes aid, taking total to 57.5 tonnes, as the WHO released $150,000 for Nepal flood in Bhotekoshi where hundreds are dead, missing or displaced.
