title: Almost 2,000 missing in Nepal as Himalayan border flash flood death toll passes 570 - WCCB Charlotte
body: Nepal’s disaster management authority said the number of people reported missing after a flash flood along the Himalayan border between Nepal and China has doubled to 1,924. The update on Friday came as rescuers worked through mud and debris in areas devastated by Wednesday's disaster.
