title: Nepal-China flood survivors reach safe areas as families await news of nearly 3,000 missing
body: Poor weather temporarily hampered aerial rescue operations in Nepal as the search for thousands of missing people in areas devastated by catastrophic flash floods along the border with China entered its fourth day.
