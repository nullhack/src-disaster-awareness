title: On the ground in decimated Nepal flood zone – The Latest
body: Rescue efforts are continuing in Nepal and Tibet after flash floods that have killed hundreds and left many more missing, with fears of fresh flooding due to an overflowing lake. Lucy Hough speaks with south Asia correspondent Hannah Ellis-Petersen, who is in Nepal, about the situation on the ground
