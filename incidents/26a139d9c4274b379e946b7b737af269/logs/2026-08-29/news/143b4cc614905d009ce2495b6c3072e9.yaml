title: Number Of Missing In Deadly Nepal, China Floods Jumps Past 2,400
body: The number of people missing in Nepal and China leaped to more than 2,400 Friday, underscoring the scale of the disaster days after a tsunami-like wall of water and debris swept away villages and killed hundreds.
