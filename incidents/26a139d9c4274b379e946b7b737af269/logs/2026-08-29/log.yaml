log_date: '2026-08-29'
summary: |-
  As of August 28, the death toll from the flash floods has climbed to over 470, with more than 1,900 people reported missing. Rescue operations have saved 117 foreign tourists, while authorities warn of further flooding from a swelling lake. International aid is arriving, including $500,000 from the US and support from the WHO and India.
  As of August 29, the death toll from the Bagmati flash floods has risen to over 600, with 633 bodies recovered, and the number of missing has soared to nearly 3,000. Rescue operations are being hampered by bad weather, forcing a suspension of helicopter missions, while Nepal appeals for international technical assistance and billions in aid. Warnings continue about potential new flooding from a swelling lake, and the disaster has exposed risks to Nepal's hydropower infrastructure.
