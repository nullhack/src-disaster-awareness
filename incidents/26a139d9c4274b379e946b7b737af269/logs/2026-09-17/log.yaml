log_date: '2026-09-17'
summary: |-
  As of September 16, Nepal revised the missing count upward by nearly 1,000 to 6,150, with the death toll rising to 1,446 across Nepal and China. A new scientific analysis found that human-caused warming played a "very strong" role in destabilizing permafrost and ice, increasing the likelihood of the fatal glacier collapse. Pakistan offered technical assistance to Nepal, while the US State Department provided updates on aid and noted that 70 Americans remain unaccounted for. The AFP fact-check summarized the disaster's scale, with over 1,400 killed and 5,300 missing.
  Rescuers recovered four bodies from a hydropower plant tunnel three weeks after the flash flood, as families demanded answers. The World Food Programme described the aid operation as among its most challenging, with cargo drones and helicopters delivering food to isolated communities. Nepal's foreign minister called for stronger climate diplomacy following the disaster, and a fundraiser was launched to bring medical supplies and support to affected children.
