title: 'Red Cross delivers supplies to victims of Nepal flood | VRT NWS: news'
body: A plane carrying 40 tonnes of emergency aid has travelled from Belgium to Nepal. The supplies, provided by the Red Cross in Flanders and French-speaking Belgium, the German Red Cross and the German ministry of Foreign Affairs, will support victims of the devastating floods that killed almost 1,500 people in August.
