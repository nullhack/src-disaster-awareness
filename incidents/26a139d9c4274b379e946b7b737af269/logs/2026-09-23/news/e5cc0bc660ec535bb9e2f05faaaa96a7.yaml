title: नेपाल बाढ़ में लापता भारतीयों की तलाश तेज, DNA जांच में 1200 से ज्यादा प्रोफाइल तैयार
body: नेपाल में बाढ़ की तबाही के बाद कई परिवार अभी भी अपने प्रियजनों की तलाश में है. अब लापता लोगों की पहचान के लिए DNA जांच बड़ा सहारा लिया जा रहा है. काठमांडू में भारतीय फॉरेंसिक टीमें लगातार सक्रीय हैं.
