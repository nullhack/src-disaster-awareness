title: Nepal plans to drain four glacial lakes after deadly floods
body: 'KATHMANDU: Nepal will kick off a high-stakes effort this fiscal year to drain four glacial lakes perched high in the mountains, as it scrambles to reduce flood risks, officials said, after a recent disaster that killed more than 1,400.'
