title: US deportees in S. Sudan deprived, kin say | Arkansas Democrat Gazette
body: JUBA, South Sudan -- Migrants deported by the Trump administration to countries other than their own have endured hunger, thirst and other deprivations while being detained indefinitely in places with poor human rights records and little oversight.
