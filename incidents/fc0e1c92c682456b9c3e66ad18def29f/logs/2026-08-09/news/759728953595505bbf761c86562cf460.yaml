title: 'Tremor in Alaska: 5.5 Magnitude Earthquake Rattles Skwentna | Science-Environment'
body: A magnitude 5.5 earthquake shook the Skwentna region of Alaska on Friday. The United States Geological Survey reported that the quake occurred 200 meters (700 feet) below the surface. No immediate reports of damage or casualties have been released.
