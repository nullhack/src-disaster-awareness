log_date: '2026-08-05'
summary: On August 4, 2026, the Grasshopper Fire near Mt. Hood Meadows in Oregon has burned over 34,000 acres and is 19% contained, prompting Level 3 "go now" evacuation orders for the area. The fire has expanded westward toward the Mount Hood National Forest, with Clackamas County issuing Level 1 evacuations as well.
