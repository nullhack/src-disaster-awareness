title: 'Aspen Acres Fire: Smoke remains visible near Lake Isabel - AOL'
body: (SOUTHERN COLORADO) — The Aspen Acres Fire in Southern Colorado has burned 101,965 acres as of Sunday, Aug. 9. The fire is now 72% contained, and 141 personnel are battling the fire, according to the Wyoming Type 3 Incident Management Team 5. Warmer and drier weather will persist across the Aspen Acres Fire area on […]
