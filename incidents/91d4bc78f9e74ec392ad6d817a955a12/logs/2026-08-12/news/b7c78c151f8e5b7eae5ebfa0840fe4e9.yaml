title: Pilots of helicopter that crashed while fighting wildfire in Utah are dead, officials say
body: Officials have confirmed that two pilots who crashed while fighting a wildfire in Utah are dead. The Sevier County sheriff said Saturday that the pilots were killed when their Sikorsky Skycrane helicopter went down Friday morning.
