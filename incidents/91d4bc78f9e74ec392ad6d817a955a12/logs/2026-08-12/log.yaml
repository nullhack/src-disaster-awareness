log_date: '2026-08-12'
summary: |-
  The Grasshopper Fire has forced Mount Hood Meadows to close for the remainder of the summer. New evacuations were issued on August 11 as the fire continues to grow in the Mt. Hood National Forest, with the Grasshopper and nearby Austin fires prompting expanded evacuation orders.
  The Wasco County Fair and Rodeo, scheduled to start on Thursday, was canceled due to the Grasshopper Fire's extreme growth, prompting an emergency meeting by fair officials.
