title: Early wildfire surge raises alarm in Indonesia
body: 'JAKARTA: Indonesia may be heading toward its worst wildfire season in years as fire activity surges ahead of peak burning months, fuelled by a prolonged dry spell expected to intensify under a strong El Niño.'
