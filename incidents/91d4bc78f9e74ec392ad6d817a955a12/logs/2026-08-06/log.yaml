log_date: '2026-08-06'
summary: |-
  The Grasshopper Fire has grown to become Oregon's highest priority blaze, causing ongoing evacuation orders for Government Camp and the Mount Hood area and shutting down summer tourism. Additionally, smoke from the Oregon wildfires, including the Grasshopper Fire, has drifted south, dropping air quality in Reno, Nevada to "unhealthy for sensitive groups."
  The Grasshopper Fire has grown to nearly 40,000 acres, expanding further westward into the Mount Hood Wilderness. Level 3 evacuation orders remain in place for parts of Hood River and Wasco counties, and the fire continues to be Oregon's highest priority.
