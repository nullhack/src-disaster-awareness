title: As Grasshopper Fire threatens Dufur's historic heart, crews take steps to protect it
body: Oregon’s Grasshopper Fire has burned 85,114 acres and is 20% contained, destroying homes and outbuildings. In Dufur, Level 2 evacuations are in place as crews protect landmarks like the Balch Hotel.
