title: New Forest blaze points to challenge for under-pressure fire services
body: Outside the village of Burley, smoke from a vast heathland fire rose in a column on the horizon, while a fleet of all-terrain fire engines stood ready to tackle flare-ups. A hose carrying water to those tackling the blaze snaked across a landscape turned yellow by two nearly rainless months.
