title: 'MON: Northern New Mexico fire grows to 3,000 acres, + More'
body: The Frijoles Fire began Tuesday. As of 9 p.m. Sunday, it had grown to 3,000 acres with 0% containment. Lightning is being attributed as the cause, according to the U.S. Forest Service.
