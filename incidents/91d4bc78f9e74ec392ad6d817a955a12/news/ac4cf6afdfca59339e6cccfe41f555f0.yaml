title: 'Aspen Acres Fire: Crews continue suppression repairs - AOL'
body: (SOUTHERN COLORADO) — The Aspen Acres Fire in Southern Colorado has burned 101,965 acres as of Saturday, Aug. 8. The fire is now 72% contained, and 168 personnel are battling the fire, according to the Wyoming Type 3 Incident Management Team 5. Hot, dry, and unstable weather will continue through the weekend, bringing cloud buildup […]
