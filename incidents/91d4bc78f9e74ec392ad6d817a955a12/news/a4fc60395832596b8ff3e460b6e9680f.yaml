title: Timber Fire is 'everyone's worst nightmare' as it threatens communities, iconic Big Sur landmarks
body: The Timber Fire is burning near several well-known hotels and restaurants along Highway 1, including Ventana, Post Ranch Inn and Nepenthe, but CAL FIRE says there has been no damage to buildings so far.
