title: Two pilots battling Utah fire were killed in copter crash. They died trying ‘to protect our state,’ Gov. Cox says.
body: Two pilots died after a helicopter crashed while battling the Widemouth 2 Fire near Kanosh, which has burned more than 110,000 acres in the Fishlake National Forest.
