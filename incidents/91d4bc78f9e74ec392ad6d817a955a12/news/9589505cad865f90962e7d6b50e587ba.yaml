title: Indonesia's Mount Bromo wildfire in Probolinggo prompts partial tourist area closure
body: A forest and land fire at Indonesia's Mount Bromo has spread across about 10 hectares, forcing the partial closure of one of the country's most popular tourist destinations as firefighters race to contain the blaze.
