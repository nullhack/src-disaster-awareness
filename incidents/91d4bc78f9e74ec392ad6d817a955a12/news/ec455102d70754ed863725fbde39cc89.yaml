title: Idaho governor, Forest Service chief say significant wildfires are stretching resources thin - East Idaho News
body: BOISE (Idaho Capitol Sun) – Idaho Gov. Brad Little and U.S. Forest Service Chief Tom Schultz said Friday that firefighting resources are stretched thin as significant wildfires burn across Washington, Oregon, Idaho and much of the Western United States. As a result, both officials called on the public to redouble its efforts to prevent wildfires […]
