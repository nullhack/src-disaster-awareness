title: Residents, campers forced to evacuate as Sonoma Coast wildfire closes Highway 1, blankets region in smoke
body: Fire crews are battling to prevent the blaze from gaining a foothold east of Highway 1, as daytime heat, coastal winds and thick forest are likely to stoke further growth.
