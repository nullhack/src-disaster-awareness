title: Brush Fire Scorches 77 Acres Near San Bernardino National Forest - MyNewsLA.com
body: A brush fire that erupted in Sage scorched 77 acres at the edge of the San Bernardino National Forest, and remained 50% contained Saturday. The blaze was reported at 12:40 p.m. Friday in the area of Taffle Ranch and Red Mountain roads, about six miles southeast of Hemet, according to the Riverside County Fire Department. […]
