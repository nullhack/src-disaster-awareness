title: Firefighters anticipate full containment Sunday night on 225-acre McPherson Fire - East Idaho News
body: GRACE – Firefighters battling a 225-acre fire in McPherson Canyon near Grace anticipate the blaze will be fully contained Sunday at 6 p.m. That’s the latest update from fire officials in a Sunday afternoon news release. The human-caused fire started Friday evening on private property and quickly spread to U.S. Forest Service land. While no […]
