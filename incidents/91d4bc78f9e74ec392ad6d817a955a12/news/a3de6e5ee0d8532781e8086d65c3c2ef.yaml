title: Crews make gains on Woodside Fire, but heat, wind and heavy timber to make for 'a long haul'
body: The coastal wildfire forced hundreds to evacuate, as Highway 1 along a popular stretch of the Sonoma Coast closed and heavy smoke continued to shroud the region.
