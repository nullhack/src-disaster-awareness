title: 15-y-o detained over deadly French forest fire - Jamaica Observer
body: BORDEAUX, France (AFP) — French authorities have detained a 15-year-old youth suspected of starting a forest fire that killed two firefighters, a source close to the investigation told AFP on Thursday. The two firefighters were in a truck that became trapped by flames from a forest fire they were battling near Bordeaux airport in western France on July 21. The source said the teenager had been formally placed under investigation...
