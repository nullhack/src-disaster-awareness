title: 'Colorado wildfire roundup: Aspen Acres fire containment falls slightly'
body: Crews working the Aspen Acres fire successfully knocked down some hot spots and established fire lines in recent days, as containment fell from 71 to 68% on Wednesday. That work was done on the southern edge of the fire, including an area near Rye that firefighters are calling the “chicken foot.” The fire has seen […]
