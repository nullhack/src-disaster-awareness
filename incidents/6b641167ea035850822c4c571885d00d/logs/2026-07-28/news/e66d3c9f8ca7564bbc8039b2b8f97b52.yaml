title: Steel lobby pushing for shorter timeline to comply with quake-resistance standards - BusinessWorld Online
body: THE Philippine Iron and Steel Institute (PISI) asked on the government to reduce the transition period for builders to comply with seismic resistance standards for steel. In a letter addressed to the Department of Trade and Industry (DTI), PISI said the proposed April 30, 2027 deadline to comply with Philippine National Standard (PNS) 49:2026 is […]
