title: Iowa State Fair prepared for rain and severe weather - AOL
body: DES MOINES, Iowa — Last year’s Iowa State Fair started out on a stormy note, and this year’s is bringing more wet conditions. Severe thunderstorm and tornado warnings were issued across central Iowa Thursday morning. More rain and wet weather is expected over the next few days, making for a soggy start to the Iowa […]
