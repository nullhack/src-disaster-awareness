log_date: '2026-08-12'
summary: Severe storms swept across the Midwest on August 11-12, 2026, spawning tornadoes and causing flash flooding, widespread damage, and power outages affecting over half a million people in the Chicago area and northwestern Indiana. Multiple tornadoes were confirmed in Chicago's south suburbs, and severe weather continued into August 12 with additional storm threats and flooding across central Indiana and Ohio.
