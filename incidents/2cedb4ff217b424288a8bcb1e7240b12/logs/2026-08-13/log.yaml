log_date: '2026-08-13'
summary: New reports on August 12 indicate that the severe storms in the Midwest have resulted in at least one child killed by a fallen tree in Indiana, a home explosion in Portage, and a software glitch at the National Weather Service that hindered warning dissemination. Power outages have grown to over 700,000 customers, and flooding persists in parts of Indiana and Ohio, with additional storms expected through the afternoon.
