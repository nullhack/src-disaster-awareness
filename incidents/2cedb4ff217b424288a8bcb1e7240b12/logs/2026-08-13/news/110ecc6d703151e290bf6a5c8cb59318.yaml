title: Warm, Muggy Thursday, Night Storms Continue
body: After this morning's storms, another round of showers and thunderstorms will be possible late Thursday and into early Friday morning. A Marginal Risk (Level 1 out of 5) of severe weather is in effect, with isolated severe storms possible. Large hail, damaging winds and localized flooding will be the main concerns in the strongest storms.
