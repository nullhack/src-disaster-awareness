title: ComEd says power restored to more than 80% of Chicagoland customers impacted by this week’s severe storms - AOL
body: Service was disrupted for nearly 410,000 customers, ComEd says, and Wednesday morning's storms added more than 35,000 outages while temporarily delaying restoration work that was already underway in ComEd's south region.
