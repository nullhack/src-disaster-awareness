title: No tsunami threat to Hawaii after 7.0M earthquake in Russia’s Kamchatka region
body: There is no tsunami threat for Hawaii after a 7.0 magnitude earthquake hit near the east coast of the Kamchatka Peninsula in Russia on Thursday.
