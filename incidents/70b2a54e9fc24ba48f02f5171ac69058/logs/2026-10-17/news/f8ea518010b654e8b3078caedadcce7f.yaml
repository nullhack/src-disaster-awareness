title: Magnitude 7.0 Earthquake Strikes Russia’s Kamchatka Peninsula; No Tsunami Threat Issued - DD India
body: A powerful earthquake of magnitude 7.0 struck Russia’s Kamchatka Peninsula region on Friday, according to the National Centre for Seismology (NCS) and international seismic monitoring agencies. No tsunami threat was reported following the tremor. The US National Oceanic and Atmospheric Administration (NOAA) said no tsunami warning, advisory or watch was in effect following the earthquake. […]
