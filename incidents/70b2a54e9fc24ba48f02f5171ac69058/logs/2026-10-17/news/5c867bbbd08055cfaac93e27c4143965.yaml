title: भूकंप से डोली धरती, रूस में 7.0 तीव्रता के तेज झटके किए गए महसूस
body: रूस के सुदूर पूर्व में स्थित कामचटका प्रायद्वीप क्षेत्र में शुक्रवार सुबह भूकंप के तेज झटके महसूस किए गए. भूकंप से हुए संभावित नुकसान की विस्तृत जानकारी का इंतजार है.
