title: Magnitude 7.0 earthquake jolts Russias Kamchatka Peninsula; no tsunami threat issued
body: An earthquake of magnitude 7.0 on the Richter scale struck Russias Kamchatka Peninsula region on Friday, according to the European-Mediterranean Seismological Centre (EMSC) and the National Centre for Seismology (NCS).
