title: 'Russia: Earthquake Of Magnitude 7 Strikes Kamchatka Peninsula'
body: 'Russia Earthquake: A powerful magnitude 7 earthquake struck Russia''s Kamchatka Peninsula on Friday, as reported by the European-Mediterranean Seismological Centre. The seismic event occurred at a depth of 140 km, with its epicenter located southwest of Vilyuchinsk.'
