title: Magnitude 6.9 quake strikes Russia's Kamchatka Peninsula
body: USGS records magnitude 6.9 tremor off Russia's Kamchatka Peninsula on Friday afternoon, with authorities confirming no tsunami threat due to the earthquake's significant depth below the Pacific coast.
