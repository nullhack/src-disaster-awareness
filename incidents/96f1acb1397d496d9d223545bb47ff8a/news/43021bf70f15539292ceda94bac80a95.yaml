title: The figures of the 43rd Group of the Spanish Air Force in 61 consecutive days of fighting the fire
body: This summer is proving especially difficult. As of August 20, Spain has recorded 43 major forest fires and a total of 262,030 hectares burned, according to data released by the Ministry for Ecological Transition and the Demographic Challenge (MITECO) on Thursday.
