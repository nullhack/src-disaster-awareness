title: 5.5 magnitude earthquake strikes off Japan's Hachijo Island, shaking felt in Tokyo
body: 'TOKYO: (Bernama-Xinhua) An earthquake with a preliminary magnitude of 5.5 struck off Hachijo Island, some 280 kilometres (km) south of Tokyo, the Japan Meteorological Agency said on Friday (Aug 21), reported Xinhua.'
