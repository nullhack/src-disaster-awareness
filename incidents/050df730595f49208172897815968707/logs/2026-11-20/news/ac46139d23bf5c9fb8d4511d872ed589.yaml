title: Extreme weather alerts are in effect for the Pichincha and Galapagos regions of Ecuador through November 21; monitor local media. - SafeAbroad
body: The National Institute of Meteorology and Hydrology (INAMHI) has issued an ‘extreme’ warning (the highest level) for thunderstorms and heavy rain in the Pichincha province. A ‘severe’ warning (second-highest) is in effect for the Galapagos province. Both alerts will remain in effect until November 21. Heavy rains are expected to continue disrupting travel and essential services. Flooding, landslides, and road washouts are all possible due to overflowing watersheds
