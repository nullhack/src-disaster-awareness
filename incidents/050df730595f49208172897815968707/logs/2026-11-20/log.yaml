log_date: '2026-11-20'
summary: Floods in Ecuador have destroyed rural roads, damaged cocoa bean quality, and spread disease, contributing to sharp increases in cocoa futures. Ecuador’s meteorological service has issued an extreme thunderstorm and heavy-rain warning for Pichincha and a severe warning for Galapagos through November 21, with flooding, landslides, and road washouts possible. Reports also describe a large rescue operation across nine provinces cut off by floods and landslides, with threats of epidemics.
