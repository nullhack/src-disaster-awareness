log_date: '2026-11-25'
summary: Babahoyo declared a 90-day flood emergency on 23 November after 13 rivers overflowed in Los Ríos province, prompting schools to move online as more rain was forecast. Church sources reported that more than 106,000 people across Ecuador have been affected by the ongoing heavy rainfall and flooding, with the local Church delivering aid following the bishops' ad limina visit to Rome. Video reporting from the Galápagos showed residents fleeing inundated areas and being evacuated by boat as they tried to salvage belongings.
