log_date: '2026-11-21'
summary: A landslide partly dammed a river near Alausí on 18 November; the risk agency says it is draining the blockage, no one was hurt, and a road is restricted. In Milagro, a resident was transported on a makeshift raft through a flooded street on 19 November after heavy rains linked to El Niño. A commodity report also notes that Ecuador has logged 851 floods since late August.
