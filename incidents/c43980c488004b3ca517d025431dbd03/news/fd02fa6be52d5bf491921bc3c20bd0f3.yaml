title: Strong 6.0-magnitude quake strikes Balochistan in Pakistan
body: An earthquake measuring 6.0 in magnitude struck southern Pakistan near Khuzdar, Balochistan on Saturday, around 95 km south of Sūrāb, according to the European-Mediterranean Seismological Centre (EMSC).
