title: Pakistan Earthquake Of Magnitude 5.9 Hits Balochistan's Khuzdar, 1 Killed As Rockfall Damages Region
body: A 5.9-magnitude earthquake struck Pakistan's Balochistan province on October 17, killing one person and damaging several mud houses. The epicentre was located 48 kilometres northwest of Khuzdar at a depth of 25 kilometres. Abdul Rahim died after a falling rock struck him in the Naal area, officials reported.
