title: 5.9-magnitude earthquake strikes Pakistan’s Balochistan province - OrissaPOST
body: 'Islamabad: A 5.9-magnitude earthquake struck the country’s Balochistan province Saturday, according to the Pakistan Meteorological Department (PMD). However, according to initial reports, there was no loss of life or property. Also Read Tanker attacked off Saudi coast: UKMTO 1 hour ago All nine Indian sailors aboard YARA J safe in Romania: Embassy 3 hours ago […]'
