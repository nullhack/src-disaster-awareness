title: 5.9-magnitude quake jolts Khuzdar - Daily Times
body: Amagnitude 5.9 earthquake jolted Balochistan’s Khuzdar district on Saturday, according to the Pakistan Meteorological Department (PMD). The quake occurred at 10:07am at a depth of 25 kilometres, the PMD said in a post on X. The PMD said the earthquake’s epicentre was located 48 kilometres northwest of Khuzdar, at latitude 28.02 degrees north and longitude […]
