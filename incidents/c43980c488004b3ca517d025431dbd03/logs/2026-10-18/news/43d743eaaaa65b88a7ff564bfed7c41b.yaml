title: 'Pakistan: One killed after earthquake jolts Balochistan''s Khuzdar district'
body: Quetta, Oct 18 (IANS) A powerful 5.9-magnitude earthquake struck the Khuzdar district and surrounding areas of Pakistan's Balochistan province on Saturday, claiming one life and causing severe damage to several traditional mud houses due to the intense shaking, local media reported on Sunday.
