log_date: '2026-10-17'
summary: On October 17, 2026, a moderate to strong earthquake struck near Khuzdar in Balochistan, Pakistan, with various agencies reporting magnitudes between 5.6 and 6.0. The shallow quake (10-25 km depth) caused widespread shaking and panic across Khuzdar and adjacent districts such as Kalat and Surab, but initial reports indicated no casualties or significant property damage.
