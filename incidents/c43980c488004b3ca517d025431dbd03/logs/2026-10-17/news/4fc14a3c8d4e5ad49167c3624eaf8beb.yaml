title: Magnitude 5.8 Earthquake Strikes Pakistan, Tremor Recorded At 15 Km Depth | Outlook India
body: An earthquake of magnitude 5.8 struck Pakistan on October 17, according to India’s National Centre for Seismology, while the US Geological Survey recorded a magnitude of 5.7 and placed the epicentre near Khuzdar in Balochistan
