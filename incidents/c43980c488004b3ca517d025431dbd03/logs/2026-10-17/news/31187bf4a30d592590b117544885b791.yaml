title: Strong earthquake strikes near Khuzdar, Pakistan
body: A shallow earthquake struck near Khuzdar in Pakistan's Balochistan province on Saturday, prompting residents to leave buildings. Early reports said there were no casualties or collapses, though agencies warned of risks to vulnerable structures;
