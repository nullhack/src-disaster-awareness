title: Moderate 5.9-magnitude earthquake jolts balochistan's khuzdar district - Daily Times
body: A 5.9-magnitude earthquake struck Balochistan's Khuzdar district on Saturday, causing fear among residents, though no immediate casualties or damages were reported.
