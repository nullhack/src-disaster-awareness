title: '5.7 magnitude earthquake shakes Khuzdar in Pakistan''s Balochistan: Shallow 10 km depth causes severe shaking'
body: Centered 48 kilometers west-northwest of Khuzdar at a focal depth of just 10 kilometers, the tremors triggered widespread shaking across nearby districts including Kharan and Kalat.
