title: Pedasí's Tourism Message 19 to 20 Days After the Panama Earthquake. 'We are Ready to Receive You'. - Newsroom Panama
body: The municipality of Pedasí, along with boatmen and tour operators, requested a six-month suspension of the entrance fee to Isla Iguana to revive tourism. Boatmen and tour operators wait for tourists at El Arenal beach with 70 empty boats.
