title: 7.6 magnitude earthquake felt in Panama - USGS
body: A strong 7.6 magnitude earthquake struck near the southern coast of Panama on Friday at a 10 km depth, according to the US Geological Survey, which downgraded an earlier estimate of 8.0 magnitude.
