title: El terremoto de Panamá y las lecciones para RD
body: La respuesta favorable observada en parte de sus edificaciones es compatible con precisar qué permite demostrar esa observación y qué requiere todavía una evaluación específica. Tampoco debemos extender una apreciación favorable de la capital al conjunto de Panamá. Las consecuencias materiales y de funcionamiento también forman parte de la experiencia.
