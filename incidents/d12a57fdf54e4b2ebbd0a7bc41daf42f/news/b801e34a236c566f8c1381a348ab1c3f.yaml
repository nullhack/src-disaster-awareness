title: What is Known about Panama’s Coasts Such as Waters and Faults? 746 Aftershocks Following the Earthquake in Panama. - Newsroom Panama
body: Pictured below are residents and their dog, evicted from Isla Cañas in Panama as a result of the quake. What does the earthquake in Panama reveal? Néstor Luque, director of the Institute of Geosciences, explains what is happening underground, what the changes observed on the coasts and in the waters mean, and what scientists should investigate.
