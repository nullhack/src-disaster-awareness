title: 6.1 earthquake jolts southern Panama after Friday's destructive tremors - OrissaPOST
body: 'Panama City: A preliminary magnitude 6.1 earthquake hit southern Panama Monday evening, according to the US Geological Survey, but there were no immediate reports of casualties or property damage. The quake struck around 6:20 p.m. at a depth of 10 kilometers (6 miles) about 18 kilometers (11 miles) west of Rio Grande in the country’s […]'
