title: Two powerful earthquakes and multiple aftershocks rock Panama, prompting evacuations | Hot Springs Sentinel Record
body: PANAMA CITY — Two powerful 7.7 and 6.6 magnitude earthquakes and a series of aftershocks roiled southern Panama Friday afternoon, collapsing buildings near the epicenter and prompting evacuations across the country.
