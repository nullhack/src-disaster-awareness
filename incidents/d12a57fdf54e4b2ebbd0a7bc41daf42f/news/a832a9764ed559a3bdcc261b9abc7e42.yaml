title: Magnitude 7.6 earthquake tremors felt across Herrera Province, Panama, around 1:00 PM on October 9; tsunami warning in place. - SafeAbroad
body: The earthquake was centered six miles west-southwest of Pitaloza Arriba, at a depth of six miles, becoming the strongest to hit this part of Panama in over 35 years. Buildings shook as far away as Panama City and people have evacuated to the streets. The US Tsunami Warning Center has issued a warning across the Pacific coasts of Colombia, Costa Rica, Ecuador, El Salvador, Guatemala, Mexico, Panama, Peru, and Nicaragua.
