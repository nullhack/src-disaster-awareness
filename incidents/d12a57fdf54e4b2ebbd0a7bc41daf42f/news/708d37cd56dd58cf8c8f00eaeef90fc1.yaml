title: Tsunami threat after 7.7 magnitude earthquake shakes Panama, USGS reports
body: A powerful magnitude 7.7 earthquake struck Panama on Friday morning, shaking buildings as far away as the capital and prompting evacuations, according to the U.S. Geological Survey.
