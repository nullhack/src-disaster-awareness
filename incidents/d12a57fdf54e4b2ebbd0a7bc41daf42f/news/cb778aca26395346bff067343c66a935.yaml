title: Earthquakes rock southern Panama
body: PANAMA CITY (AP) — Two powerful 7.7 and 6.6 magnitude earthquakes and a series of aftershocks roiled southern Panama Friday afternoon, collapsing buildings near the epicenter and prompting evacuations across the country. The earlier quake, felt as far away as neighboring Colombia, was centered about 6 miles southwest of the remote community of Pitaloza Arriba, […]
