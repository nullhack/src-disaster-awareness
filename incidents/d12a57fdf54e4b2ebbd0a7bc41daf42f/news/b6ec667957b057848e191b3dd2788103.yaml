title: Panama's magnitude 7.7 quake was followed by a magnitude 6.6 shock hours later and a magnitude 6.1 three days later
body: Panama's strongest earthquake of the sequence struck at 17:56 UTC on October 9, 2026, which was 12:56 p.m. local time, and the U.S. Geological Survey rated it magnitude 7.7. Its epicenter was 12 km west-southwest of Pitaloza Arriba at a depth of about 12.
