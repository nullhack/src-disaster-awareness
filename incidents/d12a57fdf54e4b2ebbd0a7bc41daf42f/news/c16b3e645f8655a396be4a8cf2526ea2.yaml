title: Filipinos in Panama Safe After 7.7 Magnitude Earthquake, Confirms DFA
body: The DFA confirms all Filipinos in Panama are safe after a powerful 7.7 magnitude earthquake rocked the region, causing widespread damage and over 100 aftershocks. Authorities remain vigilant to ensure their safety.
