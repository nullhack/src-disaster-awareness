title: প্রকৃতির রুদ্ররূপ! ভুটানে হড়পা বান, ফিলিপিন্সে জেগে উঠল আগ্নেয়গিরি, পানামায় ভয়াবহ ভূমিকম্প
body: বিশ্বের তিন প্রান্তে প্রকৃতির তিন ভয়ংকর রূপ! কোথাও হিমবাহ হ্রদ ফেটে নেমে এল জলপ্রলয়, কোথাও জেগে উঠল আগ্নেয়গিরি, আবার কোথাও শক্তিশালী ভূমিকম্পে কেঁপে উঠল বিস্তীর্ণ এলাকা। ভুটান, ফিলিপিন্স ও পানামার এই তিন প্রাকৃতিক বিপর্যয় ঘিরে তৈরি হয়েছে উদ্বেগ।
