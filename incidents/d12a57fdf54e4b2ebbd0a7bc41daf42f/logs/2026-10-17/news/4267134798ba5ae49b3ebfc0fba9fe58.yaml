title: 'From earthquake to normalcy in three days: Tocumen Airport gives an operational assessment'
body: Between October 9 and 11, the airport carried out three terminal evacuations, 38 runway inspections and 12 taxiway inspections, with no damage detected. Copa Airlines restored its full schedule on Monday, October 12.
