log_date: '2026-10-10'
summary: |-
  Hours after the initial 7.7 earthquake, a 6.6 magnitude aftershock struck near Río Grande in Veraguas province, Panama, causing further alarm and additional building collapses near the epicenter. The tremor was part of a series of aftershocks that prompted continued evacuations and raised concerns about potential damage to vulnerable structures.
  A magnitude 6.6 aftershock struck near Río Grande, Panama at 20:25:39 UTC on October 9, about 14 km west of the town and just over 2.5 hours after the initial 7.7 earthquake. The temblor, the second major quake in a series, heightened anxieties and drove residents to sleep in the streets amid continuing aftershocks.
