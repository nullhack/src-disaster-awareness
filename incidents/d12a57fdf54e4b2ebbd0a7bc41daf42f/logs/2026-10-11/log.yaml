log_date: '2026-10-11'
summary: |-
  Panama declared a state of emergency as the country continued to be rattled by aftershocks from the 7.7 and 6.6 earthquakes, including the 6.6 event near Río Grande. Authorities reported at least 27 injuries and more than 400 damaged homes across the country. The United States mobilized search and rescue teams and supplied aircraft to assist in the response.
  A magnitude 5.8 aftershock rattled Panama as part of the continuing seismic sequence, with over 100 aftershocks recorded overall. The earthquakes led to the cancellation of a scheduled football match and prompted the deployment of a 10-member US urban search and rescue team from Fairfax County.
