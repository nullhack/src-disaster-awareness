log_date: '2026-10-11'
summary: Panama declared a state of emergency as the country continued to be rattled by aftershocks from the 7.7 and 6.6 earthquakes, including the 6.6 event near Río Grande. Authorities reported at least 27 injuries and more than 400 damaged homes across the country. The United States mobilized search and rescue teams and supplied aircraft to assist in the response.
