title: Panama declares a state of emergency as powerful quake aftershocks rattle communities | Texarkana Gazette
body: LA VILLA DE LOS SANTOS, Panama -- The government of Panama declared a state of emergency Saturday as the aftershocks of two powerful earthquakes that roiled the country shook communities for hours. Officials did not attribute any deaths to the quakes but reported damages in all 10 of Panama's provinces and two Indigenous territories.
