title: The United States Mobilizes Immediate Response to the Panama Earthquakes - United States Department of State
body: The Trump Administration has mobilized an immediate response to the 7.7 magnitude earthquake that struck Panama on October 9. The State Department deployed Urban Search and Rescue (USAR) technical teams to conduct expert structural assessments of damage and potential immediate assistance needs at the request of the Panamanian government. Department of War teams are assisting […]
