title: Major earthquake hits Panama
body: A powerful magnitude-7.7 earthquake struck central Panama, collapsing buildings and roads and injuring at least 27 people, although no deaths were reported. The shallow tremor triggered panic in Panama City, forced evacuations from skyscrapers and caused damage across several areas, including roads that President José Raúl Mulino described as completely collapsed. The US Geological Survey initially measured the quake at magnitude 8.0 before revising it to 7.7.
