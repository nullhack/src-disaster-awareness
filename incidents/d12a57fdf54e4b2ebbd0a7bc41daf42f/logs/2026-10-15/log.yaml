log_date: '2026-10-15'
summary: A magnitude 6.1 earthquake struck southern Panama on October 13, 2026, about 17–18 km west of Río Grande at a depth of 10–11 km, with no immediate reports of casualties or damage and no tsunami warning. President José Raúl Mulino reported that at least 6,174 people have been affected by the ongoing earthquake sequence, and a photo from Macaracas, Los Santos, showed a resident examining a damaged house on Oct. 13.
