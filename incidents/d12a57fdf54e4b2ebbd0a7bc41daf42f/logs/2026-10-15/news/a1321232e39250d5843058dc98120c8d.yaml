title: 6.1-magnitude earthquake jolts southern Panama after Friday's powerful tremors
body: The latest tremor came after two powerful earthquakes measuring magnitudes 7.7 and 6.6, along with a series of aftershocks, shook southern Panama on Friday afternoon (9 October).
