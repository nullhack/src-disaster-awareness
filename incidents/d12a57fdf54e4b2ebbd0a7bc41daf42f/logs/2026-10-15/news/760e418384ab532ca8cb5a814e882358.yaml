title: 6.1-Magnitude Earthquake Strikes Southern Panama
body: Panama City, October 13 (QNA) - آ An earthquake measuring 6.1 on the Richter scale struck southern Panama on Tuesday. The US Geological Survey said the earthquake occurred at a depth of 11 km, with its epicenter 17 km west of Rio Grande. No tsunami warnings have been issued as a result of the earthquake, and no reports of casualties or material damage have been received so far. This quake comes after three days of powerful earthquakes hitting Panama, one measuring 7.7 on the Richter scale, and resulting in injuries and material damages. (QNA)
