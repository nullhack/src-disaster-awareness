title: Magnitude 6 Earthquake Strikes Panama Days After Powerful 7.7 Tremor | Outlook India
body: A magnitude 6 earthquake struck Panama days after a 7.7 tremor, as authorities assessed damage to nearly 900 homes, reported 27 injuries and monitored hundreds of aftershocks.
