title: 6.1 quake jolts Panama after Friday’s powerful quake
body: A preliminary magnitude 6.1 earthquake struck southern Panama on Monday evening, days after powerful tremors damaged buildings and triggered evacuations across the country, with no immediate reports of casualties or property damage from the latest quake.
