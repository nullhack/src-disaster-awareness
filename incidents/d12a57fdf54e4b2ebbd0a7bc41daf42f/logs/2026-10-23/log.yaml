log_date: '2026-10-23'
summary: More than 100 churches in Panama were affected by the October 9 earthquake, with two reported as totally destroyed, according to a countrywide damage assessment by the Panamanian Bishops’ Conference. Adventist churches reported damage to nearly 10 churches, and ADRA with volunteers are assisting affected families. Panama's economic growth projections for 2026 remain unchanged despite the immediate negative impacts of the earthquake.
