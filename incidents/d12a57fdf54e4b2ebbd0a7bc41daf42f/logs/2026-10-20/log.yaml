log_date: '2026-10-20'
summary: Over 2,351 landslides caused by the Panama earthquake sequence have been identified using satellite imagery. The United States announced an additional $1 million in humanitarian assistance, bringing total U.S. aid to $6 million, and tsunami flooding left about 600 islanders displaced for a week. Additional relief efforts include contributions from the Church of Jesus Christ of Latter-day Saints and a coffee association fundraiser.
