log_date: '2026-10-09'
summary: A powerful magnitude 7.6–7.7 earthquake struck southern Panama on October 9, 2026, with its epicenter near Pitaloza Arriba in Herrera province. The quake triggered tsunami warnings for multiple countries across Central and South America, prompted evacuations and building shakes in Panama City, and caused some damage, though the Panama Canal was not affected. Initial USGS estimates of 8.0 were downgraded, and aftershocks were reported.
