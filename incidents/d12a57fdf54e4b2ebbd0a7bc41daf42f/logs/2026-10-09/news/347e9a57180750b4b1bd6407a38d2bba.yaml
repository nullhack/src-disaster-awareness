title: Earthquake hits Panama, prompts tsunami warnings
body: A magnitude 7.6 earthquake struck off Panama's southern coast on Friday, sending tremors through the capital and triggering tsunami warnings along parts of Central America's Pacific coastline.The US Geological Survey (USGS) downgraded the earthquake's magnitude from an initial estimate of 8.0 to 7.6...
