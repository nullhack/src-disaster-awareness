title: Mount Lewotobi Laki-laki Erupts Again Tonight (Saturday, 25 July 2026) | Pusat Data Ekonomi dan Bisnis Indonesia | Databoks
body: Mount Lewotobi Laki-laki erupted 25 July 2026 with 300m ash column. It is at Level 3 alert, 5km exclusion zone active. Indonesia recorded 3496 volcanic eruptions in 2026 to date.
