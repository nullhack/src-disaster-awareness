title: 'Cyclone Akvan Threatens Andhra Coast After Arnab And Murasu: Know The Meaning And Origin Of Its Name'
body: 'Cyclone Akvan Explained: A deep depression over the Bay of Bengal is expected to intensify into Cyclone Akvan, potentially affecting the Andhra Pradesh and South Odisha coasts by November 19. The third storm after Arnab and Murasu, Akvan gets its name from Persian mythology and was contributed by Iran.'
