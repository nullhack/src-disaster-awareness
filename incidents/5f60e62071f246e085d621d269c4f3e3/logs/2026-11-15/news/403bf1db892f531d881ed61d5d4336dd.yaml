title: Cyclone Akvan to make landfall in Andhra Pradesh? Depression over the Bay of Bengal to turn into cyclonic storm
body: A low-pressure system over the Bay of Bengal is projected to intensify into Cyclone Akvan by November 16, bringing heavy rainfall and strong winds to coastal regions including Odisha and Andhra Pradesh
