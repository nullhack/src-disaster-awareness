log_date: '2026-09-29'
summary: Selected reports track the Bay of Bengal deep depression as it approached and crossed the Andhra-Odisha coast near Kalingapatnam, with IMD warning of extremely heavy rain and winds up to 75 km/hr. Red alerts were issued for districts in Andhra Pradesh and Odisha, and schools were closed in parts of Odisha. IMD clarified that the system was a deep depression and was not expected to intensify into Cyclone Arnab, though intense rain and associated impacts were expected to persist.
