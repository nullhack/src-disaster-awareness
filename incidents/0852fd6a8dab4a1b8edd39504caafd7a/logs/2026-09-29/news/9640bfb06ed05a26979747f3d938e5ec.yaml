title: Is Cyclone ‘Arnab’ Approaching IMD Warns Of Heavy Rain As Deep Depression Nears Odisha-Andhra Coasts; Landfall Likely On Sep 24
body: The Indian Meteorological Department forecasts a deep depression in the Bay of Bengal, likely to intensify and cross the Andhra Pradesh-Odisha coasts by September 24.Heavy rainfall and strong winds are expected, leading to school closures in four Odisha districts and potential flooding in low-lying areas.
