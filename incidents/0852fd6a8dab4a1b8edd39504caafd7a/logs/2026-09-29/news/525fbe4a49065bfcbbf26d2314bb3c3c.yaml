title: Cyclone Arnab coming? Schools shut across Odisha; Andhra Pradesh on high alert as Bay of Bengal depression inches closer; heavy rain, 75 kmph winds likely
body: 'Cyclone Arnab: A depression over the Bay of Bengal is moving towards the north Andhra Pradesh-south Odisha coast, triggering school closures, evacuation preparations and a red alert in southern Odisha, even as questions swirl over whether the system will turn into Cyclone Arnab.'
