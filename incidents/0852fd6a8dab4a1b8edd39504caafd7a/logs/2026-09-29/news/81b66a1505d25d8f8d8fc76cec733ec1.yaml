title: 'Cyclone Arnab: Three states on alert as IMD warns of deep depression; Check latest landfall update, schools closed list'
body: The India Meteorological Department on Tuesday warned of a deep depression over the west-central and the northwest Bay of Bengal, as an advancing weather system is likely to intensify and cross the Andhra Pradesh-Odisha coast soon.
