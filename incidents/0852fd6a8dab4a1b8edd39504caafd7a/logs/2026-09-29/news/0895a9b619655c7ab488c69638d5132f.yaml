title: Deep depression in Bay of Bengal could bring extremely heavy rainfall in India, Nepal
body: A deep depression over the Bay of Bengal is set to make landfall near Kalingapatnam on September 23, bringing extremely heavy rain to northern Andhra Pradesh, southern Odisha, and later north-west India and Nepal. IMD forecasts winds up to 75 km/hr.
