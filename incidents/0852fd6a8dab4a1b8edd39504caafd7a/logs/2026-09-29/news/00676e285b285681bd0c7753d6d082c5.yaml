title: 'Cyclone Arnab threat: Which coastal states are on high alert as IMD warns of extremely heavy rain?'
body: Odisha and coastal Andhra Pradesh are bracing for intense rain and squally winds as a Bay of Bengal deep depression moves towards the coast. Officials clarified the system will not intensify into Cyclone Arnab.
