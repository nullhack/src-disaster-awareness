log_date: '2026-09-24'
summary: A weather system over the Bay of Bengal is set to make landfall between Andhra Pradesh and Odisha on September 22, 2026, with schools and liquor shops closed in Malkangiri. The Joint Typhoon Warning Center classifies it as Tropical Cyclone 01B, while the India Meteorological Department officially considers it a deep depression; social media erroneously named it "Cyclone Arnab". Red alerts and heavy rain warnings are in place for the affected areas.
