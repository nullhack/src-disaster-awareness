title: '''Arnab'' nears Odisha, Andhra coasts: Why October-November are India''s most active cyclone months- Moneycontrol.com'
body: The reason the bay turns volatile after the monsoon comes down to temperature and moisture. As IMD's own climatology shows, once the southwest monsoon withdraws, ocean heating in the Bay of Bengal rises, pushing up sea surface temperatures, while atmospheric moisture over the water also increases.
