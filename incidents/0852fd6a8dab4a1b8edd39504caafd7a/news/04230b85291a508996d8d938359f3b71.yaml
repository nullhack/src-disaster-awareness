title: Cyclone Arnab forming in Bay of Bengal? IMD warns deep depression to make landfall today, Odisha on alert
body: The deep depression is expected to cross the north Andhra Pradesh-south Odisha coast between Visakhapatnam and Gopalpur by the night of September 23, 2026, IMD said.
