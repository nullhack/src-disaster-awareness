title: 'Cyclone Arnab Latest: Deep Depression Over Bay of Bengal To Hit Andhra-Odisha Coast Tonight'
body: Cyclone Arnab, classified by IMD as a deep depression, was centred 70 km east-southeast of Kalingapatnam at 5:30 AM on September 23. Moving westwards at 12 kmph, it is expected to cross the north Andhra-south Odisha coasts near Kalingapatnam by tonight.
