title: Super El Nino could reshape daily life, threaten livelihoods in Southeast Asia
  with lingering heat
body: The chance of a “very strong” El Nino from next month to December is forecast
  to be 98 per cent now. CNA’s Insight looks at how living costs could rise and how
  ready the region is for the disruptions ahead.
