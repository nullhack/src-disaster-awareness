log_date: '2026-11-27'
summary: New coverage adds ecological and public-health angles to the strong El Niño forecast, with one report noting that near-record conditions create the warmth and moisture fungi need, potentially fuelling a poisonous mushroom surge. A separate analysis argues El Niño provides lead time — but not certainty — for dengue early warning in South Asia, since monsoons, local geography, urban habits and immunity all shape how the ocean pattern translates into outbreaks.
