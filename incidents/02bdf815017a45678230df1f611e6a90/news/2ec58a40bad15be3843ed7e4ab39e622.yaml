title: Fear grips children after deadly earthquake in eastern Indonesia leaves thousands displaced
body: LAMBA LEDA, Indonesia (AP) — Thousands of people remained displaced on the Indonesian island of Flores on Tuesday, three days after a powerful earthquake killed at least 70 people, injured nearly 1,200 others and damaged thousands of homes. The disaster left many children struggling with fear and trauma. More than 40,000 people were sheltering in […]
