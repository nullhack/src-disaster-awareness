log_date: '2026-10-05'
summary: The UK Green Party formally adopted a policy defining Zionism as racism, prompting Israel to condemn the move and bar a party member from entering the country. Tensions between Ireland and Israel escalated during Nations League matches, with Irish players wearing black armbands and bowing their heads during the Israeli anthem, followed by a second match marred by spitting allegations. Meanwhile, a US judge ruled to deport Palestinian rights advocate Salah Sarsour under a cold-war era law, and commentary discussed the Philippine walkout at the UN.
