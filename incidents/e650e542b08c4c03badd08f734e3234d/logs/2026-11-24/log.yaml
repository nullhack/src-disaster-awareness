log_date: '2026-11-24'
summary: Oxfam, unable to enter Gaza, said it used satellite images, remote sensing, and geolocated incident databases to charge that Israeli military action has turned Gaza into a “toxic wasteland.” At DFF, the creative team behind “Life Support” discussed documenting Gaza’s collapsing healthcare system. Separately, Iran ruled out talks with the U.S. until seven conditions are met, citing sanctions and blockades amid regional clashes and Gaza casualties.
