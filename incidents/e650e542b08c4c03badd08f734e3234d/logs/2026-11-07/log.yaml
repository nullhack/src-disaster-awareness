log_date: '2026-11-07'
summary: New reports indicate Gaza is buried under an estimated 68 million tonnes of rubble from Israeli strikes. Birmingham City Council passed a motion to review its financial ties with Israel, and Providence, Rhode Island voted to divest from companies linked to the conflict. Israel's Arab-led parties are now key in post-election coalition talks, while newly elected US lawmakers challenged the Israeli ambassador over arrests. Rapper Macklemore's "Free Palestine" tour continues to face venue denials.
