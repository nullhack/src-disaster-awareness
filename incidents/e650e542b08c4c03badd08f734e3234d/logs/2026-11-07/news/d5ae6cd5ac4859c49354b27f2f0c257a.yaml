title: Brazil weighs terrorist designation of 17 groups amid concerns over solidarity with Palestine
body: Brazil is facing a sensitive legislative debate over a proposal to designate 17 political and armed organizations associated with several Arab countries as terrorist groups, a move that could have far-reaching political, diplomatic and human rights implications.
