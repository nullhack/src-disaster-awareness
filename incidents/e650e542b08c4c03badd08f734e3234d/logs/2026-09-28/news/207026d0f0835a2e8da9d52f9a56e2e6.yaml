title: 'The fight against terrorism and antisemitism: Sept. 24, 2026'
body: The Murray Galinson San Diego-Israel initiative (MGSDII) and the Joan B. Kroc School for Peace Studies will collaborate in bringing two Hebrew University faculty members — a Palestinian and a Jew — to the University of San Diego campus to jointly teach a course in conflict resolution.
