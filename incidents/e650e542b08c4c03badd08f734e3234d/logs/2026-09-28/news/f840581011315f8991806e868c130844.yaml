title: Palestine test for UN ‘resilience’, says Indonesia - Middle East and Africa - The Jakarta Post
body: Indonesia has put Palestine at the center of its call for better multilateralism, saying the crisis in Gaza will test whether the United Nations can uphold the principles it was created to defend and deliver when it matters most.
