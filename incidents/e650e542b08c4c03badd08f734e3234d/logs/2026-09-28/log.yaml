summary: Hamas accused Israel of war crimes against Palestinian journalists, as Gaza’s food crisis deepened with residents relying on communal ovens to bake bread. Diplomatic responses included Indonesia calling the Palestine crisis a test for UN resilience and the Vatican reiterating support for a two-state solution. In the US, charges were dropped against Stanford students who protested the Gaza war, while a new boycott campaign targeted Ralph Lauren for promoting an Israeli actress.
