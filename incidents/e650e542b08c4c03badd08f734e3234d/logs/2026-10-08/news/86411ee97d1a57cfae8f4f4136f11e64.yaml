title: NYC Mayor Mamdani slammed over Oct. 7 massacre statement invoking Israeli ‘genocide’ in Gaza
body: Mamdani’s criticism of Israel in a statement about the Oct. 7 massacre sparked an angry response from the Anti-Defamation League while pro-Palestinian protesters also took aim at the mayor.
