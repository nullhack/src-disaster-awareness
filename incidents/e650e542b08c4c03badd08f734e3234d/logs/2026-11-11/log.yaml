log_date: '2026-11-11'
summary: An Israeli airstrike killed Mahmoud Abdel-Malek, a 20-year-old Gaza goalkeeper, days after he played in a cup for slain athletes. Separately, a Palestinian American activist was refused entry to the UK for his charity's Gaza fundraiser, and pro-Palestine protesters confronted Joe Biden with milk in Ireland. Former Israeli Prime Minister Naftali Bennett also heckled caretaker PM Netanyahu during a Knesset session.
