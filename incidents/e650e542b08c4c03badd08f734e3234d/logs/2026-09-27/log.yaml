log_date: '2026-09-27'
summary: |-
  New reports indicate Israeli settlers are intensifying efforts to divert natural springs and take over heritage sites in the occupied West Bank. Disabled and amputee children in Gaza remain unable to obtain wheelchairs as Israel continues to block their entry. Meanwhile, Ireland’s soccer team voted to proceed with Nations League matches against Israel despite widespread pressure to boycott over the conflict in Gaza.
  Gaza's reported death toll has surpassed 74,000 amid ongoing Israeli strikes, highlighting the continued humanitarian toll. Israeli Finance Minister Smotrich called for "war" in the West Bank, drawing concern from analysts, while the Philippines joined a walkout during Netanyahu's UN speech. Separately, Israel's judiciary deferred the bidding deadline for a major West Bank settlement project, a procedural shift in the settlement expansion agenda.
