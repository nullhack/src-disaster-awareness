title: ‘Artists Against Oppression’ discusses themes of oppression, brings together students and outside guests
body: Student Diversity and Inclusion partnered with Students for Justice in Palestine, Muslim Student Association and Student Organization Council for the opening night exhibit of “Artists Against Oppression,” an exhibit dedicated to “reflecting on experiences and observations of oppression.” Over 30 registered attendees gathered on the second floor of the Student Center on April 19 for...
