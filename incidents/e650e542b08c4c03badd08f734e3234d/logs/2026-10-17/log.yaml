log_date: '2026-10-17'
summary: Gaza faces catastrophic malnutrition and food shortages as Israel halts the entry of commercial goods. In the West Bank, Israeli settlers torched cars and olive groves and beat a Washington Post photojournalist during harvest-season attacks. Diplomatically, China called on Israel to stop settlement construction, the UK expanded sanctions against companies supporting settlements, and Pakistan with 18 other nations condemned Colombia's recent embassy opening in Jerusalem.
