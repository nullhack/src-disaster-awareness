title: Arab-led parties could decide the Israeli election, if anyone would partner with them
body: Prime Minister Benjamin Netanyahu and his chief rivals have said they won't form a coalition with any Arab-led party after the Oct. 27 election – even if that means months of gridlock and another round of voting.
