log_date: '2026-11-14'
summary: An Israeli airstrike on Nasser Medical Complex in Khan Younis killed six people, including a surgeon and a 13-year-old child, and wounded at least 27. A six-year-old Gaza burn victim is caught in a dispute over aid access, reflecting the ongoing humanitarian crisis. Separately, the UK has been accused of silencing pro-Palestine voices by refusing entry to a Palestinian American activist for a Gaza fundraiser.
