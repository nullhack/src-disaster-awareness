title: 'What we owe our neighbors: Vote no on Providence Ballot Question 7 - The Boston Globe'
body: A one-sided municipal verdict on a complex foreign conflict can give new force to those already targeting Jews locally. We can hold fast to our convictions and still ask whether this measure will do more harm than good, three Providence rabbis say.
