log_date: '2026-10-24'
summary: On October 23, 2026, a shooting near Hebron in the occupied West Bank killed two Israeli soldiers and two Palestinian gunmen, prompting Israeli Prime Minister Netanyahu to order a full lockdown of the city and evacuation of a neighborhood. Separately, Colombia is assisting Gaza in training teams to search for more than 10,000 missing persons, a humanitarian initiative amid the ongoing conflict.
