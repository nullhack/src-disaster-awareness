log_date: '2026-10-24'
summary: |-
  On October 23, 2026, a shooting near Hebron in the occupied West Bank killed two Israeli soldiers and two Palestinian gunmen, prompting Israeli Prime Minister Netanyahu to order a full lockdown of the city and evacuation of a neighborhood. Separately, Colombia is assisting Gaza in training teams to search for more than 10,000 missing persons, a humanitarian initiative amid the ongoing conflict.
  Settler attacks on Palestinian olive harvesters in the West Bank continue, with Yesh Din recording 640 incidents over 24 days, while American Jewish volunteers are traveling to assist despite deportation risks. Meanwhile, displaced West Bank Palestinians face worsening hunger after the World Food Programme cut food aid by half.
