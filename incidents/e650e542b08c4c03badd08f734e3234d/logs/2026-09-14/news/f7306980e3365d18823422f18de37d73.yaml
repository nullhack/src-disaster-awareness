title: Oil takes the long way round as war reshapes global shipping
body: The Middle East’s oil map is being rewritten at sea, as attacks around the Strait of Hormuz and Red Sea push exporters towards pipelines, alternative ports and longer tanker routes that were once treated largely as back-up options. The problem is that some of those escape routes are now coming under pressure too. Saudi…
