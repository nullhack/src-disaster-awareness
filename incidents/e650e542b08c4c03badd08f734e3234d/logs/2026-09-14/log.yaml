log_date: '2026-09-14'
summary: On September 13, Israeli forces raided the Jenin home of Palestinian journalist Ali al-Samoudi and beat his son, while a low-flying Israeli quadcopter terrorized residents in eastern Gaza City. Israeli forces also killed a pregnant Palestinian woman in Gaza, and settler pogroms intensified across the occupied West Bank. Meanwhile, a pro-Palestine protest in Sydney demanded Australia increase pressure on Israel.
