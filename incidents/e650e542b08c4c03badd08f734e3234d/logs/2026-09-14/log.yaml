log_date: '2026-09-14'
summary: |-
  On September 13, Israeli forces raided the Jenin home of Palestinian journalist Ali al-Samoudi and beat his son, while a low-flying Israeli quadcopter terrorized residents in eastern Gaza City. Israeli forces also killed a pregnant Palestinian woman in Gaza, and settler pogroms intensified across the occupied West Bank. Meanwhile, a pro-Palestine protest in Sydney demanded Australia increase pressure on Israel.
  New reports from Israeli human rights group B'Tselem detail five mechanisms Israel uses to systematically dismantle Palestinian collective life in the West Bank, including settlement expansion, displacement, and curbs. Meanwhile, an Al Jazeera video reports on the ongoing erosion of Palestinian life and notes that Israel has threatened the directors of the documentary "NAZA," which documents AI-enabled targeting of Palestinians in Gaza.
