log_date: '2026-11-06'
summary: A former IDF spokesperson's unit staffer accused the Israeli army of manipulating Gaza war messaging and labeling innocent Palestinians as terrorists. A report recorded 760 environmental violations by Israeli forces and settlers in the occupied West Bank during 2026, while Gaza's conflict has spawned a shadow economy with parallel markets. Polls indicate eroding US support for Israel after the election, and an artwork naming over 18,000 children killed in Gaza was displayed in Australia after being rejected by a local council.
