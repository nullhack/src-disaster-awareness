log_date: '2026-10-09'
summary: Navi Pillay, the UN jurist who headed the commission that declared Israel’s actions in Gaza constituted genocide, was awarded the 2026 Nobel Peace Prize, drawing global attention to international legal scrutiny of the conflict. Separately, the Trump administration sanctioned the International Criminal Court, sparking rebukes from allies, and a Guardian analysis highlighted the EU’s failure to respond to mounting public criticism of Israel. These developments add new dimensions to the diplomatic and legal landscape surrounding the conflict.
