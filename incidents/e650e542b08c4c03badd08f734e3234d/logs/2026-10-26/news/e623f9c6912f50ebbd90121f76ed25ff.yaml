title: President Herzog receives credentials of five new ambassadors to Israel day before elections
body: The list includes Maj.-Gen. Emmanuel Bayingana of Rwanda, Christophe Parisot of France, Arad Benko of Austria, Stella Ronner Grubacic of the Netherlands, and Evelyn Korantemaa Ofosu-Amable of Ghana.
