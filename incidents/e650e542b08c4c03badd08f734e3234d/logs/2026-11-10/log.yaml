log_date: '2026-11-10'
summary: Israeli forces killed a 14-year-old Palestinian boy in the West Bank and withheld his body, while an IDF strike on a tent near a school in eastern Gaza City killed one and wounded several. The UN reports over 2,060 settler attacks across the occupied West Bank this year, and Formula 1 champion Lewis Hamilton visited Egypt to support Gaza humanitarian aid facilities. Meanwhile, more than half a million students in Gaza have returned to school, with a partnership helping them pursue college degrees after years of war and displacement.
