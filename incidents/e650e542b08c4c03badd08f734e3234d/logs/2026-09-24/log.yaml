log_date: '2026-09-24'
summary: A French-led initiative to recognize Palestine continues to be discussed, with the Palestinian ambassador emphasizing its importance. Meanwhile, a $2.8 billion US-Israel arms deal faces new accusations of complicity in Gaza, and the Board of Peace announces a $2.4 billion Gaza reconstruction plan amid reports that Israel killed seven Palestinians. Additionally, Tanzania called for global financial and UN reforms while reaffirming support for a two-state solution.
