log_date: '2026-10-21'
summary: |-
  Israeli Prime Minister Netanyahu unveiled a new security doctrine calling for pre-emptive strikes and increased military spending. Separately, Israeli fire killed at least four Palestinians in Gaza, including a married couple and a 17-year-old.
  Israeli forces detained 90 volunteers, including US congressional candidate Brad Lander, while they helped Palestinian farmers harvest olives in the West Bank; Lander was freed but says dozens remain in custody. New polls reveal growing frustration with Hamas and Hezbollah among Palestinians and Lebanese, suggesting an opening for diplomacy. Additionally, Amnesty International criticized UK universities for their handling of pro-Gaza protests.
