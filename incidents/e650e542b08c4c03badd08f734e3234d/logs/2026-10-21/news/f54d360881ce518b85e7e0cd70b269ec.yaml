title: '2026 Israeli elections: What you need to know'
body: (JTA) — On Oct. 27, Israelis will cast their votes in a process that will determine who is prime minister and who sits in the 120-seat parliament, the Knesset. Since the country's founding in 1948, there have been 14 prime ministers and 25 parliaments.
