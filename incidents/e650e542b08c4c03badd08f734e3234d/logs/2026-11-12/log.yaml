log_date: '2026-11-12'
summary: |-
  At the COP31 climate summit, Turkey's President Recep Tayyip Erdogan labeled the conflict in Gaza an "ecocide," prompting a sharp response from Israel. Formula 1 champion Lewis Hamilton visited the Egypt-Gaza border, calling on Israel to open the Rafah crossing amid worsening humanitarian conditions. Separately, Iran's IRGC chief pledged to advance missile production, while Israel killed six people in a Gaza hospital and ordered its military to step up preparations for a possible attack on Iran; concurrently, new UN war crimes findings could lead to legal challenges against US military aid to Israel.
  Gaza families face worsening winter conditions, with flooded tents and high prices making it difficult to keep children warm. France turned away an Israeli settler leader at a border crossing, adding a new diplomatic dimension to the conflict.
