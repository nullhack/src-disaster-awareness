title: University of Toronto rejects report on anti-Muslim and anti-Arab discrimination | WTX News
body: The University of Toronto has rejected a report from its Muslim, Arab, and Palestinian discrimination working group, citing significant departures from previous equity assessments. The report called for extensive recommendations to address perceived discrimination and policing issues on campus, including considerations of exceptions based on international conflicts.
