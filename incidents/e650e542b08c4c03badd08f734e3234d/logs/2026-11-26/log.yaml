log_date: '2026-11-26'
summary: Gaza is reporting a surge in meningitis cases as overcrowding and damaged sanitation put children at risk. Gaza's municipalities warned that winter rains threaten around 1,000 shelter sites, with some 200,000 tents needing replacement, as the EU urged Israel to reopen all crossings. Separately, dozens of Palestinian prisoners from Gaza remain in Israeli custody despite having completed their sentences, under provisions permitting detention without conviction.
