log_date: '2026-09-29'
summary: Satellite imagery shows Israel has built new outposts and is slowly encroaching beyond the Gaza cease-fire withdrawal line. Israeli National Security Minister Ben-Gvir led hundreds of settlers in a storming of the Al-Aqsa Mosque compound, declaring “we are the owners of the place.” Meanwhile, the IDF confirmed a strike killed the man filmed driving the motorcycle that abducted Noa Argamani on October 7, and new West Bank road closures are forcing Palestinians to endure long detours and delaying medical care.
