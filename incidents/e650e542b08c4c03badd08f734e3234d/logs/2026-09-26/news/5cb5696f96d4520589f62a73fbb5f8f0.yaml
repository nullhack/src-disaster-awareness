title: HER MAJESTY QUEEN RANIA AL ABDULLAH OF JORDAN OPENS HIGH LEVEL DIALOGUE ON PALESTINIAN CHILDREN IN MILITARY DETENTION WITH THE TAOISEACH, PALESTINIAN AND OTHER WORLD REPRESENTATIVES AT THE UN
body: The High-Level Dialogue on Palestinian Children in Military Detention, convened by Save the Children and co-sponsored by the governments of Jordan, Ireland, the State of Palestine, Spain, and South Africa, focused on the escalating risks facing Palestinian children who are arrested, detained and prosecuted under Israeli military law, and on the concrete steps governments can take to protect their rights.
