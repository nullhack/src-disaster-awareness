title: Australias prime minister calls for stronger international action on Palestine and Iran at UN
body: Australian Prime Minister Anthony Albanese called for stronger international action on Palestine, Iran, and AI risks at the UN General Assembly, emphasizing the strain on the multilateral system and opposing illegal Israeli settlements and Hamass role in Palestine.
