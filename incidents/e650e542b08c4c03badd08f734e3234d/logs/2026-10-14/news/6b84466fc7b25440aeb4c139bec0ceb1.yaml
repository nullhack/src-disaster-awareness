title: Students rally in solidarity with Palestine, rebuke GW’s ties to Israel in Oct. 7 demonstration
body: On the third anniversary of Hamas' Oct. 7, 2023, attack on Israel and the beginning of the war in Gaza, more than 150 student protesters marched to University Yard and University President Ellen Granberg's house to voice their opposition to GW's ties to Israel.
