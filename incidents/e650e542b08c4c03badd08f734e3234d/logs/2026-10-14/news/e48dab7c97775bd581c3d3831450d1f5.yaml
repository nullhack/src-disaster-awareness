title: Netanyahu warns Palestinians against attacks ahead of Israeli election
body: During a West Bank visit, Israeli Prime Minister Benjamin Netanyahu warned Palestinians against attacks, amidst heightened campaign tensions ahead of Israels parliamentary elections, while stressing readiness for all scenarios and the possibility of Palestinian Authority security forces hostility.
