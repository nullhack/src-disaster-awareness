title: The Israeli witch hunt of Sami Abu Shehadeh exposes the lie of the ‘Jewish and democratic’ state
body: The Supreme Court’s decision to force Palestinian politician Sami Abu Shehadeh out of the upcoming Israeli elections is the latest sign that there is no place for Palestinian citizens of Israel in the ‘Jewish and democratic’ state.
