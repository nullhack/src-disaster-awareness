log_date: '2026-10-14'
summary: On October 13-14, 2026, Colombia opened an embassy in Jerusalem, becoming the 10th country to do so, while the UK and Israel appeared to reach a tense truce in their diplomatic feud over settlements. Concurrently, Israeli settlers set fire to a mosque in the West Bank and Israeli forces raided villages, a hospital, and NGOs, killing one Palestinian in Gaza and wounding journalists. Netanyahu warned of Palestinian attacks ahead of elections and vowed that displaced residents of a refugee camp would not return, as the UN demanded Israel take stronger action against settler violence.
