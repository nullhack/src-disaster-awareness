log_date: '2026-09-09'
summary: The UK, France, and Canada jointly announced a ban on imports from Israeli settlements in the occupied West Bank, prompting Israel to retaliate by closing the British Consulate in Jerusalem, barring 12 British nationals, and ending British involvement in Gaza operations. Israeli Foreign Minister Sa'ar accused London of election interference as 12 Western states moved jointly against settlement trade, escalating the diplomatic rift.
