title: 'BRICS can build supply-chain safety net amid West Asia crisis: BJP MP Vikramjit Sahney'
body: Vikramjit Singh Sahney said BRICS should help protect trade and essential supplies amid the West Asia crisis. He said the grouping must push dialogue, local currency trade and alternative corridors as disruptions deepen.
