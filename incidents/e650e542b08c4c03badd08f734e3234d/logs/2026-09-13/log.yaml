log_date: '2026-09-13'
summary: |-
  At the BRICS summit in New Delhi, leaders reaffirmed Palestinian rights and backed a two-state solution. Former Israeli Prime Minister Naftali Bennett publicly attacked the documentary "NAZA" following its 25-minute standing ovation at the Venice film festival.
  At the BRICS summit in New Delhi, leaders adopted the New Delhi Declaration 2026 calling for a ceasefire in Gaza, an end to forced displacement of Palestinians, humanitarian access, and support for Palestine's UN membership. Chinese President Xi Jinping urged BRICS nations to play a greater role in Middle East peace. An opinion piece argued for Palestinian leadership accountability.
