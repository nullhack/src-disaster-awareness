log_date: '2026-09-04'
summary: On September 3, 2026, two Palestinian teens were killed in the occupied West Bank as Israeli settlers and snipers surrounded a village. Israeli forces bulldozed olive trees in the West Bank, while Prime Minister Netanyahu signaled plans to expand Israeli control over Gaza and the defence minister stated Israel still wants to remove Palestinians from Gaza. Additionally, a Gaza doctor continues to suffer torture in Israeli prison, and broader regional tensions escalated with Iranian missile and drone attacks targeting Kuwait.
