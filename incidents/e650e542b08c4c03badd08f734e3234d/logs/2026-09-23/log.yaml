log_date: '2026-09-23'
summary: A UN report alleges the Gaza war worsened sexual violence risks for Palestinian women, with the UNFPA concluding Israel's military response led to women being subjected to violence by family members and others. Palestinian Americans met with lawmakers from 26 states to demand a US policy shift as President Trump seeks $2.8bn in military aid for Israel. Meanwhile, Jordan's King Abdullah II stated the world chose to manage rather than resolve the conflict, accusing Israel of pursuing a policy of forced displacement through settlement expansion and violence. New reporting also details ongoing violent disruptions from olive groves to Al-Aqsa Mosque.
