title: 'In their words: Israeli forces describe AI-backed Gaza killing in new film'
body: A new documentary from two Oscar-winning Israeli filmmakers provides damning new testimony about AI-enabled mass killings in Gaza from the men and women who took part, the directors told AFP on Thursday ahead of its premiere in Venice. Yuval Abraham and Rachel Szor said they had collected evidence from 24 different Israeli military or intelligence figures who agreed to testify on camera in Tel Aviv as long as their identities were protected. "We are letting the soldiers and the officers speak about what they did," Abraham told AFP.
