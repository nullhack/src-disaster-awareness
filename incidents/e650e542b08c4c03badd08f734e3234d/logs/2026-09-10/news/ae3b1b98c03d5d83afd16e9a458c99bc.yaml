title: Israel tells British consulate in East Jerusalem to close within 30 days - Middle East and Africa - The Jakarta Post
body: British representatives assigned to a US-led Gaza coordination mission in Israel, as well as British diplomats based in Ramallah, must leave within seven days, the two sources said.
