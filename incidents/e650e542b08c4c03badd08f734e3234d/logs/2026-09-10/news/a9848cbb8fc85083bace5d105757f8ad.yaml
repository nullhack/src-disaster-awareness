title: Israeli-made film about Gaza civilian deaths to debut in Venice
body: A new documentary from two Oscar-winning Israeli filmmakers that promises to shed light on Israel's killing of civilians in Gaza is set to premiere at the Venice Film Festival on Thursday. "NAZA" by Yuval Abraham and Rachel Szor promises fresh revelations about the bombing of Gaza based on testimony from Israeli forces. "Shot at night on the rooftops of Tel Aviv, the film reveals in detail the systems behind Israel's calculated mass killing of Palestinian civilians in Gaza," the pair said when they announced the film in August.
