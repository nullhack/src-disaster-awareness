log_date: '2026-10-30'
summary: |-
  Israel renewed a ban on the Al-Aqsa Mosque imam and tightened control over the holy site, further restricting Palestinian access. Meanwhile, an Israeli actress was caught on a hot mic criticizing the occupation, and a new book seeks to preserve Palestinian narratives.
  An attack on the Halawa displacement camp in Jabalia killed a Palestinian, and Israeli forces demolished the homes of two Palestinians accused of killing soldiers in Hebron. The Israeli election ended in a deadlock, leaving Netanyahu without a majority and prompting coalition talks that could involve Palestinian Arab parties, who showed historic voter turnout. Travel warnings for 16 countries reflect ongoing regional escalations, while gaming companies joined BDS boycotts in solidarity.
