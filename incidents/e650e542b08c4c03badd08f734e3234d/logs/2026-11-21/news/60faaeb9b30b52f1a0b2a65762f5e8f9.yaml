title: In memoir, Biden defends record on Gaza, laments failed Saudi-Israel normalization
body: The former US president said Israeli Prime Minister Benjamin Netanyahu went “too far” in Gaza, and sought to explain his relations with Saudi Crown Prince Mohammed bin Salman, despite promises of accountability over Jamal Khashoggi's murder.
