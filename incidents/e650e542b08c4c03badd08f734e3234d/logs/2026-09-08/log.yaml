log_date: '2026-09-08'
summary: |-
  Selected reporting shows continued Israeli-Palestinian escalation: Israeli ministers are pushing proposals to depopulate Gaza, while West Bank demolitions and Palestinian deaths continue. Israel also deported a British activist who had protected Palestinian children after he was kidnapped by settlers, Germany argued at the ICJ that Nicaragua’s Gaza genocide case should be thrown out, and Finland said it will stop UNRWA funding by the end of 2026.
  On September 8, 2026, the UK formally accused Israeli settlers of "ethnic cleansing" in the West Bank and announced a ban on goods from Israeli settlements, with France and Canada joining the measures. In retaliation, Israel announced the closure of the British Consulate General in Jerusalem and ended British involvement in Gaza operations, sharply escalating diplomatic tensions over settlement policies.
