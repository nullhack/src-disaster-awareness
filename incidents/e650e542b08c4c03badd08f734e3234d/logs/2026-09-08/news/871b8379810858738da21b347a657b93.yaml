title: Jaishankar highlights welfare of Indian diaspora during Consultative Committee meeting on India-West Asia ties
body: External Affairs Minister S Jaishankar on Monday chaired a Consultative Committee meeting on Indias relations with West Asia, emphasising New Delhi's commitment to safeguarding national interests and ensuring the welfare of millions of Indian expatriates amid escalating regional conflict.
