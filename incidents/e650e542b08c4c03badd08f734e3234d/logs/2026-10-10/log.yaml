log_date: '2026-10-10'
summary: |-
  European left-wing parties are hardening their positions against Israel amid public outrage over its war of annihilation, while a US charity plans to use AI to monitor Gaza classrooms for hate speech. Israel's tech-driven economy prospers despite the war, but rising food costs worry voters, and Trump's board of peace faces internal conflicts over its Gaza reconstruction pledge. Macklemore was dropped from Ed Sheeran's tour after his "Free Palestine" remarks, and a Canadian energy company linked to Israeli settlements faces scrutiny as a province promises to ban trade with settlements.
  On October 10, Israeli forces killed eight Palestinians in Gaza, including a child, on the anniversary of the ceasefire; the death toll since the ceasefire has surpassed 1,480. Separately, the UK has been accused of giving false hope over its refugee safe route for Palestinians, and new reports reveal that five members of Trump’s Board of Peace are linked to an Israeli arms company that secured a $150m US military contract.
