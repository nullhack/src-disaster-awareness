title: Government accused of planning major crackdown on pro-Palestine expression in schools
body: FacebookLikeShareTweetEmail The government is facing accusations of paving the way for a sweeping crackdown on pro-Palestinian expression in English schools and colleges after accepting 27 recommendations on antisemitism, including controversial measures covering political speech, teacher conduct, safeguarding and the Prevent programme. The proposals, published on Wednesday following an independent review by Sir David Bell, have […]
