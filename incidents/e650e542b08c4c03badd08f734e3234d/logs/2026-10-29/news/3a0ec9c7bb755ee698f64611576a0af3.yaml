title: 'Benjamin Netanyahu: Israel''s longest-serving PM fights to survive'
body: Prime Minister Benjamin Netanyahu, Israel's consummate political survivor, is scrambling for options to hold on to power after hard-fought elections delivered no clear winner. Voters on Tuesday cast their ballots in numbers not seen in decades, in a pivotal vote seen by many as a referendum on Netanyahu, who has governed Israel on-and-off for more than 19 years.
