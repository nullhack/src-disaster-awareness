title: How the New York Times’ Framing Shaped the Story of the Israel-Hamas War
body: In a new study, Professor Edieal Pinker argues that the Times’ coverage created a narrative in which Israel was the primary actor and Hamas’s continuing role in the conflict received relatively little attention.
