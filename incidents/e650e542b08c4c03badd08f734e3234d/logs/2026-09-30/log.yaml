summary: |-
  The US Senate blocked a resolution seeking a report on Americans killed in the West Bank, with the resolution citing Israel's lack of accountability and the US's inability to secure justice. Other selected items were commentary or analysis rather than direct conflict updates.
  The U.S. Senate blocked a measure that would have required a report on increasing violence in the West Bank, including deaths of Americans. New satellite images reveal further destruction in Gaza, as the conflict's toll continues. A Flydubai flight to Tel Aviv was diverted after a stabbing, with Israeli officials calling it an act of terror, while Israeli attacks on Gaza killed at least seven people amid ongoing ceasefire violations.
