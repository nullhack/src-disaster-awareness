log_date: '2026-10-27'
summary: Netanyahu pushed for a pre-election strike on Iran but was resisted by the military chief. A UN-sponsored probe accuses Israel of ongoing genocide in Gaza and crimes against humanity in the West Bank, including torture and forced displacement. Israel forcibly ejected a 95-year-old Palestinian grandfather from Hebron, prompting demands for expulsion of its ambassador to New Zealand, while the Makkah Alliance and Iran agreed to sustain regional peace talks.
