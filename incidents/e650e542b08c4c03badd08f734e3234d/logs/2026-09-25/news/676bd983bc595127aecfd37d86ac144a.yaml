title: Priests Carry Names of Children Killed in Gaza and Lebanon Through Rome, Urging a Return to Diplomacy - ZENIT - English
body: The shroud, they said, commemorated children killed in the months after ceasefires were announced in Gaza and Lebanon. The network reported that more than 300 children had died in Gaza since October 2025 and around 150 in Lebanon over the previous five months.
