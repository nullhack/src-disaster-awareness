log_date: '2026-09-25'
summary: |-
  At the UN General Assembly, Israeli Prime Minister Netanyahu rejected genocide accusations as the "biggest lie of the century" and defended military operations, leading dozens of delegates to walk out. Outside the UN, celebrities including Susan Sarandon and Hannah Einbinder were arrested during protests against Netanyahu's appearance. Separately, Macklemore announced a "Free Palestine" fundraising tour after being dropped from Ed Sheeran's tour.
  The ICRC warned that access to war zones is shrinking and Palestinian detainees remain out of reach due to new technologies. Priests carried names of children killed in Gaza and Lebanon through Rome, urging a return to diplomacy, noting over 300 children have died in Gaza since October 2025. Qatar pledged continued humanitarian support for Palestinian children, while Iran's diplomat called on Europe to confront US aggression and end Zionist impunity in meetings on the sidelines of the UN General Assembly.
