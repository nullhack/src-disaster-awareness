log_date: '2026-09-25'
summary: At the UN General Assembly, Israeli Prime Minister Netanyahu rejected genocide accusations as the "biggest lie of the century" and defended military operations, leading dozens of delegates to walk out. Outside the UN, celebrities including Susan Sarandon and Hannah Einbinder were arrested during protests against Netanyahu's appearance. Separately, Macklemore announced a "Free Palestine" fundraising tour after being dropped from Ed Sheeran's tour.
