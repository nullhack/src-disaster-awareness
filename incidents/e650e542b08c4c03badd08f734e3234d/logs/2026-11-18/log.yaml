log_date: '2026-11-18'
summary: Australia imposed sanctions on three Israeli individuals and four organizations over illegal settlement expansion, while the UK sanctioned eight Israeli construction firms and a settler group, the latter also cited for blocking Gaza aid, with the foreign secretary framing the moves as protecting the two-state solution. Separately, a 72-year-old Palestinian woman was shot dead in Jericho in an alleged Israeli settler attack amid rising violence and disputes over Palestinian homes.
