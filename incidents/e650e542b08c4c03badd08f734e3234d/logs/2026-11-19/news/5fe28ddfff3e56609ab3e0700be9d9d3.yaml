title: 'Palestinians killed, hospitals shelled: How Deutsche Bank arms Israel'
body: From the killing of Hind Rajab to the siege of Gaza’s Al Shifa Hospital to shelling in aid camps, the IDF's deadly Merkava 4 – the mainstay of Israel’s tank fleet – have been involved. Yet, global giant Deutsche Bank bankrolled German defence manufacturer Renk GmbH's contract with Israel to supply gearboxes for the Merkava 4 until 2027.
