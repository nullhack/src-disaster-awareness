summary: Reports say Israeli forces launched a fresh ground operation in central Gaza despite the ceasefire, with tanks advancing beyond the Yellow Line and forcing Palestinians to flee. A separate report alleged that Deutsche Bank financed a German defense manufacturer’s contract to supply gearboxes for Israel’s Merkava 4 tanks until 2027. Other selected coverage was commentary on EU responses to the Gaza genocide rather than a new incident update.
