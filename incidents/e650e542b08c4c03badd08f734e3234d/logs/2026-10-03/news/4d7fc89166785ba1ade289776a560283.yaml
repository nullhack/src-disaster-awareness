title: Campus chants can lead to synagogue attacks
body: Politicians, progressives and students revel in accusations that Israel is “genocidal” and “settler colonial.” Those accusations are ahistorical and false, yet they fan the flames of anti-semitism. When students march chanting from “the river to the sea, Palestine shall be free,” they are — whether they know it or not — calling for the elimination […]
