title: Ahead of Indy show, 4 acts quit Ed Sheeran tour after Macklemore ouster
body: Four support acts quit Ed Sheeran's Loop tour in solidarity with Macklemore after he was removed over pro-Palestinian comments. The tour is set to stop Oct. 10, 2026, at Lucas Oil Stadium in Indianapolis.
