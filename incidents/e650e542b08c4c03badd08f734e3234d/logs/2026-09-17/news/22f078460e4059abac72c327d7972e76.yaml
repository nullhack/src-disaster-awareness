title: Views of the U.S. providing military assistance to Israel and humanitarian aid to Gaza
body: On military assistance to Israel, roughly half of Israeli adults say the U.S. is providing about the right amount and a majority of Palestinians in the West Bank and East Jerusalem say the U.S. is providing too much.
