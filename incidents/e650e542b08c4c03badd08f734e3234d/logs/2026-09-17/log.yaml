log_date: '2026-09-17'
summary: |-
  The UN has formally urged Israel to allow investigators access to Gaza, citing that bodies recovered from the rubble may serve as evidence of war crimes. This marks a significant development in the ongoing international scrutiny of the conflict. Additionally, new Pew Research polling indicates that a majority of Palestinians in the West Bank and East Jerusalem believe the U.S. provides too much military assistance to Israel, reflecting shifting public opinion. Meanwhile, other selected news focused on cultural fallout from Macklemore’s departure from Ed Sheeran’s tour, which is not directly an update on the incident itself.
  The United States has again denied visas to Palestinian leaders, including President Mahmoud Abbas, ahead of the upcoming UN General Assembly, blocking their participation. Separately, rapper Macklemore donated $1 million from his Ed Sheeran tour earnings to Palestinian charities, which led to New England Patriots owner Robert Kraft pledging $2 million for Gaza humanitarian aid in response.
