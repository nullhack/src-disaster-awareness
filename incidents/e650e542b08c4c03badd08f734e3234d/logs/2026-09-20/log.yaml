log_date: '2026-09-20'
summary: |-
  The European Union urged the United States to reconsider its denial of visas for a second consecutive year to the Palestinian delegation, including President Mahmoud Abbas, preventing them from attending the UN General Assembly in New York. World leaders are gathering at the UN amid ongoing conflicts in the Middle East and Ukraine.
  Gaza's children have returned to classrooms after years of Israeli attacks destroyed schools across the territory. Meanwhile, at the UN General Assembly, Palestine remains absent due to the US visa denial, as President Trump meets with Gulf Cooperation Council leaders.
