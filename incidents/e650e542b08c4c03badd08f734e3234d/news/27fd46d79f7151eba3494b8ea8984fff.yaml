title: Joint statement from the Greens' 5 MPs, Leader and Co-Deputy Leaders - Green Party
body: As Green Party leaders and MPs, we will always uphold universal human rights. We will never tolerate any form of discrimination or harassment. We will continue to stand in opposition to genocide, ethnic cleansing, apartheid and the illegal occupation. We will continue to call out the heinous crimes of the Netanyahu government. And we will continue to work to ensure that the Green Party is an anti-racist party in every way. We know there is no conflict between supporting the rights of Palestinians and the rights of Jewish people.
