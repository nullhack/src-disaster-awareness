title: U.K. accuses Israeli settlers of 'ethnic cleansing' in West Bank and bans their goods
body: France, Canada and other countries joined the U.K. in banning goods from Israeli settlements in the occupied West Bank. Israel said it would close the British Consulate among other measures.
