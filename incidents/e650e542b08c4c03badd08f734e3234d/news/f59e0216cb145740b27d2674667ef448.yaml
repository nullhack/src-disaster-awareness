title: Jaishankar chairs meet on West Asia, vows to protect Indian interests
body: EAM S Jaishankar chaired a meeting on India-West Asia relations, highlighting the focus on safeguarding the 10 million-strong Indian diaspora and national interests amidst regional conflict. Iran also underscored its historic ties with India.
