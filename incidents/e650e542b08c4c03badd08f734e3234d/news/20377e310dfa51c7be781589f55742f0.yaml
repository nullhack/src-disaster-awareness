title: African Christian leaders tour Israel amid growing diplomatic outreach
body: Ugandan Pastor Drake Kanaabo said that Israel needs to further its outreach to young Africans who are less connected to the Bible and the history of African-Israeli relations than their parents, and who, like their counterparts around the globe, are susceptible to negative social media reports about Israel.
