title: Sally Rooney’s books withdrawn from UK sale to avoid prosecution over Palestine Action
body: The UK government is placing culture at the mercy of its criminal policies, which are coming into conflict with an increased determination to speak out against genocide and war. Sally Rooney’s case points to the threats levelled against artists and their livelihoods.
