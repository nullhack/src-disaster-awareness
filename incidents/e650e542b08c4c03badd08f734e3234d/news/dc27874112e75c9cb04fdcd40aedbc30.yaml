title: Makkah Alliance, Iran agree to sustain regional peace talks - Pakistan Today
body: The meeting brought together senior officials from Pakistan, Saudi Arabia, Türkiye and Iran amid rising tensions linked to the US-Israeli military campaign against Iran, continued hostilities involving Yemen’s Houthis and developments in Palestine and Lebanon.
