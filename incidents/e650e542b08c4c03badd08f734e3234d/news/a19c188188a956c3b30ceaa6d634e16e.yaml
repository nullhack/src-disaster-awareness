title: '“Origins of a Genocide”: Al Jazeera’s Marwan Bishara on “Twelve Days That Shook the Middle East”'
body: 'Twelve Days That Shook the Middle East: Origins of a Genocide is the new book by Al Jazeera senior political analyst Marwan Bishara discussing the crucial 12 days between Benjamin Netanyahu’s October 7 speech and Biden’s “rare” Oval Office speech on October 19. “October 7 was bloody, and it was horrific. … But Netanyahu and his government had to go overboard, to exaggerate, to lie, to deceive about what exactly happened” in order to justify their actions in Gaza, says Bishara. “Genocides don’t start with bombs; they start with ideology. And in this case, the ideology has been decades in the making.” “During the Biden administration, the United States was basically complicit in genocide,” adds Bishara.'
