title: Gaza Buries 70 Recovered From Rubble, Over 8,000 Still Trapped Beneath the Ruins
body: Gaza Civil Defense recovered 70 bodies from destroyed homes in Beit Lahia and Jabalia after 231 hours of excavation, with 8,000 still missing beneath rubble across the enclave.
