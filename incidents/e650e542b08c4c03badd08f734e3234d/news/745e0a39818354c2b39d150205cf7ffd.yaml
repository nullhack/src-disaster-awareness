title: As Boston’s Jewish community mourns Oct. 7, for many, the ensuing conflict remains polarizing
body: Greater Boston’s Jewish community remains focused on the lives lost during the Oct. 7, 2023, attack on Israel by Hamas. But supporters of the Free Palestine movement say the roots of the conflict began long before that day.
