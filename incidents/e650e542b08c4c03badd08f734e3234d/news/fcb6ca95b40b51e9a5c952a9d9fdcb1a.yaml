title: 'Israel and its Arab neighbours: How conflicts are reshaping on-again and off-again ties | Today News'
body: Three years after the 7 October Hamas attack, Israel's relations with Arab countries remain deeply divided. While it maintains diplomatic ties with the UAE, Egypt, Jordan and Bahrain, the Gaza war and regional conflicts have strained old partnerships and complicated prospects for new ones.
