title: U.N. General Assembly to confront familiar crises, new conflicts and AI | Texarkana Gazette
body: World leaders will converge in New York this week for the United Nations General Assembly with the Middle East in turmoil, war raging between Russia and Ukraine, old alliances in peril, energy prices rising and scientists warning that artificial intelligence could imperil humanity.
