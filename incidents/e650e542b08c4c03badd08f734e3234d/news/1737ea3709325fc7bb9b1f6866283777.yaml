title: Iran's Human Rights Council condemns international silence over Gaza crimes
body: Iran’s High Council for Human Rights has condemned the silence and inaction of international human rights bodies over the continued Israeli crimes in Gaza, calling for an end to impunity and for concrete action to uphold human rights.
