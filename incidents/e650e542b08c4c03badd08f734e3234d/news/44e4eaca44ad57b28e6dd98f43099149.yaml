title: 'Conflict: Israel and Gaza at the 2026 UN General Assembly : 1A'
body: World leaders have descended upon New York City for this year’s edition of the United Nations General Assembly. And a lot is happening.So far, we’ve seen some most pointed criticism of Israel’s conduct heard at the U.N. in years. This led to the Israeli delegation walking out during the Turkish president’s address.It’s been nearly three years since Oct. 7. And the Palestinian Authority’s president isn’t in the room — the United States denied him a visa. Mahmoud Abbas will instead address the assembly on Thursday by video.What is being said about Gaza at this General Assembly? And what does it tell us about the limits of the U.N.’s power when America isn’t on board?Find more of our programs online. Listen to 1A sponsor-free by signing up for 1A+ at plus.npr.org/the1a.
