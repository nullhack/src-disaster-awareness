title: Yemen’s Houthis Reach Strategic Island in Key Shipping Route
body: Yemen’s Iran-backed Houthi rebels have reportedly taken over the strategic Perim Island that sits in the Bab el-Mandeb Strait, in a bid to tighten their grip on the critical maritime chokepoint.
