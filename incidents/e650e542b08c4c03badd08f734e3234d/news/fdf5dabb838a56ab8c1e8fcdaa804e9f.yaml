title: Gaza students work toward college degrees after years of war and displacement
body: In Gaza, more than half a million students are back in school after three years. The picture has been equally bleak for post-secondary education, which has been virtually non-existent since the start of the war in Gaza. Special correspondent Fred de Sam Lazaro reports on an unusual partnership trying to fill part of the void.
