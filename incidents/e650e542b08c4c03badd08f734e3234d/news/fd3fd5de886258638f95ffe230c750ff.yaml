title: When U.N. Protesters Denounce Netanyahu, Mamdani Won’t Be Among Them
body: Mayor Zohran Mamdani of New York continues to call the Israeli prime minister a war criminal. But Mr. Mamdani won’t join demonstrations against the prime minister on Thursday.
