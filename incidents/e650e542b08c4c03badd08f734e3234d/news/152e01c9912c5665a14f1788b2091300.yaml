title: Zionist Regime Keeps Palestinian Prisoners behind Bars After Their Sentences Expire - World news - Tasnim News Agency
body: TEHRAN (Tasnim) – Dozens of Palestinian prisoners from Gaza remain in Israeli custody despite completing their prison sentences, as the Israeli regime continues to hold them under legal provisions that allow detention without criminal conviction.
