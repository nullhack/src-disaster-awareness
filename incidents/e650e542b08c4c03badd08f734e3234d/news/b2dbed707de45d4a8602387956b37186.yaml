title: '3 years since October 7: what effects has war produced on balance of power in Middle East?'
body: The October 7 operation had a profound effect on the balance of deterrence and power in the Middle East for three years, following its consequences beyond the borders of Gaza to become a regional threat to other capitals, sea routes, and even Iran.
