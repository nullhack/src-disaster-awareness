title: Ed Sheeran tour removes Macklemore following pro-Palestine remarks at previous shows
body: On Sept. 14, 2026, rapper Macklemore was removed from Ed Sheeran’s Loop Tour that is scheduled to hit North and South America. The artist had planned to use the stage as a place to project pro-Palestine messages, doing so at his first shows of the tour. Venues then began to refuse to host the rapper,...
