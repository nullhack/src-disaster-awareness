title: U.K. and Israel appear to reach tense truce, but diplomatic feud highlights Israel's strained ties with Europe
body: Israel had threatened to close the U.K.'s century-and-a-half-old Jerusalem consulate over new British sanctions, but they found a way to avoid "blowing the whole relationship up."
