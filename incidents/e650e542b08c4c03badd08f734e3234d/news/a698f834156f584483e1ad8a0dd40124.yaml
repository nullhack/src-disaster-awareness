title: N.L.’s offshore oil could help bankroll a company linked to Israel’s illegal occupation of Palestine
body: Ithaca Energy’s proposed takeover comes as the Carney government promises to ban trade with Israel’s illegal settlements — at the same time, the energy company’s majority owner is named in a UN blacklist over alleged activities supporting settlements in the occupied Palestinian territories
