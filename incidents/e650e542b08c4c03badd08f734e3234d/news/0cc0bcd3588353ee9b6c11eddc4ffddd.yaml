title: Palestinians yearn for ‘a return to normal life,’ says top Middle East peace envoy
body: The UN is continuing efforts to support Palestinians in Gaza amid major challenges to humanitarian access, reconstruction and the restoration of essential services, according to Ramiz Alakbarov, Acting UN Special Coordinator for the Middle East Peace Process.
