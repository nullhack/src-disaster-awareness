title: BRICS New Delhi Declaration 2026 Calls For Gaza Ceasefire, Palestine Statehood & Global Economic Cooperation
body: BRICS nations adopted the New Delhi Declaration 2026, calling for an end to forced displacement of Palestinians, humanitarian access in Gaza and support for Palestine’s UN membership. The declaration also raised concerns over nuclear risks, global military spending, unilateral sanctions and trade restrictions while stressing dialogue and cooperation among nations.
