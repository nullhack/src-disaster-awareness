title: UNC class that traveled near Gaza last year unveils clips of documentary chronicling experience
body: A new course adopted by the University has faced controversy for delving into the conflict between Israel and Palestine. The course, which includes a trip to the countries, is instructed by a panel with a diverse background and is adding an additional four seats in the Spring 2026 semester.
