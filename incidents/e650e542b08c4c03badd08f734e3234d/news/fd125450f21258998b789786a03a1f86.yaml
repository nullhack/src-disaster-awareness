title: Houston Texans linebacker Azeez Al-Shaair punished by NFL for pro-Palestine gesture
body: The NFL fined Houston Texans linebacker Azeez Al-Shaair $11,492 for displaying a pro-Palestine message on his eye black. The letters ‘Hind Rajab’ adorned Al-Shaair’s eye black for the Texans’ NFL Week 1 game against the Buffalo Bills as a sign of support for the plight of the Palestinian people.
