title: Dizon Relieves 2 Pampanga DPWH Officials After Fatal Open Drainage Incident on Fil-Am Friendship Highway
body: Public Works Secretary Vince Dizon has relieved two DPWH Pampanga officials after a 25-year-old man died falling into an open drainage canal along Fil-Am Friendship Highway in Angeles City. Acting on President Marcos Jr.’s directive, the DPWH vows stricter enforcement of road safety and quality standards and warns officials will be held accountable for negligence.
