title: Romualdez camp seeks chance to respond to ‘new allegations’ from witnesses
body: Former House Speaker Martin Romualdez’s camp urges the Ombudsman to disclose any new allegations in the alleged flood control scam and allow them to respond during the preliminary investigation, citing fair play, due process, and the role of ex-Public Works Secretary Manuel Bonoan.
