log_date: '2026-09-07'
summary: New developments include a fatal drainage incident in Pampanga leading to the relief of two DPWH engineers, and over 60 leptospirosis cases in a Pampanga hospital amid persistent flooding. Residents in Dagupan City continue to seek help as flooding persists, while the government allocates P1 billion for Project NOAH and a P6.9-billion resilience project for Eastern Visayas. Flood control infrastructure plans, such as widening drainage on G. Araneta Avenue, and ongoing flood control scam allegations involving former Speaker Romualdez also emerge.
