title: Meralco Brings Aid to Flood-Hit Communities, Cuts Rates for 2nd Month - THEPHILBIZNEWS
body: Manila Electric Company (Meralco) Chairman and CEO Manuel V. Pangilinan led relief operations in his hometown of Apalit, Pampanga, one of the communities severely affected by flooding and heavy rains brought by the enhanced southwest monsoon or Habagat, as the power distributor also announced a second consecutive monthly reduction in electricity rates. On September 13, […]
