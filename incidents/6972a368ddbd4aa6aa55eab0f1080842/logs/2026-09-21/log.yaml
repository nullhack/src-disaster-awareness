log_date: '2026-09-21'
summary: On September 21, the state weather bureau warned of moderate to heavy rainshowers and strong winds over Metro Manila and parts of Luzon, prolonging flood dangers. Separately, the NBI flagged 47 of 100 flood control projects in Davao City, and a Philippine lawmaker pleaded not guilty to accepting kickbacks on substandard, overpriced flood control projects.
