title: 'LIST: Flooded areas in Metro Manila due to heavy rainfall'
body: MANILA, Philippines — Several areas in Metro Manila were submerged in floodwaters on Friday afternoon, Sept. 18, due to heavy rainfall brought by localized thunderstorms, the Metropolitan Manila Development Authority (MMDA) reported.
