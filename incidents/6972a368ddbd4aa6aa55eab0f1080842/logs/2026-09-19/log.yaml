log_date: '2026-09-19'
summary: Former House Speaker Martin Romualdez pleaded not guilty to plunder over the alleged misuse of P7.4 billion in flood control funds, and the Bureau of Immigration implemented hold departure orders against him and three others. Meanwhile, the GSIS increased emergency loan assistance to nearly P8 billion for flood victims, and heavy rainfall on September 18 caused fresh flooding in multiple areas of Metro Manila. Anti-corruption rallies are also set for September 21 to protest the flood control scandal.
