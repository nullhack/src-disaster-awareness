title: inDrive Philippines Team Helps Bulacan Households Recover From Recent Floods - LionhearTV
body: Following weeks of heavy rainfall that caused flooding in parts of Central Luzon, global mobility platform inDrive mobilized employees to distribute relief packs to affected families in Meycauayan, Bulacan. inDrive Philippines, with the nonprofit Asia Society for Social Improvement and Sustainable Transformation (ASSIST), distributes relief packs to families affected by flooding in Bulacan Working with […]
