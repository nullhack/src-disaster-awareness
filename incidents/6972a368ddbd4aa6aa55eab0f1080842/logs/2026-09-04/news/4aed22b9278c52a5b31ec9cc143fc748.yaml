title: Senators seek probes, flood control overhaul after August storms - BusinessWorld Online
body: SEVERAL SENATORS on Tuesday filed resolutions seeking investigations into widespread flooding caused by successive typhoons and southwest monsoon rains in August, with lawmakers calling for a review of flood control projects and disaster resilience measures. “There is a need to assess the resilience of public infrastructure amid increasingly severe typhoons and monsoons, while ensuring that […]
