title: PHL revisits flood master plan as climate risks intensify - BusinessWorld Online
body: THE government is reviewing the country’s flood control master plan after recent severe weather exposed gaps in existing flood management measures, with Malacañang acknowledging that plans crafted by previous administrations were never fully implemented. “There was already a master plan as far back as the 1930s and 1940s,” Palace Press Officer Clarissa A. Castro told […]
