log_date: '2026-09-04'
summary: Severe monsoon rains and cyclones have caused widespread flooding across the Philippines, particularly in Luzon, with damage nearing P4 billion in Central Luzon and P2.68 billion in infrastructure damage in the Ilocos Region, affecting over four million people. At least two brothers drowned in a submerged bypass road in Pampanga, and a baby was dramatically rescued from flash floods in Manila. In response, lawmakers are pushing for flood control master plan reviews and Senate investigations into the government's disaster response.
