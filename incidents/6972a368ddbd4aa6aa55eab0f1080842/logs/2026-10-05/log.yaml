log_date: '2026-10-05'
summary: A jeepney carrying 14 people was swept away by floodwaters in Batangas, leaving two missing. The trough of Super Typhoon Choi-wan is expected to bring additional rains over Visayas and Mindanao, potentially prolonging flood risks. Meanwhile, the Commission on Audit reported that 28 of the MMDA's 119 flood pumps are unserviceable, underscoring ongoing flood control challenges.
