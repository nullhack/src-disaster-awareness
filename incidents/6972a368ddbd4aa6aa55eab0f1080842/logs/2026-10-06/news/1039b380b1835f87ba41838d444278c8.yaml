title: Japan provides rescue boats to Ilocos Norte - THEPHILBIZNEWS
body: Japan has provided two new rescue boats to the Provincial Government of Ilocos Norte to strengthen disaster response and search-and-rescue operations in Laoag City and surrounding areas. Japanese Minister for Economic Affairs YOKOTA Naobumi attended the turnover ceremony on October 1, 2026, for “The Project for the Provision of Rescue Boats for Disaster Relief in […]
