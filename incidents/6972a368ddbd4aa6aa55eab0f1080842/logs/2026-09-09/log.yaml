log_date: '2026-09-09'
summary: On September 9, heavy monsoon rains continued to cause flooding across Metro Manila, with multiple roads submerged. A major development saw former Speaker Martin Romualdez arrested on plunder charges related to flood control fund corruption, and the NBI may summon Rep. Paolo Duterte over P1.9 billion in Davao flood projects. Meanwhile, all lanes along NLEX San Simon reopened after floodwater receded, indicating gradual recovery in some areas.
