title: Pulong may be summoned over Davao flood projects
body: The National Bureau of Investigation may summon Rep. Paolo Duterte in connection with a probe into the nearly P1.9 billion worth of flood control projects in Davao City, which were awarded to a single contractor, NBI Director Melvin Matibag said yesterday.
