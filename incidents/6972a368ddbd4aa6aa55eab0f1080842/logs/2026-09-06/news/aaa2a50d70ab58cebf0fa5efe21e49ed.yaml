title: Laguna governor pushes Laguna de Bay dredging, massive drainage rehabilitation to address flooding
body: Laguna Governor Sol Aragones is pushing for the dredging of Laguna de Bay and the massive rehabilitation of drainage systems in the province as long-term solutions to flooding.
