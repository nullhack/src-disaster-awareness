title: 'Marcos: NLEX traffic situation improving as floods recede'
body: MANILA, Philippines — President Ferdinand Marcos Jr. on Wednesday expressed optimism that the flooding in parts of North Luzon Expressway (NLEX)—which caused heavy traffic for motorists—is starting to subside.
