title: फिलीपींस की बाढ़ का पुराना वीडियो नेपाल का बताकर वायरल
body: 'Nepal flood Viral video: इस पोस्ट को शेयर कर कुछ यूजर्स ने दावा किया है कि इस वीडियो में नेपाल में एक मां और बेटी बाढ़ के पानी में बहती हुई दिख रही हैं और आस पास खड़े लोग इनकी मदद करने की जगह वीडियो बना रहे हैं.'
