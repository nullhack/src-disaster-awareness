title: Marcos' Cousin Romualdez Pleads Not Guilty In US$118 Million Flood Case
body: Former Philippine House Speaker Martin Romualdez pleaded not guilty to a plunder charge over an alleged misuse of 7.4 billion pesos (US$118 million) in public funds meant for flood control projects.
