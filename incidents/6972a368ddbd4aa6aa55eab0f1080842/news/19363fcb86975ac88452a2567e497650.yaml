title: Pangasinan intensifies dam, river monitoring amid rising flood risk
body: The Pangasinan Provincial Disaster Risk Reduction and Management Office (PDRRMO) is intensifying its monitoring of major dams and river systems as flooding continues to affect communities across the province.
