title: 'DPWH in the NEP 2027: A grab bag of misaligned priorities - BusinessWorld Online'
body: The Department of Public Works and Highways (DPWH) is seeking P643.95 billion in funding for 2027, a marked reduction of about 26.8% from last year’s proposal. The infrastructure component is about 89% of the total (P572.92 billion), broken down into six program categories. The Road sector (Network + Bridge) gets the lion’s share at 38.5%, […]
