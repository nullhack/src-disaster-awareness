title: Pangilinan seeks strict DENR review after floods - BusinessWorld Online
body: THE Department of Environment and Natural Resources’ (DENR) spending for anti-pollution programs will undergo strict Senate review, Senator Francis Pancratius N. Pangilinan said on Wednesday, as he attributed the widespread flooding to poor urban development. In a press statement, Mr. Pangilinan called on the DENR to enforce stricter regulations on reclamation, quarrying, mining and land […]
