title: Dizon says flood-hit Pampanga to receive 'big financial package' from local gov't support fund
body: DPWH Secretary Vince Dizon on Wednesday said flood-hit Pampanga will receive a financial package from the national government to help the province recover from the impact of back-to-back storms and southwest monsoon rains that have caused severe flooding.
