title: Flooding persists in parts of NCR, Rizal, and Bulacan; 11-yo boy drowns in Valenzuela
body: Flooding continued to affect several areas in Rizal, Bulacan, and Metro Manila on Sunday, as residents in some communities remained in evacuation centers following days of heavy rains.
