title: Choi-Wan trough to bring rains, thunderstorms over parts of Visayas, Mindanao
body: The trough of Super Typhoon Choi-Wan is expected to bring cloudy skies, scattered rains and thunderstorms over parts of the Visayas and Mindanao on Monday, according to PAGASA. In its 4 a.m. weather forecast, PAGASA said Mindanao, Western Visayas, the Negros Island Region, Central Visayas, Leyte ...
