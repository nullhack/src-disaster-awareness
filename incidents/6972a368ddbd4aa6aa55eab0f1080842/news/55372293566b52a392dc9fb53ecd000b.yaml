title: EU allocates P10.9M for flood-hit Luzon communities
body: The European Union has allocated €150,000, or about P10.9 million, in humanitarian aid for more than 32,000 people affected by severe flooding in the Ilocos Region, Central Luzon and Metro Manila. The funding will support the Philippine Red Cross in distributing essential household items,
