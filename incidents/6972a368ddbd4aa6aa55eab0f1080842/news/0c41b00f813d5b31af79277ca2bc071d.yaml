title: Thunderstorms to bring heavy rain, strong winds to Metro Manila, Luzon
body: 'MANILA: Moderate to heavy rainshowers with lightning and strong winds are expected over parts of Metro Manila and other areas in Luzon on Monday (Sept 21), according to the state weather bureau.'
