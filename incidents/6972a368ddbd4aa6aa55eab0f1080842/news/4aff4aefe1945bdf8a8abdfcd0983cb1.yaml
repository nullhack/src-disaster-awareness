title: 333 housing units turned over in Valenzuela - BusinessWorld Online
body: PRESIDENT Ferdinand R. Marcos, Jr. on Tuesday led the turnover of 333 housing units at Disiplina Village Arkong Bato in Valenzuela City for families relocated from flood-prone and other high-risk areas, the Palace said. The project is part of the government’s relocation program for informal settler families, according to Presidential Communications Office. Mr. Marcos said […]
