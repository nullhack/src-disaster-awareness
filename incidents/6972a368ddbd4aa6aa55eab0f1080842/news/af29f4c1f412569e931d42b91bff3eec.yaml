title: Investigator forgot his own rules
body: The controversy surrounding Senator Panfilo Lacson’s allegations of ghost flood control projects in Taguig raises questions about Ombudsman confidentiality rules, due process, and the risks of public accusations before an investigation is completed. The dispute highlights the importance of verifying evidence, avoiding trial by publicity, and protecting public trust in government investigations.
