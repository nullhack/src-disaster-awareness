title: 'Free AI tool to let public check quake damage from photos: Research center - Focus Taiwan'
body: There will soon be a free artificial intelligence (AI) tool that allows the public to upload photos of key structural components in their homes for a preliminary assessment of potential earthquake damage, its government-run developer said Tuesday.
