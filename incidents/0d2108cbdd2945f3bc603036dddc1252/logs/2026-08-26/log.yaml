log_date: '2026-08-26'
summary: A magnitude 5.5 earthquake struck 108 km northeast of Hengchun, Taiwan, at 3:00 p.m. local time on August 25, 2026, according to multiple sources. The Central Weather Administration issued a national alert initially overestimating the quake at magnitude 6.6 before correcting it to 5.8, attributing the error to limited seismic data. The earthquake occurred in waters off Taitung county, with no immediate reports of major damage.
