log_date: '2026-08-28'
summary: As of late August 2026, more than 38,300 homes and businesses in Gary, Indiana, lost power from severe storms on August 11, and many remain without power 13 days later. Severe thunderstorm threats and flood risks persist across multiple states, including the Lehigh Valley, Baltimore, Pittsburgh, Virginia, and Mississippi, with forecasts calling for possible damaging winds, hail, and heavy rain.
