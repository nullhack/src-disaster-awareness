log_date: '2026-07-26'
summary: A series of severe storms swept across multiple US states in late July 2026, producing numerous tornadoes—including at least nine in Ohio, six in Kentucky, and four in New Jersey—and causing flash flooding that resulted in at least two confirmed deaths in West Virginia. Damaging winds, large hail, and isolated tornadoes also threatened parts of Manitoba and northwestern Ontario, while extreme heat and additional severe thunderstorm risks were forecast for the Midwest and Northeast.
