title: Pinehurst Hosts National High School Golf Championships Amid Weather Challenges
body: The final round of the boys championship never arrived at Pinehurst. Severe weather had interrupted play Sunday, sent players back out Monday morning and then returned before officials could complete the planned 54 holes. Terry Sanford High School had already done enough.
