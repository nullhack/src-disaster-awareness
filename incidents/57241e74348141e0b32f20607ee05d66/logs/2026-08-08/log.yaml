log_date: '2026-08-08'
summary: On August 7, 2026, severe thunderstorms prompted watches and warnings from the National Weather Service across Delaware, New York (including Hudson Valley, Broome, and Sullivan counties), and surrounding states. Over 40,000 New Jersey residents lost power as storms rolled through, while quarter-sized hail and damaging winds affected multiple counties, and lightning caused a weather delay at Nissan Stadium in Tennessee. A Next Weather Alert was in effect for the Philadelphia region due to the combination of heat and heavy storms.
