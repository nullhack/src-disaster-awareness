log_date: '2026-07-29'
summary: An EF3 tornado with 140 mph winds caused major damage in Appleton, Wisconsin, one of four EF3 tornadoes in the state in 2026. Severe storms also left tens of thousands without power in north Georgia and the Carolinas, and a man was killed when a tree fell on his home in Wake County, North Carolina. Additional severe weather threats, including possible tornadoes and flash flooding, affected regions from the Midwest to the East Coast.
