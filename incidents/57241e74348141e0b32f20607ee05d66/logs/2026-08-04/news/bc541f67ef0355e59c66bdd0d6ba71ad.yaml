title: Storms forecast Monday, flash flooding possible in southeastern PA, NJ Philly region weather
body: As much as 1 to 3 inches of rain per hour could fall as multiple rounds of thunderstorms are expected to move through the region, the NWS forecast said. Flash flooding in urban, poor drainage area, creeks and streams is possible.
