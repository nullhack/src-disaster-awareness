log_date: '2026-08-07'
summary: Recent reports show continued severe thunderstorm and flash flood threats across the central and eastern U.S., with forecasts for strong storms and heavy downpours over the weekend. Monday night severe weather diverted 22 flights from Denver to Colorado Springs, while separate storms triggered severe thunderstorm and flash flood warnings in northern Arizona and damaging wind/hail warnings in New York's Capital Region, Hudson Valley, and Southern Tier. Power outages were reported in the Midlands, and severe weather also forced the Kansas City Chiefs to practice indoors and prompted strong storm alerts in Wisconsin.
