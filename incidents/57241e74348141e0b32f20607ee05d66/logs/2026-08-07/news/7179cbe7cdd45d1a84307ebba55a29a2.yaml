title: 5 people injured by turbulence, 22 planes diverted to Colorado Springs from Denver on Monday night due to 'severe weather'
body: Twenty-two aircraft flying to Denver, Colorado on Monday night had to divert to Colorado Springs due to "severe weather," the Colorado Springs Airport told CNN.
