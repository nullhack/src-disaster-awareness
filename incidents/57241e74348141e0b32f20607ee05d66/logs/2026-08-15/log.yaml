log_date: '2026-08-15'
summary: In mid-August 2026, severe storms continued to hammer the Midwest, producing tornadoes and flash flooding that caused multiple fatalities. A 4-year-old boy died in Geneva, Indiana, when a tree fell on his home, and a woman was killed in a home explosion in Portage, Indiana, amid severe weather. The storms brought wind gusts exceeding 100 mph, flattening corn fields and causing widespread damage, with central Indiana and the Chicago area facing repeated flooding and additional severe thunderstorm threats.
