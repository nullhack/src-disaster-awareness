log_date: '2026-09-11'
summary: Forecasts call for a low but non-zero severe storm risk in parts of central New York as a cold front brings showers and thunderstorms back to the region. Columbus, Ohio, is under a Weather Alert Day for Thursday, with strong or severe thunderstorms possible and a heat advisory extended through Friday. A Severe Thunderstorm Watch remains in effect for much of the DC, Maryland, and Virginia areas through early Friday morning, with isolated showers and storms possible.
