title: Severe storms cause damage across Cyprus
body: Severe storms that hit Cyprus around noon on Saturday caused damage in several parts of the island, bringing down trees, disrupting roads and damaging photovoltaic installations and greenhouses. Strovolos mayor Stavros Stavrinidis reported several incidents involving fallen branches and warned that they could pose a risk to residents and motorists.…
