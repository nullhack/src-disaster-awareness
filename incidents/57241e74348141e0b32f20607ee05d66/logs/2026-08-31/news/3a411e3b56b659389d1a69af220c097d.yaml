title: Police urge caution on roads amid severe weather
body: Police on Saturday urged drivers to exercise extra caution as severe weather sweeps through the region, warning that deteriorating road conditions could pose serious risks to motorists. Drivers were advised to reduce their speed and adapt their driving to prevailing conditions, while maintaining a greater distance from vehicles ahead. They…
