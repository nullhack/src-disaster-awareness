log_date: '2026-08-19'
summary: A state of emergency was declared for all 55 West Virginia counties on August 18, 2026, following severe storms that brought heavy rainfall, flash flooding, mudslides, and widespread water rescues. Severe thunderstorms also caused significant damage in Wyandotte County, Kansas, with downed power lines and cleanup underway. Ongoing severe weather threats continued across the Midwest and other regions, including flash flooding risks in central Indiana and severe thunderstorm watches in Nebraska.
