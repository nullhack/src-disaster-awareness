title: State of emergency declared for all 55 West Virginia counties following severe storms
body: Governor Patrick Morrisey declared a State of Emergency for all 55 West Virginia counties on Tuesday following a new round of severe storms that brought heavy rainfall, flash flooding, mudslides, and widespread water rescues.
