log_date: '2026-08-21'
summary: In late August 2026, severe storms continued across multiple states, with flash flood warnings in New Jersey and strong-to-severe thunderstorm threats in central Alabama, Northeast Ohio, the Milwaukee area, and Kansas City. The National Weather Service is investigating possible tornado damage in Lancaster County, Pennsylvania, after a tornado warning was issued. Meanwhile, flood recovery efforts persist in central Indiana and West Virginia, which earlier declared a state of emergency for all 55 counties.
