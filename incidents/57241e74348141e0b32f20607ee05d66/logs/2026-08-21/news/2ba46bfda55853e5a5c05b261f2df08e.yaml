title: 'First Alert Forecast: Developing storm “Moke” will be south of the islands'
body: Another tropical system is making its way toward the Central Pacific, but the overall setup is shaping up to be far more manageable in terms of severe wind. Tropical Depression 2C—expected to organize into Tropical Storm Moke—is running into atmospheric speed bumps that will keep it from building into a major hurricane. Moderate upper-level wind shear and pockets of dry air are tilting the system and disrupting its convective core. While the system won’t pack a damaging wind punch, its broad footprint means it will act like a giant, moisture-rich sponge moving across the region.
