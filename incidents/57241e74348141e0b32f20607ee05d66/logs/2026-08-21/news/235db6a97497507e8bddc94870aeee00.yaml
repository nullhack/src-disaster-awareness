title: 'N.J. weather: Flash flood warnings, thunderstorm alerts posted as strong storms sweep across region. Live updates.'
body: The Weather Prediction Center says most of New Jersey has a slight risk of getting excessive rainfall, and a wide swath of northern and central New Jersey has a moderate risk — the second highest of four risk levels for potential flooding.
