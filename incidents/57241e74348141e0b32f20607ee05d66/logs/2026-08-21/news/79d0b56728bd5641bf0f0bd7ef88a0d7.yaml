title: Did a tornado hit Lancaster County? The NWS is planning to find out
body: The NWS State College said a survey team is being sent to the area to see whether the damage shows signs of a tornado. On Thursday, National Weather Service forecasters issued a tornado warning for Columbia and other parts of Lancaster County until 5 p.m.
