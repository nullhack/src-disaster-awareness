title: A few showers tonight with more severe weather potential Tuesday - WCCB Charlotte
body: Once we get into Tuesday, the atmosphere becomes much more favorable for widespread showers and thunderstorms. While the morning may feature only a few light showers or drizzle, the afternoon tells a different story as heat and humidity help storms rapidly develop across the region. Tomorrow has the greatest potential for severe weather.
