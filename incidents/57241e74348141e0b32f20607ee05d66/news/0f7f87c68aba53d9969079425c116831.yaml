title: More Rain, Warming Temperatures and Muggy Conditions for New Work Week
body: Sunday night brings additional showers and thunderstorms with the the continued chances of localized heavy rainfall. Heat and humidity build significantly Monday through Wednesday with heat index values reaching 95-100 degrees. Conditions improve by the end of the week.
