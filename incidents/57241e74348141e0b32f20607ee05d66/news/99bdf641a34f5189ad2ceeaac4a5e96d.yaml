title: Muggy and with scattered rain most of the week - AOL
body: August has gotten off to a very muggy and soggy start across the DMV. We felt that humidity dial up to a high level on Saturday, followed by plenty of heavy rain and isolated flooding issues east of I-81 on Sunday. All of this was brought on by a slow-moving front that’s starting to clear […]
