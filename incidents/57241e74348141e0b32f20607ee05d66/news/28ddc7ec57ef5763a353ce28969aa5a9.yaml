title: Severe Storms Likely To Hit Chicago Again Wednesday
body: The city is forecast to face thunderstorms with torrential rainfall, damaging winds and lightning Wednesday, just a day after Tuesday's brutal storms and tornadoes, according to the National Weather Service.
