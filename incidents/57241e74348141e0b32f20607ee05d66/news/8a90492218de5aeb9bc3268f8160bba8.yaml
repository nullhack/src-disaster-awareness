title: Flooding continues, severe storms expected this afternoon | Aug. 12, 2026
body: INDIANAPOLIS (WISH) - Active weather continues across central Indiana with flooding concerns this morning and additional severe storms expected this afternoon and evening. This Morning Flooding remains the primary concern across eastern and southern portions of central Indiana.
