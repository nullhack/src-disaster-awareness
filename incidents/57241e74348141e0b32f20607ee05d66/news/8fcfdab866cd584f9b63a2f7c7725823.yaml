title: Boy, 4, dead as severe weather in Midwest spawns tornadoes, flash flooding
body: First responders continued rescue efforts Wednesday after severe storms in the Midwest resulted in tornadoes, heavy rains and flash flooding. According to The Associated Press, a 4-year-old boy was killed when a tree fell on a home in Geneva, Indiana, during Tuesday's storms, the Jennings County Sheriff's Office said.
