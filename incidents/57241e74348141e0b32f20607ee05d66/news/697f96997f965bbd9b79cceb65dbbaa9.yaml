title: 'First Alert Days: Hot, humid, and strong storms this weekend'
body: Hot and humid conditions are expected on Saturday, too. The latest model guidance has most of the region just shy of 100 degrees, so we held off on the alert day for Saturday. Heat index values will range from 100 to 105 degrees on Sunday and Monday. Hot conditions continue all of next week, too.
