title: More areas under Signal No. 2 as 'Kiyapo' slightly intensifies
body: 'More areas in Northern Luzon were placed under Tropical Cyclone Wind Signal No. 2 on Friday as Tropical Storm Kiyapo (international name: Noul) slightly intensified and moved closer to Extreme Northern Luzon.'
