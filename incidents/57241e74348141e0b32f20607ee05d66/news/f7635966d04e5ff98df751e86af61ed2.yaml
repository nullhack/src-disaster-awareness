title: 'NYC, NJ face growing severe weather threat this week: Damaging winds, flooding possible'
body: NYC, and mostly all of NJ, face a growing severe weather threat over the coming days as storms could bring large hail, damaging winds and possibly tornadoes, the National Weather Service (NWS) said.
