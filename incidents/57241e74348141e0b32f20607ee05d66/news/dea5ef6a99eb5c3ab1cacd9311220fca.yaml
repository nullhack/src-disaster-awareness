title: 'Nepal Flash Floods: Homes, hotels washed away, bridges destroyed, hydropower projects hit, these 5 areas saw the worst devastation'
body: The Rasuwagadhi-Timure corridor near the Nepal-China border was among the first areas hit by the flood. Water, rocks and debris from Tibet reached the area at high speed. The historic Miteri Bridge was swept away by the flood.
