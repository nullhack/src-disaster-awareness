title: Strong 6.0-magnitude earthquake strikes in Gulf of Aden
body: MOGADISHU — A strong 6.0-magnitude earthquake struck Friday morning in the Gulf of Aden, between Somalia and Yemen, the United States Geological Survey (USGS) reported.
