log_date: '2026-08-28'
summary: A magnitude 6.0 earthquake struck the Gulf of Aden early Friday, August 27, 2026, approximately 145 kilometers north of Caluula in Somalia's Puntland region. The United States Geological Survey (USGS) reported the quake, which was felt across Somalia and rattled residents in the area. No immediate damage or casualties have been reported.
