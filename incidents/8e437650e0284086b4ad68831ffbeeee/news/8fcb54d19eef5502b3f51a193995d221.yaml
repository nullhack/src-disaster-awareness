title: Building during a severe drought; Initiative 95; ballot petitions; unequal tax system (Letters)
body: Nearly every day there’s an article about the severe drought (both in the U.S. and all over the globe). So! Kids, let’s build a 110-room hotel in downtown Boulder! Does anyone else register the extreme disconnect here?
