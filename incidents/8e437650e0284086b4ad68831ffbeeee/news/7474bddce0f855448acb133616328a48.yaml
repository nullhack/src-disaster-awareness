title: A 'super El Niño' could make India's monsoon drier yet more dangerous
body: India is currently in the middle of its summer monsoon, but this year's rainfall presents an interesting paradox. Much of the country has received less rain than usual so far, yet has still been hit by severe floods and landslides. In the southern state of Kerala, for example, devastating floods occurred despite the overall monsoon rainfall remaining well below average.
