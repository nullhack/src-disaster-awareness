title: Drought, then fire. Where does that leave the Everglades?
body: Fires that burned about 24,000 acres in Everglades National Park were mostly brought under control on Wednesday, but scientists are keeping an eye on effects from a prolonged drought that could impact Florida Bay, wading birds and the Everglades muck.
