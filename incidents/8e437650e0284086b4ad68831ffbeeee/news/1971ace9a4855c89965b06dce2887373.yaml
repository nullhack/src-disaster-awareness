title: Photos show European fishers on the brink as summer drought parches rivers, lakes and farms
body: NOVI SAD (AP) — Persistent drought and scorching heat this summer have ravaged ecosystems and businesses across the region, from a lake in Slovenia and the side channel of the Danube in Serbia, to fish farms in Bosnia, the Czech Republic, Romania and Hungary.
