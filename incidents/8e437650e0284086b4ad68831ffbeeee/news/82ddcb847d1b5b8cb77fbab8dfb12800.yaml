title: $91.6m Bunkers Hill water project commissioned amid drought - Jamaica Observer
body: CLARENDON, Jamaica — Approximately 1,000 residents across Bunkers Hill, Mears, Broadleaf and Nairne Castle in Northern Clarendon are set to benefit from improved access to potable water following the commissioning of the $91.6-million Bunkers Hill Water Supply Project on Tuesday. In a release, the Ministry of Water, Environment and Climate Change said the project was implemented by Rural Water Supply Limited (RWSL) and handed over to the National Water Commission...
