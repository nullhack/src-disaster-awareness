title: The 'Rock of Starvation' reappears as drought tightens its grip on the Danube
body: The reappearance of Budapest's "Rock of Starvation" is a visible sign of a drought months in the making. IIASA researchers have traced its progression from missing rainfall and parched soils to exceptionally low flows across the Danube basin.
