title: Churches call on Jamaicans to pray and take action amid ongoing drought conditions - Jamaica Observer
body: KINGSTON, Jamaica — The Jamaica Umbrella Groups of Churches (JUGC) is calling on Jamaicans to pray, conserve water and support vulnerable communities as the country continues to face the effects of prolonged drought conditions. The church body said the shortage of water is affecting households, communities, farmers, businesses and livelihoods across the island, with the most vulnerable experiencing the greatest impact. In a statement issued on Friday, under the theme...
