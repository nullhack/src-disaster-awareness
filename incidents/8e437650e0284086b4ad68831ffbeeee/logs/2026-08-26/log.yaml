log_date: '2026-08-26'
summary: |-
  Multiple regions are experiencing severe drought impacts in August 2026: France's wine industry faces an early harvest after 63 days of heat wave conditions; British florists report their worst year as drought decimates flower stocks; Central Java farmers struggle with both drought and rat infestations; a $91.6 million water project was commissioned in drought-stricken Jamaica; and before-and-after photos from California's Chino Hills show the toll of extreme heat and drought. Additionally, a forecasted "super El Niño" threatens to worsen drought conditions in India and disrupt global supply chains.
  New drought impacts reported on August 26: Historic drought across Oregon, Idaho, and Washington is causing water supply shortages for utilities and costing farmers millions in lost crops. Bristol Water announced a hosepipe ban for 1.2 million people in the UK, and the U.S. declared a drought disaster for parts of Puerto Rico. Czech farmers are reducing herds due to feed crop shortages from exceptional summer drought, while the City of Farwell, Texas returned to Stage 2 drought conditions.
