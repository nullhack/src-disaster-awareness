title: ‘Gov’t neglect has left Jamaica unprepared for this drought’ — PNP - Jamaica Observer
body: KINGSTON, Jamaica — The People’s National Party (PNP) is accusing the Holness administration of failing to adequately prepare Jamaica for the ongoing drought, arguing that years of underinvestment and neglect in the water sector have worsened the current crisis. In a release on Thursday, the PNP said it was “gravely concerned” by what it described as the Government’s “slow, reactive and inequitable handling” of the drought, which it said was...
