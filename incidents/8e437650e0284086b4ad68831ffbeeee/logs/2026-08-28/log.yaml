summary: 'New drought impacts reported on August 28: UK wildlife centers are overwhelmed with dehydrated hedgehogs and owls due to heat and drought, Minnesota''s DNR warns residential trees are at risk of dying from drought stress, and Kansas wheat acreage is declining under pressure from drought and shifting crop economics. In contrast, Corpus Christi loosened drought restrictions to Stage 1 after reservoirs rebounded from upstream flooding. Additionally, coral records show human-caused climate change is making El Niño stronger, which could intensify drought globally.'
