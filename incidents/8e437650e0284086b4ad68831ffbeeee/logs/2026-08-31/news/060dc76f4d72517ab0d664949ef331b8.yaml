title: Colorado River plan to cut water amid drought brings uncertainty for cities and farmers
body: Mayor Robert Morris of Cave Creek, Arizona, is worried about more water shortages from the severely depleted Colorado River. The federal government recently finalized a new river plan to help keep it from plunging further, causing concerns and uncertainty among those who rely on its water.
