log_date: '2026-08-31'
summary: 'New drought developments reported on August 30-31: The federal government finalized a new Colorado River plan to cut water amid severe depletion, causing uncertainty for cities and farmers. In Sarawak, Malaysia, drought and haze have shrunk river channels, making journeys perilous. Tunisia is sweltering under near-50°C temperatures, with power cuts disrupting water supplies and straining health services. United Nations desertification talks in Mongolia concluded, highlighting the growing drought crisis globally. India faces a 13% rainfall deficit, threatening Kharif crop yields, while a South Carolina farmer reported losing crops due to drought.'
