log_date: '2026-08-29'
summary: Oklahoma City reached its 29th day of 100°F+ temperatures under a burn ban, while a strong El Niño is expected to bring a mild winter but little drought relief for Wisconsin. Puerto Rico's water emergency worsened as residents face dry reservoirs and service interruptions, though Tropical Storm Dolly's remnants may bring rain to the island. Laredo, Texas continues a dry August but an end to the drought may be approaching, and Connecticut experienced a summer swing from drought to flooding. Additionally, the Welsh Rugby Union issued pitch safety advice after a record-breaking hot and dry summer.
