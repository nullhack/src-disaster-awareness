log_date: '2026-08-29'
summary: |-
  Oklahoma City reached its 29th day of 100°F+ temperatures under a burn ban, while a strong El Niño is expected to bring a mild winter but little drought relief for Wisconsin. Puerto Rico's water emergency worsened as residents face dry reservoirs and service interruptions, though Tropical Storm Dolly's remnants may bring rain to the island. Laredo, Texas continues a dry August but an end to the drought may be approaching, and Connecticut experienced a summer swing from drought to flooding. Additionally, the Welsh Rugby Union issued pitch safety advice after a record-breaking hot and dry summer.
  Drought continues to impact various regions: Western Colorado's fall leaf color change is expected to be less vibrant due to extreme drought and heat, while Denver Water has mandated an early end to lawn watering by October 1 due to persistent dry conditions. In central Pennsylvania, several counties have been removed from Drought Watch status as conditions improved, but European fishers in Slovenia, Serbia, Bosnia, Czech Republic, Romania, and Hungary are struggling as summer drought parches rivers and lakes. Additionally, bear encounters in the western U.S. are rising as drought devastates wildlands and food sources, driving bears into populated areas.
