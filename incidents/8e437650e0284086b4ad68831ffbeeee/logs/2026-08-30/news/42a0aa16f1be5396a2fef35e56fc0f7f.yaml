title: 'ಮಳೆ ಕೊರತೆಯ ಎಫೆಕ್ಟ್: ರಾಜ್ಯದಲ್ಲಿ 2026-27 ಸಾಲಿನ ಮುಂಗಾರು ಹಂಗಾಮಿನಲ್ಲಿ 53.10 ಲಕ್ಷ ಹೆಕ್ಟೇರ್ ಕೃಷಿ!'
body: ರಾಜ್ಯದಲ್ಲಿ ಬರ ಪರಿಸ್ಥಿತಿ ನಿರ್ಮಾಣವಾಗಿದೆ. ಈ ಬಗ್ಗೆ ಸರ್ಕಾರ ಅಧಿಕೃತವಾಗಿ ಘೋಷಣೆ ಮಾಡುವುದು ಇನ್ನಷ್ಟೇ ಬಾಕಿ ಇದೆ. ಮಳೆ ಕೊರತೆಯ ಎಫೆಕ್ಟ್ ನಿಂದಾಗಿ ರಾಜ್ಯದಲ್ಲಿ 2026-27 ಸಾಲಿನ ಮುಂಗಾರು ಹಂಗಾಮಿನಲ್ಲಿ 53.10 ಲಕ್ಷ ಹೆಕ್ಟೇರ್ ಕೃಷಿ ಬೆಳೆ ಆಗಿದೆ. ಕಳೆದ ಬಾರಿಗೆ ಹೋಲಿಕೆ ಮಾಡಿದರೆ ಇದು ತುಂಬಾನೇ ವಿರಳವಾಗಿದೆ. ಮಳೆ ಪರಿಸ್ಥಿತಿ ಹೀಗೆ ಮುಂದುವರಿದರೆ ಮತ್ತಷ್ಟು ಸಮಸ್ಯೆಗೆ ಇದು ಕಾರಣವಾಗಲಿದೆ. ಈ ನಿಟ್ಟಿನಲ್ಲಿ ರಾಜ್ಯ ಸರ್ಕಾರ ಸೂಕ್ತ ಕ್ರಮ ಕೈಗೊಳ್ಳಬೇಕಾಗಿದೆ. ಹಾಗಾದರೆ ರಾಜ್ಯದ ಸ್ಥಿತಿ ಗತಿ ಹೇಗಿದೆ? ಈ ಕುರಿತಾದ ಮಾಹಿತಿ ಇಲ್ಲಿದೆ.
