log_date: '2026-08-30'
summary: New drought developments include the Netherlands shattering 1976 records as Rhine flows hit their lowest, prompting calls to overhaul drainage systems. A record $5.3 million was paid for a Panama Canal transit slot as reduced water levels limit crossings. In India, Karnataka faces a drought situation with 53.10 lakh hectares of agriculture in the 2026-27 season, significantly below previous years. Additionally, Central American drought relief is anticipated from Tropical Storm Dolly's remnants, while fall foliage in the Mid-Atlantic and Virginia is expected to be poor due to ongoing drought. In the U.S., a heat dome persists over the Texas Panhandle, Southwest Missouri warns of extreme fire season, Florida's aquifer is low, northeast Wisconsin continues drought, and Colorado sees record bear reports as drought impacts natural food sources. Europe's Danube River drought deepens, threatening fish and river cruises.
