title: France readies A400M retardant flights as Bordeaux wildfire forces evacuations
body: France is preparing an adapted A400M aircraft to drop retardant on the Gironde wildfire near Bordeaux. Mass evacuations, foreign assistance and shifting winds underline the scale of the crisis.
