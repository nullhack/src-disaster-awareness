title: France deploys massive cargo aircraft to dump flame retardant on wildfire
body: France says it will use a massive specially adapted cargo aircraft on Saturday to dump flame retardants on a wildfire that has forced the evacuation of tens of thousands of people, including from some suburbs of the wine region city of Bordeaux
