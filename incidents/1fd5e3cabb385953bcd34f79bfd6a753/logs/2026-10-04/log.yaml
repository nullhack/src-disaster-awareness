log_date: '2026-10-04'
summary: By late July, French authorities reported that the massive Bordeaux wildfire had stopped growing, allowing 84,000 evacuees to return home, while ordering 4,000 more evacuations from other coastal areas. Spain announced that its two major central wildfires were coming under control, but a new heatwave raised concerns about further flare-ups. New climate attribution research concluded that human-caused climate change significantly increased the likelihood of the extreme fire weather.
