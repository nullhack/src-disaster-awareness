title: France orders 4,000 more evacuated as fires displace a third of a million across southwest Europe
body: French authorities have ordered nearly 4,000 more people to evacuate from Atlantic coast tourist sites because of wildfires. The orders issued Tuesday are widening what may be France’s largest peacetime evacuation. Meanwhile, the return of hot weather threatened firefighters’ fragile hold on a vast wildfire west of Bordeaux. Fire crews held the blaze in the Gironde region in check through a calm night, bringing flare-ups near coastal dunes under control and keeping the burned area unchanged at 420 square kilometers (162 square miles). Authorities called the fire stabilized, but not contained, and said it was still capable of breaking loose as temperatures rose and humidity fell.
