title: France, Spain Battle 'Unpredictable' Wildfires As 300,000 Evacuated
body: France fought an "unpredictable" wildfire close to Bordeaux on Sunday while Spain warned of "difficult hours" in its own fiery battle, with evacuations from danger zones in both countries mounting to well over 300,000 people.
