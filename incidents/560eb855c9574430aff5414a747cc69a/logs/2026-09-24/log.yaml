log_date: '2026-09-24'
summary: A magnitude 5.7–5.8 earthquake struck south of Africa on September 20, 2026, with the epicenter located about 500 km from Marion Island at a depth of 10 km, according to the GFZ German Research Centre. Several news reports clarify that the quake occurred far offshore, near the Southwest Indian Ridge, and experts assess that it poses minimal risk to mainland South Africa.
