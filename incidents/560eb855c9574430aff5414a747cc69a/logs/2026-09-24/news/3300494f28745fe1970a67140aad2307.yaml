title: 5.8-magnitude quake hits South of Africa -- GFZ
body: BEIJING, Sept. 21 (Xinhua) -- An earthquake with a magnitude of 5.8 jolted South of Africa at 2054 GMT on Sunday, the GFZ German Research Centre for Geosciences said. The epicenter, with a depth of 10 km, was initially determined to be at 48.41 degrees south latitude and 31.47 degrees east longitude. ■
