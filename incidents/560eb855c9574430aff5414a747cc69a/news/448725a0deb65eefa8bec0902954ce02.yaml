title: Earthquake 500km from Marion Island poses minimal risk to Cape Town, says expert
body: A 5.7-magnitude earthquake occurred near the Southwest Indian Ridge, about 500km from Marion Island. A University of Cape Town geophysics lecturer says its remote location and likely fault movement make significant effects on mainland South Africa unlikely.
