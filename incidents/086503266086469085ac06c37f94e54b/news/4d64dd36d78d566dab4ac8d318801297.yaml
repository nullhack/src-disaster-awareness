title: 'Urgent: 5.5-magnitude quake hits Fiji Islands Region -- GFZ'
body: BEIJING, Aug. 20 (Xinhua) -- An earthquake with a magnitude of 5.5 jolted Fiji Islands Region at 1845 GMT on Wednesday, the GFZ German Research Centre for Geosciences said. The epicenter, with a depth of 565.6 km, was initially determined to be at 17.65 degrees south latitude and 178.61 degrees west longitude. Enditem
