title: Magnitude 5.5 Earthquake Strikes East of Kokopo, Papua New Guinea
body: A magnitude 5.5 earthquake struck east of Kokopo in Papua New Guinea shortly after midnight on September 6. The earthquake was recorded approximately 157 kilometers east of Kokopo, a city in Papua New Guinea's East New Britain Province. The tremor occurred at approximately 12:12 a.m. local time.
