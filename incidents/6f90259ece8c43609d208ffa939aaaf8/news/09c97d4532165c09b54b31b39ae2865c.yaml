title: Saudi defence pact countries push for peace in Tehran as Houthis launch more attacks
body: By Andrew Mills, Ariba Shahid and Menna AlaaElDinKARACHI/CAIRO, Oct 26 (Reuters) - Top officials from Saudi Arabia, Turkey and Pakistan met Iranian officials in Tehran on Monday in a bid to de-escalate the Middle East conflict, as Yemen's Houthis launched new attacks on Saudi Arabia and Egypt approved defence support for the Gulf kingdom.The talks were the first high-level contact between Iran and the three nations — which signed the Mecca mutual defence pact in August — since a war that began with US and Israeli strikes on Iran also spread to Saudi Arabia and Yemen.
