title: Los desplazados internos por el conflicto en Yemen ascienden ya a 268.000, según la OIM - Mundo - ABC Color
body: Ginebra, 23 oct (EFE).- Más de 268.000 personas han abandonado sus hogares debido al recrudecimiento del conflicto en Yemen, especialmente desde inicios de septiembre, indicó este viernes la Organización Internacional para las Migraciones (OIM).
