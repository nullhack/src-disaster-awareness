title: Egypt's parliament authorizes military support for Saudi Arabia to defend against Houthi attacks
body: Egypt’s parliament has voted to authorize President Abdel-Fattah el-Sissi to provide Saudi Arabia with military support in defending the kingdom against attacks by Iran-backed Houthi rebels
