title: 'Yemen: Houthi Attack on Taizz Road Threatens Lives, Welfare'
body: The Houthi armed group on October 18, 2026, used explosives to severely damage a critical road into Yemen’s besieged city of Taizz, putting civilian lives and welfare at increased risk.
