log_date: '2026-10-26'
summary: |-
  Houthi rebels struck a government military camp in southern Yemen, killing at least 53 soldiers. Pope Francis appealed for peace in Yemen, and China and Djibouti issued a joint statement urging the reopening of the Bab al‑Mandeb strait. The Saudi coalition also reported intercepting a ballistic missile after Houthis hit Riyadh airport.
  Egypt’s parliament authorized military support for Saudi Arabia against Houthi attacks. Saudi, Turkish, and Pakistani officials met Iranian counterparts in Tehran to push for de‑escalation, while the Saudi‑led coalition struck Houthi missile launchers and storage facilities. Pope Leo XIV appealed for an end to hostilities and humanitarian access for Taiz.
