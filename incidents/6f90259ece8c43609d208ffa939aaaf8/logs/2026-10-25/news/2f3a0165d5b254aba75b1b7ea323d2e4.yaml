title: Saudi says Riyadh airport partly reopens despite renewed Houthi threats
body: Oct 25 (Reuters) - Saudi Arabia said its main airport resumed operations at two terminals on Sunday even as Yemen's Iran-aligned Houthis vowed to keep striking the facility, saying it remained a "military target".King Khalid International Airport in Riyadh had halted operations on October 10 following an attack claimed by the Houthis that killed 13 people, the deadliest in the kingdom in more than a decade.Saudi Arabia intercepted another wave of missiles and drones on Sunday as fighting with the militant group continued unabated.
