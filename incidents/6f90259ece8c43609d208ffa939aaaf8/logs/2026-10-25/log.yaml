log_date: '2026-10-25'
summary: |-
  Houthi forces launched fresh attacks on Saudi airports, energy sites, and the Yemeni city of Aden on October 25, while Saudi airstrikes reportedly killed 16 people in Sanaa. Riyadh airport announced it would resume flights on Sunday after a two-week closure, and the Saudi-led coalition intercepted two missiles targeting Taif and Yanbu. Separately, Malaysia offered humanitarian assistance and called for renewed negotiations.
  Egypt announced its decision to join the Saudi‑led war against the Houthis, and Yemeni forces intercepted a weapons smuggling operation by Houthi rebels in Shabwa province. Riyadh's King Khalid International Airport partly reopened on Sunday despite renewed Houthi threats and explosions in the capital, while the siege on Taiz deepened with dwindling water supplies.
