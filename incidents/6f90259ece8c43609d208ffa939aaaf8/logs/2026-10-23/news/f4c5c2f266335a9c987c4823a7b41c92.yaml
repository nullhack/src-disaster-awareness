title: All 14 Indians in yacht incident off Yemen coast reported safe, embassy says
body: MUMBAI, Oct 23 (Reuters) - All 14 Indian nationals on a yacht involved in an incident off Yemen's coast are reported safe, the Indian embassy in Yemen said on Friday. Yemen's Iran-aligned Houthis said on Thursday they were rescuing a boat carrying 14...
