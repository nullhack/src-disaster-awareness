log_date: '2026-10-23'
summary: Houthi rebels launched ballistic missiles toward Riyadh and Khamis Mushait, which were intercepted by coalition air defenses, while a strike on a Saudi airport raised the death toll to two. The attacks drove oil prices up and spurred Egypt’s parliament to consider authorizing military involvement in support of Saudi Arabia. Meanwhile, foreign ministers from several nations met in Istanbul to discuss regional conflicts, and all 14 Indian nationals involved in a yacht incident off Yemen’s coast were reported safe.
