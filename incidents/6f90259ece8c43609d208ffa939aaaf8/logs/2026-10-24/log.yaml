log_date: '2026-10-24'
summary: |-
  The UN raised alarms over the worsening humanitarian crisis in Taiz, where Houthi forces have besieged the city, cutting off aid to over 800,000 people. Egypt delayed its parliamentary vote on military support for Saudi Arabia until October 26 and called for diplomatic talks, while a failed Houthi ballistic missile crashed in Yemen, killing a family. The IMF warned that oil prices could average $130 per barrel in 2027 if the conflict continues.
  Houthi forces struck a residential area in Taiz, killing two teenage girls, and Britain announced it would deploy air patrols in response to the escalating conflict. The Saudi-led coalition intercepted another ballistic missile targeting Riyadh, while oil prices rose by US$3 following the attacks. Separately, the United States indicated it would not provide military support to Saudi Arabia, and the IOM reported over 268,000 people have been displaced since the conflict intensified in September.
