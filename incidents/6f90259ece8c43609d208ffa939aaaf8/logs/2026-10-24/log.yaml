log_date: '2026-10-24'
summary: The UN raised alarms over the worsening humanitarian crisis in Taiz, where Houthi forces have besieged the city, cutting off aid to over 800,000 people. Egypt delayed its parliamentary vote on military support for Saudi Arabia until October 26 and called for diplomatic talks, while a failed Houthi ballistic missile crashed in Yemen, killing a family. The IMF warned that oil prices could average $130 per barrel in 2027 if the conflict continues.
