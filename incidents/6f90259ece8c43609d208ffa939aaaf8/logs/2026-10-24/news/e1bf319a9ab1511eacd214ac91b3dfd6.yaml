title: IMF Warns Middle East Oil Could Hit $130 as Economy Faces 1.3% Contraction
body: Oil prices could average $130 a barrel in 2027 if the Middle East conflict continues into the second quarter of next year, the International Monetary Fund (IMF) has warned, highlighting the growing economic costs of disrupted energy production, strained trade routes and rising uncertainty across the region.
