title: Houthi strike on Yemen city kills 2 girls; Britain sends 'defensive' air patrols
body: TAIZ, Yemen (AP) — Iran-backed Houthi rebels struck a residential area in Yemen’s third-largest city on Tuesday, killing two teenage girls and renewing attention on the dangers faced by civilians in Taiz, which has been under attack and siege during the country’s escalating conflict. The Houthis have largely encircled Taiz, cutting it off from most […]
