title: UN sounds alarm on besieged Yemen city Taiz
body: Time is running out to get aid into Taiz, besieged by pro-Iran Houthi fighters who are preventing supplies from reaching Yemen's third-largest city, the United Nations said Friday. Houthi fighters have encircled Taiz since early October, blocking the road that links it to Aden, interim capital of the Saudi-backed, internationally-recognised government. "Safe, sustained and unimpeded humanitarian access is urgently needed so that essential supplies and life-saving assistance can reach people in need," said the UN humanitarian agency OCHA.
