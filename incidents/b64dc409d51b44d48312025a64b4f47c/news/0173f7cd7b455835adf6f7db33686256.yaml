title: 6.8-Magnitude Earthquake Strikes Indonesia, 1.5 Lakh People Experience Tremors
body: A 6.8-magnitude earthquake struck Indonesia near Timor-Leste, with around 150,000 people experiencing light to moderate shaking, according to the USGS.
