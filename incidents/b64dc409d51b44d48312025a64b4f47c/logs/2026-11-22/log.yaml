log_date: '2026-11-22'
summary: A magnitude 6.8 earthquake struck the Banda Sea near Timor-Leste, with GFZ initially reporting it about 226 km northeast of Dili and USGS later placing it roughly 103 km northeast of Lospalos at a depth of about 143 km. The quake was widely felt across Australia’s Northern Territory, including Darwin, with more than 1,600 felt reports, while Australia’s Bureau of Meteorology listed no tsunami watches or warnings. Reports indicated no casualties or damage, and about 150,000 people experienced light to moderate shaking.
