title: Powerful 6.8 Timor Leste earthquake sends tremors right across Greater Darwin area
body: Darwin has just been rattled by a strong earthquake with buidlings and homesrocking. People in high rise buildings and apartments felt heavy shaking which lasted for almost a minute. The quake started as a slow tremor about 7.15pm but quickly escalated into serious shaking and vibrations.
