title: Strong Magnitude 6.8 Earthquake Rattles Darwin as Deep Banda Sea Quake Near Timor-Leste Shakes Top End Again
body: A magnitude 6.8 earthquake in the Banda Sea was felt across Darwin and the Northern Territory, days after another strong quake struck near Indonesia's Tanimbar Islands.
