title: Magnitude 6.8 Earthquake Strikes Banda Sea Near Timor-Leste, GFZ Says
body: Nov 21 (Reuters) - A magnitude 6.8 earthquake struck Banda Sea, 226 km (140 miles) north-east of Dili, Timor-Leste on Saturday, the German Research Center for Geosciences (GFZ) said. The quake was at a depth of 117 km, GFZ said.
