title: ಆಗ್ನೇಯ ಏಷ್ಯಾದ ಟಿಮೋರ್-ಲೆಸ್ಟೆಯಲ್ಲಿ ಭೀಕರ ಭೂಕಂಪ, ಭಯದಿಂದ ಎಲ್ಲೆಂದರಲ್ಲಿ ಓಡಿದ ಜನರು
body: ಭೂಕಂಪದ ಕೇಂದ್ರಬಿಂದುವು ಮೇಲ್ಮೈಯಿಂದ ಸುಮಾರು 90 ಮೈಲುಗಳಷ್ಟು ಕೆಳಗೆ ಇತ್ತು, ಆದರೆ ರಾಜಧಾನಿ ಡಿಲಿ ಮತ್ತು ಆಸ್ಟ್ರೇಲಿಯಾದ ಡಾರ್ವಿನ್ನಲ್ಲಿ ಆಗ್ನೇಯಕ್ಕೆ ಸುಮಾರು 400 ಮೈಲುಗಳಷ್ಟು ಕಂಪನಗಳು ಕಂಡುಬಂದವು.
