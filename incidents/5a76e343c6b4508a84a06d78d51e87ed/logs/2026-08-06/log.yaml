log_date: '2026-08-06'
summary: Throughout late July 2026, the wildfire incident in southern France's Pyrénées-Orientales area escalated dramatically amid a broader crisis of wildfires across southwestern France and Spain. Massive fires forced over 360,000 people to evacuate, with the blaze near Bordeaux prompting 84,000 to return home on July 30 as cooler weather arrived, while a separate fast-moving fire in the Var department flared on July 22. Romania extended its firefighting mission by two weeks, and French firefighters created tree-cutting firebreaks as they described the system at breaking point, with President Macron calling the situation France's biggest challenge since WWII.
