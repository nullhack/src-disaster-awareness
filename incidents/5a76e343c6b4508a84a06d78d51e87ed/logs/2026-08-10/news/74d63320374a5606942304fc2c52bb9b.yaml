title: Over 200 firefighters battle blaze in southern France - Jamaica Observer
body: MENDE, France (AFP) — A fast-moving wildfire was raging in southern France on Sunday, forcing evacuations as more than 200 firefighters raced to contain the blaze. The fire broke out around 12:45 pm (1045 GMT) in the Lozere region, about 140 kilometres (85 miles) northwest of Montpellier. Officials said it might have been sparked by a vehicle catching fire on a local road. By late afternoon, the fire had burned some...
