log_date: '2026-08-10'
summary: In early August 2026, 420 people were arrested in connection with starting the French wildfires, including 166 minors. Volunteers continued to douse small flare-ups, and World War II munitions emerged and detonated in the fire-ravaged Lanton area. Additionally, a new fast-moving wildfire broke out in the Lozère region on August 9, forcing evacuations and drawing over 200 firefighters.
