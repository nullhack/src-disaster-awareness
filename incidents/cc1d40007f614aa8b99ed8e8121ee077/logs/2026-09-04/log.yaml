log_date: '2026-09-04'
summary: A 5.1-magnitude earthquake struck China's Sichuan province on August 28, 2026, adding to regional concerns amid the Nepal flood crisis. Separately, a magnitude 5.0 earthquake hit Tibet, with China activating a Level-IV flood response in the region. Both events occurred within days of monster flash floods that devastated towns in Tibet and bordering areas.
