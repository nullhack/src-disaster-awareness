title: Hurricane Simon rapidly strengths off Mexico's Pacific coast, threatens tourist region
body: Hurricane Simon is rapidly intensifying off Mexico's Pacific coast with maximum sustained winds already near 90 mph (150 kph), the US National Hurricane Center said on Friday.
