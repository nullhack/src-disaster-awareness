title: Hurricane watches issued as Tropical Storm Isaias forms, forecast to intensify and threaten Florida
body: Tropical Storm Isaias formed Wednesday morning with the National Hurricane Center forecasting it to intensify close to a Category 3 storm before bearing down on the Gulf coast and threatening Florida.
