title: Super Typhoon Rosal to hit Thursday, may match Uwan's strength
body: 'The effects of Super Typhoon Rosal (international name: Champi) are expected to be felt on Thursday, October 22, with its intensity potentially matching that of Super Typhoon Uwan in 2025, PAGASA said.'
