title: Vance no longer a hurricane but as a tropical storm still threatens Mexico's Pacific coast
body: Tropical Storm Vance is churning off Mexico’s southwest Pacific coast after a day of gradual weakening but is threatening several western states in that country with heavy rain and possible flash flooding
