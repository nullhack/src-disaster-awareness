title: Tropical storm explodes into hurricane set to batter vacation hotspot — as US triple threat approaches
body: The US faces a tropical triple threat as storms threaten both coasts. Along the Pacific, Rachel closes in on Baja California, while a new system, Simon, rapidly intensifies farther south.
