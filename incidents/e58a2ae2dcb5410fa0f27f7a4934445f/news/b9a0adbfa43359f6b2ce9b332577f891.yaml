title: FIRST ALERT- Tropical moisture from Rachel brings wettest day in a year to Las Vegas
body: Post-Tropical Cyclone Rachel swept through Southern Nevada with heavy rainfall and dangerous winds, making Sunday the wettest day at Reid Airport in more than a year.
