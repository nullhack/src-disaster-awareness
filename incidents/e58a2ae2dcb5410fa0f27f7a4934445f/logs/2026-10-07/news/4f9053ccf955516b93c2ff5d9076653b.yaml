title: Strengthening Isaias expected to hit the U.S. Gulf coast Friday as a hurricane » Yale Climate Connections
body: Isaias is expected to quickly strengthen into the season’s first hurricane by early Thursday – the latest first-forming Atlantic hurricane in reliable records by a wide margin.
