title: Storms cause 5 deaths in Mexico as flood risk eases in southwestern US
body: Hurricane Simon is still pounding Mexico's Pacific coast as it remains offshore. Authorities said Monday that five people have died in Mexico due to the hurricane and the remnants of Tropical Storm Rachel. Rachel caused street flooding and other damage in Mexico’s Baja California state. Four people died after Rachel swept through over the weekend and at least six were missing. The storm's remnants also caused flooding in the southwestern U.S. The risk had mostly ended by Monday evening. Power was gradually being restored after Hurricane Isaias hit the U.S. Southeast.
