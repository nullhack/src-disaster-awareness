title: Post-tropical storm lashing southwest with coastal flooding, heavy rain and strong winds | CNN
body: The remnants of Tropical Storm Rachel are soaking Southern California and the Desert Southwest after moving over land early Sunday morning. The storm is bringing a threat of coastal flooding, high winds and inland flash flooding Sunday.
