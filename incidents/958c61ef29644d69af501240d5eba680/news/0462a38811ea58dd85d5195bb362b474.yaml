title: Blue Devils stuff Tulane 17-3 in home opener for 2026 season
body: Blue Devils (1-0) got the game started a little late due to a 90-minute delay as severe weather moved through central North Carolina on Saturday. The delay didn't stop running back Nate Sheppard from having an explosive day, as he ran for a career-high 227 yards.
