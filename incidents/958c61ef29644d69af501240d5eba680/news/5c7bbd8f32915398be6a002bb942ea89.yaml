title: 'N.Y. weather: Severe storms, damaging winds to threaten parts of the state'
body: Forecast conditions will support isolated to scattered severe thunderstorms this evening, with damaging winds as the primary threat. The Weather Service noted that an isolated tornado could develop, though that is not the primary concern.
