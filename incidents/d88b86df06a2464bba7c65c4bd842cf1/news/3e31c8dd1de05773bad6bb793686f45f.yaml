title: Gary residents still in the dark as power outage could drag for 2 weeks after last week's deadly storms
body: The state's utility company NIPSCO reported that over 60% of its customers — roughly over 370,000 homes — lost power during the Aug. 11 storm and subsequent days of severe weather. And while many customers across the state have their lights back on, about 22,000 customers in Gary were still without…
