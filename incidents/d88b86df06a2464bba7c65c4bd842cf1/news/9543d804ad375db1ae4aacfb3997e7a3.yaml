title: Dept. of Land and Natural Resources prepares for Lala by clearing stream channels, ensuring dam safety | Maui Now
body: With Tropical Storm Lala on approach and a hurricane watch in effect for Hawaiʻi Island and surrounding waters, the Department of Land and Natural Resources is working to prepare communities across the state for severe weather.
