title: NIPSCO says about 128K customers still without power as of early Sunday afternoon after series of severe storms last week - AOL
body: Power is still being restored to thousands of Northwest Indiana residents after a series of deadly severe storms slammed the area last week, causing what NIPSCO said has been the "largest and most widespread outage event on record."
