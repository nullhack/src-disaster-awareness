title: Deaths and Damage Reported as Severe Weather in the Midwest Spawns Tornadoes and Flash Flooding
body: COLUMBUS, Ohio (AP) — First responders rescued more people from floodwaters Wednesday as utility crews cleared trees and wires downed by severe storms in the Midwest that unleashed tornadoes, heavy rains and flash flooding, leaving hundreds of thousands of customers without electricity.
