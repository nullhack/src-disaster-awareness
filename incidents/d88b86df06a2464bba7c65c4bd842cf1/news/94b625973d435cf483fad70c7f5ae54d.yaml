title: NASCAR Race at Richmond Raceway Postponed as Storms Disrupt Schedule
body: The NASCAR Craftsman Truck Series race at Richmond Raceway will not go ahead as planned after severe weather forced officials to postpone Friday night’s event. The Black’s Tire 250 presented by BTS Rewards, the 17th race of the 2026 NASCAR Craftsman Truck Series season, was delayed for nearly two hours before NASCAR called off the […] The post NASCAR Race at Richmond Raceway Postponed as Storms Disrupt Schedule appeared first on HEAVY.
