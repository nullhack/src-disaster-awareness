title: Pike County residents encouraged to report storm damage - AOL
body: HENDERSON, Ky. (WEHT) – State Senator Daryl Schmitt encourages Pike County residents impacted by the recent severe weather to report damage. “Last week, I toured the damage caused by a tornado in Winslow,” Schmitt said. “I’m incredibly grateful for the first responders, local officials, utility crews, volunteers and residents who are working together to help their […]
