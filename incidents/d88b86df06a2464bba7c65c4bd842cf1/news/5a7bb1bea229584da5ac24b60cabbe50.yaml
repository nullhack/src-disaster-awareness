title: Severe weather knocks out power in Illinois, Indiana and Ohio as 'ring of fire' strikes Midwest
body: Severe weather has cut power to over half a million people in the Chicago area, Indiana and Ohio. Perilous thunderstorms and extreme wind gusts pummeled the region on Tuesday, as tornado sirens howled and the skies darkened.
