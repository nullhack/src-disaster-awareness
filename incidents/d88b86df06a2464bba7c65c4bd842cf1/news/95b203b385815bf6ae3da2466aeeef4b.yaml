title: What We Know About the Storms Battering the Midwest
body: A lingering weather system has brought severe flooding and intense winds — including a few tornadoes — to Illinois, Indiana and Ohio, killing at least eight. By Jacey Fortin Roads collapsed into sinkholes in Indiana. Roofs tore off buildings in Illinois.
