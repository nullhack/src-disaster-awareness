title: Severe thunderstorms clear out Thursday morning, more storm chances on the way
body: Thunderstorms rolled through Siouxland early Thursday morning providing some of the area with some much-needed rain! Some of those thunderstorms became severe while some became tornado warned in southern Siouxland.
