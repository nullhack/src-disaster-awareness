title: Localized heavy rainfall likely Friday morning, storm chances continue into the weekend
body: Heavy rain has fallen across Siouxland early Friday morning. With more rain expected, the National Weather Service has issued a Flood Watch for our far eastern Siouxland counties until 10 am Saturday.
