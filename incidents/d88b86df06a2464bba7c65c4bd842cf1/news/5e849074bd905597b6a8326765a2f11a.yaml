title: A software glitch prevented weather warnings from going out as deadly storms struck Midwest
body: An unusually long and far-reaching communications outage hobbled the National Weather Service just as deadly severe thunderstorms were tearing across the Midwest and Ohio Valley on Tuesday evening.
