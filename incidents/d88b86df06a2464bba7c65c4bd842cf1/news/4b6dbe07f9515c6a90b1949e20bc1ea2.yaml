title: Severe storms and flooding still possible in Western Pa.
body: Severe storms are likely still on tap Tuesday in Western Pennsylvania. Jason Frazier, meteorologist at the National Weather Service in Moon, said Tuesday morning that the weather pattern over the next 24 hours includes damaging winds and flooding risks for the region. “The potential is there — it’s not guaranteed,”
