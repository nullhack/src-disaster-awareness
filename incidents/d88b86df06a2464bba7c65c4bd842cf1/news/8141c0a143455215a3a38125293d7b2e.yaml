title: 5 dead after severe weather sweeps across Indiana
body: Indiana authorities said Saturday at least five people have died as a result of the severe weather over the past week. That includes a boy killed when a tree fell on his home, a woman who was swept away after driving into floodwaters and a teen who was reported missing after jumping in to a river on Wednesday.
