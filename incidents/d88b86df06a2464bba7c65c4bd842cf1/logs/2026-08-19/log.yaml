log_date: '2026-08-19'
summary: Illinois Governor JB Pritzker issued a State Disaster Proclamation on August 18 following recent severe weather across the state that caused damage from torrential downpours, flash flooding, straight-line winds, and tornadoes. Indiana continued to deal with the aftermath of historic flooding, with Conner Prairie's corn maze remaining flooded and over 30,000 without power in Wisconsin after severe storms prompted tornado warnings in the Milwaukee area.
