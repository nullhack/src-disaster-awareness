title: 'Evidence suggests 3 tornados strike Ohio Aug. 11-15: NWS - AOL'
body: Last week saw severe weather throughout the Miami Valley and the National Weather Service is continuing to investigate the damage. Focusing on two specific weather events, the department is surveying damage that happened Tuesday and Saturday of last week. While information is still relatively limited, the NWS has confirmed three tornados struck the state as […]
