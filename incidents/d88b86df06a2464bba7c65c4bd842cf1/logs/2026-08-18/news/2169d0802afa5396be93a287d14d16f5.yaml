title: Over 4K in Catawba County without power after severe storms - AOL
body: CATAWBA COUNTY, N.C. (QUEEN CITY NEWS) — Over 4,000 customers are without power in Catawba County after a band of severe weather moved through the area Monday night. As of 9:30 p.m., 4,446 customers are without power, according to Duke Energy. The estimated time of restoration is 5:15 a.m. on Tuesday. The county remains under […]
