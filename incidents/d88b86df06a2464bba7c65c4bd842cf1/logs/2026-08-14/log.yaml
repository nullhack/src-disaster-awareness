log_date: '2026-08-14'
summary: A major derecho storm system caused severe flooding across Ohio and Indiana, with Perry County, Ohio recording over 6 inches of rain and Wayne County, Indiana seeing over 9 inches. The National Weather Service confirmed an EF1 tornado touched down in south Columbus on August 11 during the storms. Additional severe thunderstorms and warnings were reported in Phoenix, Siouxland, and Cape Breton, while officials in Ohio warned of overnight flooding risks.
