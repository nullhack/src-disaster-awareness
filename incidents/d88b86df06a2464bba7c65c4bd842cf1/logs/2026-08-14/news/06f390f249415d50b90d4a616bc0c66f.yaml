title: 'Editorial: Make ready for severe weather | Honolulu Star-Advertiser'
body: After months of warnings, Hawaii this weekend finds itself directly in the path of a powerful weather system influenced by an unusually powerful — and still building — El Nino, with all islands expected to see heavy rain, gusty winds, menacing surf and generally bad weather. As if residents of this state need another life-threatening reminder that climate change, and its effects, are indeed real.
