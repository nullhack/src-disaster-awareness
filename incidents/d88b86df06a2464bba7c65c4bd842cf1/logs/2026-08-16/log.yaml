log_date: '2026-08-16'
summary: The White River in Indiana shattered a 113-year flood record following a 1-in-1,000-year rain event, prompting Governor Braun to declare a Statewide Disaster Emergency and request federal aid, which President Trump approved. At least five deaths have been reported in Indiana due to the storms, and nearly 175,000 customers remain without power in Northwest Indiana. Additionally, a flood watch is in effect for central Ohio as more storms threaten the region.
