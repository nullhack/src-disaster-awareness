title: Lingering showers and storms this weekend, bracing dangerous heat next week
body: Warm and muggy start to the weekend in the middle 70s. It will get hot in a hurry with temperatures climbing to the mid to upper 90s. Heat Advisories are in effect from 12pm-8pm for all of South Georgia. Heat indices will range from 105-110. PM thunderstorms possible for some.
