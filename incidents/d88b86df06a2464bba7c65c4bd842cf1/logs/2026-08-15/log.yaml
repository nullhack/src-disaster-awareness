log_date: '2026-08-15'
summary: |-
  Severe storms associated with the "ring of fire" pattern have cut power to over half a million homes in the Chicago area, Indiana, and Ohio. A state of emergency was declared in Hamilton County, Indiana, amid flash flooding, and NIPSCO reported 172,000 customers still without power in northern Indiana, calling it the largest outage event in its history.
  The 2026 Gary Air Show in Indiana has been canceled due to devastating storm damage from the recent derecho that swept through the Midwest.
