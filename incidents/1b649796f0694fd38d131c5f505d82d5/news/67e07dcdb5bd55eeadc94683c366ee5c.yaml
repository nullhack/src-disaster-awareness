title: DSWD prepositions 218K food packs amid Taal unrest
body: The Department of Social Welfare and Development (DSWD) mobilized regional relief supplies following a minor phreatomagmatic eruption of Taal Volcano. The agency has more than 218,000 family food packs, 9,700 non-food item kits, over 11,100 ready-to-eat meal packs, and ₱291.35 million in Quick Response Fund to support communities in Batangas and nearby areas affected by volcanic activity and ashfall.
