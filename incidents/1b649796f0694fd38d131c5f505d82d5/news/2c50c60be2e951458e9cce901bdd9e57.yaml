title: PhilSA map shows spread of Kanlaon Volcano's sulfur dioxide emissions
body: The Philippine Space Agency (PhilSA) released on Wednesday a satellite map showing the spread of sulfur dioxide (SO2) emissions from Kanlaon Volcano on Negros Island following its explosive eruption on October 10.
