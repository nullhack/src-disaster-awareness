title: Taal logs minor eruption
body: Taal Volcano recorded a minor phreatomagmatic eruption early Thursday, sending a plume 1,200 meters above its crater. Phivolcs maintains Alert Level 1 and warns the public to stay away from the volcano’s permanent danger zone.
