log_date: '2026-10-23'
summary: On October 20, Taal Volcano had a minor phreatic eruption with a plume rising approximately 300 meters above the crater. Two days later, on October 22, a minor phreatomagmatic eruption generated a 1,200-meter plume. The Philippine Institute of Volcanology and Seismology (Phivolcs) maintains Alert Level 1 and advises the public to avoid the permanent danger zone, as this marks the fifth eruption recorded in October.
