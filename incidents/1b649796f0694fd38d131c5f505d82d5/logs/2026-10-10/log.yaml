log_date: '2026-10-10'
summary: Following the phreatomagmatic eruption on October 8, the Department of Social Welfare and Development mobilized emergency relief supplies, including more than 218,000 family food packs and a Quick Response Fund of ₱291.35 million, for affected communities in Batangas. Additionally, Taal Volcano recorded 20 volcanic earthquakes and 9 volcanic tremors lasting 2–7 minutes in the subsequent 24 hours, signaling continued unrest.
