log_date: '2026-10-09'
summary: On October 8, 2026, Taal Volcano in Batangas, Philippines, experienced a minor phreatomagmatic eruption lasting about five minutes, emitting a dark gray ash plume that rose approximately 4,000 meters. The Philippine Institute of Volcanology and Seismology (Phivolcs) warned of possible ashfall, and over 100 residents from Agoncillo were evacuated as a precaution.
