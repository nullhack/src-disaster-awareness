title: Magnitude 5.5 earthquake hits southern Alaska
body: A notable earthquake struck in Alaska'sKodiak Island Borough on Oct. 6, the United States Geological Survey reported. The quake measured a preliminary magnitude 5.5, the USGS said, with the epicenter located about 57 miles northwest of Aleneva.
