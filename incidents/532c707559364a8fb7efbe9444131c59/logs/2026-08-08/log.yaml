log_date: '2026-08-08'
summary: Guatemala raised a nationwide orange alert and ordered evacuations of nearby communities after Fuego volcano entered a new eruptive phase on Monday, August 4, 2026, spewing ash, gas, and lava. Hundreds of people were evacuated from two villages, and about 1,700 remained in shelters as authorities reported decreasing activity but persistent risks from ash and mudflows.
