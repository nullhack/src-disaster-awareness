title: Watch a powerful explosion tear through Guatemala's Fuego volcano
body: Guatemala's Fuego volcano produced an explosive eruption, sending a large plume of ash high above the summit. The dramatic burst sent volcanic material into the air as the ash cloud rapidly expanded over the volcano.
