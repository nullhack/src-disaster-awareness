title: Guatemala evacuated two villages as Fuego volcano turns toward a more explosive phase
body: Guatemalan authorities ordered the evacuation of two villages near the Volcan de Fuego in early August 2026 after the mountain intensified and disaster officials warned it was shifting toward a more explosive phase.
