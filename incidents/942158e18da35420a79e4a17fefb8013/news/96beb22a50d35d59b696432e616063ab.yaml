title: More global extremes in July
body: July 2026 will be remembered as another month of wild weather extremes across the United States and around the world. During the month, record-breaking heat was observed along with destructive flooding, severe thunderstorms, wildfires, drought, and unusually warm oceans, thanks to the evolving new El Nino.
