title: Mudslide kills 2 and leaves 10 missing in China after heavy rain from Typhoon Saudel
body: A mudslide in eastern China has killed two people and left 10 missing. The disaster, which occurred Saturday in Suichuan County, Jiangxi province, followed days of heavy rain from Typhoon Saudel.
