log_date: '2026-08-18'
summary: As of August 14, a mudslide in eastern China killed one person amid continued heavy rain, with authorities warning of more downpours. Typhoon Dolphin caused flooding in Wenzhou, with rescue crews searching flooded homes in Yueqing. Chinese President Xi Jinping ordered strengthened disaster prevention and emergency response systems as floods, landslides, and typhoon-related weather continued to batter several parts of China.
