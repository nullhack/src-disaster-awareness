title: Tourists evacuated from China's Jiuzhaigou World Heritage site after mudslides, heavy rain - VnExpress International
body: China evacuated stranded tourists from the UNESCO World Heritage site of Jiuzhaigou on July 27 after mudslides triggered by heavy rain, reported state broadcaster CCTV, as the authorities issued the highest flash-flood alert for parts of the country in the wake of Typhoon Noul.
