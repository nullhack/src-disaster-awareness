log_date: '2026-07-27'
summary: Flooding from Typhoon Noul has caused mass evacuations in Guangdong Province, with over 715,000 relocated and at least 10 deaths reported. In southern China, floodwaters decimated a private zoo, leaving dozens of animals missing and surviving animals facing critical food shortages. Additionally, a flash flood at a camping site in northwest China killed 10 people and injured 23.
