log_date: '2026-07-28'
summary: A 7.1-magnitude earthquake struck southern Japan's Kyushu island near Kumamoto on July 28, 2026, causing a shopping mall to partially collapse with multiple people trapped and feared dead. The quake knocked out power to thousands of homes, ruptured roads, triggered a temporary tsunami advisory, and left dozens injured, with up to 30 mall employees missing after an explosion.
