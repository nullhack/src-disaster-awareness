title: A magnitude 7.1 earthquake shakes part of southern Japan and a tsunami advisory is issued
body: An earthquake registering a preliminary magnitude of 7.1 shook Kumamoto on Japan's southern main island of Kyushu late Tuesday afternoon and a tsunami advisory was issued, the Japan Meteorological Agency said.
