title: Raging wildfire forces evacuations in Castellon in Spain's Valencia region
body: Wildfires across Spain continue to give concern as a new blaze broke out in the eastern province of Castellon, Valencia. 15,000 people have had to be evacuated from their homes near the Uixó Valley as the forest fire swept towards homes.
