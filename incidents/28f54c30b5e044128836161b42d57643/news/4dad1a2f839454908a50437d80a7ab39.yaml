title: Spanish firefighters fight wildfire amid heat wave | Arkansas Democrat Gazette
body: BARCELONA, Spain -- Firefighters in central Spain battled a wildfire on Wednesday that has burned over 79,000 acres in one of the country's largest blazes on record.
