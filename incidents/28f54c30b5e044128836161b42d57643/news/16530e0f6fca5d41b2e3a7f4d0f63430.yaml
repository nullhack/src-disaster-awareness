title: More than 200,000 people flee raging wildfires in France and Spain, some escaping by boat
body: Massive forest fires are raging out of control in southwestern France and central Spain, forcing authorities to evacuate around 200,000 people. Dozens of firefighters have been injured, but no deaths have been reported. In France, 141,000 people have fled from the Gironde and Landes departments. In Spain, 60,000 have been evacuated. The fires have consumed large areas since Wednesday, with strong winds complicating efforts to control them. Both countries have requested help from the European Union. The fires are being fueled by a heatwave, with temperatures soaring and conditions worsening.
