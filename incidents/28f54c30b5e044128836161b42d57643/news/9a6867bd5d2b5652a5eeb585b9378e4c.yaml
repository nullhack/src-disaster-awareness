title: 150,000 evacuated as wildfires rage in France and Spain
body: French authorities ordered the total evacuation of the Cap Ferret peninsula on the Atlantic Coast, sending boats to remove people from an area threatened by a major wildfire, while 40,000 people have been told to evacuate or shelter in the Madrid region.
