title: France and Spain battle wildfires as more than 250,000 people are forced to flee homes
body: France is using a massive cargo aircraft to dump flame retardants on a wildfire near the wine country city of Bordeaux. The fire has forced tens of thousands to evacuate, with winds threatening to push it closer to the city. French Interior Minister Laurent Nunez described the battle as “long and very difficult.” Soldiers and firefighters are working to contain the blaze, which has reached unprecedented strength. French officials slashed the length of the final stage of the Tour de France on Sunday so more police could be deployed to the wildfire zones. In Spain, wildfires have displaced over 70,000 people. High temperatures and climate change have fueled these fires, catching authorities off guard.
