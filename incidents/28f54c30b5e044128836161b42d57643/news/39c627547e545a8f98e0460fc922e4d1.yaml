title: France wildfire forces thousands to flee as tinder box conditions persist in warming Europe
body: By Stephane Mahe LEGE-CAP FERRET, France, July 23 (Reuters) - A fast-moving wildfire has forced more than 10,000 people from homes and campsites near France's Atlantic coast, as extreme heat and deepening drought fuelled fires across Europe and scientists warned that climate change was worsening the continent's water shortages.
