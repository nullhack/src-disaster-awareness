title: France sends boats to evacuate tourist hotspot Cap Ferret as wildfires rage
body: French authorities ordered the complete evacuation of the Cap Ferret peninsula on Friday, launching boats to help rescue people from the popular tourist destination as wildfires tear across western Europe.
