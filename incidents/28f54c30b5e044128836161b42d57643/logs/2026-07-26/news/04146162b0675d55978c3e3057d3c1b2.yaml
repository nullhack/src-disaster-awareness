title: France, Spain fight on against wildfires | Arkansas Democrat Gazette
body: LEGE-CAP FERRET, France -- France sent a hulking military cargo plane to dump tons of flame retardants as it battled raging wildfires on Saturday and slashed the final stage of the Tour de France to redeploy security personnel to the blazes that forced tens of thousands of people to flee their homes.
