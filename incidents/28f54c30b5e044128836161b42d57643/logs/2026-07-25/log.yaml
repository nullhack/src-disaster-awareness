log_date: '2026-07-25'
summary: By July 24-25, wildfires in southwestern France and central Spain forced over 200,000 people to evacuate, with France reporting 141,000 evacuees from the Gironde and Landes departments and Spain evacuating 60,000. French President Emmanuel Macron ordered military mobilization as a blaze approached the city of Bordeaux, while Spain's national emergency declaration covered the Madrid region and Avila province. Dozens of firefighters were injured but no deaths were reported.
