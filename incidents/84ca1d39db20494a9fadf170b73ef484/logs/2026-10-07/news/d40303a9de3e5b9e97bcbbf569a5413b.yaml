title: 'Earthquake in Russia: 5.8 Magnitude Quake Hits off Coast of Vilyuchinsk in Kamchatka'
body: A magnitude 5.8 earthquake struck 165 km south-southeast of Vilyuchinsk in Russia's Kamchatka region at a depth of 29 km on October 2, 2026, according to the USGS. The offshore tremor occurred along the active Kuril-Kamchatka subduction zone.
