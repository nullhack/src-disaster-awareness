title: A magnitude 5.9 quake off Russia's Kuril Islands on Oct. 6 tied for the week's largest worldwide
body: 'Seismometers worldwide recorded a magnitude 5.9 earthquake at 16:48 UTC on Oct. 6, centered 264 kilometers south-southwest of Severo-Kuril''sk in Russia''s Kuril Islands and about 26 kilometers deep. It matched the strongest quake of the previous seven days without exceeding it: a second magnitude 5.'
