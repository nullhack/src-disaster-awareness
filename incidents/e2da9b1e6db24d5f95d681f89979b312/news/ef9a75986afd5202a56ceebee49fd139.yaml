title: 5.9-magnitude quake shakes China’s central Qinghai province - Jamaica Observer
body: BEIJING, China (AFP)—A shallow earthquake of magnitude 5.9 struck in China&#039;s central Qinghai province early Wednesday, the US Geological Survey said. The quake was situated in a mountainous rural area, 269 kilometers southeast of the city of Dunhuang and had a depth of 10 kilometers. The China Earthquake Networks Center (CENC) registered the tremor at a magnitude 5.6, Xinhua reported.
