title: More than 200,000 people flee raging wildfires in France and Spain, some escaping by boat
body: Massive forest fires burned out of control in southwestern France and central Spain on Friday, prompting authorities to evacuate an estimated 200,000 people from their homes. Some even fled by boat when flames swept through the touristic area on France’s Atlantic coast.
