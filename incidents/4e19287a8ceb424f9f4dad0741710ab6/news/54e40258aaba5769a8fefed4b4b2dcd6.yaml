title: «دولفين» يهدد شرق آسيا بأمواج عالية وأمطار غزيرة وفيضانات خطرة
body: يواصل الإعصار المداري الشديد (دولفين) تحركه فوق مياه المحيط الهادئ متجهًا نحو السواحل الشرقية لقارة آسيا، وسط حالة تأهب واسعة في الدول الواقعة ضمن مساره المتوقع.
