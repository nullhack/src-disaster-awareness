title: Typhoon Dolphin threatens eastern China amid active cyclone season
body: Typhoon Dolphin, the year's 13th named storm, is expected to move westward at 20 to 25 kilometers per hour and will not affect China's coastal waters before Thursday, according to the China Meteorological Administration.
