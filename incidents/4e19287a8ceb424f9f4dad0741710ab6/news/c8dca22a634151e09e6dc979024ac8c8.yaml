title: Typhoon Dolphin Hits China’s East Coast; 3 Lakh Evacuated, Shanghai Airports Cancel 1300 Flights
body: Typhoon Dolphin made landfall in China’s Zhejiang with 151 kph winds, forcing 3 lakh evacuations and 1300 flight cancellations, while intensified monsoon rains in the Philippines caused floods, landslides and left 7 missing.
