title: Typhoon Dolphin Deepens China Port Congestion, Stranding 2.4M TEUs
body: The storm forced three-day closures at China's Shanghai and Ningbo ports, with vessel backlogs expected to take weeks to clear and berthing times reaching as high as 12 days.
