log_date: '2026-08-10'
summary: Typhoon Dolphin made landfall on China's Zhejiang coast with winds of 151 kph, triggering the evacuation of 300,000 to 1 million people and cancellation of 1,300 flights at Shanghai airports. China issued its highest typhoon warning as the storm brought torrential rain and dangerous conditions across the region, while Hong Kong recorded its highest temperature since 1884 under the storm's influence.
