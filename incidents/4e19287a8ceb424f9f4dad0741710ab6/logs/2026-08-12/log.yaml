log_date: '2026-08-12'
summary: Typhoon Dolphin's aftermath continues to disrupt China, with torrential rains grounding nearly 950 Shanghai flights and flooding streets, while port congestion at Shanghai and Ningbo has stranded 2.4 million TEUs of cargo, expected to take weeks to clear. The storm, now weakened to a tropical storm, has moved inland, causing floods that impact roads, construction, and tourism. Additionally, combined effects of the southwest monsoon and Typhoon Dolphin have resulted in 12 deaths and 8 missing in the Philippines.
