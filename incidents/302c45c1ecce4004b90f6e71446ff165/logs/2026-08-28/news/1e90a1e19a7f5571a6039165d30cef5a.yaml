title: Amit Shah says Gujarat stayed drought-free after PM Modi's water push
body: Home Minister Amit Shah inaugurated a 21-acre lake in Amreli and said Gujarat's water landscape changed after 2001. He claimed sustained conservation efforts under Prime Minister Narendra Modi helped the state avoid drought-like distress.
