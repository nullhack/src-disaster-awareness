title: '‘A perfect storm’: Southern Colorado river rafting industry weathers tough season amid drought, wildfire'
body: A punishing summer of record heat, severe drought, and regional wildfires has taken a notable toll on Southern Colorado’s river rafting industry as outfitters bring their 2026 commercial season to a close.
