log_date: '2026-09-24'
summary: New drought developments include a Henderson County, Texas disaster declaration and extended water restrictions in Southwest Florida. The El Niño threat is intensifying, with Delhi recording its earliest monsoon withdrawal in 24 years, while a new drought risk tool becomes available globally. Additional impacts include a muted fall color season in Oklahoma, a tough season for Colorado's river rafting industry, and volunteers rescuing mussels from the drought-hit Vltava River in the Czech Republic.
