summary: New drought developments include Norfolk, Virginia issuing a Condition II drought notification urging conservation; a water emergency declared for Chatham; and Halifax County, Virginia restricting bulk water hauling due to worsening drought conditions. Across the western US, bear sightings have spiked as drought limits natural food sources, while South Florida experienced an unusually dry summer with record heat and below-average rainfall.
