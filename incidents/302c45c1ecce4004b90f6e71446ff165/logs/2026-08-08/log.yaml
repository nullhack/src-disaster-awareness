log_date: '2026-08-08'
summary: As of August 7, 2026, Lake Mead hit its lowest water level on record at 1,040.5 feet, continuing to fall daily. North Dakota Governor Armstrong declared a statewide fire emergency as drought conditions intensify, with more than half the state now experiencing drought and the National Guard on high readiness. In the central US, drought conditions have entered Central New York, while Iowa and parts of Virginia saw slight improvements after recent rains. New threats emerged with North Carolina health officials warning of increased West Nile virus risk due to drought, and farmers across multiple states face tough choices amid ongoing dry conditions and high costs.
