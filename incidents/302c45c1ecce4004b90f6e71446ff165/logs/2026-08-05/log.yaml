log_date: '2026-08-05'
summary: Corpus Christi, Texas eased from Stage 3 to Stage 2 water restrictions after 18 months as reservoir levels rebounded, while Colorado reported a 68% spike in bear activity due to extreme drought. In Europe, the Danube River's record-low levels exposed Nazi-era warships and mammoth bones, and the UK Met Office warned that rain may still miss the driest areas. El Niño continues to intensify drought risks across Asia and Southeast Asia, and Jamaica allocated an additional $60 million to support farmers.
