title: Drought considered severe in southern UP
body: IRON MOUNTAIN — Two months of below-normal rainfall has led to severe drought in parts of Dickinson, Iron and Menominee counties, along with bordering Wisconsin communities. Locally, September has produced about a quarter-inch of rain since the U.S. Drought Monitor’s latest update, but more showers are needed to ease a summer deficit of several inches. […]
