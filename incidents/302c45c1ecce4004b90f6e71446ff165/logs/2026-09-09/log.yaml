log_date: '2026-09-09'
summary: New drought developments include the U.S. experiencing its hottest August, summer, and year-to-date on record, according to NOAA, with deepening drought, shrinking reservoirs, and severe wildfire impacts. In the UK, South East Water applied for a drought permit as a key reservoir fell to critical levels, warning that 100,000 homes could face water rationing this winter. Severe drought conditions also expanded in Michigan's Upper Peninsula due to below-normal rainfall, while a controlled water release in New Mexico's Rio Grande and irrigation caps at Nebraska's Lake McConaughy highlight ongoing water management challenges.
