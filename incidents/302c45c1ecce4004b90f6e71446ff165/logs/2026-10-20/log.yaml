log_date: '2026-10-20'
summary: 'Drought conditions are showing mixed trends across the United States: improving in Texas, Virginia, and South Carolina, but worsening in Southcentral Kentucky, while severe drought continues in Durham County, North Carolina, and nearly two‑thirds of Idaho remains in drought. Meanwhile, the receding waters of Lake Mead—a consequence of the prolonged drought—led to the identification of a victim whose remains were exposed in a barrel four years ago.'
