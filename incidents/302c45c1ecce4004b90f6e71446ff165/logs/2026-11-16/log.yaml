log_date: '2026-11-16'
summary: Southeast Louisiana and southern Mississippi saw little to no rain, further worsening conditions in the latest Drought Monitor. Economists warned that India's grain stocks can absorb one bad El Niño year but a second consecutive event could drain the buffer within two to three years. A rapid analysis also found that human-caused climate change significantly amplified extreme heat during Indonesia's 2026 fire season, turning an El Niño-driven drought into a severe regional crisis.
