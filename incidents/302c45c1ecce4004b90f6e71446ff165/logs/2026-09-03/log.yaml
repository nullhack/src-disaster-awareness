log_date: '2026-09-03'
summary: The UK officially confirmed that summer 2026 was its hottest on record since 1884, with most of England and Wales still in drought after five heatwaves. The UN warned that the El Niño event is set to become "very strong" and persist until February, potentially intensifying global drought conditions. Other developments include drought-displaced Angolans facing human rights abuses and new research funding for drought-tolerant crops.
