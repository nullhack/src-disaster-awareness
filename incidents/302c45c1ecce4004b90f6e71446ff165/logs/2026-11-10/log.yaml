log_date: '2026-11-10'
summary: Satellite images reveal Lake Dillon in Colorado shrinking due to persistent drought, while record rainfall in the U.S. Southwest has brought rare relief, raising Lake Powell by 20 feet. In Papua New Guinea, the ecological toll of an El Niño drought is emerging years later as tree mortality increases. The ongoing El Niño is described as a polycrisis causing simultaneous drought, heat, and floods with impacts on health and energy systems.
