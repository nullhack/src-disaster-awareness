title: A punishing European drought shrivels crops from Dutch potatoes to Bosnian corn
body: A drought that is slamming Europe this summer is hitting farmers across Europe hard. From potatoes and onions in the Netherlands and the United Kingdom to Bosnian corn fields and Italian vineyards, harvests are happening early and yields are expected to be down as bone-dry weather stunts crops.
