title: Drought reveals Emperor Nero's bridge beneath Rome's Tiber river
body: Weeks without rain have caused Italy's Tiber River to fall to unusually low levels, revealing the remains of an ancient Roman bridge near the Vatican. Traditionally known as Nero's bridge, archaeologists believe the structure may actually date back to the reign of Emperor Caligula.
