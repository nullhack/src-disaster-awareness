title: Peace region rivers report above normal to drought level one conditions, says latest update
body: According to the portal, the Peace River above the Pine River shows above-normal water-level ratings. The province's low streamflow report shows the Beatton River Near Fort St. John ranking in the 76th to 90th percentile, labelling it as "above normal." Similarly, the Peace River near Taylor also records "above normal" conditions.
