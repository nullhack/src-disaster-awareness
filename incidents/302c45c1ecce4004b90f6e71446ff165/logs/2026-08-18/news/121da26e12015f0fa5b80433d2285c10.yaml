title: Thousands flee yearslong drought in Somalia as hunger deepens and aid shrinks
body: One Somali family's long trek to escape drought conditions is an example of a deepening humanitarian emergency in Somalia, where years of drought, conflict and economic pressures are pushing more families from rural communities into displacement camps as hunger rises and humanitarian funding shrinks
