log_date: '2026-10-22'
summary: |-
  Recent reports indicate drought remains widespread: extreme drought now covers 44% of Puerto Rico, and Maine's statewide drought persists despite recent rain. In New Mexico, drought and late-season monsoon floods have damaged centuries-old acequias, while nearly two-thirds of Idaho (65.8%) is in drought according to the U.S. Drought Monitor.
  In Arkansas, drought-like conditions have spurred an early harvest for most crops. In Salt Lake City, a bark beetle outbreak fueled by drought and record heat is threatening evergreens, prompting guidance for homeowners. Despite recent precipitation, drought has now reached all areas of Maine, with statewide conditions persisting.
