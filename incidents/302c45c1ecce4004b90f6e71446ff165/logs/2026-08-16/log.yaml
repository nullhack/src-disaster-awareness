log_date: '2026-08-16'
summary: In Puerto Rico, roughly half a million people face 48-hour water cuts due to drought and infrastructure issues. London is expected to receive rain at the end of a record dry summer, which may help parched parks but not fully alleviate the drought. In the UK, a political group blames immigration for hosepipe bans affecting 26 million in England and Wales; in Georgia, a statewide drought declaration has been extended; and Utah is exploring the use of beavers to improve drought and wildfire resilience.
