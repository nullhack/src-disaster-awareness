log_date: '2026-11-24'
summary: Pelham, Alabama's fire chief issued a Thanksgiving warning urging residents not to delay calling 911 as drought-dried conditions raise emergency risk across the state. In Pakistan, Sindh announced Rs5.3 billion in drought relief for Thar and Umerkot, alongside Rs4,000 per acre for wheat growers under the 2026-27 support programme. Three Pacific governments also stepped up their response as El Niño-driven drought and water crises deepen in their nations.
