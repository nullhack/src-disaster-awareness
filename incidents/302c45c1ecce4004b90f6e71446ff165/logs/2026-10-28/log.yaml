log_date: '2026-10-28'
summary: New drought developments include Cebu, Philippines forming an El Niño task force, the Panama Canal moving a record 521 million tons of cargo despite drought-limited capacity, and continued water rationing in San Juan, Puerto Rico. In the US, Northern Colorado's record heat and drought may give way to El Niño relief, while Western Massachusetts faces increased wildfire risk from a dry stretch. Additionally, India's Telangana reports record low groundwater levels, and research in Australia highlights desert plant dieback at Uluru.
