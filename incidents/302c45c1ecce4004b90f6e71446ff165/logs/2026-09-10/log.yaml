log_date: '2026-09-10'
summary: Drought impacts continued into early September 2026. South Carolina experienced its driest year in 131 years, and Utah wildlife officials euthanized nearly 40 black bears pushed into populated areas by drought. Minnesota's fall colors are expected to be muted due to the severe drought, while about 31% of Iowa remained in drought. Additionally, the UN warned that a strengthening El Niño is raising the risk of drought in several regions globally.
