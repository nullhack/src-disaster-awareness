title: Water rationing begins in Puerto Rico after historic drought drains reservoirs
body: PUERTO RICO — Water rationing is starting on Friday in Puerto Rico as officials respond to a prolonged drought that has pushed water supplies to concerning levels. Beginning Friday morning, residents in seven municipalities will rotate through scheduled 48-hour periods without running water. The measure is intended to conserve remaining...
