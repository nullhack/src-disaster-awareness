title: 'Dutch bank: Extreme heat could wipe out Dutch, EU economic growth this year'
body: Extreme heat is expected to largely wipe out projected economic growth in the Netherlands this year, according to a new report from the Dutch bank Triodos. The same conditions are hitting the wider European Union hard enough to erase the bloc’s overall expected growth.Triodos, which describes itself as one of the most sustainable banks in the world, estimates that EU gross domestic product will fall 1.1 percent because of the heat. That figure matches the expected growth rate for the year. In the Netherlands, the bank says the projected economic growth will be largely negated.
