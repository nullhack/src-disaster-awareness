log_date: '2026-09-23'
summary: Southwest Florida's water district extended Modified Phase III extreme water restrictions for Polk County through March 2027. A worsening El Niño threatens drought across Asia, potentially raising global food prices. Lake Powell, one of America's largest reservoirs, hit its lowest level on record after a dry winter, while experts report that the strongest El Niño in recorded history is building, with sea surface temperatures breaking a 150-year record.
