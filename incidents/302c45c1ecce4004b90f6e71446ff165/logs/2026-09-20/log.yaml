log_date: '2026-09-20'
summary: Oregon Governor Kotek declared a drought emergency for Hood River County, the seventh such declaration in the state this year. New USDA data indicates Kansas corn production is expected to fall by 39 million bushels due to drought, while nearly 94% of Colorado remains in drought according to the latest U.S. Drought Monitor. Forecasters note that a strengthening El Niño could bring a rainy winter to North Texas after months of dry conditions.
