title: Despite moisture, the drought continues - AOL
body: 'Related Video: The forecast for Thursday, depicting the chance of rain and storms across Colorado. (SOUTHERN COLORADO) — Colorado’s drought situation remains widespread this week, with nearly 94% of the state experiencing some level of drought, according to the latest U.S. Drought Monitor released Thursday morning, Sept. 17. While the overall coverage of drought remained […]'
