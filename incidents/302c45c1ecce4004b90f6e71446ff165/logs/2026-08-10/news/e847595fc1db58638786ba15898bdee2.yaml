title: 'Rhine’s water flow drops to near 80-year low: shipping curbed - DutchNews.nl'
body: The Rhine is carrying less water than at any point since 1947, leaving cargo barges unable to sail fully loaded, ferries and cruises cancelled, and watering restrictions for farmers. The fact that this has happened in the height of summer, when the 1947 record was set in November, makes the situation far more serious, the national weather service KNMI has said, because much more water is being lost to heat and crop farming. Over the past 24 hours the river...
