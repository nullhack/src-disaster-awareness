log_date: '2026-08-21'
summary: The Panama Canal announced it will reduce shipping due to El Niño-fueled drought. Colorado's High Country experienced four black bear attacks in August, with human-bear interactions already surpassing 2025 totals as extreme drought impacts natural food sources. Belgium brought its largest wildfire in a century under control after a seven-day fight, while Oklahoma City recorded another heat record at 106°F with drought intensifying. Champagne producers are racing to pick grapes in the region's earliest harvest on record due to heat and drought.
