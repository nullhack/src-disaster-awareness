log_date: '2026-08-21'
summary: |-
  The Panama Canal announced it will reduce shipping due to El Niño-fueled drought. Colorado's High Country experienced four black bear attacks in August, with human-bear interactions already surpassing 2025 totals as extreme drought impacts natural food sources. Belgium brought its largest wildfire in a century under control after a seven-day fight, while Oklahoma City recorded another heat record at 106°F with drought intensifying. Champagne producers are racing to pick grapes in the region's earliest harvest on record due to heat and drought.
  A historic steam tugboat emerged from Serbia's Sava River as Europe's drought continues to expose relics. Hungary's Lake Velence hit record-low water levels, closing swimming beaches. The Trump administration ordered water cuts on the plummeting Colorado River, Utah's reservoir system neared 50% capacity, and Maine's drought worsened with nearly 900,000 residents affected. The Panama Canal reduced shipping due to El Niño-driven drought, while a report highlighted flaws in Texas water planning for lacking climate projections.
