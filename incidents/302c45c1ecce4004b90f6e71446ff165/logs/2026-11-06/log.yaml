log_date: '2026-11-06'
summary: New drought developments include the expansion of moderate drought to cover nearly a third of Vermont, while central North Carolina farmers are waiting for rain to plant wheat. In the Philippines, officials warn that several provinces will be hit by drought this month due to a very strong El Niño. Utah has seen above-normal rain but remains over 90% in drought, and a South Carolina crop report notes that peaches and blackberries thrived while cucumbers, squash, and sweet corn struggled.
