title: Austrian crop insurer estimates 2026 drought damage at €1 billion
body: Weeks of drought combined with record hot weather have caused agricultural losses in Austria of around €1 billion ($1. 2 billion), the Österreichische Hagelversicherung specialist agricultural insurer reported on Monday.
