title: Lake Mead, the nation’s largest reservoir, is smaller than ever
body: Lake Mead, the nation’s largest reservoir and a vital source of water for more than 25 million people across the Southwest, has dwindled to its lowest levels ever as the region struggles through a punishing drought.
