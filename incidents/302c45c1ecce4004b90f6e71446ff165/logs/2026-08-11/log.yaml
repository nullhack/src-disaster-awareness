log_date: '2026-08-11'
summary: As of August 10-11, 2026, Lake Mead shrank to its smallest size ever, while the Puerto Rico National Guard began distributing water in San Juan amid ongoing severe drought impacting over 180,000 customers. Austria reported €1 billion in agricultural losses due to the drought, and France imposed water restrictions across nearly 70% of the country. England’s drought deepened with a rare extreme heat warning for temperatures up to 38°C, while prolonged dry conditions in the Netherlands are killing trees and amphibians.
