log_date: '2026-09-04'
summary: Drought deepens in western North Dakota as McKenzie County receives a Federal Disaster Designation. Forecasts indicate a "supersized" El Niño will persist until early 2027, bringing more heat and extreme drought in some regions. France recorded its hottest summer since measurements began in 1990, and a study finds the U.K. remains unprepared for extreme heat following its record-breaking summer.
