log_date: '2026-08-03'
summary: |-
  New drought developments include Colorado facing severe drought with record fishing restrictions and threatened power supplies, and the Grand Strand in South Carolina ending its drought management plan as water use declines. Milwaukee saw some drought relief from rain, while in Europe, the Netherlands remains at high wildfire risk and England's water supply problems are now impacting housing targets. Additionally, North Carolina continues to monitor drought conditions with updated restrictions.
  Europe's drought intensifies: the Netherlands closes canal locks in The Hague-Rotterdam area, and wildfires rage in France and Greece. In the US, drought-fueled Spokane wildfires destroy about 600 buildings, while Western North Carolina sees drought improvement with Statesville lifting water restrictions.
