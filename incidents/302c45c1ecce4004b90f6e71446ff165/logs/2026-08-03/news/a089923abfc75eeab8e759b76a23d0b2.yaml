title: 86 Nebraska counties facing drought approved for USDA emergency loan assistance
body: U.S. Secretary of Agriculture Brooke Rollins has approved another disaster declaration for 13 Nebraska counties due to drought, bringing the total number of counties covered by a USDA declaration for drought conditions this year to 86 of 93 counties.
