title: 'Much of the western US is facing a drought. What’s the best way to deal with it? : Consider This from NPR'
body: Across the western US, many states are dealing with extreme heat and drought-like conditions.In times like these, water — and access to it — becomes a contentious issue.A new plan put forth by the federal government aims to allocate water from the Colorado River between states and Native American tribes.What's in the plan - and will it work?This episode was produced by Daniel Ofman, with audio engineering by Becky Brown. Our director is Marc Rivers.It was edited by Michael Levitt and Tinbete Ermyas.Our interim executive producer is Courtney Dorning. Support public media with NPR+ and enjoy perks for over 25 podcasts like this one. This show’s perks include bonus episodes and sponsor-free listening. Learn more at plus.npr.org.
