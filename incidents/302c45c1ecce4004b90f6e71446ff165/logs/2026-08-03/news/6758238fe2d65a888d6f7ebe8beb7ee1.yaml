title: 'Higher prices, smaller produce & water shortages: heat takes toll on harvest | VRT NWS: news'
body: The persistent heat and drought are having a major impact on the fruit and vegetable harvest. Growers are doing all they can to combat the heat and drought stress affecting their plants, but inevitably there will be fewer and smaller fruits on the shop shelves, with a higher price tag.
