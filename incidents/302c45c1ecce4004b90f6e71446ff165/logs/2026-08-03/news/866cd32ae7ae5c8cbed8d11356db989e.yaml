title: Canal locks in The Hague-Rotterdam area to close amid drought
body: All locks in the The Hague and Rotterdam area will close starting Wednesday. Additional steps are currently being taken in several Dutch regions to address water shortages caused by the ongoing drought. Extraction of water from ditches, streams, and canals is also banned in more locations, NOS reports.
