title: Bhiwandi To Face 18-Hour Water Cuts Every Wednesday Amid Drought Concerns; 10 Per Cent Supply Reduction Imposed
body: Bhiwandi will face an 18-hour water supply shutdown every Wednesday from 9 am to 3 am on Thursday amid drought concerns and a state-directed 10% water cut. Authorities have urged residents to conserve water, prevent wastage and report leaks, while industries must develop systems to reuse or recycle at least 30% of their water consumption.
