log_date: '2026-10-06'
summary: New drought developments include India's Maharashtra ordering water cuts and Karnataka reporting ₹46,000 crore in drought losses over 177 taluks, while the Philippines warns of a nationwide drought by March 2027 due to a strengthening Super El Niño. In the U.S., Mercer County, Pennsylvania issued an outdoor burn ban and Wisconsin apple orchards are affected by state‑wide drought. The Czech Republic recorded its third‑driest January‑September since 1961, highlighting continued water stress in Europe.
