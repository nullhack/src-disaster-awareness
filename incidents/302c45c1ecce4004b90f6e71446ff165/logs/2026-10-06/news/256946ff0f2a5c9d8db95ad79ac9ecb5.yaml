title: 'Water rationing in Maharashtra, Gujarat dams not full: El Nino begins to pinch India'
body: Maharashtra has ordered a 10 per cent water cut as weak monsoon rains strain reservoir stocks. Uneven dam levels in Gujarat and drought relief demands from Karnataka underline wider water stress.
