title: Low water in Rome’s drought-hit Tiber river exposes ancient ruins of Nero’s Bridge | CNN
body: Scorching temperatures and a long, dry summer have given locals and tourists alike a rare opportunity to see the remains of a 2,000-year-old bridge that once spanned the Tiber river that weaves through the center of Rome.
