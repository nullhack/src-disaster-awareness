log_date: '2026-08-15'
summary: New drought developments include Hungary sinking two barges near its nuclear plant to ensure cooling as the Danube remains at record lows, and drought conditions expanding across Missouri amid extreme summer heat. In Europe, ancient 'hunger stones' are re-emerging in receding rivers, and low water in Rome’s Tiber has exposed the ruins of Nero’s Bridge. Federal forecasters warn of a potentially historically strong El Niño event, while the UK announced a £65m funding boost for drought-hit farmers and a runner is undertaking a long-distance trek along the Colorado River to document the drought's impact.
