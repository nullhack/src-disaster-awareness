log_date: '2026-08-12'
summary: |-
  The drought continued to worsen across multiple regions. July 2026 was the hottest month on record for the contiguous United States, breaking a nearly 90-year-old mark from the Dust Bowl era. In Virginia, the Town of Pulaski declared a drought emergency with mandatory water restrictions due to dropping reservoir levels. The Texas Panhandle saw a return of exceptional drought conditions. Puerto Rico continued water rationing for over 180,000 customers as drought and infrastructure issues persisted. Canada warned that drought is raising the risk of more explosive wildfires in British Columbia. In the UK, a second extreme heat warning was issued with temperatures forecast up to 38°C, and the Met Office said summer 2026 is on course to be the UK's hottest on record, with Clarkson's Farm showing devastating drought conditions.
  As of August 12, 2026, multiple drought developments continue globally. In the UK, a ghost village has emerged from a drought-hit reservoir, while the Prime Minister will chair an emergency meeting on heatwaves and drought. In the US, Brunswick County, NC remains in extreme drought with water restrictions and fines, while Corpus Christi, TX provides updated Stage 2 watering rules. Somalia sees thousands fleeing yearslong drought as hunger deepens and aid shrinks, Indonesia battles a surge in forest fires linked to El Niño drought risks, and Ireland reports stressed bees and the best honey crop in 20 years due to heat and drought.
