log_date: '2026-08-12'
summary: The drought continued to worsen across multiple regions. July 2026 was the hottest month on record for the contiguous United States, breaking a nearly 90-year-old mark from the Dust Bowl era. In Virginia, the Town of Pulaski declared a drought emergency with mandatory water restrictions due to dropping reservoir levels. The Texas Panhandle saw a return of exceptional drought conditions. Puerto Rico continued water rationing for over 180,000 customers as drought and infrastructure issues persisted. Canada warned that drought is raising the risk of more explosive wildfires in British Columbia. In the UK, a second extreme heat warning was issued with temperatures forecast up to 38°C, and the Met Office said summer 2026 is on course to be the UK's hottest on record, with Clarkson's Farm showing devastating drought conditions.
