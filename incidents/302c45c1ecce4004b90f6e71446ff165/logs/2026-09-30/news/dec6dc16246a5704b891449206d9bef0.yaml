title: Eastern Idaho spud harvest underway as farmers grapple with drought, heat - East Idaho News
body: 'EDITOR’S NOTE: “From the Field” is a weekly feature bringing you the latest agriculture news in eastern Idaho. IDAHO FALLS – As spud harvest gets underway in eastern Idaho, many farmers are expecting to have lower yields than last year. Earlier this year, North American Potato Market News estimated a 5% decline in potato acreage. […]'
