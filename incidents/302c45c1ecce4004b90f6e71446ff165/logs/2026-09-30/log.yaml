log_date: '2026-09-30'
summary: Rocky Mount, Virginia issued a voluntary water conservation request due to ongoing drought conditions, with the town receiving only about half its normal rainfall. In North Dakota, dry weather has caused hay shortages, with drought-damaged cereal crops down to 50% of normal, prompting producers to plan late-season alfalfa management. Separately, forecasters warn that the 2026-27 El Niño is strengthening into a very strong event, increasing the risk of heat and erratic rainfall.
