log_date: '2026-09-05'
summary: El Niño is forecast to persist until February 2027, raising the risk of continued drought globally. In South Africa, the agriculture minister has warned farmers to prepare for drought conditions in the 2026/27 season, while Australia's spring outlook indicates that coastal warmth may buffer El Niño's drying effects in some regions. These developments underscore the prolonged nature of the current drought event.
