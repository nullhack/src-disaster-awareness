log_date: '2026-08-13'
summary: 'The global drought continues to worsen with new impacts: in Africa, Somalia sees thousands fleeing a yearslong drought as hunger deepens and aid shrinks, with about 2 million people facing emergency food insecurity. Europe''s drought intensifies as the UK experiences its hottest summer on record, prompting drought declarations, an amber heat alert, warnings on rail travel, and calls to remove disposable BBQs after over 1,000 wildfires, while Italy''s Po River runs low in Turin. In the US, Colorado reports a 219% jump in bear sightings due to historic drought, Virginia designates 125 localities as drought disaster areas, and the World Meteorological Organization notes July 2026 was the second warmest July on record, while a massive El Niño is already causing dry spells and crop failures on three continents.'
