title: 'Market Bag: Shoppers cut back as drought pushes food prices higher - Jamaica Observer'
body: KINGSTON, Jamaica — Jamaican consumers are adjusting their budgets as food prices remain high amid ongoing drought conditions affecting agricultural production across the island. At the Coronation Market this week, lettuce is being sold for $1,200 per pound, while ripe bananas are going for $1,000 per dozen. Tomatoes and sweet peppers are selling for $500 per pound, while Scotch bonnet peppers are priced at $400 per pound. Onions, sweet potatoes...
