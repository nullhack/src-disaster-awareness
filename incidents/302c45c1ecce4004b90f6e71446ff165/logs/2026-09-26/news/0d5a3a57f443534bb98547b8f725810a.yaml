title: Iowa drought conditions continue to recede - Radio Iowa
body: Dry conditions remain in northwest Iowa, but they have continued to shrink in the September rains. The area of moderate drought has gone from almost seven percent down to around two percent in the latest U.S. Drought Monitor report. The majority of the moderate drought is in Woodbury and Monona counties, with very small amounts […]
