log_date: '2026-08-14'
summary: |-
  Europe's drought continues to punish farmers with shriveled crops from Dutch potatoes to Bosnian corn, while satellite images show the Danube at record lows. Romania began shutting down the second reactor at its Cernavoda nuclear plant due to low Danube water levels. In the US, drought intensified across the Pacific Northwest, covering 91% of Oregon and giving Eugene its fifth driest year on record, while Colorado sees a surge in bears entering cities. Parts of central North Carolina saw some relief from recent rain, but a flash drought is re-developing in other areas, and Florida's Fort Myers and Naples remain in severe drought with the dry season approaching.
  New drought developments as of August 14, 2026: India's monsoon is falling unevenly, leaving 46 districts dry and hitting kharif sowing. Relentless heat could halve France's maize harvest, deepening EU losses. Drought expands across Missouri and northeast Wisconsin, while conditions ease slightly in Iowa but with 37% still dry. North Dakota activates a hay hotline, Oregon's Eugene logs its fifth driest year, and 73% of England is now in drought, affecting farms and wildlife. The Netherlands remains in a national water shortage but has not yet declared a crisis.
