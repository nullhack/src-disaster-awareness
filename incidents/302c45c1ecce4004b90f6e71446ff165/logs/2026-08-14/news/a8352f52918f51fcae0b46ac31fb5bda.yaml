title: 'Persistent drought: Netherlands not in a nationwide water crisis yet'
body: Despite the severe drought, the Netherlands is not in an official national water crisis yet. The Water Shortage Management Team (MTW) decided on Thursday not to take this step yet. No new large-scale measures will be implemented at this time.The Netherlands does have an actual national water shortage, the second-highest level in the national drought response plan. Minister Vincent Karremans (Infrastructure and Water Management) can declare a water crisis, the highest drought response level, thereby shifting control to the national level.
