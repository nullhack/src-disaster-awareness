title: Romania begins shutdown of nuclear plant's 2nd reactor amid low water levels on Danube River
body: Romania has begun a controlled shutdown of the second reactor at the Cernavoda nuclear power plant. A severe drought has gripped the continent, leaving the Danube River at record lows.
