summary: Drought is driving an increase in black bear sightings across the United States, as reported in a national overview. In Germany, heat and drought threaten beer supplies for Oktoberfest due to potential crop shortages. Meanwhile, in Zimbabwe, the pace of funding for the Gwayi-Shangani water pipeline is critically slow, underscoring long-term drought resilience challenges.
