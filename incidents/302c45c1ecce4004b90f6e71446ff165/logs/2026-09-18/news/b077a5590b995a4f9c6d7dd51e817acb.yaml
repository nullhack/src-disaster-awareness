title: 'Gwayi-Shangani pipeline could take 217 years at current funding pace: Coltart - Zimbabwe Situation'
body: The construction of the long-awaited 252-kilometre Gwayi-Shangani-Bulawayo pipeline could take more than two centuries to complete if the government continues disbursing funds at the rate recorded last year, Bulawayo Mayor David Coltart has warned. The mayor’s sentiments illustrate the scale of the financing gap facing the pipeline and the urgency of finding a sustainable funding […]
