log_date: '2026-08-01'
summary: |-
  July 2026 was the driest for England and Wales in 190 years, according to the Met Office. In the US, the Trump administration released a 10-year plan requiring major water cuts for Colorado River states, and drought conditions expanded across Iowa. Europe's shrinking rivers revealed historical relics and caused the shutdown of Hungary's Paks nuclear plant due to low Danube levels.
  New drought developments include Virginia American Water urging customers to reduce nonessential water use, Wisconsin facing persistent drought despite July storms, and Michigan experiencing drier-than-normal July. Ghana and the Caribbean are bracing for potential drought conditions, while the UN warns that a strengthening El Niño will intensify global weather extremes, including drought. Reports also highlight India's monsoon rains at risk due to hot and dry conditions.
