log_date: '2026-08-01'
summary: July 2026 was the driest for England and Wales in 190 years, according to the Met Office. In the US, the Trump administration released a 10-year plan requiring major water cuts for Colorado River states, and drought conditions expanded across Iowa. Europe's shrinking rivers revealed historical relics and caused the shutdown of Hungary's Paks nuclear plant due to low Danube levels.
