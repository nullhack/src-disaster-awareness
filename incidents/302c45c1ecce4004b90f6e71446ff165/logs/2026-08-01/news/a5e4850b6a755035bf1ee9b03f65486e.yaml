title: After the floods comes super El Niño and potential droughts - MyJoyOnline
body: 'Ghana is facing a double-edged climate risk in 2026: counting the cost of catastrophic floods while bracing for possible drought within the same rainy season. Barely a month ago, Ghana was reeling from devastating floods. On June 28–29, 2026, a violent rainstorm triggered flash floods across Greater Accra and parts of southern Ghana. Neighbourhoods including […]'
