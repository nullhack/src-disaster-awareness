summary: Yogyakarta, Indonesia extended its drought emergency alert after 131 consecutive dry days, the nation's longest dry spell. In the US, beekeepers in Independence County are feeding sugar to hives to help them endure drought, while Virginia's prolonged drought has enabled some drought-adapted plants to thrive. A separate report examines how heat and drought may be altering the flavor of Dijon mustard.
