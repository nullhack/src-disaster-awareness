log_date: '2026-10-05'
summary: According to the October 1, 2026 Drought Monitor, drought conditions persist across the U.S., while a new report indicates extreme drought now covers 44% of Puerto Rico. The 2026 super El Niño is described as the strongest ever measured for this point in the year, presenting multiple threats. Locally, Wisconsin's fall colors and apple crops are being affected by drought, and farms such as Annabelle's Fun Farm are adapting to maintain fall festival traditions.
