title: Old sunken steamboat revealed in Serbia due to low river levels
body: 'A historic steam tugboat known as The Slovenian has emerged from the Sava River near Sremska Mitrovica, Serbia, as prolonged heat and drought cause Europe''s rivers to reach record-low levels (AP video shot by: Marko Drobnjakovic).'
