log_date: '2026-08-20'
summary: |-
  Smith County, Texas issued a 90-day burn ban due to dry conditions. In France, the gardens at Chambord are being reshaped by repeated heatwaves and drought. More human remains were discovered at shrinking Lake Mead, and North Dakota declared a drought disaster after recording its 6th hottest and 12th driest July.
  A historic steam tugboat has emerged from the Sava River in Serbia as Europe's rivers reach record-low levels due to prolonged drought and heat. Rhode Island continues to experience a lingering "groundwater drought," while Puerto Rico's ongoing water rationing is further complicated by a ruptured pipeline and long-standing lack of trust in the water utility.
