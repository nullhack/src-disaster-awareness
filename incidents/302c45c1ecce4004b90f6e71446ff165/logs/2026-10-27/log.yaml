log_date: '2026-10-27'
summary: Drought continues to expand across Michigan, especially the Upper Peninsula, as winter approaches. In Wisconsin, a drought-sparked fire near Peshtigo destroyed a wood shed and threatened homes. Unseasonably dry weather and high winds are intensifying brush fire season in South Carolina's Lowcountry, while France's sugar beet harvest is forecast to hit a 46-year low with output cut by 30% due to drought.
