title: Low water on Germany's Rhine river threatens new blow to economy
body: Dwindling water levels on Germany's big rivers, worsened by heat and drought, are raising fears that badly constrained riverboat cargo traffic may deal another blow to the struggling economy.The mighty waterway also winds past car factories, chemical plants and big river ports as it passes through the industrial heartland of Europe's biggest economy and takes cargo all the way to ports in the Netherlands.
