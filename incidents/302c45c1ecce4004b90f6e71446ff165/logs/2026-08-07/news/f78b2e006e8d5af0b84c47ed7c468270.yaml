title: Additional rainfall brings more drought relief to North Carolina - AOL
body: RALEIGH, N.C. (WNCN) — North Carolina’s drought continued to ease this week as another round of beneficial rainfall further reduced the state’s most severe dry conditions, according to the latest U.S. Drought Monitor released Thursday. Exceptional drought (D4), the highest level on the monitor’s five-category scale, has now been nearly eliminated statewide, while extreme drought […]
