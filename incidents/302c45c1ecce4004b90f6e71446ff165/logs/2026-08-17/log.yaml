log_date: '2026-08-17'
summary: Lake Powell, the second-largest US reservoir, has fallen to its lowest level on record, threatening water and power for millions. Severe drought expands across Minnesota, threatening farms, while extreme drought persists in Colorado where many towns lack mandatory watering restrictions. In Florida, drought has caused Poe Springs to stop flowing, yet Lake Okeechobee is flourishing from the receding water. The Danube River in Serbia is approaching record-low water levels, as England farmers receive £65 million in support amid heatwave-damaged harvests, though rain is forecast to potentially end the UK drought.
