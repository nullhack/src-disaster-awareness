title: മണ്ണിനടിയിൽ പുതഞ്ഞുപോയ ആ 'മരണക്കെണി'; കാട്ടുതീ രൂക്ഷമായ യൂറോപ്പിൽ പുതിയ സുരക്ഷാഭീഷണി, ആശങ്ക
body: യൂറോപ്യൻ രാജ്യങ്ങളിൽ രൂക്ഷമായി തുടരുന്ന കാട്ടുതീയും വരൾച്ചയും പുതിയൊരു സുരക്ഷാഭീഷണി ഉയർത്തുന്നു. ഒന്നും രണ്ടും ലോകമഹായുദ്ധ കാലത്ത് മണ്ണിനടിയിൽ.Europe wildfires, unexploded ordnance, WWI bombs, WWII relics, climate change Europe, drought threat, European security threat, sunken warship Danube, High Fens wildfire, unexploded bombs, യൂറോപ്പിലെ കാട്ടുതീ, വരൾച്ച, രണ്ടാം ലോകമഹായുദ്ധം, പൊട്ടിത്തെറിക്കാത്ത ബോംബുകൾ, യൂറോപ്പിലെ ഭീഷണി, കാലാവസ്ഥാ വ്യതിയാനം, ഒന്നാം ലോകമഹായുദ്ധം, ഡാന്യൂബ് നദി, Belgium News in Malayalam, Europe News in Malayalam, മലയാളം യൂറോപ്പ് വാർത്തകൾ, Malayala Manorama Online News, Global Manorama, ഗ്ലോബൽ മനോരമ, മലയാള മനോരമ
