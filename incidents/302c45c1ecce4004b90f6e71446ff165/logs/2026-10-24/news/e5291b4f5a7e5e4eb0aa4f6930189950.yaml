title: Telangana CM Revanth Reddy warns of severe drought due to El Nino impact
body: Telangana CM Revanth Reddy warns of a prolonged drought due to El Nino, urging collective action and public participation to manage severe water scarcity, heatwaves, and risks to livestock across the state in the coming months.
