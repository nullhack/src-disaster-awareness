log_date: '2026-10-24'
summary: El Niño‑driven drought continues to intensify, bringing famine risk to war‑torn Sudan and prompting drought warnings and response measures in Indian states (Maharashtra funding farmer study tours, Telangana urging water conservation). In the United States, severe drought expands across northern Aroostook County, Maine, and conditions worsen across the ArkLaMiss region, while Utah’s reservoirs drop to 48% capacity. Additionally, drought‑fueled fires blanket New Guinea in smoke, and early harvests are reported in Arkansas due to dry weather.
