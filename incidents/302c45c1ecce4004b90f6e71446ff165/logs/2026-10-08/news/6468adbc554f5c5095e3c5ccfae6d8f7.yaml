title: Drought diminishes yield for corn, tobacco, peanuts, and other N.C. crops
body: Corn and tobacco harvests are wrapping up, while other crops will harvest into October. After months of high heat and minimal rain, farmers across North Carolina's piedmont and coastal plains can't undo the damage to their fields.
