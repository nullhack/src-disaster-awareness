log_date: '2026-10-08'
summary: New drought impacts and responses reported for early October 2026. In the US, Lebanon County, Pennsylvania returned to normal drought status and lifted water conservation requests, while Baltimore, Maryland faced 20-year low reservoir levels and began drawing from the Susquehanna River. Drought damage to crops in North Carolina reduced yields for corn, tobacco, and peanuts. Internationally, Sri Lanka faces severe drought with empty wells, South West Water in the UK received a drought permit to support supplies, and Karnataka, India released ₹1,250 crore in drought relief as rice prices spike due to production losses.
