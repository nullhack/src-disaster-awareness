log_date: '2026-08-30'
summary: Drought conditions persist across 31% of Iowa according to the latest drought monitor map. Dutch farmers report 10-30% below-normal harvests of carrots, onions, and potatoes, with smaller vegetables due to the drought. Europe's summer drought also threatens fish populations in rivers and lakes. In North Dakota, drought and heat have led to below-average crops, though state disaster funds are available to help farmers.
