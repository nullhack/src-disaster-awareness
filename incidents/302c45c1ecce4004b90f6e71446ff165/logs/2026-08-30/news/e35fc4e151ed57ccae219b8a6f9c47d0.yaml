title: Dutch farmers report fewer crops, smaller carrots, onions and potatoes after drought
body: Due to the drought, farmers are harvesting on average 10 to 30 percent less food than normal, André Hoogendijk from the sector's knowledge center BO Akkerbouw told Trouw. Carrots, onions and potatoes from the summer’s crops are also smaller. Vegetables that grow on the open fields were also impacted, with lettuce heads getting lighter and some broccoli being unusually shaped.
