title: Record-low Danube River affects tourism and industry as drought and heat grip Central Europe
body: As wildfires and successive heatwaves in France and Spain highlight climate change's impact, a severe drought is causing record low water levels on the Danube River, affecting tourism and industry. The river, which flows through 10 countries, has receded to unprecedented lows, exposing rocks and old shipwrecks. In Budapest, the Danube was measured at just 23 centimeters, breaking previous records. River cruise ships are docking upriver, and sightseeing cruises have been canceled. The drought has also affected Hungary and Romania's nuclear power plant operations, exposed a World War II bomb, and ended the summer season for excursion boat operators in Serbia.
