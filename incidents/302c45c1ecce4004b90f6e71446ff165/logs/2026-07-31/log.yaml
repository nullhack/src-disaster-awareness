log_date: '2026-07-31'
summary: A severe drought is affecting multiple regions globally as of late July 2026. In Europe, an "exceptionally serious" drought has hit half of England and all of Wales, while the Rhine River dropped to its lowest ever level in the Netherlands and the Danube reached record lows in Budapest, disrupting tourism and industry. In the United States, drought conditions worsened in states like Minnesota and Michigan, while other areas like the Grand Strand in South Carolina are lifting drought management plans, and parts of Virginia and North Carolina are seeing improvements.
