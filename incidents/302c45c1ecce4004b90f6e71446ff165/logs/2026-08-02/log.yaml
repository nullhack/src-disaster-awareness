log_date: '2026-08-02'
summary: |-
  Hungary plans to shut down its only nuclear power plant as the Danube River hits record lows due to drought. In Africa, more than 3.7 million people in Tigray face severe El Niño-driven drought with a $623 million funding shortfall. The Colorado River's new 10-year plan could be devastating for Arizona, and much of Michigan was drier than normal in July, with some areas slipping into drought.
  Drought conditions continue to expand, with 86 Nebraska counties approved for USDA emergency loan assistance due to the ongoing drought. In Europe, the drought is expected to result in smaller and pricier fruit harvests in the Netherlands, starting in September.
