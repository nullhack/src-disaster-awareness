log_date: '2026-08-02'
summary: Hungary plans to shut down its only nuclear power plant as the Danube River hits record lows due to drought. In Africa, more than 3.7 million people in Tigray face severe El Niño-driven drought with a $623 million funding shortfall. The Colorado River's new 10-year plan could be devastating for Arizona, and much of Michigan was drier than normal in July, with some areas slipping into drought.
