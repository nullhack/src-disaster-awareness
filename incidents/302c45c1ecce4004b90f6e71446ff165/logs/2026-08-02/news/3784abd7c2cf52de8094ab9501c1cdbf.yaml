title: Smaller, pricier fruit expected in the Netherlands due to drought
body: Fruits from the upcoming harvest will be smaller than usual because of drought across Europe, according to John Kusters, chairman of the Dutch Fruit Growers Organization (NFO), in comments to the ANP news agency.The smaller size means the overall harvest will also be reduced, driving up prices for the fruit. "The smaller European harvest has a price-increasing effect," Kusters told NOS. The new crop will be picked starting in September and then reach stores.
