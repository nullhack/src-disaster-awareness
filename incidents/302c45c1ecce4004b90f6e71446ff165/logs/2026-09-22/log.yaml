summary: 'New drought impacts were reported: the SBA is offering low-interest disaster loans to businesses in Oregon, Washington, and Idaho affected by this year''s drought, and a Middle Tennessee city has asked residents to conserve water as the state experiences abnormally dry conditions with extreme heat and limited rainfall. Additionally, a community in Jigawa, Nigeria is praying for rain as drought persists, and a worsening El Niño is threatening Asia with drought and potential food price increases.'
