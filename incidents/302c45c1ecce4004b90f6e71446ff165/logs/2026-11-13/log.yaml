log_date: '2026-11-13'
summary: New drought developments include the availability of SBA loans for drought-hit Hawaii businesses, worsening conditions in Durham, North Carolina that could lead to Stage 3 water restrictions, and potential impacts on Arkansas duck hunting season due to persistent drought. Meanwhile, El Niño-driven rainfall has eased drought conditions in Utah and the Southern Plains, improving prospects for winter wheat planting while raising flood risks.
