log_date: '2026-08-06'
summary: |-
  Europe's drought intensifies with record heat in Slovakia (41.4°C) and Austria, while Danube River low levels continue to disrupt cruising and are now visible from satellite imagery. The UN warns a strong El Niño could push 49 million more people into acute hunger by end of 2027. Puerto Rico implements water rationing in San Juan and other major cities, Lake Mead sits inches above its record low, and UK farmers warn of the worst harvest on record leading to food shortage fears. Meanwhile, Colorado River communities face devastatingly low reservoir levels, and Beaufort County farmers face new challenges from transitioning dry-to-wet weather.
  A fish kill at Boyd Lake near Loveland, Colorado, is blamed on heat and drought as the lake shrinks. The Danube River remains at record lows, impacting tourism and industry. In Washington, Yakima County considers a six-month data center moratorium due to water and power concerns amid a fourth straight year of drought.
