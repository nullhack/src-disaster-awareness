title: More sluice gates close but no national drought measures yet - DutchNews.nl
body: No national drought restrictions will be imposed immediately despite coastal water boards taking steps to keep sea water out of river mouths and the Rhine dropping to its lowest ever level. At a weekly meeting to discuss the ongoing water shortage, regional authorities agreed to work together to ensure the “most efficient distribution possible” of water and announced local measures to protect drinking water. The flow of the Rhine at Lobith, the point where the river crosses the Dutch border,...
