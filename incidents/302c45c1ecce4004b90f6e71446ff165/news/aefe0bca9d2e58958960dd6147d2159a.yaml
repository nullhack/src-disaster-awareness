title: 'Italy: Po River runs low amid prolonged heat and drought'
body: 'Italy''s Po River is running unusually low in Turin after weeks of heat and little rain. The exposed riverbed is revealing rocks normally underwater, while algae and vegetation spread along the banks. #EuropeNews'
