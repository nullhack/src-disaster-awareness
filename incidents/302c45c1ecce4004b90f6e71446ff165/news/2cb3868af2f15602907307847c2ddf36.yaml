title: Contractors building border wall ordered to stop drilling wells in drought-stricken New Mexico
body: Customs and Border Protection has ordered construction crews building Trump’s second border wall to stop drilling wells in drought-stricken New Mexico after ranchers said pumping the groundwater needed to mix cement could threaten their livestock.
