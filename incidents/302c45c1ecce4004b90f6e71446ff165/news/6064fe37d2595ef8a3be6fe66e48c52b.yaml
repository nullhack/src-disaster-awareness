title: How severe drought is affecting Colorado, from record fishing restrictions to threatened power supplies
body: At a meeting of water managers, the head of Colorado’s Division of Water Resources compared the state to Mordor — the barren, ash-covered domain of the villain in “The Lord of the Rings” trilogy.
