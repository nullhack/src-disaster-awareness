title: Drought Worsens on St. Thomas as Puerto Rico Sees Some Improvement
body: Drought conditions have deteriorated on St. Thomas, which is now experiencing Exceptional Drought, the highest drought classification, while recent rainfall has brought some slight improvement to portions of Puerto Rico.
