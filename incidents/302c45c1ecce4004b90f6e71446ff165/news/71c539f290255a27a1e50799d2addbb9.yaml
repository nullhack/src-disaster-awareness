title: Prolonged drought kills trees, amphibians across Netherlands
body: Prolonged drought is causing severe damage to nature across the Netherlands, with trees shedding leaves, plants dying and amphibians disappearing as ponds dry up, a Natuurmonumenten hydrologist said Sunday.“It looks like autumn,” said Jaco van Heemskerk while inspecting a forest near Slot Haamstede on the Zeeland island of Schouwen-Duiveland, next to Burgh-Haamstede. Some trees have already turned orange-brown and are preparing to drop their leaves.
