title: A punishing European drought shrivels crops from Dutch potatoes to Bosnian corn
body: A drought that is slamming Europe this summer is hitting farmers across Europe hard. From potatoes and onions in the Netherlands and the United Kingdom to Bosnian corn fields and Italian vineyards, harvests are happening early and yields are expected to be down as bone-dry weather stunts crops. A Dutch bank that has a focus on sustainability published an analysis this week that estimated the heatwaves and drought could reduce gross domestic product by 1% for 2026 or around 180 billion euros ($208 billion).
