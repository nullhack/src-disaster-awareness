title: Drought could force football clubs to delay start of season - DutchNews.nl
body: Amateur football clubs face having to cancel fixtures in the opening weeks of the season because the drought has made pitches unplayable. The Delfland water authority has imposed a sprinkler ban across an area covering Delft and the Westland region, while the council has told them not to play on grass until the ban is lifted. “We have 11 football pitches, but we can only use the three that have artificial surfaces,” Dick Hartman, secretary of FC ’s-Gravenzande told NOS....
