title: Anangu traditional owners and scientists join forces to understand mass plant dieback at Uluru
body: A new collaborative research project between Anangu, the traditional owners of Uluru, and plant scientists has uncovered the physiological traits that helped some species of desert plants survive a mass dieback event in Australia. These results reveal the key strategies for desert plant survival in the face of increasing extreme weather events, with consequences for the conservation of ecologically and culturally important keystone species.
