title: Fish salvage underway in Huerfano County reservoir to supply cities water amid drought
body: Colorado Parks and Wildlife declared an emergency public fish salvage for a reservoir in drought-ridden Huerfano County to increase depleted water supplies in Walsenburg and La Veta, the agency announced on Friday. In a news release, CPW officials stated those conditions made them realize the Daigre Reservoir’s “entire fishery” could be lost, prompting the emergency […]
