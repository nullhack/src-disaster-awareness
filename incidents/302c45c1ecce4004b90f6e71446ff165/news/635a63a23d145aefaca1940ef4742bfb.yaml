title: River beds exposed by drought a goldmine for archeologists
body: The low water levels in the Waal, Rijn, and Maas rivers are terrible news for shipping and agriculture, but archeologists are pretty happy about it. The drought has exposed parts of the riverbeds that are usually inaccessible.The water level is currently several meters lower than usual in the Waal, for example. Archeologists armed with metal detectors and shovels are currently carefully combing it for buried treasures that would normally be underwater.
