title: '🌡️ Wednesday, September 30: Sports Day Cancelled Due to El Niño, Emergency Circular from the Provincial Department of Education [September 2026]｜パプアニューギニア JICA海外協力隊 ヤマちゃん'
body: The weekly Wednesday Sports Day has been cancelled several times recently. The cause is the drought brought on by the El Niño phenomenon. While Alotau is not as severely affected, some areas in the province are facing dire conditions, and schools have received an official circular from the Depar
