title: Puerto Rico National Guard distributes water amid ongoing severe drought
body: The water crisis in Puerto Rico continues — as residents wake up to day 3 of the recent water service interruptions imposed as a severe drought rages on. Last week, leaders of the island implemented water rationing measures in San Juan and other major cities as a drought grips the island with no relief in sight. More than 180,000 customers…
