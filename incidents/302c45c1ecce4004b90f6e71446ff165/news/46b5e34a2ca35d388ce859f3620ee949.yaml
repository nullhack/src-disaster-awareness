title: Caribbean urged to brace for recurrent heatwaves, drought conditions - Jamaica Observer
body: BRIDGETOWN, Barbados (CMC)—The Barbados-based Caribbean Climate Outlook Forum (CariCOF) on Friday said that as the region goes into the peak of the Atlantic Hurricane Season and the Caribbean Wet Season, El Niño is strengthening and water around the Caribbean steadily warming. El Niño is a natural climate pattern defined by the warming of ocean surface temperatures in the central and eastern Pacific Ocean, and weakened trade winds. It recurs every...
