title: 'Hundreds of thousands of people in Puerto Rico wake up with no running water as rationing begins: "It''s brutal"'
body: According to CBS, hundreds of thousands of people in Puerto Rico's capital and surrounding communities woke up without running water as a massive rationing measure took effect Friday. It comes amid a severe drought on top of shortages due to infrastructure issues on the island...
