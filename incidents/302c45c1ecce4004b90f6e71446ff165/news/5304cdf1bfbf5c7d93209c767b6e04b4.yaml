title: Heat is on! Is 2026 about to be Britain's hottest summer?
body: Is 2026 set to be Britain's hottest summer ever..? From what we can see, it certainly looks that way. The UK's average summer temperature so far is 16.48C, already 1.88C above the long-term average.
