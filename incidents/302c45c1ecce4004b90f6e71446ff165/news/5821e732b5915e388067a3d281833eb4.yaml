title: Virginia farmers statewide now eligible for USDA drought emergency loans
body: An additional 40 Virginia localities have received drought disaster designations from the U.S. Department of Agriculture Secretary Brooke Rollins, bringing the total number of designated localities in the Commonwealth to 125 in 2026.
