title: Netherlands drought brings concerns | Arkansas Democrat Gazette
body: WADDINXVEEN, Netherlands -- Jeroen Wouda and Dirk Boom walk slowly along a Dutch dike, hunting for cracks in the low-lying Netherlands' famed water defenses as a drought gripping Europe has fueled raging wildfires in France and Spain and sent the Danube and Rhine rivers to record low levels.
