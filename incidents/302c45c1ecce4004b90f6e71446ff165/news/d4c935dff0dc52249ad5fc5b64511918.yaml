title: Drought keeps wildfire risk high in Netherlands despite no recent large fires
body: Despite chronic drought across the Netherlands, no major wildfires have broken out in recent weeks. That could change quickly if the wind shifts, according to Edwin Kok, the national coordinator for natural fire management with the Dutch fire service.
