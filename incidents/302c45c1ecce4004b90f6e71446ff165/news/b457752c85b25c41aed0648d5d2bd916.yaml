title: Sri Lanka bars tourists from heart of drought-hit park as El Nino looms
body: By Uditha Jayasinghe YALA, Sri Lanka, Sept 8 (Reuters) - Mugger crocodiles bask along the edge of the shrinking reservoir, waiting like everything else in Sri Lanka's drought-hit Yala National Park for the green tankers that come every day to pump in water.
