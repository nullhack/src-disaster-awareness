title: New famine risk haunts war-torn Sudan with El Niño-driven drought
body: 'By Eltayeb Siddig , Nafisa Eltahir, Khaled Abdelaziz and Olivia Le Poidevin NORTH KORDOFAN, Sudan, Oct 23 (Reuters) - Across Sudan, farmers who have struggled to harvest their crops since a civil war flared in 2023 are now battling a new enemy that could plunge the nation back into famine: the weather.'
