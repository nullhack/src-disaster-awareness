title: 'El Niño drove drought, but climate change intensified Indonesia’s fire crisis: Study | NEWS | Reccessary'
body: Human-caused climate change significantly amplified extreme heat during Indonesia’s 2026 fire season, turning an El Niño-driven drought into a severe regional crisis, according to a recent rapid analysis.
