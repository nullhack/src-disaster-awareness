title: No national drought measures yet, despite historically low water levels
body: The drought in the Netherlands is worsening, and the Rijn River is at its lowest level ever at the Lobbith measuring point. But for the time being, the government will take no national or supra-regional measures. There is also no shortage of drinking water yet. There are significant differences in the severity of the water shortage between regions, so more regional measures will be taken.
