title: Maharashtra allocates Rs 4 crore for overseas farmer study tours amid drought crisis
body: The Maharashtra government has approved Rs 4 crore to send 180 farmers on international study tours in 2026-27, a move drawing scrutiny as the state faces widespread drought and significant financial debt.
