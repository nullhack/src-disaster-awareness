title: Producers should have a late-season alfalfa management plan
body: <p>(Sep 15, 2026) – Dry weather has created hay shortages in many areas of North Dakota, with crops down to 50% of normal. Drought-damaged cereal crops that normally would be harvested for grain have been shifted to hay, which will help reduce the strain on hay demand.</p>
