body: According to CBS, Republican Sen. Rand Paul of Kentucky has released more than a thousand pages of journal entries from Dr. Anthony Fauci, teeing up what is likely to be a contentious hearing with the nation's former top infectious disease expert on Wednesday about the origins of the COVID-19 pandemic...
