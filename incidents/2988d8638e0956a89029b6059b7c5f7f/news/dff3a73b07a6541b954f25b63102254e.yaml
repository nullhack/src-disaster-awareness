title: The latest COVID surge, the bird flu death and the fabrication of vaccine injury
body: As a pre-winter COVID-19 surge passes one million daily infections, and a bird flu death is recorded in Washington state, the Trump administration conceals the diseases killing Americans while building a federal apparatus to manufacture the appearance of vaccine injury.
