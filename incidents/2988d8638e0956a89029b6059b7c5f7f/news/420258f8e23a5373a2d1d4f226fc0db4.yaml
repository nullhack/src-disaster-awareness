title: Fauci repeatedly invokes the Fifth Amendment in a contentious Senate committee hearing
body: Dr. Anthony Fauci will face a contempt of Congress vote in a Senate committee next week after he invoked the Fifth Amendment in a hearing about his handling of the COVID-19 pandemic. In Wednesday's hearing, Fauci declined to answer dozens of questions from senators. The scientist's decision to not testify injected drama into the lingering tensions between Fauci and GOP lawmakers over his handling of the coronavirus pandemic and accusations he lied about its origins, which he denies. Fauci was subpoenaed by Sen. Rand Paul, who led the charge to have the now-retired infectious disease expert testify again. The hearing was part of a campaign to arrest Fauci, spearheaded by some congressional Republicans. Fauci says Paul has an “obvious obsession” with calling for his prosecution.
