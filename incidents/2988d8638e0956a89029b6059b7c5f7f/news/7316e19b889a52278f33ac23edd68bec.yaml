title: Pediatric Heart Rhythm Abnormalities Show Wide Variation Across SARS-CoV-2
body: A systematic review of 23 observational studies found reported heart rhythm abnormalities varied widely among pediatric COVID-19 cohorts, with clinical cohorts lacking uninfected control groups.
