title: Faster, fairer COVID-19 vaccine rollout could have saved millions of lives, modeling reveals
body: Beginning the global COVID-19 vaccine rollout 100 days after the virus was sequenced could have saved more than 8 million lives by the end of 2021, most of them in lower-middle-income countries, according to modeling evidence brought together in a new policy brief from the United Nations University Institute for Water,
