title: No, Sri Lanka Will not Lose Free Vaccines Over the World Bank’s Upper-Middle-Income Reclassification - Fact Crescendo Sri Lanka English | The leading fact-checking website
body: Subscribe to our WhatsApp Channel When the World Bank moved Sri Lanka into the upper-middle-income bracket in July 2026, a milestone of economic recovery quickly turned into a public health scare. A Lankadeepa newspaper headline, echoed across televised newspaper-review programmes, told the country it would now be cut off from “free vaccines,” and within hours […]
