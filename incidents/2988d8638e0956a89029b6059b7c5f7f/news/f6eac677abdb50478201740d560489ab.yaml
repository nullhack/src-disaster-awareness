title: 'COVID Basics: Essential Tips for Older Adults and Caregivers - AOL'
body: According to CDC, more than 81% of COVID-related deaths happen among people age 65+. This is because as we age, our immune systems change, making it harder for us to fight off viruses. Find out what’s changed—and what hasn’t—about COVID prevention for older adults.
