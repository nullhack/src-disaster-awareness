title: Four Medical Societies, in Panel Led by UMSOM Expert, Back One Set of Flu, RSV and COVID-19 Vaccine Recommendations | Newswise
body: With ambiguity surrounding the federal vaccine recommendations, four leading medical societies have stepped forward with guidance for flu, RSV and COVID-19 vaccination. A panel led by a University of Maryland School of Medicine expert helped develop this unified approach, providing health care professionals with evidence-based guidance to help patients make informed decisions about protecting themselves against respiratory illnesses.
