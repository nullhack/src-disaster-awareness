title: 'Wat nieuwe coronavarianten met long covid doen: de risico''s van herbesmetting'
body: Het coronavirus is nog steeds aanwezig. Hoewel minder mensen besmet zijn, lijken de klachten vervelender, maar niet bedreigender voor de algemene gezondheid. Vooral mensen die aan long covid lijden melden terugval en opnieuw beperkingen in hun functioneren.
