title: CDC updates COVID return-to-work guidance for healthcare workers, but not residents
body: The Centers for Disease Control and Prevention has updated work restrictions for healthcare personnel exposed to or infected with respiratory viruses, including COVID-19, after two-plus years of silence on the issue.
