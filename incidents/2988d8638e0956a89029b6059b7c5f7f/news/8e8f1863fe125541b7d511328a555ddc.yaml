title: Severe COVID-19 infection linked to reactivation of 11 dormant viruses, study finds
body: A recent study revealed that severe COVID-19 infection may reactivate some of the dormant viruses in the body. Researchers have linked Anelloviridae reactivation to long-term physical disability and long COVID but also called for more research for definite results.
