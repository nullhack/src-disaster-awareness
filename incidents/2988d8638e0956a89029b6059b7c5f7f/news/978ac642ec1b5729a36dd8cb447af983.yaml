title: Invivyd Announces Positive Topline Results from LIBERTY Phase 3 Study Demonstrating VYD2311 Safety and Tolerability Superior to mRNA-based COVID-19 Vaccine; Announces Regulatory Submission Plans for VYD2311
body: 'VYD2311 met all primary and secondary endpoints comparing VYD2311 to an mRNA-based COVID-19 vaccine, demonstrating VYD2311 safety and tolerability that is clinically and statistically superior to the safety and tolerability of an mRNA-based COVID-19 vaccineVYD2311 combined with an mRNA-based COVID-19 vaccine demonstrated no interference with vaccine-induced neutralizing titers, and instead added substantially to vaccine-induced neutralizing titersVYD2311 observed profile in LIBERTY indicates high measured neutralizing antiviral titers supporting the target profile for VYD2311 under study in the DECLARATION pivotal clinical studyInvivyd plans for DECLARATION and LIBERTY clinical studies to be the basis of a planned Biologics License Application (BLA) submission for VYD2311 to the U.S. Food and Drug Administration via Accelerated Approval Program following a recent Type C meeting; DECLARATION topline data on safety and immunogenicity to support the submission are now expected in October;
  DECLARATION clinical efficacy data will be planned to be unblinded post-Accelerated Approval, if granted, subject to clinical event accrual Investor call to be held at 8:30 am ET on September 29, 2026 NEW HAVEN, Conn., Sept. 29, 2026 (GLOBE NEWSWIRE) -- Invivyd, Inc. (Nasdaq: IVVD) today announced positive, clinically meaningful, and statistically significant topline data from the LIBERTY Phase 3, randomized, double-blind, active controlled study evaluating the safety and tolerability of (1) VYD2311, Invivyd’s investigational COVID-directed monoclonal antibody candidate, (2) mRNA-based COVID-19 vaccine COMIRNATY® (mRNA-based COVID-19 vaccine, COVID-19 mRNA vaccine, or COVID vaccine), and (3) VYD2311 co-administered with mRNA-based COVID-19 vaccine. The study also evaluated the potential for immunologic interference between VYD2311 and mRNA-based COVID-19 vaccine. LIBERTY is a companion study to DECLARATION, the ongoing placebo-controlled pivotal study of VYD2311 for pre-exposure prophylaxis
  of symptomatic COVID-19.'
