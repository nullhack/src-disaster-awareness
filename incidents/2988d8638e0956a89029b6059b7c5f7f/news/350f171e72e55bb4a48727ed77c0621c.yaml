title: COVID becoming a California summer staple as winter outbreaks fade | Honolulu Star-Advertiser
body: LOS ANGELES >> Six years after the COVID-19 pandemic upended the world, experts in California say the disease appears to be becoming more of a summer rather than a winter phenomenon.
