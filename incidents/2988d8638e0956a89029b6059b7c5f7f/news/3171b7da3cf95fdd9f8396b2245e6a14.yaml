title: 'Thailand Responds to Reports of COVID-19 Outbreak: What is Happening in Kazakhstan'
body: Recently, some Russian media reported an alleged new outbreak of COVID-19 in Phuket, claiming that infected tourists and expats are facing severe symptoms. Later, the Department of Disease Control of the Ministry of Public Health of Thailand refuted this information. The department stated that the situation on the island is not of an emergency nature, although the coronavirus is indeed circulating.
