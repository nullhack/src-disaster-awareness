log_date: '2026-09-17'
summary: As COVID-19 cases rise in over half of the U.S., experts are advising on updated vaccine eligibility and timing for the fall season. New York is experiencing a troubling surge in COVID hospital admissions, adding to the national increase. Meanwhile, distribution delays mean that updated COVID vaccines are unavailable for half of U.S. children, complicating vaccination efforts ahead of respiratory virus season.
