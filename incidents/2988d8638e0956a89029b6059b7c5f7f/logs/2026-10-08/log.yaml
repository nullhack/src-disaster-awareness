summary: More than 170 US political candidates have signed a pledge to remove COVID-19 vaccines from the market. The XFG variant is rapidly spreading in the UK with 14 reported symptoms, while mortality data indicates COVID-19 deaths have fallen to a post-pandemic low. Sonoma County, California, is reinstating mask requirements in some healthcare facilities, and a New York business has agreed to pay $1.5 million to settle claims it improperly obtained COVID-19 relief loans.
