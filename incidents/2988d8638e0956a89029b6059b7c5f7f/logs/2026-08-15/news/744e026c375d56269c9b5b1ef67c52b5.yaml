title: Summer is now California's COVID busy season as winter waves fade - AOL
body: The shift was noted for the past couple of years and has become even clearer in 2026, prompting health officials to refocus their prevention efforts. The CDC says COVID-19 is growing or likely growing in 43 states, including California.
