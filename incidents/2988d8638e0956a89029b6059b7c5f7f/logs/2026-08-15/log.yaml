log_date: '2026-08-15'
summary: COVID-19 continues to surge across the U.S., with the CDC reporting the virus is growing or likely growing in 43 states, and California seeing a second year where summer cases peak higher than winter. Health officials urge some people not to wait for the updated fall vaccine and to get vaccinated now, while also noting overlapping symptoms with the common cold. Separately, false claims about COVID-19 vaccines and miscarriage risk are spreading online, fueled by Republican senators, despite numerous large-scale studies showing no evidence of increased risk.
