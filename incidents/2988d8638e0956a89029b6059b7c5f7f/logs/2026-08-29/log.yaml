summary: The FDA has approved updated 2026-2027 COVID-19 vaccines from Moderna, Pfizer-BioNTech, and Novavax-Sanofi targeting the XFG "Stratus" variant for adults 65 and older and high-risk individuals. COVID-19 activity continues to rise in California during the summer, with officials advising protective measures.
