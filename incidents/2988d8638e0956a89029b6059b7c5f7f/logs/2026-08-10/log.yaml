log_date: '2026-08-10'
summary: Vaxart reported positive 12-month safety data from its Phase II-B COVID-19 vaccine trial and is on track to disclose top-line results in early 2027. A study confirms COVID-19 can reactivate dormant viruses like Epstein-Barr and CMV, potentially linked to long COVID. The FDA approved the first mRNA-based flu vaccine, a spinoff of COVID-19 vaccine technology. COVID-19 cases continue to increase in certain areas, indicating an ongoing summer uptick.
