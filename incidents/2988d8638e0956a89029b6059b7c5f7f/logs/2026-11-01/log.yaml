summary: A Canadian Auditor General's report identified costly failures in the country's emergency medical stockpile, with Conservatives accusing the government of not learning from COVID-19. Australia's new chief health officer expressed alarm about public fatigue with COVID-19 vaccinations, raising concerns about vaccine uptake. Separately, an article outlined seven common long COVID symptoms and the latest treatment options available for sufferers.
