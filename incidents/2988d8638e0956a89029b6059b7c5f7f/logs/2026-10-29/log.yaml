log_date: '2026-10-29'
summary: Novavax earned a $125 million milestone as Sanofi launches a Phase 3 influenza/COVID-19 combination vaccine trial in Europe. Separately, BioVie was invited to present data on its Bezisterim candidate for long COVID at an NIH workshop. Additionally, federal prosecutors are seeking a 40-year sentence for the architect of the $250 million Feeding Our Future fraud scheme involving COVID-19 relief funds.
