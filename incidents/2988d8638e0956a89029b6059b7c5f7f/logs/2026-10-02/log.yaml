log_date: '2026-10-02'
summary: Invivyd announced positive topline results from its Phase 3 LIBERTY study, reporting that VYD2311 demonstrated safety and tolerability superior to an mRNA-based COVID-19 vaccine and outlining regulatory submission plans. Separately, Florida’s Attorney General sued Pfizer and its CEO over alleged misleading claims about the company’s COVID-19 vaccine. Meanwhile, the CDC now recommends COVID-19 vaccination for all adults and many children, and U.S. health groups and states have issued updated flu, COVID-19, and RSV vaccine guidance for the 2026-27 season. Additionally, CMS is reportedly considering ending certain COVID-19 data-reporting requirements for long-term care facilities.
