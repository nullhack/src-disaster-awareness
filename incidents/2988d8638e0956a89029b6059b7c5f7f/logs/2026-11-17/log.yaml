log_date: '2026-11-17'
summary: Moderna shares rose 3% following its Q3 earnings release, driven by stronger overseas COVID-19 vaccine sales and higher 2026 guidance. Invivyd reported Q3 2026 PEMGARDA net product revenue of $15.4 million, an 18% year-over-year increase, while continuing to advance its COVID-19 REVOLUTION program. Separately, Kansas City-area health departments are urging residents to get vaccinated ahead of holiday gatherings.
