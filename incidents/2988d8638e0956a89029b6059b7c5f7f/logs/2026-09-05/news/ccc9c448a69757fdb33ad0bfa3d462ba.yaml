title: Top US doctors offer updated flu and COVID vaccine recommendations, aiming to ease confusion
body: Leading U.S. medical groups are urging people to get updated flu and COVID-19 vaccinations this fall. They banded together to offer recommendations Wednesday, saying they hope to lessen confusion after last year's changing advice from the Trump administration. Doctors advise flu shots for just about everyone starting at 6 months of age, and recommend a COVID-19 shot for many adults and children, too. Flu shots are already being offered at pharmacies, and coronavirus vaccines are starting to arrive after the Food and Drug Administration approved this year’s updated versions last week.
