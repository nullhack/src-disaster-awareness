log_date: '2026-09-05'
summary: Major medical groups have issued independent guidance on COVID-19, flu, and RSV vaccinations for the fall, aiming to reduce confusion amid changing federal policies. In the Bay Area, COVID-19 symptoms during the summer surge have changed slightly compared to previous strains. Additionally, updated COVID-19 vaccines are now available without prescription in Arizona, and four new vaccines targeting the XFG variant have been approved for the 2026-27 season in the U.S.
