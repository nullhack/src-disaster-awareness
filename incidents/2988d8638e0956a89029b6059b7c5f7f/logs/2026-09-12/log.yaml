log_date: '2026-09-12'
summary: The U.S. Air Force is moving to eliminate a 30-day bottleneck in reinstating airmen discharged for refusing the COVID-19 vaccine. A VA study found COVID-19 vaccination is linked to fewer cardiovascular events in older veterans. Updated 2026-2027 COVID-19 vaccines are rolling out with new eligibility guidance, and Sanofi partnered with USA Pickleball to promote NUVAXOVID for older adults. Meanwhile, Alabama’s public health department approved nearly $28 million in poorly documented COVID-19 vaccine grant spending, and Rep. Miller-Meeks faced criticism for spreading COVID-19 misinformation.
