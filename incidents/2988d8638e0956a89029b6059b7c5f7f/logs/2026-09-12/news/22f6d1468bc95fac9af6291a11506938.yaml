title: Air Force moves to quickly reinstate airmen discharged for refusing COVID-19 vaccine
body: The Air Force says it’s aiming to eliminate a roughly 30-day bottleneck in the application process for reinstating former airmen discharged for refusing the COVID-19 vaccine.
