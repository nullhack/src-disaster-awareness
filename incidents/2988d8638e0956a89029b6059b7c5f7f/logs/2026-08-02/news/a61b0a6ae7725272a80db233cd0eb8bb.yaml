title: 'Anthony Fauci Update: Former NIH Official Overheard Venting After Invoking Fifth Amendment at Senate Hearing'
body: Anthony Fauci declined to answer questions from Senate Republicans investigating COVID-19's origins more than 100 times Wednesday, prompting Chairman Rand Paul to vow a contempt vote and to have Fauci's attorney physically removed from the hearing room.
