title: Ombudsman files P11-B plunder complaint vs. Pharmally execs, others over pandemic purchases
body: The Office of the Ombudsman has filed an P11-billion plunder complaint against 46 individuals, including officials of Pharmally Pharmaceutical Corporation, over alleged anomalous purchases of personal protective equipment, coronavirus testing kits, among others, during the COVID-19 pandemic, Ombudsman Jesus Crispin Remulla said Friday.
