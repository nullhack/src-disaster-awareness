log_date: '2026-09-29'
summary: Hawaii pharmacies are offering COVID-19 vaccines amid a local uptick. Invivyd announced positive Phase 3 results for its monoclonal antibody VYD2311, indicating safety and tolerability superior to mRNA-based COVID-19 vaccines, with regulatory submission planned. A U.S. survey found that while most adults support vaccines, many remain unclear about respiratory vaccine recommendations, and ongoing guidance on fall vaccination is being shared.
