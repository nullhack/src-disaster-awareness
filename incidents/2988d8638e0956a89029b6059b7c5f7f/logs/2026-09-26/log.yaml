log_date: '2026-09-26'
summary: Respiratory viruses, including COVID-19, are spreading more as schools and workplaces return to normal operations. Mayo Clinic has agreed to pay $50,000 to settle a federal discrimination complaint over a denied religious exemption to its COVID-19 vaccine policy. Meanwhile, the CDC has opened state ordering for COVID-19 vaccines after a previous period of unexplained delays, improving distribution prospects.
