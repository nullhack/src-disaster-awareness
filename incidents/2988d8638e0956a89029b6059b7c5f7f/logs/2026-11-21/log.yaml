log_date: '2026-11-21'
summary: British Columbia's largest long COVID clinic has laid off the majority of its staff and cut the programs it offers following changes to provincial billing rules. On Nov. 1, the province's Medical Services Commission updated MSP billing codes to introduce a 30-person limit on online group visits, a change that appears to have undercut the clinic's online care model. Other items in this batch — Invivyd's quarterly results and guidance on co-administering COVID and flu shots — repeat information already reported.
