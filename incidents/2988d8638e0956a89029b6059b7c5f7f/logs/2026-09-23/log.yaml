log_date: '2026-09-23'
summary: The 13th COVID-19 wave has likely crested in the US, but the country heads into winter with low short-term immunity comparable to 2021-2022, a highly divergent variant circulating, and falling vaccination rates. Updated COVID-19 vaccines for the 2026-27 season remain unavailable for about half of US children due to delays in a key federal program. The CDC has also updated return-to-work guidance for healthcare workers exposed to respiratory viruses, while local health departments in areas like San Antonio struggle to report case increases on their dashboards despite rising infections.
