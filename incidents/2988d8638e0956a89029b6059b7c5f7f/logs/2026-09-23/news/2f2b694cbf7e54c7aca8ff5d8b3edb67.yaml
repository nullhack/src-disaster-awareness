title: The 13th COVID-19 wave crests as the US heads into winter with lowest immunity since 2021
body: The 13th COVID-19 wave has likely crested, but the US heads toward winter with the low short-term immunity of 2021-22, a highly divergent variant circulating, falling vaccination and a government dismantling pandemic preparedness.
