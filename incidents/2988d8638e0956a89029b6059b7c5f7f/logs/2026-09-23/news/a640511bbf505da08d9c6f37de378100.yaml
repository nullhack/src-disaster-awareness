title: Covid-19 vaccines delayed for about half of US children as access through federal program stalls
body: The federal government approved updated Covid-19 vaccines for the 2026-27 respiratory virus season last month, but the US Centers for Disease Control and Prevention has not yet made these vaccines available through a key federal program that covers access for about half of US children.
