title: 'Temporal trends in alcohol-related liver disease mortality and prior inpatient care in England before, during and after the COVID-19 pandemic (2004-2024): a population-based ...'
body: Background Mortality from alcohol-related liver disease (ARLD) in England rose after the COVID-19 pandemic. Existing reports lack data on prior healthcare use, which is key to understanding care pathways before death.
