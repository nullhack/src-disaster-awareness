log_date: '2026-08-13'
summary: |-
  The U.S. Air Force has expedited the reinstatement process for service members separated due to COVID-19 vaccine mandates, removing delays for those seeking to return. Meanwhile, a severe flu outbreak in Zimbabwe was initially mistaken for a resurgence of COVID-19, but was later identified as influenza, resulting in five deaths in Bulawayo.
  A new study indicates that severe COVID-19 may reactivate up to 11 dormant viruses, including Anelloviridae, which is linked to long-term disability. Additionally, Vaxart reported topline data from a 400-person sentinel cohort in its Phase 2b COVID-19 vaccine trial.
