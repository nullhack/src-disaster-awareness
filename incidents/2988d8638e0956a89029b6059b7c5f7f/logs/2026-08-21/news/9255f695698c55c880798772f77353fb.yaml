title: Federal vaccine drama is causing great confusion. Your questions, answered.
body: In fact, a recent report in the Annals of Internal Medicine examined precisely this question. Researchers calculated that containing a 2025 measles outbreak in New Mexico cost nearly $5.4 million. There were about 100 confirmed cases, so that works out for about $53,000 per case.
