title: Invivyd Announces Positive DECLARATION Trial Data for Monoclonal Antibody VYD2311, and Ushers in a New Era for Immunization
body: 'VYD2311 (ibramvibart) achieved high, durable antiviral activity predictive of 70-90% protection from symptomatic COVID-19 infection for both single- and multi-dose intramuscular arms Highly attractive safety and tolerability profile observed for single- and multi-dose VYD2311 arms, supporting broad population usePositive dialogue with U.S. FDA and HHS leadership has resulted in progress toward regulatory consistency between Invivyd monoclonal antibodies and related vaccines (e.g., COVID-19). Based on FDA feedback, upon planned VYD2311 BLA submission, Invivyd anticipates review for accelerated approval either by, or with input from, CBERInvivyd anticipates submitting a BLA based on DECLARATION and LIBERTY data to FDA in Q1 2027Investor call to be held at 8:30 am EST on November 23, 2026 NEW HAVEN, Conn., Nov. 23, 2026 (GLOBE NEWSWIRE) -- Invivyd, Inc. (Nasdaq: IVVD) today announced all interim analysis primary and secondary endpoints were met in the DECLARATION Phase 3 trial of VYD2311
  (ibramvibart). VYD2311, administered via intramuscular injection (IM), demonstrated high and durable antiviral activity, consistent with Invivyd’s target 70-90% protection from RT-PCR confirmed symptomatic COVID-19, versus placebo. VYD2311 demonstrated an overall highly attractive safety and tolerability profile in both single- and multi-dose arms. Invivyd intends to submit a Biologics License Application (BLA) seeking accelerated approval of VYD2311 for the prevention of symptomatic COVID-19 based on the positive interim analysis of the Phase 3 DECLARATION trial and the supportive data from the Phase 3 LIBERTY trial comparing VYD2311 and an mRNA-based COVID-19 vaccine.'
