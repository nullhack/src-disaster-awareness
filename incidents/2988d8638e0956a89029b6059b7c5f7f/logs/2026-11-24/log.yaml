log_date: '2026-11-24'
summary: Invivyd reported that its monoclonal antibody VYD2311 (ibramvibart) met all endpoints in interim Phase 3 DECLARATION trial data, with antiviral activity predictive of 70–90% protection against symptomatic COVID-19 for both single- and multi-dose intramuscular arms and a favorable safety and tolerability profile. The company said positive dialogue with the U.S. FDA and HHS has advanced regulatory consistency between its monoclonal antibodies and related vaccines, and it is charting a course toward an accelerated FDA filing.
