title: Senate Committee Passes Fauci Contempt Resolution Along Party Lines
body: In a contempt of Congress resolution, Sen. Rand Paul, R-Ky., argued Dr. Anthony Fauci’s Fifth Amendment rights were “unsupported,” while Fauci’s lawyers have said he is on “solid legal ground.”
