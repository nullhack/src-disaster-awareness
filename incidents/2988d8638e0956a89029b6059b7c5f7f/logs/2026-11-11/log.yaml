log_date: '2026-11-11'
summary: A newly identified COVID-19 variant, PJ.2.1, is spreading across North America, Europe, Australia, New Zealand, and parts of Asia, with experts monitoring its growth and potential to trigger new waves. Separately, a machine learning model that analyzes wastewater can forecast epidemic outbreaks three days in advance, while a systematic review finds wide variation in reported pediatric heart rhythm abnormalities among COVID-19 cohorts.
