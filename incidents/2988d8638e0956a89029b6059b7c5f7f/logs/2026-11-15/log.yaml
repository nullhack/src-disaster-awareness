log_date: '2026-11-15'
summary: Four leading medical societies have released unified vaccine recommendations for flu, RSV, and COVID-19, offering standardized guidance for healthcare professionals. Traws Pharma reported final Phase 2a results for its once-daily antiviral ratutrelvir, which showed fewer adverse events and no viral rebound compared to Paxlovid. A separate analysis found that COVID-19 vaccines delivered up to $809 in economic value per dollar spent in 2021, particularly benefiting high-income countries.
