log_date: '2026-11-19'
summary: Two new studies covering more than 1 million U.S. veterans found that updated COVID-19 vaccines protect against severe illness, adding real-world evidence on the current formulations. Doctors also addressed whether COVID-19 and flu shots can be given at the same time as colder weather and the holidays approach. Separately, the federal government is writing off $4.5 billion in outstanding debt tied to COVID-19 benefits that were sent to recipients later deemed ineligible.
