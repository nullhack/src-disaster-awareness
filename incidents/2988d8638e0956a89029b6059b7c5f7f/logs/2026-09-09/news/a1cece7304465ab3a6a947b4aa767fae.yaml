title: I dag modtager 1,3 millioner danskere tilbud om vaccination
body: Nu nærmer sæsonen for luftvejsinfektioner sig. Derfor inviterer Sundhedsstyrelsen og Statens Serum Institut 1,3 millioner danskere til vaccination mod influenza og covid-19. Det gælder alle på 65 år og derover. De kan forvente at få en invitation fra i dag onsdag. Det oplyser Sundhedsstyrelsen. Ifølge chef i Sun...
