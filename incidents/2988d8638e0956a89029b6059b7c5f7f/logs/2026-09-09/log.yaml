log_date: '2026-09-09'
summary: COVID-19 cases continue to rise in multiple U.S. states, including California and Tennessee, prompting health officials to urge residents to get vaccinated. Updated 2026-27 COVID-19 vaccines are being rolled out, and major medical groups have released independent guidance on fall vaccinations amid confusion over federal policies. A study also identified patient characteristics associated with risk for severe COVID-19 even after vaccination.
