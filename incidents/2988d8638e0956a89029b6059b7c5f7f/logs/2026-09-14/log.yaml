log_date: '2026-09-14'
summary: Updated COVID-19 vaccines for the 2026-27 season are rolling out in Florida, while China has approved a new mRNA vaccine targeting the JN.1 strain. A surge in Allegheny County, Pennsylvania, is prompting officials to encourage vaccination, and Thailand refuted claims of an emergency outbreak in Phuket, noting the virus is circulating normally. A study reported that long-term adverse effects after vaccination vary by brand, and the COVID-19 response of Dr. Amy Acton has become a central issue in the Ohio governor’s race.
