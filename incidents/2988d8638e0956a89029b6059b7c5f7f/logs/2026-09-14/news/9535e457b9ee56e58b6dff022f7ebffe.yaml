title: 'Get ready for flu season: Florida pharmacies rolling out new mRNA vaccines and updated COVID shots'
body: Florida pharmacies and clinics are now offering updated flu and COVID vaccines for the 2026-27 respiratory illness season, though some may be harder to find.
