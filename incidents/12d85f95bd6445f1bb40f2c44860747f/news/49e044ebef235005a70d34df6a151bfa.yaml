title: Central Peru earthquake leaves one dead, 853 displaced and damages homes, hospitals and schools
body: A magnitude 6.7 earthquake in central Peru killed one person, injured 16 and displaced 853 residents, damaging homes, health facilities, schools and churches across three departments.
