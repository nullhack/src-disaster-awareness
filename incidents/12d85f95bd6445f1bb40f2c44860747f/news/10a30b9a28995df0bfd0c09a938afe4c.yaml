title: Magnitude 6.7 Earthquake Hits Peru and Is Felt in Lima - JETSS
body: A magnitude 6.7 earthquake struck central Peru on Friday night, Nov. 20, and was felt in the capital, Lima. The U.S. Geological Survey (USGS) reported the quake at a depth of 142 kilometers (about 88 miles) and placed it about 9 kilometers (about 6 miles) from Lima. The Geophysical Institute of Peru (IGP) located the […]
