title: Strong magnitude 6.7 earthquake strikes Peru just outside of Lima
body: A magnitude 6.7 earthquake struck Peru just after 7:09 p.m. local time on Friday, shaking the region northeast of the capital city of Lima, which is home to roughly 10 million people.
