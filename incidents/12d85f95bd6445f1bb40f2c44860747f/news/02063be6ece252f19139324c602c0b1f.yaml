title: At least one woman injured and 39 homes affected by the 6.7 magnitude earthquake in Peru
body: At least one woman injured and 39 homes affected have been reported in Peru due to the 6.7 magnitude earthquake that shook the center of the Peruvian Andes this Friday and was felt in other neighboring countries such as Colombia and Ecuador, according to the latest report published by the Government
