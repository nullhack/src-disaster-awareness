title: 'Map: Earthquake Shakes Peru'
body: A strong, 6.7-magnitude earthquake struck in Peru on Friday, according to the United States Geological Survey. The temblor happened at 7:09 p.m. Peru time about 6 miles northeast of Carhuamayo, Peru, data from the agency shows.
