title: Magnitude 6.7 earthquake shakes central Peru with no immediate casualties reported
body: A magnitude 6.7 earthquake strikes the Andes in central Peru near Junín on 20th November 2026, prompting residents in Lima to rush outside with no immediate reports of damage or casualties.
