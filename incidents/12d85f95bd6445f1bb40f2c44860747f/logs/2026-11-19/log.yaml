log_date: '2026-11-19'
summary: A magnitude 6.0 earthquake struck off the coast of Peru in the early hours of Wednesday, 18 November 2026, according to Peru's Geophysical Institute (IGP), with one Brazilian outlet reporting the magnitude as 5.9 and a depth of nearly 22 km. No deaths were reported. The reports do not specify the epicenter's distance from the 13 November Changuillo area event or name the affected region.
