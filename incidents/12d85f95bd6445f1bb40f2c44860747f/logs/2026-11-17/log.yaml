log_date: '2026-11-17'
summary: Peru's Ica region was hit by two moderate earthquakes of magnitude 5.4 and 5.1 within seven minutes on 16 November, according to the country's seismology agency. One of these, an offshore M5.4 event, struck about 10 miles from the 13 November M5.8 epicenter and was felt in the capital, Lima. USGS and Peru's IGP reportedly differ over the depth of the M5.4 quake.
