title: Magnitude 5.8 Earthquake Strikes Peru During Pope Leo XIV’s Visit - JETSS
body: A magnitude 5.8 earthquake struck Peru’s coast on Friday, Nov. 13, while Pope Leo XIV was arriving in the country. The U.S. Geological Survey (USGS) reported that the quake was recorded at 11:43 a.m. local time. The area where the pope was staying was not affected. The epicenter was in the Pacific Ocean, about 79 […]
