title: 16 killed, 32 injured after 7.0-magnitude quake hits China's Xizang
body: Sixteen people were killed and 32 others injured after a 7.0-magnitude earthquake struck Baqen County of Nagqu City in southwest China's Xizang Autonomous Region at 10:33 p.m. Thursday (Beijing Time), according to the city's emergency management bureau.
