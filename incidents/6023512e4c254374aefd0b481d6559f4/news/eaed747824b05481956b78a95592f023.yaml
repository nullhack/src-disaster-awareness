title: Strong 7-magnitude earthquake hits China’s Tibet region, killing 16 and injuring dozens, state media reports
body: (CNN) — At least 16 people have died and dozens were injured after a magnitude 7 earthquake struck China’s Tibet region on Thursday, according to state news agency Xinhua.
