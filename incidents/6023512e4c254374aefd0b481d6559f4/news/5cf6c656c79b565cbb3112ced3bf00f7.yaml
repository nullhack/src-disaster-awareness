title: '3rd LD-Writethru: Casualties reported after 7.0-magnitude quake hits China''s Xizang'
body: LHASA, Oct. 22 (Xinhua) -- Casualties have been reported after a 7.0-magnitude earthquake struck Baqen County of Nagqu City in southwest China's Xizang Autonomous Region, at 10:33 p.m. Thursday (Beijing Time), said local authorities.
