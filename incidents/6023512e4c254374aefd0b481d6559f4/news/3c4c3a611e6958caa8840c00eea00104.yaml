title: 7.0-magnitude earthquake hits Tibet weeks after deadly floods and landslides near Nepal border- Moneycontrol.com
body: A powerful 7.0-magnitude earthquake hit the Nagqu region of northern Tibet at around 10.33 pm local time. The tremor comes weeks after deadly floods and landslides struck the Nepal-China border region.
