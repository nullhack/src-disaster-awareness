title: 7.0-magnitude earthquake kills 16 in Tibet’s Nagqu City
body: At least 16 people were killed and 54 injured after a 7.0-magnitude earthquake hit Baqen County in Tibet, prompting President Xi Jinping to order extensive search and rescue operations, and the upgrade of the earthquake emergency response level.
