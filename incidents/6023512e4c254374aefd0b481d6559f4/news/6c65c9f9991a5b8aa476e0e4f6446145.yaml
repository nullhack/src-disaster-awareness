title: At least 16 dead in Tibet after 7.0 earthquake, videos show people rushing out of shaking homes
body: A magnitude 7.0 earthquake struck China's Tibet region, killing at least 16 people, injuring 32, and collapsing more than 300 homes, according to local officials cited by Xinhua.
