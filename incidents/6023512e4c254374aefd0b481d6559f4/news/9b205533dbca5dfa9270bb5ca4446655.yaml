title: 4.5-magnitude earthquake strikes Tibet 30 hours after powerful tremor killed 16
body: This comes roughly 30 hours after a strong 7-magnitude earthquake rattled Tibet on Thursday, October 22, and claimed at least 16 lives. Besides the fatalities, the earlier quake reportedly left 76 people injured.
