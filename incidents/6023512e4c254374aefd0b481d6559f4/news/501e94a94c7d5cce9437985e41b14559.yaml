title: Strong 7-magnitude earthquake strikes China’s Tibet region
body: By Sophie Tanno, CNN (CNN) — A strong magnitude 7 earthquake struck China’s Tibet at 10.30 p.m. local time on Thursday, according to the United States Geological Survey (USGS). The epicenter was 183 kilometers East-Northeast of the city of Nagqu in western China’s Tibet Autonomous Region, USGS data shows. The scope of the damage is
