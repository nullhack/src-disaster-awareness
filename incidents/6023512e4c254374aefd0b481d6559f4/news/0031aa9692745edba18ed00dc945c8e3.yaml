title: 'Tibet Earthquake: Several killed, 54 Injured As 339 Homes Collapse In Nagqu | Outlook India'
body: At least 16 people were killed and 54 injured after a magnitude-7 earthquake hit Tibet’s Nagqu region late Thursday, collapsing 339 homes and triggering large-scale rescue operations.
