title: Quake-affected students resume relocated schooling in Lhasa, China's Xizang
body: Over a thousand students from two primary schools in Baqen County of Nagqu City, southwest China's Xizang Autonomous Region, resumed classes at a school in Lhasa on Wednesday. A 7.0-magnitude earthquake caused severe damage to the two primary schools on Oct. 22, 2026. To ensure relocated schooling, teachers and students from the two schools were transferred to a school in Lhasa, minimizing the disruption to the teaching caused by the earthquake.
