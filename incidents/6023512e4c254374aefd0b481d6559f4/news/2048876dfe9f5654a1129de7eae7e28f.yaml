title: 7.0 magnitude earthquake strikes Tibet, weeks after devastating flash floods - DD India
body: A powerful earthquake measuring 7.0 on the Richter scale struck Tibet at around 8.03 p.m. on Thursday, raising fresh concerns in a region still recovering from devastating flash floods last month. According to India’s National Centre for Seismology (NCS), the earthquake occurred at a depth of 173 kilometres below the Earth’s surface. The epicentre was […]
