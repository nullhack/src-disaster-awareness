title: How a county in Xizang reflects China’s established systems
body: 'In Baqen county, a remote area in Xizang region, 48 hours after a quake, the lights came back on. No country can completely avoid natural disasters; however, the mechanisms for responding to disasters reveal the differing levels of implementation capacity across national systems. China upholds a simple principle: No one is left behind.'
