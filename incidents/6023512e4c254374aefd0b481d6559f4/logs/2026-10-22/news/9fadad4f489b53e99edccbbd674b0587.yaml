title: 'Magnitude-7.0 earthquake jolts China''s Xizang: CENC'
body: A magnitude 7.0 earthquake struck Baqen County, Nagqu City, Xizang Autonomous Region, at 22:33 on Thursday, according to China Earthquake Networks Center (CENC). The quake's epicenter was measured at 32.40 degrees north latitude and 93.79 degrees east longitude, with a depth of 10 kilometers.
