title: 'Strong tremor of magnitude 7 strikes China’s Tibet, disaster potentially widespread: USGS'
body: A powerful magnitude 7.0 earthquake struck China's Tibet autonomous region, which Beijing officially calls the Xizang autonomous region, on Thursday, as the US Geological Survey (USGS) warned of potentially widespread damage.
