title: Earthquake of magnitude 7 strikes China's Tibet
body: Oct 22 (Reuters) - An earthquake of magnitude 7 struck China's southwestern region of Tibet at around 10:33 p.m. (1433 GMT) on Thursday, the China Earthquake Networks Center (CENC) said. It was not immediately known if there were any casualties or damage.
