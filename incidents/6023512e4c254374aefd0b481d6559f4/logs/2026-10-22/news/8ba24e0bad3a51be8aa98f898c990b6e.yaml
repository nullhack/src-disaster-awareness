title: Strong 7.0-magnitude quake strikes China’s Tibet - Jamaica Observer
body: BEIJING, China (AFP)—A strong 7.0-magnitude earthquake struck China&#039;s Tibet region late Thursday, US seismologists said, but there were no immediate reports of casualties or damage. The epicentre of the quake, which struck at 10:33 pm (1433 GMT), was located in a mountainous area about 190 kilometres (120 miles) east-northeast of Nagqu, and 390 kilometres northeast of the regional capital Lhasa. It struck at a shallow depth of 10 kilometres. The...
