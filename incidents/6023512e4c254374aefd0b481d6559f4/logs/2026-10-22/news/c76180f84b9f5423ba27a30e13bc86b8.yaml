title: 'Strong Earthquake Hits Northern Tibet in China: What We Know About the 7.0 Magnitude Tremor'
body: A 7.0 magnitude earthquake struck northern Tibet late Thursday, with its epicentre in Nagqu at a depth of 10 km. The high-altitude location lies around 400 km from Lhasa.
