log_date: '2026-10-22'
summary: A magnitude 7.0 earthquake struck the Nagqu region of Tibet, China, on October 22, 2026, at a depth of 10 km, according to USGS and CENC. The quake caused injuries (at least two reported) and damaged homes, prompting emergency rescue teams to be dispatched. The earthquake occurred weeks after deadly floods had affected the region.
