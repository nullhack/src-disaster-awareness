title: HH the Amir Sends Condolences to President of China
body: Doha, October 24 (QNA) - HH the Amir Sheikh Tamim bin Hamad Al-Thani sent a cable of condolences to HE President of the People's Republic of China Xi Jinping on the victims of the earthquake that struck the Xizang region in southwest China. His Highness wished those injured a speedy recovery.
