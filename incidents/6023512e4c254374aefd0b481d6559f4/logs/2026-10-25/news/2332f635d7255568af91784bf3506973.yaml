title: ทิเบตเจอแผ่นดินไหวซ้ำ 5.8 หลังธรณีพิโรธครั้งใหญ่คร่าชีวิต 16 ราย | เดลินิวส์
body: แผ่นดินไหว 5.8 ในเขตปกครองตนเองทิเบตของจีน หลังเพิ่งเกิดแผ่นดินไหวรุนแรง 7.0 เมื่อไม่กี่วันก่อนหน้านั้น ซึ่งทำให้มีผู้เสียชีวิตอย่างน้อย 16 ราย
