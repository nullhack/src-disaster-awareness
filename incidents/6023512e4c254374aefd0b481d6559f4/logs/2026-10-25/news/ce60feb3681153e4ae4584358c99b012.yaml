title: China earmarks 80 mln yuan for Xizang quake relief, recovery efforts - Peoples' Review
body: BEIJING, Oct. 23 (Xinhua) — China has allocated 50 million yuan (about 7.5 million U.S. dollars) in emergency disaster relief funds and earmarked another 30 million yuan for recovery efforts following a 7.0-magnitude earthquake in southwest China’s Xizang Autonomous Region. The earthquake struck Baqen County of the city of Nagqu at 10:33 p.m. on Thursday, […]
