title: Rescue efforts race against time after magnitude-7.0 earthquake in Xizang earthquake; over 12,000 residents relocated
body: Earthquake relief operations continued on Sunday after a magnitude-7.0 earthquake struck Baqen County of the city of Nagqu in Southwest China's Xizang Autonomous Region, leaving16 people dead and 76 others injured. Relief supplies covering 20 categories had arrived, power supply had been fully restored, and medical treatment and disease prevention efforts were underway in the affected areas.
