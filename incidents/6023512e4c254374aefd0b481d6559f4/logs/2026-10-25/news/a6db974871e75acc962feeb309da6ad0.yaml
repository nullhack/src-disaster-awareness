title: Rescuers search for survivors after deadly earthquake in China’s Tibet region | Texarkana Gazette
body: BEIJING -- Rescuers combed through a remote area in the Chinese region of Tibet on Friday after a magnitude 7 earthquake killed at least 16 people, injured 76 and collapsed hundreds of homes, according to Chinese state media.
