log_date: '2026-10-25'
summary: |-
  Rescue operations involving 15 search dogs and 350 personnel continued. A volunteer was seen making noodles for displaced persons in a quake-hit village, indicating ongoing relief. The Amir of Qatar sent condolences to President Xi Jinping on October 24.
  A 5.8-magnitude aftershock struck the Nagqu region in Tibet on October 25, following the major M7.0 earthquake. Power has been fully restored in the affected areas, and relief supplies covering 20 categories have arrived. Community relief efforts include a restaurant owner providing 1,500 kg of dumplings to displaced residents.
