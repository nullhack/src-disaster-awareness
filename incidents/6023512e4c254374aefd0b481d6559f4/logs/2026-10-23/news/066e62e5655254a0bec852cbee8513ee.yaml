title: 16 dead, 65 injured after 7.0 magnitude earthquake strikes Tibet
body: A powerful magnitude 7.0 earthquake struck China's Tibet region on Thursday, resulting in at least 16 fatalities and 54 injuries. The quake, with its epicentre east-northeast of Nagqu city, caused significant damage, including the collapse of 339 houses, and led to the suspension of train services. Rescue operations are underway, with Chinese President Xi Jinping calling for all-out relief efforts.
