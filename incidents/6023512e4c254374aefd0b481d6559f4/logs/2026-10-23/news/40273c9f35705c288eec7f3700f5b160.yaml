title: 7.0 Magnitude Earthquake hits China’s Tibet, killing 16 - Peoples' Review
body: 'Kathmandu, Oct 23: At least 16 people were killed and 32 injured in a powerful 7.0 magnitude earthquake that struck China’s Tibet Autonomous Region on Thursday evening. According to Chinese state media, more than 300 houses collapsed in Nagqu, a city in northern Tibet. The Nagqu Information Office, citing government officials, said at least 339 […]'
