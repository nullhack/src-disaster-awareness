title: 'Tibet earthquake: Terrifying videos show 7.0-magnitude quake shake buildings, 300 houses collapse (watch)'
body: A massive 7.0-magnitude earthquake struck a remote area of Tibet on Thursday night, resulting in at least 16 fatalities and dozens of injuries. The powerful tremor damaged hundreds of homes, prompting the deployment of over 300 police officers for rescue operations.
