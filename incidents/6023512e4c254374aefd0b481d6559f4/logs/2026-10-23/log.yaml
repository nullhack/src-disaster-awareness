log_date: '2026-10-23'
summary: |-
  A magnitude 7.0 earthquake in Nagqu, Tibet, has resulted in at least 16 deaths, dozens of injuries (ranging from 32 to 65 reported), and the collapse of over 300 homes. Chinese President Xi Jinping has ordered all-out search and rescue efforts, with more than 1,600 emergency personnel deployed to assist survivors.
  Injuries from the Nagqu earthquake have risen to 65, while the death toll remains at 16. A survivor was pulled from the rubble, and over 12,000 people have been relocated. China has allocated 80 million yuan for relief and activated a Level III geological disaster response, with rescue teams and search dogs continuing to comb through the debris.
