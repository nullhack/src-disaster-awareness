title: Earthquake-hit county sets up 2,686 temporary housing units in Xizang
body: Authorities have built 2,686 prefabricated housing units at 34 resettlement sites in Baqen County, in Nagqu, in southwest China’s Xizang Autonomous Region, after a magnitude 7.0-earthquake, the Xizang regional earthquake emergency response headquarters said.
