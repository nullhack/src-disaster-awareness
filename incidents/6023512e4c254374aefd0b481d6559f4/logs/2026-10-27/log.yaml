log_date: '2026-10-27'
summary: |-
  Rescue teams recovered valuables such as thangkas and Buddhist scriptures from the rubble in Baqen County. China's Ministry of Natural Resources completed geological hazard inspections within 50 km of the epicenter. Displaced residents have begun moving into prefabricated homes three days after the earthquake.
  News reports indicate that affected residents in Maru Township’s pastoral village have been settled into temporary post-disaster homes. China Gold International Resources confirmed that operations at the Jiama Mine were unaffected by the earthquake and the company has reaffirmed its annual production guidance. Additionally, the United Arab Emirates expressed solidarity with China and conveyed condolences over the earthquake’s victims.
