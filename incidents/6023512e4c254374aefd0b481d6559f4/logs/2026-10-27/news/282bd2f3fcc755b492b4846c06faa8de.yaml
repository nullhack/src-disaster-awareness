title: InPics | Quake-affected residents move into prefab homes in Xizang
body: BAQEN, Oct. 26 (Xinhua) -- The first 60 prefabricated housing units in the earthquake zone were completed at 2:10 a.m. on Oct. 25, and electricity was connected to the units by 8 p.m. on the same day.
