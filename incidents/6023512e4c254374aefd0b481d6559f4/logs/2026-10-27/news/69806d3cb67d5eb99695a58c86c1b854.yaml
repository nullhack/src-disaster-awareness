title: China Gold International Resources Reports Operations at the Jiama Mine Unaffected by the Earthquake and Reaffirms Annual Production Guidance
body: China Gold International Resources Corp. Ltd. reports that operations at its Jiama Copper-Gold Polymetallic Mine have not been affected by the earthquake in Tibet Autonomous Region. The Company reaffirms its annual production guidance for the Jiama... - Veroeffentlicht am 27.10.2026
