title: China completes geological hazard inspections near Xizang earthquake epicenter
body: China's Ministry of Natural Resources has completed inspections of potential geological hazard sites within 50 kilometers (about 31 miles) of the epicenter of a magnitude 7.0 earthquake that struck Baqen County in Nagqu, in southwestern China's Xizang Autonomous Region on Thursday, the ministry said.
