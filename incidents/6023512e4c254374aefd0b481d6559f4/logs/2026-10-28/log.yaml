log_date: '2026-10-28'
summary: Experts from China's Ministry of Natural Resources have warned that secondary geological hazards from the Nagqu earthquake may still pose risks over the medium to long term, despite limited immediate impacts. Volunteers continue relief efforts, with a photo story showing individuals serving stir-fried rice noodles to displaced residents. A rural boarding school reported that all 120 students safely evacuated within three minutes of the quake, crediting years of regular drills.
