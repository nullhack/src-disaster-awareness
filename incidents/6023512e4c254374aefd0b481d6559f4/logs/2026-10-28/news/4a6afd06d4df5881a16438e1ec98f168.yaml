title: Experts warn of geohazard risks after 7.0-magnitude earthquake in Xizang
body: XINING; Secondary geological hazards triggered by the magnitude-7.0 earthquake in Drachen county, Nagchu city, in the Xizang autonomous region have been limited so far, but the risks over the medium to long term should not be ignored, experts from the Ministry of Natural Resources told Xinhua News Agency on Monday.
