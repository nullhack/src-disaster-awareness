title: China's Information Crackdown on Earthquake in Tibet
body: November 2, 2026HRRC condemns the suppression of information concerning any rescue efforts and human casualties in Tibet. We also urge the authorities to drop any charges against individuals who report on the situations. On October 22, 2026, an earthquake of magnitude 7 struck the Nagqu Prefecture, the northern region of Tibet, that resulted in 16 deaths and 76 casualties. According to official reports, there have been a total of 2,054 aftershocks. Local authorities relocated 12,964 people and a
