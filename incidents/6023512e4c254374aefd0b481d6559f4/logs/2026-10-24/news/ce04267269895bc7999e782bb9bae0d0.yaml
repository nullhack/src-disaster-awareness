title: Vietnamese leaders extend sympathies over serious earthquake in Tibet, China
body: Vietnamese Party and State leaders on October 23 sent messages of sympathy to their Chinese counterparts following a devastating earthquake that struck Baqing county, Nagqu city, in the Tibet Autonomous Region of China on the evening of October 22, causing heavy losses of life and property.
