log_date: '2026-10-24'
summary: A 4.5-magnitude aftershock struck the Nagqu region on October 24, about 30 hours after the main M7.0 earthquake. Injury totals from the initial quake have been revised upward to 76 in some reports, while rescue teams continue operations amid ongoing transportation disruptions, including the closure of Highway 317 and halted railway services.
