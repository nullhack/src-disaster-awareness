title: Magnitude 5.6 quake strikes off Guatemala coast, shakes El Salvador, Nicaragua
body: GUATEMALA CITY, Nov 10 (Reuters) - A magnitude 5.6 earthquake struck off the coast of Guatemala on Tuesday morning, according to the United States Geological Survey, causing buildings in the capital Guatemala City to shake.
