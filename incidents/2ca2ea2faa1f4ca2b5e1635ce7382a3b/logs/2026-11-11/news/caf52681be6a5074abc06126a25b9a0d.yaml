title: Magnitude 5.6 earthquake strikes near Guatemala — RMF24
body: A magnitude 5.6 earthquake struck off Guatemala’s coast. Tremors were felt in Guatemala, El Salvador and Nicaragua, with no reported casualties or serious damage.
