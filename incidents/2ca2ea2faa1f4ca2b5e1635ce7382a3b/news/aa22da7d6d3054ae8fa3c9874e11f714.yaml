title: Magnitude 5.6 na lindol, tumama sa baybayin ng Guatemala
body: Nagdulot ng pagyanig sa mga gusali sa Guatemala City ang magnitude 5.6 na lindol sa karagatan sa baybayin ng Guatemala. Wala pang paunang ulat ng malawakang pinsala o nasawi.
