title: 5.6-Magnitude Earthquake Strikes off Coast of Guatemala
body: Guatemala City, November 11 (QNA) â€“ The United States Geological Survey (USGS) reported that a 5.6-magnitude earthquake struck off the coast of Guatemala, causing buildings in the capital to shake. There have been no immediate reports of injuries or damage resulting from the earthquake. The USGS stated that the earthquake occurred 43 kilometers south of the coastal town of Puerto San Jose, at a depth of 35 kilometers. The tremor was also felt by residents in El Salvador and Nicaragua; both countries indicated that there is no risk of a tsunami. On September 16, a 5.3-magnitude earthquake struck southern Guatemala. Guatemala is located over an active geological zone, which frequently triggers strong earthquakes across Central American and the Caribbean. (QNA)
