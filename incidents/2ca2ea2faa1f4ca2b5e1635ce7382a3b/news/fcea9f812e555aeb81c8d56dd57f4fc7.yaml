title: A magnitude 5.6 earthquake struck off Guatemala's Pacific coast with no tsunami threat
body: An offshore earthquake of magnitude 5.6 hit the sea south of Guatemala at 14:54 UTC on Nov. 10, or 8:54 a.m. local time. The epicenter sat 43 km south of Puerto San José, the port town on the Pacific coast of Escuintla department.
