title: Remote Chinese province struck by 2 earthquakes in 20 minutes
body: China's remote Qinghai province has been struck by two earthquakes minutes apart. The United States Geological Survey says the earthquakes with magnitudes of 5.7 and 5.8 occurred at 11:16 a.m. and 11:34 a.m.
