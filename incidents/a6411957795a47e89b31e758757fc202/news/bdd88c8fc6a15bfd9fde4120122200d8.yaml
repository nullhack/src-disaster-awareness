title: Hundreds Rescued From Greek Beaches by Small Boats as Raging Wildfires Force Evacuations
body: Hundreds of tourists were evacuated from northern Greece beaches due to raging wildfires. Despite firefighting efforts, the fires spread rapidly, prompting sea rescues and emergency alerts.
