title: European wildfires continue, with record land burned and nuclear plants on verge of shutdown
body: Europe entered August with severe wildfires burning in Greece, France, Spain and Turkey, hundreds more scattered fires underway in Romania, and a drought and fire crisis threatening nuclear power provision in Britain, Hungary and Romania.
