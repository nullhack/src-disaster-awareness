title: Firefighters battle wildfires in Belgium and Greece as 2 die on an island near Athens
body: Firefighters are battling wildfires in Belgium and Greece, with a massive blaze scorching a nature reserve in eastern Belgium. A fire on a Greek island has killed two people. The blaze in Belgium has burned about 30 square kilometers in the High Fens, one of the country's worst wildfires in recent history. Authorities evacuated about 600 residents and tourists as smoke spread through the area. Belgium has activated the EU's civil protection mechanism to receive assistance from other countries. Sweden and the Netherlands have sent firefighting aircraft. The fires follow weeks of unusually hot and dry weather across Europe.
