title: Wildfires spread across Greece, conditions worsen in France and Spain
body: ATHENS/ CARCES, France Aug 1 (Reuters) - Wildfires fanned by gale-force winds burned across multiple areas of Greece on Saturday, forcing residents to flee as conditions worsened again in parts of Spain and France.
