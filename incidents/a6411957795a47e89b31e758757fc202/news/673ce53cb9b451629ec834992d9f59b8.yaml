title: Helicopter crew killed in Greece fires
body: PSATHA, Greece - The two-man crew of a firefighting helicopter was killed in a midair collision in Greece Sunday as forces battled multiple wildfires that have devastated swathes of land. Two hired Bell helicopters collided while battling a wildfire in the Psatha area west of Athens,
