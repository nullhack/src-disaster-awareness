title: 2 firefighting choppers collide battling wildfire in Greece; rescue op underway
body: The crash occurred during an aerial firefighting mission over the Psatha area in Attica, where hundreds of firefighters, aircraft and heavy machinery have been deployed to contain one of the country's largest wildfires this summer.
