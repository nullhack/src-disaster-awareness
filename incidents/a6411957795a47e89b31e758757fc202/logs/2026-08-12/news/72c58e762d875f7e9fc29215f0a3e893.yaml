title: Firefighters in Greece extinguish flames amid wind, heat warning | Arkansas Democrat Gazette
body: ATHENS, Greece -- Firefighters west of Athens raced to exploit a break in high winds on Tuesday, working to strengthen containment lines as forecasters warned that stronger gusts and rising temperatures would return in the coming days.
