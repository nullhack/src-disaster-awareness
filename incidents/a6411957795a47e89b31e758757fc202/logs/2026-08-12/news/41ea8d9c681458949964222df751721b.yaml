title: Europe's hot, dry summer takes its toll with fires in France and Greece, and drought in the UK
body: Europe is grappling with a record-breaking hot and dry summer. Water-dropping planes on Monday tackled a major wildfire in Greece while firefighters in France worked to stabilize a blaze in Provence. The United Kingdom recorded its driest July in nearly two centuries. Strong winds returned in Greece, pushing flames into mountain home clusters, destroying farms and property, and closing a highway. In France, firefighters guarded against flare-ups near Bordeaux. The U.K. weather service reported a prolonged heat wave and lack of rainfall. Europe is the fastest-warming continent, with rising temperatures and droughts making wildfires more intense.
