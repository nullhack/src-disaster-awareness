title: German Chancellor Merz visits Hürtgen Forest fire site amid boos and whistles
body: Chancellor Friedrich Merz travelled to Hürtgenwald today, as firefighting in Belgium's High Fens continues. The blaze on the German border is out, but ahead of his visit he faced opposition criticism for 'doing nothing'.
