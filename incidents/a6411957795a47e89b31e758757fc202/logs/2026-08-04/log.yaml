log_date: '2026-08-04'
summary: Greece faced severe wildfires in late July and early August 2026, with a major blaze northwest of Athens destroying over 100 homes and burning thousands of hectares. On August 2, two firefighting helicopters collided in mid-air near Psatha, killing two crew members. By August 3, water-dropping aircraft continued to battle the fires, which had been fueled by extreme winds and record-breaking heat, with over 200 fires reported across the country since July 27.
