title: France, Spain win some respite, as wildfire battles rage across Europe | Jefferson City News-Tribune
body: France, Spain and Greece battled major wildfires Thursday, with Spain bringing one blaze under control but facing new threats as intense heat, dry vegetation and powerful winds kept much of southern Europe on alert.
