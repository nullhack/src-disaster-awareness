title: Flames engulf trees and vegetation west of Athens as firefighters tackle major wildfire
body: Water-dropping planes and helicopters continued to help hundreds of firefighters battling a major wildfire west of Athens on Monday, a day after a midair collision between two firefighting helicopters killed two crew members.
