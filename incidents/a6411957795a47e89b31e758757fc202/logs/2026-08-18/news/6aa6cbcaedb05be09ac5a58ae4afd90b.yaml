title: Belgium wildfire continues to rage | Arkansas Democrat Gazette
body: SOURBRODT, Belgium -- One of Belgium's biggest wildfires blazed out of control Monday even as cooler weather and rain in the morning eased conditions for hundreds of firefighters in remote and hilly countryside. In Greece, a fire briefly flared up near the main airport on the outskirts of Athens.
