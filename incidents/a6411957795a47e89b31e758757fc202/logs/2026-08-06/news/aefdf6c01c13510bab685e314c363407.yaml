title: 2 killed when firefighting helicopters collide near Athens as Europe’s wildfire emergency rages
body: Greece’s fire department says the collision of two firefighting helicopters battling a major wildfire burning out of control west of Athens left two crew members dead, while another two were recovered alive. The fire department said on Sunday the dead crew members were one Greek and one Danish national, while the two who were recovered alive were one Greek and one British national. Foreign firefighting and helicopter crews are often deployed in Greece to help tackle wildfires during the country’s hot, dry summers. The collision laid bare the danger at the most volatile front of Europe’s wildfire emergency.
