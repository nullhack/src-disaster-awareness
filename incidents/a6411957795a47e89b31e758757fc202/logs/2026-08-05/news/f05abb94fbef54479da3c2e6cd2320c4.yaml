title: Europe’s wildfire crisis eases in west as danger shifts east to Greece
body: Firefighters have contained a vast wildfire in southwestern France, allowing nearly 200,000 people to return home. The development comes after what may have been the country’s largest peacetime evacuation. However, renewed fires have forced thousands from their homes in other parts of France and Greece. In the Var region, a fire thought to be under control raced across 10 square kilometers in just six hours. Meanwhile, in Greece, gale-force winds have driven flames through the coastal area between Athens and Thebes, leading to evacuations. Rising temperatures and prolonged droughts are making Europe more vulnerable to such wildfires.
