title: As France tames wildfire and lets 84,000 evacuees go home, blazes flare across Europe
body: France has allowed 84,000 evacuees to return home after a massive wildfire, signaling progress in battling the flames. The fire has burned an area four times the size of Paris. However, wildfires continue to flare across Europe, fueled by an exceptionally hot and dry summer. Firefighters are tackling blazes in the U.K., Spain, Germany, Greece, and Turkey. Hollywood star George Clooney evacuated his French home due to a nearby fire. In France, authorities are using water cannons and international aid to control the situation. Cooler weather and rain are helping efforts, but conditions remain challenging.
