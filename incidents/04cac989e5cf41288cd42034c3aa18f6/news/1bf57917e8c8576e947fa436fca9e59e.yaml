title: Expert Colorado State forecast team makes June update
body: The hurricane research team at Colorado State University, which offered up a tempered-down forecast of tropical cyclone activity before the start of the Atlantic hurricane season, have updated it with an even milder forecast. The CSU researchers have reduced their original forecast slightly and continue to call for a below-average Atlantic hurricane season with their updated 2026 projection.
