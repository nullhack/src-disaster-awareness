title: 'First Alert Forecast: Wet Weather on the Way'
body: The remnants of tropical cyclone Norbert are percolating just upstream in the trade wind flow and they are expected to start dampening our state sometime tonight. The wet weather will last into Friday. Windward and mauka neighborhoods are expected to get the lion’s share of the moisture, but leeward areas should be ready.
