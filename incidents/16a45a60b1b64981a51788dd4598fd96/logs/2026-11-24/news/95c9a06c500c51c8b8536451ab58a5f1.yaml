title: Earthquake | హిందూ మహాసముద్రంలో భూకంపం.. రిక్టర్ స్కేలుపై 6.4 తీవ్రత నమోదు..!
body: Earthquake | హిందూ మహాసముద్రం (Indian Ocean) లో ఇవాళ (మంగళవారం) భూకంపం (Earthquake) సంభవించింది. మారిషస్ దేశానికి సమీప ప్రాంతంలో ఈ భూకంపం వచ్చింది. రిక్టర్ స్కేలుపై ఆ భూకంప తీవ్రత 6.4 గా నమోదైంది. అమెరికా భూగర్భ పరిశోధన సంస్థ (USGS) వెల్లడించిన వివరాల ప్రకారం.. భూకంప కేంద్రం మారిషస్-రీయూనియన్ ప్రాంతంలోని సముద్ర గర్భంలో ఉంది.
