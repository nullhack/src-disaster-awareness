log_date: '2026-11-24'
summary: A magnitude 6.4–6.5 earthquake struck the Indian Ocean in the Mauritius–Réunion region on 24 November 2026, with the epicenter reported about 326 km northeast of Rodrigues. Tremors were felt across Mauritius, causing residents to rush outdoors, while initial reports indicated no deaths, injuries, or major structural damage. Monitoring agencies reported no tsunami threat or official warning, though Rodrigues was briefly placed under a tsunami watch and sources differed slightly on the magnitude.
