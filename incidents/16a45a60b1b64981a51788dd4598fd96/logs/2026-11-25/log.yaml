log_date: '2026-11-25'
summary: Sri Lanka's National Tsunami Early Warning Centre confirmed there is no tsunami threat to Sri Lanka from the 6.5-magnitude earthquake in the Mauritius–Réunion region, according to reports by Sri Lankan outlets. A Russian report reiterated that the quake measured 6.4 off the coast of Mauritius. No new details on damage, casualties, or local impacts in Mauritius or Rodrigues were reported.
