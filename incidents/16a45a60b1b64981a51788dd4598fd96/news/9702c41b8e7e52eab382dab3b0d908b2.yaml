title: ඉන්දියන් සාගරයේ භූචලනයෙන් ලංකාවට අවදානමක් නැහැ
body: ඉන්දියන් සාගරයේ ඇතිවූ 6.5ක ප්රබලත්වයෙන් යුත් භූචලනය සම්බන්ධයෙන් මෙරටට සුනාමි අවදානමක් නොමැති බව ජාතික සුනාමි පූර්ව අනතුරු ඇඟවීමේ මධ්යස්ථානය සඳහන් කරනවා. ඉන්දියානු සාගරයේ මොරිෂස් සහ රියූනියන් (Mauritius / Reunion) කලාපයේ අද (24) පස්වරුවේ මෙලෙස භූකම්පනයක් ඇතිව තිබෙනවා. ඒ අනුව, රික්ටර් මාපකයේ 6.5ක විශාලත්වයකින් යුත් භූ චලනයක් සිදුව ඇති බවයි කාලගුණ විද්යා දෙපාර්තමේන්තුවේ ජාතික සුනාමි පූර්ව [...]
