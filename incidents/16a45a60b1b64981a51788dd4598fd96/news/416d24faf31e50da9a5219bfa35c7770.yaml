title: મોરેશિયસમાં 6.4ની તીવ્રતાનો ભૂકંપ, લોકોમાં ગભરાટ ફેલાયો
body: 'પોર્ટ લુઇસ: પૂર્વ આફ્રિકાના દેશ મોરેશિયસમાં આજે તીવ્ર ભૂકંપના આંચકા અનુભવાયા હતા. જેની રિક્ટર સ્કેલ પર તીવ્રતા 6.4 નોંધવામાં આવી હતી. આ ભૂકંપ હિંદ મહાસાગર...'
