title: మారిషస్లో భూకంపం.. రిక్టర్ స్కేలుపై 6.4 తీవ్రత నమోదు..
body: మారిషస్ సమీపంలోని హిందూ మహాసముద్ర ప్రాంతంలో మంగళవారం భూకంపం సంభవించింది. రిక్టర్ స్కేలుపై దీని తీవ్రత 6.4గా నమోదైంది.
