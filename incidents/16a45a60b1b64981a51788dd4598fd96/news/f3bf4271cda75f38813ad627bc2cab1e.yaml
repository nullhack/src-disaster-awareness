title: 6.4-magnitude earthquake strikes near Mauritius, no tsunami warning issued
body: A strong earthquake measuring up to 6.4 magnitude struck the Indian Ocean near Mauritius on Tuesday, with tremors felt across the island. No major damage or casualties were immediately reported, and no official tsunami warning was issued for Mauritius or Reunion.
