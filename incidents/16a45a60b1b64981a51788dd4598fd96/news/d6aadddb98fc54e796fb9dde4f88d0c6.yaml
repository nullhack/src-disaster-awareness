title: No Tsunami Threat After 6.4-Magnitude Earthquake Strikes Near Mauritius
body: A 6.4-magnitude earthquake struck east of Rodrigues on 24 November. Monitoring agencies estimated no tsunami threat, while no deaths, injuries or structural damage were initially reported.
