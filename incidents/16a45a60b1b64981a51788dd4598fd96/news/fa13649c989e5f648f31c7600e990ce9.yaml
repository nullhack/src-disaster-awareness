title: Tsunami Warning in Sri Lanka After the 24 November Quake? No, Coasts Were Declared Safe - Fact Crescendo Sri Lanka English | The leading fact-checking website
body: 'Get daily facts on our WhatsApp channel: join here. Less than two hours after a strong earthquake in the Indian Ocean on the evening of 24 November 2026, Tamil-language posts began telling people in Sri Lanka that a tsunami warning had been issued and that the Disaster Management unit wanted everyone to leave the coast […]'
