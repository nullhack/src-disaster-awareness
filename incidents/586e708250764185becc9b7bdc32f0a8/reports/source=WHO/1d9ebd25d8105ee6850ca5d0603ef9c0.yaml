  Summary: "On 4 November 2026, health authorities in the canton of Ticino, Switzerland, in coordination with federal authorities, reported four locally acquired cases of chikungunya virus disease. These are the first reported locally acquired chikungunya cases in Switzerland. The earliest reported symptom onset was 10 August 2026, although this infection was identified retrospectively and the source of infection could not be identified. All cases were identified in October 2026. None of the affected individuals reported recent travel to areas with known chikungunya virus transmission, and all four resided in the same geographically defined area. All cases had a favourable clinical course, although joint symptoms persisted in some individuals.\r\n\r\nThe Asian tiger mosquito (Aedes albopictus), a competent vector for chikungunya virus, is established in several Swiss cantons, including Ticino. Public health authorities have implemented active case finding, enhanced health care-provider awareness,\
    \ entomological investigations, targeted vector-control interventions and risk communication. No additional suspected cases were identified through enhanced surveillance and active case finding among health care providers and the two emergency departments serving the affected area.\r\n\r\nBased on the currently available information and the seasonal decline in mosquito activity, the risk of further local transmission is considered low. However, the event demonstrates that local chikungunya transmission is possible in Switzerland following introduction of the virus into areas where competent Aedes mosquito populations are established."
