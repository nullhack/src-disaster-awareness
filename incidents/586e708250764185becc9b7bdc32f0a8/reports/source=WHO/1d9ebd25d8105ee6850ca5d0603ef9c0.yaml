  Response: <p>The Cantonal Medical Office in Ticino, in collaboration with the University of Applied Sciences and Arts of Southern Switzerland, municipal authorities and the relevant federal authorities, has implemented the following measures:</p><ul type="disc"><li><strong>Epidemiological investigation and active case finding:</strong> A broader epidemiological investigation was initiated on 22 October 2026      following identification of the third case. Health care providers practising      in the affected area and the two emergency departments serving the local      population were contacted to increase awareness and facilitate the      detection of potentially unrecognized infections. An official      communication was subsequently distributed to all practising physicians in      Ticino, encouraging increased clinical vigilance. No additional suspected      cases were identified through active case finding.</li><li><strong>Vector-control measures:</strong> Targeted vector-control      measures
    began on 26 October and included door-to-door interventions, such      as to kill adult mosquitoes and treatment of standing water to kill larvae.      These emergency interventions supplemented the routine mosquito-control      programme implemented throughout Ticino.</li><li><strong>Entomological surveillance:</strong> Mosquitoes      collected in the affected area were tested by RT-PCR, with no chikungunya      virus RNA detected. Established entomological surveillance continues at      multiple monitoring sites in Ticino.</li><li><strong>Risk communication and prevention:</strong> Public      communication activities were implemented to increase awareness among the      general population and health care professionals. Messages emphasized      personal protection against mosquito bites and continued action to prevent      and control <em>Ae. albopictus</em>. Travellers returning from affected      areas were advised to protect themselves from mosquito bites for 14 days      after
    their return to reduce the possibility of onward local transmission.</li></ul>
