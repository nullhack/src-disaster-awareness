title: 'Unusual pathogen: Fatal viral infection identified during advanced cancer immunotherapy'
body: Modern immunotherapy may leave patients vulnerable to rare and potentially severe infections, according to a case study by researchers at the University Medical Center Hamburg-Eppendorf (UKE) and the Leibniz Institute of Virology (LIV). The team identified an avian virus, typically harmless to humans, as the cause of a fatal brain infection in a cancer patient.
