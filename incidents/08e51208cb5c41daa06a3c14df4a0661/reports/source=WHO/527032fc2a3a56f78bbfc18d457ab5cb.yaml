  Summary: "On 20 October 2026, the National IHR Focal Point (NFP) of France notified WHO regarding the first documented human infection with Shamonda virus (SHAV). The case was an immunocompromised older man from eastern France with no travel history during the preceding year. He developed severe neurological illness on 23 September 2026 and was diagnosed with severe encephalitis (brain inflammation). The patient died on 8 October 2026. \r\nSHAV is recognized primarily as an animal-associated virus, like the closely related Schmallenberg virus circulating in Europe, with no previously documented human infections.\r\nSHAV was confirmed by metagenomic sequencing and reverse transcription polymerase chain reaction (RT-PCR), with high viral loads detected in tissue samples collected after death and other causes of encephalitis excluded. There is currently widespread SHAV circulation in animals in Europe, including outbreaks across much of France. The source and route of human infection remain\
    \ unknown. While vector-borne transmission is most likely, food-borne transmission is under investigation. As this is the first documented laboratory confirmed human infection, WHO considers that the public health risk cannot yet be reliably assessed and recommends continued One Health surveillance and investigation."
