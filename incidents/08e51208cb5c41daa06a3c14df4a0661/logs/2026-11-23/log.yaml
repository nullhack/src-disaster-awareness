summary: Reports in this batch describe an emerging cattle-associated virus detected in horses with neurological disease in Europe, and The Lancet examines Shamonda virus’s emergence in Europe after identification in cattle in central Europe in June 2026, raising questions about orthobunyavirus infections during pregnancy. A Telegraph article warns that midges pose a growing health threat to Britons as the climate warms, but the excerpt does not specifically mention Shamonda virus.
