title: Public Health Technical Officers urge vigilance against yellow fever, meningitis as dry season sets in
body: The Ghana Association of Public Health Technical Officers (GAPHTO) has urged the public to remain vigilant against yellow fever and cerebrospinal meningitis as Ghana enters the dry season.
