log_date: '2026-11-18'
summary: India has released draft regulations that would tighten quarantine protocols for travellers arriving from countries affected by yellow fever, with unvaccinated at-risk arrivals potentially facing a six-day quarantine under the proposed airport rules. The remaining coverage in this batch consists of repeated syndicated articles about the CDC's Level 2 travel alert urging vaccination at least 10 days before departure, which restates previously reported information.
