log_date: '2026-11-19'
summary: The latest U.S. Drought Monitor update coincided with worsening drought in North Carolina, where 26% of the state is under extreme conditions and 39 counties are in extreme drought with 17 more in severe drought, prompting conservation calls. Maharashtra added six talukas to its drought-hit list for a total of 310, while Karnataka’s deputy chief minister said the Centre had not responded to three memorandums seeking drought aid. Other reports said Telangana activists want a global summit postponed amid drought and that a very strong El Niño threatens Brazil’s 2026–27 wheat and corn harvests.
