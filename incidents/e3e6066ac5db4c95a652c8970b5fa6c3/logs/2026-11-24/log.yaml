log_date: '2026-11-24'
summary: A strong El Niño could bring winter rain that helps ease drought, while prolonged dry conditions at North Carolina’s Jordan Lake have exposed remnants of communities dating to the 1700s. Exceptional drought is expanding across Mississippi and Arkansas, an Allentown-area water utility is asking customers to cut consumption by 10–15%, and recent central North Carolina rain brought slight relief but slowed Christmas tree sales. In the Czech Republic, severe drought is reducing autumn fish harvests and supplies of traditional Christmas carp.
