title: Maharashtra Orders District-Wide Drought Assessment; 4 More Talukas Declared Drought-Hit
body: Maharashtra has ordered Guardian Secretaries to assess drought conditions in every district before the Assembly session and declared Chiplun, Dindori, Wada and Vikramgad drought-hit. The government has sanctioned Rs 83.18 crore for 212 water supply schemes, allocated Rs 400 crore for retrofitting and announced further water conservation and fodder cultivation measures.
