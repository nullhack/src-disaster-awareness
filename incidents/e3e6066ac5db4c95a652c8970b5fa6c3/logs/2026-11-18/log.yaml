log_date: '2026-11-18'
summary: |-
  Drought impacts are being reported across multiple regions: Fiji declared a nationwide state of disaster as El Niño drought worsened, while Maharashtra declared four more talukas drought-hit and ordered district-wide assessments with Rs 83.18 crore for water supply schemes. Durham has spent more than $4 million buying water as Lake Michie remains critically low, and Jackson, Mississippi, has seen more than twice the usual water main breaks over six weeks due to prolonged drought. Other reports describe expanding drought in central Illinois, record-low Southwest hydropower tied to Colorado River Basin drought, and drought-management measures in Karnataka.
  Drought is leaving river levels low across Arkansas ahead of duck season, and a Colorado wildlife center treated a record 47 orphaned bear cubs in 2026, with drought-related injuries and malnutrition doubling its typical caseload. Global wine output remained near record lows for a fourth straight year as heat, drought, and frost cut production, while Bristol Water customers saw the end of the first hosepipe ban in 50 years after 12 weeks.
