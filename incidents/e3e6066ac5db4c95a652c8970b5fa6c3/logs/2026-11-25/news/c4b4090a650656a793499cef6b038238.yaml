title: Region urged to prepare for El Niño’s impact on dry season
body: 'KINGSTOWN (CMC): Caribbean countries should focus on the potential impact of El Niño on the region’s upcoming dry season, according to Adrian Trotman, chief of applied meteorology and climatology at the Barbados-based Caribbean Institute for Meteorology and Hydrology (CIMH).'
