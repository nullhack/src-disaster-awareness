log_date: '2026-11-20'
summary: |-
  North Dakota’s governor ended a statewide drought disaster declaration as soil moisture improved, though severe and extreme drought persists and the state will keep reimbursing awarded water projects. North Carolina’s drought now affects 6.2 million people as reservoirs continue to drop, with nearly 40 counties in extreme drought, while Maharashtra waived Rs 38 crore in medical exam fees for students from drought-hit talukas. An Italian hedgehog rescue center reported being overwhelmed by underweight hoglets amid prolonged drought, and local reporting described a drought-stricken area with little rain in sight.
  New York's DEC expanded its Drought Watch to 15 counties, including Onondaga County (13 counties per a separate report), citing a significant lack of rain and declining streamflow and groundwater levels across the Finger Lakes, Southern Tier and Central New York. A Dalhousie-led study found intensifying drought risk across Nova Scotia despite its water-rich reputation, with the most pronounced drying in the fall when many communities already face shortages.
