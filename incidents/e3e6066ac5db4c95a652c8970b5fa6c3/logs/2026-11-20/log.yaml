log_date: '2026-11-20'
summary: North Dakota’s governor ended a statewide drought disaster declaration as soil moisture improved, though severe and extreme drought persists and the state will keep reimbursing awarded water projects. North Carolina’s drought now affects 6.2 million people as reservoirs continue to drop, with nearly 40 counties in extreme drought, while Maharashtra waived Rs 38 crore in medical exam fees for students from drought-hit talukas. An Italian hedgehog rescue center reported being overwhelmed by underweight hoglets amid prolonged drought, and local reporting described a drought-stricken area with little rain in sight.
