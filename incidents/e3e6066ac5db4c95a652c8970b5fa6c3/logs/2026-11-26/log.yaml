summary: A study is examining whether Millwood Lake can support a proposed water transfer to North Texas amid drought concerns, and the latest U.S. Drought Monitor update covers conditions in Iowa, Nebraska, and South Dakota. Caribbean climatologists warned that a strong El Niño is expected to bring drier conditions, increased heat, and warmer ocean temperatures. Other reporting described drought-stressed trees and a Rudy Christmas tree farm with no trees to sell this season after drought and a shipping mix-up.
