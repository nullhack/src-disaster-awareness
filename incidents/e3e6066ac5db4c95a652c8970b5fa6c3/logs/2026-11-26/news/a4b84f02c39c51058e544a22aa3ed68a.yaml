title: Study examines drought effects of proposed Millwood water transfer | Texarkana Gazette
body: TEXARKANA, Ark. -- Millwood Lake has been studied for decades, and much of that research is now being used to help determine whether the reservoir can support sending millions of gallons of water a day to North Texas.
