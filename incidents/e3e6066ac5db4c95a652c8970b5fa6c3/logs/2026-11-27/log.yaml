log_date: '2026-11-27'
summary: |-
  New York added 13 counties to its drought watch as forecasts signal little relief through February. Guatemala families are selling belongings and sending children to work amid an El Niño-induced drought, while India’s Kharif foodgrain output fell 5.1% to 167.1 million tonnes due to deficient rainfall and drought. Bath County Service Authority issued emergency water restrictions, and a Thanksgiving drought-monitor report noted continuing rain.
  French tree growers are facing a “nightmare before Christmas” as drought hits production, and France’s main sugar groups Tereos and Cristal Union offered financial support to drought-hit beet growers to secure 2027 plantings. Morocco is turning to prayer as a historic drought deepens, while England and Wales are in a winter drought that could make next summer drier. Phoenix implemented a stage-two drought management plan with steep water surcharges for HOAs, Telangana announced a Rs 10,000 crore El Niño and drought mitigation programme, and a Maharashtra opposition leader called Rs 5,000 in farmer assistance inadequate.
