log_date: '2026-11-27'
summary: New York added 13 counties to its drought watch as forecasts signal little relief through February. Guatemala families are selling belongings and sending children to work amid an El Niño-induced drought, while India’s Kharif foodgrain output fell 5.1% to 167.1 million tonnes due to deficient rainfall and drought. Bath County Service Authority issued emergency water restrictions, and a Thanksgiving drought-monitor report noted continuing rain.
