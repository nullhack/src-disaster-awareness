log_date: '2026-11-23'
summary: UN Secretary-General António Guterres warned that landslides and drought threaten the centuries-old Banaue rice terraces and surrounding communities in the Philippine Cordilleras. In the UK, freezing temperatures combined with the summer drought continue to disrupt racecourses such as Fakenham, and the country is building new reservoirs to counter persistent droughts even as parts of Britain remain drought-stricken. Fiji's FCOSS warned that reduced crop production could drive up prices for root crops and vegetables, while Idaho is described as experiencing a historic statewide drought despite near-normal precipitation.
