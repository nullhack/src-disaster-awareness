title: 'Drought impact: Kharif foodgrain output falls 5.1%, price pressures likely to persist - CNBC TV18'
body: India’s Kharif foodgrain production is estimated to decline 5.1% to 167.1 million tonnes in 2026-27 due to deficient rainfall and drought conditions. With lower reservoir levels raising concerns over Rabi production and rising livestock feed costs pushing up dairy prices, pressure on food inflation is expected to persist in the coming months.
