title: Telangana announces Rs 10,000 crore El Nino, drought mitigation programme
body: Telangana has announced a Rs 10,000 crore El Nino and drought mitigation programme to begin after Sankranti, Irrigation Minister N Uttam Kumar Reddy said, with works planned over five months to strengthen rural water security.
