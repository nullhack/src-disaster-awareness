title: Life can take much from us. What do we do with what is left?
body: A man in Calicut keeps returning to the street to dance after losing ten members of his family in a landslide and flash flood. In 'From the Silence Within, Santosh Nair reflects on grief, resilience and the choices we make after life changes forever.
