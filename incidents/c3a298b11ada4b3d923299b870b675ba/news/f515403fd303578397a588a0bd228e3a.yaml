title: 'From 9th-Grade Dropout to ₹2,000 Crore Brand: Amit Majithia Rebuilds Assam Flood-Affected Village'
body: Entrepreneur Amit Majithia’s CBTF Foundation has raised ₹1.66 crore to build 124 homes in flood-hit Assam within 90 days, providing families with essential household items, sanitation facilities and educational supplies.
