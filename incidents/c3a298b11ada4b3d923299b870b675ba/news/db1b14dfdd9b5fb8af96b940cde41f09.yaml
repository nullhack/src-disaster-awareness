title: Over 4 million people affected as flood batters India's Bihar
body: 'NEW DELHI: (Bernama-Xinhua) More than 4.14 million people have been affected by floods in the eastern Indian state of Bihar, officials said on Thursday (Sept 10), reported Xinhua.'
