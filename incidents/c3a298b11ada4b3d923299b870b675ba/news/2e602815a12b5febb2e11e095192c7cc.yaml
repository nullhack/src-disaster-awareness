title: Shivraj Singh Chouhan to undertake extensive flood assessment in Bihar - DD India
body: Union Agriculture and Farmers Welfare and Rural Development Minister Shivraj Singh Chouhan will undertake an extensive visit to Bihar on Wednesday to assess the flood situation, inspect crop damage and review relief and rescue operations in affected areas. During the visit, Chouhan will conduct an aerial survey of several flood-hit areas, interact with affected farmers […]
