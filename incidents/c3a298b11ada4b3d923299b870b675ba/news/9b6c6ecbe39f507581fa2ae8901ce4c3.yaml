title: Floods, landslides kill 56 in India and 14 in Nepal
body: Summary India death toll rises to 56 after 60 hours of heavy rain, storms Nepal reports 14 deaths, 11 missing since Thursday Nepal warns of flash floods in 49 of 77 districts Rivers rise above danger levels across parts of India and Nepal BHUBANESWAR, India/KATHMANDU, Sept 27 (Reuters) - Heavy rain and storms have triggered floods and landslides...
