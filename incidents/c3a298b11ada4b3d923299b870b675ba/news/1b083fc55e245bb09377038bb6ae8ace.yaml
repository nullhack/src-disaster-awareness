title: Overnight rain leaves Madurai flooded
body: Madurai returned to normal within six to seven hours of flooding triggered by overnight rain, as a prepared corporation machinery and TVK MLAs on the ground helped clear water from most neighbourhoods by Friday morning. Sellur, however, remained inundated until evening, with residents blaming poorly timed Pandhalkudi channel works for worsening the flooding.
