log_date: '2026-10-22'
summary: A private foundation raised ₹1.66 crore to construct 124 homes for flood-hit families in Assam. Tamil Nadu experienced widespread flooding from the northeast monsoon, filling reservoirs, while authorities in Lucknow prepared to distribute ration kits to 10,000 flood victims in Faizullaganj. Kerala was placed under orange and yellow alerts for heavy rain, thunderstorms, and strong winds until October 25.
