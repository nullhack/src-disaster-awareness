title: Assam Tea Industry Raises Over ₹2.26 Crore For Flood-Affected Families At Special GTAC Charity Auction
body: Assam’s tea industry raised more than Rs 2.26 crore for flood-affected families through a special charity auction at the Guwahati Tea Auction Centre and an additional contribution. Ghilaidhari BP Tea drew the highest bid of Rs 16 lakh, while producers, buyers and other industry stakeholders joined the initiative.
