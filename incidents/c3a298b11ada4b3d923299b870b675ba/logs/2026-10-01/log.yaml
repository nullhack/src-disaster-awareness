log_date: '2026-10-01'
summary: Floodwaters are receding in Odisha's Balasore and Jagatsinghpur districts, though many villages remain submerged. In Bihar, two embankments of the Gandak River breached in Gopalganj and Saran districts amid heavy discharge from barrages. Separately, officials report at least 62 people have died from days of heavy rain and flooding in Uttar Pradesh.
