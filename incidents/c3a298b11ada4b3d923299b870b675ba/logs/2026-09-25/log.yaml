log_date: '2026-09-25'
summary: In Kerala, the body of the sixth missing person was recovered from the Kottappuzha flash flood, updating the prior death toll. Cyclone Arnab has triggered heavy rainfall and evacuations of over 8,000 people in Odisha, with schools closed in affected districts of Odisha and Andhra Pradesh. Heavy downpours also caused damage to roads and bridges in Telangana.
