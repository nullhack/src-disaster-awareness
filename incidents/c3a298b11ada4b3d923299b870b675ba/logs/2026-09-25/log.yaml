log_date: '2026-09-25'
summary: |-
  In Kerala, the body of the sixth missing person was recovered from the Kottappuzha flash flood, updating the prior death toll. Cyclone Arnab has triggered heavy rainfall and evacuations of over 8,000 people in Odisha, with schools closed in affected districts of Odisha and Andhra Pradesh. Heavy downpours also caused damage to roads and bridges in Telangana.
  Heavy rains continue to affect multiple Indian states. Andhra Pradesh faces a looming flood threat as Prakasam Barrage reaches its Full Reservoir Level, while Odisha has evacuated 10,000 people and closed schools due to rain-fury. Chhattisgarh's Bastar region experiences flooding that submerges NH-30, shutting schools and causing one death, and IMD issues flood alerts for Uttar Pradesh and Uttarakhand as the monsoon begins to withdraw.
