log_date: '2026-09-15'
summary: As of September 14, 2026, Bihar's flood crisis has worsened, affecting over 49 lakh people across 15 districts as rivers continue to swell. A central team led by Union Minister Shivraj Singh is likely to visit Bihar on September 16 to assess the damage. In Katihar, a teacher has turned a boat into a classroom to continue educating children amid submerged homes and schools, while political exchanges continue over the handling of flood relief.
