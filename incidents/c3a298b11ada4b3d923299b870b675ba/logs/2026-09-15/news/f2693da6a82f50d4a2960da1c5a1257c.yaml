title: Choppers for polls, why not floods? Pappu Yadav slams Tejashwi for attacking govt
body: Pappu Yadav attacked Tejashwi Yadav over his criticism of the Centre's handling of Bihar's floods. The exchange unfolded as nearly 50 lakh people across 15 districts remained affected by the deluge.
