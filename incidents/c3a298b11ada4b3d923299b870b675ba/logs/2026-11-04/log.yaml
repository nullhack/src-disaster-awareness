log_date: '2026-11-04'
summary: A glacial lake outburst in Bhutan's Shintaphu Lake sent floodwaters toward India, prompting high alerts in Assam and West Bengal. Cyclone Arnab has killed at least 3 people in Andhra Pradesh, while Cyclone Murasu killed 2 and triggered heavy rainfall and waterlogging in Vijayawada, disrupting normalcy. Reports also highlight India's vulnerability to glacial lake outbursts and the impact of cyclones on data center infrastructure.
