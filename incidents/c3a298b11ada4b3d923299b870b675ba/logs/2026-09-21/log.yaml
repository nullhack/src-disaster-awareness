log_date: '2026-09-21'
summary: Heavy rains in Kerala triggered landslides and flash floods, causing at least seven deaths and leaving two missing, with orange alerts issued as a possible cyclone threatens more rainfall. The Assam flood impact prompted an extension of the census housing survey in two districts until October 31, while the Sikkim High Court initiated a suo motu PIL over river flood threats following a Nepal tragedy. Political tensions remain in Bihar, with opposition leader Tejashwi Yadav criticizing the BJP for not directing Prime Minister Modi to visit flood-hit areas.
