log_date: '2026-09-07'
summary: On September 6, the Kosi River in Moradabad, Uttar Pradesh, rose causing flood-like conditions and submerging crops. In Patna, Bihar, the Ganga River breached its highest flood mark at Gandhi Ghat, reaching 50.53 meters amid heavy rainfall in Bihar and Nepal, prompting rescue team deployments. Additionally, India's tea production dropped 10% in July due to heavy rains and floods, particularly in Assam and West Bengal.
