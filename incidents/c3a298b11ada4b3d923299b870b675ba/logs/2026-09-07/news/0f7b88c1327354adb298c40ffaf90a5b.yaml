title: Ganga Breaches Highest Flood Mark At Patna's Gandhi Ghat Amid Heavy Rainfall | Outlook India
body: Ganga crosses highest flood mark at Gandhi Ghat in Patna, reaching 50.53 metres amid continuous downpours in Bihar and Nepal. Rescue teams deployed on alert.
