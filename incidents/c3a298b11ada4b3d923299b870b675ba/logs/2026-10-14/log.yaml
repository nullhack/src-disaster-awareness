log_date: '2026-10-14'
summary: New flooding emerged in Lucknow, Uttar Pradesh, as the Gomti River overflowed on October 9, submerging the Faizullaganj residential area. The Bihar government transferred ₹112.52 crore in crop damage compensation to 2.48 lakh farmers. Meanwhile, villagers protested along the Ken River as rising waters flooded homes and temples.
