title: 'Varanasi Floods: PM Reviews Relief Operations as Ganga Water Crosses Warning Mark'
body: Prime Minister Narendra Modi spoke to the Mayor and Collector of Varanasi to review the flood situation in the constituency. The Prime Minister was briefed on ongoing relief measures and directed the local administration to ensure citizens face minimal inconvenience and work on a war footing. Continuous rainfall has pushed up the water levels of the river Ganga, breaching the warning mark and submerging pedestrian paths and the famed ghats along the riverbank. Authorities have suspended boat operations in the city, while displaced residents are being moved into relief camps with arrangements for food and drinking water.
