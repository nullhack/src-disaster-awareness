title: Air Force rescues 12 stranded overnight as Indravati River floods in Jagdalpur
body: An Indian Air Force (IAF) Mi-17V5 helicopter on Saturday rescued 12 people, including two women and three children, who were stranded overnight due to flooding of the Indravati River, following a distress call.
