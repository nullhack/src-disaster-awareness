log_date: '2026-10-18'
summary: Chennai experienced record rainfall on October 17-18, triggering a red alert and widespread waterlogging that affected the airport and roads. The Indian Air Force rescued 12 people stranded overnight by flooding of the Indravati River in Jagdalpur, Chhattisgarh. Meanwhile, flood victims in Lucknow's Faizullaganj area face lengthy delays in receiving ration supplies.
