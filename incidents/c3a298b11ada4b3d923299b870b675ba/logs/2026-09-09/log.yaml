log_date: '2026-09-09'
summary: As of September 8, the Ganga River in Patna has swollen due to a junction flood from multiple rising rivers, affecting more than 22 lakh people across 12 districts of Bihar. Meanwhile, a historic temple in Malda, West Bengal, collapsed into the Ganges River due to severe monsoon erosion, and authorities report that flooding is pushing wild animals into villages, causing conflicts in Uttar Pradesh.
