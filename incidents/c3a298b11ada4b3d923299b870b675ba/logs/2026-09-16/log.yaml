log_date: '2026-09-16'
summary: As of September 15, 2026, Bihar's flood crisis continues to affect nearly five million people, with Union Minister Shivraj Singh Chouhan planning an aerial survey on September 16 to assess crop damage and relief operations. The Bihar cabinet approved ₹1,000 crore for flood and irrigation relief, while opposition leaders Rahul Gandhi and Mallikarjun Kharge urged prompt rescue efforts. Political exchanges over relief handling continue.
