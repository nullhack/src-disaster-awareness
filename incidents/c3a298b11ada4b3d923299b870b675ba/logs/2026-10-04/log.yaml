log_date: '2026-10-04'
summary: In Bihar, a 65‑year‑old man died in Saran district after being struck by a relief packet dropped from an IAF helicopter, and 28 places in the state are on orange alert as the Gandak River floods new areas following embankment breaches. A separate human‑interest story highlights a man in Calicut, Kerala, who lost ten family members in a landslide and flash flood.
