log_date: '2026-09-05'
summary: In Madhya Pradesh, over 2,783 people have been rescued amid ongoing floods, as CM Mohan Yadav reviewed the situation. In Varanasi, water levels in the Ganga and Varuna rivers have receded below the danger mark, but waterlogging persists, and CM Yogi Adityanath conducted an aerial survey of affected areas. Meanwhile, Bihar floods have deepened, with over 10.26 lakh people marooned in 11 districts, and Telangana raised concerns about potential flooding from the Polavaram project.
