title: 'Varanasi Flood Situation: CM Yogi Conducts Aerial Survey, Relief Efforts Underway'
body: Uttar Pradesh Chief Minister Yogi Adityanath conducted an aerial survey of flood-affected regions along the Varuna and Ganga rivers in Varanasi to review the ground situation. Affected residents from submerged residential colonies were shifted to safe locations, including government schools. Relief material distribution is being organised for impacted families. While water levels in the Ganga and Varuna rivers have receded below the danger mark over the past two days, waterlogging persists in residential areas. Prime Minister Narendra Modi also spoke with Varanasi's District Magistrate and Mayor to review ground conditions, promising central government assistance for flood management and ongoing relief operations across the district.
