title: 'Polavaram Flood Risk: Telangana Warns Of Village Submersion, Urges Centre Review'
body: Telangana Minister Ponguleti Srinivas Reddy has warned of severe flood risks posed by the Polavaram project, stating that backwaters could submerge several villages and houses along the Godavari Basin up to rooftop levels. He highlighted that the basin lacks free water flow, meaning inflows of 20 to 30 lakh cusecs could cause unprecedented damage and displace numerous residents. Urging the Centre and stakeholder states to reconsider and conduct a fresh review of the project, he noted that key areas like Bhadrachalam face recurring threats during monsoon inflows.
