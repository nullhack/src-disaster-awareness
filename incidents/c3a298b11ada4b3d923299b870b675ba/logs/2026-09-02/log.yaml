log_date: '2026-09-02'
summary: Heavy rainfall continues across parts of North India, with the India Meteorological Department issuing flash flood alerts for eight states and two union territories through September 2, 2026. In Odisha, a new low-pressure system has prompted heavy rainfall warnings and flood alerts till September 4. Additionally, dramatic flood-like scenes have emerged in areas like Chitrakoot and Kainchi Dham, while schools in several states have been closed due to the adverse weather conditions.
