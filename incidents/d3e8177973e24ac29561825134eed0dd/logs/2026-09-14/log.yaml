log_date: '2026-09-14'
summary: A new magnitude 5.0 earthquake was recorded in the Vanuatu Islands on September 10, according to the GFZ German Research Centre, adding to the ongoing seismic sequence near Isangel following the initial September 5 event and the September 8 aftershock. Other reports mention a magnitude 5.2 quake off the Vanuatu coast and general increased activity in the Pacific Ring of Fire, but the September 10 quake is the most specific new update.
