title: Magnitude 6.6 Quake Strikes Near New Caledonia in the Pacific, USGS Reports
body: Sept 26 (Reuters) - A magnitude 7 earthquake struck Tadine, New Caledonia region, on Saturday, the United States Geological Survey said. The quake was at a depth of 17.1 km (10.63 miles), USGS said.
