log_date: '2026-11-17'
summary: A magnitude 6.6 earthquake struck the Banda Sea off Tual in Indonesia’s Maluku Province, with some early reports citing a preliminary magnitude of 7.1 before being revised or downgraded. Tremors were felt in parts of eastern Indonesia, including Maluku and Papua, and as far as Darwin in Australia’s Northern Territory. Authorities reported no tsunami threat and no immediate casualties or structural damage.
