title: Magnitude 6.6 earthquake strikes off Indonesia, no tsunami threat reported
body: A magnitude 6.6 earthquake struck off the coast of Indonesia on Monday, prompting local search and rescue teams to go on alert, although no casualties or structural damage have been reported.
