title: 'Earthquake Alert: इंडोनेशिया के तुआल शहर के पास आया शक्तिशाली भूकंप, जानिए कितना खतरा?'
body: USGS के शुरुआती आंकड़ों में भूकंप की गहराई करीब 35 किलोमीटर बताई गई थी। हालांकि, बाद में जारी संशोधित आंकड़ों में इसकी गहराई लगभग 68 किलोमीटर दर्ज की गई।
