title: Terremoto de magnitud 6.6 azota Indonesia:Marina de Guerra se pronuncia sobre alerta de tsunami
body: La Dirección de Hidrografía y Navegación de la Marina de Guerra del Perú emitió un comunicado tras el terremoto de magnitud 6.6 registrado durante la tarde del martes 17 de noviembre en Indonesia.
