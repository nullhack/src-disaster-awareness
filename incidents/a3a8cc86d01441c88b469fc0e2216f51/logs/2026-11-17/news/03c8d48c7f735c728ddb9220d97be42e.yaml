title: ¿Alerta de tsunami? Terremoto de magnitud 7.1 sacude Indonesia HOY 16 de noviembre
body: Un fuerte terremoto de magnitud preliminar 7.1 se produjo a 151 km al oeste-suroeste de Tual, Indonesia, este lunes 16 de noviembre.
