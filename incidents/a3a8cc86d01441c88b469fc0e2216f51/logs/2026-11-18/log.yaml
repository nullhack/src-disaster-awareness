log_date: '2026-11-18'
summary: Reports on the Banda Sea earthquake said shaking was felt across eastern Indonesia—from Tual and Saumlaki to Sorong and Manokwari—shortly after 4 a.m. local time on November 17, with the source deep beneath the sea. Coverage also noted that two agencies disagreed over the earthquake’s magnitude, while another report described it as a 6.6-magnitude event whose tremors reached Australia.
