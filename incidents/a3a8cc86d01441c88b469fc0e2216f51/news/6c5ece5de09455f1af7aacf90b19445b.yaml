title: Gempa 6.8 Richter landa Laut Banda; gegaran dirasai di timur Indonesia
body: 'JAKARTA: Gempa bumi berukuran 6.8 magnitud melanda Laut Banda, Indonesia pada awal pagi Selasa (17 Nov), dengan gegaran dirasai di beberapa kawasan di timur negara itu termasuk Maluku dan Papua.Pengarah Gempa Bumi dan Tsunami Badan Meteorologi, Klimatologi dan Geofizik (BMKG), Dr Wijayanto berkata gempa bumi'
