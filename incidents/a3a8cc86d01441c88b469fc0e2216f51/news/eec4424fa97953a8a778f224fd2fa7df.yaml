title: పశ్చిమ పసిఫిక్ మహాసముద్రంలో భారీ భూకంపం
body: Earthquake struck in the Banda Sea, around 144km south-west of Tual, a city within the Kai Islands, Maluku Province of Indonesia. Authorities have confirmed that the earthquake did not pose a tsunami threat, and its magnitude has since been downgraded to 6.6. దీని రాజధాని తువాల్ సిటీకి నైరుతి దిశగా 144 కిలోమీటర్ల దూరంలో గల బందా సముద్ర ప్రాంతాన్ని భూకంప కేంద్రంగా యూఎస్జీఎస్ గుర్తించింది.
