title: Category 3 Hurricane Isaias closes in on the Florida Panhandle » Yale Climate Connections
body: The first major Atlantic hurricane of 2026 threatens the Gulf Coast with a storm surge of up to 9 feet, damaging winds, flooding, and tornadoes, with impacts spreading across the Southeast on Saturday. With the Tropical Storm Watch on the West Coast for Rachel, it's the first time the National Hurricane Center has issued watches/warnings simultaneously for both coasts.
