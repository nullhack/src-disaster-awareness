title: Hurricane Isaias Threatens Gulf Coast Travel as Major U.S. Airlines Issue Flight Waivers
body: Hurricane Isaias is heading for the northern Gulf Coast, and the airline industry has started to respond. American Airlines, Delta Air Lines and United Airlines have issued travel waivers for passengers flying through affected regional hubs on Friday, October 9, and Saturday, October 10.[1] Several smaller carriers and airports are adjusting too, and some coastal ...
