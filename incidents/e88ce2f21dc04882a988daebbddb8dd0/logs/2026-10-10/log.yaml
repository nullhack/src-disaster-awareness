log_date: '2026-10-10'
summary: Hurricane Isaias made landfall near Destin, Florida, on October 9, 2026, with sustained winds of 105 mph, downed trees, and caused widespread power outages affecting more than 300,000 homes. The storm, which had previously intensified into a Category 3 hurricane, gradually weakened to a Category 2 as it moved inland, bringing life-threatening storm surge and damaging winds to the Gulf Coast. Reports indicate roofs were ripped off buildings and cars were overturned, with severe flooding threats continuing across the region.
