title: Thousands Without Power After Isaias Strikes Gulf Coast - Energy News Beat
body: Hurricane Isaias, the first named hurricane of the 2026 Atlantic season, made landfall as a Category 2 storm near Destin, Florida, late Friday evening, bringing destructive winds, storm surge, and heavy rain that left hundreds of thousands of utility customers in the dark across the Gulf Coast and into the Southeast.Bloomberg
