title: Isaias drenches southern US as weakened post-tropical cyclone
body: The southeastern United States faced a high risk of flooding on Saturday as Isaias, weakened from a hurricane to a post-tropical cyclone, advanced northward from its landfall on Florida's Gulf Coast.
