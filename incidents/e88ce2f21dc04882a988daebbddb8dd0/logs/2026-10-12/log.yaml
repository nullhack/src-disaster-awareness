log_date: '2026-10-12'
summary: By Sunday, October 11, the remnants of Hurricane Isaias had moved to near Nashville, Tennessee, with maximum sustained winds of 25 mph, while still delivering heavy rain and gusty winds to West Virginia. Power outages across the Southeast remained extensive, reported between 420,000 and 760,000 customers, and the storm’s death toll stood at four. Flood and tornado threats continued as the system pushed into the Appalachians and Mid‑Atlantic.
