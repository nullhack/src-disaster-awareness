title: This is how Miami-Dade police and rescuers prepare for the impact of Hurricane Isaias
body: Agents and supervisors from the Miami-Dade Sheriff’s Office headed to Florida's Panhandle to support emergency operations alongside the USAR team from Miami-Dade Fire Rescue in preparation for the arrival of Isaias.
