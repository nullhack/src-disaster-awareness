title: 4 Dead, Nearly 670,000 Without Power as Hurricane Isaias Batters Southeast US
body: Hurricane Isaias left at least four people dead and roughly 670,000 customers without electricity after slamming into the Florida Panhandle and sweeping across the southeastern United States, officials said. The storm made landfall near Destin, Florida, late on October 9 as a Category 2 hurricane with sustained winds near 105 mph. It had earlier peaked […]
