title: पेरू में 6.7 तीव्रता का भूकंप, दक्षिणी हिस्से में महसूस किए गए तेज झटके
body: पेरू के दक्षिणी एंडीज में 6.7 तीव्रता का भूकंप आया. कई इलाकों में झटके महसूस हुए. फिलहाल नुकसान या जनहानि की खबर नहीं है, जबकि सुनामी का खतरा भी नहीं बताया गया है.
