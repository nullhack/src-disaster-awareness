title: Magnitude 7.2 quake shakes southern Peru
body: LIMA, Aug. 20 (Xinhua) -- A magnitude 7.2 earthquake shook Peru's southern region of Ayacucho on Thursday afternoon, with no immediate reports of casualties or damage, authorities said.
