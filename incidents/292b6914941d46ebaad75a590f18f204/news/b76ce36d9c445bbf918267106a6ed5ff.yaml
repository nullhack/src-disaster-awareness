title: Strong earthquake strikes central Peru, no damage reported
body: By Marco Aquino LIMA, Aug 20 (Reuters) - An earthquake of magnitude 6.7 hit central Peru on Thursday, the United States Geological Survey said, although authorities reported no immediate casualties or damage.
