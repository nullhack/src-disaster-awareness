title: 'Peru Earthquake Update: Tremors Cut Power to 9,000 Properties and Damage Ayacucho Region Hospitals'
body: A magnitude 6.7 earthquake hit Peru's Ayacucho region, causing power outages for 9,000 properties and damaging hospitals. Initial reports indicate three injuries and significant infrastructure damage.
