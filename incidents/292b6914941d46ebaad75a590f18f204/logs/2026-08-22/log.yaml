log_date: '2026-08-22'
summary: New reports indicate the earthquake cut power to 9,000 properties and damaged hospitals in the Ayacucho region. There is a discrepancy in magnitude reports, with the USGS recording 6.7 and Peru's institute recording 7.2, while injury counts range from 2 to 3. The event has also reopened debate over Peru's disaster response capabilities.
