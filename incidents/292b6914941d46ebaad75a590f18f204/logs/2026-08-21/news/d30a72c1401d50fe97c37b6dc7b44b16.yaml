title: Magnitude 6.7 earthquake shakes Peru's southern Andes, USGS says
body: The USGS said the quake occurred at 1 p.m. local time and was centered 38 kilometers (24 miles) northwest of the city of Upahuacho, in the Parinacochas province of the Ayacucho region.
