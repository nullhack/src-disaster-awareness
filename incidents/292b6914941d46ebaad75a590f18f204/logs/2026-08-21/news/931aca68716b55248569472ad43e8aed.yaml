title: Magnitude 6.7 earthquake strikes central Peru
body: LIMA, 21st August, 2026 (WAM) -- A magnitude 6.7 earthquake struck central Peru.The US Geological Survey said the earthquake occurred at a depth of 99 kilometres, with its epicentre located 31 kilometres north-west of the Aniso area in the Andes.There were no reports of injuries or damage.
