title: Magnitude 6.7 earthquake shakes Peru’s southern Andes, no immediate damages reported
body: A magnitude 6.7 earthquake shook Peru's southern Andes Mountains on Thursday, according to the U.S. Geological Survey. There were no immediate reports of damage.
