title: पेरू में जोरदार भूकंप से हिली धरती! 6.7 तीव्रता, 99 किमी गहराई में था केंद्र
body: दक्षिणी पेरू के एंडीज क्षेत्र में 6.7 तीव्रता के भूकंप के झटके महसूस किए गए. USGS के मुताबिक झटके इका और अरेक्विपा तक महसूस हुए, लेकिन शुरुआती जानकारी में नुकसान नहीं हुआ है.
