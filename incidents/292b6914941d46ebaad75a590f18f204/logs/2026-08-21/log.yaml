log_date: '2026-08-21'
summary: |-
  A magnitude 6.7 earthquake struck central Peru near Aniso on August 20, 2026, according to the USGS, with its epicenter located in the Andes at a depth of 66-99 km. No immediate casualties or damage were reported.
  According to several new reports, the magnitude 6.7 earthquake in Peru resulted in three people injured and damaged buildings, including homes and schools, in the Ayacucho region. Some sources also reported the quake as magnitude 7.2, though no tsunami was generated, and no fatalities were confirmed.
