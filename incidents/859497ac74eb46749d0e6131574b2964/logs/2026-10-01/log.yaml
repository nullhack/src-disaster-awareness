log_date: '2026-10-01'
summary: |-
  A sprawling hybrid storm is expected to cause impacts from Arizona to Nebraska with a three-pronged flood threat. Severe weather in San Antonio and Louisiana has prompted event cancellations and school delays, while a heavy rainfall event in Victoria, Australia has led to flood watches.
  Remnants of Hurricane Polo brought severe weather to Kansas and Texas, with tornadoes reported in central Kansas and heavy rain causing flash flooding and high‑water rescues in Dallas. Flash flood warnings were issued across North Texas, and storms were forecast to move toward San Antonio.
