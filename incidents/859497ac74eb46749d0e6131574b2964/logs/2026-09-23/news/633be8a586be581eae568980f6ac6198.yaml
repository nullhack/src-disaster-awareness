title: Sunday’s Na Wahine O Ke Kai shelved due to expected severe weather | Honolulu Star-Advertiser
body: As forecasters predict potentially severe weather as part of another tropical disturbance building south of Hawaii, the Oahu Hawaiian Canoe Racing Association — organizers of Na Wahine O Ke Kai — decided Tuesday morning to cancel Sunday’s women’s world championship outrigger canoe race.
