log_date: '2026-09-23'
summary: |-
  A deep depression over the Bay of Bengal triggered heavy rain alerts for four Indian states, while Houston County declared a state of emergency after weekend storms. Severe thunderstorm warnings were issued in Utah and the Western Carolinas, and coastal areas from North Carolina to Virginia prepared for upcoming severe weather. In Hawaii, funding was announced to restore a hospital damaged by a Kona Low.
  A tropical disturbance south of Hawaii forced the cancellation of the women's world championship outrigger canoe race. Hurricane Polo, described as one of the strongest storms ever recorded, is expected to impact California with dangerous surf and rain. Separately, severe thunderstorm warnings were issued for parts of Salt Lake County, Utah, and lightning strikes were caught on camera; Block Island Ferry canceled trips due to sea conditions from the ongoing nor’easter; and a flood watch was issued for El Paso, Texas and Doña Ana County.
