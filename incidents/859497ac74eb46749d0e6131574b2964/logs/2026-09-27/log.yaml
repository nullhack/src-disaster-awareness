log_date: '2026-09-27'
summary: The nor'easter continues to cause major disruptions, with the FAA warning of possible ground stops at JFK, Newark, and Boston airports, and AC/DC's New Jersey concert postponed. Hurricane Nolo is moving away from Hawaii but still delivers heavy rain and is expected to strengthen into a major hurricane. New Jersey officials also warn of carbon monoxide risks from improper generator use during power outages.
