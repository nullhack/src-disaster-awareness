log_date: '2026-09-21'
summary: On September 21, 2026, a developing nor’easter began battering the East Coast with strong winds, flooding, and dangerous surf, with impacts expected over several days. Meanwhile, southeast Ohio counties received 4–5.5 inches of rain since September 19, leading to flooding, and other parts of the Midwest and Mid-Atlantic also experienced severe flooding. California Governor Gavin Newsom declared a statewide state of emergency in preparation for a forecasted historic El Niño event.
