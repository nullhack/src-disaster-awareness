title: Tropical Depression 9 forms in Gulf, to become Atlantic's first hurricane before striking US
body: Newly-formed Tropical Depression 9 is forecast to strengthen into the first hurricane of the 2026 Atlantic season and bring flooding rain and high winds to the U.S. central Gulf Coast this weekend.
