log_date: '2026-09-25'
summary: |-
  The East Coast nor'easter has intensified, forcing event cancellations in Maryland and Massachusetts. Remnants of Hurricane Polo are expected to bring heavy rain to Illinois, and a second tornado was confirmed in Utah from last week's storms. Elsewhere, severe weather caused a food bank closure in El Paso and delayed housing payments in Hawaii due to Hurricane Lowell.
  A powerful nor'easter is moving up the East Coast, prompting the cancellation of Ed Sheeran's concerts in Foxborough, Massachusetts, and the Oceans Calling festival in Ocean City, Maryland, due to severe weather and coastal flooding risks. The storm also threatens the New York City area with dangerous winds, flooding, and power outages, with impacts expected along the New Hampshire and Maine coast as well.
