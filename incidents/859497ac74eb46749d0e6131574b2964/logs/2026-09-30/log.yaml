log_date: '2026-09-30'
summary: The National Fried Chicken Festival in New Orleans rescheduled to October 9-11 due to severe weather forecasts, while the Bluff Park Art Show in Alabama was canceled entirely. In El Paso, heavy rain and severe weather led to closures and delays, including canceled athletic games and early government office shutdowns. Additionally, an analysis noted that the record-strength El Niño could bring more flooding like the weekend's nor'easter to New Jersey.
