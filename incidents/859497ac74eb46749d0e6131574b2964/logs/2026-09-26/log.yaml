summary: The nor'easter has prompted the cancellation of the Global Citizen Festival in New York City, and forecasts now warn of 4–6 inches of rain and major flooding across parts of New Jersey. Hurricane Polo has explosively intensified into a Category 5 storm with record-breaking winds and low pressure off Mexico's coast. Additionally, severe storms are forecast to potentially hit parts of Texas ahead of an approaching cold front.
