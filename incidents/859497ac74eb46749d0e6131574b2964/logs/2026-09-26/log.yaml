log_date: '2026-09-26'
summary: |-
  The nor'easter has prompted the cancellation of the Global Citizen Festival in New York City, and forecasts now warn of 4–6 inches of rain and major flooding across parts of New Jersey. Hurricane Polo has explosively intensified into a Category 5 storm with record-breaking winds and low pressure off Mexico's coast. Additionally, severe storms are forecast to potentially hit parts of Texas ahead of an approaching cold front.
  A state of emergency was declared in eight New Jersey counties as the nor'easter brought severe flooding, and storm damage to NC 12 in the Outer Banks worsened, prompting repair crews to begin operations. Additionally, Hawaii's coffee producers are facing compounded challenges from the season's repeated severe weather.
