log_date: '2026-09-28'
summary: |-
  The nor'easter continued to impact coastal New Jersey with severe flooding, water rescues, and beach erosion, and forced the cancellation of a Ringo Starr concert. In Nepal, a deadly avalanche at Himlung Himal left at least 12 climbers missing or dead. Severe flooding in Cambodia forced the evacuation of nearly 3,000 families and destroyed over 24,000 homes, while flooding in Bangkok caused airport delays and baggage issues. South Africa faces a projected 1,200 heat deaths from an intensifying El Niño, and forecasters warned of an active East Pacific hurricane season and an upcoming heatwave in the southwestern U.S.
  The nor'easter along the East Coast is subsiding but leaves flood alerts across Massachusetts and Cape Cod. Texas prepares for potential flooding from Hurricane Polo's remnants, while West Texas braces for severe storms and Mozambique issues a critical weather warning. Rescue efforts continue in Nepal after an avalanche killed multiple climbers, and Tesla postpones a Roadster event due to weather.
