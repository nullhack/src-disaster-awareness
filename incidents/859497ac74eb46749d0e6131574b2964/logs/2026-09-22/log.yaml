log_date: '2026-09-22'
summary: Severe weather caused extensive street flooding in West Carrollton and Moraine, Ohio, submerging vehicles and damaging homes. A strong thunderstorm moved through Hattiesburg, Mississippi, causing damage along the U.S. 98 corridor. A tornado warning was issued for parts of Lawrence County, Kentucky, and Wayne County, West Virginia. Additionally, severe storms and flash flood potential were forecast for the Lubbock, Texas area.
