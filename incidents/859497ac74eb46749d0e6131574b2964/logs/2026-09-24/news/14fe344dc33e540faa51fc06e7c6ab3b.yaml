title: Courts on Hawaiʻi Island and in Maui County to close due to severe weather | Maui Now
body: Courts and Judiciary operations on Hawaiʻi Island (Third Circuit) will be closed Thursday, Sept. 24, and Friday, Sept. 25, due to anticipated severe weather from Tropical Storm Nolo, which is expected to strengthen into a hurricane. Courts and Judiciary operations on Maui, Molokaʻi, and Lānaʻi (Second Circuit) will be closed Friday, Sept. 25.
