log_date: '2026-09-24'
summary: |-
  Dominion Energy crews are restoring power from a coastal storm affecting Virginia. Coastal flooding is imminent in Delaware with up to two feet of inundation expected. Kettering, Ohio, released recovery resources after previous flooding. Severe storms brought flooding to El Paso and Juárez, causing stranded cars and emergency calls. Los Angeles County issued a local emergency proclamation ahead of El Niño. Maui County officials are encouraging preparedness as a tropical depression strengthens into Tropical Storm Nolo, expected to become a hurricane, with a flood watch in effect through Saturday.
  A nor'easter has breached dunes along NC-12 in the Outer Banks, isolating Hatteras Island and disrupting ferry services across Cape Cod and the Jersey Shore. Hurricane Polo is forecast to make landfall in Mexico and bring tropical moisture to the Southwest, while Tropical Storm Nolo has forced court closures on Hawaii Island and Maui County as it strengthens. Additionally, Tropical Storm Fay has formed in the Atlantic with 50 mph winds but is not expected to affect Florida.
