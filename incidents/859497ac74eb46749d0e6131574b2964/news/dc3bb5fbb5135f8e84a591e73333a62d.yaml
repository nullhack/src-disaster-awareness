title: East and West coasts pummeled by latest round of extreme weather
body: “To be plagued with too much rain will destroy property and lives. It swells the rivers and creeks. Too much rain floods cities and towns. Large bodies of water at the ocean shore lines will be made to swell with unusually high waves, dumping billions of tons of water over the now seashore line.” —The […]
