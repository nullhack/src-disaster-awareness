title: Supervisor Solis Encourages LACo Residents to Prepare for El Niño - MyNewsLA.com
body: Los Angeles County Supervisor Hilda Solis issued a local emergency proclamation Wednesday in preparation for the anticipated arrival of El Niño conditions, citing the potential for heavier rainfall, flooding, landslides and debris flows during the storm season. The proclamation is intended to strengthen coordination among county departments and state partners and comes two days after […]
