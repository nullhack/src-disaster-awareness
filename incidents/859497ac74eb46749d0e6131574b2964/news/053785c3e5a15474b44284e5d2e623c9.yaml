title: County of Maui officials encourage preparedness ahead of tropical system | Maui Now
body: County of Maui officials are encouraging residents and visitors to prepare for severe weather, with the National Weather Service (NWS) forecasting that a tropical depression will strengthen into Tropical Storm Nolo, then a hurricane, as it moves toward the state. A flood watch, which begins at noon today, remains in effect through Saturday for Maui County.
