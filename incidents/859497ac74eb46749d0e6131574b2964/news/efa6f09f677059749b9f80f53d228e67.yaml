title: Ed Sheeran's Gillette Stadium shows canceled due to weather in latest snag for his Loop tour
body: Ed Sheeran's Friday and Saturday concerts at Gillette Stadium in Foxborough, Mass., have been canceled 'due to severe weather warnings' in the region, Messina Touring announced Friday.
