title: Little outlines state's efforts to help with Spokane wildfires
body: 'Flanked by a collection of Smokey Bear pictures inside the Coeur d’Alene Interagency Fire Cache on Friday, Idaho Gov. Brad Little had one simple message for the state of Washington and its current battle with devastating wildfires: “To our neighbors in Washington,” he said, “Idaho stands with you.”'
