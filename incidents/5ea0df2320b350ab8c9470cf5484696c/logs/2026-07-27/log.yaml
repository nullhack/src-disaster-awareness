log_date: '2026-07-27'
summary: In the past 24 hours, four to five more children have died from measles in Bangladesh, raising the death toll since March 15 to 820. Nearly 1,000 new suspected cases were reported, pushing total suspected cases to over 123,700 and confirmed cases to 15,555. Hospitals continue to be overwhelmed as the outbreak persists, with many unvaccinated patients seeking care.
