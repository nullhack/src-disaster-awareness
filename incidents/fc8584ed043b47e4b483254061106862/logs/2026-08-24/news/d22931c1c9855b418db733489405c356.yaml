title: Congo receives more than 16,000 doses of Ebola vaccine as it grapples with unprecedented outbreak
body: Congo has received more than 16,000 doses of the Ervebo vaccine as the country grapples with the fastest Ebola outbreak in history, the country’s health minister said.
