title: Cyclone Arnab Landfall Tomorrow Along Andhra Coast; Why Is It Called Arnab And How Are Cyclones Named Explained
body: Cyclone Arnab, now a very severe cyclonic storm, is set to make landfall off the Andhra coast on October 28, 2026, prompting alerts and disruptions in Odisha and Andhra Pradesh.The article also explains the naming convention for cyclones, with 'Arnab' contributed by Bangladesh.
