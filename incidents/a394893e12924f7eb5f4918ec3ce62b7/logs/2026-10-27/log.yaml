log_date: '2026-10-27'
summary: |-
  A red alert has been issued for Andhra Pradesh and Odisha as Cyclone Arnab intensifies. Air India has warned of flight disruptions at Visakhapatnam and Vijayawada, and school closures have been extended to the Andaman and Nicobar Islands. Fishermen have been advised not to venture into the sea.
  Cyclone Arnab is now 170 km from Visakhapatnam and expected to make landfall on October 28. Train services have been cancelled and thousands evacuated from coastal areas. Airlines including Air India, IndiGo, and others have cancelled multiple flights to Visakhapatnam and Vijayawada.
