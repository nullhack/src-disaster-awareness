title: Cyclone 'Murasu' forms over Bay of Bengal; southern Odisha on high alert - CNBC TV18
body: According to the India Meteorological Department (IMD), the latest storm is set to intensify into a very severe cyclonic storm and make landfall on the morning of November 3 between Nellore and Narsapur in Andhra Pradesh, with wind speeds of 100-110 kmph, gusting to 120 kmph.
