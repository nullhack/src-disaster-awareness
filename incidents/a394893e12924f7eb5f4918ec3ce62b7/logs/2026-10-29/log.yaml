log_date: '2026-10-29'
summary: Cyclone Arnab has weakened further post-landfall, with the IMD forecasting it to move north‑northwestwards and weaken completely by midnight. Odisha evacuated over 31,000 people across seven districts as heavy rains continued. Meanwhile, Nepal issued a 36‑hour alert for heavy rain and snowfall from the weakening system, though the storm is expected to lose tropical cyclone intensity before reaching the region.
