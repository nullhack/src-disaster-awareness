title: Three killed, thousands evacuated as Cyclone Arnab hits eastern India
body: 'BHUBANESWAR: At least three people were killed, dozens of houses damaged and crops destroyed as a powerful cyclone struck India''s eastern coast from the Bay of Bengal on Wednesday, bringing heavy rain and strong winds, authorities said.'
