log_date: '2026-10-30'
summary: Analyses suggest that El Niño and warmer sea surface temperatures may have contributed to Cyclone Arnab's rapid intensification. Specific impacts reported include 70,900 hectares of crop damage in Andhra Pradesh and power disruptions in the region. In a notable incident, three temple servitors climbed the 214‑foot Jagannath Temple in Puri during the storm to change its flag.
