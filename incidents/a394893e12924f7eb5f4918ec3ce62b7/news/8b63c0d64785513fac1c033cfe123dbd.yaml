title: 'Cyclone ‘Arnab’ impact: Several flights from Vizag, Vijayawada cancelled'
body: Visakhapatnam, Oct 27 (IANS) Very severe cyclonic storm ‘Arnab’ in the Bay of Bengal has disrupted air services in Andhra Pradesh, with airlines cancelling several flights at Alluri Sitarama Raju International Airport at Bhogapuram near Visakhapatnam and Vijayawada International Airport on Tuesday.With heavy rains accompanied by gusty winds lashing the coastal region under the impact...
