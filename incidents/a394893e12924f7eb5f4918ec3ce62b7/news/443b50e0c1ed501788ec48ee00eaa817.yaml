title: Two cyclones in days! After Cyclone Arnab, why is Bay of Bengal seeing another powerful storm?
body: Cyclone Murasu has intensified into a severe cyclonic storm over the Bay of Bengal and is expected to cross the south Andhra Pradesh coast between Nellore and Narsapur around midnight on November 2 or in the early hours of November 3. The IMD has issued heavy rainfall, strong wind and…
