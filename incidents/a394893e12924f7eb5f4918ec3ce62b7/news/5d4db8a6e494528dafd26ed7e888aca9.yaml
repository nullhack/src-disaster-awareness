title: Air India Issues Travel Advisory as Cyclone Arnab Threatens Flights in Visakhapatnam and Vijayawada
body: In its advisory posted on X, Air India wrote, “Weather conditions associated with Tropical Cyclone Arnab may impact flights to and from Visakhapatnam and Vijayawada on 27 October.”
