title: Why has Bay of Bengal seen 3 cyclones in less than a month?
body: The Bay of Bengal has seen three cyclones in less than a month. November is traditionally the busiest period for cyclone activity in the region. Weakening monsoon winds, warm ocean waters, atmospheric moisture and large-scale weather patterns all contribute to this seasonal surge. Read on to know more.
