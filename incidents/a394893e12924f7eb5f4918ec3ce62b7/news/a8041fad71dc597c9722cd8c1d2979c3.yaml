title: 'Cyclone Akvan Explained: Bay of Bengal Storm, Andhra Pradesh Alert, Odisha Rain Forecast and Naming Process | Outlook India'
body: A deep depression over the Bay of Bengal is forecast to intensify into Cyclone Akvan and move towards the Andhra Pradesh coast, prompting rainfall warnings for parts of Andhra Pradesh, Odisha and Tamil Nadu while raising questions about the storm’s trajectory, potential impact and naming process
