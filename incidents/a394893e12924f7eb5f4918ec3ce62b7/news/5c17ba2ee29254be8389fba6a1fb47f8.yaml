title: 'Cyclone Akvan Highlights: Andhra Pradesh, Odisha On High Alert As Storm Nears Coast; Schools Shut, Exam Postponed'
body: Cyclone Akvan is set to intensify into a very severe cyclonic storm, with landfall expected around November 20 between Nellore and Visakhapatnam on the Andhra-Yanam coasts.States like Andhra Pradesh, Odisha, and Tamil Nadu are bracing for heavy rainfall and have initiated precautionary measures.
