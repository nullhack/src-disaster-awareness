title: 'Cyclone Arnab hits Andhra Pradesh: Does El Niño play a role? Explained'
body: Cyclone Arnab is the first cyclone of 2026 to develop over the North Indian Ocean basin,. The system began as a low-pressure area over the Bay of Bengal on October 23 and intensified over the following days, eventually developing into a very severe cyclonic storm by October 27.
