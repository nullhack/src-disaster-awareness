title: 'Cyclone Arnab Triggers Warnings In Odisha, Andhra, Bengal: How It Was Named, When And Where Will It Make Landfall'
body: 'Cyclone Arnab: Cyclone Arnab has formed over the Bay of Bengal and is expected to intensify into a very severe cyclonic storm before making landfall between Bapatla and Visakhapatnam on October 28. Andhra Pradesh and Odisha are the main states in its path, with heavy rainfall and thunderstorms forecast. Here''s how the cyclone got its name and where it is positioned now.'
