title: Warming Oceans & El Niño May Have Intensified Cyclone Arnab, Experts Say
body: Cyclone Arnab reportedly made landfall along the Andhra Pradesh and Yanam coasts on October 28, with winds of up to 135 kmph and gusts reaching 150 kmph. Experts warned that warmer oceans can fuel rapid cyclone intensification and heavier rainfall. They urged stronger disaster preparedness and climate-resilient infrastructure to reduce economic losses and protect vulnerable communities.
