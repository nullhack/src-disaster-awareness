title: ‘There will be more low-pressure area days in post monsoon season of 2026’
body: Cyclone Arnab's interaction with an overlooked low-pressure system revealed unique dynamics, highlighting El Niño and Indian Ocean warming as key drivers of increased cyclogenesis and above-normal rainfall in the Bay of Bengal during the post-monsoon season of 2026.
