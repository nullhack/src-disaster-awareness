title: 'Cyclone Akvan Alert: IMD Warns of 130 Kmph Winds as Andhra Pradesh Prepares for Landfall'
body: Cyclone Akvan may hit Andhra Pradesh on November 20 with winds up to 130 kmph. IMD warns of heavy rain as the state prepares for its third cyclone in three weeks.
