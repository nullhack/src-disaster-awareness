title: Cyclone Akvan veers north and may cross anywhere from Narsapur to Puri, 10 Andhra districts on rain alert
body: Cyclone Akvan has turned towards north Andhra Pradesh and Odisha and weakened; the IMD has issued extremely heavy rain alerts for six districts on November 19.
