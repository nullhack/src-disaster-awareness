title: 'Arnab, Murasu And Now Akvan: Why Bay Of Bengal Is Witnessing Back-To-Back Cyclones'
body: A severe cyclonic storm, Akvan, is expected to make landfall on November 20 between Machilipatnam and Puri, following previous cyclones Arnab and Murasu. The Bay of Bengal frequently experiences such intense storms due to warm sea surface temperatures, favorable wind patterns, and its unique geographical location.
