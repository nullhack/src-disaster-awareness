title: 'Cyclone Arnab: Andhra Pradesh prepares to evacuate 5.7 lakh people ahead of landfall'
body: Cyclone Arnab is expected to hit Andhra Pradesh on 28 October, with winds reaching 140 kmph. Authorities have identified 5.7 lakh people for possible evacuation, while Odisha closes schools and West Bengal prepares for heavy rainfall and strong coastal winds.
