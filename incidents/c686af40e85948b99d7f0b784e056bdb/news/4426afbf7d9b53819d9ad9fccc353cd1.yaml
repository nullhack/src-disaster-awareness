title: Shakira visits quake-damaged schools in Colombia; announces major education aid; pledges university support
body: Shakira visited Quibdó, Colombia, after a devastating earthquake struck the region. She announced one million dollars in educational support for affected children. Live Nation will match a FIFA Global Citizen Education Fund contribution.
