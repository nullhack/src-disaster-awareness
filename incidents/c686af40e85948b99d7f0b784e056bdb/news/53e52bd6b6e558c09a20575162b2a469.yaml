title: World Bank Group approves US$200 mn in additional financing to help Colombia recover from earthquake
body: WASHINGTON, 25th September, 2026 (WAM) - The World Bank Group has approved US$200 million in additional financing to help Colombia respond to and recover from the earthquake that struck the country on August 10.
