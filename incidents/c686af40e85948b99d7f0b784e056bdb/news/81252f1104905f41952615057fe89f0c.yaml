title: UN offers support to Colombia after magnitude 7.4 earthquake kills dozens
body: The UN offered its support to Colombia on Monday after a magnitude 7.4 earthquake struck the west of the country, killing at least 111 people and injuring at least 87, including several children, while leaving others trapped under the rubble and causing landslides and serious damage to homes and infrastructure.
