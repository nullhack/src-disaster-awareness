title: Fairfax County firefighters come home after assisting Colombia earthquake victims - WTOP News
body: Ten Fairfax County firefighters who are part of Virginia Task Force 1 returned late Thursday from helping coordinate the rescue effort after the devastating earthquake in Colombia.
