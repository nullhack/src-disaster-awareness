title: Shakira makes surprise visit in earthquake-damaged Colombia and commits to rebuilding schools
body: BOGOTÁ, Colombia (AP) — Colombian superstar Shakira announced Monday that she will help rebuild at least 10 schools and restore a local university in a remote and hard-hit region of her home country after it suffered a devastating earthquake last week that killed hundreds and affected thousands of educational sites across western Colombia.
