title: Colombia president vows reconstruction fund as search for quake survivors enters critical period - BusinessWorld Online
body: CALI/PEREIRA, Colombia — Colombia’s President Abelardo De La Espriella on Wednesday vowed to set up an emergency fund to help rebuild hospitals, schools, homes and infrastructure destroyed by Monday’s earthquake, which killed 265 and left nearly 500 people unaccounted for. “This is undoubtedly a tragedy of immense proportions,” Mr. De La Espriella, who was inaugurated […]
