title: Some 25,000 people are seeking housing in Cali two weeks after Colombia's earthquake
body: The municipal survey in Cali, Colombia's third city with more than two million inhabitants, now covers 10,000 families affected by the magnitude 7.4 earthquake of August 10 and estimates around 25,000 people have been left without adequate housing. Many have spent recent days in shelters or with relatives while searching for a rental, in a market strained by the sudden loss of supply.
