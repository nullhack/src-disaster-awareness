title: Shakira heads to Chocó, the region hit hardest by Colombia's earthquake, to stand with the victims
body: Shakira travels to Chocó, the Colombian region hardest hit by the deadly magnitude-7.4 earthquake, pausing her world tour to visit victims and a school built by her Barefoot Foundation.
