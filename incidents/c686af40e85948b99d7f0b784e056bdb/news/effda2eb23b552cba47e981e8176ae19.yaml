title: Prabowo visits NTT as quake death toll reaches 105 - Archipelago - The Jakarta Post
body: Prabowo's visit came as the death toll from the 7.7-magnitude earthquake on Aug. 15 rose to 105, with nearly 180,000 people still living in temporary shelters following relentless aftershocks across seven regencies on Flores Island.
