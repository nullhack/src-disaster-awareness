title: 'Earthquake in Colombia: U.S. issues ‘natural disaster alert,’ UN warns ‘disruptions’ hinder relief efforts'
body: U.S. diplomats issued a “natural disaster alert” on Wednesday, as there was a rush to rescue survivors of the 7.4-magnitude earthquake that struck on Monday morning in western Colombia.
