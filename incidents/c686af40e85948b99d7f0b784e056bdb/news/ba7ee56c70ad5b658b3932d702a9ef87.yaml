title: Colombia Counts Earthquake Losses While Survivors Face Mental Health Aftershocks
body: More than a month after Colombia’s devastating earthquake, survivors are seeking psychological help, often for the first time. Free counseling networks confront sleeplessness, persistent fear, and a reconstruction challenge that cannot be resolved with concrete, compensation, or another official tally.
