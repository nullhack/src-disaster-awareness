title: Shakira makes surprise visit to earthquake-damaged Colombian schools and says she will help rebuild
body: Colombian superstar Shakira pledged to help rebuild at least 10 schools in a remote region of her home country after a devastating earthquake struck last week, killing hundreds and affecting thousands of educational sites.
