title: As search for thousands of missing pushes on, Colombia earthquake tests new president | Texarkana Gazette
body: PEREIRA, Colombia -- Rescue crews and civilians in Colombia painstakingly searched through rubble Tuesday in the hopes of finding survivors trapped under debris after a powerful earthquake left thousands missing in dozens of cities and towns.
