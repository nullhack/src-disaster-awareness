title: Powerful Colombia earthquake kills at least 111 | Jefferson City News-Tribune
body: BOGOTA -- At least 111 people were killed after a powerful earthquake struck western Colombia early on Monday, knocking down buildings across several cities and injuring 87 others, with still more residents trapped in the rubble.
