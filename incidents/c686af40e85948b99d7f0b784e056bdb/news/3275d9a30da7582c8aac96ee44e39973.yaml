title: Colombian president asks Trump to suspend tariffs to help earthquake recovery
body: BOGOTÁ, Colombia (AP) — Colombia's President Abelardo de la Espriella has asked U.S. President Donald Trump to suspend tariffs to help Colombia recover from a devastating earthquake. The 7.4 magnitude quake struck Monday, killing at least 289 people and injuring nearly 4,000. De la Espriella, who took office earlier this month, emphasized his connections with Trump, thanking him for $26.5 million in U.S. aid. The quake destroyed thousands of homes, including in western cities like Pereira and Cali. The government declared it a natural disaster, with at least143 people missing and extensive damage reported. Rescue efforts continue despite the challenging conditions.
