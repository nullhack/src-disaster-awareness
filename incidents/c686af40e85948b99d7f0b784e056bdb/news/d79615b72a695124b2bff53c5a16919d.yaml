title: Hundreds still missing in Colombia as desperation grips earthquake rescue effort
body: CALI/PEREIRA, Colombia – Hopes of finding more survivors of the powerful earthquake that rocked Colombia early this week were fading on Thursday as rescue workers narrowed their searches, while families in the worst-hit areas waited for news of missing relatives.
