title: Colombia quake death toll rises to 304
body: BOGOTA, Aug. 18 (Xinhua) -- The death toll from Colombia's magnitude-7.4 earthquake on Aug. 10 has risen to 304, with 4,548 people injured and 426 missing, the country's disaster management agency said Tuesday.
