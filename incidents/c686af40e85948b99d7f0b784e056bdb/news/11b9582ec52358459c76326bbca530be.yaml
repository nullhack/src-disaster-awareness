title: Colombia earthquake death toll rises to 329
body: Colombia’s death toll from the Aug. 10 magnitude-7.4 earthquake has risen to 329, with 4,600 people injured and 247 still missing. The disaster affected more than 314,000 people and caused extensive damage to homes and infrastructure.
