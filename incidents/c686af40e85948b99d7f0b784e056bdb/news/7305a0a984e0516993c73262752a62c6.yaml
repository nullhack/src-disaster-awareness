title: Zoomlion Mobilizes Emergency Equipment and Personnel for Colombia Earthquake Relief
body: BOGOTA, Colombia, Aug. 14, 2026 /PRNewswire/ -- Zoomlion Heavy Industry Science & Technology Co., Ltd. ('Zoomlion') has deployed excavators, skid steer loaders, cranes and relief supplies to support rescue efforts in the wake of the magnitude-7.5 earthquake that struck Colombia on August 10.
