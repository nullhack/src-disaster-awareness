title: Colombian president asks Trump to suspend tariffs to help earthquake recovery
body: Colombia’s President Abelardo de la Espriella has asked his ally U.S. President Donald Trump to suspend tariffs to help the South American nation recover from a powerful earthquake that killed at least 289 people.
