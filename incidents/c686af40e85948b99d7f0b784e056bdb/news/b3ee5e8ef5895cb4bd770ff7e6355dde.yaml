title: Shakira makes surprise visit to Colombia after deadly earthquake, commits to rebuilding schools
body: “What worries me the most is that schools are not rebuilt once this emergency is over,” Shakira told journalists. “Every day that children don’t go to school is a day they miss out on their future.”
