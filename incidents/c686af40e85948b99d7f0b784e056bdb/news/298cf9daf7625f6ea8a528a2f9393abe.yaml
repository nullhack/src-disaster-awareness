title: Colombia earthquake claims 294 lives, injures nearly 3,935 as rescue efforts continue
body: BOGOTA, 16th August, 2026 (WAM) -- The death toll from the recent magnitude-7.4 earthquake in Colombia rose to 294 on Saturday, with 3,935 people injured, 320 missing and 353 rescued, according to the National Unit for Disaster Risk Management (UNGRD).
