title: 'Earthquake in Colombia: Miami Beach opens 4 aid drop-off locations'
body: Miami Beach announced on Thursday that there are four drop-off locations accepting aid for the victims of the 7.4-magnitude earthquake that struck on Monday in western Colombia.
