title: De la Espriella announces first $309M in aid for earthquake reconstruction - Colombia News
body: President Abelardo de la Espriella announced that his Miracle Fund received COP1 trillion ($309 million) for the reconstruction of western Colombia, which was hit by a 7.4M earthquake on August 10. The announcement followed announcements by the press, which reported that the Finance Ministry allocated ($192 million) COP625 billion to the fund almost two months […]
