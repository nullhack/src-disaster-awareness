title: Powerful 7.4-magnitude earthquake in Colombia kills at least 132, injures about 570
body: The epicenter of the 7.4-magnitude earthquake on Monday in Colombia was in the area of San José del Palmar, an impoverished rural municipality in Chocó, near the Pacific Ocean.
