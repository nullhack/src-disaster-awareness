title: After 7.4 earthquake, Elder Stevenson ministers in western Colombia and meets with mayor of Cali
body: Two weeks after a 7.4 magnitude earthquake in western Colombia, Elder Gary E. Stevenson ministered to local Church members and met with the mayor of Cali. He said, “Even amid uncertainty and loss, we observed hearts anchored in the Savior and strengthened by His promised peace.”
