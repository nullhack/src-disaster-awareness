title: Colombia earthquake toll hits 254 as 72-hour rescue window narrows | Jefferson City News-Tribune
body: The death toll from the powerful magnitude 7.4 earthquake that devastated western Colombia has risen to at least 254, according to the latest local and aggregated reports, as rescuers raced against time Wednesday to find people still alive beneath collapsed buildings.
