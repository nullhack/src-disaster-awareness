title: 6.6 magnitude quake rocks Colombia — geological agency - Jamaica Observer
body: BOGOTA, Colombia (AFP) — A powerful earthquake rocked Colombia and other Latin American countries on Monday, shaking buildings in Bogota and in Quito, Ecuador. The Colombian geological service put the magnitude of the quake at 6.6 while its American counterpart USGS put it at 7.4, with an epicenter 100 km (62 miles) underground in the west of Colombia. It was felt as far away as Panama to the north, and...
