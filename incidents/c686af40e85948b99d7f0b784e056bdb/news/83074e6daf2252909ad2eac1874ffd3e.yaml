title: Sumitomo Corporation of Americas Donates $50,000 to Support Colombia Earthquake Relief Efforts
body: Sumitomo Corporation of Americas ("SCOA") will contribute $50,000 to the Colombian Red Cross to support relief efforts related to the devastating earthquake that took place in Colombia on August 10th. The Colombian Red Cross is a trusted relief partner and these funds will go directly to providing temporary shelter, safe drinking water, and other essential relief supplies for those impacted by this natural disaster.
