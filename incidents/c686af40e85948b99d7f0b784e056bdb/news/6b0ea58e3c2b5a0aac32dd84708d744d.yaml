title: Canada pledges $2 million in aid for earthquake relief in Colombia - Medicine Hat News
body: OTTAWA — The federal government is providing more than $2 million in aid to Colombia as the country recovers from a 7.4 magnitude earthquake which hit on Aug. 10. Spanish news agency EFE reports the death toll climbed to 331 people this week, with more than 4,400 injured, and 240 people still missing. Canada’s aid
