title: Miami prepares for ‘Jam for Venezuela and Colombia’ benefit concert at The Underline on Saturday
body: A free Latin music concert to benefit earthquake victims in Venezuela and Colombia is happening Saturday at The Underline, Miami's 10-mile linear park and urban trail.
