title: California man trapped in Colombia reveals his terror as massive earthquake struck
body: A Northern California man visiting family in Colombia found himself in a fight for his life when a monster 7.4-magnitude earthquake struck on Monday. Andres Martinez, from Roseville, was enjoying a quiet morning in Manizales— about 100 miles from the epicenter—when the ground started violently shaking.
