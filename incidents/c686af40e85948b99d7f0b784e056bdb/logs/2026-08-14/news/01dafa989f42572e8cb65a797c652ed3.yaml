title: 'FACT FOCUS: Conspiracy theories falsely blame Colombia earthquake on Alaska research program'
body: An enduring conspiracy theory has resurfaced on social media after a 7.4 magnitude earthquake hit western Colombia on Monday, with users blaming a research program in Alaska for the disaster.
