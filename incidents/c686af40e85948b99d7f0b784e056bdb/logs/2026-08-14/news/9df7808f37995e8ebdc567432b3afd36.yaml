title: '‘It was pretty scary’: Louisville missionary group safe after Colombia earthquake, working to return home'
body: A Louisville-based YWAM missionary group is safe after Colombia's Aug. 10 earthquake but is dealing with limited communication and a rerouted flight plan as members work to return home.
