log_date: '2026-08-14'
summary: As of August 13, the death toll from the M7.4 earthquake in Colombia has risen to at least 273, with 377 people still missing, as rescue operations entered a "final phase" following the closure of the critical 72-hour survival window. Colombia declared a state of economic emergency to aid reconstruction, while international aid efforts expanded with community donation drives in Florida, New Jersey, and elsewhere, and benefit concerts were announced to support relief. The new far-right government under President Abelardo De La Espriella faced the ongoing crisis, with hopes of finding more survivors fading.
