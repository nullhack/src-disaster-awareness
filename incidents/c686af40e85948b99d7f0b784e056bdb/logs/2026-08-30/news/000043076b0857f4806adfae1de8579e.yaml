title: Colombia's Far Right Sees an Earthquake as an Opportunity
body: The response of Colombia's new leader, Abelardo de la Espriella, to a deadly earthquake has been tawdry beyond belief. The reactionary president has used the disaster for publicity stunts and will only accept overseas aid from his far-right allies.
