log_date: '2026-08-30'
summary: |-
  Two new developments emerged 19 days after the earthquake: Latin artists Juanes and Alejandro Sanz launched "Marea Viva" to support rebuilding efforts in the hard-hit Chocó region. Meanwhile, families have launched a desperate, citizen-led search for hundreds of pets that fled or went missing in the rubble.
  Two weeks after the earthquake, a municipal survey in Cali found around 25,000 people lacking adequate housing, with 10,000 families affected and many sheltering with relatives or searching in a strained rental market. Cement company Holcim announced support for reconstruction efforts. Criticism continued over President De La Espriella's response, with an article describing his actions as tawdry and focused on far-right allies.
