log_date: '2026-08-18'
summary: As of August 16-18, the death toll from the M7.4 earthquake rose to at least 294 confirmed dead with 320 missing, while early economic losses were estimated at $9.6 billion. Colombian President Abelardo De La Espriella asked U.S. President Trump to suspend tariffs to aid recovery, and faced backlash for handing out footballs instead of aid in affected areas. Colombian superstar Shakira visited hard-hit Chocó and pledged to rebuild at least 10 schools and a local university, while US forces began delivering aid by cargo plane and the UN joined national response efforts.
