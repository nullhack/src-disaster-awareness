title: Magnitude 7.4 quake rocks western Colombia, killing at least 111 people
body: CALI, Colombia (AP) — A powerful 7.4 magnitude earthquake struck western Colombia on Monday, killing at least 111 people, damaging hundreds of buildings and leaving many trapped under debris while their loved ones and rescue workers searched through rubble.
