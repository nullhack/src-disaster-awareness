title: Colombia rocked by 7.4 magnitude earthquake, tremors felt near Venezuela border
body: The earthquake occurred at 12:34 UTC, or around 7:34 am (local time), about 5 km east of San Jose del Palmar in Colombia's Choco department, the USGS said. It was recorded at a depth of about 107 km.
