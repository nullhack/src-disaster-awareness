log_date: '2026-08-13'
summary: As of August 12, the death toll from the M7.4 earthquake in western Colombia rose to at least 265, with nearly 500 people officially missing and over 3,900 unaccounted for in civilian databases. The U.S. issued a natural disaster alert and the EU pledged €2 million in aid, while Colombia initially limited foreign rescue teams but began accepting them as search efforts entered a final phase. President Abelardo De La Espriella vowed to create a reconstruction fund, and benefit concerts were organized for relief.
