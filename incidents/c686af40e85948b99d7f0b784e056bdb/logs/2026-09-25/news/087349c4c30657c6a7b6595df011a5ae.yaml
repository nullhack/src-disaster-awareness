title: World Bank approves further $200 million to help Colombia recover from earthquake
body: WASHINGTON, Sept xx (Reuters) - The World Bank Thursday said it has approved $200 million in additional funding to help Colombia respond to and recover from the August 10 earthquake that left hundreds dead.
