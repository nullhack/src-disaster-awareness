log_date: '2026-09-08'
summary: 'New relief and recovery efforts emerged around September 7: rapper Fat Joe funded two planes carrying 100 tons of supplies for earthquake-affected families in Pereira and Armenia, and President De la Espriella traveled to Chocó with top business leaders to launch a “Marshall Plan for Chocó” aimed at reconstruction. Coverage of De la Espriella’s first month in office highlighted the earthquake as the central challenge of his administration.'
