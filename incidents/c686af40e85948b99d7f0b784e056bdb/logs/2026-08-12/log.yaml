log_date: '2026-08-12'
summary: |-
  Search-and-rescue operations continue as the death toll rises, with reports ranging from over 180 to 224 fatalities and thousands still missing. The earthquake destroyed a center for deaf and blind children, and relief efforts are being mounted by celebrities and diaspora communities in the U.S. The new president declared a national disaster as the country faces this major crisis.
  Rescue operations continued on August 12 with a baby pulled alive from rubble, and coffee exports were halted due to earthquake disruptions. International aid efforts expanded, including World Central Kitchen and a statement from Spain's royal family, while death toll reports varied between 181 and over 250, with civilian databases suggesting up to 4,000 missing. Authorities continued to assess damage as the new government faced the crisis.
