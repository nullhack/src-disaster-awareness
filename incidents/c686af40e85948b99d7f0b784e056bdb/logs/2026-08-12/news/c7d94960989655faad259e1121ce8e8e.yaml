title: Earthquake response strains Colombia's new government and rescuers as they race against the clock
body: President de la Espriella said the 7.4 magnitude earthquake had killed at least 181 people and left 2,595 more injured in the west of the country. He said at least 195 remained missing, but civilian-run databases put that number closer to 4,000.
