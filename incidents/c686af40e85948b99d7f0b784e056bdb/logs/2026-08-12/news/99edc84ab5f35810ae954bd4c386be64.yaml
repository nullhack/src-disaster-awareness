title: 'Colombia Earthquake 2026: 7.4 Magnitude Quake Kills Over 250 in Chocó, Cali, and Pereira- Moneycontrol.com'
body: BOGOTA/PEREIRA, Colombia — Search and rescue operations accelerated across western Colombia as the death toll from a powerful 7.4-magnitude earthquake surpassed 250. The temblor, which struck the Chocó department on Monday morning, triggered catastrophic structural collapses across the urban centers of Pereira, Cali, and Quibdó, leaving thousands displaced and hundreds trapped under rubble. Newly inaugurated President Abelardo De La Espriella toured devastated districts in Pereira as local firefighters and international teams raced against time to locate survivors. Meanwhile, foreign governments and the United Nations mobilized emergency response efforts, with initial shipments of humanitarian aid arriving in the country to support disaster relief operations.
