title: Colombia earthquake has killed at least 132. My research helps explain why it was so destructive
body: Locals and officials in Colombia have begun a massive search and rescue effort to find survivors of a powerful earthquake that struck near San José del Palmar in Chocó, with major damage observed in the cities of Cali, Manizales and Pereira.
