title: 'Colombia Earthquake: Death Toll Rises To 132 After Powerful 7.4-Magnitude Quake; Rescue Operations Intensify Amid Aftershock Fears'
body: A powerful 7.4-magnitude earthquake struck Colombia, killing at least 132 people and injuring 570 others, according to CNN. Pereira reported 60 deaths, while 86 buildings collapsed and seven airports suspended operations.
