title: 'Colombia earthquake: 1.2 million need aid as some communities remain out of reach'
body: Ten days after a powerful earthquake struck western Colombia, an estimated 1.2 million people need humanitarian assistance, while some communities have still received little or no aid, UN agencies said on Thursday.
