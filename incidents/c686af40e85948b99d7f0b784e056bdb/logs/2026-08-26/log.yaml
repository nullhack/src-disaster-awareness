log_date: '2026-08-26'
summary: The death toll from the August 10 earthquake has risen to 331 as damage mounts two weeks after the event. Beyoncé announced a personal $1 million donation to relief organizations, while the first recycled-plastic home was delivered in Chocó to help displaced families. Criticism emerged over a music video allegedly filmed amid rubble in Pereira, and an analysis highlighted reconstruction as a potential economic opportunity for both Colombia and Venezuela.
