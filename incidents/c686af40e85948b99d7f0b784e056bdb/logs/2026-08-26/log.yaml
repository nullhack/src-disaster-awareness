log_date: '2026-08-26'
summary: |-
  The death toll from the August 10 earthquake has risen to 331 as damage mounts two weeks after the event. Beyoncé announced a personal $1 million donation to relief organizations, while the first recycled-plastic home was delivered in Chocó to help displaced families. Criticism emerged over a music video allegedly filmed amid rubble in Pereira, and an analysis highlighted reconstruction as a potential economic opportunity for both Colombia and Venezuela.
  As of August 26, the death toll from the August 10 earthquake stands at 331, with over 406,000 people affected across 16 departments. New aid contributions include a $50,000 donation from Sumitomo Corporation of Americas to the Colombian Red Cross and Beyoncé's personal $1 million donation for food and housing supplies. An El País feature highlights the plight of conflict-displaced families who lost their homes again in the earthquake.
