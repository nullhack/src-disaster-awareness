title: Revisiting Colombia two weeks after the devastating earthquake
body: Two weeks after a powerful 7.4-magnitude earthquake rocked Western Colombia, at least 329 people are dead, more than 4,500 are hurt, and hundreds are still missing. NBC News' George Solis reports.
