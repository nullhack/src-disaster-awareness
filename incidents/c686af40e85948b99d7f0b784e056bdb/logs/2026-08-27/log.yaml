log_date: '2026-08-27'
summary: |-
  Canada pledged $2 million in aid for earthquake relief, and the Open Society Foundations launched a $1.5 million rebuilding fund in Colombia. These new contributions add to ongoing international support for recovery from the August 10 M7.4 earthquake.
  A magnitude 5.3 earthquake struck northern Colombia on August 26, adding to the 2,158 tremors recorded since the mainshock. An analysis reports that the earthquake is exposing fragility in the coffee supply chain, causing arabica coffee prices to surge.
