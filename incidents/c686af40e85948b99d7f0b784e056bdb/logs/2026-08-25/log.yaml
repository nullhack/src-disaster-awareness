log_date: '2026-08-25'
summary: New developments on August 24-25 include Nicky Jam partnering with Grupo Argos to build earthquake-resistant homes for affected families, and Project HOPE detailing its emergency response and long-term recovery plans. Shakira finalized her $1.25 million school rebuilding pledge through Global Citizen and Live Nation in partnership with Howard Buffett, while the UN scaled up aid targeting 100,000 people. Human-interest stories of survival and hope emerged, and the "Voices for Life" concert featuring Maluma and Sebastian Yatra raised funds for victims.
