title: 'A triple crisis: Earthquake takes a heavy toll on Colombia''s impoverished and neglected region'
body: Recovering from the devastating earthquake that hit Colombia earlier this month will be particularly challenging for Choco, a remote region that has long struggled with high poverty rates, poor infrastructure and underfunded health and education services.
