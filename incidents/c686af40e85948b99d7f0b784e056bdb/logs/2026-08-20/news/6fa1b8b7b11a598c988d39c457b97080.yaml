title: Colombia Declares Economic Emergency, Testing Fiscal Pledges
body: Colombia declared a 30-day economic emergency to tackle the fallout from a devastating earthquake, adding new spending pressures as the country grapples with one of the most fragile fiscal outlooks in its history.
