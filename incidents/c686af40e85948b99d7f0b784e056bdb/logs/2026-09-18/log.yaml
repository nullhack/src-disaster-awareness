log_date: '2026-09-18'
summary: The Jacobs Foundation pledged CHF 5 million to support educational continuity for children affected by the August 10 earthquake. A series of five earthquakes struck Chocó within an hour, reactivating alert systems as the region continues to recover. Separately, Fitch Ratings noted that the quake will have limited impact on insurer ratings, while a new report highlights growing mental health needs among survivors, with free counseling networks addressing sleeplessness and fear.
