title: “Five Responses in One:" WCK’s Efforts After Colombia’s Earthquake | WCK
body: Less than 12 hours after the 7.4 earthquake struck western Colombia, WCK was serving meals. This was possible thanks to our local partners, our well-connected network of collaborators, and community members.
