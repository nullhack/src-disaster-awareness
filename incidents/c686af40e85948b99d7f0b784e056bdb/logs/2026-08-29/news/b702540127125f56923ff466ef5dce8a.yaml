title: 3,300 food kits being delivered to Cali, Colombia, after 7.4 earthquake
body: After a magnitude 7.4 earthquake in western Colombia, 1,000 food kits were delivered in Cali, with 2,300 more kits in the coming days. “You have shown love, genuine service and generosity to those who need it most,” said Elder Juan Pablo Villar in a recent video.
