log_date: '2026-08-29'
summary: |-
  The UN warned that damage to 4,000 schools from the August 10 earthquake increases the risk of child recruitment by armed groups in Chocó and Valle del Cauca. Separately, 3,300 food kits were delivered to Cali by The Church of Jesus Christ of Latter-day Saints to support affected families.
  On August 28, a vigil for earthquake victims was held at Bolivar Square in Bogota, attended by the public and covered by AP. Separately, satellite company SES and pop star Shakira are working to accelerate aid delivery to affected communities, with SES's local director coordinating a rescue and recovery plan.
