log_date: '2026-09-14'
summary: A local report from Tadó, Chocó, states that the August 10 M7.4 earthquake affected 30 of the 31 municipalities in the department, leaving more than 1,900 families impacted in Tadó alone. Mayor Juan Carlos Palacios expressed concerns over the distribution of aid to those affected. A broader review of recent natural disasters attributed the intensification of events to the super El Niño phenomenon, while an article also highlighted the role of U.S. diaspora groups in disaster relief efforts, including in Colombia.
