title: Powerful 7.4-Magnitude Earthquake Strikes Western Colombia, Triggering Evacuations
body: A 7.4-magnitude earthquake struck western Colombia, causing injuries, structural damage in Choco, and widespread evacuations across the region and nearby Ecuador.
