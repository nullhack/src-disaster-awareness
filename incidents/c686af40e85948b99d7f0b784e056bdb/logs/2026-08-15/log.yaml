log_date: '2026-08-15'
summary: As of August 14, the death toll from the M7.4 earthquake in Colombia rose to at least 285-287, with over 100,000 people affected and tens of thousands of homes damaged or destroyed. Rescue operations continued past the critical 72-hour survival window, with a dog rescued alive in Cali, while international aid expanded including a $200 million World Bank disbursement, Zoomlion heavy equipment deployment, and community fundraisers in the U.S. Geologists analyzed the quake's tectonic causes, and the new government faced growing strain in response efforts as search teams shifted toward a grim recovery phase.
