log_date: '2026-08-19'
summary: As of August 18-19, the death toll from the M7.4 earthquake has risen to 304, with 4,548 injured and 426 missing, as President de la Espriella estimated rebuilding costs at over $9.5 billion. In Chocó, the hard-hit Afro-Colombian and Indigenous region faces deep hardship, while a priest and nun recovered sacred hosts from rubble in a dangerous search. False conspiracy theories falsely linking the quake to an Alaska research program continued to circulate.
