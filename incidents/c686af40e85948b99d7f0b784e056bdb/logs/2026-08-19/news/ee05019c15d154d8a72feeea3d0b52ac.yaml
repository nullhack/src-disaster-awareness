title: Shakira Pledges $1.25 Million to Rebuild Colombia Schools After Earthquake
body: Shakira has committed an initial $1.25 million — with Global Citizen, Live Nation and CAF — to rebuild schools damaged by the earthquake in Colombia's Chocó region.
