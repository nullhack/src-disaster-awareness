title: Priest and Nun Recover Sacred Hosts From Earthquake Rubble in Colombia
body: Despite the danger of the earthquake’s aftershocks, a priest and nun in Colombia entered a chapel in search of the hosts that were kept in the tabernacle that they found destroyed.
