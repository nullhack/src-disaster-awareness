log_date: '2026-09-16'
summary: A new cluster of 26 earthquakes struck Chocó within 24 hours, including stronger tremors near Istmina, highlighting continued aftershock activity. Separately, Grupo Argos and reggaeton artist Nicky Jam announced a joint effort to build 1,000 homes for earthquake-affected families, with Quibdó and Chocó as focal points. Additionally, a Florida community (Tamarac) renewed local donation drives for Colombian earthquake relief.
