log_date: '2026-08-11'
summary: Search-and-rescue operations continued into a second day as the death toll from the August 10, 2026 magnitude 7.4 earthquake in western Colombia rose to over 150, with some reports exceeding 170 fatalities and more than 570 injured. Thousands of people were reported missing, and a state of emergency was declared after the quake—the strongest in Colombia in a decade—caused widespread building collapses in cities like Cali and Pereira.
