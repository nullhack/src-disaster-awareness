title: 'Colombia earthquake: The quakes that killed 70,000 people 158 years ago — all about the devastating 1868 Colombia-Ecuador disaster'
body: A strong earthquake struck western Colombia on August 10, 2026, causing significant damage and fatalities. This event recalls the devastating 1868 Ecuador-Colombia earthquakes which killed thousands.
