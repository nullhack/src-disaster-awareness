title: Colombia quake kills over 100, becomes country’s strongest earthquake this century - CNBC TV18
body: A magnitude 7.4 earthquake struck western Colombia on Monday, killing at least 111 people and injuring 87 as rescuers searched collapsed buildings for survivors across the country.
