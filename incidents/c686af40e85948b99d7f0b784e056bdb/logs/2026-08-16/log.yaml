log_date: '2026-08-16'
summary: As of August 15, recovery efforts continue with reports of apparent signs of life under rubble in Cali and Pereira, rekindling some hope. Colombia's president asked the US to temporarily suspend tariffs to aid economic recovery, while human-interest stories emerged, including the tragic discovery of a groom-to-be in collapsed hotel rubble and a heartwarming video of a child donating her piggy bank for relief.
