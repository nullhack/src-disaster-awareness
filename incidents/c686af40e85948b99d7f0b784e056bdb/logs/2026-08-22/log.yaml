log_date: '2026-08-22'
summary: |-
  On August 21, President De La Espriella activated wage subsidies and labor relief measures to prevent mass layoffs after the earthquake, while coffee sector leaders clarified that El Niño, not the quake, will impact the harvest. Search-and-rescue teams from Fairfax County and Los Angeles County returned home after completing their deployment.
  The official death toll from the August 10 M7.4 earthquake in Colombia has risen to 329, with 4,600 injured and 247 still missing, affecting over 314,000 people. Community-led relief efforts continue, including a Lakewood family raising funds via a lemonade stand and a Huntington Park church holding a solidarity Mass.
