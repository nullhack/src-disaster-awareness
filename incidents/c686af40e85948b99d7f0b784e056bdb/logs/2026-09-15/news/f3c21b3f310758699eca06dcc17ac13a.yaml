title: Cold Chain Technologies supports Farmamundi’s humanitarian delivery of temperature-sensitive medicines to Venezuela
body: CCT Edge pallet shippers supplied by Cold Chain Technologies (CCT) have been instrumental in the successful delivery by Farmamundi of critical pharmaceutical products to earthquake-affected communities in Venezuela.
