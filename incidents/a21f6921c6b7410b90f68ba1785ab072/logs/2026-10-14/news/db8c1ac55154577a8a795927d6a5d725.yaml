title: هزة أرضية في بابوا غينيا الجديدة بقوة 5.7 درجات وتفاصيل النشاط
body: ضربت هزة أرضية في بابوا غينيا الجديدة بقوة 5.7 درجات منطقة نيو بريتن، وسط نشاط زلزالي متكرر في حلقة النار. تعرف على التفاصيل والتقارير الأولية.
