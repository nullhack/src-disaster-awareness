title: Dos sismos de magnitud superior a 5 sacudieron Papúa Nueva Guinea y pusieron en alerta a una de las zonas más sísmicas del Cinturón de Fuego del Pacífico
body: El Servicio Geológico de Estados Unidos USGS registró dos movimientos sísmicos de magnitud 53 y 51 este martes 13 de octubre con epicentros en el mar al sur de Kokopo Los fenómenos ocurrieron en una de las zonas de mayor actividad tectónica del planeta Hasta el momento no se emitieron alertas de tsunami
