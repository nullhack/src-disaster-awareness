log_date: '2026-08-18'
summary: The selected news reports widespread drought impacts globally. In the U.S., Lake Powell hit a record low, and Amarillo entered Stage 1 drought contingency. The UK saw Wessex Water impose its first hosepipe ban since 1976, and drought worsened in southern Queensland, Australia. Germany's Rhine River remained low, threatening navigation, and the NFU warned of crop failures. Other reports highlighted severe drought in Wisconsin, reduced grain harvests in Germany, and the potential for a super El Niño affecting Latin America and Sri Lanka.
