title: How will Latin America’s super El Niño affect the top food-exporting regions? - BusinessWorld Online
body: BUENOS AIRES/SAO PAULO — Latin America is bracing for what experts say could be the strongest El Niño on record, raising questions about how the climate phenomenon will affect the world’s top food-exporting regions. El Niño, characterized by unusually warm sea surface temperatures in the central and eastern tropical Pacific Ocean, disrupts weather patterns worldwide. […]
