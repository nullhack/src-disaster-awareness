title: Video. Rhine River remains low amid ongoing drought in Germany
body: Video. Drought conditions have pushed water levels on Germany's Rhine to exceptionally low levels. The situation is putting pressure on inland navigation along one of western Europe's key transport routes. It comes amid a record-breaking wave of extreme weather across the region.
