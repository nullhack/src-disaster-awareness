log_date: '2026-11-13'
summary: The weekly drought monitor shows little change, with some coastal counties upgraded to severe status. New studies find that drought threatens girls' safety and education in Zimbabwe and other countries, and that climate change and El Niño worsened Indonesia's haze by intensifying peatland burning. Additionally, the Telangana High Court has sought a report on drought conditions in the state, with a hearing scheduled for December 9.
