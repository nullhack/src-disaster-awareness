log_date: '2026-11-13'
summary: |-
  The weekly drought monitor shows little change, with some coastal counties upgraded to severe status. New studies find that drought threatens girls' safety and education in Zimbabwe and other countries, and that climate change and El Niño worsened Indonesia's haze by intensifying peatland burning. Additionally, the Telangana High Court has sought a report on drought conditions in the state, with a hearing scheduled for December 9.
  Eastern North Carolina sees worsening drought with farmers suffering crop losses, while metro Atlanta continues planned water releases from Lake Lanier as drought persists. However, heavy October rains have eliminated drought in Iowa for the first time since 2025, and New Mexico has experienced dramatic drought relief, with less than 30% of the state now in drought. Separately, the Galápagos floods highlight the broader El Niño impacts, though not directly drought-related.
