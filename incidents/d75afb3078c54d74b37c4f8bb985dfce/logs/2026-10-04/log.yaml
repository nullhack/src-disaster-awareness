log_date: '2026-10-04'
summary: In early October 2026, Karnataka, India escalated its drought relief request, with the Chief Minister seeking ₹7,142 crore from the central government and the Tumakuru district reporting an estimated ₹159 crore in crop losses. In the United States, Alachua County, Florida continued mandatory water restrictions amid moderate drought, while Kittery, Maine declared emergency water levels as reservoir depths remained 12 feet below normal. Additionally, September 2026 was confirmed as the hottest and one of the driest Septembers on record, compounding drought pressures.
