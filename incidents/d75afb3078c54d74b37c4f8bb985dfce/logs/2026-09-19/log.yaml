log_date: '2026-09-19'
summary: |-
  New reports highlight drought intensification in new and existing areas: Maharashtra, India faces a push for a drought declaration and aid; Sudan's henna tradition is threatened by war and drought; and Barbados warns of moderate to severe drought risk by mid-century. Localized updates include early leaf drop in Kansas due to drought, record heat and persistent drought in Northeast Arkansas, severe drought in Victoria County, Texas, and Indonesia bracing for El Niño conditions. The super El Niño continues threatening Central America food security, while Oklahoma’s drought is severe but not record-breaking, and the Colorado River District held a water seminar.
  New reports detail drought gripping all of Utah with reservoirs at 50% capacity, while Pueblo, Colorado farmers face a difficult year but produce hotter chiles due to dry conditions. Satellite images confirm Lake Powell's record low, and a South Dakota farmer expects corn yields to drop by half. Internationally, Zambia is commended for navigating drought, and farmers in Tamil Nadu, India staged protests seeking drought relief.
