log_date: '2026-09-19'
summary: 'New reports highlight drought intensification in new and existing areas: Maharashtra, India faces a push for a drought declaration and aid; Sudan''s henna tradition is threatened by war and drought; and Barbados warns of moderate to severe drought risk by mid-century. Localized updates include early leaf drop in Kansas due to drought, record heat and persistent drought in Northeast Arkansas, severe drought in Victoria County, Texas, and Indonesia bracing for El Niño conditions. The super El Niño continues threatening Central America food security, while Oklahoma’s drought is severe but not record-breaking, and the Colorado River District held a water seminar.'
