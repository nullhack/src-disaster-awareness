title: Drought grips all of Utah; reservoirs at 50% of capacity - Park Record
body: As autumn approaches and nighttime temperatures cool down, the Utah Division of Water Resources reminds Utahns to adjust their irrigation habits and prepare for the upcoming water year. “With shorter days and cooler evening temperatures, landscape water requirements decrease significantly,” said Joel Williams, director at the Division of Water Resources. “Irrigation timers should be adjusted […]
