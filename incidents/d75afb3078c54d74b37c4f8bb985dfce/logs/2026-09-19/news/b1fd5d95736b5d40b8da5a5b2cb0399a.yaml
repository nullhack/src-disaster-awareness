title: Farmers feel the heat as drought threat grows - Barbados Today
body: Food production could come under growing pressure as a new climate report warns that Barbados may face moderate to severe drought for up to four months each year by mid-century, adding to the water shortages, heat damage and falling crop yields already confronting farmers.
