log_date: '2026-10-29'
summary: Two Middle Tennessee cities urged residents to conserve water as severe drought strains local supplies. Denver Water announced it will raise outdoor watering rates in 2027, citing extreme drought and climate pressures. In India, Karnataka’s chief minister plans to meet Prime Minister Modi to seek drought relief, while a farmer in the state sold gold worth ₹6 lakh to repay debts caused by crop failure.
