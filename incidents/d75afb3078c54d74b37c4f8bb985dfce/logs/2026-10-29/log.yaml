log_date: '2026-10-29'
summary: |-
  Two Middle Tennessee cities urged residents to conserve water as severe drought strains local supplies. Denver Water announced it will raise outdoor watering rates in 2027, citing extreme drought and climate pressures. In India, Karnataka’s chief minister plans to meet Prime Minister Modi to seek drought relief, while a farmer in the state sold gold worth ₹6 lakh to repay debts caused by crop failure.
  The Maharashtra government waived eligibility restrictions for drought relief, ensuring all affected farmers in 304 talukas receive assistance. Nashville recorded its 10th driest year with extreme drought conditions and a rainfall deficit exceeding 12 inches. The latest Drought Monitor update provides a current overview of drought conditions across the United States.
