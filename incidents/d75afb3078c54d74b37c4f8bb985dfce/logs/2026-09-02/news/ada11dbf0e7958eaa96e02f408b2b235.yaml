title: France sees limited economic hit from drought, heatwaves
body: Drought and record heatwaves across France this summer will shave 0.1 percent off the country's economic growth this year, adding to the heavy human toll, the finance ministry said Wednesday.The French government forecast earlier this year 2026 GDP growth of 0.7 percent, but economists have warned this target is unlikely to be met after growth stalled in the second quarter and the economy contracted 0.2 percent in the first three months of this year. slb/ak/js/rl
