summary: New reports confirm the UK experienced its hottest summer on record since 1884, with temperatures averaging 16.8°C, exacerbating drought conditions. South Africa faces a hotter, drier summer as a "very strong" El Niño develops, while Indonesia warns of challenging wildfire containment as the El Niño peaks this month. In the US, Puerto Rico's drought intensifies prompting a federal water disaster declaration, Lakeland Florida considers $500 fines for repeat water violations amid persistent drought, and Colorado Springs recorded near-record August heat and drought, with the month being the fourth-warmest on record.
