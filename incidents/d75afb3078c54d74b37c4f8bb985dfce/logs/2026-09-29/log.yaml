log_date: '2026-09-29'
summary: |-
  New reports highlight ongoing drought impacts and responses: Central Oregon’s Wickiup Reservoir will undergo a rapid drawdown, New Mexico water conservation officials are seeking increased state funding, and Missouri farmers hope upcoming rain and cooler weather will ease drought stress. A nor’easter brought up to 7 inches of rain to drought-hit Cape Cod, offering some relief. Additional coverage examines drought’s broader consequences, including reduced cattle herds fueling a potential global meat crisis, forests losing their ability to absorb CO₂, and UK drought talks aimed at protecting nature.
  Karnataka, India plans to submit its final drought appeal to the central government in October. A weekend nor'easter brought rain to parts of New England, allowing some outdoor watering bans to be relaxed, while Tallahassee, Florida may see drought relief from an approaching cold front and El Niño. Elsewhere, Sullivan, Illinois extended its water emergency into December but lifted vehicle washing restrictions, Uruguay's IMF growth forecast was cut to 1.3% due to drought-damaged soy, and New England's fall foliage is threatened by ongoing dry conditions.
