title: Without water, forests lose their ability to absorb CO₂
body: To survive periods of drought, trees halt photosynthesis, a highly water-intensive process. For every molecule of CO₂ absorbed by a tree leaf, an average of around 400 water molecules are released. Entire forests may then end up emitting more CO₂ than they capture.
