title: Uruguay Growth Forecast Cut to 1.3% by the IMF, Below the Government's 1.6%
body: The IMF now expects Uruguay's economy to grow 1.3% in 2026 after a drought hit soy. The minister calls it appropriate; the official forecast is still 1.6%.
