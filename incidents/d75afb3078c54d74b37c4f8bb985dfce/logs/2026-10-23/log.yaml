log_date: '2026-10-23'
summary: New UN warnings estimate the record El Niño could push 50 million people toward hunger, as the World Meteorological Organization now characterizes the super El Niño as unprecedented in strength. Regional impacts deepen with Karnataka, India, seeing families migrate to cities due to drought and Maine’s drought worsening to leave more wells dry. Meanwhile, Vermont and New Hampshire experience minor improvements, while the Philippines ramps up preparedness with calls for mobile water treatment systems and soil assessments.
