log_date: '2026-08-30'
summary: New drought developments include the Philippines' Department of Agriculture ordering agencies to adjust El Niño plans, while southwest Missouri fire chiefs warn of an extreme fire season as severe drought worsens. Extreme and exceptional drought expanded further in the Pacific Northwest, with 91% of Oregon now affected, and Ecuador became the latest Latin American country to declare an emergency over El Niño. Record drought in Europe is also forcing river cruise lines to alter itineraries.
