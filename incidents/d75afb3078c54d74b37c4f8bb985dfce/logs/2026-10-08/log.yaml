log_date: '2026-10-08'
summary: 'New reports highlight continued global drought impacts: England recorded its smallest cereal and oilseed harvest in over 40 years due to extreme heat and drought, while America''s two largest reservoirs (Lake Mead and Powell) dropped to record lows. Maharashtra, India ordered free foodgrain distribution in 265 drought-hit talukas, and the Philippine province of Iloilo reported P124 million in agricultural losses from three months of below-normal rainfall. The latest U.S. Drought Monitor shows mixed conditions, with the Roanoke region remaining in emergency drought despite some improvements elsewhere.'
