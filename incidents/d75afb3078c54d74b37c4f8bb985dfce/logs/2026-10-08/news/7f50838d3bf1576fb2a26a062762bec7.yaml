title: Iloilo tackles drought’s impact on agriculture
body: ILOILO CITY — Three consecutive months of below-normal rainfall have affected 3,792.93 hectares of farmlands in Iloilo, with agricultural losses estimated at P124 million, the provincial government said on Thursday.
