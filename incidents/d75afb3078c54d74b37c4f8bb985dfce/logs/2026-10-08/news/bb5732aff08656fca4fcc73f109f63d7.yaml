title: Maharashtra Orders Free Foodgrains In 265 Drought-Hit Talukas, Extends Ration Benefits To Needy Families & Migrants
body: Maharashtra has ordered uninterrupted free foodgrain distribution in 265 drought-hit talukas following deficient kharif rainfall. Eligible needy residents will be brought under food security schemes, subject to prescribed conditions. Migrant families can collect rations through the One Nation One Ration Card system, while officials have been directed to prevent hoarding and black-marketing.
