log_date: '2026-11-04'
summary: The Philippines warns that 87 provinces could face drought by March 2027 as the very strong El Niño persists, while Bolivia reports 78,200 families in seven of its nine states affected by drought-linked El Niño conditions. In the U.S., Missouri recorded its third warmest October on record with persistent drought despite Election Day rainfall, and a new map shows multiple countries across the Americas declaring emergencies due to El Niño impacts including drought.
