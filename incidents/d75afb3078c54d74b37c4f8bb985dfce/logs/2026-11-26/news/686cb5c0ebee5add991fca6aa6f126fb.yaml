title: 'Guatemala: El Niño drought pushes families to sell possessions or send children to work to afford food'
body: Families in Guatemala are resorting to desperate measures to stave off hunger as the El Niño-induced drought gripping the country worsens with four in ten families in affected areas telling Save the Children they were forced to sell possessions to generate income to feed their children.
