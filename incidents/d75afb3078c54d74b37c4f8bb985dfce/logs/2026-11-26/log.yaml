log_date: '2026-11-26'
summary: NOAA reports that the 2026–2027 El Niño continues to strengthen, with the eastern Pacific at 4.9°C above normal and Latin America bracing for peak impacts. Lake Powell rose 24 feet after fall rains, but Arizona still faces persistent drought conditions as officials monitor early snowpack. In Guatemala, El Niño-induced drought is pushing families to sell possessions or send children to work to afford food.
