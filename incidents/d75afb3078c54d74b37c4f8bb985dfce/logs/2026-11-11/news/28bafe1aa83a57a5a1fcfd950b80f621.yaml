title: Drought reshapes livelihoods of Kenya’s Daasanach pastoralists, study finds
body: The Daasanach people in the Turkana Basin of northern Kenya experienced the worst drought in 40 years between November 2020 and March 2023. The Daasanach are pastoralists who have lived semi-nomadically for roughly 6,000 years, supported by herds of livestock including cows, camels, donkeys, and goats. A group of researchers worked with the Daasanach to […]
