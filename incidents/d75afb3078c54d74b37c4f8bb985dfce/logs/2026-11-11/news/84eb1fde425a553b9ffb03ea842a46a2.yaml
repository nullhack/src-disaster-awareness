title: Telangana SLBC urges banks to support drought-hit farmers with fresh credit
body: The Telangana SLBC held a special meeting on drought relief measures for Kharif 2026 alongside its 51st quarterly review. Minister Bhatti Vikramarka Mallu urged banks to support eligible farmers through loan restructuring, rescheduling and timely fresh credit facilities
