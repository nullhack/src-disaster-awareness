title: Williams calls for greater financing to tackle drought, land degradation at UNCCD COP17 - Jamaica Observer
body: KINGSTON, Jamaica — Minister of State in the Ministry of Local Government Delroy Williams is calling for increased financing and stronger action to address drought, land degradation, water security and other environmental challenges affecting small island developing states such as Jamaica. Williams represented Jamaica at the 17th session of the Conference of the Parties to the United Nations Convention to Combat Desertification (UNCCD COP17), held in Ulaanbaatar, Mongolia, from August...
