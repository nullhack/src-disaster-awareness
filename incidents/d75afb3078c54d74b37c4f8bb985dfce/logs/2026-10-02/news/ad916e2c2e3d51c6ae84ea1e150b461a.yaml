title: Pagasa warns of water crisis in Western Visayas
body: ILOILO CITY — Western Visayas could face a potential water crisis as rainfall is expected to fall below normal from December 2026 through March 2027 due to the El Niño phenomenon, said the Philippine Atmospheric, Geophysical and Astronomical Services Administration (Pagasa).
