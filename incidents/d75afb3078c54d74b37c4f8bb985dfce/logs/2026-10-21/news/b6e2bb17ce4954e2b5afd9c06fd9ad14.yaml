title: 'PAGASA: ‘Mega’ El Niño unprecedented; to extend to up to first half of 2027'
body: The state weather bureau said the current El Niño, which will peak before the end of 2026, is actually not only a “very Strong El Niño” or a Super El Niño, but a “very, very strong” one. Speaking to DZRH in an interview on Dos Por Dos, Philippine Atmospheric, Geophysical and Astronomical Services...
