log_date: '2026-10-09'
summary: Yorkshire, England has been officially declared in drought after record-breaking dry weather, though no water restrictions are planned. In the U.S., extreme drought in the Ozarks threatens thinner fall foliage, and drought in the Everglades National Park caused the lowest wading bird nesting season in 30 years. Additionally, southeastern Massachusetts remains in a drought despite recent rain, and drought conditions persist in northern Wisconsin.
