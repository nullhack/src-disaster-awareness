log_date: '2026-10-22'
summary: Selected reports show drought remains a major issue, with 2026 setting all-time drought records in 10 U.S. states and the October 15, 2026 Drought Monitor update tracking ongoing conditions. In Central America, Honduras is weighing a contentious cloud-seeding tactic to combat El Niño-fueled drought in the Dry Corridor, while Puerto Rico experienced a severe and rapidly intensifying drought during its rainy season.
