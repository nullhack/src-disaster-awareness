title: Drought Monitor shows dry and drought conditions in 15% of Iowa - Radio Iowa
body: The latest Iowa Drought Monitor shows about 15% of Iowa is abnormally dry or experiencing some level of drought conditions, a big drop from a year ago. Last year at this time a quarter of the state was considered to be in a drought or abnormally dry. This week’s Drought Monitor report shows about 7% […]
