log_date: '2026-09-22'
summary: |-
  New reports highlight continued and evolving drought impacts: Iowa's drought area dropped to 15% (from a quarter last year), while England may remain in drought into spring 2027, needing 120% of typical rainfall for recovery. Arkansas farmers face lasting effects from the 2026 heat wave, Oklahoma's fall foliage will be shortened/dulled, and the Black River fish population is declining due to drought. The WMO noted 2025 among the driest years for rivers globally, and Zimbabwe relaxed grain imports amid drought fears. Locally, Michigan's drought varies from none to extreme, Horry County saw no change in extreme drought, and North Texas could see a rainy winter from El Niño.
  New developments include a worsening El Niño threatening Asia with potential food price rises, and Indonesia cutting nickel production due to drought. In India, Maharashtra formed a drought relief sub-committee and Karnataka's affected taluks rose to 177. Drought returned to Tennessee, Maine farmers reported a second straight severe year, and ECOWAS warned of displacement risks from drought in West Africa.
