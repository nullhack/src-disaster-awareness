log_date: '2026-10-11'
summary: New drought developments include New Braunfels, Texas raising water surcharges due to dry conditions, Jomalig Island in the Philippines declaring a state of calamity from El Niño-induced drought, and drought persisting across northern Wisconsin. In Karnataka, India, political criticism emerged over the government's drought response, while the grand Mysuru Dasara festival proceeded despite drought conditions.
