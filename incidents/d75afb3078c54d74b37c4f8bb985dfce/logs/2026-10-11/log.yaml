log_date: '2026-10-11'
summary: |-
  New drought developments include New Braunfels, Texas raising water surcharges due to dry conditions, Jomalig Island in the Philippines declaring a state of calamity from El Niño-induced drought, and drought persisting across northern Wisconsin. In Karnataka, India, political criticism emerged over the government's drought response, while the grand Mysuru Dasara festival proceeded despite drought conditions.
  New drought impacts include Maharashtra Deputy Chief Minister reporting 75–80% of the state is in drought and seeking federal aid, Lundy Island in the UK imposing visitor caps due to critical water shortages, and the Okanagan region of Canada warning that Super El Niño and drought are the new normal. In the US, a Wyoming rancher sold 40 breeding cows because of drought, Hurricane Isaias brought rain that eased drought along the North Carolina coast, and the UK formed a flood and drought taskforce to prepare for extreme winter weather.
