title: 'Maharashtra Facing Drought In 75-80% Area, Seeking Big Relief: Dy CM Eknath Shinde'
body: Speaking at the India Today Mumbai Conclave, Maharashtra Deputy Chief Minister Eknath Shinde addressed the agrarian crisis and severe drought across the state. Shinde stated that 75 to 80 percent of the area is grappling with drought and confirmed raising the requirement for major assistance with Prime Minister Narendra Modi in New Delhi. Emphasising the administration's support for the farming community, Shinde noted that "even one suicide is extremely unfortunate" and underlined that the state government expanded disaster relief criteria under NDMF from two hectares to three hectares while adding supplementary financial assistance of 6,000 rupees to the PM-Kisan scheme during his tenure. Responding to opposition criticism and allegations regarding financial constraints, Shinde urged against politicising the hardships of farmers facing natural calamities and affirmed that the Mahayuti government remains committed to supporting all sectors, including farmers, youth, women, and entrepreneurs
  across Maharashtra.
