title: Atlantic Agro targets drought-hit farmers with dry-weather resilient seeds - Jamaica Observer
body: ATLANTIC Hardware Limited is increasing support for droughthit farmers as it stocks up on drought-resistant hybrid seeds designed to help sustain crop production, amid prolonged dry conditions affecting the local agriculture sector. CEO Deanall Barnes said the move forms part of Atlantic’s longer-term strategy as changing weather patterns increase demand for agricultural inputs that can perform under water-stressed conditions. “We realise that the weather patterns are very clear that we’re...
