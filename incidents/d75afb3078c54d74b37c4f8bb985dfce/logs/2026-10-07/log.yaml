log_date: '2026-10-07'
summary: |-
  The super El Niño continues to strengthen, breaking Pacific daily heat records and putting over 347 million children at risk, according to UNICEF. New localized drought impacts include reduced almond harvests in Afghanistan, damaged pumpkin crops in Arkansas, cancellation of a winter ice attraction in Colorado, and emergency assistance programs in Oklahoma. Oregon’s drought eased slightly, while the low Panama Canal water level has driven a 70% increase in ship traffic via the Strait of Magellan.
  Andhra Pradesh has declared drought in 21 districts with 283 mandals severely affected, while Karnataka continues to seek central aid after crop failures in 217 taluks estimated at over ₹46,000 crore in losses. New warnings highlight El Niño-driven drought risks in Colombia (food prices, livestock) and Papua New Guinea, and the Philippines projects drought could expand to 84 areas by March 2027. Elsewhere, Atlantic Hardware in Jamaica is stocking drought-resistant seeds, and a study warns that extreme drought and heat from the previous El Niño may signal a new normal for tropical forests.
