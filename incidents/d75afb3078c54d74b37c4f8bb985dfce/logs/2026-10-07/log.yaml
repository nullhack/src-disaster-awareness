log_date: '2026-10-07'
summary: The super El Niño continues to strengthen, breaking Pacific daily heat records and putting over 347 million children at risk, according to UNICEF. New localized drought impacts include reduced almond harvests in Afghanistan, damaged pumpkin crops in Arkansas, cancellation of a winter ice attraction in Colorado, and emergency assistance programs in Oklahoma. Oregon’s drought eased slightly, while the low Panama Canal water level has driven a 70% increase in ship traffic via the Strait of Magellan.
