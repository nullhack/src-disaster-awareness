log_date: '2026-09-16'
summary: |-
  Drought conditions continue to drive heightened wildfire risks in East Texas, with Smith County and Texoma officials warning of dangerous fire behavior due to dry grass and extreme heat. Meanwhile, a forecasted "super El Niño" is expected to intensify drought and heat patterns globally, with Central America already experiencing severe drought-related crop failures and livestock deaths. In the Pacific Northwest, September storms provided partial relief in Oregon, though more rain is needed to fully ease drought conditions. The UK also announced preparations to assist vulnerable countries facing devastating El Niño impacts.
  New reports show continued drought-driven disruptions: the Panama Canal faces further transit cuts due to worsening El Niño-related drought, Peoria, Arizona is investing $104 million in water supplies ahead of federal Colorado River cutbacks, and Westminster, Colorado maintains its 2026 Drought Watch while expanding conservation outreach. Additionally, a forecast warns Karnataka, India could face severe drought in 2027 if El Niño persists, and drought is causing boating hazards in the Upper Midwest.
