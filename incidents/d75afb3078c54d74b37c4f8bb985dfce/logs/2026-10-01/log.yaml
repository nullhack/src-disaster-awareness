log_date: '2026-10-01'
summary: India's monsoon season ended with a 13% rainfall deficit, the weakest in over a decade, while UN talks on a global drought framework stalled. In the U.S., the latest Drought Monitor showed mixed conditions, with rain expected in Arkansas but drought persisting, and Virginia granted a temporary hay transport exemption for farmers. Europe's potato sectors faced quantified losses from the 2026 drought, and farmers in excluded Maharashtra talukas complained of crop losses amid political criticism of the state's drought response.
