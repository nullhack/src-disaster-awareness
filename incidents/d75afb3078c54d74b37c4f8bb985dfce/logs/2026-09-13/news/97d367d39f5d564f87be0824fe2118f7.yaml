title: Before its peak, El Nino brings failed crops and empty fishing nets - AOL
body: El Nino is already disrupting livelihoods and weather patterns around the world as one of the strongest events in decades continues to intensify. With its peak still months away, scientists warn the powerful Pacific climate phenomenon will bring more drought and flooding into 2027, while human-caused global warming is making some of its effects more severe.
