log_date: '2026-09-13'
summary: New drought developments include water emergencies declared in Chatham, Virginia, and Childress, Texas, where extreme drought has left the city without safe water. The National Weather Service reports minor drought relief in Arkansas but notes ongoing drought stress on trees. Forecasters confirm a greater than 90% chance of a very strong El Niño, which continues to drive global drought, crop failures, and the Royal Horticultural Society urges English gardeners to switch to drought-tolerant crops.
