body: Most of North Carolina remains at some level of drought, as Columbus County moves into its third week with no significant widespread rain. This morning’s weekly update of the state drought monitor shows that Columbus County is now considered to be experiencing Severe Drought conditions. Last summer, portions of the county were listed as being…
