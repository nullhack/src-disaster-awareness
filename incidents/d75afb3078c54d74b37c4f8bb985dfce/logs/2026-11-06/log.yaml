log_date: '2026-11-06'
summary: |-
  Early November rain has shrunk drought in the KELOLAND region, but severe and extreme drought persists or intensifies in North Carolina (Columbus County, central NC), delaying wheat planting. The Brazos Valley in Texas continues under drought with little change, while Ludlow Racecourse in the UK fears losing its entire 2026-27 season due to summer drought impacts.
  Recent storms temporarily raised Lake Powell's water level but drought concerns persist; Fort Mill, South Carolina downgraded its drought advisory amid improved conditions, while drought expanded in Vermont and New Hampshire. Rainfall deficits continue in Houston (7 inches below normal) and the Triangle area, and drought fears are resurging in South Africa’s Zululand region as a strong El Niño develops. Additionally, Zimbabwe is reviewing its drought forecasting systems to better prepare for El Niño impacts.
