log_date: '2026-11-06'
summary: Early November rain has shrunk drought in the KELOLAND region, but severe and extreme drought persists or intensifies in North Carolina (Columbus County, central NC), delaying wheat planting. The Brazos Valley in Texas continues under drought with little change, while Ludlow Racecourse in the UK fears losing its entire 2026-27 season due to summer drought impacts.
