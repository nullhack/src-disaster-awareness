title: El Niño risks put South Africa’s 2026/27 farming season on alert
body: South Africa is strengthening drought preparedness for the 2026/27 summer season as El Niño threatens hotter, drier conditions in key farming regions. Officials say strong dam levels and improved farming practices offer some protection, but rain-fed and smallholder producers remain vulnerable.
