title: OlsAro raises €5m to commercialise salt-tolerant wheat as it expands into drought and nitrogen-efficiency traits
body: Swedish company OlsAro has raised €5 million in seed funding to accelerate the launch of its salinity-resilient wheat, targeting a commercial debut in 2027, while expanding its AI-driven SeedAX platform into drought tolerance, heat resilience, and nitrogen-use efficiency traits in cereal crops. The investment will fund international field trials, product development, and broader crop applications, with rice identified as the next target after wheat. SeedAX combines genetics, AI, and advanced breeding to address global challenges such as salinity, drought, and fertiliser efficiency. Backed by major investors, OlsAro aims to scale its platform through new traits, partnerships, and market expansion.
