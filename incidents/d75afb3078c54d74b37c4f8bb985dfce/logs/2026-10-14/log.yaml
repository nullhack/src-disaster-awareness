log_date: '2026-10-14'
summary: 'The selected news reports continued drought impacts: Maharashtra, India waives exam fees and provides advance assistance to drought-affected farmers, while Andhra and Karnataka face a 30% monsoon deficit. In the US, Texas sees early pumpkin harvest due to drought, Mississippi enforces burn bans in over 20 counties, Arkansas duck hunting spots are threatened, and Colorado fights pine beetles exacerbated by drought; however, drought ends in the Connecticut River Valley and Tampa Bay gets rain relief. Globally, the Philippines reports significant farmland damage in Iloilo, South Africa prepares for El Niño farming risks, Germany''s wine harvest is hit, and tropical rainfall does little to alleviate Lake Mead''s crisis.'
