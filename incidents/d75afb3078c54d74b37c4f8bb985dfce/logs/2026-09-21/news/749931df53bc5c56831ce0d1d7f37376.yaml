title: 'ಗದಗ ತಾಲೂಕು ಬರ ಪೀಡಿತ ಘೋಷಿಸದಿದ್ದರೆ ಶಾಸಕ ಸ್ಥಾನಕ್ಕೆ ರಾಜೀನಾಮೆ: ಎಚ್.ಕೆ. ಪಾಟೀಲ ಎಚ್ಚರಿಕೆ'
body: 'ಗದಗ: ಅಕ್ಟೋಬರ್ 10ರೊಳಗಾಗಿ ಸರಕಾರ ಗದಗ ತಾಲೂಕನ್ನು ಬರ ಪೀಡಿತ ಪ್ರದೇಶ ಎಂದು ಘೋಷಿಸದಿದ್ದರೆ ಶಾಸಕ ಸ್ಥಾನಕ್ಕೆ ರಾಜೀನಾಮೆ ನೀಡುವುದಾಗಿ ಮಾಜಿ ಸಚಿವ, ಶಾಸಕ ಎಚ್.ಕೆ. ಪಾಟೀಲ ಅವರು ತಮ್ಮ ಸರ್ಕಾರದ'
