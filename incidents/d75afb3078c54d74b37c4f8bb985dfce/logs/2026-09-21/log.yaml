log_date: '2026-09-21'
summary: New drought-related developments emerged in India and Sri Lanka. In Karnataka, a three-day special assembly session is convening to discuss the ongoing drought crisis and Western Ghats report, while Congress MLA H K Patil has threatened to resign if Gadag taluk is not declared drought-hit by October 10. Sri Lanka's Air Force flew Buddhist monks over drought-affected areas to perform rituals and sprinkle holy water. Other news included a Florida drought feature and Zambia's maize reserve announcement, which are less directly tied to new drought impacts.
