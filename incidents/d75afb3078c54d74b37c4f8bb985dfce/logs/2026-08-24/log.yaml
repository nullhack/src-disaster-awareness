log_date: '2026-08-24'
summary: The City of Amarillo suspended splash pads and park irrigation due to extreme drought, while San Antonio's drought eased but remained unresolved. Crop production in South Dakota and Kenya faced pressure, and Tyson closures are expected to raise beef costs as the Texas drought shrinks the US herd to a 75-year low. The Colorado River's largest reservoirs, Lake Powell and Lake Mead, hit all-time lows as critical drought conditions persist across the West.
