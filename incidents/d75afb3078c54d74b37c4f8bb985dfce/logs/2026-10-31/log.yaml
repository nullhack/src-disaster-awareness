log_date: '2026-10-31'
summary: |-
  New reports detail ongoing drought impacts and local changes: Utah remains over 90% in drought despite above-normal rain, while west central Nebraska saw severe drought conditions removed after recent precipitation. In India, the USDA forecasts El Niño-induced drought will slow milk production growth to 2% in 2027, and Maharashtra released funds for tree plantation maintenance. Additionally, a regional report from South Carolina notes that peaches and blackberries thrived in the drought year, but cucumbers, squash, sweet corn, and late plantings struggled.
  In St. Croix, extreme drought is causing crop and livestock losses for farmers as conditions persist into late October. In Andhra Pradesh, India, two central government teams will assess drought and cyclone damage over four days. Meanwhile, Southwest Florida water officials may extend a water shortage order as moderate to extreme drought continues affecting the Tampa Bay area.
