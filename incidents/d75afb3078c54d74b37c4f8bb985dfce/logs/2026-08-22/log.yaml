log_date: '2026-08-22'
summary: New federal 2027-2028 Colorado River water cuts increase Arizona's reduction by 48% (27% of total supply). Drought deepens in the Ozarks, Durham NC, and Bullard TX where stage 2 water restrictions were enacted. Hungary reports 99% of the country under severe/extreme drought with record low water levels, while Germany recorded nearly 14,000 heat-related deaths this summer. The Panama Canal continues reducing ship passages due to El Niño-driven drought, and the US declared a drought disaster for the Virgin Islands.
