title: Video. Mongolia hosts UN desertification summit as drought crisis deepens
body: Video. Mongolia is hosting the UN Convention to Combat Desertification’s COP17 in Ulaanbaatar from 17 to 28 August, bringing together representatives from 196 countries and the European Union to tackle land degradation, drought and desertification.
