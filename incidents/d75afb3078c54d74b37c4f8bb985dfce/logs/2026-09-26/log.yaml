log_date: '2026-09-26'
summary: Maharashtra declared drought in 265 tehsils (74% of state), while a central survey team was sent to assess Karnataka's drought-hit districts. Mississippi's drought worsened, triggering burn bans in 16 counties. Suffolk County offered federal disaster loans for year-long drought impacts, and the Colorado River crisis threatens Southwest peach farming. Oklahoma City's prolonged heat wave set records with 54 consecutive days above 90°F.
