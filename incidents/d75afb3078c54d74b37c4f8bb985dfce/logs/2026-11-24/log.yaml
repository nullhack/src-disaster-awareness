log_date: '2026-11-24'
summary: Ethiopia's failed rains pushed maize prices to record highs, with IFPRI projecting 905,000 more Ethiopians falling into poverty in 2027. New Utah State University research attributes Utah's exceptionally warm, low-snow winter to conditions that could make similar drought-inducing winters more frequent in coming decades, while drought, frost and warming winters affected Wisconsin's 2026 cranberry harvest. Colorado recorded an increase in invasive mussel-infested watercraft this summer even as drought reduced boating activity, and Oklahoma's energy and livestock sectors helped sustain its economy through 2026 drought conditions, with the latest rankings showing continued dryness around Tulsa County.
