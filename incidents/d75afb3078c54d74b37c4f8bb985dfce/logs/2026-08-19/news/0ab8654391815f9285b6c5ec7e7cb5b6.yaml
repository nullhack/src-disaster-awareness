title: Governor makes firefighting help available statewide - AOL
body: PIERRE, S.D. (KELO) — Continuing drought conditions have led Gov. Larry Rhoden to declare that state aerial firefighting resources will now be able to assist rural fire departments throughout all of South Dakota. The Republican governor announced on Tuesday that he had signed a new executive order declaring that the current drought emergency is extended […]
