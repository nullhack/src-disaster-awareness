log_date: '2026-08-19'
summary: Colorado's drought caused a fish die-off killing 30,000 at St. Vrain State Park and prompted wildlife officials to lift fishing limits at another lake, while drought also drove record bear activity in the state. A new heat dome is building in the western US, worsening drought conditions, and Lake Powell remains at critically low levels (23% full) as satellite images show the shrinking of both Lake Mead and Powell to record lows. Trinidad and Tobago issued drought alerts, while the Netherlands and UK face slow recovery despite forecasted rain, and Idaho is expanding cloud seeding as one of the worst water years on record continues.
