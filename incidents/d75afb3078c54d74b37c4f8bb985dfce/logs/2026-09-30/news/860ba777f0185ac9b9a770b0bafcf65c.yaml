title: Why first monsoon drought in 11 years left India dry, and wet
body: Despite a late burst of heavy rain, the 2026 southwest monsoon is shaping to be India’s driest in 11 years. Last week’s deep depression brought widespread rain to parts of east, northeast, central and north India, cutting the season’s deficit from 15% to around 12% in a span of four-five days.
