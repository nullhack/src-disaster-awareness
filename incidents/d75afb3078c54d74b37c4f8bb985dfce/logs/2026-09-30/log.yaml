log_date: '2026-09-30'
summary: 'New reports show drought persisting across multiple regions: Upper Michigan farmers report reduced grazing for livestock, Manitoba Hydro posted a $446-million loss citing a fourth drought year in five, and pumpkin farmers are adapting to water restrictions. In India, the government cut the 2026-27 foodgrain production target by 2.63 million tonnes over El Niño fears, Maharashtra will assess crop damage at mandal level beyond existing drought lists, and a separate report warns El Niño could bring water shortages and price pressures. Elsewhere, rain is forecast to return to southwest Louisiana, a new global tool now maps drought/flood risk for farmers, and Swiss archaeologists redrew Roman maps after drought exposed new features.'
