log_date: '2026-09-30'
summary: |-
  New reports show drought persisting across multiple regions: Upper Michigan farmers report reduced grazing for livestock, Manitoba Hydro posted a $446-million loss citing a fourth drought year in five, and pumpkin farmers are adapting to water restrictions. In India, the government cut the 2026-27 foodgrain production target by 2.63 million tonnes over El Niño fears, Maharashtra will assess crop damage at mandal level beyond existing drought lists, and a separate report warns El Niño could bring water shortages and price pressures. Elsewhere, rain is forecast to return to southwest Louisiana, a new global tool now maps drought/flood risk for farmers, and Swiss archaeologists redrew Roman maps after drought exposed new features.
  New reports show India declaring drought in five states and adding 43 more tehsils to the drought-hit list, with Maharashtra ordering banks to halt farm loan recovery visits amid the country's first monsoon drought in 11 years. In the U.S., Lake Powell sank to a record 3,517 feet, Denver Water announced fines for violating lawn-watering bans, and Oregon's wild horses face an emergency as drought and wildfires destroy food and water sources. Internationally, a vessel became stuck on the low Rhine River, and a UNICEF report warns El Niño threatens 25 million Latin American children with drought and flood impacts.
