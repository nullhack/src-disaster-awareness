log_date: '2026-09-20'
summary: |-
  New USDA data shows Kansas corn production expected to drop by 39 million bushels in 2026 due to drought. Meanwhile, the International Rescue Committee warns that the historic super El Niño threatens food security in Central America. Colorado pumpkin crops have survived the drought, offering a slight positive note.
  Pope Francis appealed for aid to Somalia, where drought and violence are worsening conditions. In India, Andhra Pradesh officials were ordered to scientifically assess El Niño-driven rainfall deficits and declare drought areas in 513 mandals starting October 1. Karnataka continues to face severe drought, prompting a special legislative session for farmer relief. Meanwhile, a very strong El Niño is expected to persist until February 2027, raising heatwave and food security risks in South Africa.
