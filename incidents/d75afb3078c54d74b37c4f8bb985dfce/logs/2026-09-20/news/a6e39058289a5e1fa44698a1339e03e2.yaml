title: 513 మండలాల్లో కరువు ఛాయలు
body: ఎల్నినో నేపథ్యంలో రాష్ట్రంలో వర్షాభావ పరిస్థితులను శాస్త్రీయంగా అంచనా వేసి, అక్టోబరు 1న కరువు మండలాలను ప్రకటించాలని సీఎం చంద్రబాబు అధికారులను ఆదేశించారు. కరువు మండలాలను గుర్తించడంతో పాటు ఎక్కడా పంట నష్టం జరగకుండా ముందస్తు చర్యలు చేపట్టాలని స్పష్టం చేశారు.
