title: 'Sudan war: First ‘suicide’ drone attacks, now long-range strikes are the norm'
body: Drones and drought are “closing in” on Sudan, the UN Children’s Fund (UNICEF), said on Tuesday, describing unprecedented attacks on the country’s infrastructure including by drones travelling up to 1,500 kilometres before hitting their target.
