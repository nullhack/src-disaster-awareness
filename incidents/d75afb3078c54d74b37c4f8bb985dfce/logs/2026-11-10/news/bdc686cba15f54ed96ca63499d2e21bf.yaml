title: Lake Lanier and other reservoirs get lower; drought operations kick in
body: As unusually dry conditions drag on in Georgia and neighboring states, the U.S. Army Corps of Engineers has begun drought operations affecting dams along the Chattahoochee River, including Buford Dam on Lake Lanier.
