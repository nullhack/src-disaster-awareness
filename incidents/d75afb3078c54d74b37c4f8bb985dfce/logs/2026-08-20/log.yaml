log_date: '2026-08-20'
summary: |-
  New reports detail localized drought impacts: a Maine town challenges Poland Spring’s water extraction; Corpus Christi's emergency reveals flaws in Texas water planning; SW Florida endures its worst drought in 25 years even during rainy season; the UK pushes for its first reservoir in 35 years (Thames Water’s £6.6bn project); California’s broccoli supply is threatened by drought; Rhode Island remains under drought watch with low groundwater; Rapid City, South Dakota, extends water restrictions; Louisiana risks rapid drought onset; and Lake Okeechobee levels drop. A broader CNBC analysis warns of global drought disrupting trade, energy, and inflation.
  New developments include the discovery of human remains at Lake Mead as water levels decline, the Netherlands rethinking water management amidst historic drought, and US reservoirs (Lake Mead and Powell) at record lows. Serbia uncovered a historic boat as Europe's rivers dry further, and Hungary's nuclear plant on the Danube averted shutdown. UK's Severn Trent urged water conservation, and Cape Town reported stable supply but rising risk. Sri Lanka delivered water to 72,000 people amid drought, while Somalia faces a hunger crisis with limited UN aid. Strengthening El Niño projections now reduce Atlantic hurricane forecasts and raise risks for Latin America and Sri Lanka.
