title: Adding mini clover to grass seed creates a green, hardy, drought-tolerant lawn
body: Would you like a lawn that grows well in full sun or part shade, requires little or no watering, chokes out weeds, never needs fertilizer and stays green all summer, even when exposed to dog urine?
