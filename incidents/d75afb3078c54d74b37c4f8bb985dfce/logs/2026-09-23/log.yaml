log_date: '2026-09-23'
summary: A worsening El Niño is threatening Asia with severe drought and potential food price rises. In the U.S., Baltimore will begin blending river water with reservoir supplies due to low levels, while Oklahoma's emergency drought committee allocated up to $12 million in relief after two flash droughts this year. Karnataka, India declared 177 taluks drought-hit in its worst drought in 150 years, and Polk County, Florida extended extreme water restrictions through March. Texas wine grape growers report strong quality despite the tough drought season.
