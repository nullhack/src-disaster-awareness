title: Colorado’s drought leaves a wildlife center caring for more than 30 orphaned bear cubs
body: Nanci Limbach, the founder and executive director of the Pauline S. Schneegas Wildlife Foundation, says this is one of the busiest years for the organization. The facility is caring for nearly three dozen bears while continuing to care for other Colorado wildlife, including foxes, deer and raptors.
