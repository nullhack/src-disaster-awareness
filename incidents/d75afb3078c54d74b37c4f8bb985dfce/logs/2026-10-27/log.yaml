log_date: '2026-10-27'
summary: |-
  In Karnataka, India, Hassan district reports severe drought with crop losses estimated at Rs 724.4 crore. In the U.S., Maine's drought contributed to a record low in combined sewage overflow events, while Moore County, under severe drought, requires burn permits through May.
  New drought mitigation measures in India include a university in Jalgaon cutting festival costs to fund fee waivers for affected students, while Telangana's chief minister plans a Delhi trip to request relief funds. In the United States, Michigan's Upper Peninsula faces elevated wildfire risk due to drought potentially smoldering through winter, and Colorado wildlife facilities are overwhelmed with over 30 orphaned bear cubs. Internationally, Nigeria's NEMA warns of food shortages from the Super El Niño, and the OAS calls on the Americas to prepare for 2027 El Niño-driven drought risks.
