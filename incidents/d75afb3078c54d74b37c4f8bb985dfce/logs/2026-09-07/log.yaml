log_date: '2026-09-07'
summary: Extreme drought now covers 44% of Puerto Rico, triggering continued water rationing and federal disaster declarations. The City of Dumas entered Stage 3 drought restrictions, while Northwest Arkansas faces reduced autumn foliage due to persistent dryness. El Niño reached a record threshold, intensifying drought risks across Latin America, and Europe's drought deepened as Hungary's "Rock of Starvation" resurfaced on the Danube and the Netherlands was criticized for being unprepared for chronic freshwater shortages. A new University of Wyoming study found climate change made the region's record warm, dry winter four times more likely, and drought continues to challenge cattle ranchers with rising pastureland pressures.
