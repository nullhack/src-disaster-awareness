log_date: '2026-08-23'
summary: |-
  New reports detail Amarillo closing splash pads and limiting irrigation due to water shortages, while extreme drought persists across Puerto Rico and the US Virgin Islands with water rationing continuing. Additionally, India's monsoon has weakened, with the IMD predicting below-normal rainfall for the next two weeks, raising drought concerns.
  New drought-related developments include a strengthening El Niño prompting fresh transit limits at the Panama Canal, wildfires in Indonesia's Borneo, a historic boat emerging in Serbia due to low river levels, and a water project approved for drought-hit Andhra Pradesh, India. San Antonio's drought eases but persists, Jamaica faces water shortages, and a bear attack in Colorado is attributed to drought conditions. Warmer waters linked to drought have also increased jellyfish stings on Delaware beaches.
