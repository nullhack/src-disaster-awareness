title: New Mexico’s Largest Reservoir Was Nearly Full. Now It’s at 1.4%
body: New Mexico’s largest reservoir plunged to just 1.4 percent capacity in July 2026, revealing the dramatic impact of prolonged drought and record early snowmelt.
