title: 'From drought to floods in North Africa: What could the super El Niño do next?'
body: Morocco spent most of the last decade drying out. Between 2019 and 2024, the country recorded six consecutive years of below-average rainfall, the longest on record. The 2023–24 hydrological year was the driest in more than six decades, with a national total of just 106.4 mm.
