log_date: '2026-09-03'
summary: New reports warn of a potentially record-strength "super El Niño" that could intensify global drought, with South Africa's weather service saying it may be the strongest in living memory and the WMO confirming a "very strong" event. In the US, New Mexico's Elephant Butte Reservoir plummeted to just 1.4% capacity, drought deepened in northern Mississippi and northwest Wisconsin, and Colorado's Vail Duck Race was forced to move from creek to land due to unprecedented low flows. Meanwhile, Indonesia's peatlands are burning as drought grips the region, and the UK confirmed summer 2026 as its hottest on record, with scientists warning such extreme heat may return every nine years.
