log_date: '2026-08-27'
summary: |-
  The U.S. declared a drought disaster for parts of Puerto Rico amid persistent dry conditions. France relaxed rules for cheese production due to drought-altered cow diets, while Karnataka, India, faces its most severe drought in decades and seeks central aid. In Colorado, Grand Junction urged residents to water street trees, and Tennessee saw drought relief after August rains.
  Drought conditions worsened in South Dakota, with Western Meade County reported in extreme drought according to the latest U.S. Drought Monitor. Panama and El Salvador declared alerts as El Niño intensified, threatening crops, water supplies, and Panama Canal traffic. Additionally, Orange County, Texas, issued a seven-day burn ban due to dry conditions, joining several other counties under similar restrictions.
