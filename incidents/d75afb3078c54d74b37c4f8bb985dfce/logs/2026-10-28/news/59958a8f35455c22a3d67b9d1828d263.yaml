title: Telangana declares drought in 365 mandals; BRS terms GO ‘irresponsible eyewash’
body: The GO directed district authorities to begin relief work immediately, arrange more drinking water, fodder, and cattle camps, and generate employment under VB-G RAM G. They are also asked to urge bankers to restructure farm loans and avoid coercive recovery.
