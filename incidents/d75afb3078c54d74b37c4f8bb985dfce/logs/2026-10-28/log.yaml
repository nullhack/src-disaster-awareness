log_date: '2026-10-28'
summary: Telangana, India declared 365 mandals drought-affected for the 2026 kharif season due to a 17% rainfall deficit, with paddy cultivation declining and the state seeking a relief package. Northern Colorado recorded its highest temperatures and eighth-lowest precipitation in the 2026 water year, while a new OAS report warned of severe El Niño-driven risks to water, food, and power in Latin America and the Caribbean. Additionally, 10 US states set all-time drought records in 2026, and South African sugarcane farmers face growing threats from the El Niño drought.
