log_date: '2026-10-24'
summary: |-
  NOAA and the UN continue to warn that the El Niño event may become the strongest on record, with a high likelihood of persisting into early 2027. Regionally, drought expanded across Michigan and remained entrenched statewide in Maine, while southeastern Virginia escalated from a drought watch to a warning for the first time in at least 16 years. Additional new impacts include extreme drought covering all of Shelby County, Tennessee for the first time since 2007, heightened famine risk in war-torn Sudan, and drought-parched conditions fueling human-set fires with high emissions in New Guinea.
  Colorado's record heat and low snowpack in 2026 worsened severe drought, while the Colorado River Basin's backup water supply is also running out. Sonoco's Q3 earnings were weighed down by drought, and Telangana's chief minister warned of prolonged drought due to El Niño, urging collective action. El Niño-driven drought continues to threaten Panama Canal operations and global trade.
