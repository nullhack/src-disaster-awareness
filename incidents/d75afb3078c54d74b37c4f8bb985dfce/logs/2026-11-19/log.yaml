log_date: '2026-11-19'
summary: Fiji declared a national state of disaster and Tonga declared a state of emergency due to El Niño-driven drought, water shortages, and risks to agriculture, livestock, and public health. In the U.S., Lake Powell dropped dangerously close to a critical threshold with hydropower output at a record low, Durham spent millions to keep water flowing, and an atmospheric river was forecast to hit the drought-affected West. Forecasters also warned that below-normal rainfall could push the Davao Region into drought by March 2027, while North Carolina’s winter weather was described as its best chance to break drought.
