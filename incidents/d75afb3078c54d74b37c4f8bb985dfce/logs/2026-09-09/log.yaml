log_date: '2026-09-09'
summary: 'Drought continues to expand and intensify across multiple US regions: Mid-Missouri sees trees dropping leaves weeks early as drought returns, Charlotte remains under Stage 2 drought despite rain, severe drought is declared in Michigan''s Upper Peninsula, and the Texas Commission on Environmental Quality approved a 120-day pause on water releases into the Nueces Estuary to preserve water supplies. Colorado''s beer industry is now feeling the impact of the prolonged drought, while new reports from Ireland and the UK highlight growing concerns over water security and farmers preparing for more extreme weather swings.'
