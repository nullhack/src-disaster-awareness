title: Drought reaches ‘extreme’ for first time since June in Central Texas
body: The latest U.S. Drought Monitor was released Thursday morning, showing a worsening trend in Central Texas. For the first time since June 2, parts of the region are now in a level 3/4 "extreme" drought...
