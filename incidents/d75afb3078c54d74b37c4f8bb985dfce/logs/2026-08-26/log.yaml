log_date: '2026-08-26'
summary: New drought developments include Bristol Water imposing its first hosepipe ban in 50 years, affecting 1.2 million people, while Czech farmers reduce herds due to feed crop shortages from the summer drought. The Pacific Northwest (Oregon, Idaho, Washington) is experiencing historic drought with dwindling snowpack and record low stream flows exacerbating wildfires. El Salvador and Panama have declared emergencies over El Niño-fueled drought, adding to prior alerts in Honduras and the Caribbean.
