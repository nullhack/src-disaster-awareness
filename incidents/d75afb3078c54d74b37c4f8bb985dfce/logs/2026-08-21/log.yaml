log_date: '2026-08-21'
summary: |-
  Drought conditions continue to worsen globally. The Panama Canal announced reduced shipping due to El Niño-fueled drought, while extreme drought expanded into parts of Minnesota for the first time in three years. In Serbia, the drought on the Sava River revealed a long-lost WWII shipwreck. South Dakota's governor signed an executive order to fast-track wildfire and drought response, and Puerto Rico is implementing mandatory water rationing amid ongoing shortages. While some regions like the Potomac watershed see improvement from recent rains, Texas and other areas remain severely impacted.
  New reports detail the Panama Canal reducing shipping due to El Niño-fueled drought, with further restrictions possible. In the US, extreme drought expanded to northwestern Minnesota, prompting water restrictions in several cities, while Oklahoma City and North Cherokee, Texas enacted tighter mandatory water restrictions. British food firms urged the UK prime minister for cost relief as European droughts raise prices, and Ireland increased advance payments to farmers in response to drought conditions.
