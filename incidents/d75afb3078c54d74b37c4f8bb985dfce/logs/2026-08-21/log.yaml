log_date: '2026-08-21'
summary: Drought conditions continue to worsen globally. The Panama Canal announced reduced shipping due to El Niño-fueled drought, while extreme drought expanded into parts of Minnesota for the first time in three years. In Serbia, the drought on the Sava River revealed a long-lost WWII shipwreck. South Dakota's governor signed an executive order to fast-track wildfire and drought response, and Puerto Rico is implementing mandatory water rationing amid ongoing shortages. While some regions like the Potomac watershed see improvement from recent rains, Texas and other areas remain severely impacted.
