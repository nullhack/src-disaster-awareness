title: Video. Drought on Serbia's Sava River reveals long-lost WWII shipwreck
body: Video. Serbia has seen the remains of a century-old steam tug emerge from the Sava River near Sremska Mitrovica, after prolonged heat and drought drove water levels exceptionally low.
