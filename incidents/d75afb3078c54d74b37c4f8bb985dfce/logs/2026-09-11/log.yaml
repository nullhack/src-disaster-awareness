summary: Weather forecasters report a greater than 90% chance of a very strong El Niño during the Northern Hemisphere fall and winter 2026-27, with a 75% probability of it becoming a historic event surpassing all records. The developing El Niño is already impacting global shipping at the Panama Canal, fish behavior, and heat patterns, and is expected to be the strongest in over a century.
