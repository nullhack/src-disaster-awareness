title: 2026’s El Niño is shaping up to be a doozy – it’s already affecting global shipping, fish behavior and heat
body: El Niño can affect agriculture, marine life and economies in profound ways, including slowing commerce at the Panama Canal. This El Niño is likely to be the strongest in over a century.
