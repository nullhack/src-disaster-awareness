title: 'Drought effect: Noord-Brabant marsh completely dry for the first time in 700 years'
body: Hundreds of dead fish lie on the bone-dry bottom of De Zeezuiper marsh east of Bergen op Zoom after extreme drought left the marsh completely dry for the first time in more than 700 years. Weeronline predicts recovery from the drought could take months.
