log_date: '2026-08-25'
summary: |-
  Nevada is suing the Trump administration to stop drastic Colorado River water cuts, while a new federal plan will hit Arizona hardest, cutting supply to Phoenix and Tucson areas. Amarillo officials aim to avoid first-ever mandatory Stage 2 restrictions, and Dimmitt, Texas has enacted Stage 1 drought measures. Honduras placed 80% of the country on El Niño drought alert as crops fail and livestock perish, and Somalia faces crisis hunger levels with 2 million children malnourished due to drought and funding cuts. Record bear reports surge in Colorado as drought reduces natural food sources.
  Extreme drought in the Everglades sparked a fire over the weekend, with central marshes remaining in unusual extreme drought despite some easing elsewhere in South Florida. In the Netherlands, a 700-year-old marsh near Bergen op Zoom dried completely, leaving hundreds of dead fish, and recovery may take months. The Caribbean Institute of Meteorology and Hydrology warned that intensifying El Niño conditions could bring hotter, drier extremes to the region, urging preparations.
