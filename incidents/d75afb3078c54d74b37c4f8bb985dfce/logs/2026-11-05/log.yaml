log_date: '2026-11-05'
summary: Drought conditions improved in Minnesota and Utah following recent record rainfall, but worsened in North Carolina's Triangle region where parts entered extreme drought and Durham has an estimated 81 days of water remaining. Drought‑related impacts continue, including a surge in bear attacks in Colorado and an extended burn ban in St. Tammany Parish, Louisiana, as a very strong El Niño persists in the tropical Pacific.
