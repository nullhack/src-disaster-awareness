title: Durham has 81 days of water remaining as drought continues, Stage 3 restrictions possible
body: Durham has an estimated 81 days of accessible water remaining as drought conditions persist. With reservoirs at just 31% capacity, the city is relying on additional water sources and could soon implement Stage 3 water restrictions.
