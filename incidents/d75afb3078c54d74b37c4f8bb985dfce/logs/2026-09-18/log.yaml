log_date: '2026-09-18'
summary: Lake Powell dropped to record-low levels due to snow drought and warm temperatures, as a new WMO report highlights global rivers drying up and an increasingly unbalanced water cycle. Drought conditions are worsening across the US (ArkLaTex, Alabama, Texas's Brazos Valley) and England now requires 120% of normal rainfall over seven months to recover. Additionally, India's Andhra Pradesh and Maharashtra face imminent drought declarations, while France's Normandy region reports drought impacts on apples and livestock.
