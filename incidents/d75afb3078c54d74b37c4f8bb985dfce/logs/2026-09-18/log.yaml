log_date: '2026-09-18'
summary: |-
  Lake Powell dropped to record-low levels due to snow drought and warm temperatures, as a new WMO report highlights global rivers drying up and an increasingly unbalanced water cycle. Drought conditions are worsening across the US (ArkLaTex, Alabama, Texas's Brazos Valley) and England now requires 120% of normal rainfall over seven months to recover. Additionally, India's Andhra Pradesh and Maharashtra face imminent drought declarations, while France's Normandy region reports drought impacts on apples and livestock.
  The drought continues to affect new areas: Japan’s Sasebo naval base imposed 5-minute showers due to strained water supply, and the UK reported that 90% of adults are cutting water use amid bans affecting 30 million people. Some relief appeared in Massachusetts (improved from Level 2 to Level 1 drought) and parts of KELOLAND, while Texas remains 93% in drought with rising grocery costs. Zimbabwe relaxed grain import rules due to expected lower harvests from drought, and Colorado’s annual aspen display is expected to be muted by dry conditions.
