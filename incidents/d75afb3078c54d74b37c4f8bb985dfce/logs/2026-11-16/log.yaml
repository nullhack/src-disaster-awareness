log_date: '2026-11-16'
summary: Southern Vietnam is warned it could face a dry season harsher than the historic 2015-16 drought, with extreme heat, worsening water shortages, and severe saltwater intrusion expected in the coming months. In the Philippines, Cordova town is redirecting funds from its annual Christmas village and decoration contest toward water security preparations, while in Karnataka, India, drought has delayed migratory birds' arrival at the Magadi Bird Sanctuary in Gadag district and the Ankasamudra Bird Conservation Reserve. Other coverage is a general El Niño explainer on global heat and grocery bills and a travel piece on Galápagos flooding, neither of which adds new drought-specific information.
