log_date: '2026-09-05'
summary: New reports detail drought-driven vegetable price hikes in Jamaica; an investigation reveals companies secretly using billions of litres of public water in drought-stricken England; and Kansas farmers turn to a new perennial grain as a drought adaptation. Additionally, severe drought expands in Maine, water restrictions are lifted in Hyrum, Utah, Stage 1 drought rules take effect in Corpus Christi, Texas, and drought worsens across Northwest Oklahoma. The Panama Canal also began reducing daily ship crossings due to El Niño-driven drought.
