title: Annual aspen display will likely be dampened by drought
body: Drought-stressed trees are experiencing a multitude of problems across the state The hits just keep on coming. Following one of, if not the worst, snowpack years for the state, Colorado also just officially recorded its hottest summer on record, according to NOAA. This spells bad news for the annual brilliant displays of color dotting landscapes […]
