log_date: '2026-09-14'
summary: New reports detail the Colorado River approaching crisis due to drought and demand, while Nevada broke ground on its first wastewater-to-drinking-water plant as a mitigation measure. Drought conditions eased in Massachusetts and Mexico's Sonora state, but worsened in Indonesia with intensifying peatland fires driven by severe drought and El Niño. Additional impacts include drought-stressed aspen displays in Colorado and a delayed fall foliage season in Michigan due to El Niño.
