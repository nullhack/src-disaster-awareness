title: How would the Amazon react if it dried up? A 25-year-old field study has the answer
body: 'A question hangs in the air while the soil of the planet’s largest tropical rainforest grows increasingly dry: What is the Amazon’s future facing extreme droughts in a warming world? To try to predict the fate of the biome, an ambitious experiment subjected an area of Amazon vegetation in Pará in northern Brazil to severe […]'
