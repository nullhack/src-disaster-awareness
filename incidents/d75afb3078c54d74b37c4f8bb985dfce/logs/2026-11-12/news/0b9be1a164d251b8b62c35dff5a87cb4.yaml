title: Smallholder farmers struggle on El Niño frontline; will the world help?
body: Smallholder farmers across the globe are bracing for, or already feeling, the effects of a historically strong El Niño. This event — forecast to peak in December with lasting impacts deep into 2027 — has brought warnings of shocks to global food prices and food security. The record-breaking 2026-2027 El Niño could drive an additional […]
