log_date: '2026-09-04'
summary: Multiple UN agencies and scientific reports now classify the 2026-27 El Niño as "supersized," potentially the strongest in a millennium, warning it will persist until early 2027 and intensify droughts, floods, and extreme heat worldwide. Regionally, South Florida exited extreme drought after recent rains, while Karnataka, India launched a $28.5 million cloud seeding project, and the USDA designated five Montana counties as drought disaster areas. Droughts worsened in Arkansas, North Carolina, and Sri Lanka, and Colorado reported a massive increase in bear-human incidents due to dry conditions.
