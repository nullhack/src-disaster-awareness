title: Panama Canal says not ruling out new transit restrictions due to El Nino - Jamaica Observer
body: PANAMA CITY, Panama (AFP)—The Panama Canal is not ruling out new restrictions on ship traffic due to a drought exacerbated by the El Nino weather phenomenon, the critical waterway&#039;s new administrator told AFP on Monday. The interoceanic canal -- through which five percent of global maritime trade passes -- has already gradually reduced the maximum number of ships allowed daily from 36 to 32. But Ilya Espino de Marotta, who...
