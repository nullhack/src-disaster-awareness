summary: New reports highlight French wine output at a 30-year low due to heatwaves, and the UN warns El Niño-driven drought could leave 16 million in Latin America without enough food. In the U.S., Dumas, Texas eased water restrictions from Stage 4 to Stage 3, while Maine's drought continues to worsen. The Panama Canal also indicated it may impose new transit restrictions as El Niño persists.
