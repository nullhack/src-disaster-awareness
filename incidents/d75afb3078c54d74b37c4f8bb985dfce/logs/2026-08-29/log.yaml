log_date: '2026-08-29'
summary: New localized developments include a fish protection order limiting water use in British Columbia's Bessette Creek to protect salmon, and the revelation that Colorado's Andrews Glacier is thinning over three feet per year due to heat and drought. England experienced a severe "flash drought" pushing its water network toward breaking point, while the United Nations held talks in Mongolia highlighting drought's spread to previously less vulnerable regions. Drought remains across 31% of Iowa, and a drought disaster was declared for parts of Puerto Rico, consistent with prior reporting.
