log_date: '2026-10-26'
summary: |-
  All of Shelby County, Tennessee, has entered extreme drought for the first time since 2007, while Vermont and New Hampshire saw minor improvements. India's 2026 monsoon recorded a 13% deficit, with southern reservoirs 43% below average, and Ethiopia reported 250,000 hectares of cropland damaged by El Niño drought. El Niño continues to strengthen in the Pacific, raising drought risks for island nations.
  New drought declarations were made in Rajasthan (80 tehsils) and Gujarat (4 districts) in India, while in the US, DeKalb County, Tennessee was upgraded to severe drought, Southcentral Kentucky sees worsening dry conditions with increased fire danger, and Henrico County, Virginia remains under a drought watch. A report highlights that 10 US states have set all-time drought records in 2026, and El Niño threatens to deepen poverty in southern Africa, while Arkansas cattle producers face ongoing drought-driven cost pressures.
