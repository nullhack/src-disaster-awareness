log_date: '2026-10-26'
summary: All of Shelby County, Tennessee, has entered extreme drought for the first time since 2007, while Vermont and New Hampshire saw minor improvements. India's 2026 monsoon recorded a 13% deficit, with southern reservoirs 43% below average, and Ethiopia reported 250,000 hectares of cropland damaged by El Niño drought. El Niño continues to strengthen in the Pacific, raising drought risks for island nations.
