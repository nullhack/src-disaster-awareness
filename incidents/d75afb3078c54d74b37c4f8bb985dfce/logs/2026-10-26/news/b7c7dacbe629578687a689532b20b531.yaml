title: India’s 2026 Monsoon 13% Below Normal; Southern Reservoirs 43% Below Average - FACTLY
body: India received 759.4 mm of rainfall during the June–September 2026 monsoon, 12.6% below its long-period average. East and Northeast India recorded their lowest seasonal rainfall since 1901, while the South Peninsula received 24% less rain than normal. Although extremely heavy rainfall events rebounded to 388, southern reservoirs held 24.76 BCM against a ten-year average of 43.33 BCM.
