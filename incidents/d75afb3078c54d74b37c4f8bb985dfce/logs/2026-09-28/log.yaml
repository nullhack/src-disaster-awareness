log_date: '2026-09-28'
summary: Maharashtra begins crop inspection reports for 265 drought-affected talukas as the chief minister warns of a worsening El Niño threat. A government resolution officially placed these talukas under Trigger-1 drought alert, including 10 in Nashik, with relief measures to follow. Separately, the expansion of data centers in the state has sparked debate over water allocation priorities amid the drought.
