log_date: '2026-09-28'
summary: |-
  Maharashtra begins crop inspection reports for 265 drought-affected talukas as the chief minister warns of a worsening El Niño threat. A government resolution officially placed these talukas under Trigger-1 drought alert, including 10 in Nashik, with relief measures to follow. Separately, the expansion of data centers in the state has sparked debate over water allocation priorities amid the drought.
  Texas recorded its ninth consecutive week of drought expansion, while Oklahoma is in severe shape as flash droughts dry up ponds and heighten wildfire risk. In India, Sharad Pawar demanded loan waivers and cash assistance for drought-affected farmers, and the central government announced it will assess the drought situation in Karnataka and Maharashtra. Meanwhile, drought continues in parts of the northern US, but a dramatic rainfall increase has ended drought in the South Nation Watershed in Canada.
