body: After one of the driest summers in recent memory in 2025, communities across the South Nation Watershed, including Prescott-Russell and SDG, experienced a much wetter summer in 2026, with more frequent rainfall across the region. "Last summer, we were dealing with extremely dry conditions and talking to residents about conserving water, and water availability issues…
