title: IRS extends tax relief for farmers who sold, exchanged livestock because of drought conditions
body: On Tuesday, the Internal Revenue Service announced they have issued guidance that would provide “an extension of tax relief for farmers and ranchers in most states and other regions who sold or exchanged livestock because of drought conditions.”
