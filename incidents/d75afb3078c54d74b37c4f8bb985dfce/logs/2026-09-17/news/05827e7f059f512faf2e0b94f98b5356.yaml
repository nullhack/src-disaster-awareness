title: As drought shrinks Sri Lanka’s water holes, poisoning poses threat to wildlife
body: YALA, Sri Lanka – One early morning in July 2016, six wildlife officers waited in a patch of scrubland close to a small pond in southern Sri Lanka. They had received information that poachers had poisoned the water hole to kill wild animals for meat. A dead deer lay beside the poisoned pool as the […]
