log_date: '2026-09-12'
summary: 'New reports indicate drought worsening in several regions: Norfolk and Virginia Beach issued Condition II drought notifications urging water conservation, while Halifax County, Virginia restricted bulk water hauling due to extreme drought. Benton County, Arkansas reached exceptional drought status for the first time since 2012. In contrast, Amarillo lifted its Stage 1 drought contingency plan. The U.S. Small Business Administration approved disaster loans for eight southeast Colorado counties. Internationally, 218 districts in India face drought-like conditions, and severe drought in Angola is driving communities to migrate to Namibia. Additionally, Idaho and South Dakota report increased human-wildlife conflicts and drying wells, respectively.'
