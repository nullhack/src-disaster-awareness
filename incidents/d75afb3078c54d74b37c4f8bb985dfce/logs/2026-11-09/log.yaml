log_date: '2026-11-09'
summary: |-
  Record rainfall in the U.S. Southwest has brought rare relief to the region's depleted reservoirs, with Lake Powell rising 20 feet after October storms. In Turkey, farmers are adapting to persistent drought as the country prepares to host COP31. Meanwhile, Norfolk, Virginia experienced record flooding that eased rainfall deficits but did not end the drought.
  New drought impacts include Washington state closing rivers to protect salmon, Isabela in the Philippines rolling out drought defenses, and up to 90% crop loss in Tharparkar, Pakistan. Longmont, Colorado delays tree planting, Lake Lanier warns boaters of low water levels, and Texas reports easing drought conditions. Additionally, drought continues to cripple dairy farmers in Maharashtra, India.
