log_date: '2026-09-25'
summary: 'New drought developments include exceptional drought in northern Wisconsin for only the second time on record, nearly 70% of California now abnormally dry, and Cass and Clay counties in ND/MN fully in extreme drought. Drought impacts accelerated an Arkansas lake renovation, triggered tree falls in North Carolina, and are expected to mute Wisconsin''s fall foliage, while Upper Michigan faces ongoing drought and wildfire risk. Some areas saw improvement: rainfall in the KELOLAND region eased dry conditions, and Maharashtra, India announced upcoming drought relief measures.'
