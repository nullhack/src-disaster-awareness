log_date: '2026-10-30'
summary: |-
  New drought developments include worsening conditions in Southeast Louisiana, central North Carolina, and Arkansas, where a burn ban now covers all 56 counties. Maharashtra, India released Rs 90.72 lakh for plantation upkeep in 304 talukas, while Manila Water stepped up drought preparedness in North Luzon, Philippines. Additionally, Utah remains in drought despite above-normal rainfall, and European drought is affecting corporate profits at Rapala VMC and Hidroelectrica.
  Over 90% of Utah remains in drought, though the share in severe or worse conditions fell from 62% to 51% in a single week. Europe's drought is cited as a challenging factor affecting Rapala VMC's Q3 results, while in Telangana, India, environmentalists urged the government to cap groundwater use by hotels after drought was declared in 365 mandals.
