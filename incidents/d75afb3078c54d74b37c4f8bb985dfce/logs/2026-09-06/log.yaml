log_date: '2026-09-06'
summary: Oklahoma City will draw water from Canton Lake to replenish Lake Hefner as extreme drought threatens water supplies. Independence County, Arkansas, was declared a disaster area due to hot and dry conditions, and the state faces extreme wildfire danger. New NOAA data gives 90%+ odds that the 2026 super El Niño will reach historic strength, prompting red alerts in Ecuador and blackout risks in Colombia.
