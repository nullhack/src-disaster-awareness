log_date: '2026-10-06'
summary: Maharashtra, India ordered a 10% water cut from October 16 as 74% of its talukas face drought, while Texas Panhandle exceptional drought persisted for a tenth consecutive week, affecting over 90% of the state. European crop losses from the 2026 drought were confirmed, and extreme drought intensified in northern Wisconsin and Michigan’s Upper Peninsula, with rainfall far below normal. UNICEF warned that over 347 million children are threatened by El Niño-driven drought and related impacts.
