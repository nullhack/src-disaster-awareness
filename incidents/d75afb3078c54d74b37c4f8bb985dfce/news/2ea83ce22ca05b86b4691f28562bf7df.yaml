title: Lawmaker urges mobile water treatment systems for drought-hit villages
body: MANILA, Philippines — Senior Citizens Party-list Rep. Rodolfo Ordanes on Friday urged government agencies and local governments to speed up the deployment of mobile water treatment and desalination systems in communities facing drinking water shortages due to El Niño.
