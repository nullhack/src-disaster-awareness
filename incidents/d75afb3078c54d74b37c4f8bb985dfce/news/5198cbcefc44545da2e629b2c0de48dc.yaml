title: Drought could relocate Aspen’s Snow Polo Championship this winter
body: The St. Regis World Snow Polo Championship host Marc Ganzi sought Aspen City Council input on Monday around the conditions necessary to continue the 2026 iteration of the event in Rio Grande Park mid-December.
