title: Manila Water unit steps up drought preparedness in North Luzon
body: Manila Water Philippine Ventures (MWPV) is strengthening water supply infrastructure in Pangasinan and Isabela to minimize service disruptions as dry conditions threaten parts of North Luzon through the remainder of 2026 and into early 2027.
