title: Northern Colorado’s record heat, drought could give way to El Niño relief
body: From October 2025 through September 2026, average temperatures were more than 2 degrees higher than in the previous warmest year on record, while precipitation totals ranked as the eighth lowest since recordkeeping began in 1895.
