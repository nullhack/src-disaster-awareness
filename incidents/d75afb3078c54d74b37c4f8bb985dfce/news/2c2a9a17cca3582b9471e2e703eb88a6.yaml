title: August brought near-record heat and drought conditions to Colorado Springs
body: Despite occasional showers and thunderstorms over the past two weeks, Colorado Springs had one of the hottest and driest summer months in recent memory, according to the National Weather Service in Pueblo. The average temperature for the month was 73.8 degrees – nearly four degrees warmer than normal – making it the fourth-warmest August since […]
