title: Municipalities consider lifting water bans as drought ends in Connecticut River Valley - Daily Hampshire Gazette
body: Municipalities in the region are considering lifting restrictions on outdoor water use now that the state has declared the Connecticut River Valley is no longer in a drought. Energy and Environmental Affairs Secretary Rebecca Tepper moved the region from a mild drought into normal conditions on Oct. 9 based on rainfall figures through August. According […]
