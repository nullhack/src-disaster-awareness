title: Meet the 13-year-old building a ‘moisture farm’ to fight drought with water from air
body: At 13, Aniket Sarkar has built a low-cost prototype that pulls moisture from the air and turns it into water for crops. His “moisture farming” project uses copper coils, cold water and a fan, with a bigger vision of helping drought-hit farms adapt to a changing climate across dry farms.
