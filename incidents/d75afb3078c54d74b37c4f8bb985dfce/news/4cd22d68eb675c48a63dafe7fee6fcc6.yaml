title: Prolonged drought may be worsening damage to Medieval churches in the Netherlands
body: Medieval churches in Groningen may be suffering deterioration caused by drought on top of the earthquake damage, NOS reports. This was concluded by climate and soil experts in an exploratory study commissioned by the Province of Groningen and Stichting Oude Groninger Kerken.
