title: PlantArcBio's Yield Increasing and Drought-Tolerance Genes Deliver Stronger Yields in First Open-Field Corn Trial
body: 'PlantArcBio (PAB), an Israeli ag-biotech company specializing in gene discovery for row crops, has reported strong results from its first open-field corn trial: plots carrying its lead drought-tolerance genes produced more than double the cob weight of untransformed controls, under both standard irrigation and severe drought.'
