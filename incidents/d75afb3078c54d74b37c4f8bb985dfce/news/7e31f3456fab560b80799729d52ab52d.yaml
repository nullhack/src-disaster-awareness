title: Desperate for water, Idaho looks to cloud seeding for a boost - East Idaho News
body: 'EDITOR’S NOTE: “From the Field” is a weekly feature bringing you the latest agriculture news in eastern Idaho. IDAHO FALLS – Amid one of the worst water years on record, the Idaho Water Resource Board is looking to expand its cloud seeding program. A partnership between the IWRB, Idaho Power and water users from four […]'
