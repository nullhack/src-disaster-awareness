title: Guatemala Power Emergency Is Still Only Under Review as Drought Cuts Hydropower to 22.2% of Supply, Energy Minister Says on 22 September 2026
body: No Guatemala power emergency has been declared yet. Drought cut hydropower to 22.2% of supply on 18 September, from about 62% a year earlier.
