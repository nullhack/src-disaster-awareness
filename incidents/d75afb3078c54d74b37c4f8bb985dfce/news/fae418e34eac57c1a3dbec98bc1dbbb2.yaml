title: Seeing drought impacts, city asks residents to keep watering trees
body: A Grand Junction survey found hundreds of street trees at risk of under-watering during severe drought conditions. City officials urge residents to irrigate city-owned trees on planting strips to protect neighborhood shade and canopy benefits.
