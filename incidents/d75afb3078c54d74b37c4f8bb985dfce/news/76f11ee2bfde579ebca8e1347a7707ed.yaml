title: 'Market Bag: Sweet pepper hits $600, lettuce $1k as drought sends prices higher - Jamaica Observer'
body: KINGSTON, Jamaica — Shoppers at local markets could see higher prices over the next few weeks as vendors report growing shortages of agricultural produce due to drought conditions affecting the island. According to vendors, several items have become increasingly difficult to source, including Irish potatoes, now selling for $350 per pound; sweet potatoes at $250; pumpkins at $300; and lettuce at $1,000. Carrots, priced at $400 per pound, and sweet...
