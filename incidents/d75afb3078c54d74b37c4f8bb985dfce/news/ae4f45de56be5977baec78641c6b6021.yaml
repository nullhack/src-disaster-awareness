title: Drought conditions ease in N. Va. after ‘sustained’ rain, state says | FFXnow
body: The second half of September at last doused Northern Virginia in enough rain to ease the drought that the region has faced for months. The drought warning advisory in place for Fairfax County and the rest of Northern Virginia since January has de-escalated to a drought watch, the Virginia Department of Environmental Quality (DEQ) announced
