title: Declare Gadag taluk drought-hit or will quit as MLA, says HK Patil
body: 'GADAG: Former minister and Gadag MLA HK Patil on Sunday warned that he will resign from his Assembly seat if Gadag taluk is not declared drought-hit by October'
