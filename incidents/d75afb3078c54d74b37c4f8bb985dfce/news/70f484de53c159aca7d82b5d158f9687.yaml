title: ND livestock relief program funds 470 projects as most of state remains in drought
body: <p>(Sept. 21, 2026) – The Drought Disaster Livestock Relief program has exhausted its $4.1 million in funding roughly a month after it was activated by an executive order from North Dakota’s governor.</p>
