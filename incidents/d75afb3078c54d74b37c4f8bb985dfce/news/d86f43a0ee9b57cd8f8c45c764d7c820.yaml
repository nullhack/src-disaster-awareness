title: Netherlands years behind in managing fresh water shortage
body: The Netherlands is years behind in preparing for chronic freshwater shortages, the National Court of Audit said Thursday. It warned that delayed projects, ballooning costs, and weak political direction are leaving farms, shipping, industry, nature, and drinking-water supplies increasingly exposed.
