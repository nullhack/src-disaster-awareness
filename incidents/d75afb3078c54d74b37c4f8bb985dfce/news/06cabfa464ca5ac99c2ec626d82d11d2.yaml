title: Denver Water has issued $30,000 in fines and 2,000 warnings as it’s tried to reduce water use
body: Denver Water aimed to reduce customers’ use by 20%, but they’ve fallen short. “By and large, our customers put in a serious effort to save water, and that puts us in a good position for next year.”
