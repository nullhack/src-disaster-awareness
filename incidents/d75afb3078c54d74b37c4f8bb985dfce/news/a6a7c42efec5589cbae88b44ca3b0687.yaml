title: At 64, Wyoming Drought Forced Him to Sell 40 Breeding Cows. Social Security Didn’t Count the Gain Against His Earnings Limit
body: When Wyoming drought forces a rancher to unload his breeding herd at auction, the size of that check can look alarming to someone already collecting Social Security at 64. Whether the agency counts any of it against his earnings limit comes down to a distinction most ranchers never think about until it is too late.
