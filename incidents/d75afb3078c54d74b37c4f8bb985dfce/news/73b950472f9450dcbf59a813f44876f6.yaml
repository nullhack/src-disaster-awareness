title: Fall arrives reluctantly as drought grips Denton County - Cross Timbers Gazette | Southern Denton County | Flower Mound | News
body: October finally gave summer-scorched North Texas an inkling of what fall was supposed to feel like, but only reluctantly. The first four days of the month brought nearly an inch of rain — 0.92 inches (some areas in southern Denton County received much more). It was the first significant precipitation in 76 days of unrelenting […]
