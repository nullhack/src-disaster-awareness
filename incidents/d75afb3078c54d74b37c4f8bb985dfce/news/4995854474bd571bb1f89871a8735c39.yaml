title: Fire, drought leave the Everglades on alert
body: As fire burned through parts of Everglades National Park over the weekend, extreme drought conditions continue to grip the wetlands. More than three months into the rainy season, this year’s withering drought has slightly eased for other parts of South Florida. But central Everglades marshes, where the fires ignited, remain in unusual extreme drought conditions.
