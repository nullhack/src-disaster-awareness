title: Global water report reveals drying rivers and erratic swings between too little and too much
body: Rivers across the globe in 2025 had one of the driest years in more than three decades, according to a new report from the World Meteorological Organization (WMO). It shows a continuation of the long-term decline in Earth's freshwater storage and glacier retreat—trends with serious implications for people and economies in the future.
