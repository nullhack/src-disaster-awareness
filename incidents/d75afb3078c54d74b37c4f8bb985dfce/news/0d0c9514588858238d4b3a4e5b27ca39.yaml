title: Report indicates water, food and power at risk by strong El Niño
body: Rainfall reductions of up to 80% and torrential precipitation leading to severe flooding and landslides are the expected consequences across different areas of Latin America and the Caribbean from the impact of the El Niño phenomenon in 2027, according to a report co-authored by the General Secretariat of the Organization of American States (OAS), which urges member states to strengthen prevention and preparedness during the final months of 2026.
