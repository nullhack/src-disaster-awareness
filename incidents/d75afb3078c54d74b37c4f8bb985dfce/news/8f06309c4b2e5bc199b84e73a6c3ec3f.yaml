title: 'Karnataka Drought Crisis: Failed Crops, Debt Surge and Push for Central Aid'
body: A severe drought crisis in Karnataka has triggered a deepening agrarian emergency, leaving farmers burdened with mounting debt following crop failures. In Tumakuru and Dharwad districts, deficit rainfall has devastated yields of tomatoes, flowers, ragi, and jowar across lakhs of hectares. With 217 out of 240 taluks declared drought-affected, the Karnataka government has estimated agricultural losses at over 46,000 crore rupees and sought more than 7,000 crore rupees in central drought relief. A central team has begun a ground assessment of the situation, while local farmers describe the declared 2,500 rupees per acre subsidy as insufficient to recover heavy investment losses.
