title: In Honduras, hard hit by drought, authorities hope to make it rain using contentious tactic
body: Global warming is making the El Niño weather pattern stronger, and that’s prolonging a devastating drought across a region of Central America known as the Dry Corridor. Now so many crops have died that farmers are depending on supplies from the World Food Program, and the government of Honduras is trying a controversial climate-mitigation tactic known as cloud seeding. It’s paid $750,000 for 20 flights to trigger rainfall over parched farmland by spraying silver iodide particles into the sky. Honduras is also fortifying existing irrigation systems, building water reservoirs, and distributing food, fertilizer and seeds to help subsistence farming communities survive.
