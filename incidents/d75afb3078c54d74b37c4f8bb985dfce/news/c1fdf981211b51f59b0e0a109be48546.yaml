title: Telangana declares 365 mandals drought-affected for Vanakalam 2026
body: Telangana has declared 365 mandals across 31 districts drought-affected for Vanakalam 2026. The State recorded a 17 per cent rainfall deficit, while paddy cultivation and crop area declined. The Assembly has sought central assistance, additional employment and a Rs. 20,000-crore relief package
