title: Expected rain will provide limited drought relief, but recovery could take months
body: The rain expected to fall in the coming weeks will provide the Netherlands with a limited amount of relief from the lengthy drought. A full recovery from low water levels will likely take months, said Dutch infrastructure agency Rijkswaterstaat in a weekly analysis of drought conditions.Due to the rain expected in the coming weeks, water discharge in the Meuse and Rhine Rivers appears set to rise again. The drop in water levels at the IJsselmeer and Markermeer lakes are expected to stabilize next week.
