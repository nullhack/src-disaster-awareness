title: Zimbabwe Relaxes Grain Import Regulations Amid Drought Fears, Lower Harvest Forecast
body: Zimbabwe is preparing to reopen grain imports amid expectations of a lower harvest in the 2026/2027 agricultural season, with authorities warning of possible drought conditions.The move comes just months after the government reduced grain imports following an improvement in domestic production.
