title: Drought hit Pueblo farmers this year, but the chiles are still ready for roasting
body: 'One silver lining for a difficult year in some of Colorado’s most dynamic farmland: A dry, hot year makes for some scorching chiles. “Lack of water always makes a hotter chile,” said Carla Houghton of Mauro Farms and Bakery. This time of year is the Pueblo Chile’s smoky crescendo. Thousands are gathering this weekend at […]'
