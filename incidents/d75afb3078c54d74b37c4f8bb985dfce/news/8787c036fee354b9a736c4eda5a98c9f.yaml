title: Region’s drought worsens as El Nino may be intense
body: IRON MOUNTAIN — Drought conditions have turned extreme in northern Wisconsin and bordering Upper Peninsula communities, including Iron Mountain-Kingsford. Rainfall has measured far below average since July at the Iron Mountain-Kingsford Wastewater Treatment Plant observation site. A mere 1.06 inches of rain fell locally during September, which was more than 2.5 inches below normal, according […]
