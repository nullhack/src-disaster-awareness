title: 'El Niño 2026/2027: A Strong El Niño with the potential to become the strongest on record - UTUSAN SARAWAK'
body: THE last time I wrote about the development of the 2026/2027 El Niño was on 14 June 2026, three days after the Climate Prediction Center of the United States National Oceanic and Atmospheric Administration (NOAA) officially declared the onset of the phenomenon. Nearly three months have now passed. The 2026/2027 El Niño has completed its […]
