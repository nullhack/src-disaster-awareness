title: Record-breaking rains in Ecuador threaten global cocoa supplies — Bloomberg
body: Global cocoa supplies are at risk due to record-breaking rains in Ecuador caused by the El Niño phenomenon. The natural disaster could destroy some of the country's plantations and lead to higher chocolate prices on the global market.
