title: Video. Hungary’s lakes and rivers hit record lows as severe drought deepens
body: Video. Hungary is facing a severe water crisis, with prolonged heat and drought driving water levels sharply lower. Around 99% of the country is under severe or extreme drought, while desertification threatens the Great Hungarian Plain.
