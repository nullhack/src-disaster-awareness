title: 'Report on global water resources: Worldwide continents are drying up'
body: The global water cycle is becoming increasingly unbalanced. Extreme droughts and floods are the result. This is shown in this year's report by the World Meteorological Organization (WMO) on the state of global water resources, "State of Global Water Resources 2025," which was published today.
