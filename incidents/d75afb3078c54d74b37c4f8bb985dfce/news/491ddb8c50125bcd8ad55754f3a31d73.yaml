title: Reducing Indonesia wildfires will be challenging as El Niño peaks this month, minister warns - BusinessWorld Online
body: JAKARTA — Efforts to reduce wildfires ablaze across Indonesia will be challenging as the El Niño weather phenomenon will peak this month, the forestry minister said on Tuesday, describing the devastation as largely man-made. Indonesia has intensified efforts to contain haze from forest and land fires across six provinces in Borneo and Sumatra islands. The […]
