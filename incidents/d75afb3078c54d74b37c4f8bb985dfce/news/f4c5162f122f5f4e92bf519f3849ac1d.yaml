title: Strengthening ‘Super El Niño’ Forces Cut To Atlantic Hurricane Projections - AOL
body: AccuWeather meteorologists have lowered their 2026 Atlantic hurricane season forecast as a rapidly strengthening El Niño creates unfavorable atmospheric conditions for tropical storms. Forecasters now expect 8 to 11 named storms, 3 to 4 hurricanes, and 1 to 2 major hurricanes for the season.
