title: Low interest disaster loans open for drought-affected Colorado counties
body: The U.S. Small Business Administration on Friday approved disaster assistance loans for eight southeast Colorado counties affected by ongoing drought conditions starting on July 7. Small businesses and private nonprofits in El Paso, Teller, Fremont, Douglas, Elbert, Pueblo, Crowley and Lincoln counties can apply, according to the SBA. The loans, with interest rates as low […]
