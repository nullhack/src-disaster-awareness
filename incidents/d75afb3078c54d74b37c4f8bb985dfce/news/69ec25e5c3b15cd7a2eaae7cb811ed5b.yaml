title: Caribbean urged to prepare for hotter, drier conditions as El Nino intensifies - Jamaica Observer
body: BRIDGETOWN, Barbados — Governments, businesses, farmers and households across the Caribbean are being urged to step up preparations for potentially severe climate extremes as El Niño strengthens and threatens to intensify the hot and dry conditions already affecting parts of the region. In a news release on Tuesday, the Caribbean Institute of Meteorology and Hydrology (CIMH) and the University of the West Indies Climate Studies Group Mona (UWI CSGM) warned...
