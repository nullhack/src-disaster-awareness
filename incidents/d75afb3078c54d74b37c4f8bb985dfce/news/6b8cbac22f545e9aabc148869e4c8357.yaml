title: 'Jalgaon: KBCNMU To Cut Yuvarang 2026 Expenses, Use Savings To Support Drought-Hit Students'
body: The university typically spends around ₹55 lakh on the festival. This year, however, it plans to minimise expenditure and utilise the savings to provide fee concessions to students from drought-affected regions. The university has stated that this year's Yuvarang will go beyond being a cultural festival and become an initiative rooted in social commitment
