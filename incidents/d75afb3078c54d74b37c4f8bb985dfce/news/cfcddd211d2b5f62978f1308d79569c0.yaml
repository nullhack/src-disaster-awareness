title: Minor drought improvements in Vt. and N.H., but winter promises broader relief
body: Drought conditions improved across Vermont and New Hampshire in the latest U.S. Drought Monitor, with moderate drought coverage dropping to 14% in Vermont and 33% in New Hampshire. A wetter winter pattern could bring continued relief, though severe and extreme drought in Maine will likely linger.
