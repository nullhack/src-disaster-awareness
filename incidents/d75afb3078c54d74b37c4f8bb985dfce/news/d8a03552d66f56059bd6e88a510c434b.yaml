title: Angolan communities return to seasonal migration amid severe drought
body: Several years of severe drought are forcing people to leave their homes in Angola to search for water and food in neighboring Namibia. “There is real hunger and thirst here; that’s why the village has become depopulated,” Nghikembua (not his real name), who lives in Cunene Province in southern Angola, told Amnesty International in 2021. […]
