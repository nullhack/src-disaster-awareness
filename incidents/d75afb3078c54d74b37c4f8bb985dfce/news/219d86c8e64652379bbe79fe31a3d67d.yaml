title: Keep enough maize for your families, drought is coming - HH
body: PRESIDENT Hakainde Hichilema has urged Zambians to preserve enough maize for household consumption in view of the projected drought. And President Hichilema has pledged to donate a pontoon to the people of Nyimba in Bweengwa, Monze District, to ease movement for communities living along the Kafue
