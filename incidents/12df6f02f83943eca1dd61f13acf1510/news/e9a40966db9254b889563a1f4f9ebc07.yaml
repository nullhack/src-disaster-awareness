title: Magnitude 8.7 earthquake hits Russia's Kamchatka Peninsula, tsunami warning in US, Japan
body: A powerful 8.0-magnitude quake struck off Russia’s Kamchatka Peninsula late Tuesday, triggering tsunami advisories in Japan and the US. The quake’s epicenter was 136 km east of Petropavlovsk at a depth of 19 km. No damage reported yet; Japan warned of waves up to 1 meter.
