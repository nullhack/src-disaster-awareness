  Response: <p><span style="background-color:transparent;color:#3c4245;font-family:'Noto Sans', Arial, Helvetica, sans-serif;font-size:16px;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">The Kingdom of Saudi Arabia has incorporated MERS-CoV testing into sentinel surveillance algorithms, with testing conducted among patients who test negative for influenza and SARS-CoV-2. This approach aims to improve case detection given the overlapping clinical presentation of MERS, COVID-19, influenza and other respiratory infections. Additionally, IPC practices have improved considerably since 2012, implementing regular training for health and care workers, IPC programmes in health facilities and at national level and improving IPC practices in healthcare settings.</span></p><p>National health authorities continue to promote public awareness and risk reduction measures, particularly regarding zoonotic transmission from dromedary camels. Recommended
    measures include regular hand hygiene before and after animal contact, avoiding contact with sick animals, avoiding consumption of raw camel milk, camel urine, and undercooked camel meat, and seeking medical care when respiratory symptoms develop. The Ministry of Health also continues to promote respiratory hygiene measures, including covering coughs and sneezes, avoiding close contact with ill individuals, and maintaining good respiratory hygiene. In parallel, coordination has been established between the Public Health Authority and the National Center for the Prevention and Control of Plant Pests and Animal Diseases. Appropriate control measures have been implemented for involved camels in accordance with animal health recommendations.</p><p>Contact tracing has been conducted for all confirmed cases; no secondary cases have been identified to date. Enhanced infection prevention and control (IPC) measures remain in place at healthcare facilities. Health and care workers who are exposed
    before patients are isolated or identified as being infectious, were followed up and no secondary cases have been reported in healthcare facilities as a result of these cases.</p><p>&nbsp;</p>
