  Title: Middle East respiratory syndrome coronavirus - Kingdom of Saudi Arabia
  Epidemiology: <p>Middle East respiratory syndrome (MERS) is a respiratory illness caused by a coronavirus (MERS-CoV). The fatality rate among confirmed cases is around 36%, though this may be an overestimate since milder cases often go undetected. The CFR is calculated based solely on laboratory-confirmed infections, which may not reflect the correct mortality rate.</p><p>Humans contract MERS-CoV through direct or indirect contact with dromedary camels, the virus&rsquo;s natural host and zoonotic reservoir. Human-to-human transmission is possible and occurs predominantly among close contacts (family and household members) and in health-care settings (health-care workers and among patients). The largest outbreaks occurred in health-care facilities in the Republic of Korea, Saudi Arabia, and the United Arab Emirates. Outside these environments, there has been limited documented human-to-human transmission to date.</p><p>MERS can present with no symptoms, mild respiratory issues, or severe
    illness leading to acute respiratory distress and death. Common symptoms include fever, cough, and breathing difficulties, with pneumonia frequently observed, though not always present. Some patients also experience gastrointestinal symptoms such as diarrhoea. Severe cases may require intensive care, including mechanical ventilation. Those at higher risk of severe outcomes include older adults, individuals with weakened immune systems, and those with chronic conditions like diabetes, kidney disease, cancer, or lung disorders.</p><p>No vaccine or specific treatment is currently available, although several MERS-CoV-specific vaccines and therapeutics are in development. Treatment remains supportive, focusing on managing symptoms based on the severity of the illness.</p>
  Advice: "<p>Based on the current\r\nsituation and available information, WHO re-emphasizes the importance of\r\nmaintaining strong surveillance for acute respiratory infections in all Member\r\nStates. Where warranted by the epidemiological context, MERS-CoV should be\r\nincluded in the testing algorithm and included in differential diagnosis for\r\npatients presenting with acute respiratory illness and reporting history of\r\ntravel to affected areas, and any unusual patterns of respiratory illness or\r\nsevere acute respiratory infections should be carefully reviewed.<o:p></o:p></p><p>Human-to-human\r\ntransmission of MERS-CoV in healthcare settings has been associated with delays\r\nin recognizing acute respiratory symptoms of MERS-CoV infection as they are\r\noften non-specific and similar to other respiratory illnesses, leading to\r\ndelayed triage of suspected cases and delayed implementation of IPC measures &mdash;\r\nboth critical to prevent the spread of MERS-CoV in healthcare\
    \ facilities and if\r\nleft unmanaged have led to large healthcare outbreaks (example of the Republic of Korea\r\nin 2015). Health and care workers should consistently apply standard\r\nprecautions for all patients at every interaction in healthcare settings. In\r\naddition, transmission-based precautions should be implemented when caring for\r\npatients with symptoms of acute respiratory infection who are suspected of\r\nhaving a viral infection, including suspected, probable or confirmed MERS-CoV\r\ninfection. Contact and droplet precautions should be applied, while airborne\r\nprecautions should be implemented when performing aerosol-generating\r\nprocedures. Early identification, case management and prompt isolation of\r\ncases, contact tracing, together with appropriate IPC measures in healthcare\r\nsettings and public health awareness, can reduce the risk of human-to-human\r\ntransmission of MERS-CoV.<o:p></o:p></p><p>MERS-CoV appears to\r\ncause more severe disease in people with\
    \ underlying chronic medical conditions\r\nsuch as diabetes, renal failure, chronic lung disease and in immunocompromised\r\npersons. Therefore, people with these underlying medical conditions should avoid\r\nclose contact with dromedary camels or their products, particularly when\r\nvisiting farms, markets, barns or other areas where the virus may be\r\ncirculating.<o:p></o:p></p><p>General hygiene\r\nmeasures should be followed when interacting with animals or animal products,\r\nincluding regular hand washing before and after touching animals and avoiding\r\ncontact with sick animals.<o:p></o:p></p><p>Appropriate food\r\nhygiene should be observed when handling or consuming camel products. People\r\nshould avoid drinking raw camel milk or camel urine or consuming meat that has\r\nnot been properly cooked.<o:p></o:p></p><p>WHO does not advise\r\nspecial screening at points of entry in relation to this event, nor does it\r\ncurrently recommend the application of any travel or trade\
    \ restrictions.&nbsp;</p>"
  Assessment: <p>MERS is a zoonotic viral respiratory disease caused by MERS-CoV, for which dromedary camels serve as the primary animal reservoir. Human infection can range from asymptomatic or mild illness to severe disease and death. Human infections continue to occur through direct or indirect exposure to infected dromedaries or their products, while limited human-to-human transmission has been documented, primarily among close contacts and in healthcare settings. Sustained community transmission has not been observed. No licensed vaccine for MERS-CoV exists to date.</p><p>As of 5 October 2026, WHO had been notified of 2643 laboratory-confirmed MERS cases globally, including 965 deaths, since the virus was first identified in 2012. The majority of cases (84%; 2232 cases and 870 deaths) have been reported from Saudi Arabia. These figures likely underestimate the true number of infections since mild and asymptomatic cases may remain undetected/unreported, while the reported case fatality
    of ratio of 37% may overestimate mortality among infections.</p><p>Although the number of reported MERS cases has declined substantially since 2020, MERS-CoV continues to circulate in dromedary camel populations in the Middle East and African regions and continues to cause sporadic human infections. The observed decline in reported MERS cases, in particular during the COVID-19 pandemic emergency phase, is thought to be a result of pandemic-related IPC measures that also limited human-to-human transmission of MERS-CoV, as well as behavioral changes during the pandemic. Any role of potential cross-reactive immunity from SARS-CoV-2 infection and/ or vaccination remains in need of further investigation. Other hypotheses&mdash;such as reduced surveillance, viral attenuation, or decreased circulation in camel populations&mdash;are not supported by current evidence.</p><p>WHO expects additional sporadic MERS cases to occur in countries where the virus circulates in camels and anticipates that
    travel-associated exportation of cases will continue. Delays in detection remain possible due to the clinical presentation of MERS being similar with other respiratory infections, including influenza and COVID-19. Numerous outbreaks <a href="https://www.who.int/emergencies/disease-outbreak-news/item/12-june-2015-mers-korea-en">in KSA and the Republic of Korea</a> have demonstrated that primary cases can result in substantial secondary transmission, particularly in healthcare settings and through importation of travel related cases.</p><p>The notification of the recent cases in Saudi Arabia does not change WHO's overall risk assessment - &nbsp;the risk remains moderate at both the regional and global levels, reflecting the continued occurrence of sporadic zoonotic infections, the potential for healthcare-associated outbreaks and international exportation of cases, in the absence of sustained human-to-human transmission. </p><p>WHO continues to monitor the epidemiological situation through
    routine surveillance and reporting under the International Health Regulations (IHR 2005) and conducts ongoing risk assessments using available epidemiological and virological information.</p>
  Overview: '<p>Between 1 January and 5 October 2026, a total of eight cases of MERS-CoV, including one death, was reported from six locations in the Kingdom of Saudi Arabia. Of the eight reported cases, five occurred among persons aged 70 years and older, two among adults aged 50&ndash;59 years, and one among an adult aged 30&ndash;39 years. Seven cases had underlying comorbidities, two reported direct camel contact, and one death was reported in an older adult (&gt;65 year old) with comorbidities. There was no known epidemiological link identified among cases. </p><p><strong>Case 1: </strong>A male aged 50&ndash;59 years, with comorbidities, from Al Jouf developed symptoms on 14 March 2026. He reported no known contact with camels or camel products. The patient was hospitalized on 17 March and laboratory confirmation of MERS-CoV infection was obtained by RT-PCR on 19 March.<strong> </strong><strong></strong></p><p><strong>Case 2: </strong>A male aged &ge;70 years, with comorbidities, from
    Taif developed symptoms on 18 April 2026. He reported no known contact with camels or camel products. The patient was hospitalized on the same day, and laboratory confirmation was obtained on 22 April. He subsequently died as a result of the illness.<strong></strong></p><p><strong>Case 3:</strong><strong> </strong>A male aged &ge;70 years, with comorbidities, from Hafr Al-Batin developed symptoms on 20 May 2026. He reported direct contact with camels. The patient was hospitalized on 26 May and laboratory confirmation was obtained on 27 May.<strong> </strong></p><p><strong>Case 4:</strong> A female aged &ge;70 years, <strong>with comorbidities,</strong> from Riyadh developed symptoms on 31 July 2026. No known exposure to camels or camel products was reported. She was hospitalized on 3 August and laboratory confirmation was obtained on 8 August. <strong></strong></p><p><strong>Case 5:</strong> A male aged 50&ndash;59 years, <strong>with comorbidities,</strong> from Tabuk developed symptoms
    on 20 August 2026. He reported no known contact with camels or camel products. He was hospitalized on 23 August and laboratory confirmation was obtained by RT-PCR on 24 August. </p><p><strong>Case 6:</strong>&nbsp;A male aged 30&ndash;39 years, with no known comorbidities, from Riyadh developed symptoms on 14 August 2026. He reported no known contact with camels or camel products. He was hospitalized on 20 August and laboratory confirmation was obtained on 23 August. </p><p><strong>Case 7:</strong> A male aged &ge;70 years, <strong>with comorbidities,</strong> from Taif developed symptoms on 11 September 2026. He reported no known contact with camels or camel products. He was hospitalized on 17 September and laboratory confirmation was obtained on 19 September. </p><p><strong>Case 8:</strong> A male aged 60&ndash;69 years, <strong>with comorbidities,</strong> from Arar developed symptoms on 20 September 2026. He reported direct contact with camels. He was hospitalized on 20 September
    and laboratory confirmation was obtained on 21 September.&nbsp;<br /></p>'
