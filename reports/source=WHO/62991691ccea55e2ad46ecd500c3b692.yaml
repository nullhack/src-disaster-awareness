  Title: Circulating vaccine-derived poliovirus type 1 – Syrian Arab Republic
  Epidemiology: <p>Poliomyelitis is a highly infectious viral disease that mainly affects children under five years of age. The virus is transmitted mainly through the faecal-oral route and multiplies in the intestine, from where it can invade the nervous system and cause paralysis.</p><p>Most poliovirus infections are asymptomatic. In a small proportion of infections, the virus causes irreversible paralysis. Among people who develop paralysis, 5&ndash;10% die when their breathing muscles become immobilized.</p><p>Vaccine-derived polioviruses can emerge when the weakened poliovirus contained in OPV circulates for a prolonged period in populations with insufficient immunity. During circulation, the virus can undergo genetic changes and regain the capacity to cause paralysis. Maintaining high population immunity through vaccination is essential to prevent the emergence and spread of vaccine-derived polioviruses and to interrupt poliovirus transmission.</p><p>A vaccine-derived poliovirus is
    classified as circulating when there is evidence of person-to-person transmission in the community according to established epidemiological and genetic criteria. Genetic analysis has confirmed that the VDPV1 isolates detected in the Syrian Arab Republic are genetically linked, confirming a new cVDPV1 emergence.&nbsp;</p>
  Advice: <p>Polio vaccines are safe and effective, and multiple doses provide lifelong protection against poliomyelitis. WHO recommends that all countries achieve and sustain high routine immunization coverage at the district level to support global polio eradication and minimize the consequences of any poliovirus introduction.</p><p>Population groups and geographical areas with low poliovirus immunity should be prioritized for targeted vaccination interventions. In affected and neighbouring areas, response activities should identify and vaccinate children who are unvaccinated or incompletely vaccinated, including those missed during previous vaccination activities, while strengthening routine immunization services.</p><p>WHO recommends maintaining sensitive AFP and environmental surveillance to rapidly detect additional poliovirus transmission. All AFP cases should be promptly notified and investigated, and appropriate specimens should be collected and transported in accordance with established
    polio surveillance procedures.</p><p>WHO advises all travellers to areas affected by poliovirus transmission, as well as residents of those areas, to be fully vaccinated against poliomyelitis in accordance with national immunization schedules and the applicable Temporary Recommendations issued under the IHR (2005).</p><p>As advised by the Emergency Committee convened under the IHR (2005), efforts to limit the international spread of poliovirus remain classified as a PHEIC. Measures applicable to the Syrian Arab Republic should be aligned with the country&rsquo;s classification under the current Temporary Recommendations.</p><p>Based on the currently available information, WHO advises against any restriction on travel to, or trade with, States Parties experiencing or responding to the public health event.</p>
  Assessment: <p>The detection of genetically linked VDPV1 isolates in three AFP cases and three contacts confirms person-to-person transmission, establishing a new cVDPV1 emergence.</p><p>&nbsp;As of 20 November 2026, 12 additional AFP cases had been reported from several locations in Deir Ez Zor Governorate since the investigation of the initial cluster began. Investigations are ongoing to determine whether these cases are associated with the current cVDPV1 emergence and, consequently, whether transmission extends beyond the initially affected communities. The current emergence is genetically distinct from the VDPV1 previously detected through environmental surveillance at the Al-Mayadin site in February 2026.</p><p>The risk of further transmission is increased by documented immunity gaps, including among children in the initial cluster, previous disruptions to health services, difficulties in accessing routine immunization in some communities, and the history of poliovirus outbreaks in
    Al-Mayadin District. Population movement, difficulties in reaching some communities, and gaps in access to safe water and sanitation may further complicate outbreak control.</p><p>At the same time, AFP surveillance indicators in Deir Ez Zor Governorate demonstrate continued case-detection capacity. The rapid activation of national and subnational coordination mechanisms, together with the implementation of investigation, vaccination, surveillance, risk communication, and water, sanitation and hygiene measures, provides opportunities to detect and interrupt further transmission.</p><p>On 5 May 2014, the WHO Director-General declared the international spread of poliovirus a Public Health Emergency of International Concern (PHEIC). Countries affected by poliovirus transmission may be subject to Temporary Recommendations issued under the IHR (2005), according to their classification and the applicable recommendations.</p>
  Overview: <p>In October 2026, a cluster of four AFP cases was identified in three closely linked communities in Al-Mayadin District, Deir Ez Zor Governorate. The affected children were aged between six and 13 months and developed paralysis between 9 and 18 October 2026. Investigation of the cluster began on 12 October 2026 and included investigation of cases and contacts, specimen collection, active case finding and assessment of vaccination gaps. None of the four AFP cases had travelled during the preceding 60 days. Three of the AFP cases had received no oral polio vaccine (OPV) doses, and two had received neither OPV nor inactivated poliovirus vaccine (IPV).</p><p>Between 7 and 13 November 2026, the Regional Reference Polio Laboratory in Cairo confirmed VDPV1 in specimens from three of the AFP cases. The isolates showed 13 and 15 nucleotide differences from the Sabin 1 reference strain. VDPV1 was also detected in specimens collected from three contacts. Although VDPV1 was detected in
    three contacts, these individuals did not present with AFP and are therefore not included in the confirmed paralytic polio case count. Poliovirus infection does not always result in paralysis; however, detection of genetically linked virus among contacts provides important evidence of person-to-person transmission.</p><p>Further laboratory analysis by the Global Polio Laboratory Network confirmed that the VDPV1 isolates from the confirmed cases and contacts are genetically linked, providing evidence of person-to-person transmission and confirming a new cVDPV1 emergence.</p><p>VDPV1 had previously been detected through environmental surveillance at the Al-Mayadin site in February 2026. The isolate showed 10 nucleotide differences from the Sabin 1 reference strain. Genetic analysis confirmed that the current cVDPV1 emergence is not genetically linked to the VDPV1 detected through environmental surveillance in February 2026. The detection of genetically distinct VDPV1 emergences in the
    same area highlights documented gaps in population immunity.</p><p>Between 9 and 20 November 2026, twelve additional AFP cases were reported from several locations in Deir Ez Zor Governorate. The cases were reported among young children with varying vaccination histories. Epidemiological investigations and specimen collection are ongoing, and information on one of the cases reported on 20 November remains under verification. None of these additional AFP cases have been included in the confirmed cVDPV1 case count, at this point.</p><p>Al-Mayadin District has a history of poliovirus transmission and was affected during the 2013 wild poliovirus type 1 outbreak and the 2017 circulating vaccine-derived poliovirus type 2 outbreak. Vaccination gaps have been documented in the affected area.</p><p>As of 20 November 2026, among AFP cases aged 6&ndash;59 months investigated in Deir Ez Zor Governorate, 42.2% had received no doses of OPV, compared with 22.6% in 2025 and 14.7% in 2024. Among non-polio
    AFP cases aged 6&ndash;23 months, 50% had received no OPV doses. </p><p>AFP surveillance indicators demonstrate continued case-detection capacity in Deir Ez Zor Governorate. As of 20 November 2026, a total of 67 AFP cases had been reported. The non-polio AFP rate was 12.1 per 100 000 children under 15 years of age, and stool adequacy was 81%.</p>
