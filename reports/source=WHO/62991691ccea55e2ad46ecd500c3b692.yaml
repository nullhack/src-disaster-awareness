  Response: <p>Following activation of the Emergency Operations Centre, a central response team is coordinating multisectoral public health measures with WHO, UNICEF, local authorities, and other partners. </p><p>Measures undertaken or planned include:</p><ul><li>Investigation of reported AFP cases and contacts, including the collection and transport of stool specimens and referral of isolates for genetic characterization.</li><li>Active case finding and field investigations have been intensified in hospitals, health centres, private clinics and affected communities, alongside strengthened surveillance, to identify additional AFP cases, assess the extent and risk of transmission, and guide vaccination activities.</li><li>Reinforcement of immediate notification of AFP cases by health workers and strengthening of AFP and environmental surveillance.</li><li>Vaccination status assessment around affected households to identify immunity gaps and children missed by routine or supplementary immunization
    activities.</li><li>Implementation of a house-to-house OPV campaign on 18 October 2026 in the affected area, reaching more than 34 720 children under five years of age.</li><li>Implementation of a second rapid-response vaccination round in Dhiban subdistrict from 15 to 17 November 2026, reaching 54 382 children against a target of 49 166, with reported administrative coverage of 110.6% and the participation of 107 vaccination teams.</li><li>Finalization of microplans for a comprehensive vaccination campaign across Deir Ez Zor Governorate.</li><li>Reactivation of selected routine immunization centres and the launch of 60 high-priority routine immunization centres nationally.</li><li>Provision of dedicated transport for AFP investigations to reduce disruption to routine immunization services.</li><li>Efforts to restore access to essential health services, including routine immunization. The number of operational primary health care centres in Deir Ez Zor Governorate has increased from
    40 to 87, and plans are in place to increase this number to 124, with particular attention to communities experiencing prolonged difficulties in accessing services.</li><li>Installation of 35 UNICEF-provided solar-powered vaccine refrigerators.</li><li>Rollout of unified risk communication and community engagement messages.</li><li>An urgent water, sanitation and hygiene intervention, including the planned installation of 35 automated chlorination pumps and provision of chlorine tablets as needed.&nbsp;</li></ul>
