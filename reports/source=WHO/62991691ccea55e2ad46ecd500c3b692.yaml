  Summary: "In October 2026, a cluster of four cases of acute flaccid paralysis (AFP) was identified in Al-Mayadin District, Deir Ez Zor Governorate, Syrian Arab Republic. As of 13 November 2026, three confirmed cases of circulating vaccine-derived poliovirus type 1 (cVDPV1) have been reported. Vaccine-derived poliovirus type 1 (VDPV1) was also detected in three contacts who did not present with AFP and are therefore not included in the reported paralytic poliomyelitis case count. Between 9 and 20 November 2026, twelve additional AFP cases were reported from several locations in Deir Ez Zor Governorate. Epidemiological and laboratory investigations are ongoing.\r\nGenetic analysis confirmed that the cVDPV1 isolates detected are genetically linked, providing evidence of person-to-person transmission. The event represents a new emergence of cVDPV1. The current emergence is not genetically linked to the VDPV1 previously detected through environmental surveillance at the Al-Mayadin site in February\
    \ 2026.\r\nFollowing activation of the Emergency Operations Centre, national health authorities, with support from WHO and partners, are coordinating the outbreak response. Response measures include rapid-response vaccinations, active case finding, strengthened AFP surveillance and reinforcement of routine immunization services, risk communication, and efforts to restore access to essential health services in affected communities."
