  Title: Ebola disease caused by Bundibugyo virus - Democratic Republic of the Congo
  Epidemiology: <p>Bundibugyo virus disease (BVD) is a severe Ebola disease caused by the Bundibugyo virus, one of the <em>Orthoebolavirus </em>species. It is a zoonotic disease, with fruit bats suspected to be the natural reservoir.</p><p>Human infection is thought to occur through close contact with the blood or secretions of infected wildlife, such as bats or non-human primates, and it subsequently spreads from person-to-person through direct contact with the blood, secretions, organs, or other bodily fluids of infected individuals or contaminated surfaces and materials. Transmission is particularly amplified in health-care settings when IPC measures are inadequate and during unsafe burial practices involving direct contact with deceased individuals.</p><p>The incubation period for BVD ranges from two to 21 days, and infected individuals are not infectious until symptom onset. Early symptoms such as fever, fatigue, muscle pain, headache, and sore throat are non-specific, which complicates
    clinical diagnosis and can delay detection. These symptoms then progress to gastrointestinal symptoms, organ dysfunction, and, in some cases, haemorrhagic manifestations.</p><p>CFRs in the past two BVD outbreaks, reported in Uganda and in the Democratic Republic of the Congo in 2007 and 2012, were 30% and 50%, respectively.</p>Differentiating BVD from other endemic febrile illnesses such as malaria is challenging without laboratory confirmation using PCR or antigen- or antibody-based assays. Outbreak control relies on rapid case&nbsp;<span style="background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;">identification, isolation and care, contact tracing, safe burials and strong community engagement, as no approved vaccines or specific treatments currently exist for BVD.</span>
  Advice: '<p>Based on the currently available information, WHO advises against any restriction of travel to, or trade with, affected countries. WHO continues to closely monitor and, where necessary, verify travel and trade measures in relation to this event.</p><p>For further information on the considerations for implementing border health and international travel-related temporary recommendations, please see the relevant &nbsp;<a href="https://iris.who.int/items/b07def43-df30-41b8-83e0-deb33bcfd697">technical note issued on 26 May 2026</a>.</p><p>The <a href="https://www.who.int/news/item/22-05-2026-first-meeting-of-the-ihr-emergency-committee-regarding-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-and-uganda-2026-temporary-recommendations">Temporary Recommendations</a> issued to States Parties on 22 May 2026 underscore the importance of coordinated outbreak control, strengthened cross‑border collaboration, and sustained surveillance and preparedness
    to prevent further regional spread and ensure an effective public health response. </p><p>Rapid recognition of cases, testing and optimized supportive care can reduce mortality, and improve community perceptions and acceptance of health care within the response.</p><p>WHO has convened several technical advisory groups, including the Strategic Advisory Group of Experts on Immunization (SAGE) to assess candidate vaccines and therapeutics for BVD. Key recommendations are available in the &nbsp;<a href="https://www.who.int/news/item/28-05-2026-experts-convened-by-who-advise-on-candidate-treatments-and-vaccines-for-ebola-disease-caused-by-bundibugyo-virus">news release published on 28 May 2026.</a></p><p><strong>Regular Information products on the outbreak of BVD in the Democratic Republic of the Congo and Uganda</strong></p><p><strong>Daily update: </strong><a href="https://www.who.int/emergencies/alert-and-response">Epidemiological update on BVD outbreak in Democratic Republic of the Congo
    and Uganda</a></p><p><strong>Published every Tuesday:</strong> <a href="https://www.afro.who.int/health-topics/ebola-disease/outbreak-drc-26">Weekly External Situation Report on Ebola Bundibugyo Virus Disease Outbreak, Democratic Republic of the Congo | Uganda</a></p><p><strong>Published biweekly:</strong><a href="https://www.who.int/emergencies/disease-outbreak-news"><strong></strong>Disease Outbreak News | All Hazards Public Health Events, Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo</a><br /></p>'
  Assessment: <p>On 6 June 2026, WHO reassessed the risk of the outbreak of BVD to incorporate newly available information and align with the WHO <a href="https://www.who.int/news/item/22-05-2026-first-meeting-of-the-ihr-emergency-committee-regarding-the-epidemic-of-ebola-bundibugyo-virus-disease-in-the-democratic-republic-of-the-congo-and-uganda-2026-temporary-recommendations">Temporary Recommendations</a>. The risk for countries sharing land borders with countries with documented Bundibugyo virus detection, the Democratic Republic of the Congo and Uganda at the time of assessment, was separated from the risk for other countries in the African Region.</p><p>The risk in the Democratic Republic of the Congo was assessed as very high due to ongoing transmission and the continued expansion of the outbreak into new health zones, increasing the potential for further national and regional spread.</p><p>The risk in Uganda was assessed as high due to confirmed cross-border spread through imported
    cases and ongoing epidemiological links along the eastern Democratic Republic of the Congo&ndash;western Uganda corridor, which has historically been affected by Ebola outbreaks, including Bundibugyo virus and Sudan virus disease. </p><p>The risk for countries sharing land borders with countries reporting BDBV detection was assessed as high due to sustained population mobility linked to cross-border trade and mining activities, variation in capacities and experience of BVD response, and variable levels of readiness. </p><p>The risk for the rest of the African region and at the global level was assessed as low.</p><p>For further information, please see the <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment-ebola-disease-caused-by-bundibugyo-virus--democratic-republic-of-the-congo--uganda-and-countries-with-land-borders-adjoining-countries-with-documented-bdbv-detection-v3">WHO Rapid Risk Assessment &ndash; Ebola disease caused by Bundibugyo virus, Democratic Republic
    of the Congo, Uganda and countries with land borders adjoining countries with documented BDBV detection v3</a>.</p><p>An updated Rapid Risk Assessment is currently being developed in advance of the upcoming IHR Emergency Committee meeting regarding the epidemic of Ebola Bundibugyo virus disease scheduled for 18 August.&nbsp;</p>
  Overview: '<p>Since the previous <a href="https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613">Disease Outbreak News</a> was published on 17 July 2026, additional confirmed cases and deaths have been reported only in the Democratic Republic of the Congo. </p><p>Cumulatively, 3626 confirmed cases have been reported: 3605 in the Democratic Republic of the Congo (including two cases diagnosed in the Democratic Republic of the Congo and subsequently treated in Germany), 20 in Uganda and one in France. A total of 1589 deaths have been reported, including two in Uganda. As of 30 July, at least 651 people in the Democratic Republic of the Congo, and 18 from Uganda have recovered. </p><p>This outbreak is now the largest recorded Ebola virus disease outbreak in the country, surpassing the previous largest outbreak, which occurred from 2018 to 2020, and resulted in 3317 confirmed cases.&nbsp;</p><p><strong>Figure 1. Distribution of cumulative confirmed cases of Bundibugyo virus
    disease in the Democratic Republic of the Congo as of 30 July&nbsp;</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/geographic-distribution-of-confirmed-cases-in-democratic-republic-of-the-congo-and-uganda.jpg?sfvrsn=3cd8279e_3" height="617" style="max-width:100%;height:auto;" title="Geographic distribution of confirmed cases in Democratic Republic of the Congo and Uganda" width="944" alt="Geographic distribution of confirmed cases in Democratic Republic of the Congo and Uganda" sf-size="124278" /></p><p><strong>Democratic Republic of the Congo </strong></p><p>Since 17 July 2026 when the last Disease Outbreak News was published, an additional 1481 confirmed cases, including 759 confirmed deaths, have been reported in the Democratic Republic of the Congo. The increase is in part due to expansion of surveillance activities, enhanced laboratory testing, and diagnostic capacity. However, most of the increase
    reflects the expansion of the outbreak. </p><p>As of 30 July 2026, a total of 3605 confirmed cases, including 1587 deaths (CFR 44%), have been reported in the Democratic Republic of the Congo. To date, 651 patients have recovered.</p><p>Cases have been reported from 49 health zones (HZ) across five provinces: Ituri (28/36 HZ), North Kivu (11/34 HZ), South Kivu (1/34 HZ), Haut- U&eacute;l&eacute; (5/13 HZ) and Tshopo (4/23 HZ).<sup>[1]</sup> An additional HZ, Wanie-Rukula in Tshopo, is awaiting data harmonisation at the health province level. </p><p>Of the 49 affected health zones, the outbreak remains active in 33, with confirmed cases reported within the past seven days. During this period, 641 confirmed cases, including 282 confirmed deaths, were reported. </p><p>Ituri remains the most affected province, accounting for 88% (3176/3605) of all confirmed cases and 82.6% (1311/1587) of reported deaths nationwide. Within the province, the highest number of confirmed cases have been reported
    from Bunia (880 cases), Rwampara (627 cases), Mongbwalu (541 cases), Nizi (377 cases), Lita (131 cases), and Nyankunde (114 cases) health zones. </p><p>As of 30 July, 17 863 contacts have been identified and are under follow-up across Ituri (11 638), North Kivu (5667), Haut-U&eacute;l&eacute; (458) and 65 in Tshopo. Of these, 13 455 contacts were under active follow-up, corresponding to follow-up rates of 75.5% in Ituri, 74.6% in North Kivu, 80.6% in Haut-U&eacute;l&eacute;, and 66.2% in Tshopo. Previously identified contacts in South Kivu have completed the required 21-day follow-up period. </p><p>Infections among health workers continue, with 151 confirmed cases, including 44 deaths (CFR: 29%) and 68 recoveries. These infections highlight ongoing occupational exposure risks, persistent challenges in implementing infection prevention and control (IPC) in health-care facilities, and continued exposure risk in the community.</p><p>The outbreak is occurring in a complex humanitarian and
    conflict-affected setting, characterized by population displacement, high population mobility, and limited access to essential services, including health care, clean water, food, shelter, and protection.&nbsp; These conditions increase the risk of disease transmission, including in overcrowded sites for internally displaced persons (IDPs).</p><p>Insecurity and attacks affecting health facilities have hampered response operations in affected provinces, by restricting access for response teams, disrupting surveillance and response activities and increasing the risk of undetected transmission. These challenges underscore the importance of community-centred response efforts led by local authorities and trusted community leaders.&nbsp;</p><p><strong>Figure 2: Number of confirmed cases (n = 3605), in the Democratic Republic of the Congo, by date of reporting, as of 30 July 2026</strong> <img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/confirmed-cases-in-democratic-republic-of-the-congo4c0928bf-b355-4b92-94cd-698eea2fd76b.jpg?sfvrsn=2618479e_3"
    height="602" style="max-width:100%;height:auto;" title="Confirmed cases in Democratic Republic of the Congo" width="1047" alt="Confirmed cases in Democratic Republic of the Congo" sf-size="90746" /></p><p>* Note that the large number of reported cases on 22 July represents the completion of a data reconciliation exercise, including cases that occurred earlier in the outbreak, rather than newly recorded cases.</p><p><strong>Figure 3: Number of deaths among confirmed cases (n = 1587), in the Democratic Republic of the Congo, </strong><strong>by date of reporting,&nbsp;</strong><strong>as of 30 July 2026.&nbsp;</strong></p><p><img sf-image-responsive="true" src="https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/number-of-deaths-in-democratic-republic-of-the-congo.jpg?sfvrsn=81ef9779_3" height="618" style="max-width:100%;height:auto;" title="Number of deaths in Democratic Republic of the Congo" width="1085" alt="Number of deaths in Democratic Republic of the
    Congo" sf-size="90985" /></p><p>* Note that the large number of reported deaths on 22 July represents the completion of a data reconciliation exercise, including deaths that occurred earlier in the outbreak, rather than newly recorded deaths.</p>'
