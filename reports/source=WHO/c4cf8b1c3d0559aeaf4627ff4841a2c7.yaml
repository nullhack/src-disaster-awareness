  Summary: "The Bundibugyo virus disease (BVD) outbreak in the Democratic Republic of the Congo is intensifying, with sustained transmission and continued increases in reported cases and deaths. Initially confined to the Mongbwalu health zone in Ituri Province, over the last two months, the outbreak has expanded to five provinces (Ituri, North Kivu, South Kivu, Haut-Uélé and Tshopo), now affecting 49 health zones. \r\nThe outbreak is now the largest Ebola outbreak ever reported in the Democratic Republic of the Congo. As of 30 July 2026, a total of 3605 confirmed cases, including 1587 deaths, have been reported, corresponding to a crude case fatality ratio (CFR) of 44%. The continued increase in cases, expanding geographic spread, and persistently high mortality underscore the rapidly evolving nature of this public health emergency. During the most recent complete reporting week (epidemiological week 30), the highest weekly number of reported cases (567) and deaths (296) to date were recorded,\
    \ underscoring the exceptional pace of transmission.\r\nThe convergence of insecurity, population displacement and mobility, and cross-border movements complicate response operations and increase the risk of further geographical spread. National authorities in the Democratic Republic of the Congo, in collaboration with WHO and partners, continue to implement extensive response measures, however, a substantial scaling up of response activities is needed to get ahead of the outbreak. A regional preparedness and prioritization framework continues to guide readiness and response activities across the African Region.\r\nOn 28 July, the Ministry of Health of Uganda declared the end of the BVD outbreak in the country, following 42 days without a new confirmed locally transmitted case after the last confirmed case was discharged from care on 16 June 2026.  The most recent imported case was discharged from a treatment centre on 16 July after two negative tests results. Following international\
    \ guidance WHO will be monitoring the situation for 42 days from this date to ensure no chains of transmission have been missed. Uganda remains at risk of imported cases and re-introduction of BVD, due to ongoing transmission in neighbouring Democratic Republic of the Congo. WHO reiterates the need to maintain heightened surveillance, preparedness and control measures, particularly in view of continued population movement and the risk of cross-border transmission."
