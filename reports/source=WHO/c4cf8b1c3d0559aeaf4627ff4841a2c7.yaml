  Response: '<p>Health authorities in the Democratic Republic of the Congo, in collaboration with WHO and partners, continue to implement extensive public health measures, including implementing the continental preparedness and response plan a strategic six-month framework plan designed to guide coordinated efforts to strengthen outbreak response measures, including emergency coordination, disease surveillance, laboratory testing, infection prevention and control, clinical care, community engagement, research, logistics and support for essential health services, engaging donors and mobilizing additional resources to address critical funding gaps and sustain response operations across affected and at-risk areas. A substantial scale-up will be needed in all pillars to get ahead of the outbreak. </p><p>For further information about public health response actions by the respective Ministry of Health, WHO and partners, please refer to the latest situation reports published by the WHO Regional
    Office for Africa: <a href="https://www.afro.who.int/health-topics/ebola-disease/outbreak-drc-26">Ebola Bundibugyo Virus Disease Outbreak Democratic Republic of the Congo | Uganda Weekly External Situation Report | WHO | Regional Office for Africa&nbsp;</a></p>'
