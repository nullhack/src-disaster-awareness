  Summary: "Between 16 October and 4 November 2026, the United States of America, through its International Health Regulations (IHR) National Focal Point, notified WHO of three laboratory-confirmed human infections with influenza A(H5) virus in Washington State. These included one fatal case, the first reported death following exposure to infected dairy cattle or a related contaminated environment. All three cases were adults who worked on dairy cattle farms in Yakima County, Washington State, where the highly pathogenic (in animals) avian influenza (HPAI) A(H5N1) virus had recently been detected in dairy cattle. \r\nInvestigations and monitoring of exposed people and close contacts are ongoing. Based on information available to date, there is no evidence of human-to-human transmission.\r\n\r\nIn accordance with the IHR (2005), any human infection caused by a new influenza A virus subtype is considered a potentially significant public health event and is subject to mandatory notification\
    \ to WHO. Based on the information currently available on this and previous cases, WHO assesses the risk to the general population posed by A(H5N1) viruses as low. For individuals with occupational exposure to these viruses, the risk of infection is considered low to moderate. The situation may change as more information becomes available. \r\nWHO continues to closely monitor these viruses and the global epidemiological situation."
