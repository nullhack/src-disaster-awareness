  Title: Influenza A(H5N1) - United States of America
  Epidemiology: <p>Animal influenza viruses typically circulate within animal populations, but some have the potential to infect humans. Human infections are predominantly acquired through direct contact with infected animals or exposure to contaminated environments. Based on their original host species, influenza A viruses may be categorized as avian influenza viruses, swine influenza viruses, and other animal-origin influenza viruses.</p><p>Human infection with avian influenza viruses may result in a spectrum of illness, ranging from mild conjunctivitis and/or upper respiratory tract symptoms to severe, life-threatening conditions. Clinical manifestations may include conjunctivitis, respiratory or gastrointestinal symptoms, and less commonly neurological complications such as encephalitis and encephalopathy. In some cases, asymptomatic infections with the virus have been reported in individuals with known exposure to infected animals and environments.</p><p>A definitive diagnosis of human
    avian influenza infection requires laboratory confirmation. WHO regularly updates its technical guidance on the detection of zoonotic influenza, utilizing molecular diagnostic methods such as RT-PCR. Clinical evidence indicates that certain antiviral agents, particularly neuraminidase inhibitors (e.g., oseltamivir, zanamivir), have been shown to shorten the duration of viral replication and improve patient outcomes in some cases. When indicated, antiviral treatment should be initiated as soon as possible, ideally within 48 hours of symptom onset.</p><p>Highly pathogenic avian influenza A(H5) viruses belonging to H5 haemagglutinin clade 2.3.4.4b are widely circulating in wild birds and poultry and have also been detected in mammals, including dairy cattle in North America.</p>
  Advice: <p>This event does not change current WHO recommendations on public health measures and <a href="https://www.who.int/teams/global-influenza-programme" target="_blank">surveillance for influenza</a>.</p><p>Given the continuing circulation of avian influenza viruses in poultry, wild birds and some wild and domestic mammals, people should avoid unprotected contact with sick or dead animals and with environments potentially contaminated by infected animals. People who are occupationally exposed to potentially infected animals or contaminated environments, including poultry and farm workers, should use appropriate personal protective equipment (PPE) and follow recommended infection prevention and occupational health measures.</p><p>Given the detection of influenza A(H5N1) viruses in dairy cattle, consumption of raw or unpasteurized milk and raw milk products should be avoided. Pasteurized milk and milk products can be consumed safely. Where pasteurized milk is not available, heating
    raw milk until it boils makes it safer for consumption. Eggs, poultry meat and other poultry products should be properly cooked and handled during food preparation.</p><p>When humans have been exposed to an outbreak of influenza A virus in poultry, wild birds or other animals, or when a human infection is identified, enhanced surveillance of potentially exposed populations should be considered. This may include enhanced surveillance through influenza-like illness (ILI) and severe acute respiratory infection (SARI) systems, active case finding in healthcare facilities, and surveillance among groups at higher occupational risk of exposure.</p><p>When a human infection with a novel influenza A virus with pandemic potential is suspected or confirmed, early clinical management and a thorough epidemiological investigation should be undertaken, including assessment of animal exposure and travel history, identification and monitoring of contacts, and investigation of unusual events that could
    indicate person-to-person transmission. Clinical specimens from confirmed or suspected cases should undergo further virological characterization as appropriate. Where relevant, samples should also be collected from animals, the environment or food suspected to be the source of infection.</p><p>Due to the constantly evolving nature of influenza viruses, WHO continues to emphasize the importance of global surveillance to detect and monitor virological, genomic, epidemiological and clinical changes associated with emerging or circulating influenza viruses that may affect human health. Timely sharing and characterization of viruses remain important for risk assessment. Collaboration between human, animal and environmental health sectors is essential.</p><p>WHO advises travelers to countries experiencing outbreaks of animal influenza to avoid farms, contact with animals in live animal markets, areas where animals may be slaughtered, and surfaces potentially contaminated with animal excreta.
    Travelers should practice frequent hand hygiene with soap and water and follow good food safety and hygiene practices.</p><p>All laboratory-confirmed human infections caused by a new influenza A virus subtype are notifiable under the International Health Regulations (2005). States Parties are required to notify WHO immediately of any laboratory-confirmed case of recent human infection caused by an influenza A virus with pandemic potential. Evidence of illness is not required for notification. WHO has updated the influenza A(H5) confirmed case definition on the <a href="https://www.who.int/teams/global-influenza-programme/avian-influenza/case-definitions" target="_blank">WHO website</a>.</p><p>Currently, there are no readily available vaccines against influenza A(H5) virus for humans. Candidate vaccine viruses for pandemic preparedness have been selected against several A(H5) clades. Based on currently available data, existing seasonal influenza vaccines are unlikely to provide protection
    against avian influenza A(H5) viruses. Continued monitoring of the epidemiological and virological situation and serological investigations remain important for assessing risk and adjusting risk management measures as needed.</p><p>WHO does not advise special screening at points of entry in relation to this event, nor does it currently recommend the application of any travel or trade restrictions.&nbsp;</p><p>&nbsp;</p>
  Assessment: <p>Human infections with avian influenza A(H5) viruses are unusual because these viruses primarily circulate in animals. However, sporadic human infections can occur following exposure to infected animals or contaminated environments. </p><p>The three cases reported from Washington State were all occupationally exposed to dairy cattle in Yakima County, where HPAI A(H5N1) virus had been detected in dairy herds. Genetic sequencing identified viruses belonging to H5 haemagglutinin clade 2.3.4.4b, genotype B3.13, which were highly similar to viruses detected in dairy cattle in Washington State. These epidemiological and virological findings support animal-to-human transmission associated with occupational exposure.</p><p>One of the three cases developed severe illness and died, while the other two experienced relatively mild illness and did not require hospitalization. Investigation and monitoring of contacts are ongoing. Based on currently available information, there is no evidence
    of human-to-human transmission associated with these cases.</p><p>To date, human-to-human transmission of influenza A(H5) viruses has not been identified in the United States of America. Globally, while limited human-to-human transmission of A(H5) viruses has been reported in a small number of events, sustained human-to-human transmission has not been detected so far. As influenza viruses continue to evolve, WHO will continue to monitor the situation and review the risk assessment as new information becomes available.</p><p>Additional sporadic human infections associated with exposure to infected animals or contaminated environments can be expected while the virus continues to circulate in animal populations. Continued epidemiological and virological surveillance, characterization of viruses detected in humans and animals, investigation of exposed persons and timely sharing of viruses and sequence data remain important for assessing changes in risk.</p><p>&nbsp;</p>
  Overview: <p>On 16 October 2026, WHO was notified by the United States of America's International Health Regulations' National Focal Point of a laboratory-confirmed human infection with influenza A(H5) virus in Washington State. On 4 November 2026, two additional laboratory-confirmed human infections in the same state, including one fatal case, were notified to WHO.</p><p>All three cases were adults aged 18 years or older who worked in Yakima County, Washington State, a major agricultural and dairy-producing area, where HPAI A(H5N1) virus had recently been detected in dairy cattle. It is not known if the cases worked on the same farm. </p><p>The first case developed symptoms on 5 October 2026, including eye irritation, runny nose, muscle aches and headache, and sought medical care on 12 October. The case was not hospitalized and was offered treatment with oseltamivir. Eye (conjunctival) and nose and throat (nasopharyngeal) specimens were collected on 12 October and tested at the Washington
    State Public Health Laboratory using the United States Centers for Disease Control and Prevention (CDC) influenza A(H5) assay on 14 October. The conjunctival specimen tested positive for influenza A(H5) virus. Additional testing conducted by CDC determined this was an influenza A(H5N1) virus.</p><p>The second case, who had underlying medical conditions, developed respiratory symptoms during epidemiological week 42, ending on 24 October 2026. The case presented to an emergency department the following week, was hospitalized with severe illness and died on 1 November. A respiratory specimen collected at the healthcare facility tested positive for influenza A virus and yielded a presumptive positive result for influenza A(H5) at the University of Washington. The Washington State Public Health Laboratory subsequently confirmed influenza A(H5) virus infection using the CDC influenza A(H5) assay. Further testing at the University of Washington identified the virus as influenza A(H5N1).</p><p>The
    third case developed conjunctivitis and sought medical care but did not require hospitalization. During the week ending 31 October 2026, specimens collected from the case tested positive for influenza A(H5) virus at the Washington State Public Health Laboratory using the CDC influenza A(H5) assay. A specimen was subsequently sent to CDC for additional testing.</p><p>Sequencing of the viruses from all three cases further confirmed the influenza A(H5N1) virus subtype. The sequences were highly similar to those of viruses detected in dairy cattle in Washington State.</p><p>On 4 November 2026, the United States Department of Agriculture (USDA) reported that whole-genome sequencing of influenza A(H5N1) viruses detected in the first two affected dairy herds in Washington State identified genotype B3.13. According to the USDA, genetic analysis indicated that the detections were consistent with introduction of the virus from Idaho State, likely through cattle movement.</p><p>Public health investigations,
    surveillance and monitoring of people exposed to infected animals or contaminated environments are ongoing. Close contacts of confirmed cases are also being monitored. Additional information on the number and type of contacts being followed was not available at the time of publication.</p><p>The fatal case is the first death reported globally following exposure to infected dairy cattle. As of 20 November 2026, a total of 75 human cases of influenza A(H5) virus infection, including the three cases described in this report, had been reported in the United States of America since 2024.</p>
