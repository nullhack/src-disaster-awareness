  Response: <p>Federal, state and local public health authorities have implemented response measures, including:</p><ul><li>Epidemiological investigation of the confirmed human cases and their animal exposures.</li><li>Monitoring close contacts of the confirmed cases for signs and symptoms compatible with influenza.</li><li>Monitoring of people exposed to infected dairy cattle or contaminated environments.</li><li>Testing of symptomatic exposed persons for influenza, including influenza A(H5).</li><li>Enhanced surveillance to detect human infections with novel influenza A viruses.</li><li>Provision of information to potentially exposed workers on symptoms, testing and measures to reduce exposure.</li><li>Promotion and provision of appropriate personal protective equipment (PPE) for people exposed to infected animals or contaminated environments.</li><li>Continued virological characterization and sequencing of viruses detected in human and animal cases.</li><li>Coordination between public
    health and animal health authorities as part of the investigation.</li></ul><p>US-CDC recommends monitoring people exposed to birds or other animals suspected or confirmed to be infected with avian influenza A viruses for signs and symptoms for up to 10 days after their last exposure. People who develop respiratory symptoms and/or conjunctivitis following such exposure should be tested for influenza.</p><p>WHO guidance similarly recommends identification and monitoring of at-risk groups, enhanced surveillance among occupationally exposed populations, appropriate clinical management and measures to reduce exposure to infected animals and contaminated environments.&nbsp;</p>
