    recommendations on country vaccination requirements and recommendations for international travellers - WHO country list for yellow fever vaccination requirements and recommendations</a></li><li>International Coordinating Group on Vaccine Provision: yellow fever - <a href="https://www.who.int/groups/icg/yellow-fever" target="_blank">ICG on Vaccine Provision: Yellow fever</a></li></ul><p><strong>Citable reference:</strong> World Health Organization (6 November 2026). Disease Outbreak News; Yellow fever in WHO African Region. Available at:&nbsp; <a href="https://www/who.int/emergencies/disease-outbreak.news.item/2026-DON624">https://www/who.int/emergencies/disease-outbreak.news.item/2026-DON624 </a>&nbsp;&nbsp; &nbsp;&nbsp;</p>'
  Summary: "Yellow fever transmission continues in the WHO African Region, with recent outbreak activity concentrated in parts of West Africa. Between 1 January and 12 October 2026, 67 confirmed cases, including 18 deaths, were recorded in nine countries in the Region: Burkina Faso, Cameroon, the Central African Republic, Côte d’Ivoire, Ghana, Guinea, Liberia, Nigeria and Togo. The most recent outbreak activity has been concentrated in Burkina Faso, Côte d’Ivoire, Ghana and Liberia, including in areas close to international borders. \r\n\r\nOccupational and environmental exposures, including work in or near forested areas, mining activities, and other outdoor occupations, are important risk factors for yellow fever infection. Frequent cross-border population movement, the presence of competent mosquito vectors, and uneven vaccination coverage increase the risk of further transmission and geographic spread.\r\n\r\nCountries in the Region, supported by WHO and partners, are implementing response\
    \ activities including enhanced surveillance and case investigation, laboratory testing, active case finding, risk communication and community engagement, and vaccination activities in affected and at-risk areas. \r\n\r\nOn 27 October 2026, WHO assessed the overall public health risk associated with the current yellow fever situation as moderate at the regional level. The global risk remains low."
