  Response: <p>National authorities, WHO and partners are responding to yellow fever activity across affected and at-risk countries in the African Region. Response activities include enhanced surveillance and case investigation, laboratory testing and specimen referral, active case finding, risk communication and community engagement, and the planning or implementation of vaccination activities.</p><p>WHO is:</p><ul><li>closely monitoring yellow fever epidemiology, transmission patterns and risk trends and supporting strengthened surveillance, case investigation, laboratory diagnosis and specimen referral;</li><li>supporting affected and at-risk Member States to assess population immunity and plan and implement appropriate preventive and reactive vaccination activities;</li><li>providing technical support for clinical case management, infection prevention and control and other key outbreak-response capacities;</li><li>supporting risk communication and community engagement, including community-based
    surveillance where appropriate;</li><li>supporting cross-border preparedness, information sharing and coordination among affected and at-risk countries and partners;</li><li>supporting operational readiness, including access to vaccines and other essential commodities required for preparedness and response; and</li><li>continuing to work with partners to strengthen implementation of the Eliminate Yellow Fever Epidemics (EYE) Strategy and support coordinated preparedness and response activities.</li></ul>
