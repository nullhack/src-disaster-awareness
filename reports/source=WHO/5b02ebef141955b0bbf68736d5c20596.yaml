  Title: Yellow fever - WHO African Region
  Epidemiology: <p>Yellow fever is an acute viral haemorrhagic disease transmitted by infected mosquitoes. In the African Region, yellow fever circulates between mosquitoes and non-human primates in forested areas and can also spread to and between humans through infected mosquitoes in urban environments. The incubation period is generally three to six days.</p><p>Infection may be asymptomatic or initially present with fever, headache, body aches, nausea, vomiting and weakness. Approximately 15% of infected people develop severe disease, which may include recurrent high fever, jaundice, bleeding, shock and organ failure. Approximately half of patients who enter this severe phase die within seven to 10 days.</p><p>Diagnosis can be challenging because early symptoms are non-specific and may resemble malaria, leptospirosis, viral hepatitis, dengue and other haemorrhagic fevers. Laboratory confirmation relies on molecular testing during the early stage of infection and serological testing, including
    enzyme-linked immunosorbent assay (ELISA) or PRNT, during later stages.</p><p>There is no specific antiviral treatment routinely recommended for yellow fever and clinical management is primarily supportive. Vaccination is the most effective preventive measure, with a single dose providing lifelong protection.</p>
  Advice: <p>Vaccination is the most effective measure for preventing yellow fever. A single dose of yellow fever vaccine provides lifelong protection. Countries at risk should maintain high population immunity through routine immunization and appropriate preventive and outbreak-response vaccination activities, guided by epidemiological risk and identified immunity gaps.<br /></p> <p><strong>Surveillance</strong><strong></strong></p><p>WHO encourages Member States with areas at risk for yellow fever to maintain strong epidemiological surveillance to enable early detection and timely response. Surveillance should include systematic investigation and laboratory testing of suspected cases, active case finding in affected and neighbouring areas, and assessment of probable sites of infection and vaccination status. Cross-border coordination and timely information sharing are particularly important where cases occur close to international borders.<br /></p> <p><strong>Laboratory diagnosis</strong><strong></strong></p><p>Rapid
    collection and referral of appropriate specimens and timely laboratory confirmation are important for directing public health action. Molecular methods are particularly useful during the early phase of infection, while serological tests can support diagnosis later in the course of illness. Serological findings should be interpreted in the context of previous yellow fever vaccination and possible cross-reactivity with other flaviviruses.<br /></p> <p><strong>Vaccination</strong><strong></strong></p><p>WHO recommends yellow fever vaccination as the principal means of preventing infection. Vaccination activities should prioritize populations at risk and areas with identified immunity gaps. Preventive and reactive campaigns should be guided by updated epidemiological and risk assessments, with particular attention to populations living in or travelling to affected and high-risk areas.<br /></p> <p><strong>Vector control and risk communication</strong><strong></strong></p><p>Integrated mosquito
    surveillance and control, reduction of mosquito breeding sites and personal measures to prevent mosquito bites complement vaccination. Risk communication and community engagement should promote awareness of yellow fever symptoms, vaccination and timely care-seeking among populations at risk.<br /></p> <p><strong>International travel and trade</strong><strong></strong></p><p>Countries affected by yellow fever outbreaks should reinforce implementation of the <em>International Health Regulations (IHR 2005)</em> at points of entry and along major land-border crossings to mitigate the risk of international spread and facilitate coordinated cross-border response activities.</p><p>All international travellers aged nine months and older travelling to areas at risk of yellow fever transmission, as defined by WHO, are advised to be vaccinated. Under the International Health Regulations (2005), countries may require proof of yellow fever vaccination from incoming and/or outgoing travellers. One
    documented dose of a WHO-approved yellow fever vaccine confers lifelong protection and is accepted as valid for the purposes of the International Certificate of Vaccination or Prophylaxis.</p><p>Based on the currently available information, WHO advises against any restriction of travel to, or trade with, States Parties experiencing / responding to the public health event.</p>
  Assessment: <p>On 27 October 2026, <a href="https://www.who.int/publications/m/item/who-rapid-risk-assessment--yellow-fever--who-african-region-v.1">WHO assessed the overall risk associated with the current yellow fever</a> situation as moderate in the WHO African Region, due to the likelihood of continued transmission, the potential for geographical and cross-border spread, existing immunity gaps and operational constraints affecting outbreak control. The global risk remains low.<br /></p> <p>Continued transmission and additional human cases in the African Region are considered likely. &nbsp;Several affected districts have previously identified immunity gaps, including areas where preventive vaccination has not been implemented or where population immunity remains insufficient despite previous vaccination activities. Unvaccinated populations are at highest risk, particularly rural and forest-edge communities, mobile and cross-border populations and people who work in forested areas, agriculture
    or mining.<br /></p> <p>The occurrence of yellow fever activity in areas close to international borders increases the potential for further geographical and cross-border spread. Frequent cross-border travel and movement linked to trade, farming, livestock and mining could contribute to spread between affected and neighbouring countries. Introduction of the virus into densely populated urban or peri-urban areas where the <em>Aedes aegypti</em> mosquito is established and population immunity is low could result in larger outbreaks and place additional pressure on response capacities.<br /></p> <p>The Region has important capacities for yellow fever prevention and response, including established surveillance systems, a regional laboratory network, routine and reactive vaccination mechanisms, outbreak-response experience, access to the international emergency vaccine stockpile and established response and cross-border coordination mechanisms. However, persistent immunity gaps, surveillance
    and laboratory challenges, delays in specimen referral and confirmation, insecurity, access constraints, limited resources and competing public health emergencies can affect timely detection, investigation and control.</p>
  Overview: "<p>Yellow fever transmission continued across the WHO African Region during 2026, with recent outbreak activity concentrated in parts of West Africa, including areas close to international borders.<br /></p><p>Between 1 January and 12 October 2026, 67 confirmed cases, including 18 deaths, were recorded in nine countries. The most recent outbreak activity was concentrated in Burkina Faso, C&ocirc;te d&rsquo;Ivoire, Ghana and Liberia.<br /></p><p>In Burkina Faso, 15 confirmed cases, including three deaths, had been reported as of the week ending 23 August 2026, corresponding to a case fatality ratio of 20%.<br /></p><p>In C&ocirc;te d&rsquo;Ivoire, 30 confirmed cases, including 10 deaths, had been reported as of 23 September 2026, corresponding to a case fatality ratio of 33%. Seven cases were confirmed by plaque reduction neutralization testing (PRNT) and 23 by polymerase chain reaction (PCR). Nine districts across seven regions were affected, with Bounkani Region accounting\
    \ for 18 of the 30 confirmed cases.<br /></p><p>In Ghana, four cases, confirmed by PCR, including three deaths had been reported as of 2 September 2026.<br /></p><p>In Liberia, one laboratory-confirmed case had been reported as of 23 September 2026.<br /></p><p>Confirmed cases were also reported in Cameroon (nine cases, including one death), Nigeria (four cases, including one death), the Central African Republic (two cases), Guinea (one case) and Togo (one case). No deaths among confirmed cases were reported from the Central African Republic, Guinea or Togo.<br /></p><p>Country-specific figures reflect the latest information available to WHO as of 12 October 2026; reporting cut-off dates differ by country.</p><p>The detection of yellow fever in these countries indicates increased transmission across parts of West Africa. Although epidemiological links between the events have not been established, several affected areas are close to international borders and have substantial population\
    \ mobility and occupational and environmental exposure in or near forested areas. Together with heterogeneous population immunity and favourable ecological conditions for mosquito vectors, these factors sustain the risk of further spread within affected countries and across national borders.</p><p><strong>Confirmed\r\nyellow fever cases and recently affected areas in the WHO African Region, 2026&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</strong><strong style=\"background-color:transparent;font-family:'Noto Sans', Arial, Helvetica, sans-serif;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;\"></strong><span style=\"background-color:transparent;text-align:inherit;text-transform:inherit;word-spacing:normal;caret-color:auto;white-space:inherit;\">Data\r\nas of 12 October 2026</span></p><p><img sf-image-responsive=\"true\" src=\"https://cdn.who.int/media/images/default-source/products/disease-outbreak-news/afro-yellow-fever-cases-2026-don.png?sfvrsn=5806aa2f_2\"\
