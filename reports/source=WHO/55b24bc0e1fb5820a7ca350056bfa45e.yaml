  Summary: "On 29 October 2026, the National International Health Regulations (IHR) Focal Point of the State of Qatar notified the World Health Organization (WHO) of two laboratory-confirmed cases of Middle East respiratory syndrome (MERS). The cases were confirmed on 5 and 25 August 2026 and are the first MERS cases reported from Qatar since 2022. \r\n\r\nMERS is a viral zoonotic infection, principally transmitted to humans through direct or indirect contact with infected dromedary camels. Both patients were men aged over 50 years with underlying medical conditions and occupational exposure to dromedary camels. Both were hospitalized and subsequently discharged in a stable condition. \r\n\r\nA total of 99 contacts from both cases were identified, tested, and monitored for 14 days following their last exposure. All contacts tested negative for MERS-CoV, and no secondary cases were identified. The two cases reported exposure to dromedary camels at geographically separate farms, with no epidemiological\
    \ link identified between them. The cases appear to represent sporadic infections associated with zoonotic transmission from dromedary camels rather than human-to-human transmission."
