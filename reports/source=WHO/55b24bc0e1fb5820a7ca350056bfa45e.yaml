  Response: <div><p paraid="355344649" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{23}">The national authorities undertook clinical management, laboratory testing, case investigation and contact tracing. All 99 identified contacts, including close contacts and health and care workers, were tested and monitored for 14 days following their last exposure. All tested negative for MERS-CoV, and no secondary infections were identified.&nbsp;</p></div><div><p paraid="571862602" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{29}">The national authorities also implemented infection prevention and control measures, enhanced vigilance within health care facilities and circulated a national advisory to health care providers. Animal health investigations and targeted risk communication activities for populations with frequent exposure to dromedary camels are ongoing.&nbsp;</p></div>
