  Title: Middle East respiratory syndrome (MERS) – Qatar
  Epidemiology: <p>Middle East respiratory syndrome (MERS) is a respiratory illness caused by a coronavirus (MERS-CoV). The case fatality ratio (CFR) among confirmed cases is around 37%. The CFR is calculated based solely on laboratory-confirmed infections and may overestimate the actual mortality rate since milder cases often go undetected or unreported.</p><p>Humans can contract MERS-CoV through multiple transmission pathways; the primary route being through direct or indirect contact with dromedary camels, which serve as the virus&rsquo;s natural host and primary zoonotic reservoir. Additionally, human-to-human transmission can occur via infectious respiratory particles primarily in close-contact situations and can also occur through direct or indirect contact; this is especially prominent in health-care settings. Human-to-human transmission of the virus has occurred in health care facilities in several countries, including transmission from patients to health care providers and transmission
    between patients before MERS-CoV was diagnosed. It is not always possible to identify patients with MERS‐CoV early or without testing because symptoms and other clinical features may be non‐specific. Outside these environments, there has been limited documented human-to-human transmission.&nbsp;</p><p>MERS can present with no symptoms (asymptomatic), mild symptoms (including mild respiratory issues), or severe illness leading to acute respiratory distress and death. Common symptoms include fever, cough, and breathing difficulties, with pneumonia frequently observed, though not always present. Some patients also experience gastrointestinal symptoms such as diarrhoea. Severe cases may require intensive care, including mechanical ventilation. Those at higher risk of severe outcomes include older adults, individuals with weakened immune systems, and those with chronic conditions like diabetes, kidney disease, cancer, or lung disorders.</p>
  Advice: <div><p paraid="55346242" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{114}">The importance of maintaining strong surveillance for acute respiratory infections in all Member States is re-emphasised. Where warranted by the epidemiological or clinical context, MERS-CoV should be included in diagnostic testing algorithms. This includes patients with compatible acute respiratory illness and recent exposure to dromedary camels, their products or secretions, or recent health care visits in or travel to countries where MERS-CoV is endemic. Testing should also be considered for patients with unexplained severe acute respiratory infection, particularly when tests for other respiratory pathogens are negative, and when unusual patterns or clusters of severe respiratory illness, including health care-associated clusters, are identified.&nbsp;</p></div><div><p paraid="1121132341" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{159}">Human-to-human transmission of MERS-CoV in health care
    settings has been associated with delays in recognizing early symptoms, triaging suspected cases and implementing infection prevention and control measures. Early identification, appropriate case management, prompt isolation, contact tracing, infection prevention and control measures, and public health awareness can reduce the risk of human-to-human transmission.&nbsp;</p></div><div><p paraid="2064624786" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{173}">Health and care workers should apply standard precautions consistently for all patients at every interaction in health care settings. Transmission-based precautions should be implemented when caring for patients with symptoms of acute respiratory infection who are suspected of having a viral infection, including suspected, probable or confirmed MERS-CoV infection. Contact and droplet precautions should be applied, and airborne precautions should be implemented when performing aerosol-generating procedures.&nbsp;</p></div><div><p
    paraid="1891913428" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{183}">MERS-CoV can cause severe disease in people with underlying chronic medical conditions, such as diabetes, renal failure and chronic lung disease, and in immunocompromised people. People with underlying medical conditions or those who are immunocompromised should avoid close contact with dromedary camels or their products, particularly when visiting farms, markets, barns or other places where the virus may be circulating among dromedary camels.&nbsp;</p></div><div><p paraid="1173576847" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{195}">Anyone interacting with animals or animal products should follow general hygiene measures, including regular handwashing before and after touching animals and avoiding contact with sick animals. Appropriate food hygiene should be observed when handling or consuming camel products. People should avoid drinking raw camel milk or camel urine and should not consume meat that has not
    been properly cooked.&nbsp;</p></div><div><p paraid="511975744" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{201}">WHO emphasizes the importance of collaboration between human and animal health sectors through a One Health approach. This includes coordinated epidemiological investigations, animal health and environmental assessments, enhanced surveillance in camel-related settings, and timely sharing of important epidemiological, genomic, cross-border or secondary-transmission findings.&nbsp;</p></div><div><p paraid="155062208" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{207}">Under the IHR (2005), States Parties are required to assess public health events using the decision instrument in Annex 2 and to notify WHO, within 24 hours of assessment of events that meet the criteria for notification.&nbsp;</p></div><div><p paraid="1936107266" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{221}">Based on the currently available information, WHO advises against any restriction of travel
    to, or trade with, States Parties experiencing / responding to the public health event.&nbsp;</p></div>
  Assessment: <div><p paraid="669740907" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{51}">MERS is a viral respiratory infection caused by a coronavirus. Humans can become infected through direct or indirect contact with infected dromedary camels, which are the natural host and zoonotic source of MERS-CoV infection. Human-to-human transmission can occur, particularly in health care settings and among close contacts, but sustained transmission between people has not been documented. The disease can be severe, particularly among people with underlying chronic medical conditions and immunocompromised people.&nbsp;&nbsp;</p></div><div><p paraid="2076578266" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{67}">These are the first MERS cases reported from Qatar since 2022. Both cases had occupational exposure to dromedary camels, and one reported tending to sick camels and consuming raw camel milk during the 14 days before symptom onset. The cases were exposed at geographically separate farms,
    with no epidemiological link identified between them. All 99 identified contacts tested negative for MERS-CoV, and no secondary cases were identified. The available information therefore suggests that these were sporadic infections associated with zoonotic transmission rather than human-to-human transmission.&nbsp;</p></div><div><p paraid="59389424" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{81}">The occurrence of two apparently unlinked cases highlights the continued risk of zoonotic spillover among people with frequent or occupational exposure to dromedary camels, particularly those with underlying medical conditions.&nbsp;</p></div><div><p paraid="1163395320" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{87}">As per WHO&rsquo;s rapid risk assessment of 29 January 2026, the overall risk associated with MERS-CoV remains moderate at both the regional and global levels. This assessment reflects continued sporadic zoonotic spillover into the human population and the potential for
    subsequent health care-associated transmission and international importation into countries where the disease is not endemic.&nbsp;</p></div><div><p paraid="478830700" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{102}">Based on the information reported by the State of Qatar, there is no evidence of sustained human-to-human transmission associated with these cases. Continued surveillance and animal health investigations remain important to detect and assess any potential further transmission.</p></div>
  Overview: <div><p paraid="1930014965" paraeid="{2dec658c-3798-478a-90c4-303b1f9f4b02}{114}">On 29 October 2026, the National IHR Focal Point of Qatar notified WHO of two laboratory-confirmed cases of Middle East respiratory syndrome (MERS). The cases were confirmed on 5 and 25 August 2026. These are the first MERS-CoV cases reported by the State of Qatar since 2022.&nbsp;</p></div><div><p paraid="1795444383" paraeid="{2dec658c-3798-478a-90c4-303b1f9f4b02}{124}">The first case was a man aged over 50 years who worked with dromedary camels and had chronic medical conditions. He developed symptoms on 22 July 2026 and was admitted to hospital on 25 July. Real-time reverse transcription-polymerase chain reaction (RT-PCR) on an upper-respiratory tract specimen initially tested negative for MERS-CoV. A subsequent lower-respiratory tract specimen tested positive by RT-PCR, and infection was laboratory-confirmed on 5 August. He reported longstanding occupational exposure to dromedary camels, including
    during the 14 days before symptom onset. He did not report consuming raw camel milk or any recent travel. He recovered and was discharged in a stable condition after two consecutive negative PCR test results.&nbsp;</p></div><div><p paraid="1407767602" paraeid="{2dec658c-3798-478a-90c4-303b1f9f4b02}{182}">A total of 73 contacts were identified for this case, comprising 11 close contacts and 62 health and care workers. All contacts were tested and monitored for 14 days following their last exposure. All tested negative for MERS-CoV, and no secondary cases were identified.&nbsp;</p></div><div><p paraid="1287746572" paraeid="{2dec658c-3798-478a-90c4-303b1f9f4b02}{198}">The second case was a man aged over 50 years who was involved in camel breeding and rearing and had underlying chronic medical conditions. He developed symptoms on 23 August 2026. Two nasopharyngeal specimens tested positive for MERS-CoV by RT-PCR on 25 August. He reported sustained occupational exposure to dromedary camels,
    including directly caring for recently ill young camels during the 14 days preceding symptom onset. He also reported consuming raw camel milk during this period but had no recent travel history.&nbsp;</p></div><div><p paraid="294027505" paraeid="{2dec658c-3798-478a-90c4-303b1f9f4b02}{216}">He developed severe MERS-CoV pneumonia complicated by acute hypoxemic respiratory failure and required high-flow nasal oxygen and non-invasive ventilatory support. He subsequently recovered and was discharged in a stable condition after two consecutive negative PCR test results.&nbsp;</p></div><div><p paraid="806789698" paraeid="{2dec658c-3798-478a-90c4-303b1f9f4b02}{240}">A total of 26 contacts were identified for this case, comprising four close contacts and 22 health and care workers. All contacts were tested and monitored for 14 days following their last exposure and tested negative for MERS-CoV. One high-risk contact who was a health and care worker developed respiratory symptoms but tested negative
    for MERS-CoV on two specimens. No secondary cases were identified.&nbsp;</p></div><div><p paraid="667603675" paraeid="{a1f77f90-0301-4845-9cb4-e29389845e56}{3}">The two cases reported occupational exposure at geographically separate camel farms, with no epidemiological link identified between the farms or the cases. The precise sources of infection remain undetermined. However, their sustained occupational exposure to dromedary camels, including direct contact with recently ill camels in one case and the consumption of raw camel milk by the same case, suggest probable zoonotic acquisition.&nbsp;</p></div><p>&nbsp;</p>
